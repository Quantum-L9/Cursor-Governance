control_coverage_requirements:
  critical:
    minimum_preventive_controls: 1
    minimum_detective_controls: 1
    maximum_detection_latency: P1D

  high:
    minimum_preventive_controls: 1
    minimum_detective_controls: 1
    maximum_detection_latency: P7D

  control_counting_rules:
    planned_controls_count: false
    absent_controls_count: false
    disabled_controls_count: false
    degraded_controls_count: false
    only_verified_controls_count: true

integrity_contract:
  authoritative_payload:
    include:
      - l9_schema
      - artifact_type
      - metadata.policy_id
      - metadata.policy_version
      - policy_defaults
      - authority_order
      - principles
      - trust_model
      - lifecycle_model
      - time_policy
      - repository_scope
      - assertion_registry
      - invariants
      - control_coverage_requirements
      - exemption_policy
      - bypass_policy
      - validation_contract
      - report_contract

    exclude:
      - provenance.generated_at
      - provenance.consumer_repository
      - provenance.consumer_path
      - assurance_snapshot

  canonicalization:
    specification: RFC8785
    character_encoding: UTF-8
    unicode_normalization: NFC
    line_endings: LF

  digest:
    algorithm: SHA-256
    encoding: lowercase_hex

  authenticity:
    digest_alone_is_sufficient: false
    immutable_git_commit_required: true
    signed_release_required_for_blocking_rollout: true

mirror_contract:
  generated: true
  independently_editable: false
  direct_manual_edit: forbidden

  required_metadata:
    - canonical_repository
    - canonical_path
    - canonical_commit
    - policy_id
    - policy_version
    - policy_digest
    - generated_at
    - consumer_repository
    - consumer_path

  canonical_reference:
    mutable_branch_allowed_for_blocking_enforcement: false
    accepted_reference_types:
      - immutable_git_commit
      - approved_signed_release

  update_method:
    preferred: reviewed_automated_pull_request
    direct_push: forbidden
    human_review_required: true

  mismatch_behavior:
    result: fail
    action: block

exemption_policy:
  default: denied
  critical_invariants_exemptible: false
  maximum_duration: P90D
  auto_expire: true

  required_fields:
    - exemption_id
    - repository_identity
    - invariant_ids
    - scope
    - reason
    - accountable_owner
    - approved_by
    - approval_reference
    - created_at
    - effective_at
    - expires_at
    - compensating_controls

  invalid_conditions:
    - missing_required_field
    - expired
    - approval_missing
    - approver_unauthorized
    - invariant_not_exemptible
    - scope_overbroad
    - compensating_controls_missing
    - repository_identity_mismatch

  records: []

bypass_policy:
  default: denied
  maximum_duration: PT4H

  authorized_actor_groups:
    - break-glass-admins

  required_fields:
    - bypass_id
    - actor_identity
    - affected_repository
    - affected_controls
    - incident_reference
    - reason
    - approved_by
    - started_at
    - expires_at
    - audit_event_id
    - notification_event_id

  retrospective_review:
    required: true
    maximum_delay: P1D

  invalid_conditions:
    - agent_actor
    - pull_request_author_self_bypass
    - unauthorized_actor
    - missing_incident_reference
    - missing_expiration
    - expired
    - duration_exceeds_limit
    - audit_event_missing
    - notification_missing

validation_profiles:
  canonical_source:
    required_checks:
      - safe_yaml_parse
      - duplicate_keys_rejected
      - schema_valid
      - policy_id_valid
      - policy_version_valid
      - invariant_ids_unique
      - control_ids_unique
      - assertion_types_resolve
      - invariant_control_references_resolve
      - unsupported_critical_semantics_rejected
      - enforcement_claims_evidenced
      - protected_paths_declared
      - canonical_payload_digest_reproducible

  consumer_pull_request:
    required_checks:
      - repository_identity_known
      - repository_is_in_scope_or_validly_exempt
      - canonical_reference_is_immutable
      - canonical_signature_or_approved_release_valid
      - mirror_metadata_complete
      - mirror_digest_matches
      - consumer_policy_not_weakened
      - required_workflow_present
      - governance_workflow_not_weakened
      - required_check_name_exact
      - exemption_valid_or_absent

  organization_audit:
    required_checks:
      - organization_inventory_complete
      - every_repository_classified
      - every_repository_covered
      - mirror_present_where_required
      - mirror_not_stale
      - required_workflow_present
      - required_check_configured
      - ruleset_coverage_verified
      - bypasses_valid
      - exemptions_valid
      - evidence_not_stale

  release:
    required_checks:
      - canonical_source_profile_passes
      - tests_pass
      - negative_tests_pass
      - deterministic_render_verified
      - deterministic_validation_verified
      - immutable_commit_recorded
      - signature_or_attestation_valid
      - release_notes_present
      - policy_version_increment_valid

validation_contract:
  parser:
    safe_yaml_required: true
    duplicate_mapping_keys: reject
    aliases:
      maximum_expansion: 50
    unknown_top_level_fields: reject

  schema:
    required_path: schemas/org-invariants.schema.json
    additional_properties_default: false

  identifiers:
    invariant_pattern: "^L9-ORG-[0-9]{3}$"
    control_pattern: "^L9-CTRL-[0-9]{3}$"
    principle_pattern: "^L9-PRINCIPLE-[0-9]{3}$"
    unique: true
    immutable_after_release: true

  versions:
    policy_version_format: semver
    semantic_change_requires_increment: true
    assertion_version_required: true

  determinism:
    same_inputs_same_decision: required
    same_inputs_same_machine_output: required
    nondeterministic_fields_excluded_from_digest: true
    repeated_passes_required: 2

  failure_behavior:
    policy_violation_exit_code: 1
    configuration_error_exit_code: 2
    unsupported_semantics_exit_code: 3
    integrity_failure_exit_code: 4
    assurance_failure_exit_code: 5
    indeterminate_critical_exit_code: 6

  diagnostics:
    human_readable: true
    machine_readable: true
    machine_format: json
    include_policy_id: true
    include_policy_version: true
    include_repository_identity: true
    include_invariant_id: true
    include_control_id_when_applicable: true
    include_evidence_references: true
    include_remediation: true
    include_remaining_unknowns: true
    redact_secrets: true

test_contract:
  required_categories:
    - valid_canonical_policy
    - malformed_yaml
    - duplicate_mapping_key
    - schema_violation
    - duplicate_invariant_id
    - duplicate_control_id
    - unknown_critical_assertion
    - unresolved_control_reference
    - stale_consumer_mirror
    - consumer_digest_mismatch
    - consumer_control_downgrade
    - consumer_fail_closed_downgrade
    - consumer_severity_downgrade
    - mutable_canonical_reference
    - missing_required_check
    - missing_ruleset_binding
    - expired_exemption
    - unauthorized_exemption
    - unauthorized_bypass
    - expired_bypass
    - incomplete_repository_inventory
    - uncovered_repository
    - stale_assurance_evidence
    - false_blocking_claim
    - deterministic_render
    - deterministic_validation

  fixture_contract:
    required_fields:
      - fixture_id
      - description
      - input
      - expected_result
      - expected_exit_code
      - expected_violation_codes

  pass_claim_rules:
    unexecuted_test_may_be_reported_passed: false
    skipped_critical_test_may_be_ignored: false
    unavailable_validation_must_be_reported: true

evidence_contract:
  evidence_record_required_fields:
    - evidence_id
    - evidence_type
    - subject_id
    - source
    - collected_at
    - collector_identity
    - immutable_reference
    - result
    - digest

  accepted_evidence_types:
    - implementation_file
    - test_result
    - workflow_run
    - required_check_configuration
    - ruleset_configuration
    - codeowner_configuration
    - signed_release
    - provenance_attestation
    - organization_inventory
    - bypass_audit_event
    - exemption_approval

  evidence_freshness:
    default_maximum_age: P7D
    ruleset_configuration: P1D
    organization_inventory: P1D
    bypass_audit_event: PT1H
    signed_release: immutable

  stale_evidence:
    may_support_blocking_claim: false

provenance_policy:
  canonical_release:
    immutable_reference_required: true
    mutable_branch_reference_for_blocking_enforcement: forbidden

  signature:
    required_for_blocking_rollout: true
    accepted_signer_groups:
      - governance-admins

  attestation:
    required_for_blocking_rollout: true
    format: in-toto
    predicate_type: quantum-l9.org-governance-policy.v1

  dependency_policy:
    external_actions_pinned_to_commit: true
    reusable_workflows_pinned_to_commit: true
    unverified_remote_scripts: forbidden
    implicit_latest_versions: forbidden

report_contract:
  required_sections:
    - summary
    - policy_identity
    - execution_context
    - scope
    - invariants_evaluated
    - controls_executed
    - evidence_collected
    - validation_results
    - regressions
    - remaining_unknowns
    - merge_readiness
    - minimum_safe_next_action
    - convergence

  execution_context:
    required_fields:
      - repository_identity
      - commit
      - event
      - policy_id
      - policy_version
      - canonical_commit
      - validation_profile
      - validator_version

  validation_result:
    allowed:
      - pass
      - fail
      - partial
      - blocked
      - indeterminate

  merge_readiness:
    allowed:
      - ready
      - not_ready
      - blocked

  convergence:
    required_fields:
      - convergence_status
      - recursive_passes_run
      - align_improve_cycles_run
      - same_output_after_multiple_passes
      - remaining_unknowns
      - minimum_safe_next_action
      - source_intent_preserved
      - scope_drift_detected
      - execution_readiness

    convergence_status_allowed:
      - converged
      - partial
      - blocked

    execution_readiness_allowed:
      - pass
      - partial
      - fail

  honesty_requirements:
    validation_not_run_must_be_declared: true
    blocked_validation_requires_exact_blocker: true
    unsupported_claims_forbidden: true
    remaining_unknowns_must_not_be_omitted: true
    unrelated_changes_must_be_reported: true

consumer_policy:
  discovery:
    source: github_organization_inventory
    organization: Quantum-L9
    default_in_scope: true

  explicit_consumers:
    - repository: Quantum-L9/L9-Ops-MCP
      mirror_path: ORG_INVARIANTS.yaml
      classification: governed
      current_assurance_state: insufficient_evidence

  absent_from_explicit_list:
    exemption_implied: false
    in_scope_by_default: true

change_control:
  protected_paths:
    - ORG_INVARIANTS.yaml
    - CANONICAL_LAW.md
    - schemas/**
    - assertions/**
    - controls/**
    - scripts/validate_org_invariants.py
    - scripts/render_org_invariants_mirror.py
    - .github/workflows/**
    - .github/CODEOWNERS

  requirements:
    pull_request_required: true
    independent_human_authorization_required: true
    human_owner_merge_authorization_satisfies: true
    agent_may_execute_authorized_merge: true
    author_cannot_self_authorize: true
    codeowner_approval_required: false
    direct_push_to_default_branch: forbidden
    force_push: forbidden
    unresolved_review_threads_block: false
    required_check_name: org-governance/invariants

  agent_constraints:
    agent_may_propose_change: true
    agent_may_run_validation: true
    agent_may_report_evidence: true
    agent_may_self_approve: false
    agent_may_bypass: false
    agent_attestation_alone_sufficient: false

rollout_gates:
  gate_1_policy_structure:
    requirements:
      - canonical_yaml_valid
      - schema_exists
      - schema_validation_passes
      - assertion_registry_complete
      - invariant_ids_stable
      - control_ids_stable

    current_status: not_verified

  gate_2_validator:
    requirements:
      - validator_implemented
      - required_profiles_supported
      - negative_tests_pass
      - deterministic_results_verified
      - false_enforcement_claims_rejected

    current_status: not_verified

  gate_3_provenance:
    requirements:
      - immutable_release_reference
      - signed_release
      - provenance_attestation
      - dependencies_pinned

    current_status: not_verified

  gate_4_consumer_pilot:
    requirements:
      - L9_Ops_MCP_mirror_generated
      - consumer_workflow_installed
      - stale_mirror_test_blocked
      - weakened_control_test_blocked
      - required_check_observed

    current_status: not_verified

  gate_5_platform_enforcement:
    requirements:
      - organization_ruleset_exists
      - required_check_bound
      - bypass_actors_reviewed
      - failure_blocks_merge
      - protected_paths_require_human_owner_authorization

    current_status: not_verified

  gate_6_organization_coverage:
    requirements:
      - repository_inventory_complete
      - every_repository_classified
      - every_repository_covered_or_validly_exempt
      - scheduled_audit_enabled
      - coverage_gap_alerting_enabled

    current_status: not_verified

  blocking_rollout_allowed_when:
    all_gates_verified: true

assurance_snapshot:
  snapshot_status: insufficient_evidence
  effective_organization_enforcement: unenforced

  verified_claims:
    - canonical_policy_intent_declared
    - fail_closed_requirement_declared
    - single_canonical_source_declared
    - consumer_weakening_forbidden
    - fake_validation_forbidden
    - independent_enforcement_required

  unverified_claims:
    - validator_exists_and_passes
    - schema_exists_and_passes
    - mirror_renderer_exists_and_is_deterministic
    - signed_release_exists
    - consumer_required_check_exists
    - organization_ruleset_requires_check
    - repository_inventory_is_complete
    - all_repositories_are_covered
    - bypass_process_is_operational
    - exemption_expiration_is_automated

  remaining_unknowns:
    - actual_current_repository_files
    - actual_current_workflow_configuration
    - actual_current_ruleset_configuration
    - actual_CODEOWNERS_configuration
    - actual_bypass_actor_configuration
    - actual_consumer_repository_coverage
    - actual_test_and_ci_results

  minimum_safe_next_action: >-
    Inspect the canonical repository and implement or verify the schema and
    validator before promoting any control from absent or planned to implemented.

  convergence:
    convergence_status: partial
    recursive_passes_run: 1
    align_improve_cycles_run: 1
    same_output_after_multiple_passes: false
    remaining_unknowns:
      - repository_implementation_evidence_not_yet_inspected
      - platform_enforcement_evidence_not_yet_collected
    minimum_safe_next_action: >-
      Validate this policy against an implemented JSON Schema and repository
      evidence, then resolve every unsupported control and assurance claim.
    source_intent_preserved: true
    scope_drift_detected: false
    execution_readiness: partial

provenance:
  supersedes:
    schema_version: 1

  preserved_intent:
    - repositories_belong_to_Quantum-L9
    - repository_birth_fails_closed
    - personal_account_routing_is_forbidden
    - Cursor_Governance_is_canonical
    - L9_Ops_MCP_is_a_consumer
    - violations_block_governed_operations

  generated_artifact: false
  independently_editable: true

  change_process: >-
    Inspect repository evidence before editing. Update the canonical policy.
    Validate schema and semantics. Run all available tests and CI-equivalent
    checks. Generate deterministic consumer mirrors from an immutable approved
    canonical commit. Deliver changes through reviewed pull requests. Do not
    claim implementation, verification, blocking enforcement, or convergence
    without reproducible evidence.