---
# =============================================================================
# Quantum-L9 Organization Invariants
# =============================================================================
#
# Purpose:
#   Canonical, machine-readable organization policy for Quantum-L9.
#
# Authority:
#   This file declares what MUST be true across governed repositories.
#   It does not treat agents, IDE rules, prompts, documentation, or local hooks
#   as sufficient enforcement boundaries.
#
# Trust model:
#   Humans, Cursor, Claude Code, Codex, CI-generating agents, and repository
#   contributors may propose changes. Independent platform controls determine
#   whether governed changes may merge or governed operations may proceed.
#
# Assurance rule:
#   No control may be described as implemented, verified, or blocking unless
#   the required evidence exists and can be independently reproduced.
#
# Change rule:
#   Edit the canonical policy first. Consumer mirrors are generated artifacts
#   and MUST NOT be independently edited.
#
# =============================================================================

l9_schema: 2
artifact_type: governance_policy
status: active
canonical: true

metadata:
  policy_id: quantum-l9.org-invariants
  title: Quantum-L9 Organization Invariants
  description: >-
    Non-negotiable organization-wide requirements governing repository
    ownership, policy authority, mirror integrity, enforcement independence,
    governance change control, exemptions, bypasses, and assurance evidence.

  organization:
    name: Quantum-L9
    github_owner: Quantum-L9

  policy_version: 3.0.0
  schema_version: 2

  owner:
    team: governance-admins
    escalation_team: security-admins

  canonical_source:
    repository: Quantum-L9/Cursor-Governance
    path: ORG_INVARIANTS.yaml
    branch: main

  classification:
    criticality: critical
    visibility: organization
    handling: governance-controlled

  tags:
    - governance
    - organization-invariants
    - quantum-l9
    - canonical-policy
    - fail-closed
    - machine-readable

authority_order:
  - user_authorized_task
  - canonical_policy
  - repository_governance_files
  - repository_manifests_and_configuration
  - tests_and_ci
  - established_repository_patterns
  - unknown

policy_defaults:
  enforcement_requirement: blocking
  fail_behavior: closed
  violation_action: block

  unknown_semantics:
    critical: block
    high: block
    medium: warn
    low: warn

  missing_evidence:
    critical: unenforced
    high: unenforced
    medium: indeterminate
    low: indeterminate

  local_extensions:
    may_strengthen: true
    may_weaken: false

principles:
  - id: L9-PRINCIPLE-001
    title: Inspect before editing
    statement: >-
      Governance changes must be based on inspected repository evidence,
      existing contracts, tests, workflows, manifests, and active controls.

  - id: L9-PRINCIPLE-002
    title: Preserve working behavior and authority boundaries
    statement: >-
      Governance work must preserve valid existing behavior and must not cross,
      weaken, or silently redefine established authority boundaries.

  - id: L9-PRINCIPLE-003
    title: Fix root causes
    statement: >-
      Governance changes must address the actual control or assurance failure
      rather than masking symptoms through documentation-only changes.

  - id: L9-PRINCIPLE-004
    title: No fake validation
    statement: >-
      No policy, control, test, workflow, evidence record, or report may claim
      success unless the relevant validation was actually executed and passed.

  - id: L9-PRINCIPLE-005
    title: No unfinished enforcement claims
    statement: >-
      Planned files, commands, workflows, integrations, and rulesets must not
      be represented as implemented, verified, or blocking.

  - id: L9-PRINCIPLE-006
    title: Independent enforcement
    statement: >-
      Coding agents, IDEs, prompts, conventions, and local hooks may assist
      compliance but may not be the sole enforcement mechanism for a blocking
      organization invariant.

  - id: L9-PRINCIPLE-007
    title: Evidence-backed convergence
    statement: >-
      Governance validation must report executed controls, evidence, remaining
      unknowns, scope drift, and whether repeated evaluation has converged.

trust_model:
  untrusted_change_producers:
    - human_contributor
    - repository_administrator
    - cursor
    - claude_code
    - codex
    - other_ai_agents
    - ide_extension
    - local_script
    - local_git_hook
    - pull_request_author

  trusted_enforcement_boundaries:
    - github_organization_ruleset
    - github_repository_ruleset
    - required_github_actions_check
    - approved_repository_provisioner
    - approved_policy_release_process

  prohibited_trust_assumptions:
    - agent_self_attestation_is_sufficient
    - documentation_is_enforcement
    - workflow_presence_implies_workflow_requirement
    - check_success_implies_ruleset_binding
    - repository_admin_cannot_bypass_without_verification
    - mutable_branch_reference_is_immutable_provenance
    - digest_alone_proves_author_identity

lifecycle_model:
  policy_states:
    - proposed
    - active
    - deprecated
    - retired

  implementation_states:
    - absent
    - planned
    - implemented
    - verified
    - degraded
    - disabled

  enforcement_states:
    - unenforced
    - advisory
    - blocking
    - bypassed
    - indeterminate

  assurance_states:
    - unsupported
    - insufficient_evidence
    - partially_verified
    - verified
    - stale
    - failed

  transition_requirements:
    implemented_to_verified:
      require:
        - implementation_exists
        - implementation_is_reviewed
        - implementation_tests_pass
        - executable_entrypoint_resolves
        - workflow_invocation_exists

    verified_to_blocking:
      require:
        - required_check_configured
        - ruleset_binding_verified
        - bypass_policy_verified
        - failure_path_demonstrated
        - evidence_not_stale

    blocking_to_bypassed:
      require:
        - authorized_break_glass_actor
        - incident_reference
        - expiration
        - audit_event
        - retrospective_review

time_policy:
  timestamp_format: RFC3339
  timezone: UTC
  duration_format: ISO8601

  maximum_exemption_duration: P90D
  maximum_break_glass_duration: PT4H
  critical_detection_latency: PT1H
  high_detection_latency: P1D
  mirror_staleness_limit: P7D
  organization_audit_interval: P1D
  assurance_evidence_maximum_age: P7D

  unavailable_trusted_clock:
    result: indeterminate
    critical_action: block

repository_scope:
  provider: github
  organization: Quantum-L9
  default_in_scope: true

  include:
    archived: false
    forks: false
    templates: true
    visibility:
      - public
      - private
      - internal

  stable_identity:
    preferred: github_repository_node_id
    fallback: github_full_name

  exclusions:
    records: []

  incomplete_inventory:
    result: indeterminate
    change_enforcement_action: block
    audit_action: alert

assertion_registry:
  - type: repository_owner
    version: 1
    evaluator_contract: repository_owner_v1

    required_inputs:
      - repository_identity
      - observed_owner
      - expected_owner

    normalization:
      owner_case_sensitive: false
      trim_whitespace: true
      normalize_repository_url: true

    outcomes:
      pass: observed_owner_equals_expected_owner
      fail: observed_owner_differs_from_expected_owner
      unknown: owner_cannot_be_determined

  - type: canonical_source
    version: 1
    evaluator_contract: canonical_source_v1

    required_inputs:
      - declared_canonical_repository
      - declared_canonical_path
      - expected_canonical_repository
      - expected_canonical_path

    outcomes:
      pass: declared_source_matches_expected_source
      fail: declared_source_conflicts_with_expected_source
      unknown: declared_source_is_missing_or_unreadable

  - type: canonical_digest_match
    version: 1
    evaluator_contract: canonical_digest_match_v1

    required_inputs:
      - canonical_payload
      - consumer_payload
      - canonicalization_profile
      - expected_digest

    outcomes:
      pass: normalized_payload_digests_match
      fail: normalized_payload_digests_differ
      unknown: payload_or_digest_cannot_be_computed

  - type: monotonic_policy_enforcement
    version: 1
    evaluator_contract: monotonic_policy_enforcement_v1

    required_inputs:
      - canonical_control_requirement
      - consumer_control_requirement

    outcomes:
      pass: consumer_is_equal_or_stricter
      fail: consumer_weakens_canonical_requirement
      unknown: semantic_comparison_is_unsupported

  - type: independent_approval
    version: 1
    evaluator_contract: independent_approval_v1

    required_inputs:
      - author_identity
      - approver_identities
      - required_owner_group
      - approval_events

    outcomes:
      pass: required_independent_human_approval_exists
      fail: approval_is_missing_self_approved_or_agent_only
      unknown: approval_identity_cannot_be_verified

  - type: enforcement_evidence
    version: 1
    evaluator_contract: enforcement_evidence_v1

    required_inputs:
      - control_requirement
      - implementation_evidence
      - platform_binding_evidence
      - validation_evidence

    outcomes:
      pass: all_required_evidence_is_present_current_and_valid
      fail: evidence_proves_control_is_not_effective
      unknown: required_evidence_is_missing_stale_or_unverifiable

  - type: repository_coverage
    version: 1
    evaluator_contract: repository_coverage_v1

    required_inputs:
      - organization_inventory
      - repository_classifications
      - control_bindings

    outcomes:
      pass: all_in_scope_repositories_are_classified_and_covered
      fail: one_or_more_repositories_are_uncovered
      unknown: inventory_is_incomplete_or_stale

  - type: authorized_bypass
    version: 1
    evaluator_contract: authorized_bypass_v1

    required_inputs:
      - bypass_actor
      - incident_reference
      - start_time
      - expiration_time
      - audit_event

    outcomes:
      pass: bypass_is_authorized_time_bound_and_audited
      fail: bypass_is_unauthorized_expired_or_incomplete
      unknown: bypass_evidence_cannot_be_verified

invariants:
  # ---------------------------------------------------------------------------
  # Repository lifecycle
  # ---------------------------------------------------------------------------

  - id: L9-ORG-001
    title: New repositories must be created under Quantum-L9
    domain: repository_lifecycle
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Every governed repository must be created under the Quantum-L9 GitHub
        organization through an approved repository creation path.

      enforcement_requirement: blocking
      fail_behavior: closed

    applies_to:
      operations:
        - repository_create
        - repository_import
        - initialize_remote

    assertion:
      type: repository_owner
      version: 1
      expected_owner: Quantum-L9

    forbidden:
      - creation_under_personal_account
      - creation_under_undeclared_owner
      - creation_without_owner_verification

    violation:
      code: L9_ORG_REPOSITORY_BIRTH_OWNER_INVALID
      action: block
      message: >-
        Governed repositories must be created under the Quantum-L9
        organization.

    control_requirements:
      minimum_preventive_controls: 1
      minimum_detective_controls: 1

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        No approved repository provisioner or verified organization-level
        repository-birth control is declared as active in this policy version.

  - id: L9-ORG-002
    title: Governed repositories must remain owned by Quantum-L9
    domain: repository_lifecycle
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        An in-scope repository must not be transferred outside Quantum-L9 or
        renamed in a way that escapes organization governance.

      enforcement_requirement: blocking
      fail_behavior: closed

    applies_to:
      operations:
        - repository_transfer
        - repository_owner_audit
        - repository_identity_change

    assertion:
      type: repository_owner
      version: 1
      expected_owner: Quantum-L9

    violation:
      code: L9_ORG_REPOSITORY_OWNERSHIP_DRIFT
      action: block_and_alert
      message: >-
        An in-scope repository is no longer owned by Quantum-L9.

    control_requirements:
      minimum_preventive_controls: 1
      minimum_detective_controls: 1
      maximum_detection_latency: PT1H

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        Organization ownership monitoring and transfer prevention have not yet
        been verified.

  - id: L9-ORG-003
    title: Governed publication must target approved repositories
    domain: repository_lifecycle
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Code, generated repositories, imports, and governed artifacts may only
        be published to approved Quantum-L9 repositories.

      enforcement_requirement: blocking
      fail_behavior: closed

    applies_to:
      operations:
        - git_push
        - repository_publish
        - upload_to_repository
        - generated_repository_publish

    assertion:
      type: repository_owner
      version: 1
      expected_owner: Quantum-L9

    violation:
      code: L9_ORG_PUBLICATION_TARGET_INVALID
      action: block
      message: >-
        The publication target is not an approved Quantum-L9 repository.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        No universally bound publication-routing control has been verified.

  # ---------------------------------------------------------------------------
  # Canonical authority and integrity
  # ---------------------------------------------------------------------------

  - id: L9-ORG-004
    title: Organization invariants have one canonical source
    domain: governance_integrity
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Quantum-L9 organization invariants originate only from the canonical
        policy in Quantum-L9/Cursor-Governance.

      enforcement_requirement: blocking
      fail_behavior: closed

    assertion:
      type: canonical_source
      version: 1

      expected:
        repository: Quantum-L9/Cursor-Governance
        path: ORG_INVARIANTS.yaml

    forbidden:
      - competing_canonical_source
      - consumer_declares_itself_canonical
      - independent_consumer_policy_authority
      - undocumented_policy_fork

    violation:
      code: L9_ORG_CANONICAL_SOURCE_VIOLATION
      action: block
      message: >-
        Organization-invariant changes must originate from the canonical
        Cursor-Governance policy.

    assurance:
      effective_enforcement_state: advisory
      assurance_state: partially_verified
      reason: >-
        Canonical authority is declared, but organization-wide required-check
        and mirror-binding evidence is not yet recorded.

  - id: L9-ORG-005
    title: Consumer mirrors must match the canonical policy
    domain: governance_integrity
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Consumer mirrors must contain the same normalized authoritative payload
        as an approved immutable canonical policy release.

      enforcement_requirement: blocking
      fail_behavior: closed

    applies_to:
      repositories:
        include:
          - Quantum-L9/*
        exclude:
          - Quantum-L9/Cursor-Governance

    assertion:
      type: canonical_digest_match
      version: 1

    forbidden:
      - stale_policy_version
      - digest_mismatch
      - modified_invariant
      - removed_invariant
      - altered_policy_default
      - altered_assertion_semantics
      - altered_exemption_policy
      - altered_bypass_policy
      - consumer_marked_canonical
      - direct_manual_edit

    violation:
      code: L9_ORG_MIRROR_INTEGRITY_FAILURE
      action: block
      message: >-
        The consumer mirror is missing, stale, modified, or unverifiable.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        Deterministic mirror rendering and required consumer validation have not
        yet been verified.

  - id: L9-ORG-006
    title: Consumer repositories cannot weaken canonical controls
    domain: governance_integrity
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Repository-local policy may add stricter controls but may not disable,
        downgrade, bypass, reinterpret, shadow, or replace canonical controls.

      enforcement_requirement: blocking
      fail_behavior: closed

    assertion:
      type: monotonic_policy_enforcement
      version: 1

    allowed:
      - stricter_local_validation
      - additional_required_review
      - narrower_permission
      - shorter_expiration
      - faster_detection

    forbidden:
      - blocking_to_advisory
      - blocking_to_disabled
      - fail_closed_to_fail_open
      - critical_to_lower_severity
      - block_to_warn
      - broadened_exemption
      - extended_exemption_without_approval
      - agent_instruction_replacing_platform_control
      - unknown_critical_assertion_ignored

    violation:
      code: L9_ORG_ENFORCEMENT_WEAKENED
      action: block
      message: >-
        A consumer repository attempted to weaken canonical governance.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        A verified semantic policy-comparison implementation is not yet
        recorded.

  # ---------------------------------------------------------------------------
  # Change control
  # ---------------------------------------------------------------------------

  - id: L9-ORG-007
    title: Governance-sensitive changes require independent human approval
    domain: change_control
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Changes to canonical policy, policy schemas, validators, renderers,
        governance workflows, CODEOWNERS, release controls, ruleset bindings,
        bypass configuration, or exemption policy require independent
        authorization from an authorized human governance owner. An explicit
        merge authorization from that owner satisfies this requirement; a
        coding agent may execute the authorized merge but cannot itself provide
        the authorization, and the change author cannot self-authorize. A
        separate recorded codeowner review is not required.

      enforcement_requirement: blocking
      fail_behavior: closed

    protected_paths:
      - ORG_INVARIANTS.yaml
      - CANONICAL_LAW.md
      - schemas/**
      - assertions/**
      - controls/**
      - scripts/validate_org_invariants.py
      - scripts/render_org_invariants_mirror.py
      - .github/workflows/**
      - .github/CODEOWNERS

    assertion:
      type: independent_approval
      version: 1

      requirements:
        pull_request_required: true
        minimum_human_authorizations: 1
        human_owner_merge_authorization_satisfies: true
        codeowner_approval_required: false
        author_cannot_self_authorize: true
        agent_authorization_is_not_authorization: true
        agent_may_execute_authorized_merge: true
        unresolved_review_threads_block: false

    violation:
      code: L9_ORG_INDEPENDENT_APPROVAL_REQUIRED
      action: block
      message: >-
        Governance-sensitive changes require independent authorized human
        approval.

    assurance:
      effective_enforcement_state: advisory
      assurance_state: partially_verified
      reason: >-
        Independent authorization is satisfied by an explicit merge
        authorization from an authorized human governance owner; the coding
        agent may execute the authorized merge but is not the authorizer, and
        the change author cannot self-authorize. A separate recorded codeowner
        review is intentionally not required. This is a process control;
        platform ruleset binding is not the gate.

  - id: L9-ORG-008
    title: Governance code must use immutable external references
    domain: supply_chain
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Blocking governance workflows and reusable workflow consumers must pin
        external actions and governance execution references to immutable
        commits or approved signed releases.

      enforcement_requirement: blocking
      fail_behavior: closed

    forbidden:
      - action_reference_to_mutable_branch
      - reusable_workflow_reference_to_main
      - reusable_workflow_reference_to_unprotected_tag
      - unverified_downloaded_executable
      - implicit_latest_version

    allowed_reference_types:
      - git_commit_sha
      - approved_signed_release_tag
      - verified_internal_artifact_digest

    violation:
      code: L9_ORG_MUTABLE_GOVERNANCE_DEPENDENCY
      action: block
      message: >-
        Governance dependencies must use immutable, reviewable references.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        Repository workflow references have not yet been inventoried and
        verified.

  # ---------------------------------------------------------------------------
  # Enforcement evidence and assurance
  # ---------------------------------------------------------------------------

  - id: L9-ORG-009
    title: Enforcement claims must be evidence-backed
    domain: governance_assurance
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        A control may not be labeled implemented, verified, or blocking unless
        the corresponding implementation, validation, platform binding, and
        failure-path evidence exists and is current.

      enforcement_requirement: blocking
      fail_behavior: closed

    assertion:
      type: enforcement_evidence
      version: 1

    implemented_requires:
      - implementation_exists
      - implementation_entrypoint_resolves
      - implementation_is_reviewed
      - tests_exist
      - tests_pass

    verified_requires:
      - all_implemented_requirements
      - workflow_invokes_implementation
      - deterministic_result_demonstrated
      - negative_test_demonstrates_failure
      - evidence_is_current

    blocking_requires:
      - all_verified_requirements
      - required_check_is_configured
      - organization_or_repository_ruleset_requires_check
      - bypass_actors_are_declared
      - bypass_events_are_audited
      - check_failure_blocks_merge_or_operation

    forbidden:
      - documentation_only_marked_implemented
      - planned_command_marked_executable
      - unrun_test_marked_passed
      - workflow_presence_marked_required
      - required_check_without_ruleset_binding
      - stale_evidence_marked_current
      - missing_evidence_marked_passed

    violation:
      code: L9_ORG_FALSE_ENFORCEMENT_CLAIM
      action: block
      message: >-
        The declared enforcement state is not supported by current evidence.

    assurance:
      effective_enforcement_state: advisory
      assurance_state: partially_verified
      reason: >-
        The policy forbids unsupported claims, but a complete executable
        evidence validator is not yet verified.

  - id: L9-ORG-010
    title: Every critical invariant requires preventive and detective coverage
    domain: governance_assurance
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Every active critical invariant must map to at least one preventive
        control and one detective control unless the policy explicitly records
        a technically justified exception.

      enforcement_requirement: blocking
      fail_behavior: closed

    minimum_coverage:
      preventive_controls: 1
      detective_controls: 1
      maximum_detection_latency: P1D

    assertion:
      type: repository_coverage
      version: 1

    violation:
      code: L9_ORG_CONTROL_COVERAGE_INCOMPLETE
      action: block_and_alert
      message: >-
        One or more critical invariants lack required control coverage.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        The control registry is not yet populated with verified controls.

  - id: L9-ORG-011
    title: Every in-scope repository must be classified and covered
    domain: governance_coverage
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        Every repository returned by the authoritative organization inventory
        must be classified as governed or explicitly exempted and must have the
        required governance controls attached.

      enforcement_requirement: blocking
      fail_behavior: closed

    assertion:
      type: repository_coverage
      version: 1

    required_repository_state:
      - classification_present
      - mirror_present_when_required
      - required_workflow_present
      - required_check_configured
      - ruleset_coverage_verified
      - exemption_valid_or_absent

    violation:
      code: L9_ORG_REPOSITORY_COVERAGE_GAP
      action: block_and_alert
      message: >-
        An in-scope repository is unclassified or lacks required governance
        coverage.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        Complete organization inventory and ruleset coverage evidence have not
        yet been collected.

  # ---------------------------------------------------------------------------
  # Exceptions and emergency bypass
  # ---------------------------------------------------------------------------

  - id: L9-ORG-012
    title: Exemptions must be explicit, scoped, approved, and temporary
    domain: exception_management
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        An exemption is invalid unless it identifies the affected repository
        and invariants, contains an approved reason, names an accountable owner,
        references an approval record, and expires automatically.

      enforcement_requirement: blocking
      fail_behavior: closed

    critical_invariants_exemptible: false

    violation:
      code: L9_ORG_INVALID_EXEMPTION
      action: block
      message: >-
        The exemption is missing, invalid, overbroad, unapproved, or expired.

    assurance:
      effective_enforcement_state: advisory
      assurance_state: partially_verified
      reason: >-
        Exemption requirements are declared, but automated expiration and
        coverage validation are not yet verified.

  - id: L9-ORG-013
    title: Enforcement bypasses must be authorized and audited
    domain: break_glass
    severity: critical
    policy_state: active

    requirement:
      statement: >-
        An enforcement bypass may occur only through the approved break-glass
        process and must be authorized, time-bound, incident-linked, logged,
        notified, and retrospectively reviewed.

      enforcement_requirement: blocking
      fail_behavior: closed

    assertion:
      type: authorized_bypass
      version: 1

    forbidden_actors:
      - coding_agent
      - pull_request_author
      - ordinary_repository_contributor
      - workflow_token
      - undeclared_repository_administrator

    violation:
      code: L9_ORG_UNAUTHORIZED_BYPASS
      action: block_and_alert
      message: >-
        Governance enforcement was bypassed without complete authorization and
        audit evidence.

    assurance:
      effective_enforcement_state: unenforced
      assurance_state: insufficient_evidence
      reason: >-
        Approved break-glass actors, notification paths, and audit integrations
        are not yet verified.

control_registry:
  # Controls remain "planned" until executable and platform evidence exists.
  # A planned control is not an enforcement claim.

  - id: L9-CTRL-001
    title: Approved organization repository provisioner
    control_type: preventive
    execution_boundary: approved_repository_provisioner
    implementation_state: absent
