# Optional semantic and presentation overlay for README targets that
# `filetree.md` already authorizes.
#
# This file is NOT a topology authority. It cannot create a target the
# current inventory does not contain — a configured path with no
# authorized target is reported as stale (`readme.config.unauthorized_target`)
# rather than honoured. Supported per-target keys: path, title, tier,
# description, purpose, skip.
#
# Root README.md is never a generate target (owned by l9-update-agent-docs pointer stack).
version: "1.0"
defaults:
  owner: l9-update-agent-docs
  # `sections` is retired. With kind-specific renderers there is no section
  # list every kind can carry, and requiring one is what produced
  # `_No public classes in this path._`: the old template emitted filler to
  # satisfy this map. Sections are now gated on evidence.
subsystems:
  ops_autonomy:
    path: ops/autonomy
    title: Autonomy plane
    tier: operations
    description: Shared autonomy surface — L4 local gate, merge gate, and profile.
    purpose: Enforce local-commit vs publish vs merge authority without a second scheduler.
  ops_hooks:
    path: ops/hooks
    title: Session hooks
    tier: operations
    description: SessionStart bootstrap and shell gates.
    purpose: Activate governance, hydrate Graphiti, and deny mid-execution publish.
  ops_graphiti:
    path: ops/graphiti
    title: Graphiti memory client
    tier: operations
    description: Graphiti CLI, hydration, and memory-bank policy.
    purpose: One episodic resume store via inject / PICKUP.
  ops_scripts:
    path: ops/scripts
    title: Governance scripts
    tier: operations
    description: Wiring, publish, and hygiene CLIs used by Makefile targets.
    purpose: Capability graph behind make start / make pr / make pr-check.
  workflows:
    path: workflows
    title: Workflow graphs
    tier: operations
    description: SessionDAG guidance graphs and LangGraph runtimes.
    purpose: Register and document workflow graphs. README is handwritten.
    skip: true
  commands:
    path: commands
    title: Slash commands
    tier: control_plane
    description: Live slash-command protocols.
    purpose: Trigger skills and DAGs by name. README is handwritten.
    skip: true
  rules:
    path: rules
    title: Cursor rules
    tier: control_plane
    description: Always-on and requestable .mdc rules.
    purpose: Bind agent behavior without a second governance tree.
    # Suppressed: ops/scripts/check_rules_standard.py fails closed on any
    # `.md` in rules/ except RULES-MANIFEST*, because Cursor ignores them.
    # A generated README here breaks governance-self-check. This is
    # repository policy, so it is stated in the overlay rather than taught
    # to the compiler.
    skip: true
  kernels:
    path: kernels
    title: Alignment kernels
    tier: control_plane
    description: Recursive Alignment, Validate and Repair, and related kernels.
    purpose: Full auditors loaded by path; skills cite them and do not wrap them.
  skills:
    path: skills
    title: L9 skills
    tier: control_plane
    description: Task-scoped skill packs invoked by name.
    purpose: Procedures that outrank agent-invented contracts and sit under AGENTS.md.
