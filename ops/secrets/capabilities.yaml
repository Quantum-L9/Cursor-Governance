# ---------------------------------------------------------------------------
# L9 capability registry — the model-facing half of the secret control plane.
#
# schema_version: 1.0.0
#
# An agent surface asks for a NAMED CAPABILITY. It never asks for a secret, and
# there is no supported way for it to ask for one (contract S4). Each entry
# below binds a capability id to a fixed upstream contract. The trusted
# broker that would have executed those contracts never shipped
# (`ops/secrets/_archived/capability-broker/`). `capability_client.py`
# reports every id UNAVAILABLE. Do not paste a secret to work around it.
#
#   agent  --(capability id)-->  capability_client  -->  UNAVAILABLE
#
# This file is NOT a parallel secret inventory (contract S6). `secret_refs` are
# *names* that already exist in the canonical inventory
# (ops/secrets/infisical-cursor-governance.yaml, ops/secrets/*.registry.yaml).
# Nothing here holds, caches or hints at a value, and adding a capability never
# means adding a secret to an adapter.
#
# Why each field exists — every one of them closes a specific attack:
#
#   upstream_host      the ONLY host the broker will contact for this id. The
#                      caller cannot supply, append to, or redirect it. Without
#                      this the broker is an SSRF oracle that signs requests
#                      with a real credential (contract §8).
#   methods            the ONLY HTTP verbs permitted. Read capabilities cannot
#                      be talked into a write.
#   paths              allow-listed request shapes. `{...}` segments are
#                      broker-substituted from validated parameters, never from
#                      raw caller strings.
#   params             what the caller MAY influence, and how each value is
#                      validated before it reaches a URL.
#   secret_refs        resolved inside the trusted boundary only. Present here
#                      so the mapping is auditable, absent from every response.
#   repository_scope   `workspace` = derived from the active repo by the broker
#                      (sonar-project.properties, git remote), not from a
#                      caller-supplied project id. Stops session A reading
#                      session B's project.
#   surfaces           which trust classes may invoke it at all.
#   sanitizer          the named response filter. Structured subsetting, not
#                      regex hope (contract §17).
#   limits             response ceiling + rate, so a capability cannot be used
#                      as a bulk exfiltration channel. Both are enforced by the
#                      broker (`RateLimiter`, per session and capability).
#   requires           preconditions the retired broker would have checked.
#                      Live `capability_client.py` reports UNAVAILABLE before
#                      any of these run. The archived evaluator is
#                      `_archived/capability-broker/capability_broker.py`.
#   audit_class        what the broker records. Never the JWT, never a value.
#   failure_semantics  `degrade` = advisory, session continues (contract §18).
#                      `deny` = an authority-bearing capability; its absence is
#                      a denial, never a silent pass.
#
# Adding an integration is a registry edit plus a sanitizer, never an adapter
# change (contract §15).
# ---------------------------------------------------------------------------
schema_version: "1.0.0"
authority: cursor-governance
inventory_ssot: ops/secrets/infisical-cursor-governance.yaml

defaults:
  surfaces: [model-controlled, trusted-operator]
  limits:
    max_response_bytes: 4194304
    max_requests_per_minute: 30
  failure_semantics: degrade

capabilities:

  # --- SonarCloud ----------------------------------------------------------
  - id: sonar.read_issues
    summary: Read the issue set, rule metadata, quality gate and measures for the active repository.
    secret_refs: [SONAR_TOKEN]
    upstream_host: sonarcloud.io
    base_path: /api
    methods: [GET]
    paths:
      - /issues/search
      - /rules/show
      - /qualitygates/project_status
      - /measures/component
    params:
      project: {source: workspace, from: sonar-project.properties#sonar.projectKey}
      organization: {source: workspace, from: sonar-project.properties#sonar.organization}
      branch: {source: caller, validate: git_ref}
      pullRequest: {source: caller, validate: digits}
      p: {source: caller, validate: digits}
      ps: {source: caller, validate: digits, max: 500}
    repository_scope: workspace
    sanitizer: sonar_issue_snapshot
    audit_class: read_advisory
    failure_semantics: degrade

  # --- Semgrep AppSec ------------------------------------------------------
  # Authenticated Semgrep runs INSIDE the trusted worker. The agent submits a
  # changed-file bundle and receives findings; the token never leaves the
  # broker side, and local Semgrep CE stays credential-free and unaffected.
  - id: semgrep.appsec_scan
    summary: Run authenticated Semgrep AppSec over a submitted source bundle inside the trusted worker.
    secret_refs: [SEMGREP_APP_TOKEN]
    upstream_host: semgrep.dev
    base_path: /api/v1
    methods: [GET, POST]
    paths:
      - /deployments
      - /deployments/{deployment_slug}/findings
      - /deployments/{deployment_slug}/scans
    params:
      deployment_slug: {source: broker_config, validate: slug}
      repo: {source: workspace, from: git_remote}
      bundle: {source: caller, validate: source_bundle, max_bytes: 16777216}
    repository_scope: workspace
    execution: trusted_worker
    sanitizer: semgrep_findings
    audit_class: scan_advisory
    failure_semantics: degrade

  # --- Graphiti memory -----------------------------------------------------
  # The MCP front door is proxied, so Claude's .mcp.json points at the broker
  # and never holds a bearer. group_id stays repository-aware: the broker
  # resolves it from the workspace and REFUSES a caller-supplied override, so
  # repositories cannot be collapsed into one namespace (contract §12).
  - id: graphiti.query
    summary: Read/search the repository's memory namespace through the brokered MCP front door.
    secret_refs: [GRAPHITI_MCP_TOKEN]
    upstream_host: memory.quantumaipartners.com
    base_path: /graphiti/mcp
    methods: [POST]
    paths:
      - /
    params:
      group_id: {source: workspace, from: group_registry, caller_override: forbidden}
      query: {source: caller, validate: text, max_bytes: 8192}
    repository_scope: workspace
    sanitizer: mcp_envelope
    audit_class: read_advisory
    failure_semantics: degrade

  - id: graphiti.write_governed
    summary: Governed memory write through the brokered MCP front door.
    secret_refs: [GRAPHITI_MCP_TOKEN]
    upstream_host: memory.quantumaipartners.com
    base_path: /graphiti/mcp
    methods: [POST]
    paths:
      - /
    params:
      group_id: {source: workspace, from: group_registry, caller_override: forbidden}
      episode: {source: caller, validate: text, max_bytes: 65536}
    repository_scope: workspace
    sanitizer: mcp_envelope
    audit_class: write_governed
    failure_semantics: deny

  # --- GitHub --------------------------------------------------------------
  # On Anthropic-hosted Claude cloud the platform git proxy already authenticates
  # git and gh, so no PAT is registered for the agent surface (contract S7/§11).
  # This capability exists for surfaces with no such proxy; `make pr` remains the
  # only publish path on every surface either way.
  - id: github.pr_read
    summary: Read pull request state, checks and review threads for the active repository.
    secret_refs: [GH_TOKEN]
    upstream_host: api.github.com
    base_path: ""
    methods: [GET]
    paths:
      - /repos/{owner}/{repo}/pulls/{number}
      - /repos/{owner}/{repo}/pulls/{number}/comments
      - /repos/{owner}/{repo}/commits/{sha}/check-runs
    params:
      owner: {source: workspace, from: git_remote}
      repo: {source: workspace, from: git_remote}
      number: {source: caller, validate: digits}
      sha: {source: caller, validate: sha}
    repository_scope: workspace
    platform_proxy_preferred: true
    sanitizer: github_pr_view
    audit_class: read_advisory
    failure_semantics: degrade

  # --- MCP Server Capabilities (credential-bearing MCPs proxied through broker) --
  - id: github.mcp
    summary: GitHub MCP server proxy — read repos, PRs, issues, commits, search, gists.
    secret_refs: [GITHUB_TOKEN]
    upstream_host: api.github.com
    base_path: ""
    methods: [GET, POST]
    paths:
      - /repos/{owner}/{repo}
      - /repos/{owner}/{repo}/pulls
      - /repos/{owner}/{repo}/pulls/{number}
      - /repos/{owner}/{repo}/pulls/{number}/files
      - /repos/{owner}/{repo}/pulls/{number}/comments
      - /repos/{owner}/{repo}/issues
      - /repos/{owner}/{repo}/issues/{number}
      - /repos/{owner}/{repo}/issues/{number}/comments
      - /repos/{owner}/{repo}/commits
      - /repos/{owner}/{repo}/commits/{sha}
      - /repos/{owner}/{repo}/commits/{sha}/check-runs
      - /repos/{owner}/{repo}/branches
      - /repos/{owner}/{repo}/contents/{path}
      - /search/repositories
      - /search/issues
      - /search/code
      - /user/repos
      - /orgs/{org}/repos
      - /gists
      - /gists/{id}
      - /users/{username}/gists
    params:
      owner: {source: caller, validate: text, max_bytes: 100}
      repo: {source: caller, validate: text, max_bytes: 100}
      org: {source: caller, validate: text, max_bytes: 100}
      username: {source: caller, validate: text, max_bytes: 100}
      number: {source: caller, validate: digits}
      sha: {source: caller, validate: text, max_bytes: 40}
      path: {source: caller, validate: text, max_bytes: 500}
      id: {source: caller, validate: text, max_bytes: 50}
      q: {source: caller, validate: text, max_bytes: 500}
      page: {source: caller, validate: digits}
      per_page: {source: caller, validate: digits}
      sort: {source: caller, validate: text, max_bytes: 50}
      order: {source: caller, validate: text, max_bytes: 10}
      state: {source: caller, validate: text, max_bytes: 20}
      ref: {source: caller, validate: text, max_bytes: 200}
    repository_scope: none
    sanitizer: passthrough
    audit_class: read_advisory
    failure_semantics: degrade

  - id: context7.mcp
    summary: Context7 MCP server proxy — library documentation search and retrieval.
    secret_refs: [CONTEXT7_API_KEY]
    # api.context7.io does not resolve — the capability could never have
    # succeeded even with a healthy broker, and nothing probed the registry so
    # nothing said so (audit B-13). ops/secrets/validate_capability_hosts.py now
    # fails validation on an unresolvable upstream_host.
    upstream_host: context7.com
    base_path: /v1
    methods: [GET, POST]
    paths:
      - /libraries
      - /libraries/{libraryId}
      - /libraries/{libraryId}/docs
      - /search
    params:
      libraryId: {source: caller, validate: text, max_bytes: 100}
      query: {source: caller, validate: text, max_bytes: 500}
      limit: {source: caller, validate: digits}
    repository_scope: none
    sanitizer: passthrough
    audit_class: read_advisory
    failure_semantics: degrade

  - id: semgrep.mcp
    summary: Semgrep MCP server proxy — scan code and retrieve findings.
    secret_refs: [SEMGREP_APP_TOKEN]
    upstream_host: semgrep.dev
    base_path: /api/v1
    methods: [GET, POST]
    paths:
      - /deployments
      - /deployments/{deployment_slug}/findings
      - /deployments/{deployment_slug}/scans
      - /deployments/{deployment_slug}/rules
    params:
      deployment_slug: {source: caller, validate: text, max_bytes: 100}
      repo: {source: workspace, from: git_remote}
    repository_scope: workspace
    sanitizer: passthrough
    audit_class: scan_advisory
    failure_semantics: degrade

  - id: gitguardian.mcp
    summary: GitGuardian MCP server proxy — secret scanning.
    secret_refs: [GITGUARDIAN_API_KEY]
    upstream_host: api.gitguardian.com
    base_path: /v1
    methods: [POST]
    paths:
      - /scan
      - /multiscan
    params:
      document: {source: caller, validate: text, max_bytes: 1048576}
    repository_scope: none
    sanitizer: passthrough
    audit_class: scan_advisory
    failure_semantics: degrade

  # Packages metadata only. Installs stay on authed_npm.sh (trusted-operator).
  # A model surface that cannot reach the broker reports PRIVATE_REGISTRY_UNREACHABLE
  # — it must not receive a PAT.
  - id: github.packages_read
    summary: Read GitHub Packages metadata for a scoped npm package (no install, no PAT to the agent).
    secret_refs: [GITHUB_TOKEN]
    upstream_host: npm.pkg.github.com
    base_path: ""
    methods: [GET]
    paths:
      - /{package}
    params:
      package: {source: caller, validate: text, max_bytes: 200}
    repository_scope: workspace
    sanitizer: github_packages_meta
    audit_class: read_advisory
    failure_semantics: degrade
