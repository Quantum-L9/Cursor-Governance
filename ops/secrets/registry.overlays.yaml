# Governance-only registry overlays (refs metadata). Not in igorbot CSV yet.
# Values are never stored here. provisioned: false until humans create the AWS secret.
schema_version: "1.0.0"
overlays:
  - secret_id: openclaw-igorbot/ui-session-github
    enabled: true
    region: us-east-1
    provisioned: false
    origin: governance_overlay
    keys:
      - json_key: storage_state
        mode: ui_session
        resolution_path: l9-ui-operator
        note: "Playwright storage_state JSON; provision in AWS before UI console auth for GitHub"
  - secret_id: openclaw-igorbot/ui-session-vercel
    enabled: true
    region: us-east-1
    provisioned: false
    origin: governance_overlay
    keys:
      - json_key: storage_state
        mode: ui_session
        resolution_path: l9-ui-operator
        note: "Playwright storage_state JSON; provision in AWS before UI console auth for Vercel"
  - secret_id: openclaw-igorbot/l9-intelligence-corpus
    enabled: true
    region: us-east-1
    provisioned: false
    origin: governance_overlay
    keys:
      - json_key: pseudonym_key
        mode: local_env
        resolution_path: l9-ci-debt-intelligence
        config_path: "env: L9_INTELLIGENCE_PSEUDONYM_KEY"
        note: "HMAC-SHA256 key for the corpus repository pseudonym. >=32 bytes.
          MUST differ from path_key: the digest carries no domain-separating
          prefix, so one key makes a repository name and an identical source
          path collide. Stable for the life of the corpus -- rotation
          re-pseudonymises every later record and splits longitudinal joins
          silently, so rotate only with a corpus migration. Shared with any
          other producer that pseudonymises, so one repository keeps one
          identity across the corpus."
      - json_key: path_key
        mode: local_env
        resolution_path: l9-ci-debt-intelligence
        config_path: "env: L9_INTELLIGENCE_PATH_KEY"
        note: "HMAC-SHA256 key for corpus source-path tokens. >=32 bytes. MUST
          differ from pseudonym_key. Same stability and sharing rules. Consumed
          by `l9-intelligence ingest-sdk-finding-bundle`; ingestion fails closed
          when either key is absent, because ingesting under a fresh random key
          yields a corpus whose pseudonyms join to nothing and looks healthy."
