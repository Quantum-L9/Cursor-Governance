# Governance-only registry overlays (refs metadata). Not in igorbot CSV yet.
# Values are never stored here. provisioned: false until humans create the AWS secret.
schema_version: "1.0.0"
overlays:
  - secret_id: openclaw-igorbot/ui-session-github
    enabled: true
    region: us-east-1
    provisioned: false
    origin: governance_overlay
    keys:
      - json_key: storage_state
        mode: ui_session
        resolution_path: l9-ui-operator
        note: "Playwright storage_state JSON; provision in AWS before UI console auth for GitHub"
  - secret_id: openclaw-igorbot/ui-session-vercel
    enabled: true
    region: us-east-1
    provisioned: false
    origin: governance_overlay
    keys:
      - json_key: storage_state
        mode: ui_session
        resolution_path: l9-ui-operator
        note: "Playwright storage_state JSON; provision in AWS before UI console auth for Vercel"
