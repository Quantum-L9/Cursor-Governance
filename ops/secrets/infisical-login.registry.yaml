schema_version: 1.0.0
namespace: cursor-governance
region_default: us-east-1
source:
  authority: cursor-governance
  path: ops/secrets/infisical-login.registry.yaml
  sync: aws_secrets_manager
  region: us-east-1
  namespace_prefix: cursor-governance/
  synced_at: '2026-09-07T00:00:00+00:00'
  note: "Agent AWS registry is the Infisical Universal Auth login secret only.
    App keys live in Infisical project Cursor-Governance (prod, path /).
    The AWS Secrets Manager object name is mapped in login_registry.py and
    is not stored in this file. Operator inventory remains
    openclaw-igorbot.registry.yaml. AWS SM objects are not deleted."
secrets:
- secret_id: cursor-governance/infisical-login
  enabled: true
  region: us-east-1
  provisioned: true
  origin: aws_sm
  keys:
  - json_key: client_id
  - json_key: client_secret
  - json_key: env
  - json_key: host
  - json_key: identity_id
  - json_key: org_id
  - json_key: org_slug
  - json_key: project_id
  - json_key: project_slug
  note: The only AWS secret agents may use without an explicit human request.
    Chicken-egg Universal Auth for Infisical project Cursor-Governance.
    App keys are Infisical root_env_keys via capability_bind.
