  hosted_identity_names:
    - claude-code
  privilege_slug: deny-operator-only-keys
notes:
  - Infisical bootstrap client_id/client_secret are not flattened to / (chicken-egg).
  - AUTH0_CLIENT_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, and AUTH0_CLIENT_NAME
    are the Auth0 machine-to-machine client that administers the Memory tenant
    (l9-graphiti-memory AUTH-01). operator_only_keys is empty. A name in the vault
    binds on Cursor and Claude. operator_only_iam.py --apply deletes the hosted
    forbid privilege deny-operator-only-keys; --check passes when that privilege
    is absent. Values stay in-process and are never rendered into client config.
  - Structured copies of those live under /aws/openclaw-igorbot/infisical-*/.
  - GH_TOKEN is an alias of GITHUB_TOKEN (CANONICAL_LAW §14).
  - GITGUARDIAN_API_KEY is the one Infisical name for the GitGuardian API key
    (#869). Every consumer reads it - capability gitguardian.mcp
    (upstream host api.gitguardian.com), the legacy ref openclaw-igorbot/gitguardian#apikey,
    and the Actions secret sync plan. A cloud-environment network secret for
    api.gitguardian.com is a copy outside Infisical, so the operator keeps the value here
    at prod `/` and removes that environment copy. Do not add a second GitGuardian name.
  - GRAPHITI_MCP_TOKEN lives at Infisical `/` (not an AWS port source; do not invent an AWS id).
  - Realignment C12 note (2026-09-06, ADR-0030) — no Cursor-Governance surface resolves
    GRAPHITI_MCP_TOKEN any more; memory is reached over stdio through ops/memory and the
    runtime owns its own configuration. The row belongs to the provider (projection)
    deployment and is retired by the operator together with it (an inventory fact, not a
    capability).
  - SEO-Bot local validation Postgres/Redis live under SEO_BOT_LOCAL_VALIDATION_* at /
    and as DATABASE_URL/REDIS_URL at /local/seo-bot-validation/ (127.0.0.1, not VPS).
  - 2026-11-20 (lane MEM-HOOK, operator-authorized) — L9_MEMORY_HOOK_CLIENT_ID and
    L9_MEMORY_HOOK_CLIENT_SECRET are listed in root_env_keys at prod `/`; they are the
    client-credentials pair of Auth0 app l9-memory-hooks (ADR-0055). The bind reports
    unbound until the live prod `/` listing carries both values. Values are never
    printed, logged, or written to an env file, settings, the relay outbox, or a receipt.
  - CLAUDE_INFISICAL_CLIENT_SECRET is in the vault and in this mirror, and
    capability_bind refuses it. The machine identity is used, never re-issued.
    CLAUDE_INFISICAL_CLIENT_ID is bindable. GITHUB_TOKEN stays the default GitHub
    credential; GITHUB_CLASSIC_PAT binds when the task needs that token.
  - Re-port: python3 ops/secrets/port_aws_to_infisical.py
  - BIRTH_SOURCE_APP_ID and BIRTH_SOURCE_APP_PRIVATE_KEY are the two factory
    Action names. l9-repo-template consumes them from GitHub repo var/secret,
    not from a local env file. Infisical `/` holds the same two names for
    agent bind. There is no other BIRTH_SOURCE_APP_* key.
  - L9_INTELLIGENCE_PATH_KEY and L9_INTELLIGENCE_PSEUDONYM_KEY are Infisical-native
    HMAC names at `/` (consumed by l9-intelligence ingest-sdk-finding-bundle). Each
    key MUST be at least 32 bytes, the two keys MUST differ, and both MUST remain
    stable across producers for the corpus lifetime (rotation re-pseudonymises later
    records and splits longitudinal joins). A structured copy may live at
    /aws/openclaw-igorbot/l9-intelligence-corpus/ (json keys path_key, pseudonym_key);
    that path is Infisical layout only — not an AWS Secrets Manager object, and none
    should be created. Bind gate is capability_bind.py --check (source=infisical).
    Not an AWS overlay.
  - Machine identity l9-manus-infisical (id e5465f49-9153-42b0-b4dd-4a08c90f42de)
    is the dedicated Manus Infisical principal. Project role is viewer on
    cursor-governance. Do not reuse the Cursor identity. Universal Auth is
    attached; the client secret is host-local only at
    ~/.config/l9-manus/infisical-client-secret.
  - memory_prod_secret_refs names secrets in Infisical project l9-graphite-memory.
    They are not root_env_keys and are not copied into project cursor-governance.
  - 2026-11-21 (lane MEM-HOOK-2) — the memory path's Cursor-Governance credentials
    are registered here as root_env_keys so their existence is known and SessionStart
    binds them — L9_MEMORY_HOOK_CLIENT_ID and L9_MEMORY_HOOK_CLIENT_SECRET (hosted
    hook carrier, ADR-0055) and L9_MEMORY_AGENT_AUTHORITY_JSON (the signed agent
    door that ops/memory/run_memory_mcp.sh mints at MCP spawn). ops/secrets/
    session_start_secrets.py reports each by name and source (env, infisical or
    unbound) with the resulting hook carrier, never a value. A listed name that is
    not yet in the vault reports unbound with a WARN; it is not a failure. The
    server-side L9_MEMORY_HOOK_PRINCIPALS_JSON lives in l9-graphite-memory (see
    memory_prod_secret_refs.hook_principals) and is never a Cursor-Governance bind.
  - Host credentials for 167.233.222.27 (igorbot-openclaw) were registered 2026-11-24 by
    ops/secrets/register_box_secrets.sh. Seven belong to the host and are listed in
    box_credential_refs - the root login key, the governance bearer token, the igorbot /
    SplitWisely / cognitive-runtime / l9-ops deploy keys, and the ivx tunnel key.
  - SplitWisely is a standalone product, so its values are not in this project. Its seven
    registered keys and eleven unconfigured placeholders are named in
    splitwisely_prod_secret_refs, outside the bind gate. The project exists as of 2026-11-24
    (slug split-wisely, id recorded there).
