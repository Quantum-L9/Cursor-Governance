# L9 Capability Broker deployment for Kubernetes
#
# Deploys the broker as a sidecar to Claude Code cloud environment.
# The broker authenticates to Infisical with Kubernetes ServiceAccount Auth,
# so NO static secrets (client ID/secret, AWS keys) are in this manifest.
#
# Prerequisites:
# 1. Create Infisical Identity with Kubernetes Auth:
#    infisical identities create kubernetes \
#      --name l9-capability-broker \
#      --service-account-namespace claude-code \
#      --service-account-name capability-broker
#
# 2. Grant that identity read access to the Cursor-Governance project secrets
#
# 3. Deploy this manifest:
#    kubectl apply -f ops/secrets/k8s/broker-deployment.yaml

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capability-broker
  namespace: claude-code
  labels:
    app: l9-capability-broker

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l9-capability-broker
  namespace: claude-code
  labels:
    app: l9-capability-broker
spec:
  replicas: 2  # HA for MCP availability
  selector:
    matchLabels:
      app: l9-capability-broker
  template:
    metadata:
      labels:
        app: l9-capability-broker
    spec:
      serviceAccountName: capability-broker
      containers:
      - name: broker
        image: python:3.12-slim
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          # Install dependencies
          pip install --no-cache-dir pyyaml pydantic jsonschema infisical-python
          
          # Clone governance repo (contains broker code + registry)
          git clone --depth 1 --branch main \
            https://github.com/Quantum-L9/Cursor-Governance.git /opt/governance
          
          # Run broker
          cd /opt/governance
          python3 ops/secrets/capability_broker.py serve \
            --audience ccpool_prod \
            --port 8787 \
            --bind 0.0.0.0
        env:
        - name: L9_BROKER_AUDIENCE
          value: "ccpool_prod"
        - name: INFISICAL_ADDRESS
          value: "https://app.infisical.com"
        - name: INFISICAL_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: infisical-bootstrap
              key: project_id
        # Kubernetes Auth uses the ServiceAccount token automatically
        # NO CLIENT_ID or CLIENT_SECRET here — that's the whole point
        ports:
        - containerPort: 8787
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8787
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8787
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: capability-broker
  namespace: claude-code
  labels:
    app: l9-capability-broker
spec:
  type: ClusterIP
  ports:
  - port: 8787
    targetPort: 8787
    protocol: TCP
    name: http
  selector:
    app: l9-capability-broker

---
# Optional: Ingress to expose broker outside cluster
# Only if you need external access (e.g., from local CLI during testing)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capability-broker
  namespace: claude-code
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app: l9-capability-broker
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - broker.quantumaipartners.com
    secretName: broker-tls
  rules:
  - host: broker.quantumaipartners.com
    http:
      paths:
      - path: /l9/capability
        pathType: Prefix
        backend:
          service:
            name: capability-broker
            port:
              number: 8787

---
# Secret containing Infisical project ID (NOT the client secret — that's K8s Auth)
# Create manually:
#   kubectl create secret generic infisical-bootstrap \
#     --namespace claude-code \
#     --from-literal=project_id=<INFISICAL_PROJECT_ID>
apiVersion: v1
kind: Secret
metadata:
  name: infisical-bootstrap
  namespace: claude-code
type: Opaque
# data:
#   project_id: <base64-encoded-project-id>
