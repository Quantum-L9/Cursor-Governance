# Schema for ops/secrets/*.registry.yaml (refs only — never secret values).
# schema_version: 1.0.0
#
# SSOT: Cursor-Governance. Synced from AWS Secrets Manager under namespace
# openclaw-igorbot/*; consumers (igorbot, bots, CI) depend on this file.

type: object
required: [schema_version, namespace, region_default, source, secrets]
properties:
  schema_version:
    type: string
    const: "1.0.0"
  namespace:
    type: string
    description: AWS Secrets Manager namespace prefix (openclaw-igorbot)
  region_default:
    type: string
    description: Default AWS region (us-east-1)
  source:
    type: object
    required: [authority, sync]
    properties:
      authority:
        type: string
        const: cursor-governance
      path: { type: string }
      sync:
        type: string
        enum: [aws_secrets_manager]
      region: { type: string }
      namespace_prefix: { type: string }
      synced_at: { type: string }
      note: { type: string }
  secrets:
    type: array
    items:
      type: object
      required: [secret_id, enabled, region, keys]
      properties:
        secret_id: { type: string }
        enabled: { type: boolean }
        region: { type: string }
        provisioned:
          type: boolean
          description: false when AWS secret is not yet created (overlay stubs)
        keys:
          type: array
          items:
            type: object
            required: [json_key]
            properties:
              json_key: { type: string }
              mode: { type: string }
              resolution_path: { type: string }
              config_path: { type: string }
              note: { type: string }
        origin:
          type: string
          enum: [aws_sm, governance_overlay, local_ssot]
        note: { type: string }
