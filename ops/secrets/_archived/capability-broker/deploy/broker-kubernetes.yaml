# ---------------------------------------------------------------------------
# L9 capability broker — reference Kubernetes deployment (contract §20, §21).
#
# THIS MANIFEST IS NOT APPLIED BY ANY AGENT. It is the operator-facing artifact
# that makes the required infrastructure explicit and reviewable. Applying it,
# and creating the matching Infisical machine identity, is a human/ops action.
#
# What this deployment exists to guarantee, and why each piece is here:
#
#   * The broker runs in its OWN pod, with its OWN ServiceAccount, in a
#     namespace no agent workload shares. That separation is the trust boundary
#     — a background process inside the agent's own sandbox would not be one
#     (contract §21), which is why there is no "run the broker locally" variant
#     of this file.
#
#   * The projected ServiceAccount token is mounted ONLY here. It is the
#     broker's workload identity to Infisical (Kubernetes Auth), it is
#     short-lived, and it is bound to this pod's lifetime. It must never be
#     mounted into an agent container.
#
#   * There is no Secret carrying INFISICAL_CLIENT_SECRET, and adding one would
#     defeat the purpose: the broker refuses to use a static Universal Auth
#     secret as its runtime credential (see workload_identity()).
#
#   * Egress is split. The broker may reach the secret backend and the
#     registered capability upstreams; the agent namespace may not.
#
# Operator prerequisites — none of which an agent can perform:
#   1. Create the Infisical machine identity and enable Kubernetes Auth on it.
#   2. Bind it to this ServiceAccount and namespace, with a least-privilege
#      project role scoped to the registered secret refs only.
#   3. Set INFISICAL_IDENTITY_ID below to that identity's id (an identifier,
#      not a credential).
#   4. Set L9_BROKER_AUDIENCE to the exact ccpool_<environment> of the
#      self-hosted Claude environment this broker serves.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: l9-broker
  labels:
    l9.trust/boundary: trusted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: l9-capability-broker
  namespace: l9-broker
  annotations:
    l9.trust/note: >-
      Workload identity for Infisical Kubernetes Auth. Bind ONLY this
      ServiceAccount in the Infisical identity's auth configuration, and never
      mount its token into an agent workload.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l9-capability-broker
  namespace: l9-broker
spec:
  replicas: 2
  selector:
    matchLabels: {app: l9-capability-broker}
  template:
    metadata:
      labels: {app: l9-capability-broker, l9.trust/boundary: trusted}
    spec:
      serviceAccountName: l9-capability-broker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: ghcr.io/quantum-l9/l9-capability-broker:REPLACE_WITH_IMAGE_DIGEST
          args: ["serve", "--bind", "0.0.0.0", "--port", "8787"]
          ports:
            - {name: http, containerPort: 8787}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            # Identifiers and endpoints only. There is deliberately no
            # `valueFrom.secretKeyRef` anywhere in this manifest.
            - {name: INFISICAL_IDENTITY_ID, value: "REPLACE_WITH_INFISICAL_IDENTITY_ID"}
            - {name: INFISICAL_PROJECT_ID, value: "REPLACE_WITH_INFISICAL_PROJECT_ID"}
            - {name: INFISICAL_SITE_URL, value: "https://app.infisical.com"}
            - {name: INFISICAL_ENV, value: "prod"}
            - {name: INFISICAL_SECRET_PATH, value: "/"}
            - {name: INFISICAL_K8S_SA_TOKEN_PATH, value: "/var/run/secrets/l9/infisical/token"}
            - {name: L9_BROKER_AUDIENCE, value: "REPLACE_WITH_ccpool_ENVIRONMENT_ID"}
            - {name: L9_BROKER_EXPECTED_ORG, value: "REPLACE_WITH_ORG_ID"}
          volumeMounts:
            - {name: infisical-identity, mountPath: /var/run/secrets/l9/infisical, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
      volumes:
        # Short-lived, audience-bound projected token. `expirationSeconds` keeps
        # the credential fresh; the audience stops it being replayed elsewhere.
        - name: infisical-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: infisical
                  expirationSeconds: 600
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: l9-capability-broker
  namespace: l9-broker
spec:
  selector: {app: l9-capability-broker}
  ports:
    - {name: http, port: 443, targetPort: http}
---
# Egress: the broker may reach the secret backend and registered capability
# upstreams. Agent namespaces get the mirror image of this — no secret backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: l9-capability-broker-egress
  namespace: l9-broker
spec:
  podSelector:
    matchLabels: {app: l9-capability-broker}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
