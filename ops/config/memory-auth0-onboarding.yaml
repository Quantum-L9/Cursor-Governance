schema: l9.memory-auth0-onboarding/v1
issuer:
  vendor: auth0
  sole: true
  # Operator-supplied Auth0 tenant domain. Unbound on purpose.
  domain: null
  issuer_url: null
  forbidden:
    - second_authorization_server
    - oauth_proxy
    - static_bearer
    - hmac
    - stdio
    - sqlite_fallback
resource:
  owner: Quantum-L9/l9-graphiti-memory
  # Published by Quantum-L9/l9-graphiti-memory as MEMORY_RESOURCE_IDENTIFIER
  # (ADR-100). The path is part of the audience. The host alone and the
  # Graphiti route are not this identifier.
  identifier: https://memory.quantumaipartners.com/mcp
  audience_equals_resource: true
pkce:
  required: true
  method: S256
  plain_forbidden: true
scopes:
  - memory.read
  - memory.write
clients:
  cursor-native:
    client_type: public
    token_endpoint_auth_method: none
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    client_secret: forbidden
    client_id: null
    redirect_uris:
      - https://www.cursor.com/agents/mcp/oauth/callback
      - http://localhost:8787/callback
      - cursor://anysphere.cursor-mcp/oauth/callback
  claude-account-connector:
    client_type: public
    token_endpoint_auth_method: none
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    client_secret: forbidden
    client_id: null
    project_mcp_entry: false
    hosted_credential_injection: false
    redirect_uris:
      - https://claude.ai/api/mcp/auth_callback
