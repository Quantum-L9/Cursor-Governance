schema: l9.memory-auth0-onboarding/v1
issuer:
  vendor: auth0
  sole: true
  # Read live from the Memory protected-resource metadata
  # (/.well-known/oauth-protected-resource/mcp, 2026-11-21). The trailing
  # slash is part of the issuer string Auth0 puts in `iss`.
  domain: quantum-ai-partners.us.auth0.com
  issuer_url: https://quantum-ai-partners.us.auth0.com/
  forbidden:
    - second_authorization_server
    - oauth_proxy
    - static_bearer
    - hmac
    - stdio
    - sqlite_fallback
resource:
  owner: Quantum-L9/l9-graphiti-memory
  # Published by Quantum-L9/l9-graphiti-memory as MEMORY_RESOURCE_IDENTIFIER
  # (ADR-100). The path is part of the audience. The host alone and the
  # Graphiti route are not this identifier.
  identifier: https://memory.quantumaipartners.com/mcp
  audience_equals_resource: true
pkce:
  required: true
  method: S256
  plain_forbidden: true
scopes:
  - memory.read
  - memory.write
clients:
  cursor-native:
    client_type: public
    token_endpoint_auth_method: none
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    client_secret: forbidden
    client_id: nj06T2YsyZA1z7om0hoHc8DlmNjaZwz6
    redirect_uris:
      - https://www.cursor.com/agents/mcp/oauth/callback
      - http://localhost:8787/callback
      - cursor://anysphere.cursor-mcp/oauth/callback
  claude-account-connector:
    client_type: public
    token_endpoint_auth_method: none
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    client_secret: forbidden
    client_id: vsSOWGaSeq5pYtYC82kTWmNV1AwCYqRJ
    project_mcp_entry: false
    hosted_credential_injection: false
    redirect_uris:
      - https://claude.ai/api/mcp/auth_callback
  manus-native:
    # Manus MCP connector. Registered 2026-11-21 with no dynamic client
    # registration: public PKCE client, no secret, no project entry.
    # The callback is Manus's own MCP OAuth endpoint, not a loopback URI.
    client_type: public
    # Auth0's app type, not a repo concept. `native` refuses a hosted `https`
    # callback with `400 invalid OAuth callback` even when the URI is in the
    # allowlist, because a native callback is expected to be a custom scheme or
    # loopback. `spa` keeps every public-client property below and accepts the
    # hosted callback. Re-registering this client as `native` re-breaks login.
    app_type: spa
    token_endpoint_auth_method: none
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    client_secret: forbidden
    client_id: lIY0hERvmh34BZK0veLKtEtZm4qf9Beb
    # Auth0 client grants carry a subject lane. A grant created without
    # `subject_type` lands in `client` (machine-to-machine), and /authorize then
    # answers `not authorized to access resource server` for a user-delegated
    # flow. This client holds both lanes; only the `user` lane authorizes login.
    grant_subject_type: user
    project_mcp_entry: false
    hosted_credential_injection: false
    redirect_uris:
      - https://manus.im/api/webhook/mcp/callback
  l9-memory-hooks:
    # Hosted hook principal (ADR-0055; l9-graphiti-memory REMOTE_MCP_CONTRACT §2b).
    # client_id is public, not a secret; it is bound once the Auth0 app exists.
    # Its secret is never named here; it lives only in Infisical
    # (L9_MEMORY_HOOK_CLIENT_ID / _SECRET, project cursor-governance, prod /).
    client_type: confidential
    app_type: non_interactive
    token_endpoint_auth_method: client_secret_post
    grant_types:
      - client_credentials
    audience_grant_scopes: []
    client_id: qehad9nMEsfOjaH9cBumGuj5RP27MrSN
