# Autonomy Surface Profile — SSOT for adapter A4 velocity + L4 local autonomy.
# Consumers (must not fork prose): CANONICAL_LAW (cite), project_llm_rules.py,
# SessionStart, peer boot carriers, ADR-0001 (pointer).
schema_version: 1
id: autonomy_surface_profile
updated: "2026-08-29"

when:
  L9_AUTONOMY_ENABLED: true
  # Cursor is excluded from ask-free push velocity — ask-first + campaign packet /
  # make pr remain. L4 local-autonomy remote gate still applies on Cursor shell.
  L9_GOVERNANCE_SURFACE:
    - claude-code
    - codex
    - gemini
    - manus

authorize:
  - scoped_local_commit_on_stacked_branch
  - scoped_commit_push # only after L4 release_authorized (see l4_local_autonomy)
  - create_update_pr_via_make_pr # only after L4 release_authorized; checkers must PASS
  - pr_remediation_until_green_mergeable_and_merged # /l9-pr-remediation Converge
  # Remediator velocity: already-open PR branch. Not a first publish. Effect
  # plane (git_guardrails) still denies force-push / protected-branch rewrite.
  - remediator_git_push_of_open_pr # git push + non-destructive git; not make pr
  - remediator_non_destructive_git # status, fetch, diff, log, pathspec add, commit, merge
  - open_stacked_pr_on_open_pr_head # stacking policy; bottom-up merge order

forbid:
  # Path rules: denied at EVERY phase, including release_authorized, because
  # they reach GitHub without the Makefile checkers. Enforced by
  # ops/autonomy/local_execution_gate.py and mirrored into the adapter
  # settings deny-list (validate_claude_env.py fails if the two disagree).
  #
  # `git` and `gh` are deliberately NOT on this list. They are exempt from the
  # workflow plane (ops/autonomy/git_execution_exemption.py) and answer to the
  # effect plane instead (ops/autonomy/git_guardrails.py), which denies an
  # unrecoverable mutation of sensitive state whatever the command is called.
  # See CANONICAL_LAW §6.2.4. Listing them here would restate an enforcement
  # that does not exist — and validate_claude_env.py fails the build if the
  # adapter deny-list blocks them.
  - make_push_outside_make_pr
  - mcp_create_pull_request_or_push_files
  # Timing rules: governed by the L4 release receipt. These bind the sanctioned
  # publish path and the MCP write tools. A raw `git push` mid-execution is off
  # doctrine but is not mechanically denied — see the git/gh note above.
  - mid_execution_push
  - mid_execution_pr_create
  - merge_pull_request_without_l9_pr_remediation
  - gh_pr_merge_without_l9_pr_remediation
  - admin_merge
  - force_push
  - hard_reset
  - secrets_exfil
  - pacing_stalls_for_push_approval_during_local_execution
  - merge_before_green_and_mergeable
  - rebase_for_pr_stacking
  - conflict_resolution_for_pr_stacking
  - pr_against_main_for_campaign_work
  - mix_campaign_work_onto_unrelated_feature_branch

# Surface execution personality — Claude unleashed, Cursor constrained.
# Values live in ops/autonomy/claude-execution-profiles.json (stdlib-readable at
# SessionStart); resolver: ops/autonomy/execution_profile.py. Do not fork the
# numbers here.
# CI-102 R1 (WIP/8-26-26/.../p307_revised): record the REST route as a sanctioned
# surface capability here and in rule 62, so the next gh-dependent gate does not
# reproduce the original stall. Observed rows live in docs/DEGRADED_MODE_CONTRACT.md;
# this key names the CONTRACT, not the measurements.
surface_capabilities:
  github:
    credential_model: >-
      model-controlled surfaces hold no credential of their own. No Infisical import,
      no PAT, no bearer. The capability broker that was to bridge this never shipped
      and is retired — see docs/DEGRADED_MODE_CONTRACT.md. Rule 62's PAT-resolution
      clause therefore does not apply on such a surface.
    mechanism_not_asserted: >-
      On a model-controlled surface the credential reaching GitHub is supplied outside
      this repository's control. What supplies it is NOT asserted here, because the
      repository cannot verify it. Record the probe, not a theory — an earlier draft of
      this key named a capability broker that had already been retired as never-shipped.
    measurements: docs/DEGRADED_MODE_CONTRACT.md  # dated, per-container; not duplicated here
    sanctioned_transports:
      - id: gh_api
        form: "gh api <endpoint>"
        note: REST. On a credential-holding surface this is the same openclaw PAT
          (rule 62); on a model-controlled surface it succeeds without the session
          holding a valid token. Either way it is the sanctioned route.
      - id: mcp_github_tools
        form: "mcp__github__*"
        note: typed tools over the same route. Subject to the usual write-tool path
          rules in `forbid` above — naming a transport here grants no new write
          authority.
    not_a_capability_probe:
      - id: gh_auth_status
        rule: never gate on this command's exit code
        why: >-
          Its exit code is not a stable signal: containers of this surface class have
          returned different exit codes for the same "token invalid" message while
          `gh api` worked in both. A script gating on it is wrong in both directions
          and which direction is not predictable. Dated rows are in
          docs/DEGRADED_MODE_CONTRACT.md. Probe the endpoint you need (`gh api user`,
          or the specific route) instead of gating on this command.
    scope: >-
      This key names which GitHub TRANSPORT is sanctioned. It says nothing about the
      publication path — `make pr` remains the sanctioned route (see campaign_execution
      and l4_local_autonomy) — and it confers no merge authority.

claude_execution_profiles:
  policy: ops/autonomy/claude-execution-profiles.json
  resolver: ops/autonomy/execution_profile.py
  surfaces: [cursor, claude_local, claude_cloud]
  cloud_discriminator: CLAUDE_CODE_REMOTE=true
  claude_default: maximum_velocity
  cursor_default: constrained
  enforced_by: environment/agents/adapters/claude-code/validate_claude_env.py

# L4 Local Autonomy — standing doctrine (all surfaces; mechanically gated).
# Default ON (L9_L4_LOCAL_AUTONOMY=1). Brain: ops/autonomy/l4_local.py +
# ops/autonomy/local_execution_gate.py.
l4_local_autonomy:
  enabled_default: true
  env_disable: L9_L4_LOCAL_AUTONOMY=0
  env_breakglass: L9_LOCAL_PUSH_AUTHORIZED
  state_path: .l9/autonomy/l4-local-phase.json
  receipt_path: .l9/autonomy/l4-release-receipt.json
  cli: ops/autonomy/l4_local.py
  gate: ops/autonomy/local_execution_gate.py
  flow:
    - begin_on_stacked_feature_branch
    - commit_locally_through_program_or_contract # no remote
    - authorize_release
    - push_and_open_pr_via_make_pr # remediates=1; checkers in Makefile
  kernel_hook:
    owner: ops/autonomy/kernel_gate.py
    fires: first_step_of_precommit_repo
    skip_unless_adapter_surface: true
    note: >-
      Not an L4 phase. Fail-closed before any other hook or test so
      checkers run once on the post-kernel tree. Adapter surfaces
      (claude-code / codex / gemini / manus) apply tree kernels on
      make pr. Cursor (`CURSOR_AGENT` / `L9_GOVERNANCE_SURFACE=cursor` /
      unset) skips the tree latch. WIP/, docs/plans/, and
      environment/program-execution/campaigns/ are /ff corpus surfaces
      (Improve then Recursive Alignment then Validate & Repair); this
      hook skips those prefixes and skips the tree latch when the whole
      changeset is corpus-only.
  required_kernels:
    - path: kernels/Recursive Alignment.md
      id: recursive_alignment
    - path: kernels/Validate & Repair.md
      id: validate_repair
  pr_template: PULL_REQUEST_TEMPLATE.md
  post_push:
    required_command: make pr
    remediation_skill: l9-pr-remediation
    max_cycles: 5
    resolve_review_threads: true
    merge_requires: l9_pr_remediation_invocation
    halt_before_merge: campaign_only
    older_open_prs: merge_bottom_up

# Stacked-PR policy (operator default 2026-08-15): when a PR is already open,
# the next PR stacks on top of its head. Merges are bottom-up; rebasing and
# conflict resolution are forbidden — disjoint scopes keep the stack mergeable.
pr_stacking:
  first_pr_base: pr_base_or_main
  subsequent_pr_base: open_pr_head
  merge_order: bottom_up
  rebase: forbidden
  conflict_resolution: forbidden
  single_feature_branch_per_program: true
  exclusive_worktree_lease_per_agent: true
  helper: ops/scripts/stack_pr.py
  pr_overlap:
    mode_default: block # PR_OVERLAP env: block | warn | ignore
    exemptions: generated_path_prefixes # ops/scripts/sync_generated_artifacts.py SSOT
    probe: git_merge_tree # git merge-tree --write-tree textual-conflict probe
    auto_stack_env: PR_STACK # auto: start on the unique open-PR tip; PR_STACK= keeps main
    gate_resolves_tip: true # pr-preflight / pr-check / open_pr bind resolve_stack_tip.py when PR_STACK=auto
    gate: ops/scripts/pr_overlap_check.py
  # GITHUB_REST_ROUTE_V1 — same openclaw PAT; not a second secret.
  github_rest:
    pat_ref: openclaw-igorbot/github#token
    sanctioned_routes:
      - gh
      - gh api # REST fallback when GraphQL is 403; same token
    second_pat: forbidden
  phases:
    executing: deny_remote
    kernels_recorded: deny_remote
    release_authorized: allow_scoped_push_and_pr

# Program Execution campaigns — one integration branch each; PRs land there.
# SSOT companion: environment/program-execution/campaigns/CAMPAIGN_EXECUTION_POLICY.yaml
campaign_execution:
  # Campaign execution is permanently local-commit-only: prepare, execute,
  # validate, verify, local commits, STOP. Publication is never a campaign
  # stage; it is root `make pr` (remediates=1), and merge is /l9-pr-remediation.
  # L9_PE_RELEASE_AUTHORIZED survives as a diagnostic compatibility name only
  # and cannot widen Program Execution authority.
  local_commit_only: true
  completion_boundary: execute
  push: forbidden
  pull_request: forbidden
  require_make_pr: false # publication left the campaign path entirely
  pr_remediate: 1
  merge: forbidden # merge authority belongs to /l9-pr-remediation
  open_pr_against_main: forbidden
  mix_with_other_feature_branches: forbidden
  one_integration_branch_per_campaign: true
  pr_base: campaign_integration_branch
  single_feature_branch_off_main_per_program: true
  exclusive_worktree_lease_per_agent: true
  campaigns:
    bounded-replanning-v1:
      integration_branch: campaign/bounded-replanning-v1
    cc-pe-intent-compiler-v1:
      integration_branch: campaign/cc-pe-intent-compiler-v1
    l9-devpack-program-execution-hardening:
      integration_branch: campaign/l9-devpack-program-execution-hardening
    l9-ecosystem-fix-plan:
      integration_branch: campaign/l9-ecosystem-fix-plan
    pe-router-capability-safety-v4:
      integration_branch: campaign/pe-router-capability-safety-v4
    eie-inference-isolation-v1:
      integration_branch: campaign/eie-inference-isolation-v1

      lifecycle: in_progress
      launched_by: make campaign
authority_order:
  - CANONICAL_LAW.autonomy_velocity
  - CANONICAL_LAW.l4_local_autonomy
  - CANONICAL_LAW.campaign_execution_pr_no_merge
  - ADR-0001
  - settings.allow_deny + ops.merge_gate + ops.local_execution_gate
  - AGENTS.md
  - skills
  - agent_invented_contracts

remediation:
  skill: l9-pr-remediation
  max_cycles: 5
  skill_invocation: converge_all_open_prs_then_merge
  merge: authorized_on_skill_invocation
  scope: all_open_prs_in_target_repo
  authorize_script: ops/autonomy/authorize_merge.py
  note: >-
    Campaigns and make pr publish remote PRs that MUST end green and
    merge-ready. They do not merge. Invoking /l9-pr-remediation (Converge)
    is merge authorization for every open PR in the target repo: write
    the repo-scoped receipt, remediate to green + mergeable, then
    `ops/autonomy/stack_safe_merge.py --repo <owner/name> --pr <n> --run`
    bottom-up (method chosen in code: --merge for a stack parent,
    --squash only for a leaf). Force-push and admin-merge stay
    forbidden. L9_MERGE_AUTHORIZED remains a human breakglass.

session_start_block: |
  ## Autonomy Velocity Doctrine (standing A4 + L4 local)

  Surface: governed LLM adapter (`L9_GOVERNANCE_SURFACE` ≠ cursor) for ask-free
  velocity. L4 local-autonomy remote gate applies on **all** surfaces.

  **One finish, all surfaces** (Cursor, Claude Code desktop, Claude Code
  Mobile): finished work → scoped-commit (pathspecs; rule 49) →
  `python3 ops/autonomy/l4_local.py begin` (if not begun) →
  `authorize-release` → `PR_REMEDIATE=0 make pr` / `l9 pr`. Do not run
  `make precommit-repo` then `make pr`. Receipt skip already prevents a
  second pytest on an unchanged tree. Combined `beforeShellExecution` is
  Cursor-only; Claude uses PreToolUse (`local_execution_gate_wrap.py`).
  Tree kernels skip on Cursor (`kernel_gate.py`); desktop and Mobile
  still fire them on `make pr`.

  When `L9_AUTONOMY_ENABLED=true` (default on adapter surfaces):

  - Proceed in **L4 local autonomy**: commit on a stacked feature branch with
    **no mid-execution push** and no useless push-approval pacing.
  - Start that branch from the unique open-PR stack tip when `PR_STACK=auto`
    (`ops/scripts/agent_worktree_start.sh`). Do not invent an `origin/main`
    fork and restack at `make pr`. Empty `PR_STACK` still uses `origin/main`.
  - YOU ARE AUTHORIZED to scoped local `git commit` without per-action ask
    on **every** surface, including Cursor. Ask only before a raw `git push`
    / `gh pr create` that is not the finish path. Finished work is
    `PR_REMEDIATE=0 make pr` / `l9 pr`.
    Registry: `environment/contracts/autonomy/MANIFEST.yaml`.
    - After the program/contract finishes locally on **every** surface:
    `python3 ops/autonomy/l4_local.py begin` (if not begun) →
    `authorize-release` → `PR_REMEDIATE=0 make pr` / `l9 pr`. Tree kernels
    (`kernels/Recursive Alignment.md`) are not an L4 phase. They fire as
    the first step of `make pr` (`ops/autonomy/kernel_gate.py`) on adapter
    surfaces so hooks and tests run once. Cursor skips that tree latch.
  - **Campaign first publish is `make pr`.** That is a path rule for opening
    a PR, not a remediator deny. `/l9-pr-remediation` publishes an
    already-open PR with `make precommit-repo` then `git push` (and other
    non-destructive git). The execution gate must not workflow-deny those
    git/gh forms — including `make precommit-repo && git push` and
    `git push | tail`. `make push` and the MCP `create_pull_request` /
    `push_files` tools stay denied at every phase. Force-push stays
    effect-denied. Do not use `L9_PUBLISH_PATH_OVERRIDE` as the remediator
    path. When campaign `make pr` fails, fix what it reported.
  - **`make pr` runs the GOVERNANCE Makefile, regardless of the repo worked in
    or its Makefile.** The environment always uses the
    `Quantum-L9/Cursor-Governance` Makefile as the publish authority; the repo
    you are working in is the *workspace* (`WS=$PWD`), never the source of the
    `pr` target. The dispatcher already binds this: `l9 pr` is
    `make -C "$GOV" pr WS="$PWD"` (`environment/agents/adapters/claude-code/bin/l9`).
    From a consumer checkout with no local `pr` target, publish with
    `l9 pr` (equivalently `make -C "$GOV" pr WS="$PWD"`) — **not** a bare
    `make pr` that would read the consumer's own Makefile, and **not** a raw
    `git push` fallback. A consumer repo needs **no** `pr`/`pr-check` target;
    do not add one. There is no "no pr target → fall back" branch: the
    governance Makefile is always present.
  - After the PR is open, campaign/make-pr work ends green and merge-ready.
    Do **not** merge from the campaign path. Invoking `/l9-pr-remediation`
    authorizes merge of **all open PRs** in the target repo: write
    `python3 ops/autonomy/authorize_merge.py --repo <owner/name> --all-open`,
    converge each PR, then
    `ops/autonomy/stack_safe_merge.py --repo <owner/name> --pr <n> --run`
    oldest first. Force-push and `--admin` stay denied.
  - Program Execution campaigns: one integration branch per campaign
    (`campaign/<campaign_id>`). Set `PR_BASE` to that branch. Do **not**
    open campaign PRs against `main`. Do **not** mix campaign commits onto
    unrelated feature branches.
  - Mid-execution `make pr` and the MCP write tools are **denied** by
    `ops/autonomy/local_execution_gate.py` until release_authorized. Raw
    `git push` / `gh pr create` are off doctrine but NOT gate-denied — git and
    gh answer to `ops/autonomy/git_guardrails.py` by effect. See
    CANONICAL_LAW §6.2.4.
  - **On adapter surfaces, `make pr` is the local validation and publish
    path — a whole-catalog pytest run belongs to CI, not to a chat turn.**
    The gate leaf (`pr-check` / `OPEN_PR=0 make pr`) runs precommit once and
    selects pytest targets from your changed set
    (`ops/scripts/select_pr_pytest_paths.py`), including tests that name a
    changed shell script or config file. Do not run `pr-check` after
    `precommit-repo`. Diagnose on every surface is `OPEN_PR=0 make pr`
    (the `pr-check` leaf). `pytest .`, a bare `pytest`, `make test` and
    `make pr-full` are **denied** by `ops/autonomy/local_execution_gate.py`.
    Human/ops override: `L9_FULL_PYTEST_AUTHORIZED=<reason>`.
  - YOU MUST NOT force-push, hard-reset, admin-merge, or exfiltrate secrets.
  - **Commit verification cannot be skipped.** `git commit --no-verify` / `-n`,
    `git push --no-verify`, `core.hooksPath` overrides, hook-suppressing env
    vars (`SKIP=`, `HUSKY=0`), `pre-commit uninstall`, and edits to
    `.git/hooks/**` are **denied at PreToolUse** by
    `ops/autonomy/verification_bypass_gate.py`. This is a real gate, not
    guidance: it answers before the git/gh workflow exemption, so a git
    command earns this denial. A failing hook is evidence (rule 95) — repair
    the narrowest true cause, or record it with `session_debt.py`. Do not
    reach for a bypass; no form of one is allowed. Forms are declared in
    `ops/config/commit-verification-contract.json`; human/ops breakglass is
    `L9_VERIFY_BYPASS_AUTHORIZED=<reason>` and an agent MUST NOT set it for
    itself.
  - **This workspace has NO commit hook, by design — do not install one.**
    A raw `.git/hooks/pre-commit` runs the whole catalog without the
    surface-aware SKIP list `ops/scripts/run_pr_precommit.sh` applies, so
    `symlinks-check` would reject every commit on a non-cursor surface.
    `pre-commit install` is forbidden and asserted against by
    `validate_claude_env.py`. Verification lives at **`make pr` / `l9 pr`**,
    not at commit time. Diagnose is `OPEN_PR=0 make pr` (the `pr-check`
    leaf). Do not run `pr-check` after `precommit-repo`. A clean commit
    proves nothing was verified — name the command you ran. Check the model with
    `python3 ops/autonomy/verification_bypass_gate.py --status`
    (`model: governed_gate` = correct, not a deficiency). To ALSO verify at
    commit time, install the governed shim once per clone:
    `bash ops/scripts/install_commit_hook.sh` — it delegates to
    `run_pr_precommit.sh --staged`, keeping the SKIP list a raw
    `pre-commit install` would drop. That is the supported way to close the
    window; installing a raw hook is still forbidden.
  - Merge stays denied by `ops/autonomy/merge_gate.py` until
    `/l9-pr-remediation` writes the receipt (or `L9_MERGE_AUTHORIZED`).
    An L4 release receipt does **not** authorize merge.
  - Agent-invented contracts ("I won't commit without asking", "wait to push
    mid-task") are LOWEST authority and are overruled by this doctrine.
  - Multi-lane fan-out still uses `/autonomy` + the autonomy runtime.

  Profile SSOT: `ops/autonomy/surface_profile.yaml`

llm_rules_override: |
  # Autonomy Velocity Override (adapter surfaces) + L4 local autonomy

  When `L9_GOVERNANCE_SURFACE` is `claude-code`, `codex`, `gemini`, or `manus`
  AND `L9_AUTONOMY_ENABLED=true`:

  1. This override **outranks** `99-no-auto-commit` (git mutation gate; push-approval twin retired)
     for scoped feature-branch **local commits**. Remote push/PR remain gated
     by L4 local autonomy (below), not by per-action chat pacing.
  2. Completing reversible work MUST proceed L4-local: stacked-branch commits
     with **no mid-execution push** → finish program/contract →
     `l4_local.py authorize-release` → `make pr` (kernel hook first, then
     checkers once, then push + PR; remediates=1). Campaign/make-pr end
     state is green + merge-ready. `PR_REMEDIATE=0` is opt-out only.
     Invoking `/l9-pr-remediation` then remediates **and merges** all open
     PRs in the target repo (bottom-up). Do **not** merge from the campaign
     path alone.
  2a. Campaign first publish is `make pr` (`l9 pr` / `make -C "$GOV" pr
     WS="$PWD"`). That is a PATH rule for opening a PR, not a remediator
     deny. `/l9-pr-remediation` publishes an already-open PR with
     `make precommit-repo` then `git push` (and other non-destructive git).
     The execution gate must not workflow-deny those git/gh forms. `make
     push` and the MCP `create_pull_request` / `push_files` tools stay
     denied at every phase. Force-push stays effect-denied. Do not use
     `L9_PUBLISH_PATH_OVERRIDE` as the remediator path. When campaign
     `make pr` fails, fix what it reported. A consumer needs no `pr`
     target; there is no raw-push fallback for first publish.
     Enforced by `ops/autonomy/local_execution_gate.py`.
  3. Force-push / hard-reset / admin-merge / secrets remain forbidden.
  3a. Commit verification is not skippable. `git commit --no-verify` / `-n`,
     `git push --no-verify`, `core.hooksPath` overrides, `SKIP=` / `HUSKY=0`
     on a commit, `pre-commit uninstall`, and `.git/hooks/**` edits are
     denied at PreToolUse by `ops/autonomy/verification_bypass_gate.py`
     (contract `l9-commit-verification-integrity`, declared in
     `ops/config/commit-verification-contract.json`). Repair what the hook
     reported; breakglass `L9_VERIFY_BYPASS_AUTHORIZED=<reason>` is human/ops
     only.
  4. Campaign work uses `campaign/<campaign_id>` as `PR_BASE`. Do not open
     campaign PRs against `main`. Do not mix with other feature branches.
  5. Cursor surface (`L9_GOVERNANCE_SURFACE` is `cursor` or unset) MUST scoped-commit locally
     after each authored chunk (pathspecs; rule 49).
     Unique dirty files you authored are a rule failure. Do not ask.
     After finished work: `authorize-release` then `PR_REMEDIATE=0 make pr` /
     `l9 pr`. Do not run `make precommit-repo` then `make pr`. Tree kernels
     skip on Cursor; adapters still fire them on `make pr`. L4 remote gate
     still blocks mid-execution push.
  6. Source of truth: `ops/autonomy/surface_profile.yaml` — do not fork this text.

  ## L4 Local Autonomy (all surfaces; default ON)

  - `L9_L4_LOCAL_AUTONOMY=1` (default): deny `git push`, `gh pr create`, and
    `make pr` until `.l9/autonomy/l4-release-receipt.json` authorizes release.
  - Shared-worktree isolation (default ON): deny `git revert`, `git reset`,
    branch `checkout`/`switch`, broad `git add -A/--all/./-u`, and
    `git diff --name-only | … git add` scoop loops that destroy parallel
    agents' dirty files (2026-08-12 plan.md + branch-thrash incident).
  - Enforcement: `ops/autonomy/local_execution_gate.py` +
    `worktree_isolation_gate.py` (Claude PreToolUse + Cursor beforeShellExecution).
  - CLI: `python3 ops/autonomy/l4_local.py {begin|authorize-release|status}`.
    Kernels: `python3 ops/autonomy/kernel_gate.py {record|precommit}`
    (tree latch on adapter `make pr`; Cursor skips it).
  - Breakglass: `L9_LOCAL_PUSH_AUTHORIZED=<reason>` or `L9_L4_LOCAL_AUTONOMY=0`;
    isolation: `L9_GIT_REVERT_AUTHORIZED` / `L9_GIT_BROAD_ADD_AUTHORIZED` /
    `L9_GIT_SWITCH_AUTHORIZED` / `L9_GIT_RESET_AUTHORIZED` /
    `L9_WORKTREE_ISOLATION=0`.
  - Post-push (all surfaces after L4 release): `PR_REMEDIATE=0 make pr` /
    `l9 pr` to a green merge-ready PR. Merge only after `/l9-pr-remediation`
    writes `ops/autonomy/authorize_merge.py --all-open` and each PR is green +
    mergeable. Force-push / admin-merge stay forbidden. Tree kernels skip
    on Cursor; Claude Code desktop and Mobile still apply them on `make pr`.
  - Stacked PRs: when a PR is already open for the workstream, the next PR
    bases on the open PR's head (bottom-up merge order). Rebase and conflict
    resolution are forbidden; one feature branch per program.

  ## Scratch hold / sacred WIP (never-lose)

  - Never park `WIP/**` under `/tmp` or `.l9/scratch-hold/` to clean `make pr`.
  - Shell gate denies WIP→/tmp moves, `rm -rf WIP`, `/tmp/cg-*-hold*` creation.
