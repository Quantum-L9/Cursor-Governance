# Graphiti + Neo4j for Cursor agent memory (GlobalCommands ops/graphiti)
# Loopback bind only — access via Tailscale from Mac
# Usage: source graphiti.env && docker compose up -d
#
# graphiti-mcp image LOCKED to zepai/knowledge-graph-mcp (MCP/streamable-HTTP
# transport, serves /mcp + /health). zepai/graphiti:latest is a DIFFERENT REST
# API server with no /mcp endpoint — do not swap back, that was the 2026-07-27
# outage (client got HTTP 404 on every tool call). Verified live on C1.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphiti-neo4j-cursor
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512M"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:1.0.2-graphiti-0.28.2-standalone
    container_name: graphiti-mcp-cursor
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: "${OPENAI_API_KEY:?set OPENAI_API_KEY}"
      MODEL_NAME: gpt-4o-mini
      EMBEDDER_MODEL: text-embedding-3-small
      GRAPHITI_GROUP_ID: main
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "10"
      CONFIG_PATH: /app/mcp/config/config.yaml
      GRAPHITI_MCP_TOKEN: "${GRAPHITI_MCP_TOKEN:?set GRAPHITI_MCP_TOKEN}"
    volumes:
      - ./config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["uv", "run", "main.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
