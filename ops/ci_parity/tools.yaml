# CI-parity tool pins and lanes for hosted Claude Code sessions.
#
# The single place these versions live. install.py installs exactly these;
# run.py refuses a tool whose installed version differs. `ci_ref` records the
# CI evidence a pin mirrors; validate_manifest.py fails when the recorded CI pin
# line changes without this file being re-pinned, so local parity cannot drift
# silently from what CI runs. A ci_ref with `repo:` names a file in another
# repository (l9-ci-core): the offline check skips it, `--remote` reads it over
# the network, and make pr runs `--remote` as a warning.
#
# `track: ci_ref` makes a tool follow its CI file instead of the hand pin:
# install.py installs the one revision `ci_ref.extract` (a regex with a
# `version` group) finds there and records it in state.json, so a CI bump needs
# no re-pin here. `version` stays the reviewed fallback for when the CI file is
# unreadable, and `contains` stays the exact evidence of that fallback.
#
# Cursor never reads this file: the runner is wired only from Claude hooks and
# a Claude-guarded make pr wave entry (see README.md).
schema: l9.ci-parity.tools.v1
install_root: ~/.local/share/l9-ci-parity
bin_dir: ~/.local/bin
cache_root: ~/.cache/l9-ci-parity

tools:
  codeql:
    version: 2.27.4
    method: release_archive
    url: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.4/codeql-bundle-linux64.tar.gz
    sha256: 89ed56c8ec6bfccef6a0d2e7fe86da0469ca24b4db08b88016ec134b942c17a4
    binary: codeql/codeql
    version_cmd: [version, --format=terse]
    expect: 2.27.4
    ci_ref:
      path: .github/workflows/codeql.yml
      contains: 24f0c4db99ba3ba170e5f872cd1c402684e47b81
      observed: "codeql-action v4.39.3 33d7b85d defaults.json pins CLI 2.27.4; caller pin grants actions write so the overlay-base cache can be saved"
  actionlint:
    version: 1.7.12
    method: release_archive
    url: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
    sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    binary: actionlint
    version_cmd: [-version]
    expect: 1.7.12
  shellcheck:
    version: 0.11.0
    method: release_archive
    url: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
    sha256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    binary: shellcheck-v0.11.0/shellcheck
    version_cmd: [--version]
    expect: "version: 0.11.0"
  osv-scanner:
    version: 2.6.0
    method: release_binary
    url: https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
    sha256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    binary: osv-scanner
    version_cmd: [--version]
    expect: 2.6.0
  biome:
    version: 2.5.8
    method: release_binary
    url: https://github.com/biomejs/biome/releases/download/%40biomejs%2Fbiome%402.5.8/biome-linux-x64
    sha256: 17abac7ef72e7a1aaccd89892f7e2e62c9919d27473defe772be04ad78400ac2
    binary: biome
    version_cmd: [--version]
    expect: 2.5.8
    ci_ref:
      path: biome.json
      contains: schemas/2.5.8/schema.json
      observed: >-
        Analyze (central Core) runs `biome ci` in blocking mode with Core's
        install-biome lock biome-2.5.8.json, whose linux-x64 sha256 is this one
        (l9-ci-core main, 2026-11-06). Core's toolchain alignment reports
        biome.json drifting from that lock.
  semgrep:
    version: 1.186.0
    method: uv_tool
    package: semgrep
    binary: semgrep
    version_cmd: [--version]
    expect: 1.186.0
    ci_ref:
      repo: Quantum-L9/l9-ci-core
      ref: main
      path: .github/actions/install-consumer-ci/toolchain-lock.json
      contains: '"semgrep": "1.186.0"'
      observed: >-
        Analyze (central Core) installs exactly this version from Core's
        hash-locked install-semgrep/locks/semgrep-1.186.0.txt, activated
        org-wide by l9-ci-core #339 (acb73463, 2026-11-21).
  l9-ci:
    # The CI SDK Core runs for its Semgrep gate. Kept in its own tool
    # environment: l9-ci pins jsonschema==4.26.0 and semgrep 1.186.0 needs
    # <4.26, so the two cannot share one (Core installs them separately too).
    # The version is the SDK commit; uv installs exactly that revision. It
    # tracks the revision Core provisions (track: ci_ref), so Core's SDK
    # bumps reach make pr without a re-pin; this hand pin is the fallback.
    version: 4a887396990a59ffb4a7108790b2fa1005c7865d
    track: ci_ref
    method: uv_tool
    package: git+https://github.com/Quantum-L9/l9-ci-sdk
    binary: l9-ci
    version_cmd: [gate, evaluate, --help]
    expect: --strict-unresolved
    ci_ref:
      repo: Quantum-L9/l9-ci-core
      ref: main
      # Core's SDK source of truth since org-ci.yml stopped carrying the
      # revision; .github/actions/provision-sdk/action.yml mirrors it.
      path: .l9/sdk-compatibility.yaml
      contains: "revision: 4a887396990a59ffb4a7108790b2fa1005c7865d"
      # `default.revision` only: the `supported:` list also names revisions
      # (the default again plus a tested rollback), so the match is anchored
      # to the top-level `default:` block.
      extract: '(?m)^default:\n(?:[ \t]+[^\n]*\n)*?[ \t]+revision:[ \t]*(?P<version>[0-9a-f]{40})'
      observed: >-
        .l9/sdk-compatibility.yaml default.revision provisions the SDK for
        Analyze (central Core), read at l9-ci-core main 3d1288f, 2026-11-23.
  zizmor:
    version: 1.30.1
    method: uv_tool
    package: zizmor
    binary: zizmor
    version_cmd: [--version]
    expect: 1.30.1
  yamllint:
    version: 1.38.0
    method: uv_tool
    package: yamllint
    binary: yamllint
    version_cmd: [--version]
    expect: 1.38.0
  ruff:
    # Not installed here: the locked governance venv owns ruff (uv.lock). The
    # runner resolves it from ~/.cursor-governance/.venv/bin/ruff.
    version: 0.16.1
    method: venv
    binary: ruff
    version_cmd: [--version]
    expect: 0.16.1
    ci_ref:
      path: pyproject.toml
      contains: ruff==0.16.1
      observed: Lint and Type Check installs the uv.lock pin
  pip-audit:
    # Installed for manual use and parity; it has no lane because the make pr
    # security wave already runs this exact pin when dependency files change,
    # and osv-scanner covers lockfiles at commit time.
    version: 2.9.0
    method: uv_tool
    package: pip-audit
    binary: pip-audit
    version_cmd: [--version]
    expect: 2.9.0
    ci_ref:
      repo: Quantum-L9/l9-ci-core
      ref: main
      path: .github/actions/install-consumer-ci/toolchain-lock.json
      contains: '"pip-audit": "2.9.0"'
      observed: >-
        Core's toolchain lock owns this version (l9-ci-core main 75a521f,
        2026-11-20); requirements.txt mirrors it and the make pr security wave
        reads it from there (run_pr_security.sh).

# Lanes: when a tool runs, over which changed files, and what blocks.
#   tier fast  — single-file, edit-time (seconds) and in every commit/gate run
#   tier heavy — commit-time in the background snapshot clone, reused by the gate
#   block      — severities that block when the finding is NEW on a changed line
#                (empty = advisory: reported, never blocks)
#   scope      — optional: `changed-files` keeps every finding in a changed file,
#                `whole-tree` keeps every finding, for checks CI judges that way
#   weight     — CPU slots taken from the nproc budget while the lane runs
lanes:
  ruff:
    tool: ruff
    tier: fast
    globs: ["*.py", "*.pyi"]
    # make pr's writer pass fixes ruff findings; edit-time feedback only.
    block: []
    weight: 1
  shellcheck:
    tool: shellcheck
    tier: fast
    globs: ["*.sh", "*.bash"]
    # Advisory: no required CI check pins this scanner. F-662-002.
    block: []
    weight: 1
  actionlint:
    tool: actionlint
    tier: fast
    globs: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
    # Advisory: no required CI check pins this scanner. F-662-002.
    block: []
    weight: 1
  zizmor:
    tool: zizmor
    tier: fast
    globs: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".github/actions/*/action.yml"]
    # Advisory: no required CI check pins this scanner. F-662-002.
    block: []
    weight: 1
  yamllint:
    tool: yamllint
    tier: fast
    globs: ["*.yml", "*.yaml"]
    # Advisory: no required CI check pins this scanner. F-662-002.
    block: []
    weight: 1
  biome:
    tool: biome
    tier: fast
    globs: ["*.json", "*.js", "*.jsx", "*.ts", "*.tsx", "*.mjs", "*.cjs"]
    # Analyze (central Core) runs `biome ci` blocking only when the checkout
    # root has biome.json or biome.jsonc (org-ci.yml hashFiles at 68ed994;
    # otherwise not_applicable). Any finding in a changed file fails it, not
    # only one on a changed line (a whole-file format diagnostic anchors
    # wherever Biome puts it).
    requires_any_file: [biome.json, biome.jsonc]
    block: [error]
    scope: changed-files
    weight: 1
  codeql:
    tool: codeql
    tier: heavy
    globs: ["*.py"]
    languages: [python]
    config: .github/codeql/codeql-config.yml
    # GitHub code scanning fails the check on error-level or security-severity >= 7.0.
    block: [error, security-high]
    weight: 2
  semgrep-l9:
    # Analyze (central Core)'s SDK Semgrep gate, not a re-implementation of its
    # rules: `l9-ci semgrep run` then `l9-ci gate evaluate`, with the SDK
    # source at .l9/runtime/sdk/source and Core's own bundled governance for
    # `core_profile` (strictness, requiredness, policy, identity maps) read
    # from l9-ci-core at `core_ref` and staged where org-ci stages it. Core
    # judges the whole tree, so this lane does too: a rule or policy change can
    # make untouched lines block (it did on #829).
    # The governance is resolved by Core's own actions at `core_ref`
    # (resolve-consumer-metadata, then resolve-governance with its
    # `product-kind`), so a repository that does not declare `product_kind:
    # node` in .l9/ci.json gets Core's constellation-scoped policy: the Gate
    # routing rules run and are reported but cannot block (Core #237).
    tool: l9-ci
    provider: semgrep
    core_profile: pr_fast
    core_event: pull_request
    core_ref: main
    tier: heavy
    globs: ["*.py", "*.pyi", "*.js", "*.jsx", "*.ts", "*.tsx"]
    block: [error]
    scope: whole-tree
    weight: 2
  semgrep-pro:
    tool: semgrep
    tier: heavy
    globs: ["*.py", "*.js", "*.jsx", "*.ts", "*.tsx", "*.sh", "*.yml", "*.yaml", "*.json"]
    capability: semgrep-pro
    # Advisory until probe U1 proves dry-run parity with semgrep-cloud-platform/scan.
    block: []
    weight: 1
  osv-scanner:
    tool: osv-scanner
    tier: heavy
    globs: ["uv.lock", "requirements*.txt", "package-lock.json", "pnpm-lock.yaml", "poetry.lock", "Pipfile.lock"]
    # Advisory: no required CI check names this scanner. F-662-002.
    block: []
    weight: 1
