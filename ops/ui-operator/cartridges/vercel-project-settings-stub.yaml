    description: Check vercel#token and ui-session-vercel refs
  - step: prefer_api
    description: Prefer Vercel API/CLI; record why UI is required
  - step: human_approve
    description: REQUIRED — promote stub to v1 cartridge before mutate
  - step: capture_before
    description: Before evidence (stub)
  - step: execute_journey
    description: Fill selectors + allowlisted mutations (not yet defined)
  - step: capture_after
    description: After evidence (stub)
  - step: emit_receipt
