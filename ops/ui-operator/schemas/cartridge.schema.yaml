# Universal UI-operator cartridge schema (site/journey data only — not a skill).
# schema_version: 1.0.0
type: object
required:
  - schema_version
  - id
  - version
  - site
  - goal
  - auth
  - mutation_allowlist
  - forbidden
  - journey
properties:
  schema_version:
    type: string
    const: "1.0.0"
  id:
    type: string
    pattern: "^[a-z0-9][a-z0-9-]{1,63}$"
  version:
    type: string
  site:
    type: string
  goal:
    type: string
  urls:
    type: object
    additionalProperties: { type: string }
  auth:
    type: object
    required: [refs]
    properties:
      refs:
        type: array
        items: { type: string }
        description: "secret_id#json_key refs (values never stored in cartridge)"
      ui_session_ref:
        type: string
      api_verify_ref:
        type: string
  mutation_allowlist:
    type: array
    items: { type: string }
  forbidden:
    type: array
    items: { type: string }
  targets:
    type: object
    additionalProperties: true
  selectors:
    type: object
    additionalProperties: { type: string }
  journey:
    type: array
    minItems: 1
    items:
      type: object
      required: [step]
      properties:
        step: { type: string }
        description: { type: string }
        mutation: { type: string }
  human_approve_required:
    type: boolean
    default: true
  notes:
    type: string
