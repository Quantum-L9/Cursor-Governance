schema_id: canonical.schema.contract_projection_binding.v1
schema_name: Canonical Contract Projection Binding Schema
schema_class: canonical_document_type_schema
schema_family: l9_governance_contracts
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.contract_projection_binding.v1.yaml
purpose:
  primary: Bind one authoritative contract to a non-authoritative consumer projection such as a skill rule AGENTS document template workflow command or generated documentation while preserving contract-only semantic ownership.
  output_level: schema_not_instance
  intended_use: [skill_contract_binding, rule_activation_binding, generated_documentation, workflow_enforcement_binding, projection_drift_detection]
  not_for: [semantic_authority, independent_normative_doctrine, undocumented_manual_duplication]
ontology:
  parent_type: governance_projection_schema
  specialized_type: contract_projection_binding_schema
  instance_type_generated_by_this_schema: contract_projection_binding
  related_schema_types: [canonical.schema.governance_contract.v1, canonical.schema.contract_registry.v1]
inheritance:
  extends: [canonical.knowledge_object.schema.v1]
  provides: [projection_source_binding, projection_target_binding, projection_integrity_model, drift_policy_model]
required_sections:
  binding:
    required: true
    fields:
      binding_id: {type: string, required: true}
      contract_id: {type: canonical_contract_id, required: true}
      contract_version: {type: semver, required: true}
      contract_digest: {type: sha256, required: true}
      clause_refs: {type: list_string, required: true, min_items: 1}
  target:
    required: true
    fields:
      type: {enum: [skill, rule, agent_document, workflow, command, prompt, template, documentation, code_validator], required: true}
      path: {type: string, required: true}
      projection_mode: {enum: [reference_only, generated_text, generated_config, activation_binding, enforcement_binding, explanatory_summary], required: true}
  ownership:
    required: true
    fields:
      normative_owner: {const: contract}
      target_may_redefine_semantics: {const: false}
  generation:
    required: true
    fields:
      mode: {enum: [generated, manually_maintained_with_parity_check], required: true}
      generator_ref: {type: string_or_null, required: false}
      parity_validator_ref: {type: string, required: true}
  integrity:
    required: true
    fields:
      projected_content_sha256: {type: sha256, required: true}
      drift_policy: {const: fail_closed}
conditional_rules:
  - when: generation.mode == generated
    require: [generation.generator_ref is non-null]
  - when: generation.mode == manually_maintained_with_parity_check
    require: [generation.parity_validator_ref is non-empty]
validation_rules:
  - {id: PROJECTION-001, severity: blocker, rule: every projection must resolve to an active or explicitly version-pinned contract.}
  - {id: PROJECTION-002, severity: blocker, rule: projection targets may not become normative owners.}
  - {id: PROJECTION-003, severity: blocker, rule: manually maintained projections require executable parity validation.}
  - {id: PROJECTION-004, severity: blocker, rule: projection drift must fail closed.}
  - {id: PROJECTION-005, severity: blocker, rule: projected clauses must exist in the referenced contract version.}
  - {id: PROJECTION-006, severity: blocker, rule: generated projections require an explicit generator reference.}
derivation_targets:
  can_generate: [skill_contract_reference, rule_activation_projection, generated_agent_document_section, documentation_projection, projection_parity_test]
anti_drift_rules:
  - A projection never owns doctrine.
  - Hand duplication without parity validation is forbidden.
  - Projection fingerprints bind to contract versions.
  - Contract changes invalidate stale projections.
minimum_viable_instance_requirements:
  required: [binding, target, ownership, generation, integrity]
