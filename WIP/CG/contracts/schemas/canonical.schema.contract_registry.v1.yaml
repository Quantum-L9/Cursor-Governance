schema_id: canonical.schema.contract_registry.v1
schema_name: Canonical Contract Registry Schema
schema_class: canonical_document_type_schema
schema_family: l9_governance_contracts
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.contract_registry.v1.yaml
purpose:
  primary: Define the generated authoritative index of contract identity version path digest kind authority tier ownership dependencies lifecycle and projection relationships.
  output_level: schema_not_instance
  intended_use: [contract_discovery, contract_resolution, impact_analysis, dependency_validation, projection_validation, deprecated_contract_detection]
  not_for: [hand_authored_policy, contract_semantics, runtime_authority_widening]
ontology:
  parent_type: governance_registry_schema
  specialized_type: contract_registry_schema
  instance_type_generated_by_this_schema: contract_registry
  related_schema_types: [canonical.schema.governance_contract.v1, canonical.schema.contract_projection_binding.v1, canonical.schema.contract_extraction_record.v1]
inheritance:
  extends: [canonical.knowledge_object.schema.v1]
  provides: [contract_index_model, dependency_graph_model, projection_graph_model, registry_integrity_model]
required_sections:
  metadata:
    required: true
    fields:
      registry_id: {type: string, required: true}
      schema_ref: {const: canonical.schema.contract_registry.v1}
      generated_at: {type: datetime, required: true}
      source_commit_sha: {type: full_commit_SHA, required: true}
  generation:
    required: true
    fields:
      generated: {const: true}
      hand_edit_allowed: {const: false}
      generator_ref: {type: string, required: true}
      deterministic: {const: true}
  contracts:
    required: true
    type: list
    allow_empty: true
    item_schema:
      contract_id: {type: canonical_contract_id, required: true}
      version: {type: semver, required: true}
      kind: {enum: [invariant, policy, capability, workflow, evidence], required: true}
      status: {enum: [draft, review, active, deprecated, retired], required: true}
      path: {type: string, required: true}
      digest: {type: sha256, required: true}
      authority_tier: {type: string, required: true}
      owner: {type: string, required: true}
      requires_contracts: {type: list_string, required: true, allow_empty: true}
      supersedes: {type: list_string, required: true, allow_empty: true}
      conflicts_with: {type: list_string, required: true, allow_empty: true}
      projection_binding_refs: {type: list_string, required: true, allow_empty: true}
      coexistence:
        type: map
        required: true
        fields:
          allowed: {type: boolean, required: true}
          scope_discriminator: {type: string_or_null, required: true}
  graph:
    required: true
    fields:
      dependency_graph_acyclic: {const: true}
      supersession_graph_acyclic: {const: true}
      unresolved_refs: {type: list_string, required: true, allow_empty: true}
      unresolved_conflicts: {type: list_string, required: true, allow_empty: true}
  coverage:
    required: true
    fields:
      active_contract_count: {type: integer, required: true, minimum: 0}
      mechanically_enforced_count: {type: integer, required: true, minimum: 0}
      evidence_backed_count: {type: integer, required: true, minimum: 0}
      unowned_doctrine_count: {type: integer, required: true, minimum: 0}
      projection_drift_count: {type: integer, required: true, minimum: 0}
      deprecated_contract_reference_count: {type: integer, required: true, minimum: 0}
conditional_rules:
  - when: "contracts[*].coexistence.allowed == false"
    require: ["corresponding contracts[*].coexistence.scope_discriminator is null"]
  - when: "contracts[*].coexistence.allowed == true"
    require: ["corresponding contracts[*].coexistence.scope_discriminator is non-null"]
validation_rules:
  - {id: REGISTRY-001, severity: blocker, rule: every registry entry path must exist and parse under its declared schema.}
  - {id: REGISTRY-002, severity: blocker, rule: every stored digest must match canonicalized contract content.}
  - {id: REGISTRY-003, severity: blocker, rule: only one active version of a stable contract_id may exist unless every coexisting active entry explicitly enables coexistence with a non-null scope discriminator.}
  - {id: REGISTRY-004, severity: blocker, rule: all contract references must resolve.}
  - {id: REGISTRY-005, severity: blocker, rule: dependency and supersession graphs must be acyclic.}
  - {id: REGISTRY-006, severity: blocker, rule: unresolved simultaneously applicable conflicts block registry convergence.}
  - {id: REGISTRY-007, severity: blocker, rule: generated registry files may not be hand edited.}
  - {id: REGISTRY-008, severity: blocker, rule: converged registry requires unowned_doctrine_count equal zero.}
  - {id: REGISTRY-009, severity: blocker, rule: converged registry requires projection_drift_count equal zero.}
  - {id: REGISTRY-010, severity: blocker, rule: coexistence requires an explicit scope discriminator and disabled coexistence forbids one.}
derivation_targets:
  can_generate: [contract_registry, dependency_graph, impact_map, contract_discovery_index, enforcement_coverage_report, projection_coverage_report, deprecated_reference_report]
anti_drift_rules:
  - Registry describes contracts but never owns their semantics.
  - Registry is generated deterministically.
  - Missing references fail closed.
  - Digest mismatch fails closed.
  - Deprecated references remain visible until removed.
  - Coverage metrics must be computed rather than manually declared.
minimum_viable_instance_requirements:
  required: [metadata, generation, contracts, graph, coverage]
