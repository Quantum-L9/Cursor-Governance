name: artifact-provenance
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: echo "build step placeholder — replace with real build" > artifact.txt
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifact.txt
      - name: Verify attestation before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify artifact.txt -o Quantum-L9
      - name: Upload artifact for downstream deploy gate
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: artifact.txt
