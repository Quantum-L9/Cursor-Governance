    residual: []
    probe_2026_08_30: >-
      RESOLVED, and the earlier residual here was wrong. It claimed you could not tell
      whether the installer fired or merely failed. You can: T6 writes a per-revision
      marker and log at ~/.l9/claude/bootstrap-repair-<rev>.{attempted,log} and reports
      SKIPPED / running / FAILED rc plus the log head in the SessionStart banner. The
      answer was in the banner and the log, not the receipt. Evidence in this container:
      markers exist for BOTH a2f78b5 and 450b7d0; the 450b7d0 log ends "Claude Code
      adapter: READY" with all nine components READY, and the receipt moved from
      degraded (5/8 at a2f78b5) to READY at 450b7d0. T6 works as designed.
    p307_records: [CI-004]
    clears_p307_residual: 'CI-004 R2 (IMP-04 / BOOT-1)'

