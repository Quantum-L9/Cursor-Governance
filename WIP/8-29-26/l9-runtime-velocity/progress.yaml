    probe_2026_08_30: >-
      A suspicion checked and DISMISSED. The bootstrap receipt records
      workspace=/home/user, the container root rather than a repository, which looked
      like RC-1 residue in the receipt plane. It is not: install.sh classifies the
      workspace explicitly and treats a multi-repo container root as a legitimate wiring
      target ("workspace ... is a multi-repo container root - wiring project artifacts"),
      refusing only when the workspace is neither a repo, the harness project dir, nor a
      container root. The field records where project artifacts are wired, which is
      correctly the container root. Not a defect.
