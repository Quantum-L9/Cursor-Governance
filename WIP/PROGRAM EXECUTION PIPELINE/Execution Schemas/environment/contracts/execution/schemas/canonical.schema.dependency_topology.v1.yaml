schema_id: canonical.schema.dependency_topology.v1
schema_name: Canonical Dependency Topology Schema
schema_class: canonical_execution_contract_schema
schema_family: l9_execution_architecture
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.dependency_topology.v1.yaml
purpose:
  primary: 'Define dependency topology for plans, packages, files, services, or execution steps as an acyclic graph with explicit
    ownership and forbidden edges.

    '
  output_level: schema_not_instance
  intended_use:
  - execution_DAG
  - package_dependency_DAG
  - file_generation_order
  - rollout_order
  not_for:
  - runtime_message_routing
  - graph_database_ontology
ontology:
  parent_type: execution_contract_schema
  specialized_type: dependency_topology_schema
  instance_type_generated_by_this_schema: dependency_topology
required_sections:
  identity:
    required: true
    fields:
      topology_id:
        type: string
        required: true
      topology_kind:
        enum:
        - execution
        - package
        - file
        - service
        - rollout
        - migration
        - custom
        required: true
  graph:
    required: true
    fields:
      graph_type:
        const: directed_acyclic_graph
      nodes:
        type: list
        required: true
      allowed_edges:
        type: adjacency_list
        required: true
      forbidden_edges:
        type: list
        required: true
  node_contract:
    required: true
    item_schema:
      id:
        type: string
        required: true
      owner:
        type: string
        required: true
      layer:
        type: string
        required: false
      depends_on:
        type: list_string
        required: true
      outputs:
        type: list
        required: false
  ordering:
    required: true
    fields:
      topological_sort_required:
        const: true
      generation_or_execution_order:
        type: list_string
        required: true
      parallel_groups:
        type: list
        required: false
  cycle_policy:
    required: true
    fields:
      on_cycle:
        const: stop_and_repair_before_execution
      repair_options:
        type: list
        canonical_values:
        - move_shared_contract_to_lowest_common_dependency
        - introduce_injected_interface
        - split_component
        - reorder_execution
  validation:
    required: true
    fields:
      cycle_free:
        type: boolean
        required: true
      forbidden_edges_absent:
        type: boolean
        required: true
      evidence_refs:
        type: list_string
        required: true
validation_rules:
- id: DEP-TOPO-001
  severity: blocker
  rule: Dependency graph must be acyclic.
- id: DEP-TOPO-002
  severity: blocker
  rule: All declared edges must connect known nodes.
- id: DEP-TOPO-003
  severity: blocker
  rule: Forbidden edges must be absent.
- id: DEP-TOPO-004
  severity: major
  rule: Shared contracts should live at the lowest common dependency layer.
- id: DEP-TOPO-005
  severity: blocker
  rule: Execution or generation order must match a valid topological sort.
derivation_targets:
  can_generate:
  - dependency_topology
  - execution_DAG
  - package_DAG
  - generation_order
  - parallelism_plan
anti_drift_rules:
- Do not hide dependency cycles through runtime imports.
- Do not confuse transport routing with dependency ownership.
- Do not allow generated order to contradict the DAG.
- Do not leave forbidden edges implicit.
minimum_viable_instance_requirements:
  required:
  - identity
  - graph
  - node_contract
  - ordering
  - cycle_policy
  - validation
schema_dependency_direction:
  depends_on: []
  cycle_policy: schema_dependency_graph_must_be_acyclic
