schema_id: canonical.schema.rollback_contract.v1
schema_name: Canonical Rollback Contract Schema
schema_class: canonical_execution_contract_schema
schema_family: l9_execution_architecture
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.rollback_contract.v1.yaml
purpose:
  primary: 'Define typed rollback and compensation semantics for code, data, external state, and local state affected by execution.

    '
  output_level: schema_not_instance
  intended_use:
  - plan_rollback
  - coding_contract_rollback
  - execution_recovery
  - compensating_actions
  not_for:
  - false_reversibility_claims
  - silent_destructive_recovery
ontology:
  parent_type: execution_contract_schema
  specialized_type: rollback_contract_schema
  instance_type_generated_by_this_schema: rollback_contract
required_sections:
  identity:
    required: true
    fields:
      rollback_id:
        type: string
        required: true
      source_execution_ref:
        type: ref
        required: true
      supported:
        type: boolean
        required: true
  triggers:
    required: true
    fields:
      trigger_conditions:
        type: list
        required: true
      automatic_allowed:
        type: boolean
        required: true
      approval_required:
        type: boolean
        required: true
  strategies:
    required: true
    fields:
      code:
        type: rollback_strategy
        required: true
      data:
        type: rollback_strategy
        required: true
      external_state:
        type: rollback_strategy
        required: true
      local_state:
        type: rollback_strategy
        required: true
  strategy_registry:
    required: true
    allowed_modes:
    - none
    - git_restore_scoped_paths
    - revert_commit
    - restore_snapshot
    - corrective_append_only_record
    - compensating_transaction
    - manual_recovery
    - custom
  irreversible_operations:
    required: true
    type: list
  verification:
    required: true
    fields:
      checks:
        type: list
        required: true
      success_condition:
        type: string
        required: true
      failure_condition:
        type: string
        required: true
  receipt:
    required: true
    fields:
      status:
        enum:
        - not_triggered
        - succeeded
        - failed
        - partial
        - manual_required
        required: true
      actions_taken:
        type: list
        required: true
      evidence_refs:
        type: list_string
        required: true
validation_rules:
- id: ROLLBACK-001
  severity: blocker
  rule: Rollback must separately address code, data, external state, and local state.
- id: ROLLBACK-002
  severity: blocker
  rule: Irreversible operations must be declared before execution.
- id: ROLLBACK-003
  severity: blocker
  rule: Append-only systems must use corrective records rather than false delete semantics.
- id: ROLLBACK-004
  severity: major
  rule: Automatic rollback is prohibited when human approval is required.
- id: ROLLBACK-005
  severity: blocker
  rule: Successful rollback requires verification evidence.
derivation_targets:
  can_generate:
  - rollback_contract
  - rollback_plan
  - rollback_receipt
  - compensation_plan
anti_drift_rules:
- Do not claim reversible when an operation is irreversible.
- Do not collapse all state types into one generic rollback action.
- Do not use force-push as standard rollback.
- Do not skip post-rollback verification.
minimum_viable_instance_requirements:
  required:
  - identity
  - triggers
  - strategies
  - strategy_registry
  - irreversible_operations
  - verification
  - receipt
schema_dependency_direction:
  depends_on:
  - canonical.schema.validation_evidence.v1
  cycle_policy: schema_dependency_graph_must_be_acyclic
