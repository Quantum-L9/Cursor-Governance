schema_id: canonical.schema.execution_contract.v1
schema_name: Canonical Execution Contract Schema
schema_class: canonical_execution_contract_schema
schema_family: l9_execution_architecture
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.execution_contract.v1.yaml
purpose:
  primary: 'Define the whole authorized execution derived from one validated coding contract. The execution contract owns
    execution scope, decomposition, mutation authorization requirements, packet partitioning, shared rollback, evidence obligations,
    and convergence authority across one or many bounded execution packets.

    '
  output_level: schema_not_instance
  intended_use:
  - authorize_whole_execution
  - partition_execution_into_packets
  - coordinate_parallel_execution
  - preserve_shared_authority
  - bind_mutation_authorizations
  - aggregate_execution_results
  not_for:
  - transport_authority
  - planning
  - code_generation_instruction
  - packet_level_task_state
  - assurance_verdicts
ontology:
  parent_type: execution_contract_schema
  specialized_type: execution_contract_schema
  instance_type_generated_by_this_schema: execution_contract
  upstream_schema: canonical.schema.coding_contract.v1
  downstream_schema: canonical.schema.execution_packet.v1
required_sections:
  identity:
    required: true
    fields:
      execution_contract_id:
        type: string
        required: true
      coding_contract_ref:
        type: ref
        required: true
      source_plan_ref:
        type: ref
        required: false
      created_at:
        type: datetime
        required: true
      status:
        enum:
        - draft
        - authorization_blocked
        - ready
        - executing
        - partial
        - failed
        - completed
        - superseded
        required: true
  authority:
    required: true
    fields:
      authority_source:
        type: ref
        required: true
      authorized_scope:
        type: list
        required: true
      prohibited_scope:
        type: list
        required: true
      authority_may_be_expanded_by_packet:
        const: false
  preconditions:
    required: true
    composition: schema_refs
    refs:
      capability_preflight: canonical.schema.capability_preflight.v1
      dependency_topology: canonical.schema.dependency_topology.v1
  mutation_authorization:
    required: true
    composition: schema_ref
    schema_ref: canonical.schema.mutation_authorization.v1
    fields:
      authorization_refs:
        type: list_string
        required: true
  packet_partitioning:
    required: true
    fields:
      packet_schema:
        const: canonical.schema.execution_packet.v1
      packet_ids:
        type: list_string
        required: true
      partition_rule:
        type: string
        required: true
      shared_state_policy:
        type: string
        required: true
      parallelism_policy:
        type: string
        required: true
      packet_authority_must_be_subset:
        const: true
  rollback:
    required: true
    composition: schema_ref
    schema_ref: canonical.schema.rollback_contract.v1
    fields:
      rollback_ref:
        type: ref
        required: true
  evidence:
    required: true
    composition: schema_ref
    schema_ref: canonical.schema.validation_evidence.v1
    fields:
      evidence_refs:
        type: list_string
        required: true
  convergence:
    required: true
    composition: schema_ref
    schema_ref: canonical.schema.convergence_contract.v1
    fields:
      convergence_ref:
        type: ref
        required: true
  receipts:
    required: true
    fields:
      packet_receipt_refs:
        type: list_string
        required: true
      aggregate_status:
        type: string
        required: true
validation_rules:
- id: EXEC-CONTRACT-001
  severity: blocker
  rule: Execution contract must reference a validated coding contract.
- id: EXEC-CONTRACT-002
  severity: blocker
  rule: Every execution packet authority must be a strict subset of execution contract authority.
- id: EXEC-CONTRACT-003
  severity: blocker
  rule: Mutation-capable packets require valid mutation authorization.
- id: EXEC-CONTRACT-004
  severity: blocker
  rule: Packet decomposition must preserve dependency topology and rollback semantics.
- id: EXEC-CONTRACT-005
  severity: blocker
  rule: Completion requires aggregate packet receipts, validation evidence, and convergence state.
derivation_targets:
  can_generate:
  - execution_contract
  - execution_packet_set
  - execution_authority_map
  - packet_partition_plan
anti_drift_rules:
- Do not use ExecutionContract as TransportPacket.
- Do not let packets expand whole-execution authority.
- Do not bypass mutation authorization for write-capable work.
- Do not redefine coding contract implementation semantics.
minimum_viable_instance_requirements:
  required:
  - identity
  - authority
  - preconditions
  - mutation_authorization
  - packet_partitioning
  - rollback
  - evidence
  - convergence
  - receipts
schema_dependency_direction:
  depends_on:
  - canonical.schema.coding_contract.v1
  - canonical.schema.capability_preflight.v1
  - canonical.schema.dependency_topology.v1
  - canonical.schema.mutation_authorization.v1
  - canonical.schema.rollback_contract.v1
  - canonical.schema.validation_evidence.v1
  - canonical.schema.convergence_contract.v1
  must_not_depend_on:
  - canonical.schema.execution_packet.v1
  cycle_policy: schema_dependency_graph_must_be_acyclic
