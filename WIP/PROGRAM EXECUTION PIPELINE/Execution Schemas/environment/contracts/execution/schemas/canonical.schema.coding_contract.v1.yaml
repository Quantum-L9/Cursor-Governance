plan_alignment:
  sibling_schema:
    const: canonical.schema.plan_document.v1
  derivation_rule: 'A coding contract SHOULD be derived from a validated plan or canonical spec. The plan defines mission,
    baseline, envelope, side effects, rollback, and evidence properties. The coding contract resolves those into implementation,
    dependency, file, test, security, and validation obligations.

    '
  required_mappings:
    immutable_baseline:
      from: plan.immutable_baseline
      to:
      - source_context
      - preflight_audit
    execution_envelope:
      from: plan.execution_envelope
      to: execution_envelope
    side_effects_and_idempotency:
      from: plan.side_effects_and_idempotency
      to:
      - security_and_reliability
      - rollback
    execution_DAG:
      from: plan.execution_DAG
      to: dependency_topology
    property_evidence_matrix:
      from: plan.property_evidence_matrix
      to:
      - test_generation_contract
      - validation_honesty
    convergence:
      from: plan.convergence
      to:
      - machine_summary
      - convergence
validation_rules:
- id: CODE-SCHEMA-001
  severity: blocker
  rule: Code generation must not begin while preflight blockers remain open.
- id: CODE-SCHEMA-002
  severity: blocker
  rule: Dependency topology must be acyclic before file generation.
- id: CODE-SCHEMA-003
  severity: blocker
  rule: Every generated file must have explicit path, purpose, required content, forbidden content, and ownership.
- id: CODE-SCHEMA-004
  severity: blocker
  rule: Generated implementation must remain inside the execution envelope.
- id: CODE-SCHEMA-005
  severity: blocker
  rule: Complete file content is required; partial fragments, ellipses, placeholders, and TODO compliance markers are forbidden.
- id: CODE-SCHEMA-006
  severity: blocker
  rule: Tests must assert observable behavior or returned structures, not mock call counts alone.
- id: CODE-SCHEMA-007
  severity: blocker
  rule: Validation status passed or failed requires captured evidence.
- id: CODE-SCHEMA-008
  severity: blocker
  rule: Runtime, security, and external IO must honor resolved implementation boundaries.
- id: CODE-SCHEMA-009
  severity: blocker
  rule: Coding contract must define rollback strategy before irreversible implementation actions.
- id: CODE-SCHEMA-010
  severity: major
  rule: Unknown implementation facts must remain explicit and block only affected phases.
- id: CODE-SCHEMA-011
  severity: blocker
  rule: Machine summary status must match validation evidence and open blockers.
- id: CODE-SCHEMA-012
  severity: blocker
  rule: A coding contract derived from a plan must preserve the plan execution envelope and property evidence obligations.
derivation_targets:
  can_generate:
  - coding_contract
  - implementation_plan
  - file_emission_plan
  - dependency_DAG
  - test_plan
  - security_constraints
  - validation_plan
  - rollback_plan
  - generated_files
  - validation_results
  - machine_summary
  - execution_contract
anti_drift_rules:
- Do not embed repository names, concrete file paths, package names, usernames, branch names, or commit SHAs into reusable
  enums.
- Do not let coding contracts redefine upstream architectural authority.
- Do not relax an upstream execution envelope during coding contract derivation.
- Do not convert unknowns into assumed implementation facts.
- Do not let file generation imply validation success.
- Do not let test existence imply behavioral coverage.
- Do not let runtime profiles define authority.
- Do not let generated code modify the contract that authorized it.
- Do not mark convergence complete while validation or blocker state disagrees.
- Do not redefine sibling primitive contracts inside Coding Contract instances.
- Validation honesty is enforced through validation evidence claim rules; no dangling validation_honesty schema authority
  exists in this family.
minimum_viable_instance_requirements:
  required:
  - metadata
  - prime_directive
  - source_context
  - preflight_audit
  - resolved_implementation_contract
  - execution_envelope
  - file_emission_contract
  - test_generation_contract
  - security_and_reliability
  - output_contract
  - machine_summary
  - capability_preflight_ref
  - dependency_topology_ref
  - rollback_contract_ref
  - validation_evidence_refs
  - convergence_contract_ref
