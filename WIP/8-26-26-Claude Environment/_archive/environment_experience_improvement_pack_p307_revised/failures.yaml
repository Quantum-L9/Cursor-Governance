- id: CF-002
  title: Bootstrap projection violates consumer-repository ownership
  status: ACTIVE_CRITICAL
  summary: Session bootstrap can write, symlink, or project machine-local material into paths that a consumer repository already
    tracks. Pack 9 proves this can overwrite nine tracked .claude/rules files and leave a permanently dirty tree.
  source_records:
  - source_ref: P3/failures/FAIL-02
    source_pack: P3
    source_path: failures.yaml
    source_id: FAIL-02
    source_title: Bootstrap rewrites tracked repo content, silently disabling repo guardrails
    source_record:
      id: FAIL-02
      rank: 2
      title: Bootstrap rewrites tracked repo content, silently disabling repo guardrails
      impact: HIGH
      frequency:
        repos_affected: 2
        repos_scanned: 9
      category: bootstrap
      evidence:
      - command: git -C /home/user/Cognitive.Engine.Graphs ls-files -- .claude .mcp.json | wc -l
        output: '18'
      - command: git -C /home/user/Cognitive.Engine.Graphs status --porcelain --untracked-files=all
        output: 9 x ' D .claude/rules/*.md'; ' M .claude/settings.json'; '?? .claude/rules'; '?? .claude/hooks/'; '?? .mcp.json'
      - command: ls -ld /home/user/Cognitive.Engine.Graphs/.claude/rules
        output: lrwxrwxrwx .claude/rules -> /root/.cursor-governance/environment/generated/llm-rules
      - command: grep -c 'contract_scanner\|pickle.load\|import fastapi' .claude/settings.json
        output: '0'
      - command: git -C /home/user/l9-meta-injector diff --stat -- .claude/settings.json
        output: 1 file changed, 198 insertions(+), 28 deletions(-)
      - command: python3 compare tracked vs live permissions.allow (l9-meta-injector)
        output: tracked=33 live=47 dropped=17
      hooks_lost_in_cognitive_engine_graphs:
      - event: PreToolUse
        matcher: Bash
        purpose: 'banned-pattern guard: eval(, exec(, pickle.load, yaml.load, import fastapi/starlette/uvicorn (Contracts
          1/9)'
      - event: PostToolUse
        matcher: Write|Edit|MultiEdit
        purpose: ruff check --select=SEC,ARCH on edited .py
      - event: Stop
        matcher: null
        purpose: python3 tools/contract_scanner.py --quick
      root_cause: bootstrap writes .claude/** and .mcp.json unconditionally, without testing whether the destination path
        is tracked
      rule_conflict: 'rules/06-governance-ssot-paths Forbidden: machine-specific /root/... paths; whole-directory links to
        global rules'
      workaround: none_applied
      note: not committed; committing would push a machine-specific symlink and remove repo hooks
      tracked_at: Quantum-L9/Cursor-Governance#281 (comment posted this session)
