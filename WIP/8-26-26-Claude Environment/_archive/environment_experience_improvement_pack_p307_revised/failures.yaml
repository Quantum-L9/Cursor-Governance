    source_record:
      id: F-01
      rank: 1
      title: Account-env drift on a safety flag is detected every session and repaired never
      impact: high
      frequency: 2
      class: environment_variable_contradiction
      fact:
        command: python3 environment/agents/adapters/claude-code/verify_account_env.py
        exit_code: 1
        stdout: 'DRIFT: 1 of 33 variables / L9_AUTONOMY_AUTONOMOUS_MERGE: expected ''false'', got ''true'''
      live_value:
        variable: L9_AUTONOMY_AUTONOMOUS_MERGE
        observed: 'true'
        source: /root/.claude/settings.json env block (16 keys)
      root_cause:
        type: contradiction_inside_governance_repo
        declaration_a:
          path: environment/agents/adapters/claude-code/settings.template.json
          line: 194
          content: '"L9_AUTONOMY_AUTONOMOUS_MERGE": "true"'
          corroborating_line:
            line: 25
            content: Standing autonomous merge is ON (L9_AUTONOMY_AUTONOMOUS_MERGE=true).
        declaration_b:
          path: environment/agents/adapters/claude-code/web/environment.env.example
          line: 110
          content: L9_AUTONOMY_AUTONOMOUS_MERGE=false
        verifier_authority:
          path: environment/agents/adapters/claude-code/verify_account_env.py
          lines:
          - 42
          - 98
          content: ENV_EXAMPLE = HERE / "web" / "environment.env.example" ... "The expected set is derived from environment.env.example,
