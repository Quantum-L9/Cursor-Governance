  - source_ref: P9/failures/F-05
    source_pack: P9
    source_path: failures.yaml
    source_id: F-05
    source_title: Documented gate escape variables are unreachable from the agent side
    source_record:
      id: F-05
      rank: 5
      title: Documented gate escape variables are unreachable from the agent side
      severity: blocker
      frequency: once
      plane: bootstrap
      provenance: earlier_session
      evidence:
        attempted_forms:
        - export L9_WORKTREE_ADD_AUTHORIZED=<reason> then run the command
        - L9_WORKTREE_ADD_AUTHORIZED=<reason> git worktree add ...
        - the same two forms for L9_GIT_SWITCH_AUTHORIZED
        observed: no effect in either form; the gate denied the command unchanged
        mechanism_evidence:
        - ops/autonomy/worktree_isolation_gate.py:88 -> return bool(os.environ.get(env_key, '').strip())
        - ops/autonomy/local_execution_gate.py:416 -> raw = sys.stdin.read()
        - ops/autonomy/local_execution_gate.py:363-365 -> command is read from the stdin event's tool_input
        documented_in: rules/49-shared-worktree-isolation.md and rules/88-l4-local-autonomy.md both publish these variables
          as the escape
      root_cause:
        type: inference
        statement: The gate runs as a PreToolUse hook process spawned by the harness, receiving the command as JSON on stdin.
          It resolves the escape from its own os.environ. A variable exported inside a Bash tool call lives in a shell that
          starts after the gate has already decided, and an inline VAR=value prefix is only text inside the command string
          the gate parses. Neither form can ever reach the gate's environment.
        grounded_in: the three source citations above plus the observed no-effect behaviour
      consequence: A documented, rule-published escape hatch does not function on this surface.
      workaround_used: Used git clone --branch instead of git worktree add to obtain an isolated checkout.
      status: OPEN
      improvements:
      - I-BS-07
