      title: Gates reject an entire compound command, so non-offending stages in the same line never run
      severity: medium
      frequency: intermittent
      plane: bootstrap
      provenance: re_verified
      evidence:
        instance_earlier: git add ... && git commit ... && git push ... was denied as a unit; the commit stage did not run
          either
        instance_now:
          command: SP=<path>; rm -rf "$SP/exp-pack2"; mkdir -p "$SP/exp-pack2"; cd ...
          response: 'git guardrails (l9-context-sensitive-git-guardrails): target ''$SP/exp-pack2'' contains an unresolved
            or empty expansion'
          note: correct fail-closed behaviour; the guardrail parses statically and cannot see a variable assigned earlier
            in the same line
        instance_now_2:
          command: rm -rf <literal path> ; mkdir -p <literal path> ; cd <literal path> && pwd
          response: Permission to use Bash with command ... has been denied
          note: the whole compound line was denied, including the mkdir and cd stages
      root_cause:
        type: fact
        statement: Gate and permission evaluation operate on the whole command string, so one disallowed stage suppresses
          every other stage in the same invocation.
      consequence: Work must be decomposed into single-purpose invocations; batching costs a retry each time it is attempted.
      workaround_used: Split into one command per intent; used literal paths instead of variables in any line containing a
        destructive verb.
      status: OPEN
      improvements:
      - I-BS-10
  reconciliation_action: MERGE
