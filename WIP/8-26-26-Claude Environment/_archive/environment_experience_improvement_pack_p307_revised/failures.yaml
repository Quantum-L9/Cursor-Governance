- id: CF-001
  title: GitHub GraphQL-dependent paths fail while REST can remain healthy
  status: ACTIVE_RECURRING
  summary: 'The environment repeatedly exposes a transport split: REST can work while GraphQL-backed gh operations, auth probes,
    PR commands, or merge helpers fail. Health checks and doctrine that collapse these into one GitHub state produce false
    diagnoses.'
  source_records:
  - source_ref: P1/failures/FAIL-01
    source_pack: P1
    source_path: failures.yaml
    source_id: FAIL-01
    source_title: gh auth status reports a valid token as invalid
    source_record:
      id: FAIL-01
      rank: 1
      title: gh auth status reports a valid token as invalid
      impact: critical
      frequency: every-session
      reproduced_this_session: true
      commands:
      - command: gh auth status
        exit_code: 1
        output_excerpt: X Failed to log in to github.com using token (GH_TOKEN) / The token in GH_TOKEN is invalid.
      - command: gh api user
        exit_code: 0
        output_excerpt: '{"login":"cryptoxdog","id":31744795,...}'
      evidence: evidence/02-gh.txt
      root_cause:
        statement: gh auth status verifies credentials over GraphQL; session policy returns HTTP 403 for GraphQL, and gh renders
          any auth-probe failure as "token is invalid".
        confidence: inference_high
      observed_cost: Taken at face value in the PR-remediation run; the entire gh CLI path was abandoned for the whole session.
        REST via gh api was available throughout and never tried.
      improvements:
      - IMP-01
      - IMP-02
  - source_ref: P1/failures/FAIL-02
    source_pack: P1
    source_path: failures.yaml
    source_id: FAIL-02
    source_title: All gh pr subcommands blocked by GraphQL session policy
    source_record:
      id: FAIL-02
      rank: 3
      title: All gh pr subcommands blocked by GraphQL session policy
      impact: critical
      frequency: every-session
      reproduced_this_session: true
      commands:
      - command: gh api graphql -f query='{viewer{login}}'
        exit_code: 1
        output_excerpt: 'HTTP 403: This GraphQL query is not enabled for this session — only the pinned set of PR-review operations
          is served. Use REST via `gh api repos/{owner}/{repo}/...` instead.'
      - command: gh pr list --repo Quantum-L9/.github --state all --limit 3 --json number,title
        exit_code: 1
        output_excerpt: 'HTTP 403: This GraphQL query is not enabled for this session'
      - command: gh api repos/Quantum-L9/.github --jq .full_name
        exit_code: 0
        output_excerpt: Quantum-L9/.github
      evidence: evidence/03-gh-capability-matrix.txt
      root_cause:
        statement: Session policy serves only a pinned set of PR-review GraphQL operations.
        confidence: fact
      note: This error is self-diagnosing — it names the REST alternative in the message text. FAIL-01 is the dangerous one
        because it does not.
      improvements:
      - IMP-01
      - IMP-11
  - source_ref: P1/failures/FAIL-03
    source_pack: P1
    source_path: failures.yaml
    source_id: FAIL-03
    source_title: stack_safe_merge.py cannot complete its stack probe
    source_record:
      id: FAIL-03
      rank: 2
      title: stack_safe_merge.py cannot complete its stack probe
      impact: critical
      frequency: every-run
      reproduced_this_session: true
      commands:
      - command: /root/.cursor-governance/.venv/bin/python /root/.cursor-governance/ops/autonomy/stack_safe_merge.py --repo
          Quantum-L9/.github --pr 59 --json
        exit_code: 2
        output_excerpt: 'FAIL: stack probe: HTTP 403: This GraphQL query is not enabled for this session'
      evidence: evidence/06-gh-dependency.txt
      root_cause:
        statement: stack_safe_merge imports _stacked_children from merge_gate.py lines 240 and 244, which shell out to `gh
          pr view --json headRefName` and `gh pr list --json number`. Both are GraphQL-backed and blocked (FAIL-02).
        confidence: fact
      contract_impact: l9-pr-remediation Law 12 designates this script the only sanctioned way to choose a merge method. It
        is inoperable by default in this environment.
      workaround_used:
        mechanism: L9_STACK_PROBE_FILE
        note: Documented as a test hook. Topology derived from REST (base.ref / head.ref across open PRs) and injected. The
          script then selected correctly.
        selections:
        - pr: 58
          method: merge
          reason: 'head ''fix/seed-ci-safe-pack'' is the base of open PR(s) #59; --merge preserves ancestry'
        - pr: 59
          method: squash
          reason: no open PR bases on this head; --squash is safe
        residual: Execution still required GitHub MCP, because the emitted argv is a `gh pr merge` command and gh pr is GraphQL-backed.
      downstream:
        statement: merge_gate.py fails closed on the same probe, returning _stack_unknown_reason for ancestry-breaking methods.
          Safe, but it names the wrong cause to the operator.
        confidence: inference
      improvements:
      - IMP-11
      - IMP-12
  - source_ref: P3/failures/FAIL-01
    source_pack: P3
    source_path: failures.yaml
    source_id: FAIL-01
    source_title: GraphQL disabled; the only sanctioned merge command cannot run
    source_record:
      id: FAIL-01
      rank: 1
      title: GraphQL disabled; the only sanctioned merge command cannot run
      impact: BLOCKER
      frequency:
        distinct_commands: 3
      category: permission_surface
      evidence:
      - command: gh api graphql -f query='query { viewer { login } }'
        exit_code: 1
        output: 'HTTP 403: This GraphQL query is not enabled for this session — only the pinned set of PR-review operations
          is served. Use REST via `gh api repos/{owner}/{repo}/...` instead.'
      - command: gh pr list --repo Quantum-L9/Cognitive.Engine.Graphs --state open
        exit_code: 1
      - command: gh api 'search/issues?q=org:Quantum-L9+test'
        exit_code: 1
      - command: python ops/autonomy/stack_safe_merge.py --repo Quantum-L9/Cognitive.Engine.Graphs --pr 225 --run
        exit_code: 1
        output: 'FAIL: stack probe: HTTP 403: This GraphQL query is not enabled for this session'
      - command: gh api repos/Quantum-L9/Cognitive.Engine.Graphs
        exit_code: 0
        note: 'control: repository-scoped REST works'
      root_cause: stack_safe_merge.py resolves children via merge_gate._stacked_children -> gh pr view / gh pr list (GraphQL),
        and execs gh pr merge (GraphQL).
      contract_conflict: l9-pr-remediation Law 12 names this helper as the only sanctioned merge path and forbids typing --squash/--merge
        by hand.
      workaround:
        steps:
        - 'derive probe inputs via REST: GET pulls?state=open&base=<head> -> no children'
        - inject via the helper's own L9_STACK_PROBE_FILE
        - helper returned method=squash, reason='no open PR bases on this head'
        - execute the helper's verdict via PUT /repos/{o}/{r}/pulls/225/merge
        merge_method_chosen_by: helper_not_operator
      residual_risk: REST merge endpoint may not be intercepted by merge_gate.py, which matches on gh pr merge command text
      residual_risk_status: UNKNOWN
      improvement_ref: C1
