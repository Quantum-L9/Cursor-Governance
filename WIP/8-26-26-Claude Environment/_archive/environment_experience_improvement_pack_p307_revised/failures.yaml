    source_record:
      id: F-02
      rank: 2
      title: GraphQL is refused by the session gateway, so gh PR subcommands fail
      impact: high
      frequency: 2
      class: capability_restriction
      fact:
        commands:
        - gh pr checks 18 --repo Quantum-L9/l9-constellation-topology --json name,bucket
        - gh pr view 18 --json headRefOid,mergeable,mergeStateStatus
        exit_code: 1
        stderr_verbatim: 'HTTP 403: This GraphQL query is not enabled for this session - only the pinned set of PR-review
          operations is served. Use REST via `gh api repos/{owner}/{repo}/...` instead.'
      consequence_observed:
        description: FACT - a background Monitor was armed using `gh pr checks --json`. Because the failure is silent inside
          a poll loop, the monitor would have polled to timeout emitting nothing while appearing healthy. It was detected
          only because the same command was run interactively and returned 403.
        remediation_applied: Monitor rewritten against REST (gh api repos/{o}/{r}/commits/{sha}/check-runs) and the original
          stopped via TaskStop.
      root_cause: FACT (documented) - docs/DEGRADED_MODE_CONTRACT.md and web/environment.env.example:99-101 state the gateway
        serves only a pinned set of PR-review GraphQL operations.
