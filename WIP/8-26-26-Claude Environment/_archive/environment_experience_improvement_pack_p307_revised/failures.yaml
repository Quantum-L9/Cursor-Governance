      rank: 1
      title: Piping `git push` into `tail` masked a rejected push and reported success
      category: operator_tooling
      impact: degrading
      impact_detail: 'A non-fast-forward rejection was reported as PUSH_OK. Had it not been re-checked, the session would
        have concluded that PR #70''s fix was pushed when it was not.'
      frequency: 1
      evidence:
        command: for i in 1 2 3 4; do if git push origin HEAD:chore/auto-seed-governance 2>&1 | tail -4; then echo "PUSH_OK";
          break; fi; ... done
        observed_output: 'hint: have locally. This is usually caused by another repository pushing to

          hint: the same ref. ... ''Note about fast-forwards''

          PUSH_OK

          '
        root_cause: In a pipeline, `$?` is the exit status of the last command (`tail`), not `git push`. Without `set -o pipefail`
          the rejection is invisible to the `if`.
        detection: Manual reading of the hint text in the output, not by exit code.
      resolution:
        action: Added `set -o pipefail` to the retry loop before re-pushing.
        verification: Re-push printed 'To https://github.com/Quantum-L9/l9-ci-sdk / c983a53..fe0dfab' with PUSH_OK.
      status: resolved
  reconciliation_action: KEEP
