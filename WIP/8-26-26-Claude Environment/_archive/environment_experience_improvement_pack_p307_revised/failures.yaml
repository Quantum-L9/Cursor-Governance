      severity: medium
      frequency: 4
      blocked_progress: true
      evidence:
      - 'tool_result: "Exit code 2 | sed: can''t read src/corpus_reasoning.ts: No such file or directory"'
      - 'tool_result: "Exit code 2 | sed: can''t read src/corpus_embeddings.ts: No such file or directory"'
      - 'tool_result: "Exit code 1 | head: cannot open ''corpus-report.md'' for reading: No such file or directory"'
      - 'tool_result: "Exit code 1 | ls: cannot access ''docs/decisions/'': No such file or directory | tail: cannot open
        ''docs/decision_log.md''"'
      - notice "Shell cwd was reset to /home/user" x6
      root_cause:
        classification: environment_defect
        statement: The Bash working directory persists across calls while it stays inside the primary working directory, and
          is reset to /home/user when a command leaves it. Governance tooling lives at /root/.cursor-governance, outside that
          tree, so every governance invocation silently returned the shell to /home/user and the next relative path resolved
          against the wrong root.
        proof:
        - cd /home/user/l9-meta-injector -> next call pwd=/home/user/l9-meta-injector (persisted)
        - cd /root/.cursor-governance -> "Shell cwd was reset to /home/user"; next call pwd=/home/user
      workaround_used: subshell isolation `( cd <dir> && ... )` and absolute paths
      workaround_effective: true
