      category: bootstrap
      measured:
        receipt_ttl_seconds: 86400
        receipt_age_seconds_observed: 87600
        governance_refresh_ttl_seconds: 3600
        governance_commits_behind: 0
      evidence:
      - '/root/.l9/claude/bootstrap-state.json: generated_at 2026-08-23T00:48:54Z, ttl 86400'
      - 'receipt governance_revision: fda7f5fee17ff3f6318942f2826cc3517f1c85b4'
      - 'clone HEAD: 84d06e3d340e75b46f5e9820e865e20376418f01'
      - '/root/.l9/claude/gov-refresh.json: state fresh, refreshed 2026-08-24T01:07:25Z'
      - 'session banner: "claude bootstrap: unknown — receipt expired (87516s old, ttl 86400s)"'
