- id: CR-009
  title: Destructive-path guardrails require fully literal targets
  status: ACTIVE_RECURRING
  summary: The guardrail evaluates command text and rejects same-line variable expansions even when the runtime value would
    be scoped. This is a usability constraint around an intentionally fail-closed boundary.
  source_records:
  - source_ref: P1/friction/FRICTION-12
    source_pack: P1
    source_path: friction.yaml
    source_id: FRICTION-12
    source_title: Destructive-command guardrail rejects a set variable in an rm -rf target
    source_record:
      id: FRICTION-12
      rank: 13
      title: Destructive-command guardrail rejects a set variable in an rm -rf target
      impact: low
      frequency: once-observed
      surface: governance
      command: rm -rf "$PACK" && mkdir -p "$PACK"
      denial_verbatim: 'git guardrails (l9-context-sensitive-git-guardrails): target ''$PACK'' contains an unresolved or empty
        expansion — an empty variable turns a scoped delete into a delete of its parent. Resolve it, or set L9_GIT_DESTRUCTIVE_AUTHORIZED=<reason>.'
      actual_state: $PACK was assigned on the preceding line of the same compound command.
      root_cause:
        statement: The guardrail evaluates command text, not runtime variable state.
        confidence: fact
      assessment: correct_fail_closed
      rationale: The prevented failure mode (empty expansion deleting a parent directory) is unrecoverable; the false-positive
        cost is one retry with a literal path.
      improvements: []
      recommendation: no change
