- id: CR-001
  title: Stop-hook safety signal cannot distinguish authored work from bootstrap residue
  status: ACTIVE_RECURRING
  summary: The turn-ending hook treats bootstrap-owned residue as author work and repeatedly asks for commits that would violate
    repository ownership or delete tracked content.
  source_records:
  - source_ref: P1/friction/FRICTION-01
    source_pack: P1
    source_path: friction.yaml
    source_id: FRICTION-01
    source_title: Stop hook demands committing files that must never be committed
    source_record:
      id: FRICTION-01
      rank: 1
      title: Stop hook demands committing files that must never be committed
      impact: high
      frequency: every-session
      surface: bootstrap
      observed_verbatim: '[~/.claude/stop-hook-git-check.sh]: There are untracked files in the repository. Please commit and
        push these changes to the remote branch.'
      what_it_covered:
        bootstrap_wiring_in_repos: 8
        wiring_paths:
        - .claude/hooks/merge_gate_wrap.py
        - .claude/hooks/session_start_claude_governance.sh
        - .claude/rules
        - .claude/settings.json
        - .mcp.json
        session_receipts: 2
        receipt_paths:
        - org-github-defaults/.l9/autonomy/l4-local-phase.json
        - org-github-defaults/.l9/autonomy/l4-release-receipt.json
      evidence: evidence/07-repos.txt
      root_cause:
        statement: The hook tests for any untracked file and cannot distinguish agent-authored work from machine-local bootstrap
          residue.
        confidence: fact
      correctness_conflict: Complying would violate rule 49-shared-worktree-isolation ("stage only paths you authored this
        session") across 8 unrelated repositories.
      observed_cost: Fires every session, was wrong about every file it flagged here, and trains agents to ignore it — degrading
        it as a safety signal.
      improvements:
      - IMP-08
      - IMP-06
      - IMP-07
  - source_ref: P3/friction/FRIC-02
    source_pack: P3
    source_path: friction.yaml
    source_id: FRIC-02
    source_title: Every repo permanently dirty and the Stop hook pushes toward committing it
    source_record:
