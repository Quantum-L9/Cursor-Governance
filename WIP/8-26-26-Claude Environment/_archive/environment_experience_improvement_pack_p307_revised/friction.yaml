      evidence:
      - 'cwd /home/user -> {"group_id": null, "error": "ambiguous group match: [8 repos] - set GRAPHITI_GROUP_ID", "readonly":
        true}'
      - 'cwd /home/user/l9-meta-injector -> {"group_id": "l9-meta-injector", "method": "registry", "readonly": false}'
      cost_description: The default working directory of every Bash call is /home/user, the multi-repository container root,
        which is exactly the location where group resolution is ambiguous and the client degrades to read-only.
      root_cause:
