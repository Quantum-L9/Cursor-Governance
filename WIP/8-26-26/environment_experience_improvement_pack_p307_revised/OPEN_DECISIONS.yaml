- id: OD-007
  title: Origin and lifecycle of standing publish override
  state: PARTIALLY_ANSWERED
  question: Which component issued L9_PUBLISH_PATH_OVERRIDE and what consumes/expires it?
  why_open: >
    The consumer is now known. The issuer and the expiry are not, and nothing expires it.
  sources: ['P9/MANIFEST.json#U-04', CI-007]
  answered_at_59f03a5d:
  - "CONSUMER: ops/autonomy/local_execution_gate.py:190-203 reads PUBLISH_PATH_OVERRIDE_ENV as a
     live human/ops breakglass over the publish-path plane. It is not inert."
  still_unknown:
  - "ISSUER: no component in the tree writes it; it arrives from the account environment layer."
  - "EXPIRY: none. The live value is the literal string 'one-time breakglass authorized by user',
     persisting across sessions."
  - "VISIBILITY: it is not among the 32 variables verify_account_env.py compares, so drift
     detection cannot see it appear, change or persist; and the session-start banner does not
     report that a grant is in force."
  contradiction_recorded: >
    The predecessor marked CI-007 done while OD-007 — the open decision about the same variable —
    stayed UNKNOWN. A record cannot be complete while the decision it depends on is open. This is
    the second half of CI-007's demotion evidence.
