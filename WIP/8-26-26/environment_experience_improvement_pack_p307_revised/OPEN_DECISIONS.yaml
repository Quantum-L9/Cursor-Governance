- id: OD-002
  title: Canonical publish command contract
  state: RESOLVED
  question: Must every governed consumer implement make pr, or should doctrine define a supported fallback?
  resolution: >
    Neither branch of the original question: the governance Makefile is the publish authority
    regardless of the repo worked in, a consumer needs no pr/pr-check target, and there is no
    raw-push fallback.
  resolved_by: Quantum-L9/Cursor-Governance PR#307 (CI-008), merged into main
  sources: [C-003, CI-008]
  evidence_59f03a5d:
  - "Re-confirmed unchanged: tests/ops/scripts/test_publish_verb_governance_always.py still
     pins the governance-rooted verb and that a consumer needs no pr target; CLAUDE.md and
     rules 48/88 carry the same contract."
  - "run_pr_precommit.sh changed since the predecessor binding (3163c35, #348) but the change
     added --staged commit-hook delegation, not the consumer leg."
  residual: >
    CI-008 stays partial. The consumer-workspace leg of the pre-commit path is scoped in-script
    (run_pr_precommit.sh:33-47) and explicitly not enabled — 'requires validation against a real
    consumer checkout (not available in this environment)'. That is an implementation residual,
    not a reopened decision. Wave 4, lane A.

