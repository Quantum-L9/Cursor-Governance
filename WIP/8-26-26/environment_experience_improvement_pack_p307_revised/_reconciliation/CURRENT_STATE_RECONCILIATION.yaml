    readiness merge_authority_status=READY — establishes that the readiness probe stopped
    crashing, which is not what the record is about. IMP-04, ENV-2 and I-EL-06 are all unmet
    at this binding, and the defect is live: L9_PUBLISH_PATH_OVERRIDE='one-time breakglass
    authorized by user' is in the session environment and is read by
    ops/autonomy/local_execution_gate.py:190-203 as a human/ops override of the publish plane.
