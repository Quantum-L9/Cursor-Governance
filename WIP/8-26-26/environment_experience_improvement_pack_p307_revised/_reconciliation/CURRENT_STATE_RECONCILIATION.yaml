    report it; and verify_account_env.py's 32-variable contract does not include it, so drift
    detection cannot see it appear, change or persist.
  consequence: >
    Promoted from unscheduled to leverage rank 1, opening lane L3 at t=0. It is the only
    active authority-widening defect in the queue, and being marked done is why no slice was
