corrected_claims:
- id: CI-002
  claim: >
    'apply is_tracked() before the remaining projection writes — claude_projection.py:422,
    reconcile_claude_l9_skills.py, reconcile_claude_commands.py, reconcile_claude_settings.py'
    was the pack's named next slice and its biggest open P0 residual.
  correction: >
    The grep is right and the inference is wrong. Each of the four already implements the
    non-destructive property the record's canonical_action asks for, by a different mechanism:
    managed-entry symlink sets that never touch unmanaged entries (skills docstring 4-6,
    commands docstring 5); merge_workspace_settings() preserving consumer-owned keys (92-110)
    behind write_if_changed (113); and .mcp.json rendered with every template-undefined server
    preserved (claude_projection.py:415) behind write-if-changed (419). Live proof: all four
    in-scope repositories report an empty `git status --porcelain --untracked-files=all`,
    including l9-meta-injector, which TRACKS .claude/settings.json.
  consequence: >
    CI-002 falls from headline slice to leverage rank 23 of 27. Genuine remainder is Phase 2c
    alone. Applying is_tracked() to those four adds a report, not a protection they lack.
- id: CI-014
  claim: "l4_local.py and graphiti_memory_client.py both need an explicit --workspace argument."
  correction: >
    ops/autonomy/l4_local.py:478 already declares --workspace, and
    `git show 30c6ecd4:ops/autonomy/l4_local.py` contains it — present and unrecorded at the
    predecessor binding. Only graphiti_memory_client.py lacks it, plus IMP-06's second clause
    (an actionable refusal naming --workspace), which l4_local.py:247 does not do.
- id: CI-006
  claim: "done_when '0 of 33 in exactly one layer' unmet; the stray var is still present."
  correction: >
    Met at this binding. verify_account_env.py reports 'OK: all 32 expected variables match'
    with zero drift, and L9_AUTONOMY_AUTONOMOUS_MERGE=false is in the session env but absent
    from /home/user/.claude/settings.json's env block — exactly one layer. The residual narrows
    to the class mechanism: source-file attribution and a widening-vs-cosmetic split.
- id: CI-036
  claim: "partial, residuals unchanged."
  correction: >
    Advanced by af33b4d (#331), merged after the predecessor binding: session_debt.py now treats
    a merged-and-deleted branch as published, using branch.<name>.remote because a squash merge
    leaves the commits unreachable from main and the deleted ref leaves nothing to compare.
    Pinned in both directions against a real bare upstream. Residuals otherwise stand.

