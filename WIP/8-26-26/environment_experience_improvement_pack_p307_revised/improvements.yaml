      renders .mcp.json preserving every server the template does not define (preserved_unmanaged, line 415) and
      write-if-changed at line 419.'
    - 'LIVE done_when check at this binding: all four in-scope repos report empty `git status --porcelain --untracked-files=all`,
      INCLUDING l9-meta-injector, which TRACKS .claude/settings.json. A tracked projection target survived a bootstrap
      with a clean tree.'
    - 'Phase 2c confirmed still open: /home/user/.claude/settings.json sets L9_AUTONOMY_STATE_DIR=.l9/autonomy,
      inside the worktree.'
    invalidated_legs:
    - 'IMP-06 (copy four .gitignore lines into 8 consumer repos) is INVALIDATED. The current design deliberately
      writes .git/info/exclude instead, and says so: ''which is LOCAL and uncommitted, so a consumer''s tracked
