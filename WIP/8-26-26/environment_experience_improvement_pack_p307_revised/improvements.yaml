      - F-04
      - FR-02
      root_cause: The CLI front door to Graphiti is healthy (health -> healthy true, tool_count 9) while the brokered
        MCP transport is not. One memory verdict cannot express that, so it reports DEGRADED and discourages the
        path that works.
      change: Split the memory component into memory.cli and memory.mcp, probed independently, and report each.
