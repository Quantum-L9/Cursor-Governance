      root_cause: /root/.claude/stop-hook-git-check.sh tests for any untracked file and cannot tell agent-authored
        work from machine-local wiring. It was wrong about every file it flagged.
      change: Exclude a known machine-local set (.claude/hooks/, .claude/rules, .claude/skills/, .mcp.json, .l9/)
        and scope the check to the repo the session actually worked in rather than every clone under /home/user.
        IMP-06 and IMP-07 make the hook correct by removing the residue; this makes it correct even when residue
        exists.
