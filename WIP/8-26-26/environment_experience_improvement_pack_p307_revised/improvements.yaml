      target: /root/.claude/stop-hook-git-check.sh
      effort: M
      risk: medium
      risk_note: Over-broad exclusions would mask genuinely uncommitted work; exclude by explicit path list, never
        by pattern breadth.
      done_when: A session that authored nothing outside its target repo ends with no Stop-hook warning, while a
        session with a genuinely uncommitted authored file still gets one.
