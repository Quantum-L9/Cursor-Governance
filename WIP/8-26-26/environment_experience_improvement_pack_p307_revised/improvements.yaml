- id: CI-010
  title: Make broker authentication and reachability diagnosable
  status: ACTIVE_WITH_UNKNOWN
  priority: 0
  dependencies:
  - CI-004
  canonical_action: Ensure CLAUDE_SESSION_JWT is issued or its absence is a hard named prerequisite failure; split
    broker states into DNS/unreachable, proxy-denied, and upstream-error before deciding allowlist remediation.
  source_records:
  - source_ref: P1/improvements/IMP-05
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-05
    source_title: Resolve or document the capability-broker denial
    source_record:
      id: IMP-05
      group: env_loader
      title: Resolve or document the capability-broker denial
      traces_to:
      - FAIL-05
      root_cause: broker.quantumaipartners.com:443 receives 502 to CONNECT from the proxy gateway; L9_CAPABILITY_BROKER_URL
        points there. Only attributable cause of capabilities DEGRADED.
      change: 'Determine whether the host belongs on the proxy allowlist. If yes, add it. If no, stop pointing L9_CAPABILITY_BROKER_URL
        at it in remote sessions and have SessionStart report "capabilities: unavailable (by policy)" rather than
        DEGRADED.'
      owner: L9 platform / proxy policy owner
      target:
      - proxy allowlist
      - L9_CAPABILITY_BROKER_URL
      effort: M
      risk: low
      done_when: Either the CONNECT succeeds, or SessionStart distinguishes blocked-by-policy from degraded.
      open_question: UNKNOWN whether any capability in this workload required the broker
  - source_ref: P9/improvements/I-EL-01
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-EL-01
    source_title: Issue CLAUDE_SESSION_JWT into the session, or make its absence a hard bootstrap failure
    source_record:
      id: I-EL-01
      title: Issue CLAUDE_SESSION_JWT into the session, or make its absence a hard bootstrap failure
      traces_to:
      - F-09
      root_cause: 'Five MCP entries send "Authorization": "${CLAUDE_SESSION_JWT}" and the variable is unset, so
        the header expands empty. The config''s own comment names this JWT as the mechanism by which the broker
        authenticates the session.'
      change: Have the loader mint or import the workload JWT and export it. If it cannot, fail the capability probe
        loudly at session start with the exact missing variable name rather than reporting a generic DEGRADED.
      owner: platform session provisioning plus the claude-code env loader
      target: environment.env / account field plane
      effort: M
      risk: high
      done_condition: test -n "$CLAUDE_SESSION_JWT" succeeds at session start, or the banner names CLAUDE_SESSION_JWT
        as the missing prerequisite.
      unknown_ref: U-01
  - source_ref: P9/improvements/I-EL-02
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-EL-02
    source_title: Distinguish broker-unreachable from broker-denied in the capability probe
    source_record:
      id: I-EL-02
      title: Distinguish broker-unreachable from broker-denied in the capability probe
      traces_to:
      - F-08
      root_cause: curl to the broker returns CONNECT tunnel failed, response 502 and DNS resolves nothing. A 502
        on CONNECT does not say whether the upstream is down or the proxy denied the host.
      change: Have the capability probe attempt DNS resolution and a direct connect separately, and report unreachable,
        proxy-denied, or upstream-error as distinct states in the receipt.
      owner: Cursor-Governance - capability probe in the claude-code adapter
      target: L9_CAPABILITY_BROKER_URL probe path
      effort: S
      risk: low
      done_condition: The receipt records one of three distinct broker states rather than a bare DEGRADED.
      unknown_ref: U-02
