      (#324, gate recognition of the REST merge) + pre-existing ops/scripts/lib/gh_auth_probe.sh
    residual:
    - 'IMP-01 only: the remote-session prompt still denies gh access that demonstrably works. Harness-owned; no
      in-repo lever.'
    evidence:
    - 'Re-verified at 59f03a5d: merge_gate REST transport, gh_auth_probe.sh, stack_safe_merge REST merge verb all
      intact.'
    - 'LIVE, this session: `gh api user --jq .login` returns cryptoxdog, while this session''s own system prompt
      states ''You do NOT have access to the gh CLI, hub CLI, or direct GitHub API access.'' IMP-01''s defect reproduces
      verbatim at this binding, unchanged across four assessments.'
    blocked_on: external
- id: CI-002
  title: Make bootstrap projection ownership-aware and non-destructive to tracked repo content
  status: ACTIVE
  priority: 0
  dependencies: []
  canonical_action: Detect repository-owned tracked paths before projection. Project machine-local rules/hooks/state
    only to non-repo-owned locations; ignore only genuinely generated/untracked paths. Never blanket-ignore or replace
    a repository-owned .claude tree.
  source_records:
  - source_ref: P1/improvements/IMP-06
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-06
    source_title: Propagate the existing gitignore stanza to the other 8 repos
    source_record:
      id: IMP-06
      group: bootstrap
      title: Propagate the existing gitignore stanza to the other 8 repos
      traces_to:
      - FRICTION-02
      - FRICTION-01
      root_cause: The correct commented ignore stanza exists in l9-meta-injector/.gitignore:45,48 and nowhere else.
        That repo shows 0 untracked entries; the other 8 show 3 to 5 each.
      change: Add the same four lines, with the existing rationale comment, to the remaining repos. The comment
        already records the non-obvious constraints (hooks carry absolute $HOME paths; .claude/rules needs no trailing
        slash because a trailing-slash pattern does not match a symlink). This is a copy, not a redesign.
      stanza:
      - .claude/hooks/
      - .claude/rules
      - .claude/skills/
      - .mcp.json
      caution: .claude/settings.json stays TRACKED where it is hand-authored repository content (as in Cognitive.Engine.Graphs,
        which tracks .claude/rules/* and .claude/agents/*). It is untracked bootstrap output only where the repo
        has no authored copy. Check per repo; do not blanket-ignore.
      owner: each repo maintainer, one PR per repo
      target:
      - Cognitive.Engine.Graphs/.gitignore
      - LLM-Router/.gitignore
      - SEO-Bot/.gitignore
      - Website-Bot/.gitignore
      - l9-ci-core/.gitignore
      - l9-ci-sdk/.gitignore
      - l9-cognitive-runtime/.gitignore
      - l9-graphiti-memory/.gitignore
      effort: M
      effort_note: 8 small PRs
      risk: low
      risk_note: additive; verify per repo that no currently-tracked file becomes ignored
      done_when: git status --porcelain --untracked-files=all is empty in all 8 after a fresh bootstrap.
  - source_ref: P1/improvements/IMP-07
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-07
    source_title: Ignore .l9/ wherever the L4 state dir is written, or move it out of the repo
    source_record:
      id: IMP-07
      group: bootstrap
      title: Ignore .l9/ wherever the L4 state dir is written, or move it out of the repo
      traces_to:
      - FRICTION-02
      - FAIL-07
      root_cause: L9_AUTONOMY_STATE_DIR=.l9/autonomy writes into the working repo, but only 4 of 10 repos ignore
        .l9. In org-github-defaults the receipts surfaced untracked and the Stop hook demanded they be pushed.
      change: Add .l9/ to the 6 repos that lack it. Orthogonally and preferably, point L9_AUTONOMY_STATE_DIR outside
        the repo (scratchpad or $HOME/.l9/) so session receipts never land in a working tree. The second option
        fixes the class; the first the instances.
      owner: governance environment maintainer (state dir) plus repo maintainers (gitignore)
      target:
      - L9_AUTONOMY_STATE_DIR
      - Cognitive.Engine.Graphs/.gitignore
      - l9-ci-core/.gitignore
      - l9-ci-sdk/.gitignore
      - l9-cognitive-runtime/.gitignore
      - l9-graphiti-memory/.gitignore
      - org-github-defaults/.gitignore
      effort: S for gitignore, M to relocate the state dir
      risk: medium
      risk_note: l4_local.py, local_execution_gate.py, and make pr all read this path; relocate together or not
        at all.
      done_when: Running l4_local.py authorize-release in any clone leaves git status --porcelain empty.
  - source_ref: P3/improvements/B1
    source_pack: P3
    source_path: improvements.yaml
    source_id: B1
    source_title: Never write to a consumer repo's tracked paths
    source_record:
      id: B1
      group: bootstrap_flow
      title: Never write to a consumer repo's tracked paths
      root_cause_ref: FAIL-02
      owner: environment/agents/adapters/claude-code/hooks/session_start_claude_governance.sh
      target: the bootstrap writer for .claude/** and .mcp.json
      effort: M
      risk: Low
      risk_note: strictly narrows what the bootstrap touches
      change: test git ls-files --error-unmatch before writing; if tracked, do not replace — fail closed and report,
        or compose additively; never swap a tracked directory for a symlink; never drop an existing hook or allowlist
        entry
      done_when: a session in Cognitive.Engine.Graphs leaves git status clean of tracked .claude paths, and that
        repo's PreToolUse banned-pattern guard is still registered at first tool call
      tracked_at: Quantum-L9/Cursor-Governance#281
      sequence: 1
  - source_ref: P3/improvements/B2
    source_pack: P3
    source_path: improvements.yaml
    source_id: B2
    source_title: Ignore the untracked injections at the container layer
    source_record:
      id: B2
      group: bootstrap_flow
      title: Ignore the untracked injections at the container layer
      root_cause_ref: FRIC-02
      owner: session_bootstrap
      target: core.excludesFile
      effort: S
      risk: Low
      change: ignore .claude/ and .mcp.json globally in the session environment
      limitation: necessary but not sufficient — cannot affect the tracked files in B1
      done_when: a fresh session reports a clean worktree in the repos with no tracked .claude content
      sequence: 4
  - source_ref: P6/improvements/BOOT-3
    source_pack: P6
    source_path: improvements.yaml
    source_id: BOOT-3
    source_title: Stop dirtying repo checkouts with session artifacts
    source_record:
      id: BOOT-3
      plane: bootstrap
      title: Stop dirtying repo checkouts with session artifacts
      root_cause_ref: FA-4
      root_cause_observed: '.mcp.json/.claude written untracked into 3 of 4 checkouts; caused PR #235 /.claude/
        gitignore defect'
      change: 'write session MCP/hook config to overlay outside worktree or to .git/info/exclude at bootstrap; design
        tracked-.claude projection split PR #235 deferred'
      owner: governance-maintainer
      target: cloud bootstrap (setup.bootstrap.sh / adapter install), not consumer .gitignore
      effort: ML
      risk: MCP config discovery must still resolve; tracked-.claude repos need overlay design
      done_condition: 'fresh session: git status --porcelain clean in all 4 checkouts post-bootstrap with MCP+hooks
        functional'
  - source_ref: P9/improvements/I-BS-01
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-01
    source_title: Stop projecting .claude/rules over repository-owned trees; project to a path the repository does
      not track
    source_record:
      id: I-BS-01
      title: Stop projecting .claude/rules over repository-owned trees; project to a path the repository does not
        track
      traces_to:
      - F-01
      - F-02
      - FR-10
      root_cause: The adapter replaces the tracked .claude/rules directory with a symlink to the governance clone,
        producing 9 tracked-file deletions plus an untracked symlink in every CEG working copy.
      change: Detect that the target path is tracked (git ls-files --error-unmatch) before projecting. When it is
        tracked, project the governance rules to a sibling path the repository does not own and reference that path
        instead of overwriting repository content.
      owner: Cursor-Governance - environment/agents/adapters/claude-code/install.sh and the rule-projection step
      target: /root/.cursor-governance/environment/agents/adapters/claude-code/
      effort: M
      risk: medium
      done_condition: In a fresh session on Cognitive.Engine.Graphs, git status --porcelain is empty immediately
        after bootstrap, and the governance rules are still readable by the agent.
      verification: git -C Cognitive.Engine.Graphs status --porcelain | wc -l -> 0
  reconciliation_action: MERGE
  progress:
    status: partial
    disposition: PARTIAL
    queue: active
    assessed_against_sha: 59f03a5d4460b939360bc2fd5dd85239d47416a5
    previous_status: partial
    delivered_by: PR#304 (Contract 1) + PR#307 (CI-008/CI-009/CI-002 slice), both merged into main
    residual:
    - Phase 2c (relocate L9_AUTONOMY_STATE_DIR outside the worktree). The only unmitigated leg. Touches l4_local.py
      + local_execution_gate.py + make pr together.
    - 'Phase 2b (project to a non-owned sibling when the target is tracked) is an ownership-MODEL change, not a
      defect repair: the hazard it was written against is already mitigated by the four mechanisms above. Re-cost
      it before scheduling.'
    - The 8-fixture git-status-clean done_when is satisfied for the 4 repos attachable at this binding; the other
      4 remain unverified for want of a session that carries them.
    evidence:
    - is_tracked is still defined and called only in ops/scripts/reconcile_llm_rule_adapters.py (lines 27, 146);
      grep -c returns 0 for the other four write sites. The recorded fact is confirmed.
    - 'But the inference drawn from it does not hold. Each of the four sites already implements the non-destructive
      property this record''s canonical_action asks for, by a different mechanism: reconcile_claude_l9_skills.py
      and reconcile_claude_commands.py operate on a MANAGED-ENTRY set of per-entry symlinks and document that unmanaged
