    - 'I-BF-03 / IMP-10 / B5: a reason string and log path per degraded component. The deps stage already has log
      files; the other five components have nothing.'
    evidence:
    - REPRODUCING AT THIS BINDING, fourth recorded occurrence. /root/.l9/claude/bootstrap-state.json carries governance_revision
      b618338db235b120709202a217c8b0109bc3c05b, generated_at 2026-08-28T04:34:13Z. /root/.l9/claude/gov-refresh.json
      carries local_sha and origin_sha 59f03a5d, refreshed_at 2026-08-28T21:39:28Z. readiness-receipt.json carries
      governance_SHA 59f03a5d. Two stores, two answers, one session, nothing invalidated the stale one.
    - The stale receipt is 17 hours old against ttl_seconds 86400, so TTL will not catch it. Revision-mismatch expiry
      is the only mechanism that would, and claude_bootstrap_receipt.py implements TTL only (lines 98-102); governance_revision
      is carried through at line 88 and never compared.
    - 'Per-component evidence still absent: bootstrap-state.json reports bare DEGRADED for shared_bootstrap, capabilities,
