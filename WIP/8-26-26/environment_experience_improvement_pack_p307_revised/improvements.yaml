  - source_ref: P9/improvements/I-BS-05
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-05
    source_title: Report memory health per transport instead of as one collapsed verdict
    source_record:
      id: I-BS-05
      title: Report memory health per transport instead of as one collapsed verdict
      traces_to:
