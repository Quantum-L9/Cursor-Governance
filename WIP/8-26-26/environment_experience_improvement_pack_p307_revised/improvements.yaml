      owner: Cursor-Governance - ops/graphiti and the adapter bootstrap probe
      target: /root/.l9/claude/bootstrap-state.json schema
      effort: M
      risk: low
      done_condition: With the broker unreachable and the CLI healthy, the banner reports memory.cli READY and memory.mcp
