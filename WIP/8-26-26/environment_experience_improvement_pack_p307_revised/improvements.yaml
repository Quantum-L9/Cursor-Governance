      title: Make governance CLIs take the target repository explicitly
      traces_to:
      - F-01
      - F-02
      - FR-06
      observed_root_cause: l4_local.py derives the branch from its process working directory, so running it from
        the governance clone inspected that clone and refused with "L4 begin refused on 'main'" three times. The
        same cwd dependence makes the memory client resolve a null group from /home/user. The Bash working directory
        resets to /home/user whenever a command leaves that tree, so the wrong-cwd state is the default rather than
        the exception.
      change: 'Add an explicit `--workspace <path>` argument to l4_local.py and the graphiti client, defaulting
        to the current behaviour. Where a tool refuses because of the directory it was run from, say so: "refused
        on ''main'' in /root/.cursor-governance - did you mean --workspace <target repo>?".'
      target:
      - /root/.cursor-governance/ops/autonomy/l4_local.py
      - /root/.cursor-governance/ops/graphiti/graphiti_memory_client.py
      owner: autonomy-maintainer
      effort: M
      risk: low
      done_condition: '`python3 l4_local.py status --workspace /home/user/l9-meta-injector` from any directory reports
        that repository, and the refusal message names the directory it inspected.'
