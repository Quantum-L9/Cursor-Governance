records:
- id: CI-001
  title: Publish and enforce the real GitHub REST/GraphQL capability boundary
  status: ACTIVE
  priority: 1
  dependencies: []
  canonical_action: Document REST and GraphQL independently; use a REST auth probe; give merge/PR helpers REST-capable
    probe/execution paths; report probe-blocked separately from stack/auth unknown.
  source_records:
  - source_ref: P1/improvements/IMP-01
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-01
    source_title: Publish the gh REST/GraphQL split as an explicit environment fact
    source_record:
      id: IMP-01
      group: env_loader
      title: Publish the gh REST/GraphQL split as an explicit environment fact
      traces_to:
      - FAIL-01
      - FAIL-02
      - FRICTION-03
      root_cause: gh auth status probes via GraphQL; the proxy 403s GraphQL; gh renders that as an invalid token.
        The session prompt separately claims no gh access at all.
      change: 'Correct the session prompt''s GitHub section to state the real capability boundary: gh api REST works;
        gh GraphQL and all gh pr subcommands are blocked; gh auth status will falsely report an invalid token. Do
        not tell agents they have no gh access.'
      owner: remote-session prompt owner (Anthropic harness)
      owner_confidence: UNKNOWN whether this org can edit this surface
      target: session system prompt, GitHub Integration section
      effort: S
      risk: low
      risk_note: text only
      done_when: A fresh session's prompt names the REST/GraphQL split, and an agent reading it does not abandon
        gh on an auth status failure.
  - source_ref: P1/improvements/IMP-02
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-02
    source_title: Stop treating gh auth status as the auth preflight
    source_record:
      id: IMP-02
      group: env_loader
      title: Stop treating gh auth status as the auth preflight
      traces_to:
      - FAIL-01
      root_cause: Same as IMP-01; this is the agent-side half, shippable without harness changes.
      change: In l9-pr-remediation preflight check P_cmd, replace any gh auth status probe with `gh api user --jq
        .login`. Record REST reachability and GraphQL reachability as separate fingerprint fields so a GraphQL block
        does not read as an auth failure.
      owner: governance skill maintainer
      target: /root/.cursor-governance/skills/l9-pr-remediation/references/run-contract.md
      effort: S
      risk: low
      done_when: Preflight on this container reports github_rest reachable, github_graphql blocked, auth valid —
        not "token invalid".
  - source_ref: P1/improvements/IMP-11
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-11
    source_title: Give stack_safe_merge and merge_gate a REST probe path
    source_record:
      id: IMP-11
      group: governance_tooling
      title: Give stack_safe_merge and merge_gate a REST probe path
      traces_to:
      - FAIL-03
      - FAIL-02
      root_cause: merge_gate._stacked_children (lines 240, 244) shells to gh pr view --json and gh pr list --json,
        both GraphQL. stack_safe_merge imports it. Exit 2 in this environment.
      change: Implement the probe over REST — gh api repos/{owner}/{repo}/pulls?state=open returns head.ref and
        base.ref for every open PR, which is all _stacked_children needs. Keep GraphQL as a fast path and fall back
        to REST on 403.
      viability_evidence: 'Verified: REST is exactly how the correct topology was derived by hand in the observed
        run.'
      owner: governance autonomy maintainer
      target: /root/.cursor-governance/ops/autonomy/merge_gate.py (_stacked_children, _gh_json)
      effort: M
      risk: medium
      risk_note: This function backs a fail-closed safety gate; add tests for 403-fallback, empty-children, and
        stacked-parent before shipping.
      done_when: stack_safe_merge.py --repo Quantum-L9/.github --pr <n> --json exits 0 on this container with no
        L9_STACK_PROBE_FILE set, and returns "merge" for a stacked parent.
  - source_ref: P1/improvements/IMP-12
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-12
    source_title: Distinguish probe-blocked from stack-unknown in the deny reason
    source_record:
      id: IMP-12
      group: governance_tooling
      title: Distinguish probe-blocked from stack-unknown in the deny reason
      traces_to:
      - FAIL-03
      root_cause: _stack_safety_reason catches RuntimeError from the probe and returns _stack_unknown_reason regardless
        of cause. A proxy 403 and a genuinely ambiguous topology produce the same operator-facing message.
      change: Propagate the probe's failure kind into the deny reason. Fail-closed behavior stays exactly as it
        is; only the message changes.
      owner: governance autonomy maintainer
      target: ops/autonomy/merge_gate.py (_stack_safety_reason, _stack_unknown_reason)
      effort: S
      risk: low
      risk_note: message-only; do not alter the deny decision
      done_when: A GraphQL-blocked probe denies with a reason naming the transport, not "unknown".
  - source_ref: P2/improvements/IMP-A1
    source_pack: P2
    source_path: improvements.yaml
    source_id: IMP-A1
    source_title: Resolve the gh-CLI / gh-token mismatch
    source_record:
      id: IMP-A1
      title: Resolve the gh-CLI / gh-token mismatch
      traces_to:
      - FRIC-04
      - FRIC-10
      root_cause: GH_TOKEN and GITHUB_TOKEN are set in the environment while gh and hub are absent. The l9-pr-remediation
        skill specifies its entire input contract in gh commands, all of which had to be re-derived against mcp__github__*
        tools.
      proposal: 'Either install gh in this environment, or rewrite the skill''s Core Contract table to name the
        mcp__github__* equivalents. The second removes a dependency rather than adding one, and also fixes the inability
        to poll GitHub from Monitor/bash.

        '
      owner: 'role: platform / skill owner (UNKNOWN)'
      target: Environment image, or .claude/skills/synced/l9-pr-remediation/SKILL.md
      effort: M
      risk: low
      done_condition: Every command in the skill's Core Contract table is executable as written in this environment,
        or the table names tools that are.
  - source_ref: P3/improvements/C1
    source_pack: P3
    source_path: improvements.yaml
    source_id: C1
    source_title: Give stack_safe_merge.py a REST path
    source_record:
      id: C1
      group: tooling_contract
      title: Give stack_safe_merge.py a REST path
      root_cause_ref: FAIL-01
      owner: ops/autonomy/stack_safe_merge.py, ops/autonomy/merge_gate.py
      target: _stacked_children probe and the merge exec
      effort: M
      risk: Med
      risk_note: the gate must not be bypassable through the new path
      change: implement _stacked_children over REST (GET /repos/{o}/{r}/pulls?base=<head>&state=open, exit 0 in
        this session) with GraphQL as an optimisation; exec the merge via PUT /repos/{o}/{r}/pulls/{n}/merge when
        gh pr merge is unavailable; ensure merge_gate intercepts that REST call as it does the CLI form
      done_when: stack_safe_merge.py --run completes in a GraphQL-disabled session, and a REST merge attempted without
        authorisation is refused
      sequence: 2
  - source_ref: P3/improvements/A6
    source_pack: P3
    source_path: improvements.yaml
    source_id: A6
    source_title: Reconcile the documented tool surface with the observed one
    source_record:
      id: A6
      group: environment_and_variable_loader
      title: Reconcile the documented tool surface with the observed one
      root_cause_refs:
      - FRIC-10
      - FAIL-01
      owner: session_prompt_composer
      target: system prompt GitHub Integration section
      effort: S
      risk: Low
      change: 'state the real surface: gh present, repository-scoped REST permitted, GraphQL and org-wide search
        unavailable'
      done_when: an agent can predict which gh invocations will fail without probing
      sequence: 6
  - source_ref: P4/improvements/IMP-11
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-11
    source_title: Stop treating gh auth status as a health check on this surface
    source_record:
      id: IMP-11
      stream: other
      priority: 6
      title: Stop treating gh auth status as a health check on this surface
      traces_to:
      - F-10
      observed_root_cause: '`gh auth status` exits 1 with "The token in GH_TOKEN is invalid" while `gh api repos/...`
        exits 0 and `make pr` opened PR #81 successfully. GH_TOKEN is 14 characters, which is not a PAT shape.'
      change: Where a preflight needs to know whether GitHub is reachable, call `gh api user` or `gh api repos/<owner>/<repo>`
        and check the exit code. Note in rule 62-github-openclaw-authority that on proxied cloud surfaces GH_TOKEN
        may be a placeholder and auth status is not authoritative.
      target:
      - /root/.cursor-governance/rules/62-github-openclaw-authority.mdc
      - /root/.cursor-governance/ops/scripts/open_pr_after_gate.sh
      owner: governance-rules-maintainer
      effort: S
      risk: low
      unknown_to_resolve_first: Which component supplies the working credential. Confirm before rewriting the rule,
        so the replacement text describes the real mechanism.
      done_condition: No sanctioned script gates on `gh auth status`, and rule 62 states what authorises GitHub
        calls on a proxied surface.
  - source_ref: P7/improvements/IMP-02
    source_pack: P7
    source_path: improvements.yaml
    source_id: IMP-02
    source_title: Reconcile gh authentication with the session gateway
    source_record:
      id: IMP-02
      category: environment
      title: Reconcile gh authentication with the session gateway
      root_cause: F-05 (GH_TOKEN invalid to gh; GraphQL refused; subscribe 404; REST-only via proxy)
      change: 'Either provision a valid GH_TOKEN for the container, or make REST-only operation explicit: document
        it in the session-deps line, and teach open_pr_after_gate.sh to skip its gh-subscribe step (it already warns)
        when GraphQL is unavailable, pointing to the MCP subscription instead.

        '
      owner: platform (token) + governance-repo (script messaging)
      target: environment config revision
      effort: S-M
      risk: low
      done_condition: '`gh auth status` reports a valid principal OR the publish flow emits one deliberate "REST-only
        session" line with no 404/GraphQL noise.

        '
  - source_ref: P8/improvements/I-WT-02
    source_pack: P8
    source_path: improvements.yaml
    source_id: I-WT-02
    source_title: Fail fast when a GraphQL-dependent gh subcommand is used on this surface
    source_record:
      id: I-WT-02
      title: Fail fast when a GraphQL-dependent gh subcommand is used on this surface
      traces_to:
      - F-02
      root_cause: '`gh pr checks --json` returns HTTP 403 from the session gateway. Inside a background poll loop
        the failure is silent, so a monitor can appear healthy while emitting nothing.'
      change: Document (or wrap) the GraphQL-backed gh subcommands as unavailable on this surface, and prefer the
        REST forms in any monitor or poll template.
      owner: environment/runner owner + docs
      target: docs/DEGRADED_MODE_CONTRACT.md and any monitor guidance
      effort: S
      risk: Low - documentation and template change.
      done_condition: A monitor template exists that uses `gh api .../check-runs` and a reader can see which gh
        subcommands are unavailable before writing one.
  - source_ref: P9/improvements/I-EL-04
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-EL-04
    source_title: Correct the documented tool inventory to match the provisioned image
    source_record:
      id: I-EL-04
      title: Correct the documented tool inventory to match the provisioned image
      traces_to:
      - F-20
      - F-11
      root_cause: Session documentation states the gh CLI is unavailable. gh 2.98.0 is installed, and gh api REST
        was the path that actually opened a pull request. Separately, gh pr create returns 403 from the GraphQL
        surface while REST succeeds.
      change: State that gh is present, that the REST surface is permitted, and that the GraphQL surface used by
        gh pr create is not - so the working path is documented rather than discovered.
      owner: harness session documentation
      target: session system prompt / environment documentation
      effort: S
      risk: low
      done_condition: Documentation matches command -v gh and names REST as the supported PR-creation surface.
  reconciliation_action: MERGE
  progress:
    status: partial
    disposition: PARTIAL
    queue: external_blocked
    assessed_against_sha: 59f03a5d4460b939360bc2fd5dd85239d47416a5
