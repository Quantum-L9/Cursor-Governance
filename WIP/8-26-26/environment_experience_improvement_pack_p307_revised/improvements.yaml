- id: CI-023
  title: Collapse variable-loading authorities into one reproducible loader contract
  status: ACTIVE
  priority: 1
  dependencies: []
  canonical_action: Define one loader/precedence contract that works in non-interactive shells, fails fast on missing
    required configuration, guards source-without-call misuse, and removes inert/documented-but-unused variables.
  source_records:
  - source_ref: P4/improvements/IMP-01
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-01
    source_title: Load the session env in non-interactive shells, not only interactive ones
    source_record:
      id: IMP-01
      stream: env_loader
      priority: 1
      title: Load the session env in non-interactive shells, not only interactive ones
      traces_to:
      - FR-10
      - F-02
      observed_root_cause: /root/.bashrc returns at line 6 for non-interactive shells and sources $HOME/.l9/cloud-session.env
        at line 110, so the agent's Bash tool never sees L9_GOVERNANCE_DIR or L9_STUB_REVISION.
      change: Move the source line above the `[ -z "$PS1" ] && return` guard in /root/.bashrc, or set BASH_ENV to
        a wrapper that sources cloud-session.env, so non-interactive shells get the same variables as login shells.
      target:
      - /root/.bashrc
      - /root/.cursor-governance/environment/agents/adapters/claude-code/web/setup.bootstrap.sh
      owner: governance-adapter-maintainer
      effort: S
      risk: low
      risk_note: Sourcing earlier runs the unset block earlier too; the file only exports four variables and unsets
        thirteen credential names, so ordering is not load-bearing. Verify the unsets still apply.
      done_condition: '`bash -c ''echo $L9_GOVERNANCE_DIR $L9_STUB_REVISION''` prints both values, and `env | grep
        -c ''^L9_''` returns at least 25 in the agent shell.'
  - source_ref: P4/improvements/IMP-02
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-02
    source_title: State in rule 06 that the resolver must be called, not merely sourced
    source_record:
      id: IMP-02
      stream: env_loader
      priority: 2
      title: State in rule 06 that the resolver must be called, not merely sourced
      traces_to:
      - FR-09
      observed_root_cause: Rule 06-governance-ssot-paths says scripts "source resolve_governance_paths.sh and use
        the exported $GOV_ROOT". Sourcing alone exports nothing and returns 0; resolve_governance_paths() must be
        invoked. Four probes were spent establishing this.
      change: Amend the rule text to `source ...; resolve_governance_paths_or_exit`, and have resolve_governance_paths.sh
        print a one-line warning to stderr when it is sourced by a shell that never calls either entry point.
      target:
      - /root/.cursor-governance/rules/06-governance-ssot-paths.mdc
      - /root/.cursor-governance/ops/scripts/resolve_governance_paths.sh
      owner: governance-rules-maintainer
      effort: S
      risk: low
      done_condition: The rule shows the two-line invocation, and a script that sources without calling emits a
        diagnostic instead of silently continuing with GOV_ROOT empty.
  - source_ref: P5/improvements/IMP-002
    source_pack: P5
    source_path: improvements.yaml
    source_id: IMP-002
    source_title: Provide a real .env.local and fail fast on placeholder secrets
    source_record:
      id: IMP-002
      traces_to: FR-002
      category: env_loader
      title: Provide a real .env.local and fail fast on placeholder secrets
      root_cause: No .env/.env.local exists; 0 of 49 fields come from the environment, so neo4j_password, inter_node_secret
        and database_url resolve to shipped placeholders.
      actions:
      - cp .env.local.example .env.local and fill the values actually needed
      - Add a pydantic model_validator that raises when a placeholder default ('changeme', 'dev-inter-node-secret')
        is active outside test runs
      owner: repo maintainer
      target: app/core/config.py, .env.local
      effort: S
      risk: medium
      risk_note: A fail-fast validator can break any flow that silently relied on defaults; gate it so tests are
        exempt.
      done_condition: Starting the app with placeholder secrets raises at startup; the test suite still passes unchanged.
  - source_ref: P5/improvements/IMP-005
    source_pack: P5
    source_path: improvements.yaml
    source_id: IMP-005
    source_title: Collapse five environment authorities to one plus a generated example
    source_record:
      id: IMP-005
      traces_to: FR-005
      category: env_loader
      title: Collapse five environment authorities to one plus a generated example
      root_cause: Five files describe env vars. .env.required names APP_NAME/APP_API_KEY/APP_PORT, none of which
        are Settings fields, so extra="ignore" discards them. .env.template sets APP_MODULE=engine.main:app, wrong
        for this app.
      actions:
      - Make docs/contracts/config/env-contract.yaml the single authority
      - Generate .env.example from it plus app/core/config.py so drift is impossible
      - Delete .env.required and .env.template (zero consumers; grep confirms only bootstrap.sh self-references)
      - Add a test asserting every name in the contract is a Settings field
      owner: repo maintainer
      target: .env.required, .env.template, .env.example, docs/contracts/config/env-contract.yaml
      effort: M
      risk: medium
      risk_note: Deleting a file named '.env.required' looks alarming; the PR must show it has no readers.
      done_condition: One authority remains; a test fails if a documented variable is not a Settings field.
  - source_ref: P5/improvements/IMP-006
    source_pack: P5
