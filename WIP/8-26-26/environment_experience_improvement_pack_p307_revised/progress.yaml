schema_additions:
- 'blocked_on: external — adopted from the predecessor''s own proposed `progress-schema/external-owner`. Without
  it, six records this org cannot start sit in the same not_started bucket as work that could ship today, and the
  not-started count is not a workload.'
- queue — active | external_blocked | needs_attachment | closed. The active queue is what a session can pick up
  now.
- disposition — the full status class (COMPLETE / PARTIAL / NOT_STARTED / BLOCKED / UNKNOWN), kept alongside `progress`
  so the coarse word stays backward-compatible with the predecessor's three values.
- 'optimized_sequence / execution_lane / schedule_slot / effort_weight / priority_class / blocker_class / leverage_rank
  / hard_dependencies / collides_with / parallelizable_with — the re-derived execution order. `execution_wave` is
  GONE: waves were global barriers that no dependency required. A record now carries the lane and the effort interval
  it occupies.'
- previous_progress + demoted_from_done — every status change is legible against the predecessor rather than silently
  replacing it.
next_slice:
  id: slice-live-authority-and-receipt-truth
  title: Lane openers — the standing breakglass grant and the receipt that lies about it
  supersedes: slice-ownership-aware-writes
  why: 'The predecessor''s slice was ownership-aware writes, on the premise that PR#307 guarded one write site and
    left four unguarded. The premise does not survive inspection: all four already compose additively and no-op
    when unchanged, and four in-scope repositories report clean trees — including l9-meta-injector, which TRACKS
    .claude/settings.json. That slice is rework. What replaces it is what the counts were hiding: CI-007 is a live
    standing breakglass grant over the publish plane with no issuer, scope or expiry, marked done on evidence about
    a different question; and CI-004''s receipt disagreement is reproducing at this binding for the fourth recorded
    time.'
  records:
  - 'CI-007 (P0, leverage 1): L9_PUBLISH_PATH_OVERRIDE=''one-time breakglass authorized by user'' is live in the
    session env and read by local_execution_gate.py:194. Remove the standing variable or give it a value describing
    an actual standing policy; express breakglass as a receipt with issuer, scope and expiry; report any grant in
    force, with its age, at session start.'
  - 'CI-006 (P0, leverage 8, same lane after CI-007): the instance is closed — verify_account_env.py reports all
    32 expected variables matching, in one layer. What remains is the class mechanism: name the file that produced
    a drifted value, and separate authority-widening drift from cosmetic drift.'
  - 'CI-004 (P0, leverage 2): treat a governance_revision mismatch as expiry distinct from TTL; re-probe DEGRADED
    components at session start; carry a reason and a log path per component.'
  - 'CI-009+CI-028 (P0/P2, leverage 3-4, ONE edit, lane L2 [4-6]): the deps stage writes a zero-byte stamp and a
    two-line log with no exit code and no import proof, behind a banner that says ''toolchain ready''. The exit-code
    plumbing is the carrier for the smoke.'
  - 'CI-003 (P1, leverage 5): add `.mcp.json` to the Claude-specific exclude block in install.sh. One glob. The
    scoping decision it belongs to is already made and documented at install.sh:391-395.'
  excluded: CI-002 Phase 2c (L9_AUTONOMY_STATE_DIR relocation) — touches l4_local.py, local_execution_gate.py and
    the publish path together. Re-derived at region granularity it collides with nothing — gate#statedir is disjoint
    from CI-013's gate#stages and l4#statedir from CI-016's l4#receipt-fields — so it opens lane L2 at t=0 instead
    of trailing the queue.
  alternative: 'None proposed. The predecessor''s alternative — the receipt-integrity slice — is no longer an alternative:
    CI-004 is inside this slice, and CI-034/CI-035 remain proposed against it.'
