  supersedes: six-wave-barrier-model
  recommended_width: 4
  recommended_reason: Not the fastest — 6 lanes finishes in 7 units against 11. It is the width the publication
    doctrine supports. Rule 48 stacks concurrent PRs bottom-up with rebase and conflict resolution forbidden, which
    holds only while scopes stay disjoint; every additional lane is another branch that must stay mergeable against
    a moving base. Four lanes keeps the stack reviewable and still beats the wave model. Go to 6 if review throughput
    allows; there is no reason to exceed 7.
