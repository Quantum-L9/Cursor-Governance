- id: CI-017
  title: Validate generated-artifact membership and report all drift in one pass
  status: ACTIVE
  priority: 1
  dependencies: []
  canonical_action: Make validation tolerate legitimate index/worktree states, catch missing manifest
    membership at file creation, and report every generated artifact out of step in one run.
  source_records:
  - source_ref: P2/improvements/IMP-B1
    source_pack: P2
    source_path: improvements.yaml
    source_id: IMP-B1
    source_title: Make `scripts/generate_validation_report.py` tolerate an index/worktree mismatch
    source_record:
      id: IMP-B1
      title: Make `scripts/generate_validation_report.py` tolerate an index/worktree mismatch
      traces_to:
      - FAIL-02
      root_cause: _tracked_files() reads `git ls-files -z` (the index) then opens each path from the working
        tree (line 120 -> line 83). A staged-but-deleted-on-disk path raises FileNotFoundError and aborts
        gate 7.
      proposal: 'Either fail with a clear message naming the divergent paths and instructing `git add
        -A`, or read blobs via `git cat-file` so the report describes the index it enumerated. The second
        is the more correct fix: the report claims to describe a commit.

        '
      owner: 'role: repo maintainer (UNKNOWN)'
      target: scripts/generate_validation_report.py
      effort: M
      risk: medium
      risk_detail: Changes what the file_tree_digest is computed over. That digest is commit-bound evidence,
        so the change needs an ADR per CLAUDE.md.
      done_condition: With a `git rm --cached`-style divergence present, the script either exits non-zero
        with a message naming the path, or produces a digest identical to the committed-tree digest. No
        traceback.
  - source_ref: P4/improvements/IMP-09
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-09
    source_title: Report every out-of-step generated artefact in one pass
