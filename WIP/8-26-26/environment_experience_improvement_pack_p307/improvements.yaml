      split (I-BS-05)'
    - 'live hydrate: stats facts_returned=8, and all 8 are self-referential PICKUP restatements (''The
      next action involves resuming from the latest Graphiti PICKUP'') — a hydration carrying no task
      state reports as successful (I-BS-06, IMP-09)'
    - the multi-repo banner naming the cap and the skip reason predates this assessment (78f122a) and
