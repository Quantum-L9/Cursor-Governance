  canonical_action: Use one authoritative probe per memory transport, distinguish nothing-to-write from
    failed writes, write a task-bearing completion PICKUP, prioritize the target repo in hydration, and
    name skipped repos/empty state explicitly.
  source_records:
  - source_ref: P1/improvements/IMP-09
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-09
    source_title: Make hydration relevance-ordered, or report what it skipped
    source_record:
      id: IMP-09
      group: bootstrap
      title: Make hydration relevance-ordered, or report what it skipped
      traces_to:
      - FRICTION-06
      root_cause: hydrated 6 of 11 (cap 6); selection is not relevance-driven and none of the 6 was the
        repo being worked on. All 8 facts were PICKUP restatements with no task content.
      change: Order hydration by the session's declared repo scope / task target before applying the cap,
        and have the packet name the repos it skipped. If a PICKUP has no task content, say so rather
        than emitting 8 paraphrases of the same empty result.
      owner: Graphiti hydration maintainer
      target: /root/.cursor-governance/ops/graphiti/hydration/
      effort: M
      risk: low
      done_when: The packet lists skipped repos and a session targeting one repo hydrates that repo first.
      open_question: UNKNOWN whether the cap of 6 is a latency budget or a context budget; that determines
        whether raising it is an option.
  - source_ref: P4/improvements/IMP-05
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-05
    source_title: Name the repositories that hydration skipped
    source_record:
      id: IMP-05
      stream: bootstrap
      priority: 3
      title: Name the repositories that hydration skipped
      traces_to:
      - FR-07
      observed_root_cause: The banner says "hydrated 6 of 9 repositories under /home/user (cap 6)". Eight
        of the nine directories are git repositories. Which two were excluded is not stated, so an agent
        cannot tell whether its target repository has memory loaded.
      change: 'Print the excluded repository names and the ordering rule, e.g. "skipped: SEO-Bot, Website-Bot
        (cap 6, ordered by last commit)".'
      target:
