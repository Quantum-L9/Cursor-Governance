      effort: S
      risk: medium
      risk_note: AUTONOMOUS_MERGE gates unattended merging; confirm intended value with a human before
        flipping it.
      done_when: SessionStart reports 0 of 33 drifted and the value is set in exactly one layer.
      decision_required: true
