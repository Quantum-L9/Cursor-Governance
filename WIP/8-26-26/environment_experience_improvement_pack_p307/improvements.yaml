      traces_to:
      - FRICTION-09
      root_cause: The verifier expects 'false'; /home/user/.claude/settings.json:166 sets "true". The
        reported repair targets the account env pane, which is not the source.
      change: Decide which value is correct, then make settings.json and the verifier agree. Extend the
