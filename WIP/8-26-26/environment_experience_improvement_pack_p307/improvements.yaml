- id: CI-004
  title: Regenerate bootstrap receipts on lifecycle/revision changes and re-probe degraded components
  status: ACTIVE
  priority: 0
  dependencies: []
  canonical_action: Bind receipts to container/session lifecycle and governance revision; invalidate stale
    receipts; re-probe DEGRADED components; retain per-component reason, evidence, log path, and retry/remediation
    state.
  source_records:
  - source_ref: P1/improvements/IMP-10
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-10
    source_title: Emit a reason for each degraded bootstrap subsystem
    source_record:
      id: IMP-10
      group: bootstrap
      title: Emit a reason for each degraded bootstrap subsystem
      traces_to:
      - FRICTION-10
      root_cause: SessionStart reports 5 of 8 subsystems degraded with no reason, log path, or retry hint.
        Only capabilities was attributable, and only by manual correlation.
      change: Attach a one-line cause and a log path to each degraded subsystem. Where the cause is a
        blocked host, name the host — the proxy already exposes exactly that at $HTTPS_PROXY/__agentproxy/status.
      owner: Claude-adapter bootstrap maintainer
      target: SessionStart bootstrap reporter
      effort: M
      risk: low
      done_when: 'Each degraded line carries a cause or an explicit "cause: unknown", plus a log path.'
  - source_ref: P3/improvements/B5
    source_pack: P3
    source_path: improvements.yaml
    source_id: B5
    source_title: Explain bootstrap degradation
    source_record:
      id: B5
      group: bootstrap_flow
      title: Explain bootstrap degradation
      root_cause_ref: FRIC-06
      owner: session_start_claude_governance.sh
      target: SessionStart additional context
      effort: M
      risk: Low
      change: emit per-subsystem reason and remediation command, or downgrade cosmetic degradations so
        the signal is not five-of-eight noise at every start
      done_when: each DEGRADED line carries a cause and a next action
      sequence: 6
  - source_ref: P4/improvements/IMP-03
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-03
    source_title: Invalidate the bootstrap receipt when the governance revision it names changes
    source_record:
      id: IMP-03
      stream: bootstrap
      priority: 1
      title: Invalidate the bootstrap receipt when the governance revision it names changes
      traces_to:
      - FR-03
      observed_root_cause: /root/.l9/claude/bootstrap-state.json records governance_revision fda7f5fe...,
        the clone is at 84d06e3d..., and gov-refresh.json simultaneously reports state "fresh" with 0
        commits behind. The receipt expires only on a 24-hour wall clock; the refresh TTL is one hour.
        The session therefore opened reporting component health as "unknown" from a receipt describing
        a different tree.
      change: 'Treat a governance_revision mismatch as expiry, independent of TTL. On mismatch either
        re-run the adapter installer automatically or report "receipt stale: governance moved fda7f5f
        -> 84d06e3" rather than "unknown".'
      target:
      - /root/.cursor-governance/ops/scripts/claude_bootstrap_receipt.py
      - /root/.cursor-governance/ops/hooks/session_start_bootstrap.sh
      owner: bootstrap-maintainer
      effort: S
      risk: low
      done_condition: With the clone moved to a new revision, the session banner names the revision mismatch
        as the reason, and a refreshed receipt records the current HEAD.
  - source_ref: P4/improvements/IMP-04
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-04
    source_title: Re-probe DEGRADED components at session start instead of reading a day-old verdict
    source_record:
      id: IMP-04
      stream: bootstrap
      priority: 2
      title: Re-probe DEGRADED components at session start instead of reading a day-old verdict
      traces_to:
      - FR-03
      - F-03
      observed_root_cause: 'The receipt reported memory as DEGRADED. Tested directly during this audit,
        the memory client returned exit 0 and {"healthy": true, circuit CLOSED}. The DEGRADED verdict
        was 24 hours old and no longer true.'
      change: 'For components marked DEGRADED in an expired receipt, run their existing cheap health probe
        at session start and report the live result. Memory already has one: graphiti_memory_client.py
        health under the governance venv.'
      target:
      - /root/.cursor-governance/ops/hooks/session_start_bootstrap.sh
      owner: bootstrap-maintainer
      effort: M
      risk: medium
      risk_note: Adds startup latency; bound each probe with a timeout and fail soft.
      done_condition: A session whose receipt is expired reports at least one component's live state,
        and reports memory as READY when the health probe exits 0.
  - source_ref: P6/improvements/BOOT-1
    source_pack: P6
    source_path: improvements.yaml
    source_id: BOOT-1
    source_title: Auto-rerun install.sh on expired/DEGRADED receipt at SessionStart
    source_record:
      id: BOOT-1
      plane: bootstrap
      title: Auto-rerun install.sh on expired/DEGRADED receipt at SessionStart
      root_cause_ref: FA-2
      root_cause_observed: receipt expired (99580s > 86400 ttl) -> unknown; named remediation never auto-run
        in 2 turns
      change: SessionStart hook runs named remediation bounded/logged/fail-soft when receipt expired or
        DEGRADED; writes fresh receipt; failure backoff stamp
      owner: governance-maintainer
      target: environment/agents/adapters/claude-code hooks + install.sh idempotency
      effort: M
      risk: SessionStart latency; broken install.sh would run each session — backoff required
      done_condition: session started >24h after build shows receipt generated_at from that session start,
        state != unknown
  - source_ref: P7/improvements/IMP-07
    source_pack: P7
    source_path: improvements.yaml
    source_id: IMP-07
    source_title: Truthful bootstrap status for the claude_cloud surface
    source_record:
      id: IMP-07
      category: bootstrap
      title: Truthful bootstrap status for the claude_cloud surface
      root_cause: FR-01 (DEGRADED memory/mcp lines while both demonstrably worked; receipt expiry -> "unknown")
      change: 'Diagnose why shared_bootstrap/capabilities/memory/mcp/plugins report DEGRADED on this surface.
        For any state that is expected in cloud sessions, print "expected-degraded (cloud)" instead of
        DEGRADED; refresh the bootstrap receipt at SessionStart so TTL expiry does not manufacture "unknown"
        on a healthy session.

        '
      owner: governance-repo (ops/scripts/claude_bootstrap_receipt.py + bootstrap probes)
      target: bootstrap-truthfulness PR
      effort: M (needs the actual probe failures, which this session did not capture — first step is instrumentation)
      risk: low
      done_condition: 'A cloud SessionStart shows only states that match observed capability (a subsystem
        marked DEGRADED must actually fail when exercised).

        '
  - source_ref: P8/improvements/I-BF-01
    source_pack: P8
    source_path: improvements.yaml
    source_id: I-BF-01
    source_title: Invalidate the bootstrap receipt when the governance revision moves
    source_record:
      id: I-BF-01
      title: Invalidate the bootstrap receipt when the governance revision moves
      traces_to:
      - F-03
      - R-01
      root_cause: The receipt pins governance_revision 84d06e3d and the refresh reports 829f45ec. Refresh
        does not invalidate the receipt, so a receipt describing a superseded revision is read as merely
        "expired" rather than "stale for this revision".
      change: Have the refresh step compare its resulting SHA against the receipt's governance_revision
        and mark the receipt stale-by-revision when they differ, distinctly from stale-by-TTL.
      owner: shared-bootstrap maintainer
      target: ops/scripts/claude_bootstrap_receipt.py + the refresh step
      effort: M
      risk: Low-medium. More sessions will be classified as needing re-bootstrap, which is the point;
        it should not be coupled to any auto-run without I-BF-02's guardrails.
      done_condition: With a receipt pinned to revision A and governance at revision B, the receipt reader
        reports stale-by-revision and names both SHAs.
  - source_ref: P8/improvements/I-BF-02
    source_pack: P8
    source_path: improvements.yaml
    source_id: I-BF-02
    source_title: Decide explicitly whether SessionStart may re-run the remediation
    source_record:
      id: I-BF-02
      title: Decide explicitly whether SessionStart may re-run the remediation
      traces_to:
      - R-05
      - F-03
      root_cause: 'The receipt carries `remediation: bash .../install.sh`, the banner prints the degraded
        state, and the SessionStart hook references only verify_account_env (line 289). Nothing re-runs
        install.sh, so a degraded bootstrap persists indefinitely.'
      change: Either (a) invoke the remediation under the existing repo-write lock with a fail-soft skip
        when the lock is held, or (b) state in the banner that repair is operator-initiated and stop presenting
        a remediation string that nothing will run.
      owner: governance-adapter maintainer
      target: environment/agents/adapters/claude-code/hooks/session_start_claude_governance.sh
      effort: M
      risk: Medium for option (a) - install.sh writes into the workspace and would need the repo-write
        lock to avoid the pre-commit attribution failure described in rules/48. Option (b) is Low risk
        and honest.
      done_condition: Either a degraded receipt is repaired without human action, or the banner no longer
        advertises a repair that does not execute.
  - source_ref: P8/improvements/I-BF-03
    source_pack: P8
    source_path: improvements.yaml
    source_id: I-BF-03
    source_title: Retain a per-component reason when bootstrap degrades
    source_record:
      id: I-BF-03
      title: Retain a per-component reason when bootstrap degrades
      traces_to:
      - F-03
      - UNK-02
      - UNK-03
      root_cause: The receipt records shared_bootstrap/capabilities/memory/mcp/plugins as DEGRADED with
        no reason, and no log from that run is retained under /root/.l9/claude/. The cause is not recoverable
        after the fact.
      change: Add a short reason string per degraded component in the receipt.
      owner: shared-bootstrap maintainer
      target: ops/scripts/bootstrap_agent_environment.sh receipt writer
      effort: S
      risk: Low - additive field.
      done_condition: A degraded component in bootstrap-state.json carries a reason a later session can
        read without re-running the bootstrap.
  - source_ref: P9/improvements/I-BS-04
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-04
    source_title: Regenerate the bootstrap receipt on container restart, or mark it stale rather than
      unknown
    source_record:
      id: I-BS-04
      title: Regenerate the bootstrap receipt on container restart, or mark it stale rather than unknown
      traces_to:
      - F-06
      - F-07
      - FR-03
      root_cause: The restart rewrote /root/.claude/* (mtime 01:33) and refreshed gov-refresh.json, but
        left bootstrap-state.json at its 2026-08-23 21:38 mtime, so it ages past its 86400s TTL and reports
        unknown forever. It also pins governance_revision 84d06e3d while the SSOT moved to 829f45ec.
      change: Re-run the bootstrap probe on session start when the receipt is older than its TTL, and
        re-stamp governance_revision from the live SSOT. If a re-probe is not affordable, print the last
        known component states with an explicit age rather than the single word unknown.
      owner: Cursor-Governance - claude-code adapter session-start path
      target: /root/.l9/claude/bootstrap-state.json
      effort: M
      risk: low
      done_condition: After a restart, the banner prints per-component states with an age under the TTL,
        and governance_revision matches gov-refresh.json local_sha.
  reconciliation_action: MERGE
  progress:
    status: partial
    delivered_by: Quantum-L9/Cursor-Governance PR#305 (+ predecessor PR#304), merged into main
    evidence:
    - 'LIVE DEFECT, this session: /root/.l9/claude/bootstrap-state.json is pinned to governance_revision
      c3081ee, generated_at 2026-08-26T19:30:48Z, while gov-refresh.json (2026-08-27T00:01:55Z) and readiness-receipt.json
      (2026-08-26T23:23:01Z) both carry 498dcaa. Two receipt stores disagree about the governance revision
      inside one session and nothing invalidated the stale one.'
    - 'partial correction to the recorded residual: per-component log paths DO exist for the deps stage
      — 11 deps-<fingerprint>.log files with content under /root/.l9/claude/.'
    residual:
    - bootstrap-state.json is still not regenerated on container/session lifecycle or on a governance
      revision change; stale-receipt invalidation is not wired.
    - Per-component log paths exist only for deps; the other components (capabilities, memory, mcp, plugins)
      report a bare DEGRADED with no evidence path.
    - No cross-check between the three receipt stores — see the proposed CI-035.
    assessed_against: main@498dcaa (post-#307-merge + 47 commits) + PR#320 open
    assessed_at: '2026-08-27'
- id: CI-005
  title: Make memory health transport-specific and continuity task-bearing
  status: ACTIVE
  priority: 1
  dependencies:
