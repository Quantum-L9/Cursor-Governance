- id: CI-006
  title: Resolve authority-sensitive environment drift at the actual source
  status: OPEN_DECISION
  priority: 0
  dependencies: []
  canonical_action: Trace each effective value to its source, separate authority-widening drift from cosmetic
    drift, make repair reachable or explicitly human-only, and record the governing value. The intended
    AUTONOMOUS_MERGE value remains an open decision.
  source_records:
  - source_ref: P1/improvements/IMP-03
    source_pack: P1
    source_path: improvements.yaml
