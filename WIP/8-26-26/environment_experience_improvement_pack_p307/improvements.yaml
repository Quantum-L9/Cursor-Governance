    source_title: Make PICKUP hydration carry real resume state
    source_record:
      id: IMP-09
      category: loader
      title: Make PICKUP hydration carry real resume state
      root_cause: FR-05 (all 4 hydration packets said "resume from the latest PICKUP" — self-referential)
      change: 'At session close, write PICKUP episodes containing concrete state (task, branch, head SHA,
        next action) instead of the generic resume pointer, or have the hydrator drop packets whose next_action
        merely references PICKUP itself and say "no substantive PICKUP" honestly.

        '
      owner: governance-repo (ops/graphiti hydration/close pipeline)
      target: memory-pipeline PR
      effort: M
      risk: low
      done_condition: 'A session that ends mid-task produces a PICKUP whose next_action names the task
        and branch; the circular form no longer appears in hydration.

        '
  - source_ref: P9/improvements/I-BS-05
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-05
    source_title: Report memory health per transport instead of as one collapsed verdict
    source_record:
      id: I-BS-05
      title: Report memory health per transport instead of as one collapsed verdict
      traces_to:
      - F-07
      - F-04
      - FR-02
      root_cause: The CLI front door to Graphiti is healthy (health -> healthy true, tool_count 9) while
        the brokered MCP transport is not. One memory verdict cannot express that, so it reports DEGRADED
        and discourages the path that works.
      change: Split the memory component into memory.cli and memory.mcp, probed independently, and report
        each. Base the CLI verdict on graphiti_memory_client.py health rather than on broker reachability.
      owner: Cursor-Governance - ops/graphiti and the adapter bootstrap probe
      target: /root/.l9/claude/bootstrap-state.json schema
      effort: M
      risk: low
      done_condition: With the broker unreachable and the CLI healthy, the banner reports memory.cli READY
        and memory.mcp DEGRADED.
  - source_ref: P9/improvements/I-BS-06
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-06
    source_title: Make the writeback receipt distinguish nothing-to-write from failed-to-write, and count
      task-bearing facts on hydrate
    source_record:
      id: I-BS-06
      title: Make the writeback receipt distinguish nothing-to-write from failed-to-write, and count task-bearing
        facts on hydrate
      traces_to:
      - F-04
      - FR-02
      root_cause: 'The writeback receipt records writes: 0, close_status: skipped, warnings: 1 with no
        warning text. Hydration then returns 8 self-referential meta-facts and reports success, because
        the metric counted is facts_returned rather than task-bearing content.'
      change: Record the warning text and an explicit reason code in the writeback receipt. On the hydrate
        side, count facts that are not self-referential PICKUP restatements and surface that number, so
        a hydration carrying no task state is visibly empty rather than apparently successful.
      owner: Cursor-Governance - ops/graphiti/hydration and the Stop-hook writeback
      target: /home/user/.l9/memory/receipts/
      effort: M
      risk: low
      done_condition: 'A session that produced no durable memory shows task_bearing_facts: 0 at the next
        start instead of facts_returned: 8.'
  reconciliation_action: MERGE
