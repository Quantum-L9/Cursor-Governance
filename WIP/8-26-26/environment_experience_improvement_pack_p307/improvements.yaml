records:
- id: CI-001
  title: Publish and enforce the real GitHub REST/GraphQL capability boundary
  status: ACTIVE
  priority: 1
  dependencies: []
  canonical_action: Document REST and GraphQL independently; use a REST auth probe; give merge/PR helpers
    REST-capable probe/execution paths; report probe-blocked separately from stack/auth unknown.
  source_records:
  - source_ref: P1/improvements/IMP-01
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-01
    source_title: Publish the gh REST/GraphQL split as an explicit environment fact
    source_record:
      id: IMP-01
      group: env_loader
      title: Publish the gh REST/GraphQL split as an explicit environment fact
      traces_to:
      - FAIL-01
      - FAIL-02
      - FRICTION-03
      root_cause: gh auth status probes via GraphQL; the proxy 403s GraphQL; gh renders that as an invalid
        token. The session prompt separately claims no gh access at all.
      change: 'Correct the session prompt''s GitHub section to state the real capability boundary: gh
        api REST works; gh GraphQL and all gh pr subcommands are blocked; gh auth status will falsely
        report an invalid token. Do not tell agents they have no gh access.'
      owner: remote-session prompt owner (Anthropic harness)
      owner_confidence: UNKNOWN whether this org can edit this surface
      target: session system prompt, GitHub Integration section
      effort: S
      risk: low
      risk_note: text only
      done_when: A fresh session's prompt names the REST/GraphQL split, and an agent reading it does not
        abandon gh on an auth status failure.
  - source_ref: P1/improvements/IMP-02
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-02
    source_title: Stop treating gh auth status as the auth preflight
    source_record:
      id: IMP-02
      group: env_loader
      title: Stop treating gh auth status as the auth preflight
      traces_to:
      - FAIL-01
      root_cause: Same as IMP-01; this is the agent-side half, shippable without harness changes.
      change: In l9-pr-remediation preflight check P_cmd, replace any gh auth status probe with `gh api
        user --jq .login`. Record REST reachability and GraphQL reachability as separate fingerprint fields
        so a GraphQL block does not read as an auth failure.
      owner: governance skill maintainer
      target: /root/.cursor-governance/skills/l9-pr-remediation/references/run-contract.md
      effort: S
      risk: low
      done_when: Preflight on this container reports github_rest reachable, github_graphql blocked, auth
        valid — not "token invalid".
  - source_ref: P1/improvements/IMP-11
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-11
    source_title: Give stack_safe_merge and merge_gate a REST probe path
    source_record:
      id: IMP-11
      group: governance_tooling
      title: Give stack_safe_merge and merge_gate a REST probe path
      traces_to:
      - FAIL-03
      - FAIL-02
      root_cause: merge_gate._stacked_children (lines 240, 244) shells to gh pr view --json and gh pr
        list --json, both GraphQL. stack_safe_merge imports it. Exit 2 in this environment.
      change: Implement the probe over REST — gh api repos/{owner}/{repo}/pulls?state=open returns head.ref
        and base.ref for every open PR, which is all _stacked_children needs. Keep GraphQL as a fast path
        and fall back to REST on 403.
      viability_evidence: 'Verified: REST is exactly how the correct topology was derived by hand in the
        observed run.'
      owner: governance autonomy maintainer
      target: /root/.cursor-governance/ops/autonomy/merge_gate.py (_stacked_children, _gh_json)
      effort: M
      risk: medium
      risk_note: This function backs a fail-closed safety gate; add tests for 403-fallback, empty-children,
        and stacked-parent before shipping.
      done_when: stack_safe_merge.py --repo Quantum-L9/.github --pr <n> --json exits 0 on this container
        with no L9_STACK_PROBE_FILE set, and returns "merge" for a stacked parent.
  - source_ref: P1/improvements/IMP-12
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-12
    source_title: Distinguish probe-blocked from stack-unknown in the deny reason
    source_record:
      id: IMP-12
      group: governance_tooling
      title: Distinguish probe-blocked from stack-unknown in the deny reason
      traces_to:
      - FAIL-03
      root_cause: _stack_safety_reason catches RuntimeError from the probe and returns _stack_unknown_reason
        regardless of cause. A proxy 403 and a genuinely ambiguous topology produce the same operator-facing
        message.
      change: Propagate the probe's failure kind into the deny reason. Fail-closed behavior stays exactly
        as it is; only the message changes.
      owner: governance autonomy maintainer
      target: ops/autonomy/merge_gate.py (_stack_safety_reason, _stack_unknown_reason)
      effort: S
      risk: low
      risk_note: message-only; do not alter the deny decision
      done_when: A GraphQL-blocked probe denies with a reason naming the transport, not "unknown".
  - source_ref: P2/improvements/IMP-A1
    source_pack: P2
    source_path: improvements.yaml
    source_id: IMP-A1
    source_title: Resolve the gh-CLI / gh-token mismatch
    source_record:
      id: IMP-A1
      title: Resolve the gh-CLI / gh-token mismatch
      traces_to:
      - FRIC-04
      - FRIC-10
      root_cause: GH_TOKEN and GITHUB_TOKEN are set in the environment while gh and hub are absent. The
        l9-pr-remediation skill specifies its entire input contract in gh commands, all of which had to
        be re-derived against mcp__github__* tools.
      proposal: 'Either install gh in this environment, or rewrite the skill''s Core Contract table to
        name the mcp__github__* equivalents. The second removes a dependency rather than adding one, and
        also fixes the inability to poll GitHub from Monitor/bash.

        '
      owner: 'role: platform / skill owner (UNKNOWN)'
      target: Environment image, or .claude/skills/synced/l9-pr-remediation/SKILL.md
      effort: M
      risk: low
      done_condition: Every command in the skill's Core Contract table is executable as written in this
        environment, or the table names tools that are.
  - source_ref: P3/improvements/C1
    source_pack: P3
    source_path: improvements.yaml
    source_id: C1
    source_title: Give stack_safe_merge.py a REST path
    source_record:
      id: C1
      group: tooling_contract
      title: Give stack_safe_merge.py a REST path
      root_cause_ref: FAIL-01
      owner: ops/autonomy/stack_safe_merge.py, ops/autonomy/merge_gate.py
      target: _stacked_children probe and the merge exec
      effort: M
      risk: Med
      risk_note: the gate must not be bypassable through the new path
      change: implement _stacked_children over REST (GET /repos/{o}/{r}/pulls?base=<head>&state=open,
        exit 0 in this session) with GraphQL as an optimisation; exec the merge via PUT /repos/{o}/{r}/pulls/{n}/merge
        when gh pr merge is unavailable; ensure merge_gate intercepts that REST call as it does the CLI
        form
      done_when: stack_safe_merge.py --run completes in a GraphQL-disabled session, and a REST merge attempted
        without authorisation is refused
      sequence: 2
  - source_ref: P3/improvements/A6
    source_pack: P3
    source_path: improvements.yaml
    source_id: A6
    source_title: Reconcile the documented tool surface with the observed one
    source_record:
      id: A6
      group: environment_and_variable_loader
      title: Reconcile the documented tool surface with the observed one
      root_cause_refs:
      - FRIC-10
      - FAIL-01
      owner: session_prompt_composer
      target: system prompt GitHub Integration section
      effort: S
      risk: Low
      change: 'state the real surface: gh present, repository-scoped REST permitted, GraphQL and org-wide
        search unavailable'
      done_when: an agent can predict which gh invocations will fail without probing
      sequence: 6
  - source_ref: P4/improvements/IMP-11
    source_pack: P4
    source_path: improvements.yaml
    source_id: IMP-11
    source_title: Stop treating gh auth status as a health check on this surface
    source_record:
      id: IMP-11
      stream: other
      priority: 6
      title: Stop treating gh auth status as a health check on this surface
      traces_to:
      - F-10
      observed_root_cause: '`gh auth status` exits 1 with "The token in GH_TOKEN is invalid" while `gh
        api repos/...` exits 0 and `make pr` opened PR #81 successfully. GH_TOKEN is 14 characters, which
        is not a PAT shape.'
      change: Where a preflight needs to know whether GitHub is reachable, call `gh api user` or `gh api
        repos/<owner>/<repo>` and check the exit code. Note in rule 62-github-openclaw-authority that
        on proxied cloud surfaces GH_TOKEN may be a placeholder and auth status is not authoritative.
      target:
      - /root/.cursor-governance/rules/62-github-openclaw-authority.mdc
      - /root/.cursor-governance/ops/scripts/open_pr_after_gate.sh
      owner: governance-rules-maintainer
      effort: S
      risk: low
      unknown_to_resolve_first: Which component supplies the working credential. Confirm before rewriting
        the rule, so the replacement text describes the real mechanism.
      done_condition: No sanctioned script gates on `gh auth status`, and rule 62 states what authorises
        GitHub calls on a proxied surface.
  - source_ref: P7/improvements/IMP-02
    source_pack: P7
    source_path: improvements.yaml
    source_id: IMP-02
    source_title: Reconcile gh authentication with the session gateway
    source_record:
      id: IMP-02
      category: environment
      title: Reconcile gh authentication with the session gateway
      root_cause: F-05 (GH_TOKEN invalid to gh; GraphQL refused; subscribe 404; REST-only via proxy)
      change: 'Either provision a valid GH_TOKEN for the container, or make REST-only operation explicit:
        document it in the session-deps line, and teach open_pr_after_gate.sh to skip its gh-subscribe
        step (it already warns) when GraphQL is unavailable, pointing to the MCP subscription instead.

        '
      owner: platform (token) + governance-repo (script messaging)
      target: environment config revision
      effort: S-M
      risk: low
      done_condition: '`gh auth status` reports a valid principal OR the publish flow emits one deliberate
        "REST-only session" line with no 404/GraphQL noise.

        '
  - source_ref: P8/improvements/I-WT-02
    source_pack: P8
    source_path: improvements.yaml
    source_id: I-WT-02
    source_title: Fail fast when a GraphQL-dependent gh subcommand is used on this surface
    source_record:
      id: I-WT-02
      title: Fail fast when a GraphQL-dependent gh subcommand is used on this surface
      traces_to:
      - F-02
      root_cause: '`gh pr checks --json` returns HTTP 403 from the session gateway. Inside a background
        poll loop the failure is silent, so a monitor can appear healthy while emitting nothing.'
      change: Document (or wrap) the GraphQL-backed gh subcommands as unavailable on this surface, and
        prefer the REST forms in any monitor or poll template.
      owner: environment/runner owner + docs
      target: docs/DEGRADED_MODE_CONTRACT.md and any monitor guidance
      effort: S
      risk: Low - documentation and template change.
      done_condition: A monitor template exists that uses `gh api .../check-runs` and a reader can see
        which gh subcommands are unavailable before writing one.
  - source_ref: P9/improvements/I-EL-04
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-EL-04
    source_title: Correct the documented tool inventory to match the provisioned image
    source_record:
      id: I-EL-04
      title: Correct the documented tool inventory to match the provisioned image
      traces_to:
      - F-20
      - F-11
      root_cause: Session documentation states the gh CLI is unavailable. gh 2.98.0 is installed, and
        gh api REST was the path that actually opened a pull request. Separately, gh pr create returns
        403 from the GraphQL surface while REST succeeds.
      change: State that gh is present, that the REST surface is permitted, and that the GraphQL surface
        used by gh pr create is not - so the working path is documented rather than discovered.
      owner: harness session documentation
      target: session system prompt / environment documentation
      effort: S
      risk: low
      done_condition: Documentation matches command -v gh and names REST as the supported PR-creation
        surface.
  reconciliation_action: MERGE
  progress:
    status: partial
    delivered_by: Quantum-L9/Cursor-Governance 5612f6b (merged) + pre-existing ops/scripts/lib/gh_auth_probe.sh
    evidence:
    - 'ops/autonomy/merge_gate.py: _gh_rest_json / _stacked_children_rest resolve head and children over
      GET repos/{o}/{r}/pulls, gh pr view|list kept as fallback (IMP-11)'
    - merge_gate.py _transport_blocked + the 'both probe transports were refused' deny text names the
      transport instead of 'unknown' (IMP-12)
    - tests/ops/autonomy/test_merge_gate_rest_probe.py (229 lines) drives both transports and the both-failed
      fail-closed path
    - ops/scripts/lib/gh_auth_probe.sh probes `gh api user` and outranks a failing `gh auth status` (IMP-02)
      — present at 78f122a, so the 2026-08-26 not_started was wrong
    - 'live: `gh api user --jq .login` -> cryptoxdog on this surface'
    residual:
    - 'IMP-01 only: the Anthropic remote-session prompt still tells agents they have no gh access. Harness-owned;
      no in-repo lever. See the external-owner note in PROGRESS.md.'
    assessed_against: main@498dcaa (post-#307-merge + 47 commits) + PR#320 open
    assessed_at: '2026-08-27'
- id: CI-002
  title: Make bootstrap projection ownership-aware and non-destructive to tracked repo content
  status: ACTIVE
  priority: 0
  dependencies: []
  canonical_action: Detect repository-owned tracked paths before projection. Project machine-local rules/hooks/state
    only to non-repo-owned locations; ignore only genuinely generated/untracked paths. Never blanket-ignore
    or replace a repository-owned .claude tree.
  source_records:
  - source_ref: P1/improvements/IMP-06
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-06
    source_title: Propagate the existing gitignore stanza to the other 8 repos
    source_record:
      id: IMP-06
      group: bootstrap
      title: Propagate the existing gitignore stanza to the other 8 repos
      traces_to:
      - FRICTION-02
      - FRICTION-01
      root_cause: The correct commented ignore stanza exists in l9-meta-injector/.gitignore:45,48 and
        nowhere else. That repo shows 0 untracked entries; the other 8 show 3 to 5 each.
      change: Add the same four lines, with the existing rationale comment, to the remaining repos. The
        comment already records the non-obvious constraints (hooks carry absolute $HOME paths; .claude/rules
        needs no trailing slash because a trailing-slash pattern does not match a symlink). This is a
        copy, not a redesign.
      stanza:
      - .claude/hooks/
      - .claude/rules
      - .claude/skills/
      - .mcp.json
      caution: .claude/settings.json stays TRACKED where it is hand-authored repository content (as in
        Cognitive.Engine.Graphs, which tracks .claude/rules/* and .claude/agents/*). It is untracked bootstrap
        output only where the repo has no authored copy. Check per repo; do not blanket-ignore.
      owner: each repo maintainer, one PR per repo
      target:
      - Cognitive.Engine.Graphs/.gitignore
      - LLM-Router/.gitignore
      - SEO-Bot/.gitignore
      - Website-Bot/.gitignore
      - l9-ci-core/.gitignore
      - l9-ci-sdk/.gitignore
      - l9-cognitive-runtime/.gitignore
      - l9-graphiti-memory/.gitignore
      effort: M
      effort_note: 8 small PRs
      risk: low
      risk_note: additive; verify per repo that no currently-tracked file becomes ignored
      done_when: git status --porcelain --untracked-files=all is empty in all 8 after a fresh bootstrap.
  - source_ref: P1/improvements/IMP-07
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-07
    source_title: Ignore .l9/ wherever the L4 state dir is written, or move it out of the repo
    source_record:
      id: IMP-07
      group: bootstrap
      title: Ignore .l9/ wherever the L4 state dir is written, or move it out of the repo
      traces_to:
      - FRICTION-02
      - FAIL-07
      root_cause: L9_AUTONOMY_STATE_DIR=.l9/autonomy writes into the working repo, but only 4 of 10 repos
        ignore .l9. In org-github-defaults the receipts surfaced untracked and the Stop hook demanded
        they be pushed.
      change: Add .l9/ to the 6 repos that lack it. Orthogonally and preferably, point L9_AUTONOMY_STATE_DIR
        outside the repo (scratchpad or $HOME/.l9/) so session receipts never land in a working tree.
        The second option fixes the class; the first the instances.
      owner: governance environment maintainer (state dir) plus repo maintainers (gitignore)
      target:
      - L9_AUTONOMY_STATE_DIR
      - Cognitive.Engine.Graphs/.gitignore
      - l9-ci-core/.gitignore
      - l9-ci-sdk/.gitignore
      - l9-cognitive-runtime/.gitignore
      - l9-graphiti-memory/.gitignore
      - org-github-defaults/.gitignore
      effort: S for gitignore, M to relocate the state dir
      risk: medium
      risk_note: l4_local.py, local_execution_gate.py, and make pr all read this path; relocate together
        or not at all.
      done_when: Running l4_local.py authorize-release in any clone leaves git status --porcelain empty.
  - source_ref: P3/improvements/B1
    source_pack: P3
    source_path: improvements.yaml
    source_id: B1
    source_title: Never write to a consumer repo's tracked paths
    source_record:
      id: B1
      group: bootstrap_flow
      title: Never write to a consumer repo's tracked paths
      root_cause_ref: FAIL-02
      owner: environment/agents/adapters/claude-code/hooks/session_start_claude_governance.sh
      target: the bootstrap writer for .claude/** and .mcp.json
      effort: M
      risk: Low
      risk_note: strictly narrows what the bootstrap touches
      change: test git ls-files --error-unmatch before writing; if tracked, do not replace — fail closed
        and report, or compose additively; never swap a tracked directory for a symlink; never drop an
        existing hook or allowlist entry
      done_when: a session in Cognitive.Engine.Graphs leaves git status clean of tracked .claude paths,
        and that repo's PreToolUse banned-pattern guard is still registered at first tool call
      tracked_at: Quantum-L9/Cursor-Governance#281
      sequence: 1
  - source_ref: P3/improvements/B2
    source_pack: P3
    source_path: improvements.yaml
    source_id: B2
    source_title: Ignore the untracked injections at the container layer
    source_record:
      id: B2
      group: bootstrap_flow
      title: Ignore the untracked injections at the container layer
      root_cause_ref: FRIC-02
      owner: session_bootstrap
      target: core.excludesFile
      effort: S
      risk: Low
      change: ignore .claude/ and .mcp.json globally in the session environment
      limitation: necessary but not sufficient — cannot affect the tracked files in B1
      done_when: a fresh session reports a clean worktree in the repos with no tracked .claude content
      sequence: 4
  - source_ref: P6/improvements/BOOT-3
    source_pack: P6
    source_path: improvements.yaml
    source_id: BOOT-3
    source_title: Stop dirtying repo checkouts with session artifacts
    source_record:
      id: BOOT-3
      plane: bootstrap
      title: Stop dirtying repo checkouts with session artifacts
      root_cause_ref: FA-4
      root_cause_observed: '.mcp.json/.claude written untracked into 3 of 4 checkouts; caused PR #235
        /.claude/ gitignore defect'
      change: 'write session MCP/hook config to overlay outside worktree or to .git/info/exclude at bootstrap;
        design tracked-.claude projection split PR #235 deferred'
      owner: governance-maintainer
      target: cloud bootstrap (setup.bootstrap.sh / adapter install), not consumer .gitignore
      effort: ML
      risk: MCP config discovery must still resolve; tracked-.claude repos need overlay design
      done_condition: 'fresh session: git status --porcelain clean in all 4 checkouts post-bootstrap with
        MCP+hooks functional'
  - source_ref: P9/improvements/I-BS-01
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-01
    source_title: Stop projecting .claude/rules over repository-owned trees; project to a path the repository
      does not track
    source_record:
      id: I-BS-01
      title: Stop projecting .claude/rules over repository-owned trees; project to a path the repository
        does not track
      traces_to:
      - F-01
      - F-02
      - FR-10
      root_cause: The adapter replaces the tracked .claude/rules directory with a symlink to the governance
        clone, producing 9 tracked-file deletions plus an untracked symlink in every CEG working copy.
      change: Detect that the target path is tracked (git ls-files --error-unmatch) before projecting.
        When it is tracked, project the governance rules to a sibling path the repository does not own
        and reference that path instead of overwriting repository content.
      owner: Cursor-Governance - environment/agents/adapters/claude-code/install.sh and the rule-projection
        step
      target: /root/.cursor-governance/environment/agents/adapters/claude-code/
      effort: M
      risk: medium
      done_condition: In a fresh session on Cognitive.Engine.Graphs, git status --porcelain is empty immediately
        after bootstrap, and the governance rules are still readable by the agent.
      verification: git -C Cognitive.Engine.Graphs status --porcelain | wc -l -> 0
  reconciliation_action: MERGE
  progress:
    status: partial
    delivered_by: PR#304 (Contract 1) + PR#307 (CI-008/CI-009/CI-002 slice), both merged into main
    evidence:
    - is_tracked is defined and called only in ops/scripts/reconcile_llm_rule_adapters.py (lines 27, 146);
      grep -c is_tracked returns 0 for claude_projection.py, reconcile_claude_l9_skills.py, reconcile_claude_commands.py,
      reconcile_claude_settings.py, and the last commit on all four predates the guard
    - 'Phase 2c unbuilt: L9_AUTONOMY_STATE_DIR still defaults to ''.l9/autonomy'' inside the worktree
      in peer_execution/autonomy/{cli,bootstrap}.py'
    residual:
    - UNCHANGED since 2026-08-26. The is_tracked guard still covers only the rule-adapter reconciler.
      It must extend to claude_projection.py:422 (.mcp.json), reconcile_claude_l9_skills.py, reconcile_claude_commands.py,
      reconcile_claude_settings.py.
    - Phase 2b (project to a non-owned sibling when the target is tracked), 2c (L9_AUTONOMY_STATE_DIR
      outside the worktree), and 2d (per-repo gitignore propagation) are not built; the 8-fixture git-status-clean
      done_when is unverified.
    assessed_against: main@498dcaa (post-#307-merge + 47 commits) + PR#320 open
    assessed_at: '2026-08-27'
- id: CI-003
  title: Make the Stop hook ownership-aware instead of residue-blind
  status: ACTIVE
  priority: 1
  dependencies:
  - CI-002
  canonical_action: Scope stop-hook checks to authored changes in the active repo and explicitly exclude
    bootstrap-owned paths without masking tracked authored content.
  source_records:
  - source_ref: P1/improvements/IMP-08
    source_pack: P1
    source_path: improvements.yaml
    source_id: IMP-08
    source_title: Teach the Stop hook to distinguish authored work from bootstrap residue
    source_record:
      id: IMP-08
      group: bootstrap
      title: Teach the Stop hook to distinguish authored work from bootstrap residue
      traces_to:
      - FRICTION-01
      root_cause: /root/.claude/stop-hook-git-check.sh tests for any untracked file and cannot tell agent-authored
        work from machine-local wiring. It was wrong about every file it flagged.
      change: Exclude a known machine-local set (.claude/hooks/, .claude/rules, .claude/skills/, .mcp.json,
        .l9/) and scope the check to the repo the session actually worked in rather than every clone under
        /home/user. IMP-06 and IMP-07 make the hook correct by removing the residue; this makes it correct
        even when residue exists.
      owner: Claude-adapter hook maintainer
      target: /root/.claude/stop-hook-git-check.sh
      effort: M
      risk: medium
      risk_note: Over-broad exclusions would mask genuinely uncommitted work; exclude by explicit path
        list, never by pattern breadth.
      done_when: A session that authored nothing outside its target repo ends with no Stop-hook warning,
        while a session with a genuinely uncommitted authored file still gets one.
  - source_ref: P3/improvements/B3
    source_pack: P3
    source_path: improvements.yaml
    source_id: B3
    source_title: Teach the Stop hook the difference between injected and repo content
    source_record:
      id: B3
      group: bootstrap_flow
      title: Teach the Stop hook the difference between injected and repo content
      root_cause_ref: FRIC-02
      owner: ~/.claude/stop-hook-git-check.sh
      target: the dirty check
      effort: S
      risk: Low
      change: exclude governance-injected paths from the dirty check independently of B2, so a future
        injected path cannot reproduce the prompt
      done_when: the hook stays silent when the only dirt is injected, and still fires on real changes
      sequence: 4
  - source_ref: P9/improvements/I-BS-02
    source_pack: P9
    source_path: improvements.yaml
    source_id: I-BS-02
    source_title: Let the stop hook ignore bootstrap-owned paths
    source_record:
      id: I-BS-02
      title: Let the stop hook ignore bootstrap-owned paths
      traces_to:
      - F-02
      - FR-10
      root_cause: /root/.claude/stop-hook-git-check.sh triggers on any dirty path and cannot tell agent-authored
        work from bootstrap projection artifacts, so it fires every turn.
      change: 'Have bootstrap write a manifest of the paths it projects, and have the stop hook subtract
        those paths before evaluating dirtiness. Secondary to I-BS-01: if projection stops touching tracked
        paths, this becomes defence in depth rather than the fix.'
      owner: harness stop hook plus the adapter that would emit the manifest
      target: /root/.claude/stop-hook-git-check.sh
      effort: S
      risk: low
