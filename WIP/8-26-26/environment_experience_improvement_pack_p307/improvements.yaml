        results across the session, each requiring a regenerate and a re-run of a 61-62 s gate. The gate
        stops at the first artefact that is out of step.'
      change: Have `npm run validate` collect manifest staleness and dist divergence in a single report
        and print both repair commands together, or add a `npm run regen` that performs build, manifest:update
        and staging in one step.
      target:
      - /home/user/l9-meta-injector/package.json
      - /home/user/l9-meta-injector/scripts/check-dist-sync.js
      - /home/user/l9-meta-injector/scripts/generate-architecture-manifest.js
      owner: repository-maintainer
      effort: S
      risk: low
      done_condition: A tree with both a stale manifest and a stale dist produces one failure naming both,
        and one command restores both.
  - source_ref: P8/improvements/I-WT-03
    source_pack: P8
    source_path: improvements.yaml
