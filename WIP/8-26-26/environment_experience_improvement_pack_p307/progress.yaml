proposed_records:
- id: CI-034
  priority: 1
  title: Bind the progress overlay to a governance SHA and invalidate it on drift
  why: 'assessed_against was the prose label ''main@post-#307-merge''. main advanced 47 commits to 498dcaa
    and PR#320 opened; nothing marked the overlay stale, and six records were re-judged by hand to find
    it. This is CI-004''s defect class — a receipt not bound to the revision it describes — applied to
    the pack itself. It recurred within the hour: this pack was rewritten at 498dcaa naming PR#320 as
    open, and PR#320 merged as c3ddeea before the overlay was published — stale again, by the same mechanism,
    on its second day.'
  change: Record assessed_against_sha alongside the label, and add a check that compares it to the governance
    HEAD and reports the overlay stale when they differ.
