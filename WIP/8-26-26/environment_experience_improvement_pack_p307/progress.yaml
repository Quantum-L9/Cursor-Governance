next_slice:
  id: slice-ownership-aware-writes
  title: Ownership-aware writes (extend PR#307's is_tracked guard)
  why: 'PR#307 landed the is_tracked() ownership guard on ONE write site (the rule-adapter reconciler)
    and left the same-shape defect on the others. Finishing it is the highest-value, lowest-risk next
    move: it reuses the helper just shipped, is fully validatable in-repo with git fixtures, closes the
    biggest open P0 residual (CI-002), and folds in a P1 (CI-003) that shares the exact root cause — automation
    treating repository-owned or generated content as dirt.'
  records:
  - 'CI-002 residual (P0): apply is_tracked() before the remaining projection writes — claude_projection.py:422
    (.mcp.json), reconcile_claude_l9_skills.py, reconcile_claude_commands.py, reconcile_claude_settings.py
    — and add Phase 2b (project to a non-owned sibling when the target is tracked). Verify the 8-fixture
    git-status-clean done_when.'
  - 'CI-003 (P1): make the Stop hook ownership-aware instead of residue-blind — do not demand pushing
    repository-owned or generated/untracked bootstrap artifacts (.claude/**, .mcp.json, .l9/**); classify
    by ownership, the same signal CI-002 now computes.'
  - 'CI-031 (P3, opportunistic): keep tracked-path/gitignore hygiene synchronized as the guard and the
    ignore stanzas move together.'
  excluded: CI-002 Phase 2c (L9_AUTONOMY_STATE_DIR relocation) touches l4_local.py + local_execution_gate.py
    + make pr together — sequence it as its own change, not inside this slice.
  alternative: Toolchain slice — CI-009 residual (session-deps import smoke) + CI-023 (collapse variable-loading
    authorities into one loader) + CI-018 (local CI parity/hooks provisioning). Coherent and in-repo,
    but does not reuse just-shipped code and has no open P0.
