- id: OD-002
  title: Canonical publish command contract
  state: RESOLVED
  question: Must every governed consumer implement make pr, or should doctrine define a supported fallback?
  why_open: Both states exist in source material and no later convergence decision chooses one.
  sources:
  - C-003
  - CI-008
  resolution: 'Neither branch of the original question: the governance Makefile is the publish authority
    regardless of the repo worked in, a consumer needs no pr/pr-check target, and there is no raw-push
    fallback. The ''ship a pr target into every consumer'' option is rejected.'
  resolved_by: Quantum-L9/Cursor-Governance PR#307 (CI-008), merged into main
  evidence_2026_08_27:
  - tests/ops/scripts/test_publish_verb_governance_always.py::test_doctrine_states_consumer_needs_no_pr_target
    asserts surface_profile.yaml, rules/48-make-pr-remediation.mdc and docs/L9_DISPATCHER.md each state
    a consumer needs no local pr target
  - test_each_doctrine_surface_names_the_governance_rooted_verb pins the `make -C $GOV pr WS=$PWD` / `l9
    pr` form
  - CLAUDE.md and rules 48/88 carry the same contract
  residual: 'CI-008 stays partial: the consumer-workspace leg of the pre-commit path is scoped in-script
    (run_pr_precommit.sh lines 28-32), not enabled, and unverified against a real consumer checkout. That
    is an implementation residual, not an open decision.'
