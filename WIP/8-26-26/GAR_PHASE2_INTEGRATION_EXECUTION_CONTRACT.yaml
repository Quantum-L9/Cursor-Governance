    - GAR_output_consumption_evidence
    - validation_propagation_evidence
    - deployment_closure_evidence
    - adapter_preservation_evidence
    - museum_detector_results
    - test_results
    - lint_result
    - typecheck_result
    - build_result
    - residual_unknowns

  completion_statement_allowed_only_when:
