  success_state: CONVERGED

  failure_states:
    - NOT_INTEGRATED
    - BLOCKED

  forbidden_success_claims:
    - GAR_file_added
    - GAR_listed_in_pipeline
    - GAR_schema_valid
    - GAR_mentioned_in_execution_contract
    - GAR_tests_exist
    - all_files_present
    - validators_green_without_liveness_tests

completion_receipt:
  required_fields:
