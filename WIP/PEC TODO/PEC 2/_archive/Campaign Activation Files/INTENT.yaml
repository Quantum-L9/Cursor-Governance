# Front-door intent for the level-3 worked example.
# Compile target: campaigns/<id>/CAMPAIGN_SOURCE.yaml (not this file).
# Do not drop this file into campaigns/<id>/ — INTENT.yaml is forbidden there.
# For a new campaign, copy TEMPLATE/INTENT.yaml instead of this file.
#
# This INTENT is compiler-admissible. The sibling CAMPAIGN_SOURCE.yaml is a
# richer hand-authored seed for the same id. Use the compiler for new work.

campaign_id: level3-make-pr-single-path
title: Level-3 Make and Single-Path PR Refactor
owner: Igor Beylin

objective: >-
  Install the operator-supplied Level-3 Makefile and make `make pr` the sole
  agent/operator GitHub PR lifecycle (publish, remediate, bounded exact-head
  merge). Delete `pr-check`. Do not redesign the supplied Makefile.

problem_statement: >-
  `make pr` currently depends on `pr-check`, and agents re-run overlapping
  gates (`make pr-check`, `OPEN_PR=0 make pr`, bare pre-commit/Ruff) on an
  unchanged tree. Standing campaign publish is `PR_REMEDIATE=0 make pr` with
  human-only merge. That duplicates validation and leaves no bounded
  exact-PR automerge.

target_state: >-
  After exactly four local commits and one publication,
  `PR_REMEDIATE=1 PR_AUTOMERGE=1 make pr` is the only shipping command for
  this campaign PR. `pr-check` is gone. Changed-file resolution and
  pre-commit each run once per repository state. Live doctrine for
  `pr-check` and `PR_REMEDIATE=0 make pr` is zero except negative tests.

target:
  repository_id: Quantum-L9/Cursor-Governance
  source_of_truth: Makefile
  adapter: git

makefile_candidate:
  path: WIP/makefile/Makefile-CG.md
  sha256: 1dabcd0177354c6550ad9938d3c60c53ffff7222c903c157f376cba3d63c5bf8

publish:
  model: four_commit_one_pr
  command: PR_REMEDIATE=1 PR_AUTOMERGE=1 make pr
  pr_base: origin/campaign/level3-make-pr-single-path
  mid_execution_push: false

tasks:
  - id: TASK-001
    title: "Commit 1 — refactor(make): establish level-3 PR capability graph"
    objective: >-
      Replace repository Makefile with WIP/makefile/Makefile-CG.md
      (sha256 1dabcd0177354c6550ad9938d3c60c53ffff7222c903c157f376cba3d63c5bf8)
      byte-for-byte. Local commit only. Do not push.
    paths:
      - Makefile
    actions:
      - record_live_makefile_digest
      - replace_makefile_from_candidate_digest
      - verify_working_makefile_digest_matches_candidate
      - verify_make_help
      - verify_pr_check_absent
      - local_commit_refactor_make
  - id: TASK-002
    title: "Commit 2 — refactor(pr): remove duplicate validation execution"
    objective: >-
      One-pass PR gate: resolve changed files once; pre-commit once; delete
      outer Ruff/format/generated duplicates. Local commit only. Do not push.
    paths:
      - ops/scripts/run_pr_gate.sh
      - ops/scripts/run_pr_precommit.sh
      - .pre-commit-config.yaml
      - ops/config/precommit-hook-contract.json
  - id: TASK-003
    title: "Commit 3 — feat(autonomy): authorize bounded green-and-mergeable PR merge"
    objective: >-
      `PR_AUTOMERGE=1` may merge only this exact PR/head when green and
      mergeable. Standing unbounded merge stays forbidden. Local commit only.
    paths:
      - ops/scripts/open_pr_after_gate.sh
      - ops/autonomy/merge_gate.py
      - ops/autonomy/surface_profile.yaml
      - environment/program-execution/peer_execution/autonomy/profiles/pr-convergence.json
      - environment/program-execution/campaigns/CAMPAIGN_EXECUTION_POLICY.yaml
      - environment/agents/adapters/claude-code/settings.template.json
  - id: TASK-004
    title: "Commit 4 — docs(governance): migrate PR contract and regenerate projections"
    objective: >-
      Migrate live doctrine only, regenerate projections, then publish once
      with `PR_REMEDIATE=1 PR_AUTOMERGE=1 make pr`.
    paths:
      - AGENTS.md
      - CANONICAL_LAW.md
      - rules/48-make-pr-remediation.mdc
      - rules/88-l4-local-autonomy.mdc
      - skills/l9-bounded-autonomy/SKILL.md
      - skills/l9-pe-campaign-activate/references/pipeline.md
      - skills/l9-gmp-protocol/SKILL.md
      - skills/l9-gmp-protocol/references/phase-contracts.md
      - skills/l9-plan/references/plan-workflow.md
      - skills/l9-plan/references/plan-quality-gates.md
      - skills/l9-ci-ops/SKILL.md
      - environment/program-execution/README.md
      - environment/program-execution/campaigns/README.md
