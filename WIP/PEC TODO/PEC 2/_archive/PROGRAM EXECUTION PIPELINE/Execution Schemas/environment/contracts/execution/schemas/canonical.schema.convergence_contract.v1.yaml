schema_id: canonical.schema.convergence_contract.v1
schema_name: Canonical Convergence Contract Schema
schema_class: canonical_execution_contract_schema
schema_family: l9_execution_architecture
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.convergence_contract.v1.yaml
purpose:
  primary: 'Define the canonical completion and convergence contract for plans, coding contracts, execution packets, migrations,
    and remediation work.

    '
  output_level: schema_not_instance
  intended_use:
  - completion_gates
  - release_readiness
  - execution_convergence
  - blocker_resolution
  not_for:
  - subjective_done_claims
  - validation_without_evidence
ontology:
  parent_type: execution_contract_schema
  specialized_type: convergence_contract_schema
  instance_type_generated_by_this_schema: convergence_contract
required_sections:
  identity:
    required: true
    fields:
      convergence_id:
        type: string
        required: true
      source_ref:
        type: ref
        required: true
  state:
    required: true
    fields:
      current_state:
        enum:
        - draft
        - preflight_blocked
        - execution_ready
        - executing
        - validation_failed
        - partial
        - converged
        required: true
      implementation_ready:
        type: boolean
        required: false
  gates:
    required: true
    fields:
      executable_when:
        type: list
        required: true
      complete_when:
        type: list
        required: true
      blocking_conditions:
        type: list
        required: true
  evidence:
    required: true
    fields:
      required_evidence_refs:
        type: list_string
        required: true
      observed_evidence_refs:
        type: list_string
        required: true
      missing_evidence:
        type: list
        required: true
  blockers:
    required: true
    fields:
      open_blockers:
        type: list
        required: true
      resolved_blockers:
        type: list
        required: true
      unknowns:
        type: list
        required: true
  next:
    required: true
    fields:
      next_convergence_gate:
        type: string
        required: true
      minimum_safe_next_action:
        type: string
        required: true
      broader_work_requires_separate_contract:
        type: boolean
        required: true
validation_rules:
- id: CONVERGE-001
  severity: blocker
  rule: converged requires every blocking condition resolved.
- id: CONVERGE-002
  severity: blocker
  rule: converged requires all required evidence present.
- id: CONVERGE-003
  severity: blocker
  rule: Unknowns that affect completion must remain open blockers.
- id: CONVERGE-004
  severity: blocker
  rule: current_state must agree with validation evidence.
- id: CONVERGE-005
  severity: major
  rule: Follow-on scope must not be silently folded into current convergence.
derivation_targets:
  can_generate:
  - convergence_contract
  - completion_gate
  - release_readiness_state
  - next_action_record
anti_drift_rules:
- Do not use prose confidence as convergence proof.
- Do not close unknowns without evidence.
- Do not mark converged while validation failed.
- Do not absorb follow-on scope into current completion criteria.
minimum_viable_instance_requirements:
  required:
  - identity
  - state
  - gates
  - evidence
  - blockers
  - next
schema_dependency_direction:
  depends_on:
  - canonical.schema.validation_evidence.v1
  cycle_policy: schema_dependency_graph_must_be_acyclic
