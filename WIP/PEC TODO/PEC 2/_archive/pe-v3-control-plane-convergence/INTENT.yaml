campaign_id: pe-v3-control-plane-convergence
title: PE v3 Control Plane Convergence - Containment, Semantic Conservation, Exact Identity, Bound Authority
owner: Igor Beylin

plan_status: Ready

objective: >-
  Reconstruct Program Execution and subordinate Autonomy so that no authority-bearing
  transition can occur from a caller-supplied semantic label. Every transition must be
  derived from canonical immutable semantics, exact content identity, admissible
  claim-scoped proof, current principal authority, and one linearizable state/event commit.
  C0 contains the live front-door authority leaks before the S1-S8 reconstruction.

problem_statement: >-
  The live v2 control plane lets run_campaign.py mint and consume merge plus terminal
  authority, lets task PR creation bypass the sanctioned make pr surface, and lets
  Autonomy tool_hook authorize arbitrary shells as test.run via caller-supplied
  capability labels. Beyond containment, v2 semantics weaken across every boundary:
  compiler shortcuts drop governing laws, dirty trees verify as HEAD, evidence IDs
  substitute across claims, actor strings confer authority, gates accept caller PASS,
  and handoff is disconnected from final repository generations.

target_state: >-
  C0 closed: the runner cannot merge, close authoritatively, push, or open PRs; task
  publishing flows through the sanctioned stacked make pr surface; Autonomy classifies
  commands through a fail-closed semantic broker. S1-S8 green: semantic conservation
  round-trip proven, immutable candidates and repository generations, claim-scoped
  evidence admissibility, principal-and-grant authority, linearizable transactions with
  fencing, derived gates, generation-aware replan and retry, promotion-wired completion,
  advisory convergence handoff with observed rollback proof and owner verdict receipt,
  v2-to-v3 migration, full vertical conformance, and shadow self-host convergence.
  Terminal state is activation-ready; activation is a separate follow-on campaign.

target:
  repository_id: Quantum-L9/Cursor-Governance
  source_of_truth: environment/program-execution
  adapter: git

