  - title: C0 containment and baseline freeze
    objective: >-
      Freeze the implementation baseline at 7517f377 with a detached immutable
      orchestrator checkout; disarm runner merge and terminal authority; route task
      publishing through the sanctioned stacked make pr surface; build the fail-closed
      Autonomy command broker.
    paths:
      - environment/program-execution/scripts/run_campaign.py
      - ops/scripts/open_pr_after_gate.sh
      - autonomy/adapters
  - title: S1 semantic conservation
    objective: >-
      Canonical Semantic Model plus semantic-conservation compiler, atomic
      receipt-backed acceptance, typed domain splits, and measured evidence collectors.
    paths:
      - environment/program-execution/compiler
      - environment/program-execution/scripts
  - title: S2 exact identity and genealogy
    objective: >-
      Repository generations, immutable candidate snapshots, promotion receipts, and
      generation-bound reconciliation, leases, and contracts.
    paths:
      - environment/program-execution/core/program-execution-controller-template/scripts/pec
  - title: S3 proof admissibility
