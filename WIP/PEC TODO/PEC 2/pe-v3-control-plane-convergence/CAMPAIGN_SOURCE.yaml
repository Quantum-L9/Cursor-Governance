integrity:
  digest_algorithm: sha256
  canonical_encoding: utf-8
  canonical_line_endings: lf
  digest_record_location: source-integrity-receipt.json
  generated_counts_or_digests_may_be_hand_edited: false

pipeline_contract:
  pair: program-execution-system.v2
  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2
  required_host_surfaces:
    - environment/program-execution/core
    - environment/program-execution/scripts
    - environment/program-execution/conformance
    - environment/program-execution/registry
    - autonomy
    - ops/autonomy
  compilation_sequence:
    - preserve_immutable_campaign_source
    - instantiate_native_blueprint_and_controller
    - compile_source_into_complete_native_blueprint
    - validate_blueprint_in_template_mode
    - accept_blueprint_after_authority_and_placeholder_resolution
    - validate_blueprint_in_instantiated_mode
    - validate_controller_in_instantiated_mode
    - block_on_unresolved_target_binding_unknown
    - export_admission_handoff_receipt
    - obtain_program_owner_terminal_verdict
  authority_boundaries:
    campaign_source_owns: operator_intent_and_campaign_semantics
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_runtime_state_and_gate_results
    adapters_own: host_translation_and_execution_receipts
    autonomy_owns: physical_execution_enforcement_only
    activation_prompt_owns: launch_mechanics_only
  two_plane_rule:
    plane_a: pinned_immutable_v2_orchestrator_checkout
    plane_b: editable_program_execution_implementation
    rule: plane_a_orchestrates_campaign_plane_b_never_self_modifies_plane_a

operator_directive:
  objective: >-
    Reconstruct Program Execution and subordinate Autonomy so that no authority-bearing
    transition can occur from a caller-supplied semantic label. Every transition must be
    derived from canonical immutable semantics, exact content identity, admissible
    claim-scoped proof, current principal authority, and one linearizable state/event commit.
  cross_plane_law: >-
    Program Execution is the sole owner of Program semantics, scheduling, verification,
    convergence and terminal recommendation. Autonomy is a subordinate physical enforcement
    plane that may narrow a PEC execution grant but may never widen, reinterpret, schedule,
    gate, promote, merge or terminalize the Program.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - reversible_repo_local_work
    - local_validation
    - independent_verification
    - read_only_remote_observation
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - exact_remote_mutation_approval
    - merge_or_landing_authority
  campaign_execution_law:
    - one_worker_maximum
    - one_writer_per_repository
    - local_mutation_only
    - local_commits_allowed
    - no_push_during_execution
    - no_pr_merge_publish_deploy_from_controller
    - no_destructive_runtime_migration_until_s8
    - no_reliance_on_automatic_retry_before_s6
    - no_reliance_on_v2_gate_pass_for_safety
    - no_orchestrator_switch_mid_campaign
    - halt_before_merge
    - publish_only_through_sanctioned_make_pr_surface
    - merge_authority_is_external_landing_authority_only

program:
  id: pe-v3-control-plane-convergence
  name: PE v3 Control Plane Convergence
  version: 1.0.0
  owner: igor_beylin
  definition_status: accepted
  snapshot_at: '2026-08-18'
  target_repository_id: Quantum-L9/Cursor-Governance
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  objective: >-
    Reconstruct Program Execution around four root repairs: semantic conservation,
    exact identity and genealogy, proof plus principal binding, and linearizable
    mediation. C0 contains the live front-door authority leaks; S1-S8 rebuild the
    compiler, runtime, evidence, authority, transactions, gates, closeout, and
    migration so that v3 receipts mean what the architecture says they mean.
    End state is activation-ready, not self-activation.
  problem_statement: >-
    The live v2 control plane allows the campaign runner to mint then consume merge and
    terminal authority, task PR creation to bypass the sanctioned publish surface, and
    Autonomy tool_hook to classify arbitrary shells as test.run with caller-supplied
    capability labels. Beyond containment, v2 semantics weaken across boundaries:
    compiler shortcuts drop governing laws, dirty trees are verified as HEAD, evidence
    IDs substitute across claims, actor strings confer authority, gates accept
    caller-supplied PASS, and handoff is disconnected from final repository generations.
  target_state: >-
    C0 closed: runner cannot merge or close authoritatively, task publishing flows
    through the sanctioned make pr surface with stacked-PR parameters, and Autonomy
    classifies physical commands through a fail-closed semantic broker. S1-S8 green:
    semantic conservation proven by round-trip, immutable candidate and repository
    generations, claim-scoped evidence admissibility, principal-and-grant authority,
    linearizable transactions with fencing, derived gates, generation-aware replan and
    retry, promotion-wired completion, advisory convergence handoff with observed
    rollback proof and owner verdict receipt, v2-to-v3 migration, full vertical
    conformance, shadow self-host convergence. Terminal state: activation-ready.
  scope:
    include:
      - environment/program-execution/core
      - environment/program-execution/scripts
      - environment/program-execution/compiler
      - environment/program-execution/conformance
      - environment/program-execution/campaigns
      - autonomy/runtime
      - autonomy/adapters
      - autonomy/policies
      - ops/autonomy
      - ops/scripts/open_pr_after_gate.sh
      - Makefile
    exclude:
      - .github/workflows
      - docker-compose and deploy infrastructure
      - remote repository mutation during execution
      - merge from the campaign path
      - self-activation of v3 as live control plane
      - pe-v3-hardening immutable campaign source
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_interface_contract
    - latest_explicit_operator_instruction
    - accepted_program_decision
    - approved_task_card
    - repository_local_governance
    - implementation
    - documentation
  operating_rules:
    - plane_a_never_self_modified_by_plane_b
    - source_semantics_survive_compilation_or_compile_fails
    - submitted_candidate_has_immutable_content_identity
    - verification_targets_the_immutable_snapshot
    - evidence_is_admissible_only_for_the_exact_claim_subject_and_generation
    - actor_strings_confer_no_authority
    - state_transition_and_canonical_event_commit_atomically
    - expired_or_superseded_authorization_ends_at_use_boundaries
    - gate_outcome_is_derived_never_caller_asserted
    - repo_local_completion_implies_promotion
    - controller_recommends_owner_terminates
    - legacy_v2_artifacts_never_silently_gain_v3_proof_semantics
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

invariants:
  - id: SEM-001
    statement: Every governing source law has exactly one canonical executable meaning.
  - id: SEM-002
    statement: Projections may repeat presentation, never semantic authority.
  - id: ID-001
    statement: Every submitted candidate has immutable content identity.
  - id: ID-002
    statement: Submitted, verified, promoted and terminal content are identical or linked by an explicit evidence-backed transformation.
  - id: GEN-001
    statement: Every repository baseline is an immutable generation.
  - id: GEN-002
    statement: Successor work includes every required predecessor promotion.
  - id: EVID-001
    statement: Evidence artifacts are immutable.
  - id: EVID-002
    statement: Evidence is admissible only for the exact claim, subject and generation it proves.
  - id: EVID-003
    statement: Evidence polarity, producer, method and freshness are semantic.
  - id: AUTH-001
    statement: Actor strings confer no authority.
  - id: AUTH-002
    statement: Every privileged transition binds a principal and grant.
  - id: AUTH-003
    statement: Nondelegable authority cannot be delegated.
  - id: TXN-001
    statement: State transition and canonical event are atomic.
  - id: TXN-002
    statement: Authority-bearing operations are idempotent and CAS-safe.
  - id: LEASE-001
    statement: Expiry or revocation ends authority at use time.
  - id: LEASE-002
    statement: A superseded fence can never mutate state.
  - id: AUTO-001
    statement: Unknown physical operations fail closed.
  - id: AUTO-002
    statement: Every physical operation is semantically classified before capability authorization.
  - id: AUTO-003
    statement: PE remains Program scheduler; Autonomy is subordinate execution enforcement.
  - id: GATE-001
    statement: Gate outcome is derived, never caller asserted.
  - id: REPLAN-001
    statement: In-flight authorization cannot silently change plan revision.
  - id: RETRY-001
    statement: The accepted retry policy controls every retry.
  - id: PROM-001
    statement: Repo-local COMPLETED means the verified candidate is in the current Program generation.
  - id: PUB-001
    statement: Campaign execution cannot self-authorize publish or merge authority.
  - id: PUB-002
    statement: Merge is externally authorized and merely observed by PE.
  - id: HANDOFF-001
    statement: Final handoff identifies exact final target generations.
  - id: ROLL-001
    statement: Rollback proof is observed and bound to that exact final generation.
  - id: TERM-001
    statement: Controller recommends terminal outcome but never exercises owner authority.
  - id: TERM-002
    statement: INCONCLUSIVE is a valid terminal execution outcome.
  - id: MIG-001
    statement: Legacy v2 artifacts never silently gain stronger v3 semantics.

