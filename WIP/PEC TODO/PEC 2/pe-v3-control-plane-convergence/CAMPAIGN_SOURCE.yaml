gates:
  - id: GATE-C0-CONTAINED
    name: Containment closed and baseline frozen
    gate_type: completion
    blocking: true
    pass_criteria:
      - Baseline frozen at 7517f377 with orchestrator detached immutably
      - Runner has no merge, close-authoritative, push, or gh-pr-create path
      - Task publishing flows through sanctioned make pr surface with stacked-PR parameters
      - Autonomy command broker denies unknown, caller-capability, and mixed-command bypasses
      - Containment test list passes with zero regression
    failure_effect: BLOCKED
    required_evidence_ids:
      - EVID-001
      - EVID-002
  - id: GATE-S1-SEMANTIC-CONSERVATION
    name: Semantic conservation proven
    gate_type: completion
    blocking: true
    pass_criteria:
      - Canonical Semantic Model owns all governing semantics
      - Round-trip semantic_diff is empty for a fixture covering every governing field
      - Unrepresentable laws raise CompileError
      - Acceptance is atomic and receipt-backed
      - Evidence collection is typed and measured
    failure_effect: BLOCKED
    required_evidence_ids:
      - EVID-003
  - id: GATE-S2-EXACT-LINEAGE
    name: Exact lineage and immutable candidates
    gate_type: completion
    blocking: true
    pass_criteria:
      - Repository generations form an immutable genealogy
      - Dirty and committed candidates both receive immutable snapshots
      - Verification targets the snapshot in a fresh verifier environment
      - Promotion receipts advance generations
      - Successors base on promoted generations
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S3-PROOF-ADMISSIBILITY
    name: Proof admissibility
    gate_type: completion
    blocking: true
    pass_criteria:
      - Unrelated evidence rejected
      - FAIL evidence rejected for positive claims
      - Wrong candidate or target evidence rejected
      - Expired temporal evidence rejected
      - Historical immutable proof remains valid
      - Evidence artifacts are append-only
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S4-AUTHORITY-BOUND
    name: Principal and grant authority binding
    gate_type: completion
    blocking: true
    pass_criteria:
      - Spoofed actor string cannot authorize
      - Nondelegable authority cannot be delegated
      - Wrong scope cannot approve
      - Expired grant cannot authorize
      - Worker without valid lease and fence fails
      - Controller cannot act as program owner
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S5-LINEARIZABLE-RUNTIME
    name: Linearizable runtime semantics
    gate_type: completion
    blocking: true
    pass_criteria:
      - State mutation and canonical event commit atomically
      - CAS rowcount enforcement on every mutable aggregate
      - Fencing tokens supersede stale workers
      - Hard-stop evaluator centralizes safety checks
      - Crash and concurrency matrix yields only committed or detectably recoverable states
      - Autonomy submit and revoke have exactly one winner
      - PE to Autonomy bridge emits grants Autonomy may only narrow
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S6-EXECUTION-SEMANTICS
    name: Execution semantics enforcement
    gate_type: completion
    blocking: true
    pass_criteria:
      - Caller cannot force gate PASS
      - Validation cannot mutate or escape candidate scope
      - Replan cannot silently change in-flight task
      - Corrupt active plan fails closed
      - Retry policy enforces max attempts and retryability taxonomy
      - Retry cleanup owns the worktree lifecycle
      - Promotion is wired into scheduling and completion
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S7-OWNER-CLOSEOUT
    name: Owner-bound convergence and closeout
    gate_type: completion
    blocking: true
    pass_criteria:
      - Controller cannot close the program alone
      - Spoofed owner cannot close
      - Handoff recommendation does not alter campaign status
      - INCONCLUSIVE terminalizes correctly
      - Final handoff contains exact final generations
      - Broken ledger blocks closeout
      - Stale or wrong-candidate rollback proof blocks closeout
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-S8-V3-CONFORMANCE
    name: Cross-layer adversarial conformance
    gate_type: completion
    blocking: true
    pass_criteria:
      - Zero hardening xfails remain
      - All v2 counterexamples blocked
      - Semantic conservation at one hundred percent
      - Fault matrix passes
      - Concurrency tests pass
      - Migration is repeatable
      - Legacy evidence cannot privilege-escalate
      - Shadow campaign converges
      - Self-host fixture converges
      - Docs, runbook and schema agree with implementation
    failure_effect: BLOCKED
    required_evidence_ids: []
  - id: GATE-CLOSE
    name: Program closeout
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-001
    pass_criteria:
      - All tasks COMPLETED
      - All gates PASS
      - Final handoff identifies exact final target generations
      - Rollback proof observed and bound to the final generation
      - Owner verdict receipt signed against the handoff digest
    failure_effect: NOT_CONVERGED
    required_evidence_ids: []

