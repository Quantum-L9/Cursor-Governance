$schema: https://json-schema.org/draft/2020-12/schema
$id: https://l9.dev/schemas/mobile-session-hydration-request.v1.schema.json
title: L9 Mobile Session Hydration Request
type: object
additionalProperties: false
required:
- request_id
- trigger
- active_objective
- available_artifacts
- constraints
properties:
  request_id:
    type: string
  trigger:
    type: string
    enum:
    - new_session
    - context_full
    - drift_reset
    - handoff
    - resume
  active_objective:
    type: string
  available_artifacts:
    type: array
    items:
      type: object
      required:
      - name
      - status
      - link_or_path
      additionalProperties: false
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - current
          - superseded
          - evidence_only
          - unknown
        link_or_path:
          type: string
  constraints:
    type: array
    items:
      type: string
  open_unknowns:
    type: array
    items:
      type: string
  requested_next_action:
    type:
    - string
    - 'null'
