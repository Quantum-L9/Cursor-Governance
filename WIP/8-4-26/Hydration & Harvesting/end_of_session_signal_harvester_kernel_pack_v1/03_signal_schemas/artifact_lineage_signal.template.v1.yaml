  signal_type: artifact_lineage_signal
  summary: ''
  source_evidence:
    session_refs: []
    evidence_level: unknown
  reuse_value:
    score: 0
    reason: ''
  promotion_decision: candidate
  target_loop: *id001
  confidence: unknown
  unknowns: []
  payload:
    artifact_name: ''
    artifact_status: []
    supersedes: []
    superseded_by: ''
    canonical_link: ''
    validation_status: []
