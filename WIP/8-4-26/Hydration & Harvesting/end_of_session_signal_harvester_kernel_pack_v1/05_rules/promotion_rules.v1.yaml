rules_id: l9.session_signal_promotion_rules.v1
status: canonical_draft
promote_if:
- reusable_across_future_sessions
- changes_architecture_boundary
- prevents_recurring_drift
- improves_artifact_generation
- strengthens_l9_true_form
- reduces_future_context_load
- creates_or_strengthens_compounding_loop
do_not_promote_if:
- one_off_chat_preference
- temporary_workaround
- unsupported_claim
- artifact_intermediate_without_reuse_value
- duplicated_existing_law
- interesting_but_not_behavior_changing
decision_values:
- promote
- defer
- reject
- evidence_only
- candidate
