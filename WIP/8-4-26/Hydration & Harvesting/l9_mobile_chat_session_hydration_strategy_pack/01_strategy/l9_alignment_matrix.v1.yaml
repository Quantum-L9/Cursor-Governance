matrix_id: l9.mobile_hydration.l9_alignment_matrix.v1
status: hardened
alignment_targets:
  context_minimization:
    rule: hydrate_by_slice_not_transcript
    pack_support:
    - mobile_session_hydration_packet_schema
    - mobile_chat_boot_prompt
    - session_hydration_runtime_contract
    risk_if_missing: mobile chat consumes stale or excessive context
  two_way_loops:
    rule: signals_and_exhaust_feed_future_loops
    pack_support:
    - hydration_loop_signal_schema
    - session_exhaust_capture_schema
    - end_session_harvest_trigger
    risk_if_missing: session outputs become dead summaries instead of recursive fuel
  mesh_loops:
    rule: propagate signals into constellation integration targets
    pack_support:
    - live_hydration_roadmap
    - signal_exhaust_register_schema
    risk_if_missing: future sessions lose compounding edge information
  mobile_usability:
    rule: small boot prompt and explicit templates
    pack_support:
    - mobile_chat_boot_prompt.template
    - mobile_hydration_system_prompt
    risk_if_missing: pack becomes unusable in ChatGPT mobile chat
  separation_of_concerns:
    rule: this pack hydrates sessions; it does not own core law, assurance verdicts, policy decisions, or code execution
    pack_support:
    - KERNEL_REFERENCE_REGISTRY
    - registration_law
    - operator_guide
    risk_if_missing: pack bloats into runtime blob
