specId: l9.mobile_chat_session_hydration_strategy.v1
status: canonical_draft
artifact_type: session_hydration_strategy_pack_spec
version: 1.0.0
created_at: '2026-07-09T20:54:41.144036+00:00'
identity:
  name: L9 Mobile Chat Session Hydration Strategy
  true_form: mobile_chat_hybrid_boot_and_hydration_protocol
  purpose: Enable ChatGPT mobile sessions to resume L9 work with minimum context load, maximum continuity, strict contracts,
    recursive two-way loops, and mesh leverage loops.
  primary_constraint: Usable in ChatGPT mobile chat with copy-paste prompts, short receipts, and downloadable artifacts.
scope:
  owns:
  - mobile_chat_session_boot
  - hydration_packet_shape
  - agent_system_prompt_seed
  - operator_playbook
  - typed_handoffs
  - signal_and_exhaust_capture
  - three_step_ahead_loop_forecast
  - artifact_registration_requirements
  must_not_own:
  - full_v20_kernel_stack
  - repo_execution_runtime
  - assurance_verdicts
  - policy_decisions
  - durable_memory_truth
  - live_repo_mutation
  - general_kernel_orchestration_engine
hybrid_strategy:
  primary_shape: agent_system_prompt_plus_skill_plus_playbook
  components:
    system_prompt: compact activation
    skill: hydrator behavior contract
    playbook: sequential mobile-safe handoffs
    schemas: machine-readable hydration and signal contracts
hydration_principles:
- hydrate by slice, not transcript
- load anchors before artifacts
- artifact links beat prose memory
- unknowns stay explicit
- every generated artifact must be registered
- signals and exhaust become future loop fuel
- no full kernel stack by default
- mobile output must stay readable and resumable
three_step_ahead_analysis:
- step: 1
  signals_available:
  - objective clarity
  - current artifacts
  - open unknowns
  - drift corrections
  exhaust_available:
  - discarded options
  - superseded artifacts
  - repeated discussion
  leverage_loop: next session starts with anchors and contract instead of rediscovery
- step: 2
  signals_available:
  - which hydration fields prevented drift
  - which artifacts were reused
  - which unknowns blocked action
  exhaust_available:
  - unused context slices
  - overly broad prompts
  - non-promoted signals
  leverage_loop: hydration packets improve from real mobile use
- step: 3
  signals_available:
  - recurring drift classes
  - artifact lineage deltas
  - assurance readiness gaps
  - mesh-edge value
  - context budget failures
  exhaust_available:
  - failed assumptions
  - validation gaps
  - oversized contracts
  - dead artifact links
  leverage_loop: L9 learns which slices, contracts, and loops improve execution
acceptance_criteria:
- one boot prompt can resume work
- agent consumes one hydration packet
- output has compact active state not transcript
- artifacts are registered
- schemas parse
- playbook has typed handoffs
- three-step signals/exhaust explicit
