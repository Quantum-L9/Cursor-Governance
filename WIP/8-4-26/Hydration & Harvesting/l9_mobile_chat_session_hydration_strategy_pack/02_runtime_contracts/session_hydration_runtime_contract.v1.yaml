contract_id: l9.mobile_chat_session_hydration_runtime_contract.v1
status: canonical_draft
input: SessionHydrationRequest
output: SessionHydrationPacket
must_compile:
- anchor_bundle
- artifact_status_register
- context_slice
- loop_signal_forecast
- next_action_contract
- exhaust_capture_plan
must_not_compile:
- full_transcript
- full_kernel_stack
- raw_source_bulk
- superseded_artifacts_as_current
- unvalidated_readiness_claims
two_way_loop_contract:
  forward:
  - session_outputs
  - artifact_links
  - validation_evidence
  - decisions
  return:
  - drift_corrections
  - failed_assumptions
  - unknowns
  - improvement_pressure
mesh_loop_contract:
  promote_edge_only_if:
  - enables_compounding_loop
  - reduces_future_context_load
  - clarifies_authority
  - improves_validation_or_assurance_readiness
  reject_edge_if:
  - related_but_no_leverage
  - duplicates_existing_edge
  - adds_context_bloat
  - unclear_owner_of_truth
