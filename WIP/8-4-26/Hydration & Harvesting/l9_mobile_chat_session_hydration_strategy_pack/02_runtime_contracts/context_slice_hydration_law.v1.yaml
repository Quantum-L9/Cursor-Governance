law_id: l9.mobile_context_slice_hydration_law.v1
status: canonical_draft
prime_directive: A mobile ChatGPT session must hydrate from the smallest sufficient packet, not the full prior chat, full
  kernel stack, or full artifact history.
required_packet_fields:
- current_objective
- active_baseline
- current_artifacts
- locked_laws
- open_unknowns
- next_action_contract
- do_not_load
forbidden_defaults:
- full_transcript
- full_v20_unpack
- all_prior_artifacts
- raw_source_archives
- historical_noise
stop_conditions:
- hydration_packet_missing_objective
- baseline_unknown
- canonical_artifact_link_missing
- scope_drift_detected
- context_budget_exceeded
