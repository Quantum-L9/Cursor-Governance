contract_id: l9.mobile_session.signal_propulsion_contract.v1
status: canonical_draft
purpose: Convert session signals and exhaust into future propulsion loops rather than summaries.
signal_classes:
- decision
- boundary
- drift_correction
- artifact_lineage
- schema_gap
- mesh_edge
- two_way_loop
- next_action
- unknown
propulsion_targets:
- next_session_hydration_packet
- end_of_session_signal_harvester
- living_roadmap
- task_contract_runtime
- mesh_integration_runtime
- assurance_bridge
promotion_rule: Promote only signals that reduce future context load, prevent drift, strengthen boundaries, or improve a recursive
  leverage loop.
reject_rule: Reject interesting but non-actionable session residue as exhaust_only.
