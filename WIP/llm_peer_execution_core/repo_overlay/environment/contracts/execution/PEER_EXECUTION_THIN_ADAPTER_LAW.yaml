metadata:
  law_id: l9.peer_execution.thin_adapter_law.v1
  title: L9 Peer Execution Thin Adapter Law
  version: 1.0.0
  date: '2026-08-12'
  status: BINDING
  authority_class: architecture_law
  scope:
    - Quantum-L9/Cursor-Governance peer and surface adapters
    - Program Execution worker-host and provider adapters
    - future LLM, IDE, CLI, API, and agent execution providers
    - coding-constellation peer execution integrations
  supersedes_target_patterns:
    - claude_code_as_thick_gold_standard_adapter
    - peer_specific_copies_of_shared_execution_behavior
    - provider_adapter_ownership_of_program_or_autonomy_state
    - provider_identity_hard_bound_to_agent_identity
  current_repository_migration_status: REQUIRED

purpose: >-
  Guarantee that every peer, surface, model, and provider connects to one shared
  execution substrate through a thin adapter. New providers must be additive
  bindings, not new execution systems. Reusable behavior belongs upstream once.

canonical_pipeline:
  - Program_Controller
  - Peer_Runtime_Binding
  - Execution_Profile
  - Peer_Execution_Core
  - Shared_Transport
  - Thin_Provider_Adapter
  - Provider_or_Host

canonical_ownership:
  Program_Controller:
    owns:
      - program state
      - task readiness and advancement
      - program lock
      - leases and task admission
      - independent verification admission
      - convergence and final program-state transitions
  Peer_Runtime_Binding:
    owns:
      - agent_ref
      - surface
      - provider_ref
      - execution_profile_ref
      - binding-level readiness reference
  Execution_Profile:
    owns:
      - reusable execution policy
      - inference budget defaults
      - timeout and retry policy
      - permission profile references
      - context policy references
  Peer_Execution_Core:
    owns:
      - canonical execution request construction
      - canonical context manifest construction
      - permission resolution
      - lifecycle orchestration
      - capability receipt lifecycle and freshness
      - inference budget enforcement
      - timeout and retry enforcement
      - telemetry normalization
      - canonical result normalization
      - canonical receipt construction
      - shared readiness evaluation
      - autonomy gateway integration
      - admitted-dispatch concurrency and join mechanics subordinate to Program Controller readiness
  Shared_Transport:
    owns:
      - reusable subprocess, HTTP, MCP, or compatible transport mechanics
      - process lifecycle
      - transport timeout mechanics
      - transport evidence capture
      - transport-level error normalization
  Thin_Provider_Adapter:
    owns_only:
      - provider or host identification
      - provider-specific capability declaration
      - provider availability probing
      - canonical-request to provider-call translation
      - provider invocation through an approved shared transport
      - provider-response to canonical-provider-result translation

laws:
  - id: PE-LAW-001
    name: thin_adapter_absolute
    rule: >-
      Every peer, surface, and provider adapter MUST remain thin. An adapter MUST
      NOT become a second execution subsystem, scheduler, policy engine, memory
      client, autonomy plane, receipt authority, or program-state owner.
  - id: PE-LAW-002
    name: reusable_behavior_moves_upstream
    rule: >-
      Behavior useful to two or more peers or providers MUST be implemented once
      in Peer Execution Core or a shared transport. Copying, forking, or
      reimplementing that behavior inside adapters is forbidden.
  - id: PE-LAW-003
    name: adapter_responsibility_ceiling
    rule: >-
      Provider adapters are limited to capability declaration, availability
      probing, request translation, invocation, and response translation. Surface
      adapters are limited to activation/configuration carriers and a binding to
      the canonical peer execution path.
  - id: PE-LAW-004
    name: identity_provider_separation
    rule: >-
      Agent identity and topology MUST be resolved by Peer Runtime Bindings, not
      embedded as execution ownership inside provider adapters. A provider MAY
      serve multiple peers and a peer MAY change providers without changing its
      canonical identity.
  - id: PE-LAW-005
    name: execution_profile_separation
    rule: >-
      Budgets, permissions, context selection, retry policy, timeout policy,
      concurrency, and autonomy constraints MUST be reusable execution-profile or
      core concerns. Provider adapters MUST NOT own policy defaults.
  - id: PE-LAW-006
    name: canonical_request_result
    rule: >-
      All providers MUST consume one canonical execution-request contract and
      return one canonical provider-result contract. Provider-specific fields MUST
      remain inside provider metadata or raw evidence and MUST NOT contaminate
      canonical change IR, Program state, or verification semantics.
  - id: PE-LAW-007
    name: receipts_above_providers
    rule: >-
      Canonical capability, lifecycle, attempt, verification, handoff, and
      convergence receipts MUST be constructed by authoritative shared layers.
      Providers may return evidence but MUST NOT author canonical Program truth.
  - id: PE-LAW-008
    name: transport_reuse
    rule: >-
      Transport mechanics MUST be reusable independently of provider identity.
      Providers sharing a protocol or process pattern MUST share one transport
      implementation rather than duplicate subprocess, HTTP, timeout, retry,
      streaming, cancellation, or evidence logic.
  - id: PE-LAW-009
    name: no_copied_brains
    rule: >-
      Governance, memory semantics, autonomy logic, scheduler logic, context
      compilation, result acceptance, and validation semantics MUST NOT be copied
      into an adapter directory. Adapters bind to canonical owners.
  - id: PE-LAW-010
    name: provider_addition_is_additive
    rule: >-
      Adding a new provider SHOULD require only a provider descriptor, thin
      translation/invocation code, fixtures, and conformance evidence. It MUST
      NOT require provider-specific changes to the Program Controller, canonical
      Program schemas, autonomy authority, memory authority, or change IR.
  - id: PE-LAW-011
    name: generic_core_change_requires_proof
    rule: >-
      If a new provider exposes a capability absent from the shared substrate,
      any core change MUST be provider-neutral, useful as a canonical capability,
      covered by an accepted ADR, and independently testable without that
      provider. Provider-specific exceptions are not sufficient justification.
  - id: PE-LAW-012
    name: provider_capabilities_are_declared_not_inferred
    rule: >-
      Differences in tools, cancellation, streaming, structured output,
      isolation, credentials, or model controls MUST be declared as capabilities
      and probed where material. Missing capability MUST degrade to unsupported or
      blocked, never hidden emulation or false success.
  - id: PE-LAW-013
    name: claude_is_not_architecture
    rule: >-
      Claude Code is a provider and migration source, not the gold-standard
      architecture. Existing reusable behavior inside Claude-specific adapters
      MUST be extracted upstream before other peers are expanded by copying it.
  - id: PE-LAW-014
    name: conformance_fails_closed
    rule: >-
      Thin-adapter conformance MUST fail when an adapter owns forbidden shared
      behavior, widens authority, bypasses canonical lifecycle, or requires a
      private alternate execution path.

adapter_allowed_content:
  - provider or surface descriptor
  - provider capability declarations
  - availability probe
  - request mapper
  - invocation binding to approved shared transport
  - response parser and mapper
  - provider-specific error-code mapping
  - provider-specific fixtures and conformance tests
  - activation or configuration carrier for a surface

adapter_forbidden_content:
  - Program state transitions
  - task readiness or dependency logic
  - Program Lock ownership
  - worktree creation or repository lease ownership
  - canonical receipt construction
  - independent verification
  - canonical context compilation
  - generic prompt-contract semantics
  - inference budget policy
  - generic timeout or retry policy
  - generic subprocess or HTTP lifecycle code when a shared transport exists
  - autonomy policy or authorization decisions
  - peer identity registry ownership
  - memory storage or promotion semantics
  - scheduler or concurrency authority
  - convergence decisions
  - remote merge or deployment authority

canonical_contracts_required:
  CanonicalExecutionRequest:
    provider_neutral_fields:
      - execution_id
      - task_id
      - program_lock_digest
      - rendered_contract_digest
      - worktree_ref
      - objective
      - context_manifest_ref
      - permission_profile_ref
      - inference_budget
      - timeout_budget
      - requested_capabilities
      - telemetry_context
  CanonicalProviderResult:
    provider_neutral_fields:
      - execution_id
      - status
      - structured_payload
      - raw_output_digest
      - provider_metadata
      - usage
      - session_or_run_id
      - observed_capabilities
      - errors
      - transport_evidence_refs

conformance_gates:
  - id: PE-GATE-001
    name: no_shared_authority_in_adapter
    pass_when: adapter contains no Program, autonomy, memory, verification, convergence, or deployment authority
  - id: PE-GATE-002
    name: identity_is_external
    pass_when: agent_ref and surface identity resolve from peer binding rather than provider implementation ownership
  - id: PE-GATE-003
    name: shared_transport_reused
    pass_when: provider invocation uses an approved shared transport when one matches the provider protocol
  - id: PE-GATE-004
    name: canonical_request_result_only
    pass_when: provider boundary accepts CanonicalExecutionRequest and returns CanonicalProviderResult or generated equivalents
  - id: PE-GATE-005
    name: lifecycle_is_provider_independent
    pass_when: provider removal or unavailability yields BLOCKED or CAPABILITY_UNSUPPORTED without corrupting Program state
  - id: PE-GATE-006
    name: new_provider_does_not_fork_core
    pass_when: adding a provider does not require provider-specific Program Controller, receipt, autonomy, memory, or change-IR branches
  - id: PE-GATE-007
    name: duplicate_behavior_scan
    pass_when: no reusable scheduler, permission, context, telemetry, budget, timeout, retry, receipt, or process-runner implementation is duplicated in provider adapters

migration_order:
  - extract reusable Claude Code execution behavior into Peer Execution Core and shared transports
  - define CanonicalExecutionRequest and CanonicalProviderResult
  - migrate Claude Code to the thin provider contract
  - migrate Cursor execution surfaces to the same core
  - migrate Codex, Gemini, Manus, and future peers without copying Claude implementation
  - remove or supersede documentation that calls Claude Code the thicker gold-standard adapter
  - remove target-architecture exemptions for peer-owned scheduler/autonomy copies
  - activate merge-blocking thin-adapter conformance tests

exception_policy:
  default: DENY
  allowed_only_when:
    - behavior is intrinsically provider-specific and cannot be expressed as a shared capability or transport concern
    - the exception does not own or widen Program, autonomy, memory, verification, deployment, or convergence authority
    - an accepted ADR records scope, rationale, tests, and removal criteria
  must_not_create:
    - second execution core
    - second scheduler authority
    - second autonomy plane
    - second memory path
    - second Program lifecycle

current_evidence_basis:
  repository: Quantum-L9/Cursor-Governance
  observations:
    - path: environment/agents/adapters/ADAPTER_CONTRACT.md
      blob_sha: 1a1a7732842de01acc1e7c17b8b35ef29fbfddeb
      observed_pattern: Claude Code described as thicker gold-standard adapter and thinner peers catch up
    - path: environment/agents/PEER_EXECUTION.md
      blob_sha: 1aa08f21168fced2d889da85a6f615ee77f090e0
      observed_pattern: provider adapter descriptors currently carry agent_ref and Claude scheduler receives an exemption
    - path: environment/program-execution/adapters/claude-code/driver.py
      blob_sha: 00bcbe36e3d532724c4b980eced7c34376ce2b21
      observed_pattern: Claude adapter currently owns prompt construction, permission rendering, process execution, parsing, and result mapping
    - path: environment/program-execution/adapters/codex/driver.py
      blob_sha: 0aa41eccfbc500f12ea86c0953b05efc79f51131
      observed_pattern: Codex adapter duplicates adapter structure but remains blocked without a dedicated transport bridge

acceptance_criteria:
  - a new provider can be added without copying Claude Code execution machinery
  - Claude Code, Cursor, and future providers share one lifecycle, context, permission, budget, telemetry, and receipt path
  - peer identity survives provider substitution unchanged
  - provider unavailability fails closed without corrupting Program state
  - provider-specific capability differences are explicit and evidence-backed
  - conformance rejects thick adapters
