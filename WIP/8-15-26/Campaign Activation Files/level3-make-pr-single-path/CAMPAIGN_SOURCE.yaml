operator_directive:
  objective: >-
    Install the operator-supplied Level-3 Makefile and make `make pr` the sole
    agent/operator GitHub PR lifecycle for this repository: publish, remediate,
    and bounded exact-head merge. Delete `pr-check`. Do not redesign the
    supplied Makefile.
  mode: controlled_autonomous_until_material_boundary
  policy_profile: quantum-l9.safe-autonomy.v1
  publish:
    model: four_commit_one_pr
    mid_execution_push: forbidden
    pr_base: origin/campaign/level3-make-pr-single-path
    command: PR_REMEDIATE=1 PR_AUTOMERGE=1 make pr
    title_template: "[level3-make-pr-single-path] Level-3 Make and Single-Path PR Refactor"
    after: TASK-004
    remediation_owner: the_same_make_pr_invocation
    second_remediation_worker: forbidden
  makefile_candidate:
    path: WIP/makefile/Makefile-CG.md
    sha256: 1dabcd0177354c6550ad9938d3c60c53ffff7222c903c157f376cba3d63c5bf8
    encoding: utf-8
    note: File is a raw Makefile. Replace repository Makefile with these bytes.
  auto_continue:
