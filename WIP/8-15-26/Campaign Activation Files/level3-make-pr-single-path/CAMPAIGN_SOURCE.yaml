    - admin_merge
    - deploy
    - weaken_validators
    - delete_tests_for_pass
    - make_pr_check
    - OPEN_PR=0_make_pr_then_make_pr
    - PR_REMEDIATE=0_make_pr
    - bare_git_push
    - bare_gh_pr_create
    - bare_gh_pr_merge
    - authorize_campaign_merge_py_plus_gh_pr_merge
    - mid_execution_push
    - reconstruct_makefile_from_memory
    - hand_edit_generated_projections

program:
  id: level3-make-pr-single-path
  name: Level-3 Make and Single-Path PR Refactor
  version: 1.0.0
  owner: Igor Beylin
  definition_status: draft
  snapshot_at: "2026-08-16"
  objective: >-
    Install the operator-supplied Level-3 Makefile and make `make pr` the sole
    agent/operator GitHub PR lifecycle (publish, remediate, bounded exact-head
    merge). Delete `pr-check`. Do not redesign the supplied Makefile.
  problem_statement: >-
    `make pr` currently depends on `pr-check`, and agents re-run overlapping
    gates (`make pr-check`, `OPEN_PR=0 make pr`, bare pre-commit/Ruff) on an
    unchanged tree. Standing campaign publish is `PR_REMEDIATE=0 make pr` with
    human-only merge. That duplicates validation and leaves no bounded
    exact-PR automerge.
  target_state: >-
    After exactly four local commits and one publication,
    `PR_REMEDIATE=1 PR_AUTOMERGE=1 make pr` is the only shipping command for
    this campaign PR. `pr-check` is gone. Changed-file resolution and
    pre-commit each run once per repository state. Ruff, format, and
    generated-artifact sync have one owner. Bounded automerge may merge only
    this PR at the observed green mergeable head. Force-push, admin-merge, and
    raw `git push` / `gh pr create` / `gh pr merge` remain forbidden. Live
    doctrine for `pr-check` and `PR_REMEDIATE=0 make pr` is zero except
    negative tests. Historical ADR/law may remain only when marked superseded.
    AGENTS.md root-file edits are append-only supersession blocks.
  scope:
    include:
      - Makefile
      - ops/scripts/run_pr_gate.sh
      - ops/scripts/run_pr_precommit.sh
      - ops/scripts/open_pr_after_gate.sh
      - .pre-commit-config.yaml
      - ops/config/precommit-hook-contract.json
      - ops/autonomy/merge_gate.py
      - ops/autonomy/surface_profile.yaml
      - environment/program-execution/peer_execution/autonomy/profiles/pr-convergence.json
      - environment/program-execution/campaigns/CAMPAIGN_EXECUTION_POLICY.yaml
      - environment/program-execution/campaigns/COMPILE_ALLOWLIST.yaml
      - environment/program-execution/campaigns/CAMPAIGN_STATUS.yaml
      - environment/program-execution/README.md
      - environment/program-execution/campaigns/README.md
      - environment/agents/adapters/claude-code/settings.template.json
      - AGENTS.md
      - CANONICAL_LAW.md
      - rules/48-make-pr-remediation.mdc
      - rules/88-l4-local-autonomy.mdc
      - skills/l9-bounded-autonomy/SKILL.md
      - skills/l9-pe-campaign-activate/references/pipeline.md
      - skills/l9-gmp-protocol/SKILL.md
      - skills/l9-gmp-protocol/references/phase-contracts.md
      - skills/l9-plan/references/plan-workflow.md
      - skills/l9-plan/references/plan-quality-gates.md
      - skills/l9-ci-ops/SKILL.md
    exclude:
      - new repositories
      - force_push
      - admin_merge
      - deploy
      - production migration
      - skills/_archived
      - environment/generated
      - ops/generated
      - historical campaign handoffs
      - dirty_primary_clone
  contracts:
    pair: program-execution-system.v2
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_interface_contract
    - latest_explicit_operator_instruction
    - accepted_program_definition
    - implementation
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - mutable_runtime_state_remains_outside_git
    - no_silent_scope_expansion
    - worker_claim_is_not_verification
    - four_local_commits_then_one_publish
    - one_authoritative_validation_per_repository_state
    - replace_makefile_by_digest_never_by_memory
    - agents_md_root_edits_are_append_only
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

