    title: "Commit 1 — refactor(make): establish level-3 PR capability graph"
    definition_status: ready
    workstream_id: WS-01
    wave_id: W0
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >-
      Replace repository Makefile with WIP/makefile/Makefile-CG.md
      (sha256 1dabcd0177354c6550ad9938d3c60c53ffff7222c903c157f376cba3d63c5bf8)
      byte-for-byte. Record the live Makefile digest first. After replace,
      prove digest match, `make help`, absent `pr-check`, present `make pr`,
      and no accidental public-target loss. Local commit only. Do not push.
    authority_basis_ids:
      - AUTH-001
    required_decision_ids:
      - DEC-001
    blocking_unknown_ids: []
    input_evidence_ids:
      - EVID-001
      - EVID-002
    actions:
      - record_live_makefile_digest
      - replace_makefile_from_candidate_digest
      - verify_working_makefile_digest_matches_candidate
      - verify_make_help
      - verify_pr_check_absent
      - verify_make_pr_present
      - local_commit_refactor_make
    acceptance:
      - id: AC-001
        statement: >-
          Working Makefile sha256 equals the bound candidate digest, `make help`
          succeeds, `pr-check` is absent, and `make pr` is the canonical PR
          target.
        required_evidence_types:
          - inspection
          - test_result
    negative_cases:
      - reconstruct_makefile_from_memory
      - stylistic_makefile_rewrite
      - mid_execution_push
      - scope_expansion
    rollback:
      strategy: restore_Makefile_to_pre_replace_bytes
      trigger: digest_mismatch_or_help_failure
      validation: worktree_Makefile_matches_EVID-002
    risk:
      tier: T1
      reversibility: fully_reversible
      blast_radius: Makefile
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-001

  - id: TASK-002
    title: "Commit 2 — refactor(pr): remove duplicate validation execution"
    definition_status: blocked
    workstream_id: WS-01
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >-
      Refactor the local PR gate into a one-pass execution DAG. Resolve the
      changed-file set once per `make pr`. Execute pre-commit once per
      repository state. Make `.pre-commit-config.yaml` authoritative for hooks
      it declares. Remove outer-gate duplicate Ruff, Ruff-format, and
      generated-artifact reconciliation. Keep genuinely PR-specific checks
      outside pre-commit. Fail closed on missing or failed mandatory
      validators. Prove execution count, not only source text. Local commit
      only. Do not push.
    authority_basis_ids:
      - AUTH-001
    required_decision_ids:
      - DEC-001
    blocking_unknown_ids: []
    input_evidence_ids:
      - EVID-001
    actions:
      - trace_make_pr_execution_dag
      - resolve_changed_files_once
      - execute_precommit_once
      - remove_outer_duplicate_ruff_and_format
      - remove_duplicate_generated_reconciliation
      - retain_pr_specific_checks
      - local_commit_refactor_pr
    acceptance:
      - id: AC-002
        statement: >-
          One `make pr` invocation resolves changed files once, runs
          pre-commit once, and does not re-execute Ruff, format, or generated
          reconciliation already owned by pre-commit.
        required_evidence_types:
          - inspection
          - test_result
    negative_cases:
