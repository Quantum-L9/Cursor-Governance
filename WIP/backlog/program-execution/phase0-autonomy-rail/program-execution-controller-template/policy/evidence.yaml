schema: program-execution-controller.evidence-policy.v2
schema_version: 2.0.0
rules:
- worker_claim_is_untrusted_until_verified
- changed_files_must_exactly_match_observed_state
- validation_is_rerun_by_controller
- every_transition_has_ledger_event
- gate_result_requires_gate_evaluation_receipt
- stale_or_expired_evidence_is_non_passing
- local_make_pr_logs_are_accepted_evidence_method
- uv_lock_check_output_is_accepted_evidence_method
- phase0_ack_is_required_evidence_when_program_deploying
- distinguish_local_pr_gate_from_remote_ci_evidence
retention:
  attempts: preserve
  verification_receipts: preserve
  recovery_artifacts: preserve
  ledger: append_only
accepted_methods:
- make_pr
- make_pr_check
- uv_lock_check
- phase0_inspection
- controller_verification_rerun
