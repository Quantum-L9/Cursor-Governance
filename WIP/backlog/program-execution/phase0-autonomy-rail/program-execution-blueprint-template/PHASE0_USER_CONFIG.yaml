schema: program-execution-blueprint.phase0-user-config.v2
schema_version: 2.0.0
phase: 0
definition_status: draft
program_deploying: false
# When program_deploying is true, autonomy.default MUST be maximum_within_ceiling
# unless open_business_decisions names a DEC-* that narrows it.
autonomy:
  default: maximum_within_ceiling
  profile: bounded_local_execution
  # Allowed profiles: bounded_local_execution | program_deploy_max_autonomy
  authority: A4_CAMPAIGN_BOUNDED_EXTERNAL_WRITE
  autonomous_merge: false
  max_parallel_workers: 1
  max_mutation_lanes: 1
  remediation_skill: l9-pr-remediation
adapter_status: absent
# absent | present — push/PR denied when absent even if preauthorized
blocking_inventory:
  true_blocking: []
  # business_logic DEC/UNK IDs and hard_safety gate/check IDs only
  advisory_or_disabled: []
  # CI checks / gates demoted or waived for program window (LL-001)
stop_conditions_reviewed: false
approvals_preauthorized: []
# each: { action, expiry, bound_to_program_digest: true }
open_business_decisions: []
# DEC-* IDs that may legitimately halt progress mid-flight
alignment:
  uv_lock_check: pending
  # pending | pass | fail | not_applicable
  toolchain_pin_lockstep: pending
  make_pr_gate_required: true
  targets_inventoried: []
campaign_authorization_packet:
  # Align with skills/l9-bounded-autonomy campaign authorization packet — never "envelope"
  packet_id: null
  declared_repos: []
  declared_prs: []
  declared_branches: []
  declared_ops: []
kill_switch:
  path: .l9/autonomy/revoke
  operator_action: touch_revoke_and_runtime_suspend
  auto_file_watch_enforced: false
resource_hygiene_ack: false
operator_ack:
  name: REPLACE_WITH_OPERATOR_NAME
  acknowledged_at: null
completeness:
  phase0_complete: false
  # Fail-closed: mutating waves require phase0_complete true when program_deploying
notes: Complete Phase 0 before Wave 0 mutation / long-running autonomy (LL-002).
