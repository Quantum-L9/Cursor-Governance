    - migration_plan
    - retirement_plan
    - remediation_plan
    - deployment_plan
    - refactor_plan
    - integration_plan
    - recovery_plan
    - custom
  evidence_type:
    - filesystem
    - runtime_behavior
    - structural
    - quality_gate
    - repository_state
    - network_observation
    - proof_receipt
    - human_confirmation
  side_effect:
    - none
    - filesystem_read
    - filesystem_mutation
    - destructive_filesystem_mutation
    - network_read
    - network_write
    - database_read
    - database_write
    - external_state_mutation
    - human_approval
  idempotency:
    - safe_to_repeat
    - safe_with_dedupe
    - unsafe_blind_repeat
    - non_idempotent
    - not_applicable
  retry_policy:
    - none
    - retry_once
    - bounded_retry
    - manual_only
