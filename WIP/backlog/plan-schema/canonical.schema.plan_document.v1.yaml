  risk_level:
    - low
    - medium
    - high
    - critical
  lifecycle_classification:
    - delete
    - migrate_then_delete
    - keep
    - replace
    - skip
  execution_network_mode:
    - none
    - read_only
    - named_services_only
    - existing_tunnel_only
    - bounded_external_write

validation_rules:
  - id: PLAN-SCHEMA-001
    severity: blocker
    rule: A plan must lock a full commit SHA or equivalent immutable baseline before mutation.
  - id: PLAN-SCHEMA-002
    severity: blocker
    rule: Baseline drift at execution start requires stop_and_replan.
  - id: PLAN-SCHEMA-003
    severity: blocker
    rule: Failed blocking capability probe sets plan status to preflight_blocked.
  - id: PLAN-SCHEMA-004
    severity: blocker
    rule: Every mutation must fall inside the execution envelope.
  - id: PLAN-SCHEMA-005
    severity: blocker
    rule: Every destructive or external-write TODO must declare side effects, idempotency, retry, compensation, and irreversible state.
  - id: PLAN-SCHEMA-006
    severity: blocker
    rule: Non-idempotent external writes require dedupe or explicit pre-write evidence.
  - id: PLAN-SCHEMA-007
    severity: blocker
    rule: Execution DAG must be acyclic before plan status may become executable.
  - id: PLAN-SCHEMA-008
    severity: blocker
    rule: Command exit zero alone is insufficient proof for a success property requiring structural or runtime evidence.
  - id: PLAN-SCHEMA-009
    severity: blocker
    rule: Rollback must distinguish code, data, external state, and local state.
  - id: PLAN-SCHEMA-010
    severity: major
    rule: Irreversible operations must be enumerated before execution.
  - id: PLAN-SCHEMA-011
    severity: blocker
    rule: Retirement plans must prove retired artifacts are not regenerated.
  - id: PLAN-SCHEMA-012
    severity: blocker
    rule: Local dirty state overlapping may_modify paths blocks execution unless explicitly allowed.
  - id: PLAN-SCHEMA-013
    severity: blocker
    rule: Unknown dependencies must remain explicit and may not be silently inferred away.
  - id: PLAN-SCHEMA-014
    severity: major
    rule: Follow-on architecture or schema evolution must remain a separate milestone unless explicitly added to scope.
  - id: PLAN-SCHEMA-015
    severity: blocker
    rule: Convergence requires all blocking evidence properties and execution gates to pass.

derivation_targets:
  can_generate:
    - plan_document
    - version_bound_execution_contract
    - immutable_baseline_receipt
    - capability_preflight_checklist
    - execution_envelope
    - side_effect_matrix
    - rollback_contract
    - architecture_impact_map
    - execution_DAG
    - property_evidence_matrix
    - validation_plan
    - machine_summary
    - follow_on_plan_seed

anti_drift_rules:
  - Do not embed repository names, local paths, commit SHAs, branch names, usernames, service groups, or command strings into reusable enums.
  - Do not treat a successful command as sufficient evidence when the property is behavioral or structural.
  - Do not allow mutation before immutable baseline and capability preflight pass.
  - Do not expand a bounded execution plan into architecture redesign without a separate plan.
  - Do not hide irreversible operations inside generic filesystem_mutation labels.
  - Do not retry unsafe writes blindly.
  - Do not let rollback claims imply reversibility for append-only external systems.
  - Do not permit plan execution outside declared filesystem, command, network, and secret envelopes.
  - Do not mark convergence complete while blocking unknowns or failed properties remain.

minimum_viable_instance_requirements:
  required:
    - metadata
    - todos
    - architect_framing
    - immutable_baseline
    - objective
    - capability_preflight
    - execution_envelope
    - side_effects_and_idempotency
    - architecture_impact
    - rollback
    - complexity_and_uncertainty
    - execution_DAG
    - property_evidence_matrix
    - stress_and_disconfirm
    - out_of_scope
    - convergence
