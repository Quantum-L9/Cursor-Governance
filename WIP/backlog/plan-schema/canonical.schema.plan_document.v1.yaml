schema_id: canonical.schema.plan_document.v1
schema_name: Canonical Plan Document Schema
schema_class: canonical_document_type_schema
schema_family: l9_execution_architecture
version: 1.0.0
status: canonical_draft
first_class_artifact: true
artifact_filename: canonical.schema.plan_document.v1.yaml
generated_at: "2026-08-12T02:32:00"

created_from:
  - file: "Plan Template.md"
    role: execution_plan_source_instance
    checksum_sha256: "75009079398aa8a65e5a7d571514e181fc76e5789dfc1e7ee542dd3494847fe5"

purpose:
  primary: >
    Define the reusable canonical schema for L9 execution plans. A valid plan
    instance is a version-bound execution contract that locks repository reality,
    proves required runtime capability, constrains mutation through an explicit
    execution envelope, classifies side effects and idempotency, defines typed
    rollback, orders work through a dependency DAG, and closes only on property
    evidence rather than command success alone.
  output_level: schema_not_instance
  intended_use:
    - derive_plan_documents
    - derive_version_bound_execution_contracts
    - gate_agent_execution
    - derive_execution_DAGs
    - derive_property_evidence_matrices
    - derive_rollback_contracts
    - derive_preflight_checklists
    - derive_safe_mutation_envelopes
    - derive_convergence_gates
  not_for:
    - implementation_code
    - repository_specific_plan_instances
    - generic_project_management_checklists
    - unbounded_agent_execution
    - mutation_without_preflight
    - validation_claims_without_evidence

ontology:
  parent_type: execution_contract_schema
  specialized_type: plan_document_schema
  instance_type_generated_by_this_schema: plan_document
  downstream_artifacts:
    - execution_contract
    - preflight_receipt
    - capability_census
    - classification_receipt
    - execution_DAG
    - rollback_contract
    - property_evidence_matrix
    - validation_report
    - machine_summary
  related_schema_types:
    - canonical.schema.node_spec.v1
    - canonical.schema.code_generation_prompt_contract.v1
    - canonical.schema.validation_honesty.v1
    - canonical.schema.dependency_topology_contract.v1

inheritance:
  extends:
    - canonical.knowledge_object.schema.v1
    - canonical.execution_contract.schema.v1
    - canonical.validation_contract.schema.v1
  provides:
    - plan_identity_model
    - baseline_lock_model
    - capability_preflight_model
    - execution_envelope_model
    - side_effect_and_idempotency_model
    - architecture_impact_model
    - rollback_model
    - complexity_and_uncertainty_model
    - inventory_classification_model
    - execution_DAG_model
    - property_evidence_model
    - stress_disconfirm_model
    - scope_boundary_model
    - follow_on_milestone_model
    - convergence_model

plan_executability_law:
  expression:
    all_required:
      - schema_intent_clear
      - baseline_matches
      - capability_probes_pass
      - invariants_match
      - execution_envelope_respected
  rule: >
    A plan is executable only when all required properties hold. Structural
    completeness or syntactically valid markdown/YAML alone is insufficient.

required_sections:
  metadata:
    required: true
    purpose: Identify, version, and classify a plan instance.
    fields:
      plan_id:
        type: string
        required: true
      name:
        type: string
        required: true
      overview:
        type: string
        required: true
      schema_version:
        type: semver
        required: true
      status:
        enum:
          - draft
          - preflight_blocked
          - executable
          - in_progress
          - validation_failed
          - converged
          - superseded
        required: true
      is_project:
        type: boolean
        required: true
      owner:
        type: string
        required: false
      created_at:
        type: datetime_or_date
        required: true
      updated_at:
        type: datetime_or_date
        required: false

  todos:
    required: true
    purpose: Define executable plan work units.
    type: list
    item_schema:
      id:
        type: string
        required: true
      content:
        type: string
        required: true
      status:
        enum:
          - pending
          - blocked
          - ready
          - in_progress
          - completed
          - failed
          - skipped
        required: true
      phase:
        type: string
        required: false
      depends_on:
        type: list_string
        required: false
      side_effect_ref:
        type: string
        required: false
      evidence_property_refs:
        type: list_string
        required: false

  architect_framing:
    required: true
    purpose: Lock whether the plan executes an existing architecture or redesigns it.
    fields:
      planning_ssot:
        type: string
        required: true
      plan_class:
        enum:
          - bounded_execution_contract
          - migration_plan
          - retirement_plan
          - remediation_plan
          - deployment_plan
          - refactor_plan
          - integration_plan
          - recovery_plan
          - custom
        required: true
      redesign_allowed:
        type: boolean
        required: true
      follow_on_schema_evolution_separate:
        type: boolean
        required: true
      framing_notes:
        type: string
        required: false

  immutable_baseline:
    required: true
    purpose: Lock execution to a verified repository or system state before mutation.
    fields:
      captured_at:
        type: datetime
        required: false
      repository:
        type: string
        required: true
      workspace:
        type: string
        required: false
      ssot_clone:
        type: string
        required: false
      branch:
        type: string
        required: false
      commit_sha:
        type: full_commit_SHA
        required: true
      dirty:
        type: boolean
        required: true
      artifact_hashes:
        type: map
        required: true
      allowed_local_dirt:
        type: list
        required: false
      overlap_policy:
        enum:
          - stop_if_dirty_overlaps_may_modify
          - require_clean_tree
          - explicitly_allow_listed_paths
        required: true
      verification_rule:
        const: reverify_at_execution_start
      on_drift:
        const: stop_and_replan

  objective:
    required: true
    purpose: State mission and evidence-based success.
    fields:
      mission:
        type: string
        required: true
      success_properties:
        type: list
        min_items: 1
        item_schema:
          id:
            type: string
            required: true
          property:
            type: string
            required: true
          evidence_type:
            enum:
              - filesystem
              - runtime_behavior
              - structural
              - quality_gate
              - repository_state
              - network_observation
              - proof_receipt
              - human_confirmation
            required: true
          proof:
            type: string
            required: true
          blocking:
            type: boolean
            default: true

  capability_preflight:
    required: true
    purpose: Prove required runtime capabilities before mutation.
    fields:
      phase_id:
        type: string
        required: true
      blocking:
        const: true
      probes:
        type: list
        min_items: 1
        item_schema:
          id:
            type: string
            required: true
          probe:
            type: string
            required: true
          property:
            type: string
            required: true
          pass_condition:
            type: string
            required: true
          evidence_type:
            enum:
              - command_receipt
              - runtime_behavior
              - filesystem
              - network_read
              - import_probe
              - permission_probe
              - structural
            required: true
      failed_probe_status:
        const: blocked
      advisory_debt_policy:
        type: string
        required: false
      touched_path_quality_policy:
        type: string
        required: false

  execution_envelope:
    required: true
    purpose: Bound every allowed mutation and external effect.
    fields:
      filesystem:
        type: map
        required: true
        fields:
          write_allow:
            type: list
            required: true
          write_deny:
            type: list
            required: true
          delete_allow:
            type: list
            required: false
      commands:
        type: map
        required: true
        fields:
          allow:
            type: list
            required: true
          deny:
            type: list
            required: true
      network:
        type: map
        required: true
        fields:
          mode:
            enum:
              - none
              - read_only
              - named_services_only
              - existing_tunnel_only
              - bounded_external_write
            required: true
          allowed_services:
            type: list
            required: false
      secrets:
        type: map
        required: true
        fields:
          access:
            enum:
              - none
              - read_only_named
              - runtime_injected_only
            required: true
          redaction_required:
            type: boolean
            default: true
      autonomous_merge:
        type: boolean
        required: true

  side_effects_and_idempotency:
    required: true
    purpose: Make retries and compensation explicit per executable TODO.
    type: list
    item_schema:
      todo_id:
        type: string
        required: true
      side_effects:
        type: list
        required: true
        item_enum:
          - none
          - filesystem_read
          - filesystem_mutation
          - destructive_filesystem_mutation
          - network_read
          - network_write
          - database_read
          - database_write
          - external_state_mutation
          - human_approval
      idempotency:
        enum:
          - safe_to_repeat
          - safe_with_dedupe
          - unsafe_blind_repeat
          - non_idempotent
          - not_applicable
        required: true
      retry:
        enum:
          - none
          - retry_once
          - bounded_retry
          - manual_only
          - not_applicable
        required: true
      compensation:
        type: string_or_null
        required: true
      irreversible:
        type: boolean
        required: true

  architecture_impact:
    required: true
    purpose: Prevent cross-boundary work from becoming implicit.
    type: list
    item_schema:
      todo_id:
        type: string
        required: true
      bounded_context:
        type: string
        required: true
      layer:
        enum:
          - control_plane
          - data_plane
          - chassis
          - ops
          - runtime
          - policy
          - assurance
          - memory
          - graph
          - docs
          - external_system
        required: true
      owning_contract:
        type: string
        required: true
      prohibited:
        type: list
        required: true

  rollback:
    required: true
    purpose: Define typed compensation for code, data, external state, and local artifacts.
    fields:
      supported:
        type: boolean
        required: true
      trigger_conditions:
        type: list
        required: true
      code:
        type: rollback_strategy
        required: true
      data:
        type: rollback_strategy
        required: true
      external_state:
        type: rollback_strategy
        required: true
      local_state:
        type: rollback_strategy
        required: true
      verification:
        type: list
        required: true
      irreversible_operations:
        type: list
        required: true
    rollback_strategy:
      allowed_modes:
        - none
        - git_restore_scoped_paths
        - revert_commit
        - restore_snapshot
        - corrective_append_only_record
        - compensating_transaction
        - manual_recovery
        - custom

  complexity_and_uncertainty:
    required: true
    purpose: Quantify autonomy risk using uncertainty and blast radius.
    fields:
      complexity:
        enum: [low, medium, high, critical]
        required: true
      uncertainty:
        enum: [low, medium, high, critical]
        required: true
      blast_radius:
        enum: [low, medium, high, critical]
        required: true
      architectural_boundaries_crossed:
        type: integer
        minimum: 0
        required: true
      external_systems_touched:
        type: integer
        minimum: 0
        required: true
      migration_required:
        type: boolean
        required: true
      unknown_dependency_count:
        type: integer
        minimum: 0
        required: true

  inventory_and_classification:
    required: false
    activation_condition: plan_retires_migrates_or_replaces_existing_assets
    purpose: Classify current assets before mutation.
    fields:
      receipt_path:
        type: string
        required: true
      categories:
        type: list
        required: true
        canonical_values:
          - delete
          - migrate_then_delete
          - keep
          - replace
          - skip
      checksum_required:
        type: boolean
        default: true
      destructive_gate_required_for:
        type: list
        default:
          - migrate_then_delete

  gated_write_pipeline:
    required: false
    activation_condition: plan_contains_irreversible_or_external_writes
    fields:
      gates:
        type: ordered_list
        required: true
      dedupe_before_non_idempotent_write:
        type: boolean
        default: true
      bounded_write_count:
        type: integer_or_null
        required: false
      receipt_required:
        type: boolean
        default: true

  regeneration_extinguishment:
    required: false
    activation_condition: retirement_or_deprecation_plan
    purpose: Ensure deleted or retired artifacts are not recreated.
    fields:
      regenerators:
        type: list
        required: true
        item_schema:
          id:
            type: string
            required: true
          source:
            type: string
            required: true
          required_change:
            type: string
            required: true
          validation:
            type: string
            required: true

  execution_DAG:
    required: true
    purpose: Define dependency order and safe parallelism.
    fields:
      graph_type:
        const: directed_acyclic_graph
      nodes:
        type: list_string
        required: true
      edges:
        type: list
        required: true
      parallelism_rules:
        type: list
        required: false
      topological_sort_required:
        const: true
      cycle_policy:
        const: stop_and_repair_before_execution

  property_evidence_matrix:
    required: true
    purpose: Make final validation property-based rather than command-based.
    type: list
    item_schema:
      property_id:
        type: string
        required: true
      setup:
        type: string
        required: false
      check:
        type: string
        required: true
      expected_positive:
        type: string
        required: true
      expected_negative:
        type: string_or_null
        required: false
      covers:
        type: list_string
        required: true
      blocking:
        type: boolean
        default: true

  stress_and_disconfirm:
    required: true
    purpose: Define conditions that falsify assumptions or executable status.
    fields:
      disconfirming_cases:
        type: list
        required: true
      assumption_failure_conditions:
        type: list
        required: true
      blast_radius_notes:
        type: list
        required: false
      rollback_constraints:
        type: list
        required: false

  out_of_scope:
    required: true
    type: list
    purpose: Prevent silent expansion into adjacent work.

  follow_on_milestone:
    required: false
    purpose: Capture higher-order schema or platform evolution without folding it into current execution.
    fields:
      separate_plan_required:
        type: boolean
        default: true
      items:
        type: list
        required: true
        item_schema:
          priority:
            enum: [P0, P1, P2, P3]
            required: true
          change:
            type: string
            required: true
          why:
            type: string
            required: true

  convergence:
    required: true
    purpose: Define when the plan is executable and done.
    fields:
      current_state:
        enum:
          - draft
          - preflight_blocked
          - execution_ready
          - executing
          - validation_failed
          - converged
        required: true
      executable_when:
        type: list
        required: true
      complete_when:
        type: list
        required: true
      next_convergence_gate:
        type: string
        required: true
      broader_work_requires_separate_plan:
        type: boolean
        default: true

repo_agnostic_enum_registry:
