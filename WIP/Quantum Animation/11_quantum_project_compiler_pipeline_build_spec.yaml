# =====================================================================
# 32. MVP REQUIRED SUBSET
# =====================================================================
mvp_required_subset:
  source_must_support:
    - concept
    - target audience line
    - desired experience
    - runtime
    - 1_to_2_major_characters
    - setting
    - theme
    - visual style
    - ending intent
    - sound intent
    - quality non-negotiables
  compiler_must_emit:
