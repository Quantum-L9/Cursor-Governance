metadata:
  spec_id: quantum.animation.project_compiler_pipeline.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Project Compiler Pipeline
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: WORLD_GENESIS_AND_CANONICAL_REALITY_DEPENDENCY
    - file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: COMPILER_JUDGMENT_AND_REASONING_DEPENDENCY
    - file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: CREATOR_MODEL_AND_CREATIVE_SEMANTICS_DEPENDENCY
    - file: 04_quantum_audience_product_intelligence_build_spec.yaml
      relationship: AUDIENCE_AND_PRODUCT_MODEL_DEPENDENCY
    - file: 05_quantum_self_model_build_spec.yaml
      relationship: COMPILER_CAPABILITY_AWARENESS_DEPENDENCY
    - file: 06_quantum_production_model_build_spec.yaml
      relationship: PRODUCTION_INTENT_TARGET_DEPENDENCY
    - file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: COMPILER_OUTPUT_ACCEPTANCE_DEPENDENCY
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
      relationship: LINEAGE_AND_INVALIDATION_DEPENDENCY
    - file: 10_quantum_canonical_artifact_ir_build_spec.yaml
      relationship: CANONICAL_OBJECT_AND_IR_DEPENDENCY
  architectural_identity:
    concise: >
      The deterministic-and-judgmental compiler pipeline that converts a rich
      human-authored creative source into the canonical machine-consumable
      project package required to initialize Quantum Animation Studio.
    extended: >
      Quantum Project Compiler Pipeline transforms rich creative.yaml input into
      a versioned quantum.studio.yaml/project package containing CreatorModel,
      AudienceModel, ProductMarketModel inputs, character and setting seeds,
      WorldGenesisPlan, StoryContract, project-level quality semantics,
      production requirements, story/animatic compiler inputs, canonical asset
      intents, and all source/provenance bindings required by downstream
      autonomous systems. It uses polycognitive judgment to resolve ambiguity,
      derive implicit structure, detect contradiction, and make reversible
      creative interpretations while preserving creator-authored authority.
  owner_question:
    primary: "What film are we making, in machine-executable form?"
  secondary_questions:
    - "What did the creator explicitly say?"
    - "What is implied but not explicitly stated?"
    - "What must remain ambiguous?"
    - "Which creative choices are fixed across the project?"
    - "Which choices are local to this project?"
    - "Who are the characters before plot generation begins?"
    - "What world must exist before story generation begins?"
    - "What audience experience is intended?"
    - "What product promise is intended?"
    - "What is the ending/reveal strategy?"
    - "What should downstream agents never reinterpret?"
    - "Which unresolved creative gaps require compiler judgment?"
    - "Which uncertainties should remain explicit rather than be silently resolved?"
  human_interface:
    primary_input: creative.yaml
    derived_machine_output: quantum.studio.yaml
  hard_boundary: >
    The compiler interprets and structures creator input. It cannot override an
    explicit creator statement merely because another choice appears more
    conventional or commercially attractive.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Convert a creator's long-form creative conversation into sufficiently rich,
    explicit, internally consistent machine state that downstream autonomous
    systems can reason and execute without repeatedly guessing what the creator
    meant.
  leverage: >
    Front-load ambiguity resolution once so every downstream subsystem receives
    stable semantic constraints rather than independently reinterpreting prose.
  success_definition: >
    After compilation, the studio can answer the major creative, character,
    setting, audience, product, narrative, aesthetic, and quality questions
    required for autonomous story/animatic generation without returning to the
    creator for ordinary clarification.
  key_principle: >
    creative.yaml captures creator intent; quantum.studio.yaml is the canonical
    compiled project interpretation of that intent.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  PC-001:
    name: CREATIVE_SOURCE_IS_PRIMARY_HUMAN_AUTHORITY
    statement: >
      Explicit creative.yaml values override project-level compiler defaults and
      baseline creative profiles.
  PC-002:
    name: COMPILER_JUDGMENT_IS_EXPLICIT
    statement: >
      Inferred choices must be distinguishable from creator-authored choices.
  PC-003:
    name: DO_NOT_REQUIRE_CREATOR_TO_WRITE_TECHNICAL_SCHEMA
    statement: >
      The creator should express creative thought richly; the compiler converts
      it into technical downstream contracts.
  PC-004:
    name: CHARACTER_BEFORE_PLOT_SUPPORTED
    statement: >
      Characters and settings may be deeply developed before story generation.
  PC-005:
    name: WORLD_BEFORE_STORY_SUPPORTED
    statement: >
      Project world genesis can precede narrative event selection.
  PC-006:
    name: AMBIGUITY_IS_TYPED
    statement: >
      Some ambiguity should be resolved, some preserved, and some elevated as a
      creative constraint.
  PC-007:
    name: EXPLICIT_BEATS_INFERRED
    statement: >
      Direct creator statements take precedence over inferred compiler choices.
  PC-008:
    name: LOCKS_ARE_COMPILED
    statement: >
      Important creative non-negotiables become explicit CreativeLocks.
  PC-009:
    name: QUALITY_IS_INTENT_RELATIVE
    statement: >
      Project quality semantics derive from creator intent, not generic realism.
  PC-010:
    name: TARGET_AUDIENCE_IS_NOT_CREATIVE_AUTHORITY
    statement: >
      Audience/product inference influences design only within creator-approved
      semantic space.
  PC-011:
    name: NO_PROVIDER_CHOICES
    statement: >
      Project compiler output remains provider-independent.
  PC-012:
    name: RECOMPILE_IS_VERSIONED
    statement: >
      Changes to creative.yaml produce a new project compilation rather than
      mutating historical project semantics.
  PC-013:
    name: COMPILATION_IS_MULTI_PASS
    statement: >
      Complex project interpretation is produced through explicit compiler
      passes with validations between passes.
  PC-014:
    name: PROVENANCE_PER_FIELD_WHERE_HIGH_VALUE
    statement: >
      Important compiled values should identify whether they are authored,
      inferred, defaulted, or derived.
  PC-015:
    name: CONTRADICTIONS_ARE_NOT_SILENTLY_ERASED
    statement: >
      Conflicting creator statements are surfaced and deterministically resolved
      according to authority/recency rules or preserved as unresolved conflict.
  PC-016:
    name: DOWNSTREAM_AGENTS_CONSUME_COMPILED_STATE
    statement: >
      Downstream agents should not repeatedly parse the original conversation
      when a canonical compiled model exists.
  PC-017:
    name: REVERSIBLE_JUDGMENT_PREFERRED
    statement: >
      Where multiple plausible interpretations exist, choose reversible
      assumptions or preserve alternatives until later evidence resolves them.
  PC-018:
    name: PROJECT_PACKAGE_IS_SELF_DESCRIBING
    statement: >
      quantum.studio.yaml identifies all canonical source model refs required to
      initialize downstream systems.
  PC-019:
    name: CREATIVE_DENSITY_IS_A_FEATURE
    statement: >
      Rich input is desirable when it reduces downstream ambiguity.
  PC-020:
    name: STORY_NOT_REQUIRED_AT_INPUT
    statement: >
      creative.yaml may describe only concept, world, characters, themes, desired
      experience, and ending class; the system may develop the actual story.
  PC-021:
    name: UNKNOWN_IS_VALID
    statement: >
      Compiler must represent unknown or intentionally open values instead of
      fabricating certainty.
  PC-022:
    name: PROJECT_IDENTITY_SURVIVES_MEDIUM
    statement: >
      Where possible, creative semantics should remain medium-independent even
      though this compiler currently targets animation.
  PC-023:
    name: PRODUCTION_REQUIREMENTS_DERIVE_FROM_CREATIVE_NEEDS
    statement: >
      Technical production requirements are inferred from what the project
      demands, not vice versa.
  PC-024:
    name: COMPILER_OUTPUT_REQUIRES_QC
    statement: >
      A successful schema compile is not enough; project semantic coherence must
      pass Autonomous QC before lock.
# =====================================================================
# 3. OWNERSHIP BOUNDARIES
# =====================================================================
ownership_boundaries:
  this_spec_owns:
    - CreativeProjectSource schema
    - ProjectCompilation
    - CompilerPass
    - CompilerPassResult
    - FieldDerivation
    - AmbiguityRecord
    - CreativeConflict
    - ProjectCompilationReport
    - quantum.studio.yaml aggregate package
    - project compilation lifecycle
    - source normalization
    - compiler pass ordering
    - project compilation QC handoff
    - creative.yaml-to-project provenance
  delegated_outputs:
    CreatorModel:
      owner: 03
    AudienceModel:
      owner: 04
    ProductMarketModel:
      owner: 04
    WorldGenesisPlan:
      owner_semantics: 01
      compiler_role: seed_and_initialize
    StoryContract:
      owner_semantics: 03
    ProductionIntent:
      owner: 06
      compiler_role: provide_source_requirements
    asset_identity_intents:
      future_owner: 13
    story_animatic_input:
      future_owner: 12
  this_spec_does_not_own:
    - World canonical state after initialization
    - story event selection
    - final character/world reality
    - production strategy
    - provider selection
    - final QC acceptance
    - runtime execution
