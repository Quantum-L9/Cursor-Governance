    - AudienceModel
    - ProductMarketModel
    - CharacterSeeds
    - WorldGenesisPlan
    - StoryContract
    - StoryCompilerInputPackage
    - ProductionRequirementSeedPackage
    - AssetIdentityIntentPackage
    - quantum.studio.yaml
  explicitly_deferred:
    - full season bible generation
    - hundreds_of_character bulk compiler
    - multi-medium project package
    - multilingual source compilation
# =====================================================================
# 33. TESTS
# =====================================================================
tests:
  unit:
    - YAML_parse
    - source_normalization
    - field_derivation
    - ambiguity_classification
    - conflict_resolution
    - baseline_override
  property:
    - explicit_creator_value_beats_default
    - explicit_creator_lock_never_inferred_away
    - unknown_remains_unknown_if_unsafe_to_infer
    - provider_choice_never_enters_compiled_creative_semantics
    - compiler_output_versions_immutable
    - same_source_same_policy_same_compilation_digest_or_declared_nondeterminism
  negative:
    - retro_style_normalized_to_photorealism_rejected
    - target_market_overrides_creator_lock_rejected
    - missing_critical_source_silently_hallucinated_rejected
    - downstream_system_reparses_chat_instead_of_compiled_model_rejected
  integration:
    - creative_source_to_CreatorModel
    - character_source_to_WorldGenesisPlan
    - target_to_AudienceModel
    - project_quality_to_ProductionRequirementSeed
    - project_compile_to_provenance_graph
    - ProjectCompilation_to_story_compiler
  end_to_end:
    creative_chat_export:
      result:
        - valid creative.yaml
        - valid quantum.studio.yaml
        - project QC PASS
        - story compiler can execute without human clarification
# =====================================================================
# 34. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: PC-G01
    check: creative.yaml is primary human-authored project source
  - id: PC-G02
    check: quantum.studio.yaml is derived machine package
  - id: PC-G03
    check: explicit vs inferred values distinguishable
  - id: PC-G04
    check: character development can precede plot
  - id: PC-G05
    check: world development can precede plot
  - id: PC-G06
    check: creator baseline supports project specialization
  - id: PC-G07
    check: project style cannot be normalized toward generic quality
  - id: PC-G08
    check: Audience/Product models do not override CreatorModel
  - id: PC-G09
    check: ambiguity and contradiction are represented explicitly
  - id: PC-G10
    check: output provider independent
  - id: PC-G11
    check: ProjectCompilation receives QC
  - id: PC-G12
    check: provenance complete
  - id: PC-G13
    check: recompilation supports surgical downstream invalidation
  - id: PC-G14
    check: StoryCompilerInput sufficient for autonomous story generation
# =====================================================================
# 35. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  input:
    - rich creative.yaml schema
    - characters
    - world
    - setting
    - experience
    - audience target
    - ending
    - visual
    - sound
    - quality
  compiler:
    - explicit multi-pass architecture
    - judgment semantics
    - ambiguity handling
    - conflict handling
    - character deepening
    - world genesis preparation
    - audience/product delegation
    - quality semantics
    - story compiler package
  output:
    - ProjectCompilation
    - quantum.studio.yaml
    - complete refs
    - project QC certificate
    - provenance
  MVP:
    - one source file sufficient to initialize entire 60-second production
  release:
    requirement: PC-G01_through_PC-G14_pass
# =====================================================================
# 36. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    The human authors creative intent; the compiler authors structured interpretation.
  law_02: >
    creative.yaml is rich because ambiguity is expensive downstream.
  law_03: >
    quantum.studio.yaml is compiled, not handwritten.
  law_04: >
    Explicit creator intent outranks compiler inference.
  law_05: >
    Compiler inference must remain traceable.
  law_06: >
    Characters may exist deeply before plot exists.
  law_07: >
    Worlds may exist deeply before story exists.
  law_08: >
    Story may emerge from persistent character/world tensions rather than being
    imposed before them.
  law_09: >
    Deliberate ambiguity is preserved; accidental ambiguity is reduced.
  law_10: >
    Project quality is defined by fidelity to intent.
  law_11: >
    Product intelligence may advise but cannot rewrite creator locks.
  law_12: >
    Production requirements are downstream consequences of creative requirements.
  law_13: >
    Compiler output is provider independent.
  law_14: >
    Recompilation creates new immutable project semantics and surgical
    invalidation rather than global destructive rebuild.
  law_15: >
    Downstream systems consume the compiled project rather than independently
    reinterpreting the creator conversation.

