        recurring_locations:
        reusable_environment_candidates:
# =====================================================================
# 7. ENDING INTENT
# =====================================================================
ending_intent:
  CreativeEndingIntent:
    fields:
      ending_class:
        enum:
          - OPEN
          - CLOSED
          - TWIST
          - REFRAME
          - TRAGIC
          - TRIUMPHANT
          - BITTERSWEET
          - EXISTENTIAL
          - MIND_FUCK
          - LOOP
          - REVELATION
          - TRANSFORMATION
          - OTHER
      desired_effect:
      truth_revealed:
        nullable: true
      audience_should_realize:
        nullable: true
      protagonist_should_realize:
        nullable: true
      emotional_aftertaste:
      rewatch_requirement:
      fairness_requirement:
      forbidden_cheats:
      specificity:
        enum:
          - HIGH
          - MEDIUM
          - LOW
          - OPEN
# =====================================================================
# 8. SOURCE NORMALIZATION
# =====================================================================
source_normalization:
  CreativeSourceNormalizer:
    responsibilities:
      - parse YAML
      - canonicalize scalar/list forms
      - assign stable source-path IDs
      - normalize terminology
      - preserve raw source
      - identify missing sections
      - identify contradictions
      - classify authored vs implied values
  output:
    NormalizedCreativeSource
  lossless:
    raw_text_retained: true
# =====================================================================
# 9. FIELD DERIVATION
# =====================================================================
field_derivation:
  FieldDerivation:
    fields:
      target_path:
      value:
      derivation_type:
        enum:
          - EXPLICIT
          - NORMALIZED
          - INFERRED
          - DEFAULTED
          - DERIVED
          - COMPUTED
          - UNRESOLVED
      source_refs:
      reasoning_trace_ref:
        nullable: true
      confidence:
      reversible:
      alternatives:
      notes:
  provenance:
    required_for_high_authority_fields: true
# =====================================================================
# 10. AMBIGUITY MODEL
# =====================================================================
ambiguity:
  AmbiguityRecord:
    fields:
      ambiguity_id:
      source_path:
      description:
      type:
        enum:
          - MISSING
          - MULTIPLE_VALID_INTERPRETATIONS
          - INTENTIONAL_AMBIGUITY
          - CONTRADICTORY
          - UNDERSPECIFIED
          - FUTURE_DECISION
      materiality:
        enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      resolution_policy:
        enum:
          - INFER
          - PRESERVE
          - DEFAULT
          - DEFER
          - FAIL_COMPILE
      selected_resolution:
        nullable: true
      alternative_resolutions:
      confidence:
  compiler_goal: >
    Minimize downstream accidental ambiguity while preserving deliberate ambiguity.
# =====================================================================
# 11. CREATIVE CONFLICT MODEL
# =====================================================================
creative_conflict:
  CreativeConflict:
    fields:
      conflict_id:
      source_refs:
      values_in_conflict:
      semantic_dimension:
      severity:
      resolution_authority:
        enum:
          - EXPLICIT_PRIORITY
          - LATEST_CREATOR_STATEMENT
          - YAML_OVERRIDE
          - BASELINE_PROFILE
          - COMPILER_JUDGMENT
          - UNRESOLVED
      resolution:
        nullable: true
      rationale_ref:
        nullable: true
# =====================================================================
# 12. COMPILER PASSES
# =====================================================================
compiler_pipeline:
  compiler_name: QuantumProjectCompiler
  passes:
    P01_ParseAndNormalize:
      input:
        - CreativeProjectSource
      output:
        - NormalizedCreativeSource
    P02_IntentExtraction:
      output:
        - explicit creative intents
        - priorities
        - non-negotiables
        - anti-targets
    P03_CharacterDeepening:
      output:
        - CharacterSeed set
      behavior:
        - expand psychology
        - expand identity
        - expand contradictions
        - identify relationship seeds
        - preserve unknowns
    P04_SettingAndWorldGenesisSeed:
      output:
        - WorldGenesisSeed
    P05_ThemeAndNarrativeContract:
      output:
        - StoryContract
        - EndingIntent
        - RevealIntent
    P06_CreatorModelCompilation:
      output:
        - CreatorModel
    P07_AudienceProductCompilation:
      delegates_to:
        - 04
      output:
        - AudienceModel
        - ProductMarketModel
    P08_WorldGenesisPlanCompilation:
      delegates_semantics_to:
        - 01
      output:
        - WorldGenesisPlan
    P09_QualitySemanticsCompilation:
      output:
        - QualitySemantics
        - CreativeLocks
    P10_StoryCompilerInputCompilation:
      output:
        - StoryCompilerInputPackage
    P11_ProductionRequirementSeedCompilation:
      output:
        - ProductionRequirementSeedPackage
    P12_AssetIdentityIntentCompilation:
      output:
        - AssetIdentityIntentPackage
    P13_CrossModelConsistency:
      output:
        - ProjectConsistencyReport
    P14_ProjectQC:
      delegates_to:
        - 07
    P15_ProjectPackageEmission:
      output:
        - quantum.studio.yaml
        - ProjectCompilationReport
        - provenance emissions
# =====================================================================
# 13. COMPILER PASS CONTRACT
# =====================================================================
compiler_pass_contract:
  CompilerPass:
    fields:
      pass_id:
      version:
      input_schema_refs:
      output_schema_refs:
      judgment_allowed:
      deterministic_components:
      cognitive_operators:
      validation_rules:
      failure_policy:
      provenance_required:
  CompilerPassResult:
    fields:
      pass_id:
      input_refs:
      output_refs:
      field_derivations:
      ambiguity_records:
      conflicts:
      warnings:
      errors:
      cognitive_trace_refs:
      status:
        enum:
          - PASS
          - PASS_WITH_WARNINGS
          - BLOCKED
          - FAIL
# =====================================================================
# 14. JUDGMENT SEMANTICS
# =====================================================================
judgment:
  principle: >
    An agent is a compiler pass with judgment when deterministic transformation
    alone cannot choose among semantically valid alternatives.
  judgment_allowed_for:
    - resolving underspecified style detail
    - enriching character psychology
    - inferring relationship dynamics
    - deciding which unknowns should remain open
    - synthesizing consistent project-level creative rules
    - interpreting desired emotional experience
    - ranking plausible theme expressions
  judgment_forbidden_for:
    - contradicting explicit creator lock
    - rewriting explicit ending intent
    - changing target market without authority
    - choosing provider/tool
    - changing explicit character identity
  required_output:
    - rationale
    - confidence
    - reversibility
    - provenance
# =====================================================================
# 15. CHARACTER DEVELOPMENT BEFORE STORY
# =====================================================================
character_development:
  supported: true
  flow: |
    creative.yaml character notes
         ↓
    CharacterDeepening pass
         ↓
    CharacterSeed
         ↓
    initial psychological model
         ↓
    relationship seeds
         ↓
    unresolved conflicts
         ↓
    character affordances
         ↓
    World genesis
         ↓
    story discovery
  purpose: >
    Story generation should emerge from developed beings rather than requiring
    characters to be retrofitted to a predetermined plot.
  hard_rule: >
    Plot generation may challenge characters but should not casually rewrite
    their compiled identity to satisfy plot convenience.
# =====================================================================
# 16. WORLD DEVELOPMENT BEFORE STORY
# =====================================================================
world_development:
  supported: true
  flow: |
    setting/world creative source
          ↓
    WorldGenesisSeed
          ↓
    WorldGenesisPlan
          ↓
    WorldEntities
    WorldRules
    Institutions
    Locations
    Histories
    Relationships
          ↓
    initial WorldSnapshot
          ↓
    Story discovery
  benefits:
    - causal story emergence
    - reusable canon
    - recurring locations
    - persistent conflict substrate
    - NarrativeOpportunity derivation
# =====================================================================
# 17. PROJECT COMPILATION OUTPUT
# =====================================================================
project_compilation:
  ProjectCompilation:
    fields:
      compilation_id:
      project_id:
      source_ref:
      source_digest:
      compiler_version:
      created_at:
      creator_model_ref:
      audience_model_ref:
      product_market_model_ref:
      World_genesis_plan_ref:
      StoryContract_ref:
      QualitySemantics_ref:
      CreativeLock_refs:
      story_compiler_input_ref:
      production_requirement_seed_ref:
      asset_identity_intent_ref:
      ambiguities:
      conflicts:
      warnings:
      project_QC_certificate_ref:
        nullable: true
      provenance_ref:
      digest:
# =====================================================================
# 18. QUANTUM.STUDIO.YAML
# =====================================================================
quantum_studio_yaml:
  purpose: >
    Human-readable materialization of the canonical compiled project package.
  rule: >
    It is not the only storage representation and does not duplicate full
    payloads where canonical refs are sufficient.
  top_level:
    metadata:
      project_id:
      compilation_id:
      source_ref:
      compiler_version:
      created_at:
    creative:
      creator_model_ref:
      StoryContract_ref:
      quality_semantics_ref:
      creative_lock_refs:
    audience_product:
      audience_model_ref:
      product_market_model_ref:
    world:
      genesis_plan_ref:
      initial_world_ref:
        nullable: true
    story:
      compiler_input_ref:
    assets:
      identity_intent_ref:
    production:
      requirement_seed_ref:
    autonomy:
      allowed_interpretation:
      review_policy:
    provenance:
      project_provenance_ref:
    compilation:
      unresolved_ambiguities:
      warnings:
      QC_certificate_ref:
# =====================================================================
# 19. STORY COMPILER INPUT PACKAGE
# =====================================================================
story_compiler_input:
  StoryCompilerInputPackage:
    object_class: SPECIFICATION
    fields:
      CreatorModel_ref:
      StoryContract_ref:
      AudienceModel_ref:
      ProductMarketModel_ref:
      initial_World_ref:
        nullable: true
      character_refs:
      setting_refs:
      EndingIntent_ref:
      RevealIntent_ref:
      desired_runtime:
      desired_story_density:
      required_experience_trajectory:
      prohibited_story_modes:
      creator_locks:
      open_questions:
      quality_tier_hint:
# =====================================================================
# 20. PRODUCTION REQUIREMENT SEED PACKAGE
# =====================================================================
production_requirement_seed:
  ProductionRequirementSeedPackage:
    fields:
      visual_requirements:
      animation_requirements:
      character_identity_requirements:
      acoustic_requirements:
      performance_requirements:
      cinematic_requirements:
      editorial_requirements:
      accessibility_requirements:
      intentional_artifacts:
      anti_targets:
      reuse_requirements:
  owner_after_handoff:
    ProductionIntentCompiler_in_06
# =====================================================================
# 21. ASSET IDENTITY INTENT
# =====================================================================
asset_identity_intent:
  AssetIdentityIntentPackage:
    fields:
      persistent_character_candidates:
      recurring_location_candidates:
      recurring_prop_candidates:
      voice_identity_candidates:
      canonical_visual_identity_requirements:
      long_term_reuse_priority:
      variant_requirements:
      asset_lock_priorities:
  future_consumer:
    13_quantum_asset_identity_library_build_spec.yaml
# =====================================================================
# 22. CREATIVE BASELINE PROFILE
# =====================================================================
creator_baseline:
  principle: >
    Creator Model begins from a strong established baseline profile and is
    specialized by project source rather than authored from scratch each time.
  behavior:
    baseline_profile:
      persistent: true
    project_source:
      may_specialize: true
    project_source_override:
      explicit_creator_value_wins: true
  examples:
    project_A:
      maximum_cinematic_space_AI_beings:
        modifies:
          - spectacle
          - visual_scale
          - geometry
          - abstraction
    project_B:
      retro_90s_animation:
        modifies:
          - frame_cadence
          - realism
          - texture
          - linework
  not_allowed:
    - baseline_forcing_photorealism
    - baseline_overriding_explicit_project_style
# =====================================================================
# 23. PROJECT CONSISTENCY REPORT
# =====================================================================
consistency_report:
  ProjectConsistencyReport:
    fields:
      report_id:
      project_id:
      checks:
        - creator_vs_story
        - creator_vs_visual
        - character_vs_world
        - ending_vs_theme
        - audience_vs_experience
        - product_vs_creator
        - runtime_vs_story_density
        - quality_vs_style
        - asset_reuse_vs_character_identity
      contradictions:
      risks:
      unresolved_ambiguities:
      recommended_compiler_repairs:
      pass:
# =====================================================================
# 24. PROJECT QC
# =====================================================================
project_QC:
  required: true
  target:
    ProjectCompilation
  critics:
    - creator_fidelity
    - character
    - narrative
    - audience
    - product
    - consistency
  hard_checks:
    - all required refs resolve
    - no unresolved critical contradiction
    - CreativeLocks preserved
    - no provider choices embedded
    - intended ambiguity not accidentally resolved
  pass_effect:
    project_package_lock_eligible: true
# =====================================================================
# 25. PROJECT PACKAGE LOCK
# =====================================================================
project_lock:
  artifact:
    name: project.compile.lock
  locks:
    - source_ref
    - ProjectCompilation
    - CreatorModel
    - StoryContract
    - initial audience/product models
    - World genesis input
    - quality semantics
  does_not_lock:
    - future story events
    - future ProductionModel
    - final visual assets
  reopening:
    requires:
      - source revision
      - new compilation
      - provenance impact analysis
# =====================================================================
# 26. RECOMPILATION
# =====================================================================
recompilation:
  trigger:
    - creative.yaml revised
    - creator feedback explicitly modifies project intent
    - compiler policy version materially changes
  algorithm:
    - compile new source revision
    - compare ProjectCompilation
    - identify material semantic changes
    - emit provenance supersession
    - invoke spec 09 impact analysis
    - preserve unaffected downstream state
    - recompile affected branches only
  example:
    change:
      Aria_eye_color_only
    expected:
      invalidate:
        - relevant visual asset identity
        - rendered shots with visible eyes
      preserve:
        - unrelated narrative decisions
        - audio
        - World causal history if semantics unaffected
# =====================================================================
# 27. COMPILER FAILURE MODES
# =====================================================================
failure_modes:
  INVALID_YAML:
    behavior: FAIL
  REQUIRED_CREATIVE_CORE_MISSING:
    behavior:
      - infer_if_safe
      - otherwise BLOCKED
  CRITICAL_CREATOR_CONTRADICTION:
    behavior:
      - use explicit authority/recency rules
      - if unresolved, FAIL_COMPILE
  CHARACTER_INCOHERENT:
    behavior:
      - run character cognition
      - preserve intentional contradiction
      - reject accidental contradiction
  TARGET_VS_CREATOR_CONFLICT:
    behavior:
      - creator authority wins
      - annotate product risk
  STYLE_NORMALIZATION:
    behavior:
      - fail creator fidelity
  COMPILER_LOW_CONFIDENCE:
    behavior:
      - deepen cognition
      - preserve alternatives
      - do not fabricate certainty
# =====================================================================
# 28. PROVENANCE
# =====================================================================
provenance:
  required:
    - source_to_NormalizedCreativeSource
    - source_to_CreatorModel
    - source_to_CharacterSeed
    - source_to_WorldGenesisPlan
    - source_to_StoryContract
    - source_to_AudienceModel
    - source_to_ProductMarketModel
    - source_to_ProductionRequirementSeed
    - all compiler judgments
  emits_to:
    09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 29. API BOUNDARIES
# =====================================================================
API_boundaries:
