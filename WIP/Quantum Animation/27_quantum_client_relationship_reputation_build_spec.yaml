    Quantum_must_prove:
      - identity
      - quality
      - reliability
      - fairness
      - execution
  later_deal:
    Quantum_may_reduce:
      - company_explanation
      - AI_disclosure_repetition_if_policy_allows
      - process_explanation
      - redundant_diligence
      - transaction_navigation
  may_not_reduce:
    - contract_clarity
    - security
    - payment_controls
    - creator_release
    - material_disclosures
# =====================================================================
# 50. CLIENT COMMUNICATION POLICY
# =====================================================================
communication:
  ClientCommunicationPolicy:
    fields:
      policy_id:
      update_frequency:
      material_issue_notification_policy:
      nonmaterial_internal_failure_policy:
      milestone_notification_policy:
      delivery_risk_threshold:
      bad_news_timing:
      communication_channel_preferences:
      Avatar_usage:
      escalation_policy:
      version:
  default:
    communicate_every_retry: false
    communicate_material_schedule_risk: true
    communicate_material_scope_risk: true
    communicate_certified_milestones: true
# =====================================================================
# 51. CANDOR EVENT
# =====================================================================
candor_event:
  MaterialClientDisclosure:
    fields:
      disclosure_id:
      client_account_ref:
      project_ref:
      issue_ref:
      fact_statement:
      impact:
      mitigation:
      uncertainty:
      disclosed_at:
      source_evidence_refs:
      Avatar_delivery_ref:
        nullable: true
  principle: >
    Material bad news should reach the client before it becomes a surprise where
    reasonably possible.
# =====================================================================
# 52. CLIENT SUCCESS DEFINITION
# =====================================================================
client_success:
  success:
    - project_is_exceptional
    - product_meets_agreed_scope
    - delivered_on_or_before_commitment
    - budget_is_predictable
    - legitimate_problems_are_fixed
    - communication_is_truthful
    - transaction_is_easy
    - client_has_strong_upside
    - client_wants_another_project
  not_required:
    - constant_human_contact
    - meetings
    - negotiation
    - personal_founder_relationship
# =====================================================================
# 53. LONG-TERM TARGET SIGNAL
# =====================================================================
target_signal:
  progression:
    stage_0:
      market_thought: "Who is Quantum?"
    stage_1:
      market_thought: "I've heard their stuff is incredible."
    stage_2:
      market_thought: "It's Quantum. Watch it."
    stage_3:
      market_thought: "Can we get them?"
  architectural_goal: >
    Reputation becomes a precomputed trust prior before the buyer experiences
    the next project.
# =====================================================================
# 54. REPUTATION AND PRICE
# =====================================================================
pricing_boundary:
  ReputationPriceSignal:
    fields:
      ReputationState_ref:
      scarcity_evidence:
      repeat_demand:
      conversion_history:
      delivery_reliability:
      quality_consistency:
      price_power_projection:
      confidence:
  may_inform:
    - spec_23
    - spec_29
  may_not:
    - directly_change_active_offer
# =====================================================================
# 55. REPUTATION AND GLOBAL MARKETS
# =====================================================================
global_reputation:
  dimensions:
    - market
    - language
    - culture
    - buyer_category
    - format
  principle: >
    Strong U.S. reputation can improve initial credibility elsewhere but does not
    prove native product-market understanding in another culture.
  market_entry:
    future_owner:
      spec: 29
# =====================================================================
# 56. SOCIAL PROOF
# =====================================================================
social_proof:
  VerifiedSocialProof:
    fields:
      evidence_id:
      client_ref:
      proof_type:
        enum:
          - CLIENT_LOGO
          - VERIFIED_QUOTE
          - CASE_STUDY
          - REPEAT_PURCHASE
          - REFERRAL
          - DELIVERY_STATISTIC
          - AWARD
          - PUBLIC_PERFORMANCE
      permission_ref:
      exact_claim:
      evidence_ref:
      expiration_or_review_at:
        nullable: true
  public_use:
    only_if_authorized: true
# =====================================================================
# 57. CLIENT CONFIDENTIALITY
# =====================================================================
confidentiality:
  rules:
    - one_client_history_not_shared_with_another
    - project_financial_terms_private_by_default
    - internal_feedback_private_by_default
    - public_social_proof_permission_required
    - aggregate_statistics_require_privacy_policy
  Avatar:
    may_not_name_other_clients_without_authority: true
# =====================================================================
# 58. RELATIONSHIP EVENTS
# =====================================================================
events:
  family: CLIENT_RELATIONSHIP
  event_types:
    CLIENT.ACCOUNT_CREATED:
      fields:
        - client_account_ref
    CLIENT.OFFER_EXECUTED:
      fields:
        - client_account_ref
        - agreement_ref
    CLIENT.PAYMENT_CLEARED:
      fields:
        - client_account_ref
        - payment_ref
    CLIENT.PROJECT_STARTED:
      fields:
        - client_account_ref
        - project_ref
    CLIENT.MILESTONE_REACHED:
      fields:
        - client_account_ref
        - project_ref
        - milestone_ref
    CLIENT.ISSUE_OPENED:
      fields:
        - issue_ref
    CLIENT.ISSUE_RESOLVED:
      fields:
        - resolution_ref
    CLIENT.CREATOR_RELEASE_APPROVED:
      fields:
        - project_ref
        - release_ref
    CLIENT.PROJECT_DELIVERED:
      fields:
        - client_account_ref
        - project_ref
        - promised_at
        - delivered_at
    CLIENT.FEEDBACK_RECEIVED:
      fields:
        - feedback_ref
    CLIENT.REPEAT_PURCHASE:
      fields:
        - repeat_purchase_evidence_ref
    CLIENT.REFERRAL_VERIFIED:
      fields:
        - referral_evidence_ref
    CLIENT.RELATIONSHIP_MODEL_UPDATED:
      fields:
        - relationship_model_ref
    REPUTATION.STATE_UPDATED:
      fields:
        - ReputationState_ref
    REPUTATION.INCIDENT_CREATED:
      fields:
        - incident_ref
# =====================================================================
# 59. SIGNALS
# =====================================================================
signals:
  - CLIENT.REPEAT_PROBABILITY_HIGH
  - CLIENT.RELATIONSHIP_VALUE_HIGH
  - CLIENT.TRUST_IMPROVING
  - CLIENT.TRUST_DECLINING
  - CLIENT.UNRESOLVED_ISSUE
  - CLIENT.PAYMENT_RISK
  - CLIENT.DEPENDENCY_RISK
  - CLIENT.REFERRAL_SIGNAL
  - REPUTATION.COMMITMENT_CREDIBILITY_IMPROVING
  - REPUTATION.COMMITMENT_CREDIBILITY_DAMAGED
  - REPUTATION.DELIVERY_INCIDENT
  - REPUTATION.QUALITY_INCIDENT
  - REPUTATION.CANDOR_INCIDENT
  - REPUTATION.NEW_SEGMENT_PROVEN
  - REPUTATION.PRICE_POWER_INCREASED
# =====================================================================
# 60. UPDATE PIPELINE
# =====================================================================
update_pipeline:
  ClientRelationshipReducer:
    consumes:
      - COMMERCIAL.*
      - LEGAL.*
      - PAYMENT.*
      - PRODUCTION.*
      - QC.*
      - CREATOR_RELEASE.*
      - PORTAL.*
      - CLIENT.*
    produces:
      - ClientRelationshipModel
      - ClientTrustState
      - ClientRelationshipHealth
      - RelationshipMemoryProjection
  ReputationReducer:
    consumes:
      - ReputationEvidence
      - PromiseOutcome
      - ClientRelationshipModel
      - ReputationIncident
    produces:
      - QuantumReputationState
      - CommitmentCredibility
      - ReputationTrajectory
# =====================================================================
# 61. EVENT ATTRIBUTION
# =====================================================================
attribution:
  DeliveryAttribution:
    fields:
      delivery_ref:
      original_promised_date:
      current_valid_promised_date:
      actual_delivery_date:
      days_variance:
      client_dependency_delay:
      Quantum_delay:
      mutual_change:
      external_delay:
      contractual_adjustment_refs:
      reputation_attributable_variance:
  rule: >
    Reputation models cannot penalize Quantum for time formally shifted through
    valid client-caused or mutually agreed schedule changes.
# =====================================================================
# 62. EARLY DELIVERY
# =====================================================================
early_delivery:
  EarlyDeliveryEvidence:
    fields:
      project_ref:
      committed_date:
      internal_target_date:
      creator_release_date:
      delivered_date:
      days_early:
      quality_certificate_refs:
      creator_release_ref:
      no_scope_reduction:
      no_quality_reduction:
      client_dependency_complete:
      valid: true
  reputation_effect:
    positive_if_valid: true
# =====================================================================
# 63. EXPECTATION EXCEEDANCE
# =====================================================================
expectation_exceedance:
  ExpectationExceedanceEvidence:
    fields:
      evidence_id:
      project_ref:
      dimension:
        enum:
          - QUALITY
          - DELIVERY
          - VISUAL_IMPACT
          - CREATIVITY
          - COMMERCIAL_SIMPLICITY
          - PROBLEM_RESOLUTION
          - SURPRISE_VALUE
          - CLIENT_EXPERIENCE
      contractual_expectation:
      observed_outcome:
      evidence_refs:
      nonmanipulative:
      confidence:
  rule: >
    Exceeding expectations must not depend on intentionally understating
    contractual performance.
# =====================================================================
# 64. CLIENT DELIGHT WITHOUT MANIPULATION
# =====================================================================
delight:
  examples:
    - early_certified_sneak_peek
    - exceptional_visual_reveal
    - early_delivery
    - useful_merchandise_concepts
    - clean_portal
    - proactive_problem_fix
    - unexpected_localization_quality
  forbidden:
    - fake_progress
    - fake_surprise
    - withholding_expected_feature_then_revealing_it_as_bonus
# =====================================================================
# 65. REPUTATION EXPOSURE POLICY
# =====================================================================
exposure:
  InternalReputationState:
    richer_than_public_claims: true
  PublicReputationProjection:
    fields:
      permitted_claim_refs:
      verified_statistics:
      authorized_client_evidence:
      prohibited_confidential_evidence:
  principle: >
    Quantum can know it is excellent before it has the right to publish every
    piece of evidence supporting that belief.
# =====================================================================
# 66. CLIENT-SPECIFIC TRUST VS GLOBAL REPUTATION
# =====================================================================
scope_distinction:
  ClientTrustState:
    question: >
      What has this specific client learned to trust Quantum to do?
  QuantumReputationState:
    question: >
      What has Quantum demonstrated across clients and projects?
  rule: >
    One client relationship does not directly define global market reputation.
# =====================================================================
# 67. RELATIONSHIP LEARNING
# =====================================================================
learning:
  learnable:
    - repeat_purchase_probability
    - client_preference_patterns
    - issue_resolution_effectiveness
    - communication_frequency_effect
    - portal_engagement_patterns
    - transaction_friction
    - relationship_LTV
    - referral_probability
  cannot_self_modify:
    - client_contract
    - creator_quality_floor
    - legal_terms
    - payment_obligations
    - ReputationEvidence_history
  learning_policy:
    future:
      spec: 29
# =====================================================================
# 68. MEMORY GOVERNANCE
# =====================================================================
memory_governance:
  retained:
    - professional_relationship_history
    - project_history
    - issue_history
    - preferences
    - commercial_history
  minimized:
    - personally_sensitive_data
    - unrelated_behavior
  supersession:
    preference_update:
      old_value_retained_as_history: true
      new_value_current: true
  deletion:
    subject_to:
      - legal_retention
      - business_record_policy
      - privacy_policy
# =====================================================================
# 69. SECURITY
# =====================================================================
security:
  relationship_data:
    classification: CONFIDENTIAL_BUSINESS_DATA
  access:
    least_privilege: true
  cross_client:
    isolation: required
  Avatar:
    receives_only_context_required_for_interaction: true
  acquisition_system:
    receives_only_policy_authorized_features: true
# =====================================================================
# 70. PRIVACY
# =====================================================================
privacy:
  allowed:
    - professional_role
    - client_organization
    - prior_project_history
    - explicit_preferences
    - business_feedback
    - payment_reliability
    - transaction_history
  discouraged_or_prohibited_without_specific_reason:
    - family_data
    - children
    - personal_relationships
    - unrelated_social_media
    - home_tracking
    - private_travel
    - political_beliefs
    - health_data
  principle: >
    Quantum should know the relationship extremely well without knowing the
    person's private life.
# =====================================================================
# 71. FAILURE MODES
# =====================================================================
failure_modes:
  DUPLICATE_CLIENT_ACCOUNT:
    behavior:
      - identity_resolution
      - merge_only_with_authoritative_evidence
  WRONG_CLIENT_ATTRIBUTION:
    behavior:
      - block_relationship_update
      - repair_provenance
  STALE_PREFERENCE:
    behavior:
      - lower_confidence
      - confirm_through_future_explicit_behavior
  FALSE_POSITIVE_REFERRAL:
    behavior:
      - do_not_count_until_verified
  DELIVERY_EVENT_MISSING:
    behavior:
      - reputation_dimension_unknown
      - no_guess
  CLIENT_FEEDBACK_CONFLICTS_WITH_OBJECTIVE_STATE:
    behavior:
      - retain_both
      - do_not_overwrite_objective_truth
      - treat_feedback_as_perspective
  REPUTATION_MODEL_CORRUPTION:
    behavior:
      - rebuild_from_events_and_evidence
  NEGATIVE_INCIDENT:
    behavior:
      - preserve
      - repair
      - recover_through_future_evidence
# =====================================================================
# 72. CONCURRENCY
# =====================================================================
concurrency:
  multiple_active_projects_same_client:
    supported: true
  relationship_events:
    append_only: true
  model_reduction:
    deterministic_where_possible: true
  simultaneous_feedback:
    retain_separate_observations: true
  ReputationState:
    update:
      atomic_revision: preferred
# =====================================================================
# 73. IDEMPOTENCY
# =====================================================================
idempotency:
  event_ingestion:
    event_id_deduplication: true
  delivery_evidence:
    same_delivery_event:
      count_once: true
  repeat_purchase:
    same_new_agreement:
      count_once: true
  referral:
    same_referral_event:
      count_once: true
  reputation_update:
    same_evidence_cutoff:
      deterministic_digest_expected_where_model_fixed: true
# =====================================================================
# 74. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - ClientAccount_to_legal_entity
    - ClientProjectRelationship_to_agreement
    - PromiseRecord_to_source_authority
    - PromiseOutcome_to_observed_event
    - DeliveryReliability_to_delivery_events
    - QualityConsistency_to_creator_release_and_QC
    - FairDealing_to_commercial_events
    - Candor_to_material_disclosures
    - ProblemOwnership_to_issue_resolution
    - RepeatPurchaseEvidence_to_new_agreement
    - ReferralEvidence_to_verified_referral
    - ClientTrustState_to_evidence
    - ReputationDimension_to_ReputationEvidence
    - ReputationState_to_all_component_models
    - ReputationIncident_to_underlying_failure
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 75. OBSERVABILITY
# =====================================================================
observability:
  relationship:
    - repeat_purchase_rate
    - repeat_purchase_interval
    - average_contract_value_by_repeat_number
    - client_retention
    - client_relationship_health_distribution
    - unresolved_issue_rate
  reliability:
    - on_time_rate
    - early_delivery_rate
    - mean_days_early
    - late_rate
    - attributable_delay_rate
  quality:
    - creator_release_exceptional_rate
    - client_visible_defect_rate
    - repeated_defect_rate
  fairness:
    - hidden_fee_incidents
    - justified_change_order_rate
    - free_deficiency_repair_rate
  candor:
    - proactive_material_disclosure_rate
    - inaccurate_status_incident_rate
  problem_ownership:
    - mean_time_to_acknowledge
    - mean_time_to_repair
    - recurrence_rate
  reputation:
    - CommitmentCredibility
    - QuantumReputationCapital
    - dimension_trends
    - segment_confidence
    - verified_referral_rate
# =====================================================================
# 76. PROPERTY TESTS
# =====================================================================
property_tests:
  - marketing_copy_never_increases_internal_ReputationState
  - one_client_feedback_item_never_overwrites_objective_delivery_truth
  - late_delivery_caused_by_client_dependency_never_counts_as_full_Quantum_delay
  - early_delivery_never_counts_without_quality_release
  - unreleased_master_never_counts_as_reputation_quality_evidence
  - provider_outage_never_excuses_external_promise_semantics
  - legitimate_defect_repair_never_automatically_counts_as_nickel_and_dime_charge
  - material_scope_change_never_becomes_free_deficiency_repair
  - repeat_purchase_never_counted_without subsequent_valid_transaction
  - referral_never_publicized_without_permission
  - confidential_client_evidence_never_exposed_to_other_client
  - high_ClientLifetimeValue_never_bypasses_creator_release
  - high_ClientLifetimeValue_never_bypasses_law
  - high_ClientLifetimeValue_never_changes_active_contract
  - negative_reputation_evidence_never_deleted_by_positive_future_event
  - relationship_memory_never_becomes_project_canon
  - ReputationState_never_sets_active_offer_price
  - relationship_model_can_be_rebuilt_from_authoritative_events
# =====================================================================
# 77. SCENARIO TESTS
# =====================================================================
scenario_tests:
  perfect_first_project:
    events:
      - fixed_fair_offer
      - payment_on_time
      - no_hidden_fees
      - exceptional_creator_release
      - delivered_9_days_early
      - no_client_visible_defects
    expect:
      - CommitmentCredibility_up
      - DeliveryReliability_up
      - QualityConsistency_up
      - FairDealing_up
      - ReputationCapital_up
  internal_provider_crisis_but_no_client_impact:
    events:
      - provider_outage
      - ProductionModel_replans
      - delivery_still_early
      - quality_exceptional
    client_reputation_effect:
      provider_failure: NONE_DIRECT
      successful_delivery: POSITIVE
  material_problem_detected_early:
    events:
      - schedule_risk_detected
      - Quantum_notifies_client
      - repairs
      - still_delivers_on_time
    expect:
      - candor_positive
      - problem_ownership_positive
  obvious_defect:
    client_reports: true
    Quantum_response:
      - acknowledge
      - repair
      - QC
      - return_corrected
      - no_extra_fee
    expect:
      - ProblemOwnership_up
      - FairDealing_preserved
  buyer_requests_new_ending:
    classification:
      MATERIAL_CHANGE
    expect:
      - not_treated_as_defect
      - no_reputation_penalty_for_change_order_if_clear_and_fair
  second_purchase:
    expect:
      - RepeatPurchaseEvidence
      - relationship_value_up
      - transaction_intro_can_be_shorter
  referral:
    expect:
      - ReferralEvidence
      - public_claim_only_if_authorized
# =====================================================================
# 78. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: CR-G01
    check: ClientRelationshipModel exists as separate derived domain
  - id: CR-G02
    check: relationship state cannot overwrite source-system truth
  - id: CR-G03
    check: ClientAccount separates organization and professional contacts
  - id: CR-G04
    check: ClientDeliveryHistory distinguishes attributable causes
  - id: CR-G05
    check: PromiseRecord exists
  - id: CR-G06
    check: PromiseOutcome exists
  - id: CR-G07
    check: CommitmentCredibility exists
  - id: CR-G08
    check: schedule reliability is evidence-backed
  - id: CR-G09
    check: ahead-of-schedule delivery requires quality pass
  - id: CR-G10
    check: budget reliability represented
  - id: CR-G11
    check: quality consistency represented
  - id: CR-G12
    check: legitimate problem ownership represented
  - id: CR-G13
    check: candor represented
  - id: CR-G14
    check: fair dealing represented
  - id: CR-G15
    check: revision efficiency represented
  - id: CR-G16
    check: ClientIssue distinguishes defect from material change
  - id: CR-G17
    check: explicit feedback remains evidence not canonical truth
  - id: CR-G18
    check: trust is domain-specific
  - id: CR-G19
    check: satisfaction is probabilistic
  - id: CR-G20
    check: repeat purchase is first-class evidence
  - id: CR-G21
    check: referral is first-class evidence
  - id: CR-G22
    check: client preferences are professional and privacy-minimized
  - id: CR-G23
    check: client lifetime value includes repeat/referral/reputation/option value
  - id: CR-G24
    check: relationship value cannot lower quality floor
  - id: CR-G25
    check: QuantumReputationState exists
  - id: CR-G26
    check: QuantumReputationCapital has explicit components
  - id: CR-G27
    check: CommitmentCredibility influences reputation
  - id: CR-G28
    check: reputation is segmentable
  - id: CR-G29
    check: negative reputation events remain historical
  - id: CR-G30
    check: ReputationIncident exists
  - id: CR-G31
    check: reputation recovery requires behavioral evidence
  - id: CR-G32
    check: public social proof requires authority
  - id: CR-G33
    check: no fabricated social proof possible
  - id: CR-G34
    check: ReputationState may inform but not set pricing
  - id: CR-G35
    check: relationship memory cannot access private family data by default
  - id: CR-G36
    check: repeat buyer experience may reduce redundant friction
  - id: CR-G37
    check: repeat buyer cannot bypass security or release controls
  - id: CR-G38
    check: provider failure remains Quantum operational responsibility
  - id: CR-G39
    check: attribution prevents client-caused delay from corrupting reliability
  - id: CR-G40
    check: relationship model rebuilds from evidence
# =====================================================================
# 79. IMPLEMENTATION WAVES
# =====================================================================
implementation_waves:
  CRW1:
    name: client_relationship_core
    targets:
      - ClientAccount
      - ClientProjectRelationship
      - ClientRelationshipModel
      - ClientRelationshipSnapshot
  CRW2:
    name: promise_reliability
    depends_on:
      - CRW1
    targets:
      - PromiseRecord
      - PromiseOutcome
      - DeliveryReliability
      - BudgetReliability
      - CommitmentCredibility
  CRW3:
    name: quality_fairness_candor
    depends_on:
      - CRW1
    targets:
      - QualityConsistency
      - FairDealing
      - CommunicationCandor
      - ProblemOwnership
  CRW4:
    name: issues_feedback_preferences
    depends_on:
      - CRW1
    targets:
      - ClientIssue
      - IssueResolution
      - ClientFeedbackObservation
      - ClientPreferenceProfile
      - ClientTrustState
  CRW5:
    name: lifetime_value
    depends_on:
      - CRW2
      - CRW3
      - CRW4
    targets:
      - RepeatPurchaseEvidence
      - ReferralEvidence
      - ClientStrategicFit
      - ClientLifetimeValue
      - RelationshipOptionValue
  CRW6:
    name: studio_reputation
    depends_on:
      - CRW5
    targets:
      - QuantumReputationState
      - QuantumReputationCapital
      - ReputationSegment
      - ReputationTrajectory
  CRW7:
    name: incident_recovery
    depends_on:
      - CRW6
    targets:
      - ReputationIncident
      - ReputationRecoveryPlan
  CRW8:
    name: memory_and_downstream
    depends_on:
      - CRW7
    targets:
      - RelationshipMemoryProjection
      - Avatar_integration
      - Portal_integration
      - Acquisition_input
  CRW9:
    name: calibration
    depends_on:
      - CRW8
    targets:
      - confidence
      - recency_weighting
      - segment_calibration
      - reputation_learning
# =====================================================================
# 80. OPEN DECISIONS
# =====================================================================
open_decisions:
  - id: CR-OD-01
    decision: ReputationCapital calibration function
    status: EMPIRICAL
  - id: CR-OD-02
    decision: recency decay by reputation dimension
    status: CALIBRATION_REQUIRED
  - id: CR-OD-03
    decision: client lifetime value forecasting model
    status: LEARNING_REQUIRED
  - id: CR-OD-04
    decision: exact definition of strategic account
    status: BUSINESS_POLICY
  - id: CR-OD-05
    decision: public aggregate reliability claim policy
    status: MARKETING_AND_LEGAL_POLICY
  - id: CR-OD-06
    decision: repeat-client pricing effect
    status: SPEC_23_AND_29
  - id: CR-OD-07
    decision: client issue severity taxonomy thresholds
    status: OPERATING_CALIBRATION
  - id: CR-OD-08
    decision: reputation incident recovery thresholds
    status: CREATOR_POLICY
  - id: CR-OD-09
    decision: client satisfaction projection estimator
    status: EMPIRICAL
  - id: CR-OD-10
    decision: market-specific ReputationSegment hierarchy
    status: SPEC_29
# =====================================================================
# 81. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: reputation_becomes_vanity_score
    control:
      - component_evidence
      - no_magic_score
  - risk: buyer_praise_overrides_actual_failure
    control:
      - separate_feedback_and_objective_truth
  - risk: one_good_short_implies_feature_reliability
    control:
      - conditional_reliability
      - segment_confidence
