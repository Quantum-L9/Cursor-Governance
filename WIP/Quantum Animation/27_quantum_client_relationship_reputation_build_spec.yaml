architectural_identity:
  concise: >
    Maintain a durable evidence-backed model of every Quantum client relationship
    and of Quantum's accumulated reputation so repeated exceptional execution
    compounds into trust, repeat business, referrals, stronger pricing power and
    lower transaction friction.
  extended: >
    Quantum Client Relationship and Reputation Runtime owns the longitudinal
    business relationship state between Quantum and each client organization,
    including projects purchased, commercial history, promises made, promises
    kept, delivery reliability, budget reliability, quality outcomes, legitimate
    problems, problem resolution, communication candor, revision efficiency,
    client feedback, repeat purchase evidence, referral evidence, strategic fit,
    relationship value and trust projections. It also owns Quantum's aggregated
    ReputationState and CommitmentCredibility across customers and markets.
    It never invents reputation from branding language. Reputation is earned from
    verifiable events produced by the commercial, payment, production, QC,
    delivery and client-experience systems.
  canonical_success_statement: >
    Quantum arrives with unusual ideas, makes them commercially intelligible,
    produces visually extraordinary intelligent work, quotes fair terms,
    does not nickel-and-dime, communicates truthfully, stays inside budget,
    delivers before the date it promised, fixes real problems, and keeps
    bringing more.
  strategic_identity: >
    Reputation is not a marketing layer sitting on top of the studio.
    Reputation is accumulated evidence about how the studio behaves.
ownership:
  system: CLIENT_RELATIONSHIP_REPUTATION
  owner_question:
    primary: >
      Based on actual history, what kind of relationship does this client have
      with Quantum, and what has Quantum actually earned the right to be believed
      about?
  secondary_questions:
    - "How many projects has this client purchased?"
    - "What was the total commercial value?"
    - "Did Quantum deliver on time?"
    - "Did Quantum deliver ahead of schedule?"
    - "Did Quantum remain within its promised commercial scope?"
    - "Did Quantum preserve budget certainty?"
    - "Did delivered work meet Quantum's internal quality standard?"
    - "How many legitimate client problems occurred?"
    - "How quickly and effectively were those problems resolved?"
    - "Did Quantum nickel-and-dime the client?"
    - "Were change orders actually material changes?"
    - "Did Quantum communicate bad news truthfully?"
    - "Did the client pay reliably?"
    - "Did the client provide timely dependencies?"
    - "Did this client purchase again?"
    - "Did this client refer another buyer?"
    - "Does this account have high lifetime strategic value?"
    - "What does the client demonstrably trust Quantum to do?"
    - "What promises has Quantum historically kept?"
    - "How much transaction friction remains?"
    - "Which earlier failures remain unresolved?"
    - "What should Quantum remember next time this organization appears?"
    - "What reputation has Quantum earned globally?"
    - "Where is that reputation strongly evidenced and where is it still unknown?"
  owns:
    - ClientAccount
    - ClientRelationshipModel
    - ClientRelationshipSnapshot
    - ClientRelationshipHistory
    - ClientProjectRelationship
    - ClientCommercialHistory
    - ClientDeliveryHistory
    - ClientPaymentHistoryProjection
    - ClientIssueHistory
    - ClientFeedbackObservation
    - ClientPreferenceProfile
    - ClientInteractionPreference
    - ClientTrustState
    - ClientSatisfactionProjection
    - PromiseRecord
    - PromiseOutcome
    - CommitmentCredibility
    - DeliveryReliabilityModel
    - BudgetReliabilityModel
    - QualityConsistencyModel
    - ProblemOwnershipModel
    - FairDealingModel
    - CommunicationCandorModel
    - RevisionEfficiencyModel
    - RepeatPurchaseEvidence
    - ReferralEvidence
    - ClientStrategicFit
    - ClientLifetimeValueProjection
    - RelationshipOptionValue
    - ClientRelationshipHealth
    - ClientRiskState
    - QuantumReputationState
    - QuantumReputationCapital
    - ReputationDimension
    - ReputationEvidence
    - ReputationSegment
    - ReputationTrajectory
    - ReputationIncident
    - ReputationRecoveryPlan
    - ReputationPolicy
    - RelationshipMemoryProjection
    - RelationshipSignal
    - relationship/reputation events
  explicitly_does_not_own:
    project_truth:
      owner: 01_quantum_animation_world_model_build_spec.yaml
    creative_intent:
      owner: 03_quantum_creative_intelligence_build_spec.yaml
    client_product_fit:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    current_studio_capability:
      owner: 05_quantum_self_model_build_spec.yaml
    production_strategy:
      owner: 06_quantum_production_model_build_spec.yaml
    quality_acceptance:
      owner: 07_quantum_autonomous_qc_build_spec.yaml
    production_execution:
      owner: 08_quantum_production_engine_build_spec.yaml
    commercial_terms:
      owner: 23_quantum_commercial_offer_conversion_build_spec.yaml
    contractual_obligations:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    payment_truth:
      owner: 25_quantum_payment_work_authorization_build_spec.yaml
    StudioAvatar_identity:
      owner: 26_quantum_studio_avatar_identity_build_spec.yaml
    ProductionPortal:
      owner: 28_quantum_production_portal_client_experience_build_spec.yaml
    target_acquisition:
      owner: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
    pricing_policy:
      owner:
        commercial: 23
        future_learning: 29
    final_creator_release:
      owner: 30_quantum_creator_release_delivery_build_spec.yaml
  hard_boundary: >
    Relationship and reputation models summarize historical evidence and make
    probabilistic projections. They never overwrite the underlying commercial,
    payment, production, quality or legal facts from which they are derived.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Turn every correctly executed project into compounding trust.
  economic_goal: >
    Reduce the future cost of acquisition, diligence, negotiation and perceived
    execution risk by repeatedly proving that Quantum does what Quantum says.
  client_goal: >
    Build the expectation:
    "Quantum's work will be exceptional, the deal will be fair, the truth will
    be clear, and the project will arrive when they said it would."
  creator_goal: >
    Protect the creator's name from short-term compromises that would damage
    long-term studio credibility.
  long_horizon_goal: >
    Move the market perception from:
      "Who is Quantum?"
    to:
      "I heard their work is incredible."
    to:
      "It's Quantum. Watch it."
    to:
      "Can we get them?"
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  CR-001:
    name: REPUTATION_IS_EVIDENCE
    statement: >
      ReputationState derives from observable historical outcomes, not studio
      self-description.
  CR-002:
    name: TRUST_IS_EARNED_REPEATEDLY
    statement: >
      One successful project is evidence; a repeated pattern becomes trust.
  CR-003:
    name: COMMITMENT_CREDIBILITY_IS_CORE
    statement: >
      Quantum's strongest long-term signal is that stated commitments correspond
      to real behavior.
  CR-004:
    name: SAYING_X_MEANS_X
    statement: >
      If Quantum states a commercial deadline, delivery date, quality commitment
      or payment policy, the system should behave consistently with it.
  CR-005:
    name: NO_REPUTATION_BY_BLUSTER
    statement: >
      Marketing language cannot increase internal ReputationState.
  CR-006:
    name: OBJECTIVE_HISTORY_BEFORE_SURVEY
    statement: >
      Delivery, quality, payment, repeat purchases and referrals are generally
      stronger relationship evidence than vanity satisfaction surveys.
  CR-007:
    name: FEEDBACK_STILL_MATTERS
    statement: >
      Explicit buyer feedback is first-class evidence but remains distinguished
      from objective execution events.
  CR-008:
    name: NO_COVERT_SENTIMENT_SURVEILLANCE
    statement: >
      Quantum does not secretly infer client satisfaction from cameras, private
      communications or unrelated personal behavior.
  CR-009:
    name: CLIENT_IS_ORGANIZATION_PLUS_PEOPLE
    statement: >
      ClientRelationshipModel distinguishes the contracting organization from the
      authorized humans who interact with Quantum.
  CR-010:
    name: PROFESSIONAL_MEMORY_ONLY_BY_DEFAULT
    statement: >
      Relationship memory prioritizes project, business, communication and
      professional preferences rather than private personal information.
  CR-011:
    name: REPEAT_BUSINESS_IS_A_STRONG_SIGNAL
    statement: >
      A buyer voluntarily returning for another project is high-value evidence of trust.
  CR-012:
    name: REFERRAL_IS_A_STRONGER_PUBLIC_SIGNAL
    statement: >
      A verified referral indicates the client was willing to spend personal
      reputation on Quantum.
  CR-013:
    name: EARLY_DELIVERY_COUNTS_ONLY_IF_QUALITY_HOLDS
    statement: >
      Shipping early is reputation-positive only when creator and contractual
      quality standards remain satisfied.
  CR-014:
    name: NEVER_RUSH_TO_WIN_A_METRIC
    statement: >
      Ahead-of-schedule delivery is an outcome of operational strength, not a
      reason to release work prematurely.
  CR-015:
    name: ON_TIME_IS_A_HARD_BASELINE
    statement: >
      Quantum should treat missed commitments as serious reputation events.
  CR-016:
    name: AHEAD_OF_SCHEDULE_IS_POSITIVE_OPTION_VALUE
    statement: >
      Early delivery creates extra trust because it gives the client unexpected
      schedule margin.
  CR-017:
    name: BUDGET_CERTAINTY_BUILDS_TRUST
    statement: >
      Unexpected cost expansion damages reliability even when final quality is high.
  CR-018:
    name: NO_NICKEL_AND_DIMING
    statement: >
      Quantum does not monetize every inconvenience or legitimate defect.
  CR-019:
    name: REAL_PROBLEMS_GET_OWNED
    statement: >
      If Quantum caused a legitimate problem, the default response is identify,
      contain, repair, verify and communicate.
  CR-020:
    name: FIX_FIRST_WHEN_POSSIBLE
    statement: >
      Quantum should not make clients endure procedural debate over obvious defects.
  CR-021:
    name: MATERIAL_SCOPE_CHANGE_REMAINS_MATERIAL
    statement: >
      Fair dealing does not require Quantum to absorb a fundamentally new project
      for free.
  CR-022:
    name: FAIRNESS_IS_BIDIRECTIONAL
    statement: >
      Relationship models evaluate both Quantum's behavior and the client's
      fulfillment of their own dependencies and obligations.
  CR-023:
    name: CLIENT_DELAY_IS_NOT_QUANTUM_FAILURE
    statement: >
      Schedule attribution must distinguish studio-caused delay from client-caused
      dependency delay.
  CR-024:
    name: PROVIDER_FAILURE_IS_STILL_QUANTUMS_PROBLEM
    statement: >
      From the buyer's perspective, Quantum owns its supplier and model failures.
  CR-025:
    name: INTERNAL_CAUSE_DOES_NOT_EXCUSE_EXTERNAL_PROMISE
    statement: >
      "The model went down" is an internal operational explanation, not a reason
      to redefine the commitment.
  CR-026:
    name: CANDOR_INCREASES_TRUST
    statement: >
      Truthful early disclosure of a material issue may preserve more reputation
      than a hidden problem discovered late.
  CR-027:
    name: CANDOR_IS_NOT_OVERSHARING
    statement: >
      Buyers need material truth, not every internal retry, failed take or provider outage.
  CR-028:
    name: QUALITY_CONSISTENCY_BEATS_ONE_HIT
    statement: >
      Reputation grows faster from repeated excellence than from one exceptional
      project followed by mediocrity.
  CR-029:
    name: EXCEPTIONAL_IS_A_DISTRIBUTION
    statement: >
      Quantum tracks how consistently released work clears its creator-level
      exceptional threshold.
  CR-030:
    name: REPUTATION_IS_SEGMENTED
    statement: >
      Evidence earned in premium family animation does not automatically prove
      equal reputation in every market or format.
  CR-031:
    name: GLOBAL_REPUTATION_CAN_HAVE_LOCAL_COMPONENTS
    statement: >
      Region, language, genre, format and buyer type may each have distinct
      reputation evidence.
  CR-032:
    name: ONE_FAILURE_NEED_NOT_DESTROY_THE_BRAND
    statement: >
      Reputation incidents are evaluated by severity, responsibility, candor,
      repair and recurrence.
  CR-033:
    name: HIDDEN_FAILURE_IS_WORSE
    statement: >
      Concealing a known material failure is more damaging to trust than
      transparently owning and fixing it.
  CR-034:
    name: PROBLEM_OWNERSHIP_IS_MEASURABLE
    statement: >
      Time to acknowledge, contain, repair and verify legitimate client problems
      should be recorded.
  CR-035:
    name: RELATIONSHIP_STATE_IS_NOT_CANONICAL_PROJECT_STATE
    statement: >
      A client believing something does not make it project truth.
  CR-036:
    name: SATISFACTION_IS_PROBABILISTIC
    statement: >
      Internal estimates of client satisfaction remain projections with confidence.
  CR-037:
    name: TRUST_HAS_DOMAINS
    statement: >
      A client may trust Quantum's creative quality strongly while still having
      limited evidence about feature-length schedule reliability.
  CR-038:
    name: REPUTATION_HAS_DOMAINS
    statement: >
      Reputation for quality, originality, budget reliability, delivery and
      fairness remain separately inspectable.
  CR-039:
    name: NO_SINGLE_MAGIC_SCORE
    statement: >
      Reputation may have an aggregate projection but its component evidence
      must remain visible.
  CR-040:
    name: CLIENT_VALUE_IS_LONG_HORIZON
    statement: >
      Current project profit is only one component of account value.
  CR-041:
    name: EXPECTED_REPEAT_BUSINESS_MATTERS
    statement: >
      Strong repeat probability can justify additional service effort within policy.
  CR-042:
    name: REFERRAL_VALUE_MATTERS
    statement: >
      A trusted buyer who can credibly introduce Quantum to other qualified
      buyers has relationship option value.
  CR-043:
    name: PORTFOLIO_VALUE_MATTERS
    statement: >
      Some projects create strategic credibility in a new format, market or category.
  CR-044:
    name: REPUTATION_VALUE_MATTERS
    statement: >
      A project's execution can affect future studio economics far beyond that
      project's invoice.
  CR-045:
    name: RELATIONSHIP_VALUE_DOES_NOT_OVERRIDE_CREATOR_FLOOR
    statement: >
      No strategic client is important enough to force release of work below the
      creator's quality standard.
  CR-046:
    name: RELATIONSHIP_VALUE_DOES_NOT_OVERRIDE_LAW
    statement: >
      Important clients do not receive illegal or unauthorized exceptions.
  CR-047:
    name: RELATIONSHIP_VALUE_DOES_NOT_SILENTLY_CHANGE_CONTRACT
    statement: >
      Extra effort may occur internally, but binding terms change only through
      the correct commercial/legal path.
  CR-048:
    name: REPEAT_BUYER_SHOULD_FEEL_EASIER
    statement: >
      Established trust should reduce redundant explanation and transaction friction.
  CR-049:
    name: REPEAT_BUYER_DOES_NOT_GET_LOWER_STANDARDS
    statement: >
      Familiarity cannot weaken security, payment or creator-release controls.
  CR-050:
    name: RELATIONSHIP_MEMORY_REDUCES_FRICTION
    statement: >
      Quantum should remember established professional preferences so buyers need
      not repeat themselves unnecessarily.
  CR-051:
    name: MEMORY_IS_CORRECTABLE
    statement: >
      If a client preference becomes stale or wrong, it can be superseded without
      erasing historical evidence.
  CR-052:
    name: NEGATIVE_EVIDENCE_IS_NOT_ERASED
    statement: >
      A later successful project does not delete an earlier missed commitment.
  CR-053:
    name: RECENCY_MATTERS
    statement: >
      Recent delivery performance may have more predictive weight than very old history.
  CR-054:
    name: SAMPLE_SIZE_MATTERS
    statement: >
      One successful project does not justify the confidence of twenty successful projects.
  CR-055:
    name: EVIDENCE_QUALITY_MATTERS
    statement: >
      Certified delivery events and signed transactions outweigh vague anecdotes.
  CR-056:
    name: PUBLIC_REPUTATION_AND_INTERNAL_REPUTATION_DIFFER
    statement: >
      Quantum may internally know more about its performance than can ethically or
      legally be claimed publicly.
  CR-057:
    name: CONFIDENTIAL_CLIENT_HISTORY_STAYS_CONFIDENTIAL
    statement: >
      Relationship evidence from one customer is not exposed to another without
      appropriate rights.
  CR-058:
    name: SOCIAL_PROOF_MUST_BE_AUTHORIZED
    statement: >
      Logos, quotes, client names, revenue outcomes and endorsements require
      explicit permission where applicable.
  CR-059:
    name: NO_FAKE_SOCIAL_PROOF
    statement: >
      Internal reputation confidence cannot be rendered as a fabricated client quote.
  CR-060:
    name: REPUTATION_FEEDS_PRICING_BUT_DOES_NOT_SET_PRICE
    statement: >
      ReputationState can inform future commercial pricing policy; spec 23
      remains the offer authority.
  CR-061:
    name: REPUTATION_FEEDS_ACQUISITION
    statement: >
      Target-selection and acquisition strategy may consume ReputationState to
      estimate credibility and likely conversion.
  CR-062:
    name: COMMITMENT_CREDIBILITY_COMPOUNDS
    statement: >
      Every kept promise increases the believability of the next promise.
  CR-063:
    name: BROKEN_PROMISES_COMPOUND_TOO
    statement: >
      Repeated missed commitments degrade trust faster than isolated operational noise.
  CR-064:
    name: DELIVERY_BEFORE_PROMISE_IS_A_GIFT
    statement: >
      If Quantum internally targets earlier completion and reliably creates
      client schedule margin, that behavior becomes a competitive reputation asset.
  CR-065:
    name: DO_NOT_GAME_THE_DATE
    statement: >
      Quantum may maintain rational contractual contingency, but cannot publish
      absurdly distant dates merely to claim early delivery.
  CR-066:
    name: COMMERCIAL_SIMPLICITY_IS_REPUTATION
    statement: >
      Being easy to transact with becomes part of the studio's long-term identity.
  CR-067:
    name: FIXED_FAIR_DEALS_CAN_BECOME_A_TRUST_SIGNAL
    statement: >
      Buyers who repeatedly observe reasonable fixed offers should require less
      defensive negotiation behavior.
  CR-068:
    name: REPUTATION_CAN_INCREASE_PRICE_POWER
    statement: >
      Proven lower execution risk and higher quality can rationally support
      higher future consideration.
  CR-069:
    name: PRICE_POWER_MUST_BE_EARNED
    statement: >
      Reputation projection cannot be assumed simply because Quantum wants to
      charge more.
  CR-070:
    name: REPUTATION_IS_A_STUDIO_ASSET
    statement: >
      Long-term reputation should be treated as capital whose destruction has
      real economic cost.
