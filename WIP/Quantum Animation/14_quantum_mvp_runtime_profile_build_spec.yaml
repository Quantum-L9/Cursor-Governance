# =====================================================================
# 42. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    MVP is the smallest complete studio, not the smallest generation demo.
  law_02: >
    Every major architecture authority must participate at least minimally.
  law_03: >
    Scope is intentionally constrained so architecture—not universe scale—is tested.
  law_04: >
    One persistent character is more valuable than ten disposable characters.
  law_05: >
    One meaningful state transition is more valuable than broad shallow simulation.
  law_06: >
    One NarrativeOpportunity is enough to prove story emergence.
  law_07: >
    One forced failure is mandatory because autonomous repair is a core thesis.
  law_08: >
    The system must preserve correct work while repairing incorrect work.
  law_09: >
    The system must produce dialogue, sound, music, and final edit—not merely video clips.
  law_10: >
    The system must finish with a certified master artifact.
  law_11: >
    The system must remember what happened during production.
  law_12: >
    Learned policies are not required to prove learning-data capture.
  law_13: >
    Logical modularity is required; premature infrastructure distribution is not.
  law_14: >
    No deferred capability may delay the first certified short unless execution
    proves it is genuinely required.
  law_15: >
    Once the 60-second loop works, the architecture earns the right to scale.

The pair creates a very useful constraint:

13 Asset Identity Library
"How does a persistent fictional entity acquire reusable,
certified production identity?"
                     +
14 MVP Runtime Profile
"How little of the total architecture can we activate
while still proving the entire autonomous loop?"

And 14 gives us a hard firewall against the biggest danger now: building the amazing future system before proving the present one.

For the MVP, the target is no longer vague. It is exactly:

1 persistent world
1–2 persistent characters
1 meaningful prop
1 major location
1 blocked desire
1 false belief/internal conflict
1 knowledge asymmetry
1 physical constraint
1 relationship/emotional cost
1 NarrativeOpportunity
1 reveal
10–15 shots
dialogue
voice
music
SFX/Foley
ambience
multiple takes
1 deliberately broken shot
autonomous FAIL
autonomous surgical repair
certified master
complete provenance
experience persisted

That is a small enough film to actually build, but dense enough to prove almost every important idea in the architecture.