# =====================================================================
# 34. STOP CONDITIONS
# =====================================================================
MVP_stop_conditions:
  MVP_complete_when:
    - one 60-second film receives master certificate
    - creative-to-master provenance complete
    - forced failure repaired autonomously
    - accepted unrelated work preserved
    - persistent character representation reused across shots
    - World continuity demonstrated
    - experience feedback persisted
  do_not_delay_completion_for:
