metadata:
  spec_id: quantum.animation.mvp_runtime_profile.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Animation Studio MVP Runtime Profile
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: WORLD_RUNTIME_SUBSET
    - file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: COGNITIVE_RUNTIME_SUBSET
    - file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: CREATIVE_RUNTIME_SUBSET
    - file: 04_quantum_audience_product_intelligence_build_spec.yaml
      relationship: AUDIENCE_PRODUCT_RUNTIME_SUBSET
    - file: 05_quantum_self_model_build_spec.yaml
      relationship: CAPABILITY_RUNTIME_SUBSET
    - file: 06_quantum_production_model_build_spec.yaml
      relationship: PRODUCTION_STRATEGY_RUNTIME_SUBSET
    - file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: QC_RUNTIME_SUBSET
    - file: 08_quantum_production_engine_build_spec.yaml
      relationship: EXECUTION_RUNTIME_SUBSET
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
      relationship: PROVENANCE_RUNTIME_SUBSET
    - file: 10_quantum_canonical_artifact_ir_build_spec.yaml
      relationship: CANONICAL_IR_RUNTIME_SUBSET
    - file: 11_quantum_project_compiler_pipeline_build_spec.yaml
      relationship: PROJECT_COMPILER_RUNTIME_SUBSET
    - file: 12_quantum_story_animatic_compiler_build_spec.yaml
      relationship: STORY_ANIMATIC_RUNTIME_SUBSET
    - file: 13_quantum_asset_identity_library_build_spec.yaml
      relationship: IDENTITY_RUNTIME_SUBSET
  architectural_identity:
    concise: >
      Deliberately constrained execution profile defining the smallest complete
      Quantum Animation Agent that can autonomously create, QC, repair, and
      certify a 60-second animated short.
    extended: >
      The MVP Runtime Profile is a scope firewall around the broader Quantum
      Animation Studio architecture. It does not introduce new subsystem
      responsibilities. It selects the minimum required contracts, data models,
      cognitive operators, World state, asset types, QC layers, production
      strategies, and execution mechanics needed to prove the studio's central
      closed loop with 10–15 shots. Anything not explicitly required by this
      profile is deferred to the roadmap unless implementation evidence proves
      it is necessary.
  owner_question:
    primary: "What exactly must exist for the first real autonomous film proof?"
  secondary_questions:
    - "What can we safely exclude?"
    - "Which state dimensions are mandatory?"
    - "Which cognition modules are required?"
    - "Which repair class must work?"
    - "How many characters/locations/threads are allowed?"
    - "What quality level are we proving?"
    - "What must be genuinely autonomous?"
    - "What must be deterministic?"
    - "Which features are explicitly forbidden from delaying MVP?"
    - "What constitutes architectural success?"
  core_principle: >
    Prove the closed loop before expanding the universe.
# =====================================================================
# 1. MVP THESIS
# =====================================================================
mvp_thesis:
  target: >
    One 60-second animated short demonstrating persistent state, autonomous
    narrative compilation, reusable character identity, heterogeneous media
    production, independent QC, local repair, deterministic assembly, complete
    provenance, and institutional feedback.
  success_is_not:
    - maximum visual quality
    - perfect feature-film realism
    - general-purpose narrative platform
    - full season production
    - hundreds of characters
    - universal physics simulation
  success_is:
    - end-to-end architecture proof
    - autonomous film manufacture
    - state continuity proof
    - QC/repair proof
    - reusable identity proof
    - exact lineage proof
    - no mandatory human production routing
# =====================================================================
# 2. HARD SCOPE LIMITS
# =====================================================================
scope_limits:
  runtime:
    target_seconds: 60
    acceptable_range_seconds:
      min: 45
      max: 75
  shots:
    target:
      min: 10
      max: 15
    hard_max_without_profile_revision: 18
  characters:
    major:
      min: 1
      max: 2
    minor_visible:
      max: 2
    speaking:
      max: 2
  locations:
    primary:
      max: 1
    secondary:
      max: 1
  narrative_threads:
    primary_causal_thread:
      max: 1
    secondary_thread:
      max: 1
  major_reveals:
    max: 1
  timeline:
    linear_primary: true
  flashback:
    allowed:
      max: 1
      complexity: SIMPLE_ONLY
  parallel_storylines:
    allowed: false
  branches_executed_to_animatic:
    max: 3
  final_selected_story:
    count: 1
# =====================================================================
# 3. REQUIRED CREATIVE CONTENT
# =====================================================================
required_creative_content:
  project_must_contain:
    concept:
      required: true
    desired_experience:
      required: true
    target_audience_line:
      required: true
    theme:
      required: true
    major_character:
      required: true
    character_desire:
      required: true
    character_false_belief_or_internal_conflict:
      required: true
    setting:
      required: true
    ending_intent:
      required: true
    visual_identity:
      required: true
    acoustic_identity:
      required: true
    quality_non_negotiables:
      required: true
  optional:
    - full screenplay
    - detailed plot
    - dialogue
    - shot list
  preferred:
    creator_supplies_plot:
      false
# =====================================================================
# 4. REQUIRED WORLD MODEL SUBSET
# =====================================================================
world_model_subset:
  mandatory_types:
    - WorldEntity
    - WorldEvent
    - WorldSnapshot
    - WorldRule
    - Belief
    - Knowledge
    - Intent
    - Relationship
    - Affordance
    - StoryCoordinate
    - WorldCoordinate
    - NarrativeOpportunity
  mandatory_state_dimensions:
    character:
      - identity
      - physical_state
      - psychological_state
      - active_desire
      - intention
      - belief
      - knowledge
    relationship:
      - relationship_state
      - trust_or_tension
    environment:
      - location
      - lighting_state
      - basic_physical_conditions
    prop:
      - ownership
      - location
      - state
      - hand_or_interaction_state_if_relevant
    temporal:
      - event_sequence
      - current_story_time
    audience:
      not_owned_by_WorldModel: true
  mandatory_reducer_semantics:
    - physical_state_update
    - knowledge_update_through_perception
    - belief_update
    - relationship_update
    - intention_update
    - prop_state_update
    - location_update
  deferred:
    - economy simulation
    - population-scale simulation
    - ecological simulation
    - complex scheduled WorldProcesses
    - large-scale faction dynamics
    - multi-century historical simulation
    - high-fidelity physics engine
# =====================================================================
# 5. REQUIRED NARRATIVE OPPORTUNITY
# =====================================================================
NarrativeOpportunity_MVP:
  required: true
  minimum_convergence:
    at_least:
      - one_active_desire
      - one_blocking_condition
      - one_relationship_or_internal_cost
      - one_affordance
  preferred:
    include:
      - knowledge_asymmetry
      - false_belief
      - narratively_meaningful_prop
  required_query:
    >
    What unresolved configuration in the current universe has the highest
    dramatic potential right now?
  ranking_dimensions:
    - goal_pressure
    - emotional_cost
    - causal_density
    - relationship_change_potential
    - audience_information_value
    - ending_alignment
    - runtime_fit
  hypergraph:
    required: false
  representation:
    reified_projection_node: sufficient
# =====================================================================
# 6. REQUIRED COGNITIVE MODULES
# =====================================================================
cognitive_runtime_subset:
  required_modules:
    - quantum.cognition.narrative
    - quantum.cognition.character
    - quantum.cognition.epistemic
    - quantum.cognition.cinematic
    - quantum.cognition.performance
    - quantum.cognition.acoustic
    - quantum.cognition.production
    - quantum.cognition.quality
  required_core_runtime:
    - CognitiveExecutive
    - ExecutionOrchestrator
    - CognitiveWorkspace
    - WorldSignal
    - WorldSignalBus
    - ReasoningPolicy
    - ReasoningBudget
    - DecisionFrame
    - Proposal
    - BranchPortfolio
    - CognitiveArbitrator
    - CommitManager
    - CognitiveTrace
  learning_objects:
    required_storage:
      - OperatorExperience
    learned_policy_activation:
      deferred: true
# =====================================================================
# 7. REQUIRED WORLD SIGNALS
# =====================================================================
WorldSignal_MVP:
  required_signal_types:
    narrative:
      - GOAL_BLOCKED
      - OPPORTUNITY_CONVERGENCE
      - KNOWLEDGE_ASYMMETRY
      - RELATIONSHIP_PRESSURE
      - FALSE_BELIEF_ACTIVE
    continuity:
      - WORLD_STATE_CHANGED
      - CRITICAL_PROP_STATE_CHANGED
    cognitive:
      - HIGH_DECISION_IMPACT
      - HIGH_UNCERTAINTY
    production:
      - PRODUCTION.HIGH_FAILURE_RISK
      - PRODUCTION.STRATEGY_INVALIDATED_BY_SELF_MODEL
    QC:
      - QC.FAIL
      - QC.UNCERTAIN
      - QC.REPAIR_REQUIRED
  full_signal_contract:
    required_fields:
      - type
      - version
      - detector_source
      - scope
      - subjects
      - severity
      - salience
      - urgency
      - novelty
      - confidence
      - downstream_impact
      - evidence
      - causal_parent_signals
      - dedupe_key
      - lifecycle
      - expiration
      - operator_hints
# =====================================================================
# 8. REQUIRED REASONING DEPTH
# =====================================================================
reasoning_depth:
  tiers:
    T0:
      name: deterministic
      use:
        - schema
        - exact graph query
        - constraint validation
    T1:
      name: light
      use:
        - routine shot decision
        - simple asset selection
    T2:
      name: moderate
      use:
        - scene design
        - dialogue/performance choice
    T3:
      name: deep
      use:
        - story selection
        - reveal
        - ending
        - repair after repeated failure
  T4_extreme:
    deferred: true
  adaptive_reasoning:
    required: true
  learned_reasoning_depth:
    deferred: true
# =====================================================================
# 9. REQUIRED PROJECT COMPILER SUBSET
# =====================================================================
project_compiler_subset:
  required:
    - creative.yaml parse
    - CreatorModel compile
    - CharacterSeed compile
    - setting/world seed
    - AudienceModel compile
    - ProductMarketModel compile
    - StoryContract
    - EndingIntent
    - QualitySemantics
    - WorldGenesisPlan
    - ProductionRequirementSeed
    - AssetIdentityIntent
    - quantum.studio.yaml
    - ProjectCompilation QC
  not_required:
    - season bible
    - multi-medium package
    - localization package
# =====================================================================
# 10. REQUIRED STORY/ANIMATIC SUBSET
# =====================================================================
story_animatic_subset:
  required:
    - NarrativeOpportunity retrieval
    - story candidates
    - causal validation
    - character validation
    - epistemic validation
    - bounded branch simulation
    - story selection
    - World event commit
    - StoryPlan
    - SceneSpec
    - ShotSpec
    - expected visible state
    - expected audible state
    - AnimaticTimeline
    - animatic QC
    - animatic repair
    - animatic.lock
  sequences:
    max: 3
  scenes:
    target:
      min: 2
      max: 5
  dialogue:
    allowed: true
  temp_voice:
    required_if_dialogue: true
  temp_music:
    required: true
  temp_sound:
    required: true
# =====================================================================
# 11. REQUIRED ASSET SUBSET
# =====================================================================
asset_subset:
  lead_character:
    required:
      - WorldEntity binding
      - AssetIdentityProfile
      - CanonicalVisualPack
      - CanonicalVoicePack
      - at_least_one_state_variant
      - QC certificate
  second_character:
    if_present:
      same_minimum_profile: true
  environment:
    required:
      - one EnvironmentAssetFamily
      - canonical view/reference pack
  important_prop:
    required:
      - one PropAssetFamily
      - interaction constraints
  deferred:
    - full 3D rigging
    - complex crowd asset system
    - large location catalogs
# =====================================================================
# 12. REQUIRED PRODUCTION MODEL SUBSET
# =====================================================================
production_model_subset:
  required:
    - ProductionIntent
    - ProductionConstraint
    - ProductionInvariantBinding
    - ProductionStrategy
    - CapabilityRequirement
    - ShotProductionRequirements
    - TakeGenerationPolicy
    - ProductionRisk
    - ProductionFeasibilityAssessment
    - FallbackPlan
    - RepairStrategy
  strategy_types_required:
    - single_model
    - deterministic
    - hybrid
    - composite_pipeline
    - multi_take
  layered_strategy:
    required_for_at_least_one_test_case: true
  provider_ensemble:
    optional: true
# =====================================================================
# 13. REQUIRED SELF MODEL SUBSET
# =====================================================================
self_model_subset:
  required_capabilities:
    - reasoning_model
    - image_generation
    - video_generation
    - voice_generation
    - music_generation
    - sound_generation_or_library
    - multimodal_QC
    - deterministic_media_tools
    - storage
    - workflow_execution
  required_state:
    - availability
    - quality
    - latency
    - cost
    - limits
    - task_suitability
    - known_failure_modes
  self_discovery:
    basic_runtime_refresh: required
  advanced_autonomous_capability_discovery:
    deferred: true
  learned_router:
    deferred: true
# =====================================================================
# 14. REQUIRED QC SUBSET
# =====================================================================
QC_subset:
  deterministic:
    required:
      - schema
      - duration
      - resolution
      - frame_rate
      - audio sync
      - World expected-vs-observed checks
  specialist:
    required:
      - visual
      - continuity
      - performance
      - narrative
      - acoustic
      - editing
  viewer:
    required:
      - ColdViewer
      - InformedCritic
    RewatchCritic:
      required_if:
        - reveal
        - twist
        - mindfuck
  product:
    required: true
  outcomes:
    - PASS
    - FAIL
    - UNCERTAIN
  certificate:
    required: true
  calibration:
    basic_static_benchmark: required
  learned_QC_policy:
    deferred: true
# =====================================================================
# 15. REQUIRED PRODUCTION ENGINE SUBSET
# =====================================================================
production_engine_subset:
  required:
    - ProductionManifest
    - ExecutionDAG
    - ProductionJob
    - JobAttempt
    - provider adapters
    - deterministic tool adapter
    - artifact store
    - retries
    - fallback activation
    - checkpointing
    - resumability
    - QC submission
    - repair execution
    - deterministic timeline assembly
    - final master build
  asynchronous_execution:
    required: true
  distributed_multi-region:
    deferred: true
  advanced_scheduler:
    deferred: true
  single_runtime_with_parallel_workers:
    sufficient_for_MVP: true
# =====================================================================
# 16. REQUIRED MEDIA PIPELINE
# =====================================================================
media_pipeline:
  video:
    required: true
  images:
    required:
      - asset refs
      - storyboard/animatic
      - keyframes_if_strategy_requires
  dialogue:
    required_if_story_contains: true
  sound_effects:
    required: true
  ambience:
    required: true
  music:
    required: true
  lip_sync:
    required_if_visible_speaking_character: true
  compositing:
    required:
      basic: true
  subtitles:
    optional: true
  final_master:
    required: true
# =====================================================================
# 17. REQUIRED PROVENANCE SUBSET
# =====================================================================
provenance_subset:
  required_lineage:
    - creative.yaml_to_CreatorModel
    - CreatorModel_to_WorldGenesis
    - WorldSnapshot_to_StoryPlan
    - StoryPlan_to_SceneSpec
    - SceneSpec_to_ShotSpec
    - ShotSpec_to_ProductionStrategy
    - ProductionStrategy_to_Job
    - Job_to_Artifact
    - Artifact_to_QC
    - QC_to_Certificate
    - Repair_to_replacement_artifact
    - certified_shots_to_MasterArtifact
  required_queries:
    - why_does_this_artifact_exist
    - what_depends_on_this
    - what_changes_if_this_changes
    - what_produced_this
    - what_was_preserved_by_repair
# =====================================================================
# 18. REQUIRED CANONICAL IR SUBSET
# =====================================================================
canonical_IR_subset:
  mandatory_object_classes:
    - SOURCE
    - DERIVED_MODEL
    - WORLD_STATE
    - DECISION
    - SPECIFICATION
    - PLAN
    - EXECUTION_STATE
    - CANDIDATE_ARTIFACT
    - CERTIFIED_ARTIFACT
    - CERTIFICATE
    - LOCK
    - EVIDENCE
    - EXPERIENCE
    - PROJECTION
  POLICY:
    supported_but_minimal: true
  required_common_fields:
    - object_id
    - version
    - schema
    - owner
    - authority_class
    - provenance
    - dependencies
    - digest_where_required
# =====================================================================
# 19. REQUIRED FAILURE TEST
# =====================================================================
forced_failure_test:
  mandatory: true
  shot:
    one_selected_shot: required
  World_expected:
    example:
      character_left_shoulder: damaged
      important_prop_hand: right
      emergency_lights: amber
  deliberately_bad_candidate:
    example:
      character_left_shoulder: intact
      important_prop_hand: left
      emergency_lights: blue
  required_behavior:
    - AutonomousQC FAIL
    - typed violations
    - root cause
    - RepairRecommendation
    - ProductionModel repair strategy
    - invalidate minimum scope
    - regenerate only failed shot_or_layer
    - re-QC
    - PASS
    - preserve all unrelated accepted artifacts
  architectural_success:
    unrelated_regeneration_count: 0
# =====================================================================
# 20. REQUIRED LEARNING FEEDBACK
# =====================================================================
learning_feedback:
  after_production:
    SelfModel:
      must_receive:
        - execution observations
        - QC-linked implementation quality evidence
    ProductionModel:
      must_receive:
        - strategy outcome
        - attempts
        - repair count
        - actual cost
        - actual latency
    AutonomousQC:
      must_receive:
        - QCExperienceRecord
    PolycognitiveRuntime:
      must_receive:
        - CognitiveTrace
        - OperatorExperience
  learned_policy_promotion:
    deferred: true
  MVP_proof:
    institutional_experience_persisted: true
# =====================================================================
# 21. AUTONOMY REQUIREMENTS
# =====================================================================
autonomy:
  mandatory_human_actions:
    allowed:
      - provide creative.yaml_or_creator_chat
      - optionally review final MVP
  forbidden_mandatory_human_actions:
    - write screenplay
    - make shot list
    - choose renderer
    - route production jobs
    - select takes
    - inspect continuity
    - perform QC
    - diagnose ordinary failure
    - manually repair shot
    - edit timeline
    - mix ordinary audio
    - assemble final master
  success:
    no_human_in_execution_loop: true
# =====================================================================
# 22. DETERMINISTIC REQUIREMENTS
# =====================================================================
deterministic_core:
  mandatory:
    - schema validation
    - object versioning
    - World reducer
    - graph traversal
    - exact dependency resolution
    - provenance emission
    - invalidation
    - timeline assembly
    - media conform
    - certificate validation
    - locks
    - artifact hashing
  intelligent:
    - creative interpretation
    - character deepening
    - narrative opportunity ranking
    - story selection
    - shot planning
    - performance
    - sound intent
    - production strategy
    - subjective QC
  hard_rule: >
    MVP cannot use an LLM in place of a deterministic primitive simply because
    it is faster to prototype.
# =====================================================================
# 23. TECHNICAL DEPLOYMENT PROFILE
# =====================================================================
deployment_profile:
  topology:
    initial:
      - one application/runtime boundary acceptable
      - modular packages
      - durable stores
      - asynchronous job queue
      - worker pool
  microservices:
    required: false
  distributed_graph_cluster:
    required: false
  multi_region:
    required: false
  Kubernetes_or_equivalent:
    required: false
  principle: >
    Architectural boundaries are logical first; physical distribution follows
    measured load.
# =====================================================================
# 24. STORAGE PROFILE
# =====================================================================
storage_profile:
  required_logical_stores:
    - structured canonical object store
    - World event/state store
    - graph/provenance projection
    - artifact blob store
    - execution state store
    - experience store
  may_physically_share_in_MVP:
    structured_datastores: true
  must_not_logically_collapse:
    - World truth
    - provenance
    - execution state
    - experience
# =====================================================================
# 25. MEMORY / GRAPHITI PROFILE
# =====================================================================
memory_profile:
  Graphiti_or_l9_memory:
    role:
      - semantic retrieval
      - associative memory
      - contextual projection
      - experience retrieval
    required_for_MVP:
      false
    optional_if_accelerates:
      true
    cannot_replace:
      - World reducer
      - World canonical state
      - exact provenance dependency graph
      - certificate store
      - execution manifest
  principle: >
    Memory infrastructure may simplify context retrieval without becoming authority.
# =====================================================================
# 26. QUALITY TARGET
# =====================================================================
quality_target:
  tier:
    recommended: preview_to_standard
  objective:
    >
    Strong enough to judge the creative/technical loop and watch as a finished
    short, but not requiring flagship streaming-grade finality.
  critical_dimensions:
    - creator fidelity
    - character identity
    - continuity
    - story comprehension
    - emotional effect
    - audiovisual completeness
    - local repair correctness
  deliberately_not_required:
    - perfect cinematic realism
    - feature-film facial performance
    - flawless complex choreography
# =====================================================================
# 27. BUDGETING
# =====================================================================
budget_profile:
  purpose:
    enforce_architecture_not_financial_optimization
  required:
    - per-job cost capture
    - per-shot cost
    - retry cost
    - repair cost
    - final cost-per-certified-minute
  hard_budget:
    optional_initially: true
  cost_optimization_policy_learning:
    deferred: true
# =====================================================================
# 28. LATENCY
# =====================================================================
latency_profile:
  objective:
    interactive_enough_for_iteration: true
  no_fixed_SLA_required: true
  required_measurement:
    - compiler latency
    - story generation latency
    - animatic latency
    - per-shot production latency
    - QC latency
    - repair latency
    - full project elapsed time
# =====================================================================
# 29. DEFERRED FEATURES
# =====================================================================
explicitly_deferred:
  narrative:
    - season_arc_planning
    - hundreds_of_character_story_search
    - large multi-faction simulation
    - highly nonlinear timelines
    - many simultaneous protagonists
    - complex parallel realities
  cognition:
    - learned operator selection policy
    - self-improving reasoning depth
    - large branch portfolios
    - multi-model cognitive swarms
  World:
    - high fidelity physics
    - economy
    - ecology
    - civilization simulation
    - large-scale continuous processes
  audience:
    - real audience telemetry calibration
    - segment-level learned audience models
  product:
    - distribution optimization
    - marketing systems
    - pricing
    - sales
  production:
    - full provider marketplace
    - auto-discovery of arbitrary models
    - multi-region render farms
    - production-grade feature-film scale
  assets:
    - hundreds_of_character catalogs
    - generalized cross-medium library
    - licensing management
  media:
    - interactive media
    - game engine integration
    - book compiler
    - comic compiler
    - audio drama compiler
  company:
    - finance
    - HR
    - CRM
    - legal automation
    - back office
# =====================================================================
# 30. PROHIBITED SCOPE CREEP
# =====================================================================
scope_creep_guards:
  prohibited_before_MVP:
    - new top_level_agent_without_missing_authority_proof
    - general_AGI_framework
    - general narrative SaaS platform
    - full marketing stack
    - feature-film scheduler
    - universal provider abstraction marketplace
    - hundreds-of-character Pokemon-scale universe implementation
    - book compiler implementation
    - game runtime implementation
  allowed:
    architectural_forward_compatibility: true
# =====================================================================
# 31. MVP EXECUTION FLOW
# =====================================================================
execution_flow:
  canonical: |
    creator chat
       ↓
    creative.yaml
       ↓
    Project Compiler
       ↓
    quantum.studio.yaml
       ↓
    Character / Setting / World genesis
       ↓
    persistent WorldSnapshot
       ↓
    WorldSignal
       ↓
    NarrativeOpportunity
       ↓
    Story candidates
       ↓
    bounded cognitive simulation
       ↓
    selected WorldEvents
       ↓
    StoryPlan
       ↓
    SceneSpecs
       ↓
    ShotSpecs
       ↓
    AnimaticTimeline
       ↓
    Autonomous QC
       ↓
    animatic.lock
       ↓
    AssetIdentityLibrary
       ↓
    ProductionIntent
       ↓
    SelfModel
       ↓
    ProductionModel
       ↓
    ProductionManifest / ExecutionDAG
       ↓
    candidate takes + audio
       ↓
    Autonomous QC
       ↓
    accepted shots / targeted repairs
       ↓
    deterministic timeline assembly
       ↓
    episode QC
       ↓
    master candidate
       ↓
    master QC
       ↓
    master.lock
       ↓
    experience persisted
# =====================================================================
# 32. REFERENCE STORY REQUIREMENTS
# =====================================================================
reference_story_requirements:
  must_include:
    persistent_character:
      count:
        min: 1
    character_goal:
      required: true
    blocked_goal:
      required: true
    relationship_or_internal_cost:
      required: true
    false_belief:
      required: true
    physical_constraint:
      required: true
    knowledge_asymmetry:
      required: true
    narratively_meaningful_prop:
      required: true
    state_change:
      required: true
    emotional_turn:
      required: true
    reveal:
      required: true
    ending_payoff:
