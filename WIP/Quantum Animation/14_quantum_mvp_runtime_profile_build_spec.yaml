    - learned policies
    - season features
    - generalized platform abstractions
    - scale beyond reference short
# =====================================================================
# 35. POST-MVP GATE
# =====================================================================
post_MVP_gate:
  before_3_minute_phase:
    required_evidence:
      - architecture boundaries held
      - actual cost measured
      - actual failure modes cataloged
      - QC false-positive/negative examples collected
      - World reducer survived full short
      - provenance graph supported surgical invalidation
      - identity assets meaningfully improved consistency
    review_questions:
