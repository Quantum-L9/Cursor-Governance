    - ProofTerminalStateTarget
    - ProofStopCondition
    - Marketability
    - MarketabilityEvidence
    - DesirePerSecond
    - EarnedDesirePerSecond
    - DesireGainVelocity
    - ExitDesire
    - DesireQuality
    - NextActionProbability
    - ProofOfFilmCompiler
    - proof_of_film.lock semantics
    - MarketabilityQC contract semantics
  explicitly_does_not_own:
    CreatorModel:
      owner: 03_quantum_creative_intelligence_build_spec.yaml
    AudienceModel:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    ProductMarketModel:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    ViewerPsychodynamics:
      owner: 17_quantum_viewer_cognition_psychology_build_spec.yaml
    World_truth:
      owner: 01_quantum_animation_world_model_build_spec.yaml
    production_strategy:
      owner: 06_quantum_production_model_build_spec.yaml
    production_execution:
      owner: 08_quantum_production_engine_build_spec.yaml
    formal_acceptance:
      owner: 07_quantum_autonomous_qc_build_spec.yaml
    executive_attention_delivery:
      owner: future_spec_19
    QuantumKeyAccess:
      owner: future_spec_20
    commercial_offer:
      owner: future_spec_23
    executable_agreement:
      owner: future_spec_24
  hard_boundary: >
    ProofOfFilm may discover the strongest truthful presentation of a project.
    It may not silently redesign the underlying project merely because a
    different project would be easier to sell.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Create a short audiovisual artifact whose job is to make a viewer want the
    underlying project to exist and strongly desire the next experience.
  executive_mission: >
    Give a busy decision-maker enough understanding, emotion, originality,
    execution confidence and unresolved value that the natural next action is to
    enter the deeper project experience rather than stop.
  passion_project_mission: >
    Find the most psychologically accessible doorway into an unusual,
    intellectual or initially non-obvious passion project while preserving the
    idea that makes the work worth creating.
  feature_development_mission: >
    For expensive feature-length animation, prove that the project has cinematic
    life before committing to a full animatic and large-scale final rendering.
  core_statement: >
    ProofOfFilm is not a collection of shots. It is an executable program
    designed to transform the viewer's cognitive-emotional state over a short,
    bounded period of time.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  PF-001:
    name: PROOF_NOT_SUMMARY
    statement: >
      ProofOfFilm proves cinematic identity and potential. It is not obligated to
      summarize the entire plot or explain the entire world.
  PF-002:
    name: MARKETABILITY_NOT_CONVENTIONALITY
    statement: >
      Marketability means making authentic project value legible and desirable,
      not making the project resemble everything already funded.
  PF-003:
    name: PROJECT_TRUTH_PRECEDES_PERSUASION
    statement: >
      The proof may select, compress, juxtapose and dramatize project truth but
      may not promise a fundamentally different product.
  PF-004:
    name: MAXIMUM_DESIRE_PER_SECOND
    statement: >
      Every second should justify the viewer attention it consumes. Unnecessary
      exposition, redundant spectacle and self-congratulatory presentation reduce
      ProofOfFilm efficiency.
  PF-005:
    name: CUT_WHEN_THE_OBJECTIVE_IS_WON
    statement: >
      The artifact should end near peak continuation pressure once identity,
      attachment and execution credibility are sufficiently established.
  PF-006:
    name: TWO_AND_A_HALF_MINUTES_IS_A_CEILING_NOT_A_QUOTA
    statement: >
      Executive ProofOfFilm normally should not exceed 150 seconds. If the
      psychological objective is achieved earlier, Quantum should cut earlier.
  PF-007:
    name: MULTIPLE_OSMS_ALLOWED
    statement: >
      ProofOfFilm may contain multiple OhShitMoments when they progressively
      increase understanding, consequence, identity or continuation pressure.
  PF-008:
    name: DO_NOT_SPEND_THE_MAIN_MOVIE
    statement: >
      ProofOfFilm must manage spoiler cost. It should demonstrate payoff quality
      without consuming the most valuable unrecoverable revelation unless doing
      so is explicitly justified.
  PF-009:
    name: PARTIAL_PAYOFF_THEN_LARGER_LOOP
    statement: >
      ProofOfFilm should often prove that the work rewards attention, then leave
      a larger, more valuable question unresolved.
  PF-010:
    name: IDENTITY_MUST_SURVIVE_COMPRESSION
    statement: >
      The short runtime may compress narrative material but may not genericize
      the project's visual, tonal, thematic or character identity.
  PF-011:
    name: EXECUTION_CREDIBILITY_IS_PART_OF_MARKETABILITY
    statement: >
      A viewer evaluating an unrealized project must believe Quantum can actually
      deliver the quality implied by the ProofOfFilm.
  PF-012:
    name: HIGH_PRESENTATION_PROMISE_RAISES_THE_BAR
    statement: >
      Premium packaging or attention capture raises expectations; ProofOfFilm
      must cash that expectation immediately.
  PF-013:
    name: DESIRE_MUST_BE_EARNED
    statement: >
      Artificial confusion, false cliffhangers, random shock and misleading
      project claims may increase raw arousal but fail DesireQuality.
  PF-014:
    name: PASSION_PROJECTS_REMAIN_PASSION_PROJECTS
    statement: >
      Quantum may improve accessibility, framing and presentation but may not
      remove a project's intellectual, thematic or aesthetic reason for existing.
  PF-015:
    name: PROOF_IS_A_COMPILER_TARGET
    statement: >
      ProofOfFilm is a first-class compiler target with typed inputs,
      intermediate representations, QC, lineage and lock semantics.
  PF-016:
    name: PROOF_CAN_PRECEDE_FULL_ANIMATIC
    statement: >
      A high-value project may compile ProofOfFilm before the full work reaches
      full-length animatic lock.
  PF-017:
    name: PROOF_MEDIA_IS_NOT_CANON
    statement: >
      Generated proof footage depicts canonical or explicitly hypothetical
      project semantics. The footage itself does not create World truth.
  PF-018:
    name: MARKETABILITY_IS_MULTIPLICATIVE
    statement: >
      Severe weakness in attention, comprehension, emotional value,
      continuation pressure, distinctiveness, trust, social transmission or
      execution credibility can materially collapse effective marketability.
# =====================================================================
# 3. PROOF OF FILM DEFINITION
# =====================================================================
proof_of_film_definition:
  canonical_name: ProofOfFilm
  definition: >
    A short autonomously produced cinematic artifact whose purpose is to make a
    target viewer want the underlying project to exist, remember its identity and
    strongly desire continuation.
  not_equivalent_to:
    - plot_summary
    - conventional_post_release_trailer
    - random_sizzle_reel
    - montage_of_best_rendered_shots
    - storyboard_reel
    - corporate_promo_video
    - pitch_deck_video
    - feature_synopsis
  characteristic_properties:
    - short
    - intentional
    - cinematic
    - psychologically_programmed
    - project_truthful
    - identity_dense
    - emotionally_efficient
    - spoiler_disciplined
    - memorable
    - continuation_oriented
# =====================================================================
# 4. PROOF VARIANTS
# =====================================================================
proof_variants:
  EXECUTIVE:
    purpose: >
      Make a producer, financier, studio executive, streamer executive or other
      decision-maker want to explore and potentially acquire the project.
    target_runtime_seconds:
      preferred_min: 105
      preferred_max: 150
      default_hard_max: 150
    terminal_action:
      - ENTER_PROJECT
    emphasis:
      - project_identity
      - character_attachment
      - emotional_value
      - distinctiveness
      - premium_execution
      - continuation_pressure
  CONCEPT:
    purpose: >
      Determine whether a project has sufficient cinematic life to justify deeper development.
    target_runtime_seconds:
      preferred_min: 45
      preferred_max: 150
  FEATURE_FRONT_END:
    purpose: >
      Test whether a feature concept deserves the much larger cognitive and
      production investment required for full animatic and feature execution.
    target_runtime_seconds:
      preferred_min: 90
      preferred_max: 150
  FINANCING:
    purpose: >
      Prove concept, tone, scale and execution credibility to capital allocators.
    target_runtime_seconds:
      preferred_min: 90
      preferred_max: 150
  AUDIENCE_TEST:
    purpose: >
      Test intended viewer-state effects before committing to larger project scope.
    target_runtime_seconds:
      derived_from_test_objective: true
  LIVE_ACTION_CONCEPT_SIDE_DOOR:
    purpose: >
      Use Quantum Animation Studio's cinematic generation capabilities to
      demonstrate a live-action-oriented project concept without asserting that
      Quantum currently operates a live-action production company.
    primary_studio_identity_unchanged: true
# =====================================================================
# 5. PROOF SOURCE SET
# =====================================================================
proof_source_set:
  ProofSourceSet:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      source_set_id:
      project_id:
      creative_yaml_ref:
      quantum_studio_yaml_ref:
      CreatorModel_ref:
      AudienceModel_ref:
      ProductMarketModel_ref:
      StoryContract_ref:
      ThemeModel_ref:
      character_refs:
      world_refs:
      StoryPlan_ref:
        nullable: true
      screenplay_ref:
        nullable: true
      SceneSpec_refs:
        nullable: true
      World_revision_ref:
      development_lock_refs:
      asset_refs:
      ProductionIntent_ref:
      SelfModel_revision_ref:
      proof_available_truth_refs:
      unresolved_project_truth_refs:
      creator_locked_spoiler_refs:
      provenance_ref:
      digest:
  requirement: >
    ProofSourceSet resolves exactly what Quantum is allowed to claim, depict,
    infer or represent at the selected project revision.
# =====================================================================
# 6. PROOF CLAIM MODEL
# =====================================================================
proof_claims:
  ProofClaimClass:
    enum:
      - CANONICAL_PROJECT_FACT
      - CANONICAL_CHARACTER_IDENTITY
      - CANONICAL_WORLD_FACT
      - CANONICAL_STORY_EVENT
      - CANONICAL_THEME
      - CREATOR_LOCKED_PROJECT_PROMISE
      - REPRESENTATIVE_NONCANONICAL_STAGING
      - HYPOTHETICAL_BRANCH_STAGING
      - TARGET_VISUAL_INTENT
      - TARGET_SOUND_INTENT
      - PRODUCTION_CAPABILITY_CLAIM
      - COMMERCIAL_PRODUCT_CLAIM
  ProofClaim:
    fields:
      claim_id:
      claim_class:
      statement:
      source_refs:
      authority_refs:
      current_truth_status:
      representation_policy:
      must_be_disclosed_as_representative:
      capability_evidence_refs:
      spoiler_cost:
      risk:
      provenance_ref:
  hard_rules:
    - unsupported_claim_forbidden
    - current_capability_claim_requires_SelfModel_evidence
    - hypothetical_staging_cannot_silently_become_World_canon
    - proof_visual_may_be_aspirational_only_with_truthful_project_intent_support
# =====================================================================
# 7. NONCANONICAL REPRESENTATIVE STAGING
# =====================================================================
representative_staging:
  purpose: >
    Allow ProofOfFilm to demonstrate tone, relationship, world scale or
    cinematic identity through representative scenes that need not become exact
    final-film canon.
  implementation_model:
    preferred: WorldModel_hypothetical_branch
  requirements:
    - fork_from_valid_World_state
    - respect_character_identity
    - respect_world_rules
    - respect_creator_intent
    - do_not_promote_to_canon
    - mark_claim_class
    - preserve_provenance
  principle: >
    Promotional proof may stage a valid possibility without falsely asserting
    that the exact staged event will occur in the final work.
# =====================================================================
# 8. PROOF DIMENSIONS
# =====================================================================
proof_dimensions:
  ProofDimension:
    enum:
      - CONCEPT
      - CHARACTER
      - RELATIONSHIP
      - WORLD
      - TONE
      - CINEMA
      - EMOTION
      - THEME
      - MARKET_IDENTITY
      - ORIGINALITY
      - EXPANSION
      - EXECUTION
  ProofDimensionTarget:
    fields:
      dimension:
      weight:
      minimum_required:
      intended_viewer_effect:
      source_refs:
      success_evidence:
      spoiler_budget:
      confidence:
  principle: >
    ProofOfFilm need not prove every project dimension equally. It must prove
    the dimensions most responsible for making this project desirable.
# =====================================================================
# 9. PROOF OF FILM OBJECTIVE
# =====================================================================
