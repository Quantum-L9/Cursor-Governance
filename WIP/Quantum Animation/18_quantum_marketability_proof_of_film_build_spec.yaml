  ProofOfFilmObjective:
    fields:
      objective_id:
      project_id:
      variant:
      target_viewer_refs:
      immediate:
        attentional_capture:
        concept_legibility:
        perceived_quality:
        project_identity:
      emotional:
        curiosity:
        suspense:
        character_attachment:
        anticipation:
        emotional_investment:
        awe_or_target_emotion:
      cognitive:
        unresolved_tension:
        inference_participation:
        thought_provocation:
        memory_encoding:
        post_viewing_residue:
      commercial:
        differentiation:
        audience_promise:
        market_legibility:
        confidence_in_execution:
        internal_shareability:
        decision_maker_recall:
      continuation:
        desire_to_continue:
        next_scene_need:
        unanswered_question_pressure:
        world_exploration_desire:
        character_fate_concern:
      minimize:
        exposition:
        confusion:
        genericness:
        predictability:
        emotional_flatness:
        spoiler_damage:
        premature_resolution:
        false_promises:
        tonal_misrepresentation:
        production_misrepresentation:
        cognitive_overload:
        arbitrary_mystery:
        trailer_cliche:
      creator_constraints:
      hard_quality_floors:
      confidence:
# =====================================================================
# 10. MARKETABILITY
# =====================================================================
marketability:
  definition: >
    Marketability measures whether the truthful project presentation can earn
    attention, become understood, create emotional value, generate continuation
    pressure, remain distinctive, establish trust, propagate socially and appear
    credibly executable.
  components:
    AttentionCapture:
      range: [0.0, 1.0]
    Comprehension:
      range: [0.0, 1.0]
    EmotionalValue:
      range: [0.0, 1.0]
    ContinuationPressure:
      range: [0.0, 1.0]
    Distinctiveness:
      range: [0.0, 1.0]
    Trust:
      range: [0.0, 1.0]
    SocialTransmission:
      range: [0.0, 1.0]
    ExecutionCredibility:
      range: [0.0, 1.0]
  canonical_equation: >
    Marketability =
      AttentionCapture
      × Comprehension
      × EmotionalValue
      × ContinuationPressure
      × Distinctiveness
      × Trust
      × SocialTransmission
      × ExecutionCredibility
  diagnostic_log_form: >
    MarketabilityLog =
      Σ log(max(epsilon, component_i))
  interpretation:
    multiplicative: true
    reason: >
      A near-zero foundational component should not be hidden by unrelated
      strengths elsewhere.
  not_equivalent_to:
    - creative_quality
    - audience_size
    - franchise_value
    - current_market_trend_alignment
    - generic_commerciality
  creator_boundary: >
    A project may intentionally accept lower broad-market Marketability to
    preserve creator intent. The system should then search for a stronger
    truthful presentation rather than replacing the project.
# =====================================================================
# 11. MARKETABILITY COMPONENT EVIDENCE
# =====================================================================
marketability_component:
  MarketabilityComponent:
    fields:
      component:
      score:
      confidence:
      target_archetype_scores:
      evidence_refs:
      weaknesses:
      strengths:
      critical_failures:
      recommended_repairs:
  hard_noncompensatory_failures:
    - false_project_promise
    - creator_lock_violation
    - severe_accidental_confusion
    - material_execution_misrepresentation
    - genericity_destroying_project_identity
# =====================================================================
# 12. MARKETABILITY EVIDENCE
# =====================================================================
marketability_evidence:
  MarketabilityEvidence:
    extends:
      - 10.EvidenceObject
    fields:
      evidence_id:
      ProofOfFilm_ref:
      target_viewer_refs:
      component_results:
        type: list[MarketabilityComponent]
      canonical_marketability:
      confidence:
      archetype_dispersion:
      weakest_component:
      strongest_component:
      hard_failure_refs:
      viewer_psychodynamics_ref:
      ProductMarketModel_ref:
      CreatorModel_ref:
      QC_run_ref:
      evidence_refs:
      generated_at:
# =====================================================================
# 13. DESIRE QUALITY
# =====================================================================
desire_quality:
  DesireQuality:
    fields:
      organic_to_project:
      earned_by_character:
      causal_grounding:
      emotional_grounding:
      meaning_grounding:
      creator_fidelity:
      project_representativeness:
      anticipated_payoff_truthfulness:
      manipulation_awareness_risk:
      false_promise_risk:
      frustration_risk:
      confusion_risk:
      total_quality:
      confidence:
  conceptual_formula: >
    DesireQuality =
      positive_grounding
      -
      manipulation_risk
      -
      false_promise_risk
      -
      frustration_risk
      -
      confusion_risk
  rule: >
    ProofOfFilm optimization should prefer earned desire over raw arousal.
# =====================================================================
# 14. DESIRE PER SECOND
# =====================================================================
desire_per_second:
  source_curve:
    notation: C(t)
    definition: >
      Predicted ContinuationPressure over ProofOfFilm playback.
  DesirePerSecond:
    abbreviation: DPS
    conceptual_formula: >
      DPS = integral(C(t), t=0..T) / T
    meaning: >
      Average continuation pressure sustained per second of viewer time.
  EarnedDesirePerSecond:
    abbreviation: eDPS
    conceptual_formula: >
      eDPS = integral(C(t) × DesireQuality(t), t=0..T) / T
    meaning: >
      Quality-adjusted continuation desire generated per second.
  DesireGainVelocity:
    abbreviation: DGV
    conceptual_formula: >
      DGV = (C(T) - C(0)) / T
    meaning: >
      Average rate at which continuation pressure increases.
  ExitDesire:
    abbreviation: ED
    conceptual_formula: >
      ED = C(T)
    meaning: >
      Continuation pressure at the exact moment ProofOfFilm cuts.
  EarnedExitDesire:
    abbreviation: eED
    conceptual_formula: >
      eED = C(T) × DesireQuality(T)
  proof_priority:
    - EarnedExitDesire
    - EarnedDesirePerSecond
    - ExitDesire
    - DesirePerSecond
    - DesireGainVelocity
  hard_rule: >
    DPS may never be improved by knowingly degrading project truth, creator
    fidelity, comprehension or DesireQuality.
# =====================================================================
# 15. DESIRE CURVE
# =====================================================================
desire_curve:
  DesireCurve:
    fields:
      curve_id:
      ProofOfFilm_ref:
      archetype_ref:
      samples:
        type: list[DesireCurveSample]
      local_maxima:
      local_minima:
      terminal_value:
      area_under_curve:
      quality_adjusted_area:
      confidence:
  DesireCurveSample:
    fields:
      playback_coordinate:
      continuation_pressure:
      desire_quality:
      earned_continuation_pressure:
      active_loop_refs:
      OSM_ref:
        nullable: true
      dominant_pressure_source:
      confusion:
      frustration:
# =====================================================================
# 16. PROOF TERMINAL STATE
# =====================================================================
terminal_state:
  ProofTerminalStateTarget:
    fields:
      project_identity_understood:
      core_promise_understood:
      at_least_one_attachment_target:
      character_attachment_minimum:
      perceived_originality_minimum:
      perceived_quality_minimum:
      trust_minimum:
      continuation_pressure_minimum:
      earned_continuation_pressure_minimum:
      unresolved_high_value_loop_required:
      memory_anchor_required:
      social_transmission_target:
      execution_credibility_minimum:
      can_retell_project:
      confusion_maximum:
      spoiler_damage_maximum:
  default_executive_semantics:
    state_description: >
      I understand what this is, I care, it feels different, it looks real, and I
      need to know what happens next.
  short_form_terminal_expression: >
    I need the rest.
# =====================================================================
# 17. STOP CONDITION
# =====================================================================
stop_condition:
  ProofStopCondition:
    fields:
      project_identity_established:
      required_proof_dimensions_satisfied:
      attachment_threshold_met:
      execution_credibility_threshold_met:
      comprehension_within_target:
      terminal_loop_open:
      continuation_pressure_in_target_band:
      earned_exit_desire_near_local_maximum:
      spoiler_budget_remaining:
      no_hard_QC_failure:
      runtime_seconds:
      reason:
  canonical_rule: >
    Cut when ProofStopCondition passes. Do not continue merely to reach a nominal runtime.
  executive_default:
    reject_if_runtime_exceeds_seconds: 150
    override_requires:
      - explicit_exception_rationale
      - CreatorModel_compatibility
      - MarketabilityQC_evidence
    normal_behavior:
      - prefer_shorter_if_objective_won
# =====================================================================
# 18. PSYCHOLOGICAL TRAJECTORY
# =====================================================================
proof_trajectory:
  canonical_state_grammar:
    - INTERRUPT
    - ORIENT
    - INTRIGUE
    - ATTACH
    - DESTABILIZE
    - ESCALATE
    - OhShitMoment
    - PARTIAL_SATISFACTION
    - BIGGER_OPEN_LOOP
    - CUT
    - COGNITIVE_AFTERLIFE
  rigid:
    value: false
  ProofPsychologicalTrajectory:
    fields:
      trajectory_id:
      target_archetype_refs:
      entry_state:
      phases:
        type: list[ProofPsychologicalPhase]
      OSM_plan_ref:
      open_loop_plan_ref:
      memory_residue_plan_ref:
      terminal_state_target_ref:
      intended_cut_region:
      confidence:
  ProofPsychologicalPhase:
    fields:
      phase_id:
      operation:
      playback_budget:
      entry_target:
      exit_target:
      proof_dimensions_served:
      required_stimuli:
      optional_stimuli:
      loop_operations:
      OSM_refs:
      sound_music_function:
      failure_conditions:
# =====================================================================
# 19. PROOF BEAT
# =====================================================================
proof_beat:
  ProofBeat:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      beat_id:
      sequence_index:
      duration_budget:
      psychological_operation:
      proof_dimension_refs:
      source_claim_refs:
      character_refs:
      world_refs:
      theme_refs:
      entry_viewer_state_target:
      exit_viewer_state_target:
      information_disclosed:
      information_withheld:
      inference_target:
      open_loop_operations:
      OSM_ref:
        nullable: true
      emotional_target:
      visual_identity_function:
      sound_function:
      memory_target_refs:
      spoiler_cost:
      transition_out:
      provenance_ref:
# =====================================================================
# 20. PROOF BEAT PLAN
# =====================================================================
proof_beat_plan:
  ProofBeatPlan:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: PLAN
    fields:
      plan_id:
      ProofOfFilmIR_ref:
      beats:
        type: list[ProofBeat]
      runtime_budget:
      psychological_trajectory_ref:
      OSM_plan_ref:
      open_loop_plan_ref:
      spoiler_budget_ref:
      memory_residue_plan_ref:
      cumulative_proof_dimension_coverage:
      cumulative_spoiler_cost:
      terminal_state_projection:
      plan_version:
      provenance_ref:
      digest:
# =====================================================================
# 21. PROOF OSM PLAN
# =====================================================================
proof_OSM_plan:
  ProofOSMPlan:
    fields:
      plan_id:
      candidate_OSMs:
      selected_OSM_refs:
      sequence_ref:
      cumulative_spoiler_cost:
      escalation:
      redundancy:
      processing_window_refs:
      terminal_OSM_ref:
        nullable: true
      fallback_if_OSM_fails:
      evidence_refs:
  selection_objective: >
    Maximize meaningful rapid revaluation and continuation-pressure gain subject
    to fairness, comprehension, project truth and spoiler budget.
  hard_rules:
    - fixed_OSM_count_forbidden
    - multiple_OSMs_allowed
    - shock_without_understood_consequence_not_OSM
    - terminal_OSM_should_normally_raise_continuation_pressure
# =====================================================================
# 22. OPEN LOOP PLAN
# =====================================================================
proof_open_loops:
  ProofOpenLoopPlan:
    fields:
      plan_id:
      opening_loop_refs:
      intermediate_loop_refs:
      partial_payoff_refs:
      terminal_loop_refs:
      intentionally_closed_refs:
      intentionally_unresolved_refs:
      cognitive_load_budget:
      payoff_trust_target:
      terminal_pressure_target:
      evidence_refs:
  desired_pattern: |
    meaningful question
       ↓
    investment
       ↓
    partial satisfaction
       ↓
    larger implication
       ↓
    bigger open loop
       ↓
    cut
# =====================================================================
# 23. SPOILER BUDGET
# =====================================================================
spoiler_policy:
  SpoilerBudget:
    fields:
      budget_id:
      protected_reveal_refs:
      reveal_costs:
      maximum_total_cost:
      maximum_single_reveal_cost:
      final_project_value_at_risk:
      creator_locked_spoilers:
      selected_reveal_cost:
      remaining_budget:
      confidence:
  ProofRevealPolicy:
    fields:
      policy_id:
      may_reveal:
      may_hint:
      must_withhold:
      may_recontextualize_without_full_truth:
      proxy_payoff_allowed:
      creator_lock_refs:
      target_surprise_preservation:
      rewatch_preservation:
      evidence_refs:
  rule: >
    ProofOfFilm should prove that Quantum can deliver powerful revelation
    without automatically spending the project's most valuable reveal.
# =====================================================================
# 24. FAMILIARITY / DIFFERENTIATION TARGET
# =====================================================================
proof_familiarity_differentiation:
  source:
    spec: 17.FamiliarityDifferentiationEnvelope
  ProofFamiliarityDifferentiationTarget:
    fields:
      source_envelope_ref:
      cognitive_access_dimensions:
      signature_novelty_dimensions:
      familiar_emotional_anchor_refs:
      familiar_narrative_grammar_refs:
      differentiated_world_refs:
      differentiated_concept_refs:
      differentiated_visual_refs:
      differentiated_character_refs:
      genericity_threshold:
      cognitive_access_floor:
      evidence_refs:
  principle: >
    The proof should make the unfamiliar enterable without making it ordinary.
# =====================================================================
# 25. MEMORY RESIDUE PLAN
# =====================================================================
proof_memory_residue:
  source:
    spec: 17.MemoryResiduePlan
  required_for_EXECUTIVE:
    minimum_targets:
      - one_iconic_visual
      - one_character_or_concept_anchor
      - one_unresolved_question_or_consequence
  optional_targets:
    - iconic_line
    - sonic_signature
    - philosophical_paradox
    - object_or_prop
    - unforgettable_reveal
# =====================================================================
# 26. PROOF OF FILM IR
# =====================================================================
proof_IR:
  ProofOfFilmIR:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    authority_class:
      value: DERIVED
    fields:
      proof_id:
      project_id:
      version:
      variant:
      source_set_ref:
      source_revision_refs:
      CreatorModel_ref:
      AudienceModel_ref:
      ProductMarketModel_ref:
      ViewerExperienceProgram_ref:
      ProductionIntent_ref:
      SelfModel_revision_ref:
      target_viewer_refs:
      target_runtime_seconds:
      hard_runtime_max_seconds:
        nullable: true
      objective_ref:
      proof_dimension_targets:
      initial_viewer_state_target:
      terminal_viewer_state_target_ref:
      psychological_trajectory_ref:
      open_loop_plan_ref:
      OSM_plan_ref:
      spoiler_budget_ref:
      familiarity_differentiation_target_ref:
      memory_residue_plan_ref:
      cognitive_afterlife_target_ref:
      proof_claim_refs:
      selected_character_refs:
      selected_world_refs:
      selected_theme_refs:
      visual_identity_contract_ref:
      sound_identity_contract_ref:
      dialogue_policy:
      music_policy:
      beat_plan_ref:
        nullable: true
      QC_contract_ref:
      provenance_ref:
      digest:
  immutable_version:
    value: true
# =====================================================================
# 27. PROOF SHOT INTENT
# =====================================================================
proof_shot_intent:
  ProofShotIntent:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      proof_shot_intent_id:
      ProofBeat_ref:
      source_claim_refs:
      desired_viewer_effect_contract_ref:
      character_refs:
      world_or_branch_ref:
      desired_composition:
      desired_performance:
      information_purpose:
      emotional_purpose:
      OSM_function:
        nullable: true
      open_loop_function:
      visual_identity_function:
      sound_function:
      duration_target:
      continuity_requirements:
      production_quality_tier:
      provenance_ref:
  lowering:
    preferred_target:
      spec: 12.ShotSpec
    rule: >
      ProofShotIntent lowers into standard cinematic ShotSpec semantics rather
      than creating an unrelated production grammar.
# =====================================================================
# 28. WORLD / BRANCH LOWERING
# =====================================================================
world_lowering:
  canonical_story_shot:
    coordinate:
      canonical_branch: true
  representative_noncanonical_shot:
    coordinate:
      hypothetical_branch: true
  rule: >
    Every proof shot requiring fictional state must resolve against an exact
    WorldCoordinate or explicit hypothetical branch so character identity,
    physical state, rules and causality remain testable.
  promotion:
    proof_branch_to_canon:
      automatic: false
# =====================================================================
# 29. ANIMATIC INTEGRATION
# =====================================================================
proof_animatic:
  principle: >
    ProofOfFilm should solve timing, comprehension, OSM sequencing,
    psychological trajectory and edit rhythm cheaply before expensive final proof rendering.
  lowering_pipeline:
    - ProofOfFilmIR
    - ProofBeatPlan
    - ProofShotIntent
    - 12.ShotSpec
    - 12.AnimaticTimeline
    - viewer_psychodynamic_simulation
    - MarketabilityQC_preflight
    - proof_animatic_lock_or_internal_checkpoint
    - ProductionModel
    - ProductionEngine
  reuse:
    story_animatic_compiler: true
    separate_unrelated_animatic_runtime: false
# =====================================================================
# 30. AUDIO / MUSIC ROLE
# =====================================================================
proof_audio:
  principle: >
    ProofOfFilm viewer-state programming includes sound as a primary mechanism,
    not decorative finishing.
  sound_functions:
    - attention_capture
    - scale
    - suspense
    - emotional_attachment
    - OSM_punctuation
    - cognitive_processing_space
    - world_identity
    - memory_residue
    - terminal_cut_pressure
  music_functions:
    - expectation
    - modulation
    - emotional_accumulation
    - false_resolution
    - escalation
    - silence_before_OSM
    - terminal_unresolved_energy
  rule: >
    Music may amplify viewer state but may not compensate for absent narrative
    or character grounding.
# =====================================================================
# 31. DIALOGUE / EXPOSITION
# =====================================================================
proof_dialogue:
  objective:
    minimize_unnecessary_exposition: true
  preferred:
    - character_revealing_dialogue
    - conflict
    - emotionally_loaded_information
    - iconic_line
    - subtext
    - compressed_but_natural_world_information
  weak:
    - pitch_deck_voiceover
    - explaining_entire_world
    - saying_the_hook_after_showing_it
    - feature_summary_narration
    - corporate_hype_language
  hard_question: >
    Can this information be understood more powerfully through image, action,
    reaction, sound or inference?
# =====================================================================
# 32. EXECUTIVE VIEWER LENS
# =====================================================================
executive_viewer:
  purpose: >
    Model the dual response of a viewer who is simultaneously a human audience
    member and a professional evaluator of entertainment opportunity.
  ExecutiveViewerLens:
    fields:
      target_viewer_ref:
      concept_understood_quickly:
      personal_entertainment_value:
      project_identity:
      genericity_risk:
      protagonist_or_character_registers:
      emotional_proposition:
      imaginable_audience:
      perceived_scope:
      perceived_upside:
      perceived_execution_quality:
      perceived_execution_credibility:
      internal_retellability:
      internal_forwarding_impulse:
      desire_to_enter_project:
      professional_risk:
      confidence:
  important_questions:
    - "Did I understand what kind of project this is?"
    - "Did something feel genuinely new?"
    - "Do I care about somebody or something?"
    - "Can I imagine an audience for it?"
    - "Does this look premium?"
    - "Does this feel executable?"
    - "Can I explain it to another executive?"
    - "Do I want the next three minutes?"
# =====================================================================
# 33. GATEKEEPER BOUNDARY
# =====================================================================
gatekeeper_boundary:
  note: >
    GatekeeperViewerModel and physical attention capture belong to future spec 19.
  ProofOfFilm_requirement: >
    If a gatekeeper becomes the first ProofOfFilm viewer, the film should remain
    capable of producing enough identity, legitimacy and continuation desire to
    motivate upward transmission.
# =====================================================================
# 34. NEXT ACTION PROBABILITY
# =====================================================================
next_action_probability:
  NextActionProbability:
    fields:
      estimate_id:
      ProofOfFilm_ref:
      target_viewer_ref:
      action:
        enum:
          - ENTER_PROJECT
          - VIEW_CHARACTERS
          - VIEW_WORLD
          - VIEW_COMMERCIAL_OPPORTUNITY
          - FORWARD_INTERNALLY
          - REQUEST_LEGAL_REVIEW
          - OTHER
      probability:
      calibration_confidence:
      evidence_refs:
      model_version:
  principle: >
    NextActionProbability is a calibrated decision-support estimate, not a
    magical certainty about an executive's behavior.
# =====================================================================
# 35. PROOF COMPILER
# =====================================================================
proof_compiler:
  canonical_name: ProofOfFilmCompiler
  pipeline:
    P01_ResolveProofSourceSet:
      output:
        - ProofSourceSet
    P02_ResolveTargetViewers:
      output:
        - target ViewerArchetypes
        - optional ExecutiveViewerLens
    P03_ResolveProofObjective:
      output:
        - ProofOfFilmObjective
    P04_SelectProofDimensions:
      output:
        - ProofDimensionTargets
    P05_CompileViewerExperienceProgram:
      delegates_to:
        - 17_quantum_viewer_cognition_psychology_build_spec.yaml
    P06_MineProjectIdentity:
      inputs:
        - ProductIdentityModel
        - CreatorModel
        - character/world/theme
      output:
        - identity_evidence
    P07_MineOpenLoops:
      output:
        - ProofOpenLoopPlan
    P08_MineOSMCandidates:
      output:
        - OSM_candidates
    P09_SelectOSMSequence:
      output:
        - ProofOSMPlan
    P10_CompileSpoilerBudget:
      output:
        - SpoilerBudget
        - ProofRevealPolicy
    P11_CompileFamiliarityDifferentiation:
      output:
        - ProofFamiliarityDifferentiationTarget
    P12_CompileMemoryResidue:
      output:
        - MemoryResiduePlan
    P13_GenerateTrajectoryCandidates:
      output:
        - candidate psychological trajectories
    P14_SimulateViewerResponse:
      output:
        - ViewerPsychodynamicsProjection
        - DesireCurve
        - predicted terminal state
    P15_SelectTrajectory:
      output:
        - selected ProofPsychologicalTrajectory
    P16_CompileProofBeats:
      output:
        - ProofBeatPlan
    P17_CompileProofShotIntents:
      output:
        - ProofShotIntent list
    P18_LowerToShotSpecs:
      delegates_to:
        - 12_quantum_story_animatic_compiler_build_spec.yaml
    P19_GenerateProofAnimatic:
      output:
        - AnimaticTimeline
    P20_PreflightMarketabilityQC:
      output:
        - QCRun
    P21_RepairAnimatic:
      conditional:
        - FAIL
        - UNCERTAIN
    P22_CompileProductionModel:
      delegates_to:
        - 06_quantum_production_model_build_spec.yaml
    P23_ProduceCandidateTakes:
      delegates_to:
        - 08_quantum_production_engine_build_spec.yaml
    P24_AssembleProofCandidate:
      output:
        - ProofOfFilmCandidate
    P25_MarketabilityQC:
      output:
        - QCRun
    P26_TargetedRepair:
      conditional:
        - FAIL
        - UNCERTAIN
    P27_CertifyProofOfFilm:
      output:
        - CertifiedProofOfFilm
    P28_Lock:
      output:
        - proof_of_film.lock
# =====================================================================
# 36. PROOF OF FILM CANDIDATE
# =====================================================================
proof_candidate:
  ProofOfFilmCandidate:
    extends:
      - 10.CandidateArtifact
    object_class:
      value: CANDIDATE_ARTIFACT
    fields:
      ProofOfFilmIR_ref:
      AnimaticTimeline_ref:
      timeline_ref:
      video_blob_ref:
      audio_mix_ref:
      runtime:
      source_claim_refs:
      source_shot_refs:
      production_receipt_refs:
      viewer_projection_refs:
      MarketabilityEvidence_ref:
        nullable: true
# =====================================================================
# 37. CERTIFIED PROOF OF FILM
# =====================================================================
certified_proof:
  CertifiedProofOfFilm:
    extends:
      - 10.CertifiedArtifact
    object_class:
      value: CERTIFIED_ARTIFACT
    requirements:
      - marketability_certificate_ref
      - creative_fidelity_certificate_ref
      - technical_certificate_ref
      - exact_digest
      - source_revision_refs
      - proof_claim_integrity_pass
# =====================================================================
# 38. PROOF OF FILM LOCK
# =====================================================================
proof_lock:
  ProofOfFilmLock:
    extends:
      - 10.LockArtifact
    object_class:
      value: LOCK
    lock_type:
      value: proof_of_film
    fields:
      proof_ref:
      proof_digest:
      ProofOfFilmIR_ref:
      source_revision_refs:
      certificate_refs:
      CreatorModel_ref:
      AudienceModel_ref:
      ProductMarketModel_ref:
      SelfModel_revision_used_for_execution_claims:
      created_at:
      invalidation_conditions:
      unlock_policy:
  downstream_enables:
    - executive_attention_experience
    - QuantumKey_project_experience
    - producer_package
    - financing_package
    - feature_development_go_no_go
  amendment_required:
    target: 10_quantum_canonical_artifact_ir_build_spec.yaml
    action: >
      Add proof_of_film.lock to recognized lock examples when 17–32 are patched
      into the constitutional pack.
# =====================================================================
# 39. MARKETABILITY QC
# =====================================================================
marketability_QC:
  formal_owner:
    spec: 07_quantum_autonomous_qc_build_spec.yaml
  specialized_contract:
    name: ProofOfFilmMarketabilityQCContract
  required_modes:
    - ColdViewer
    - InformedCritic
    - RewatchCritic
    - ProductCritic
  specialized_critics:
    - ProofIdentityCritic
    - ContinuationPressureCritic
    - OSMCritic
    - SpoilerCritic
    - MemoryResidueCritic
    - ExecutionCredibilityCritic
    - CreativeFidelityCritic
    - ExecutiveViewerCritic
  dimensions:
    ATTENTION:
      question: >
        Does the film win and sustain attention quickly enough for this target context?
    COMPREHENSION:
      question: >
        Does the viewer understand enough to form a useful model without excessive exposition?
    EMOTIONAL_VALUE:
      question: >
        Does the viewer actually care, feel or become emotionally invested?
    CONTINUATION:
      question: >
        Does the terminal state produce strong earned desire for more?
    DISTINCTIVENESS:
      question: >
        Could this ProofOfFilm plausibly belong to many unrelated projects?
    TRUST:
      question: >
        Does the proof feel coherent, fair, intentional and truthful?
    SOCIAL_TRANSMISSION:
      question: >
        Would the viewer want another person to experience or discuss this?
    EXECUTION_CREDIBILITY:
      question: >
        Does the proof create justified confidence that Quantum can realize the product?
    OSM:
      question: >
        Do intended OhShitMoments land, remain fair and increase meaning?
    SPOILER:
      question: >
        Has the proof preserved enough of the larger project's unrevealed value?
    MEMORY:
      question: >
        Is meaningful residue predicted after playback ends?
    CREATIVE_FIDELITY:
      question: >
        Is this unmistakably the project the creator intended?
# =====================================================================
# 40. MARKETABILITY QC HARD FAILURES
# =====================================================================
marketability_hard_failures:
  - code: PROOF.FALSE_PROJECT_PROMISE
    severity: CRITICAL
  - code: PROOF.CREATOR_INTENT_VIOLATION
    severity: CRITICAL
  - code: PROOF.MATERIAL_EXECUTION_MISREPRESENTATION
    severity: CRITICAL
  - code: PROOF.CRITICAL_CONFUSION
    severity: CRITICAL
  - code: PROOF.IDENTITY_GENERICIZED
    severity: MAJOR
  - code: PROOF.OSM_UNFAIR
    severity: MAJOR
  - code: PROOF.SPOILER_BUDGET_EXCEEDED
    severity: MAJOR
  - code: PROOF.CONTINUATION_PRESSURE_INSUFFICIENT
    severity: MAJOR
  - code: PROOF.EXECUTIVE_RUNTIME_EXCESSIVE
    severity: MAJOR
  - code: PROOF.PRODUCTION_CLAIM_UNSUPPORTED
    severity: CRITICAL
# =====================================================================
# 41. REPAIR HIERARCHY
# =====================================================================
proof_repair:
  minimum_blast_radius_order:
    - existing_take_selection
    - local_edit
    - shot_duration
    - sound_or_music_adjustment
    - local_shot_rerender
    - reaction_or_performance_adjustment
    - clue_salience_adjustment
    - beat_reorder
    - OSM_trigger_adjustment
    - open_loop_adjustment
    - beat_rewrite
    - coverage_redesign
    - trajectory_recompile
    - source_proof_dimension_reselection
  protected_boundaries:
    - creator_locked_project_semantics
    - canonical_World_truth
    - project_identity
    - protected_spoilers
    - unsupported_capability_claims
# =====================================================================
# 42. PROOF RELEASE THRESHOLD
# =====================================================================
release_threshold:
  principle: >
    Premium physical/commercial delivery should only be authorized after
    ProofOfFilm has earned a sufficiently high evidence-backed quality level.
  ExperienceReleaseReadiness:
    fields:
      proof_QC_PASS:
      marketability_minimums_met:
      creator_fidelity_pass:
      proof_claim_integrity_pass:
      execution_credibility_pass:
      no_critical_violations:
      terminal_desire_target_met:
      lock_exists:
      outcome:
        enum:
          - READY
          - NOT_READY
          - UNCERTAIN
  future_consumer:
    spec: 19_quantum_executive_attention_experience_build_spec.yaml
# =====================================================================
# 43. PROOF OF FILM AND FEATURE PIPELINE
# =====================================================================
feature_pipeline:
  desired_long_term_flow: |
    creative.yaml
        ↓
    development
        ↓
    characters / world / story
        ↓
    ProofOfFilm
        ↓
    "does it have cinematic life?"
        ↓
    MVP
        ↓
    "does the project work at small scale?"
        ↓
    full animatic
        ↓
    "does the complete movie work?"
        ↓
    final feature production
  principle: >
    Massive cognition should precede massive rendering.
# =====================================================================
# 44. LIVE-ACTION CONCEPT SIDE DOOR
# =====================================================================
live_action_side_door:
  current_studio_identity:
    remains: Quantum Animation Studio
  permitted:
    - live_action_style_concept_visualization
    - cinematic_proof
    - producer_ready_project_package
    - story_development
    - concept_art
    - visual_development
    - ProofOfFilm
  not_implied:
    - current_live_action_physical_production_company
    - current_human_cast_or_crew_operation
  purpose: >
    Use the studio's cinematic intelligence to prove and package marketable
    live-action opportunities that may be sold, financed or externally produced.
# =====================================================================
# 45. PROOF PACKAGE HANDOFF
# =====================================================================
experience_handoff:
  downstream_target:
    future_spec: 22_quantum_curated_project_experience_build_spec.yaml
  ProofExperienceEntry:
    fields:
      proof_lock_ref:
      certified_proof_ref:
      project_identity_summary:
      character_entry_refs:
      world_entry_refs:
      theme_entry_refs:
      next_action_target:
      viewer_terminal_state_ref:
      unresolved_terminal_loop_refs:
      memory_residue_refs:
  principle: >
    CuratedProjectExperience begins where ProofOfFilm leaves the viewer,
    preserving continuation rather than resetting the experience.
# =====================================================================
# 46. HOOK BOUNDARY
# =====================================================================
hook_boundary:
  source:
    owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    type: HookModel
  ProofOfFilm_job: >
    Demonstrate the hook through cinema strongly enough that the downstream
    CuratedProjectExperience does not need a separate basic hook explanation.
  canonical_test: >
    If the viewer reaches project exploration still asking "what is the basic
    appeal of this?", ProofOfFilm requires repair.
# =====================================================================
# 47. EXECUTION CREDIBILITY
# =====================================================================
execution_credibility:
  ExecutionCredibilityProjection:
    fields:
      perceived_visual_quality:
      perceived_character_consistency:
      perceived_world_quality:
      perceived_cinematic_control:
      perceived_sound_quality:
      perceived_originality:
      demonstrated_capability_refs:
      SelfModel_support_refs:
      unsupported_claim_risk:
      credibility_score:
      confidence:
  hard_rule: >
    Perceived execution credibility must not exceed what Quantum can truthfully
    support with project artifacts and current capability evidence without
    disclosure of representative/aspirational status.
# =====================================================================
# 48. PROJECT IDENTITY DENSITY
# =====================================================================
identity_density:
  definition: >
    Amount of non-substitutable project identity communicated per second.
  IdentityDensity:
    fields:
      project_specific_visual_information:
      project_specific_character_information:
      project_specific_world_information:
      project_specific_thematic_information:
      project_specific_sound_information:
      generic_content_fraction:
      identity_per_second:
      confidence:
  objective:
    maximize_within_comprehension_limits: true
  anti_pattern:
    generic_premium_spectacle:
      description: >
        Beautiful footage that could belong to many unrelated projects.
# =====================================================================
# 49. PROOF ECONOMY
# =====================================================================
proof_economy:
  principle: >
    ProofOfFilm runtime is scarce. Every beat competes for viewer attention.
  BeatValueDensity:
    fields:
      beat_ref:
      proof_dimensions_served:
      viewer_state_delta:
      identity_value:
      emotional_value:
      continuation_value:
      memory_value:
      spoiler_cost:
