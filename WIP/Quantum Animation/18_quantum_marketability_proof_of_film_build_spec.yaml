architectural_identity:
  concise: >
    Compile a project's strongest truthful cinematic promise into the shortest
    exceptional audiovisual experience capable of establishing identity,
    generating emotional and cognitive investment, proving execution credibility
    and leaving the viewer strongly wanting more.
  extended: >
    Quantum Marketability and ProofOfFilm owns the ProofOfFilm artifact family,
    its semantic IR, compiler, marketability objective, DesirePerSecond metrics,
    proof-dimension strategy, spoiler restraint, multiple OhShitMoment planning,
    terminal continuation-pressure objective and specialized MarketabilityQC
    contract. It consumes CreatorModel, AudienceModel, ProductMarketModel,
    ViewerPsychology, World/story truth, ProductionIntent and live SelfModel
    capability evidence. It does not replace ProductMarketModel, own the
    commercial transaction, or redefine the creative project. ProofOfFilm is a
    cinematic proof designed to make a viewer want the underlying project to
    exist and want to continue experiencing it.
ownership:
  system: MARKETABILITY_PROOF_OF_FILM
  owner_questions:
    primary:
      - "How do we prove this project's value cinematically in approximately two minutes?"
      - "How do we end with the viewer wanting more?"
    secondary:
      - "What must this ProofOfFilm prove?"
      - "Which project dimensions deserve screen time?"
      - "What is the fastest truthful route to project comprehension?"
      - "Which character should the viewer attach to?"
      - "Which parts of the world should be revealed?"
      - "Which questions should remain open?"
      - "Where should the OhShitMoments occur?"
      - "How much information can be revealed without damaging the full project?"
      - "Which familiar grammar should provide cognitive access?"
      - "Which differentiated elements establish identity?"
      - "How much continuation desire is created per second?"
      - "What is continuation pressure at the cut?"
      - "What should remain in memory?"
      - "Is this proof marketable without becoming generic?"
      - "Is the proof truthful to what Quantum can actually deliver?"
  owns:
    - ProofOfFilm
    - ProofOfFilmIR
    - ProofOfFilmObjective
    - ProofDimension
    - ProofSourceSet
    - ProofClaim
    - ProofBeatPlan
    - ProofBeat
    - ProofShotIntent
