# =====================================================================
# 69. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    ProofOfFilm is not a summary. It is proof that the project has cinematic life.
  law_02: >
    ProofOfFilm is a program designed to transform viewer state over approximately
    two minutes, not a collection of impressive shots.
  law_03: >
    Marketability does not mean conventionality.
  law_04: >
    The most psychologically accessible doorway into an original project should
    preserve what makes the project original.
  law_05: >
    Marketability equals AttentionCapture × Comprehension × EmotionalValue ×
    ContinuationPressure × Distinctiveness × Trust × SocialTransmission ×
    ExecutionCredibility.
  law_06: >
    Severe weakness in one foundational Marketability component cannot be hidden
    by unrelated strengths.
  law_07: >
    DesirePerSecond measures how efficiently viewer time produces continuation desire.
  law_08: >
    EarnedDesirePerSecond matters more than raw stimulation.
  law_09: >
    ExitDesire measures the state that matters at the cut.
  law_10: >
    Two and a half minutes is a default upper bound for executive ProofOfFilm,
    not a duration quota.
  law_11: >
    When the viewer already wants more, continuing can reduce value.
  law_12: >
    Multiple OhShitMoments are allowed when they progressively revalue the project.
  law_13: >
    An OhShitMoment should create comprehension plus consequence, not merely shock.
  law_14: >
    Some loops should pay off so the viewer trusts the work; larger loops may remain open.
  law_15: >
    ProofOfFilm should preserve the full project's highest-value unrevealed material
    unless explicit creative strategy justifies spending it.
  law_16: >
    The Hook should be experienced in the ProofOfFilm rather than explained afterward.
  law_17: >
    Beautiful generic footage is a ProofOfFilm failure when project identity disappears.
  law_18: >
    Execution credibility must be supported by what Quantum can actually deliver.
  law_19: >
    Proof footage depicts project semantics; footage does not define canon.
  law_20: >
    Representative promotional staging belongs on an explicit hypothetical branch.
  law_21: >
    Animatic remains the cheap place to discover ProofOfFilm timing and psychological failure.
  law_22: >
    Formal acceptance belongs to AutonomousQC, not the ProofOfFilm generator.
  law_23: >
    A certified ProofOfFilm becomes a stable downstream commercial asset only after
    exact-source lineage, QC and lock.
  law_24: >
    For expensive features, prove cinematic life before spending feature-scale rendering cost.
  law_25: >
    Passion projects are not exempt from marketability; Quantum's job is to find
    the truthful path by which another human mind can enter them.
  law_26: >
    The desired terminal response is not "I understand the pitch."
  law_27: >
    The desired terminal response is "I need the rest."
