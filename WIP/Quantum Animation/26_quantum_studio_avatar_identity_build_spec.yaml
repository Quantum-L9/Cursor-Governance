      payment_confirmation_expression:
      project_reveal_expression:
      silence_policy:
      viewer_question_response_policy:
      listening_animation_policy:
      certificate_ref:
  signature_behavior:
    examples:
      - controlled_pause_before_consequential_information
      - minimal_motion_during_serious_terms
