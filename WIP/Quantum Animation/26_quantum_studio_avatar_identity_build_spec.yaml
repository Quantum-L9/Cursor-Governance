# =====================================================================
# 17. LANGUAGE PROFILE
# =====================================================================
language:
  StudioAvatarLanguageProfile:
    fields:
      profile_id:
      avatar_ref:
      language:
      locale:
      voice_derivative_ref:
      pronunciation_dictionary:
      cultural_expression_policy:
      idiom_policy:
      humor_policy:
      formality:
      rhythm_match_to_core_voice:
      untranslated_brand_terms:
      semantic_fidelity_rules:
      QC_certificate_ref:
      version:
