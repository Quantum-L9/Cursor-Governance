      agreement_ref:
      agreement_version:
      template_ref:
      rendered_document_ref:
      plain_text_ref:
      accessible_HTML_ref:
      PDF_ref:
        nullable: true
      exhibit_refs:
      clause_binding_refs:
      exact_digest:
      generated_at:
      provenance_ref:
  accessibility:
    required:
      - selectable_text
      - semantic_structure
      - readable_on_mobile
      - readable_on_desktop
# =====================================================================
