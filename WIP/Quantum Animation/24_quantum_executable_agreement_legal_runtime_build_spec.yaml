      actions:
        type: list[DeterministicContractAction]
      event_dependencies:
      state_machine_ref:
      objective_trigger_definitions:
      nonautomatable_terms:
      legal_override_rules:
      provenance_ref:
      digest:
  authority:
    subordinate_to_human_readable_legal_record: true
