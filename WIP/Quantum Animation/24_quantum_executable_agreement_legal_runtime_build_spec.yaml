  LegalTemplateRegistry:
    fields:
      registry_id:
      active_template_refs:
      retired_template_refs:
      jurisdiction_index:
      transaction_type_index:
      rights_model_index:
      template_compatibility_rules:
      current_version:
      provenance_ref:
# =====================================================================
# 7. APPROVED LEGAL TEMPLATE
# =====================================================================
template:
  ApprovedLegalTemplate:
    extends:
      - 10.SourceArtifact
    fields:
      template_id:
      template_version:
      title:
      jurisdiction_scope:
      transaction_types:
      product_scope_types:
      rights_models_supported:
      payment_structures_supported:
      reservation_supported:
      electronic_execution_supported:
      template_body_ref:
      clause_registry_refs:
      schedule_templates:
      variable_schema:
      required_exhibits:
      optional_exhibits:
      compatibility_rules:
      approval_ref:
      effective_at:
      retire_at:
        nullable: true
      digest:
# =====================================================================
# 8. LEGAL TEMPLATE APPROVAL
# =====================================================================
template_approval:
  LegalTemplateApproval:
    extends:
      - 10.CertificateArtifact
    fields:
      approval_id:
      template_ref:
      template_digest:
      legal_authority_ref:
      jurisdiction_scope:
      approved_transaction_types:
      approved_rights_models:
      approved_variable_ranges:
      approved_clause_alternatives:
      excluded_uses:
      issued_at:
      review_due_at:
      revoked_at:
        nullable: true
      notes_ref:
      signature_or_attestation_ref:
      provenance_ref:
  AI_may_issue:
    false
# =====================================================================
# 9. TEMPLATE SELECTION
# =====================================================================
template_selection:
  LegalTemplateSelector:
    inputs:
      - ContractReadinessPayload
      - LegalPolicyProfile
      - LegalTemplateRegistry
    output:
      - selected_ApprovedLegalTemplate
      - compatibility_result
  selection_rules:
    - jurisdiction_match
    - transaction_type_match
    - rights_model_match
    - payment_structure_match
    - variable_ranges_authorized
    - template_approval_current
    - no_excluded_use
  no_valid_template:
    result:
      - BLOCK
      - REQUIRES_LEGAL_TEMPLATE_APPROVAL
