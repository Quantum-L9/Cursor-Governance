    - offer_expiration
    - reservation_expiration
    - reservation_credit
    - payment_due_milestone
    - work_authorization_eligibility
    - revision_round_counter
    - acceptance_period_counter
    - deemed_acceptance_if_legally_authorized
    - rights_transfer_trigger_if_objective
    - access_scope_transition
# =====================================================================
