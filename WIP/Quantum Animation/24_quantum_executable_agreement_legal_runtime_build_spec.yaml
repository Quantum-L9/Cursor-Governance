    - SignerAuthorityEvidence
    - ElectronicSignatureRecord
    - SignatureEnvelope
    - AgreementExecutionRecord
    - AgreementExecutionCertificate
    - AgreementAuditTrail
    - LegalRecordRetentionPolicy
