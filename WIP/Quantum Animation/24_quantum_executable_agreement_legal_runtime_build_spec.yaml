    fields:
      binding_id:
      clause_id:
      clause_version:
      source_commercial_field_refs:
      source_legal_policy_refs:
      selected_approved_variant:
      rendered_text_ref:
      semantic_effect:
      machine_rule_refs:
      required:
      legal_authority_ref:
      provenance_ref:
  invariant: >
    Every variable or selectable clause has explicit source and approved range.
# =====================================================================
# 13. AGREEMENT STRUCTURE
# =====================================================================
agreement_structure:
  preferred_order:
    - TITLE_AND_PARTIES
    - TRANSACTION_SUMMARY
    - PRODUCT_AND_DELIVERABLES
    - CONSIDERATION_AND_PAYMENT
    - DELIVERY
    - REVISIONS
    - ACCEPTANCE
    - RIGHTS
    - QUANTUM_RESERVED_RIGHTS
    - CONFIDENTIALITY
    - REPRESENTATIONS_AND_WARRANTIES
    - TERMINATION_OR_EXPIRATION_EFFECTS
    - LIABILITY_AND_REMEDIES_AS_APPROVED
    - DISPUTE_AND_GOVERNING_LAW
    - GENERAL_TERMS
    - SIGNATURES
    - EXHIBITS
  objective:
    concise: true
  arbitrary_page_limit:
    enforced: false
# =====================================================================
# 14. HUMAN READABLE AGREEMENT
# =====================================================================
human_record:
  HumanReadableAgreementRecord:
    extends:
      - 10.CanonicalObject
