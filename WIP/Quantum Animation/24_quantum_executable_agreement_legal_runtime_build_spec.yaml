architectural_identity:
  concise: >
    Compile a locked Quantum commercial offer into a concise, plain-language,
    jurisdiction-aware, immutable, electronically signable and machine-executable
    legal agreement whose exact record can be retained, reproduced, audited and
    safely handed to payment/work-authorization runtime.
  extended: >
    Quantum Executable Agreement and Legal Runtime is the legal representation
    and execution layer of the studio's commercial system. It consumes a locked
    ContractReadinessPayload from spec 23 and selects only from approved legal
    templates compatible with the transaction, rights structure and governing
    legal profile. It compiles one commercial truth into two synchronized
    representations: a human-readable legal instrument and MachineContractIR.
    The human-readable instrument governs legal meaning. MachineContractIR
    encodes only objective, deterministic terms that Quantum is authorized to
    execute automatically. Agreement versions are immutable. Signatures bind to
    exact document digests. Legal reviewers can receive a narrow shareable
    LegalReviewGrant without gaining access to protected creative materials.
    Executed records, exhibits, signature evidence and audit history are
    automatically retained and reproducible. The Quantum Key may become a
    convenient gateway to the agreement record but can never be its only copy.
  legal_philosophy: >
    Reduce legal friction through clarity, approved templates, automation and
    deterministic execution. Do not confuse automation with exemption from law.
ownership:
  system: EXECUTABLE_AGREEMENT_LEGAL_RUNTIME
  owner_question:
    primary: >
      How do the exact locked commercial terms become a validly reviewable,
      signable, immutable and retained legal record without changing their
      commercial meaning?
  secondary_questions:
    - "Which approved legal template applies?"
    - "Which jurisdiction profile applies?"
    - "What transaction type is being documented?"
    - "Do legal clauses exactly represent the CommercialOfferIR?"
    - "What rights are transferred or licensed?"
    - "What Quantum platform rights remain reserved?"
    - "What constitutes electronic execution?"
    - "Who is signing?"
    - "What evidence of signer identity exists?"
    - "What evidence of intent to sign exists?"
    - "What evidence of authority to bind the buyer exists?"
    - "Was the offer still valid when the agreement was executed?"
    - "How can buyer counsel review the agreement?"
    - "Can legal counsel review without access to the creative package?"
    - "How are executed records preserved?"
    - "How can either entitled party reproduce the exact agreement later?"
    - "What parts of the agreement may execute automatically?"
    - "What terms are too subjective or legally consequential for autonomous enforcement?"
    - "What happens when the parties amend an agreement?"
    - "How does a signed agreement hand off to payment runtime?"
  owns:
