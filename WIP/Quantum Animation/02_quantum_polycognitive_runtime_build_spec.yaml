# =====================================================================
# 91. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  architecture:
    - Quantum operates as one runtime with multiple specialized cognitive modules
    - Executive is not a monolithic master agent
    - Executive and Orchestrator have distinct responsibilities
    - no cognitive module directly mutates canonical World State
  signals:
    - WorldSignals reliably enter runtime
    - signal-driven activation replaces full polling
    - salience and attention are distinct from truth
  workspace:
    - modules share active thought through Workspace
    - Workspace is versioned
    - Workspace remains bounded
    - conflicting cognition becomes explicit disagreement
    - staleness is dependency-aware
    - Workspace cannot become World truth
  cognition:
    - named operators deploy under explicit triggers
    - modules can request additional cognition
    - requests require Executive authorization
    - modules can collaborate across domains
  reasoning:
    - reasoning depth is explicit and dynamic
    - trivial decisions stay cheap
    - consequential decisions escalate
    - cascades terminate
    - simulation fidelity increases only when warranted
  concurrency:
    - low-risk work can continue during strategic deliberation
    - independent scopes run concurrently
    - stale results do not silently commit
  decisions:
    - DecisionFrames retain criteria/evidence
    - branches remain counterfactual
    - arbitration respects hard floors
    - QC remains acceptance authority
    - CommitManager routes through owner-specific commit APIs
  learning:
    - every major decision yields CognitiveTrace
    - operator experiences record contextual outcomes
    - reasoning-depth experiences record regret/cost
    - optional operator policy learns contextual utility
    - shadow cognition supports exploration
    - policies cannot self-promote
    - mandatory correctness operators remain mandatory
  autonomy:
    - WorldSignal may initiate a multi-domain cognitive cascade with no human routing
    - cascade may autonomously raise reasoning depth
    - multiple cognitive faculties jointly produce a selected action
    - the action can be simulated, QC'd and committed without direct human orchestration
    - subsequent outcomes become learning evidence
  release:
    requirement: >
      PCG-01 through PCG-20 pass, PCW11 exit conditions pass, and World Model,
      SelfModel and AutonomousQC minimum contracts required by enabled features
      are available.
# =====================================================================
# 92. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  identity: >
    Quantum Animation Agent is one persistent intelligence with specialized
    cognitive subsystems sharing one persistent reality model.
  executive: >
    CognitiveExecutive decides what deserves thought, what kind of thought,
    and how much thought.
  orchestration: >
    ExecutionOrchestrator executes approved cognition reliably and concurrently.
  working_memory: >
    CognitiveWorkspace is Quantum's active mind, not its fictional reality.
  signals: >
    WorldSignals and adjacent runtime signals form the nervous system through
    which relevant change reaches attention.
  cognition: >
    Specialized cognitive modules are faculties, not autonomous truth owners.
  cascade: >
    Cognition may trigger more cognition through bounded, Executive-governed
    cognitive cascades.
  reasoning_depth: >
    Quantum thinks harder when consequence, uncertainty, novelty or blast radius
    justify the additional cost.
  efficiency: >
    Familiarity permits cognitive efficiency; novelty buys more thought.
  simulation: >
    Consequential alternatives are explored counterfactually before canonical
    action when expected value justifies simulation.
  authority: >
    Cognition proposes. Owning systems validate and commit.
  learning: >
    Quantum learns not only how to make films, but how much to think, which kind
    of thinking works, and which cognitive faculties should collaborate under
    different conditions.
  autonomy: >
    True autonomy is not an agent completing a workflow. It is Quantum
    continuously noticing what matters, allocating appropriate cognition,
    integrating specialized faculties, simulating consequences, acting through
    governed reality, observing outcomes and learning how to think better.
  north_star: >
    One intelligence.
    Specialized cognitive subsystems.
    Shared persistent reality.
    Adaptive reasoning depth.
    Concurrent high-velocity operation.
    Evidence-bearing action.
    Continuous learning.

This makes 02 the actual control plane of the “Quantum Animation Agent” rather than another agent specification. The clean seam is now:

01 WORLD MODEL
"What is true?"
        ↓ WorldSignals / Context / Opportunities / Branches
02 POLYCOGNITIVE RUNTIME
"What deserves thought?"
"Which faculties should think?"
"How deeply?"
"What should we select?"
        ↓ selected evidence-backed proposal
AUTONOMOUS QC
"Is it acceptable?"
        ↓
COMMIT / DOMAIN OWNER
"Make the accepted decision real."

And the learning loop closes at the level we wanted:

signals
  ↓
operators chosen
  ↓
cognitive cascade
  ↓
decision
  ↓
simulation
  ↓
artifact / World consequence
  ↓
QC + creator outcome + repair cost
  ↓
CognitiveTrace
  ↓
OperatorExperience / ReasoningExperience
  ↓
learn which thinking is valuable
  ↓
better Executive policy

That is the piece that lets Quantum become progressively better not merely at generating media, but at allocating its own intelligence.
