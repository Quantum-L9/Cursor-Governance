# =====================================================================
# 8. COGNITIVE SCOPE
# =====================================================================
cognitive_scope:
  purpose: >
    Bound what a cognitive operation may inspect, reason about, propose changing
    and invalidate.
  CognitiveScope:
    fields:
      scope_id:
        required: true
      kind:
        type: ScopeKind
      parent_scope_id:
        nullable: true
      world_coordinate:
        type: WorldCoordinate
      universe_id:
      continuity_id:
      branch_id:
      story_refs:
        type: list[Ref]
      entity_refs:
        type: list[Ref]
      artifact_refs:
        type: list[Ref]
      production_refs:
        type: list[Ref]
      read_planes:
        type: list[string]
      read_model_views:
        type: list[string]
      proposal_domains:
        type: list[string]
      isolation:
        type: IsolationMode
      mutation_ceiling_rank:
        type: integer
      start_coordinate:
        nullable: true
      end_coordinate:
        nullable: true
      concurrency_keys:
        type: list[string]
      dependency_keys:
        type: list[string]
  principles:
    read_scope_may_exceed_proposal_scope:
      value: true
    example: >
      Character cognition may read an entire character history while only
      proposing interpretation for one scene.
    no_scope:
      behavior: reject_invocation
  use_cases:
    - authority enforcement
    - context compilation
    - concurrency
    - conflict detection
    - staleness invalidation
    - cache key construction
    - blast-radius estimation
# =====================================================================
# 9. AUTHORITY ENVELOPE
# =====================================================================
authority_envelope:
  AuthorityEnvelope:
    fields:
      envelope_id:
      granted_to:
        description: module/implementation/runtime identity
      allowed_domains:
        type: list[CognitiveDomain]
      allowed_scope_kinds:
        type: list[ScopeKind]
      allowed_read_views:
        type: list[string]
      allowed_operator_ids:
        type: list[string]
      allowed_proposal_domains:
        type: list[string]
      protected_refs:
        type: list[Ref]
      creator_lock_refs:
        type: list[Ref]
      maximum_authority_rank:
        type: integer
      may_create_hypothetical_branches:
        type: bool
      may_request_cross_domain_cognition:
        type: bool
      may_propose_world_events:
        type: bool
      may_propose_artifact_changes:
        type: bool
      may_propose_production_changes:
        type: bool
      may_request_commit:
        type: bool
      may_commit_world_state:
        value: false
      may_self_modify_policy:
        value: false
      expires_at:
        nullable: true
  enforcement:
    layers:
      - invocation creation
      - context projection
      - result validation
      - proposal creation
      - arbitration
      - commit validation
  invariant: >
    Shared perception and intelligence never imply unrestricted write authority.
# =====================================================================
# 10. COGNITIVE MODULE
# =====================================================================
cognitive_module:
  definition: >
    A specialized cognitive faculty exposing typed reasoning operators.
    A module is not a persistent personality and does not own canonical memory.
  CognitiveModuleSpec:
    fields:
      module_id:
      version:
      domain:
        type: CognitiveDomain
      description:
      operators:
        type: list[ReasoningOperatorSpec]
      signal_subscriptions:
        type: list[SignalSubscription]
      supported_scopes:
        type: list[ScopeKind]
      required_world_views:
        type: list[string]
      optional_world_views:
        type: list[string]
      required_adjacent_views:
        type: list[string]
      optional_adjacent_views:
        type: list[string]
      memory_classes:
        type: list[string]
      authority_envelope_id:
      supports_parallel_execution:
        type: bool
      stateless_between_invocations:
        default: true
      implementation_selection:
        enum:
          - fixed
          - capability_routed
          - policy_routed
      determinism_possible:
        type: bool
  CognitiveModule:
    protocol:
      - spec()
      - execute(invocation, context) -> CognitiveResult
    forbidden:
      - direct canonical state mutation
      - private ungoverned persistent memory
      - spawning modules directly
      - bypassing Executive
      - bypassing AuthorityEnvelope
  principle: >
    Cognition means reasoning capability, not necessarily an LLM call.
