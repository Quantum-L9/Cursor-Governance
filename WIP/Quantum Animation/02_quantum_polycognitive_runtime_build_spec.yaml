# =====================================================================
# 12. COGNITIVE MODULE IMPLEMENTATIONS
# =====================================================================
module_implementation_model:
  principle: >
    CognitiveModule and ReasoningOperator are semantic capabilities, not hard
    bindings to one model/provider.
  CognitiveModuleImplementation:
    fields:
      implementation_id:
      implementation_version:
      module_id:
      supported_operator_ids:
      implementation_type:
        enum:
          - deterministic
          - exact_graph_query
          - semantic_retrieval
          - small_language_model
          - reasoning_model
          - multimodal_model
          - classifier
          - optimizer
          - simulator
          - hybrid
      provider_ref:
        nullable: true
      model_ref:
        nullable: true
      tool_refs:
        type: list[string]
      required_self_capabilities:
        type: list[string]
      supported_reasoning_levels:
        type: list[ReasoningLevel]
      observed_quality_profile_ref:
        nullable: true
      cost_profile_ref:
        nullable: true
      latency_profile_ref:
        nullable: true
      context_limits:
        type: map
      active:
        type: bool
  invariant: >
    New models/tools may be introduced through implementation registration
    without redefining the semantic cognitive architecture.
# =====================================================================
# 13. MODULE / OPERATOR REGISTRIES
# =====================================================================
registries:
  CognitiveModuleRegistry:
    responsibilities:
      - register versioned module specs
      - resolve module by domain
      - enumerate available operators
      - enforce compatibility
      - reject unknown versions
      - expose implementation candidates
  ReasoningOperatorRegistry:
    responsibilities:
      - register operator semantics
      - version trigger definitions
      - maintain ontology/tags
      - distinguish mandatory vs learnable operators
      - resolve output schema
      - expose evaluation/calibration metadata
  compatibility:
    - module spec version pins operator versions
    - invocation pins module and operator versions
    - policy decisions record versions
    - historical traces remain replayable at contract level
# =====================================================================
# 14. REASONING OPERATOR
# =====================================================================
reasoning_operator:
  ReasoningOperatorSpec:
    fields:
      operator_id:
      version:
      domain:
        type: CognitiveDomain
      description:
      semantic_question:
        example: >
          Which active desire is currently blocked and by what?
      activation_class:
        type: OperatorActivationClass
      supported_scopes:
        type: list[ScopeKind]
      minimum_reasoning_level:
        type: ReasoningLevel
      trigger:
        signal_types_any:
          type: list[string]
        signal_types_all:
          type: list[string]
        world_predicates:
          type: list[string]
        workspace_predicates:
          type: list[string]
        minimum_salience:
          type: float
        minimum_uncertainty:
          type: float
        minimum_blast_radius:
          type: float
      required_world_views:
        type: list[string]
      required_workspace_views:
        type: list[string]
      required_adjacent_views:
        type: list[string]
      optional_memory_views:
        type: list[string]
      required_tools:
        type: list[string]
      output_contract:
      evidence_requirement:
        enum:
          - none
          - preferred
          - mandatory
      may_request_domains:
        type: list[CognitiveDomain]
      may_create_hypothetical_branch:
        type: bool
      side_effect_free:
        value: true
      cacheable:
        type: bool
      correctness_critical:
        type: bool
      learnable_selection:
        type: bool
      stop_conditions:
        type: list[string]
      resource_profile:
        expected_cost_class:
        expected_latency_class:
        parallelizable:
        recommended_context_budget:
      tags:
        type: list[string]
  selection_rule:
    mandatory:
      - invariant operators
      - triggered mandatory operators
    learned_policy_eligible:
      - optional_triggered
      - exploratory
# =====================================================================
# 15. WORLD SIGNAL INGRESS
# =====================================================================
signal_ingress:
  WorldSignal:
    owner: WORLD_MODEL
    imported: true
  WorldSignalBus:
    owner: POLYCOGNITIVE_RUNTIME
    purpose: >
      Deliver revision-tagged WorldSignals to attention/executive consumers.
    responsibilities:
      - receive signals
      - partition by universe/continuity/scope
      - deduplicate
      - preserve source revision
      - fan out to subscribers
      - track acknowledgement
      - expose replay cursor
      - preserve at-least-once semantics where transport requires
    does_not:
      - determine salience
      - mutate World State
      - choose cognitive operators
  SignalSubscription:
    fields:
      subscription_id:
      consumer_id:
      signal_types:
      minimum_source_confidence:
      scope_kinds:
      partition_keys:
  SignalIngressEnvelope:
    purpose: >
      Normalize signals from multiple authoritative adjacent systems without
      pretending all of them are WorldSignals.
    fields:
      envelope_id:
      source_system:
        enum:
          - world_model
          - self_model
          - production_model
          - autonomous_qc
          - creator_feedback
          - audience_product_intelligence
          - artifact_pipeline
      source_signal_ref:
      semantic_type:
      scope_ref:
      metrics:
        salience_hint:
        urgency:
        confidence:
        novelty:
        downstream_impact:
      evidence_refs:
      source_revision:
  important_rule: >
    WorldSignals remain first-class world-derived signals. External signal
    envelopes do not get mislabeled as fictional WorldSignals.
# =====================================================================
# 16. ATTENTION TARGET
# =====================================================================
attention_model:
  AttentionTarget:
    fields:
      target_id:
      ref:
        type: Ref
      scope_id:
      source_signal_ids:
        type: list[string]
      salience:
        range: [0.0, 1.0]
      urgency:
        range: [0.0, 1.0]
      novelty:
        range: [0.0, 1.0]
      consequence:
        range: [0.0, 1.0]
      reason:
      pinned:
        type: bool
      decay_rate:
        type: float
      created_at:
      last_reinforced_at:
      expires_at:
        nullable: true
  examples:
    - high-impact blocked protagonist goal
    - new knowledge asymmetry
    - major production capability degradation
    - high-confidence NarrativeOpportunity
    - unresolved critic disagreement
    - strategic branch decision
# =====================================================================
# 17. SALIENCE POLICY
# =====================================================================
salience_policy:
  purpose: >
    Decide what deserves active cognitive attention without confusing
    importance with truth.
  SalienceContext:
    fields:
      objective_stack:
      active_scope:
      current_attention:
      active_signals:
      current_decisions:
      workspace_uncertainty:
      reasoning_level:
      available_budget:
  SaliencePolicy:
    protocol:
      - score_signal(signal, context)
      - score_target(target, context)
      - rank_targets(targets, context)
      - decay(targets, elapsed)
      - enforce_attention_floors(targets)
  baseline_features:
    - objective_relevance
    - causal_proximity
    - active_intent_relevance
    - emotional_relevance
    - relationship_relevance
    - unresolved_promise_relevance
    - creator_importance
    - audience_experience_importance
    - product_impact
    - physical_temporal_proximity
    - production_risk
    - novelty
    - uncertainty
    - downstream_blast_radius
  anti_pathologies:
    - critical hard signals cannot decay below floor while unresolved
    - novelty alone cannot dominate permanent importance
    - frequent low-value signals may be suppressed
    - old dormant threads may reactivate when graph convergence increases
    - attention starvation detection required
  learning:
    learnable: true
    promotion_gated: true
    hard_attention_floors_not_learnable_away: true
# =====================================================================
# 18. COGNITIVE WORKSPACE
# =====================================================================
cognitive_workspace:
  definition: >
    Quantum's active working memory and shared cognitive blackboard.
  classification:
    canonical_world_truth: false
    ephemeral: true
    versioned: true
    reconstructable: true
    directly_world_mutating: false
  CognitiveWorkspace:
    fields:
      workspace_id:
      revision:
      state:
        type: WorkspaceState
      world_revision_ref:
      creator_model_version_ref:
        nullable: true
      audience_model_version_ref:
        nullable: true
      product_market_model_version_ref:
        nullable: true
      self_model_revision_ref:
        nullable: true
      production_model_revision_ref:
        nullable: true
      objective_stack:
        type: list[ObjectiveFrame]
      active_scope_ids:
        type: list[string]
      attention_targets:
        type: list[AttentionTarget]
      active_signal_refs:
        type: list[Ref]
      salient_entity_refs:
        type: list[Ref]
      salient_fact_refs:
        type: list[Ref]
      salient_intent_refs:
        type: list[Ref]
      salient_relationship_refs:
        type: list[Ref]
      salient_promise_refs:
        type: list[Ref]
      narrative_opportunity_refs:
        type: list[Ref]
      hypotheses:
        type: list[Hypothesis]
      assumptions_under_test:
        type: list[Assumption]
      open_questions:
        type: list[OpenQuestion]
      evidence_graph:
        type: CognitiveEvidenceGraph
      proposal_refs:
        type: list[Ref]
      branch_portfolio_refs:
        type: list[Ref]
      decision_frames:
        type: list[DecisionFrame]
      cognitive_result_refs:
        type: list[Ref]
      pending_cognitive_requests:
        type: list[CognitiveRequest]
      disagreements:
        type: list[CognitiveDisagreement]
      staleness_records:
        type: list[StalenessRecord]
      current_reasoning_level:
        type: ReasoningLevel
      uncertainty:
        range: [0.0, 1.0]
      confidence:
        range: [0.0, 1.0]
      budget_ledger:
        type: BudgetLedger
      stopping_conditions:
        type: list[StoppingCondition]
      active_trace_ids:
        type: list[string]
      created_at:
      updated_at:
  invariant: >
    Workspace state is a temporary interpretation of the current problem, not a
    second World Model.
# =====================================================================
# 19. WORKSPACE SUPPORT TYPES
# =====================================================================
workspace_support_types:
  ObjectiveFrame:
    fields:
      objective_id:
      objective_type:
      description:
      priority:
      scope_ref:
      parent_objective_id:
        nullable: true
      source_ref:
      status:
        enum:
          - active
          - satisfied
          - blocked
          - deferred
          - abandoned
  Hypothesis:
    fields:
      hypothesis_id:
      statement:
      probability:
      evidence_for:
      evidence_against:
      dependencies:
      created_by_result_id:
      status:
        enum:
          - active
          - strengthened
          - weakened
          - resolved
          - rejected
          - stale
  Assumption:
    fields:
      assumption_id:
      statement:
      confidence:
      source:
      validation_required:
      dependency_refs:
      status:
  OpenQuestion:
    fields:
      question_id:
      question:
      importance:
      uncertainty:
      relevant_refs:
      requested_domains:
      status:
        enum:
          - open
          - investigating
          - resolved
          - deferred
          - stale
  CognitiveEvidenceNode:
    fields:
      node_id:
      ref:
      evidence_type:
      confidence:
  CognitiveEvidenceEdge:
    fields:
      edge_id:
      source_node_id:
      target_node_id:
      relation:
        enum:
          - SUPPORTS
          - CONTRADICTS
          - DEPENDS_ON
          - DERIVED_FROM
          - CONTRIBUTED_TO
          - INVALIDATES
      weight:
  CognitiveEvidenceGraph:
    fields:
      nodes:
      edges:
      graph_digest:
  StalenessRecord:
    fields:
      object_ref:
      dependency_refs:
      stale:
      changed_dependency_refs:
      detected_at_revision:
      recomputation_required:
  BudgetLedger:
    fields:
      allocated_compute_units:
      consumed_compute_units:
      operator_calls_used:
      cross_domain_requests_used:
      simulations_used:
      cognitive_jobs_started:
      cognitive_jobs_completed:
      retrieval_units_used:
      latency_consumed_ms:
  StoppingCondition:
    fields:
      condition_id:
      type:
      threshold:
      satisfied:
      evidence_refs:
# =====================================================================
# 20. WORKSPACE VIEW
# =====================================================================
workspace_view:
  purpose: >
    Provide each cognitive module only the active thought relevant to its domain,
    scope and authority envelope.
  WorkspaceView:
    fields:
      workspace_id:
      workspace_revision:
      scope:
      objective_stack:
      attention_targets:
      signals:
      salient_refs:
      hypotheses:
      open_questions:
      relevant_decisions:
      relevant_proposals:
      relevant_results:
      relevant_disagreements:
      evidence_subgraph:
      uncertainty:
      reasoning_level:
      omissions:
      view_hash:
  rule: >
    Cognitive modules should almost never receive the entire Workspace.
# =====================================================================
# 21. WORKSPACE PATCH
# =====================================================================
workspace_patch:
  MergePolicy:
    - append
    - replace
    - upsert
    - max
    - min
    - increment
    - remove
    - resolve
  WorkspacePatchOperation:
    fields:
      op:
        type: MergePolicy
      collection:
      key:
        nullable: true
      value:
        nullable: true
      expected_value_digest:
        nullable: true
  WorkspacePatch:
    fields:
      patch_id:
      workspace_id:
      based_on_revision:
      operations:
      conflict_keys:
      dependency_refs:
      created_by_result_id:
      idempotency_key:
      created_at:
  application:
    - verify based_on_revision
    - inspect conflict keys
    - merge non-conflicting operations
    - preserve disagreements rather than overwrite contradictory claims
    - increment workspace revision
    - compute resulting digest
  forbidden:
    - direct World Model patch
    - silent conflict overwrite
# =====================================================================
# 22. WORKSPACE SERVICE
# =====================================================================
workspace_service:
  WorkspaceService:
    protocol:
      - create(objective, initial_scope, world_revision)
      - get(workspace_id)
      - project(workspace_id, scope, module_spec)
      - apply_patch(patch)
      - mark_stale(changed_refs)
      - close(workspace_id)
      - snapshot_for_recovery(workspace_id)
  consistency:
    mode: optimistic_versioned
  idempotency:
    patches: required
  conflict_policy:
    incompatible_claims: create_CognitiveDisagreement
    compatible_additions: merge
# =====================================================================
# 23. WORKSPACE LIFECYCLE / COGNITIVE GARBAGE COLLECTION
# =====================================================================
workspace_lifecycle:
  purpose: >
    Prevent the shared active mind from growing without bound.
  WorkspaceLifecyclePolicy:
    responsibilities:
      - salience decay
      - resolved question eviction
      - expired signal removal
      - stale result invalidation
      - duplicate hypothesis merging
      - abandoned proposal removal
      - branch pruning
      - evidence compaction
      - decision closure
      - workspace suspension
      - workspace expiration
  retention_classes:
    immediate:
      examples:
        - temporary tool result
        - transient observation
    active_decision:
      retained_until: decision_closed
    active_scope:
      retained_until: scope_closed
    trace_required:
      retained_in_trace_after_workspace_eviction: true
    experience_eligible:
      eligible_for: governed_experience_store
  WorkspaceConsolidator:
    may_promote_to:
      - CognitiveTrace
      - OperatorExperience
      - governed durable cognitive memory
    may_not_promote_to:
      - WorldState
  consolidation_rule: >
    Durable cognitive memory is historical experience, not fictional truth.
# =====================================================================
# 24. REASONING BUDGET
# =====================================================================
reasoning_budget:
  ReasoningBudget:
    fields:
      level:
        type: ReasoningLevel
      max_operator_calls:
      max_cross_domain_requests:
      max_parallel_cognitive_jobs:
      branch_width:
      simulation_depth:
      max_simulation_fidelity:
        type: SimulationFidelity
      critic_count:
      exact_query_budget:
      semantic_retrieval_budget:
      context_token_budget:
      compute_budget_units:
        nullable: true
      wall_clock_budget_ms:
        nullable: true
      allow_cross_domain_cognition:
        type: bool
      allow_branch_simulation:
        type: bool
      allow_shadow_cognition:
        type: bool
  semantic_meaning:
    reflex:
      branch_width: 0
      simulation_depth: 0
      expected_operator_count: 0_to_1
      use_for:
        - deterministic validation
        - trivial high-confidence decisions
    routine:
      branch_width: 1_to_2
      simulation_depth: 0_to_1
      use_for:
        - familiar low-risk judgments
    deliberative:
      branch_width: 3_to_8
      simulation_depth: 2_to_5
      use_for:
        - consequential story
        - character
        - cinematic
        - production decisions
    strategic:
      branch_width: 6_to_16_or_policy
      simulation_depth: 4_plus
      use_for:
        - ending
        - major canon
        - season arc
        - major reveal
        - irreversible IP decisions
# =====================================================================
# 25. REASONING POLICY
# =====================================================================
reasoning_policy:
  purpose: >
    Compute how deeply Quantum should reason for the current decision.
  ReasoningPolicyContext:
    fields:
      scope:
      decision_type:
      active_signal_types:
      signal_metrics:
      creator_importance:
      audience_impact:
      product_impact:
      uncertainty:
      novelty:
      irreversibility:
      downstream_blast_radius:
      critic_disagreement:
      historical_failure_probability:
      branch_regret_history:
      current_deadline_pressure:
      self_model_capability_confidence:
      current_budget:
  baseline_features:
    - consequence_impact
    - uncertainty
    - irreversibility
    - downstream_blast_radius
    - novelty
    - critic_disagreement
    - historical_failure_rate
    - creator_lock_proximity
    - audience_experience_importance
    - product_identity_importance
  ReasoningPolicyDecision:
    fields:
      reasoning_level:
      budget:
      escalation_reasons:
      minimum_required_operators:
      recommended_operator_tags:
      recommended_simulation_fidelity:
      confidence:
      policy_version:
  hard_floors:
    strategic_or_minimum_deliberative:
      examples:
        - creator-locked semantic reinterpretation
        - major reveal
        - ending
        - canon revision
        - recurring character foundational change
    mandatory_checks_never_skipped:
      - authority
      - exact-context freshness
      - World rules
      - creator locks
      - required QC gates
  learnable:
    value: true
  learning_rule: >
    Learning may lower or raise discretionary cognitive expenditure but may not
    violate hard minimum floors.
# =====================================================================
# 26. REASONING DEPTH EXPERIENCE
# =====================================================================
reasoning_depth_learning:
  ReasoningExperience:
    fields:
      experience_id:
      trace_id:
      decision_type:
      signal_types:
      scope_kind:
      allocated_level:
      allocated_budget:
      quality_outcome:
      failure_outcome:
      repair_count:
      repair_cost:
      creator_feedback_outcome:
      latency:
      compute_cost:
      counterfactual_deeper_result:
        nullable: true
      counterfactual_shallower_result:
        nullable: true
      estimated_regret:
      created_at:
  objective: >
    Learn the minimum reasoning level that reliably achieves the required quality
    for a class of decisions.
  optimization_target: >
    cognition_cost
    + expected_failure_cost
    + expected_repair_cost
    + expected_quality_loss
    + latency_cost
# =====================================================================
# 27. COGNITIVE REQUEST
# =====================================================================
cognitive_request:
  CognitiveRequest:
    fields:
      request_id:
      requested_domain:
        type: CognitiveDomain
      suggested_operator_id:
        nullable: true
      objective:
      reason:
      scope:
      triggered_by_result_id:
        nullable: true
      triggered_by_signal_ids:
        type: list[string]
      urgency:
        range: [0.0, 1.0]
      expected_value:
        range: [0.0, 1.0]
      expected_uncertainty_reduction:
        range: [0.0, 1.0]
      suggested_reasoning_level:
        nullable: true
      evidence_refs:
      deduplication_key:
        nullable: true
      expires_at:
        nullable: true
  invariant: >
    CognitiveRequest requests thought. It does not directly execute or spawn a
    module.
# =====================================================================
# 28. COGNITIVE INVOCATION
# =====================================================================
cognitive_invocation:
  CognitiveInvocation:
    fields:
      invocation_id:
      module_id:
      module_version:
      implementation_id:
      implementation_version:
      operator_id:
      operator_version:
      objective:
      scope:
      world_revision_ref:
      workspace_id:
      workspace_revision:
      adjacent_model_versions:
        creator_model:
          nullable: true
        audience_model:
          nullable: true
        product_market_model:
          nullable: true
        self_model:
          nullable: true
        production_model:
          nullable: true
      signal_refs:
        type: list[Ref]
      context_view_ids:
        type: list[string]
      reasoning_budget:
      authority:
      trace_id:
      cascade_id:
        nullable: true
      parent_invocation_id:
        nullable: true
      deterministic_seed:
        nullable: true
      idempotency_key:
      priority:
      deadline_at:
        nullable: true
      created_at:
  immutability:
    value: true
# =====================================================================
# 29. COGNITIVE CONTEXT
# =====================================================================
cognitive_context:
  CognitiveContext:
    fields:
      world_view:
        type: WorldContextPackage
      workspace_view:
        type: WorkspaceView
      durable_memory_view:
        nullable: true
      creator_model_view:
        nullable: true
      audience_model_view:
        nullable: true
      product_market_model_view:
        nullable: true
      self_model_view:
        nullable: true
      production_model_view:
        nullable: true
      tool_handles:
        type: list[string]
      context_digest:
  construction:
    owner: ContextAssemblyService
  rule: >
    The module receives only context explicitly permitted by its module spec,
    scope and AuthorityEnvelope.
# =====================================================================
# 30. COGNITIVE RESULT
# =====================================================================
cognitive_result:
  CognitiveResult:
    fields:
      result_id:
      invocation_id:
      module_id:
      operator_id:
      status:
        type: CognitiveResultStatus
      based_on_world_revision:
      based_on_workspace_revision:
      based_on_adjacent_model_versions:
        type: map
      observations:
        type: list[CognitiveObservation]
      claims:
        type: list[CognitiveClaim]
      hypotheses:
        type: list[Hypothesis]
      constraints:
        type: list[CognitiveConstraint]
      opportunity_refs:
        type: list[Ref]
      proposals:
        type: list[Proposal]
      requested_cognition:
        type: list[CognitiveRequest]
      evidence_refs:
        type: list[EvidenceRef]
      workspace_patch:
        nullable: true
      confidence:
        range: [0.0, 1.0]
      uncertainty:
        range: [0.0, 1.0]
      reasoning_cost_units:
      latency_ms:
      suggested_stop:
        type: bool
      suggested_escalation:
        nullable: true
      created_at:
  rule: >
    CognitiveResult is advisory/interpretive until integrated and, where
    applicable, arbitrated/QC-validated/committed through an owning system.
# =====================================================================
# 31. RESULT SUPPORT TYPES
# =====================================================================
result_support:
  CognitiveObservation:
    fields:
      observation_id:
      statement:
      evidence_refs:
      confidence:
  CognitiveClaim:
    fields:
      claim_id:
      statement:
      claim_type:
      confidence:
      evidence_refs:
      dependency_refs:
  CognitiveConstraint:
    fields:
      constraint_id:
      constraint_type:
      severity:
      description:
      evidence_refs:
      hard:
        type: bool
# =====================================================================
# 32. DECISION FRAME
# =====================================================================
decision_frame:
  DecisionFrame:
    fields:
      decision_id:
      question:
      decision_type:
      objective:
      scope:
      created_at_world_revision:
      created_at_workspace_revision:
      consequence_class:
        enum:
          - local
          - moderate
          - high
          - strategic
      criteria:
        type: list[DecisionCriterion]
      hard_constraint_refs:
        type: list[Ref]
      required_domains:
        type: list[CognitiveDomain]
      required_operator_ids:
        type: list[string]
      candidate_proposal_ids:
        type: list[string]
      branch_portfolio_id:
        nullable: true
      selected_proposal_id:
        nullable: true
      confidence:
      uncertainty:
      stopping_conditions:
        type: list[StoppingCondition]
      state:
        type: DecisionState
      created_at:
      updated_at:
  DecisionCriterion:
    fields:
      criterion_id:
      description:
      source_model:
        enum:
          - creator
          - audience
          - product
          - world
          - production
          - quality
          - runtime
      weight:
      hard_constraint:
      minimum_score:
        nullable: true
      non_compensatory:
        type: bool
# =====================================================================
# 33. PROPOSAL
# =====================================================================
proposal_model:
  Proposal:
    fields:
      proposal_id:
      proposal_type:
      created_by_result_id:
      objective:
      scope:
      based_on_world_revision:
      based_on_workspace_revision:
      target_owner:
        enum:
          - world_model
          - artifact_compiler
          - production_model
          - production_engine
          - cognitive_workspace
      payload:
      world_rationale_ref:
        nullable: true
      precondition_refs:
      expected_effects:
      evidence_refs:
      required_authority_rank:
      requires_simulation:
        type: bool
      recommended_simulation_fidelity:
        nullable: true
      estimated_blast_radius:
      estimated_irreversibility:
      estimated_quality_upside:
      estimated_failure_risk:
      confidence:
      state:
        type: ProposalState
      created_at:
  rule: >
    Proposal is a candidate action/decision, never an implicit commit.
# =====================================================================
# 34. COGNITIVE DISAGREEMENT
# =====================================================================
cognitive_disagreement:
  CognitiveDisagreement:
    fields:
      disagreement_id:
      scope:
      subject:
      claims:
        type: list[CognitiveClaim]
      source_result_ids:
        type: list[string]
      severity:
      decision_impact:
      disagreement_type:
        enum:
          - factual_interpretation
          - causal
          - character
          - narrative_value
          - audience_prediction
          - product_prediction
          - production_risk
          - quality
          - policy
      requires_adjudication:
      resolution_method:
        nullable: true
      resolution_result_id:
        nullable: true
      state:
        type: DisagreementState
      created_at:
      resolved_at:
        nullable: true
  principle: >
    Conflicting cognition should become explicit disagreement rather than
    last-writer-wins Workspace state.
# =====================================================================
# 35. COGNITIVE CASCADE
# =====================================================================
cognitive_cascade:
  definition: >
    Directed, bounded chain/graph of cognitive invocations initiated by signals,
    results, questions or disagreements.
  CognitiveCascade:
    fields:
      cascade_id:
      root_signal_refs:
      root_decision_id:
        nullable: true
      workspace_id:
      nodes:
        type: list[CascadeNode]
      edges:
        type: list[CascadeEdge]
      current_depth:
      max_depth:
      unique_operator_count:
      novelty_score:
      accumulated_expected_value:
      accumulated_cost:
      repeated_state_fingerprint_count:
      state:
        type: CascadeState
      stop_reason:
        nullable: true
  CascadeNode:
    fields:
      invocation_id:
      result_id:
        nullable: true
      depth:
      status:
  CascadeEdge:
    fields:
      source_invocation_id:
      target_request_id:
      target_invocation_id:
        nullable: true
      reason:
      expected_value:
      novelty:
  key_law: >
    A module may request cognition, but CognitiveExecutive decides whether the
    request becomes another invocation.
# =====================================================================
# 36. CASCADE CONTROL / STOPPING
# =====================================================================
cascade_policy:
  CascadePolicy:
    controls:
      - max_depth
      - max_total_operator_calls
      - max_cross_domain_requests
      - duplicate_request_suppression
      - cycle_detection
      - novelty_threshold
      - marginal_value_threshold
      - uncertainty_threshold
      - budget threshold
  stop_if_any:
    - hard_budget_exhausted
    - maximum_depth_reached_without_exception
    - same_request_deduplication_key_already_satisfied
    - cognitive_cycle_detected_and_no_new_evidence
    - expected_marginal_value_of_next_operator_below_cost_threshold
    - decision_confidence_above_required_threshold_and_hard_criteria_pass
    - remaining_disagreement_has_low_decision_impact
    - requested_scope_outside_authority
  escalate_if:
    - unexpected_high_value_NarrativeOpportunity
    - critical_cognitive_disagreement
    - branch_scores_close_and_consequence_high
    - high_novelty_low_policy_confidence
    - downstream_blast_radius_grows
    - creator_locked_value_at_risk
    - historical_failure_rate_high
  anti_infinite_thought_rule: >
    "Think harder" is a bounded resource-allocation decision, never an unbounded
    recursive permission.
# =====================================================================
# 37. SIMULATION FIDELITY LADDER
# =====================================================================
simulation_fidelity:
  purpose: >
    Avoid spending expensive simulation on branches that can be eliminated by
    cheaper reasoning.
  levels:
    logical:
      includes:
        - schema
        - authority
        - world preconditions
        - hard rules
      intended_cost: minimal
    state_transition:
      includes:
        - exact state mutation simulation
        - immediate affordances
        - direct causal effects
    relational_epistemic:
      includes:
        - relationship change
        - knowledge/belief changes
        - psychological consequences
        - information trajectory
    narrative:
      includes:
        - multi-event branch continuation
        - promise/payoff effect
        - thematic progression
        - future story option value
    cinematic:
      includes:
        - observation strategy
        - coverage implications
        - performance
        - edit/information visibility
    production_probe:
      includes:
        - representative asset/render feasibility
        - expensive production uncertainty tests
      use: finalists_only
  policy: >
    Cheap stages should prune invalid/weak branches before expensive fidelity
    levels are invoked.
# =====================================================================
# 38. BRANCH PORTFOLIO
# =====================================================================
branch_portfolio:
  BranchCandidate:
    fields:
      branch_id:
      originating_proposal_id:
      base_world_revision:
      fidelity_reached:
        type: SimulationFidelity
      depth_reached:
      simulated_event_refs:
      terminal_snapshot_ref:
        nullable: true
      scorecard:
      uncertainty:
      pruned:
      prune_reason:
        nullable: true
      cost_units:
      updated_at:
  BranchScorecard:
    dimensions:
      causal_strength:
      character_integrity:
      epistemic_quality:
      relationship_consequence:
      emotional_value:
      thematic_value:
      audience_experience_fit:
      product_strength:
      promise_management:
      originality:
      future_option_value:
      production_feasibility:
      creator_fidelity:
    hard_failures:
      - world_rule_violation
      - creator_lock_violation
      - impossible_character_knowledge
      - catastrophic_character_incoherence
    note: >
      Hard failures are non-compensatory. Spectacle cannot average away a
      broken creator lock or impossible World State.
  BranchPortfolio:
    fields:
      portfolio_id:
      decision_id:
      base_world_revision:
      base_branch_id:
      candidates:
      branch_width_limit:
      simulation_depth_limit:
      max_fidelity:
      best_branch_id:
        nullable: true
      confidence_gap:
        nullable: true
      regret_estimate:
        nullable: true
      status:
      created_at:
      updated_at:
# =====================================================================
# 39. BRANCH SIMULATOR
# =====================================================================
branch_simulator:
  ownership:
    runtime:
      - chooses when to simulate
      - chooses breadth/depth/fidelity
      - maintains BranchPortfolio
    world_model:
      - creates branch state
      - applies hypothetical WorldEvents
      - validates World rules
      - returns exact hypothetical state
  SimulationRequest:
    fields:
      proposal:
      base_world_revision_ref:
      scope:
      target_fidelity:
      depth:
      width:
      reasoning_budget:
      trace_id:
  SimulationResult:
    fields:
      branch_candidate:
      generated_signal_refs:
      narrative_opportunity_refs:
      predicted_quality:
      predicted_uncertainty:
      evidence_refs:
      cost_units:
      created_at:
  BranchSimulator:
    protocol:
      - simulate(request)
      - extend(branch_id, additional_depth, fidelity, budget)
      - compare(portfolio)
      - prune(branch_id, reason)
      - discard(portfolio)
# =====================================================================
# 40. COGNITIVE ARBITRATOR
# =====================================================================
cognitive_arbitrator:
  purpose: >
    Select among sufficiently evaluated competing proposals or determine that
    more cognition is required.
  distinction:
    arbitration: "Which candidate?"
    QC: "Is selected candidate acceptable?"
  ArbitrationRequest:
    fields:
      decision:
      proposals:
      branch_portfolio:
        nullable: true
      disagreements:
      workspace_view:
      reasoning_budget:
      applicable_creator_model_ref:
      applicable_audience_model_ref:
      applicable_product_model_ref:
      applicable_quality_contract_ref:
  ArbitrationResult:
    fields:
      arbitration_id:
      decision_id:
      selected_proposal_id:
        nullable: true
      rejected_proposal_ids:
      requires_more_cognition:
      requested_cognition:
      hard_failures:
      confidence:
      uncertainty:
      rationale:
      evidence_refs:
      created_at:
  CognitiveArbitrator:
    protocol:
      - arbitrate(request)
  rules:
    - hard criteria fail closed
    - non-compensatory floors honored
    - unresolved high-impact disagreement may force more cognition
    - low confidence on strategic decision may force simulation escalation
    - creator intent outranks product-market optimization where they conflict
# =====================================================================
# 41. COMMIT MANAGER
# =====================================================================
commit_manager:
  purpose: >
    Normal governed gateway from selected cognition into domain-owned canonical
    systems.
  important_boundary: >
    CommitManager coordinates validated commit requests but does not replace the
    owning system's mutation authority.
  CommitRequest:
    fields:
      commit_request_id:
      selected_proposal:
      selected_by_arbitration_id:
      target_owner:
      expected_target_revision:
      authority:
      qc_certification_ref:
      trace_id:
      idempotency_key:
  CommitValidation:
    fields:
      valid:
      stale:
      authority_valid:
      target_revision_valid:
      creator_locks_valid:
      target_preconditions_valid:
      target_rules_valid:
      qc_valid:
      violations:
      requires_rebase:
  CommitReceipt:
    fields:
      commit_id:
      proposal_id:
      target_owner:
      resulting_object_refs:
      previous_revision:
      new_revision:
      emitted_signal_refs:
      commit_digest:
      committed_at:
  CommitTargetPort:
    protocol:
      - validate_commit(request)
      - rebase_proposal(proposal, current_revision)
      - commit(request)
  CommitManager:
    protocol:
      - validate(request)
      - rebase(request)
      - commit(request)
  target_routing:
    world_model:
      target_contract: canonical WorldEvent commit API
    artifact_compiler:
      target_contract: artifact revision/lock API
    production_model:
      target_contract: production strategy revision API
    production_engine:
      target_contract: approved execution command API
  forbidden:
    - direct database writes
    - bypass target-owner validation
    - commit without QC where target contract requires QC
    - stale silent commit
# =====================================================================
# 42. COGNITIVE EXECUTIVE
# =====================================================================
cognitive_executive:
  definition: >
    Executive function of Quantum Animation Agent.
  not:
    - master creative agent
    - universal domain expert
    - execution worker
    - canonical truth owner
  responsibilities:
    attention:
      - consume salient signals
      - prioritize active concerns
      - manage objective stack
    reasoning:
      - classify consequence
      - allocate reasoning level
      - allocate reasoning budget
      - select mandatory operators
      - rank optional operators
      - choose simulation fidelity
    cognition:
      - create CognitiveInvocations
      - authorize cross-domain CognitiveRequests
      - manage CognitiveCascades
      - detect insufficient cognition
      - detect overthinking
    decisions:
      - create DecisionFrames
      - decide when arbitration is ready
      - request additional evidence
      - stop/prune low-value branches
    metacognition:
      - monitor confidence
      - monitor uncertainty
      - monitor disagreement
      - monitor reasoning cost
      - inspect historical policy performance
    learning:
      - consume active policy versions
      - emit traces/experiences
      - never self-promote policy
  ExecutiveInput:
    fields:
      workspace_id:
      new_signal_refs:
      completed_result_refs:
      completed_simulation_refs:
      adjacent_model_change_refs:
      world_revision_ref:
      reason:
  ExecutivePlan:
    fields:
      plan_id:
      workspace_id:
      reasoning_policy_decision:
      attention_updates:
      planned_invocations:
      simulation_requests:
      deferred_request_ids:
      rejected_request_ids:
      decisions_ready_for_arbitration:
      proposals_ready_for_commit_validation:
      workspace_patch:
      rationale:
      trace_id:
      created_at:
  CognitiveExecutive:
    protocol:
      - plan(input)
      - integrate_result(result)
      - evaluate_cognitive_request(request, workspace)
      - should_continue_reasoning(decision, workspace)
      - escalate_reasoning(decision, reason)
      - reduce_reasoning(decision, reason)
      - prepare_arbitration(decision)
      - close_decision(decision)
  law: >
    Executive determines what deserves cognition. It does not solve every domain
    problem itself.
# =====================================================================
# 43. EXECUTION PLAN
# =====================================================================
execution_plan:
  PlannedInvocation:
    fields:
      invocation:
      priority:
      lane:
        type: CognitiveLane
      dependencies:
      may_run_parallel:
      concurrency_keys:
      preferred_capability_route:
        nullable: true
  ExecutionPlan:
    fields:
      execution_plan_id:
      executive_plan_id:
      planned_invocations:
      dependency_graph:
      maximum_parallelism:
      priority_policy:
      created_at:
# =====================================================================
# 44. EXECUTION ORCHESTRATOR
# =====================================================================
execution_orchestrator:
  definition: >
    Reliable systems-runtime responsible for making approved cognitive work
    execute.
  question:
    - "When?"
    - "Where?"
    - "On which implementation?"
    - "With what retry/cache/resource policy?"
    - "What can run concurrently?"
  does_not_decide:
    - whether cognition is creatively necessary
    - narrative value
    - reasoning depth policy
    - authority expansion
    - canonical truth
  responsibilities:
    execution:
      - validate invocation contract
      - capability route implementation
      - queue work
      - enforce dependencies
      - execute independent invocations concurrently
      - collect CognitiveResults
    reliability:
      - retries
      - timeout
      - circuit breaking
      - cancellation
      - stale-work cancellation
      - idempotency
      - caching
    resources:
      - concurrency limits
      - provider quotas
      - compute budgets
      - priority lanes
      - resource reservation
    traceability:
      - execution receipts
      - latency
      - cost
      - implementation versions
      - failures
  ExecutionHandle:
    fields:
      execution_id:
      invocation_id:
      state:
        type: ExecutionState
      implementation_id:
      worker_id:
        nullable: true
      attempt:
      cache_hit:
      started_at:
        nullable: true
      completed_at:
        nullable: true
      failure_ref:
        nullable: true
  ExecutionBatchResult:
    fields:
      handles:
      results:
      failed_invocation_ids:
      stale_invocation_ids:
      total_cost_units:
      total_latency_ms:
  ExecutionOrchestrator:
    protocol:
      - execute(invocation)
      - execute_batch(invocations)
      - cancel(execution_id)
      - status(execution_id)
      - invalidate_by_dependency(changed_refs)
# =====================================================================
# 45. CAPABILITY ROUTING
# =====================================================================
capability_routing:
  purpose: >
    Ensure all currently available cognitive implementations are discoverable
    and considered when relevant without requiring architecture changes.
  source_of_truth:
    SelfModel: required
  CognitiveImplementationProfile:
    fields:
      implementation_id:
      supported_operator_ids:
      capability_refs:
      current_availability:
      observed_reliability:
      calibrated_confidence:
      cost_profile:
      latency_profile:
      context_limits:
      known_failure_modes:
      current_degradation_flags:
      last_updated_at:
  CapabilityRoute:
    fields:
      route_id:
      invocation_id:
      implementation_id:
      expected_quality:
      expected_cost:
      expected_latency:
      expected_failure_probability:
      rationale:
      self_model_revision:
  CapabilityRouter:
    protocol:
      - enumerate_eligible_implementations(invocation)
      - rank_implementations(invocation, self_model)
      - choose_route(invocation)
  important_rule: >
    Capability availability is machine-maintained through SelfModel; it is not
    manually authored into the cognitive architecture.
# =====================================================================
# 46. CONCURRENCY / HIGH-VELOCITY OPERATION
# =====================================================================
concurrency_model:
  principle: >
    Quantum may perform many low-risk cognitive/execution processes while
    simultaneously deliberating deeply on independent high-consequence scopes.
  read_model:
    - immutable World revision
    - immutable adjacent model versions
    - versioned Workspace view
  invocation_output:
    must_include:
      - based_on_world_revision
      - based_on_workspace_revision
      - dependency_refs
  conflict_detection:
    based_on:
      - CognitiveScope
      - concurrency_keys
      - dependency_keys
      - proposal domains
      - target owner
  safe_concurrency_examples:
    - description: >
        Deep Episode 7 climax reasoning concurrent with Episode 6 shot rendering.
    - description: >
        Sound cognition and visual production cognition operating against same
        locked scene when their proposal domains do not conflict.
    - description: >
        Multiple branch analyses reading same immutable World revision.
  unsafe_concurrency:
    - conflicting commits to same semantic state without revalidation
    - competing Workspace patches silently overwriting same claim
    - stale proposal committed after dependent World State changes
  stale_output:
    behavior:
      - mark result stale
      - inspect changed dependency set
      - rerun only if materially affected
  principle_name: INCREMENTAL_COGNITION
# =====================================================================
# 47. COGNITIVE LANES
# =====================================================================
cognitive_lanes:
  reflex:
    intended_for:
      - deterministic validation
      - trivial exact query
      - well-calibrated zero-ambiguity operation
    priority_behavior: immediate
  routine:
    intended_for:
      - familiar low-impact judgment
      - historically reliable operator sequence
      - small local decisions
  deliberative:
    intended_for:
      - consequential scene/story decisions
      - character change
      - information choreography
      - ambiguous production strategy
  strategic:
    intended_for:
      - ending
      - canon revision
      - foundational character/world change
      - season architecture
      - major project identity decision
  dynamic_assignment:
    value: true
  rule: >
    Task type does not permanently determine lane. Context and risk determine lane.
# =====================================================================
# 48. EXAMPLE POLYCOGNITIVE CASCADE
# =====================================================================
example_cascade:
  initial_world_state:
    - "Aria wants signal origin."
    - "Eva knows relevant information."
    - "Aria distrusts Eva."
    - "Receiver is connected to Marcus."
    - "Eva previously promised not to lie."
  world_signal:
    type: NARRATIVE.GOAL_BLOCKED
  step_1:
    operator: narrative.blocked_intents
    result: >
      Goal is blocked by missing information.
  step_2:
    cognitive_request:
      domain: epistemic
      operator: epistemic.knowledge_asymmetry
    result: >
      Eva possesses information needed by Aria.
  step_3:
    cognitive_request:
      domain: character
      operator: character.relationship_pressure
    result: >
      Direct access is emotionally expensive because trust is low.
  step_4:
    operator: narrative.promise_intersection
    result: >
      Eva's prior honesty promise intersects the current conflict.
  derived_world_intelligence:
    NarrativeOpportunity:
      score: 0.97
  executive_response:
    previous_level: routine
    new_level: deliberative
    activate:
      - narrative.high_impact_affordances
      - character.policy_evaluation
      - epistemic.information_choreography
    branch_width:
      previous: 2
      new: 8
    simulation_depth:
      previous: 0
      new: 4
  epistemic_insight: >
    Eva need not verbally reveal the information. Aria only needs evidence that
    Eva recognizes the receiver.
  cinematic_request:
    operator: cinematic.visualize_information
  cinematic_result: >
    Use Eva's involuntary hesitation as observable evidence.
  performance_result: >
    Eva suppresses recognition.
  acoustic_result: >
    Remove score and foreground receiver mechanical click.
  conclusion: >
    No single cognitive subsystem authored the complete moment. Quantum did.
# =====================================================================
# 49. OPERATOR SELECTION CONTEXT
# =====================================================================
operator_selection:
  OperatorSelectionContext:
    fields:
      signal_types:
      signal_feature_vector:
      scope_kind:
      decision_type:
      salient_entity_types:
      active_objective_types:
      active_conflict_types:
      uncertainty:
      novelty:
      blast_radius:
      irreversibility:
      current_reasoning_level:
      already_invoked_operator_ids:
      world_feature_fingerprint:
      workspace_feature_fingerprint:
      creator_model_feature_fingerprint:
      audience_model_feature_fingerprint:
      product_model_feature_fingerprint:
      self_model_feature_fingerprint:
  candidate_filter:
    remove:
      - unsupported scope
      - authority incompatible
      - missing mandatory views
      - unavailable capability
      - already satisfied duplicate
      - budget impossible
  mandatory_operators:
    selected_before_learning: true
# =====================================================================
# 50. OPERATOR UTILITY
# =====================================================================
operator_utility:
  OperatorUtilityPrediction:
    fields:
      operator_id:
      operator_version:
      expected_quality_delta:
      expected_failure_risk_reduction:
      expected_repair_cost_avoided:
      expected_uncertainty_reduction:
      expected_future_option_value:
      expected_reasoning_cost:
      expected_latency_ms:
      expected_utility:
      confidence:
      policy_version:
  conceptual_utility: >
    expected_quality_gain
    + expected_failure_risk_reduction
    + expected_repair_cost_avoided
    + expected_future_option_value
    + expected_uncertainty_reduction_value
    - compute_cost
    - latency_cost
  rule: >
    Utility is contextual and marginal, not a universal ranking of operators.
# =====================================================================
# 51. OPERATOR EXPERIENCE
# =====================================================================
operator_experience:
  OperatorExperience:
    fields:
      experience_id:
      trace_id:
      invocation_id:
      operator_id:
      operator_version:
      domain:
      signal_types:
      scope_kind:
      decision_type:
      world_feature_fingerprint:
      workspace_feature_fingerprint:
      reasoning_level:
      prior_uncertainty:
      posterior_uncertainty:
      direct_quality_delta:
        nullable: true
      downstream_quality_delta:
        nullable: true
      failure_probability_delta:
        nullable: true
      repair_cost_avoided:
        nullable: true
      future_option_value:
        nullable: true
      reasoning_cost:
      latency_ms:
      selected_by_policy:
      shadow_execution:
      counterfactual_baseline_ref:
        nullable: true
      estimated_marginal_utility:
        nullable: true
      final_reward:
        nullable: true
      created_at:
# =====================================================================
# 52. COGNITIVE TRACE
# =====================================================================
cognitive_trace:
  purpose: >
    Preserve complete provenance of how Quantum reached a consequential decision.
  CognitiveTrace:
    fields:
      trace_id:
      originating_signal_refs:
      initial_world_revision:
      adjacent_model_versions_at_start:
      scope:
      decision_ids:
      invocation_ids:
      operator_ids:
      cognitive_result_ids:
      request_ids:
      cascade_ids:
      branch_portfolio_ids:
      proposal_ids:
      disagreement_ids:
      arbitration_ids:
      selected_proposal_id:
        nullable: true
      commit_id:
        nullable: true
      total_reasoning_cost:
      total_latency_ms:
      downstream_quality:
        type: map
      repair_count:
      downstream_invalidation_cost:
      creator_feedback_refs:
        type: list[Ref]
      qc_feedback_refs:
        type: list[Ref]
      final_reward:
        nullable: true
      created_at:
      closed_at:
        nullable: true
  lineage_examples:
    - operator -> hypothesis
    - operator -> NarrativeOpportunity
    - operator -> proposal
    - proposal -> branch
    - branch -> selection
    - selection -> artifact
    - artifact -> QC
    - QC -> repair
    - repair -> final outcome
# =====================================================================
# 53. OPERATOR SELECTION POLICY
# =====================================================================
operator_selection_policy:
  initial_learning_strategy:
    recommended: contextual_bandit
  reason: >
    Initial problem is contextual optional-cognition selection rather than
    unconstrained long-horizon reinforcement learning.
  OperatorSelectionPolicy:
    protocol:
      - rank(context, candidate_operator_ids)
      - record_experience(experience)
      - should_explore(context)
      - select_shadow_operator(context, candidates)
  input:
    - signal constellation
    - decision type
    - scope
    - World features
    - Workspace features
    - current uncertainty
    - blast radius
    - current reasoning depth
    - already executed cognition
    - SelfModel capability state
  output:
    - ranked OperatorUtilityPrediction list
  hard_boundary:
    policy_controls:
      - optional_triggered operators
      - exploratory operators
    policy_does_not_control:
      - authority validation
      - security validation
      - exact-context validation
      - World hard rules
      - creator locks
      - mandatory QC gates
      - invariant operators
# =====================================================================
# 54. MARGINAL UTILITY LEARNING
# =====================================================================
marginal_utility_learning:
  problem: >
    Correlation between an operator appearing in good work and the operator
    actually causing improvement is insufficient.
  evidence_sources:
    production_outcome:
      strength: medium
    downstream_QC:
      strength: medium_high
    creator_feedback:
      strength: high_when_directly_relevant
    shadow_execution:
      strength: high
    offline_ablation:
      strength: high
    counterfactual_rerun:
      strength: very_high
  example:
    actual:
      operators:
        - blocked_intent
        - relationship_analysis
        - promise_intersection
      quality: 0.94
    ablation:
      operators:
        - blocked_intent
        - relationship_analysis
      quality: 0.82
    estimated_promise_intersection_marginal_value: 0.12
  use:
    - operator utility estimates
    - reasoning-depth learning
    - cascade policy learning
# =====================================================================
# 55. DELAYED CREDIT ASSIGNMENT
# =====================================================================
credit_assignment:
  challenge: >
    Some cognition produces value only much later in the film.
  required_lineage: |
    OperatorInvocation
         ↓ CONTRIBUTED_TO
    CognitiveResult
         ↓ CONTRIBUTED_TO
    Proposal / Opportunity
         ↓ SELECTED_AS
    Decision
         ↓ PRODUCED
    WorldEvent / Artifact
         ↓ ENABLED
    Later Payoff
         ↓ AFFECTED
    Final QC / Creator Outcome
  CreditAssignmentService:
    responsibilities:
      - traverse contribution lineage
      - assign candidate delayed credit
      - incorporate ablation evidence
      - avoid double counting correlated operators
      - preserve uncertainty
  rule: >
    Delayed credit may remain probabilistic; uncertainty must be retained rather
    than inventing precise causal certainty.
# =====================================================================
# 56. SHADOW COGNITION
# =====================================================================
shadow_cognition:
  purpose: >
    Safely evaluate reasoning operators/policies not currently selected by the
    active policy.
  behavior:
    - run optional operator
    - prevent result from influencing canonical decision
    - evaluate whether result would have added information or improved outcome
    - store OperatorExperience with shadow_execution=true
  usage:
    - discover overlooked operators
    - prevent policy stagnation
    - improve utility estimates
    - compare candidate reasoning policies
  resource_policy:
    budget_fraction:
      configurable: true
  forbidden:
    - shadow output silently affecting production decision
# =====================================================================
# 57. LEARNING GOVERNANCE
# =====================================================================
learning_governance:
  principle: >
    Quantum may learn how to think, but no learned policy may self-authorize
    deployment.
  candidate_policy_lifecycle:
    - observed
    - trained
    - offline_evaluated
    - holdout_evaluated
    - calibration_checked
    - shadow
    - bounded_canary
    - promotion_requested
    - externally_gated
    - active
    - rolled_back
  CognitivePolicyCandidate:
    fields:
      policy_candidate_id:
      policy_type:
        enum:
          - operator_selection
          - reasoning_depth
          - salience
          - cascade
          - simulation_fidelity
          - capability_routing
      training_window:
      feature_schema_version:
      model_ref:
      offline_metrics:
      holdout_metrics:
      calibration_metrics:
      shadow_metrics:
      canary_metrics:
      known_failure_modes:
      status:
  CognitivePolicyPromotionGate:
    required:
      - minimum_holdout_size
      - performance_non_regression
      - calibration_threshold
      - no_hard_invariant_regression
      - policy_versioned
      - rollback_available
  no_self_deception_controls:
    - frozen evaluation sets
    - external QC outcome use
    - creator-feedback holdout where available
    - independent benchmark suites
    - shadow testing
    - rollback
    - policy diversity checks
    - novelty stress tests
# =====================================================================
# 58. COGNITIVE SELF-MONITORING
# =====================================================================
metacognition:
  purpose: >
    Let Quantum monitor whether its current thinking is sufficient, excessive,
    contradictory or poorly calibrated.
  tracked_variables:
    - workspace uncertainty
    - decision confidence
    - disagreement severity
    - branch score gap
    - novelty
    - policy confidence
    - evidence coverage
    - expected marginal value of more cognition
    - cognitive cost already spent
    - historical regret for similar decisions
  possible_actions:
    - continue
    - stop
    - escalate reasoning
    - reduce reasoning
    - request different domain
    - increase branch width
    - increase simulation depth
    - increase simulation fidelity
    - request additional evidence
    - accept bounded uncertainty
# =====================================================================
# 59. STOPPING POLICY
# =====================================================================
stopping_policy:
  minimum_conditions_before_stop:
    local_routine:
      - required operators complete
      - hard constraints pass
      - confidence threshold satisfied
    deliberative:
      - required domains represented
      - major disagreement resolved or accepted
      - branch regret below threshold
      - high-impact open questions resolved/deferred with rationale
    strategic:
      - creator locks verified
      - required simulations complete
      - relevant audience/product reasoning complete
      - multiple perspectives/critics evaluated
      - confidence and regret thresholds satisfied
      - QC-ready evidence package complete
  stop_reasons:
    - sufficient_confidence
    - diminishing_marginal_value
    - hard_budget_exhaustion
    - deadline_boundary
    - no_valid_remaining_candidates
    - accepted_uncertainty
    - blocked_by_external_dependency
  anti_overthinking_metric:
    cognitive_cost_without_material_uncertainty_reduction
# =====================================================================
# 60. DECISION READINESS
# =====================================================================
decision_readiness:
  DecisionReadinessEvaluator:
    evaluates:
      - required operator completion
      - hard criteria
      - evidence completeness
      - uncertainty
      - disagreement
      - branch score separation
      - proposal validity
      - scope freshness
      - creator lock safety
      - QC prerequisites
  outputs:
    - NOT_READY
    - READY_FOR_SIMULATION
    - READY_FOR_ARBITRATION
    - READY_FOR_QC
    - READY_FOR_COMMIT
# =====================================================================
# 61. CONTEXT ASSEMBLY
# =====================================================================
context_assembly:
  ContextAssemblyService:
    inputs:
      - CognitiveInvocation
      - module spec
      - operator spec
      - World ContextCompiler
      - WorkspaceService
      - durable memory
      - CreatorModel
      - AudienceModel
      - ProductMarketModel
      - SelfModel
      - ProductionModel
    pipeline:
      - validate invocation revisions
      - request mandatory World Context
      - project WorkspaceView
      - request required adjacent model views
      - hydrate bounded memory
      - apply AuthorityEnvelope filtering
      - validate required views present
      - compute context digest
      - return CognitiveContext
  fail_closed:
    - mandatory exact World view missing
    - creator lock view required but unavailable
    - required SelfModel capability state unavailable
    - incompatible model revisions
# =====================================================================
# 62. INCREMENTAL COGNITION / STALENESS
# =====================================================================
incremental_cognition:
  principle: >
    Recompute cognition only when its material dependencies change.
  every_result_records:
    - World revision
    - Workspace revision
    - adjacent model versions
    - evidence refs
    - dependency refs
  on_change:
    - compute changed dependency set
    - mark affected results stale
    - preserve unaffected results
    - reopen affected DecisionFrames
    - cancel stale queued/running invocations where safe
    - schedule minimum necessary recomputation
  examples:
    room_lighting_changed:
      character_motivation_result_stale: false
    aria_trust_changed:
      character_policy_result_stale: true
      cinematic_reaction_result_maybe_stale: true
  leverage:
    - lower inference cost
    - faster revisions
    - reduced cognitive duplication
    - precise blast radius
# =====================================================================
# 63. MACRO WORKFLOW INTEGRATION
# =====================================================================
macro_workflow_integration:
  principle: >
    Polycognitive Runtime does not replace artifact lifecycle/workflow state.
  macro_flow: |
    creative.yaml
        ↓
    Development Compiler
        ↓
    quantum.studio.yaml
        ↓
    Animation Compiler
        ↓
    animatic
        ↓
    QC / animatic.lock
        ↓
    Production Engine
        ↓
    finishing / master
  polycognitive_runtime:
    operates:
      - across development
      - during screenplay construction
      - during directing
      - during animatic QC
      - during production strategy
      - during repair
      - during final review
  phase_constraints:
    pre_animatic_lock:
      semantic_change_allowed_under_authority: true
    post_animatic_lock:
      semantic_change:
        requires:
          - lock reopening authority
          - blast-radius analysis
          - QC
    production:
      routine_strategy_cognition_can_continue_concurrently: true
# =====================================================================
# 64. CREATOR / AUDIENCE / PRODUCT MODEL INTEGRATION
# =====================================================================
project_model_integration:
  CreatorModel:
    use:
      - decision criteria
      - creator locks
      - quality semantics
      - creative-intent fidelity
    precedence:
      project-specific creative intent: highest creative authority
  AudienceModel:
    use:
      - viewer information trajectory
      - emotional target
      - pacing/complexity reasoning
      - synthetic viewer simulations
  ProductMarketModel:
    use:
      - hook
      - legibility
      - product identity
      - repeatability
      - accessibility
      - IP optionality
    authority_rule: >
      Product-market cognition may improve realization and identify risk but may
      not silently erase distinctive creator intent.
  example_conflict:
    creator_intent: >
      Slow haunting opening is essential.
    product_operator: >
      Earlier hook could improve immediate legibility.
    runtime_behavior:
      - surface disagreement
      - search alternatives preserving creator intent
      - never silently convert the opening into generic fast action
# =====================================================================
# 65. SELF MODEL INTEGRATION
# =====================================================================
self_model_integration:
  principle: >
    SelfModel is machine-maintained and supplies current truth about Quantum's
    capabilities.
  runtime_uses:
    - implementation routing
    - cognitive resource planning
    - confidence calibration
    - failure-risk prediction
    - graceful degradation
    - tool discovery
  signals_consumed:
    examples:
      - SELF.CAPABILITY_DISCOVERED
      - SELF.CAPABILITY_DEGRADED
      - SELF.CAPABILITY_RECOVERED
      - SELF.MODEL_VERSION_CHANGED
  requirement: >
    All registered capabilities must be discoverable and considered where
    semantically relevant; not all capabilities must literally be used.
# =====================================================================
# 66. AUTONOMOUS QC INTEGRATION
# =====================================================================
qc_integration:
  boundary:
    quality_cognition:
      role: anticipate, explain and prepare
    autonomous_qc:
      role: accept/reject/certify
  runtime_to_qc:
    sends:
      - selected proposal
      - DecisionFrame
      - evidence refs
      - branch scorecard
      - WorldRationale
      - creator/audience/product criteria
      - unresolved accepted uncertainty
  qc_to_runtime:
    returns:
      - PASS
      - FAIL
      - UNCERTAIN
      - typed violations
      - confidence
      - likely root cause
      - repair recommendations
  on_FAIL:
    executive:
      - update Workspace
      - raise relevant signals
      - invoke root-cause cognition
      - plan minimum-blast-radius repair
      - capture CognitiveTrace outcome
# =====================================================================
# 67. COGNITIVE EXPERIENCE / REWARD
# =====================================================================
cognitive_reward:
  outcome_sources:
    - AutonomousQC
    - creator review
    - artifact lock success
    - repair count
    - downstream invalidation cost
    - production success
    - audience-model simulation
    - product-model evaluation
    - reasoning cost
    - latency
  reward_is_not_single_quality_average:
    hard_failure_floors: true
  example_components:
    creator_fidelity:
      sign: positive
    audience_experience_fit:
      sign: positive
    downstream_QC:
      sign: positive
    repair_cost:
      sign: negative
    invalidation_blast_radius:
      sign: negative
    cognitive_cost:
      sign: negative
    latency:
      sign: negative
    option_value:
      sign: positive
# =====================================================================
# 68. FAILURE MODES
# =====================================================================
failure_modes:
  executive_unavailable:
    behavior:
      - stop new discretionary cognition
      - allow deterministic already-authorized reflex operations where safe
      - preserve Workspace
  orchestrator_unavailable:
    behavior:
      - preserve Executive plans
      - do not duplicate invocation execution
      - resume from idempotency records
  workspace_store_failure:
    behavior:
      - fail closed for consequential active decisions
      - reconstruct from latest Workspace snapshot + trace where possible
  world_signal_bus_failure:
    behavior:
      - persist ingress cursor
      - replay missed signals
      - avoid duplicate semantic activation through dedupe
  cognitive_module_failure:
    behavior:
      - retry under orchestrator policy
      - reroute to compatible implementation
      - mark degraded if no implementation available
      - escalate if mandatory operator unavailable
  adjacent_model_unavailable:
    behavior:
      depends_on_requirement:
        mandatory: block decision
        optional: mark degraded context
  learned_policy_failure:
    behavior:
      - rollback to last accepted policy
      - preserve mandatory operator floors
  cascade_loop:
    behavior:
      - detect repeated state fingerprint
      - stop cycle
      - emit META.COGNITIVE_CYCLE signal
      - preserve unresolved question
  stale_result:
    behavior:
      - reject integration if materially stale
      - recompute minimum dependency set
# =====================================================================
# 69. DEGRADED MODES
# =====================================================================
degraded_modes:
  RULE_BASED_EXECUTIVE:
    condition: learned reasoning policy unavailable
    behavior:
      - use deterministic baseline activation policies
  NO_OPTIONAL_MEMORY:
    condition: durable semantic memory unavailable
    behavior:
      - exact World + Workspace only
  LIMITED_COGNITION:
    condition: expensive reasoning implementations unavailable
    behavior:
      - use lower-cost compatible operators
      - increase uncertainty
      - block strategic commit if minimum quality floor cannot be met
  NO_SHADOW_LEARNING:
    condition: spare compute unavailable
    behavior:
      - active policy continues
      - learning slows
  READ_ONLY_COGNITION:
    condition: CommitManager target authority unavailable
    behavior:
      - reason/simulate allowed
      - canonical/action commit blocked
# =====================================================================
# 70. RECOVERY
# =====================================================================
recovery:
  order:
    - load active policy versions
    - restore module/operator registries
    - restore latest Workspace snapshots
    - replay unapplied Workspace patches
    - replay signal ingress from acknowledged cursors
    - reconcile running execution handles
    - cancel stale invocations
    - restore active CognitiveCascades
    - restore BranchPortfolios
    - revalidate DecisionFrames against current World/adjacent revisions
    - resume eligible cognition
    - reopen blocked decisions
  invariant: >
    Recovery may repeat idempotent cognition but must not duplicate domain commits.
# =====================================================================
# 71. IDEMPOTENCY
# =====================================================================
idempotency:
  CognitiveInvocation:
    key: invocation.idempotency_key
  WorkspacePatch:
    key: patch.idempotency_key
  CognitiveRequest:
    dedupe:
      - deduplication_key
      - scope
      - active decision
  WorldSignal_consumption:
    dedupe:
      - signal_id
      - consumer_id
  CommitRequest:
    key: commit_request.idempotency_key
  shadow_execution:
    must_never_produce_commit: true
# =====================================================================
# 72. OBSERVABILITY
# =====================================================================
observability:
  executive_metrics:
    - active_workspaces
    - active_decisions
    - reasoning_level_distribution
    - reasoning_escalation_rate
    - reasoning_deescalation_rate
    - average_decision_uncertainty
    - average_decision_regret_estimate
  signal_metrics:
    - signal_ingress_rate
    - signal_to_attention_rate
    - signal_to_operator_activation_rate
    - false_or_low_value_signal_rate
    - duplicate_signal_rate
  workspace_metrics:
    - workspace_size
    - workspace_revision_rate
    - stale_result_rate
    - cognitive_gc_rate
    - duplicate_hypothesis_merge_rate
  cascade_metrics:
    - cascade_depth
    - cascade_width
    - cross_domain_request_count
    - cascade_cycle_count
    - marginal_value_stop_rate
  operator_metrics:
    - operator_invocation_count
    - operator_failure_rate
    - operator_marginal_utility
    - operator_uncertainty_reduction
    - operator_cost
    - operator_latency
    - shadow_operator_value
  reasoning_metrics:
    - quality_by_reasoning_level
    - repair_rate_by_reasoning_level
    - cognitive_cost_per_accepted_decision
    - underthinking_failure_rate
    - overthinking_cost_rate
  arbitration_metrics:
    - arbitration_count
    - more_cognition_requested_rate
    - selected_proposal_reversal_rate
    - branch_regret
  commit_metrics:
    - stale_commit_rejection_rate
    - commit_rebase_rate
    - commit_failure_rate
  learning_metrics:
    - policy_candidate_count
    - shadow_policy_gain
    - canary_regression_rate
    - rollback_count
    - calibration_error
  autonomy_metrics:
    - human_intervention_count
    - human_intervention_per_finished_minute
    - autonomous_decision_acceptance_rate
    - autonomous_repair_success_rate
# =====================================================================
# 73. SECURITY / AUTHORITY
# =====================================================================
security:
  principles:
    - least privilege
    - typed APIs
    - explicit authority
    - module identity verification
    - tool capability does not imply proposal authority
    - proposal authority does not imply commit authority
  forbidden:
    - direct database access by cognitive modules
    - dynamic self-granting of broader scope
    - learned-policy modification of hard authority
    - model-generated credentials
    - unbounded tool access
  audit:
    every_consequential_invocation:
      records:
        - module
        - operator
        - implementation
        - scope
        - authority
        - World revision
        - Workspace revision
        - evidence
        - result
        - cost
# =====================================================================
# 74. PERFORMANCE
# =====================================================================
performance:
  objectives:
    - signal-driven rather than full-state polling
    - incremental Workspace updates
    - concurrency across independent scopes
    - context projection rather than full-state injection
    - operator-result caching
    - learned avoidance of low-value cognition
    - simulation fidelity ladder
    - staleness-aware recomputation
  initial_targets:
    executive_plan_p95_ms:
      target: 250
      excludes: model inference
    workspace_patch_p95_ms:
      target: 100
    signal_ingress_to_plan_p95_ms:
      target: 500
    routine_context_assembly_p95_ms:
      target: 1000
      excludes: model inference
    stale_dependency_detection_p95_ms:
      target: 250
  benchmark_requirements:
    - active Workspace size
    - number of concurrent decisions
    - World State size
    - signal rate
    - module count
    - operator count
    - provider/model mix
# =====================================================================
# 75. SCALABILITY
# =====================================================================
scalability:
  partitioning:
    primary:
      - project_id
      - universe_id
      - continuity_id
    secondary:
      - episode_id
      - workspace_id
      - decision_id
  concurrency:
    independent_scope_parallelism: true
  workspace:
    bounded_active_state_required: true
  traces:
    archive_closed_traces: true
  learning:
    experience_store_partitioning:
      - operator_id
      - decision_type
      - time_window
  requirement: >
    Runtime cognitive context must remain bounded even if the persistent universe
    spans hundreds of episodes.
# =====================================================================
# 76. STORAGE ABSTRACTIONS
# =====================================================================
storage_abstractions:
  ports:
    - WorkspaceStorePort
    - CognitiveTraceStorePort
    - CognitiveExperienceStorePort
    - PolicyStorePort
    - ExecutionStateStorePort
    - ModuleRegistryPort
    - OperatorRegistryPort
    - SignalCursorStorePort
    - CommitTargetRegistryPort
  provider_independence:
    required: true
  persistent_vs_ephemeral:
    persistent:
      - CognitiveTrace
      - OperatorExperience
      - accepted policy versions
      - execution receipts
      - selected Workspace recovery checkpoints
    ephemeral_or_reconstructable:
      - active Workspace derived views
      - cached WorkspaceViews
      - operator caches
      - transient execution queues
# =====================================================================
# 77. API BOUNDARIES
# =====================================================================
API_boundaries:
  executive:
    - process_signal
    - process_result
    - plan
    - continue_reasoning
    - escalate
    - stop
