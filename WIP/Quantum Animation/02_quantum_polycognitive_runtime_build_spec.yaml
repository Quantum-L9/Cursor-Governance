    - rank
    - pin
    - release
  reasoning:
    - allocate_budget
    - rank_operators
    - evaluate_stopping
  cascade:
    - start
    - extend
    - stop
    - inspect
  simulation:
    - create_portfolio
    - simulate
    - extend
    - compare
    - prune
    - discard
  arbitration:
    - arbitrate
  commit:
    - validate
    - rebase
    - commit
  learning:
    - record_trace
    - record_operator_experience
    - train_candidate_policy
    - evaluate_candidate_policy
    - activate_policy
    - rollback_policy
# =====================================================================
# 78. PACKAGE LAYOUT
