metadata:
  spec_id: quantum.animation.canonical_artifact_ir.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Canonical Artifact and Intermediate Representation Contracts
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
      relationship: PROVENANCE_REFERENCE_DEPENDENCY
  architectural_identity:
    concise: >
      Common typed envelope and lifecycle contract for every cross-subsystem
      semantic object, intermediate representation, artifact, certificate,
      lock, evidence record, and projection in Quantum Animation Studio.
    extended: >
      The Canonical Artifact/IR contract standardizes object identity, versions,
      ownership, provenance, schema identity, digests, authority semantics,
      mutability, certification, dependencies, staleness, invalidation,
      serialization, references, and lifecycle across all studio subsystems.
      It does not define the internal domain payload of CreatorModel,
      WorldSnapshot, ProductionStrategy, QCRun, or other authority-owned
      structures. It defines the common envelope that lets those structures
      interoperate safely.
  owner_questions:
    - "What kind of object is this?"
    - "Who owns its meaning?"
    - "Which schema defines it?"
    - "Which exact version is this?"
    - "Is it mutable?"
    - "Is it authoritative or derived?"
    - "What is its provenance?"
    - "What does it depend on?"
    - "Can it be cached?"
    - "Can it be reused?"
    - "Can it be superseded?"
    - "Is it certified?"
    - "When does it become stale?"
    - "How should another subsystem reference it?"
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Prevent every subsystem from inventing incompatible identity, versioning,
    provenance, lifecycle, artifact metadata and reference semantics.
  success_definition: >
    All meaningful cross-system objects can be referenced, versioned,
    validated, serialized, traced, invalidated and consumed through the same
    minimal canonical envelope while retaining domain-specific payload ownership.
  leverage: >
    A single common object grammar dramatically reduces integration ambiguity
    across compilers, World state, cognition, production, QC, and execution.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  IR-001:
    name: ENVELOPE_NOT_DOMAIN_SCHEMA
    statement: >
      Canonical IR defines shared metadata and lifecycle, not domain payload semantics.
  IR-002:
    name: ONE_REFERENCE_MODEL
    statement: >
      All systems use the same CanonicalRef structure for cross-domain references.
  IR-003:
    name: ONE_OBJECT_IDENTITY_MODEL
    statement: >
      Logical identity, immutable version identity and content digest are separate.
  IR-004:
    name: IMMUTABLE_VERSIONS
    statement: >
      Semantic object versions are immutable once published unless explicitly
      declared as runtime mutable state.
  IR-005:
    name: MUTABLE_STATE_IS_EXCEPTIONAL
    statement: >
      Live execution state must explicitly declare mutable lifecycle semantics.
  IR-006:
    name: OWNER_IS_EXPLICIT
    statement: >
      Every object declares which subsystem owns its meaning.
  IR-007:
    name: AUTHORITY_CLASS_IS_EXPLICIT
    statement: >
      Source-of-truth objects, derived projections, evidence, plans and candidates
      must not be confused.
  IR-008:
    name: SCHEMA_VERSION_IS_EXPLICIT
    statement: >
      Every serialized object identifies its schema and schema version.
  IR-009:
    name: DIGEST_IS_FIRST_CLASS
    statement: >
      Immutable objects and media artifacts support digest-based integrity.
  IR-010:
    name: PROVENANCE_IS_STANDARD
    statement: >
      Cross-domain provenance uses a common structure and emits to spec 09.
  IR-011:
    name: DEPENDENCY_KEYS_STANDARDIZED
    statement: >
      Objects expose material dependency keys in a normalized form.
  IR-012:
    name: STALENESS_IS_STANDARDIZED
    statement: >
      Derived objects identify which changes can make them stale.
  IR-013:
    name: SUPERSESSION_NOT_MUTATION
    statement: >
      New semantic versions supersede prior versions.
  IR-014:
    name: CERTIFICATION_SEPARATE_FROM_EXISTENCE
    statement: >
      An artifact may exist without being accepted.
  IR-015:
    name: LOCK_SEPARATE_FROM_CERTIFICATE
    statement: >
      A certificate states quality acceptance; a lock controls semantic/edit lifecycle.
  IR-016:
    name: EVIDENCE_SEPARATE_FROM_TRUTH
    statement: >
      Evidence can support authoritative decisions without becoming authority itself.
  IR-017:
    name: CANDIDATE_SEPARATE_FROM_CERTIFIED
    statement: >
      Generated outputs must declare candidate state until accepted.
  IR-018:
    name: PROJECTION_SEPARATE_FROM_AUTHORITY
    statement: >
      Rebuildable views identify themselves as projections.
  IR-019:
    name: EXPERIENCE_SEPARATE_FROM_EXECUTION
    statement: >
      Learned evidence objects are derived from execution, not interchangeable with it.
  IR-020:
    name: SERIALIZATION_IS_DETERMINISTIC_WHERE_POSSIBLE
    statement: >
      Canonical semantic objects should support deterministic normalized serialization.
  IR-021:
    name: FORWARD_COMPATIBILITY
    statement: >
      Unknown additive fields should be safely preserved or ignored according to schema policy.
  IR-022:
    name: NO_OPAQUE_UNTYPED_BLOBS_ACROSS_BOUNDARIES
    statement: >
      Cross-system payloads must identify type/schema even if content is provider-specific.
  IR-023:
    name: CROSS_PROJECT_IDENTITY_SUPPORTED
    statement: >
      Reusable persistent entities/assets can be referenced across project boundaries.
  IR-024:
    name: DOMAIN_PAYLOAD_CAN_EVOLVE_INDEPENDENTLY
    statement: >
      Shared envelope evolution should not force synchronized rewrites of all domain schemas.
# =====================================================================
# 3. CANONICAL OBJECT CLASSES
# =====================================================================
canonical_object_classes:
  SOURCE:
    meaning: human_or_external_input
    examples:
      - creative.yaml
      - creator feedback
      - target statement
  DERIVED_MODEL:
    meaning: compiler_or_reducer_output_with_domain_semantics
    examples:
      - CreatorModel
      - AudienceModel
      - ProductionIntent
  WORLD_STATE:
    meaning: canonical_fictional_state
    examples:
      - WorldSnapshot
      - WorldEvent
  DECISION:
    meaning: committed_or_candidate_judgment
    examples:
      - selected Proposal
      - story branch decision
  SPECIFICATION:
    meaning: exact semantic_or_production_requirement
    examples:
      - SceneSpec
      - ShotSpec
      - QCContract
  PLAN:
    meaning: executable_or_semantic_plan
    examples:
      - ProductionStrategy
      - QCPlan
      - ExecutionDAG
  EXECUTION_STATE:
    meaning: mutable_runtime_state
    examples:
      - ProductionManifest
      - ProductionJob
  CANDIDATE_ARTIFACT:
    meaning: generated_output_not_yet_accepted
  CERTIFIED_ARTIFACT:
    meaning: immutable_artifact_with_valid_quality_certificate
  CERTIFICATE:
    meaning: independent_acceptance_assertion
  LOCK:
    meaning: lifecycle_or_semantic_freeze_marker
  EVIDENCE:
    meaning: immutable_observation_supporting_belief_or_judgment
  EXPERIENCE:
    meaning: derived_institutional_learning_record
  PROJECTION:
    meaning: rebuildable_derived_view
  POLICY:
    meaning: versioned_governance_or_selection_policy
# =====================================================================
# 4. CANONICAL ARTIFACT ENVELOPE
# =====================================================================
canonical_envelope:
  CanonicalObject:
    fields:
      header:
        type: CanonicalHeader
      lifecycle:
        type: LifecycleMetadata
      authority:
        type: AuthorityMetadata
      provenance:
        type: ProvenanceMetadata
      dependencies:
        type: DependencyMetadata
      certification:
        type: CertificationMetadata
      serialization:
        type: SerializationMetadata
      payload:
        type: domain_owned
  payload_ownership:
    rule: >
      This specification never interprets the internal payload beyond schema
      identity and generic validation rules.
# =====================================================================
# 5. CANONICAL HEADER
# =====================================================================
canonical_header:
  CanonicalHeader:
    required_fields:
      object_id:
        description: stable logical identity
      version:
        description: immutable object version
      object_class:
        enum_ref: canonical_object_classes
      object_type:
        description: domain-specific semantic type
      schema_id:
        description: canonical schema identifier
      schema_version:
      owner_system:
      namespace:
      project_id:
        nullable: true
      universe_id:
        nullable: true
      created_at:
      created_by:
        type: ActorRef
      digest:
        nullable: true
  optional_fields:
    - parent_version
    - display_name
    - tags
    - content_type
    - language
    - correlation_id
    - causation_id
# =====================================================================
# 6. CANONICAL REF
# =====================================================================
canonical_ref:
  CanonicalRef:
    fields:
      namespace:
      owner_system:
      object_type:
      object_id:
      version:
        nullable: true
      digest:
        nullable: true
      project_id:
        nullable: true
      universe_id:
        nullable: true
  reference_modes:
    exact:
      requires:
        - object_id
        - version
    content_exact:
      requires:
        - digest
    logical_latest:
      allowed:
        - read_queries
      forbidden:
        - consequential_reproducibility_without_resolution
  canonical_URI:
    pattern: >
      quantum://{namespace}/{object_type}/{object_id}?version={version}
# =====================================================================
# 7. ACTOR REF
# =====================================================================
actor_ref:
  ActorRef:
    fields:
      actor_type:
        enum:
          - HUMAN_CREATOR
          - COMPILER
          - COGNITIVE_MODULE
          - SYSTEM_SERVICE
          - REDUCER
          - PRODUCTION_ENGINE
          - AUTONOMOUS_QC
          - EXTERNAL_PROVIDER
      actor_id:
      actor_version:
        nullable: true
      cognitive_trace_ref:
        nullable: true
# =====================================================================
# 8. AUTHORITY METADATA
# =====================================================================
authority_metadata:
  AuthorityMetadata:
    fields:
      authority_class:
        enum:
          - AUTHORITATIVE
          - DERIVED
          - ADVISORY
          - EVIDENCE
          - EXECUTIONAL
          - PROJECTION
      owner_system:
      write_authority:
        type: list[string]
      read_policy:
        default: INTERNAL
      mutable:
        type: bool
      finality:
        enum:
          - DRAFT
          - PUBLISHED
          - SUPERSEDED
          - RETIRED
  rules:
    AUTHORITATIVE:
      examples:
        - CreatorModel
        - WorldEvent
        - WorldSnapshot
        - SelfModelSnapshot_within_self_domain
    DERIVED:
      examples:
        - NarrativeOpportunity
        - ProductMarketModel
        - ProductionIntent
    ADVISORY:
      examples:
        - ProductRecommendation
        - CapabilitySuitability
    EVIDENCE:
      examples:
        - CapabilityObservation
        - QC observation
    EXECUTIONAL:
      examples:
        - ProductionManifest
    PROJECTION:
      examples:
        - ProjectProvenanceGraph
# =====================================================================
# 9. LIFECYCLE METADATA
# =====================================================================
lifecycle_metadata:
  LifecycleMetadata:
    fields:
      state:
        type: string
      parent_ref:
        nullable: true
      supersedes_refs:
        type: list[CanonicalRef]
      superseded_by_ref:
        nullable: true
      valid_from:
        nullable: true
      valid_to:
        nullable: true
      stale:
        default: false
      invalidated:
        default: false
      invalidation_reason_refs:
        type: list[CanonicalRef]
      retired:
        default: false
  rule: >
    Domain-specific lifecycle states may extend this metadata but cannot violate
    immutable-version semantics.
# =====================================================================
# 10. PROVENANCE METADATA
# =====================================================================
provenance_metadata:
  ProvenanceMetadata:
    fields:
      source_refs:
        type: list[CanonicalRef]
      evidence_refs:
        type: list[CanonicalRef]
      decision_refs:
        type: list[CanonicalRef]
      execution_refs:
        type: list[CanonicalRef]
      compiler_ref:
        nullable: true
      policy_refs:
        type: list[CanonicalRef]
      provenance_emission_ref:
        nullable: true
  emission:
    target: spec_09
# =====================================================================
# 11. DEPENDENCY METADATA
# =====================================================================
dependency_metadata:
  DependencyMetadata:
    fields:
      dependencies:
        type: list[CanonicalDependencyRef]
      invalidation_keys:
        type: list[InvalidationKey]
      freshness:
        type: FreshnessMetadata
  CanonicalDependencyRef:
    fields:
      ref:
        type: CanonicalRef
      dependency_type:
      strength:
        enum:
          - INFORMATIONAL
          - WEAK
          - MATERIAL
          - HARD
          - IDENTITY
      material_fields:
        type: list[string]
      invalidation_mode:
        enum:
          - NEVER
          - ALWAYS
          - ON_MATERIAL_CHANGE
          - CERTIFICATE_DEFINED
          - CUSTOM
  InvalidationKey:
    fields:
      key:
      semantic_scope:
      source_ref:
        nullable: true
# =====================================================================
# 12. FRESHNESS
# =====================================================================
freshness:
  FreshnessMetadata:
    fields:
      generated_at:
      source_cutoff:
        nullable: true
      freshness_class:
        enum:
          - IMMUTABLE
          - STABLE
          - SLOW_CHANGING
          - LIVE
          - REALTIME
      max_age:
        nullable: true
      stale_after:
        nullable: true
      last_validated_at:
        nullable: true
  examples:
    WorldSnapshot:
      freshness_class: IMMUTABLE
    SelfModel_live_availability:
      freshness_class: REALTIME
    AudienceModel:
      freshness_class: STABLE
    ProductionManifest:
      freshness_class: LIVE
# =====================================================================
# 13. CERTIFICATION METADATA
# =====================================================================
certification_metadata:
  CertificationMetadata:
    fields:
      certification_required:
        default: false
      certificate_refs:
        type: list[CanonicalRef]
      certified:
        default: false
      certified_at:
        nullable: true
      certificate_validity_checked_at:
        nullable: true
  rule: >
    certified=true is valid only when at least one currently valid certificate
    satisfies the object's acceptance contract.
# =====================================================================
# 14. SERIALIZATION METADATA
# =====================================================================
serialization_metadata:
  SerializationMetadata:
    fields:
      canonical_format:
        enum:
          - YAML
          - JSON
          - PROTOBUF
          - MSGPACK
          - BINARY_MEDIA
          - DATABASE_RECORD
          - GRAPH_PROJECTION
      media_type:
      encoding:
        nullable: true
      canonicalization_version:
      normalized_digest_algorithm:
        default: sha256
  deterministic_serialization:
    required_for:
      - locks
      - certificates
      - semantic specs
      - immutable derived models
      - provenance snapshots
# =====================================================================
# 15. INTERMEDIATE REPRESENTATION BASE
# =====================================================================
IR_base:
  IntermediateRepresentation:
    extends:
      - CanonicalObject
    required:
      object_class:
        one_of:
          - DERIVED_MODEL
          - WORLD_STATE
          - DECISION
          - SPECIFICATION
          - PLAN
          - PROJECTION
      authority.mutable:
        value: false
      schema_id:
        required: true
      schema_version:
        required: true
  purpose: >
    IR means a structured machine-consumable representation passed between
    compiler/runtime stages.
  not_required_to_be:
    - textual
    - YAML
    - human_friendly
# =====================================================================
# 16. WHAT "IR" MEANS
# =====================================================================
IR_definition:
  acronym:
    IR: Intermediate Representation
  compiler_semantics: >
    An IR is a stable structured representation between transformations.
  examples:
    creative_source:
      creative.yaml
    compiled_creative_IR:
      CreatorModel
    story_IR:
      StoryPlan
    scene_IR:
      SceneSpec
    shot_IR:
      ShotSpec
    production_IR:
      ProductionIntent
    manufacturing_IR:
      ProductionStrategy
    execution_IR:
      ExecutionDAG
  key_property: >
    Each IR removes ambiguity appropriate to its compiler stage while preserving
    enough semantic information for downstream reasoning and validation.
# =====================================================================
# 17. SOURCE ARTIFACT CONTRACT
# =====================================================================
source_artifact:
  SourceArtifact:
    extends:
      - CanonicalObject
    object_class:
      value: SOURCE
    authority_class:
      value: AUTHORITATIVE_OR_EXTERNAL_SOURCE
    examples:
      - creative.yaml
      - creator.feedback.yaml
  mutation:
    recommended:
      immutable_revision_history: true
# =====================================================================
# 18. DERIVED MODEL CONTRACT
# =====================================================================
derived_model:
  DerivedModelArtifact:
    extends:
      - IntermediateRepresentation
    object_class:
      value: DERIVED_MODEL
    requires:
      - source_refs
      - compiler_or_reducer_ref
      - digest
    examples:
      - CreatorModel
      - AudienceModel
      - ProductMarketModel
      - ProductionIntent
      - SelfModelSnapshot
# =====================================================================
# 19. DECISION CONTRACT
# =====================================================================
decision_artifact:
  DecisionArtifact:
    extends:
      - IntermediateRepresentation
    object_class:
      value: DECISION
    fields:
      selected_proposal_ref:
        nullable: true
      alternatives_considered:
        type: list[CanonicalRef]
      decision_frame_ref:
        nullable: true
      rationale_ref:
        nullable: true
      confidence:
      authority_envelope_ref:
        nullable: true
  rule: >
    Consequential cognitive decisions should be persistable as explicit objects,
    not only hidden inside model outputs.
# =====================================================================
# 20. SPECIFICATION CONTRACT
# =====================================================================
specification_artifact:
  SpecificationArtifact:
    extends:
      - IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    properties:
      - exact_semantics
      - downstream_consumable
      - validation_contract
    examples:
      - SceneSpec
      - ShotSpec
      - QCContract
      - DeliveryProfile
# =====================================================================
# 21. PLAN CONTRACT
# =====================================================================
plan_artifact:
  PlanArtifact:
    extends:
      - IntermediateRepresentation
    object_class:
      value: PLAN
    examples:
      - ProductionStrategy
      - QCPlan
      - ExecutionDAG
    requires:
      - dependency_metadata
      - plan_version
      - owning_system
# =====================================================================
# 22. EXECUTION STATE CONTRACT
# =====================================================================
execution_state_artifact:
  ExecutionStateObject:
    extends:
      - CanonicalObject
    object_class:
      value: EXECUTION_STATE
    authority:
      mutable: true
      authority_class: EXECUTIONAL
    requirements:
      - optimistic_or_transactional_revision
      - updated_at
      - durable_transition_history
    examples:
      - ProductionManifest
      - ProductionJob
# =====================================================================
# 23. CANDIDATE ARTIFACT
# =====================================================================
candidate_artifact:
  CandidateArtifact:
    extends:
      - CanonicalObject
    object_class:
      value: CANDIDATE_ARTIFACT
    authority_class:
      value: EXECUTIONAL
    certified:
      value: false
    fields:
      blob_ref:
      media_metadata:
      generation_receipt_ref:
      semantic_scope_ref:
      production_unit_ref:
    may_be:
      - selected
      - rejected
      - superseded
      - certified
# =====================================================================
# 24. CERTIFIED ARTIFACT
# =====================================================================
certified_artifact:
  CertifiedArtifact:
    extends:
      - CandidateArtifact
    object_class:
      value: CERTIFIED_ARTIFACT
    requirements:
      certified: true
      certificate_refs:
        minimum: 1
      mutable: false
      digest: required
    invariant: >
      Certified artifact content cannot change without producing a new artifact identity/version.
# =====================================================================
# 25. CERTIFICATE CONTRACT
# =====================================================================
certificate_artifact:
  CertificateArtifact:
    extends:
      - CanonicalObject
    object_class:
      value: CERTIFICATE
    authority_class:
      value: AUTHORITATIVE
    owner_system:
      expected: autonomous_qc
    required:
      - target_ref
      - target_digest
      - acceptance_contract_ref
      - source_revision_refs
      - issued_at
      - invalidation_conditions
    mutable:
      value: false
# =====================================================================
# 26. LOCK CONTRACT
# =====================================================================
lock_artifact:
  LockArtifact:
    extends:
      - CanonicalObject
    object_class:
      value: LOCK
    fields:
      lock_type:
      target_refs:
      target_digests:
      owning_authority:
      created_at:
      unlock_policy:
      invalidation_conditions:
  examples:
    - creative.lock
    - screenplay.lock
    - animatic.lock
    - scene.lock
    - episode.lock
    - master.lock
  distinction_from_certificate: >
    Certificate says "this is acceptable." Lock says "this state is frozen for
    downstream dependency purposes until explicitly reopened or invalidated."
# =====================================================================
# 27. EVIDENCE CONTRACT
# =====================================================================
evidence_artifact:
  EvidenceObject:
    extends:
      - CanonicalObject
    object_class:
      value: EVIDENCE
    authority_class:
      value: EVIDENCE
    properties:
      immutable: true
      source_timestamp_required: true
      confidence_required: true
    examples:
      - CapabilityObservation
      - CriticResult
      - ExecutionReceipt
      - AudienceObservation
# =====================================================================
# 28. EXPERIENCE CONTRACT
# =====================================================================
experience_artifact:
  ExperienceObject:
    extends:
      - CanonicalObject
    object_class:
      value: EXPERIENCE
    authority_class:
      value: DERIVED
    required:
      - source_evidence_refs
      - condition_features
      - outcome
      - confidence
    examples:
      - OperatorExperience
      - ProductionStrategyExperience
      - QCFailurePattern
      - SuccessPattern
# =====================================================================
# 29. PROJECTION CONTRACT
# =====================================================================
projection_artifact:
  ProjectionObject:
    extends:
      - CanonicalObject
    object_class:
      value: PROJECTION
    authority_class:
      value: PROJECTION
    fields:
      source_cutoffs:
      rebuild_spec_ref:
      projection_revision:
      refresh_policy:
    rule: >
      Projection loss cannot destroy authoritative semantics.
    examples:
      - ProjectProvenanceGraph
      - semantic memory projection
      - analytics materialization
# =====================================================================
# 30. POLICY CONTRACT
# =====================================================================
policy_artifact:
  PolicyObject:
    extends:
      - CanonicalObject
    object_class:
      value: POLICY
    fields:
      policy_scope:
      lifecycle_state:
        enum:
          - CANDIDATE
          - SHADOW
          - CANARY
          - ACTIVE
          - ROLLED_BACK
          - RETIRED
      promotion_evidence_refs:
      supersedes_policy_ref:
        nullable: true
    immutable_versioned: true
# =====================================================================
# 31. MEDIA ARTIFACT METADATA
# =====================================================================
media_metadata:
  MediaMetadata:
    common:
      duration_seconds:
        nullable: true
      frame_rate:
        nullable: true
      width:
        nullable: true
      height:
        nullable: true
      aspect_ratio:
        nullable: true
      color_space:
        nullable: true
      channels:
        nullable: true
      sample_rate:
        nullable: true
      codec:
        nullable: true
      container:
        nullable: true
    domain_extensions:
      allowed: true
  rule: >
    Media metadata does not replace semantic ShotSpec or World state.
# =====================================================================
# 32. BLOB REF
# =====================================================================
blob_ref:
  BlobRef:
    fields:
      storage_namespace:
      object_key:
      content_digest:
      size_bytes:
      media_type:
      encryption:
        nullable: true
  prohibited:
    - embedding_secrets
    - provider_credentials
# =====================================================================
# 33. SCHEMA REGISTRY
# =====================================================================
schema_registry:
  CanonicalSchemaDefinition:
    fields:
      schema_id:
      version:
      owner_system:
      object_type:
      compatibility:
        enum:
          - BACKWARD
          - FORWARD
          - FULL
          - NONE
      deprecated:
      supersedes_schema_ref:
        nullable: true
  required_capabilities:
    - register_schema
    - resolve_schema
    - validate_object
    - compare_schema_versions
    - migrate_object
  schema_owner:
    domain_system: true
# =====================================================================
# 34. SCHEMA EVOLUTION
# =====================================================================
schema_evolution:
  additive_change:
    default:
      compatible: true
  field_removal:
    requires:
      - major_schema_version
      - migration_plan
  semantic_meaning_change:
    requires:
      - new_schema_version
      - explicit migration
  unknown_field_behavior:
    preserve_if_possible: true
  canonical_envelope:
    evolution_rate:
      conservative: true
# =====================================================================
# 35. VERSIONING
# =====================================================================
versioning:
  object_identity:
    object_id:
      meaning: logical_object
    version:
      meaning: immutable_revision
    digest:
      meaning: exact_serialized_content_or_blob
  version_generation:
    allowed:
      - monotonic_integer
      - UUID_revision
      - content_addressed_revision
  project_policy:
    one_strategy_must_be_selected: true
  parent_version:
    recommended: true
# =====================================================================
# 36. SUPERSESSION
# =====================================================================
supersession:
  semantics:
    old_version:
      remains_readable: true
    new_version:
      adds:
        - supersedes_ref
  current_version_resolution:
    owner_domain_resolver: true
  no_destructive_replace:
    value: true
# =====================================================================
# 37. DIGESTS
# =====================================================================
digest_contract:
  required_for:
    - immutable semantic objects
    - certificates
    - locks
    - media blobs
    - final artifacts
    - provenance projection revisions
  canonicalization:
    structured_objects:
      must_normalize:
        - key_order
        - insignificant_whitespace
        - timestamp_format
        - numeric_representation_where_relevant
  algorithm:
    default: SHA-256
# =====================================================================
# 38. STALENESS / INVALIDATION
# =====================================================================
staleness_and_invalidation:
  stale:
    meaning: >
      Object may no longer correctly reflect its dependencies.
  invalidated:
    meaning: >
      Object is no longer permitted as valid downstream input.
  distinction:
    stale_may_be_revalidated: true
  actions:
    - mark_stale
    - revalidate
    - invalidate
    - supersede
    - recompile
  origin:
    - domain system
    - Provenance impact analysis
    - QC certificate invalidation
    - execution invalidation
# =====================================================================
# 39. LOCK SEMANTICS
# =====================================================================
locks:
  lock_types:
    CREATIVE_LOCK:
      owner: 03
    STORY_LOCK:
      owner: story_compiler_future_12
    ANIMATIC_LOCK:
      owner: story_animatic_compiler_future_12
    PRODUCTION_LOCK:
      owner: 06
    ARTIFACT_LOCK:
      owner: 08_and_07_certificate_gate
    MASTER_LOCK:
      owner: 07_acceptance_plus_08_materialization
  lock_behavior:
    prevents_uncontrolled_mutation: true
  reopening:
    requires:
      - owning_authority
      - new_version_on_change
      - dependency impact analysis
# =====================================================================
# 40. CROSS-SUBSYSTEM CONTRACT RULES
# =====================================================================
cross_subsystem_rules:
  rule_01:
    >
    A subsystem receives references to authority-owned objects rather than
    copying mutable snapshots unless explicitly required.
  rule_02:
    >
    Cross-subsystem payload must include schema identity.
  rule_03:
    >
    Consequential downstream compilation pins exact input versions.
  rule_04:
    >
    Provider-specific execution payloads may be namespaced but cannot redefine
    canonical object semantics.
  rule_05:
    >
    A derived model must identify its source cutoff and compiler/policy versions.
  rule_06:
    >
    Every generated candidate artifact references the ProductionStrategy and
    execution receipt that created it.
  rule_07:
    >
    Every QualityCertificate references exact target digest.
  rule_08:
    >
    Every ExperienceObject references source evidence.
# =====================================================================
# 41. IR PIPELINE EXAMPLE
# =====================================================================
example_IR_chain:
  flow: |
    creative.yaml
        [SOURCE]
          ↓
    CreatorModel
        [DERIVED_MODEL]
          ↓
    WorldGenesisPlan
        [PLAN]
          ↓
    WorldSnapshot
        [WORLD_STATE]
          ↓
    StoryPlan
        [SPECIFICATION]
          ↓
    SceneSpec
        [SPECIFICATION]
          ↓
    ShotSpec
        [SPECIFICATION]
          ↓
    AnimaticTimeline
        [CANDIDATE_ARTIFACT / SPECIFICATION HYBRID]
          ↓
    animatic.lock
        [LOCK]
          ↓
    ProductionIntent
        [DERIVED_MODEL]
          ↓
    ProductionStrategy
        [PLAN]
          ↓
    ExecutionDAG
        [PLAN]
          ↓
    ProductionManifest
        [EXECUTION_STATE]
          ↓
    ShotTake
        [CANDIDATE_ARTIFACT]
          ↓
    QCRun
        [EVIDENCE]
          ↓
    QualityCertificate
        [CERTIFICATE]
          ↓
    CertifiedShot
        [CERTIFIED_ARTIFACT]
          ↓
    Master
        [CERTIFIED_ARTIFACT]
# =====================================================================
# 42. OBJECT CLASS TRANSITIONS
# =====================================================================
object_transitions:
  candidate_to_certified:
    changes_object_class:
      yes: true
    may_reuse_same_blob:
      yes: true
    requires:
      - valid certificate
  draft_to_published:
    allowed: true
  published_to_superseded:
    allowed: true
  superseded_to_published:
    forbidden: true
  evidence_to_authoritative:
    automatic: false
  projection_to_authoritative:
    automatic: false
  execution_state_to_semantic_source:
    forbidden: true
# =====================================================================
# 43. COMPOSITE IR
# =====================================================================
composite_IR:
  CompositeIR:
    purpose: >
      Bundle multiple canonical refs into one explicit compilation package
      without duplicating their semantics.
    fields:
      bundle_id:
      bundle_type:
      refs:
      pinned_versions:
      bundle_digest:
      created_at:
  examples:
    - WorldDerivedShotPackage
    - CognitiveContextPackage
    - ProductionExecutionPackage
    - QCSubmissionPackage
# =====================================================================
# 44. WORLD-DERIVED PACKAGE CONTRACT
# =====================================================================
world_derived_package:
  WorldDerivedPackage:
    extends:
      - CompositeIR
    includes_as_refs:
      - WorldCoordinate
      - WorldSnapshot
      - relevant_entity_refs
      - relevant_relationship_refs
      - relevant_intent_refs
      - relevant_knowledge_refs
      - relevant_affordance_refs
      - expected_visible_state
      - applicable_rule_refs
    rule: >
      Package is a contextual projection; source World objects remain canonical.
# =====================================================================
# 45. COGNITIVE PACKAGE CONTRACT
# =====================================================================
cognitive_package:
  CognitiveContextPackage:
    extends:
      - CompositeIR
    includes:
      - CognitiveRequest
      - CognitiveScope
      - WorkspaceView
      - relevant CanonicalRefs
      - WorldSignals
      - budget
      - authority envelope
    persistence:
      default: temporary_or_trace_only
# =====================================================================
# 46. PRODUCTION EXECUTION PACKAGE
# =====================================================================
production_execution_package:
  ProductionExecutionPackage:
    extends:
      - CompositeIR
    includes:
      - ProductionStrategy_ref
      - pinned ProductionIntent_ref
      - pinned World refs
      - asset refs
      - implementation binding
      - QCContract_ref
      - retry/fallback refs
    consumed_by:
      - ProductionEngine
# =====================================================================
# 47. QC SUBMISSION PACKAGE
# =====================================================================
QC_submission_package:
  QCSubmissionPackage:
    extends:
      - CompositeIR
    includes:
      - candidate_artifact_ref
      - expected_state_refs
      - CreatorModel_ref
      - AudienceModel_ref_if_required
      - ProductMarketModel_ref_if_required
      - ProductionIntent_ref
      - ProductionStrategy_ref
      - execution_receipt_refs
      - QCContract_ref
# =====================================================================
# 48. STORAGE REPRESENTATION
# =====================================================================
storage_representation:
  structured_IR:
    acceptable:
      - YAML
      - JSON
      - protobuf
      - relational rows
  media:
    stored_as_blob: true
    envelope_metadata_separate: preferred
  graph_projections:
    stored_as_projection: true
  no_single_storage_engine_required:
    value: true
# =====================================================================
# 49. VALIDATION
# =====================================================================
validation:
  common_checks:
    - required header fields
    - valid schema
    - owner_system recognized
    - object_class valid
    - version present
    - referenced objects resolvable
    - digest correct when required
    - authority/mutability combination valid
    - certification state valid
    - provenance emission possible
  invalid_combinations:
    certified_without_certificate:
      reject: true
    immutable_without_version:
      reject: true
    projection_marked_authoritative:
      reject: true
    execution_state_marked_CREATOR_authority:
      reject: true
    evidence_marked_World_truth:
      reject: true
# =====================================================================
