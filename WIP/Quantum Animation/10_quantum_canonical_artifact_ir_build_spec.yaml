# =====================================================================
# 55. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: IR-G01
    check: common envelope does not redefine domain payloads
  - id: IR-G02
    check: one CanonicalRef used across all subsystems
  - id: IR-G03
    check: authority class explicit
  - id: IR-G04
    check: object class explicit
  - id: IR-G05
    check: schema version explicit
  - id: IR-G06
    check: immutable versions enforced
  - id: IR-G07
    check: candidate and certified artifacts separated
  - id: IR-G08
    check: certificate and lock separated
  - id: IR-G09
    check: evidence and truth separated
  - id: IR-G10
    check: projection and authority separated
  - id: IR-G11
    check: provenance emitted through spec 09
  - id: IR-G12
    check: dependency/invalidation metadata standardized
  - id: IR-G13
    check: deterministic digest supported
  - id: IR-G14
    check: execution state mutable semantics explicitly isolated
  - id: IR-G15
    check: MVP object chain serializes and validates end to end
# =====================================================================
# 56. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  common_contract:
    - CanonicalObject
    - CanonicalHeader
    - CanonicalRef
    - authority metadata
    - lifecycle metadata
    - provenance metadata
    - dependency metadata
    - freshness metadata
    - certification metadata
    - serialization metadata
  lifecycle:
    - immutable semantic versions
    - supersession
    - staleness
    - invalidation
    - retirement
  object_classes:
    - SOURCE
    - DERIVED_MODEL
    - WORLD_STATE
    - DECISION
    - SPECIFICATION
    - PLAN
    - EXECUTION_STATE
    - CANDIDATE_ARTIFACT
    - CERTIFIED_ARTIFACT
    - CERTIFICATE
    - LOCK
    - EVIDENCE
    - EXPERIENCE
    - PROJECTION
    - POLICY
  integration:
    - compatible with 00–09
    - usable by future 11–16
    - no domain ownership conflict
  MVP:
    - creative.yaml_to_master chain uses one common object/reference grammar
  release:
    requirement: IR-G01_through_IR-G15_pass
# =====================================================================
# 57. OPEN DECISIONS
# =====================================================================
open_decisions:
  - id: IR-OD-01
    decision: canonical structured serialization format
    status: OPEN
    recommendation: >
      YAML for human-authored source; JSON or equivalent canonical structured
      form internally.
  - id: IR-OD-02
    decision: exact object version identifier scheme
    status: OPEN
  - id: IR-OD-03
    decision: schema registry implementation
    status: UNKNOWN
  - id: IR-OD-04
    decision: canonical URI exact encoding
    status: OPEN
  - id: IR-OD-05
    decision: deterministic canonicalization library
    status: TO_DEFINE
# =====================================================================
# 58. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: shared envelope becomes giant universal schema
    control:
      - domain payload remains domain-owned
  - risk: every system forks object metadata
    control:
      - one canonical envelope package
  - risk: live runtime state confused with semantic IR
    control:
      - explicit EXECUTION_STATE object class
  - risk: candidate artifact accidentally trusted as accepted
    control:
      - certification state + certificate requirement
  - risk: graph projection treated as truth
    control:
      - PROJECTION authority class
  - risk: evidence silently becomes canonical state
    control:
      - EVIDENCE class + explicit owner authority
  - risk: schema evolution breaks stored projects
    control:
      - schema registry
      - compatibility contracts
      - migration
  - risk: object identity confused with blob digest
    control:
      - separate object_id/version/digest
  - risk: latest-version resolution destroys reproducibility
    control:
      - exact refs required for consequential execution
# =====================================================================
# 59. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    IR means Intermediate Representation: structured state between compiler stages.
  law_02: >
    Canonical IR defines the envelope; domain systems define the payload.
  law_03: >
    Every object has an owner.
  law_04: >
    Every consequential object has a schema.
  law_05: >
    Every immutable semantic object has a version.
  law_06: >
    Logical identity, version identity and content digest are different concepts.
  law_07: >
    Cross-system references use one canonical reference contract.
  law_08: >
    Candidate output is not accepted output.
  law_09: >
    Certificate and lock are different concepts.
  law_10: >
    Evidence supports truth but is not truth.
  law_11: >
    Projection describes authority but does not become authority.
  law_12: >
    Execution state is mutable; semantic versions are not.
  law_13: >
    Supersession creates history instead of deleting it.
  law_14: >
    Derived models expose source revisions and policy/compiler versions.
  law_15: >
    Every generated artifact identifies how it was produced.
  law_16: >
    Every certified artifact identifies who certified it and against which exact contract.
  law_17: >
    Every experience object remains connected to its originating evidence.
  law_18: >
    Consequential execution pins exact versions rather than "latest."
  law_19: >
    Common contracts should reduce ambiguity without centralizing domain meaning.
  law_20: >
    By the time an artifact reaches the final master, Quantum must be able to
    traverse one consistent reference grammar from creative source through every
    semantic, production, execution, QC, and certification stage.

These two are deliberately complementary rather than overlapping:

10 CANONICAL ARTIFACT / IR
"What kind of thing is this, how is it identified,
versioned, owned, referenced and certified?"
                    ↓ enables
09 PROJECT PROVENANCE GRAPH
"How are all of those things connected,
what produced them, and what depends on them?"

The important architectural split is:

CanonicalRef / CanonicalObject
        =
the grammar
Project Provenance Graph
        =
the connective tissue
00–08
        =
the authorities

That closes the most important cross-studio structural gap before we build the actual creative.yaml → project → animatic compiler path in Turn 2.