architectural_identity:
  concise: >
    Convert earned project desire into a clear, fair, fixed, time-bounded,
    machine-readable commercial opportunity that a qualified buyer can accept,
    reserve or decline without meetings, negotiation theater or hidden economics.
  extended: >
    Quantum Commercial Offer and Conversion Runtime owns the commercial semantics
    of what Quantum is offering to a particular buyer. It compiles Studio
    Commercial Policy, project scope, rights intent, pricing policy, production
    feasibility, target opportunity context and the locked CuratedProjectExperience
    into a CommercialOfferIR. It defines consideration, payment percentages,
    delivery commitments, included revision policy, acceptance policy, project
    rights offered, Quantum-reserved platform/studio rights, expansion options,
    initial exclusivity, paid reservation, expiration, fixed-term policy,
    buyer dependencies and Quantum obligations. It also owns the state machine
    from OFFER_REVEALED through ACCEPTED, RESERVED, EXPIRED or DECLINED.
    It does not create the binding legal instrument, validate legal enforceability,
    collect payments or trigger production. Those are delegated to specs 24 and 25.
  philosophical_identity: >
    Quantum does not negotiate by default. Quantum computes a fair opportunity,
    states exactly what yes means, creates a real decision window, and then
    respects the answer.
ownership:
  system: COMMERCIAL_OFFER_CONVERSION
  owner_question:
    primary: >
      What exactly may this buyer acquire from Quantum, for what consideration,
      under what commercial conditions and for how long is that opportunity
      exclusively available?
  secondary_questions:
    - "What is the product being offered?"
    - "What project scope is included?"
    - "What is the total consideration?"
    - "What payment schedule applies?"
    - "Which rights are offered?"
    - "Which Quantum rights can never be transferred by this offer?"
    - "How many revision rounds are included?"
    - "What counts as a revision?"
    - "What counts as a material change?"
    - "What constitutes delivery?"
    - "What constitutes contractual acceptance?"
    - "How long does the initial exclusive offer remain open?"
    - "When does that clock begin?"
    - "What does a reservation payment purchase?"
    - "How long does reservation extend exclusivity?"
    - "Is the reservation payment credited to the transaction?"
    - "What happens if the reservation expires?"
    - "May the expired buyer later reopen the same opportunity?"
    - "What happens when the buyer declines?"
    - "What actions are available without scheduling a meeting?"
    - "How do we know the offer is fair?"
    - "How do we reduce decision friction?"
    - "What evidence supports execution confidence?"
    - "What commercial terms are fixed?"
    - "What authority may the system exercise autonomously?"
  owns:
    - StudioCommercialPolicy
    - CommercialAuthorityEnvelope
    - ProjectCommercialIntent
    - CommercialOfferIR
    - CommercialOfferVersion
    - CommercialOfferLock
    - OfferProductScope
    - OfferConsideration
    - PaymentScheduleSemantics
    - OfferRightsModel
    - QuantumReservedRights
    - RevisionPolicy
    - AcceptancePolicy
    - DeliveryCommitment
    - BuyerDependencyPolicy
    - QuantumObligationPolicy
    - CommercialOfferMode
    - ExclusivityPolicy
    - OfferAvailabilityWindow
    - OfferReveal
    - ReservationPolicy
    - ReservationState
    - ReservationCommercialEffect
    - ExpirationPolicy
    - DeclinePolicy
    - ReofferPolicy
    - OfferDecisionState
    - OfferFairnessModel
    - ContractReadinessPayload
    - SignabilityProjection
    - ConversionPotential
    - CommercialOfferQCContract
    - CommercialOfferAuthorization
    - commercial conversion events
  explicitly_does_not_own:
    binding_legal_language:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    legal_enforceability:
      owner: external_legal_authority_plus_spec_24
    e_signature:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    legal_record_retention:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    payment_execution:
      owner: 25_quantum_payment_work_authorization_build_spec.yaml
    payment_clearing_truth:
      owner: 25_quantum_payment_work_authorization_build_spec.yaml
    production_start:
      owner: 25_quantum_payment_work_authorization_build_spec.yaml
    ProjectMarketValueModel:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    acquisition_target_selection:
      owner: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
    reputation:
      owner: 27_quantum_client_relationship_reputation_build_spec.yaml
    final_creator_release:
      owner: 30_quantum_creator_release_delivery_build_spec.yaml
  hard_boundary: >
    CommercialOfferIR defines business intent and offer semantics. Only spec 24
    may compile those semantics into a binding legal instrument.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Make a commercially compelling project exceptionally easy to say yes to.
  friction_goal: >
    A qualified buyer should be able to understand product, price, rights,
    delivery, revisions, acceptance and timing without scheduling a meeting.
  fairness_goal: >
    Quantum should quote terms that create meaningful economic upside for the
    buyer while preserving sufficient economics to fund quality, reliability,
    reputation and future studio capability.
  autonomy_goal: >
    Once StudioCommercialPolicy is configured, ordinary in-policy offers should
    compile and progress without creator involvement.
  repeat_business_goal: >
    Optimize commercial relationships as repeated games rather than maximizing
    extraction from a single transaction.
  canonical_behavior: >
    Fair terms. Clear scope. Real deadline. No nickel-and-diming. No bluffing.
    No unnecessary negotiation.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  CO-001:
    name: DESIRE_PRECEDES_OFFER
    statement: >
      The commercial offer appears after the buyer has experienced the project,
      not before Quantum has earned attention and conviction.
  CO-002:
    name: OFFER_IS_A_DECISION_OBJECT
    statement: >
      CommercialOfferIR must make the consequences of yes, reserve, decline and
      expiration machine-readable.
  CO-003:
    name: FIXED_FAIR_BY_DEFAULT
    statement: >
      The normal Quantum offer is a carefully computed fixed offer rather than an
      invitation to bargaining.
  CO-004:
    name: NO_MEETING_REQUIRED
    statement: >
      Acceptance, reservation and legal review must not depend on a synchronous
      meeting with Quantum.
  CO-005:
    name: NO_NEGOTIATION_REQUIRED
    statement: >
      The normal transaction path has no mandatory negotiation stage.
  CO-006:
    name: CLARIFICATION_IS_NOT_NEGOTIATION
    statement: >
      Buyers and legal reviewers may ask what an existing term means without that
      act creating authority to modify the offer.
  CO-007:
    name: COUNTERPROPOSAL_DOES_NOT_MUTATE_OFFER
    statement: >
      An inbound counterproposal cannot silently alter an existing CommercialOfferIR.
  CO-008:
    name: COMMERCIAL_AUTHORITY_IS_PREAUTHORIZED
    statement: >
      Autonomous offers must remain inside a creator-approved StudioCommercialPolicy
      and CommercialAuthorityEnvelope.
  CO-009:
    name: REAL_SCARCITY_ONLY
    statement: >
      An offer may create urgency only because Quantum genuinely removes the
      project from simultaneous exclusive availability elsewhere during the
      stated window.
  CO-010:
    name: CLOCK_STARTS_AT_REVEAL
    statement: >
      Delivery, Key activation, ProofOfFilm viewing and CuratedProjectExperience
      entry do not begin commercial expiration. Explicit OfferReveal does.
  CO-011:
    name: INITIAL_EXCLUSIVITY_IS_SHORT
    statement: >
      The default cold executive offer receives a 24-hour initial exclusive
      availability period.
  CO-012:
    name: RESERVATION_BUYS_REAL_TIME
    statement: >
      A qualified reservation payment purchases an additional defined period of
      exclusive availability.
  CO-013:
    name: DEFAULT_RESERVATION_IS_SEVEN_DAYS
    statement: >
      The default reservation extension is seven calendar days after the
      reservation payment has cleared.
  CO-014:
    name: DEFAULT_RESERVATION_IS_TEN_PERCENT
    statement: >
      The default reservation amount is ten percent of total contract
      consideration.
  CO-015:
    name: RESERVATION_CREDITS_PURCHASE
    statement: >
      If the transaction executes during the valid reservation window, the
      reservation amount is credited toward contract consideration.
  CO-016:
    name: RESERVATION_EXPIRY_HAS_REAL_CONSEQUENCE
    statement: >
      If the reserved opportunity expires without execution, the commercial
      consequences stated in the accepted reservation terms apply.
  CO-017:
    name: FORFEITURE_IS_NOT_A_REVENUE_STRATEGY
    statement: >
      Reservation forfeiture exists to compensate exclusivity and opportunity
      cost, not as a KPI or business model.
  CO-018:
    name: NO_SECOND_EXTENSION_BY_DEFAULT
    statement: >
      A buyer receives one default paid reservation window. Additional extensions
      require a different explicit commercial policy.
  CO-019:
    name: EXPIRATION_IS_REAL
    statement: >
      Once availability expires, the current offer cannot remain secretly open.
  CO-020:
    name: QUANTUM_MOVES_ON
    statement: >
      Expiration releases the project for the next authorized acquisition sequence.
  CO-021:
    name: EXPIRED_TARGET_LOSES_PRIORITY
    statement: >
      A target who allows the project opportunity to expire receives no standing
      right to reacquire that same project later.
  CO-022:
    name: NO_FAKE_SECOND_CHANCE
    statement: >
      Expiration messaging cannot secretly contain a sales recovery CTA that
      undermines the deadline.
  CO-023:
    name: FAIRNESS_IS_STRATEGIC
    statement: >
      Fairness is not generosity theater. It reduces distrust, legal friction,
      negotiation incentive and future transaction cost.
  CO-024:
    name: BUYER_SHOULD_HAVE_UPSIDE
    statement: >
      Quantum should seek structures where the buyer can plausibly earn strong
      economic returns when the project succeeds.
  CO-025:
    name: REPUTATION_BEATS_EXTRACTION
    statement: >
      Especially early in Quantum's commercial life, repeatability and reputation
      may justify leaving meaningful upside to the buyer.
  CO-026:
    name: PRICE_CAN_RISE_WITH_PROVEN_REPUTATION
    statement: >
      Future pricing policy may increase as Quantum accumulates verified evidence
      of quality, reliability and commercial value.
  CO-027:
    name: NO_HIDDEN_FEES
    statement: >
      The offer states what is included and what constitutes a material scope
      change.
  CO-028:
    name: NO_NICKEL_AND_DIMING
    statement: >
      Reasonable fixes to legitimate deficiencies remain part of Quantum's
      quality obligation rather than becoming opportunistic fees.
  CO-029:
    name: REVISION_SCOPE_IS_DEFINED
    statement: >
      Included revisions must have explicit boundaries so neither side must argue
      over the word "revision."
  CO-030:
    name: MATERIAL_CHANGE_IS_NOT_A_REVISION
    statement: >
      New ending, new main character, major style shift, materially increased
      runtime or equivalent project redesign may require a new commercial scope.
  CO-031:
    name: ACCEPTANCE_MUST_END
    statement: >
      Buyer approval cannot remain an indefinite unbounded state.
  CO-032:
    name: PROJECT_RIGHTS_AND_STUDIO_RIGHTS_ARE_SEPARATE
    statement: >
      Commercial project exploitation rights can be broad while Quantum's studio,
      company, platform, models, workflows, production system and pre-existing
      technology remain outside the transaction.
  CO-033:
    name: BUYING_PROJECT_DOES_NOT_BUY_QUANTUM
    statement: >
      No ordinary project offer transfers equity, control, ownership or platform
      rights in Quantum Animation Studio or Quantum AI Partners.
  CO-034:
    name: PLATFORM_IP_IS_RESERVED
    statement: >
      Quantum's production intelligence and pre-existing technology remain
      Quantum property unless an extraordinary separately authorized transaction
      explicitly states otherwise.
  CO-035:
    name: BACKEND_IS_OPTIONAL_NOT_ASSUMED
    statement: >
      Quantum may prefer simple front-loaded economics with little or no backend
      participation, but this remains configurable commercial policy.
  CO-036:
    name: MERCHANDISING_PARTICIPATION_IS_OPTIONAL
    statement: >
      Quantum may offer broad merchandising rights without retaining ongoing
      participation when the economics justify it.
  CO-037:
    name: COMMERCIAL_TERMS_HAVE_ONE SOURCE
    statement: >
      Price, rights, delivery, revisions and payment percentages originate from
      CommercialOfferIR and may not be reinterpreted independently by the legal,
      payment or presentation layers.
  CO-038:
    name: PLAIN_LANGUAGE_FIRST
    statement: >
      The buyer-facing commercial summary should state exactly what the offer
      means before legal language appears.
  CO-039:
    name: LOW_FRICTION_NOT_LOW_SERIOUSNESS
    statement: >
      Making a transaction easy does not mean removing identity, authority,
      audit, payment or legal safeguards.
  CO-040:
    name: SIGNABILITY_IS_ENGINEERED
    statement: >
      Offer clarity, fairness, commercial fit, execution confidence and contract
      legibility should be deliberately optimized while decision friction is reduced.
  CO-041:
    name: NO_DARK_PATTERNS
    statement: >
      Urgency may come from a real deadline. Quantum may not manufacture fake
      scarcity, fake competitors, hidden recurring obligations or misleading
      countdown resets.
  CO-042:
    name: OFFER_VERSION_IS_IMMUTABLE
    statement: >
      Once revealed, an offer version cannot be edited in place.
  CO-043:
    name: NEW_TERMS_REQUIRE_NEW_VERSION
    statement: >
      Any authorized change produces a new offer version, new digest, new
      expiration semantics and new downstream legal compilation.
  CO-044:
    name: SIGNATURE_DOES_NOT_START_PRODUCTION
    statement: >
      Agreement execution passes control to payment/work-authorization runtime.
      Production begins only after required funds clear.
  CO-045:
    name: COMMERCIAL_DONE_IS_NOT_DELIVERY_DONE
    statement: >
      Customer acquisition completion and final creative delivery are separate
      lifecycle milestones.
# =====================================================================
# 3. STUDIO COMMERCIAL POLICY
# =====================================================================
studio_policy:
  StudioCommercialPolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      version:
      currency_defaults:
      offer_mode_default:
      initial_exclusive_window:
      reservation_policy_ref:
      payment_schedule_baseline_ref:
      revision_policy_baseline_ref:
      acceptance_policy_baseline_ref:
      rights_policy_baseline_ref:
      pricing_policy_ref:
      fairness_policy_ref:
      reoffer_policy_ref:
      negotiation_policy_ref:
      discount_policy:
      backend_policy:
      merchandising_policy:
      minimum_economic_requirements:
      repeat_business_weight:
      reputation_strategy:
      creator_authority_ref:
      effective_at:
      supersedes_ref:
        nullable: true
      provenance_ref:
      digest:
  human_authoring:
    allowed:
      creator_or_authorized_studio_principal: true
  ordinary_transaction_use:
    autonomous: true
# =====================================================================
# 4. COMMERCIAL AUTHORITY ENVELOPE
# =====================================================================
authority:
  CommercialAuthorityEnvelope:
    extends:
      - 10.PolicyObject
    fields:
      envelope_id:
      allowed_transaction_types:
      allowed_product_formats:
      minimum_consideration:
        nullable: true
      maximum_discount_from_policy:
      permitted_payment_schedules:
      permitted_rights_models:
      permitted_terms:
      maximum_included_revision_rounds:
      maximum_exclusivity_duration:
      permitted_reservation_terms:
      allowed_territories:
      allowed_terms_years:
      prohibited_rights:
      prohibited_company_interests:
      prohibited_platform_IP_transfers:
      required_reserved_rights:
      escalation_conditions:
      authority_holder_ref:
      version:
      digest:
  invariant: >
    Autonomous CommercialOfferIR compilation must remain entirely inside the
    active CommercialAuthorityEnvelope.
  out_of_envelope:
    behavior:
      - DO_NOT_ISSUE
      - classify_REQUIRES_NEW_COMMERCIAL_AUTHORITY
      - no_autonomous_exception
# =====================================================================
# 5. PROJECT COMMERCIAL INTENT
# =====================================================================
project_commercial_intent:
  ProjectCommercialIntent:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      intent_id:
      project_id:
      preferred_transaction_type:
      preferred_product_scope:
      season_structure:
        nullable: true
      episode_structure:
        nullable: true
      rights_preferences:
      economics_preferences:
      buyer_upside_goal:
      Quantum_upside_goal:
      backend_preference:
      merchandising_preference:
      repeat_business_priority:
      minimum_quality_commitment:
      creator_reserved_rights:
      creator_commercial_locks:
      source_refs:
      provenance_ref:
      digest:
# =====================================================================
# 6. OFFER MODE
# =====================================================================
offer_mode:
  CommercialOfferMode:
    enum:
      - FIXED_FAIR
      - FIXED_WITH_RESERVATION
      - POLICY_BOUNDED_VARIANTS
      - NEGOTIABLE_EXCEPTION
  default:
    value: FIXED_WITH_RESERVATION
  default_negotiation_policy:
    mode: NONE
  allowed_normal_actions:
    - REVIEW_AGREEMENT
    - EXECUTE
    - RESERVE
    - DECLINE
  not_default:
    - SCHEDULE_CALL
    - REQUEST_QUOTE
    - CONTACT_SALES
    - NEGOTIATE_PRICE
# =====================================================================
# 7. OFFER PRODUCT SCOPE
# =====================================================================
product_scope:
  OfferProductScope:
    fields:
      scope_id:
      project_id:
      format:
        enum:
          - FEATURE
          - SEASON
          - SERIES
          - SPECIAL
          - SHORT
          - PROJECT_RIGHTS_PACKAGE
          - CUSTOM
      seasons_committed:
      seasons_optional:
      episodes_committed:
        nullable: true
      episodes_per_season:
        nullable: true
      runtime_per_episode:
        nullable: true
      target_total_runtime:
        nullable: true
      master_specification_ref:
      language_scope:
      localization_scope:
      delivery_package:
      marketing_materials:
      production_portal_access:
      additional_deliverables:
      exclusions:
      provenance_ref:
  example_season:
    seasons_committed: 1
    seasons_optional: 2
    episodes_committed: 10
# =====================================================================
# 8. CONSIDERATION
# =====================================================================
consideration:
  OfferConsideration:
    fields:
      consideration_id:
      total_amount:
      currency:
      taxes_included_policy:
      reimbursable_cost_policy:
      backend_participation:
      merchandising_participation:
      royalties:
      contingent_compensation:
      fixed_price:
      price_adjustment_conditions:
      provenance_ref:
  default_creator_preference_candidate:
    fixed_price: true
    backend_participation: NONE
    merchandising_participation: NONE
    contingent_compensation: NONE
  hard_rule: >
    No fee may exist outside CommercialOfferIR or a subsequently executed,
    authorized change order.
# =====================================================================
# 9. PAYMENT SCHEDULE SEMANTICS
# =====================================================================
payment_schedule:
  PaymentMilestoneSemantics:
    fields:
      milestone_id:
      label:
      percentage_of_total:
      trigger:
      due_policy:
      credited_reservation_applies:
      work_authorization_effect:
      final_delivery_effect:
  PaymentScheduleSemantics:
    fields:
      schedule_id:
      milestones:
      total_percentage:
      initial_required_percentage:
      reservation_credit_policy:
      currency:
      provenance_ref:
  default_candidate:
    milestone_1:
      label: EXECUTION_INITIAL_PAYMENT
      percentage_of_total: 20
      trigger: AGREEMENT_EXECUTED
      work_authorization_effect: ELIGIBLE_AFTER_CLEARED
    milestone_2:
      label: FIFTY_PERCENT_PRODUCTION
      percentage_of_total: 30
      trigger: PRODUCTION_PROGRESS_50_PERCENT
    milestone_3:
      label: FINAL_DELIVERY_AND_CONTRACTUAL_ACCEPTANCE
      percentage_of_total: 50
      trigger: DELIVERY_ACCEPTANCE_CONDITION
    total_percentage: 100
    initial_required_percentage: 20
  reservation_credit_example:
    reservation_paid: 10
    remaining_initial_payment_after_execution: 10
    work_authorization_requires_total_initial_cleared: 20
  execution_owner:
    spec: 25_quantum_payment_work_authorization_build_spec.yaml
# =====================================================================
# 10. DELIVERY COMMITMENT
# =====================================================================
delivery:
  DeliveryCommitment:
    fields:
      commitment_id:
      committed_delivery_date:
      committed_delivery_window:
        nullable: true
      delivery_artifact_definition:
      delivery_media_spec_ref:
      buyer_dependency_assumptions:
      permitted_schedule_adjustments:
      force_majeure_policy_ref:
        legal_owner: spec_24
      creator_release_required:
      acceptance_policy_ref:
      provenance_ref:
  scheduling_principle: >
    Commercial commitment should be later than Quantum's internal target so
    reliable early delivery is engineered rather than accidental.
  internal_schedule_owner:
    spec: 06_quantum_production_model_build_spec.yaml
  final_creator_release_owner:
    spec: 30_quantum_creator_release_delivery_build_spec.yaml
# =====================================================================
# 11. REVISION POLICY
# =====================================================================
revisions:
  RevisionPolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      included_rounds:
      revision_window_days:
      consolidated_notes_required:
      eligible_scope:
      excluded_scope:
      deficiency_repairs_count_against_rounds:
      material_change_threshold:
      change_order_policy:
      buyer_delay_effects:
      response_time_policy:
      creator_release_interaction:
      version:
      provenance_ref:
  default_candidate:
    included_rounds: 3
    consolidated_notes_required: true
  reasonable_included_examples:
    - localized_editorial_adjustment
    - dialogue_adjustment
    - timing_adjustment
    - local_shot_adjustment
    - continuity_correction
    - mix_adjustment
    - grade_adjustment
    - minor_performance_adjustment
  material_change_examples:
    - new_main_character
    - different_ending
    - major_world_redesign
    - material_runtime_increase
    - new_episode_premise
    - major_visual_style_change_after_lock
    - substantial_story_rewrite_after_lock
  hard_rule: >
    Legitimate defects and failures to meet contracted specification are not
    automatically consumed as discretionary revision rounds.
# =====================================================================
# 12. MATERIAL CHANGE
# =====================================================================
material_change:
  MaterialChangeAssessment:
    fields:
      assessment_id:
      requested_change:
      affected_artifact_refs:
      creative_blast_radius:
      production_blast_radius:
      schedule_impact:
      cost_impact:
      rights_impact:
      threshold_result:
        enum:
          - INCLUDED_REVISION
          - DEFICIENCY_REPAIR
          - MATERIAL_CHANGE
          - UNCERTAIN
      evidence_refs:
      confidence:
  if_material_change:
    result:
      - current_offer_does_not_expand_automatically
      - change_order_or_new_offer_required
# =====================================================================
# 13. ACCEPTANCE POLICY
# =====================================================================
acceptance:
  AcceptancePolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      acceptance_period_days:
      objective_delivery_requirements:
      permitted_deficiency_categories:
      deficiency_notice_requirements:
      consolidated_notice_required:
      evidence_requirement:
      cure_policy:
      cure_period:
      deemed_acceptance_policy:
      final_payment_trigger:
      creator_release_required:
      dispute_boundary_ref:
        legal_owner: spec_24
      version:
      provenance_ref:
  principle: >
    Contractual acceptance evaluates conformity to the agreed delivery
    specification. It is not an unlimited creative reconsideration window.
  deemed_acceptance:
    allowed_only_if:
      - legal_template_supports
      - jurisdiction_policy_supports
      - buyer_was_clearly_informed
# =====================================================================
# 14. BUYER DEPENDENCIES
# =====================================================================
buyer_dependencies:
  BuyerDependencyPolicy:
    fields:
      policy_id:
      required_materials:
      required_approvals:
      consolidated_feedback_deadlines:
      technical_access_requirements:
      designated_buyer_contact_or_system:
      delay_effects:
      failure_to_provide_effects:
      provenance_ref:
  principle: >
    Quantum cannot guarantee a schedule against dependencies the buyer controls
    unless the offer explicitly absorbs that risk.
# =====================================================================
# 15. QUANTUM OBLIGATIONS
# =====================================================================
quantum_obligations:
  QuantumObligationPolicy:
    fields:
      obligation_id:
      production_scope:
      quality_standard:
      delivery_standard:
      budget_standard:
      communication_standard:
      problem_resolution_standard:
      provenance_standard:
      confidentiality_standard:
      revision_standard:
      production_portal_standard:
      creator_release_standard:
      evidence_refs:
  default_quality_semantics:
    - exceptional
    - creator_intent_fidelity
    - visually_extraordinary
    - original
    - intelligent
    - technically_complete
# =====================================================================
# 16. OFFER RIGHTS MODEL
# =====================================================================
rights:
  OfferRightsModel:
    fields:
      rights_model_id:
      transaction_type:
        enum:
          - ASSIGNMENT
          - EXCLUSIVE_LICENSE
          - NONEXCLUSIVE_LICENSE
          - COMMISSION
          - DISTRIBUTION_LICENSE
          - CUSTOM
      project_picture_rights:
      season_rights:
      sequel_rights:
      remake_rights:
      derivative_rights:
      merchandising_rights:
      publishing_rights:
      game_rights:
      promotional_rights:
      soundtrack_rights:
      ancillary_rights:
      territory:
      term:
      exclusivity:
      sublicensing:
      transfer_condition:
      reversion_condition:
        nullable: true
      Quantum_reserved_rights_ref:
      creator_reserved_rights:
      credit_rights:
      portfolio_rights:
      archival_rights:
      provenance_ref:
  legal_expression_owner:
    spec: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
# =====================================================================
# 17. QUANTUM RESERVED RIGHTS
# =====================================================================
reserved_rights:
  QuantumReservedRights:
    fields:
      reserved_rights_id:
      Quantum_Animation_Studio_equity:
        reserved: true
      Quantum_AI_Partners_equity:
        reserved: true
      studio_brand:
        reserved: true
      studio_trademarks:
        reserved: true
      Quantum_platform_IP:
        reserved: true
      production_system:
        reserved: true
      models:
        reserved: true
      workflows:
        reserved: true
      orchestration:
        reserved: true
      prompts_and_internal_reasoning_assets:
        reserved: true
      preexisting_software:
        reserved: true
      generic_tools:
        reserved: true
      production_knowhow:
        reserved: true
      internal_training_or_learning_system:
        reserved_subject_to_policy: true
      preexisting_assets:
        reserved_unless_expressly_included: true
      project_specific_rights:
        controlled_by_OfferRightsModel: true
  canonical_law: >
    Acquiring a Quantum project does not acquire Quantum.
# =====================================================================
# 18. RIGHTS TRANSFER CONDITION
# =====================================================================
rights_transfer:
  allowed_conditions:
    - AGREEMENT_EXECUTION
    - INITIAL_PAYMENT_CLEARED
    - FULL_PAYMENT_CLEARED
    - DELIVERY
    - CONTRACTUAL_ACCEPTANCE
    - CUSTOM_LEGAL_POLICY
  default_candidate:
    ownership_or_broad_assignment_effective:
      trigger: FULL_PAYMENT_CLEARED
  legal_owner:
    spec: 24
  payment_event_owner:
    spec: 25
# =====================================================================
# 19. BACKEND POLICY
# =====================================================================
backend:
  BackendPolicy:
    fields:
      policy_id:
      creator_backend:
      studio_backend:
      merchandise_backend:
      contingent_compensation:
      audit_rights_required_if_backend:
      accounting_complexity:
      strategic_preference:
  default_creator_preference_candidate:
    creator_backend: NONE
    studio_backend: NONE
    merchandise_backend: NONE
    strategic_preference: FRONT_LOADED_SIMPLE_ECONOMICS
  rationale: >
    Avoid long-lived accounting dependency when sufficiently attractive upfront
    economics are available.
# =====================================================================
# 20. INITIAL EXCLUSIVE WINDOW
# =====================================================================
initial_exclusivity:
  OfferAvailabilityWindow:
    fields:
      window_id:
      offer_ref:
      begins_at:
      expires_at:
      duration:
      availability_mode:
        enum:
          - EXCLUSIVE_TO_TARGET
      state:
        enum:
          - NOT_STARTED
          - OPEN
          - RESERVED
          - EXPIRED
          - EXECUTED
          - DECLINED
      timer_source:
      immutable_start:
      provenance_ref:
  default_duration:
    hours: 24
  start_event:
    name: COMMERCIAL.OFFER_REVEALED
  does_not_start_on:
    - package_delivery
    - Key_activation
    - Proof_start
    - Proof_completion
    - CuratedExperience_entry
    - OpportunityPrelude_entry
# =====================================================================
# 21. OFFER REVEAL
# =====================================================================
offer_reveal:
  canonical_presentation: |
    THE OPPORTUNITY
    Revealing this commercial proposal begins
    its exclusive availability period.
    [ REVEAL OFFER ]
  OfferReveal:
    extends:
      - 10.ExperienceObject
    fields:
      reveal_id:
      offer_ref:
      experience_lock_ref:
      target_ref:
      source_session_ref:
      requested_at:
      revealed_at:
      expires_at:
      offer_digest:
      provenance_ref:
  reveal_is:
    deliberate: true
  reset_allowed:
    false
# =====================================================================
# 22. COMMERCIAL OFFER IR
# =====================================================================
offer_IR:
  CommercialOfferIR:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      offer_id:
      project_id:
      target_ref:
      offer_version:
      offer_mode:
      source_experience_lock_ref:
      StudioCommercialPolicy_ref:
      CommercialAuthorityEnvelope_ref:
      ProjectCommercialIntent_ref:
      ProductScope_ref:
      Consideration_ref:
      PaymentSchedule_ref:
      DeliveryCommitment_ref:
      RevisionPolicy_ref:
      AcceptancePolicy_ref:
      OfferRightsModel_ref:
      BuyerDependencyPolicy_ref:
      QuantumObligationPolicy_ref:
      initial_exclusivity_policy_ref:
      ReservationPolicy_ref:
      ExpirationPolicy_ref:
      ReofferPolicy_ref:
      negotiation_policy_ref:
      validity_conditions:
      commercial_summary:
      commercial_claim_refs:
      downstream_contract_template_requirements:
      provenance_ref:
      created_at:
      digest:
  immutable:
    after_authorization: true
# =====================================================================
# 23. OFFER VERSION
# =====================================================================
offer_version:
  CommercialOfferVersion:
    fields:
      offer_ref:
      version:
      digest:
      created_at:
      supersedes_ref:
        nullable: true
      reason_for_new_version:
        nullable: true
      revealed:
      reveal_ref:
        nullable: true
  rule: >
    Revealed versions are preserved permanently as historical commercial records.
# =====================================================================
# 24. OFFER AUTHORIZATION
# =====================================================================
authorization:
  CommercialOfferAuthorization:
    fields:
      authorization_id:
      offer_ref:
      policy_ref:
      authority_envelope_ref:
      terms_within_envelope:
      project_rights_valid:
      Quantum_reserved_rights_valid:
      pricing_policy_pass:
      delivery_feasibility_pass:
      payment_schedule_pass:
      revision_policy_pass:
      acceptance_policy_pass:
      commercial_QC_pass:
      legal_template_available:
      authorized_at:
      outcome:
        enum:
          - AUTHORIZED
          - DENIED
          - REQUIRES_NEW_AUTHORITY
      evidence_refs:
  required_before_reveal:
    true
# =====================================================================
# 25. RESERVATION POLICY
# =====================================================================
reservation:
  ReservationPolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      available:
      reservation_percentage:
      reservation_duration_calendar_days:
      payment_must_clear_before_effective:
      credited_to_purchase:
      treatment_if_transaction_executes:
      treatment_if_reservation_expires:
      maximum_reservations_for_same_target:
      second_extension_allowed:
      legal_template_requirement:
      disclosure_requirement:
      version:
      provenance_ref:
  default:
    available: true
    reservation_percentage: 10
    reservation_duration_calendar_days: 7
    payment_must_clear_before_effective: true
    credited_to_purchase: true
    maximum_reservations_for_same_target: 1
    second_extension_allowed: false
  retained_if_expired_without_execution:
    default_candidate: true
    hard_requirement:
      - explicitly_disclosed
      - legal_template_authorized
      - applicable_policy_permits
  business_purpose: >
    Compensate Quantum for keeping a marketable project off the market during
    the extended exclusive period.
# =====================================================================
# 26. RESERVATION REQUEST
# =====================================================================
reservation_request:
  ReservationRequest:
    fields:
      reservation_request_id:
      offer_ref:
      target_ref:
      requested_at:
      offer_remaining_validity:
      reservation_amount:
      reservation_percentage:
      proposed_reserved_until:
      reservation_terms_ref:
      payment_intent_ref:
        owner: spec_25
      state:
        enum:
          - REQUESTED
          - PAYMENT_PENDING
          - EFFECTIVE
          - FAILED
          - EXPIRED
  requirement: >
    Reservation must be requested while the initial offer remains valid unless
    StudioCommercialPolicy explicitly permits another rule.
# =====================================================================
# 27. RESERVATION STATE
# =====================================================================
reservation_state:
  ReservationState:
    fields:
      reservation_id:
      offer_ref:
      payment_event_ref:
      reservation_amount:
      credited_percentage:
      effective_at:
      expires_at:
      state:
        enum:
          - ACTIVE
          - CONVERTED
          - EXPIRED
          - REFUNDED_BY_REQUIRED_POLICY
          - CANCELLED_BY_VALID_LEGAL_RULE
      provenance_ref:
  ACTIVE_requires:
    - payment_cleared_event
    - valid_offer_at_reservation_effect
    - accepted_reservation_terms
# =====================================================================
# 28. RESERVATION COMMERCIAL EFFECT
# =====================================================================
reservation_effect:
  on_effective:
    - set_OfferAvailabilityWindow_RESERVED
    - replace_initial_expiration_with_reservation_expiration
    - preserve_target_exclusivity
    - mark_reservation_credit_available
  on_agreement_execution:
    - set_reservation_CONVERTED
    - instruct_spec_25_to_credit_reservation_against_initial_payment
  on_expiration:
    - set_reservation_EXPIRED
    - release_exclusivity
    - apply_disclosed_reservation_treatment
    - trigger_next_target_eligibility
# =====================================================================
# 29. EXPIRATION POLICY
# =====================================================================
expiration:
  ExpirationPolicy:
    fields:
      policy_id:
      initial_expiration_behavior:
      reservation_expiration_behavior:
      access_after_expiration:
      offer_execution_after_expiration:
      buyer_reentry_policy:
      next_target_trigger:
      expired_message_policy:
      version:
  default:
    offer_execution_after_expiration:
      allowed: false
    initial_expiration_behavior:
      - EXPIRE_OFFER
      - RELEASE_EXCLUSIVITY
      - DISABLE_EXECUTION
    reservation_expiration_behavior:
      - EXPIRE_RESERVATION
      - EXPIRE_OFFER
      - RELEASE_EXCLUSIVITY
      - DISABLE_EXECUTION
    next_target_trigger:
      enabled: true
  no_reset:
    true
# =====================================================================
# 30. REOFFER POLICY
# =====================================================================
reoffer:
  ReofferPolicy:
    fields:
      policy_id:
      expired_target_same_project_policy:
        enum:
          - INELIGIBLE
          - EXPLICIT_CREATOR_OVERRIDE_ONLY
          - FUTURE_POLICY_REEVALUATION
      declined_target_same_project_policy:
      target_reentry_cooldown:
        nullable: true
      higher_price_reopening_allowed:
      version:
  default:
    expired_target_same_project_policy: INELIGIBLE
    declined_target_same_project_policy: INELIGIBLE
    higher_price_reopening_allowed: false
  rationale: >
    Real consequences teach the market that Quantum's stated availability
    windows are meaningful.
  future_override:
    requires_new_StudioCommercialPolicy_version: true
# =====================================================================
# 31. DECLINE POLICY
# =====================================================================
decline:
  DeclinePolicy:
    fields:
      policy_id:
      explicit_decline_effect:
      revoke_execution:
      release_exclusivity:
      next_target_trigger:
      reoffer_policy_ref:
  default:
    explicit_decline_effect: FINAL_FOR_CURRENT_PROJECT_TARGET
    revoke_execution: true
    release_exclusivity: true
    next_target_trigger: true
# =====================================================================
# 32. EXPIRED EXPERIENCE
# =====================================================================
expired_experience:
  semantic_state:
    owner: spec_23
  presentation:
    may_be_rendered_by:
      - spec_22
      - future_spec_26
  default_copy_semantics: |
    QUANTUM ANIMATION STUDIO
    ACCESS WINDOW CLOSED
    This project is no longer available
    through this offer.
    The window closed.
    The work continues.
  prohibited:
    - fake_second_chance
    - "call us"
    - "schedule a meeting"
    - "request extension"
    - hidden_offer_reactivation
    - insulting_language
  goal:
    - factual
    - cold
    - respectful
    - memorable
    - consequence_is_clear
# =====================================================================
# 33. NEGOTIATION POLICY
# =====================================================================
negotiation:
  NegotiationPolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      mode:
        enum:
          - NONE
          - CLARIFICATION_ONLY
          - POLICY_BOUNDED
          - FULL
      price_change_allowed:
      rights_change_allowed:
      schedule_change_allowed:
      custom_term_generation_allowed:
      counterproposal_response:
      version:
  default:
    mode: CLARIFICATION_ONLY
    price_change_allowed: false
    rights_change_allowed: false
    schedule_change_allowed: false
    custom_term_generation_allowed: false
    counterproposal_response:
      semantic: >
        The current Quantum offer is fixed. The buyer may accept, reserve while
        available, or decline.
  important: >
    Legal clarification and legal review remain fully supported.
# =====================================================================
# 34. OFFER FAIRNESS MODEL
# =====================================================================
fairness:
  OfferFairnessModel:
    fields:
      fairness_id:
      offer_ref:
      buyer_value_estimate:
      Quantum_cost_estimate:
      Quantum_risk:
      buyer_risk:
      project_market_value_evidence:
      comparable_structure_evidence:
        nullable: true
      buyer_upside_range:
      Quantum_margin:
      schedule_risk:
      rights_breadth:
      payment_fairness:
      revision_fairness:
      acceptance_fairness:
      information_symmetry:
      hidden_fee_risk:
      overall_fairness:
      uncertainty:
      evidence_refs:
  principle: >
    Fairness is evaluated from both parties' perspective rather than defined as
    maximum buyer concession.
  cannot_override:
    - creator_commercial_locks
    - minimum_Quantum_economics
    - studio_survival_requirements
# =====================================================================
# 35. SIGNABILITY
# =====================================================================
signability:
  SignabilityProjection:
    extends:
      - 10.ProjectionObject
    fields:
      projection_id:
      offer_ref:
      target_ref:
      OfferClarity:
      PerceivedFairness:
      ExecutionConfidence:
      CommercialFit:
      ContractLegibility:
        source: spec_24
        nullable_before_contract_compilation: true
      DecisionFriction:
      LegalReviewFriction:
      InternalApprovalFriction:
      TimePressureFit:
      overall_signability:
      confidence:
      evidence_refs:
  conceptual_equation: >
    Signability =
      (
        OfferClarity
        × PerceivedFairness
        × ExecutionConfidence
        × CommercialFit
        × ContractLegibility
      )
      /
      max(epsilon, DecisionFriction)
  diagnostic_only:
    true
  hard_rule: >
    Signability cannot justify deception, fake scarcity or removal of legally
    necessary terms.
# =====================================================================
# 36. CONVERSION POTENTIAL
# =====================================================================
conversion_potential:
  source_marketability:
    owner: spec_18
  conceptual_equation: >
    ConversionPotential ≈ Marketability × Signability
  interpretation: >
    Marketability creates desire for the project. Signability determines how
    easily that desire can become a valid commercial decision.
  not_guarantee:
    true
# =====================================================================
# 37. DECISION FRICTION
# =====================================================================
decision_friction:
  DecisionFriction:
    fields:
      information_friction:
      price_ambiguity:
      rights_ambiguity:
      legal_complexity:
      process_steps:
      required_meetings:
      required_account_creation:
      required_negotiation:
      required_internal_approvals:
        target_specific_estimate:
      payment_friction:
      signature_friction:
      uncertainty:
      total:
  Quantum_controlled_targets:
    required_meetings: 0
    required_account_creation: 0
    required_negotiation: 0
    price_ambiguity: LOW
    rights_ambiguity: LOW
# =====================================================================
# 38. OFFER PRESENTATION
# =====================================================================
presentation:
  OfferPresentation:
    fields:
      presentation_id:
      offer_ref:
      sections:
      primary_actions:
      remaining_time:
      reservation_available:
      agreement_ready:
      source_experience_ref:
      provenance_ref:
  canonical_order:
    - THE_OPPORTUNITY
    - PRODUCT_SCOPE
    - TOTAL_CONSIDERATION
    - PAYMENT_SCHEDULE
    - RIGHTS_SUMMARY
    - DELIVERY
    - REVISIONS
    - ACCEPTANCE
    - EXPANSION_OPTIONS
    - EXCLUSIVITY_WINDOW
    - RESERVATION_OPTION
    - REVIEW_AGREEMENT
    - EXECUTE
    - DECLINE
  actions:
    primary:
      - REVIEW_AGREEMENT
      - EXECUTE
    secondary:
      - RESERVE
      - DECLINE
  default_absent:
    - BOOK_A_CALL
    - CONTACT_SALES
# =====================================================================
# 39. COMMERCIAL SUMMARY
# =====================================================================
commercial_summary:
  CommercialSummary:
    fields:
      offer_ref:
      what_you_receive:
      total_price:
      payment_schedule_plain_language:
      delivery_date:
      included_revisions:
      acceptance_plain_language:
      rights_plain_language:
      Quantum_reserved_rights_plain_language:
      exclusivity_expiration:
      reservation_plain_language:
      key_buyer_dependencies:
      next_action:
  constraint:
    understandable_without_legal_document: true
# =====================================================================
# 40. EXAMPLE SEASON OFFER
# =====================================================================
example_offer_profile:
  illustrative_only:
    true
  product:
    seasons_committed: 1
    optional_total_seasons: 3
    episodes: 10
  payment:
    execution_initial: 20
    fifty_percent_production: 30
    delivery_and_acceptance: 50
  revisions:
    included_rounds: 3
  initial_exclusive_window:
    hours: 24
  reservation:
    percentage: 10
    calendar_days: 7
    credit_toward_purchase: true
  rights:
    buyer_may_receive:
      - broad_project_exploitation_rights
      - merchandising_rights
    Quantum_always_reserves:
      - studio
      - platform
      - technology
      - models
      - workflows
# =====================================================================
# 41. OFFER COMPILER
# =====================================================================
compiler:
  CommercialOfferCompiler:
    pipeline:
      C01_ResolveOpportunityHandoff:
        input:
          - 22.OpportunityHandoff
      C02_ResolveStudioCommercialPolicy:
        output:
          - StudioCommercialPolicy
      C03_ResolveAuthorityEnvelope:
        output:
          - CommercialAuthorityEnvelope
      C04_ResolveProjectCommercialIntent:
        output:
          - ProjectCommercialIntent
      C05_ResolveProductScope:
        output:
          - OfferProductScope
      C06_ResolveProductionFeasibility:
        inputs:
          - ProductionIntent
          - ProductionModel
          - SelfModel
      C07_ResolvePricing:
        inputs:
          - pricing_policy
          - project_value_evidence
          - production_cost_evidence
          - opportunity_value_policy
        output:
          - OfferConsideration
      C08_ResolvePaymentSchedule:
        output:
          - PaymentScheduleSemantics
      C09_ResolveRevisionPolicy:
        output:
          - RevisionPolicy
      C10_ResolveAcceptancePolicy:
        output:
          - AcceptancePolicy
      C11_ResolveRights:
        output:
          - OfferRightsModel
          - QuantumReservedRights
      C12_ResolveAvailability:
        output:
          - initial_exclusivity_policy
          - ReservationPolicy
          - ExpirationPolicy
          - ReofferPolicy
      C13_ComputeFairness:
        output:
          - OfferFairnessModel
      C14_CompileCommercialOfferIR:
        output:
          - CommercialOfferIR
      C15_ValidateAuthority:
        output:
          - CommercialOfferAuthorization
      C16_CommercialQC:
        output:
          - QCRun
      C17_CompileContractReadiness:
        output:
          - ContractReadinessPayload
      C18_LockOffer:
        output:
          - CommercialOfferLock
      C19_PresentRevealAction:
        output:
          - reveal_ready
# =====================================================================
# 42. CONTRACT READINESS PAYLOAD
# =====================================================================
contract_handoff:
  ContractReadinessPayload:
    fields:
      payload_id:
      CommercialOfferLock_ref:
      target_ref:
      product_scope_ref:
      consideration_ref:
      payment_schedule_ref:
      delivery_commitment_ref:
      revision_policy_ref:
      acceptance_policy_ref:
      rights_model_ref:
      Quantum_reserved_rights_ref:
      exclusivity_policy_ref:
      reservation_policy_ref:
      governing_template_requirements:
      plain_language_summary_ref:
      legal_special_conditions:
      commercial_digest:
      provenance_ref:
  consumed_by:
    - 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
  invariant: >
    Legal compilation may translate this payload into approved legal language.
    It may not alter the business meaning.
# =====================================================================
# 43. COMMERCIAL OFFER LOCK
# =====================================================================
offer_lock:
  CommercialOfferLock:
    extends:
      - 10.LockArtifact
    lock_type:
      value: commercial_offer
    fields:
      offer_ref:
      offer_version:
      offer_digest:
      authorization_ref:
      QC_certificate_refs:
      ContractReadinessPayload_ref:
      source_experience_lock_ref:
      created_at:
      invalidation_conditions:
  invalidation_conditions:
    - authorized_new_offer_version
    - material_project_scope_change
    - legal_template_incompatibility_discovered_before_reveal
    - delivery_feasibility_materially_changes_before_reveal
  after_reveal:
    in_place_mutation:
      forbidden: true
# =====================================================================
# 44. OFFER REVEAL STATE MACHINE
# =====================================================================
state_machine:
  states:
    - PREPARING
    - AUTHORIZED
    - LOCKED
    - READY_TO_REVEAL
    - OFFER_OPEN
    - RESERVATION_PAYMENT_PENDING
    - RESERVED
    - AGREEMENT_REVIEW
    - AGREEMENT_SIGNING
    - AGREEMENT_EXECUTED
    - INITIAL_PAYMENT_PENDING
    - EXPIRED
    - DECLINED
    - SUPERSEDED_BEFORE_REVEAL
  transitions:
    PREPARING_to_AUTHORIZED:
      requires:
        - CommercialOfferAuthorization_AUTHORIZED
    AUTHORIZED_to_LOCKED:
      requires:
        - CommercialOfferLock
    LOCKED_to_READY_TO_REVEAL:
      automatic: true
    READY_TO_REVEAL_to_OFFER_OPEN:
      event:
        - COMMERCIAL.OFFER_REVEALED
    OFFER_OPEN_to_RESERVATION_PAYMENT_PENDING:
      event:
        - COMMERCIAL.RESERVATION_REQUESTED
    RESERVATION_PAYMENT_PENDING_to_RESERVED:
      event:
        - PAYMENT.RESERVATION_CLEARED
    OFFER_OPEN_to_AGREEMENT_REVIEW:
      event:
        - LEGAL.REVIEW_STARTED
    OFFER_OPEN_to_AGREEMENT_SIGNING:
      event:
        - LEGAL.SIGNING_STARTED
    RESERVED_to_AGREEMENT_REVIEW:
      allowed: true
    RESERVED_to_AGREEMENT_SIGNING:
      allowed: true
    any_valid_offer_to_AGREEMENT_EXECUTED:
      event:
        - LEGAL.AGREEMENT_EXECUTED
    AGREEMENT_EXECUTED_to_INITIAL_PAYMENT_PENDING:
      automatic: true
    OFFER_OPEN_to_EXPIRED:
      trigger:
        - initial_window_elapsed_without_execution_or_effective_reservation
    RESERVED_to_EXPIRED:
      trigger:
        - reservation_window_elapsed_without_execution
    OFFER_OPEN_to_DECLINED:
      event:
        - COMMERCIAL.DECLINED
    RESERVED_to_DECLINED:
      event:
        - COMMERCIAL.DECLINED
# =====================================================================
# 45. CLOCK SERVICE
# =====================================================================
clock:
  TimeAuthority:
    requirement:
      - trusted_server_time
      - monotonic_event_ordering
      - timestamped_offer_reveal
      - timestamped_expiration
  browser_clock:
    authoritative: false
  countdown:
    presentation_only: true
  expiry:
    server_side_enforced: true
  reset:
    prohibited: true
# =====================================================================
# 46. OFFER EXPIRATION
# =====================================================================
offer_expiration:
  on_expiry:
    deterministic_actions:
      - mark_offer_EXPIRED
      - reject_new_signature_start
      - reject_execution_completion_unless_signature_validly_completed_before_expiry_under_legal_policy
      - release_exclusivity
      - update_access_policy
      - emit_COMMERCIAL.OFFER_EXPIRED
      - notify_acquisition_runtime
  future_consumer:
    next_target:
      spec: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
# =====================================================================
# 47. INTERNAL ADVOCACY
# =====================================================================
internal_advocacy:
  target_effect: >
    The buyer should be able to explain both why the project is exciting and why
    the deal is reasonable to another internal decision-maker.
  InternalAdvocacyReadiness:
    fields:
      project_retellability:
      economics_retellability:
      rights_clarity:
      execution_clarity:
      legal_handoff_clarity:
      perceived_personal_risk:
      forwarding_impulse:
      confidence:
  relationship_to_spec_18:
    Marketability_social_transmission: upstream
  relationship_to_spec_24:
    legal_review_shareability: downstream
# =====================================================================
# 48. FAIRNESS + REPEAT BUSINESS
# =====================================================================
repeat_business:
  repeated_game_objective: >
    Choose commercial structures that maximize long-horizon studio value rather
    than extracting every possible dollar from one buyer.
  components:
    - current_profit
    - buyer_upside
    - repeat_purchase_probability
    - referral_probability
    - reputation_value
    - relationship_option_value
  downstream_owner:
    full_relationship_model:
      spec: 27_quantum_client_relationship_reputation_build_spec.yaml
# =====================================================================
# 49. OFFER EXPERIMENTATION
# =====================================================================
experimentation:
  allowed:
    - presentation_order
    - plain_language_wording
    - offer_visualization
    - reservation_explanation
    - rights_summary_visualization
  high_risk_requires_policy:
    - price_experiment
    - rights_experiment
    - deadline_experiment
    - reservation_percentage_experiment
  forbidden:
    - silently_show_different_binding_terms_to_same_target
    - fake_countdown
    - undisclosed_dynamic_price_after_reveal
# =====================================================================
# 50. COMMERCIAL CLAIMS
# =====================================================================
claims:
  CommercialClaim:
    fields:
      claim_id:
      type:
        enum:
          - PRICE
          - DELIVERY
          - RIGHTS
          - REVISION
          - ACCEPTANCE
          - EXCLUSIVITY
          - RESERVATION
          - EXECUTION_CAPABILITY
          - ECONOMIC_SCENARIO
      statement:
      source_refs:
      binding_if_in_agreement:
      confidence:
      scenario_based:
      provenance_ref:
  hard_rule: >
    Buyer-facing commercial claims cannot conflict with locked offer semantics.
# =====================================================================
# 51. COMMERCIAL QC
# =====================================================================
QC:
  formal_owner:
    spec: 07_quantum_autonomous_qc_build_spec.yaml
  CommercialOfferQCContract:
    dimensions:
      CLARITY:
        question: >
          Can a sophisticated buyer understand exactly what is being offered?
      FAIRNESS:
        question: >
          Are economics and obligations commercially coherent for both sides?
      SCOPE:
        question: >
          Is the deliverable scope complete and internally consistent?
      PAYMENT:
        question: >
          Do milestone percentages, triggers and reservation credits reconcile?
      RIGHTS:
        question: >
          Are offered project rights explicit and Quantum platform rights reserved?
      DELIVERY:
        question: >
          Is the committed date supported by current production evidence?
      REVISIONS:
        question: >
          Are included revisions and material changes distinguishable?
      ACCEPTANCE:
        question: >
          Does acceptance have a clear bounded process?
      EXCLUSIVITY:
        question: >
          Are deadline and reservation consequences deterministic and truthful?
      FRICTION:
        question: >
          Can the buyer proceed without meetings, hidden steps or ambiguity?
      AUTHORITY:
        question: >
          Does the offer remain inside CommercialAuthorityEnvelope?
      CONSISTENCY:
        question: >
          Does plain-language presentation exactly match CommercialOfferIR?
# =====================================================================
# 52. COMMERCIAL QC HARD FAILURES
# =====================================================================
hard_failures:
  - code: COMMERCIAL.OUTSIDE_AUTHORITY_ENVELOPE
    severity: CRITICAL
  - code: COMMERCIAL.PAYMENT_PERCENTAGES_INVALID
    severity: CRITICAL
  - code: COMMERCIAL.HIDDEN_FEE
    severity: CRITICAL
  - code: COMMERCIAL.QUANTUM_PLATFORM_IP_TRANSFER
    severity: CRITICAL
  - code: COMMERCIAL.DELIVERY_UNSUPPORTED
    severity: CRITICAL
  - code: COMMERCIAL.FALSE_SCARCITY
    severity: CRITICAL
  - code: COMMERCIAL.OFFER_TIMER_RESETTABLE
    severity: CRITICAL
  - code: COMMERCIAL.RIGHTS_AMBIGUOUS
    severity: MAJOR
  - code: COMMERCIAL.REVISION_SCOPE_AMBIGUOUS
    severity: MAJOR
  - code: COMMERCIAL.ACCEPTANCE_UNBOUNDED
    severity: MAJOR
  - code: COMMERCIAL.PLAIN_LANGUAGE_MISMATCH
    severity: CRITICAL
  - code: COMMERCIAL.RESERVATION_CREDIT_MISMATCH
    severity: CRITICAL
# =====================================================================
# 53. REPAIR
# =====================================================================
repair:
  order:
    - correct_calculation
    - clarify_plain_language
    - align_summary_to_IR
    - repair_payment_schedule
    - repair_revision_definition
    - repair_acceptance_definition
    - repair_rights_scope
    - adjust_unsupported_delivery_commitment
    - recompute_price_within_policy
    - require_new_authority_if_outside_envelope
  after_reveal:
    semantic_repair:
      in_place: false
    if_material_error_found:
      - suspend_offer
      - do_not_edit_revealed_version
      - issue_new_version_only_if_policy_and_legal_rules_allow
      - preserve_original_history
# =====================================================================
# 54. EVENTS
# =====================================================================
events:
  family: COMMERCIAL
  event_types:
    COMMERCIAL.OFFER_AUTHORIZED:
      fields:
        - offer_ref
        - authorization_ref
    COMMERCIAL.OFFER_LOCKED:
      fields:
        - offer_lock_ref
    COMMERCIAL.OFFER_REVEALED:
      fields:
        - offer_ref
        - target_ref
        - revealed_at
        - expires_at
    COMMERCIAL.RESERVATION_REQUESTED:
      fields:
        - offer_ref
        - reservation_request_ref
    COMMERCIAL.RESERVATION_EFFECTIVE:
      fields:
        - reservation_ref
        - expires_at
    COMMERCIAL.OFFER_DECLINED:
      fields:
        - offer_ref
        - target_ref
    COMMERCIAL.OFFER_EXPIRED:
      fields:
        - offer_ref
        - target_ref
        - reason
    COMMERCIAL.AGREEMENT_EXECUTED:
      source_owner:
        spec: 24
    COMMERCIAL.INITIAL_PAYMENT_PENDING:
      source_owner:
        spec: 25
# =====================================================================
# 55. SIGNALS
# =====================================================================
signals:
  - COMMERCIAL.OFFER_READY
  - COMMERCIAL.OFFER_REVEALED
  - COMMERCIAL.OFFER_EXPIRING
  - COMMERCIAL.RESERVATION_REQUESTED
  - COMMERCIAL.RESERVATION_ACTIVE
  - COMMERCIAL.LEGAL_REVIEW_STARTED
  - COMMERCIAL.COUNTERPROPOSAL_RECEIVED
  - COMMERCIAL.OFFER_EXPIRED
  - COMMERCIAL.OFFER_DECLINED
  - COMMERCIAL.AGREEMENT_EXECUTED
  - COMMERCIAL.NEXT_TARGET_ELIGIBLE
# =====================================================================
# 56. COUNTERPROPOSAL HANDLING
# =====================================================================
counterproposal:
  CounterproposalObservation:
    extends:
      - 10.EvidenceObject
    fields:
      observation_id:
      offer_ref:
      requested_changes:
      affected_terms:
      received_at:
      policy_response:
      provenance_ref:
  default_response:
    - preserve_current_offer
    - explain_fixed_offer
    - preserve_existing_clock
    - do_not_autonomously_negotiate
  may_be_used_for_future_learning:
    true
  future_owner:
    29_quantum_opportunity_acquisition_learning_build_spec.yaml
# =====================================================================
# 57. NO-MEETING EXPERIENCE
# =====================================================================
no_meeting:
  normal_path: |
    ProofOfFilm
        ↓
    CuratedProjectExperience
        ↓
    REVEAL THE OPPORTUNITY
        ↓
    CommercialSummary
        ↓
    REVIEW AGREEMENT
        ↓
    SIGN
        ↓
    PAY
        ↓
    WORK AUTHORIZED
  meeting_required:
    default: false
  synchronous_human_QAS_contact_required:
    default: false
# =====================================================================
# 58. BUYER INTERNAL PROCESS
# =====================================================================
buyer_internal_process:
  principle: >
    Quantum does not require meetings, but the buyer may still have internal
    governance, legal, finance or authority requirements.
  supports:
    - legal_review
    - internal_summary
    - agreement_sharing
    - signatory_routing
    - payment_routing
  does_not:
    - pretend_internal_approval_does_not_exist
    - falsely_claim_one_executive_can_override_buyer_governance
# =====================================================================
# 59. SECURITY
# =====================================================================
security:
  offer_scope:
    required:
      - valid_target_session_or_authorized_legal_review_path
  CommercialOfferIR:
    raw_internal:
      not_public: true
  buyer_visible_offer:
    protected: true
  expiration:
    server_side: true
  signature_authority:
    delegated_to: spec_24
  payment:
    delegated_to: spec_25
# =====================================================================
# 60. PRIVACY
# =====================================================================
privacy:
  buyer_target:
    use:
      - professional_role
      - organization
      - project_relevance
      - current_authorized_session
  not_required:
    - family_data
    - private_location
    - unrelated_behavioral_profile
  commercial_telemetry:
    minimum:
      - offer_revealed
      - agreement_review_started
      - reservation_requested
      - executed
      - declined
      - expired
# =====================================================================
# 61. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - OpportunityHandoff_to_CommercialOfferIR
    - StudioCommercialPolicy_to_CommercialOfferIR
    - AuthorityEnvelope_to_offer
    - ProjectCommercialIntent_to_offer
    - ProductionModel_to_delivery_commitment
    - OfferConsideration_to_pricing_policy
    - payment_schedule_to_offer
    - rights_model_to_offer
    - revision_policy_to_offer
    - acceptance_policy_to_offer
    - offer_to_CommercialOfferLock
    - reveal_to_exact_offer_digest
    - reservation_to_exact_offer
    - ContractReadinessPayload_to_locked_offer
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 62. OBSERVABILITY
# =====================================================================
observability:
  offer:
    - offer_reveal_rate
    - time_from_CuratedExperience_to_offer_reveal
    - offer_read_rate
    - agreement_review_rate
  reservation:
    - reservation_request_rate
    - reservation_payment_clear_rate
    - reservation_to_execution_rate
    - reservation_expiration_rate
  conversion:
    - direct_execution_rate
    - offer_to_execution_rate
    - decline_rate
    - expiration_rate
    - time_to_execution
  friction:
    - required_meeting_count
    - clarification_count
    - counterproposal_rate
    - legal_review_duration
    - signability_projection
  fairness:
    - offer_fairness_score
    - buyer_upside_estimate
    - future_repeat_purchase_when_available
# =====================================================================
# 63. LEARNING
# =====================================================================
learning:
  observations:
    - revealed_offer
    - legal_review
    - reservation
    - counterproposal
    - execution
    - expiration
    - repeat_purchase
  learnable:
    - offer_clarity
    - reservation_usage
    - ideal_information_density
    - target-specific_decision_friction
    - payment_schedule_friction
    - rights_clarity
    - price_acceptance_by_reputation_state
  binding_policy_learning:
    owner:
      future: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
  cannot_self_modify:
    - StudioCommercialPolicy
    - CommercialAuthorityEnvelope
    - active_offer
    - creator_commercial_locks
# =====================================================================
# 64. FAILURE MODES
# =====================================================================
failure_modes:
  OFFER_COMPILER_FAILURE:
    behavior:
      - do_not_reveal
  DELIVERY_FEASIBILITY_UNCERTAIN:
    behavior:
      - increase_reasoning
      - choose_more_conservative_commitment
      - do_not_overpromise
  LEGAL_TEMPLATE_UNAVAILABLE:
    behavior:
      - do_not_reveal_binding_offer
      - wait_for_approved_template_configuration
  PAYMENT_SCHEDULE_INVALID:
    behavior:
      - fail_QC
  RESERVATION_PAYMENT_NOT_CLEARED:
    behavior:
      - reservation_not_effective
      - original_offer_expiry_continues
  OFFER_EXPIRES_DURING_LEGAL_REVIEW:
    behavior:
      - block_execution_unless_valid_reservation_or_other_policy_state_exists
  COUNTERPROPOSAL:
    behavior:
      - no_mutation
      - fixed_offer_response
  OFFER_STATE_STORE_FAILURE:
    behavior:
      - fail_closed_for_reveal_or_execution
      - do_not_guess_remaining_time
# =====================================================================
# 65. CONCURRENCY
# =====================================================================
concurrency:
  same_project:
    exclusive_active_offer_count:
      default_max: 1
  multiple_targets:
    concurrent_exclusive_offers:
      prohibited_for_same_exclusivity_scope: true
  offer_expiry_vs_signature:
    exact_event_order_required: true
    legal_resolution_owner: spec_24
  reservation_payment_vs_expiry:
    exact_payment_cleared_time_required: true
    payment_truth_owner: spec_25
  state_commit:
    optimistic_or_transactional_control_required: true
# =====================================================================
# 66. IDEMPOTENCY
# =====================================================================
idempotency:
  reveal_offer:
    same_offer_same_target:
      first_reveal_timestamp_immutable: true
  decline:
    repeated:
      safe: true
  expire:
    repeated:
      safe: true
  reservation_request:
    idempotency_key_required: true
  reservation_effective:
    same_payment_event:
      once: true
  next_target_signal:
    once_per_final_expiry_or_decline: true
# =====================================================================
# 67. UNIT TESTS
# =====================================================================
tests:
  unit:
    offer:
      - total_payment_percent_equals_100
      - Quantum_platform_IP_reserved
      - fixed_offer_has_no_negotiation_action
    timing:
      - offer_clock_starts_at_reveal
      - Key_activation_does_not_start_clock
      - 24_hour_default_computed_exactly
    reservation:
      - default_is_10_percent
      - default_is_7_calendar_days
      - only_one_default_reservation
      - reservation_credit_applies_to_initial_payment
    revisions:
      - deficiency_repair_not_automatically_revision_round
      - new_ending_classifies_material_change
    acceptance:
      - acceptance_window_is_bounded
    rights:
      - studio_equity_not_transferable
      - platform_IP_not_transferable
    expiration:
      - expired_offer_cannot_execute
      - countdown_does_not_reset
# =====================================================================
# 68. PROPERTY TESTS
# =====================================================================
property_tests:
  - CommercialOfferIR_never_modifies_CreatorModel
  - CommercialOfferIR_never_modifies_ProductMarketModel
  - CommercialOfferIR_never_modifies_ProductionModel
  - offer_cannot_exceed_AuthorityEnvelope
  - offer_cannot_transfer_Quantum_platform_IP
  - offer_reveal_timestamp_is_immutable
  - Key_activation_never_changes_offer_expiration
  - reserved_offer_never_enters_next_target_sequence_before_reservation_expiry
  - expired_offer_never_reopens_by_countdown_reset
  - counterproposal_never_mutates_active_offer
  - legal_language_never_becomes_source_of_different_business_terms
  - payment_provider_never_changes_payment_percentages
  - buyer_meeting_never_required_for_normal_execution
  - reservation_forfeiture_never_counted_as_primary_success_metric
  - commercial_offer_never_claims_guaranteed_buyer_ROI
  - current_offer_version_remains_reconstructable
  - rights_to_project_never_imply_rights_to_Quantum_company
  - signature_never_emits_WORK_AUTHORIZED_directly
# =====================================================================
# 69. SCENARIO TESTS
# =====================================================================
scenario_tests:
  direct_yes:
    sequence:
      - reveal_offer
      - review_agreement
      - execute
    expect:
      - agreement_event_to_spec_25
      - initial_payment_pending
      - no_meeting
  needs_legal:
    sequence:
      - reveal_offer
      - open_agreement
      - legal_review
      - reserve_10_percent
      - seven_day_window
      - execute
    expect:
      - reservation_credit
      - remaining_initial_payment_10_percent
  reservation_expires:
    sequence:
      - reserve
      - no_execution
      - seven_days_elapsed
    expect:
      - reservation_expired
      - project_released
      - next_target_signal
      - no_second_extension_default
  buyer_returns_after_expiry:
    expect:
      - prior_offer_unavailable
      - same_project_reoffer_denied_under_default_policy
  buyer_offers_more_money_after_expiry:
    expect:
      - expired_offer_not_reactivated
      - default_reoffer_policy_still_applies
  buyer_requests_discount:
    expect:
      - fixed_offer_unchanged
      - clarification_only_response
  buyer_finds_real_delivery_defect:
    expect:
      - deficiency_repair
      - not_arbitrary_paid_revision
# =====================================================================
# 70. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: CO-G01
    check: CommercialOfferIR has one canonical writer
  - id: CO-G02
    check: commercial semantics and legal language are separate
  - id: CO-G03
    check: StudioCommercialPolicy exists
  - id: CO-G04
    check: CommercialAuthorityEnvelope exists
  - id: CO-G05
    check: autonomous offer cannot exceed authority envelope
  - id: CO-G06
    check: default offer mode is fixed and fair
  - id: CO-G07
    check: no meeting required normal path
  - id: CO-G08
    check: no negotiation required normal path
  - id: CO-G09
    check: initial offer clock begins only at OfferReveal
  - id: CO-G10
    check: default initial exclusive window is 24 hours
  - id: CO-G11
    check: default reservation is 10 percent
  - id: CO-G12
    check: default reservation buys 7 calendar days
  - id: CO-G13
    check: reservation payment credits purchase
  - id: CO-G14
    check: second default extension unavailable
  - id: CO-G15
    check: expiration is server-side and immutable
  - id: CO-G16
    check: expired offer releases exclusivity
  - id: CO-G17
    check: default reoffer policy rejects expired target for same project
  - id: CO-G18
    check: payment schedule sums to 100 percent
  - id: CO-G19
    check: baseline 20/30/50 schedule representable
  - id: CO-G20
    check: reservation credit integrates with initial 20 percent
  - id: CO-G21
    check: revision policy defines included vs material change
  - id: CO-G22
    check: deficiency repair distinguishable from revision round
  - id: CO-G23
    check: acceptance is bounded
  - id: CO-G24
    check: project rights separated from Quantum platform rights
  - id: CO-G25
    check: acquiring project cannot acquire Quantum equity
  - id: CO-G26
    check: backend participation is configurable rather than assumed
  - id: CO-G27
    check: merchandising participation may be zero
  - id: CO-G28
    check: plain-language commercial summary matches IR
  - id: CO-G29
    check: SignabilityProjection exists
  - id: CO-G30
    check: ConversionPotential consumes Marketability from spec 18
  - id: CO-G31
    check: commercial offer has immutable lock
  - id: CO-G32
    check: ContractReadinessPayload exactly matches locked offer
  - id: CO-G33
    check: CommercialOfferQC uses spec 07 formal authority
  - id: CO-G34
    check: signature cannot directly start production
  - id: CO-G35
    check: fake scarcity and countdown reset are hard failures
  - id: CO-G36
    check: next buyer signal emits after final expiry or decline
  - id: CO-G37
    check: reservation forfeiture is not optimized as core revenue
  - id: CO-G38
    check: current capability evidence supports delivery commitment
  - id: CO-G39
    check: buyer internal governance is supported without meetings
  - id: CO-G40
    check: active offer never mutates in place
# =====================================================================
# 71. IMPLEMENTATION WAVES
# =====================================================================
implementation_waves:
  COW1:
    name: commercial_authority
    targets:
      - StudioCommercialPolicy
      - CommercialAuthorityEnvelope
      - ProjectCommercialIntent
  COW2:
    name: offer_semantics
    depends_on:
      - COW1
    targets:
      - ProductScope
      - Consideration
      - PaymentSchedule
      - DeliveryCommitment
      - RightsModel
  COW3:
    name: revisions_acceptance
    depends_on:
      - COW2
    targets:
      - RevisionPolicy
      - MaterialChangeAssessment
      - AcceptancePolicy
  COW4:
    name: exclusivity
    depends_on:
      - COW2
    targets:
      - OfferReveal
      - OfferAvailabilityWindow
      - ReservationPolicy
      - ExpirationPolicy
      - ReofferPolicy
  COW5:
    name: offer_compiler
    depends_on:
      - COW3
      - COW4
    targets:
      - CommercialOfferIR
      - FairnessModel
      - Authorization
      - CommercialSummary
  COW6:
    name: QC_and_lock
    depends_on:
      - COW5
    targets:
      - CommercialOfferQC
      - CommercialOfferLock
      - ContractReadinessPayload
  COW7:
    name: runtime_state
    depends_on:
      - COW6
    targets:
      - reveal
      - reservation
      - expiration
      - decline
      - next_target_signal
  COW8:
    name: conversion_learning
    depends_on:
      - COW7
    targets:
      - Signability
      - ConversionPotential
      - observability
# =====================================================================
# 72. OPEN DECISIONS
# =====================================================================
open_decisions:
  - id: CO-OD-01
    decision: minimum consideration policy by format
    status: BUSINESS_POLICY_REQUIRED
  - id: CO-OD-02
    decision: exact early-stage margin target
    status: BUSINESS_POLICY_REQUIRED
  - id: CO-OD-03
    decision: exact default acceptance period
    status: COORDINATE_WITH_LEGAL_TEMPLATE
  - id: CO-OD-04
    decision: exact default revision window
    status: BUSINESS_AND_LEGAL_POLICY_REQUIRED
  - id: CO-OD-05
    decision: rights transfer trigger default
    status: COORDINATE_WITH_SPEC_24
  - id: CO-OD-06
    decision: exact project reoffer permanence policy after years of inactivity
    status: CREATOR_POLICY
  - id: CO-OD-07
    decision: pricing algorithm
    status: FUTURE_SPEC_29
  - id: CO-OD-08
    decision: whether optional future seasons have predetermined consideration
    status: PROJECT_POLICY
  - id: CO-OD-09
    decision: default buyer-delay schedule adjustment
    status: LEGAL_AND_PRODUCTION_POLICY
  - id: CO-OD-10
    decision: default material-change economic model
    status: BUSINESS_POLICY
# =====================================================================
# 73. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: fixed_offer_becomes_unfair
    control:
      - OfferFairnessModel
      - policy_versioning
      - market_learning
  - risk: short_deadline_destroys_valid_deal
    control:
      - 10_percent_7_day_reservation
  - risk: reservation_looks_like_penalty
    control:
      - clear_purpose
      - legal_template
      - explicit_disclosure
      - credit_on_purchase
  - risk: deadline_becomes_fake
    control:
      - server_side_clock
      - no_reset
      - real_next_target_release
  - risk: buyer_internal_legal_process_needs_time
    control:
      - legal_review
      - reservation
  - risk: rights_grant_accidentally_sells_studio
    control:
      - QuantumReservedRights
      - legal_QC
  - risk: no_negotiation_policy_blocks_clarification
    control:
      - clarification_only_mode
  - risk: price_is_too_low_as_reputation_grows
    control:
      - future_reputation_pricing_policy
  - risk: buyer_exploits_unbounded_approval
    control:
      - AcceptancePolicy
  - risk: Quantum_exploits_revision_ambiguity
    control:
      - defined_RevisionPolicy
      - deficiency_repairs_separate
  - risk: high_signability_metric_creates_dark_patterns
    control:
      - no_dark_patterns
      - real_scarcity
      - truthful_terms
  - risk: system_autonomously_offers_bad_terms
    control:
      - CommercialAuthorityEnvelope
  - risk: active_offer_changes_during_review
    control:
      - immutable_offer_version
