# =====================================================================
# 104. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: engine becomes giant mutable monolith
    control:
      - typed DAG
      - small job contracts
      - immutable artifacts
      - state machine
  - risk: engine begins inventing strategy
    control:
      - ProductionModel boundary
      - preapproved fallback only
  - risk: provider async jobs duplicate after crash
    control:
      - provider request IDs
      - reconciliation
      - idempotency
  - risk: retries waste large compute
    control:
      - typed retryable errors
      - max attempts
      - circuit breakers
  - risk: semantic failure triggers blind retry loop
    control:
      - QC repair path
      - operational/semantic failure separation
  - risk: artifact overwritten
    control:
      - immutable content-addressed artifacts
  - risk: stale output reaches final timeline
    control:
      - source revision pinning
      - stale-job detection
      - certificate validation
  - risk: one provider outage stalls studio
    control:
      - heterogeneous strategies
      - fallback
      - continue independent branches
  - risk: QC backlog causes uncontrolled candidate generation
    control:
      - backpressure
      - take early stopping
  - risk: accepted shot lost during repair
    control:
      - immutable accepted store
      - dependency-aware invalidation
  - risk: large episode restart becomes unsafe
    control:
      - durable checkpoints
      - manifest reconstruction
      - worker leases
  - risk: provider-specific fields infect semantic architecture
    control:
      - adapter namespaces
      - normalized ProductionJob contracts
  - risk: deterministic finishing destroys creative artifacts
    control:
      - ProductionIntent/QualitySemantics guards
  - risk: cost unexpectedly explodes
    control:
      - per-attempt cost ledger
      - hard budget
      - scheduler gating
  - risk: worker crash loses execution receipt
    control:
      - provider reconciliation
      - append-only attempt state
  - risk: accepted artifact trusted after relevant semantic change
    control:
      - certificate invalidation
      - artifact dependency graph
