metadata:
  spec_id: quantum.animation.production_engine.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Production Engine
  depends_on:
    - spec_id: quantum.animation.system_architecture.v1
      file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - spec_id: quantum.animation.world_model.build_spec.v2
      file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: WORLD_CONTEXT_AND_EXPECTED_STATE_DEPENDENCY
    - spec_id: quantum.animation.polycognitive_runtime.build_spec.v1
      file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: EXECUTION_ORCHESTRATION_DEPENDENCY
    - spec_id: quantum.animation.creative_intelligence.build_spec.v1
      file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: LOCKED_CREATIVE_ARTIFACT_DEPENDENCY
    - spec_id: quantum.animation.audience_product_intelligence.build_spec.v1
      file: 04_quantum_audience_product_intelligence_build_spec.yaml
      relationship: DELIVERY_AND_ACCESSIBILITY_REQUIREMENT_DEPENDENCY
    - spec_id: quantum.animation.self_model.build_spec.v1
      file: 05_quantum_self_model_build_spec.yaml
      relationship: LIVE_CAPABILITY_AND_PROVIDER_STATE_DEPENDENCY
    - spec_id: quantum.animation.production_model.build_spec.v1
      file: 06_quantum_production_model_build_spec.yaml
      relationship: PRODUCTION_STRATEGY_DEPENDENCY
    - spec_id: quantum.animation.autonomous_qc.build_spec.v1
      file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: ACCEPTANCE_AND_REPAIR_GATE_DEPENDENCY
  architectural_identity:
    concise: >
      Production Engine reliably executes approved production strategies and
      materializes certified audiovisual artifacts.
    extended: >
      Quantum Production Engine is the execution substrate of Quantum Animation
      Studio. It consumes approved ProductionModel strategies and locked semantic
      artifacts, compiles them into deterministic and restartable execution DAGs,
      schedules and invokes heterogeneous models/tools/providers, manages
      dependencies, retries, take generation, caching, artifact storage,
      lineage, checkpointing, fallback activation, partial regeneration,
      compositing, audio production, timeline assembly, finishing and mastering,
      and submits resulting artifacts to Autonomous QC. It owns live
      ProductionManifest state and execution truth, but not creative meaning,
      fictional truth, production strategy or acceptance.
  owner_question:
    primary: "How do we manufacture the approved film reliably?"
  secondary_questions:
    - "What jobs must run?"
    - "In what dependency order?"
    - "Which approved implementation binding should execute each stage?"
    - "Can these jobs run concurrently?"
    - "What should retry automatically?"
    - "What should activate fallback?"
    - "What should be cached?"
    - "What exact artifact resulted from each execution?"
    - "How do we resume safely after failure?"
    - "Which accepted artifacts can be reused?"
    - "How do we regenerate only the affected shot or layer?"
    - "How do we assemble accepted outputs deterministically?"
    - "When does an artifact become eligible for downstream use?"
  not_owner_of:
    - creator intent
    - audience intent
    - fictional truth
    - global reasoning policy
    - capability truth
    - production strategy selection
    - acceptance criteria
    - final PASS authority
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Execute approved production strategies with reliability, isolation,
    reproducibility, restartability and minimum blast radius.
  success_definition: >
    Hundreds of heterogeneous media-generation and deterministic jobs can run
    concurrently, recover from provider/tool failures, preserve accepted work,
    generate multiple takes where instructed, submit outputs to QC, activate
    approved fallbacks when necessary, and deterministically assemble the final
    certified episode without requiring human production supervision.
  scale_target: >
    Support the progression from 10–15 shot MVPs to 250+ shot episodes and
    eventually season/feature production without architectural redesign.
  core_law: >
    Production Engine executes strategy. It does not invent creative or
    production meaning.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  PE-001:
    name: ENGINE_EXECUTES_APPROVED_STRATEGY
    statement: >
      Every consequential execution stage must originate from an approved
      ProductionStrategy, approved repair plan or explicit engine-safe
      deterministic rule.
  PE-002:
    name: ENGINE_IS_NOT_CREATIVE
    statement: >
      Production Engine cannot rewrite story, character, World truth,
      CreatorModel or ProductionIntent to make execution easier.
  PE-003:
    name: ENGINE_IS_NOT_PRODUCTION_STRATEGIST
    statement: >
      Choosing fundamentally different manufacturing approaches belongs to
      ProductionModel, not runtime execution code.
  PE-004:
    name: MANIFEST_IS_LIVE_EXECUTION_TRUTH
    statement: >
      ProductionManifest records what is actually scheduled, running, failed,
      retried, completed, QC-held and accepted.
  PE-005:
    name: JOBS_ARE_IDEMPOTENT_WHERE_POSSIBLE
    statement: >
      Safe repeated execution of the same semantic job should not duplicate
      canonical state or corrupt accepted artifacts.
  PE-006:
    name: CONTENT_ADDRESSED_ARTIFACTS
    statement: >
      Artifacts should be immutable and identified by content and source lineage
      where practical.
  PE-007:
    name: ACCEPTED_ARTIFACTS_ARE_IMMUTABLE
    statement: >
      Once QC-certified, an artifact is never modified in place.
  PE-008:
    name: MINIMUM_BLAST_RADIUS
    statement: >
      Failure or repair should invalidate only directly dependent jobs/artifacts.
  PE-009:
    name: SHOT_LEVEL_ISOLATION
    statement: >
      Individual shots should be independently executable and replaceable by default.
  PE-010:
    name: LAYER_LEVEL_ISOLATION_WHERE_STRATEGIC
    statement: >
      Independent layers may be generated and repaired separately when defined by
      ProductionModel.
  PE-011:
    name: DETERMINISTIC_ASSEMBLY
    statement: >
      Timeline assembly, conform, subtitles, delivery transforms and other exact
      operations should be deterministic whenever possible.
  PE-012:
    name: GENERATION_OUTPUT_IS_CANDIDATE_NOT_ACCEPTED
    statement: >
      A successful provider call produces a candidate artifact, not an accepted
      artifact.
  PE-013:
    name: QC_GATES_PROMOTION
    statement: >
      Downstream promotion requiring quality acceptance must reference a valid
      QualityCertificate.
  PE-014:
    name: RETRY_AND_REPAIR_DIFFER
    statement: >
      Retrying a transient failure is execution logic. Changing strategy to fix
      semantic quality belongs to ProductionModel/repair governance.
  PE-015:
    name: FALLBACKS_MUST_BE_PREAUTHORIZED
    statement: >
      Production Engine may activate only fallback strategies approved by
      ProductionModel.
  PE-016:
    name: PROVIDER_FAILURE_IS_ISOLATED
    statement: >
      Provider failure must not corrupt unrelated jobs or accepted outputs.
  PE-017:
    name: RESUMABILITY
    statement: >
      Engine restart must resume incomplete work from durable execution state.
  PE-018:
    name: NO_DUPLICATE_CANONICAL_COMMIT
    statement: >
      Retries and recovery cannot produce duplicate acceptance/lock transitions.
  PE-019:
    name: EXECUTION_RECEIPTS_ARE_FIRST_CLASS
    statement: >
      Every significant invocation should emit exact execution evidence for
      SelfModel, ProductionModel and QC learning.
  PE-020:
    name: DEPENDENCIES_ARE_EXPLICIT
    statement: >
      Runtime ordering is derived from an explicit DAG, not prompt-chain convention.
  PE-021:
    name: SAFE_PARALLELISM
    statement: >
      Independent jobs should run concurrently while respecting dependency,
      quota, budget and provider constraints.
  PE-022:
    name: CACHE_BY_SEMANTIC_IDENTITY
    statement: >
      Equivalent deterministic or generative inputs may reuse valid artifacts
      when cache semantics permit.
  PE-023:
    name: STALE_INPUTS_CANNOT_PROMOTE
    statement: >
      Jobs compiled against invalidated source revisions cannot silently publish
      downstream outputs.
  PE-024:
    name: RUN_PINNED_DEPENDENCIES
    statement: >
      Each job records exact model/tool, source revision, strategy and policy versions.
  PE-025:
    name: LIVE_HEALTH_CHECK_BEFORE_EXPENSIVE_EXECUTION
    statement: >
      Current provider availability should be checked near execution time for
      expensive or critical jobs.
  PE-026:
    name: QUOTA_AND_RATE_LIMIT_AWARE
    statement: >
      Scheduler must account for provider quotas, concurrency, queue load and
      temporary rate limits.
  PE-027:
    name: BUDGET_ENFORCEMENT
    statement: >
      Engine tracks actual cost and blocks execution beyond authorized hard limits.
  PE-028:
    name: TEMPORARY_FAILURE_DOES_NOT_MEAN_SEMANTIC_FAILURE
    statement: >
      Network timeout, 5xx, worker crash and rate-limit errors should be handled
      separately from artifact-quality failure.
  PE-029:
    name: ARTIFACT_LINEAGE_IS_COMPLETE
    statement: >
      Every accepted artifact must trace back to source semantics, strategy,
      implementations, execution attempts and QC.
  PE-030:
    name: ENGINE_CAN_RUN_HETEROGENEOUS_PIPELINES
    statement: >
      One episode may use different video generators, image generators, voice
      models, music systems and deterministic tools.
  PE-031:
    name: EXECUTION_MAY_BE_ASYNCHRONOUS
    statement: >
      Long-running render/audio jobs should be asynchronous and event-driven.
  PE-032:
    name: WORKFLOW_ENGINE_IS_REPLACEABLE
    statement: >
      The semantic execution model must not depend on one orchestration vendor.
  PE-033:
    name: RECOVERY_IS_DETERMINISTIC
    statement: >
      Restart behavior should reconstruct job eligibility from durable state,
      not operator memory.
  PE-034:
    name: PARTIAL_SUCCESS_IS_PRESERVED
    statement: >
      Completed accepted subgraphs survive failures in other branches.
  PE-035:
    name: EXECUTION_IS_OBSERVABLE
    statement: >
      State transitions, costs, latencies, provider failures, attempts and
      artifacts must be measurable.
  PE-036:
    name: FINAL_MASTER_IS_ASSEMBLED_FROM_CERTIFIED_INPUTS
    statement: >
      Final assembly should use certified/locked components except where a higher
      level QC contract intentionally evaluates a candidate assembly first.
# =====================================================================
# 3. OWNERSHIP BOUNDARIES
# =====================================================================
ownership_boundaries:
  production_engine_owns:
    - ProductionManifest
    - ExecutionDAG
    - ProductionJob
    - JobAttempt
    - worker scheduling
    - provider/tool invocation
    - runtime dependency state
    - queue state
    - retry state
    - fallback activation execution
    - take generation execution
    - artifact materialization
    - artifact registration
    - temporary artifact state
    - accepted artifact freezing
    - execution receipt generation
    - timeline assembly execution
    - compositing execution
    - audio synthesis execution
    - finishing execution
    - mastering execution
    - execution checkpointing
    - resumability
    - runtime budget tracking
    - rate-limit handling
    - provider error handling
    - workflow cancellation
    - runtime cache
    - worker leases
    - execution observability
  adjacent_not_owned:
    ProductionIntent:
      owner: production_model
    ProductionStrategy:
      owner: production_model
    RepairRecommendation:
      owner: autonomous_qc
    repair_strategy_selection:
      owner:
        - production_model
        - polycognitive_runtime
    capability_truth:
      owner: self_model
    artifact_acceptance:
      owner: autonomous_qc
    World_truth:
      owner: world_model
    locks:
      semantic_authority:
        owner: relevant_domain
      physical_storage_execution:
        may_be_materialized_by: production_engine
  hard_boundary: >
    Engine runtime decisions may optimize scheduling/execution mechanics but may
    not alter semantic intent or strategy beyond explicitly authorized bounds.
# =====================================================================
# 4. ENGINE INPUT CONTRACT
# =====================================================================
engine_inputs:
  required:
    project_context:
      - project_id
      - project_revision
    locked_artifacts:
      - creative.lock_or_equivalent
      - animatic.lock_where_applicable
    ProductionModel:
      required: true
    ProductionStrategy:
      required_per_production_unit: true
    ProductionQualityPolicy:
      required: true
    WorldContext:
      - World revision
      - expected visible state refs
      - asset/entity refs
    QCContracts:
      required_for_gated_outputs: true
  runtime_inputs:
    - current SelfModel live availability
    - budget state
    - schedule state
    - provider quotas
    - worker capacity
  optional:
    - cached accepted artifacts
    - reusable character/environment assets
    - prior episode artifacts
# =====================================================================
# 5. PRODUCTION MANIFEST
# =====================================================================
production_manifest:
  ProductionManifest:
    fields:
      manifest_id:
      project_id:
      episode_or_feature_id:
      version:
      production_model_ref:
      production_intent_ref:
      source_lock_refs:
      source_revision_refs:
      execution_DAG_ref:
      production_units:
        type: list[ProductionUnitExecutionRef]
      jobs:
        type: list[ProductionJobRef]
      artifact_refs:
        type: list[ArtifactRef]
      quality_certificate_refs:
        type: list[QualityCertificateRef]
      active_fallbacks:
        type: list[FallbackActivation]
      runtime_budget:
        type: RuntimeBudgetState
      execution_state:
        enum:
          - CREATED
          - READY
          - RUNNING
          - PAUSED
          - DEGRADED
          - BLOCKED
          - FAILED
          - COMPLETED
          - CANCELLED
      failure_summary:
        nullable: true
      execution_revision:
      created_at:
      updated_at:
  mutable_live_state:
    value: true
  immutable_history:
    every_state_transition_recorded: true
# =====================================================================
# 6. EXECUTION DAG
# =====================================================================
execution_DAG:
  ExecutionDAG:
    fields:
      dag_id:
      project_id:
      production_model_ref:
      nodes:
        type: list[ExecutionNode]
      edges:
        type: list[ExecutionDependency]
      critical_path:
        nullable: true
      graph_digest:
      compiled_at:
  ExecutionNode:
    fields:
      node_id:
      production_unit_ref:
      job_template_ref:
      stage_type:
      strategy_ref:
      source_revision_refs:
      input_artifact_refs:
      expected_output_types:
      capability_requirements:
      selected_implementation_ref:
        nullable: true
      retry_policy_ref:
      fallback_plan_ref:
        nullable: true
      QC_gate_ref:
        nullable: true
      cache_policy_ref:
      idempotency_policy_ref:
      priority:
      execution_class:
      resource_requirements:
  ExecutionDependency:
    fields:
      upstream_node_id:
      downstream_node_id:
      dependency_type:
        enum:
          - HARD
          - DATA
          - SEMANTIC
          - QC_CERTIFICATE
          - LOCK
          - OPTIONAL
      artifact_selector:
        nullable: true
      invalidation_propagates:
        type: bool
# =====================================================================
# 7. JOB STATE MACHINE
# =====================================================================
job_state_machine:
  states:
    - CREATED
    - WAITING_DEPENDENCIES
    - READY
    - LEASED
    - STARTING
    - RUNNING
    - WAITING_PROVIDER
    - OUTPUT_PENDING
    - MATERIALIZING
    - SUBMITTED_TO_QC
    - QC_PENDING
    - ACCEPTED
    - REJECTED
    - RETRY_WAIT
    - FALLBACK_PENDING
    - BLOCKED
    - FAILED_TERMINAL
    - CANCELLED
    - INVALIDATED
  allowed_transitions:
    CREATED:
      - WAITING_DEPENDENCIES
      - READY
    WAITING_DEPENDENCIES:
      - READY
      - INVALIDATED
      - CANCELLED
    READY:
      - LEASED
      - CANCELLED
      - INVALIDATED
    LEASED:
      - STARTING
      - READY
    STARTING:
      - RUNNING
      - RETRY_WAIT
      - FAILED_TERMINAL
    RUNNING:
      - WAITING_PROVIDER
      - OUTPUT_PENDING
      - RETRY_WAIT
      - FAILED_TERMINAL
      - CANCELLED
    WAITING_PROVIDER:
      - OUTPUT_PENDING
      - RETRY_WAIT
      - FAILED_TERMINAL
    OUTPUT_PENDING:
      - MATERIALIZING
      - RETRY_WAIT
    MATERIALIZING:
      - SUBMITTED_TO_QC
      - ACCEPTED
      - RETRY_WAIT
    SUBMITTED_TO_QC:
      - QC_PENDING
    QC_PENDING:
      - ACCEPTED
      - REJECTED
      - FALLBACK_PENDING
      - BLOCKED
    REJECTED:
      - RETRY_WAIT
      - FALLBACK_PENDING
      - FAILED_TERMINAL
    RETRY_WAIT:
      - READY
      - FALLBACK_PENDING
      - FAILED_TERMINAL
    FALLBACK_PENDING:
      - READY
      - BLOCKED
    ACCEPTED:
      terminal_for_version: true
  invariant: >
    ACCEPTED requires valid QC certificate when the node's contract requires QC.
# =====================================================================
# 8. PRODUCTION JOB
# =====================================================================
production_job:
  ProductionJob:
    fields:
      job_id:
      manifest_id:
      dag_node_id:
      production_unit_ref:
      job_type:
        enum:
          - model_inference
          - deterministic_tool
          - composite
          - audio_generation
          - music_generation
          - voice_generation
          - video_generation
          - image_generation
          - animation_generation
          - timeline_operation
          - finishing
          - mastering
          - QC_submission
          - artifact_copy
          - artifact_transform
      strategy_ref:
      stage_ref:
      selected_implementation_ref:
      pinned_versions:
        SelfModel_revision:
        ProductionModel_revision:
        World_revision:
        CreatorModel_revision:
        QC_contract_version:
        adapter_version:
        implementation_version:
      inputs:
        type: list[JobInput]
      output_contract:
        type: JobOutputContract
      runtime_constraints:
        type: JobRuntimeConstraints
      retry_policy_ref:
      fallback_plan_ref:
        nullable: true
      idempotency_key:
      cache_key:
        nullable: true
      priority:
      state:
        type: JobState
      attempt_count:
      active_attempt_ref:
        nullable: true
      created_at:
      updated_at:
  semantic_immutability:
    after_READY: true
# =====================================================================
# 9. JOB INPUT
# =====================================================================
job_input:
  JobInput:
    fields:
      input_id:
      input_type:
      artifact_ref:
        nullable: true
      semantic_ref:
        nullable: true
      literal_value:
        nullable: true
      digest:
      required:
      immutable:
      source_revision_ref:
# =====================================================================
# 10. JOB OUTPUT CONTRACT
# =====================================================================
job_output_contract:
  JobOutputContract:
    fields:
      output_type:
      artifact_schema_ref:
      media_spec:
        nullable: true
      required_metadata:
      expected_count:
      acceptance_required:
      content_addressed:
      retention_class:
  examples:
    shot_take:
      output_type: video
      expected_count: 1
      acceptance_required: true
    intermediate_mask:
      output_type: mask
      acceptance_required: false
# =====================================================================
# 11. JOB ATTEMPT
# =====================================================================
job_attempt:
  JobAttempt:
    fields:
      attempt_id:
      job_id:
      attempt_number:
      implementation_ref:
      provider_ref:
      configuration:
      configuration_digest:
      generation_seed:
        nullable: true
      requested_at:
      started_at:
      completed_at:
      provider_request_ref:
        nullable: true
      result_status:
        enum:
          - SUCCESS
          - TRANSIENT_FAILURE
          - PERMANENT_FAILURE
          - CANCELLED
          - TIMEOUT
          - RATE_LIMITED
          - PROVIDER_DEGRADED
          - INVALID_OUTPUT
      output_artifact_refs:
      error_refs:
      actual_cost:
      actual_latency_ms:
      execution_receipt_ref:
      retryable:
      fallback_eligible:
  immutable_after_completion: true
# =====================================================================
# 12. EXECUTION RECEIPT
# =====================================================================
execution_receipt:
  ExecutionReceipt:
    fields:
      receipt_id:
      job_id:
      attempt_id:
      project_id:
      production_unit_ref:
      strategy_ref:
      implementation_ref:
      provider_ref:
      capability_refs:
      task_feature_vector_ref:
        nullable: true
      source_revision_refs:
      input_digests:
      output_digests:
      operational_status:
      provider_status:
      latency_ms:
      cost:
      compute_usage:
        nullable: true
      error_codes:
      provider_error_payload_digest:
        nullable: true
      artifact_refs:
      started_at:
      completed_at:
  consumers:
    - SelfModel
    - ProductionModel
    - AutonomousQC
    - observability
# =====================================================================
# 13. WORKER MODEL
# =====================================================================
worker_model:
  ProductionWorker:
    fields:
      worker_id:
      worker_type:
      supported_job_types:
      supported_adapters:
      region:
      capacity:
      lease_state:
      current_jobs:
      health:
      last_heartbeat:
  worker_types:
    - model_adapter_worker
    - deterministic_media_worker
    - compositor_worker
    - timeline_worker
    - audio_worker
    - storage_worker
    - QC_submission_worker
  stateless_preferred:
    value: true
  durable_truth:
    worker_memory_is_not_authoritative: true
# =====================================================================
# 14. LEASE MODEL
# =====================================================================
lease_model:
  JobLease:
    fields:
      lease_id:
      job_id:
      worker_id:
      acquired_at:
      expires_at:
      heartbeat_interval:
      attempt_ref:
  on_expiry:
    - mark attempt abandoned_or_unknown
    - inspect provider-side execution status
    - safely requeue if idempotency permits
  principle: >
    Worker death must not strand jobs indefinitely.
# =====================================================================
# 15. SCHEDULER
# =====================================================================
scheduler:
  responsibilities:
    - find READY jobs
    - enforce dependency satisfaction
    - respect priority
    - respect provider capacity
    - respect worker capacity
    - respect rate limits
    - respect budgets
    - prefer critical path where appropriate
    - avoid starvation
    - acquire job lease
    - dispatch
  SchedulingPriority:
    factors:
      - explicit job priority
      - critical path status
      - downstream fanout
      - artifact criticality
      - deadline
      - provider availability
      - cost window
      - fairness
      - repair urgency
  no_semantic_strategy_changes:
    value: true
# =====================================================================
# 16. EXECUTION ORCHESTRATOR BOUNDARY
# =====================================================================
execution_orchestrator_boundary:
  PolycognitiveRuntime_ExecutionOrchestrator:
    role:
      - high-level cognitive/execution coordination
      - cross-subsystem dispatch
      - route cognitive invocations
      - authorize production workflows
  ProductionEngineScheduler:
    role:
      - production-job runtime scheduling
      - worker/provider dispatch
      - production DAG mechanics
  distinction: >
    ExecutionOrchestrator coordinates system execution domains. ProductionEngine
    Scheduler manages concrete production jobs.
# =====================================================================
# 17. PROVIDER ADAPTER CONTRACT
# =====================================================================
provider_adapter:
  ProviderAdapter:
    interface:
      - validate_configuration()
      - inspect_capabilities()
      - estimate_request()
      - submit()
      - poll()
      - cancel()
      - fetch_outputs()
      - normalize_error()
      - inspect_usage()
  requirements:
    - versioned adapter
    - stable normalized error taxonomy
    - idempotency support where provider allows
    - exact request digest
    - no credentials in semantic logs
    - retry-safety declaration
  ProviderInvocation:
    fields:
      adapter_id:
      adapter_version:
      provider_id:
      implementation_id:
      request_digest:
      provider_request_id:
        nullable: true
      invocation_mode:
        enum:
          - synchronous
          - asynchronous
          - streaming
      submitted_at:
# =====================================================================
# 18. DETERMINISTIC TOOL ADAPTER
# =====================================================================
deterministic_tool_adapter:
  interface:
    - validate_inputs()
    - execute()
    - verify_outputs()
    - emit_receipt()
  examples:
    - ffmpeg_like_transcode
    - timeline_assembly
    - audio_mix
    - color_transform
    - subtitle_render
    - image_composite
    - mask
    - frame_extract
    - upscale
    - deterministic_text_render
  reproducibility:
    required_when_tool_supports: true
# =====================================================================
# 19. PROVIDER ERROR TAXONOMY
# =====================================================================
provider_error_taxonomy:
  classes:
    - AUTHENTICATION
    - AUTHORIZATION
    - QUOTA_EXHAUSTED
    - RATE_LIMITED
    - TIMEOUT
    - NETWORK
    - PROVIDER_5XX
    - INVALID_REQUEST
    - UNSUPPORTED_CONFIGURATION
    - CONTENT_REJECTED
    - CAPABILITY_CHANGED
    - OUTPUT_MISSING
    - OUTPUT_CORRUPT
    - PROVIDER_CANCELLED
    - UNKNOWN
  retryability:
    AUTHENTICATION: false
    AUTHORIZATION: false
    QUOTA_EXHAUSTED: policy_dependent
    RATE_LIMITED: true
    TIMEOUT: true
    NETWORK: true
    PROVIDER_5XX: true
    INVALID_REQUEST: false
    UNSUPPORTED_CONFIGURATION: false
    CONTENT_REJECTED: false
    CAPABILITY_CHANGED: false
    OUTPUT_MISSING: maybe
    OUTPUT_CORRUPT: maybe
    PROVIDER_CANCELLED: policy_dependent
    UNKNOWN: conservative
# =====================================================================
# 20. RETRY POLICY
# =====================================================================
retry_policy:
  RetryPolicy:
    fields:
      retry_policy_id:
      maximum_attempts:
      retryable_error_classes:
      retryable_exit_codes:
      backoff:
        type:
          enum:
            - fixed
            - exponential
            - exponential_with_jitter
      minimum_delay:
      maximum_delay:
      retry_same_implementation:
      retry_same_seed:
      retry_requires_fresh_health_check:
      fallback_after_attempt:
        nullable: true
      terminal_conditions:
  principle: >
    Retry policy handles operational failure, not repeated semantic QC failure.
# =====================================================================
# 21. SEMANTIC FAILURE VS OPERATIONAL FAILURE
# =====================================================================
failure_classification:
  operational_failure:
    examples:
      - provider_timeout
      - HTTP_500
      - worker_crash
      - malformed_download
      - temporary_rate_limit
    owner:
      ProductionEngine
    may_retry_automatically: true
  semantic_artifact_failure:
    examples:
      - wrong_hand
      - identity_drift
      - poor_performance
      - wrong_lighting
      - bad_edit
    owner_of_acceptance:
      AutonomousQC
    repair_strategy:
      requires:
        - RepairRecommendation
        - ProductionModel_or_runtime authorization
  hard_rule: >
    ProductionEngine cannot blindly retry semantic failure forever.
# =====================================================================
# 22. FALLBACK ACTIVATION
# =====================================================================
fallback_activation:
  FallbackActivation:
    fields:
      activation_id:
      source_job_ref:
      fallback_plan_ref:
      fallback_tier:
      trigger:
      authorized_strategy_ref:
      activated_at:
      reason:
      new_job_refs:
  allowed_triggers:
    - provider_unavailable
    - attempts_exhausted
    - capability_degraded
    - QC_repair_authorized
    - deadline_risk
    - cost_limit_condition
  constraint:
    fallback_strategy_must_be_preapproved: true
  if_no_approved_fallback:
    - BLOCKED
    - emit production signal
    - request ProductionModel recompile
# =====================================================================
# 23. TAKE GENERATION EXECUTION
# =====================================================================
take_generation_execution:
  input:
    - TakeGenerationPolicy
    - ProductionStrategy
  behavior:
    - instantiate initial take jobs
    - allow safe concurrent generation
    - register candidate artifacts
    - submit portfolio to QC
    - receive take selection result
    - stop unnecessary future take jobs when policy permits
    - request additional takes if QC/ProductionModel authorizes
  TakeExecutionGroup:
    fields:
      group_id:
      production_unit_ref:
      take_policy_ref:
      active_take_jobs:
      completed_take_refs:
      selected_take_ref:
        nullable: true
      stopped_early:
      stop_reason:
  rule: >
    Engine materializes takes; QC selects accepted take.
# =====================================================================
# 24. ARTIFACT MODEL
# =====================================================================
artifact_model:
  ProductionArtifact:
    fields:
      artifact_id:
      project_id:
      artifact_type:
        enum:
          - image
          - video
          - audio
          - music
          - voice
          - mask
          - depth
          - pose
          - geometry
          - subtitle
          - timeline
          - metadata
          - composite
          - master
          - package
      semantic_scope_ref:
      production_unit_ref:
      strategy_ref:
      storage_ref:
      content_digest:
      media_metadata:
        nullable: true
      source_artifact_refs:
      source_revision_refs:
      execution_receipt_ref:
      state:
        enum:
          - temporary
          - candidate
          - QC_pending
          - accepted
          - rejected
          - superseded
          - invalidated
      certificate_ref:
        nullable: true
      created_at:
  immutable_content:
    value: true
# =====================================================================
# 25. ARTIFACT STORE
# =====================================================================
artifact_store:
  requirements:
    - immutable blobs
    - content digest
    - metadata index
    - source lineage
    - lifecycle state
    - large media support
    - multipart upload
    - resumable upload
    - signed access
    - retention classes
  content_addressing:
    preferred: true
  accepted_artifact:
    deletion:
      forbidden_without_governance: true
# =====================================================================
# 26. ARTIFACT LINEAGE GRAPH
# =====================================================================
artifact_lineage:
  nodes:
    - ProductionArtifact
    - ProductionJob
    - JobAttempt
    - ProductionStrategy
    - World revision
    - CreatorModel revision
    - Asset
    - QualityCertificate
  edges:
    - GENERATED_BY
    - DERIVED_FROM
    - CONDITIONED_ON
    - COMPOSITED_FROM
    - REPLACES
    - CERTIFIED_BY
    - INVALIDATED_BY
    - USES_STRATEGY
    - USES_WORLD_REVISION
  use:
    - blast radius
    - audit
    - debugging
    - repair
    - provenance
# =====================================================================
# 27. CACHE MODEL
# =====================================================================
cache_model:
  CachePolicy:
    fields:
      cache_policy_id:
      enabled:
      cache_scope:
      key_components:
      validity_dependencies:
      retention:
      reuse_requires_certificate:
      deterministic_only:
        type: bool
  cache_key_inputs:
    - semantic inputs
    - source revisions
    - implementation version
    - adapter version
    - configuration
    - generation seed if deterministic_replay desired
    - strategy version
  cache_hit:
    must_revalidate_staleness: true
  accepted_artifacts:
    reusable_when_semantics_match: true
# =====================================================================
# 28. IDEMPOTENCY
# =====================================================================
idempotency:
  JobIdempotency:
    fields:
      idempotency_key:
      semantic_job_digest:
      provider_request_key:
        nullable: true
  guarantees:
    deterministic_job:
      expected_exact_output: true_if_same_environment_and_tool_support
    generative_job:
      guarantee:
        - no_duplicate_logical_job
        - no_duplicate_manifest_commit
      exact_output:
        not_required_unless_seed_and_provider_deterministic
  acceptance_commit:
    exactly_once_logical_semantics: required
# =====================================================================
# 29. CHECKPOINTING
# =====================================================================
checkpointing:
  ProductionCheckpoint:
    fields:
      checkpoint_id:
      manifest_id:
      execution_revision:
      completed_job_refs:
      accepted_artifact_refs:
      pending_job_refs:
      failed_job_refs:
      active_leases:
      runtime_budget_state:
      source_revision_refs:
      created_at:
      digest:
  cadence:
    - event_driven_on_important_transition
    - periodic_for_long_runs
  purpose:
    - restart
    - migration
    - audit
# =====================================================================
# 30. RESUMABILITY
# =====================================================================
resumability:
  restart_algorithm:
    - load latest durable ProductionManifest
    - load latest checkpoint
    - expire stale leases
    - reconcile provider-side asynchronous jobs
    - verify accepted artifact existence/digests
    - recompute DAG readiness
    - reject stale nodes
    - requeue retryable incomplete work
    - preserve accepted branches
    - resume
  invariant: >
    Restart cannot regenerate already accepted artifacts unless explicitly
    invalidated.
# =====================================================================
# 31. PROVIDER-SIDE ASYNC RECONCILIATION
# =====================================================================
async_provider_reconciliation:
  problem: >
    Engine may crash after submitting a long-running provider job but before
    recording completion.
  reconciliation:
    - retain provider_request_id
    - poll provider after restart
    - fetch existing output if completed
    - avoid duplicate submission
    - re-submit only when provider execution is known absent or idempotent
  state:
    provider_execution_uncertain:
      behavior:
        - do_not_duplicate_expensive_request_immediately
# =====================================================================
# 32. DEPENDENCY SATISFACTION
# =====================================================================
dependency_satisfaction:
  HARD:
    satisfied_when:
      - upstream job ACCEPTED_or_required_nonQC_success
  DATA:
    satisfied_when:
      - required artifact exists and valid
  SEMANTIC:
    satisfied_when:
      - source revision still matches
  QC_CERTIFICATE:
    satisfied_when:
      - valid certificate exists
  LOCK:
    satisfied_when:
      - lock exists and remains valid
  OPTIONAL:
    satisfied_when:
      - upstream complete_or_policy_allows_absence
# =====================================================================
# 33. INVALIDATION ENGINE
# =====================================================================
invalidation_engine:
  triggers:
    - source semantic revision changed
    - ProductionStrategy superseded
    - upstream artifact invalidated
    - QualityCertificate invalidated
    - repair scope declared
    - ProductionModel strategy invalidated
  algorithm:
    - identify target dependency keys
    - traverse invalidation-propagating edges
    - mark affected nonaccepted jobs INVALIDATED
    - preserve unrelated branches
    - mark affected accepted artifacts invalid only if certificate dependency rules require
    - cancel unnecessary queued/running work where safe
    - materialize replacement jobs from updated ProductionModel
  hard_rule: >
    Invalidation propagation must follow explicit dependencies, not broad project scope.
# =====================================================================
# 34. MINIMUM BLAST RADIUS
# =====================================================================
minimum_blast_radius:
  execution_rule: >
    Artifact/job replacement occurs at the lowest production unit permitted by
    strategy and semantic dependencies.
  example:
    defect:
      shot_217.receiver_hand
    possible_scope:
      - receiver_layer_only
      - frame_range
      - shot_217
    preserve:
      - accepted_shot_216
      - accepted_shot_218
      - approved_dialogue_track_if_unchanged
      - unrelated_music
  episode_wide_rebuild:
    allowed_only_when:
      - global semantic source changed
      - globally shared asset invalidated materially
      - global mastering requirement changed
# =====================================================================
# 35. ASSET MATERIALIZATION
# =====================================================================
asset_materialization:
  asset_classes:
    - character
    - environment
    - prop
    - costume
    - effect
    - texture
    - voice_identity
    - music_motif
    - reusable_motion
    - rig
    - reference_image_set
  ReusableAssetInstance:
    fields:
      asset_instance_id:
      persistent_entity_ref:
      asset_family_ref:
      variant:
      source_strategy_ref:
      artifact_refs:
      identity_anchor_refs:
      certificate_refs:
      compatible_implementation_refs:
      created_at:
  reuse:
    requires:
      - semantic compatibility
      - valid certificate
      - no invalidated source
# =====================================================================
# 36. CHARACTER ASSET EXECUTION
# =====================================================================
character_asset_execution:
  stages_may_include:
    - canonical_design_generation
    - turnaround_generation
    - expression_sheet
    - pose_sheet
    - costume_variants
    - damage_variants
    - voice_identity_generation
    - identity_reference_pack
    - model_specific_embedding_or_adapter
    - QC
    - asset_lock
  persistence:
    may_span_projects: true
  objective: >
    Character reuse should improve consistency and reduce repeated creation cost.
# =====================================================================
# 37. ENVIRONMENT ASSET EXECUTION
# =====================================================================
environment_asset_execution:
  possible_stages:
    - concept environment generation
    - panoramic views
    - reusable plates
    - geometry/scene extraction
    - lighting variants
    - weather/state variants
    - texture generation
    - acoustic metadata
    - QC
    - asset registration
  reusable_across_shots:
    true
# =====================================================================
# 38. SHOT EXECUTION PIPELINE
# =====================================================================
shot_execution:
  canonical_flow: |
    approved ShotProductionRequirements
          ↓
    approved ProductionStrategy
          ↓
    resolve reusable assets
          ↓
    materialize conditioning/control inputs
          ↓
    generate take(s)
          ↓
    postprocess deterministic stages
          ↓
    register candidate artifacts
          ↓
    Autonomous QC
          ↓
      ┌───┴───────────────┐
      │                   │
     PASS                FAIL
      │                   │
    freeze            repair path
      │                   │
    shot cert          regenerated candidate
      │                   │
      └──────────────→ QC
  final_state:
    accepted_shot_artifact
# =====================================================================
# 39. IMAGE GENERATION EXECUTION
# =====================================================================
image_execution:
  use_cases:
    - character concept
    - character reference
    - environment
    - storyboard
    - keyframe
    - matte
    - texture
    - prop
    - style reference
  job_inputs:
    - semantic prompt package
    - reference images
    - control images
    - masks
    - style constraints
    - dimensions
  output:
    - candidate image artifacts
  QC:
    required_by_strategy: true
# =====================================================================
# 40. VIDEO GENERATION EXECUTION
# =====================================================================
video_execution:
  use_cases:
    - text_to_video
    - image_to_video
    - video_to_video
    - reference_conditioned_animation
    - performance
    - environment_motion
    - effects
  normalized_configuration:
    fields:
      duration:
      frame_rate:
      resolution:
      aspect_ratio:
      camera_control:
      motion_control:
      first_frame_ref:
      last_frame_ref:
      identity_refs:
      pose_refs:
      seed:
        nullable: true
  provider_specific_fields:
    stored_under_adapter_namespace: true
  output:
    candidate_video
# =====================================================================
# 41. COMPOSITING EXECUTION
# =====================================================================
compositing_execution:
  inputs:
    - layer_artifacts
    - masks
    - transforms
    - depth/order
    - color transforms
    - motion tracks
  properties:
    deterministic_when_possible: true
    exact_lineage_required: true
  uses:
    - character layering
    - prop correction
    - text insertion
    - effects
    - matte
    - environment replacement
  output:
    composite_candidate
# =====================================================================
# 42. VOICE EXECUTION
# =====================================================================
voice_execution:
  stages:
    - resolve character voice identity
    - resolve dialogue line intent
    - invoke TTS/performance model
    - generate candidate takes
    - evaluate pronunciation
    - evaluate timing
    - evaluate emotional performance
    - select accepted line
    - lock audio artifact
  line_level_isolation:
    preferred: true
  benefit: >
    One bad dialogue line need not require entire scene audio regeneration.
# =====================================================================
# 43. LIP-SYNC EXECUTION
# =====================================================================
lip_sync_execution:
  inputs:
    - accepted_dialogue_audio
    - face/performance source
    - timing
  possible_methods:
    - direct_generation_conditioning
    - dedicated_lipsync_model
    - facial_animation_tool
    - composite_fix
  QC:
    required:
      - lip_sync
      - identity
      - performance
# =====================================================================
# 44. FOLEY / SOUND EFFECT EXECUTION
# =====================================================================
sound_effect_execution:
  input_sources:
    - World acoustic package
    - World material facts
    - character action
    - prop interactions
    - environment
    - shot timing
  execution_categories:
    - Foley
    - designed_effect
    - ambience
    - mechanical_sound
    - creature_sound
    - UI_sound
  output:
    - isolated stem artifacts
  advantage:
    stems_enable_repair: true
# =====================================================================
# 45. AMBIENCE EXECUTION
# =====================================================================
ambience_execution:
  derived_from:
    - location
    - environmental state
    - time
    - weather
    - population/activity
    - machinery
    - World physical properties
  may_be:
    - generated
    - assembled_from_library
    - hybrid
  output:
    loopable_or_timeline_specific_stem
# =====================================================================
# 46. MUSIC EXECUTION
# =====================================================================
music_execution:
  inputs:
    - MusicProductionStrategy
    - cue structure
    - emotional function
    - motif refs
    - hit points
    - duration
  output_variants:
    - full_mix
    - stems
    - alt_mix
    - loop
    - transition
  QC:
    - musical coherence
    - emotional alignment
    - timing/hit points
    - mix compatibility
# =====================================================================
# 47. AUDIO MIX EXECUTION
# =====================================================================
audio_mix_execution:
  inputs:
    - dialogue
    - Foley
    - ambience
    - effects
    - music
    - spatial metadata
  deterministic:
    automation_graph_preferred: true
  stages:
    - gain staging
    - EQ
    - compression
    - spatialization
    - ducking
    - bus processing
    - loudness normalization
    - render stems/final
  outputs:
    - scene_mix
    - episode_mix
    - stems
# =====================================================================
# 48. EDITORIAL TIMELINE ENGINE
# =====================================================================
editorial_timeline:
  Timeline:
    fields:
      timeline_id:
      project_id:
      version:
      frame_rate:
      resolution:
      tracks:
      edit_decisions:
      source_artifact_refs:
      source_certificate_refs:
      transitions:
      subtitles:
      audio_layout:
      digest:
  TimelineTrack:
    fields:
      track_id:
      track_type:
        enum:
          - video
          - dialogue
          - Foley
          - ambience
          - effects
          - music
          - subtitle
          - metadata
      clips:
  TimelineClip:
    fields:
      clip_id:
      artifact_ref:
      source_in:
      source_out:
      timeline_in:
      timeline_out:
      transform:
      gain:
        nullable: true
  assembly:
    deterministic: true
# =====================================================================
# 49. EDIT DECISION LIST
# =====================================================================
edit_decision_list:
  EditDecision:
    fields:
      decision_id:
      shot_ref:
      selected_artifact_ref:
      source_in:
      source_out:
      timeline_in:
      transition:
      audio_links:
      approved_by_ref:
  source:
    approved_edit_semantics
  engine_role:
    materialize_exactly: true
# =====================================================================
# 50. SCENE ASSEMBLY
# =====================================================================
scene_assembly:
  prerequisites:
    - accepted shot artifacts
    - accepted dialogue
    - audio stems as required
    - valid edit decisions
  flow:
    - construct deterministic scene timeline
    - render scene preview
    - submit scene to hierarchical QC
    - freeze accepted scene render if useful
    - retain shot-level source lineage
  rule: >
    Scene render is derivative; accepted shot sources remain separately addressable.
# =====================================================================
# 51. EPISODE ASSEMBLY
# =====================================================================
episode_assembly:
  prerequisites:
    - eligible accepted scene/shot sources
    - locked edit structure
    - accepted/reviewable sound/music
    - subtitle package
  flow:
    - compile episode timeline
    - conform
    - render candidate episode
    - submit episode QC
    - repair targeted dependencies if failed
    - reassemble deterministically
  no_wholesale_regeneration:
    default: true
# =====================================================================
# 52. FINISHING EXECUTION
# =====================================================================
finishing_execution:
  stages_may_include:
    - color transform
    - color grade application
    - grain/texture
    - denoise
    - sharpening
    - stabilization
    - upscale
    - frame interpolation
    - title/credit render
    - subtitle render
  intentional_artifact_guard:
    required: true
  example:
    >
    A retro project's film grain and limited cadence must not be removed by an
    automatic "enhance quality" stage.
# =====================================================================
# 53. MASTERING
# =====================================================================
mastering:
  inputs:
    - accepted final picture candidate
    - accepted final audio
    - subtitle/caption assets
    - delivery profile
  stages:
    - mux
    - encode
    - loudness verification
    - sync verification
    - metadata
    - checksum
    - package
  output:
    MasterArtifactCandidate
  final_acceptance:
    owner: AutonomousQC
  final_lock:
    only_after:
      - master QualityCertificate
# =====================================================================
# 54. DELIVERY PROFILE
# =====================================================================
delivery_profile:
  DeliveryProfile:
    fields:
      profile_id:
      container:
      video_codec:
      audio_codec:
      resolution:
      frame_rate:
      color_space:
      HDR:
        nullable: true
      audio_layout:
      loudness_target:
      subtitle_formats:
      metadata_requirements:
  provider_or_platform_specific:
    versioned: true
  distinction: >
    Delivery profile is technical execution specification, not ProductMarketModel.
# =====================================================================
# 55. QC SUBMISSION
# =====================================================================
QC_submission:
  QCSubmission:
    fields:
      submission_id:
      artifact_ref:
      QC_contract_ref:
      expected_state_refs:
      source_model_refs:
      execution_receipt_refs:
      strategy_ref:
      submitted_at:
  engine_behavior:
    - mark artifact QC_pending
    - await QC result asynchronously
    - do not promote dependent gated jobs until PASS
# =====================================================================
# 56. QC RESPONSE HANDLING
# =====================================================================
QC_response:
  PASS:
    - attach certificate
    - mark artifact accepted
    - freeze artifact
    - release dependent QC_CERTIFICATE edges
    - update manifest
    - emit artifact accepted event
  FAIL:
    - mark artifact rejected
    - store violation/root cause refs
    - block dependent promotion
    - await approved repair/fallback action
  UNCERTAIN:
    - hold artifact
    - execute QC-requested evidence workflow if engine-executable
    - otherwise await runtime/ProductionModel direction
# =====================================================================
# 57. REPAIR EXECUTION
# =====================================================================
repair_execution:
  prerequisites:
    - RepairRecommendation
    - authorized RepairAction
    - relevant ProductionModel strategy/fallback if semantic strategy changes
  repair_actions_engine_can_execute:
    same_strategy_retry:
      yes: true
    new_seed:
      yes: true
    increase_take_count:
      if_authorized: true
    implementation_change:
      only_if_preapproved_fallback_or_new_strategy: true
    conditioning_change:
      only_if_authorized: true
    deterministic_fix:
      yes_if_strategy_authorized: true
    layer_patch:
      yes_if_strategy_authorized: true
    shot_spec_recompile:
      engine_role:
        execute_after_new_spec: true
        author_new_spec: false
    story_recompile:
      engine_role:
        execute_after_new_semantics: true
        author_semantics: false
# =====================================================================
# 58. REPAIR CYCLE
# =====================================================================
repair_cycle:
  RepairCycle:
    fields:
      repair_cycle_id:
      failed_artifact_ref:
      QC_run_ref:
      repair_recommendation_ref:
      repair_strategy_ref:
      invalidated_refs:
      preserved_refs:
      repair_job_refs:
      repaired_artifact_refs:
      re_QC_refs:
      outcome:
      started_at:
      completed_at:
  maximum_cycles:
    policy_defined: true
  repeated_failure:
    action:
      - stop blind retry
      - escalate to ProductionModel/PolycognitiveRuntime
# =====================================================================
# 59. BUDGET STATE
# =====================================================================
runtime_budget:
  RuntimeBudgetState:
    fields:
      authorized_hard_limit:
        nullable: true
      target_budget:
        nullable: true
      spent:
      committed:
      projected_remaining:
      experimentation_spent:
      repair_spent:
      QC_spent:
      currency_or_compute_unit:
      updated_at:
  hard_limit:
    behavior:
      - scheduler_blocks_new_nonexempt_jobs
      - emit budget signal
  emergency_overrun:
    requires_authority: true
# =====================================================================
# 60. COST ACCOUNTING
# =====================================================================
cost_accounting:
  per_attempt:
    required: true
  dimensions:
    - provider charges
    - compute
    - storage
    - egress
    - deterministic tool compute
    - QC compute
  aggregation:
    - shot
    - scene
    - episode
    - asset
    - repair
    - provider
    - capability
    - production strategy
  use:
    - ProductionModel learning
    - budget enforcement
    - cost-per-finished-minute metrics
# =====================================================================
# 61. PROVIDER QUOTA MODEL
# =====================================================================
quota_model:
  ProviderQuotaState:
    fields:
      provider_id:
      implementation_id:
        nullable: true
      request_rate_remaining:
      token_or_compute_quota:
        nullable: true
      concurrency_remaining:
      daily_budget_remaining:
        nullable: true
      reset_at:
        nullable: true
      confidence:
      observed_at:
  scheduler:
    consumes: true
# =====================================================================
# 62. DEADLINE / CRITICAL PATH
# =====================================================================
critical_path:
  CriticalPathState:
    fields:
      path_node_refs:
      expected_completion:
      slack:
      blocked_nodes:
      highest_risk_node:
  scheduler_uses:
    - prioritize critical path
    - exploit parallel noncritical branches
    - prewarm long-lead provider jobs where authorized
  no_semantic_compromise:
    value: true
# =====================================================================
# 63. CONCURRENCY
# =====================================================================
concurrency_model:
  concurrency_levels:
    - across_projects
    - across_episodes
    - across_sequences
    - across_scenes
    - across_shots
    - across_layers
    - across_take_candidates
    - across_audio_stems
  requirements:
    - dependency correctness
    - provider quota compliance
    - budget compliance
    - safe artifact isolation
  example: |
    Shot 217 video generation
        ||
    Shot 218 environment render
        ||
    Shot 141 Foley
        ||
    Scene 04 music cue
        ||
    Character asset benchmark
  objective:
    maximize_safe_parallelism: true
# =====================================================================
# 64. CANCELLATION
# =====================================================================
cancellation:
  reasons:
    - source invalidated
    - strategy invalidated
    - better accepted take exists
    - budget protection
    - provider degradation
    - project pause
    - dependency impossible
  cancellation_semantics:
    queued_job:
      cancel_immediately: true
    running_local_job:
      cooperative_cancel: preferred
    running_provider_job:
      call_provider_cancel_if_supported: true
    noncancelable_job:
      ignore_result_if_stale: true
  stale_output:
    never_promote: true
# =====================================================================
# 65. PRIORITY PREEMPTION
# =====================================================================
priority_preemption:
  allowed:
    queued_jobs: true
  running_jobs:
    default: false
  exception:
    - expensive_long_job_can_be_cancelled_safely
    - urgent_repair_on_critical_path
  no_priority_starvation:
    requirement: true
# =====================================================================
# 66. SHADOW / EXPERIMENTAL EXECUTION
# =====================================================================
shadow_execution:
  purpose: >
    Allow SelfModel/ProductionModel to gather evidence on new capabilities
    without risking primary production.
  ShadowJob:
    fields:
      shadow_job_id:
      source_production_unit_ref:
      experimental_strategy_ref:
      primary_strategy_ref:
      budget_limit:
      artifact_refs:
      QC_refs:
      never_auto_promote:
        default: true
  outputs:
    learning_only_by_default: true
  can_replace_primary:
    only_after_authority_and_QC: true
# =====================================================================
# 67. WORKSPACE / TEMPORARY STORAGE
# =====================================================================
temporary_storage:
  classes:
    - transient_input
    - provider_payload
    - intermediate_artifact
    - failed_candidate
    - QC_sample
    - debug_bundle
  retention:
    policy_driven: true
  accepted_artifact:
    never_only_temporary: true
# =====================================================================
# 68. ARTIFACT RETENTION
# =====================================================================
artifact_retention:
  accepted:
    retention: durable
  rejected:
    retention:
      - enough_for_failure_analysis
      - policy_based_cleanup
  intermediate:
    retention:
      dependent_on_reproducibility_and_cost
  valuable_failed_example:
    may_be_retained_for:
      - SelfModel
      - QC calibration
      - ProductionModel experience
# =====================================================================
# 69. OBSERVABILITY EVENTS
# =====================================================================
engine_events:
  event_types:
    - PRODUCTION.MANIFEST_CREATED
    - PRODUCTION.MANIFEST_STATE_CHANGED
    - PRODUCTION.JOB_READY
    - PRODUCTION.JOB_STARTED
    - PRODUCTION.JOB_COMPLETED
    - PRODUCTION.JOB_FAILED
    - PRODUCTION.JOB_RETRY_SCHEDULED
    - PRODUCTION.FALLBACK_ACTIVATED
    - PRODUCTION.ARTIFACT_CREATED
    - PRODUCTION.ARTIFACT_SUBMITTED_TO_QC
    - PRODUCTION.ARTIFACT_ACCEPTED
    - PRODUCTION.ARTIFACT_REJECTED
    - PRODUCTION.ARTIFACT_INVALIDATED
    - PRODUCTION.REPAIR_STARTED
    - PRODUCTION.REPAIR_COMPLETED
    - PRODUCTION.BUDGET_LIMIT_APPROACHING
    - PRODUCTION.BUDGET_BLOCKED
    - PRODUCTION.PROVIDER_RATE_LIMITED
    - PRODUCTION.PROVIDER_UNAVAILABLE
    - PRODUCTION.EXECUTION_RESUMED
    - PRODUCTION.MASTER_CANDIDATE_READY
  event_transport:
    provider_independent: true
# =====================================================================
# 70. SELF MODEL FEEDBACK
# =====================================================================
self_model_feedback:
  sends:
    - ExecutionReceipt
    - provider health
    - failure codes
    - task features
    - output artifact refs
    - QC-linked capability observations
  examples:
    operational:
      >
      Provider B timed out on 7 of 20 requests.
    semantic:
      >
      Renderer C succeeded operationally but QC found identity drift in
      4 of 10 two-character closeups.
  distinction:
    semantic_quality_comes_from_QC: true
# =====================================================================
# 71. PRODUCTION MODEL FEEDBACK
# =====================================================================
production_model_feedback:
  sends:
    - strategy execution results
    - actual attempts
    - final acceptance
    - repair count
    - fallback activation
    - actual cost
    - actual latency
    - first-pass success
  use:
    - ProductionStrategyExperience
    - strategy learning
# =====================================================================
# 72. QC FEEDBACK
# =====================================================================
QC_feedback:
  sends_to_QC:
    - exact artifact
    - exact lineage
    - exact implementation
    - exact strategy
    - source revisions
  receives:
    - QualityCertificate
    - violation
    - root cause
    - RepairRecommendation
  no_local_override:
    value: true
# =====================================================================
# 73. WORLD MODEL INTEGRATION
# =====================================================================
world_model_integration:
  reads:
    - WorldCoordinate refs embedded in strategy
    - expected visible state
    - entity/asset refs
  cannot:
    - query and reinterpret World arbitrarily outside strategy context
    - mutate World truth
  observed_render:
    never_committed_as_World_state_automatically: true
# =====================================================================
# 74. POLYCOGNITIVE RUNTIME INTEGRATION
# =====================================================================
polycognitive_integration:
  ProductionEngine_to_runtime:
    signals:
      - repeated execution failure
      - blocked strategy
      - fallback exhausted
      - catastrophic provider degradation
      - unexpected cost
      - repair escalation required
  runtime_to_ProductionEngine:
    commands:
      - start production plan
      - pause
      - resume
      - authorize repair strategy
      - cancel invalidated scope
      - execute revised ProductionModel
  boundary: >
    Runtime chooses what high-level action should happen; engine executes the
    production mechanics.
# =====================================================================
# 75. PRODUCTION RUN
# =====================================================================
production_run:
  ProductionRun:
    fields:
      run_id:
      manifest_ref:
      project_id:
      started_at:
      completed_at:
        nullable: true
      state:
      triggering_authority_ref:
      checkpoint_refs:
      aggregate_cost:
      aggregate_latency:
      artifact_count:
      accepted_artifact_count:
      failure_count:
      repair_count:
  one_manifest_may_have:
    multiple_runs_due_to_resume: true
# =====================================================================
# 76. EPISODE EXECUTION FLOW
# =====================================================================
episode_execution_flow:
  flow: |
    animatic.lock
         ↓
    ProductionModel
         ↓
    ProductionManifest
         ↓
    ExecutionDAG
         ↓
    reusable asset resolution
         ↓
    parallel asset / audio / shot production
         ↓
    take candidate materialization
         ↓
    shot QC / selection
         ↓
    accepted shots
         ↓
    scene assembly
         ↓
    scene QC
         ↓
    episode timeline assembly
         ↓
    episode QC
         ↓
    targeted repairs
         ↓
    finishing
         ↓
    master candidate
         ↓
    master QC
         ↓
    master.lock
# =====================================================================
# 77. MVP EXECUTION FLOW
# =====================================================================
MVP_execution:
  60_second_short:
    target:
      shots: 10_to_15
    required_engine_capabilities:
      - DAG
      - image/video generation
      - voice
      - basic sound/music
      - take generation
      - shot QC
      - deterministic timeline
      - resumability
      - shot repair
  later_scale:
    same_core_engine: true
# =====================================================================
# 78. SECURITY
# =====================================================================
security:
  provider_credentials:
    stored:
      - secret manager
    never_in:
      - ProductionManifest semantic fields
      - artifact metadata
      - prompts/logs
  worker_permissions:
    least_privilege: true
  artifact_access:
    signed_or_scoped_access: true
  untrusted_provider_outputs:
    validate_before_materialization: true
  executable_media:
    sandbox_processing: true
# =====================================================================
# 79. PRIVACY
# =====================================================================
privacy:
  project_content:
    classification:
      potentially_confidential: true
  provider_routing:
    must_respect:
      - project privacy policy
      - data residency policy if present
      - provider training/data usage constraints if configured
  logs:
    avoid:
      - unnecessary raw prompt payloads
      - creator personal information
      - credentials
# =====================================================================
# 80. RELIABILITY
# =====================================================================
reliability:
  principles:
    - durable manifest
    - append-only execution history
    - lease-based workers
    - resumable provider polling
    - immutable artifacts
    - idempotent commits
    - retries
    - fallback
    - checkpoints
  engine_crash:
    expected_effect:
      - no accepted artifact loss
      - no semantic state corruption
      - resumable incomplete work
  storage_failure:
    behavior:
      - no acceptance until artifact durable
      - retry replication/upload
  queue_failure:
    behavior:
      - reconstruct READY jobs from manifest/DAG
# =====================================================================
# 81. CONSISTENCY
# =====================================================================
consistency_model:
  ProductionManifest:
    mode:
      - strongly_consistent_state_transitions_or_equivalent_transactional_semantics
  JobAttempt:
    mode: append_only
  Artifact:
    mode: immutable
  QualityCertificate:
    mode: immutable
  provider health:
    mode: eventually_consistent_short_TTL
  worker heartbeats:
    mode: eventually_consistent_short_TTL
  cache:
    mode: eventually_consistent
# =====================================================================
# 82. TRANSACTION BOUNDARIES
# =====================================================================
transaction_boundaries:
  create_job:
    atomic_with:
      - manifest job registration
  accept_artifact:
    atomic_logical_commit:
      includes:
        - certificate validation
        - artifact state ACCEPTED
        - manifest transition
        - downstream dependency release
  invalidate_artifact:
    atomic_logical_commit:
      includes:
        - invalidation marker
        - dependent readiness recalculation
  no_cross-provider_distributed_transaction:
    value: true
  strategy:
    use:
      - saga-style orchestration
      - idempotency
      - compensation
# =====================================================================
# 83. BACKPRESSURE
# =====================================================================
backpressure:
  sources:
    - provider rate limit
    - worker capacity
    - storage saturation
    - QC backlog
    - budget pressure
    - downstream dependency bottleneck
  controls:
    - queue throttling
    - provider concurrency caps
    - priority scheduling
    - pause low-priority take generation
    - defer shadow work
    - avoid producing candidates faster than QC can inspect
  important: >
    QC throughput is part of production capacity planning.
# =====================================================================
# 84. RATE LIMIT HANDLING
# =====================================================================
rate_limit_handling:
  behavior:
    - parse normalized retry-after
    - update ProviderQuotaState
    - delay affected jobs
    - route other independent jobs
    - activate fallback only if ProductionModel policy permits
  no_immediate_retry_storm:
    value: true
# =====================================================================
# 85. PROVIDER HEALTH CIRCUIT BREAKER
# =====================================================================
circuit_breaker:
  ProviderCircuitBreaker:
    states:
      - CLOSED
      - OPEN
      - HALF_OPEN
    triggers:
      - error_rate
      - timeout_rate
      - quality_degradation_signal
      - explicit SelfModel degradation
  OPEN:
    behavior:
      - stop new eligible jobs
      - use fallback or wait
      - allow probes
  HALF_OPEN:
    behavior:
      - bounded trial jobs
# =====================================================================
# 86. OPERATIONAL PRECHECK
# =====================================================================
operational_precheck:
  before_job:
    - source revisions valid
    - strategy valid
    - required input artifacts exist
    - provider available
    - implementation not quarantined
    - quota available
    - budget available
    - capability limits still support job
    - QC contract available if required
  failure:
    state: BLOCKED_or_FALLBACK_PENDING
# =====================================================================
# 87. STALE JOB DETECTION
# =====================================================================
stale_job_detection:
  stale_if:
    - ProductionModel strategy invalidated
    - CreatorModel dependency changed
    - World expected-state dependency changed
    - source artifact invalidated
    - lock reopened
    - provider implementation version incompatible
  running_stale_job:
    behavior:
      - attempt cancellation
      - if cannot cancel, ignore output for promotion
# =====================================================================
# 88. QUALITY-AWARE EARLY STOPPING
# =====================================================================
quality_aware_stopping:
  use_cases:
    - take generation
    - iterative enhancement
    - expensive candidate portfolios
  condition:
    - accepted candidate exists
    - required confidence gap achieved
    - ProductionModel take policy permits
    - no higher-priority reason to continue
  benefit:
    reduce_wasted_compute: true
# =====================================================================
# 89. REUSE ACROSS EPISODES
# =====================================================================
cross_episode_reuse:
  reusable:
    - character reference packs
    - voice identity
    - environment assets
    - props
    - music motifs
    - acoustic signatures
    - deterministic templates
    - model-specific adapters/embeddings where permitted
  reuse_check:
    - identity compatibility
    - World state compatibility
    - creative project compatibility
    - certificate validity
    - implementation compatibility
  leverage:
    >
    Persistent characters/worlds become cheaper and more consistent over time.
# =====================================================================
# 90. SEASON SCALE
# =====================================================================
season_scale:
  architecture:
    - shared persistent asset cache
    - per-episode manifests
    - shared World state
    - shared character identity assets
    - concurrent episode production where locks permit
  isolation:
    episode_failure_should_not_stop_unrelated_episode: true
  cross_episode_dependency:
    explicit_only: true
# =====================================================================
# 91. FEATURE FILM SCALE
# =====================================================================
feature_scale:
  required_capabilities:
    - hierarchical manifests
    - sequence-level checkpoints
    - massive parallelism
    - shared asset catalogs
    - long-running budget control
    - hierarchical QC
    - deterministic conform
    - robust recovery
  architecture_change_required:
    value: false
# =====================================================================
# 92. ENGINE API
# =====================================================================
API_boundaries:
  manifest:
    - create_manifest
    - get_manifest
    - pause_manifest
    - resume_manifest
    - cancel_manifest
  DAG:
    - compile_execution_DAG
    - validate_DAG
    - inspect_ready_nodes
  jobs:
    - create_job
    - dispatch_job
    - cancel_job
    - retry_job
    - inspect_job
  attempts:
    - start_attempt
    - complete_attempt
    - fail_attempt
    - inspect_attempt
  artifacts:
    - register_artifact
    - get_artifact
    - freeze_artifact
    - invalidate_artifact
    - resolve_artifact_lineage
  takes:
    - create_take_group
    - stop_take_group
    - register_take_candidate
  QC:
    - submit_to_QC
    - apply_QC_result
    - attach_certificate
  fallback:
    - activate_fallback
  repair:
    - execute_repair_plan
  assembly:
    - assemble_scene
    - assemble_episode
    - conform_timeline
  audio:
    - generate_voice
    - generate_sound
    - generate_music
    - mix_audio
  finishing:
    - run_finishing
    - build_master_candidate
  recovery:
    - checkpoint
    - recover_manifest
    - reconcile_provider_jobs
# =====================================================================
# 93. STORAGE PORTS
# =====================================================================
storage_abstractions:
  ports:
    - ProductionManifestStorePort
    - JobStorePort
    - JobAttemptStorePort
    - ExecutionReceiptStorePort
    - ArtifactStorePort
    - ArtifactMetadataStorePort
    - ArtifactLineageGraphPort
    - QueuePort
    - LeaseStorePort
    - CheckpointStorePort
    - ProviderStateStorePort
    - CostLedgerPort
    - CachePort
  workflow_engine_provider:
    status: UNKNOWN
  artifact_blob_provider:
    status: UNKNOWN
# =====================================================================
# 94. PACKAGE LAYOUT
# =====================================================================
packages_or_modules_to_create:
  package_root: quantum/production_engine/
  modules:
    contracts:
      - common
      - identifiers
      - events
      - provenance
    manifest:
      - contracts
      - state
      - service
    dag:
      - contracts
      - compiler
      - validator
      - readiness
    jobs:
      - contracts
      - state_machine
      - attempts
      - idempotency
      - cancellation
    scheduler:
      - ready_queue
      - priorities
      - critical_path
      - quotas
      - backpressure
    workers:
      - worker
      - leases
      - heartbeat
    adapters:
      - provider
      - deterministic_tool
      - errors
      - capability_binding
    execution:
      - model_job
      - deterministic_job
      - async_provider
      - receipts
    artifacts:
      - contracts
      - store
      - lineage
      - lifecycle
      - cache
    takes:
      - groups
      - candidate_materialization
    media:
      image:
      video:
      composite:
      voice:
      lipsync:
      Foley:
      ambience:
      music:
      mix:
    editorial:
      - timeline
      - edit_decisions
      - scene_assembly
      - episode_assembly
      - conform
    finishing:
      - grade
      - texture
      - upscale
      - subtitles
      - mastering
    QC:
      - submission
      - response
      - certificate_gate
    fallback:
      - activation
    repair:
      - execution
      - cycles
      - invalidation
    runtime:
      - budgets
      - rate_limits
      - circuit_breaker
      - provider_health
    recovery:
      - checkpoints
      - resume
      - reconciliation
    observability:
      - metrics
      - traces
      - events
      - cost
    integrations:
      world_model:
      polycognitive_runtime:
      creative_intelligence:
      audience_product:
      self_model:
      production_model:
      autonomous_qc:
    ports:
      - stores
      - queue
      - artifacts
      - secrets
# =====================================================================
# 95. SCHEMAS TO CREATE
# =====================================================================
schemas_to_create:
  manifest:
    - ProductionManifest
    - ProductionUnitExecutionRef
    - RuntimeBudgetState
  DAG:
    - ExecutionDAG
    - ExecutionNode
    - ExecutionDependency
  jobs:
    - ProductionJob
    - JobInput
    - JobOutputContract
    - JobRuntimeConstraints
    - JobAttempt
    - JobLease
  provider:
    - ProviderInvocation
    - ProviderQuotaState
    - ProviderCircuitBreaker
  execution:
    - ExecutionReceipt
  workers:
    - ProductionWorker
  artifacts:
    - ProductionArtifact
    - CachePolicy
    - JobIdempotency
  checkpoints:
    - ProductionCheckpoint
  takes:
    - TakeExecutionGroup
  fallback:
    - FallbackActivation
  repair:
    - RepairCycle
  editorial:
    - Timeline
    - TimelineTrack
    - TimelineClip
    - EditDecision
  assets:
    - ReusableAssetInstance
  QC:
    - QCSubmission
  mastering:
    - DeliveryProfile
    - MasterArtifactCandidate
  runtime:
    - CriticalPathState
# =====================================================================
# 96. UNIT TESTS
# =====================================================================
tests:
  unit:
    DAG:
      - dependency_order
      - cycle_rejection
      - QC_certificate_dependency
      - semantic_dependency_staleness
    jobs:
      - state_transition_validity
      - retry_policy
      - nonretryable_error
      - lease_expiry
      - idempotency
    scheduler:
      - priority_order
      - provider_quota
      - critical_path
      - no_starvation
    artifacts:
      - immutable_content
      - digest_validation
      - certificate_attachment
      - stale_artifact_no_promotion
    fallback:
      - only_preapproved_strategy
      - no_fallback_available_blocks
    repair:
      - minimum_scope_invalidation
      - preserved_artifact_reuse
    recovery:
      - stale_lease_recovery
      - async_provider_reconciliation
      - no_duplicate_request_when_provider_job_exists
    budget:
      - hard_limit_blocks
      - actual_cost_updates
    QC:
      - artifact_not_accepted_without_required_certificate
      - FAIL_blocks_dependents
    cache:
      - version_sensitive_cache_key
      - invalidated_source_prevents_cache_hit
# =====================================================================
# 97. PROPERTY TESTS
# =====================================================================
property_tests:
  - accepted_artifact_never_modified_in_place
  - accepted_artifact_never_regenerated_without_invalidation
  - same_idempotency_key_never_creates_duplicate_logical_acceptance
  - ProductionEngine_never_mutates_CreatorModel
  - ProductionEngine_never_mutates_WorldModel
  - ProductionEngine_never_selects_unapproved_strategy
  - ProductionEngine_never_self_certifies
  - QC_required_job_never_releases_downstream_without_certificate
  - stale_running_job_output_never_promotes
  - unrelated_shot_failure_never_invalidates_unrelated_accepted_shot
  - restart_preserves_completed_accepted_work
  - transient_provider_failure_does_not_change_semantic_strategy_by_itself
  - hard_budget_never_exceeded_without_authority
  - provider_credentials_never_appear_in_artifact_metadata
  - DAG_has_no_cycles
# =====================================================================
# 98. NEGATIVE TESTS
# =====================================================================
negative_tests:
  - engine_changes_story_to_avoid_failed_renderer_rejected
  - engine_changes_hand_requirement_rejected
  - engine_uses_unapproved_provider_fallback_rejected
  - engine_marks_artifact_PASS_rejected
  - retry_semantic_failure_forever_rejected
  - accepted_artifact_overwritten_rejected
  - stale_QC_certificate_reused_after_artifact_change_rejected
  - provider_error_causes_episode_wide_invalidation_rejected
  - worker_memory_used_as_manifest_truth_rejected
  - duplicate_provider_submission_after_recovery_without_reconciliation_rejected
  - uncancelled_stale_output_promoted_rejected
  - temporary_blob_used_as_only_accepted_copy_rejected
# =====================================================================
# 99. INTEGRATION TESTS
# =====================================================================
integration_tests:
  - ProductionModel_to_ExecutionDAG
  - ExecutionDAG_to_ProductionManifest
  - SelfModel_health_to_scheduler
  - ProviderAdapter_to_JobAttempt
  - JobAttempt_to_ExecutionReceipt
  - artifact_to_AutonomousQC
  - QC_PASS_to_artifact_freeze
  - QC_FAIL_to_repair_cycle
  - fallback_plan_to_fallback_activation
  - repaired_artifact_to_re_QC
  - accepted_shots_to_scene_timeline
  - accepted_scenes_to_episode_timeline
  - final_episode_to_master_QC
  - execution_receipt_to_SelfModel
  - strategy_outcome_to_ProductionModel_experience
# =====================================================================
# 100. END-TO-END TESTS
# =====================================================================
end_to_end_tests:
  sixty_second_MVP:
    input:
      shots: 12
      quality_tier: prototype_or_preview
    sequence:
      - load animatic lock
      - load ProductionModel
      - create ProductionManifest
      - compile ExecutionDAG
      - resolve reusable character assets
      - execute parallel shot generation
      - execute dialogue
      - generate basic sound/music
      - submit takes to QC
      - accept selected shots
      - regenerate failed shots only
      - build deterministic timeline
      - mix audio
      - submit full short to QC
      - produce accepted master
    success:
      - no human production routing
      - failed shot repair isolated
      - restartable execution
  shot_217_repair:
    setup:
      total_shots: 260
      accepted_before_failure: 216
    failure:
      shot_217:
        receiver_hand: wrong
    sequence:
      - QC FAIL
      - RepairRecommendation received
      - engine invalidates shot_217 candidate
      - deterministic receiver layer strategy authorized
      - only shot_217 repair jobs materialized
      - re-QC
      - shot_217 PASS
      - shot_218_plus unaffected
      - timeline conforms automatically
    success:
      regenerated_unrelated_shots: 0
  provider_crash_recovery:
    sequence:
      - 80 asynchronous video jobs submitted
      - engine process crashes
      - restart
      - load checkpoint
      - poll provider request IDs
      - discover 51 completed, 22 running, 7 failed
      - fetch 51 outputs
      - continue polling 22
      - retry/fallback 7
      - no duplicate generation
    success:
      duplicate_provider_jobs: 0
  provider_degradation_mid_episode:
    sequence:
      - renderer_A powers 40 pending jobs
      - SelfModel marks degraded
      - circuit breaker opens
      - pending jobs stop dispatching
      - ProductionModel emits revised strategy
      - engine materializes replacement jobs
      - 20 prior accepted renderer_A shots preserved
    success:
      accepted_work_lost: 0
  heterogeneous_episode:
    strategies:
      environment:
        renderer: environment_specialist
      character_closeup:
        renderer: identity_specialist
      UI_text:
        implementation: deterministic_text_composite
      dialogue:
        implementation: voice_specialist
      music:
        implementation: music_model
    success:
      - all coordinated in one ExecutionDAG
      - exact lineage retained
  character_reuse:
    sequence:
      - episode_1 creates certified Aria asset family
      - episode_2 requests Aria
      - reusable asset resolver finds valid identity pack
      - ProductionModel uses compatible current renderer strategy
      - engine reuses certified assets
      - QC confirms identity
    expected:
      - lower cost
      - higher first-pass identity consistency
  full_episode_restart:
    sequence:
      - episode at 73_percent execution
      - all engine services restarted
      - manifest/checkpoints restored
      - accepted artifacts verified
      - READY graph rebuilt
      - pending work resumes
    success:
      - no accepted artifact regenerated
      - no duplicate logical jobs
      - final episode completes
# =====================================================================
# 101. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: PE-G01
    check: ProductionEngine executes only approved production strategies
  - id: PE-G02
    check: ProductionManifest is sole live execution-state model
  - id: PE-G03
    check: ExecutionDAG dependencies are explicit and acyclic
  - id: PE-G04
    check: jobs are idempotent at logical commit boundaries
  - id: PE-G05
    check: accepted artifacts are immutable
  - id: PE-G06
    check: required QC certificate gates artifact promotion
  - id: PE-G07
    check: operational retry and semantic repair are separate
  - id: PE-G08
    check: fallback activation uses preapproved ProductionModel strategy
  - id: PE-G09
    check: provider failure is isolated
  - id: PE-G10
    check: worker crash/restart is resumable
  - id: PE-G11
    check: provider-side async jobs reconcile without duplicate submission
  - id: PE-G12
    check: minimum blast radius invalidation works
  - id: PE-G13
    check: shot/layer isolation supported
  - id: PE-G14
    check: take portfolios execute concurrently and stop when authorized
  - id: PE-G15
    check: heterogeneous providers/tools coexist in one production DAG
  - id: PE-G16
    check: deterministic editorial assembly is reproducible
  - id: PE-G17
    check: execution receipts feed SelfModel and ProductionModel
  - id: PE-G18
    check: budget/rate-limit/provider-health constraints enforced
  - id: PE-G19
    check: stale job outputs cannot promote
  - id: PE-G20
    check: full episode may complete without mandatory human production intervention
# =====================================================================
# 102. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  manifest:
    - ProductionManifest durable
    - live execution state reconstructable
    - all state transitions auditable
  DAG:
    - explicit dependency graph
    - no cycles
    - QC/lock dependencies modeled
    - independent branches concurrent
  jobs:
    - state machine complete
    - leases
    - retries
    - cancellation
    - idempotency
    - provider reconciliation
  adapters:
    - normalized provider interface
    - deterministic tool interface
    - provider errors normalized
  artifacts:
    - immutable content
    - content digest
    - lineage
    - lifecycle state
    - accepted artifact freeze
    - cache semantics
  execution:
    - image generation
    - video generation
    - voice
    - sound
    - music
    - compositing
    - timeline
    - finishing
    - mastering
  QC:
    - candidate artifacts submit automatically
    - PASS attaches certificate
    - FAIL initiates repair path
    - UNCERTAIN holds promotion
  repair:
    - minimum-scope invalidation
    - replacement jobs
    - repeated failure escalation
    - re-QC
  resilience:
    - crash recovery
    - stale lease recovery
    - async provider reconciliation
    - provider degradation handling
    - accepted work preservation
  scale:
    - 250+ shot episode
    - thousands of jobs
    - concurrent take/audio/shot execution
    - provider quota-aware scheduling
  autonomy:
    - no human job dispatch
    - no human take routing
    - no human retry handling
    - no human provider fallback routing within approved strategy envelope
    - no human timeline assembly
    - no human ordinary shot-repair coordination
  final:
    - certified master artifact produced
    - complete lineage reconstructable
    - execution evidence retained for institutional learning
  release:
    requirement: >
      PE-G01 through PE-G20 pass and no ownership conflict exists with specs
      00 through 07.
