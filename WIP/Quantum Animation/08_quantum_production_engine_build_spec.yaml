# =====================================================================
# 107. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  architecture:
    - ProductionEngine executes approved strategy only
    - ProductionManifest owns live runtime state
    - semantic authority remains outside engine
  workflow:
    - typed DAG
    - explicit dependencies
    - asynchronous provider jobs
    - safe concurrency
    - no cyclic graph
  jobs:
    - retryable operational failures recover automatically
    - semantic failures route through QC/repair
    - leases recover abandoned jobs
    - stale jobs never promote
  artifacts:
    - immutable
    - lineage complete
    - accepted artifacts certificate-bound
    - accepted artifacts reusable
  QC:
    - engine cannot self-certify
    - every gated promotion checks certificate
    - repair returns to QC
  resilience:
    - provider outage isolated
    - engine crash resumable
    - provider async reconciliation works
    - unrelated accepted work survives
  production:
    - multiple takes supported
    - heterogeneous providers supported
    - layer production supported
    - dialogue/sound/music supported
    - deterministic timeline supported
  scale:
    - 250+ shot episode executes
    - thousands of jobs possible
    - backpressure works
    - QC throughput integrated
    - budget enforcement works
  autonomy:
    - no human scheduling
    - no human retry management
    - no human provider switching within authorized fallback space
    - no human take-selection execution
    - no human conform/mastering coordination
  learning:
    - execution evidence feeds SelfModel
    - strategy results feed ProductionModel
    - QC failure evidence retains lineage
  final: >
    ProductionEngine must transform approved production strategy into certified
    finished media reliably, incrementally and restartably while preserving
    semantic intent and accepted work.
# =====================================================================
# 108. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Production Engine executes; it does not create project meaning.
  law_02: >
    ProductionModel chooses manufacturing strategy; ProductionEngine materializes it.
  law_03: >
    ProductionManifest is the authoritative record of what is actually executing.
  law_04: >
    Generation success is not acceptance.
  law_05: >
    AutonomousQC alone certifies acceptance.
  law_06: >
    Accepted artifacts are immutable.
  law_07: >
    Jobs are explicit nodes in a dependency DAG.
  law_08: >
    Independent production should run concurrently.
  law_09: >
    Operational failures may retry automatically; semantic failures require
    governed repair.
  law_10: >
    Fallbacks must already be authorized by ProductionModel.
  law_11: >
    Provider failures must remain isolated.
  law_12: >
    Restarts must preserve accepted work and resume incomplete work.
  law_13: >
    Provider-side asynchronous jobs must reconcile before duplicate submission.
  law_14: >
    Every artifact must retain complete lineage.
  law_15: >
    Every consequential invocation should produce an execution receipt.
  law_16: >
    Execution receipts teach SelfModel what implementations actually did.
  law_17: >
    Execution outcomes teach ProductionModel which strategies actually worked.
  law_18: >
    Shot and layer isolation are the default repair boundaries.
  law_19: >
    Shot 217 should be repairable without touching shots 1–216 or 218+.
  law_20: >
    Deterministic media operations should remain deterministic and reproducible.
  law_21: >
    Heterogeneous providers and tools are normal, not exceptional.
  law_22: >
    A persistent character should reuse certified assets and identity anchors
    rather than regenerate identity from prose every episode.
  law_23: >
    Budget, rate limits and provider availability affect execution mechanics,
    not creative meaning.
  law_24: >
    Stale outputs never promote.
  law_25: >
    Repair changes the minimum causal dependency set and then returns to QC.
  law_26: >
    Final masters are assembled from explicit, traceable, certified source artifacts.
  law_27: >
    Engine throughput must be balanced against QC throughput to prevent waste.
  law_28: >
    The same execution architecture must scale from a 60-second MVP to a
    12–24-minute episode and later to seasons and features.
  law_29: >
    The studio should be restartable at any moment without losing its place.
  law_30: >
    The end state is a fully autonomous manufacturing substrate where approved
    cinematic intent flows through thousands of machine operations and emerges
    as a certified finished film without a hidden human production department.

That completes the 00–08 core architecture pack conceptually:

00  SYSTEM ARCHITECTURE
    What is Quantum Animation Agent?
01  WORLD MODEL
    What is true?
02  POLYCOGNITIVE RUNTIME
    What deserves thought, and how deeply?
03  CREATIVE INTELLIGENCE
    What film are we trying to make?
04  AUDIENCE + PRODUCT INTELLIGENCE
    Who is it for, what should happen to them,
    and is the resulting product compelling?
05  SELF MODEL
    What can Quantum actually do right now?
06  PRODUCTION MODEL
    How should Quantum manufacture this film right now?
07  AUTONOMOUS QC
    Is this decision/artifact good enough?
08  PRODUCTION ENGINE
    Execute the approved manufacturing plan reliably.

