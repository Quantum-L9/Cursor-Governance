# =====================================================================
# 33. TESTS
# =====================================================================
tests:
  unit:
    - node_normalization
    - edge_normalization
    - materiality_evaluation
    - invalidation_policy
    - tombstone_handling
  property:
    - provenance_graph_never_overrides_source_authority
    - historical_edges_never_mutated
    - nonmaterial_change_does_not_force_invalidation
    - hard_dependency_change_propagates
    - unrelated_certified_artifact_preserved
    - graph_rebuild_same_sources_same_digest
  negative:
    - graph_used_as_World_truth_rejected
    - graph_used_as_CreatorModel_authority_rejected
    - untyped_dependency_edge_rejected
    - destructive_supersession_rejected
    - project_wide_invalidation_without_dependency_path_rejected
  integration:
    - creative_compile_lineage
    - World_to_ShotSpec_lineage
    - ProductionStrategy_to_artifact_lineage
    - QC_certificate_lineage
    - repair_lineage
    - SelfModel_observation_lineage
  end_to_end:
    shot_217:
      sequence:
        - locate failed artifact
        - trace to ProductionStrategy
        - trace to WorldSnapshot
        - identify material handedness dependency
        - compute blast radius
        - invalidate shot candidate only
        - preserve neighbors
        - attach repaired artifact and new certificate
      success:
        unrelated_invalidations: 0
# =====================================================================
# 34. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: PPG-G01
    check: graph is projection not domain authority
  - id: PPG-G02
    check: all relationships are typed
  - id: PPG-G03
    check: exact object versions supported
  - id: PPG-G04
    check: materiality supported
  - id: PPG-G05
    check: dependency-aware invalidation supported
  - id: PPG-G06
    check: historical reconstruction supported
  - id: PPG-G07
    check: accepted artifacts preserved when dependencies unaffected
  - id: PPG-G08
    check: repair lineage complete
  - id: PPG-G09
    check: experience lineage supported
  - id: PPG-G10
    check: graph rebuildable from authoritative data
  - id: PPG-G11
    check: cross-project reusable refs supported
  - id: PPG-G12
    check: no World causal ownership leakage
# =====================================================================
# 35. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  structural:
    - normalized node contract
    - normalized edge contract
    - normalized ProvenanceRef
    - typed material dependency
    - projection revisions
  operational:
    - ingestion from all 00–08 authorities
    - graph rebuild
    - lineage query
    - impact analysis
    - invalidation plan
    - historical reconstruction
  autonomy:
    - agents can ask what depends on any object
    - agents can explain why an artifact exists
    - agents can determine minimum invalidation closure
    - ProductionEngine can consume invalidation plan
  MVP:
    - full lineage creative.yaml_to_master
    - forced shot failure repair trace
    - unaffected shots preserved
  release:
    requirement: PPG-G01_through_PPG-G12_pass
# =====================================================================
# 36. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Provenance Graph explains the studio; it does not rule the studio.
  law_02: >
    Every consequential object should be traceable to its sources.
  law_03: >
    Every dependency has semantics.
  law_04: >
    Every dependency may declare materiality.
  law_05: >
    Invalidation follows material dependency paths, not project boundaries.
  law_06: >
    Accepted work is preserved unless its correctness actually depends on what changed.
  law_07: >
    Repairs produce new lineage rather than rewriting history.
  law_08: >
    Historical project state must be reconstructable.
  law_09: >
    Institutional learning must remain connected to the evidence that created it.
  law_10: >
    Fictional causality belongs to World Model; production derivation belongs here.
  law_11: >
    The graph should answer "why?" with paths, not retrospective hallucination.
  law_12: >
    The final master must be traceable all the way back to the creative source
    and every material dependency that produced it.

