metadata:
  spec_id: quantum.animation.project_provenance_dependency_graph.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Project Provenance and Semantic Dependency Graph
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: WORLD_SOURCE_AUTHORITY_DEPENDENCY
    - file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: DECISION_AND_TRACE_DEPENDENCY
    - file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: CREATIVE_SOURCE_AUTHORITY_DEPENDENCY
    - file: 04_quantum_audience_product_intelligence_build_spec.yaml
      relationship: AUDIENCE_PRODUCT_DERIVATION_DEPENDENCY
    - file: 05_quantum_self_model_build_spec.yaml
      relationship: CAPABILITY_EVIDENCE_DEPENDENCY
    - file: 06_quantum_production_model_build_spec.yaml
      relationship: PRODUCTION_STRATEGY_DEPENDENCY
    - file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: CERTIFICATION_DEPENDENCY
    - file: 08_quantum_production_engine_build_spec.yaml
      relationship: EXECUTION_AND_ARTIFACT_DEPENDENCY
  architectural_identity:
    concise: >
      Rebuildable cross-studio graph describing how every meaningful project
      artifact, model, decision, strategy, execution, certificate, and experience
      depends on and derives from other project state.
    extended: >
      The Project Provenance and Semantic Dependency Graph is the studio-wide
      dependency fabric connecting otherwise independently owned authoritative
      domains. It makes derivation, lineage, material dependency, invalidation,
      reproducibility, impact analysis, repair blast radius, historical
      reconstruction, evidence attribution, and project-wide traceability
      computationally queryable without becoming another source of truth.
  owner_question:
    primary: "How did this exist, and what depends on it?"
  secondary_questions:
    - "What produced this artifact?"
    - "Which exact source revisions influenced it?"
    - "What depends on this semantic object?"
    - "If this changes, what becomes stale?"
    - "Which accepted artifacts remain valid?"
    - "Why was this decision made?"
    - "Which capability evidence supported this strategy?"
    - "Which execution produced this take?"
    - "Which QC run certified this artifact?"
    - "Which failures and repairs contributed to this experience?"
    - "Can the state of the project at any prior production coordinate be reconstructed?"
  core_principle: >
    The graph records relationships among authorities; it does not become an authority.
  canonicality:
    graph_is_authoritative_projection_of_lineage: true
    graph_is_authoritative_source_of_domain_semantics: false
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Make the entire studio computationally traceable across semantic compilation,
    cognitive decisions, World evolution, production planning, execution,
    quality certification, repair, and institutional learning.
  leverage: >
    Replace fragmented provenance logs and ad hoc references with one normalized
    dependency fabric that allows exact impact analysis across hundreds of shots
    and thousands of intermediate artifacts.
  success_definition: >
    Given any meaningful project object, Quantum can explain where it came from,
    what exact source versions influenced it, what depends on it, what must be
    invalidated if it changes, what can be preserved, and how it contributed to
    downstream production and learning.
  key_property:
    name: SURGICAL_INVALIDATION
    statement: >
      Semantic change should invalidate only the exact downstream dependency
      closure whose correctness materially depends on the changed input.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  PPG-001:
    name: PROJECTION_NOT_AUTHORITY
    statement: >
      Provenance Graph mirrors authoritative objects and relationships. It never
      owns CreatorModel, World truth, AudienceModel, SelfModel, ProductionModel,
      QC acceptance, or execution state.
  PPG-002:
    name: EVERY_MATERIAL_OBJECT_HAS_LINEAGE
    statement: >
      Every project object that can influence downstream semantic or production
      correctness must expose provenance.
  PPG-003:
    name: VERSION_EXPLICIT
    statement: >
      Dependencies reference exact immutable object versions wherever the source
      system supports immutable versions.
  PPG-004:
    name: RELATIONSHIPS_ARE_TYPED
    statement: >
      "Depends on" is insufficient. Dependency semantics must encode why and how
      one object depends on another.
  PPG-005:
    name: MATERIALITY_IS_EXPLICIT
    statement: >
      Not every relationship invalidates downstream state when its source changes.
  PPG-006:
    name: INVALIDATION_IS_DIRECTIONAL
    statement: >
      Provenance dependencies are directional and invalidation propagates only
      along edges declaring material dependency.
  PPG-007:
    name: ACCEPTED_WORK_IS_PRESERVED_BY_DEFAULT
    statement: >
      Certified artifacts remain valid unless a changed dependency is material
      under their certificate or provenance contract.
  PPG-008:
    name: REBUILDABLE
    statement: >
      Graph projections should be reconstructable from authoritative stores and
      immutable event/evidence logs.
  PPG-009:
    name: TEMPORAL_RECONSTRUCTION
    statement: >
      Project lineage must support historical queries such as "what did Quantum
      believe and use when shot 217 was produced?"
  PPG-010:
    name: CROSS_DOMAIN_REFS_ARE_NORMALIZED
    statement: >
      Domain-specific identifiers remain owned by their source systems but are
      represented through a common reference envelope.
  PPG-011:
    name: ARTIFACT_AND_SEMANTIC_DEPENDENCY_DIFFER
    statement: >
      A generated file dependency and a semantic reasoning dependency are distinct.
  PPG-012:
    name: EXECUTION_AND_SEMANTICS_DIFFER
    statement: >
      Provider attempts may change without changing ProductionIntent or World truth.
  PPG-013:
    name: PROVENANCE_IS_APPEND_ONLY
    statement: >
      Historical lineage is not rewritten when newer revisions supersede older ones.
  PPG-014:
    name: SUPERSESSION_IS_EXPLICIT
    statement: >
      New versions replace old versions through SUPERSEDES relationships rather
      than destructive overwrite.
  PPG-015:
    name: REPAIR_IS_TRACEABLE
    statement: >
      Repairs must explicitly identify failed source, repaired output, preserved
      dependencies, invalidated dependencies, and resulting certification.
  PPG-016:
    name: EVIDENCE_IS_CONNECTED
    statement: >
      Decisions, capability beliefs, strategy scores, QC judgments, and learned
      experience must retain evidence edges.
  PPG-017:
    name: NO_GLOBAL_REBUILD_BY_DEFAULT
    statement: >
      Project-wide invalidation requires explicit evidence of project-wide materiality.
  PPG-018:
    name: GRAPH_QUERY_IS_EXPLANATION_INFRASTRUCTURE
    statement: >
      Human or agent explanations should be derived from graph paths and
      authoritative data rather than invented retrospective stories.
  PPG-019:
    name: PROJECTIONS_MAY_BE_MULTIPLE
    statement: >
      Exact dependency, graph-visualization, analytics, and semantic-search
      projections may coexist while sharing the same logical contract.
  PPG-020:
    name: CAUSAL_AND_DERIVATIONAL_EDGES_DIFFER
    statement: >
      Fictional causal relationships belong to World Model; project derivation
      relationships belong here.
  PPG-021:
    name: EXPERIENCE_HAS_LINEAGE
    statement: >
      Institutional learning records must trace to the executions, decisions,
      artifacts, QC outcomes, and conditions that produced them.
  PPG-022:
    name: DELETION_DOES_NOT_ERASE_HISTORY
    statement: >
      Retired or garbage-collected physical artifacts leave durable tombstones
      and provenance.
  PPG-023:
    name: CROSS_PROJECT_REUSE_SUPPORTED
    statement: >
      Reusable characters, environments, assets, and experience may participate
      in multiple project graphs without identity collision.
  PPG-024:
    name: QUERY_RESULTS_HAVE_REVISION_CONTEXT
    statement: >
      Dependency answers should identify graph projection revision and source cutoffs.
# =====================================================================
# 3. OWNERSHIP BOUNDARIES
# =====================================================================
ownership_boundaries:
  this_spec_owns:
    - ProjectProvenanceGraph
    - ProvenanceNode
    - ProvenanceEdge
    - SemanticDependency
    - DependencyMateriality
    - DependencyStrength
    - ProvenanceRef
    - ProjectionRevision
    - ImpactAnalysis
    - InvalidationPlan
    - HistoricalDependencyView
    - GraphRebuildService
    - Provenance ingestion contracts
    - provenance query contracts
    - cross-domain dependency normalization
    - graph consistency validation
  this_spec_does_not_own:
    - domain semantic values
    - domain version creation
    - creative authority
    - World reducer
    - cognitive decision selection
    - capability estimation
    - production strategy
    - artifact acceptance
    - production job state
    - artifact blob storage
  source_ownership:
    creative:
      owner: 03
    fictional_reality:
      owner: 01
    cognitive_trace:
      owner: 02
    audience_product:
      owner: 04
    machine_capability:
      owner: 05
    production_strategy:
      owner: 06
    certification:
      owner: 07
    execution:
      owner: 08
  hard_rule: >
    If Provenance Graph data conflicts with an authoritative source, the source
    wins and the graph is repaired.
# =====================================================================
# 4. LOGICAL GRAPH DOMAINS
# =====================================================================
logical_domains:
  SOURCE:
    examples:
      - creative.yaml
      - creator feedback
      - external target statement
  CREATIVE:
    examples:
      - CreatorModel
      - ConceptModel
      - ThemeModel
      - CharacterSeed
      - StoryContract
      - CreativeLock
  WORLD:
    examples:
      - WorldEntity
      - WorldEvent
      - WorldSnapshot
      - WorldRule
      - StoryCoordinate
      - NarrativeOpportunity
  COGNITION:
    examples:
      - WorldSignal
      - CognitiveInvocation
      - CognitiveResult
      - DecisionFrame
      - Proposal
      - BranchPortfolio
      - CognitiveTrace
  AUDIENCE_PRODUCT:
    examples:
      - AudienceModel
      - ViewerArchetype
      - ProductMarketModel
  SELF:
    examples:
      - SelfModelSnapshot
      - CapabilityState
      - CapabilityObservation
  PRODUCTION_MODEL:
    examples:
      - ProductionIntent
      - ProductionConstraint
      - ProductionStrategy
      - RepairStrategy
      - ProductionModel
  EXECUTION:
    examples:
      - ProductionManifest
      - ProductionJob
      - JobAttempt
      - ExecutionReceipt
  ARTIFACT:
    examples:
      - keyframe
      - audio stem
      - shot take
      - scene render
      - master
  QC:
    examples:
      - QCContract
      - QCRun
      - Violation
      - QualityCertificate
  EXPERIENCE:
    examples:
      - OperatorExperience
      - ProductionStrategyExperience
      - QCExperienceRecord
      - AudienceObservation
  LOCK:
    examples:
      - creative.lock
      - animatic.lock
      - shot.lock
      - episode.lock
      - master.lock
# =====================================================================
# 5. PROVENANCE NODE
# =====================================================================
provenance_node:
  ProvenanceNode:
    fields:
      node_id:
      project_id:
      workspace_or_universe_id:
        nullable: true
      canonical_ref:
        type: ProvenanceRef
      node_class:
        enum:
          - SOURCE
          - DERIVED_MODEL
          - DECISION
          - WORLD_STATE
          - PLAN
          - SPECIFICATION
          - EXECUTION
          - ARTIFACT
          - CERTIFICATE
          - LOCK
          - EVIDENCE
          - EXPERIENCE
          - PROJECTION
      domain:
      semantic_type:
      owner_system:
      immutable_version:
        nullable: true
      digest:
        nullable: true
      created_at:
      effective_at:
        nullable: true
      retired_at:
        nullable: true
      tombstoned:
        default: false
      attributes:
        type: map
  node_payload:
    rule: >
      Graph stores references and minimal indexing metadata, not authoritative
      full domain payload by default.
# =====================================================================
# 6. PROVENANCE REF
# =====================================================================
provenance_ref:
  ProvenanceRef:
    fields:
      ref_type:
      owner_system:
      object_type:
      object_id:
      version:
        nullable: true
      digest:
        nullable: true
      project_id:
        nullable: true
      namespace:
        nullable: true
  canonical_string_form:
    example: >
      quantum://project/qas-001/world/WorldSnapshot/ws-192?v=7
  cross_project:
    supported: true
# =====================================================================
# 7. EDGE TAXONOMY
# =====================================================================
edge_taxonomy:
  derivation:
    - COMPILED_FROM
    - DERIVED_FROM
    - GENERATED_FROM
    - REDUCED_FROM
    - PROJECTED_FROM
    - SUMMARIZED_FROM
  semantic_dependency:
    - CONSTRAINED_BY
    - REQUIRES
    - ASSUMES
    - REFERENCES
    - OBSERVES
    - EVALUATES_AGAINST
  cognitive:
    - SIGNAL_TRIGGERED
    - INVOKED_BY
    - PROPOSED_BY
    - SELECTED_FROM
    - DECIDED_BY
    - SIMULATED_FROM
    - JUSTIFIED_BY
  world:
    - USES_WORLD_COORDINATE
    - USES_WORLD_SNAPSHOT
    - USES_ENTITY
    - USES_EXPECTED_STATE
  production:
    - PLANNED_FROM
    - USES_STRATEGY
    - USES_CAPABILITY_STATE
    - USES_ASSET
    - USES_IMPLEMENTATION
  execution:
    - EXECUTED_BY
    - ATTEMPT_OF
    - PRODUCED
    - CONSUMED
    - COMPOSITED_FROM
  QC:
    - EVALUATED_BY
    - FAILED_WITH
    - CERTIFIED_BY
    - REJECTED_BY
    - REPAIRED_AFTER
  lifecycle:
    - SUPERSEDES
    - REPLACES
    - INVALIDATES
    - LOCKS
    - UNLOCKS
  learning:
    - OBSERVATION_FOR
    - EXPERIENCE_FROM
    - CALIBRATED_BY
    - UPDATED_BELIEF
  reuse:
    - REUSES
    - VARIANT_OF
    - REPRESENTS_ENTITY
# =====================================================================
# 8. PROVENANCE EDGE
# =====================================================================
provenance_edge:
  ProvenanceEdge:
    fields:
      edge_id:
      from_node_ref:
      to_node_ref:
      edge_type:
      semantics:
        description:
      dependency_strength:
        type: DependencyStrength
      materiality:
        type: DependencyMateriality
      invalidation_policy:
        type: InvalidationPolicy
      evidence_refs:
        type: list[ProvenanceRef]
      created_at:
      source_system:
      source_event_ref:
  immutable: true
# =====================================================================
# 9. DEPENDENCY STRENGTH
# =====================================================================
dependency_strength:
  DependencyStrength:
    enum:
      - INFORMATIONAL
      - WEAK
      - MATERIAL
      - HARD
      - IDENTITY
  semantics:
    INFORMATIONAL:
      invalidation_default: false
    WEAK:
      invalidation_default: contextual
    MATERIAL:
      invalidation_default: true_if_source_changes_materially
    HARD:
      invalidation_default: true
    IDENTITY:
      invalidation_default: true
      meaning: >
        Downstream object is semantically defined by exact upstream identity/version.
# =====================================================================
# 10. MATERIALITY
# =====================================================================
dependency_materiality:
  DependencyMateriality:
    fields:
      material:
      material_fields:
        type: list[string]
      ignored_fields:
        type: list[string]
      semantic_predicate:
        nullable: true
      evaluator_ref:
        nullable: true
  example:
    dependency:
      ShotSpec_217 -> WorldSnapshot_192
    material_fields:
      - aria.physical_state
      - receiver.owner
      - receiver.hand
      - room.lighting_state
    ignored_fields:
      - unrelated_character_B_location
# =====================================================================
# 11. INVALIDATION POLICY
# =====================================================================
invalidation_policy:
  InvalidationPolicy:
    fields:
      mode:
        enum:
          - NEVER
          - ALWAYS
          - ON_MATERIAL_CHANGE
          - CERTIFICATE_DEFINED
          - CUSTOM
      propagation:
        enum:
          - NONE
          - DIRECT
          - TRANSITIVE
      preserve_certified_if_unaffected:
        default: true
      evaluator_ref:
        nullable: true
# =====================================================================
# 12. INGESTION CONTRACT
# =====================================================================
provenance_ingestion:
  ProvenanceEmission:
    fields:
      emission_id:
      source_system:
      source_revision:
      project_id:
      nodes:
        type: list[ProvenanceNodeUpsert]
      edges:
        type: list[ProvenanceEdgeAppend]
      source_event_id:
      emitted_at:
  supported_patterns:
    - synchronous_on_commit
    - transactional_outbox
    - event_stream_rebuild
  preferred:
    transactional_outbox_or_equivalent: true
  requirement: >
    Domain commit and provenance emission must not silently diverge.
# =====================================================================
# 13. GRAPH REBUILD
# =====================================================================
graph_rebuild:
  GraphRebuildService:
    inputs:
      - authoritative stores
      - append-only event ledgers
      - object version histories
      - artifact lineage
      - QC certificates
    outputs:
      - ProjectProvenanceGraph projection
  rebuild_modes:
    - full_project
    - domain_only
    - time_range
    - entity_subgraph
    - artifact_subgraph
  validation:
    - source_object_exists_or_tombstone
    - version_resolves
    - no_illegal_edge_direction
    - ownership_consistent
    - no_duplicate_logical_edge
# =====================================================================
# 14. PROJECTION REVISION
# =====================================================================
projection_revision:
  ProjectionRevision:
    fields:
      projection_revision_id:
      project_id:
      source_cutoffs:
        type: map
      graph_schema_version:
      created_at:
      digest:
  historical_query:
    may_pin_projection_revision: true
# =====================================================================
# 15. IMPACT ANALYSIS
# =====================================================================
impact_analysis:
  ImpactAnalysisRequest:
    fields:
      changed_ref:
      proposed_new_ref:
        nullable: true
      change_set:
      scope_limit:
        nullable: true
      include_certified:
      include_execution_state:
      graph_revision:
  ImpactAnalysisResult:
    fields:
      analysis_id:
      changed_ref:
      directly_affected:
        type: list[AffectedObject]
      transitively_affected:
        type: list[AffectedObject]
      definitely_invalid:
        type: list[ProvenanceRef]
      requires_revalidation:
        type: list[ProvenanceRef]
      preserved:
        type: list[ProvenanceRef]
      active_jobs_to_cancel:
        type: list[ProvenanceRef]
      estimated_blast_radius:
      confidence:
      explanation_paths:
  AffectedObject:
    fields:
      ref:
      dependency_path:
      impact:
        enum:
          - NONE
          - REVALIDATE
          - INVALIDATE
          - RECOMPILE
          - CANCEL
      reason:
# =====================================================================
# 16. INVALIDATION PLAN
# =====================================================================
invalidation_plan:
  InvalidationPlan:
    fields:
      invalidation_plan_id:
      triggering_change_ref:
      impact_analysis_ref:
      invalidate_refs:
      revalidate_refs:
      cancel_execution_refs:
      preserve_refs:
      downstream_recompile_roots:
      QC_certificate_invalidations:
      generated_at:
      approved_by_system:
      digest:
  execution_owner:
    - authoritative_domain_owners
    - ProductionEngine
    - AutonomousQC
  provenance_graph_role:
    propose_dependency_consequences: true
    execute_domain_mutation: false
# =====================================================================
# 17. REPAIR PROVENANCE
# =====================================================================
repair_provenance:
  RepairLineage:
    fields:
      failed_artifact_ref:
      QC_failure_ref:
      root_cause_ref:
      repair_recommendation_ref:
      prior_strategy_ref:
      replacement_strategy_ref:
        nullable: true
      invalidated_refs:
      preserved_refs:
      repaired_artifact_ref:
      new_certificate_ref:
      experience_refs:
  required: true
# =====================================================================
# 18. HISTORICAL RECONSTRUCTION
# =====================================================================
historical_reconstruction:
  HistoricalDependencyView:
    inputs:
      - project_id
      - timestamp_or_event_sequence
      - optional_scope_ref
    returns:
      - object_versions_active
      - graph_edges_active
      - ProductionModel_revision
      - SelfModel_revision
      - World_revision
      - CreatorModel_revision
      - QC_policy_version
  key_question:
    example: >
      "What exact reality, production strategy, renderer capability belief and
      QC contract produced shot 217 take 4?"
# =====================================================================
# 19. EXPLANATION PATHS
# =====================================================================
explanation_paths:
  examples:
    why_did_shot_217_use_renderer_B:
      path: |
        ShotSpec_217
          -> CONSTRAINED_BY receiver_right_hand
          -> PLANNED_FROM ProductionIntent
          -> USES_STRATEGY CompositeStrategy_18
          -> USES_CAPABILITY_STATE SelfModel.renderer_B.hand_object
          -> EXECUTED_BY Job_882
          -> PRODUCED Artifact_9912
    why_is_scene_18_invalid:
      path: |
        WorldEvent_440 changed Aria injury state
          -> WorldSnapshot_501
          -> SUPERSEDES WorldSnapshot_498
          -> materially invalidates ShotSpec_217
          -> invalidates shot certificate
          -> scene certificate requires revalidation
  generated_explanations:
    must_be_grounded_in_paths: true
# =====================================================================
# 20. QUERY API
# =====================================================================
query_API:
  lineage:
    - ancestors(ref, edge_types, depth)
    - descendants(ref, edge_types, depth)
    - direct_inputs(ref)
    - direct_outputs(ref)
    - provenance_path(from_ref, to_ref)
  dependency:
    - what_depends_on(ref)
    - what_materially_depends_on(ref)
    - impact_of_change(ref, changes)
  explanation:
    - why_does_this_exist(ref)
    - why_was_this_selected(ref)
    - which_evidence_supported(ref)
  artifact:
    - what_generated_artifact(ref)
    - which_source_revisions(ref)
    - which_QC_certified(ref)
  repair:
    - what_was_invalidated_by(repair_ref)
    - what_was_preserved_by(repair_ref)
    - repair_history(ref)
  historical:
    - project_state_at(time_or_sequence)
    - lineage_at(ref, time_or_sequence)
  learning:
    - experiences_from(ref)
    - failures_from_strategy(ref)
    - capability_observations_from_artifact(ref)
# =====================================================================
# 21. HIGH-LEVERAGE GRAPH QUERIES
# =====================================================================
high_leverage_queries:
  examples:
    surgical_invalidation:
      question: >
        Which certified artifacts materially depend on CharacterSeed Aria v4?
    strategy_learning:
      question: >
        Which ProductionStrategies generated artifacts failing
        WORLD.HANDEDNESS_MISMATCH more than once?
    renderer_evidence:
      question: >
        Which accepted shots used renderer B under two-character closeup
        conditions?
    creator_change:
      question: >
        What becomes stale if the ending intent changes?
    cross_episode_reuse:
      question: >
        Which certified assets representing Aria are compatible with the current
        ProductionIntent?
    experience:
      question: >
        Which repairs following identity drift produced subsequent PASS
        certificates?
# =====================================================================
# 22. GRAPH SCHEMA RELATION TO WORLD GRAPH
# =====================================================================
world_graph_boundary:
  WorldGraph:
    question: "What is true in the fictional universe?"
  ProjectProvenanceGraph:
    question: "How did Quantum produce and derive project state?"
  prohibited:
    - storing World causal edges as project provenance substitutes
    - treating production lineage as fictional causality
  allowed_cross_reference:
    example: >
      ShotSpec USES_WORLD_SNAPSHOT WorldSnapshot_192
# =====================================================================
# 23. GRAPH SCHEMA RELATION TO EXPERIENCE CORPUS
# =====================================================================
experience_boundary:
  ExperienceCorpus:
    semantic_owner:
      distributed:
        - 02 OperatorExperience
        - 05 capability observations
        - 06 ProductionStrategyExperience
        - 07 QCExperience
        - 04 audience calibration
  provenance_graph:
    role:
      - connect experiences to originating evidence
      - support cross-domain analytics
  rule: >
    Provenance Graph indexes experience lineage but does not collapse all
    experience into a single untyped memory store.
# =====================================================================
# 24. GRAPH IMPLEMENTATION ABSTRACTION
# =====================================================================
implementation_abstraction:
  logical_interface:
    provider_independent: true
  acceptable_physical_forms:
    - property_graph
    - relational_adjacency_model
    - document_plus_indexes
    - graph_projection_service
  hypergraph_required:
    value: false
  explanation: >
    Multi-entity relationships can be reified as first-class nodes when
    necessary; a true hypergraph is not required for MVP.
  graphiti_or_memory:
    optional_projection_or_retrieval_role: true
    canonical_dependency_owner: false
# =====================================================================
# 25. GRAPH CONSISTENCY
# =====================================================================
consistency:
  source_truth:
    authoritative_domain_store: highest
  graph_projection:
    eventual_consistency_allowed: true
  invalidation_decision:
    consequential_use:
      requires_projection_freshness_or_direct_source_confirmation: true
  duplicate_edges:
    logical_deduplication_required: true
  missing_edge:
    behavior:
      - mark provenance incomplete
      - block irreversible impact analysis if material
# =====================================================================
# 26. CONCURRENCY
# =====================================================================
concurrency:
  ingestion:
    parallel: true
  conflict:
    rule: >
      Multiple systems may append edges about the same object but cannot mutate
      an existing historical edge.
  projection_publish:
    atomic_revision: preferred
# =====================================================================
# 27. OBSERVABILITY
# =====================================================================
observability:
  metrics:
    - provenance_emissions_per_domain
    - projection_lag
    - unresolved_refs
    - orphan_nodes
    - duplicate_edges
    - incomplete_lineage_count
    - impact_analysis_latency
    - average_invalidation_blast_radius
    - preserved_artifact_ratio
    - historical_reconstruction_success_rate
  high_value_metric:
    name: unnecessary_invalidation_rate
    objective: decrease
# =====================================================================
# 28. FAILURE MODES
# =====================================================================
failure_modes:
  GRAPH_UNAVAILABLE:
    behavior:
      - authoritative systems continue
      - surgical impact analysis unavailable
      - fail closed for high-risk cross-domain invalidation
  PROJECTION_STALE:
    behavior:
      - mark freshness
      - refresh before consequential change
  MISSING_SOURCE_OBJECT:
    behavior:
      - tombstone or integrity violation
  INCOMPLETE_LINEAGE:
    behavior:
      - prevent confident preservation claim
  EDGE_SCHEMA_MISMATCH:
    behavior:
      - quarantine ingestion event
      - retain authoritative source state
  REBUILD_FAILURE:
    behavior:
      - retain last verified graph revision
# =====================================================================
# 29. STORAGE PORTS
# =====================================================================
storage_abstractions:
  ports:
    - ProvenanceGraphPort
    - ProvenanceEventStorePort
    - ProjectionRevisionStorePort
    - ImpactAnalysisStorePort
    - TombstoneStorePort
  provider:
    status: UNKNOWN
