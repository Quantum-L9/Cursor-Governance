# =====================================================================
attention_experience:
  ExecutiveAttentionExperience:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: EXPERIENCE_SPECIFICATION
    fields:
      experience_id:
      project_id:
      target_context_ref:
      ProofOfFilmLock_ref:
      target_recipient_context_ref:
      GatekeeperViewerModel_ref:
      ArrivalContext_ref:
      DeliveryPlan_ref:
      PresentationBoxSpec_ref:
      QuantumKeyPresentationSpec_ref:
      PackageOpeningSequence_ref:
      PreRollViewerStateContext_ref:
      PhysicalResidue_ref:
      physical_QC_contract_ref:
      access_handoff_ref:
      resource_budget_ref:
        nullable: true
      provenance_ref:
      version:
      digest:
# =====================================================================
# 5. TARGET RECIPIENT CONTEXT
# =====================================================================
target_recipient:
  TargetRecipientContext:
    fields:
      target_id:
      target_type:
        enum:
          - EXECUTIVE
          - PRODUCER
          - FINANCIER
          - BUYER
          - DISTRIBUTION_DECISION_MAKER
          - OTHER_AUTHORIZED_BUSINESS_TARGET
      organization_ref:
        nullable: true
      professional_role:
      decision_authority_estimate:
      known_professional_interests:
      permitted_public_professional_context:
      target_viewing_environment:
      expected_gatekeeper_types:
      attention_constraints:
      delivery_constraints:
      security_constraints:
      accessibility_constraints:
      privacy_classification:
      evidence_refs:
      confidence:
  forbidden_fields_by_default:
    - children's_birthdays
    - family_medical_information
    - home_location
    - private_travel_location
    - private_personal_relationships
    - unrelated_sensitive_personal_information
# =====================================================================
# 6. GATEKEEPER VIEWER MODEL
# =====================================================================
gatekeeper:
  GatekeeperViewerModel:
    fields:
      gatekeeper_id:
      role_type:
      organization_context:
      expected_first_contact:
      professional_legitimacy_threshold:
      embarrassment_risk_tolerance:
      novelty_tolerance:
      time_budget:
      forwarding_friction:
      executive_access_role:
      security_sensitivity:
      likely_questions:
      success_state:
      confidence:
  canonical_question: >
    Is placing this in front of my decision-maker professionally justified?
  desired_gatekeeper_state:
    - object_appears_legitimate
    - object_appears_intentional
    - target_recipient_is_clear
    - action_required_is_clear
    - security_risk_does_not_appear_reckless
    - curiosity_is_high
    - upward_transmission_is_easy
  failure_states:
    - looks_like_spam
    - looks_like_publicity_stunt
    - ambiguous_recipient
    - unsafe_electronic_device
    - contains_unknown_USB
    - embarrassing_to_forward
    - too_large_or_impractical
    - appears_deceptive
# =====================================================================
# 7. ARRIVAL CONTEXT
# =====================================================================
arrival_context:
  ArrivalContext:
    fields:
      context_id:
      target_ref:
      location_class:
      arrival_window:
      recipient_attention_probability:
      likely_uninterrupted_time_after_delivery:
      gatekeeper_probability:
      competing_stimulus_load:
      physical_security_environment:
      privacy_constraints:
      authorization_basis:
      delivery_feasibility:
      significance_opportunity:
      risk:
      evidence_refs:
      confidence:
  location_classes:
    - EXECUTIVE_OFFICE
    - STUDIO_LOT
    - CORPORATE_OFFICE
    - AUTHORIZED_BUSINESS_EVENT
    - HOTEL_BUSINESS_CONCIERGE
    - AUTHORIZED_AVIATION_CONCIERGE
    - AUTHORIZED_FBO
    - ASSISTANT_ARRANGED_LOCATION
    - OTHER_LAWFUL_PROFESSIONAL_CONTEXT
  forbidden_default:
    - PRIVATE_HOME_SURPRISE
    - FAMILY_EVENT
    - PRIVATE_LOCATION_TRACKING
    - UNAUTHORIZED_AIRCRAFT_INTERCEPTION
    - SECURITY_RESTRICTED_AREA_BYPASS
# =====================================================================
# 8. DELIVERY TIMING
# =====================================================================
delivery_timing:
  principle: >
    Timing should increase the probability of uninterrupted curiosity, not merely
    maximize theatrical surprise.
  DeliveryTimingScore:
    fields:
      attention_availability:
      interruption_cost:
      recipient_presence_confidence:
      uninterrupted_viewing_probability:
      gatekeeper_success_probability:
      security_friction:
      privacy_risk:
      novelty:
      overall_score:
      confidence:
  strong_context_example:
    conceptual: >
      An authorized business-travel handoff shortly before a period of
      uninterrupted transit may provide favorable attention conditions.
  hard_constraint: >
    Timing optimization cannot rely on unauthorized private movement tracking.
# =====================================================================
# 9. DELIVERY PLAN
# =====================================================================
delivery_plan:
  AttentionDeliveryPlan:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: PLAN
    fields:
      delivery_plan_id:
      experience_ref:
      target_ref:
      delivery_context_ref:
      delivery_window:
      courier_capability_ref:
      recipient_instructions:
      gatekeeper_instructions:
      chain_of_custody_policy:
      privacy_constraints:
      fallback_delivery_context:
      cancellation_conditions:
      presentation_protocol_ref:
      expected_arrival_state_change:
      resource_budget_ref:
        nullable: true
      provenance_ref:
      digest:
# =====================================================================
# 10. WHITE-GLOVE DELIVERY PROTOCOL
# =====================================================================
white_glove_delivery:
  WhiteGloveDeliveryProtocol:
    fields:
      protocol_id:
      demeanor:
      attire_standard:
      package_handling_standard:
      delivery_script:
      identity_verification_requirement:
      target_recipient_labeling:
      gatekeeper_handling:
      waiting_policy:
      photography_policy:
      confidentiality_policy:
      no_publicity_policy:
      failure_fallback:
      incident_reporting:
  default_demeanor:
    - discreet
    - calm
    - professional
    - brief
    - private
    - non_salesy
  default_delivery_script_semantics:
    - identify_Quantum_Animation_Studio
    - identify_intended_recipient
    - state_private_delivery
    - no_pitch
    - no_explanation_of_project
    - no_request_for_meeting
  prohibited:
    - pretending_to_be_government
    - pretending_to_be_royalty
    - pretending_to_be_target_company_staff
    - false_security_clearance
    - false_celebrity_affiliation
    - creating_public_scene
    - requesting_private_information
# =====================================================================
# 11. PRESENTATION BOX
# =====================================================================
presentation_box:
  PresentationBoxSpec:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      box_spec_id:
      studio_identity_ref:
      form_factor:
      dimensions:
      mass_target:
      exterior_material:
      exterior_finish:
      hinge_behavior:
      opening_resistance:
      interior_material:
      interior_geometry:
      insert_spec:
      branding:
      project_specificity:
      durability_target:
      ornament_target:
      reusability:
      accessibility:
      manufacturing_tolerance:
      QC_contract_ref:
      provenance_ref:
      digest:
  default_design_language:
    form_factor: LUXURY_WATCH_PRESENTATION
    scale: COMPACT
    exterior_color: BLACK
    interior: PREMIUM_MINIMAL
    branding_density: LOW
    perceived_mass: SUBSTANTIAL
    overall_impression:
      - engineered
      - expensive
      - precise
      - future_facing
      - private
  exterior_required:
    - text: QUANTUM ANIMATION STUDIO
    - studio_mark
  exterior_forbidden_by_default:
    - QR_code
    - commercial_price
    - project_pitch
    - explanatory_copy
    - false_scarcity_language
    - buyer_logo_without_permission
  interior_default:
    primary_object: QuantumKey
    paper_documents: NONE
# =====================================================================
# 12. BOX REUSABILITY
# =====================================================================
box_reusability:
  principle: >
    The box is a studio artifact. The Key is a target/project artifact.
  reusable_studio_design:
    value: true
  project_specific_box_required:
    value: false
  benefits:
    - manufacturing_efficiency
    - stronger_brand_recognition
    - consistent_studio_ritual
    - replaceable_project_Key
    - physical_collection_value
# =====================================================================
# 13. QUANTUM KEY PRESENTATION SPEC
# =====================================================================
key_presentation:
  QuantumKeyPresentationSpec:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: SPECIFICATION
    fields:
      presentation_spec_id:
      project_id:
      target_ref:
      credential_ref:
        owner: spec_20
      card_form_factor:
      material_language:
      weight_target:
      finish:
      front_engraving:
      back_engraving:
      QR_visual_ref:
      ResonanceSerial_display:
      NFC_tap_indicator:
      project_title_display_policy:
      recipient_display_policy:
      studio_identity:
      tactile_quality_target:
      ornament_target:
      engraving_tolerance:
      RF_exclusion_zones_ref:
        owner: spec_20
      manufacturing_constraints_ref:
      provenance_ref:
      digest:
  canonical_front:
    required:
      - QUANTUM ANIMATION STUDIO
      - studio_mark
  canonical_front_default:
    additional_information: MINIMAL
  canonical_back:
    may_include:
      - project_title
      - project_specific_QR
      - TAP_indicator
      - ResonanceSerial
  key_goal: >
    Resemble a premium financial credential, private invitation and technological
    artifact rather than electronic storage media.
# =====================================================================
# 14. PERSONALIZATION
# =====================================================================
personalization:
  principle: >
    Every cold-target Quantum Key is compiled specifically for one target
    opportunity.
  allowed_personalization_sources:
    - project_identity
    - target_professional_role
    - publicly_documented_professional_milestones
    - target_company_context
    - project_specific_symbolism
    - Quantum_brand_motifs
    - approved_public_professional_information
  prohibited_default_sources:
    - children
    - private_family_information
    - home_address
    - private_phone_data
    - private_travel_history
    - purchased_sensitive_personal_profiles
  personalization_must_not:
    - reveal_security_secret
    - imply_surveillance
    - imply_false_relationship
    - imply_prior_permission_when_none_exists
# =====================================================================
# 15. RESONANCE SERIAL PRESENTATION
# =====================================================================
resonance_serial_presentation:
  purpose: >
    Add subtle project and recipient specificity while remaining visually clean
    and nonsecurity-critical.
  visible_example:
    pattern: "QK · 7 · 042"
  Quantum_signature:
    recurring_digit_7:
      allowed: true
  semantic_sources:
    preferred:
      - project_symbolic_number
      - public_professional_reference
      - internal_QAS_sequence
      - combined_nonprivate_encoding
  psychological_goal:
    - uniqueness
    - intentionality
    - collectible_quality
    - subtle_discoverability
  security:
    credential_secret: false
    authentication_factor: false
  hard_rule: >
    If the recipient discovers its meaning, the desired reaction is recognition,
    not concern about private surveillance.
# =====================================================================
# 16. PHYSICAL SCARCITY
# =====================================================================
physical_scarcity:
  PhysicalScarcityClaim:
    fields:
      claim_id:
      edition_size:
      serialized:
      issued_count:
      project_specific:
      target_specific:
      truth_evidence_ref:
      presentation_policy:
  rule: >
    Serialization may communicate real scarcity only when Quantum can prove the
    corresponding issuance state.
  fake_scarcity:
    forbidden: true
# =====================================================================
# 17. PACKAGE OPENING SEQUENCE
# =====================================================================
opening_sequence:
  PackageOpeningSequence:
    fields:
      sequence_id:
      experience_ref:
      reveal_steps:
        type: list[PhysicalRevealStep]
      target_state_transitions:
      information_density:
      total_expected_duration:
      final_handoff:
      provenance_ref:
  PhysicalRevealStep:
    fields:
      order:
      visible_element:
      tactile_element:
      intended_inference:
      desired_viewer_effect:
      forbidden_disclosure:
      next_action_affordance:
  canonical_default: |
    exterior Quantum identity
        ↓
    deliberate opening resistance / premium tactile interaction
        ↓
    interior reveal
        ↓
    Quantum Key
        ↓
    project-specific identity
        ↓
    QR / TAP affordance
        ↓
    secure access attempt
# =====================================================================
# 18. PRE-ROLL VIEWER STATE
# =====================================================================
pre_roll_viewer_state:
  PreRollViewerStateContext:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: DERIVED_MODEL
    fields:
      context_id:
      experience_ref:
      target_viewer_ref:
      base_viewer_state_ref:
      post_arrival_attention:
      curiosity:
      perceived_significance:
      expected_quality:
      expected_originality:
      trust_prior:
      mystery:
      exclusivity:
      anticipated_reward:
      competing_attention:
      skepticism:
      security_confidence:
      gatekeeper_transmission_state:
      evidence_refs:
      confidence:
  downstream:
    consumed_by:
      - 18.ProofPreRollContext
  important_effect: >
    ProofOfFilm does not necessarily start from a neutral viewer state.
# =====================================================================
# 19. PRE-ROLL PSYCHOLOGICAL TRAJECTORY
# =====================================================================
pre_roll_trajectory:
  canonical_pattern: |
    ORDINARY_ATTENTION
         ↓
    INTERRUPT
         ↓
    "WHAT IS THIS?"
         ↓
    SIGNIFICANCE_INFERENCE
         ↓
    PHYSICAL_CURIOSITY
         ↓
    EXCLUSIVITY_INFERENCE
         ↓
    KEY_DISCOVERY
         ↓
    SECURE_ACCESS_ANTICIPATION
         ↓
    DIGITAL_AUTHENTICATION
         ↓
    ACCESS_GRANTED
         ↓
    PROOF_OF_FILM
  goal: >
    Increase attention and curiosity while preserving enough mystery that
    playback receives maximum voluntary cognitive investment.
# =====================================================================
# 20. SIGNIFICANCE INFERENCE TARGET
# =====================================================================
significance_target:
  SignificanceInferenceTarget:
    fields:
      target_id:
      perceived_effort:
      perceived_seriousness:
      perceived_exclusivity:
      perceived_technical_sophistication:
      perceived_quality_prior:
      perceived_intentionality:
      perceived_legitimacy:
      expected_value_prior:
      maximum_expectation_inflation:
      evidence_refs:
  desired_semantics:
    - "Someone took this seriously."
    - "This was made specifically to reach me."
    - "This is probably worth a few minutes of attention."
  forbidden_semantics:
    - "A government official sent this."
    - "A celebrity endorsed this."
    - "My private life is being monitored."
# =====================================================================
# 21. MYSTERY TARGET
# =====================================================================
mystery:
  MysteryTarget:
    fields:
      project_information_withheld:
      studio_identity_clarity:
      intended_recipient_clarity:
      access_action_clarity:
      curiosity_target:
      confusion_maximum:
      threat_perception_maximum:
      evidence_refs:
  rule: >
    Mystery applies to content and significance, not basic usability or safety.
# =====================================================================
# 22. DESK PERSISTENCE
# =====================================================================
desk_persistence:
  DeskPersistence:
    fields:
      object_ref:
      retention_probability:
      display_probability:
      discard_probability:
      tactile_memorability:
      aesthetic_fit:
      perceived_collectibility:
      brand_recall:
      conversation_trigger_probability:
      estimated_persistence_horizon:
      confidence:
  purpose: >
    Measure whether the physical object is likely to remain present after its
    immediate transaction purpose.
# =====================================================================
# 23. PHYSICAL RESIDUE
# =====================================================================
physical_residue:
  PhysicalResidue:
    fields:
      residue_id:
      experience_ref:
      retained_object_refs:
      expected_display_context:
      studio_brand_recall:
      project_recall:
      tactile_memory:
      conversation_trigger:
      secondary_viewer_exposure:
      collectible_value:
      confidence:
  conceptual_term:
    name: PHYSICAL_COGNITIVE_AFTERLIFE
  principle: >
    A persistent physical object may continue reinforcing memory and social
    transmission after the screen experience ends.
# =====================================================================
# 24. CONVERSATION TRIGGER
# =====================================================================
conversation_trigger:
  ConversationTrigger:
    fields:
      object_ref:
      visual_uniqueness:
      recognizable_branding:
      mystery:
      display_likelihood:
      question_probability:
      likely_question:
      target_owner_response_friction:
      brand_recall_value:
      confidence:
  desired_question:
    examples:
      - "What's that?"
      - "What's Quantum Animation Studio?"
      - "What did that card unlock?"
# =====================================================================
# 25. PACKAGE CONTENT MANIFEST
# =====================================================================
physical_manifest:
  PhysicalExperienceManifest:
    extends:
      - 10.IntermediateRepresentation
    object_class:
      value: MANIFEST
    fields:
      manifest_id:
      experience_ref:
      box_serial:
      presentation_box_ref:
      QuantumKeyPresentationSpec_ref:
      QuantumKeyCredential_ref:
      insert_refs:
      included_object_refs:
      paper_document_count:
      assembly_QC_ref:
      provisioned_key_verified:
      delivery_plan_ref:
      chain_of_custody_ref:
      sealed_at:
      provenance_ref:
      digest:
  default:
    paper_document_count: 0
# =====================================================================
# 26. PHYSICAL DELIVERY AUTHORIZATION
# =====================================================================
physical_release:
  PhysicalDeliveryAuthorization:
    fields:
      authorization_id:
      experience_ref:
      ProofOfFilmLock_ref:
      proof_release_readiness_ref:
      target_recipient_ref:
      physical_manifest_ref:
      key_security_readiness_ref:
      physical_QC_pass:
      lawful_delivery_plan_pass:
      privacy_pass:
      resource_budget_pass:
      authorized_at:
      authority_refs:
      outcome:
        enum:
          - AUTHORIZED
          - DENIED
          - UNCERTAIN
  hard_requirements:
    - certified_ProofOfFilm
    - valid_proof_lock
    - QuantumKeyCredential_READY
    - package_QC_PASS
    - lawful_delivery_context
    - correct_target_binding
    - no_critical_security_issue
  principle: >
    Quantum does not spend prestige before the underlying experience has earned it.
# =====================================================================
# 27. EXPERIENCE RESOURCE BUDGET
# =====================================================================
resource_budget:
  ExperienceResourceBudget:
    fields:
      opportunity_ref:
      physical_package_budget:
      personalization_budget:
      delivery_budget:
      courier_budget:
      replacement_budget:
      QC_budget:
      contingency:
      rationale_ref:
  future_policy_owner:
    spec: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
  rule: >
    This specification consumes an approved budget. It does not decide strategic
    customer acquisition spending.
# =====================================================================
# 28. PHYSICAL MANUFACTURING ABSTRACTION
# =====================================================================
physical_manufacturing:
  capability_ids:
    - physical.presentation_box.manufacture
    - physical.key_body.manufacture
    - physical.precision_engrave
    - physical.package.assemble
  principle: >
    No manufacturer becomes part of the semantic architecture.
  normalized_requirements:
    - design_spec_ref
    - material_spec
    - dimensional_tolerance
    - finish_tolerance
    - engraving_spec
    - serial_binding
    - RF_safe_regions_where_applicable
    - confidentiality_requirement
    - QC_sampling_policy
  future_amendment:
    target: 15_quantum_reference_implementation_contracts_build_spec.yaml
# =====================================================================
# 29. DELIVERY SERVICE ADAPTER
# =====================================================================
delivery_adapter:
  capability_id:
    logistics.premium_private_delivery
  normalized_request:
    fields:
      package_ref:
      target_ref:
      authorized_location:
      delivery_window:
      handoff_policy:
      identity_verification_level:
      gatekeeper_policy:
      privacy_policy:
      chain_of_custody_policy:
  normalized_output:
    fields:
      delivery_id:
      status:
      timestamps:
      handoff_class:
      incident_refs:
      proof_of_delivery_ref:
      provider_metadata_ref:
  provider_semantics:
    may_not_escape_adapter: true
  future_amendment:
    target: 15_quantum_reference_implementation_contracts_build_spec.yaml
# =====================================================================
# 30. CHAIN OF CUSTODY
# =====================================================================
chain_of_custody:
  PhysicalCustodyRecord:
    fields:
      custody_id:
      physical_manifest_ref:
      custodian_class:
      received_at:
      released_at:
      release_target_class:
      location_class:
      condition_report:
      incident_refs:
      evidence_refs:
  security_boundary:
    no_cryptographic_secret_exposure: true
  purpose:
    - delivery_integrity
    - loss_detection
    - package_condition
    - key_replacement_decision
# =====================================================================
# 31. DELIVERY EVENTS
# =====================================================================
delivery_events:
  event_family: ATTENTION_DELIVERY
  types:
    ATTENTION.PACKAGE_ASSEMBLED:
      fields:
        - experience_ref
        - manifest_ref
        - timestamp
    ATTENTION.PACKAGE_DISPATCHED:
      fields:
        - experience_ref
        - delivery_ref
        - timestamp
    ATTENTION.PACKAGE_DELIVERED:
      fields:
        - experience_ref
        - delivery_ref
        - handoff_class
        - timestamp
    ATTENTION.PACKAGE_DELIVERY_FAILED:
      fields:
        - experience_ref
        - delivery_ref
        - reason
        - timestamp
    ATTENTION.PACKAGE_RETURNED:
      fields:
        - experience_ref
        - delivery_ref
        - timestamp
  commercial_timer_effect:
    value: NONE
# =====================================================================
# 32. KEY ACTIVATION HANDOFF
# =====================================================================
activation_handoff:
  owner_of_activation:
    spec: 20_quantum_key_access_security_build_spec.yaml
  this_spec_emits:
    - valid_PhysicalExperienceManifest
    - expected_Key_ref
    - target_experience_ref
    - pre_roll_context_ref
  spec_20_emits_back:
    - ACCESS.KEY_ACTIVATED
  physical_experience_effect:
    on_first_key_activation:
      state: DIGITAL_HANDOFF_COMPLETE
# =====================================================================
# 33. GATEKEEPER PATH
# =====================================================================
gatekeeper_path:
  canonical_flow: |
    courier
       ↓
    gatekeeper
       ↓
    package inspection
       ↓
    legitimacy assessment
       ↓
    curiosity
       ↓
    upward transmission
       ↓
    target recipient
  target_state:
    gatekeeper:
      embarrassment_risk: LOW
      legitimacy: HIGH
      curiosity: HIGH
      upward_transmission_impulse: HIGH
  package_copy_for_gatekeeper:
    forbidden_by_default: true
  rule: >
    There is one private target package, not a disposable press-kit stack.
# =====================================================================
# 34. DIRECT RECIPIENT PATH
# =====================================================================
direct_recipient_path:
  canonical_flow: |
    courier
       ↓
    intended recipient
       ↓
    package
       ↓
    opening
       ↓
    Key
       ↓
    secure access
  target:
    time_to_understand_next_action:
      desired: MINIMAL
# =====================================================================
# 35. ORNAMENT REQUIREMENT
# =====================================================================
ornament_requirement:
  principle: >
    The box and/or Quantum Key should remain aesthetically valuable when no
    longer required for immediate first access.
  OrnamentQuality:
    fields:
      aesthetic_quality:
      tactile_quality:
      material_quality:
      durability:
      desk_compatibility:
      collection_value:
      branding_restraint:
      curiosity_value:
      overall:
  requirement:
    premium_executive_variant:
      minimum: HIGH
# =====================================================================
# 36. EXPERIENCE QC CONTRACT
# =====================================================================
physical_QC:
  formal_acceptance_owner:
    spec: 07_quantum_autonomous_qc_build_spec.yaml
  PhysicalExperienceQCContract:
    fields:
      contract_id:
      box_quality_requirements:
      key_presentation_requirements:
      assembly_requirements:
      engraving_requirements:
      recipient_binding_requirements:
      delivery_plan_requirements:
      privacy_requirements:
      security_handoff_requirements:
      ProofOfFilm_readiness_requirements:
      prohibited_claims:
      evidence_requirements:
  specialist_critics:
    - LuxuryPresentationCritic
    - GatekeeperExperienceCritic
    - ExecutiveAttentionCritic
    - PrivacyBoundaryCritic
    - BrandIdentityCritic
    - PhysicalManufacturingCritic
  hard_failures:
    - incorrect_recipient
    - wrong_project_Key
    - unprovisioned_Key
    - materially_defective_box
    - visible_security_secret
    - creepy_private_personalization
    - false_affiliation
    - unsupported_scarcity_claim
    - uncertified_ProofOfFilm
    - unlawful_delivery_context
# =====================================================================
# 37. QUALITY TARGET
# =====================================================================
quality_target:
  premium_executive:
    required_impression:
      - exceptional
      - precise
      - controlled
      - technologically_sophisticated
      - serious
      - private
  unacceptable_impression:
    - cheap_promotional_swag
    - generic_corporate_gift
    - mailer
    - press_kit
    - unsafe_electronic_device
    - gimmick
    - desperate_sales_pitch
# =====================================================================
# 38. PRIVACY
# =====================================================================
privacy:
  principles:
    - collect_minimum_target_data
    - professional_context_only_by_default
    - no_private_family_data
    - no_private_location_tracking
    - no_credentials_in_personalization_data
    - no_personalization_data_in_WorldModel
    - no_personalization_data_in_creative_prompts_unless_required_and_allowed
  target_data_separation:
    required: true
  retention:
    governed_by:
      - business_policy
      - applicable_privacy_requirements
  recipient_data:
    may_enter:
      - executive_experience_domain
      - commercial_domain
    must_not_enter:
      - fictional_World_truth
      - character_memory
      - project_semantic_creative_state_unnecessarily
# =====================================================================
# 39. SECURITY
# =====================================================================
security:
  principle: >
    Physical presentation is untrusted until the Key credential independently
    authenticates through spec 20.
  package_does_not_contain:
    - raw_master_key
    - credential_root_key
    - project_files
    - executable_USB
    - hidden_tracking_hardware_outside_declared_policy
  loss:
    package_loss_must_not:
      - expose_root_credentials
      - expose_raw_project_files
  credential_security_owner:
    spec: 20_quantum_key_access_security_build_spec.yaml
# =====================================================================
# 40. ACCESSIBILITY
# =====================================================================
accessibility:
  requirements:
    - clear_visual_tap_affordance
    - QR_fallback_visual_affordance
    - readable_project_identity_where_used
    - reasonable_color_contrast
    - physical_opening_not_excessively_difficult
    - accessible_digital_fallback_owned_downstream
  principle: >
    Mystery must not create preventable accessibility failure.
# =====================================================================
# 41. LEARNING
# =====================================================================
learning:
  experience_signals:
    - delivery_to_activation_latency
    - gatekeeper_path_frequency
    - direct_recipient_path_frequency
    - package_retention_when_observable
    - activation_rate
    - Proof_start_after_activation
    - recipient_feedback_where_voluntarily_provided
  learnable:
    - box_form_factor_effectiveness
    - delivery_context_effectiveness
    - gatekeeper_success_patterns
    - ornament_retention_patterns
    - personalization_effectiveness
    - delivery_timing_patterns
  forbidden_learning:
    - covert_private_location_prediction
    - sensitive_personal_inference
    - deceptive_affiliation_strategy
  future_owner:
    strategic_policy: 29_quantum_opportunity_acquisition_learning_build_spec.yaml
# =====================================================================
# 42. OBSERVABILITY
# =====================================================================
observability:
  package:
    - assembly_pass_rate
    - physical_defect_rate
    - key_binding_error_rate
    - engraving_error_rate
  delivery:
    - dispatch_to_delivery_latency
    - delivery_success_rate
    - gatekeeper_handoff_rate
    - direct_recipient_handoff_rate
    - failed_delivery_rate
    - package_return_rate
  attention:
    - delivery_to_key_activation_latency
    - delivered_to_activation_rate
    - key_activation_to_Proof_start_rate
  residue:
    - observed_retention_rate_where_available
    - conversation_trigger_observation_where_available
  privacy:
    - personalization_privacy_rejections
    - unauthorized_location_strategy_rejections
# =====================================================================
# 43. FAILURE MODES
# =====================================================================
failure_modes:
  WRONG_RECIPIENT:
    behavior:
      - stop_delivery
      - do_not_substitute
      - return_or_hold_securely
      - investigate
  PACKAGE_DAMAGED:
    behavior:
      - deny_delivery_if_premium_threshold_not_met
      - replace
      - preserve_Key_security_state_as_required
  KEY_PRESENTATION_MISMATCH:
    behavior:
      - quarantine_package
      - rebuild_correct_manifest
  DELIVERY_CONTEXT_BECOMES_INAPPROPRIATE:
    behavior:
      - defer
      - choose_authorized_fallback
      - do_not_force_theater
  GATEKEEPER_REJECTS:
    behavior:
      - preserve_professionalism
      - no_pressure
      - no_security_bypass
      - follow_approved_delivery_policy
  PROOF_LOCK_INVALIDATED_BEFORE_DELIVERY:
    behavior:
      - stop_delivery
      - rebuild_or_reauthorize_after_new_lock
  PHYSICAL_CREDENTIAL_NOT_READY:
    behavior:
      - block_package_release
  PERSONALIZATION_PRIVACY_FAILURE:
    behavior:
      - remove_personalization
      - regenerate
      - require_QC
# =====================================================================
# 44. DEGRADED MODES
# =====================================================================
degraded_modes:
  STANDARD_PREMIUM_DELIVERY:
    description: >
      White-glove provider unavailable; use high-quality insured professional
      courier while preserving package quality and privacy.
  OFFICE_ONLY:
    description: >
      Complex timing context unavailable; deliver to verified professional office.
  GENERIC_RESONANCE_SERIAL:
    description: >
      Recipient-specific public professional symbolism unavailable; use
      project-specific or studio-specific serial only.
  NO_GATEKEEPER_MODEL:
    behavior:
      - use_conservative_professional_handoff
  hard_rule: >
    Degraded presentation may reduce theater but may not reduce security,
    privacy, truthfulness or package correctness.
# =====================================================================
# 45. RECOVERY
# =====================================================================
recovery:
  lost_before_delivery:
    - revoke_or_quarantine_associated_Key
    - manufacture_replacement
    - generate_new_manifest
    - rebind_delivery
  damaged_after_provisioning:
    - revoke_if_credential_integrity_uncertain
    - replace_physical_Key
    - new_QC
    - reissue
  returned_package:
    - inspect
    - preserve_chain_of_custody
    - decide_reuse_or_destroy
    - credential_state_owned_by_spec_20
# =====================================================================
# 46. IDEMPOTENCY
# =====================================================================
idempotency:
  experience_compilation:
    same_inputs_same_policy:
      may_reproduce_equivalent_spec: true
  physical_manufacture:
    inherently_idempotent: false
  delivery:
    duplicate_execution:
      forbidden_without_explicit_new_delivery_attempt_id: true
  package_manifest:
    immutable_after_seal: true
# =====================================================================
# 47. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - target_to_ExecutiveAttentionExperience
    - ProofOfFilmLock_to_PhysicalDeliveryAuthorization
    - PresentationBoxSpec_to_manufactured_box
    - QuantumKeyPresentationSpec_to_physical_Key
    - credential_ref_to_Key_presentation
    - physical_manifest_to_delivery
    - delivery_to_first_Key_activation
    - personalization_to_public_or_project_source
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 48. API BOUNDARIES
# =====================================================================
API_boundaries:
  compile:
    - compile_target_recipient_context
    - compile_gatekeeper_model
    - compile_arrival_context
    - compile_delivery_plan
    - compile_presentation_box_spec
    - compile_Key_presentation_spec
    - compile_opening_sequence
    - compile_pre_roll_context
  physical:
    - request_box_manufacture
    - request_key_body_manufacture
    - request_engraving
    - assemble_package
    - inspect_package
    - seal_package
  delivery:
    - authorize_delivery
    - dispatch
    - record_handoff
    - record_failure
    - cancel_delivery
  lifecycle:
    - receive_KeyActivated_event
    - mark_digital_handoff_complete
# =====================================================================
# 49. UNIT TESTS
# =====================================================================
tests:
  unit:
    box:
      - exterior_has_Quantum_Animation_Studio
      - exterior_contains_no_QR_by_default
      - no_paper_documents_default
      - box_remains_project_agnostic_by_default
    key_presentation:
      - target_specific
      - project_specific
      - visible_serial_not_security_secret
      - front_studio_identity_present
    personalization:
      - public_professional_reference_allowed
      - child_birthday_rejected
      - private_home_data_rejected
    delivery:
      - arrival_does_not_start_offer_clock
      - lawful_context_required
    prestige:
      - delivery_blocked_without_certified_ProofOfFilm
      - package_quality_failure_blocks_release
# =====================================================================
# 50. PROPERTY TESTS
# =====================================================================
property_tests:
  - physical_experience_cannot_grant_digital_access
  - QR_presentation_cannot_become_authentication_authority
  - personalization_cannot_contain_credential_secret
  - package_delivery_cannot_start_commercial_offer_timer
  - target_private_family_data_cannot_be_required
  - target_private_location_cannot_be_required
  - false_affiliation_always_fails
  - ProofOfFilmLock_invalidation_blocks_unsent_package_release
  - degraded_delivery_never_weakens_security
  - box_reuse_cannot_reuse_buyer_specific_Key_identity
  - physical_QC_and_digital_security_QC_remain_separate
  - physical_manufacturing_provider_cannot_become_semantic_owner
# =====================================================================
# 51. SCENARIO TESTS
# =====================================================================
scenario_tests:
  executive_office_direct:
    given:
      - verified_office
      - direct_recipient
      - certified_Proof
    expect:
      - discreet_handoff
      - opening
      - Key_discovery
      - pre_roll_state_high_significance
  gatekeeper:
    given:
      - executive_unavailable
      - assistant_receives_package
    expect:
      - target_recipient_clear
      - legitimacy_high
      - embarrassment_risk_low
      - upward_transmission
  authorized_flight_context:
    given:
      - authorized_FBO_or_concierge_delivery
      - lawful_professional_context
      - likely_uninterrupted_flight
    expect:
      - high_attention_opportunity
      - no_private_tracking_required
  creepy_personalization:
    given:
      - proposed_serial_based_on_child_birthdate
    expect:
      - privacy_QC_FAIL
      - substitute_project_symbolic_serial
  damaged_box:
    given:
      - cosmetic_damage_above_premium_tolerance
    expect:
      - no_delivery
      - replacement
# =====================================================================
# 52. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: EA-G01
    check: ExecutiveAttentionExperience has one explicit owner
  - id: EA-G02
    check: physical attention domain does not own digital authentication
  - id: EA-G03
    check: one buyer-specific Key is supported per target experience
  - id: EA-G04
    check: presentation box is studio-branded and reusable by default
  - id: EA-G05
    check: no exterior QR by default
  - id: EA-G06
    check: no paper documents required
  - id: EA-G07
    check: GatekeeperViewerModel is first-class
  - id: EA-G08
    check: lawful ArrivalContext is required
  - id: EA-G09
    check: private family/location targeting is prohibited by default
  - id: EA-G10
    check: WhiteGloveDeliveryProtocol cannot imply false affiliation
  - id: EA-G11
    check: visible personalization cannot contain credential secrets
  - id: EA-G12
    check: ResonanceSerial supports project symbolism and Quantum digit 7 motif
  - id: EA-G13
    check: DeskPersistence is measurable
  - id: EA-G14
    check: PhysicalResidue is first-class
  - id: EA-G15
    check: conversation-trigger value is modeled
  - id: EA-G16
    check: PreRollViewerStateContext hands into ProofOfFilm
  - id: EA-G17
    check: prestige delivery blocked when ProofOfFilm readiness is insufficient
  - id: EA-G18
    check: package assembly has immutable manifest
  - id: EA-G19
    check: package contains no raw project files
  - id: EA-G20
    check: physical delivery does not start commercial timer
  - id: EA-G21
    check: delivery provider semantics terminate at adapter
  - id: EA-G22
    check: physical manufacturing provider semantics terminate at adapter
  - id: EA-G23
    check: physical degradation may reduce theater but not security/privacy
  - id: EA-G24
    check: first digital action is obvious
  - id: EA-G25
    check: physical experience terminates at spec-20 authentication handoff
# =====================================================================
# 53. IMPLEMENTATION WAVES
# =====================================================================
implementation_waves:
  EAW1:
    name: domain_and_psychology
    targets:
      - ExecutiveAttentionExperience
      - TargetRecipientContext
      - GatekeeperViewerModel
      - PreRollViewerStateContext
  EAW2:
    name: physical_design
    depends_on:
      - EAW1
    targets:
      - PresentationBoxSpec
