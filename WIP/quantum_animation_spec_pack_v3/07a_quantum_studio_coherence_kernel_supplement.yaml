# =====================================================================
# 64. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Studio coherence is a property of the joint body of work, not merely of
    individual artifacts.
  law_02: >
    A thousand locally good decisions can still form one globally incoherent film.
  law_03: >
    Continuity, quality, creator fidelity, and studio coherence are related but
    distinct properties.
  law_04: >
    Creative intent should remain explicit, versioned, queryable, and portable
    across model providers.
  law_05: >
    Model weights may assist creative expression but may never become the sole
    carrier of project identity.
  law_06: >
    Mechanize aesthetic constraints where they can be represented faithfully.
  law_07: >
    Do not turn irreducible creative judgment into fake deterministic rules.
  law_08: >
    Hard creative invariants are noncompensatory.
  law_09: >
    Project-specific open dimensions are as important as project-specific constraints.
  law_10: >
    Coherence means recognizable authorship, not uniformity.
  law_11: >
    Legitimate creative deviation must have a path to acceptance.
  law_12: >
    Repeated accepted deviations may evolve project convention through explicit
    versioned promotion.
  law_13: >
    A coherence monitor may diagnose drift but cannot redefine creator intent.
  law_14: >
    A coherence signal may trigger stronger cognition or production control but
    may not directly mutate authoritative state.
  law_15: >
    Studio coherence should be represented as a vector before it is reduced to
    any scalar index.
  law_16: >
    Any scalar Studio Coherence Index remains experimental until calibrated
    against human and creator judgments.
  law_17: >
    Critic models are measuring instruments and must themselves be calibrated.
  law_18: >
    Changing the measuring instrument changes the metric.
  law_19: >
    Critic model versions, rubrics, prompt templates, and context policies must
    be pinned for consequential evaluation.
  law_20: >
    A critic should not be considered independent merely because it was invoked
    under a different role name.
  law_21: >
    High-impact evaluation should seek genuinely different evidence or reasoning
    routes when correlated failure is plausible.
  law_22: >
    Context compaction may remove words but may not remove binding meaning.
  law_23: >
    Every consequential WorkspaceView must be able to prove that its required
    invariants survived projection and re-hydration.
  law_24: >
    Rare constraints should be retrieved when relevant rather than permanently
    bloating every context.
  law_25: >
    Exact persistent-identity resolution precedes fuzzy duplicate detection.
  law_26: >
    Persistent identity must not fragment because autonomous workers chose
    slightly different names.
  law_27: >
    Cognition should see the capabilities relevant to its task and authority,
    not the entire implementation universe.
  law_28: >
    Project doctrine is subordinate to creator authority and canonical truth.
  law_29: >
    Canonical truth does not bend to preserve a stale convention.
  law_30: >
    Coherence repair targets the smallest causal source of divergence.
  law_31: >
    Correctly varied work must not be normalized simply because variation exists.
  law_32: >
    Canon ossification is a coherence failure just as uncontrolled drift is.
  law_33: >
    Observability standards may carry Quantum telemetry but cannot define
    Quantum's internal semantics.
  law_34: >
    Procedural capability acquisition requires validation before capability promotion.
  law_35: >
    As production scales from 10 to 10,000 decisions, coherence must increasingly
    come from structured state, selective projections, calibrated evaluation,
    reusable identities, and authoritative invariants rather than larger prompts.
  law_36: >
    The goal is not to make every Quantum artifact look the same.
  law_37: >
    The goal is for every artifact to feel intentionally authored by the same
    intelligent studio operating under the same project reality, creative
    constitution, memory, and standard.
