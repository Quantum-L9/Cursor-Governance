# =====================================================================
# 77. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  audience_model:
    - target population is explicit
    - desired experience is explicit
    - multiple audience archetypes supported
    - viewer state changes over playback
    - knowledge, inference, suspicion and emotion separated
    - audience uncertainty represented
    - first-watch and rewatch behavior may differ
  product_model:
    - product proposition explicit
    - hook and premise legibility separate
    - distinctiveness protected
    - first-minute promise modeled
    - audience breadth modeled
    - global accessibility modeled
    - repeatability modeled
    - IP optionality modeled
    - format/platform fit modeled
    - product recommendations evidence-backed
  creator_boundary:
    - explicit project creative intent remains higher authority
    - product recommendations cannot silently rewrite project
    - slow-burn, niche or experimental projects can intentionally violate common product priors
  QC:
    - viewer archetypes usable by AutonomousQC
    - ColdViewer can evaluate without hidden intent
    - RewatchCritic can evaluate reveal fairness
    - product critic can evaluate product promise
  integration:
    - AudienceModel feeds Polycognitive Runtime
    - ProductMarketModel feeds Polycognitive Runtime
    - World audience-disclosure state feeds viewer simulation
    - ProductionIntent receives reception requirements
  learning:
    - prediction error measurable
    - calibration versioned
    - external evidence optional
    - creator authority unchanged by learning
  final: >
    The subsystem must enable Quantum to design not just what is creatively
    interesting, but what intended viewers are likely to experience and what
    makes the resulting entertainment product compelling, distinctive and
    sustainable.
# =====================================================================
# 78. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Target market is not the AudienceModel.
  law_02: >
    AudienceModel equals WHO + EXPERIENCE + INTERPRETATION + VIEWING CONTEXT.
  law_03: >
    "Entertained", "comforted", "educated", "frightened" and "blown away" are
    different design targets.
  law_04: >
    Viewer response is probabilistic, heterogeneous and temporal.
  law_05: >
    Audience interpretation never becomes fictional World truth.
  law_06: >
    ProductMarketModel evaluates the entertainment product, not marketing operations.
  law_07: >
    Concept legibility does not require narrative simplicity.
  law_08: >
    Product intelligence should sharpen identity, not erase it.
  law_09: >
    Explicit creator intent outranks audience or product optimization.
  law_10: >
    First-minute promise matters, but the form of that promise must respect
    creative intent.
  law_11: >
    Distinctiveness is a product asset.
  law_12: >
    Narrow intense appeal may be more valuable than broad weak appeal.
  law_13: >
    Global accessibility means removing unnecessary barriers, not cultural specificity.
  law_14: >
    Repeatability measures whether the dramatic engine can continue producing
    value without repetition.
  law_15: >
    Persistent characters and worlds create product option value.
  law_16: >
    Franchise optionality is valuable when relevant, never mandatory.
  law_17: >
    ColdViewer, InformedCritic and RewatchCritic represent fundamentally
    different evaluative perspectives.
  law_18: >
    Audience/Product Intelligence proposes and predicts; it does not own creative authority.
  law_19: >
    Audience and product models should improve through calibrated evidence
    rather than becoming increasingly confident from their own predictions.
  law_20: >
    Quantum should make work that is simultaneously faithful to creator intent,
    compelling to intended viewers, and strong enough as an entertainment
    product to deserve attention.

This gives 04 a clean internal split:

AUDIENCE INTELLIGENCE
WHO watches?
        +
WHAT should happen to them?
        +
HOW are they likely to interpret it?
        +
HOW does that evolve over playback?
PRODUCT INTELLIGENCE
What is the product promise?
Is it legible?
Is it distinctive?
Does it earn attention?
Can it sustain more stories?
Does it have durable identity?

And the authority chain stays intact:

CreatorModel
     │
     │ highest creative authority
     ▼
AudienceModel + ProductMarketModel
     │
     │ predictions / recommendations
     ▼
Polycognitive Runtime
     │
     ▼
proposal / disagreement / branch
     │
     ▼
Autonomous QC

I’d consider 04 about 98% architecturally complete. The main future uncertainty is not conceptual architecture; it is calibration—how good synthetic viewer models become, what real-world audience evidence you eventually choose to ingest, and how much live market evidence you want the ProductMarketModel to use.
