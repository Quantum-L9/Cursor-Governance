  - id: AP-G06
    check: ProductMarketModel cannot mutate CreatorModel
  - id: AP-G07
    check: explicit CreatorModel lock outranks product recommendation
  - id: AP-G08
    check: ProductMarketModel evaluates product rather than back-office marketing
  - id: AP-G09
    check: concept legibility separated from story simplicity
  - id: AP-G10
    check: distinctiveness protected against generic optimization
  - id: AP-G11
    check: first-minute promise evaluated relative to CreatorModel
  - id: AP-G12
    check: repeatability/IP optionality evaluated without forcing franchise design
  - id: AP-G13
    check: global accessibility does not require cultural flattening
  - id: AP-G14
    check: ColdViewer/InformedCritic/RewatchCritic model definitions available
  - id: AP-G15
    check: viewer simulation exposes uncertainty/calibration
  - id: AP-G16
    check: audience/product signals integrate with Polycognitive Runtime
  - id: AP-G17
    check: Audience/Product outputs usable by AutonomousQC
  - id: AP-G18
    check: ProductionIntent receives audience/product requirements without provider choices
  - id: AP-G19
    check: audience/product model versions invalidate incrementally
  - id: AP-G20
    check: model calibration cannot modify creator authority
# =====================================================================
# 72. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  audience:
    - AudienceModel supports multi-segment audiences
    - multiple ViewerArchetypes available
    - target experience is first-class
    - emotional trajectory represented
    - cognitive/information trajectory represented
    - ambiguity/exposition/inference tolerance represented
    - viewing context represented
    - accessibility represented
    - audience risks typed
    - confidence represented
  product:
    - ProductMarketModel exists
    - concept legibility modeled
    - hook strength modeled
    - distinctiveness modeled
    - product identity modeled
    - first-minute promise modeled
    - audience breadth modeled
    - global accessibility modeled
    - repeatability modeled
    - World/character IP optionality modeled
    - format/platform fit modeled
    - production sustainability represented
  authority:
    - CreatorModel remains higher creative authority
    - product recommendations are advisory
    - AudienceModel predictions never become World truth
  cognition:
    - audience cognition operators available
    - product cognition operators available
    - audience/product signals available
  QC:
    - ColdViewer available
    - InformedCritic available
    - RewatchCritic available
    - product critic inputs available
  learning:
    - audience observations capture calibration evidence
    - product outcomes capture prediction divergence
    - models are versioned
    - no automatic creator-authority changes
  flexibility:
    - sophisticated adult sci-fi works
    - preschool works
    - educational works
    - experimental work works
    - self-contained art may intentionally score low on franchise optionality without being penalized as low creative quality
  release:
    requirement: >
      AP-G01 through AP-G20 pass and no ownership conflict exists with specs
      00, 01, 02 or 03.
