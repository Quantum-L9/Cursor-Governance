# =====================================================================
# 70. END-TO-END TESTS
# =====================================================================
end_to_end_tests:
  cinematic_AI_VR_project:
    project_seed: >
      Maximum cinematic space setting. Artificial-intelligence beings inside a
      physically impossible virtual reality.
    creator_experience_target: >
      Adults who love ambitious sci-fi; blow them away and leave them thinking
      about it for two days.
    sequence:
      - consume CreatorModel
      - normalize audience seed
      - resolve sophisticated adult sci-fi profile
      - generate PrimaryTargetViewer
      - generate GenreExpert
      - generate CasualViewer
      - generate EmotionFirstViewer
      - compile desired awe/wonder/intellectual stimulation trajectory
      - compile information tolerance
      - compile ProductMarketModel
      - score concept legibility
      - score distinctiveness
      - score first-minute promise
      - score world expandability
      - score AI character IP potential
      - emit audience/product signals
      - feed runtime DecisionFrames
      - test MVP
      - compare ColdViewer and RewatchCritic
      - produce model revisions
    success:
      - project remains creatively unusual
      - audience model does not flatten ambiguity
      - product model identifies unique promise
      - first-minute recommendations preserve slow/cinematic intent where required
  preschool_project:
    input:
      audience: preschool children with parent co-viewing
      experience: comfort, delight, imagination
    success:
      - emotional safety becomes high priority
      - ambiguity tolerance lowers
      - character readability increases
      - product repeatability evaluates recurring patterns
      - system does not inherit adult-scifi priors
  educational_project:
    input:
      target: middle-school learners
      experience:
        - fascinated
        - confident
        - entertained
      learning_goal: orbital mechanics
    success:
      - AudienceModel models cognitive load
      - ProductMarketModel models repeatable educational entertainment value
      - learning accuracy remains hard project constraint
      - entertainment target remains first-class
