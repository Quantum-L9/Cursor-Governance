          - PROOF_OF_FILM
          - CURATED_PROJECT
          - COMMERCIAL
          - PRODUCTION_PORTAL
      content_scope_ref:
      active_surface_ref:
      ControllerSession_ref:
      DisplaySession_refs:
      playback_state_ref:
      accessibility_state_ref:
      language_state_ref:
      started_at:
      last_activity_at:
      state:
        enum:
          - CREATED
          - SURFACE_SELECTION
          - READY
          - PRESENTING
          - PAUSED
          - HANDOFF
          - DEGRADED
          - COMPLETED
          - EXPIRED
          - REVOKED
