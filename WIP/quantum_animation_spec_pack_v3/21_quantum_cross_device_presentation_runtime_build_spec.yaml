          - READY
          - DEGRADED
          - UNAVAILABLE
          - DISCONNECTED
          - BLOCKED
      network_quality:
      media_buffer_health:
      video_decode_health:
      audio_health:
      full_screen_state:
      thermal_or_power_issue:
        nullable: true
      last_heartbeat:
      normalized_error:
        nullable: true
# =====================================================================
# 7. PRESENTATION TOPOLOGY
# =====================================================================
presentation_topology:
  PresentationTopology:
    fields:
      topology_id:
      authenticated_source_session_ref:
      source_device_ref:
      controller_session_ref:
      render_surface_refs:
      primary_render_surface_ref:
      secondary_surface_refs:
      presentation_mode:
      presentation_strategy_ref:
      active_display_grant_refs:
      content_scope:
      playback_state_ref:
      privacy_context:
      created_at:
      updated_at:
      provenance_ref:
  default:
    primary_render_surface_count: 1
  future:
    multi_surface_installation_supported: true
    default_enabled: false
# =====================================================================
# 8. PRESENTATION STRATEGY
# =====================================================================
presentation_strategy:
  PresentationStrategy:
    fields:
      strategy_id:
      source_session_ref:
      candidate_surfaces:
      selected_surface_ref:
      selected_mode:
      expected_quality:
      expected_friction:
      privacy_score:
      network_score:
      audio_score:
      visual_score:
      security_score:
      overall_score:
      rationale:
      confidence:
  conceptual_objective: >
    maximize(
      cinematic_quality
      + privacy
      + reliability
      + ease
    )
    -
    (
      friction
      + failure_risk
      + security_risk
    )
  rule: >
    Presentation strategy never overrides the recipient's explicit surface choice.
# =====================================================================
# 9. PRESENTATION QUALITY
# =====================================================================
presentation_quality:
  PresentationQualityScore:
    fields:
      visual_resolution:
      effective_screen_size:
      color_quality:
      motion_quality:
      audio_quality:
      audio_presence:
      subtitle_legibility:
      lighting_environment:
        nullable: true
      buffering_risk:
      privacy:
      overall_cinematic_quality:
      confidence:
  recommendation:
    large_screen_not_automatic: true
# =====================================================================
# 10. SOURCE DEVICE ROLE
# =====================================================================
source_device:
  SourceDeviceRole:
    fields:
      device_ref:
      AuthenticationSession_ref:
      may_control:
      may_render:
      may_authorize_pairing:
      may_receive_playback_state:
      may_revoke_display:
      session_expiry:
      security_state:
  default_phone_role:
    - possession_authenticator
    - controller
    - pairing_authorizer
    - fallback_renderer
# =====================================================================
# 11. CONTROLLER SESSION
# =====================================================================
controller_session:
  ControllerSession:
    fields:
      controller_session_id:
      AuthenticationSession_ref:
      device_ref:
      PresentationSession_ref:
      capabilities:
        - PLAY
        - PAUSE
        - SEEK
        - RESUME
        - PRESENT
        - MOVE_PRESENTATION
        - END_PRESENTATION
        - REVOKE_DISPLAY
      issued_at:
      expires_at:
      state:
      provenance_ref:
  rule: >
    Controller capability is narrower than project-access authority.
# =====================================================================
# 12. QUANTUM PAIR
# =====================================================================
quantum_pair:
  canonical_name: QuantumPair
  definition: >
    A zero-secret-typing protocol that lets an authenticated Quantum session
    authorize a separate browser display through an ephemeral challenge.
  canonical_flow: |
    LARGE SCREEN
        ↓
    open QAS presentation entry
        ↓
    PairingChallenge generated
        ↓
    ephemeral QR displayed
        ↓
    authenticated phone scans challenge
        ↓
    spec 20 validates source session
        ↓
    recipient approves target display
        ↓
    PairingAuthorization
        ↓
    DisplayGrant
        ↓
    large screen session activates
        ↓
    presentation continues there
  properties:
    - no_password
    - no_long_code
    - no_email
    - no_QAS_account
    - no_app
    - challenge_short_lived
    - challenge_single_use_by_default
    - source_session_required
# =====================================================================
# 13. PAIRING CHALLENGE
# =====================================================================
pairing_challenge:
  PairingChallenge:
    fields:
      challenge_id:
      target_surface_ref:
      presentation_entry_ref:
      random_nonce:
        storage_class: EPHEMERAL_SECURITY
      created_at:
      expires_at:
      requested_capability:
        enum:
          - DISPLAY_PROOF
          - DISPLAY_CURATED_EXPERIENCE
          - DISPLAY_PRODUCTION_PORTAL
      display_context_summary:
      consumed_at:
        nullable: true
      state:
        enum:
          - OPEN
          - CONSUMED
          - EXPIRED
          - CANCELLED
  QR_payload:
    contains:
      - challenge_locator
    must_not_contain:
      - Quantum_Key_secret
      - project_bearer_token
      - long_lived_session_secret
  default_lifetime:
    short: true
    exact_seconds:
      status: OPEN_DECISION
# =====================================================================
# 14. PAIRING AUTHORIZATION
# =====================================================================
pairing_authorization:
  PairingAuthorization:
    fields:
      authorization_id:
      pairing_challenge_ref:
      source_AuthenticationSession_ref:
      source_ControllerSession_ref:
      target_surface_ref:
      approved_by_recipient:
      requested_scope:
      resulting_scope:
      expires_at:
      security_policy_ref:
      evidence_refs:
      provenance_ref:
  requirements:
    - valid_authenticated_source_session
    - challenge_OPEN
    - challenge_not_expired
    - target_surface_match
    - scope_not_greater_than_source
    - explicit_recipient_approval
# =====================================================================
# 15. DISPLAY GRANT
# =====================================================================
display_grant:
  DisplayGrant:
    fields:
      display_grant_id:
      PairingAuthorization_ref:
      source_session_ref:
      target_surface_ref:
      project_id:
      experience_ref:
      permitted_content_scope:
      permitted_operations:
      issued_at:
      expires_at:
      single_display:
      revocable:
      resource_grant_policy_ref:
      session_watermark_seed_ref:
      provenance_ref:
  forbidden_capabilities:
    - change_project_access_scope
    - create_new_Quantum_Key
    - sign_contract
    - reveal_unavailable_offer
    - download_raw_project_archive
# =====================================================================
# 16. DISPLAY SESSION
# =====================================================================
display_session:
  DisplaySession:
    extends:
      - 10.CanonicalObject
    object_class:
      value: EXECUTION_STATE
    fields:
      display_session_id:
      DisplayGrant_ref:
      PresentationSession_ref:
      surface_ref:
      opened_at:
      last_heartbeat:
      expires_at:
      local_control_policy:
      playback_state_ref:
      current_content_ref:
        nullable: true
      current_module_ref:
        nullable: true
      full_screen_state:
      quality_state:
      state:
        enum:
          - INITIALIZING
          - READY
          - PRESENTING
          - PAUSED
          - DEGRADED
          - DISCONNECTED
          - EXPIRED
          - REVOKED
