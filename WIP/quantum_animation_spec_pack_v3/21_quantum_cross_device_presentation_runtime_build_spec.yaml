# =====================================================================
# 62. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Authenticate on the device best suited to physical possession; present on the
    device best suited to cinema.
  law_02: >
    The phone may be the control plane without being the render plane.
  law_03: >
    Moving to a large screen requires no password, copied token or emailed link.
  law_04: >
    QuantumPair transfers temporary presentation authority, not the Quantum Key.
  law_05: >
    The pairing QR is a challenge, not a project credential.
  law_06: >
    A paired display receives only the scope already authorized to the source session.
  law_07: >
    The large display should stream protected media directly whenever practical.
  law_08: >
    Native presentation technologies are adapters, not architecture.
  law_09: >
    QuantumPair is the universal browser-native fallback.
  law_10: >
    Quantum never silently takes over a nearby screen.
  law_11: >
    The recipient confirms where confidential material will appear.
  law_12: >
    Screen size alone does not determine presentation quality.
  law_13: >
    Audio is as important as picture in selecting a cinematic surface.
  law_14: >
    Accessibility state follows the experience across devices.
  law_15: >
    Playback position is logical project state, not a property of one device.
  law_16: >
    A failed big screen must never strand the authenticated viewer.
  law_17: >
    Presentation failure is an execution defect, not a creative change.
  law_18: >
    Cross-device convenience can never enlarge content authority.
  law_19: >
    Corporate compatibility comes from ordinary secure browser infrastructure.
  law_20: >
    The ideal handoff feels magical because the infrastructure underneath it is boring.
