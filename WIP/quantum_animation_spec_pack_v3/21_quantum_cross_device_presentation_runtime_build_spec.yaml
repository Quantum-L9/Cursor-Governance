      native_protocol_context:
        nullable: true
      capability_profile_ref:
      privacy_context:
      owner_confirmation_state:
      health_ref:
      last_seen_at:
      ephemeral_identity:
      evidence_refs:
# =====================================================================
# 5. SURFACE CAPABILITY PROFILE
