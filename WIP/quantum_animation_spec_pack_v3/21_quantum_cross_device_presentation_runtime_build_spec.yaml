# =====================================================================
# 60. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: cinematic Proof trapped on phone
    control:
      - QuantumPair
      - native adapters
  - risk: pairing becomes second login flow
    control:
      - source-auth delegation
      - no account
      - no typed secret
  - risk: display grant becomes bearer credential
    control:
      - short_lived
      - display_bound
      - scope_bound
  - risk: wrong conference-room display selected
    control:
      - target confirmation
      - no silent playback
  - risk: native protocol creates vendor lock-in
    control:
      - normalized adapter
      - QuantumPair universal fallback
  - risk: phone mirroring lowers quality
    control:
      - direct-display streaming
  - risk: corporate firewall blocks display
    control:
      - source device remains valid
      - alternate presentation route
  - risk: playback fails during crucial beat
    control:
      - logical pause
      - resume point
      - prebuffer
  - risk: maximum screen size treated as quality
    control:
      - PresentationQualityScore
  - risk: telemetry becomes device fingerprinting
    control:
      - ephemeral surface identity
      - minimal capabilities only
  - risk: cross-device grant escalates project scope
    control:
      - scope intersection with source session
