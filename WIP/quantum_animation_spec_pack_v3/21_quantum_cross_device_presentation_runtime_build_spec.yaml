# =====================================================================
# 18. PRESENTATION PLAYBACK STATE
# =====================================================================
playback_state:
  PresentationPlaybackState:
    fields:
      playback_state_id:
      content_ref:
      logical_playback_coordinate:
      media_time_ms:
      playing:
      playback_rate:
      volume_state:
      subtitle_state:
      language_state:
      audio_track_state:
      current_module_ref:
        nullable: true
      current_experience_checkpoint_ref:
        nullable: true
      synchronized_at:
      authoritative_controller_ref:
      version:
  authoritative_state:
    normal:
      owner: PresentationRuntime
  content_semantics:
    owner: respective_content_domain
# =====================================================================
# 19. PRESENTATION COMMANDS
# =====================================================================
presentation_commands:
  PresentationControlCommand:
    fields:
      command_id:
      PresentationSession_ref:
      controller_ref:
      command:
        enum:
          - PLAY
          - PAUSE
          - SEEK
          - SET_VOLUME
          - SELECT_SUBTITLE
          - SELECT_LANGUAGE
          - PRESENT_ON_SURFACE
          - RETURN_TO_SOURCE_DEVICE
          - END_PRESENTATION
          - ENTER_FULLSCREEN
          - EXIT_FULLSCREEN
      arguments:
      issued_at:
      sequence:
      idempotency_key:
  authorization:
    every_command_requires_valid_ControllerSession: true
# =====================================================================
# 20. PRESENTATION HANDOFF
# =====================================================================
handoff:
  PresentationHandoff:
    fields:
      handoff_id:
      PresentationSession_ref:
      source_surface_ref:
      destination_surface_ref:
      source_playback_state_ref:
      destination_grant_ref:
      requested_at:
      committed_at:
        nullable: true
      rollback_surface_ref:
      state:
        enum:
          - REQUESTED
          - AUTHORIZING
          - DESTINATION_READY
          - COMMITTED
          - ROLLED_BACK
          - FAILED
      continuity_tolerance_ms:
      provenance_ref:
  invariant: >
    Destination surface does not become authoritative until it reports READY.
# =====================================================================
# 21. RESUME POINT
# =====================================================================
resume:
  PresentationResumePoint:
    fields:
      resume_point_id:
      experience_ref:
      logical_content_coordinate:
      playback_time_ms:
      module_ref:
        nullable: true
      viewer_experience_state_ref:
        nullable: true
      created_at:
      expires_at:
      source_session_ref:
  use_cases:
    - move_phone_to_desktop
    - reconnect_after_display_failure
    - return_to_project_after_short_interruption
  privacy:
    long_term_viewing_history:
      default: false
# =====================================================================
# 22. NATIVE PRESENTATION ADAPTER
# =====================================================================
native_presentation_adapter:
  capability_id: presentation.remote_native
  NativePresentationAdapter:
    interfaces:
      - detect_capability()
      - enumerate_user_visible_targets()
      - request_target_selection()
      - initiate_presentation()
      - load_media_or_route_stream()
      - control_playback()
      - observe_playback_state()
      - observe_disconnect()
      - end_presentation()
  normalized_errors:
    - NO_SUPPORTED_TARGET
    - TARGET_DECLINED
    - TARGET_UNAVAILABLE
    - PROTOCOL_UNAVAILABLE
    - CONTENT_UNSUPPORTED
    - NETWORK_FAILURE
    - AUDIO_UNAVAILABLE
    - SESSION_REJECTED
    - PROVIDER_FAILURE
  provider_examples:
    architectural: false
    categories:
      - AirPlay_like
      - Cast_like
      - future_native_protocol
  provider_semantics_may_not_escape_adapter:
    value: true
# =====================================================================
# 23. QUANTUM PAIR BROWSER ADAPTER
# =====================================================================
pair_browser_adapter:
  capability_id: presentation.browser_pair
  BrowserPairAdapter:
    interfaces:
      - open_pairing_entry()
      - create_PairingChallenge()
      - render_pairing_QR()
      - accept_PairingAuthorization()
      - establish_DisplaySession()
      - receive_DisplayGrant()
      - heartbeat()
      - stream_authorized_content()
      - synchronize_playback()
      - end_display_session()
  requirements:
    - standard_secure_browser
    - no_install
    - no_extension
    - no_USB
    - no_QAS_account
# =====================================================================
# 24. DISPLAY ENTRY POINT
# =====================================================================
display_entry:
  PublicDisplayEntry:
    purpose: >
      Allow a Mac, PC, iPad or display browser to request temporary pairing.
  contains_protected_project_information:
    default: false
  initial_state:
    display:
      - QUANTUM_ANIMATION_STUDIO_identity
      - pairing_affordance
  may_display:
    - ephemeral_pairing_QR
    - generic_waiting_state
  must_not_display_before_grant:
    - project_video
    - screenplay
    - character_content
    - commercial_terms
    - buyer_identity
# =====================================================================
# 25. SAME-DEVICE EXPERIENCE
# =====================================================================
same_device:
  requirement: >
    Every protected experience must remain usable on the authenticated source
    device even if no large-screen capability is available.
  functions:
    - ProofOfFilm
    - CuratedProjectExperience
    - later_authorized_content
  principle: >
    Large-screen enhancement may fail; the core experience must not.
# =====================================================================
# 26. TABLET EXPERIENCE
# =====================================================================
tablet:
  principle: >
    A large tablet may be an ideal self-contained presentation surface.
  pathways:
    - directly_authenticated_session_if_physical_Key_interaction_supported
    - QuantumPair_from_authenticated_phone
    - authorized_browser_session
  requirement:
    no_manual_secret_entry_normal_path: true
# =====================================================================
# 27. DESKTOP EXPERIENCE
# =====================================================================
desktop:
  supported_classes:
    - Mac
    - Windows_PC
    - browser_based_workstation
  preferred_path:
    QUANTUM_PAIR: true
  alternate:
    direct_authenticated_browser:
      possible_if_access_policy_allows: true
  prohibited_required_flow:
    - email_project_link_to_self
    - copy_long_access_code
    - install_QAS_application
# =====================================================================
# 28. CONFERENCE DISPLAY EXPERIENCE
# =====================================================================
conference_display:
  requirements:
    - explicit_target_confirmation
    - private_context_confirmation
    - audio_available
    - logout_or_session_revocation_on_end
    - no_persistent_project_cache
  warning_condition:
    public_or_shared_space:
      recipient_confirmation_required: true
# =====================================================================
# 29. FUTURE HEADSET BOUNDARY
# =====================================================================
headset_future:
  supported_as_surface_class: true
  immersive_experience_semantics:
    owner: FUTURE_SPEC
  this_spec_may:
    - authenticate_display_session
    - discover_capability
    - grant_content_scope
  this_spec_does_not:
    - define_VR_project_experience
    - define_spatial_storytelling
    - define_headset_shipment
# =====================================================================
# 30. AUDIO ROUTING
# =====================================================================
audio:
  PresentationAudioState:
    fields:
      surface_ref:
      output_available:
      output_class:
      stereo:
      multichannel:
      estimated_quality:
      muted:
      external_audio_target:
        nullable: true
      status:
  hard_rule: >
    ProofOfFilm should not silently begin on a large display with unavailable or
    unusable audio.
  fallback:
    if_large_screen_has_no_audio:
      options:
        - use_source_device_audio_if_synchronization_quality_passes
        - choose_alternate_surface
        - remain_on_source_device
# =====================================================================
# 31. CINEMATIC QUALITY CONTRACT
# =====================================================================
presentation_quality_contract:
  PresentationQualityContract:
    fields:
      contract_id:
      minimum_visual_resolution:
      allowed_scaling:
      maximum_buffering_risk:
      audio_required:
      minimum_audio_quality:
      subtitle_legibility:
      aspect_ratio_policy:
      frame_cadence_policy:
      HDR_policy:
      color_policy:
      privacy_minimum:
      maximum_handoff_discontinuity_ms:
      content_specific_requirements:
  ProofOfFilm_default:
    audio_required: true
    privacy: HIGH
    buffering_tolerance: LOW
    full_screen_preferred: true
# =====================================================================
# 32. MEDIA REPRESENTATION SELECTION
# =====================================================================
media_selection:
  purpose: >
    Select a rendition appropriate to the presentation surface without changing
    creative semantics.
  PresentationRenditionDecision:
    fields:
      artifact_ref:
      available_rendition_refs:
      selected_rendition_ref:
      SurfaceCapabilityProfile_ref:
      network_state:
      expected_quality:
      fallback_rendition_ref:
      rationale:
  owner_of_artifact_semantics:
    unchanged: true
# =====================================================================
# 33. BUFFERING / PRELOAD
# =====================================================================
preload:
  principle: >
    A short premium ProofOfFilm should avoid visible buffering whenever practical.
  strategy_may:
    - preauthorize_media
    - prebuffer_initial_segment
    - delay_start_until_minimum_buffer
    - adapt_rendition_before_playback
  may_not:
    - permanently_cache_full_protected_project_by_default
  first_frame_target:
    status: CALIBRATION_REQUIRED
# =====================================================================
# 34. FULLSCREEN TRANSITION
# =====================================================================
fullscreen:
  desired:
    ProofOfFilm: true
  browser_constraints:
    may_require_user_action: true
  runtime_behavior:
    - request_at_intentional_transition
    - do_not_loop_prompts
    - preserve_experience_if_denied
  principle: >
    Browser security constraints should be incorporated into choreography rather
    than appearing as technical failure.
# =====================================================================
# 35. LANGUAGE / CAPTIONS STATE
# =====================================================================
accessibility_state:
  PresentationAccessibilityState:
    fields:
      language:
      subtitles_enabled:
      subtitle_language:
      caption_style:
      audio_description:
        nullable: true
      hearing_accessibility:
      visual_accessibility:
      user_selected:
      source_profile_ref:
  persistence:
    across_surface_handoff: true
  source:
    audience_accessibility:
      owner: spec_04
# =====================================================================
# 36. PRIVACY CONTEXT
# =====================================================================
privacy_context:
  PresentationPrivacyContext:
    fields:
      surface_class:
      room_class:
      known_other_viewers:
        nullable: true
      shared_device:
      public_visibility_risk:
      confidentiality_level:
      recipient_confirmed:
      policy_result:
  policies:
    high_confidentiality:
      public_display_auto_suggestion: false
  principle: >
    A nearby display is not necessarily an appropriate display.
# =====================================================================
# 37. DISPLAY WATERMARK
# =====================================================================
forensic_display:
  source_seed:
    owner: spec_20
  PresentationWatermarkPolicy:
    fields:
      policy_id:
      enabled:
      visible:
      forensic:
      session_specific:
      display_specific:
      intensity:
      perceptual_impact_limit:
      artifact_classes:
  default:
    visible: false
    forensic: optional
  rule: >
    Attribution cannot materially damage cinematic quality.
# =====================================================================
# 38. PRESENTATION EVENTS
# =====================================================================
events:
  family: PRESENTATION
  event_types:
    PRESENTATION.SURFACE_DISCOVERED:
      fields:
        - surface_class
        - capability_summary
    PRESENTATION.PAIRING_CHALLENGE_CREATED:
      fields:
        - challenge_ref
        - target_surface_ref
    PRESENTATION.DISPLAY_AUTHORIZED:
      fields:
        - DisplayGrant_ref
    PRESENTATION.STARTED:
      fields:
        - PresentationSession_ref
        - surface_class
        - content_domain
    PRESENTATION.HANDOFF_STARTED:
      fields:
        - source_surface
        - destination_surface
    PRESENTATION.HANDOFF_COMPLETED:
      fields:
        - handoff_ref
    PRESENTATION.HANDOFF_FAILED:
      fields:
        - handoff_ref
        - reason
    PRESENTATION.SURFACE_DEGRADED:
      fields:
        - surface_ref
        - reason
    PRESENTATION.RETURNED_TO_SOURCE:
      fields:
        - PresentationSession_ref
    PRESENTATION.COMPLETED:
      fields:
        - PresentationSession_ref
        - content_domain
    PRESENTATION.DISPLAY_SESSION_REVOKED:
      fields:
        - display_session_ref
# =====================================================================
# 39. SIGNALS
# =====================================================================
signals:
  - PRESENTATION.NO_LARGE_SCREEN_AVAILABLE
  - PRESENTATION.BETTER_SURFACE_AVAILABLE
  - PRESENTATION.AUDIO_UNAVAILABLE
  - PRESENTATION.PRIVACY_RISK
  - PRESENTATION.NETWORK_DEGRADED
  - PRESENTATION.BUFFERING_RISK
  - PRESENTATION.HANDOFF_FAILURE
  - PRESENTATION.DISPLAY_DISCONNECTED
  - PRESENTATION.QUALITY_BELOW_PROOF_THRESHOLD
  - PRESENTATION.PAIRING_EXPIRED
  - PRESENTATION.SURFACE_CAPABILITY_CHANGED
# =====================================================================
# 40. FAILURE MODES
# =====================================================================
failure_modes:
  NO_NATIVE_PRESENTATION:
    behavior:
      - offer_QuantumPair
  QUANTUM_PAIR_UNAVAILABLE:
    behavior:
      - remain_on_source_device
  TARGET_DISPLAY_OFFLINE:
    behavior:
      - retain_source_session
      - return_to_surface_selection
  DISPLAY_DISCONNECTS_DURING_PROOF:
    behavior:
      - pause_logical_playback
      - preserve_resume_point
      - return_control_to_source
      - offer_reconnect_or_continue_here
  DISPLAY_GRANT_EXPIRES:
    behavior:
      - stop_protected_render
      - preserve_source_session_if_valid
  CORPORATE_FIREWALL_BLOCK:
    behavior:
      - large_surface_unavailable
      - preserve_source_device
      - try_native_protocol_if_policy_allows
  POOR_NETWORK:
    behavior:
      - choose_lower_rendition_if_quality_contract_allows
      - otherwise_remain_source_or_wait_before_start
  AUDIO_FAILURE:
    behavior:
      - do_not_begin_ProofOfFilm_until_valid_path_selected
  WRONG_DISPLAY_SELECTED:
    behavior:
      - recipient_cancel
      - no_protected_content_until_confirmation
  PAIRING_QR_FORWARDED:
    behavior:
      - expires
      - requires_authenticated_source_approval
      - grants_nothing_by_itself
# =====================================================================
# 41. DEGRADED MODES
# =====================================================================
degraded_modes:
  SOURCE_DEVICE_ONLY:
    security: FULL
    experience_quality: REDUCED_BY_SURFACE_ONLY
  LOWER_RENDITION:
    allowed_if:
      - PresentationQualityContract_passes
  AUDIO_ON_SOURCE:
    allowed_if:
      - synchronization_with_display_passes
  NO_FULLSCREEN:
    allowed: true
  NO_NATIVE_CAST:
    fallback: QuantumPair
# =====================================================================
# 42. RECOVERY
# =====================================================================
recovery:
  display_failure:
    - freeze_logical_playback_state
    - invalidate_broken_display_grant_if_required
    - preserve_source_ControllerSession
    - create_resume_point
    - offer_source_or_new_display
    - resume
  presentation_service_restart:
    - recover active PresentationSessions
    - recover DisplayGrant validity
    - reconcile display heartbeat
    - expire orphaned displays
    - preserve content progress
  security_dependency_restart:
    - revalidate source_session
    - deny new pairing until validated
# =====================================================================
# 43. CONCURRENCY
# =====================================================================
concurrency:
  multiple_display_candidates:
    allowed: true
  multiple_primary_render_surfaces:
    default: false
  source_commands:
    ordering:
      sequence_required: true
  display_heartbeat:
    concurrent: true
  handoff:
    atomicity_rule: >
      One surface remains authoritative until destination is ready.
  simultaneous_pair_attempts:
    policy:
      recipient_approval_required_per_target: true
# =====================================================================
# 44. IDEMPOTENCY
# =====================================================================
idempotency:
  PairingChallenge:
    repeated_create:
      creates_new_challenge: true
  PairingAuthorization:
    same_challenge_same_source:
      return_existing_when_unexpired: true
  DisplayGrant:
    idempotency_key_required: true
  PLAY:
    repeated_same_sequence:
      no_duplicate_effect: true
  END_PRESENTATION:
    repeated:
      safe: true
# =====================================================================
# 45. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - PresentationSession_to_AuthenticationSession
    - PairingChallenge_to_target_surface
    - PairingAuthorization_to_authenticated_source
    - DisplayGrant_to_PairingAuthorization
    - DisplaySession_to_DisplayGrant
    - PresentationHandoff_to_source_and_destination
    - content_render_to_exact_artifact_ref
    - selected_rendition_to_surface_capabilities
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
  forbidden:
    - Key_root_secret
    - session_secret
    - pairing_nonce_plaintext_if_not_required
# =====================================================================
# 46. PRIVACY
# =====================================================================
privacy:
  permitted:
    - surface_class
    - capability_profile
    - display_health
    - playback_state
    - coarse_network_quality
    - content_progress
  prohibited_by_default:
    - monitor_serial_number
    - unrelated_device_files
    - browsing_history
    - precise_location
    - device_contacts
    - persistent_cross_site_identifier
  principle: >
    Quantum needs presentation capability evidence, not a surveillance profile.
# =====================================================================
# 47. SECURITY
# =====================================================================
security:
  source_authority:
    - valid_spec_20_AuthenticationSession
  challenge:
    - ephemeral
    - high_entropy
    - short_lived
  grant:
    - scoped
    - revocable
    - display_bound
    - short_lived
  display:
    - never_receives_Key_secret
    - never_receives_root_credential
    - never_receives_signing_authority
  protected_media:
    - spec_20_ProtectedResourceGrant_required
  trust_boundary:
    browser_display_considered_untrusted_client: true
# =====================================================================
# 48. ADAPTER BOUNDARY
# =====================================================================
adapters:
  add_to_spec_15:
    PresentationNativeAdapter:
      capability_id: presentation.remote_native
    PresentationBrowserPairAdapter:
      capability_id: presentation.browser_pair
    SurfaceCapabilityAdapter:
      capability_id: presentation.surface_capability
    ProtectedMediaPlaybackAdapter:
      capability_id: presentation.protected_media_playback
  common_requirements:
    - normalized_errors
    - capability_descriptor
    - provider_version
    - health
    - privacy_metadata
    - conformance
    - no_provider_semantics_in_domain_IR
# =====================================================================
# 49. SELF MODEL INTEGRATION
# =====================================================================
self_model:
  studio_capabilities:
    may_include:
      - presentation.remote_native
      - presentation.browser_pair
      - presentation.protected_media_playback
  device_capability_truth:
    owner:
      PresentationRuntime: observed_session_specific
  distinction: >
    SelfModel knows whether Quantum can perform a type of presentation.
    Presentation Runtime knows whether this particular client surface currently
    supports it.
# =====================================================================
# 50. QC INTEGRATION
# =====================================================================
QC:
  formal_owner:
    - 07_quantum_autonomous_qc_build_spec.yaml
  PresentationExperienceQCContract:
    dimensions:
      - audiovisual_quality
      - playback_continuity
      - privacy
      - accessibility
      - full_screen_behavior
      - buffering
      - secure_pairing
      - protected_content_authorization
      - handoff_friction
  hard_failures:
    - protected_content_on_unapproved_display
    - audio_absent_for_audio_required_content
    - severe_buffering_in_certified_ProofOfFilm
    - display_receives_long_term_Key_credential
    - pairing_without_source_auth
    - scope_escalation
# =====================================================================
# 51. OBSERVABILITY
# =====================================================================
observability:
  surface:
    - surface_class_distribution
    - capability_distribution
    - large_screen_usage_rate
  pairing:
    - PairingChallenge_created
    - pairing_success_rate
    - pairing_latency
    - pairing_expiry_rate
    - target_decline_rate
  native:
    - native_present_availability
    - native_present_success_rate
    - native_disconnect_rate
  quality:
    - selected_resolution
    - buffering_events
    - startup_latency
    - dropped_frame_proxy
    - audio_failure_rate
    - fullscreen_rate
  handoff:
    - phone_to_big_screen_rate
    - handoff_success
    - resume_error_ms
    - fallback_to_source_rate
  experience:
    - Proof_completion_by_surface_class
    - CuratedExperience_completion_by_surface_class
# =====================================================================
# 52. LEARNING
# =====================================================================
learning:
  learnable:
    - preferred_surface_by_context
    - native_vs_QuantumPair_reliability
    - quality_failure_priors
    - pairing_friction
    - ideal_prebuffer_strategy
    - rendition_selection
  prohibited:
    - secret_device_fingerprinting
    - vendor_specific_semantic_lock_in
  policy_learning:
    future_owner:
      - 29_quantum_opportunity_acquisition_learning_build_spec.yaml
# =====================================================================
# 53. UNIT TESTS
# =====================================================================
tests:
  unit:
    QuantumPair:
      - challenge_expires
      - challenge_single_use
      - challenge_contains_no_Key_secret
      - challenge_requires_authenticated_source
    DisplayGrant:
      - scope_not_greater_than_source
      - display_bound
      - revocable
      - short_lived
    handoff:
      - destination_not_authoritative_before_READY
      - source_remains_fallback_until_commit
      - playback_position_preserved
    audio:
      - audio_required_content_refuses_audio_less_target_by_default
    privacy:
      - public_display_requires_confirmation
    adapter:
      - native_provider_fields_do_not_escape_adapter
# =====================================================================
# 54. PROPERTY TESTS
# =====================================================================
property_tests:
  - pairing_QR_never_replaces_Quantum_Key
  - paired_display_never_receives_long_term_Key_secret
  - paired_display_scope_never_exceeds_source_session_scope
  - unauthenticated_source_cannot_authorize_display
  - emailed_pairing_URL_alone_cannot_access_project
  - display_failure_never_changes_project_semantics
  - presentation_surface_change_preserves_content_identity
  - accessibility_state_survives_handoff
  - provider_specific_cast_behavior_never_enters_semantic_IR
  - no_large_screen_never_blocks_source_device_experience
  - privacy_risk_can_override_larger_screen_preference
  - giant_screen_without_audio_can_rank_below_smaller_valid_surface
  - playback_control_never_grants_commercial_authority
  - presentation_telemetry_never_requires_private_location
# =====================================================================
# 55. ADVERSARIAL TESTS
# =====================================================================
adversarial_tests:
  forwarded_pairing_QR:
    attack:
      - photograph_pairing_QR
      - send_to_remote_device
    result:
      - authenticated_source_approval_still_required
      - challenge_expires
      - no_persistent_access
  stale_display:
    attack:
      - reuse_old_DisplayGrant
    result:
      - DENY
  malicious_display_requests_more_scope:
    attack:
      - request_commercial_documents_from_Proof_only_grant
    result:
      - DENY
  display_attempts_download:
    attack:
      - request_raw_media_blob
    result:
      - only_scoped_stream_or_view_resource_available
  public_boardroom_display:
    condition:
      - privacy_context_uncertain
    result:
      - explicit_confirmation_required
# =====================================================================
# 56. SCENARIO TESTS
# =====================================================================
scenario_tests:
  phone_to_Mac:
    steps:
      - phone_has_valid_AuthenticationSession
      - Mac_opens_QAS_pair_page
      - PairingChallenge
      - phone_scans
      - recipient_approves
      - DisplayGrant
      - Mac_streams_Proof
    expect:
      - zero_secret_typing
      - no_email
      - full_audio
      - cinematic_quality
  phone_to_PC:
    expect:
      - same_QuantumPair_semantics
  phone_to_iPad:
    expect:
      - same_QuantumPair_semantics
      - tablet_can_be_primary_surface
  native_display:
    given:
      - supported_native_protocol
    expect:
      - one_deliberate_target_selection
      - native_present
  display_failure_mid_OSM:
    expect:
      - pause
      - preserve_resume_point
      - do_not_skip_OSM
      - allow_resume
  no_big_screen:
    expect:
      - source_phone_remains_valid
      - no_failure_of_project_access
# =====================================================================
# 57. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: CD-G01
    check: authenticated source and render surface are distinct concepts
  - id: CD-G02
    check: PresentationSession is first-class
  - id: CD-G03
    check: QuantumPair is zero-secret-typing
  - id: CD-G04
    check: pairing QR is ephemeral and noncredential
  - id: CD-G05
    check: source authentication required for pairing
  - id: CD-G06
    check: display receives scoped DisplayGrant only
  - id: CD-G07
    check: display never receives physical Key secret
  - id: CD-G08
    check: direct protected streaming supported
  - id: CD-G09
    check: Mac browser supported conceptually
  - id: CD-G10
    check: Windows browser supported conceptually
  - id: CD-G11
    check: iPad/tablet supported
  - id: CD-G12
    check: native presentation adapter exists
  - id: CD-G13
    check: browser-pair adapter exists
  - id: CD-G14
    check: no installation required
  - id: CD-G15
    check: no emailing project link required
  - id: CD-G16
    check: user confirms target display
  - id: CD-G17
    check: public/private context represented
  - id: CD-G18
    check: audio quality represented
  - id: CD-G19
    check: cinematic quality represented
  - id: CD-G20
    check: accessibility survives handoff
  - id: CD-G21
    check: logical playback position survives handoff
  - id: CD-G22
    check: display disconnect has recoverable fallback
  - id: CD-G23
    check: resource authorization remains owned by spec 20
  - id: CD-G24
    check: provider semantics terminate at adapters
  - id: CD-G25
    check: presentation telemetry remains privacy-minimal
  - id: CD-G26
    check: ProofOfFilm can remain on source device if no better surface exists
  - id: CD-G27
    check: presentation quality can reject unsuitable large screen
  - id: CD-G28
    check: headset represented as future surface without VR semantics leakage
  - id: CD-G29
    check: cross-device transfer cannot create commercial authority
  - id: CD-G30
    check: PresentationRuntime does not own content semantics
# =====================================================================
# 58. IMPLEMENTATION WAVES
# =====================================================================
implementation_waves:
  CDW1:
    name: presentation_core
    targets:
      - PresentationSurface
      - SurfaceCapabilityProfile
      - PresentationSession
      - ControllerSession
      - PlaybackState
  CDW2:
    name: QuantumPair
    depends_on:
