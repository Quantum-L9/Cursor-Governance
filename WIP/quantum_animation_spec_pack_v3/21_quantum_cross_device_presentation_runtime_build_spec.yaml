  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Cross-Device Presentation Runtime
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: PRESENTATION_DECISION_AND_RUNTIME_SIGNAL_DEPENDENCY
    - file: 05_quantum_self_model_build_spec.yaml
      relationship: QUANTUM_PRESENTATION_CAPABILITY_TRUTH_DEPENDENCY
    - file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: PRESENTATION_EXPERIENCE_CERTIFICATION_DEPENDENCY
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
      relationship: PRESENTATION_SESSION_LINEAGE_DEPENDENCY
    - file: 10_quantum_canonical_artifact_ir_build_spec.yaml
      relationship: CANONICAL_PRESENTATION_OBJECT_DEPENDENCY
    - file: 15_quantum_reference_implementation_contracts_build_spec.yaml
      relationship: DISPLAY_CAST_BROWSER_AND_MEDIA_ADAPTER_DEPENDENCY
    - file: 18_quantum_marketability_proof_of_film_build_spec.yaml
      relationship: CERTIFIED_PROOF_MEDIA_DEPENDENCY
    - file: 19_quantum_executive_attention_experience_build_spec.yaml
      relationship: PHYSICAL_PRE_ROLL_EXPERIENCE_DEPENDENCY
    - file: 20_quantum_key_access_security_build_spec.yaml
      relationship: AUTHENTICATED_SESSION_AND_TRANSFER_AUTHORITY_DEPENDENCY
architectural_identity:
  concise: >
    Move a Quantum-authenticated private experience from the device that proves
    physical Key possession to the best available presentation surface without
    typing secrets, emailing links, installing software or weakening the Quantum
    Key security boundary.
  extended: >
    Quantum Cross-Device Presentation Runtime owns the presentation topology
    between an authenticated control device and one or more temporary audiovisual
    presentation surfaces. It allows the recipient to authenticate with a
    physical Quantum Key on a phone and then continue the experience on a Mac,
    Windows PC, iPad, television, conference-room display or other supported
    surface. It supports direct same-device viewing, native presentation
    protocols and Quantum Pair, a browser-native challenge/grant flow in which an
    authenticated source device authorizes a large display without transferring
    the physical Key's long-term credential. The display streams protected
    content directly under a short-lived scoped grant rather than merely becoming
    a passive insecure mirror. Provider-specific AirPlay, Cast, browser, display
    and media behavior terminates at normalized presentation adapters.
ownership:
  system: CROSS_DEVICE_PRESENTATION_RUNTIME
  owner_question:
    primary: >
      Given a valid authenticated Quantum session, what is the highest-quality
      secure surface on which the recipient should experience the project?
  secondary_questions:
    - "Should the experience remain on this device?"
    - "What presentation surfaces are currently available?"
    - "What audiovisual capabilities does each surface expose?"
    - "Can the recipient present on a nearby display?"
    - "Can a Mac, PC or iPad be securely paired?"
    - "How is an authenticated session transferred without exposing the Key credential?"
    - "How do we eliminate manual code entry?"
    - "How do we preserve full audiovisual quality?"
    - "What happens if native casting is unavailable?"
    - "What happens if the corporate device cannot access Quantum?"
    - "What happens if presentation connectivity disappears mid-film?"
    - "Which device remains the control surface?"
    - "Which device renders the actual experience?"
    - "How do we resume at the correct moment after a display change?"
    - "How do we avoid accidentally exposing protected content on the wrong display?"
    - "What should happen when the presentation ends?"
  owns:
    - PresentationRuntime
    - PresentationSession
    - PresentationTopology
    - PresentationSurface
    - PresentationSurfaceProfile
    - SurfaceCapabilityProfile
    - PresentationSurfaceRegistry
    - PresentationMode
    - PresentationStrategy
    - QuantumPair
    - PairingChallenge
    - PairingAuthorization
    - DisplayGrant
    - DisplaySession
    - ControllerSession
    - PresentationControlCommand
    - PresentationPlaybackState
    - PresentationHandoff
    - PresentationResumePoint
    - PresentationSurfaceHealth
    - PresentationRoute
    - PresentationQualityContract
    - PresentationTelemetry
    - presentation adapters
    - native presentation protocol abstraction
    - browser display pairing
    - display-session failover
  explicitly_does_not_own:
    physical_Key_authentication:
      owner: 20_quantum_key_access_security_build_spec.yaml
    physical_packaging:
      owner: 19_quantum_executive_attention_experience_build_spec.yaml
    ProofOfFilm_semantics:
      owner: 18_quantum_marketability_proof_of_film_build_spec.yaml
    CuratedProjectExperience_semantics:
      owner: 22_quantum_curated_project_experience_build_spec.yaml
    StudioAvatar_identity:
      owner: 26_quantum_studio_avatar_identity_build_spec.yaml
    protected_resource_authorization:
      owner: 20_quantum_key_access_security_build_spec.yaml
    CommercialOffer:
      owner: 23_quantum_commercial_offer_conversion_build_spec.yaml
    ProductionPortal:
      owner: 28_quantum_production_portal_client_experience_build_spec.yaml
  hard_boundary: >
    Presentation Runtime decides where and how an already authorized experience
    is rendered. It does not authenticate the physical Key, enlarge content
    permissions, create commercial rights or reinterpret project content.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Make the physical Quantum Key compatible with cinematic-scale presentation
    without forcing the project to remain on the phone used for authentication.
  experiential_goal: >
    The recipient should move from Key authentication to a large, high-quality
    surface with one deliberate action and no credential typing.
  security_goal: >
    Large-screen convenience must preserve the possession-based access model
    established by QuantumKeyAccess.
  compatibility_goal: >
    A Mac, PC, iPad, television or conference display should be usable through
    standards-based browser or native presentation capabilities whenever
    available.
  quality_goal: >
    The large-screen path should improve rather than degrade ProofOfFilm impact.
  canonical_interaction: |
    PHYSICAL QUANTUM KEY
          ↓
    authenticated phone
          ↓
    ACCESS GRANTED
          ↓
    [ PRESENT ON BIG SCREEN ]
          ↓
    select native display
          OR
    Quantum Pair
          ↓
    protected display session
          ↓
    ProofOfFilm / Project Experience
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  CD-001:
    name: AUTHENTICATE_SMALL_PRESENT_LARGE
    statement: >
      The device best suited to physical credential interaction need not be the
      device best suited to cinematic presentation.
  CD-002:
    name: PHONE_IS_CONTROL_PLANE_NOT_REQUIRED_RENDER_PLANE
    statement: >
      A phone may authenticate and control the experience while another device
      renders the audiovisual content directly.
  CD-003:
    name: NO_SECRET_TRANSCRIPTION
    statement: >
      Normal cross-device continuation must not require typing a password,
      sixteen-character token or manually copied pairing secret.
  CD-004:
    name: NO_EMAIL_HANDOFF
    statement: >
      Moving to another screen must not require emailing a protected project
      link to oneself or another person.
  CD-005:
    name: PAIRING_QR_IS_EPHEMERAL
    statement: >
      Quantum Pair may use a temporary QR challenge because the challenge is
      display-specific, short-lived and useless without an already
      authenticated source session.
  CD-006:
    name: PAIRING_QR_IS_NOT_PROJECT_ACCESS
    statement: >
      Photographing or forwarding a Quantum Pair challenge may not grant
      persistent project access.
  CD-007:
    name: DISPLAY_GETS_SCOPED_AUTHORITY
    statement: >
      A paired display receives a short-lived presentation grant, never the
      Quantum Key credential itself.
  CD-008:
    name: DISPLAY_STREAMS_DIRECTLY
    statement: >
      When technically possible, the paired display should retrieve authorized
      media directly from Quantum infrastructure rather than depending on
      phone-screen mirroring.
  CD-009:
    name: DIRECT_STREAMING_PRESERVES_QUALITY
    statement: >
      Presentation architecture should preserve resolution, bitrate, audio
      quality and frame cadence appropriate to the selected surface.
  CD-010:
    name: NATIVE_PRESENTATION_IS_AN_ADAPTER
    statement: >
      AirPlay, Cast and future presentation technologies are implementation
      capabilities behind replaceable adapters.
  CD-011:
    name: QUANTUM_PAIR_IS_UNIVERSAL_FALLBACK
    statement: >
      A standards-based browser pairing path should remain available when no
      supported native presentation protocol exists.
  CD-012:
    name: NO_SILENT_DISPLAY_TAKEOVER
    statement: >
      Quantum may suggest an available presentation surface but may not silently
      begin displaying confidential content on an unconfirmed nearby device.
  CD-013:
    name: USER_CONFIRMS_PRESENTATION_TARGET
    statement: >
      The recipient intentionally selects or approves the target surface before
      protected content appears there.
  CD-014:
    name: BEST_SURFACE_IS_CONTEXTUAL
    statement: >
      Largest screen is not automatically best. Privacy, audio, resolution,
      lighting, network quality and audience context matter.
  CD-015:
    name: CINEMATIC_INTEGRITY_IS_A_RUNTIME_REQUIREMENT
    statement: >
      Presentation quality is part of the ProofOfFilm experience and should be
      validated before playback where practical.
  CD-016:
    name: PRESENTATION_SESSION_IS_EPHEMERAL
    statement: >
      A display grant exists only for the intended presentation interval.
  CD-017:
    name: AUTHENTICATED_SOURCE_REMAINS_ROOT
    statement: >
      Quantum Pair derives its authority from an existing authenticated source
      session issued by spec 20.
  CD-018:
    name: DISPLAY_CANNOT_ESCALATE_SCOPE
    statement: >
      A paired surface cannot request content classes unavailable to the
      originating authenticated session.
  CD-019:
    name: CONTENT_SCOPE_FOLLOWS_DOMAIN_STATE
    statement: >
      ProofOfFilm, CuratedProjectExperience and later ProductionPortal content
      become available only when their owning domains authorize them.
  CD-020:
    name: CONTROL_AND_RENDER_MAY_SEPARATE
    statement: >
      Playback control may remain on the phone while content is rendered on the
      large display.
  CD-021:
    name: DISPLAY_CAN_BE_SELF_CONTROLLED
    statement: >
      When secure and appropriate, a paired browser may also receive local
      playback controls without receiving wider authorization.
  CD-022:
    name: PLAYBACK_STATE_IS_SYNCHRONIZED
    statement: >
      Moving between presentation surfaces should preserve an exact logical
      playback position where resumption is intended.
  CD-023:
    name: RESUME_DOES_NOT_MEAN_DUPLICATE_ACCESS
    statement: >
      A resumed presentation remains one experience lineage even when its
      rendering surface changes.
  CD-024:
    name: AUDIO_IS_FIRST_CLASS
    statement: >
      A giant display with poor or missing audio may be worse than a smaller
      surface with correct audiovisual delivery.
  CD-025:
    name: CAPTIONS_AND_ACCESSIBILITY_SURVIVE_HANDOFF
    statement: >
      Accessibility and language presentation state must survive surface changes.
  CD-026:
    name: NO_PUBLIC_DISPLAY_ACCIDENTS
    statement: >
      Privacy context must be considered before suggesting or authorizing a
      presentation surface.
  CD-027:
    name: PRESENTATION_FAILURE_DOES_NOT_END_EXPERIENCE
    statement: >
      If the large screen fails, the authenticated source device should remain a
      valid fallback whenever security policy permits.
  CD-028:
    name: PROVIDER_FAILURE_DOES_NOT_CHANGE_PROJECT
    statement: >
      A casting or browser failure is a presentation defect, not a creative or
      project-state change.
  CD-029:
    name: DEVICE_CAPABILITY_IS_RUNTIME_EVIDENCE
    statement: >
      Surface capability is observed dynamically rather than assumed from device
      brand or marketing label.
  CD-030:
    name: PRESENTATION_IS_MEASURED
    statement: >
      Quantum should know whether the experience was viewed on a phone, tablet,
      desktop or large display so it can calibrate presentation strategy without
      invasive tracking.
  CD-031:
    name: NO_INSTALL
    statement: >
      Quantum Pair must work through ordinary secure web technology.
  CD-032:
    name: PAIRING_IS_NOT_LOGIN
    statement: >
      The display is not creating a user account; it is accepting a temporary
      authorization delegated from a valid Key session.
  CD-033:
    name: ONE_TAP_WHERE_POSSIBLE
    statement: >
      Native presentation paths should minimize interactions after recipient
      confirmation.
  CD-034:
    name: BORING_INFRASTRUCTURE_EXOTIC_EFFECT
    statement: >
      The resulting experience may feel futuristic while relying on ordinary
      browsers, secure sessions and standard media delivery underneath.
# =====================================================================
# 3. PRESENTATION MODES
# =====================================================================
presentation_modes:
  PresentationMode:
    enum:
      - SAME_DEVICE
      - NATIVE_REMOTE_PRESENT
      - QUANTUM_PAIR
      - LARGE_TABLET
      - DESKTOP_BROWSER
      - CONFERENCE_DISPLAY
      - DEGRADED_SOURCE_DEVICE
  semantics:
    SAME_DEVICE:
      description: >
        Authenticated source device directly renders the experience.
    NATIVE_REMOTE_PRESENT:
      description: >
        A supported platform-native presentation protocol sends or controls
        playback on an approved target surface.
    QUANTUM_PAIR:
      description: >
        A separate browser session on the target display is cryptographically
        linked to the authenticated source session through an ephemeral pairing
        challenge and receives a scoped DisplayGrant.
    LARGE_TABLET:
      description: >
        An authenticated or paired tablet is the primary cinematic surface.
    DESKTOP_BROWSER:
      description: >
        A Mac or PC browser receives a temporary authorized display session.
    CONFERENCE_DISPLAY:
      description: >
        A conference-room browser or supported native display renders protected
        content under a scoped session.
    DEGRADED_SOURCE_DEVICE:
      description: >
        Presentation remains on the authenticated source device because no better
        secure target is available.
# =====================================================================
