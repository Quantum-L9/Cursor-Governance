      - static_storyboards
      - generated_keyframes
      - limited_motion_video
      - hybrid
  - id: SA-OD-05
    decision: temporary voice generation strategy
    status: SELF_MODEL_DRIVEN
  - id: SA-OD-06
    decision: audience trajectory numeric scales
    status: CALIBRATION_REQUIRED
  - id: SA-OD-07
    decision: shot duration policy
    status: LEARNABLE_LATER
# =====================================================================
# 59. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: narrative cognition invents disconnected events
    control:
      - NarrativeOpportunity
      - World preconditions
      - causal validation
  - risk: character becomes plot puppet
    control:
      - psychological state
      - motivation validation
  - risk: twist cheats
    control:
      - epistemic flow
      - RewatchCritic
      - audience state
  - risk: story too dense for runtime
    control:
      - StoryRuntimeBudget
      - density checks
  - risk: animatic treated as static storyboard
    control:
      - timing
      - temp dialogue
      - sound/music
      - camera/motion
  - risk: shot planning ignores World continuity
    control:
      - WorldCoordinate
      - expected state projection
  - risk: final production starts before story works
    control:
      - animatic lock gate
  - risk: cinematic choices mutate canon
    control:
      - World/Cinematic authority separation
  - risk: excessive branching wastes inference
    control:
      - reasoning budget
      - bounded BranchPortfolio
  - risk: local shot polish hides weak story
    control:
      - hierarchical story/scene/animatic QC
  - risk: story generation ignores creator ending
    control:
      - EndingIntent
      - StoryContract
      - creator fidelity QC
# =====================================================================
# 60. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    Story is selected from the possibilities latent in current reality.
  law_02: >
    NarrativeOpportunity tells Quantum where reality is dramatically loaded.
  law_03: >
    Event proposals remain hypothetical until World Model commits them.
  law_04: >
    Physical causality and psychological causality are equally important.
  law_05: >
    Character action must be consistent with desire, belief, knowledge,
    relationship and pressure.
  law_06: >
    Audience knowledge is a separate modeled state.
  law_07: >
    Surprise is engineered through information flow, not cheating.
  law_08: >
    A StoryPlan explains what happens and why.
  law_09: >
    A SceneSpec explains what changes.
  law_10: >
    A ShotSpec explains what the audience should see, hear, understand and feel.
  law_11: >
    Every shot exists at a precise WorldCoordinate.
  law_12: >
    Expected visible and audible state are compiled from World reality before rendering.
  law_13: >
    Cinematic expression observes reality; it does not own reality.
  law_14: >
    Animatic is a timed audiovisual simulation, not merely a storyboard.
  law_15: >
    Story, pacing and edit defects should be repaired before expensive final production.
  law_16: >
    Final production begins from animatic.lock.
  law_17: >
    Local story/shot defects should produce local revisions whenever causally possible.
  law_18: >
    The selected story must be explainable through World state, NarrativeOpportunity,
    character logic, CreatorModel, AudienceModel and branch evaluation.
  law_19: >
    The richer the persistent universe becomes, the more story should be
    discoverable from accumulated causal state.
  law_20: >
    The end state is a system that can inspect a living fictional universe,
    discover where it is dramatically charged, choose what should happen next,
    and compile that reality into a production-ready cinematic plan.

