# =====================================================================
# 32. STORY COMPILER PASSES
# =====================================================================
story_compiler_pipeline:
  passes:
    S01_ContextAssembly:
      output:
        - StoryDecisionContext
    S02_NarrativeOpportunityRetrieval:
      output:
        - ranked opportunity set
    S03_StoryCandidateGeneration:
      output:
        - StoryCandidate set
    S04_CausalPreconditionValidation:
      output:
        - viable story candidates
    S05_CharacterIntegrityValidation:
      output:
        - psychologically viable candidates
    S06_EpistemicValidation:
      output:
        - knowledge-valid candidates
    S07_AudienceTrajectorySimulation:
      output:
        - audience scorecards
    S08_EndingAndThemeEvaluation:
      output:
        - ending-compatible candidates
    S09_BranchSimulation:
      conditional:
        - high consequence
        - high uncertainty
    S10_StorySelection:
      output:
        - StorySelectionDecision
    S11_WorldCommit:
      output:
        - committed World events
        - new snapshots
    S12_StoryPlanCompilation:
      output:
        - StoryPlan
    S13_SequenceCompilation:
      output:
        - SequenceSpecs
    S14_SceneCompilation:
      output:
        - SceneSpecs
    S15_ShotPlanning:
      output:
        - ShotSpecs
    S16_WorldProjection:
      output:
        - expected visible/audible state
    S17_AnimaticGeneration:
      output:
        - AnimaticTimeline
    S18_AnimaticQC:
      output:
        - QCRun
    S19_AnimaticRepair:
      conditional:
        - FAIL
        - UNCERTAIN
    S20_AnimaticLock:
      output:
        - animatic.lock
# =====================================================================
# 33. SCENE COMPILER
# =====================================================================
scene_compiler:
  inputs:
    - StoryPlan
    - World events
    - AudienceInformationState
    - CreatorModel
  judgment_tasks:
    - scene boundary selection
    - conflict concentration
    - entry/exit state
    - dialogue necessity
    - reveal timing
    - emotional turn
  hard_checks:
    - scene changes something
    - no impossible knowledge
    - no causality break
    - runtime contribution justified
# =====================================================================
# 34. SHOT COMPILER
# =====================================================================
shot_compiler:
  inputs:
    - SceneSpec
    - WorldCoordinate sequence
    - Cinematic cognition
    - Audience information goals
  judgment_tasks:
    - coverage
    - shot size
    - camera movement
    - blocking
    - reaction timing
    - visual reveal
    - information emphasis
    - shot duration
  optimization:
    goal: >
      Convey required story/emotion with minimal unnecessary shot complexity.
  anti_pattern:
    - coverage_for_coverage_sake
    - random_camera_motion
    - generic_establishing_shot
    - redundant_reverse_angles
# =====================================================================
# 35. SHOT COUNT
# =====================================================================
shot_count_policy:
  derived_from:
    - runtime
    - scene complexity
    - information density
    - performance needs
    - action readability
    - pacing
    - style
  MVP_target:
    typical:
      - 10
      - 15
  not_hardcoded:
    true
# =====================================================================
# 36. ANIMATIC TIMELINE
# =====================================================================
animatic:
  AnimaticTimeline:
    object_class: SPECIFICATION
    fields:
      animatic_id:
      project_id:
      version:
      runtime:
      frame_rate:
      aspect_ratio:
      shot_entries:
        type: list[AnimaticShot]
      dialogue_track:
      temp_voice_track:
      temp_music_track:
      temp_sound_track:
      scene_markers:
      sequence_markers:
      source_StoryPlan_ref:
      source_ShotSpec_refs:
      source_World_revision:
      CreatorModel_ref:
      QC_contract_ref:
      certificate_ref:
        nullable: true
      digest:
# =====================================================================
# 37. ANIMATIC SHOT
# =====================================================================
animatic_shot:
  AnimaticShot:
    fields:
      shot_ref:
      timeline_in:
      timeline_out:
      duration:
      board_artifact_refs:
      temp_motion_ref:
        nullable: true
      temp_dialogue_ref:
        nullable: true
      temp_sound_ref:
        nullable: true
      camera_visualization:
      blocking_visualization:
      subtitle_or_dialogue_display:
        nullable: true
      transition:
      notes:
# =====================================================================
# 38. ANIMATIC GENERATION STRATEGY
# =====================================================================
animatic_generation:
  priority:
    - semantic clarity
    - timing
    - performance intention
    - edit rhythm
  not_priority:
    - final visual fidelity
  possible_assets:
    - storyboard images
    - generated keyframes
    - crude motion
    - temp voices
    - temp SFX
    - temp score
    - text overlays
  production_cost:
    intentionally_low_relative_to_final: true
  deterministic_timeline:
    preferred: true
# =====================================================================
# 39. ANIMATIC QC
# =====================================================================
animatic_QC:
  delegated_to:
    07_quantum_autonomous_qc_build_spec.yaml
  required_evaluations:
    - story comprehension
    - scene function
    - causal integrity
    - character motivation
    - information flow
    - reveal timing
    - audience trajectory
    - emotional progression
    - pacing
    - shot clarity
    - camera motivation
    - dialogue necessity
    - product promise
    - ending setup
  viewer_modes:
    - ColdViewer
    - InformedCritic
  RewatchCritic:
    required_when:
      - twist
      - reveal
      - mindfuck
      - reframe
  hard_pass_before_final_production:
    true
# =====================================================================
# 40. ANIMATIC REPAIR
# =====================================================================
animatic_repair:
  failure_classes:
    shot_local:
      examples:
        - confusing framing
        - bad duration
        - weak reaction
      repair_scope:
        - ShotSpec
        - AnimaticShot
    scene_local:
      examples:
        - scene objective unclear
        - weak turn
        - dialogue overload
      repair_scope:
        - SceneSpec
        - contained ShotSpecs
    sequence:
      examples:
        - escalation weak
        - reveal too early
      repair_scope:
        - multiple scenes
    story:
      examples:
        - causal failure
        - ending cheat
        - protagonist motivation false
      repair_scope:
        - StoryPlan
        - affected World event proposals
  rule: >
    Repair scope is the smallest level capable of correcting the root cause.
# =====================================================================
# 41. ANIMATIC LOCK
# =====================================================================
animatic_lock:
  artifact:
    AnimaticLock
  prerequisites:
    - AnimaticTimeline exists
    - all required story/scene/shot QC pass
    - animatic QC PASS
    - source refs resolved
    - no critical unresolved ambiguity
  locks:
    - story event sequence
    - scene order
    - primary edit structure
    - shot purposes
    - shot order
    - approximate timing
    - essential dialogue
    - required visible/audible state
  may_remain_flexible:
    - exact final performance nuance
    - minor camera variation
    - final lighting treatment
    - incidental sound detail
  downstream:
    enables:
      - ProductionIntent finalization
      - production strategy planning
      - final asset/render execution
# =====================================================================
# 42. LOCK REOPEN
# =====================================================================
lock_reopen:
  triggers:
    - creator revision
    - episode-level QC failure
    - World canonical change
    - proven story contradiction
    - production impossibility that cannot preserve semantics
  algorithm:
    - identify affected story/scene/shot scope
    - reopen minimum scope
    - supersede affected IR versions
    - re-run required compiler passes
    - re-QC
    - issue new lock
  accepted_final_media:
    impact:
      computed_via_spec_09: true
# =====================================================================
# 43. CAUSAL VALIDATION
# =====================================================================
causal_validation:
  checks:
    - event preconditions
    - required enabling causes
    - preventing conditions
    - temporal order
    - physical possibility
    - character motivation
    - available knowledge
    - available affordances
  typed_relations:
    examples:
      - CAUSES
      - ENABLES
      - MOTIVATES
      - PREVENTS
      - NECESSARY_FOR
      - CONTRIBUTES_TO
      - TRIGGERS
      - REVEALS
      - CONCEALS
  failure:
    code: NARRATIVE.CAUSALITY_FAILURE
# =====================================================================
# 44. CHARACTER VALIDATION
# =====================================================================
character_validation:
  inputs:
    - psychological state
    - desires
    - beliefs
    - knowledge
    - relationship state
    - physical condition
    - history
  question:
    >
    Given what this character currently wants, believes, knows and feels, is this
    action plausible under current pressure?
  surprise:
    allowed_when:
      - latent trait
      - extreme pressure
      - new information
      - relationship trigger
      - deliberate transformation
  inconsistency:
    not_allowed_without_causal_support: true
# =====================================================================
# 45. EPISTEMIC VALIDATION
# =====================================================================
epistemic_validation:
  must_prove:
    event_to_knowledge_flow: |
      event
        ↓
      perceptual access
        ↓
      observation
        ↓
      attention
        ↓
      interpretation
        ↓
      knowledge / belief update
  invalid:
    - character acts on inaccessible information
    - audience sees hidden information unintentionally
    - reveal depends on impossible ignorance
  violation:
    WORLD.IMPOSSIBLE_CHARACTER_KNOWLEDGE
# =====================================================================
# 46. AUDIENCE TRAJECTORY
# =====================================================================
audience_trajectory:
  AudienceTrajectory:
    fields:
      timeline_points:
        type: list[AudienceTrajectoryPoint]
  AudienceTrajectoryPoint:
    fields:
      story_coordinate:
      comprehension:
      curiosity:
      suspicion:
      tension:
      emotional_state:
      open_questions:
      known_facts:
      false_beliefs:
      expected_next_event:
      memory_targets:
  use:
    - reveal timing
    - pacing
    - ColdViewer QC
    - ending fairness
# =====================================================================
# 47. RUNTIME BUDGET
# =====================================================================
runtime_budget:
  StoryRuntimeBudget:
    fields:
      total_seconds:
      opening_seconds:
      setup_seconds:
      escalation_seconds:
      climax_seconds:
      ending_seconds:
      dialogue_budget:
      silence_budget:
      exposition_budget:
  compiler:
    may_rebalance: true
  hard_rule: >
    Story complexity exceeding runtime capacity requires simplification rather
    than compressing everything into unintelligibility.
# =====================================================================
# 48. NARRATIVE DENSITY
# =====================================================================
narrative_density:
  dimensions:
    - major_characters
    - causal_threads
    - mysteries
    - locations
    - timeline_jumps
    - relationship_turns
    - concepts_to_explain
  MVP:
    target:
      major_characters: 1_to_2
      primary_locations: 1_to_2
      major_reveal_threads: 1
      main_causal_thread: 1
  future:
    roadmap: 90
# =====================================================================
# 49. ANIMATIC AS CHEAP SIMULATION
