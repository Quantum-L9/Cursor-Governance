validation_gates:
  - id: SA-G01
    check: story generation consumes persistent World state
  - id: SA-G02
    check: NarrativeOpportunity derivation supported
  - id: SA-G03
    check: event proposals validated before World commit
  - id: SA-G04
    check: psychological causality checked
  - id: SA-G05
    check: epistemic information flow checked
  - id: SA-G06
    check: AudienceInformationState separate from character knowledge
  - id: SA-G07
    check: StoryPlan retains source opportunity and decision lineage
  - id: SA-G08
    check: SceneSpec declares entry/exit state and function
  - id: SA-G09
    check: every ShotSpec has WorldCoordinate
  - id: SA-G10
    check: expected visible state derived from World
  - id: SA-G11
    check: expected audible state derived from World
  - id: SA-G12
    check: every shot has explicit purpose
  - id: SA-G13
    check: animatic includes timing and audio/performance skeleton
  - id: SA-G14
    check: animatic receives hierarchical QC
  - id: SA-G15
    check: final production blocked without animatic.lock
  - id: SA-G16
