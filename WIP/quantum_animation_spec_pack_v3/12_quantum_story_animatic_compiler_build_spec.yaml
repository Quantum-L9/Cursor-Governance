The distinction between 11 and 12 is intentionally sharp:

11:
"What project did the creator ask Quantum to make?"
12:
"Given that project and this persistent reality,
what actually happens—and how should the audience experience it?"

And 12 is where the secret-sauce loop finally becomes mechanically explicit:

persistent World
      ↓
"What unresolved configuration has the
highest dramatic potential right now?"
      ↓
NarrativeOpportunity
