# 57. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  narrative:
    - NarrativeOpportunity consumption
    - event proposal
    - branch simulation
    - story selection
    - World commit
    - StoryPlan
  structure:
    - SequenceSpec
    - SceneSpec
    - SceneStateDelta
    - runtime budgeting
  epistemic:
    - character knowledge validation
    - audience information trajectory
    - reveal planning
  cinematic:
    - ShotPurpose
    - ShotSpec
    - WorldCoordinate
    - camera
    - blocking
    - performance
    - sound
    - edit
  World projection:
    - expected visible state
    - expected audible state
  animatic:
    - storyboard/keyframes
    - temporary timing
    - temp dialogue
    - temp sound/music
    - deterministic timeline
    - QC
    - repair
    - animatic.lock
  autonomy:
    - story can emerge from characters/world without creator-written screenplay
    - compiler can select story
    - compiler can generate animatic
    - QC can force targeted repair
    - no human review required for ordinary MVP flow
  release:
    requirement: SA-G01_through_SA-G18_pass
# =====================================================================
# 58. OPEN DECISIONS
# =====================================================================
open_decisions:
