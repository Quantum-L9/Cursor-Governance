    - NarrativeOpportunity_to_StoryCandidate
    - StorySelection_to_WorldEvent
    - WorldEvent_to_SceneSpec
    - SceneSpec_to_ShotSpec
    - ShotSpec_to_Animatic
    - Animatic_to_AutonomousQC
    - AnimaticLock_to_ProductionIntent
