definition_of_done:
  system_identity:
    - one-intelligence architecture formally accepted
    - subsystem responsibilities do not overlap materially
  human_interface:
    - creator conversation can generate valid creative.yaml
    - no required manual production configuration
  creative:
    - strong baseline constitution exists
    - project intent can radically alter aesthetic expression
    - quality remains intent-relative
  audience_product:
    - audience model includes both WHO and EXPERIENCE
    - product intelligence influences but cannot silently override creativity
  world:
    - persistent fictional truth is independently reconstructable
  cognition:
    - WorldSignals can activate specialized cognition
    - reasoning depth is dynamic
    - cognitive cascades are bounded
  self:
    - capability truth is self-maintained
  production_model:
    - ProductionIntent / ProductionModel / ProductionManifest split enforced
  QC:
    - critical locks require autonomous certification
  production:
    - isolated shot regeneration demonstrated
    - accepted unrelated work preserved
  memory:
    - semantic memory loss does not corrupt World truth
  learning:
    - production, cognition and SelfModel learning planes operate independently
    - no learned policy self-promotes
  scale:
    - architecture supports progression from 60 seconds to 12–24 minutes without
      fundamental redesign
  pack:
    - specs 01–08 inherit and conform to this architecture
  release_gate:
    requirement: >
      SYS-G01 through SYS-G20 pass and 01–08 contain no unresolved ownership
      conflict with this specification.
