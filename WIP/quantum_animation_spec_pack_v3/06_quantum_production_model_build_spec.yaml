    - ProductionStageGraph
    - ProductionStage
    - ProductionStageDependency
    - ImplementationCandidate
    - SelectedImplementation
    - StrategyScorecard
    - ProjectProductionStrategy
  takes:
    - TakeGenerationPolicy
    - TakeCandidate
    - TakePortfolio
  composites:
    - LayerProductionStrategy
    - CompositeProductionStrategy
  risk:
    - ProductionRisk
    - ProductionFeasibilityAssessment
  fallback:
    - FallbackPlan
    - FallbackTier
  repair:
    - RepairStrategy
    - RepairAction
    - ProductionFailureDiagnosis
  probes:
    - ProductionProbe
  experience:
