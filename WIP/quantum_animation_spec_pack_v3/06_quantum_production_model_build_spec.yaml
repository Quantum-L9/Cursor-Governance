# =====================================================================
# 89. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: ProductionModel silently becomes creative director
    control:
      - ProductionIntent boundary
      - CreatorModel precedence
  - risk: one renderer becomes universal default
    control:
      - task-conditioned SelfModel
      - heterogeneous strategies
  - risk: production complexity explodes
    control:
      - strategy templates
      - candidate pruning
      - use composite strategies only where expected value supports them
  - risk: deterministic tools over-constrain creative work
    control:
      - deterministic/generative policy based on semantic role
  - risk: generative tools used for exact operations
    control:
      - deterministic opportunity detection
  - risk: multiple takes waste compute
    control:
      - adaptive marginal-value stopping
  - risk: low-cost strategy degrades creative fidelity
    control:
      - hard creative floors
      - expected utility after constraints
  - risk: fallback silently changes film
    control:
      - semantic-change authority gate
  - risk: strategy learning overfits one renderer generation
    control:
      - condition on implementation versions
      - holdout
      - shadow/canary
  - risk: production failures invalidate entire timeline
    control:
      - shot isolation
      - dependency graph
      - deterministic assembly
  - risk: SelfModel degradation destroys accepted work
    control:
      - future-strategy invalidation only by default
  - risk: QC and ProductionModel duplicate authority
    control:
      - prediction vs acceptance boundary
  - risk: strategy score hides catastrophic constraint violation
    control:
      - hard non-compensatory failures
  - risk: finishing removes intentional aesthetic artifacts
    control:
      - intentional artifact contract
      - CreatorModel QC
