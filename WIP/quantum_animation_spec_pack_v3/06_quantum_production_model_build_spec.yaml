# =====================================================================
# 92. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  intent:
    - film demands modeled independently of implementation
    - creative quality semantics preserved
    - audience/product requirements included where relevant
    - hard World facts included
  strategy:
    - live SelfModel determines capability feasibility
    - multiple strategies generated
    - strategy may vary by shot
    - deterministic/generative composition supported
    - evidence-backed selection
  prevention:
    - known weak strategy rejected before render
    - critical invariants require explicit enforcement
    - unsupported quality tier blocks final production
  quality:
    - flagship means maximum intent fidelity, not generic realism
    - selected strategy meets project quality floors
    - AutonomousQC remains acceptance owner
  economics:
    - cost and latency modeled
    - expected retry/repair cost included
    - lower cost cannot compensate for hard creative failure
  repair:
    - individual failed shots/layers repair independently
    - strategy root cause distinct from implementation root cause
    - accepted unrelated artifacts survive
  resilience:
    - provider degradation causes autonomous strategy replan
    - fallbacks exist for critical work
    - no human tool routing required
  learning:
    - strategy experience accumulates
    - successful repair strategies become evidence
    - learned policy governed
    - 101st production can outperform first using institutional experience
  final: >
    ProductionModel must allow Quantum to dynamically manufacture a stable
    creative vision using changing capabilities without either binding the film
    to one provider or silently changing the film to match current tool weakness.
# =====================================================================
# 93. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    ProductionIntent is what the film demands.
  law_02: >
    ProductionModel is how Quantum should satisfy those demands now.
  law_03: >
    ProductionManifest is what is actually executing.
  law_04: >
    ProductionIntent is provider independent.
  law_05: >
    ProductionModel is capability dependent and therefore dynamic.
  law_06: >
    Tool weakness does not redefine creative intent.
  law_07: >
    There is no single best renderer; there is a best strategy for the current
    production structure and constraints.
  law_08: >
    Different shots may use radically different manufacturing strategies while
    belonging to the same film.
  law_09: >
    World truth that must survive rendering becomes explicit production constraint.
  law_10: >
    Critical constraints require sufficiently strong enforcement before render.
  law_11: >
    Deterministic tools should perform exact work whenever generative uncertainty
    adds no creative value.
  law_12: >
    Composite pipelines are first-class production strategies.
  law_13: >
    Multiple takes are a quality strategy whose breadth should adapt to uncertainty.
  law_14: >
    Expensive redundancy belongs where expected quality/risk value justifies it.
  law_15: >
    Production planning should make shot-level repair the default.
  law_16: >
    A failed shot should not destroy accepted neighboring shots.
  law_17: >
    Fallbacks should preserve semantics before requesting semantic compromise.
  law_18: >
    SelfModel supplies capability truth; ProductionModel chooses manufacturing strategy.
  law_19: >
    AutonomousQC determines whether the manufactured result is acceptable.
  law_20: >
    ProductionEngine executes the approved strategy and does not invent project meaning.
  law_21: >
    Production learning studies strategies, while SelfModel studies implementation capability.
  law_22: >
    Every major production strategy should be explainable through requirements,
    capability evidence, risk, alternatives and expected tradeoffs.
  law_23: >
    Strategy should automatically recompile when the capability landscape changes,
    while preserving already accepted work whenever semantics remain valid.
  law_24: >
    Quality-tier semantics are project-relative: flagship retro animation and
    flagship cinematic science fiction may require completely different production
    strategies.
  law_25: >
    The end state is a production intelligence that can look at any approved shot,
    understand what must survive, understand what Quantum can currently do, and
    choose the highest-value manufacturing path with no human production routing.

This makes the core architecture especially clean:

ProductionIntent
"What must the finished film preserve?"
        │
        │ relatively stable
        ▼
SelfModel(t)
"What can Quantum actually do now?"
        │
        ▼
ProductionExperience
"What manufacturing strategies have worked before?"
        │
        ▼
ProductionModel(t)
"How should we make THIS requirement NOW?"
        │
        ▼
ProductionManifest
"What jobs are actually running?"
        │
        ▼
ProductionEngine

The highest-leverage consequence is that production strategy can change radically without changing the film. If a renderer becomes bad at hands tomorrow, Quantum does not rewrite the scene to hide Aria’s hand. It can instead move from:

single-pass video generation

to:

canonical keyframe
    +
pose/hand constraint
    +
conditioned motion generation
    +
deterministic receiver composite
    +
multiple takes
    +
handedness QC

while ProductionIntent remains exactly the same.

That separation is what makes the studio resilient to the extremely fast-moving model ecosystem—and it directly supports the principle that shot 217 can be repaired without touching the other 250 shots.
