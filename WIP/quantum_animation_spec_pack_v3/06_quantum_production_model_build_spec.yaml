# =====================================================================
# 81. UNIT TESTS
# =====================================================================
tests:
  unit:
    intent:
      - provider_independent_requirement
      - hard_vs_soft_requirement
      - quality_tier_semantics
      - retro_flagship_does_not_imply_photorealism
    constraints:
      - World_fact_to_constraint
      - critical_binding_strength
      - creator_lock_constraint
    strategies:
      - infeasible_strategy_pruned
      - composite_strategy_created
      - deterministic_alternative_detected
      - scorecard_hard_failure
    takes:
      - adaptive_take_count
      - marginal_gain_stop
    risk:
      - task_conditioned_failure
      - catastrophic_risk_threshold
    fallback:
      - technical_fallback_preserves_intent
      - semantic_fallback_requires_authority
    repair:
      - minimum_blast_radius
      - root_cause_mapping
    SelfModel:
      - degraded_implementation_invalidates_strategy
      - unrelated_capability_change_does_not_invalidate
    learning:
      - strategy_experience_recorded
      - hard_requirement_cannot_be_learned_away
# =====================================================================
# 82. PROPERTY TESTS
# =====================================================================
property_tests:
  - provider_change_without_semantic_change_does_not_change_ProductionIntent
  - ProductionModel_recompile_does_not_modify_CreatorModel
  - World_constraint_never_weakened_to_match_renderer
  - critical_constraint_below_required_enforcement_never_executes
  - accepted_unrelated_shot_survives_other_shot_failure
  - same_ProductionIntent_same_SelfModel_same_policy_same_strategy_digest_or_declared_nondeterminism
  - ProductionManifest_state_change_does_not_mutate_ProductionModel
  - no_infeasible_strategy_can_be_selected
  - learned_strategy_policy_cannot_ignore_hard_requirement
  - deterministic_operation_preferred_when_equivalent_and_lower_risk
  - capability_degradation_invalidates_only_dependent_uncommitted_strategies
# =====================================================================
# 83. NEGATIVE TESTS
# =====================================================================
negative_tests:
  - provider_choice_embedded_in_ProductionIntent_rejected
  - renderer_weakness_causes_creative_style_change_rejected
  - hand_constraint_dropped_to_improve_pass_rate_rejected
  - ProductionModel_direct_SelfModel_mutation_rejected
  - ProductionModel_direct_World_mutation_rejected
  - ProductionModel_executes_provider_call_rejected
  - ProductionManifest_used_as_creative_authority_rejected
  - generic_photorealism_quality_rule_rejected
  - learned_policy_self_promotion_rejected
  - fallback_that_changes_story_without_authority_rejected
  - accepted_shots_invalidated_by_unrelated_provider_degradation_rejected
# =====================================================================
# 84. INTEGRATION TESTS
# =====================================================================
integration_tests:
  - CreatorModel_to_ProductionIntent
  - AudienceModel_to_ProductionIntent
  - ProductMarketModel_to_ProductionIntent
  - World_expected_state_to_constraints
  - ProductionIntent_plus_SelfModel_to_strategy_candidates
  - SelfModel_failure_surface_to_risk_estimator
  - strategy_to_AutonomousQC_expectations
  - ProductionModel_to_ProductionEngine_manifest
  - QC_failure_to_repair_strategy
  - ProductionEngine_attempt_to_strategy_experience
  - SelfModel_degradation_to_strategy_recompile
  - accepted_artifact_preservation_after_recompile
# =====================================================================
# 85. END-TO-END TESTS
# =====================================================================
end_to_end_tests:
  shot_217_failure_isolation:
    initial:
      episode_shot_count: 260
      bad_shot: shot_217
    sequence:
      - compile ProductionIntent
      - compile shot-level ProductionStrategies
      - execute all eligible jobs
      - AutonomousQC fails shot_217 for handedness
      - root cause identifies generative hand-object weakness
      - repair strategy chooses stronger conditioning + deterministic prop layer
      - invalidate shot_217 only
      - regenerate affected shot/layer
      - re-QC shot_217
      - reuse all other accepted shots
      - deterministic timeline reconforms
    success:
      - no unrelated render regenerated
      - World truth unchanged
      - creator intent unchanged
  provider_degradation:
    sequence:
      - ProductionModel planned renderer_A for 60 shots
      - 20 accepted
      - 40 pending
      - SelfModel emits CAPABILITY_DEGRADED
      - dependency analysis identifies 40 pending strategies
      - accepted 20 preserved
      - alternate strategies compiled for pending 40
      - ProductionModel v_next published
      - ProductionEngine continues
    success:
      - zero accepted work lost
      - no human rerouting
  retro_limited_animation:
    project:
      quality_tier: flagship
      style: deliberate_1990s_limited_animation
    sequence:
      - ProductionIntent encodes linework/frame cadence/texture
      - candidate photoreal strategy scores high technical realism
      - strategy fails creator fidelity
      - limited-animation hybrid strategy selected
      - finishing preserves intentional texture
    success:
      - flagship does not become photorealism
  cinematic_AI_VR:
    requirements:
      - monumental impossible geometry
      - premium cinematic lighting
      - recurring AI character identity
      - complex spatial sound
    sequence:
      - project-level heterogeneous strategy selected
      - environment shots use renderer optimized for scale
      - character closeups use identity-strong renderer
      - impossible UI/text uses deterministic composite
      - acoustic strategy derives World geometry
      - multiple takes generated for climax
      - AutonomousQC selects/certifies best outputs
    success:
      - no single-renderer architecture
      - creative ambition preserved
  production_learning:
    sequence:
      - produce 100 shorts
      - collect strategy experiences
      - discover failure patterns
      - learn stronger hand-object strategy
      - shadow new StrategySelectionPolicy
      - holdout evaluation
      - bounded canary
      - promote
      - produce short_101
    expected:
      - lower first-attempt failure rate
      - lower repair cost
      - same_or_higher_creator_fidelity
# =====================================================================
# 86. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: PM-G01
    check: ProductionIntent and ProductionModel are separate contracts
  - id: PM-G02
    check: ProductionIntent is provider independent
  - id: PM-G03
    check: QualitySemantics preserved through production requirements
  - id: PM-G04
    check: World critical facts compile into enforceable constraints
  - id: PM-G05
    check: critical weak bindings fail before render
  - id: PM-G06
    check: SelfModel is sole capability truth source
  - id: PM-G07
    check: task-conditioned strategy selection supported
  - id: PM-G08
    check: heterogeneous shot strategies supported
  - id: PM-G09
    check: deterministic/generative hybrid strategies supported
  - id: PM-G10
    check: adaptive take generation supported
  - id: PM-G11
    check: fallback plans precomputed for critical units
  - id: PM-G12
    check: repair strategy minimizes blast radius
  - id: PM-G13
    check: accepted work survives unrelated strategy invalidation
  - id: PM-G14
    check: ProductionManifest remains execution-only state
  - id: PM-G15
    check: capability degradation replans only affected uncommitted work
  - id: PM-G16
    check: ProductionExperience influences strategy learning
  - id: PM-G17
    check: learned strategy policy cannot weaken hard requirements
  - id: PM-G18
    check: ProductionModel produces evidence-backed rationale
  - id: PM-G19
    check: ProductionEngine can execute emitted strategy contract
  - id: PM-G20
    check: AutonomousQC remains acceptance authority
# =====================================================================
# 87. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  ProductionIntent:
    - provider independent
    - compiled from creator/audience/product/World requirements
    - quality tier explicit
    - hard and soft requirements distinct
    - flexibility explicit
  constraints:
    - World facts compile into ProductionConstraints
    - creator locks compile into ProductionConstraints
    - invariant bindings have enforcement strength
    - critical weak bindings rejected
  capabilities:
    - SelfModel used directly
    - no duplicate capability truth
    - implementation suitability task-conditioned
  strategies:
    - multiple candidate strategies generated
    - single-model and composite supported
    - layered strategies supported
    - deterministic methods supported
    - heterogeneous provider strategies supported
    - scorecards preserve hard constraints
  takes:
    - multiple-take generation supported
    - adaptive take count supported
    - take portfolio supports QC selection
  risk:
    - failure risk estimated
    - catastrophic risk separately modeled
    - feasibility explicit
  fallback:
    - critical units have fallback planning
    - fallbacks preserve intent or escalate authority
  repair:
    - typed repair strategies exist
    - minimum blast radius explicit
    - root cause feeds correct learning plane
  learning:
    - strategy experience captured
    - success/failure patterns learned
    - strategy selection policy governable
    - no self-promotion
  integration:
    - World Model
    - Creative Intelligence
    - Audience/Product Intelligence
    - SelfModel
    - Polycognitive Runtime
    - AutonomousQC
    - ProductionEngine
  scale:
    - 250_plus shot episode strategy planning supported
    - shot-level parallel strategy compilation
    - provider degradation does not require episode-wide reset
  autonomy:
    - model/tool selection requires no human routing
    - strategy changes automatically under capability degradation
    - infeasible requirements trigger autonomous alternative search
    - accepted unrelated work remains preserved
  release:
    requirement: >
      PM-G01 through PM-G20 pass and no ownership conflict exists with specs
      00 through 05.
