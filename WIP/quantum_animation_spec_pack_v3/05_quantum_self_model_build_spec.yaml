# 87. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  discovery:
    - providers discoverable
    - implementations discoverable
    - model/tool version changes detectable
    - declared manifests machine-ingestible
  ontology:
    - provider-independent CapabilityOntology exists
    - TaskFeatureVector exists
    - quality dimensions extensible
  observed_capability:
    - immutable CapabilityObservation exists
    - production evidence ingested
    - cognitive execution evidence ingested
    - AutonomousQC evidence ingested
  reliability:
    - conditional reliability modeled
    - confidence intervals modeled
    - evidence recency/task similarity accounted for
  quality:
    - multidimensional quality modeled
    - task-conditioned quality modeled
    - provider global quality score avoided
  failure:
    - FailureMode modeled
    - failure attribution modeled
    - correlated failures modeled
    - quarantine supported
  operational:
    - current availability modeled
    - degradation/recovery modeled
    - cost modeled
    - latency modeled
    - throughput modeled
    - limits modeled
  calibration:
    - predictions calibrated
    - overconfidence detectable
    - calibration versioned
  routing_support:
    - CapabilitySuitability generated
    - explanations include evidence
    - consumers pin SelfModel revision
    - live health can be refreshed immediately before execution
  composites:
    - deterministic + generative composite capabilities represented
    - system-level capability represented
  autonomy:
    - newly added capability can become usable without manual architecture changes
    - capability degradation reroutes downstream systems automatically
    - SelfModel never requires human quality scoring
  learning:
    - capability observations continuously improve estimates
    - underexplored capabilities periodically reevaluated
    - estimator policies governed
    - historical capability evolution retained
  release:
    requirement: >
      SM-G01 through SM-G20 pass and no ownership conflict exists with specs
      00 through 04.
