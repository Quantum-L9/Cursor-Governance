# =====================================================================
# 92. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  machine_maintenance:
    - no human-authored semantic capability truth
    - SelfModel updates from machine evidence
    - current model reconstructable historically
  capability_discovery:
    - new tools/models discovered automatically where adapters permit
    - new versions detected
    - declared manifests parsed
    - verification probes executed
  observed_truth:
    - declared and observed capability separated
    - observed capability dominates when sufficient evidence exists
    - uncertainty remains explicit
  conditionality:
    - capability quality depends on TaskFeatureVector
    - failure modes condition on task structure
    - quality is multidimensional
  live_operation:
    - availability modeled separately from quality
    - degradation/recovery detected
    - signals emitted
    - stale live state downgraded
  calibration:
    - predicted reliability calibrated
    - overconfidence measurable
    - evidence/version change lowers confidence where appropriate
  system_awareness:
    - deterministic tools modeled
    - generative models modeled
    - composite system capabilities modeled
    - implementation alternatives discoverable
  integration:
    - Polycognitive Runtime routes cognitive implementations using SelfModel
    - ProductionModel routes manufacturing strategies using SelfModel
    - ProductionEngine and QC feed evidence back into SelfModel
  explainability:
    - suitability estimate explains evidence, failure risks and confidence
    - historical route can reconstruct decision-time SelfModel revision
  learning:
    - real outcomes improve capability estimates
    - unused capabilities remain eligible for reevaluation
    - estimator policy changes governed
  final: >
    Quantum must maintain a continuously calibrated, machine-authored
    understanding of its own changing capabilities sufficient for other
    autonomous systems to make intelligent routing decisions without human
    tool expertise.
# =====================================================================
# 93. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    SelfModel is authored by evidence, never by human opinion.
  law_02: >
    What a provider claims and what Quantum has observed are different facts.
  law_03: >
    Observed capability dominates declared capability when sufficiently calibrated.
  law_04: >
    Capability is conditional on task structure.
  law_05: >
    There is no universal "best model."
  law_06: >
    There is no single universal quality score for an implementation.
  law_07: >
    Availability, quality, reliability, latency, cost and throughput are
    independent operational dimensions.
  law_08: >
    Old evidence does not remain eternally authoritative when implementations change.
  law_09: >
    Unknown capability remains unknown until evidence supports stronger belief.
  law_10: >
    New capabilities should become discoverable without architecture rewrites.
  law_11: >
    Every relevant capability should be considered; not every capability should
    be artificially used.
  law_12: >
    Failure modes are first-class parts of Quantum's self-knowledge.
  law_13: >
    Failure evidence updates the smallest relevant capability surface.
  law_14: >
    Quantum as a whole may possess capabilities through composed pipelines that
    no single provider possesses.
  law_15: >
    Deterministic tools are first-class capabilities alongside generative models.
  law_16: >
    SelfModel supplies capability truth; consuming systems choose strategies.
  law_17: >
    SelfModel revisions must be reconstructable so decisions can be explained
    using what Quantum believed at the time.
  law_18: >
    Material degradation must propagate immediately through typed signals.
  law_19: >
    Capability estimates must be calibrated against real outcomes.
  law_20: >
    The end state is a Quantum Animation Agent that continuously discovers,
    measures and understands its own tools well enough to exploit new capability
    automatically, avoid known weakness proactively, and become operationally
    smarter as the ecosystem around it changes.

05 now closes an important autonomy loop:

tools/models/providers
        ↓
discovery
        ↓
declared capabilities
        ↓
probes + benchmarks
        ↓
real cognitive / production execution
        ↓
Autonomous QC
        ↓
CapabilityObservation
        ↓
conditional reliability / quality / failures
        ↓
SelfModel(t)
        ↓
┌───────────────────────┬────────────────────────┐
▼                       ▼                        ▼
02 Cognitive routing    06 ProductionModel      degradation signals

And the boundary is deliberately strict:

SelfModel
    = what Quantum CAN do
Polycognitive Runtime
    = which cognition SHOULD execute
ProductionModel
    = how the film SHOULD be manufactured
ProductionEngine
    = actually DO it

The particularly high-leverage part is the conditional capability surface. Quantum will not learn a crude fact such as:

Renderer A = 82% good

It can learn something much more useful:

Renderer A
    monumental environment shot         → .96
    single-character medium shot        → .93
    two-character closeup                → .84
    visible hand/object interaction      → .61
    two-character hand/object closeup    → .51

That is what eventually allows 06 to make genuinely intelligent manufacturing decisions rather than simply ranking providers.

I’d consider 05 about 98% architecturally complete. The remaining uncertainty is largely empirical—what the initial capability ontology and task-feature vectors should contain, which reliability estimator works best once production data exists, and how aggressively Quantum should explore newly discovered capabilities.
