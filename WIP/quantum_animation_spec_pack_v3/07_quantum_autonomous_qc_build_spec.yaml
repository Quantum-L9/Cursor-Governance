metadata:
  spec_id: quantum.animation.autonomous_qc.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Autonomous Quality Control
  depends_on:
    - spec_id: quantum.animation.system_architecture.v1
      file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - spec_id: quantum.animation.world_model.build_spec.v2
      file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: WORLD_TRUTH_AND_EXPECTED_STATE_DEPENDENCY
    - spec_id: quantum.animation.polycognitive_runtime.build_spec.v1
      file: 02_quantum_polycognitive_runtime_build_spec.yaml
      relationship: DECISION_AND_REPAIR_COGNITION_DEPENDENCY
    - spec_id: quantum.animation.creative_intelligence.build_spec.v1
      file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: CREATOR_INTENT_AND_QUALITY_SEMANTICS_DEPENDENCY
    - spec_id: quantum.animation.audience_product_intelligence.build_spec.v1
      file: 04_quantum_audience_product_intelligence_build_spec.yaml
      relationship: VIEWER_AND_PRODUCT_EVALUATION_DEPENDENCY
    - spec_id: quantum.animation.self_model.build_spec.v1
      file: 05_quantum_self_model_build_spec.yaml
      relationship: CAPABILITY_AND_FAILURE_EVIDENCE_DEPENDENCY
    - spec_id: quantum.animation.production_model.build_spec.v1
      file: 06_quantum_production_model_build_spec.yaml
      relationship: PRODUCTION_EXPECTATION_AND_REPAIR_DEPENDENCY
  architectural_identity:
    concise: >
      Autonomous QC determines whether a decision or artifact is good enough,
      explains why, and identifies the smallest reliable path to correction.
    extended: >
      Quantum Autonomous QC is the independent acceptance and certification
      authority for semantic decisions, intermediate representations,
      audiovisual artifacts, production units, locked milestones, and final
      masters. It combines deterministic validators, exact World-state checks,
      creator-intent fidelity checks, specialist critics, multimodal artifact
      critics, synthetic viewer perspectives, product-quality evaluation,
      critic disagreement analysis, adjudication, uncertainty management,
      root-cause diagnosis, repair-scope computation, and calibration.
      It issues explicit PASS, FAIL, or UNCERTAIN outcomes backed by typed
      violations and evidence.
  owner_question:
    primary: "Is this decision or artifact good enough?"
  secondary_questions:
    - "Does it satisfy hard invariants?"
    - "Does it faithfully realize creative intent?"
    - "Is it internally coherent?"
    - "Does it preserve World truth?"
    - "Does the intended audience understand and feel what they should?"
    - "Does the product promise remain strong and distinctive?"
    - "Are production artifacts technically valid?"
    - "Is a critic disagreement meaningful?"
    - "Are we confident enough to accept this?"
    - "What exactly failed?"
    - "Why did it fail?"
    - "What is the minimum scope that must be repaired?"
    - "Should the same strategy retry, or should strategy change?"
    - "Has this failure pattern happened before?"
  not_owner_of:
    - creator intent
    - fictional truth
    - active cognition
    - capability truth
    - production strategy
    - production execution
    - direct artifact generation
    - business operations
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Replace the invisible human reviewer who notices continuity errors,
    weak acting, confusing story logic, ugly cuts, broken sound, wrong props,
    poor pacing, failed emotional intention, weak product identity and
    technical defects before work is allowed to propagate downstream.
  autonomy_goal: >
    Quantum should not need a human to watch every shot, inspect every render,
    remember every continuity constraint, diagnose every production failure or
    manually decide whether a generated take is acceptable.
  success_definition: >
    Critical semantic and audiovisual outputs are independently evaluated
    against explicit contracts; hard errors fail deterministically where
    possible; subjective dimensions are evaluated by calibrated specialist and
    viewer critics; uncertainty is preserved rather than hidden; failed work
    produces actionable root-cause and repair information; and accepted work
    can be trusted as a stable dependency.
  leverage: >
    Autonomous QC turns generative production from "make something and hope"
    into a governed manufacturing system with measurable quality gates.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  QC-001:
    name: ACCEPTANCE_AUTHORITY
    statement: >
      Autonomous QC owns PASS, FAIL and UNCERTAIN certification for governed
      decisions and artifacts.
  QC-002:
    name: QC_IS_INDEPENDENT_FROM_GENERATOR
    statement: >
      The system that generated an artifact must not be its sole acceptance judge.
  QC-003:
    name: HARD_CHECKS_FIRST
    statement: >
      Deterministic and exact correctness checks should run before expensive
      subjective criticism whenever possible.
  QC-004:
    name: QUALITY_EQUALS_FIDELITY_TO_INTENT
    statement: >
      Subjective quality is evaluated relative to effective creative intent,
      not a universal aesthetic.
  QC-005:
    name: WORLD_TRUTH_IS_NOT_NEGOTIABLE
    statement: >
      Observable contradictions against canonical World state are hard failures
      where the relevant state is required to be visible or audible.
  QC-006:
    name: EXPECTED_VS_OBSERVED
    statement: >
      QC findings should explicitly identify expected state and observed state.
  QC-007:
    name: VIOLATIONS_ARE_TYPED
    statement: >
      Failure outputs use stable violation codes and structured evidence rather
      than unstructured "looks bad" feedback.
  QC-008:
    name: SUBJECTIVE_CRITIQUE_IS_MULTI_PERSPECTIVE
    statement: >
      Important subjective judgments should use domain-specialized critics or
      multiple perspectives where disagreement risk is material.
  QC-009:
    name: COLD_VIEWER_IS_FIRST_CLASS
    statement: >
      A viewer with no hidden intent knowledge must evaluate comprehension,
      engagement and surprise.
  QC-010:
    name: INFORMED_CRITIC_IS_FIRST_CLASS
    statement: >
      A critic with access to CreatorModel, World truth and StoryContract should
      evaluate intended-versus-realized execution.
  QC-011:
    name: REWATCH_CRITIC_IS_FIRST_CLASS
    statement: >
      A critic with full outcome knowledge should evaluate clue fairness,
      retrospective coherence and reveal recontextualization.
  QC-012:
    name: PRODUCT_CRITIC_IS_FIRST_CLASS
    statement: >
      Product promise, identity, hook, legibility and repeatability may require
      independent evaluation.
  QC-013:
    name: UNCERTAINTY_IS_VALID
    statement: >
      QC may return UNCERTAIN when evidence is insufficient or critics disagree
      materially.
  QC-014:
    name: UNCERTAINTY_MAY_TRIGGER_MORE_EVIDENCE
    statement: >
      UNCERTAIN should generally produce targeted evidence acquisition rather
      than arbitrary pass/fail.
  QC-015:
    name: HARD_FAILURES_ARE_NON_COMPENSATORY
    statement: >
      Strong spectacle cannot average away a broken creator lock, impossible
      World state or critical technical defect.
  QC-016:
    name: QUALITY_IS_HIERARCHICAL
    statement: >
      Frame, shot, scene, sequence, episode and master quality are related but
      not interchangeable.
  QC-017:
    name: LOCAL_PASS_DOES_NOT_GUARANTEE_GLOBAL_PASS
    statement: >
      Individually acceptable shots may combine into a weak scene or episode.
  QC-018:
    name: GLOBAL_FAILURE_DOES_NOT_REQUIRE_GLOBAL_REPAIR
    statement: >
      Root-cause analysis should identify the smallest causal source of failure.
  QC-019:
    name: REPAIR_SCOPE_IS_EXPLICIT
    statement: >
      Every repairable FAIL should identify the minimum likely repair scope.
  QC-020:
    name: ACCEPTED_ARTIFACTS_ARE_STABLE
    statement: >
      QC-certified artifacts become trusted dependencies until materially
      invalidated by upstream semantic change.
  QC-021:
    name: REPAIR_REQUIRES_RE-QC
    statement: >
      Modified artifacts cannot inherit prior acceptance automatically.
  QC-022:
    name: CRITICS_ARE_CALIBRATED
    statement: >
      Critic confidence and correctness should be measured against known
      evaluation sets and downstream outcomes.
  QC-023:
    name: CRITIC_DISAGREEMENT_IS_SIGNAL
    statement: >
      Significant disagreement is itself meaningful evidence.
  QC-024:
    name: NO_SINGLE_OPAQUE_SCORE
    statement: >
      Quality should retain dimensions, constraints, violations and confidence
      rather than collapsing everything into one number.
  QC-025:
    name: DETECTION_AND_ATTRIBUTION_DIFFER
    statement: >
      Detecting a defect and identifying its cause are distinct stages.
  QC-026:
    name: PREVENTION_IS_HIGHER_VALUE_THAN_REPAIR
    statement: >
      Repeated failures should become earlier preflight checks, strategy
      constraints or SelfModel evidence.
  QC-027:
    name: QC_LEARNS_BUT_DOES_NOT_SELF_LOWER_STANDARDS
    statement: >
      Calibration may improve critic accuracy, but learned systems cannot
      silently weaken hard acceptance standards.
  QC-028:
    name: QC_MUST_BE_REPRODUCIBLE_WHERE_POSSIBLE
    statement: >
      Deterministic checks and versioned critic contracts should enable
      acceptance reconstruction.
  QC-029:
    name: SOURCE_OF_TRUTH_STAYS_WITH_OWNER
    statement: >
      QC reports violations against WorldModel, CreatorModel or ProductionIntent;
      it does not rewrite those source models.
  QC-030:
    name: QC_COST_SCALES_WITH_IMPORTANCE
    statement: >
      Flagship shots, endings, major reveals and final masters may receive deeper
      criticism than low-risk prototype material.
  QC-031:
    name: TAKE_SELECTION_IS_QC
    statement: >
      Selecting the best generated candidate is an acceptance/evaluation process,
      even when generation breadth belongs to ProductionModel.
  QC-032:
    name: QUALITY_CERTIFICATE_IS_FIRST_CLASS
    statement: >
      Accepted artifacts and decisions receive explicit versioned certificates
      carrying evidence and policy lineage.
# =====================================================================
# 3. OWNERSHIP BOUNDARIES
# =====================================================================
ownership_boundaries:
  autonomous_qc_owns:
    - QCContract
    - QualityGate
    - QCPlan
    - QCRun
    - QCOutcome
    - QualityCertificate
    - Violation
    - ViolationTaxonomy
    - deterministic validator registry
    - exact World oracle checks
    - creator fidelity checks
    - specialist critic registry
    - artifact critic registry
    - ColdViewer QC execution
    - InformedCritic QC execution
    - RewatchCritic QC execution
    - ProductCritic QC execution
    - critic ensemble
    - disagreement analysis
    - adjudication
    - QC confidence
    - uncertainty classification
    - root-cause diagnosis
    - RepairRecommendation
    - minimum repair-scope estimation
    - QC calibration
    - QualityCertificate lifecycle
    - QC observability
    - QC-learning evidence
  adjacent_not_owned:
    CreatorModel:
      owner: creative_intelligence
    AudienceModel:
      owner: audience_product_intelligence
    ProductMarketModel:
      owner: audience_product_intelligence
    WorldModel:
      owner: world_model
    CognitiveWorkspace:
      owner: polycognitive_runtime
    SelfModel:
      owner: self_model
    ProductionStrategy:
      owner: production_model
    ProductionExecution:
      owner: production_engine
    actual_repair_execution:
      owner:
        - production_engine
        - relevant_compiler_or_domain_owner
  hard_boundary: >
    Autonomous QC determines acceptance and diagnoses defects. It does not
    directly alter canonical source models or execute repairs.
# =====================================================================
# 4. QC LAYERS
# =====================================================================
QC_layers:
  L0_SCHEMA_AND_INTEGRITY:
    purpose:
      - file integrity
      - schema correctness
      - required metadata
      - artifact readability
      - checksum
      - timing validity
  L1_DETERMINISTIC_INVARIANTS:
    purpose:
      - exact World state
      - creator locks
      - required text
      - durations
      - frame properties
      - audio sync
      - technical specifications
  L2_SPECIALIST_ARTIFACT_CRITIQUE:
    purpose:
      - visual quality
      - performance
      - camera
      - motion
      - sound
      - edit
      - style fidelity
      - continuity
  L3_VIEWER_EXPERIENCE:
    purpose:
      - comprehension
      - attention
      - emotional effect
      - surprise
      - reveal
      - confusion
  L4_PRODUCT_QUALITY:
    purpose:
      - hook
      - concept legibility
      - distinctiveness
      - identity
      - repeatability
      - first-minute promise
  L5_HIERARCHICAL_INTEGRATION:
    purpose:
      - scene effectiveness
      - sequence progression
      - episode structure
      - ending
      - master-level coherence
  L6_ADJUDICATION:
    purpose:
      - resolve critic disagreement
      - decide PASS/FAIL/UNCERTAIN
      - determine confidence
  L7_ROOT_CAUSE_AND_REPAIR:
    purpose:
      - diagnose source
      - identify repair class
      - calculate minimum blast radius
      - feed learning systems
# =====================================================================
# 5. QC OUTCOME
# =====================================================================
QC_outcome:
  QCOutcome:
    enum:
      - PASS
      - FAIL
      - UNCERTAIN
  PASS:
    meaning: >
      Applicable acceptance contract is satisfied at required confidence.
  FAIL:
    meaning: >
      At least one hard requirement fails or total quality falls below required
      acceptance thresholds with sufficient evidence.
  UNCERTAIN:
    meaning: >
      Available evidence is insufficient for reliable acceptance or rejection.
  no_implicit_pass:
    value: true
# =====================================================================
# 6. QC CONTRACT
# =====================================================================
QC_contract:
  QCContract:
    fields:
      qc_contract_id:
      version:
      artifact_or_decision_type:
      scope_kind:
      source_requirements:
        creator_model_ref:
          nullable: true
        quality_semantics_ref:
          nullable: true
        World_expected_state_ref:
          nullable: true
        audience_model_ref:
          nullable: true
        product_model_ref:
          nullable: true
        production_intent_ref:
          nullable: true
        production_strategy_ref:
          nullable: true
      hard_checks:
        type: list[QCCheckSpec]
      subjective_dimensions:
        type: list[QualityDimensionRequirement]
      viewer_modes_required:
        type: list[ViewerMode]
      specialist_critics_required:
        type: list[string]
      product_critics_required:
        type: list[string]
      minimum_confidence:
      uncertainty_policy:
      pass_policy:
      fail_policy:
      root_cause_required:
      repair_recommendation_required:
      certificate_policy:
  versioned: true
# =====================================================================
# 7. QUALITY GATE
# =====================================================================
quality_gate:
  QualityGate:
    fields:
      gate_id:
      gate_type:
      applies_to:
      QC_contract_ref:
      blocking:
        type: bool
      required_before:
        type: list[string]
      accepted_certificate_types:
        type: list[string]
      expiration_policy:
        nullable: true
  common_gates:
    - PRE_WORLD_COMMIT
    - SCREENPLAY_LOCK
    - SCENE_LOCK
    - SHOT_SPEC_LOCK
    - ANIMATIC_LOCK
    - TAKE_ACCEPTANCE
    - SHOT_LOCK
    - SCENE_ASSEMBLY_LOCK
    - EPISODE_LOCK
    - MASTER_LOCK
# =====================================================================
# 8. QC PLAN
# =====================================================================
QC_plan:
  QCPlan:
    fields:
      qc_plan_id:
      target_ref:
      QC_contract_ref:
      artifact_type:
      quality_tier:
      criticality:
      deterministic_checks:
        type: list[PlannedQCCheck]
      specialist_critics:
        type: list[PlannedCritic]
      viewer_critics:
        type: list[PlannedCritic]
      product_critics:
        type: list[PlannedCritic]
      hierarchy_checks:
        type: list[PlannedQCCheck]
      adjudicator:
        type: PlannedCritic
      budget:
        type: QCBudget
      dependencies:
      parallelism:
      created_at:
  generated_by:
    QCPlanner
# =====================================================================
# 9. QC BUDGET
# =====================================================================
QC_budget:
  QCBudget:
    fields:
      level:
        enum:
          - minimal
          - routine
          - elevated
          - critical
          - flagship
      max_critic_invocations:
      max_multimodal_invocations:
      max_viewer_simulations:
      max_rechecks:
      max_adjudication_rounds:
      compute_budget:
      latency_budget:
  allocation_features:
    - quality_tier
    - artifact criticality
    - semantic blast radius
    - irreversibility
    - production cost
    - historical failure risk
    - critic disagreement risk
  principle: >
    QC depth should scale with consequence.
# =====================================================================
# 10. QC RUN
# =====================================================================
QC_run:
  QCRun:
    fields:
      qc_run_id:
      target_ref:
      QC_plan_ref:
      target_digest:
      source_revision_refs:
      critic_versions:
      validator_versions:
      check_results:
        type: list[QCCheckResult]
      critic_results:
        type: list[CriticResult]
      disagreements:
        type: list[QCDisagreement]
      adjudication_ref:
        nullable: true
      outcome:
        type: QCOutcome
      violations:
        type: list[Violation]
      confidence:
      uncertainty:
      root_cause_ref:
        nullable: true
      repair_recommendation_ref:
        nullable: true
      started_at:
      completed_at:
  immutable_after_completion:
    value: true
# =====================================================================
# 11. DETERMINISTIC CHECK SPEC
# =====================================================================
deterministic_checks:
  QCCheckSpec:
    fields:
      check_id:
      check_type:
      description:
      hard:
      expected_source_ref:
      validator_id:
      tolerance:
        nullable: true
      violation_code:
      applies_when:
  QCCheckResult:
    fields:
      check_result_id:
      check_id:
      status:
        enum:
          - PASS
          - FAIL
          - NOT_APPLICABLE
          - ERROR
      expected:
      observed:
      evidence_refs:
      confidence:
      validator_version:
      execution_time_ms:
  fail_closed:
    required_hard_check_error: true
# =====================================================================
# 12. VALIDATOR REGISTRY
# =====================================================================
validator_registry:
  DeterministicValidatorSpec:
    fields:
      validator_id:
      version:
      supported_check_types:
      supported_artifact_types:
      deterministic:
      input_contract:
      output_contract:
  initial_validators:
    schema:
      - artifact_schema_validator
      - metadata_validator
    media:
      - duration_validator
      - frame_rate_validator
      - resolution_validator
      - aspect_ratio_validator
      - audio_channel_validator
      - loudness_validator
      - sync_validator
      - corruption_validator
    World:
      - visible_state_oracle_validator
      - handedness_validator
      - prop_presence_validator
      - wardrobe_variant_validator
      - damage_state_validator
      - lighting_state_validator
      - text_truth_validator
    creator:
      - creator_lock_validator
      - intentional_artifact_preservation_validator
    editorial:
      - shot_order_validator
      - timeline_gap_validator
      - timeline_overlap_validator
      - subtitle_timing_validator
# =====================================================================
# 13. WORLD ORACLE QC
# =====================================================================
world_oracle_QC:
  purpose: >
    Compare canonical expected state to observed artifact state before subjective
    evaluation.
  WorldOracleEvaluation:
    fields:
      evaluation_id:
      target_ref:
      World_coordinate:
      expected_state_ref:
      observations:
        type: list[ObservedWorldFact]
      mismatches:
        type: list[WorldMismatch]
      confidence:
  ObservedWorldFact:
    fields:
      proposition:
      observed_value:
      confidence:
      evidence_ref:
  WorldMismatch:
    fields:
      fact_ref:
      expected_value:
      observed_value:
      severity:
      confidence:
      violation_code:
  example:
    expected:
      aria.left_shoulder: damaged
      receiver.hand: right
      emergency_lights: amber
    observed:
      aria.left_shoulder: intact
      receiver.hand: left
      emergency_lights: blue
    outcome: FAIL
    violations:
      - WORLD.PHYSICAL_STATE_MISMATCH
      - WORLD.HANDEDNESS_MISMATCH
      - WORLD.LIGHTING_STATE_MISMATCH
# =====================================================================
# 14. CREATOR FIDELITY QC
# =====================================================================
creator_fidelity_QC:
  purpose: >
    Detect cases where execution is technically polished but creatively wrong.
  CreatorFidelityEvaluation:
    fields:
      evaluation_id:
      target_ref:
      creator_model_ref:
      quality_semantics_ref:
      dimension_scores:
        type: map
      violated_non_negotiables:
        type: list[Ref]
      intentional_artifacts_preserved:
      unwanted_normalization_detected:
      anti_target_matches:
      confidence:
      evidence_refs:
  dimensions:
    - concept_fidelity
    - thematic_fidelity
    - tone_fidelity
    - aesthetic_fidelity
    - character_fidelity
    - performance_fidelity
    - sound_fidelity
    - ending_fidelity
  example:
    intended:
      >
      Deliberate limited 1990s cel animation.
    observed:
      >
      Smooth modern interpolated CGI.
    violation:
      CREATIVE.AESTHETIC_NORMALIZATION
# =====================================================================
# 15. SPECIALIST CRITIC CONTRACT
# =====================================================================
specialist_critic:
  SpecialistCriticSpec:
    fields:
      critic_id:
      version:
      domain:
      description:
      supported_artifact_types:
      required_context_views:
      forbidden_context_views:
      output_dimensions:
      violation_codes:
      implementation_requirements:
      minimum_calibration_state:
  CriticResult:
    fields:
      critic_result_id:
      critic_id:
      target_ref:
      verdict:
        enum:
          - PASS
          - FAIL
          - MIXED
          - UNCERTAIN
      dimension_scores:
        type: map
      violations:
        type: list[Violation]
      strengths:
        type: list[QualityObservation]
      concerns:
        type: list[QualityObservation]
      confidence:
      uncertainty:
      evidence_refs:
      implementation_ref:
      created_at:
# =====================================================================
# 16. INITIAL SPECIALIST CRITICS
# =====================================================================
specialist_critics:
  visual:
    responsibilities:
      - composition
      - identity
      - style
      - lighting
      - visual hierarchy
      - artifact detection
  animation_motion:
    responsibilities:
      - body mechanics
      - temporal coherence
      - pose integrity
      - motion readability
      - intentional frame cadence
  performance:
    responsibilities:
      - subtext
      - facial behavior
      - timing
      - emotional truth
      - reaction authenticity
  continuity:
    responsibilities:
      - entity identity
      - props
      - costume
      - damage
      - space
      - temporal continuity
  cinematography:
    responsibilities:
      - framing
      - lens logic
      - camera motivation
      - visual information flow
      - scale
  editing:
    responsibilities:
      - rhythm
      - continuity
      - cut motivation
      - information timing
      - emotional timing
  dialogue:
    responsibilities:
      - intelligibility
      - delivery
      - synchronization
      - character voice
      - exposition
  acoustic:
    responsibilities:
      - physical sound logic
      - ambience
      - spatial coherence
      - Foley
      - dynamic balance
  music:
    responsibilities:
      - emotional function
      - thematic support
      - hit points
      - over-scoring
      - cue continuity
  narrative:
    responsibilities:
      - scene function
      - causality
      - promise/payoff
      - escalation
      - structural integrity
  character:
    responsibilities:
      - motivation
      - psychological coherence
      - relationship behavior
      - arc integrity
  epistemic:
    responsibilities:
      - knowledge flow
      - reveal timing
      - impossible character knowledge
      - audience-character information splits
# =====================================================================
# 17. COLD VIEWER
# =====================================================================
cold_viewer_QC:
  name: ColdViewer
  knowledge_policy:
    allowed:
      - rendered artifact
      - basic format context
      - subtitle/audio tracks as normal viewer receives
    forbidden:
      - CreatorModel
      - StoryContract
      - hidden World truth
      - future plot events
      - intended reveal explanation
      - production rationale
  evaluates:
    - comprehension
    - engagement
    - curiosity
    - emotional response
    - clarity
    - accidental confusion
    - predicted attention
    - twist suspicion
    - product promise perception
  output:
    ColdViewerResult:
      fields:
        viewer_archetype_ref:
        target_ref:
        comprehension:
        engagement:
        curiosity:
        emotional_state:
        confusion:
        suspicion:
        predictions:
        remembered_elements:
        perceived_promise:
        likely_drop_points:
        confidence:
        evidence_refs:
  importance: >
    Prevents internal knowledge from making the studio believe a confusing film
    is clear simply because every agent already knows the story.
# =====================================================================
# 18. INFORMED CRITIC
# =====================================================================
informed_critic_QC:
  name: InformedCritic
  knowledge:
    allowed:
      - CreatorModel
      - AudienceModel
      - StoryContract
      - WorldModel
      - ProductionIntent
      - artifact
  evaluates:
    - intended_vs_realized
    - setup/payoff
    - character truth
    - thematic expression
    - information strategy
    - creative locks
    - production intent
  core_question: >
    Given what this project intends to do, did it actually do it?
# =====================================================================
# 19. REWATCH CRITIC
# =====================================================================
rewatch_critic_QC:
  name: RewatchCritic
  knowledge:
    allowed:
      - complete artifact
      - final truth
      - reveal state
      - prior clues
      - World history
      - StoryContract
  evaluates:
    - retrospective coherence
    - clue fairness
    - hidden setup
    - reveal integrity
    - accidental contradiction
    - twist cheat
    - thematic recontextualization
    - rewatch enrichment
  key_question: >
    After knowing the ending, does the earlier film become richer rather than
    obviously dishonest?
# =====================================================================
# 20. PRODUCT CRITIC
# =====================================================================
product_critic_QC:
  name: ProductCritic
  consumes:
    - ProductMarketModel
    - AudienceModel
    - artifact
    - format context
  evaluates:
    - concept legibility
    - hook
    - distinctiveness
    - identity
    - first-minute promise
    - memorability
    - repeatability cues
    - perceived premium quality
  authority:
    creative_override: false
# =====================================================================
# 21. CRITIC CONTEXT FIREWALL
# =====================================================================
critic_context_firewall:
  purpose: >
    Prevent critic contamination from information the evaluated perspective
    should not possess.
  ContextAccessPolicy:
    fields:
      critic_id:
      allowed_views:
      forbidden_views:
      masking_rules:
      projection_version:
  enforcement:
    required: true
  example:
    ColdViewer:
      cannot_see:
        - intended_twist
        - future_scene
        - hidden_character_motivation
  violation:
    code: QC.CRITIC_CONTEXT_LEAK
# =====================================================================
# 22. QUALITY DIMENSIONS
# =====================================================================
quality_dimensions:
  technical:
    - artifact_integrity
    - resolution
    - timing
    - audio_sync
    - encoding
  creative:
    - creator_fidelity
    - aesthetic_fidelity
    - thematic_fidelity
    - tonal_fidelity
  World:
    - state_accuracy
    - continuity
    - identity
    - physical_coherence
  narrative:
    - causality
    - scene_function
    - escalation
    - setup_payoff
    - ending_quality
  character:
    - motivation
    - psychology
    - relationship_truth
    - performance_truth
  cinematic:
    - composition
    - camera
    - blocking
    - visual_storytelling
    - edit
  acoustic:
    - ambience
    - Foley
    - sound_logic
    - dialogue
    - music
    - mix
  audience:
    - comprehension
    - engagement
    - desired_emotional_effect
    - surprise
    - aftertaste
  product:
    - hook
    - legibility
    - distinctiveness
    - identity
    - memorability
    - repeatability
# =====================================================================
# 23. VIOLATION TAXONOMY
# =====================================================================
violation_taxonomy:
  Violation:
    fields:
      violation_id:
      code:
      category:
      target_ref:
      scope_ref:
      severity:
        enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          - BLOCKER
      hard:
        type: bool
      description:
      expected:
        nullable: true
      observed:
        nullable: true
      evidence_refs:
      confidence:
      critic_refs:
      likely_root_cause_classes:
        type: list[string]
      recommended_repair_class:
        nullable: true
      minimum_repair_scope_hint:
        nullable: true
      introduced_at:
        nullable: true
  initial_codes:
    World:
      - WORLD.IDENTITY_MISMATCH
      - WORLD.PHYSICAL_STATE_MISMATCH
      - WORLD.PROP_MISMATCH
      - WORLD.HANDEDNESS_MISMATCH
      - WORLD.WARDROBE_MISMATCH
      - WORLD.DAMAGE_STATE_MISMATCH
      - WORLD.SPATIAL_MISMATCH
      - WORLD.LIGHTING_STATE_MISMATCH
      - WORLD.TEMPORAL_MISMATCH
      - WORLD.IMPOSSIBLE_CHARACTER_KNOWLEDGE
    creative:
      - CREATIVE.NON_NEGOTIABLE_VIOLATION
      - CREATIVE.AESTHETIC_DRIFT
      - CREATIVE.AESTHETIC_NORMALIZATION
      - CREATIVE.TONE_DRIFT
      - CREATIVE.CHARACTER_DRIFT
      - CREATIVE.THEME_EXPOSITION
      - CREATIVE.ENDING_INTENT_FAILURE
    visual:
      - VISUAL.IDENTITY_DRIFT
      - VISUAL.ANATOMY_FAILURE
      - VISUAL.HAND_FAILURE
      - VISUAL.GEOMETRY_FAILURE
      - VISUAL.COMPOSITING_ARTIFACT
      - VISUAL.LIGHTING_INCONSISTENCY
      - VISUAL.TEXT_INACCURACY
      - VISUAL.STYLE_DRIFT
    motion:
      - MOTION.TEMPORAL_INCOHERENCE
      - MOTION.POSE_FAILURE
      - MOTION.PHYSICS_FAILURE
      - MOTION.CAMERA_PATH_FAILURE
      - MOTION.UNINTENDED_SMOOTHING
      - MOTION.JITTER
    performance:
      - PERFORMANCE.EMOTION_MISALIGNMENT
      - PERFORMANCE.SUBTEXT_FAILURE
      - PERFORMANCE.REACTION_FAILURE
      - PERFORMANCE.TIMING_FAILURE
      - PERFORMANCE.CHARACTER_VOICE_FAILURE
    dialogue:
      - DIALOGUE.INTELLIGIBILITY_FAILURE
      - DIALOGUE.LIPSYNC_FAILURE
      - DIALOGUE.EXPOSITION_OVERLOAD
      - DIALOGUE.CHARACTER_VOICE_DRIFT
    acoustic:
      - ACOUSTIC.AMBIENCE_MISMATCH
      - ACOUSTIC.FOLEY_MISMATCH
      - ACOUSTIC.SPATIAL_MISMATCH
      - ACOUSTIC.SYNC_FAILURE
      - ACOUSTIC.MIX_MASKING
    music:
      - MUSIC.EMOTIONAL_MISALIGNMENT
      - MUSIC.OVER_SCORING
      - MUSIC.HIT_POINT_FAILURE
      - MUSIC.MOTIF_INCONSISTENCY
    editorial:
      - EDIT.RHYTHM_FAILURE
      - EDIT.CONTINUITY_FAILURE
      - EDIT.INFORMATION_TIMING_FAILURE
      - EDIT.EMOTIONAL_TIMING_FAILURE
    narrative:
      - NARRATIVE.CAUSALITY_FAILURE
      - NARRATIVE.SCENE_FUNCTION_FAILURE
      - NARRATIVE.PROMISE_PAYOFF_FAILURE
      - NARRATIVE.REVEAL_TOO_EARLY
      - NARRATIVE.REVEAL_TOO_LATE
      - NARRATIVE.ENDING_CHEAT
      - NARRATIVE.ESCALATION_FAILURE
    audience:
      - AUDIENCE.ACCIDENTAL_CONFUSION
      - AUDIENCE.ATTENTION_DROP
      - AUDIENCE.EMOTIONAL_MISS
      - AUDIENCE.SURPRISE_COLLAPSE
      - AUDIENCE.ACCESSIBILITY_FAILURE
    product:
      - PRODUCT.WEAK_HOOK
      - PRODUCT.PREMISE_ILLEGIBLE
      - PRODUCT.GENERICITY_DRIFT
      - PRODUCT.FIRST_MINUTE_PROMISE_FAILURE
      - PRODUCT.IDENTITY_WEAK
    technical:
      - TECH.FILE_CORRUPT
      - TECH.RESOLUTION_FAILURE
      - TECH.FRAME_RATE_FAILURE
      - TECH.DURATION_FAILURE
      - TECH.AUDIO_SYNC_FAILURE
      - TECH.LOUDNESS_FAILURE
      - TECH.DELIVERY_SPEC_FAILURE
# =====================================================================
# 24. VIOLATION SEVERITY
# =====================================================================
severity_semantics:
  INFO:
    acceptance_effect: none
  LOW:
    acceptance_effect: normally_none
  MEDIUM:
    acceptance_effect: policy_dependent
  HIGH:
    acceptance_effect: likely_fail
  CRITICAL:
    acceptance_effect: fail
  BLOCKER:
    acceptance_effect: immediate_fail
  hard_violation:
    pass_possible: false
# =====================================================================
# 25. QUALITY OBSERVATION
# =====================================================================
quality_observation:
  QualityObservation:
    fields:
      observation_id:
      dimension:
      statement:
      positive_or_negative:
      target_ref:
      evidence_refs:
      confidence:
      critic_ref:
  purpose: >
    Preserve strengths as well as defects so successful creative and production
    choices become institutional evidence.
# =====================================================================
# 26. CRITIC ENSEMBLE
# =====================================================================
critic_ensemble:
  CriticEnsemble:
    fields:
      ensemble_id:
      target_ref:
      critic_refs:
      weighting_policy:
      diversity_policy:
      minimum_independent_perspectives:
      results:
      aggregate_dimensions:
      disagreement_ref:
        nullable: true
  diversity_dimensions:
    - model_family
    - context_access
    - critic_role
    - viewer_archetype
  principle: >
    Multiple critics are valuable when their error modes are meaningfully
    independent.
# =====================================================================
# 27. QC DISAGREEMENT
# =====================================================================
QC_disagreement:
  QCDisagreement:
    fields:
      disagreement_id:
      target_ref:
      dimension:
      critic_results:
      severity:
      decision_impact:
      disagreement_measure:
      likely_causes:
      additional_evidence_options:
      state:
        enum:
          - open
          - adjudicating
          - resolved
          - accepted_uncertainty
  disagreement_causes:
    - subjective_boundary
    - critic_context_difference
    - implementation_error
    - calibration_error
    - genuine_audience_segment_split
    - insufficient_evidence
    - conflicting_project_requirements
  signal:
    type: QC.CRITIC_DISAGREEMENT
# =====================================================================
# 28. ADJUDICATOR
# =====================================================================
adjudication:
  QCAdjudicator:
    purpose: >
      Integrate validator results, critic findings, hierarchy, hard constraints,
      uncertainty and disagreements into an acceptance decision.
  AdjudicationRequest:
    fields:
      target_ref:
      QC_contract_ref:
      check_results:
      critic_results:
      disagreements:
      source_models:
      quality_tier:
      criticality:
  AdjudicationResult:
    fields:
      adjudication_id:
      target_ref:
      outcome:
        type: QCOutcome
      decisive_violation_refs:
      supporting_violation_refs:
      accepted_risks:
      unresolved_uncertainties:
      confidence:
      rationale:
      evidence_refs:
      root_cause_required:
      repair_required:
  principles:
    - hard violations fail
    - non-compensatory floors honored
    - creator locks outrank generic product preference
    - low-confidence strategic artifacts may return UNCERTAIN
    - critic majority is not automatically authoritative
# =====================================================================
# 29. PASS POLICY
# =====================================================================
pass_policy:
  baseline:
    hard_checks:
      requirement: all_applicable_pass
    blocker_or_critical_violations:
      allowed: false
    high_violations:
      allowed:
        default: false
        exception: explicit_contract_policy
    confidence:
      must_meet_contract_minimum: true
    required_critic_coverage:
      must_complete: true
  conditional_pass:
    allowed: false_by_default
  accepted_known_issue:
    requires:
      - explicit policy
      - non_hard_issue
      - evidence
      - certificate_annotation
# =====================================================================
# 30. UNCERTAINTY POLICY
# =====================================================================
uncertainty_policy:
  triggers:
    - insufficient_visual_evidence
    - critic_confidence_low
    - major_critic_disagreement
    - unavailable_required_context
    - ambiguous_creator_requirement
    - hidden_state_not_observable
    - borderline_threshold
  response_options:
    - run_additional_critic
    - run_different_model_family
    - request_exact_validator
    - inspect_higher_resolution_artifact
    - evaluate_temporal_window
    - run ColdViewer_variant
    - run targeted production probe
    - accept_bounded_uncertainty_if_contract_allows
  max_rounds:
    governed_by: QCBudget
  exhausted_uncertainty:
    critical_artifact:
      default: FAIL_CLOSED
    noncritical_artifact:
      contract_defined: true
# =====================================================================
# 31. HIERARCHICAL QC
# =====================================================================
hierarchical_QC:
  levels:
    frame:
      evaluates:
        - local visual integrity
    shot:
      evaluates:
        - continuity
        - performance
        - camera
        - audio
        - World state
    scene:
      evaluates:
        - scene objective
        - rhythm
        - emotional progression
        - information progression
    sequence:
      evaluates:
        - escalation
        - coherence
        - pacing
        - thematic progression
    episode:
      evaluates:
        - structure
        - promise/payoff
        - audience trajectory
        - ending
        - product identity
    season:
      evaluates:
        - arc continuity
        - character progression
        - repeatability
        - cumulative payoff
    master:
      evaluates:
        - technical delivery
        - full audiovisual coherence
        - final creative fidelity
  rule: >
    Lower-level certificates are inputs to higher-level QC but do not replace
    higher-level evaluation.
# =====================================================================
# 32. SEMANTIC DECISION QC
# =====================================================================
decision_QC:
  targets:
    - proposed WorldEvent
    - strategic narrative decision
    - ending branch
    - major reveal
    - CreativeLock
    - ProductionStrategy where contract requires
  evaluates:
    - authority
    - creator intent
    - World rule compliance
    - character integrity
    - audience effect
    - product impact
    - downstream blast radius
  output:
    QualityCertificate_or_FAIL
  importance: >
    QC operates before render too; not all quality failures should be discovered
    after expensive audiovisual generation.
# =====================================================================
# 33. TAKE SELECTION
# =====================================================================
take_selection:
  input:
    - TakePortfolio
    - QCContract
    - expected World state
    - CreatorModel
    - ProductionIntent
  TakeEvaluation:
    fields:
      take_id:
      hard_check_pass:
      dimension_scores:
      violations:
      confidence:
      rank:
  selection_policy:
    - reject hard-failing takes
    - compare remaining candidates by project-specific quality dimensions
    - prefer stronger creator fidelity over generic polish
    - consider confidence
    - if top candidates too close and quality tier critical, request more evidence
  output:
    selected_take_id_or_none
  no_valid_take:
    behavior:
      - FAIL
      - initiate root-cause/repair path
# =====================================================================
# 34. ROOT CAUSE ANALYSIS
# =====================================================================
root_cause:
  RootCauseAnalysis:
    fields:
      root_cause_id:
      target_ref:
      violation_refs:
      candidate_causes:
        type: list[RootCauseCandidate]
      primary_cause:
        nullable: true
      contributing_causes:
        type: list[RootCauseCandidate]
      confidence:
      evidence_refs:
      learning_targets:
        type: list[LearningTarget]
  RootCauseCandidate:
    fields:
      cause_class:
        enum:
          - creative_spec
          - World_state
          - story_decision
          - shot_spec
          - asset
          - production_strategy
          - implementation_capability
          - provider_health
          - prompt_or_conditioning
          - deterministic_pipeline
          - edit
          - audio
          - QC_false_positive
          - unknown
      target_ref:
        nullable: true
      probability:
      evidence_refs:
  principle: >
    Root cause is causal diagnosis, not nearest visible defect.
# =====================================================================
# 35. REPAIR RECOMMENDATION
# =====================================================================
repair_recommendation:
  RepairRecommendation:
    fields:
      recommendation_id:
      target_ref:
      root_cause_ref:
      repair_class:
        enum:
          - no_repair_possible
          - validator_recheck
          - same_strategy_retry
          - new_take
          - conditioning_change
          - implementation_change
          - asset_fix
          - layer_patch
          - deterministic_fix
          - audio_fix
          - edit_fix
          - shot_spec_recompile
          - production_strategy_recompile
          - story_recompile
          - World_state_repair
          - creative_lock_reopen
      minimum_scope:
        type: RepairScope
      expected_fix_probability:
      expected_cost:
      expected_latency:
      affected_dependencies:
      preserved_dependencies:
      requires_upstream_authority:
      requires_re_QC:
        value: true
      evidence_refs:
  RepairScope:
    fields:
      scope_kind:
        enum:
          - artifact_component
          - frame_range
          - layer
          - shot
          - scene
          - sequence
          - episode
          - creative_model
          - World_state
      target_refs:
      reason:
# =====================================================================
# 36. MINIMUM BLAST RADIUS
# =====================================================================
repair_blast_radius:
  principle: >
    Repair should touch the minimum causal scope capable of resolving the defect.
  algorithm:
    - identify violation
    - identify root cause
    - map causal source artifact/state
    - traverse downstream dependencies
    - preserve accepted unaffected branches
    - define repair scope
    - invalidate only dependent certificates
    - re-run required QC
  example:
    violation:
      WORLD.HANDEDNESS_MISMATCH
    observed:
      receiver_in_left_hand
    expected:
      receiver_in_right_hand
    root_cause:
      generative shot production
    repair:
      scope: shot_217_or_receiver_layer
    preserve:
      - shot_216
      - shot_218
      - unrelated_dialogue
      - unchanged_music
# =====================================================================
# 37. CERTIFICATE MODEL
# =====================================================================
quality_certificate:
  QualityCertificate:
    fields:
      certificate_id:
      target_ref:
      target_digest:
      QC_contract_ref:
      QC_run_ref:
      outcome:
        value: PASS
      certified_dimensions:
      known_nonblocking_issues:
      accepted_uncertainties:
      source_revision_refs:
        CreatorModel:
          nullable: true
        AudienceModel:
          nullable: true
        ProductMarketModel:
          nullable: true
        WorldModel:
          nullable: true
        SelfModel:
          nullable: true
        ProductionModel:
          nullable: true
      validator_versions:
      critic_versions:
      QC_policy_version:
      issued_at:
      expires_when:
        type: list[CertificateInvalidationCondition]
      digest:
  immutable: true
  principle: >
    Acceptance is explicit, versioned and tied to exact artifact/source revisions.
# =====================================================================
# 38. CERTIFICATE INVALIDATION
# =====================================================================
certificate_invalidation:
  CertificateInvalidationCondition:
    fields:
      dependency_ref:
      change_type:
      materiality_rule:
  invalidation_triggers:
    - artifact content changed
    - applicable CreatorModel lock changed
    - relevant World expected state changed
    - applicable StoryContract changed
    - applicable ProductionIntent changed
    - QC policy changed in retroactive-critical mode
  normally_does_not_invalidate:
    - unrelated SelfModel provider degradation
    - unrelated shot change
    - irrelevant metadata update
  rule: >
    Accepted artifacts remain accepted until a materially relevant dependency changes.
# =====================================================================
# 39. QC PLAN COMPILER
# =====================================================================
QC_plan_compiler:
  QCPlanner:
    inputs:
      - target type
      - quality tier
      - criticality
      - applicable CreatorModel
      - World expected state
      - AudienceModel
      - ProductMarketModel
      - ProductionIntent
      - historical failure risk
    outputs:
      - QCPlan
    steps:
      - select mandatory deterministic validators
      - select required specialist critics
      - select viewer modes
      - determine ensemble size
      - assign QCBudget
      - add hierarchical checks
      - select adjudicator
      - define uncertainty policy
  dynamic:
    value: true
# =====================================================================
# 40. CRITIC SELECTION
# =====================================================================
critic_selection:
  inputs:
    - artifact type
    - known failure modes
    - quality tier
    - creator intent
    - World constraints
    - audience/product requirements
    - critic calibration history
    - critic implementation availability
  requirements:
    - independence where practical
    - relevant modality competence
    - context firewall compatibility
    - calibration threshold
  SelfModel:
    used_for:
      - implementation suitability
      - multimodal competence
      - latency
      - cost
      - known critic-model weaknesses
# =====================================================================
# 41. CRITIC CALIBRATION
# =====================================================================
critic_calibration:
  CriticCalibrationState:
    fields:
      critic_id:
      implementation_id:
      dimension:
      known_positive_accuracy:
      known_negative_accuracy:
      false_pass_rate:
      false_fail_rate:
      uncertainty_accuracy:
      calibration_error:
      sample_count:
      confidence:
      benchmark_version:
      last_calibrated_at:
  high_priority_metric:
    false_pass_rate: >
      Particularly important for hard or expensive downstream gates.
  rule: >
    A critic with poor calibration cannot remain authoritative merely because it
    produces confident explanations.
# =====================================================================
# 42. QC BENCHMARK SUITES
# =====================================================================
QC_benchmarks:
  QCBenchmarkSuite:
    fields:
      suite_id:
      version:
      target_dimensions:
      known_good_examples:
      known_bad_examples:
      borderline_examples:
      hidden_labels:
      severity_distribution:
      project_style_distribution:
      artifact_types:
  suite_types:
    deterministic:
      - known World mismatches
      - sync defects
      - text defects
      - duration defects
    visual:
      - identity drift
      - hand defects
      - motion defects
      - style drift
    narrative:
      - causal contradiction
      - promise/payoff
      - ending cheat
      - reveal timing
    audience:
      - confusion
      - surprise
      - emotional alignment
    product:
      - premise legibility
      - genericity
      - hook strength
  principle: >
    Calibration suites should include intentional unconventional art so critics
    do not learn "generic polish = quality."
# =====================================================================
# 43. FALSE PASS / FALSE FAIL LEARNING
# =====================================================================
QC_error_learning:
  QCErrorCase:
    fields:
      error_case_id:
      QC_run_ref:
      predicted_outcome:
      later_supported_outcome:
      error_type:
        enum:
          - false_pass
          - false_fail
          - confidence_miscalibration
          - root_cause_error
      evidence_refs:
      affected_critic_refs:
      affected_validator_refs:
  later_supported_outcome_sources:
    - creator feedback
    - higher-level QC
    - downstream failure
    - rewatch analysis
    - deterministic proof
    - calibrated external audience evidence
  use:
    - critic calibration
    - QCPlan adaptation
    - critic selection
# =====================================================================
# 44. QC SIGNALS
# =====================================================================
QC_signals:
  signal_types:
    - QC.PASS
    - QC.FAIL
    - QC.UNCERTAIN
    - QC.CRITIC_DISAGREEMENT
    - QC.ROOT_CAUSE_IDENTIFIED
    - QC.REPAIR_REQUIRED
    - QC.REPAIR_SUCCEEDED
    - QC.REPEATED_FAILURE_PATTERN
    - QC.FALSE_PASS_DETECTED
    - QC.FALSE_FAIL_DETECTED
    - QC.QUALITY_REGRESSION
    - QC.QUALITY_IMPROVEMENT
  QCSignal:
    fields:
      signal_id:
      signal_type:
      target_refs:
      severity:
      salience_hint:
      urgency:
      confidence:
      downstream_impact:
      violation_refs:
      evidence_refs:
      created_at:
  consumer:
    primary: PolycognitiveRuntime
# =====================================================================
# 45. POLYCOGNITIVE RUNTIME INTEGRATION
# =====================================================================
polycognitive_integration:
  distinction:
    quality_cognition:
      owner: PolycognitiveRuntime
      role:
        - anticipate quality risk
        - reason about likely defects
        - request QC
        - explain possible causes
    formal_acceptance:
      owner: AutonomousQC
  runtime_to_QC:
    sends:
      - DecisionFrame
      - selected Proposal
      - branch scorecard
      - CreatorModel refs
      - World rationale
      - accepted uncertainty
      - expected quality dimensions
  QC_to_runtime:
    sends:
      - PASS/FAIL/UNCERTAIN
      - typed violations
      - critic disagreement
      - root cause
      - repair recommendation
      - QC signals
  on_FAIL:
    runtime_may:
      - activate quality cognition
      - activate production cognition
      - activate narrative/cinematic/etc cognition
      - select repair proposal
# =====================================================================
# 46. WORLD MODEL INTEGRATION
# =====================================================================
world_model_integration:
  consumes:
    - WorldCoordinate
    - WorldSnapshot
    - expected_visible_state
    - WorldRules
    - identity facts
    - physical state
    - relationship state where relevant
    - knowledge state where relevant
  uses:
    - deterministic oracle checks
    - informed criticism
  cannot:
    - mutate World state
    - reinterpret failed render as new canon
  crucial_rule: >
    Observed render divergence from World truth is a production failure, not a
    World update.
# =====================================================================
# 47. CREATIVE INTELLIGENCE INTEGRATION
# =====================================================================
creative_integration:
  consumes:
    - CreatorModel
    - QualitySemantics
    - StoryContract
    - EndingIntent
    - RevealIntent
    - CreativeLock
    - intentional artifacts
    - anti-targets
  creator_fidelity:
    hard_when:
      - explicit non-negotiable
      - lock-protected semantic
      - intentional style constraint
  important_rule: >
    QC must not fail intentional roughness, limited animation, unusual pacing,
    ambiguity or aesthetic artifacts merely because a generic critic prefers
    conventional polish.
# =====================================================================
# 48. AUDIENCE / PRODUCT INTEGRATION
# =====================================================================
audience_product_integration:
  consumes:
    - AudienceModel
    - ViewerArchetypes
    - ExperienceTrajectory
    - CognitiveTrajectory
    - ProductMarketModel
  provides:
    - ColdViewer execution
    - InformedCritic execution
    - RewatchCritic execution
    - ProductCritic execution
  audience_failure_example:
    intended:
      audience_should_suspect_Eva: moderate
    observed:
      GenreExpert:
        suspicion: 0.98
    possible_violation:
      NARRATIVE.REVEAL_TOO_EARLY
# =====================================================================
# 49. SELF MODEL INTEGRATION
# =====================================================================
self_model_integration:
  uses:
    - critic implementation competence
    - multimodal analysis reliability
    - tool availability
    - QC latency/cost
    - known critic failure modes
  outputs_to_SelfModel:
    - artifact quality observations
    - implementation failures
    - critic-model performance evidence
  distinction:
    QC:
      says: >
        artifact violated handedness.
    SelfModel:
      learns: >
        renderer implementation had elevated handedness failure under this task slice.
# =====================================================================
# 50. PRODUCTION MODEL INTEGRATION
# =====================================================================
production_model_integration:
  consumes:
    - ProductionIntent
    - ProductionStrategy
    - ProductionInvariantBindings
    - expected quality tier
    - take policy
    - known expected failure modes
  returns:
    - accepted take
    - production violation
    - root cause
    - RepairRecommendation
  learning_split:
    SelfModel:
      learns implementation capability
    ProductionModel:
      learns strategy effectiveness
# =====================================================================
# 51. PRODUCTION ENGINE INTEGRATION
# =====================================================================
production_engine_integration:
  future_spec: 08_quantum_production_engine_build_spec.yaml
  engine_to_QC:
    - generated artifact
    - execution receipt
    - lineage
    - implementation versions
    - source revisions
    - take portfolio
  QC_to_engine:
    PASS:
      action:
        - mark artifact accepted
        - freeze accepted artifact
        - continue downstream
    FAIL:
      action:
        - block dependent promotion
        - invoke approved repair workflow
    UNCERTAIN:
      action:
        - hold artifact
        - execute targeted evidence plan
  hard_rule: >
    ProductionEngine cannot self-certify generated output.
# =====================================================================
# 52. QC FOR ANIMATIC
# =====================================================================
animatic_QC:
  purpose: >
    Catch semantic, structural, cinematic, audience and pacing failures before
    expensive final production.
  evaluates:
    - story comprehension
    - scene function
    - shot clarity
    - edit rhythm
    - timing
    - reveal timing
    - emotional trajectory
    - dialogue necessity
    - composition intent
    - product promise
  does_not_require:
    - final visual fidelity
    - final sound polish
  high_leverage:
    value: very_high
  lock:
    output: animatic.lock
# =====================================================================
# 53. QC FOR SCREENPLAY / STORY
# =====================================================================
story_QC:
  artifact_types:
    - StoryContract
    - screenplay_IR
    - scene_IR
  evaluates:
    - causal integrity
    - character motivation
    - information flow
    - setup/payoff
    - dramatic progression
    - ending coherence
    - theme
    - audience comprehension risk
  principle: >
    Narrative defects should be discovered before they become expensive shots.
# =====================================================================
# 54. QC FOR SHOT SPEC
# =====================================================================
shot_spec_QC:
  evaluates:
    - World context completeness
    - expected visible state
    - cinematic purpose
    - information purpose
    - character performance intention
    - production constraints
    - continuity
    - renderability
  pass_effect:
    - shot eligible for production planning
# =====================================================================
# 55. QC FOR FINAL SHOT
# =====================================================================
final_shot_QC:
  required_layers:
    - technical
    - deterministic World invariants
    - creator fidelity
    - visual
    - motion
    - performance
    - acoustic
    - continuity
  viewer_QC:
    optional_or_required_by_criticality: true
  output:
    - QualityCertificate
# =====================================================================
# 56. QC FOR SCENE
# =====================================================================
scene_QC:
  inputs:
    - accepted shot certificates
    - assembled scene artifact
  evaluates:
    - scene objective
    - emotional progression
    - spatial continuity
    - edit rhythm
    - information flow
    - sound continuity
    - performance continuity
  principle: >
    Good shots can still produce a bad scene.
# =====================================================================
# 57. QC FOR EPISODE
# =====================================================================
episode_QC:
  evaluates:
    - opening promise
    - structural progression
    - audience trajectory
    - character arc
    - reveal strategy
    - thematic coherence
    - pacing modulation
    - visual identity
    - acoustic identity
    - product identity
    - ending
    - rewatch coherence
  viewer_modes:
    required:
      - ColdViewer
      - InformedCritic
      - RewatchCritic
  product:
    required: true
  output:
    - episode QualityCertificate
# =====================================================================
# 58. MASTER QC
# =====================================================================
master_QC:
  evaluates:
    creative:
      - final CreatorModel fidelity
    technical:
      - delivery format
      - resolution
      - frame rate
      - sync
      - loudness
      - subtitles
      - encoding
    audiovisual:
      - complete playback
      - artifact integrity
      - transitions
      - credits where relevant
  output:
    - master.lock_eligible_certificate
# =====================================================================
# 59. QC PRECHECK / PREVENTION
# =====================================================================
preflight_QC:
  purpose: >
    Prevent known likely failures before generation.
  inputs:
    - ShotSpec
    - ProductionStrategy
    - SelfModel
    - known QC failure patterns
    - World constraints
  PreflightRiskAssessment:
    fields:
      target_ref:
      predicted_violation_codes:
      probabilities:
      critical_constraints_at_risk:
      recommended_prevention:
      proceed:
      confidence:
  example:
    >
    Two-character hand-object closeup uses renderer with 0.52 handedness
    reliability and no structural anchor.
  outcome:
    proceed: false
    recommendation:
      - strengthen invariant binding
      - use alternate strategy
# =====================================================================
# 60. FAILURE PATTERN MEMORY
# =====================================================================
failure_pattern_memory:
  QCFailurePattern:
    fields:
      pattern_id:
      condition_features:
      violation_codes:
      likely_causes:
      successful_repairs:
      unsuccessful_repairs:
      occurrence_count:
      repair_success_rate:
      prevention_options:
      confidence:
  use:
    - preflight
    - root cause
    - repair selection
    - ProductionModel learning
    - SelfModel learning
  example:
    condition:
      - visible_hand_object_interaction
      - exact_handedness_required
      - pure_text_to_video
    likely_violation:
      WORLD.HANDEDNESS_MISMATCH
    successful_repair:
      - pose anchor
      - deterministic prop composite
# =====================================================================
# 61. SUCCESS PATTERN MEMORY
# =====================================================================
success_pattern_memory:
  QCSuccessPattern:
    fields:
      pattern_id:
      condition_features:
      quality_dimensions:
      production_strategy_signature:
      creator_profile_features:
      success_count:
      confidence:
      evidence_refs:
  purpose: >
    Institutional experience should preserve what consistently works, not just
    what fails.
# =====================================================================
# 62. QC EXPERIENCE
# =====================================================================
QC_experience:
  QCExperienceRecord:
    fields:
      experience_id:
      target_type:
      target_features:
      QC_contract_ref:
      violations_found:
      outcome:
      later_outcome:
        nullable: true
      repair_count:
      repair_success:
      creator_feedback_ref:
        nullable: true
      critic_error_refs:
      created_at:
  use:
    - calibration
    - plan adaptation
    - failure prevention
# =====================================================================
# 63. REPAIR LOOP
# =====================================================================
repair_loop:
  flow: |
    artifact / decision
          ↓
        QC
          │
      ┌───┼─────────┐
      │   │         │
     PASS FAIL    UNCERTAIN
      │   │         │
      │   ▼         ▼
      │ root       more evidence
      │ cause        │
      │   │          └──→ QC
      │   ▼
      │ repair recommendation
      │   │
      │   ▼
      │ Polycognitive Runtime
      │   │
      │   ▼
      │ owning compiler / ProductionModel
      │   │
      │   ▼
      │ ProductionEngine
      │   │
      │   ▼
      │ repaired artifact
      │   │
      └───┴────→ QC
  maximum_repair_cycles:
    policy_defined: true
  repeated_failure:
    behavior:
      - escalate repair class
      - avoid same failed strategy indefinitely
      - update failure pattern
# =====================================================================
# 64. REPAIR ESCALATION
# =====================================================================
repair_escalation:
  levels:
    R1:
      name: same_strategy_local_retry
      examples:
        - new seed
        - alternate take
    R2:
      name: strategy_parameter_change
      examples:
        - stronger conditioning
        - more references
    R3:
      name: implementation_or_layer_change
      examples:
        - alternate renderer
        - deterministic patch
        - split layer
    R4:
      name: production_strategy_recompile
    R5:
      name: shot_spec_recompile
    R6:
      name: scene_or_story_semantic_recompile
    R7:
      name: creative_or_world_authority_reopen
  rule: >
    Escalate only when lower repair classes are unlikely to resolve root cause.
# =====================================================================
# 65. POSITIVE SIGNALS
# =====================================================================
positive_quality_signals:
  importance: >
    QC is not solely defect detection.
  examples:
    - exceptional performance take
    - strong first-minute identity
    - unusually effective silent reveal
    - excellent sound-space coherence
    - strong retro-aesthetic fidelity
    - highly legible visual storytelling
  use:
    - take selection
    - production experience
    - creator feedback correlation
    - future strategy preference
  QualityStrengthRecord:
    fields:
      strength_id:
      target_ref:
      dimension:
      statement:
      score:
      evidence_refs:
      confidence:
# =====================================================================
# 66. QC AND CREATOR FEEDBACK
# =====================================================================
creator_feedback_integration:
  creator_feedback:
    authority: higher_than_internal_subjective_QC_for_creator_intent
  if_creator_rejects_QC_PASS:
    possible_causes:
      - critic false pass
      - CreatorModel incomplete
      - execution defect missed
      - new creative preference
    required:
      - classify feedback
      - distinguish model-vs-critic failure
      - record QC error if supported
  if_creator_loves_QC_FAIL:
    possible_causes:
      - intentional deviation
      - critic false fail
      - CreatorModel incomplete
  principle: >
    Creator feedback is powerful calibration evidence, but one isolated reaction
    should not automatically rewrite all QC policy.
# =====================================================================
# 67. CRITIC IMPLEMENTATION ROUTING
# =====================================================================
critic_routing:
  owner_of_selection:
    QCPlanner_with_SelfModel_evidence
  SelfModel_inputs:
    - multimodal reasoning quality
    - temporal video understanding
    - audio understanding
    - structured output reliability
    - context limits
    - known failure modes
    - latency
    - cost
  diversity:
    optional_multi_model_family: true
  critical_final_artifact:
    may_require_independent_critic_families: true
# =====================================================================
# 68. HUMAN-FREE OPERATION
# =====================================================================
human_free_QC:
  normal_operation:
    human_required: false
  allowed_human_role:
    - optional creator review
    - explicit creator lock/reopen where configured
  prohibited_dependency:
    - human continuity checker
    - human take selector
    - human shot reviewer
    - human sound reviewer
    - human production supervisor
  objective: >
    Quantum should autonomously identify and repair ordinary quality failures.
# =====================================================================
# 69. QC POLICY
# =====================================================================
QC_policy:
  QCPolicy:
    fields:
      policy_id:
      version:
      gate_contract_map:
      severity_rules:
      confidence_rules:
      uncertainty_rules:
      critic_selection_rules:
      critic_diversity_rules:
      certificate_rules:
      repair_escalation_rules:
      calibration_requirements:
  hard_policy:
    cannot_be_changed_by:
      - critic
      - generator
      - ProductionEngine
      - SelfModel
# =====================================================================
# 70. QC POLICY LEARNING
# =====================================================================
QC_learning:
  learnable:
    - critic weighting
    - critic selection
    - uncertainty thresholds within approved bounds
    - QCPlan breadth
    - failure pattern prediction
    - repair recommendation ranking
  not_learnable_away:
    - creator locks
    - World hard invariants
    - file integrity
    - mandatory acceptance gates
    - governance boundaries
  policy_lifecycle:
    - candidate
    - offline
    - holdout
    - shadow
    - canary
    - externally_promoted
    - active
    - rollback
  anti_self_deception:
    - frozen benchmark sets
    - creator-feedback calibration
    - downstream failure evidence
    - critic diversity
    - false-pass tracking
# =====================================================================
# 71. QC PLAN ADAPTATION
# =====================================================================
adaptive_QC:
  principle: >
    QC effort should concentrate where failure risk and consequence are highest.
  features:
    - quality tier
    - production cost
    - historical failure class
    - semantic importance
    - blast radius
    - artifact novelty
    - capability uncertainty
    - prior repair history
  example:
    routine_background_shot:
      critics:
        - hard validators
        - visual critic
    critical_reveal_closeup:
      critics:
        - hard validators
        - World oracle
        - visual
        - performance
        - character
        - epistemic
        - ColdViewer
        - InformedCritic
        - adjudicator
# =====================================================================
# 72. TEMPORAL ARTIFACT ANALYSIS
# =====================================================================
temporal_QC:
  principle: >
    Video defects often require temporal analysis rather than isolated frames.
  TemporalWindow:
    fields:
      start_time:
      end_time:
      frame_refs:
      audio_refs:
  evaluations:
    - identity drift over time
    - motion continuity
    - lip sync
    - camera adherence
    - prop continuity
    - audio sync
    - edit rhythm
  frame_sampling_only:
    sufficient_for_all_video_QC: false
# =====================================================================
# 73. AUDIO QC
# =====================================================================
audio_QC:
  deterministic:
    - clipping
    - silence
    - duration
    - loudness
    - channel layout
    - dialogue timing
  semantic:
    - voice identity
    - emotion
    - ambience fit
    - Foley correctness
    - spatial coherence
    - music emotional function
  World_derived:
    examples:
      - footstep material
      - room reverberation
      - machine resonance
      - environmental ambience
  failure:
    expected:
      World acoustic state
    observed:
      artifact audio
    mismatch:
      typed_violation: true
# =====================================================================
# 74. EDIT QC
# =====================================================================
edit_QC:
  evaluates:
    - cut timing
    - eye trace
    - shot continuity
    - spatial comprehension
    - emotional rhythm
    - dialogue overlap
    - scene duration
    - transition logic
    - information reveal
  viewer_mode:
    ColdViewer_high_value: true
# =====================================================================
# 75. ENDING QC
# =====================================================================
ending_QC:
  importance: strategic
  required:
    - CreatorModel
    - EndingIntent
    - RevealIntent
    - StoryContract
    - World causal history
    - AudienceModel
    - RewatchCritic
  evaluates:
    - causal inevitability
    - surprise
    - fairness
    - character consequence
    - thematic payoff
    - emotional aftertaste
    - retrospective coherence
    - forbidden cheat modes
  budget:
    minimum: critical
# =====================================================================
# 76. PRODUCT-ID QC
# =====================================================================
product_identity_QC:
  evaluates:
    - distinctive visual identity
    - memorable character identity
    - recognizable world
    - recurring motifs
    - hook delivery
    - first-minute promise
  failure_mode:
    PRODUCT.GENERICITY_DRIFT
  creator_guard:
    >
    Product QC cannot penalize intentional experimental opacity merely because
    conventional legibility would be commercially easier.
# =====================================================================
# 77. QUALITY CERTIFICATE CHAIN
# =====================================================================
certificate_chain:
  example: |
    shot_217.take_04
         ↓ PASS
    shot_217.certificate
         ↓
    scene_18 assembly
         ↓ PASS
    scene_18.certificate
         ↓
    sequence_04
         ↓ PASS
    sequence_04.certificate
         ↓
    episode
         ↓ PASS
    episode.certificate
         ↓
    master
         ↓ PASS
    master.certificate
  principle: >
    Certification composes hierarchically but each higher level still receives
    independent evaluation.
# =====================================================================
# 78. PROVENANCE
# =====================================================================
provenance:
  QCProvenance:
    fields:
      target_ref:
      target_digest:
      QC_contract_ref:
      source_model_revisions:
      validators:
      critic_implementations:
      critic_prompt_or_policy_versions:
      evidence_refs:
      adjudicator_ref:
      created_at:
  must_answer:
    - what was evaluated
    - against what expectation
    - which critic/validator judged it
    - what evidence caused failure
    - which policy produced outcome
# =====================================================================
# 79. STORAGE ABSTRACTIONS
# =====================================================================
storage_abstractions:
  ports:
    - QCContractStorePort
    - QCPlanStorePort
    - QCRunStorePort
    - ViolationStorePort
    - QualityCertificateStorePort
    - CriticRegistryPort
    - CalibrationStorePort
    - QCExperienceStorePort
    - FailurePatternStorePort
    - SuccessPatternStorePort
    - RepairRecommendationStorePort
    - QCBenchmarkStorePort
  provider_independent: true
  immutable:
    - completed QCRun
    - QualityCertificate
    - QCExperienceRecord
    - benchmark labels
# =====================================================================
# 80. API BOUNDARIES
# =====================================================================
API_boundaries:
  planning:
    - compile_QC_contract
    - compile_QC_plan
    - explain_QC_plan
  execution:
    - run_QC
    - run_validator
    - run_critic
    - run_viewer_mode
    - run_adjudication
  take_selection:
    - evaluate_take_portfolio
    - select_take
  outcome:
    - get_QC_outcome
    - get_violations
    - explain_failure
    - get_certificate
  repair:
    - analyze_root_cause
    - recommend_repair
    - estimate_repair_scope
  calibration:
    - evaluate_critic
    - calibrate_critic
    - record_false_pass
    - record_false_fail
  learning:
    - record_QC_experience
    - discover_failure_pattern
    - discover_success_pattern
  certificate:
    - certify
    - validate_certificate
    - invalidate_certificate
# =====================================================================
# 81. PACKAGE LAYOUT
# =====================================================================
packages_or_modules_to_create:
  package_root: quantum/autonomous_qc/
  modules:
    contracts:
      - common
      - outcomes
      - quality_dimensions
      - evidence
      - provenance
    policies:
      - QC_policy
      - severity
      - confidence
      - uncertainty
    contracts_runtime:
      - QC_contract
      - quality_gate
      - QC_plan
      - QC_run
    validators:
      - registry
      - schema
      - media
      - World
      - creator
      - timeline
    critics:
      - registry
      - visual
      - motion
      - performance
      - continuity
      - cinematography
      - editing
      - dialogue
      - acoustic
      - music
      - narrative
      - character
      - epistemic
      - product
    viewers:
      - cold_viewer
      - informed_critic
      - rewatch_critic
      - context_firewall
    ensemble:
      - aggregation
      - disagreement
      - diversity
    adjudication:
      - adjudicator
      - pass_policy
      - uncertainty
    violations:
      - taxonomy
      - severity
      - mapping
    hierarchy:
      - frame
      - shot
      - scene
      - sequence
      - episode
      - master
    take_selection:
      - evaluation
      - ranking
    root_cause:
      - analyzer
      - attribution
    repair:
      - recommendation
      - blast_radius
      - escalation
    certificates:
      - quality_certificate
      - invalidation
    preflight:
      - risk_assessment
      - prevention
    calibration:
      - benchmarks
      - critic_calibration
      - false_pass
      - false_fail
    experience:
      - failure_patterns
      - success_patterns
      - QC_experience
    signals:
      - QC_signals
    integrations:
      world_model:
      polycognitive_runtime:
      creative_intelligence:
      audience_product:
      self_model:
      production_model:
      production_engine:
    ports:
      - stores
# =====================================================================
# 82. SCHEMAS TO CREATE
# =====================================================================
schemas_to_create:
  core:
    - QCContract
    - QualityGate
    - QCPlan
    - QCBudget
    - QCRun
    - QCOutcome
  checks:
    - QCCheckSpec
    - QCCheckResult
    - DeterministicValidatorSpec
  critics:
    - SpecialistCriticSpec
    - CriticResult
    - QualityObservation
    - CriticEnsemble
    - QCDisagreement
  viewer:
    - ColdViewerResult
    - ContextAccessPolicy
  World:
    - WorldOracleEvaluation
    - ObservedWorldFact
    - WorldMismatch
  creator:
    - CreatorFidelityEvaluation
  violation:
    - Violation
  adjudication:
    - AdjudicationRequest
    - AdjudicationResult
  root_cause:
    - RootCauseAnalysis
    - RootCauseCandidate
  repair:
    - RepairRecommendation
    - RepairScope
  certificate:
    - QualityCertificate
    - CertificateInvalidationCondition
  calibration:
    - CriticCalibrationState
    - QCBenchmarkSuite
    - QCErrorCase
  learning:
    - QCFailurePattern
    - QCSuccessPattern
    - QCExperienceRecord
    - QualityStrengthRecord
  preflight:
    - PreflightRiskAssessment
  signals:
    - QCSignal
# =====================================================================
# 83. UNIT TESTS
# =====================================================================
tests:
  unit:
    contracts:
      - QC_contract_validation
      - hard_check_required
    World:
      - expected_vs_observed_mismatch
      - handedness_detection
      - lighting_detection
    creator:
      - retro_style_not_failed_for_low_realism
      - creator_non_negotiable_failure
    critics:
      - context_firewall
      - critic_output_schema
      - calibrated_confidence
    disagreement:
      - opposing_critics_create_disagreement
      - disagreement_not_last_write_wins
    adjudication:
      - hard_failure_non_compensatory
      - uncertain_on_insufficient_evidence
      - critic_majority_not_absolute
    certificate:
      - certificate_digest
      - invalidation_on_artifact_change
      - unrelated_change_does_not_invalidate
    root_cause:
      - renderer_vs_strategy_cause
      - unknown_preserved
    repair:
      - minimum_scope
      - re_QC_required
    take_selection:
      - hard_failing_take_rejected
      - best_creator_fidelity_selected
    calibration:
      - false_pass_recorded
      - overconfident_critic_downweighted
# =====================================================================
# 84. PROPERTY TESTS
# =====================================================================
property_tests:
  - generator_never_self_certifies
  - hard_World_mismatch_never_passes
  - explicit_creator_lock_violation_never_passes
  - PASS_always_has_certificate
  - FAIL_always_has_violation_or_evaluation_error
  - modified_artifact_never_reuses_old_certificate_without_revalidation
  - unrelated_upstream_change_does_not_invalidate_certificate
  - ColdViewer_never_receives_hidden_intent_context
  - root_cause_uncertainty_never_fabricates_precision
  - same_completed_QC_run_is_immutable
  - critic_disagreement_never_silently_disappears
  - repair_scope_never_exceeds_dependency_blast_radius_without_reason
  - QC_never_mutates_CreatorModel
  - QC_never_mutates_WorldModel
  - learned_QC_policy_never_disables_hard_checks
# =====================================================================
# 85. NEGATIVE TESTS
# =====================================================================
negative_tests:
  - ProductionEngine_self_marks_PASS_rejected
  - critic_can_see_hidden_twist_in_ColdViewer_mode_rejected
  - photorealism_preference_overrides_retro_intent_rejected
  - spectacle_score_offsets_World_mismatch_rejected
  - QC_failure_rewrites_World_truth_rejected
  - QC_failure_rewrites_CreatorModel_rejected
  - repair_executes_directly_from_QC_rejected
  - old_certificate_reused_after_artifact_change_rejected
  - uncalibrated_critic_authoritative_for_flagship_gate_rejected
  - majority_vote_overrides_hard_validator_rejected
  - uncertainty_forced_to_PASS_without_policy_rejected
  - learned_policy_self_promotes_rejected
# =====================================================================
# 86. INTEGRATION TESTS
# =====================================================================
integration_tests:
  - World_expected_state_to_oracle_QC
  - CreatorModel_to_creator_fidelity_QC
  - AudienceModel_to_ColdViewer
  - ProductMarketModel_to_ProductCritic
  - SelfModel_to_critic_implementation_selection
  - ProductionStrategy_to_preflight_QC
  - ProductionEngine_artifact_to_QCRun
  - QCRun_FAIL_to_PolycognitiveRuntime
  - root_cause_to_ProductionModel
  - capability_failure_to_SelfModel
  - RepairRecommendation_to_ProductionEngine
  - repaired_artifact_to_re_QC
  - PASS_to_QualityCertificate
  - QualityCertificate_to_lock
# =====================================================================
# 87. END-TO-END TESTS
# =====================================================================
end_to_end_tests:
  shot_217_handedness:
    expected_World:
      aria.left_shoulder: damaged
      receiver.hand: right
      emergency_lights: amber
    rendered:
      aria.left_shoulder: intact
      receiver.hand: left
      emergency_lights: blue
    sequence:
      - ProductionEngine submits shot_217.take_02
      - World oracle loads expected visible state
      - deterministic/multimodal validators compare artifact
      - three hard violations emitted
      - QC returns FAIL
      - root cause points to production strategy / renderer weakness
      - RepairRecommendation chooses stronger anchor + deterministic prop layer
      - scope set to shot_217
      - other accepted shots preserved
      - repaired take generated
      - QC reruns
      - PASS certificate issued
    success:
      - zero human review
      - no unrelated regeneration
      - World truth unchanged
  retro_animation_quality:
    intended:
      - limited frame cadence
      - inked lines
      - analog noise
      - restrained shading
    generic_visual_critic:
      initial_concern:
        - low_frame_smoothness
        - visible_texture_noise
    CreatorFidelityEvaluation:
      interpretation:
        - intentional
    adjudicator:
      result: PASS
    success:
      - QC does not normalize intentional aesthetic
  cold_viewer_twist:
    story:
      intended:
        - audience notices Eva hesitation
        - audience should suspect something
        - audience should not infer complete truth
    results:
      ColdViewer_GenreExpert:
        full_twist_prediction_probability: 0.86
      CasualViewer:
        full_twist_prediction_probability: 0.62
    QC:
      outcome: FAIL
      violation: NARRATIVE.REVEAL_TOO_EARLY
    repair:
      - reduce clue salience
      - preserve underlying causal truth
  informed_vs_cold_disagreement:
    ColdViewer:
      result: confused
    InformedCritic:
      result: coherent
    expected:
      - create QCDisagreement
      - diagnose likely internal-knowledge bias
      - additional ColdViewer evidence
      - likely AUDIENCE.ACCIDENTAL_CONFUSION failure
  rewatch_twist_quality:
    first_watch:
      surprise: high
    RewatchCritic:
      finds:
        - earlier clues consistent
        - no impossible retcon
        - character behavior retrospectively coherent
    outcome: PASS
  institutional_learning:
    sequence:
      - repeated hand-object failures occur
      - QCFailurePattern created
      - repair strategy repeatedly succeeds
      - preflight rule learns elevated risk
      - future matching shot blocked before weak renderer execution
      - ProductionModel selects stronger strategy
    expected:
      - failure moves earlier in pipeline
      - render waste decreases
