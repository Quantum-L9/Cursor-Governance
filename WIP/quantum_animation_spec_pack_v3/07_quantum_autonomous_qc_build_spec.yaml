# =====================================================================
# 89. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  core:
    - QCContract exists
    - QualityGate exists
    - QCPlan exists
    - PASS/FAIL/UNCERTAIN supported
    - QCRun immutable
  deterministic:
    - file/schema validators
    - media validators
    - World oracle validators
    - creator lock validators
    - timeline validators
  subjective:
    - specialist critic registry
    - visual critic
    - motion critic
    - performance critic
    - continuity critic
    - editing critic
    - sound critic
    - narrative critic
    - character critic
    - epistemic critic
    - product critic
  viewer:
    - ColdViewer implemented
    - InformedCritic implemented
    - RewatchCritic implemented
    - context firewall enforced
  adjudication:
    - hard constraints non-compensatory
    - critic disagreement handled
    - confidence represented
    - uncertainty represented
  hierarchy:
    - shot QC
    - scene QC
    - sequence QC
    - episode QC
    - master QC
  take_selection:
    - multiple takes rankable
    - invalid takes rejected
    - selected take certified
  repair:
    - root cause analysis
    - RepairRecommendation
    - minimum blast radius
    - repair escalation
    - re-QC
  certification:
    - immutable QualityCertificate
    - dependency-aware invalidation
    - lock integration
  calibration:
    - benchmark suites
    - critic calibration
    - false-pass tracking
    - false-fail tracking
  institutional_learning:
    - failure patterns
    - success patterns
    - preflight prevention
    - downstream learning handoffs
  autonomy:
    - ordinary shot defects detected without human
    - best take selected autonomously
    - repair path autonomously initiated
    - accepted unrelated work preserved
    - final episode can be certified autonomously
  release:
    requirement: >
      QC-G01 through QC-G20 pass and no ownership conflict exists with specs
      00 through 06.
