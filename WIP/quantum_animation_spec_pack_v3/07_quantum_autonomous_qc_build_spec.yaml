# =====================================================================
# 94. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  authority:
    - AutonomousQC is sole formal acceptance owner
    - generator cannot self-certify
    - QC cannot mutate source authority models
  correctness:
    - hard deterministic checks precede subjective evaluation
    - World expected-vs-observed checks exist
    - creator locks are enforceable
    - hard failures are non-compensatory
  subjective_quality:
    - specialist critics available
    - project-relative quality semantics respected
    - intentional unconventional aesthetics do not fail generic-polish tests
  viewer_quality:
    - ColdViewer has no hidden context
    - InformedCritic uses project context
    - RewatchCritic evaluates reveal fairness
    - product critic evaluates product promise
  uncertainty:
    - critic disagreement preserved
    - UNCERTAIN supported
    - additional evidence pathways available
    - strategic low-confidence decisions fail closed where required
  hierarchy:
    - shot certificate does not imply episode pass
    - scene and episode evaluation exist
    - final master receives independent certification
  repair:
    - FAIL has typed violations
    - expected vs observed included where possible
    - root cause identified probabilistically
    - minimum repair scope computed
    - repair always re-enters QC
  institutional_learning:
    - false passes measured
    - false fails measured
    - critic calibration updated
    - repeated failures become earlier prevention rules
    - QC evidence feeds SelfModel and ProductionModel appropriately
  autonomy:
    - shot 217 failure can be detected, diagnosed, repaired and re-certified
      without human operational intervention
    - other accepted shots remain untouched
  final: >
    Autonomous QC must provide sufficient independent quality authority that
    Quantum can safely produce, select, repair, lock and master animated work
    without relying on a hidden human reviewer.
# =====================================================================
# 95. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    AutonomousQC owns acceptance.
  law_02: >
    The generator never grades itself as the sole judge.
  law_03: >
    Hard deterministic truth is checked before subjective quality.
  law_04: >
    World truth cannot be averaged away by visual quality.
  law_05: >
    Quality means fidelity to project intent, not conformity to generic polish.
  law_06: >
    Every failure should be typed, evidenced and explainable.
  law_07: >
    Expected and observed state should be compared explicitly.
  law_08: >
    ColdViewer, InformedCritic and RewatchCritic evaluate different realities.
  law_09: >
    Critics receive only the context appropriate to their perspective.
  law_10: >
    Critic disagreement is evidence, not noise to be silently averaged away.
  law_11: >
    UNCERTAIN is better than fabricated confidence.
  law_12: >
    Hard failures are non-compensatory.
  law_13: >
    Good frames do not guarantee good shots, and good shots do not guarantee a
    good film.
  law_14: >
    Every PASS is represented by an immutable QualityCertificate.
  law_15: >
    Certificates are tied to exact artifact and source revisions.
  law_16: >
    Repair begins with root cause, not visible symptom.
  law_17: >
    Repair should invalidate the minimum causal dependency set.
  law_18: >
    Repaired work must be re-certified.
  law_19: >
    Repeated failures should migrate upstream into prevention.
  law_20: >
    QC learns critic accuracy without learning to lower standards.
  law_21: >
    SelfModel learns implementation capability from QC evidence.
  law_22: >
    ProductionModel learns manufacturing strategy from QC evidence.
  law_23: >
    Polycognitive Runtime uses QC outcomes to decide what kind of thought or
    repair should happen next.
  law_24: >
    Accepted artifacts become trusted building blocks.
  law_25: >
    The end state is a studio whose quality control behaves like an expert
    director, continuity supervisor, editor, sound reviewer, audience tester,
    technical inspector and final acceptance board operating continuously,
    consistently, autonomously, and with perfect access to the project's
    explicit source-of-truth contracts.

This makes 07 the real quality firewall around the studio:

semantic decision / generated artifact
                ↓
        deterministic checks
                ↓
          World oracle
                ↓
        Creator fidelity
                ↓
       specialist critics
                ↓
 Cold / Informed / Rewatch / Product
                ↓
        disagreement analysis
                ↓
           adjudicator
         ┌──────┼───────┐
         │      │       │
       PASS    FAIL   UNCERTAIN
         │      │       │
 certificate   root     more
              cause    evidence
                │
                ↓
         minimum repair scope
                │
                ↓
         autonomous repair
                │
                └──────→ QC

The particularly important architectural consequence is that accepted work becomes trustworthy infrastructure. A shot_217.certificate means every downstream system can use that shot without repeatedly re-litigating all of its continuity, creator-intent, technical, performance, and production constraints—unless a materially relevant upstream dependency changes.

That is what lets the studio scale from 15 shots to hundreds without drowning in repeated review.
