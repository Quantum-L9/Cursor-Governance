# =====================================================================
# 91. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: generator grades its own homework
    control:
      - independent acceptance authority
      - critic implementation diversity
  - risk: generic critic penalizes intentional style
    control:
      - CreatorModel
      - QualitySemantics
      - creator-fidelity adjudication
  - risk: critics know too much
    control:
      - context firewall
      - ColdViewer
  - risk: critics miss hidden continuity error
    control:
      - exact World oracle checks
  - risk: single critic hallucination causes expensive repair
    control:
      - confidence
      - ensemble
      - deterministic evidence
      - adjudication
  - risk: majority vote hides hard failure
    control:
      - non-compensatory validator precedence
  - risk: UNCERTAIN causes infinite evaluation
    control:
      - QCBudget
      - bounded evidence rounds
  - risk: QC becomes too expensive
    control:
      - hierarchical gates
      - adaptive QC depth
      - hard checks first
      - preflight prevention
  - risk: QC learns lower standards to increase pass rate
    control:
      - immutable hard contracts
      - governed policy promotion
      - false-pass metrics
  - risk: local quality hides global weakness
    control:
      - hierarchical scene/episode QC
  - risk: global failure triggers episode-wide rebuild
    control:
      - root cause
      - dependency graph
      - minimum blast radius
  - risk: root cause blames wrong layer
    control:
      - probabilistic attribution
      - evidence lineage
      - separate implementation/strategy attribution
  - risk: accepted artifact becomes unstable
    control:
      - immutable certificate
      - explicit invalidation conditions
  - risk: synthetic audience becomes circular validation
    control:
      - calibration
      - creator feedback
      - multiple viewer archetypes
      - external evidence when available
  - risk: repeated failure discovered too late forever
    control:
      - QCFailurePattern
      - preflight prevention
