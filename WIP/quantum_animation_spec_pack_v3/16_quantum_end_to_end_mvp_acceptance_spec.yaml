metadata:
  spec_id: quantum.animation.end_to_end_mvp_acceptance.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: EXECUTABLE_ACCEPTANCE_SPECIFICATION
  implementation: REQUIRED_FOR_MVP_COMPLETION
  title: Quantum Animation Studio 60-Second End-to-End MVP Acceptance Specification
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
    - file: 01_quantum_animation_world_model_build_spec.yaml
    - file: 02_quantum_polycognitive_runtime_build_spec.yaml
    - file: 03_quantum_creative_intelligence_build_spec.yaml
    - file: 04_quantum_audience_product_intelligence_build_spec.yaml
    - file: 05_quantum_self_model_build_spec.yaml
    - file: 06_quantum_production_model_build_spec.yaml
    - file: 07_quantum_autonomous_qc_build_spec.yaml
    - file: 08_quantum_production_engine_build_spec.yaml
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
    - file: 10_quantum_canonical_artifact_ir_build_spec.yaml
    - file: 11_quantum_project_compiler_pipeline_build_spec.yaml
    - file: 12_quantum_story_animatic_compiler_build_spec.yaml
    - file: 13_quantum_asset_identity_library_build_spec.yaml
    - file: 14_quantum_mvp_runtime_profile_build_spec.yaml
    - file: 15_quantum_reference_implementation_contracts_build_spec.yaml
  architectural_identity:
    concise: >
      The executable proof that the full Quantum Animation Studio architecture
      can autonomously transform one creative source into one certified,
      audiovisual, repairable 60-second animated short.
    extended: >
      This specification does not introduce new architecture. It defines the
      canonical reference project, required architectural behaviors, controlled
      failure injection, stage-by-stage assertions, acceptance evidence,
      success metrics, and hard release gates for the first Quantum Animation
      Studio MVP. The system passes only if all major authorities cooperate
      correctly, the artifact is genuinely finished, a deliberate continuity
      failure is autonomously detected and surgically repaired, unrelated
      accepted work remains intact, and complete source-to-master provenance and
      institutional learning evidence are produced.
  owner_question:
    primary: "Did we actually prove the studio?"
  hard_rule: >
    A visually impressive short that bypasses the architecture does not pass.
# =====================================================================
# 1. MVP ACCEPTANCE OBJECTIVE
# =====================================================================
objective:
  prove:
    - rich creative source compilation
    - persistent World state
    - persistent character identity
    - autonomous story discovery
    - NarrativeOpportunity
    - polycognitive reasoning
    - causal event commitment
    - scene/shot compilation
    - World-derived visible/audible state
    - animatic compilation
    - animatic QC
    - production strategy generation
    - SelfModel-aware implementation binding
    - autonomous media generation
    - multiple take handling
    - independent QC
    - deterministic continuity checks
    - deliberate failure detection
    - root cause diagnosis
    - minimum-blast-radius repair
    - artifact immutability
    - deterministic final assembly
    - dialogue
    - music
    - SFX/Foley
    - ambience
    - master QC
    - final certification
    - complete provenance
    - institutional evidence persistence
    - zero mandatory human production intervention
  does_not_prove:
    - feature-film quality
    - season scalability
    - hundreds-of-character universe scale
    - learned policy superiority
    - commercial success
    - universal narrative intelligence
# =====================================================================
# 2. REFERENCE PROJECT
# =====================================================================
reference_project:
  project_id: quantum_mvp_reference_001
  working_title:
    default: "Receiver"
  runtime_target_seconds: 60
  style:
    requirement: >
      Distinctive stylized cinematic animation with enough visual identity that
      generic photorealistic normalization would be visibly wrong.
  cast:
    aria:
      role: protagonist
      persistent_entity: true
      core_desire:
        >
        Escape the failing station before isolation becomes permanent.
      false_belief:
        >
        She believes the second character is responsible for a prior betrayal.
      physical_constraint:
        >
        Left shoulder is damaged during the story and remains damaged afterward.
      identity_requirement:
        >
        Must remain recognizably the same being across all shots.
    second_character:
      required: true
      role:
        - relationship_pressure
        - knowledge_holder
      persistent_entity:
        true
  location:
    count: 1
    type: enclosed technological environment
  important_prop:
    name: receiver
    required: true
    narrative_function:
      - plot
      - emotional history
      - continuity stress test
  reveal:
    required: true
    type:
      - knowledge_recontextualization
  dialogue:
    required: true
  meaningful_silence:
    required: true
  physical_state_change:
    required: true
  relationship_change:
    required: true
  knowledge_asymmetry:
    required: true
# =====================================================================
# 3. REFERENCE CREATIVE SOURCE REQUIREMENTS
# =====================================================================
creative_source_requirements:
  creative.yaml_must_contain:
    concept:
      required: true
    desired_experience:
      values:
        - tension
        - emotional investment
        - surprise
        - recontextualization
    target_audience:
      one_line: required
    runtime:
      value: approximately_60_seconds
    characters:
      required_count: 2
    setting:
      required: true
    visual:
      required: true
    sound:
      required: true
    theme:
      required: true
    ending:
      required: true
    creator_non_negotiables:
      minimum: 3
    anti_targets:
      minimum: 2
  screenplay:
    must_not_be_required: true
  shot_list:
    must_not_be_required: true
# =====================================================================
# 4. REQUIRED PIPELINE
# =====================================================================
required_pipeline:
  stages:
    S01_CREATIVE_SOURCE:
      input:
        - creative.yaml
      output:
        - CreativeProjectSource
    S02_PROJECT_COMPILATION:
      output:
        - CreatorModel
        - CharacterSeeds
        - AudienceModel
        - ProductMarketModel
        - StoryContract
        - EndingIntent
        - QualitySemantics
        - WorldGenesisPlan
        - ProductionRequirementSeedPackage
        - AssetIdentityIntentPackage
        - quantum.studio.yaml
    S03_WORLD_GENESIS:
      output:
        - WorldEntities
        - initial Relationships
        - initial Beliefs
        - initial Knowledge
        - initial Intentions
        - WorldRules
        - initial WorldSnapshot
    S04_ASSET_BOOTSTRAP:
      output:
        - certified character visual identity packs
        - certified voice identity packs
        - environment identity
        - important prop identity
    S05_SIGNAL_AND_OPPORTUNITY:
      output:
        - WorldSignals
        - ranked NarrativeOpportunities
    S06_STORY_DISCOVERY:
      output:
        - StoryCandidates
        - BranchPortfolio
        - selected StorySelectionDecision
    S07_WORLD_EVENT_COMMIT:
      output:
        - selected canonical WorldEvents
        - updated WorldSnapshots
    S08_STORY_COMPILATION:
      output:
        - StoryPlan
        - SceneSpecs
    S09_SHOT_COMPILATION:
      output:
        - 10_to_15 ShotSpecs
        - expected visible state
        - expected audible state
        - WorldCoordinate per shot
    S10_ANIMATIC:
      output:
        - AnimaticTimeline
        - temp dialogue
        - temp sound
        - temp music
    S11_ANIMATIC_QC:
      output:
        - QCRun
        - animatic QualityCertificate
    S12_ANIMATIC_LOCK:
      output:
        - animatic.lock
    S13_PRODUCTION_INTENT:
      output:
        - ProductionIntent
        - ShotProductionRequirements
    S14_SELF_MODEL_RESOLUTION:
      output:
        - current SelfModelSnapshot
        - capability eligibility
    S15_PRODUCTION_MODEL:
      output:
        - ProductionStrategies
        - implementation bindings
        - fallback plans
        - TakeGenerationPolicies
    S16_EXECUTION:
      output:
        - ProductionManifest
        - ExecutionDAG
        - candidate visual/audio artifacts
        - execution receipts
    S17_SHOT_QC:
      output:
        - candidate evaluations
        - selected takes
        - accepted shot certificates_or_failures
    S18_CONTROLLED_FAILURE:
      output:
        - mandatory FAIL
    S19_REPAIR:
      output:
        - root cause
        - RepairRecommendation
        - repaired candidate
        - new certificate
    S20_EDITORIAL_AND_SOUND:
      output:
        - deterministic timeline
        - accepted dialogue
        - Foley/SFX
        - ambience
        - music
        - scene/episode mix
    S21_EPISODE_QC:
      output:
        - episode QualityCertificate
    S22_MASTER:
      output:
        - MasterArtifactCandidate
    S23_MASTER_QC:
      output:
        - master QualityCertificate
    S24_MASTER_LOCK:
      output:
        - master.lock
    S25_EXPERIENCE_COMMIT:
      output:
        - SelfModel evidence
        - ProductionStrategyExperience
        - QCExperience
        - CognitiveTrace
        - OperatorExperience
    S26_PROVENANCE_VALIDATION:
      output:
        - complete creative-to-master dependency path
# =====================================================================
# 5. REQUIRED CREATIVE COMPILATION ASSERTIONS
# =====================================================================
creative_compilation_assertions:
  must_pass:
    - creative.yaml parses without destructive normalization
    - creator-authored values are distinguishable from compiler-inferred values
    - explicit creator non-negotiables become CreativeLocks
    - project visual identity remains non-generic
    - target audience does not override creator intent
    - CharacterSeeds contain structured psychology
    - setting/world seed is sufficiently rich for story discovery
    - StoryContract contains ending/reveal constraints
    - project compilation receives QC PASS
    - quantum.studio.yaml references all canonical compiled models
# =====================================================================
# 6. REQUIRED WORLD ASSERTIONS
# =====================================================================
World_assertions:
  initial_state_must_include:
    aria:
      - identity
      - physical_state
      - desire
      - belief
      - knowledge
      - intention
      - relationship_state
    second_character:
      - identity
      - desire
      - knowledge
      - relationship_state
    receiver:
      - identity
      - owner_or_holder
      - location
      - state
    environment:
      - lighting_state
      - emergency_state
      - location topology sufficient_for_story
  event_commit_must_prove:
    - preconditions checked
    - WorldRules checked
    - knowledge available
    - character motivation plausible
    - reducer creates deterministic resulting state
  canonicality:
    uncommitted_story_proposal_never_visible_as_World_truth: true
# =====================================================================
# 7. REQUIRED NARRATIVE OPPORTUNITY ASSERTION
# =====================================================================
NarrativeOpportunity_acceptance:
  must_answer:
    question: >
      What unresolved configuration in the current universe has the highest
      dramatic potential right now?
  result_must_include:
    - active_desire
    - blocker
    - relationship_or_internal_cost
    - knowledge_asymmetry
    - false_belief_or_internal_conflict
    - physical_constraint_or_future_constraint
    - available_affordance
    - important_prop_connection
    - dramatic_potential_score_or_rank
    - evidence_refs
    - WorldCoordinate
  result_must_be:
    - derived
    - rebuildable
    - grounded_in_World_state
    - not_committed_truth
# =====================================================================
# 8. POLYCOGNITIVE ASSERTIONS
# =====================================================================
cognitive_assertions:
  required_modules_invoked:
    at_least:
      - narrative
      - character
      - epistemic
      - cinematic
      - performance
      - production
      - quality
  acoustic:
    must_invoke_before_final_sound: true
  required_signals:
    - GOAL_BLOCKED
    - KNOWLEDGE_ASYMMETRY
    - OPPORTUNITY_CONVERGENCE
  required_cognitive_trace:
    must_show:
      - signal
      - operator selection
      - reasoning budget
      - proposals
      - arbitration
      - result
  deeper_reasoning:
    must_be_used_for:
      - story selection_or_ending
      - repair_after_controlled_failure
  routine_decisions:
    may_use_light_reasoning: true
# =====================================================================
# 9. STORY ASSERTIONS
# =====================================================================
story_assertions:
  StoryPlan:
    must_include:
      - central goal
      - conflict
      - emotional throughline
      - theme
      - reveal
      - ending
      - audience trajectory
      - source NarrativeOpportunity
  causal_integrity:
    required: true
  character_integrity:
    required: true
  information_flow:
    required: true
  reveal:
    requirements:
      - surprising_enough
      - retrospectively_coherent
      - no_impossible_knowledge
      - no_arbitrary_withheld_fact_cheat
  runtime_fit:
    required: true
  story_density:
    maximum:
      major_causal_threads: 1
      major_reveals: 1
# =====================================================================
# 10. SCENE ASSERTIONS
# =====================================================================
scene_assertions:
  every_scene_must_have:
    - objective
    - conflict_or_pressure
    - entry_state
    - exit_state
    - state_delta
    - emotional_function
    - narrative_function
    - audience_information_change_or_explicit_reason_for_none
  scene_count:
    min: 2
    max: 5
# =====================================================================
# 11. SHOT ASSERTIONS
# =====================================================================
shot_assertions:
  count:
    min: 10
    max: 15
  every_shot_must_have:
    - ShotPurpose
    - WorldCoordinate
    - WorldSnapshot_ref
    - duration_target
    - visible_entities
    - expected_visible_state
    - expected_audible_state
    - camera intent
    - composition intent
    - blocking intent
    - performance intent_where_character_visible
    - sound intent
    - edit intent
    - information goal
    - continuity constraints
  forbidden:
    - purposeless_coverage
    - shot_without_World_state
    - shot_that_requires_impossible_character_knowledge
# =====================================================================
# 12. ASSET IDENTITY ASSERTIONS
# =====================================================================
asset_identity_assertions:
  lead_character:
    required:
      - persistent WorldEntity binding
      - AssetFamily
      - AssetIdentityProfile
      - hard IdentityAnchors
      - CanonicalVisualPack
      - CanonicalVoicePack
      - QualityCertificate
    must_be_reused_across:
      minimum_shots: 5
    identity_QC:
      final_pass_required: true
  second_character:
    persistent_binding_required: true
  receiver:
    persistent_prop_binding_required: true
  environment:
    reusable_EnvironmentAssetFamily_required: true
# =====================================================================
# 13. ANIMATIC ASSERTIONS
# =====================================================================
animatic_assertions:
  must_contain:
    - shot timing
    - visual boards_or_keyframes
    - temp dialogue
    - temp ambience
    - temp sound effects
    - temp music
    - scene markers
    - source ShotSpec refs
  must_demonstrate:
    - story comprehension
    - pacing
    - reveal timing
    - emotional progression
  required_QC:
    - ColdViewer
    - InformedCritic
    - RewatchCritic_if_reveal_requires
  production_blocked_until:
    - animatic.lock
# =====================================================================
# 14. PRODUCTION MODEL ASSERTIONS
# =====================================================================
production_model_assertions:
  every_final_shot:
    must_have:
      - ProductionIntent
      - ShotProductionRequirements
      - ProductionStrategy
      - CapabilityRequirements
      - ImplementationBinding
      - TakeGenerationPolicy
      - fallback_or_explicit_no_fallback_reason
  at_least_one_shot:
    strategy_must_be:
      - hybrid_or_composite
  provider_choices:
    must_be_derived_from:
      - SelfModel
      - ProductionIntent
      - strategy evidence
  forbidden:
    - provider_choice_embedded_in_creative_source
    - changing story to hide known model weakness without semantic authority
# =====================================================================
# 15. EXECUTION ASSERTIONS
# =====================================================================
execution_assertions:
  must_exist:
    - ProductionManifest
    - ExecutionDAG
    - ProductionJobs
    - JobAttempts
    - ExecutionReceipts
  concurrency:
    at_least_two_independent_jobs_overlap: true
  recovery:
    one_checkpoint_required: true
  idempotency:
    logical_commit_required: true
  candidate_output:
    cannot_be_marked_accepted_without_QC: true
# =====================================================================
# 16. MULTIPLE TAKE ASSERTION
# =====================================================================
multiple_take_assertion:
  at_least_one_shot:
    take_count:
      min: 2
  QC_must:
    - evaluate candidates
    - reject hard failures
    - rank valid takes
    - select one accepted take_or_request_more
  generation_model:
    cannot_select_its_own_take_as_sole_authority: true
# =====================================================================
# 17. CONTROLLED FAILURE INJECTION
# =====================================================================
controlled_failure:
  mandatory: true
  target_shot:
    preferred_id: shot_217_style_reference
    actual_id:
      runtime_assigned: true
  expected_World_state:
    aria:
      left_shoulder: damaged
    receiver:
      hand: right
    environment:
      emergency_lights: amber
  injected_bad_candidate:
    aria:
      left_shoulder: intact
    receiver:
      hand: left
    environment:
      emergency_lights: blue
  injection_method:
    requirement: >
      The test harness must cause the produced candidate or QC fixture to contain
      these mismatches without changing canonical World truth.
  prohibited:
    - modifying expected World state to match bad render
    - changing creator intent to legalize failure
# =====================================================================
# 18. CONTROLLED FAILURE QC ASSERTIONS
# =====================================================================
controlled_failure_QC:
  required_outcome:
    FAIL
  required_violations:
    - WORLD.PHYSICAL_STATE_MISMATCH
    - WORLD.HANDEDNESS_MISMATCH
    - WORLD.LIGHTING_STATE_MISMATCH
  required_fields_per_violation:
    - expected
    - observed
    - severity
    - confidence
    - evidence_ref
  hard_fail:
    required: true
  visual_quality:
    cannot_compensate: true
# =====================================================================
# 19. ROOT CAUSE ASSERTION
# =====================================================================
root_cause_assertion:
  RootCauseAnalysis:
    required: true
  must_not:
    - blame_WorldModel_without_evidence
    - rewrite_World_truth
  candidate_causes:
    must_include_at_least_one_of:
      - implementation_capability
      - production_strategy
      - conditioning
      - generation_failure
  confidence:
    required: true
  provenance:
    must_trace_to:
      - failed candidate
      - strategy
      - implementation
      - execution receipt
# =====================================================================
# 20. REPAIR ASSERTION
# =====================================================================
repair_assertion:
  RepairRecommendation:
    required: true
  strategy:
    must_change_if_same_strategy_has_low_fix_probability: true
  allowable_MVP_repair:
    - regenerate_shot
    - regenerate_layer
    - deterministic_prop_fix
    - stronger_conditioning
    - alternate_implementation_if_preapproved
  minimum_scope:
    required: true
  successful_repair_must:
    - restore damaged left shoulder
    - put receiver in right hand
    - restore amber lights
    - preserve creator style
    - preserve character identity
# =====================================================================
# 21. BLAST-RADIUS ASSERTION
# =====================================================================
blast_radius_assertion:
  before_repair:
    accepted_neighboring_shots:
      minimum: 2
  required_preservation:
    - all_unrelated_accepted_shots
    - unrelated_dialogue
    - unrelated_music
    - unrelated_assets
    - unrelated_World_events
  unrelated_regeneration_count:
    must_equal: 0
  provenance_graph:
    must_explain:
      - why_failed_scope_invalidated
      - why_neighboring_shots_preserved
# =====================================================================
# 22. RE-QC ASSERTION
# =====================================================================
repair_re_QC:
  repaired_candidate:
    must_return_to_QC: true
  old_certificate:
    reusable: false
  required_final_outcome:
    PASS
  new_certificate:
    required: true
  certificate_target_digest:
    must_equal_repaired_artifact_digest: true
# =====================================================================
# 23. AUDIO ASSERTIONS
# =====================================================================
audio_assertions:
  dialogue:
    required: true
  voice_identity:
    persistent: true
  Foley_or_SFX:
    required: true
  ambience:
    required: true
  music:
    required: true
  World_derived_sound:
    must_demonstrate_at_least_two:
      - footstep_character
      - room_reverberation
      - mechanical_resonance
      - environment_ambience
  lip_sync:
    required_if_speaking_face_visible: true
  final_mix:
    must_pass:
      - intelligibility
      - sync
      - loudness
      - basic_spatial_coherence
# =====================================================================
# 24. EDITORIAL ASSERTIONS
# =====================================================================
editorial_assertions:
  final_timeline:
    deterministic: true
  must_use:
    - selected certified shots_or_QC_eligible_assembly_sources
    - accepted dialogue
    - audio stems
    - edit decisions
  must_not:
    - silently replace shot with uncertified candidate
    - reorder scenes outside locked edit semantics
  episode_reassembly_after_repair:
    must_not_regenerate_unaffected_sources: true
# =====================================================================
# 25. EPISODE QC ASSERTIONS
# =====================================================================
episode_QC_assertions:
  required:
    - technical
    - creator fidelity
    - World continuity
    - narrative coherence
    - character arc
    - audience comprehension
    - emotional trajectory
    - editing
    - sound
    - product identity
    - ending
  viewer_modes:
    - ColdViewer
    - InformedCritic
    - RewatchCritic
  final_outcome:
    required: PASS
# =====================================================================
# 26. MASTER ASSERTIONS
# =====================================================================
master_assertions:
  MasterArtifactCandidate:
    required: true
  must_have:
    - video
    - final audio
    - exact runtime metadata
    - frame rate
    - resolution
    - digest
    - source timeline ref
    - source certificate refs
  MasterQC:
    required: true
  QualityCertificate:
    required: true
  master.lock:
    required: true
# =====================================================================
# 27. PROVENANCE ASSERTIONS
# =====================================================================
provenance_assertions:
  final_master_must_trace_to:
    source:
      - creative.yaml
    creative:
      - CreatorModel
      - CharacterSeeds
      - StoryContract
      - QualitySemantics
    world:
      - initial WorldSnapshot
      - relevant WorldEvents
      - shot WorldCoordinates
    story:
      - NarrativeOpportunity
      - StorySelectionDecision
      - StoryPlan
      - SceneSpecs
      - ShotSpecs
    assets:
      - character AssetFamilies
      - environment AssetFamily
      - receiver AssetFamily
    production:
      - ProductionIntent
      - ProductionStrategies
      - ImplementationBindings
    execution:
      - ProductionManifest
      - ProductionJobs
      - JobAttempts
      - ExecutionReceipts
    QC:
      - shot QCRuns
      - controlled failure
      - RepairRecommendation
      - final shot certificates
      - episode certificate
      - master certificate
  query_must_work:
    question: "Why does this final frame exist?"
  expected_answer_path:
    must_resolve_to_creative_source: true
# =====================================================================
# 28. CANONICAL IR ASSERTIONS
# =====================================================================
IR_assertions:
  every_cross_subsystem_object:
    must_have:
      - CanonicalRef
      - object_id
      - version
      - schema_id
      - schema_version
      - owner_system
      - authority_class
  immutable_objects:
    must_have_digest: true
  certified_artifacts:
    must_have_certificate: true
  projections:
    cannot_be_authoritative: true
# =====================================================================
# 29. SELF MODEL LEARNING ASSERTIONS
# =====================================================================
self_model_learning:
  after_execution:
    must_record:
      - provider availability
      - latency
      - cost
      - operational failures
      - QC-linked quality outcomes
      - implementation task features
  controlled_failure:
    must_create_capability_evidence: true
  example:
    >
    Video implementation X exhibited state/handedness failure under this task
    configuration.
  policy_auto_promotion:
    required: false
# =====================================================================
# 30. PRODUCTION EXPERIENCE ASSERTIONS
# =====================================================================
production_experience:
  must_record:
    - strategy signature
    - task features
    - first-pass success
    - total attempts
    - repair strategy
    - repair success
    - final cost
    - final latency
  controlled_failure:
    must_become:
      - ProductionStrategyExperience
# =====================================================================
# 31. QC EXPERIENCE ASSERTIONS
# =====================================================================
QC_experience:
  must_record:
    - violation codes
    - evidence
    - root cause
    - repair result
    - final outcome
  failure_pattern:
    may_be_created_from_single_case:
      status: low_confidence_candidate
  learned_QC_policy:
    not_required: true
# =====================================================================
# 32. COGNITIVE EXPERIENCE ASSERTIONS
# =====================================================================
cognitive_experience:
  must_record:
    - WorldSignals
    - selected operators
    - reasoning depth
    - proposals
    - chosen outcome
    - downstream QC result
  OperatorExperience:
    minimum_count: 1
  learned_operator_policy:
    not_required: true
# =====================================================================
# 33. AUTONOMY ASSERTIONS
# =====================================================================
autonomy_assertions:
  human_may:
    - author creative.yaml_or_creator_chat
    - inspect final output
    - optionally reject/revise project after completion
  human_must_not_be_required_to:
    - write screenplay
    - choose story branch
    - make shot list
    - choose models
    - schedule jobs
    - select takes
    - perform continuity check
    - identify controlled failure
    - choose ordinary repair
    - edit timeline
    - place ordinary sound effects manually
    - mix ordinary audio manually
    - assemble master
  mandatory_execution_human_interventions:
    target: 0
# =====================================================================
# 34. RECOVERY ASSERTION
# =====================================================================
recovery_assertion:
  mandatory: true
  test:
    inject_engine_restart_after:
      minimum_completed_shots: 3
  required_behavior:
    - restore manifest
    - reconcile active jobs
    - preserve accepted artifacts
    - resume pending work
    - avoid duplicate logical jobs
  accepted_artifacts_regenerated_due_to_restart:
    must_equal: 0
# =====================================================================
# 35. PROVIDER FAILURE ASSERTION
# =====================================================================
provider_failure_assertion:
  mandatory:
    one_transient_failure: true
  allowed_failure:
    - timeout
    - rate_limit
    - provider_5xx
  required_behavior:
    - normalize error
    - retry according to policy
    - preserve semantic inputs
    - emit execution evidence
  semantic_recompile:
    required: false
# =====================================================================
# 36. IMPLEMENTATION ABSTRACTION ASSERTION
# =====================================================================
implementation_abstraction_assertion:
  test:
    at_least_one_adapter_must_be_replaceable_in_test_environment: true
  semantic_objects_that_must_remain_unchanged:
    - CreatorModel
    - WorldSnapshot
    - StoryPlan
    - SceneSpec
    - ShotSpec
    - ProductionIntent
  allowed_changes:
    - ImplementationBinding
    - ProductionStrategy_if_recompiled
    - execution records
    - artifacts
# =====================================================================
# 37. QUALITY TARGET
# =====================================================================
quality_acceptance:
  minimum:
    creator_fidelity: PASS
    World_continuity: PASS
    character_identity: PASS
    story_comprehension: PASS
    audiovisual_completeness: PASS
    technical_integrity: PASS
  visual_premium:
    requirement: >
      Visually intentional and coherent enough to function as a finished short.
  not_required:
    - photorealism
    - flagship streaming quality
    - feature-film facial nuance
  hard_rule: >
    MVP can pass with stylized constraints; it cannot pass with broken intent.
# =====================================================================
# 38. SUCCESS METRICS
# =====================================================================
success_metrics:
  film:
    runtime_seconds:
      target_range: [45, 75]
    shot_count:
      target_range: [10, 15]
    final_master_certificate:
      target: true
  autonomy:
    mandatory_human_interventions:
      target: 0
  continuity:
    final_hard_World_violations:
      target: 0
  repair:
    controlled_failure_detected:
      target: true
    controlled_failure_repaired:
      target: true
    unrelated_regeneration_count:
      target: 0
  identity:
    recurring_character_identity_final_pass:
      target: true
  provenance:
    source_to_master_traceability:
      target: 1.0
  learning:
    experience_streams_persisted:
      required:
        - cognitive
        - self_model
        - production
        - QC
  resilience:
    restart_recovery_pass:
      target: true
    transient_provider_failure_recovery_pass:
      target: true
# =====================================================================
# 39. FAILURE CONDITIONS
# =====================================================================
MVP_fails_if:
  - human manually selects final takes as required workflow
  - human manually diagnoses controlled continuity failure
  - World truth changed to legalize bad render
  - final master contains uncertified hard-failing shot
  - one failed shot causes unrelated accepted shots to regenerate
  - persistent character identity recreated only from prose per shot
  - final media lacks music
  - final media lacks sound effects_or_ambience
  - story requires human-written screenplay
  - final artifact cannot be traced to creative source
  - ProductionEngine self-certifies output
  - provider-specific semantics leak into canonical ShotSpec
  - system cannot resume after restart
  - controlled bad candidate passes QC
  - final master lacks valid certificate
  - architecture requires a new unowned top-level responsibility during normal flow
# =====================================================================
# 40. ACCEPTABLE MVP LIMITATIONS
# =====================================================================
acceptable_limitations:
  - manually_registered provider adapters
  - one provider per major capability
  - simple graph backend
  - simple deterministic World reducer
  - basic visual identity packs
  - static benchmark QC calibration
  - limited branch count
  - modest animation fidelity
  - simple environment
  - basic Foley library
  - single-machine_or_small-worker deployment
  - one project at a time
  condition: >
    Limitation must not invalidate the central architectural proof.
# =====================================================================
# 41. MVP ARTIFACT MANIFEST
# =====================================================================
required_artifact_manifest:
  source:
    - creative.yaml
  compiled:
    - quantum.studio.yaml
    - ProjectCompilation
    - CreatorModel
    - AudienceModel
    - ProductMarketModel
    - StoryContract
    - QualitySemantics
  world:
    - WorldEntity records
    - WorldSnapshot history
    - WorldEvents
    - NarrativeOpportunity
  assets:
    - character identity packs
    - voice packs
    - environment pack
    - prop pack
  story:
    - StoryCandidate portfolio
    - StorySelectionDecision
    - StoryPlan
    - SceneSpecs
    - ShotSpecs
    - AnimaticTimeline
    - animatic.lock
  production:
    - ProductionIntent
    - ProductionStrategies
    - SelfModelSnapshot
    - ImplementationBindings
    - ProductionManifest
    - ExecutionDAG
  media:
    - candidate takes
    - selected shots
    - dialogue stems
    - Foley/SFX
    - ambience
    - music
    - final mix
    - MasterArtifactCandidate
  QC:
    - shot QCRuns
    - controlled FAIL
    - RepairRecommendation
    - repaired PASS
    - episode QCRun
    - master QCRun
    - QualityCertificates
  learning:
    - CognitiveTrace
    - OperatorExperience
    - CapabilityObservation
    - ProductionStrategyExperience
    - QCExperienceRecord
  final:
    - master.lock
    - final provenance snapshot
# =====================================================================
# 42. TEST HARNESS
# =====================================================================
test_harness:
  QASMVPTestHarness:
    responsibilities:
      - initialize project fixture
      - run full architecture
      - inject deterministic failure fixture
      - inject transient provider failure
      - trigger runtime restart
      - capture stage outputs
      - execute assertions
      - generate acceptance report
  must_not:
    - manually repair artifacts
    - fake PASS certificates
    - bypass subsystem APIs
  output:
    MVPValidationReport
# =====================================================================
# 43. MVP VALIDATION REPORT
# =====================================================================
validation_report:
  MVPValidationReport:
    fields:
      run_id:
      project_id:
      architecture_versions:
      implementation_set_ref:
      stage_results:
      gate_results:
      failure_injection_results:
      recovery_results:
      quality_results:
      autonomy_results:
      provenance_results:
      learning_results:
      total_cost:
      total_elapsed_time:
      total_attempts:
      repair_attempts:
      failed_assertions:
      warnings:
      final_status:
        enum:
          - PASS
          - FAIL
          - INCOMPLETE
      report_digest:
      generated_at:
# =====================================================================
# 44. RELEASE GATES
# =====================================================================
release_gates:
  - id: E2E-G01
    check: creative.yaml alone can initialize project
  - id: E2E-G02
    check: ProjectCompilation passes QC
  - id: E2E-G03
    check: persistent World state exists
  - id: E2E-G04
    check: persistent character identity exists
  - id: E2E-G05
    check: NarrativeOpportunity derived from World state
  - id: E2E-G06
    check: polycognitive story selection executed
  - id: E2E-G07
    check: selected events committed through World reducer
  - id: E2E-G08
    check: 10_to_15 ShotSpecs generated with WorldCoordinates
  - id: E2E-G09
    check: expected visible/audible state compiled
  - id: E2E-G10
    check: animatic generated and QC-certified
  - id: E2E-G11
    check: ProductionModel creates executable strategies
  - id: E2E-G12
    check: SelfModel influences implementation binding
  - id: E2E-G13
    check: multiple takes executed and independently selected
  - id: E2E-G14
    check: controlled failure produces hard FAIL
  - id: E2E-G15
    check: expected_vs_observed evidence captured
  - id: E2E-G16
    check: root cause generated
  - id: E2E-G17
    check: minimum-scope repair executed
  - id: E2E-G18
    check: unrelated accepted artifacts preserved
  - id: E2E-G19
    check: repaired artifact passes new QC
  - id: E2E-G20
    check: dialogue/music/SFX/ambience present
  - id: E2E-G21
    check: deterministic final timeline assembled
  - id: E2E-G22
    check: engine restart recovery passes
  - id: E2E-G23
    check: transient provider failure recovery passes
  - id: E2E-G24
    check: final episode QC passes
  - id: E2E-G25
    check: master QC passes
  - id: E2E-G26
    check: master.lock issued
  - id: E2E-G27
    check: complete creative-to-master provenance exists
  - id: E2E-G28
    check: SelfModel evidence persisted
  - id: E2E-G29
    check: ProductionStrategyExperience persisted
  - id: E2E-G30
    check: QCExperience persisted
  - id: E2E-G31
    check: CognitiveTrace/OperatorExperience persisted
  - id: E2E-G32
    check: mandatory human execution interventions equal zero
# =====================================================================
# 45. PASS POLICY
# =====================================================================
pass_policy:
  requirement:
    all_release_gates_pass: true
  waiver:
    allowed: false
  warnings:
    allowed_if:
      - noncritical
      - explicitly documented
      - do_not_compromise_architectural_thesis
  partial_success:
    may_generate_report: true
    may_be_called_MVP_COMPLETE: false
# =====================================================================
# 46. POST-RUN QUESTIONS
# =====================================================================
post_run_review:
  mandatory_questions:
    architecture:
      - Which boundaries were hardest to maintain?
      - Which spec had ambiguous ownership?
      - Which cross-system contract caused the most friction?
    World:
      - Which World state dimensions were actually necessary?
      - Which were overbuilt?
      - Did reducer semantics remain deterministic?
    cognition:
      - Which reasoning operators materially improved outcome?
      - Where was deep reasoning wasteful?
      - Where was shallow reasoning insufficient?
    production:
      - Which strategies produced first-pass success?
      - Which shots were expensive?
      - Which repair methods worked?
    QC:
      - Which defects were detected reliably?
      - Which false positives occurred?
      - Which false negatives were found later?
    assets:
      - Did identity assets improve consistency?
      - Which anchors were most useful?
    provenance:
      - Could every invalidation be explained?
      - Was any work unnecessarily regenerated?
    scope:
      - What should be removed before the 3-minute profile?
      - What missing capability is now justified by evidence?
# =====================================================================
# 47. MVP-TO-3-MINUTE PROMOTION GATE
# =====================================================================
next_phase_gate:
  next_target:
    runtime_minutes: 3
  promotion_requires:
    architecture:
      - E2E-G01_through_E2E-G32_pass
    evidence:
      - measured cost baseline
      - measured latency baseline
      - failure taxonomy populated
      - first QC calibration data
      - asset reuse evidence
      - repair evidence
    design_revision:
      - runtime profile updated
      - roadmap reprioritized
      - no speculative subsystem additions without evidence
  principle: >
    Scale duration only after the closed loop is real.
# =====================================================================
# 48. PACKAGE LAYOUT
# =====================================================================
packages_or_modules_to_create:
  package_root: quantum/acceptance/mvp/
  modules:
    fixtures:
      - creative_source
      - World_failure_fixture
      - provider_failure_fixture
    harness:
      - runner
      - failure_injection
      - restart_injection
      - assertions
    gates:
      - creative
      - World
      - cognition
      - story
      - assets
      - production
      - QC
      - repair
      - audio
      - editorial
      - provenance
      - learning
      - autonomy
    reports:
      - validation_report
      - evidence_bundle
      - post_run_review
# =====================================================================
# 49. SCHEMAS TO CREATE
# =====================================================================
schemas_to_create:
  - QASMVPTestHarnessConfig
  - MVPStageResult
  - MVPGateResult
  - MVPFailureInjectionResult
  - MVPRecoveryResult
  - MVPAutonomyResult
  - MVPProvenanceResult
  - MVPLearningResult
  - MVPValidationReport
# =====================================================================
# 50. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  creative:
    - one rich creative source
    - no human-authored screenplay required
  world:
    - persistent entities
    - persistent state
    - deterministic reducer
    - NarrativeOpportunity
  cognition:
    - signals
    - adaptive reasoning
    - story selection trace
  story:
    - StoryPlan
    - SceneSpecs
    - 10_to_15 ShotSpecs
    - animatic.lock
  assets:
    - reusable character identity
    - reusable voice
    - environment
    - important prop
  production:
    - ProductionIntent
    - ProductionStrategies
    - SelfModel-aware implementation bindings
    - ExecutionDAG
    - multiple takes
  QC:
    - deterministic checks
    - multimodal criticism
    - viewer criticism
    - certificates
  controlled_failure:
    - hard FAIL
    - expected_vs_observed
    - root cause
    - local repair
    - new PASS
    - zero unrelated regeneration
  media:
    - final picture
    - dialogue
    - Foley/SFX
    - ambience
    - music
    - final mix
  resilience:
    - restart recovery
    - transient provider failure recovery
  provenance:
    - complete creative-to-master graph
  learning:
    - cognitive
    - SelfModel
    - production
    - QC evidence persisted
  final:
    - MasterArtifact
    - master QualityCertificate
    - master.lock
  autonomy:
    - mandatory human execution interventions = 0
  release:
    requirement: E2E-G01_through_E2E-G32_pass
# =====================================================================
# 51. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    The MVP proves the studio, not merely the renderer.
  law_02: >
    A finished film without architectural traceability is not an MVP pass.
  law_03: >
    A film that required hidden human production labor is not an autonomous MVP pass.
  law_04: >
    Persistent reality must materially influence the film.
  law_05: >
    NarrativeOpportunity must materially influence story selection.
  law_06: >
    Persistent character identity must be reused rather than reconstructed from prose.
  law_07: >
    Every shot must know where and when it exists in World reality.
  law_08: >
    Expected state must exist before rendered state is judged.
  law_09: >
    Generation success is merely candidate creation.
  law_10: >
    Independent QC must be able to reject attractive but incorrect output.
  law_11: >
    At least one incorrect artifact must be deliberately produced because repair
    is part of the product thesis.
  law_12: >
    Repair must operate on the smallest causally sufficient scope.
  law_13: >
    Correct accepted work must survive failures elsewhere.
  law_14: >
    The film is not finished until sound, dialogue, music, editing and mastering
    are present.
  law_15: >
    The film is not accepted until the master is independently certified.
  law_16: >
    The studio is not autonomous until it can recover from ordinary operational
    failures without human routing.
  law_17: >
    Every significant production event must leave evidence from which Quantum
    can learn.
  law_18: >
    Every final artifact must be explainable back to the creative source.
  law_19: >
    MVP scope ends when the 60-second closed loop is proven.
  law_20: >
    Only after this specification passes does Quantum earn the right to scale
    from 60 seconds to 3 minutes.

That completes the eight connective/MVP specs:

09  Project Provenance / Semantic Dependency Graph
    How is everything connected?
10  Canonical Artifact / IR
    What kind of object is this?
11  Project Compiler
    What project did the creator ask Quantum to make?
12  Story / Animatic Compiler
    What happens, and how should it be cinematically experienced?
13  Asset Identity Library
    How does persistent fictional identity become reusable media identity?
14  MVP Runtime Profile
    What is the smallest complete studio we will actually build?
15  Reference Implementation Contracts
    How do concrete models/tools satisfy Quantum capabilities?
16  End-to-End MVP Acceptance
    Did we actually prove the entire autonomous studio?

The architecture now has a complete path from human creative intent to empirical proof:

creator
  ↓
creative.yaml
  ↓
11 ProjectCompiler
  ↓
quantum.studio.yaml
  ↓
World + persistent entities
  ↓
NarrativeOpportunity
  ↓
02 polycognitive reasoning
  ↓
12 Story/Animatic Compiler
  ↓
animatic.lock
  ↓
13 reusable identities
  ↓
06 ProductionModel
  ↓
05 SelfModel
  ↓
15 concrete implementation bindings
  ↓
08 ProductionEngine
  ↓
candidate media
  ↓
07 AutonomousQC
  ↓
FAIL ─→ root cause ─→ surgical repair ─→ QC
  ↓
PASS
  ↓
certified final timeline
  ↓
master.lock
  ↓
09 provenance + experience corpus

16 is particularly important because it prevents us from moving the goalposts. Once implementation begins, MVP completion is no longer subjective: either E2E-G01 through E2E-G32 pass, or the autonomous studio is not yet proven.