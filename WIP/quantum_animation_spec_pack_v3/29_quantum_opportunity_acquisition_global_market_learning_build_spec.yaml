# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Systematically place the right Quantum project in front of the right capable
    buyer at the right time with enough evidence and theater to make attention
    economically rational.
  creative_goal: >
    Discover commercially useful audience and market structure without converting
    Quantum into derivative trend-following machinery.
  economic_goal: >
    Allocate scarce compute, creative development, ProofOfFilm budget, packaging,
    delivery and targeting effort according to expected long-term opportunity value.
  global_goal: >
    Build products for cultures rather than merely translating products into languages.
  autonomy_goal: >
    Continuously discover, rank and execute policy-authorized acquisition
    opportunities without requiring the creator to operate a sales pipeline.
  reputation_goal: >
    Ensure acquisition behavior itself reinforces the market belief that Quantum
    is selective, serious, fair and technologically unusual.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  OA-001:
    name: PRODUCT_BEFORE_TARGET
    statement: >
      Quantum should first understand what commercial promise a project actually
      makes before deciding who should receive it.
  OA-002:
    name: TARGET_FIT_BEATS_PRESTIGE
    statement: >
      The most famous executive is not automatically the best buyer.
  OA-003:
    name: AUTHORITY_MATTERS
    statement: >
      A target who loves the project but cannot meaningfully move it through the
      organization may have lower expected value than a less famous qualified target.
  OA-004:
    name: DISTRIBUTION_CAPABILITY_MATTERS
    statement: >
      Buyer ability to exploit the project influences project-buyer fit.
  OA-005:
    name: ECONOMIC_CAPACITY_MATTERS
    statement: >
      Acquisition targets should plausibly possess the budget or financing access
      required for the offered transaction.
  OA-006:
    name: CREATIVE_FIT_MATTERS
    statement: >
      Buyer history and strategy may indicate whether a project fits their actual
      product appetite.
  OA-007:
    name: CURRENT_EVIDENCE_OVER_STEREOTYPE
    statement: >
      Market reasoning should prefer observed contemporary evidence to clichés
      about regions or audiences.
  OA-008:
    name: GLOBAL_IS_NOT_MONOLITHIC
    statement: >
      Asia, Europe, Latin America, Africa and the Middle East are not single audience models.
  OA-009:
    name: COUNTRY_IS_NOT_AUDIENCE
    statement: >
      Audience segments can cross national borders and differ significantly within them.
  OA-010:
    name: LANGUAGE_IS_NOT_CULTURE
    statement: >
      Translating dialogue does not automatically create local product fit.
  OA-011:
    name: LOCAL_SUCCESS_REVEALS_GRAMMAR
    statement: >
      Local hits can provide evidence about pacing, emotional structure, themes,
      genre fluency, humor, star/character archetypes, format and audience appetite.
  OA-012:
    name: LOCAL_SUCCESS_IS_NOT_A_TEMPLATE
    statement: >
      Quantum does not reconstruct hit works by copying their characters,
      scenes, dialogue, visual identity or distinctive expression.
  OA-013:
    name: STRUCTURE_NOT_SURFACE
    statement: >
      Learn audience grammar from successful products rather than harvesting
      protectable creative expression.
  OA-014:
    name: ORIGINALITY_IS_HARD_CONSTRAINT
    statement: >
      Commercial adaptation may not violate Quantum's originality constitution.
  OA-015:
    name: FAMILIAR_ENOUGH_NOVEL_ENOUGH
    statement: >
      A target-market product should provide enough recognizable grammar for
      cognitive access while preserving unmistakable differentiation.
  OA-016:
    name: MARKET_EVIDENCE_IS_PROBABILISTIC
    statement: >
      Historical commercial success raises or lowers hypotheses; it never
      guarantees future demand.
  OA-017:
    name: CULTURAL_CONTEXT_IS_FIRST_CLASS
    statement: >
      Product reasoning should explicitly model norms, symbols, relationships,
      humor, taboo, values and interpretive frames where relevant.
  OA-018:
    name: CULTURAL_CONTEXT_IS_NOT_STEREOTYPE
    statement: >
      Cultural models represent distributions, variation and uncertainty rather
      than declaring all members of a society identical.
  OA-019:
    name: CULTURAL_EXPERTISE_CAN_BE_SYNTHETIC_BUT_EVIDENCE_BACKED
    statement: >
      Quantum may synthesize market understanding from research and observed
      products but should maintain uncertainty where lived cultural nuance is unclear.
  OA-020:
    name: JURISDICTION_IS_SEPARATE_FROM_CULTURE
    statement: >
      Legal and regulatory requirements are independent dimensions of market fit.
  OA-021:
    name: PLATFORM_RULES_MATTER
    statement: >
      A viable theatrical product may differ from a platform-native streaming product.
  OA-022:
    name: PRODUCT_CAN_BE_MARKET_NATIVE
    statement: >
      Quantum may originate an entirely new project for a target market rather
      than adapting a U.S.-originated project.
  OA-023:
    name: CREATOR_INPUT_REMAINS_SOURCE
    statement: >
      Market intelligence cannot silently rewrite locked creator intent.
  OA-024:
    name: PRODUCT_MODEL_MAY_RECOMMEND_NOT_COMMAND
    statement: >
      Market models may propose alternatives within authority but cannot override
      creator locks.
  OA-025:
    name: COMMERCIAL_INTELLIGENCE_IS_PREPRODUCTION_INPUT
    statement: >
      Market fit is cheapest to influence before expensive production locks.
  OA-026:
    name: MARKET_FIT_IS_NOT_CREATIVE_CAPTURE
    statement: >
      Production-awareness and product-awareness inform creativity without making
      art subordinate to dashboard optimization.
  OA-027:
    name: TARGETING_IS_PROFESSIONAL
    statement: >
      Quantum targets people in their business capacities.
  OA-028:
    name: NO_PRIVATE_SURVEILLANCE
    statement: >
      Targeting does not require private travel, home, family or intimate personal data.
  OA-029:
    name: NO_FAMILY_DATA_FOR_TARGETING
    statement: >
      Children, spouses and relatives are outside normal acquisition intelligence.
  OA-030:
    name: NO_PRIVATE_TRAVEL_TRACKING
    statement: >
      Quantum does not covertly track private aircraft, private hotel movements or
      nonpublic physical location to stage deliveries.
  OA-031:
    name: AUTHORIZED_DELIVERY_CONTEXTS
    statement: >
      White-glove delivery uses lawful professional contexts such as office,
      studio lot, authorized event, hotel/business concierge or authorized aviation concierge.
  OA-032:
    name: THEATER_WITHOUT_SECURITY_VIOLATION
    statement: >
      Physical spectacle must respect executive security and organizational protocol.
  OA-033:
    name: ONE_KEY_PER_TARGET
    statement: >
      Targeted executive experiences use recipient-specific Quantum Keys.
  OA-034:
    name: RECIPIENT_IDENTITY_IS_PART_OF_THE_EXPERIENCE
    statement: >
      Personalization may reflect public professional identity and legitimate
      project relevance without becoming intrusive.
  OA-035:
    name: ACQUISITION_ATTENTION_IS_EXPENSIVE
    statement: >
      Executive attention, compute, courier expense and production effort are
      all opportunity resources.
  OA-036:
    name: EFFORT_SCALES_WITH_EXPECTED_VALUE
    statement: >
      A $50M strategic opportunity can rationally receive more acquisition
      compute and physical presentation effort than a $100K opportunity.
  OA-037:
    name: EXPECTED_VALUE_INCLUDES_REPUTATION
    statement: >
      Opportunity value includes direct economics, repeat business, referrals,
      market access and reputation effects.
  OA-038:
    name: EXPECTED_VALUE_INCLUDES_OPTIONALITY
    statement: >
      A project may justify acquisition effort because it opens a new market,
      format, client category or long-lived franchise surface.
  OA-039:
    name: ACQUISITION_COST_IS_BOUNDED
    statement: >
      High expected value does not justify unlimited speculative spend.
  OA-040:
    name: PROOF_BUDGET_IS_POLICY_DRIVEN
    statement: >
      ProofOfFilm compute and quality effort scale according to an explicit
      OpportunityResourcePolicy.
  OA-041:
    name: PROOF_IS_NOT_CHEAP_BY_DEFAULT
    statement: >
      Because ProofOfFilm may be the highest-leverage artifact in the acquisition
      system, significant opportunities may justify disproportionate Proof spend.
  OA-042:
    name: HIGH_RISK_CREATIVE_MOMENTS_GET_MORE_TAKES
    statement: >
      Important Proof moments may receive more candidates, QC and specialist cognition.
  OA-043:
    name: PHYSICAL_EXPERIENCE_IS_ACQUISITION_MEDIA
    statement: >
      Box, Key, courier choreography and arrival context are legitimate parts of
      the acquisition experience budget.
  OA-044:
    name: PHYSICAL_LUXURY_MUST_NOT_FAKE_STATUS
    statement: >
      Premium packaging may signal effort, scarcity and seriousness but may not
      imply government, royalty, celebrity endorsement or other false provenance.
  OA-045:
    name: REPUTATION_REDUCES_REQUIRED_EXPLANATION
    statement: >
      As Quantum's reputation grows, acquisition may require less company proof
      and more immediate project exposure.
  OA-046:
    name: REPUTATION_REDUCES_PERCEIVED_EXECUTION_RISK
    statement: >
      Verified delivery history can improve conversion independent of project quality.
  OA-047:
    name: REPUTATION_CAN_SUPPORT_HIGHER_PRICE
    statement: >
      Reputation may inform future price-power policy but never mutate an active offer.
  OA-048:
    name: EXCLUSIVITY_SEQUENCE_IS_REAL
    statement: >
      Only one target holds the default exclusive opportunity within the same
      commercial scope at a time.
  OA-049:
    name: EXPIRED_TARGET_RELEASES_SEQUENCE
    statement: >
      When the current target's opportunity validly expires, the next eligible
      target may become active.
  OA-050:
    name: TARGET_SEQUENCE_IS_PRECOMPUTED_WHEN_POSSIBLE
    statement: >
      Quantum should know likely second and third recipients before the first
      exclusive opportunity expires.
  OA-051:
    name: DECLINE_IS_INFORMATION
    statement: >
      A decline informs future acquisition learning but does not automatically
      prove the project is weak.
  OA-052:
    name: EXPIRATION_IS_INFORMATION
    statement: >
      Expiration can indicate fit, timing, internal organizational friction,
      price mismatch or low urgency; causal interpretation remains uncertain.
  OA-053:
    name: RESERVATION_IS_STRONG_INTENT_SIGNAL
    statement: >
      Paying to reserve exclusivity is stronger evidence than simply opening the offer.
  OA-054:
    name: EXECUTION_IS_STRONGEST_CONVERSION_SIGNAL
    statement: >
      A signed funded deal outweighs engagement metrics.
  OA-055:
    name: VIEW_TIME_IS_NOT_PURCHASE_INTENT
    statement: >
      Watching the experience repeatedly can be interesting evidence but cannot
      be treated as equivalent to commercial commitment.
  OA-056:
    name: NO_MANIPULATIVE_ENGAGEMENT_OPTIMIZATION
    statement: >
      Acquisition learning optimizes qualified conversion and reputation, not
      compulsive viewer behavior.
  OA-057:
    name: ACQUISITION_LEARNING_HAS_GUARDRAILS
    statement: >
      Learned selection policies may choose among policy-authorized actions but
      cannot alter hard creative, legal, privacy or commercial rules.
  OA-058:
    name: CONTEXTUAL_BANDIT_BEFORE_SELF_REWRITING
    statement: >
      Early acquisition learning should rank known tactics rather than allow
      unconstrained autonomous policy rewriting.
  OA-059:
    name: CORRELATION_IS_NOT_CAUSATION
    statement: >
      Target response patterns should not be overinterpreted without appropriate
      comparison and sample size.
  OA-060:
    name: SMALL_SAMPLE_CONFIDENCE_STAYS_LOW
    statement: >
      Three successful deliveries do not justify universal conclusions about all buyers.
  OA-061:
    name: SEGMENT_LEARNING
    statement: >
      Acquisition learning should condition on market, buyer type, deal size,
      genre, format and reputation state.
  OA-062:
    name: GLOBAL_LEARNING_REMAINS_LOCALIZABLE
    statement: >
      A successful tactic in Los Angeles may not be appropriate in Seoul, Mumbai,
      Tokyo, London or Riyadh.
  OA-063:
    name: DELIVERY_CULTURE_MATTERS
    statement: >
      The theater of physical presentation may be adapted to professional norms
      of the recipient environment.
  OA-064:
    name: PROFESSIONAL_DIGNITY
    statement: >
      Quantum never designs the acquisition experience to embarrass or corner the recipient.
  OA-065:
    name: EXECUTIVE_CAN_EXIT
    statement: >
      The recipient may simply decline or let the offer expire.
  OA-066:
    name: NO_CHASING_AFTER_EXPIRED_OFFER
    statement: >
      Quantum does not undermine its own deadline with desperate follow-up.
  OA-067:
    name: TARGET_QUALITY_OVER_VOLUME
    statement: >
      Quantum does not need enormous outbound volume if the project, proof and
      target selection are exceptionally strong.
  OA-068:
    name: FEWER_BETTER_TARGETS
    statement: >
      High-quality target selection should outperform indiscriminate mass outreach.
  OA-069:
    name: BUYER_SEQUENCE_IS_A_PORTFOLIO
    statement: >
      Multiple qualified potential buyers may exist even though exclusivity is
      offered sequentially.
  OA-070:
    name: MARKET_CREATION_IS_ALLOWED
    statement: >
      Quantum may pursue unusual products for which no obvious precedent exists
      if product intelligence supports the opportunity.
  OA-071:
    name: TREND_CHASING_IS_NOT_REQUIRED
    statement: >
      Current popularity is evidence, not creative authority.
  OA-072:
    name: CONTRARIAN_OPPORTUNITY_IS_FIRST_CLASS
    statement: >
      Underserved audience desires or tired market patterns may create stronger
      opportunities than crowded trend categories.
  OA-073:
    name: WHITE_SPACE_IS_VALUABLE
    statement: >
      Absence of strong competing products can be opportunity evidence when
      explained by unmet demand rather than lack of demand.
  OA-074:
    name: DISTINCTIVENESS_HAS_MARKET_VALUE
    statement: >
      A product nobody has seen before can be commercially useful if it remains legible.
  OA-075:
    name: MARKETABILITY_FORMULA_REMAINS_UPSTREAM
    statement: >
      Acquisition consumes Marketability from spec 18 rather than redefining it.
  OA-076:
    name: MARKETABILITY_EXACT_FORMULA
    statement: >
      Marketability =
        AttentionCapture
        × Comprehension
        × EmotionalValue
        × ContinuationPressure
        × Distinctiveness
        × Trust
        × SocialTransmission
        × ExecutionCredibility
  OA-077:
    name: SIGNABILITY_REMAINS_COMMERCIAL
    statement: >
      Acquisition may predict Signability but spec 23 owns commercial semantics.
  OA-078:
    name: OPPORTUNITY_VALUE_IS_NOT_DEAL_VALUE
    statement: >
      The strategic expected value of pursuing a target can exceed or fall below
      the nominal contract amount.
  OA-079:
    name: ACQUISITION_SHOULD_STOP
    statement: >
      Projects or markets with persistently weak expected value should stop
      consuming speculative resources unless creator strategy says otherwise.
  OA-080:
    name: LEARNING_NEVER_ERASES_FAILED_ATTEMPTS
    statement: >
      Failed acquisition evidence remains part of history.
# =====================================================================
# 3. OPPORTUNITY CANDIDATE
# =====================================================================
opportunity:
  OpportunityCandidate:
    extends:
      - 10.CanonicalObject
    object_class:
      value: DOMAIN_OBJECT
    fields:
      opportunity_id:
      project_id:
      opportunity_type:
        enum:
          - EXISTING_PROJECT_ACQUISITION
          - MARKET_NATIVE_PROJECT
          - LIVE_ACTION_PACKAGE
          - ANIMATION_FEATURE
          - ANIMATION_SERIES
          - SHORT_FORM
          - LICENSING
          - CO_PRODUCTION
          - FINANCING
          - DISTRIBUTION
          - CUSTOM
      target_market_refs:
      target_buyer_class:
      target_organization_refs:
      Marketability_ref:
      ProductMarketModel_ref:
      AudienceModel_ref:
      ReputationState_ref:
      production_feasibility_ref:
      acquisition_cost_ref:
      expected_value_ref:
      creator_interest:
      strategic_reason:
      current_state:
      source_refs:
      provenance_ref:
# =====================================================================
# 4. OPPORTUNITY STATE
# =====================================================================
state:
  OpportunityState:
    enum:
      - DISCOVERED
      - RESEARCHING
      - QUALIFIED
      - PRODUCT_ADAPTATION
      - PROOF_COMPILATION
      - ACQUISITION_PACKAGE_READY
      - TARGET_SEQUENCE_READY
      - DELIVERY_PLANNED
      - FIRST_TARGET_ACTIVE
      - OFFER_REVEALED
      - RESERVED
      - CONVERTED
      - DECLINED
      - EXPIRED
      - NEXT_TARGET_ACTIVE
      - EXHAUSTED
      - PAUSED
      - ABANDONED
      - CLOSED_WON
      - CLOSED_NO_DEAL
# =====================================================================
# 5. TARGET MARKET
# =====================================================================
market:
  TargetMarket:
    fields:
      market_id:
      geography:
      language_groups:
      audience_segments:
      distribution_channels:
      platform_profiles:
      regulatory_profile_ref:
      market_intelligence_ref:
      CulturalContextModel_ref:
      purchasing_power_context:
      category_demand:
      format_demand:
      local_content_supply:
      imported_content_receptivity:
      opportunity_dimensions:
      uncertainty:
      evidence_cutoff:
      provenance_ref:
# =====================================================================
# 6. MARKET INTELLIGENCE MODEL
# =====================================================================
market_intelligence:
  MarketIntelligenceModel:
    extends:
      - 10.ProjectionObject
    fields:
      model_id:
      market_ref:
      evidence_window:
      audience_demand_signals:
      genre_signals:
      format_signals:
      distribution_signals:
      pricing_signals:
      production_signals:
      localization_signals:
      local_hit_refs:
      failure_pattern_refs:
      white_space_hypotheses:
      competitive_density:
      market_growth_projection:
      uncertainty:
      confidence:
      model_version:
      generated_at:
# =====================================================================
# 7. MARKET EVIDENCE
# =====================================================================
evidence:
  MarketEvidence:
    extends:
      - 10.EvidenceObject
    fields:
      evidence_id:
      market_ref:
      evidence_type:
