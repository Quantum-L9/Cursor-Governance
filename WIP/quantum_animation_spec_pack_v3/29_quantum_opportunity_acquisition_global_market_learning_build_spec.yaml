      - payment_clear
      - deal_margin
      - repeat_business
      - referral
      - reputation_gain
      - market_entry_value
  strongest_immediate:
    - payment_clear
  strongest_long_horizon:
    - repeat_business
    - referral
    - reputation_gain
  negative:
    - acquisition_cost
    - target_annoyance
    - privacy_incident
    - security_incident
    - reputation_damage
    - wasted_exclusivity_time
# =====================================================================
# 48. LEARNING POLICY
# =====================================================================
learning:
  initial_strategy:
    - reliability_tables
    - rule_based_qualification
    - calibrated_classifiers
    - target_ranker
    - contextual_bandit
  not_initial_strategy:
    - unconstrained_LLM_self_rewriting
    - arbitrary_reward_hacking
    - auto_mutation_of_privacy_rules
    - auto_mutation_of_commercial_policy
  contextual_bandit:
    context_examples:
      - market
      - project_type
      - buyer_type
      - organization
      - deal_size
      - Quantum_reputation
      - target_role
      - genre
      - Proof_strength
      - acquisition_channel
    actions:
      - target_choice
      - target_sequence_position
      - physical_experience_tier
      - Proof_resource_band
      - update_density
      - role_specific_presentation_variant
    reward:
      constrained_by:
        - creator_values
        - privacy
        - truth
        - reputation
        - legal_policy
# =====================================================================
# 49. ACQUISITION EXPLORATION
# =====================================================================
exploration:
  principle: >
    Quantum needs enough exploration to discover new markets and buyers without
    sacrificing strong opportunities to reckless experimentation.
  ExplorationPolicy:
    fields:
      policy_id:
      exploration_rate:
      minimum_expected_value:
      protected_high_value_opportunities:
      new_market_budget:
      new_buyer_class_budget:
      new_experience_strategy_budget:
      stop_loss:
      version:
# =====================================================================
# 50. CONTRARIAN MARKET OPPORTUNITY
# =====================================================================
contrarian:
  ContrarianOpportunity:
    fields:
      opportunity_ref:
      crowded_market_assumption:
      contrary_evidence:
      underserved_audience:
      stale_industry_pattern:
      Quantum_advantage:
      originality_fit:
      downside:
      confidence:
  use:
    - identify_nonconsensus_projects
# =====================================================================
# 51. MARKET WHITE SPACE
# =====================================================================
white_space:
  MarketWhiteSpaceHypothesis:
    fields:
      market_ref:
      audience_segment:
      missing_product_pattern:
      evidence_of_demand:
      evidence_of_supply_gap:
      alternate_explanation:
      Quantum_fit:
      test_strategy:
      confidence:
  caution: >
    Absence of products can indicate either opportunity or lack of demand.
# =====================================================================
# 52. MARKET-NATIVE PROJECT ORIGINATION
# =====================================================================
market_native:
  MarketNativeProjectSeed:
    fields:
      target_market_ref:
      audience_need:
      CulturalOpportunity_refs:
      ProductMarketModel_seed:
      creator_interest:
      originality_target:
      commercial_surface:
      format:
      language:
      production_advantage:
      global_travel_potential:
      source_evidence_refs:
  flow: |
    market opportunity
        ↓
    audience grammar
        ↓
    creator invention
        ↓
    CreativeSeed
        ↓
    normal Quantum creative compiler
  rule: >
    Market evidence may inspire the problem space. The project itself must still
    be a new Quantum creation.
# =====================================================================
# 53. LOCALIZATION STRATEGY
# =====================================================================
localization:
  MarketLocalizationStrategy:
    fields:
      project_ref:
      market_ref:
      translation_only_sufficient:
      dialogue_rewriting_required:
      performance_localization_required:
      humor_localization_required:
      visual_symbol_adjustment_required:
      music_adjustment_required:
      rating_adjustment_required:
      market_specific_marketing_required:
      culturally_sensitive_QC_required:
      expected_cost:
      expected_value:
  principle: >
    Localization depth is chosen according to the product, not ideology that
    every market must receive either identical or completely rewritten work.
# =====================================================================
# 54. GLOBAL LANGUAGE CAPABILITY
# =====================================================================
language_capability:
  advantage: >
    Quantum's AI-native production system can generate, evaluate and iterate
    language variants without traditional linear localization staffing.
  limitations:
    - language_fluency_does_not_equal_cultural_fit
    - performance_quality_must_be_revalidated
    - humor_must_be_revalidated
    - pronunciation_must_be_revalidated
    - lip_sync_must_be_revalidated
    - legal_and_rating_rules_remain_local
# =====================================================================
# 55. GLOBAL MARKET COMPILER
# =====================================================================
global_market_compiler:
  GlobalMarketCompiler:
    input:
      - creative.yaml
      - project_ProductMarketModel
      - project_AudienceModel
      - QuantumReputationState
      - SelfModel
      - current_market_evidence
    per_market_outputs:
      - TargetMarket
      - CulturalContextModel
      - JurisdictionMarketProfile
      - MarketSpecificProductModel
      - GlobalProductAdaptationPlan
      - TargetOrganizationCandidates
      - ExpectedOpportunityValue
    selector:
      produces:
        - OpportunityPortfolio
# =====================================================================
# 56. OPPORTUNITY PORTFOLIO
# =====================================================================
portfolio:
  OpportunityPortfolio:
    fields:
      portfolio_id:
      opportunities:
      active_acquisition_count:
      speculative_development_count:
      total_acquisition_budget:
      market_distribution:
      format_distribution:
      risk_distribution:
      expected_value_distribution:
      strategic_market_entry_refs:
      updated_at:
      policy_version:
  portfolio_controls:
    - avoid_all_resources_on_one_unproven_market
    - preserve_creator_capacity
    - preserve_compute_capacity
    - avoid_excessive_simultaneous_exclusive_packages
# =====================================================================
# 57. TARGET DELIVERY TIMING
# =====================================================================
timing:
  principles:
    - professional_context
    - lawful_context
    - project_relevance
    - recipient_availability_where_authorized
    - no_private_tracking
  may_use:
    - authorized_assistant_coordination
    - public_professional_event_schedule
    - confirmed_office_delivery
    - authorized_concierge
    - explicit_business_travel_context
  may_not_use:
    - covert_location_broker_data
    - nonpublic_family_schedule
    - stalking_like_behavior
# =====================================================================
# 58. PHYSICAL PACKAGE AS SIGNAL
# =====================================================================
physical_signal:
  desired_inferences:
    - intentional
    - scarce
    - premium
    - technologically_advanced
    - serious
    - high_effort
  forbidden_inferences_to_manufacture:
    - government_authority
    - royal_authority
    - celebrity_endorsement
    - false_invitation
    - fake_security_clearance
# =====================================================================
# 59. ACQUISITION ROLE ADAPTATION
# =====================================================================
role_adaptation:
  executive:
    emphasize:
      - project
      - audience
      - value
      - opportunity
      - execution_confidence
  creative:
    emphasize:
      - characters
      - world
      - theme
      - cinematic_identity
  finance:
    emphasize:
      - commercial_scenarios
      - deal_clarity
      - scope
      - risk
  business_affairs:
    emphasize:
      - rights
      - agreement
      - legal_review
  invariant:
    underlying_truth_same: true
# =====================================================================
# 60. REPUTATION-AWARE ACQUISITION
# =====================================================================
reputation:
  inputs:
    - QuantumReputationState
    - CommitmentCredibility
    - ReputationSegment
  acquisition_effects:
    low_reputation:
      more_effort_on:
        - execution_confidence
        - proof
        - provenance
        - concrete_quality_evidence
    high_reputation:
      may_reduce:
        - corporate_explanation
        - capability_proof_density
      may_increase:
        - project_selectivity
        - price_power_signal
        - buyer_response_prior
  cannot:
    - fabricate_social_proof
# =====================================================================
# 61. REPEAT CLIENT ACQUISITION
# =====================================================================
repeat_clients:
  source:
    spec: 27
  flow: |
    archived successful project
        ↓
    strong ClientRelationship
        ↓
    new suitable Quantum opportunity
        ↓
    reduced acquisition friction
        ↓
    same Key / relationship gateway
        ↓
    new project experience
  may_skip:
    - elaborate_company_introduction
    - first_contact_theater_if_not_useful
  may_preserve:
    - surprise
    - premium_packaging_for_major_projects
# =====================================================================
# 62. LIVE-ACTION SIDE DOOR
# =====================================================================
live_action:
  strategy:
    studio_owner: Quantum_Animation_Studio
  product:
    - developed_live_action_concept
    - internally_consistent_world_story_package
    - ProofOfFilm
    - producer_financier_ready_data_room
    - commercial_reasoning
    - packaging
    - financing_scenarios
  objective:
    - sell
    - license
    - finance
    - attach_producer
    - generate_capital_for_Quantum
  not_primary_current_business:
    true
  acquisition_runtime:
    same_core:
      - target_selection
      - ProofOfFilm
      - physical_experience
      - offer
      - agreement
  production_runtime:
    may_differ_after_sale: true
# =====================================================================
# 63. TARGET LEARNING FEATURES
# =====================================================================
target_features:
  allowed:
    - role
    - organization
    - publicly_known_professional_history
    - prior_professional_transactions_with_Quantum
    - publicly_observed_content_strategy
    - lawful_business_relationship
    - target_project_fit
  prohibited_by_default:
    - health
    - family
    - children
    - religion_as_individual_targeting_variable
    - sexuality
    - private_finances
    - private_location
    - private_correspondence
# =====================================================================
# 64. ACQUISITION ETHICS
# =====================================================================
ethics:
  forbidden:
    - deception
    - impersonation
    - bribery
    - fabricated_endorsement
    - coercion
    - private_surveillance
    - fake_scarcity
    - hidden_financial_terms
  allowed:
    - dramatic_presentation
    - scarcity_when_real
    - white_glove_delivery
    - recipient_specific_artifacts
    - premium_signaling
    - selective_targeting
    - fixed_deadlines
# =====================================================================
# 65. TARGET RESPONSE TELEMETRY
# =====================================================================
telemetry:
  permitted:
    - package_delivered
    - Key_activated
    - portal_session_started
    - Proof_started
    - Proof_completed
    - module_viewed
    - offer_revealed
    - legal_review_started
    - reservation
    - agreement_executed
    - payment_cleared
  prohibited_without_extra_policy:
    - covert_camera
    - biometric_emotion
    - keystroke_surveillance
    - invasive_device_fingerprinting
    - cross_site_tracking
# =====================================================================
# 66. KEY ACTIVATION SIGNAL
# =====================================================================
key_activation:
  event:
    source: spec_20.KeyActivated
  meaning:
    - package_received_or_Key_used
    - recipient_attention_event
  does_not_mean:
    - offer_revealed
    - buyer_interest_guaranteed
    - deal_started
    - commercial_clock_started
# =====================================================================
# 67. OFFER REVEAL SIGNAL
# =====================================================================
offer_reveal:
  source:
    spec: 23
  significance:
    higher_than_Key_activation: true
  reasoning: >
    The viewer intentionally crossed from project exploration into commercial
    decision state.
# =====================================================================
# 68. RESERVATION SIGNAL
# =====================================================================
reservation_signal:
  source:
    spec: 23_and_25
  significance:
    very_high: true
  meaning: >
    Buyer values continued exclusive access enough to place real consideration at risk.
# =====================================================================
# 69. FUNDED DEAL SIGNAL
# =====================================================================
funded_deal:
  source:
    - spec_24
    - spec_25
  significance:
    maximum_conversion_reward: true
# =====================================================================
# 70. ACQUISITION EXECUTIVE
# =====================================================================
executive:
  AcquisitionExecutive:
    role: >
      Strategic subsystem responsible for portfolio-level opportunity discovery,
      market selection, target sequencing and acquisition resource allocation.
  reads:
    - ProductMarketModel
    - AudienceModel
    - MarketIntelligence
    - CulturalContext
    - SelfModel
    - ReputationState
    - ClientRelationshipModel
    - acquisition_history
  emits:
    - OpportunityPortfolio
    - OpportunityResourceEnvelope
    - TargetSequence
    - AcquisitionExperiencePlan
  cannot_emit:
    - binding_offer
    - creative_lock_change
    - final_delivery
# =====================================================================
# 71. LEARNING EXPERIENCE
# =====================================================================
operator_experience:
  AcquisitionOperatorExperience:
    fields:
      experience_id:
      operator_id:
      context_features:
      opportunity_ref:
      target_ref:
      action:
      cost:
      outcome:
      conversion_reward:
      relationship_reward:
      reputation_reward:
      negative_externalities:
      confidence:
      created_at:
# =====================================================================
# 72. STOPPING POLICY
# =====================================================================
stopping:
  AcquisitionStoppingPolicy:
    fields:
      project_ref:
      maximum_targets:
      maximum_speculative_acquisition_cost:
      minimum_expected_value_after_failures:
      market_reassessment_trigger:
      Proof_rebuild_trigger:
      project_redevelopment_trigger:
      creator_interest_floor:
      abandonment_condition:
  principle: >
    Persistence is not virtue when evidence says the opportunity is weak.
# =====================================================================
# 73. REDEVELOPMENT AFTER FAILURE
# =====================================================================
redevelopment:
  possible_causes:
    - wrong_target
    - wrong_market
    - weak_Proof
    - weak_product_legibility
    - weak_marketability
    - price_fit
    - legal_friction
    - timing
  repair_order:
    - reconsider_target
    - reconsider_sequence
    - reconsider_market
    - reconsider_acquisition_experience
    - reconsider_Proof
    - reconsider_product_model
    - only_then_consider_creative_changes_within_authority
  locked_creator_intent:
    cannot_be_silently_changed: true
# =====================================================================
# 74. ACQUISITION QC
# =====================================================================
QC:
  formal_owner:
    spec: 07_quantum_autonomous_qc_build_spec.yaml
  OpportunityAcquisitionQCContract:
    dimensions:
      TARGET_FIT:
        question: >
          Is the target genuinely capable of creating value from this project?
      MARKET_FIT:
        question: >
          Does the selected market have evidence-backed product relevance?
      ORIGINALITY:
        question: >
          Did local-hit analysis inform grammar without causing derivative copying?
      CULTURAL_FIT:
        question: >
          Are cultural assumptions explicit and appropriately uncertain?
      PRIVACY:
        question: >
          Does acquisition avoid private surveillance and inappropriate personal data?
      AUTHORITY:
        question: >
          Does the target plausibly possess relevant professional influence?
      VALUE:
        question: >
          Is acquisition effort rational relative to ExpectedOpportunityValue?
      EXPERIENCE:
        question: >
          Is the recipient-specific experience premium and coherent?
      REPUTATION:
        question: >
          Does the acquisition tactic reinforce Quantum's intended reputation?
      LEARNING:
        question: >
          Can the outcome produce clean evidence for future policy improvement?
# =====================================================================
# 75. HARD FAILURES
# =====================================================================
hard_failures:
  - code: ACQUISITION.PRIVATE_SURVEILLANCE
    severity: CRITICAL
  - code: ACQUISITION.FAMILY_DATA_USED
    severity: CRITICAL
  - code: ACQUISITION.FALSE_OFFICIAL_SIGNAL
    severity: CRITICAL
  - code: ACQUISITION.ACTIVE_EXCLUSIVITY_CONFLICT
    severity: CRITICAL
  - code: ACQUISITION.DERIVATIVE_LOCAL_HIT_COPY
    severity: CRITICAL
  - code: ACQUISITION.TARGET_PROFESSIONAL_MISIDENTIFIED
    severity: MAJOR
  - code: ACQUISITION.TARGET_INELIGIBLE
    severity: CRITICAL
  - code: ACQUISITION.RESOURCE_ENVELOPE_EXCEEDED
    severity: MAJOR
  - code: ACQUISITION.FALSE_REPUTATION_CLAIM
    severity: CRITICAL
  - code: ACQUISITION.ILLEGAL_DELIVERY_CONTEXT
    severity: CRITICAL
# =====================================================================
# 76. FAILURE MODES
# =====================================================================
failure_modes:
  MARKET_DATA_STALE:
    behavior:
      - lower_confidence
      - refresh_before_high_value_decision
  TARGET_ROLE_UNCERTAIN:
    behavior:
      - reduce_authority_score
      - do_not_claim_signatory_authority
  TARGET_NOT_REACHABLE_LAWFULLY:
    behavior:
      - mark_ineligible
  WHITE_GLOVE_DELIVERY_UNAVAILABLE:
    behavior:
      - use_secure_professional_alternative
      - preserve_experience_quality
  KEY_DELIVERY_FAILS:
    behavior:
      - do_not_activate_offer
      - reissue_or_redeliver_under_security_policy
  FIRST_TARGET_EXPIRES:
    behavior:
      - finalize_attempt
      - advance_sequence
  MULTIPLE_TARGETS_WANT_PROJECT_AFTER_EXPIRY:
    behavior:
      - apply_current_commercial_policy
      - no_reopening_invalid_prior_offer
  MARKET_ASSUMPTION_FAILS:
    behavior:
      - preserve_evidence
      - update_confidence
      - avoid_global_overgeneralization
# =====================================================================
# 77. SECURITY
# =====================================================================
security:
  acquisition_data:
    classification: CONFIDENTIAL_STRATEGIC
  TargetSequence:
    access:
      tightly_scoped: true
  delivery_schedule:
    protected: true
  recipient_personalization:
    minimum_data: true
  QuantumKey:
    security_owner: spec_20
  external_courier:
    receives:
      - minimum_delivery_information
    does_not_receive:
      - creative_secret
      - cryptographic_master_keys
      - commercial_terms_unless_required
# =====================================================================
# 78. PRIVACY
# =====================================================================
privacy:
  principle: >
    Know the market deeply.
    Know the professional context precisely.
    Do not build dossiers about private lives.
  allowed:
    - public_professional_role
    - organization
    - business_strategy
    - public_professional_history
    - prior_QAS_relationship
    - authorized_assistant_context
  prohibited_by_default:
    - children
    - family
    - home_tracking
    - private_aircraft_tracking
    - private_hotel_tracking
    - medical_information
    - intimate_relationships
    - unrelated_personal_purchases
# =====================================================================
# 79. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - market_evidence_to_MarketIntelligenceModel
    - LocalHitObservation_to_AudienceGrammarPattern
    - AudienceGrammarPattern_to_MarketSpecificProductModel
    - CulturalContextModel_to_GlobalProductAdaptationPlan
    - target_public_evidence_to_TargetQualification
    - target_fit_to_TargetSequence
    - ReputationState_to_target_conversion_prior
    - OpportunityScore_to_OpportunityResourceEnvelope
    - ResourceEnvelope_to_Proof_budget
    - ResourceEnvelope_to_physical_experience_budget
    - TargetSequence_to_AcquisitionAttempt
    - AcquisitionAttempt_to_outcome
    - outcome_to_AcquisitionLearningRecord
    - learning_record_to_policy_version
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 80. OBSERVABILITY
# =====================================================================
observability:
  markets:
    - opportunities_by_market
    - conversion_by_market
    - market_confidence
    - cultural_adaptation_cost
    - global_product_transfer_rate
  targeting:
    - qualification_rate
    - Key_activation_rate
    - Proof_completion_rate
    - offer_reveal_rate
    - reservation_rate
    - funded_conversion_rate
  sequencing:
    - conversion_by_sequence_rank
    - average_targets_to_conversion
    - exclusivity_days_consumed
  economics:
    - acquisition_cost_per_funded_deal
    - Proof_cost_per_funded_deal
    - physical_experience_cost_per_funded_deal
    - ExpectedOpportunityValue_calibration
  reputation:
    - conversion_by_ReputationState
    - price_power_by_ReputationSegment
  global:
    - localization_success
    - market_native_project_performance
    - cultural_QC_failure_rate
# =====================================================================
# 81. PROPERTY TESTS
# =====================================================================
property_tests:
  - MarketIntelligence_never_modifies_creator_lock
  - local_hit_analysis_never_emits_copied_character
  - local_hit_analysis_never_emits_copied_dialogue
  - cultural_model_never_asserts_all_individuals_share_same_trait
  - private_family_data_never_enters_target_score
  - private_travel_data_never_enters_delivery_plan
  - target_authority_projection_never_counts_as_legal_signatory_evidence
  - acquisition_learning_never_mutates_active_offer
  - acquisition_learning_never_mutates_legal_policy
  - acquisition_learning_never_mutates_privacy_policy
  - expired_target_never_keeps_exclusivity
  - reservation_active_never_advances_to_next_buyer
  - one_project_never_has_two_default_exclusive_targets_simultaneously
  - ReputationState_never_fabricates_social_proof
  - high_EOV_never_bypasses_creator_intent
  - high_EOV_never_bypasses_privacy
  - acquisition_cost_never_exceeds_envelope_without_authority
  - failed_acquisition_attempt_never_deleted_from_learning_history
# =====================================================================
# 82. SCENARIO TESTS
# =====================================================================
scenario_tests:
  US_project_to_Japan:
    sequence:
      - analyze_Japanese_target_audience
      - inspect_local_hits_for_grammar
      - compile_CulturalContextModel
      - identify_adaptable_vs_invariant_elements
      - compile_MarketSpecificProductModel
      - evaluate_localization_depth
      - target_qualified_Japanese_buyer
    expect:
      - original_project_identity_preserved
      - no_surface_copy
  market_native_project:
    sequence:
      - detect_underserved_audience
      - creator_invents_new_project
      - normal_creative_compiler
      - ProofOfFilm
      - target_market_acquisition
    expect:
      - market_informed_not_market_copied
  high_value_target:
    EOV: VERY_HIGH
    expect:
      - higher_Proof_budget
      - more_OhShitMoment_candidates
      - deeper_QC
      - premium_physical_package
      - white_glove_delivery
  target_expires:
    expect:
      - attempt_closed
      - target_ineligible_under_default_reoffer_policy
      - next_target_activates
  target_reserves:
    expect:
      - no_next_target_activation
      - exclusivity_preserved
  public_business_event:
    delivery:
      allowed_if_professionally_appropriate: true
  private_jet_location_scraped_from_nonpublic_source:
    expected:
      - REJECTED
      - privacy_hard_failure
  first_three_US_deals_convert:
    expected:
      - US_confidence_up
      - no_assumption_Asia_same
# =====================================================================
# 83. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: OA-G01
    check: OpportunityCandidate exists
  - id: OA-G02
    check: OpportunityPortfolio exists
  - id: OA-G03
    check: ExpectedOpportunityValue includes long-term variables
  - id: OA-G04
    check: OpportunityResourcePolicy exists
  - id: OA-G05
    check: acquisition effort is bounded
  - id: OA-G06
    check: market intelligence stores evidence and uncertainty
  - id: OA-G07
    check: LocalHitObservation cannot emit copied expression
  - id: OA-G08
    check: AudienceGrammarPattern exists
  - id: OA-G09
    check: CulturalContextModel exists
  - id: OA-G10
    check: cultural model is probabilistic
  - id: OA-G11
    check: FamiliarityDifferentiationEnvelope exists
  - id: OA-G12
    check: MarketSpecificProductModel cannot override creator locks
  - id: OA-G13
    check: GlobalProductAdaptationPlan separates invariant/adaptable elements
  - id: OA-G14
    check: JurisdictionMarketProfile exists
  - id: OA-G15
    check: PlatformMarketProfile exists
  - id: OA-G16
    check: target organization and professional are separate objects
  - id: OA-G17
    check: TargetQualification exists
  - id: OA-G18
    check: TargetAuthorityProjection is not legal signing evidence
  - id: OA-G19
    check: professional targeting excludes family/private-life data
  - id: OA-G20
    check: TargetSequence exists
  - id: OA-G21
    check: only one default exclusive target active
  - id: OA-G22
    check: expired target can advance sequence
  - id: OA-G23
    check: reserved target blocks sequence advancement
  - id: OA-G24
    check: recipient-specific QuantumKey plan exists
  - id: OA-G25
    check: ResonanceSerial remains nonsecret
  - id: OA-G26
    check: white-glove delivery has authorized-context policy
  - id: OA-G27
    check: covert private travel tracking prohibited
  - id: OA-G28
    check: ProofOfFilm resources scale with opportunity value
  - id: OA-G29
    check: physical experience resources scale with opportunity value
  - id: OA-G30
    check: Marketability formula preserved exactly
  - id: OA-G31
    check: acquisition consumes Signability without owning commercial terms
  - id: OA-G32
    check: acquisition outcome creates learning record
  - id: OA-G33
    check: contextual bandit limited to policy-authorized actions
  - id: OA-G34
    check: failed attempts remain in learning history
  - id: OA-G35
    check: learning confidence reflects sample size
  - id: OA-G36
    check: ReputationState influences but does not fabricate buyer confidence
  - id: OA-G37
    check: repeat-client acquisition consumes spec 27
  - id: OA-G38
