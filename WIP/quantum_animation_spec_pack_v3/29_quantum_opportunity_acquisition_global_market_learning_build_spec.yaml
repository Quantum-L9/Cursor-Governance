architectural_identity:
  concise: >
    Decide what opportunities Quantum should pursue, where in the world they
    should be pursued, which qualified buyer should receive them, how much effort
    each opportunity deserves, and what Quantum should learn from every attempt.
  extended: >
    Quantum Opportunity Acquisition and Global Market Learning is the studio's
    outward-facing strategic cognition. It transforms product intelligence,
    audience understanding, market evidence, cultural context, jurisdiction
    constraints, client relationships, reputation, production capability,
    acquisition cost and project economics into prioritized opportunities.
    It may identify attractive global markets, analyze locally successful
    products for audience grammar, compile culturally specific ProductMarketModels,
    discover qualified professional acquisition targets, score target-project fit,
    sequence recipients, allocate ProofOfFilm and presentation resources, prepare
    lawful white-glove delivery plans, evaluate conversion results and update
    future targeting policies. It never copies successful local works, never
    substitutes cultural statistics for creative originality, never surveils
    private individuals, never changes the active commercial offer and never
    exposes Quantum to uncontrolled learned policy changes.
  strategic_identity: >
    Quantum should not merely wait for buyers.
    Quantum should continually discover where an unusual project could create
    disproportionate commercial value and place that project in front of the
    person most capable of saying yes.
  global_identity: >
    Translation gives Quantum global production reach.
    Cultural intelligence gives Quantum global product reach.
ownership:
  system: OPPORTUNITY_ACQUISITION_GLOBAL_MARKET_LEARNING
  owner_question:
    primary: >
      Given Quantum's projects, capabilities, reputation and current global
      market evidence, what should Quantum pursue next, for whom, where, and
      with how much acquisition effort?
  secondary_questions:
    - "Which projects have the strongest commercial potential?"
    - "Which markets fit this project?"
    - "Which markets should influence the product before production?"
    - "Who is the target audience in each market?"
    - "What locally successful work reveals useful audience grammar?"
    - "Which patterns are structural versus derivative surface features?"
    - "What cultural assumptions differ from the project's originating market?"
    - "What humor, symbolism, taboo or social norms matter?"
    - "What pacing and genre literacy does the target audience bring?"
    - "What language/performance localization is required?"
    - "What jurisdiction or platform constraints matter?"
    - "Which organizations are plausible buyers?"
    - "Which specific professional roles can actually champion the project?"
    - "Which targets have authority, budget, fit and distribution capability?"
    - "Which target should receive the first exclusive Quantum Key?"
    - "Who receives the project if the first target expires or declines?"
    - "What is the expected value of each target?"
    - "How much ProofOfFilm effort should this opportunity receive?"
    - "How expensive should the physical delivery experience be?"
    - "What acquisition cost is rational?"
    - "How does Quantum's reputation change conversion probability?"
    - "What did the last pitch teach us?"
    - "Which acquisition tactics are working?"
    - "Which markets deserve dedicated product development?"
    - "When should Quantum develop a project specifically for a market rather than localize an existing one?"
    - "When should Quantum stop pursuing an opportunity?"
