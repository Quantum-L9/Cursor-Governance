    - observability
  release:
    requirement: QK-G01_through_QK-G40_pass
# =====================================================================
# 80. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    The Quantum Key is a real physical bearer credential, not a decorative QR card.
  law_02: >
    QR identifies the doorway. Cryptographic physical possession opens it.
  law_03: >
    Normal access requires no typed password, code or account.
  law_04: >
    The visible ResonanceSerial is identity and symbolism, never authentication.
  law_05: >
    One cold-target experience normally receives one unique Quantum Key identity.
  law_06: >
    The card may be physically transferred; the protected link may not substitute
    for that transfer.
  law_07: >
    The Quantum Key contains access capability, not project files.
  law_08: >
    Root secrets never enter model prompts, semantic IR, provenance or manufacturing vendors.
  law_09: >
    Compromise of one Key should have the smallest possible credential blast radius.
  law_10: >
    Credential implementations are replaceable adapters, not architecture.
  law_11: >
    Dynamic freshness and replay resistance are preferred wherever the physical
    credential implementation can provide them.
  law_12: >
    New protected sessions require a valid physical possession assertion under
    the active authentication policy.
  law_13: >
    Access sessions are temporary, scoped and revocable.
  law_14: >
    A project URL is never a permanent bearer credential.
  law_15: >
    Protected resource URLs are temporary implementation details.
  law_16: >
    Forwarding a URL must not transfer the same authority as handing over the Key.
  law_17: >
    ACCESS GRANTED is a first-class state transition.
  law_18: >
    First successful authentication means MESSAGE RECEIVED.
  law_19: >
    Key activation does not start the commercial offer clock.
  law_20: >
    Possession may establish viewing authority but never contract-signing authority.
  law_21: >
    Lost and stolen Keys must be revocable without touching creative project semantics.
  law_22: >
    Replacement creates new credential identity.
  law_23: >
    Quantum should prevent ordinary forwarding and downloading without making
    impossible claims about external recording.
  law_24: >
    A determined viewer can film a screen; Quantum accepts that irreducible risk.
  law_25: >
    Forensic attribution may deter leakage but may not visibly damage the cinematic experience.
  law_26: >
    Corporate compatibility is maximized by making the protected endpoint an
    ordinary secure browser rather than custom client software.
  law_27: >
    Convenience features such as big-screen pairing may transfer scoped session
    authority but cannot create new long-term credentials.
  law_28: >
    Security failure degrades closed.
  law_29: >
    Authentication telemetry must remain operational rather than invasive.
  law_30: >
    Security theater is acceptable only when real security exists underneath it.
  law_31: >
    The physical Key can survive the sale and later unlock new authorized scopes.
  law_32: >
    The desired interaction is:
    physical object
    -> cryptographic proof
    -> ACCESS GRANTED
    -> private experience.
