architectural_identity:
  concise: >
    Model the psychological mechanisms through which a cinematic experience
    changes an intended viewer's attention, understanding, curiosity, attachment,
    anticipation, inference, suspense, memory, trust and desire for continuation.
  extended: >
    Quantum Viewer Cognition and Psychology is the applied psychodynamic layer
    between the AudienceModel's predicted viewer state and the cinematic
    decisions that intentionally transform that state over time. It consumes
    AudienceModel, ViewerArchetype, base ViewerState sequences, World audience
    disclosure, CreatorModel, story and audiovisual evidence and derives
    structured psychodynamic projections such as AttentionState,
    ContinuationPressure, SuspenseState, OpenLoopPortfolio, OhShitMoment,
    FamiliarityDifferentiationEnvelope and CognitiveAfterlife. It does not
    replace Audience/Product Intelligence's ownership of AudienceModel or
    ViewerState simulation and does not own fictional truth or QC acceptance.
ownership:
  system: VIEWER_COGNITION_PSYCHOLOGY
  owner_questions:
    primary:
      - "Through which psychological mechanisms is the viewer's state changing?"
      - "What should happen inside the viewer next?"
    secondary:
      - "What currently has the viewer's attention?"
      - "What does the viewer understand?"
      - "What does the viewer infer without being told?"
      - "Who or what does the viewer care about?"
      - "What is pulling cognition forward?"
      - "What unresolved questions are active?"
      - "What does the viewer anticipate?"
      - "How much suspense exists and why?"
      - "Where is the viewer participating in discovery?"
      - "Where is familiarity providing cognitive access?"
      - "Where is novelty generating identity?"
      - "What would produce an OhShitMoment?"
      - "What will the viewer remember after playback?"
      - "What will continue occupying cognition after the screen goes dark?"
      - "What would make the viewer want another person to experience this?"
  owns:
    - ViewerPsychodynamicsProjection
    - ViewerExperienceProgram
    - ViewerEffectContract
    - AttentionState
    - CuriosityState
    - IdentificationState
    - AnticipationState
    - CognitiveParticipationState
    - SignificanceInferenceState
    - FluencyState
    - TrustState
    - SocialTransmissionState
    - ContinuationPressure
    - SuspenseState
    - OpenLoop
    - OpenLoopPortfolio
    - OhShitMoment
    - FamiliarityDifferentiationEnvelope
    - MemoryResiduePlan
    - CognitiveAfterlife
    - CompulsiveContinuation
    - psychodynamic viewer signals
    - viewer cognition operators
  explicitly_does_not_own:
    AudienceModel:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    ViewerArchetype:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    base_ViewerState:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    AudienceSimulator:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    ProductMarketModel:
      owner: 04_quantum_audience_product_intelligence_build_spec.yaml
    audience_disclosure_truth:
      owner: 01_quantum_animation_world_model_build_spec.yaml
    CreatorModel:
      owner: 03_quantum_creative_intelligence_build_spec.yaml
    story_and_shot_semantics:
      owner: 12_quantum_story_animatic_compiler_build_spec.yaml
    formal_artifact_acceptance:
      owner: 07_quantum_autonomous_qc_build_spec.yaml
    ProofOfFilm:
      owner: 18_quantum_marketability_proof_of_film_build_spec.yaml
    commercial_buyer_access:
      owner: future_spec_19_plus
  hard_boundary: >
    This specification may analyze, predict, recommend and compile desired
    psychodynamic effects. It may not silently mutate CreatorModel, AudienceModel,
    ProductMarketModel, World state, story canon, certified media or QC results.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Make viewer psychology an explicit design surface rather than an accidental
    by-product of story and images.
  creative_goal: >
    Enable Quantum to make films that do not merely display events but
    intentionally cause understanding, curiosity, attachment, suspense,
    realization, thought, emotion, memory and continuation desire.
  thought_provoking_goal: >
    Support sophisticated work that rewards active cognition, inference,
    interpretation, recontextualization, reflection and rewatching while
    distinguishing productive ambiguity from accidental confusion.
  marketability_goal: >
    Provide the psychological substrate that downstream ProofOfFilm and
    commercial experience systems can use to make unusual creative work
    cognitively accessible without homogenizing it.
  fundamental_statement: >
    The audiovisual artifact is stimulus. The intended creative effect occurs
    inside the viewer.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  VC-001:
    name: VIEWER_RESPONSE_IS_TEMPORAL
    statement: >
      Viewer response is not one score. Understanding, emotion, curiosity,
      suspicion, attachment and anticipation change continuously during playback.
  VC-002:
    name: VIEWER_RESPONSE_IS_PROBABILISTIC
    statement: >
      Viewer cognition is predicted, not known with certainty. Every modeled
      viewer effect exposes confidence and may differ across archetypes.
  VC-003:
    name: ATTENTION_PRECEDES_VALUE
    statement: >
      Before a viewer can value, understand, love or remember something, the
      experience must first win enough attention against competing stimuli.
  VC-004:
    name: MEANINGFUL_INCOMPLETENESS_PULLS_FORWARD
    statement: >
      Curiosity is strongest when information is incomplete but sufficiently
      meaningful that the viewer can represent the missing piece.
  VC-005:
    name: HUMAN_FAMILIARITY_ENABLES_RADICAL_ORIGINALITY
    statement: >
      Familiar human desires, fears, emotions, relationships, dilemmas and
      narrative grammars can provide cognitive access to radically unfamiliar
      worlds, concepts, aesthetics and metaphysics.
  VC-006:
    name: IDENTIFICATION_IS_NOT_SIMILARITY
    statement: >
      A viewer need not resemble a character to identify with recognizable
      desire, vulnerability, pressure, contradiction or emotional stakes.
  VC-007:
    name: ANTICIPATION_CREATES_FORWARD_PULL
    statement: >
      Expected future emotional, causal or cognitive reward may motivate
      continuation more strongly than reward already consumed.
  VC-008:
    name: VIEWER_PARTICIPATION_INCREASES_OWNERSHIP
    statement: >
      A realization the viewer partially infers may create more cognitive and
      emotional ownership than an equivalent fact stated explicitly.
  VC-009:
    name: FLUENCY_IS_NOT_SIMPLICITY
    statement: >
      Fluency means the viewer has sufficient structure to build a useful mental
      model. It does not require simple themes, simple worlds or explicit exposition.
  VC-010:
    name: SUSPENSE_IS_NOT_CONFUSION
    statement: >
      Suspense normally requires understood stakes plus incomplete causal
      knowledge, credible possible consequences and momentum or imminence.
  VC-011:
    name: SURPRISE_REQUIRES_PRIOR_MODEL
    statement: >
      A viewer can only experience meaningful surprise when the experience first
      establishes an expectation, hypothesis or assumed model that can change.
  VC-012:
    name: RECONTEXTUALIZATION_SHOULD_BE_FAIR
    statement: >
      A realization may radically alter meaning while remaining retrospectively
      consistent with previously available evidence.
  VC-013:
    name: MULTIPLE_OSMS_ARE_VALID
    statement: >
      A strong work may contain multiple OhShitMoments. Count is not a quality
      target; each moment must create meaningful new comprehension or consequence.
  VC-014:
    name: OPEN_LOOPS_REQUIRE_PORTFOLIO_CONTROL
    statement: >
      Too few open loops create weak forward pull. Too many create cognitive
      overload. Quantum should actively manage which loops open, intensify,
      partially pay off, close or remain unresolved.
  VC-015:
    name: PARTIAL_PAYOFF_EARNS_TRUST
    statement: >
      Some meaningful questions should receive satisfying partial or complete
      answers so the viewer learns that attention will be rewarded.
  VC-016:
    name: MEMORY_IS_SELECTIVE
    statement: >
      The system should deliberately decide what image, line, character,
      contradiction, emotion, question or idea should remain after details fade.
  VC-017:
    name: COGNITIVE_AFTERLIFE_COUNTS
    statement: >
      The intended experience can continue after playback through unresolved
      interpretation, memory, conversation, anticipation and rewatch impulse.
  VC-018:
    name: SOCIAL_TRANSMISSION_IS_A_VIEWER_EFFECT
    statement: >
      Strong work can cause a viewer to want another person to undergo the same
      experience, making internal retelling and sharing first-class outcomes.
  VC-019:
    name: TRUST_IS_TEMPORAL
    statement: >
      Viewers form an implicit model of whether the work is coherent, fair,
      rewarding and worth continued attention. Betraying that model reduces
      future willingness to invest cognition.
  VC-020:
    name: MANIPULATION_AWARENESS_DESTROYS_EFFECT
    statement: >
      When the viewer perceives arbitrary withholding, fake stakes or emotional
      coercion, continuation desire may become frustration rather than engagement.
  VC-021:
    name: QUALITY_EQUALS_INTENT_FIDELITY
    statement: >
      Viewer psychology serves project intent. It may not transform deliberate
      subtlety, limited animation, slowness, ambiguity or difficulty into generic
      high-stimulation content merely because a broad prior predicts higher engagement.
  VC-022:
    name: VIEWER_MODEL_IS_NOT_HUMAN_TRUTH
    statement: >
      Synthetic viewer projections remain predictions requiring calibration and
      must never be described as exact access to human consciousness.
# =====================================================================
# 3. RELATIONSHIP TO SPEC 04
# =====================================================================
audience_product_relationship:
  spec_04_owns:
    - who_the_audience_is
    - intended_experience
    - audience_segments
    - ViewerArchetypes
    - genre_and_media_literacy
    - information_tolerance
    - pacing_complexity
    - viewing_context
    - accessibility
    - base_ViewerState
    - AudienceSimulator
    - ProductMarketModel
  spec_17_owns:
    - applied_psychological_mechanisms
    - derived_psychodynamic_state
    - open_loop_mechanics
    - suspense_mechanics
    - continuation_pressure
    - OSM_semantics
    - familiarity_differentiation_mechanics
    - memory_residue
    - CognitiveAfterlife
    - ViewerEffectContracts
    - ViewerExperiencePrograms
  conceptual_split: |
    04:
      WHO is watching?
      WHAT should they experience?
      HOW are they likely to interpret playback?
    17:
      THROUGH WHAT PSYCHOLOGICAL MECHANISMS
      should that experience be created,
      sustained, transformed and remembered?
  invariant: >
    Spec 17 extends ViewerState analytically. It does not create a competing
    authoritative AudienceModel or base viewer simulator.
