end_to_end_tests:
  resort_inspiration:
    input: >
      Creator has a 1–2 hour conversation about artificial-intelligence beings
      living inside a physically impossible virtual reality with maximum
      cinematic space-scale ambition.
    sequence:
      - CreativeIntakeAgent explores idea
      - generate creative.yaml
      - resolve PREMIUM_ADULT_CINEMATIC
      - resolve CINEMATIC_SCIFI
      - resolve supporting EXPERIMENTAL_ART
      - compile CreatorModel
      - compile ConceptModel
      - compile ThemeModel
      - build CharacterSeeds
      - build RelationshipSeeds
      - build WorldSeed
      - build DramaticEngine
      - build StoryContract
      - compile QualitySemantics
      - emit quantum.studio.yaml
      - generate MVP1
      - creator feedback
      - classify feedback
      - generate minimum-scope CreativeDelta
      - MVP2
      - feedback
      - MVP3
      - AutonomousQC
      - create CreativeLock
    success:
      - creator never manually edits schema
      - unusual creative identity survives
      - photorealism is not automatically treated as quality
      - creator feedback maps to explicit semantic deltas
  retro_animation:
    input: >
      Premium intentional late-1990s cel-animation feel with limited animation,
      bold poses and analog texture.
    success:
      - QualitySemantics rewards limited animation fidelity
      - smooth CG interpolation receives negative quality alignment
      - profile defaults do not normalize project toward modern CGI
  persistent_creator_preference:
    input: >
      "From now on, unless I explicitly say otherwise, avoid dialogue that
      explains what the image already communicates."
    success:
      - persistent CreatorBaselineUpdate proposed
      - explicit authority recorded
      - future project inherits preference
      - project can still explicitly deviate
