# =====================================================================
# 75. IMPLEMENTATION WAVES
# =====================================================================
implementation_waves:
  PWW1:
    name: payment_domain_core
    targets:
      - PaymentPolicy
      - PaymentScheduleRuntime
      - PaymentIntent
      - PaymentAttempt
      - PaymentLedgerEntry
  PWW2:
    name: payment_adapters
    depends_on:
      - PWW1
    targets:
      - PaymentProviderAdapter
      - BankingSettlementAdapter
      - PaymentEventNormalizer
  PWW3:
    name: clearing_and_reconciliation
    depends_on:
      - PWW2
    targets:
      - PaymentObservation
      - PaymentClearingEvidence
      - PaymentReconciliation
      - PaymentAllocation
  PWW4:
    name: reservation_and_initial_payment
    depends_on:
