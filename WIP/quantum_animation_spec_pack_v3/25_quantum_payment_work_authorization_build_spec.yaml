architectural_identity:
  concise: >
    Establish authoritative cleared-money truth and convert a valid executed
    Quantum agreement into autonomous production authorization only when the
    contractually required funds have actually cleared.
  extended: >
    Quantum Payment and Work Authorization Runtime owns payment execution state,
    settlement evidence, reservation-payment state, milestone-payment state,
    payment reconciliation, commercial funding state, and the singular transition
    from DEPOSIT_CLEARED to COMMERCIAL.WORK_AUTHORIZED. It consumes the immutable
    AgreementExecutionRecord, PaymentScheduleExhibit and MachineContractIR from
    spec 24, initiates or observes payment through provider-neutral adapters,
    distinguishes initiated, authorized, pending, settled, cleared, reversed,
    refunded and disputed funds, computes credited reservation amounts, verifies
    the exact initial funding threshold, and emits an idempotent WorkAuthorization
    only when all objective preconditions pass. That event wakes the existing
    production architecture. ProductionModel then recompiles current manufacturing
    strategy using fresh SelfModel truth; ProductionEngine instantiates and executes
    the approved ProductionManifest / ExecutionDAG. No person needs to press Start.
  core_equation: >
    EXECUTED AGREEMENT
      + REQUIRED CLEARED FUNDS
      + VALID COMMERCIAL STATE
      + VALID PRODUCTION INPUTS
      =
    WORK AUTHORIZED
  creator_definition_of_commercial_done: >
    Deposit received and autonomous work triggered.
ownership:
  system: PAYMENT_WORK_AUTHORIZATION
  owner_question:
    primary: >
      Have the exact funds required by the executed agreement cleared sufficiently
      to authorize Quantum to begin or continue the contracted work?
  secondary_questions:
    - "Was an agreement validly executed?"
    - "What payment schedule governs this project?"
    - "Was a reservation payment previously made?"
    - "How much reservation credit applies?"
    - "How much remains due to reach the initial production threshold?"
    - "Was payment merely initiated or actually cleared?"
    - "Which settlement evidence proves cleared funds?"
    - "Was the payment later reversed?"
    - "What milestone is currently due?"
    - "Has the production milestone objectively occurred?"
    - "Can another payment be requested now?"
    - "Are funds allocated to the correct agreement?"
    - "Are currencies consistent?"
    - "Did the same provider event arrive twice?"
    - "Is the project already work-authorized?"
    - "Has ProductionEngine acknowledged autonomous activation?"
    - "What should happen if the payment provider is unavailable?"
    - "What happens if a cleared payment is disputed after production begins?"
    - "What record proves the transaction?"
    - "Can the Quantum Key expose payment/production state later?"
  owns:
    - PaymentPolicy
    - PaymentMethodPolicy
    - PaymentScheduleRuntime
    - CommercialFundingState
    - PaymentIntent
    - PaymentRequest
    - PaymentAttempt
    - PaymentObservation
    - PaymentClearingEvidence
    - PaymentAllocation
    - PaymentCredit
    - ReservationPayment
    - InitialProductionPayment
    - MilestonePayment
    - FinalPayment
    - PaymentLedgerEntry
    - PaymentReceipt
    - PaymentReconciliation
    - PaymentDisputeState
    - PaymentReversalState
    - RefundExecutionState
    - PaymentProviderAdapter
    - BankingSettlementAdapter
    - PaymentEventNormalizer
    - WorkAuthorizationGate
    - WorkAuthorization
    - WorkAuthorizationLock
    - AutonomousProductionTrigger
    - ProductionBootstrapRequest
    - CommercialActivationRecord
    - FundingHealth
    - PaymentAuditTrail
    - payment/work authorization events
  explicitly_does_not_own:
    commercial_price:
      owner: 23_quantum_commercial_offer_conversion_build_spec.yaml
    payment_percentage_semantics:
      owner: 23_quantum_commercial_offer_conversion_build_spec.yaml
    legal_payment_obligation:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    legal_refund_entitlement:
      owner: 24_quantum_executable_agreement_legal_runtime_build_spec.yaml
    reservation_business_terms:
      owner: 23_quantum_commercial_offer_conversion_build_spec.yaml
    production_strategy:
      owner: 06_quantum_production_model_build_spec.yaml
    production_execution:
      owner: 08_quantum_production_engine_build_spec.yaml
    production_quality_acceptance:
      owner: 07_quantum_autonomous_qc_build_spec.yaml
    final_creator_release:
      owner: 30_quantum_creator_release_delivery_build_spec.yaml
    accounting_ledger:
      owner: FUTURE_CORPORATE_FINANCE_SYSTEM
    tax_advice:
      owner: EXTERNAL_ACCOUNTING_TAX_AUTHORITY
    banking_law:
      owner: EXTERNAL_LEGAL_REGULATORY_SYSTEM
  hard_boundary: >
    Payment Runtime determines financial execution truth and work eligibility.
    It cannot alter the deal, production strategy, creative scope or quality bar.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Remove the last human "start the project" button.
  commercial_goal: >
    Once buyer signature and required cleared funds exist, Quantum starts
    autonomously and immediately under the executed contract.
  trust_goal: >
    Buyer and Quantum should always be able to determine exactly what was paid,
    what was credited, what remains due and what contractual milestone the
    payment relates to.
  accounting_goal: >
    Every material money movement leaves an immutable business record with
    provider evidence and agreement lineage.
  production_goal: >
    Production receives one clean event:
    COMMERCIAL.WORK_AUTHORIZED.
  anti_goal: >
    Never start expensive production merely because a card, transfer or payment
    interface says "submitted."
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  PW-001:
    name: CLEARED_MONEY_IS_TRUTH
    statement: >
      Work authorization relies on the configured settlement/clearing definition,
      not optimistic client-side payment confirmation.
  PW-002:
    name: INITIATED_IS_NOT_CLEARED
    statement: >
      A buyer beginning payment does not authorize production.
  PW-003:
    name: AUTHORIZED_IS_NOT_CLEARED
    statement: >
      A payment provider authorization is not automatically equivalent to final
      or contractually sufficient settlement.
  PW-004:
    name: PENDING_IS_NOT_CLEARED
    statement: >
      Pending bank or payment state cannot satisfy the production-start gate.
  PW-005:
    name: CLEARING_POLICY_IS_METHOD_SPECIFIC
    statement: >
      Different payment methods may have different evidence and settlement
      semantics, normalized into one Quantum clearing result.
  PW-006:
    name: PROVIDER_DOES_NOT_DEFINE_THE_DEAL
    statement: >
      Payment providers execute money movement. The agreement defines what is owed.
  PW-007:
    name: PAYMENT_SCHEDULE_IS_IMMUTABLE_INPUT
    statement: >
      Runtime consumes the signed PaymentScheduleExhibit and may not rewrite it.
  PW-008:
    name: RESERVATION_CREDIT_IS_DETERMINISTIC
    statement: >
      Valid reservation funds are credited exactly as the executed commercial
      policy requires.
  PW-009:
    name: DEFAULT_RESERVATION_CREDIT_REDUCES_INITIAL_DUE
    statement: >
      Under the default 10% reservation + 20% initial-production schedule, only
      the remaining 10% must clear after execution before work authorization.
  PW-010:
    name: NO_DOUBLE_CREDIT
    statement: >
      A reservation payment cannot be credited twice.
  PW-011:
    name: NO_DOUBLE_CHARGE
    statement: >
      Idempotency prevents duplicate payment requests from duplicate events.
  PW-012:
    name: EXACT_AGREEMENT_BINDING
    statement: >
      Every payment is allocated to a specific executed agreement and schedule.
  PW-013:
    name: WRONG_PROJECT_FUNDS_DO_NOT_AUTHORIZE
    statement: >
      Funds received for one project cannot satisfy another project's funding gate
      without a governed reallocation process.
  PW-014:
    name: WRONG_CURRENCY_DOES_NOT_SILENTLY_PASS
    statement: >
      Currency mismatch requires approved conversion/allocation semantics.
  PW-015:
    name: WORK_AUTHORIZATION_IS_A_CANONICAL_EVENT
    statement: >
      Production begins only after one immutable WorkAuthorization exists.
  PW-016:
    name: WORK_AUTHORIZATION_IS_IDEMPOTENT
    statement: >
      Duplicate settlement or webhook events cannot start the project twice.
  PW-017:
    name: NO_HUMAN_START_BUTTON
    statement: >
      Ordinary in-policy projects require no creator or operator confirmation
      after the work-authorization conditions are satisfied.
  PW-018:
    name: PAYMENT_GATE_IS_NOT_CREATIVE_APPROVAL
    statement: >
      Financial readiness does not authorize changes to creative scope.
  PW-019:
    name: PAYMENT_GATE_IS_NOT_PRODUCTION_STRATEGY
    statement: >
      WorkAuthorization says "you may begin"; ProductionModel decides how.
  PW-020:
    name: PRODUCTION_ENGINE_EXECUTES
    statement: >
      Payment Runtime never creates shots, jobs, renders or timelines.
  PW-021:
    name: CURRENT_CAPABILITY_MUST_BE_REEVALUATED
    statement: >
      Work authorization wakes ProductionModel against a fresh SelfModel snapshot
      rather than blindly executing stale pre-sale assumptions.
  PW-022:
    name: COMMERCIAL_COMMITMENT_IS_FIXED
    statement: >
      Capability changes after sale require production replanning, not silent
      reduction of contractual output.
  PW-023:
    name: AUTONOMOUS_TRIGGER_IS_OBSERVABLE
    statement: >
      Quantum records not only work authorization but actual acknowledgement that
      production bootstrap has started.
  PW-024:
    name: AUTHORIZATION_DOES_NOT_EQUAL_DELIVERY
    statement: >
      Commercial activation and final creator release are completely separate.
  PW-025:
    name: BUYER_CANNOT_BUY_LOWER_QUALITY_BY_PAYING
    statement: >
      Money authorizes contractual work; it does not lower Quantum's creator
      quality standard.
  PW-026:
    name: PAYMENT_RECORDS_ARE_DURABLE
    statement: >
      Material financial execution evidence must survive provider account changes.
  PW-027:
    name: PAYMENT_EVENTS_ARE_RECONCILED
    statement: >
      Webhooks or callbacks are evidence inputs and must be reconcilable against
      provider/bank transaction state.
  PW-028:
    name: WEBHOOK_IS_NOT_SOLE_TRUTH
    statement: >
      A single unverified callback cannot become authoritative cleared-funds truth.
  PW-029:
    name: REVERSALS_ARE_FIRST_CLASS
    statement: >
      Reversed, charged-back or returned payments create explicit state rather
      than silently disappearing.
  PW-030:
    name: HISTORY_IS_NEVER_REWRITTEN
    statement: >
      A reversal creates a new financial event; it does not erase the earlier receipt.
  PW-031:
    name: POST_START_REVERSAL_DOES_NOT_UNMAKE_WORK
    statement: >
      If funds reverse after production begins, Quantum preserves completed work
      and applies the executed contract's suspension/remedy policy prospectively.
  PW-032:
    name: REFUNDS_REQUIRE_AUTHORITY
    statement: >
      Refund execution requires an approved contractual, legal or authorized
      business basis.
  PW-033:
    name: NO_FREEFORM_REFUND_AGENT
    statement: >
      An AI conversation cannot spontaneously transfer money outside policy.
  PW-034:
    name: PROVIDER_FAILURE_FAILS_SAFE
    statement: >
      Uncertain financial truth never causes autonomous work authorization.
  PW-035:
    name: MULTIPLE_PAYMENT_METHODS_NORMALIZE
    statement: >
      Wire, bank transfer, card and future payment methods normalize to common
      Quantum payment state.
  PW-036:
    name: PAYMENT_METHOD_DOES_NOT_AFFECT_PROJECT_RIGHTS
    statement: >
      Paying by one supported rail instead of another does not alter rights.
  PW-037:
    name: DIGITAL_ASSETS_ARE_OPTIONAL
    statement: >
      Cryptocurrency or a future QAS digital asset is not required for ordinary
      Quantum transactions.
  PW-038:
    name: DIGITAL_ASSET_FEATURE_REQUIRES_SEPARATE_COMPLIANCE
    statement: >
      Any future QAS token/coin implementation requires separate legal,
      regulatory, tax, custody, valuation and settlement policy before activation.
  PW-039:
    name: NO_CRYPTO_FRICTION_FOR_BUYER
    statement: >
      Quantum does not force a buyer to learn or acquire a token merely to buy
      entertainment unless a later explicit business model justifies it.
  PW-040:
    name: FINANCIAL_AUTOMATION_FAILS_CLOSED
    statement: >
      If the system cannot prove that required funds have cleared, it does not
      emit WorkAuthorization.
  PW-041:
    name: PAYMENT_MILESTONES_REQUIRE_OBJECTIVE_EVIDENCE
    statement: >
      Production progress payment triggers must resolve to certified production
      state rather than arbitrary self-report.
  PW-042:
    name: PRODUCTION_CANNOT_SELF_BILL_BY_GUESS
    statement: >
      ProductionEngine may emit milestone evidence but cannot redefine what
      payment is due.
  PW-043:
    name: BUSINESS_RECORDS_ARE_AUTOMATIC
    statement: >
      Invoices, receipts and payment audit records are generated automatically
      when required by studio policy.
  PW-044:
    name: CUSTOMER_DOES_NOT_FILE_QUANTUMS_BOOKS
    statement: >
      Buyer interaction ends with payment; internal retention/reconciliation is
      Quantum's responsibility.
  PW-045:
    name: FIRST_CLEARING_EVENT_IS_THE_RUBICON
    statement: >
      `DEPOSIT_CLEARED` is the commercial boundary after which the studio is
      authorized to transform the sold project into production reality.
# =====================================================================
# 3. CANONICAL COMMERCIAL ACTIVATION FLOW
# =====================================================================
activation_flow:
  canonical: |
    LEGAL.AGREEMENT_EXECUTED
          ↓
    AGREEMENT_EXECUTED
          ↓
    compute initial amount required
          ↓
    apply valid reservation credit
          ↓
    INITIAL_PAYMENT_PENDING
          ↓
    payment initiated
          ↓
    payment submitted
          ↓
    settlement pending
          ↓
    PAYMENT.DEPOSIT_CLEARED
          ↓
    WorkAuthorizationGate
          ↓
    COMMERCIAL.WORK_AUTHORIZED
          ↓
    ProductionBootstrapRequest
          ↓
    fresh SelfModel snapshot
          ↓
    ProductionModel compile/revalidate
          ↓
    ProductionEngine
          ↓
    ProductionManifest / ExecutionDAG
          ↓
    PRODUCTION.AUTONOMOUSLY_STARTED
  creator_touch_between_deposit_and_start:
    required: false
# =====================================================================
# 4. PAYMENT POLICY
# =====================================================================
payment_policy:
  PaymentPolicy:
    extends:
      - 10.PolicyObject
    fields:
      policy_id:
      accepted_payment_method_classes:
      clearing_policy_by_method:
      settlement_evidence_requirements:
      currency_policy:
      payment_attempt_policy:
      payment_retry_policy:
      reservation_credit_policy:
      refund_authority_policy:
      dispute_policy:
      reversal_policy:
      receipt_policy:
      invoice_policy:
      reconciliation_policy:
      work_authorization_policy_ref:
      risk_policy:
      compliance_policy_refs:
      effective_at:
      version:
      provenance_ref:
      digest:
# =====================================================================
# 5. PAYMENT METHOD POLICY
# =====================================================================
payment_methods:
  PaymentMethodClass:
    enum:
      - BANK_WIRE
      - BANK_TRANSFER
      - ACH_LIKE
      - CARD
      - APPROVED_REAL_TIME_PAYMENT
      - APPROVED_ESCROW
      - FUTURE_DIGITAL_ASSET
      - OTHER_APPROVED
  PaymentMethodPolicy:
    fields:
      method_class:
      enabled:
      minimum_amount:
        nullable: true
      maximum_amount:
        nullable: true
      accepted_currencies:
      clearing_definition:
      expected_settlement_window:
      reversal_risk:
      dispute_risk:
      provider_capabilities:
      payer_identity_requirement:
      transaction_fee_policy:
      business_rules:
      compliance_refs:
  provider_brand:
    canonical_semantics: false
# =====================================================================
# 6. PAYMENT SCHEDULE RUNTIME
# =====================================================================
schedule_runtime:
  PaymentScheduleRuntime:
    extends:
      - 10.CanonicalObject
    object_class:
      value: EXECUTION_STATE
    fields:
      runtime_id:
      agreement_ref:
      PaymentScheduleExhibit_ref:
      total_consideration:
      currency:
      reservation_credit:
      milestone_states:
      amount_paid:
      amount_cleared:
      amount_reversed:
      amount_refunded:
      amount_disputed:
      currently_due:
      next_milestone_ref:
      initial_work_authorization_requirement:
      final_payment_state:
      updated_at:
      provenance_ref:
# =====================================================================
# 7. COMMERCIAL FUNDING STATE
# =====================================================================
funding_state:
  CommercialFundingState:
    enum:
      - NOT_APPLICABLE
      - AGREEMENT_NOT_EXECUTED
      - INITIAL_PAYMENT_PENDING
      - INITIAL_PAYMENT_PROCESSING
      - DEPOSIT_CLEARED
      - WORK_AUTHORIZED
      - PRODUCTION_ACTIVE
      - MILESTONE_PAYMENT_DUE
      - MILESTONE_PAYMENT_PROCESSING
      - CURRENT
      - PAYMENT_LATE
      - PAYMENT_DISPUTED
      - PAYMENT_REVERSED
      - WORK_SUSPENSION_ELIGIBLE
      - FINAL_PAYMENT_PENDING
      - PAID_IN_FULL
      - CLOSED
# =====================================================================
# 8. PAYMENT INTENT
# =====================================================================
payment_intent:
  PaymentIntent:
    fields:
      payment_intent_id:
      agreement_ref:
      schedule_runtime_ref:
      milestone_ref:
      payment_class:
        enum:
          - RESERVATION
          - INITIAL_PRODUCTION
          - PRODUCTION_MILESTONE
          - FINAL
          - CHANGE_ORDER
          - OTHER_CONTRACTUAL
      amount:
      currency:
      credit_applied:
      amount_remaining:
      permitted_method_classes:
      created_at:
      expires_at:
        nullable: true
      state:
      provider_intent_refs:
      provenance_ref:
# =====================================================================
# 9. PAYMENT REQUEST
# =====================================================================
payment_request:
  PaymentRequest:
    fields:
      request_id:
      PaymentIntent_ref:
      buyer_party_ref:
      amount:
      currency:
      method_options:
      payment_destination_ref:
      human_readable_purpose:
      generated_at:
      payment_interface_ref:
      idempotency_key:
      provenance_ref:
  buyer_visible:
    must_show:
      - exact_amount
      - currency
      - what_payment_is_for
      - applicable_credit
      - remaining_contract_balance
# =====================================================================
# 10. PAYMENT ATTEMPT
# =====================================================================
payment_attempt:
  PaymentAttempt:
    extends:
      - 10.ExecutionReceipt
    fields:
      attempt_id:
      PaymentIntent_ref:
      method_class:
      adapter_ref:
      provider_transaction_ref:
      initiated_at:
      submitted_at:
        nullable: true
      authorized_at:
        nullable: true
      settled_at:
        nullable: true
      cleared_at:
        nullable: true
      failed_at:
        nullable: true
      normalized_state:
      normalized_error:
        nullable: true
      amount:
      currency:
      provider_fee:
        nullable: true
      provenance_ref:
# =====================================================================
# 11. NORMALIZED PAYMENT STATE
# =====================================================================
payment_state:
  PaymentExecutionState:
    enum:
      - CREATED
      - INITIATED
      - SUBMITTED
      - AUTHORIZED
      - PROCESSING
      - PENDING_SETTLEMENT
      - SETTLED
      - CLEARED
      - FAILED
      - CANCELLED
      - REVERSED
      - RETURNED
      - DISPUTED
      - PARTIALLY_REFUNDED
      - REFUNDED
  work_authorization_eligible:
    only:
      - CLEARED
# =====================================================================
# 12. CLEARING EVIDENCE
# =====================================================================
clearing:
  PaymentClearingEvidence:
    extends:
      - 10.EvidenceObject
    fields:
      evidence_id:
      PaymentAttempt_ref:
      agreement_ref:
      provider_transaction_ref:
      method_class:
      amount:
      currency:
      provider_state:
      bank_or_settlement_state:
        nullable: true
      observed_at:
      clearing_policy_ref:
      policy_requirements_satisfied:
      reversal_risk_class:
      raw_evidence_ref:
      normalized_result:
        enum:
          - CLEARED
          - NOT_CLEARED
          - UNCERTAIN
      confidence:
      provenance_ref:
  work_authorization:
    requires_result: CLEARED
# =====================================================================
# 13. PAYMENT OBSERVATION
# =====================================================================
payment_observation:
  PaymentObservation:
    extends:
      - 10.EvidenceObject
    fields:
      observation_id:
      provider_ref:
      provider_event_id:
      transaction_ref:
      observed_state:
      amount:
      currency:
      event_time:
      received_time:
      verified_signature:
      raw_payload_ref:
        secure: true
      normalized_event:
      duplicate:
      provenance_ref:
  canonicality:
    raw_provider_event_is_evidence_not_semantic_truth: true
# =====================================================================
# 14. RECONCILIATION
# =====================================================================
reconciliation:
  PaymentReconciliation:
    fields:
      reconciliation_id:
      PaymentIntent_ref:
      PaymentAttempt_refs:
      PaymentObservation_refs:
      settlement_evidence_refs:
      expected_amount:
      observed_amount:
      allocated_amount:
      currency:
      discrepancies:
      duplicate_events:
      reconciliation_result:
        enum:
          - MATCH
          - PARTIAL
          - CONFLICT
          - UNCERTAIN
      reconciled_at:
      provenance_ref:
  hard_rule: >
    Work authorization requires reconciled sufficient cleared funds, not merely
    accumulated callback messages.
# =====================================================================
# 15. PAYMENT ALLOCATION
# =====================================================================
allocation:
  PaymentAllocation:
    fields:
      allocation_id:
      source_payment_ref:
      agreement_ref:
      milestone_ref:
      allocated_amount:
      currency:
      credit_type:
        enum:
          - CASH_PAYMENT
          - RESERVATION_CREDIT
          - APPROVED_ADJUSTMENT
      allocated_at:
      authority_ref:
      provenance_ref:
  invariant: >
    Sum of allocations from one monetary receipt cannot exceed the usable
    amount of that receipt.
# =====================================================================
# 16. PAYMENT CREDIT
# =====================================================================
credit:
  PaymentCredit:
    fields:
      credit_id:
      source_payment_ref:
      source_reason:
        enum:
          - RESERVATION
          - OVERPAYMENT
          - APPROVED_CONTRACT_CREDIT
      agreement_ref:
      available_amount:
      applied_amount:
      remaining_amount:
      currency:
      state:
      legal_basis_ref:
      provenance_ref:
  reservation_credit:
    may_apply_to:
      - initial_production_payment
# =====================================================================
# 17. RESERVATION PAYMENT
# =====================================================================
reservation_payment:
  ReservationPayment:
    fields:
      reservation_payment_id:
      reservation_ref:
      offer_ref:
      target_ref:
      amount:
      percentage_of_contract:
      currency:
      PaymentIntent_ref:
      PaymentClearingEvidence_ref:
        nullable: true
      cleared_at:
        nullable: true
      credited_to_executed_agreement_ref:
        nullable: true
      credit_ref:
        nullable: true
      state:
        enum:
          - REQUESTED
          - PROCESSING
          - CLEARED
          - FAILED
          - EXPIRED
          - CONVERTED_TO_CREDIT
          - RETAINED_PER_TERMS
          - REFUNDED_IF_REQUIRED
      provenance_ref:
  commercial_effect_owner:
    spec: 23
# =====================================================================
# 18. INITIAL PRODUCTION PAYMENT
# =====================================================================
initial_payment:
  InitialProductionPaymentRequirement:
    fields:
      agreement_ref:
      total_contract_value:
      required_initial_percentage:
      required_initial_amount:
      reservation_credit_amount:
      remaining_cash_required:
      currency:
      computed_at:
      PaymentScheduleExhibit_ref:
      reservation_credit_ref:
        nullable: true
  default_example:
    total_contract_value: X
    required_initial_percentage: 20
    reservation_credit_percentage: 10
    remaining_cash_percentage_after_reservation: 10
# =====================================================================
# 19. DEPOSIT CLEARED
# =====================================================================
deposit_cleared:
  DepositCleared:
    extends:
      - 10.CertificateArtifact
    fields:
      certificate_id:
      agreement_ref:
      PaymentScheduleRuntime_ref:
      required_initial_amount:
      reservation_credit_amount:
      newly_cleared_amount:
      total_usable_cleared_amount:
      currency:
      PaymentClearingEvidence_refs:
      reconciliation_ref:
      threshold_satisfied:
      certified_at:
      provenance_ref:
  event:
    name: PAYMENT.DEPOSIT_CLEARED
  threshold_satisfied:
    required: true
  semantic_effect:
    - CommercialFundingState_DEPOSIT_CLEARED
    - WorkAuthorizationGate_ELIGIBLE
# =====================================================================
# 20. WORK AUTHORIZATION GATE
# =====================================================================
work_gate:
  WorkAuthorizationGate:
    fields:
      gate_id:
      agreement_execution_record_ref:
      agreement_execution_certificate_ref:
      MachineContractIR_ref:
      CommercialOfferLock_ref:
      DepositCleared_ref:
      project_scope_ref:
      ProductionIntent_ref:
      creator_lock_refs:
      legal_state_valid:
      commercial_state_valid:
      payment_state_valid:
      project_state_valid:
      duplicate_authorization_absent:
      production_authorization_policy_pass:
      result:
        enum:
          - PASS
          - FAIL
          - HOLD
      failure_reasons:
      evaluated_at:
      provenance_ref:
  PASS_requires:
    - valid_executed_agreement
    - exact_agreement_digest
    - DepositCleared
    - no_superseding_legal_hold_blocking_work
    - no_expired_or_void_agreement_state
    - project_scope_resolvable
    - ProductionIntent_resolvable
    - no_existing_WorkAuthorization_for_same_authorization_epoch
# =====================================================================
# 21. WORK AUTHORIZATION
# =====================================================================
work_authorization:
  WorkAuthorization:
    extends:
      - 10.CanonicalObject
    object_class:
      value: CERTIFICATE
    fields:
      work_authorization_id:
      project_id:
      agreement_ref:
      agreement_digest:
      WorkAuthorizationGate_ref:
      DepositCleared_ref:
      ProductionIntent_ref:
      authorized_scope:
      commercial_budget_ref:
      payment_schedule_runtime_ref:
      creator_lock_refs:
      authorized_at:
      authorization_epoch:
      state:
        enum:
          - ACTIVE
          - SUSPENDED_PROSPECTIVELY
          - COMPLETED
          - SUPERSEDED_BY_CHANGE_ORDER
      provenance_ref:
      digest:
  event:
    name: COMMERCIAL.WORK_AUTHORIZED
  creator_confirmation_required:
    false
  buyer_confirmation_required_after_payment:
    false
# =====================================================================
# 22. WORK AUTHORIZATION LOCK
# =====================================================================
work_authorization_lock:
  WorkAuthorizationLock:
    extends:
      - 10.LockArtifact
    lock_type:
      value: work_authorization
    fields:
      WorkAuthorization_ref:
      agreement_digest:
      payment_evidence_digests:
      project_scope_digest:
      ProductionIntent_digest:
      authorized_at:
      invalidation_rules:
  historic_mutation:
    forbidden: true
# =====================================================================
# 23. PRODUCTION BOOTSTRAP REQUEST
# =====================================================================
production_bootstrap:
  ProductionBootstrapRequest:
    fields:
      bootstrap_id:
      WorkAuthorization_ref:
      project_id:
      agreement_ref:
      ProductScope_ref:
      ProductionIntent_ref:
      current_creator_lock_refs:
      delivery_commitment_ref:
      contractual_quality_requirements:
      contractual_language_scope:
      contractual_accessibility_scope:
      contractual_milestones:
      commercial_budget_boundary:
      priority_policy_ref:
      requested_at:
      provenance_ref:
  consumer:
    - ProductionModel
    - ProductionEngine_after_strategy_resolution
  principle: >
    Payment runtime supplies authorization context, not manufacturing instructions.
# =====================================================================
# 24. FRESH PRODUCTION REPLAN
# =====================================================================
fresh_replan:
  on_WorkAuthorization:
    ProductionModel_must:
      - resolve_current_SelfModelSnapshot
      - verify_current_capabilities
      - revalidate_precontract_strategy
      - recompute_cost_and_latency
      - preserve_contractual_scope
      - preserve_creator_locks
      - create_or_confirm_current_ProductionModel_revision
      - emit_approved_ProductionStrategy
      - produce_ExecutionDAG_template
  reason: >
    A project may be sold days after the ProofOfFilm was produced. Current
    capability truth must be refreshed before spending production resources.
# =====================================================================
# 25. AUTONOMOUS PRODUCTION TRIGGER
# =====================================================================
autonomous_trigger:
  AutonomousProductionTrigger:
    fields:
      trigger_id:
      WorkAuthorization_ref:
      ProductionModel_revision_ref:
      ProductionStrategy_refs:
      ProductionEngine_ref:
      requested_at:
      acknowledged_at:
        nullable: true
      ProductionManifest_ref:
        nullable: true
      ExecutionDAG_ref:
        nullable: true
      state:
        enum:
          - REQUESTED
          - ACCEPTED
          - MANIFEST_CREATED
          - DAG_CREATED
          - EXECUTION_STARTED
          - FAILED
      provenance_ref:
  automatic:
    true
  manual_start:
    required: false
# =====================================================================
# 26. PRODUCTION START ACKNOWLEDGEMENT
# =====================================================================
production_start:
  event:
    name: PRODUCTION.AUTONOMOUSLY_STARTED
  required_fields:
    - project_id
    - WorkAuthorization_ref
    - ProductionManifest_ref
    - ExecutionDAG_ref
    - ProductionModel_revision_ref
    - SelfModelSnapshot_ref
    - started_at
  definition_of_commercial_activation_complete: >
    COMMERCIAL.WORK_AUTHORIZED
      +
    PRODUCTION.AUTONOMOUSLY_STARTED
# =====================================================================
# 27. COMMERCIAL ACTIVATION RECORD
# =====================================================================
activation_record:
  CommercialActivationRecord:
    extends:
      - 10.CertificateArtifact
    fields:
      activation_record_id:
      agreement_ref:
      DepositCleared_ref:
      WorkAuthorization_ref:
      ProductionBootstrapRequest_ref:
      AutonomousProductionTrigger_ref:
      ProductionManifest_ref:
      ExecutionDAG_ref:
      activated_at:
      activation_latency_ms:
      provenance_ref:
      digest:
  semantic_meaning: >
    The deal has crossed from sales into manufacturing.
# =====================================================================
# 28. MILESTONE PAYMENT MODEL
# =====================================================================
milestones:
  PaymentMilestoneRuntime:
    fields:
      milestone_id:
      PaymentScheduleExhibit_milestone_ref:
      percentage:
      amount:
      trigger_definition:
      trigger_evidence_ref:
        nullable: true
      due:
      PaymentIntent_ref:
        nullable: true
      amount_cleared:
      state:
        enum:
          - NOT_ELIGIBLE
          - TRIGGERED
          - DUE
          - PROCESSING
          - CLEARED
          - LATE
          - DISPUTED
          - WAIVED_BY_VALID_AMENDMENT
      provenance_ref:
# =====================================================================
# 29. PRODUCTION PROGRESS MILESTONE
# =====================================================================
production_milestone:
  MilestoneTriggerEvidence:
    extends:
      - 10.EvidenceObject
    fields:
      evidence_id:
      agreement_ref:
      milestone_ref:
      source_domain:
      source_event_ref:
      objective_measure:
      expected_threshold:
      observed_value:
      certificate_refs:
      evaluated_at:
      result:
        enum:
          - SATISFIED
          - NOT_SATISFIED
          - UNCERTAIN
      provenance_ref:
  fifty_percent_example:
    source_domain:
      - ProductionEngine
      - AutonomousQC_as_required_by_contract
  payment_runtime_may_not:
    - invent_progress
    - self_certify_creative_completion
# =====================================================================
# 30. FINAL PAYMENT
# =====================================================================
final_payment:
  FinalPaymentState:
    fields:
      agreement_ref:
      final_milestone_ref:
      delivery_event_ref:
      contractual_acceptance_ref:
      creator_release_ref:
        nullable: true
      final_amount_due:
      amount_cleared:
      state:
      provenance_ref:
  note: >
    Exact trigger follows the executed PaymentScheduleExhibit. CreatorRelease
    remains an independent Quantum quality requirement and may be stricter than
    contractual acceptance.
# =====================================================================
# 31. PAID IN FULL
# =====================================================================
paid_in_full:
  PaidInFullCertificate:
    extends:
      - 10.CertificateArtifact
    fields:
      certificate_id:
      agreement_ref:
      total_consideration:
      total_cleared:
      total_refunded:
      total_reversed:
      net_satisfied_amount:
      currency:
      payment_refs:
      reconciliation_refs:
      issued_at:
      provenance_ref:
  event:
    name: PAYMENT.PAID_IN_FULL
# =====================================================================
# 32. PAYMENT PROVIDER ADAPTER
# =====================================================================
provider_adapter:
  capability_id: commercial.payment_execution
  PaymentProviderAdapter:
    interfaces:
      - create_payment_intent()
      - present_payment_interface()
      - retrieve_transaction()
      - verify_event_authenticity()
      - normalize_transaction_state()
      - cancel_when_supported()
      - refund_when_authorized()
      - retrieve_fee_data()
      - retrieve_settlement_evidence()
      - reconcile()
      - health()
  normalized_errors:
    - PAYMENT_DECLINED
    - PAYMENT_METHOD_UNAVAILABLE
    - AUTHENTICATION_FAILURE
    - AUTHORIZATION_FAILURE
    - PROVIDER_TIMEOUT
    - NETWORK_FAILURE
    - DUPLICATE_REQUEST
    - CURRENCY_UNSUPPORTED
    - AMOUNT_LIMIT
    - SETTLEMENT_PENDING
    - PAYMENT_RETURNED
    - DISPUTE_OPENED
    - REFUND_FAILED
    - PROVIDER_FAILURE
    - UNKNOWN
  provider_semantics_may_not_escape_adapter:
    true
# =====================================================================
# 33. BANK SETTLEMENT ADAPTER
# =====================================================================
banking_adapter:
  capability_id: commercial.bank_settlement_observation
  BankingSettlementAdapter:
    interfaces:
      - identify_incoming_payment()
      - retrieve_settlement_status()
      - verify_amount()
      - verify_currency()
      - retrieve_value_date()
      - retrieve_reference()
      - reconcile_to_agreement()
      - retrieve_reversal_or_return()
  purpose: >
    Allow high-value payments to be verified independently of a browser payment flow.
  semantic_output:
    - PaymentClearingEvidence
# =====================================================================
# 34. PAYMENT EVENT NORMALIZER
# =====================================================================
event_normalization:
  PaymentEventNormalizer:
    input:
      - provider_specific_event
    output:
      - PaymentObservation
    mandatory:
      - signature_or_source_authentication
      - provider_event_id
      - transaction_ref
      - normalized_state
      - amount
      - currency
      - timestamp
  raw_provider_payload:
    canonical_business_truth: false
# =====================================================================
# 35. PAYMENT LEDGER
# =====================================================================
payment_ledger:
  PaymentLedgerEntry:
    extends:
      - 10.CanonicalObject
    fields:
      ledger_entry_id:
      agreement_ref:
      transaction_ref:
      event_type:
        enum:
          - PAYMENT_CREATED
          - PAYMENT_INITIATED
          - PAYMENT_CLEARED
          - CREDIT_CREATED
          - CREDIT_APPLIED
          - PAYMENT_REVERSED
          - PAYMENT_RETURNED
          - PAYMENT_DISPUTED
          - REFUND_INITIATED
          - REFUND_CLEARED
          - ADJUSTMENT
      debit_credit_semantics:
      amount:
      currency:
      source_evidence_ref:
      occurred_at:
      recorded_at:
      provenance_ref:
  purpose: >
    Immutable transaction-history substrate for payment runtime.
  corporate_general_ledger:
    same_thing: false
# =====================================================================
# 36. PAYMENT RECEIPT
# =====================================================================
receipt:
  PaymentReceipt:
    extends:
      - 10.CertifiedArtifact
    fields:
      receipt_id:
      agreement_ref:
      payer_party_ref:
      payment_ref:
      amount:
      currency:
      payment_class:
      credited_to:
      cleared_at:
      provider_transaction_reference_redacted:
      remaining_balance:
      generated_at:
      document_ref:
      provenance_ref:
  automatic:
    true
# =====================================================================
# 37. INVOICE / PAYMENT REQUEST DOCUMENT
# =====================================================================
invoice:
  PaymentRequestDocument:
    fields:
      document_id:
      agreement_ref:
      milestone_ref:
      amount_due:
      currency:
      credits:
      due_trigger:
      payment_methods:
      remit_information_ref:
      generated_at:
      retention_policy_ref:
      provenance_ref:
  accounting_classification:
    owner: FUTURE_CORPORATE_FINANCE_SYSTEM
# =====================================================================
# 38. REVERSALS
# =====================================================================
reversal:
  PaymentReversalState:
    fields:
      reversal_id:
      original_payment_ref:
      agreement_ref:
      amount:
      currency:
      reversal_type:
        enum:
          - BANK_RETURN
          - CARD_REVERSAL
          - CHARGEBACK
          - PROVIDER_REVERSAL
          - OTHER
      observed_at:
      effective_at:
      evidence_ref:
      WorkAuthorization_ref:
        nullable: true
      production_state_at_reversal:
      machine_contract_action_refs:
      legal_policy_ref:
      state:
      provenance_ref:
  if_before_WorkAuthorization:
    effect:
      - remove_usable_funds
      - no_WorkAuthorization
  if_after_WorkAuthorization:
    effect:
      - do_not_erase_WorkAuthorization_history
      - evaluate_contractual_suspension_or_remedy
      - preserve_existing_production_artifacts
      - prevent_unbounded_future_spend_if_policy_authorizes
# =====================================================================
# 39. PAYMENT DISPUTE
# =====================================================================
dispute:
  PaymentDisputeState:
    fields:
      dispute_id:
      payment_ref:
      agreement_ref:
      dispute_class:
      opened_at:
      disputed_amount:
      current_status:
      provider_evidence_refs:
      legal_dispute_ref:
        nullable: true
      machine_contract_effect:
      permitted_protective_actions:
      resolved_at:
        nullable: true
      resolution:
        nullable: true
      provenance_ref:
  final_legal_adjudication:
    owner: spec_24_or_external_legal_process
# =====================================================================
# 40. REFUNDS
# =====================================================================
refunds:
  RefundAuthorization:
    fields:
      authorization_id:
      agreement_ref:
      payment_ref:
      amount:
      currency:
      basis:
        enum:
          - EXECUTED_AGREEMENT
          - EXECUTED_AMENDMENT
          - LEGAL_REQUIREMENT
          - AUTHORIZED_BUSINESS_POLICY
          - ERROR_CORRECTION
      authority_ref:
      machine_contract_rule_ref:
        nullable: true
      authorized_at:
  RefundExecutionState:
    fields:
      refund_id:
      RefundAuthorization_ref:
      PaymentAttempt_ref:
      initiated_at:
      cleared_at:
        nullable: true
      state:
      evidence_refs:
      provenance_ref:
  no_authorization:
    refund_allowed: false
# =====================================================================
# 41. OVERPAYMENT
# =====================================================================
overpayment:
  OverpaymentState:
    fields:
      agreement_ref:
      overpaid_amount:
      currency:
      source_payment_refs:
      policy:
        enum:
          - CREDIT
          - REFUND
          - MANUAL_ACCOUNTING_REVIEW_REQUIRED
      resulting_credit_ref:
        nullable: true
      resulting_refund_ref:
        nullable: true
  may_not:
    - silently_increase_project_scope
# =====================================================================
# 42. UNDERPAYMENT
# =====================================================================
underpayment:
  rule: >
    Partial cleared payment below the required work-authorization threshold
    remains credited but does not start production.
  FundingThresholdState:
    fields:
      amount_required:
      amount_usable:
      shortfall:
      percentage_satisfied:
      threshold_pass:
  threshold_pass:
    required_for_WorkAuthorization: true
# =====================================================================
# 43. CURRENCY
# =====================================================================
currency:
  CurrencyPolicy:
    fields:
      contract_currency:
      permitted_payment_currencies:
      conversion_allowed:
      conversion_rate_source_ref:
        nullable: true
      conversion_timestamp_policy:
      fee_allocation:
      FX_risk_owner:
      rounding_policy:
  default:
    exact_contract_currency_preferred: true
  hidden_conversion:
    forbidden: true
# =====================================================================
# 44. FEES
# =====================================================================
fees:
  provider_fee:
    does_not_reduce_contract_payment_credit_unless_policy_says_otherwise: true
  buyer_fee:
    hidden: false
  Quantum_fee:
    cannot_be_added_outside_executed_terms: true
  principle: >
    Provider economics are execution mechanics, not an opportunity to alter
    commercial consideration.
# =====================================================================
# 45. PRODUCTION RESOURCE RESERVATION
# =====================================================================
resource_reservation:
  on_WorkAuthorization:
    may_request:
      - production_compute_budget_reservation
      - provider_quota_reservation
      - storage_budget_reservation
      - critical_path_capacity_reservation
  owner:
    strategy: ProductionModel
    execution: ProductionEngine
  payment_runtime:
    only_supplies:
      - commercial_budget_boundary
      - authorization
# =====================================================================
# 46. BUDGET ENVELOPE
# =====================================================================
budget:
  CommercialProductionBudgetBoundary:
    fields:
      agreement_ref:
      contracted_consideration:
      internal_budget_policy_ref:
      maximum_autonomous_spend_without_new_authority:
      contingency:
      quality_floor:
      schedule_floor:
      derived_at:
      authority_ref:
  important: >
    Quantum's internal production spend is not necessarily identical to buyer
    payment timing.
  quality:
    cannot_be_reduced_below_creator_standard_due_to_local_cost_pressure: true
# =====================================================================
# 47. WORK SUSPENSION
# =====================================================================
suspension:
  ProspectiveWorkSuspension:
    fields:
      suspension_id:
      WorkAuthorization_ref:
      agreement_ref:
      reason:
        enum:
          - PAYMENT_DEFAULT
          - PAYMENT_REVERSAL
          - LEGAL_HOLD
          - CONTRACTUAL_SUSPENSION
          - MATERIAL_BUYER_DEPENDENCY_FAILURE
      legal_or_machine_rule_ref:
      suspended_future_operations:
      preserved_operations:
      effective_at:
      state:
      provenance_ref:
  cannot:
    - delete_completed_work
    - rewrite_World
    - erase_payment_history
    - retroactively_unmake_execution
# =====================================================================
# 48. RESUMPTION
# =====================================================================
resumption:
  WorkResumption:
    fields:
      resumption_id:
      suspension_ref:
      curing_event_ref:
      updated_funding_state:
      legal_state:
      production_replan_required:
      resumed_at:
      provenance_ref:
  production_resume:
    requires_fresh_ProductionModel_validation: true
# =====================================================================
# 49. MACHINE CONTRACT INTEGRATION
# =====================================================================
machine_contract:
  source:
    spec: 24.MachineContractIR
  objectively_executable_payment_rules:
    examples:
      - reservation_credit
      - initial_payment_threshold
      - milestone_due
      - final_payment_due
      - payment_default_window
      - suspension_eligibility
      - rights_transfer_after_payment_if_contract_says_so
  PaymentRuntime:
    may_execute:
      only_rules_marked_legal_policy_authorized: true
# =====================================================================
# 50. RIGHTS TRANSFER PAYMENT TRIGGER
# =====================================================================
rights_transfer:
  if_agreement_requires_full_payment:
    PaymentRuntime_emits:
      - PAYMENT.PAID_IN_FULL
  legal_runtime_interprets:
    - rights_transfer_condition
  PaymentRuntime_does_not:
    - independently_transfer_copyright
    - invent_rights_state
  owner:
    legal_effect: spec_24
# =====================================================================
# 51. QAS DIGITAL ASSET FUTURE BOUNDARY
# =====================================================================
future_QAS_asset:
  status:
    architecture: DEFERRED
    active_payment_method: false
  possible_future_capability:
    name: QAS_DIGITAL_ASSET_SETTLEMENT
  activation_requires:
    - explicit_business_case
    - separate_legal_analysis
    - securities_or_commodity_analysis_as_applicable
    - money_transmission_analysis_as_applicable
    - tax_analysis
    - accounting_policy
    - custody_policy
    - wallet_security
    - valuation_policy
    - AML_KYC_policy_as_applicable
    - volatility_policy
    - legal_template_updates
    - PaymentMethodPolicy_update
    - creator_authorization
  current_architectural_law: >
    Quantum's autonomy does not depend on issuing a token.
# =====================================================================
# 52. PAYMENT SECURITY
# =====================================================================
security:
  principles:
    - never_store_raw_card_data_unless_explicitly_required_and_compliant
    - tokenize_provider_credentials_where_supported
    - secrets_remain_in_secret_store
    - verify_provider_event_authenticity
    - payment_destination_changes_are_high_risk
    - least_privilege
    - dual_control_or_strong_automation_controls_for_destination_change
    - audit_all_refunds
    - audit_all_reallocations
    - secure_transport
    - exact_agreement_binding
  model_visibility:
    raw_payment_credentials: forbidden
    bank_credentials: forbidden
    secret_API_keys: forbidden
  payment_instructions:
    generated_from_authoritative_destination_registry: true
# =====================================================================
# 53. PAYMENT DESTINATION REGISTRY
# =====================================================================
destination_registry:
  PaymentDestination:
    fields:
      destination_id:
      legal_entity_ref:
      payment_method_class:
      currency:
      provider_or_bank_ref:
      secret_destination_details_ref:
      display_details_ref:
      active:
      effective_at:
      retired_at:
        nullable: true
      change_authority_ref:
      verification_ref:
  high_risk_change:
    requires:
      - out_of_band_verification_or_equivalent_strong_control
      - audit_event
  reason: >
    Payment-instruction compromise is a catastrophic commercial risk.
# =====================================================================
# 54. FRAUD / ANOMALY BOUNDARY
# =====================================================================
anomaly:
  PaymentAnomaly:
    fields:
      anomaly_id:
      transaction_ref:
      anomaly_type:
      evidence:
      severity:
      confidence:
      blocking:
      detected_at:
  examples:
    - unexpected_currency
    - amount_mismatch
    - destination_mismatch
    - duplicate_event
    - suspicious_refund_request
    - impossible_state_transition
    - provider_signature_failure
  advanced_fraud_detection:
    provider_or_future_system: true
# =====================================================================
# 55. AUDIT
# =====================================================================
audit:
  PaymentAuditTrail:
    fields:
      audit_id:
      agreement_ref:
      payment_events:
      work_authorization_events:
      reconciliation_events:
      refund_events:
      reversal_events:
      destination_change_events:
      created_at:
      digest:
  immutable_history:
    required: true
# =====================================================================
# 56. RETENTION
# =====================================================================
retention:
  records:
    include:
      - payment_requests
      - provider_receipts
      - clearing_evidence
      - reconciliation
      - credits
      - payment_receipts
      - reversals
      - disputes
      - refunds
      - WorkAuthorization
      - CommercialActivationRecord
  period:
    owner:
      - business_record_policy
      - accounting_policy
      - applicable_legal_requirements
  no_single_global_period:
    true
# =====================================================================
# 57. CLIENT EXPERIENCE
# =====================================================================
client_experience:
  payment_screen:
    target:
      - concise
      - high_trust
      - exact_amount
      - exact_purpose
      - low_friction
  after_payment_initiated:
    show:
      - PAYMENT_PROCESSING
  after_clear:
    show:
      - PAYMENT_RECEIVED
      - WORK_AUTHORIZED
      - PRODUCTION_STARTED_when_event_arrives
  avoid:
    - fake_instant_settlement
    - celebratory_sales_noise
    - upsell
    - "schedule onboarding call"
  canonical_after_activation: |
    PAYMENT RECEIVED
    WORK AUTHORIZED
    Quantum has begun production.
# =====================================================================
# 58. QUANTUM KEY AFTER PAYMENT
# =====================================================================
key_integration:
  source:
    spec: 20
  after_WorkAuthorization:
    Key_may_receive_scope:
      - EXECUTED_AGREEMENT_VIEW
      - PAYMENT_STATUS_VIEW
      - PRODUCTION_PORTAL_ENTRY
  exact_production_portal_owner:
    spec: 28
  payment_data_exposed:
    minimum:
      - amount_paid
      - milestone_status
      - remaining_balance
      - receipts
  sensitive_provider_data:
    never_exposed: true
# =====================================================================
# 59. PRODUCTION PORTAL HANDOFF
# =====================================================================
portal_handoff:
  on_PRODUCTION_AUTONOMOUSLY_STARTED:
    future_spec_28_receives:
      - project_id
      - WorkAuthorization_ref
      - ProductionManifest_ref
      - committed_delivery_date
      - high_level_production_state
      - payment_milestone_state
# =====================================================================
# 60. EVENTS
# =====================================================================
events:
  family: PAYMENT_AND_WORK_AUTHORIZATION
  event_types:
    PAYMENT.INTENT_CREATED:
      fields:
        - payment_intent_ref
    PAYMENT.INITIATED:
      fields:
        - payment_attempt_ref
    PAYMENT.AUTHORIZED:
      fields:
        - payment_attempt_ref
    PAYMENT.SETTLEMENT_PENDING:
      fields:
        - payment_attempt_ref
    PAYMENT.CLEARED:
      fields:
        - payment_ref
        - clearing_evidence_ref
    PAYMENT.DEPOSIT_CLEARED:
      fields:
        - DepositCleared_ref
        - agreement_ref
    PAYMENT.RESERVATION_CLEARED:
      fields:
        - ReservationPayment_ref
    PAYMENT.MILESTONE_CLEARED:
      fields:
        - milestone_ref
        - payment_ref
    PAYMENT.PAID_IN_FULL:
      fields:
        - PaidInFullCertificate_ref
    PAYMENT.REVERSED:
      fields:
        - reversal_ref
    PAYMENT.DISPUTED:
      fields:
        - dispute_ref
    PAYMENT.REFUNDED:
      fields:
        - refund_ref
    COMMERCIAL.WORK_AUTHORIZED:
      fields:
        - WorkAuthorization_ref
        - agreement_ref
        - project_id
    PRODUCTION.BOOTSTRAP_REQUESTED:
      fields:
        - ProductionBootstrapRequest_ref
    PRODUCTION.AUTONOMOUSLY_STARTED:
      source_owner:
        spec: 08
# =====================================================================
# 61. SIGNALS
# =====================================================================
signals:
  - PAYMENT.INITIAL_FUNDS_SHORT
  - PAYMENT.SETTLEMENT_DELAYED
  - PAYMENT.CLEARING_UNCERTAIN
  - PAYMENT.DUPLICATE_EVENT
  - PAYMENT.AMOUNT_MISMATCH
  - PAYMENT.CURRENCY_MISMATCH
  - PAYMENT.REVERSAL_RISK
  - PAYMENT.DISPUTE_OPENED
  - PAYMENT.REVERSAL_AFTER_WORK_START
  - PAYMENT.MILESTONE_DUE
  - PAYMENT.PAID_IN_FULL
  - WORK.AUTHORIZATION_ELIGIBLE
  - WORK.AUTHORIZED
  - PRODUCTION.START_ACK_PENDING
  - PRODUCTION.STARTED
# =====================================================================
# 62. FAILURE MODES
# =====================================================================
failure_modes:
  PAYMENT_PROVIDER_UNAVAILABLE:
    behavior:
      - do_not_fabricate_success
      - preserve_pending_state
      - use_approved_alternate_method_if_buyer_chooses
  PROVIDER_WEBHOOK_LOST:
    behavior:
      - scheduled_reconciliation
      - transaction_query
      - no_duplicate_charge
  DUPLICATE_WEBHOOK:
    behavior:
      - deduplicate_provider_event_id
      - preserve_single_logical_transition
  PAYMENT_AUTHORIZED_NOT_SETTLED:
    behavior:
      - remain_PENDING
      - no_WorkAuthorization
  PARTIAL_PAYMENT:
    behavior:
      - preserve_credit
      - show_remaining_due
      - no_WorkAuthorization_until_threshold
  OVERPAYMENT:
    behavior:
      - create_OverpaymentState
      - do_not_expand_scope
  WRONG_REFERENCE:
    behavior:
      - unresolved_allocation
      - no_WorkAuthorization_until_reconciled
  PAYMENT_REVERSED_BEFORE_START:
    behavior:
      - remove_threshold_satisfaction
      - block_start
  PAYMENT_REVERSED_AFTER_START:
    behavior:
      - preserve_history
      - consult_MachineContractIR
      - prospective_suspension_if_authorized
  WORK_AUTHORIZATION_EVENT_DUPLICATED:
    behavior:
      - idempotent_no_second_project_bootstrap
  PRODUCTION_BOOTSTRAP_FAILURE:
    behavior:
      - preserve_WorkAuthorization
      - retry_bootstrap
      - alert_system_critical
      - no_human_required_for_normal_transient_recovery
# =====================================================================
# 63. RECOVERY
# =====================================================================
recovery:
  runtime_restart:
    - rebuild PaymentScheduleRuntime
    - replay immutable PaymentLedgerEntries
    - re-reconcile unsettled transactions
    - verify active DepositCleared certificates
    - verify WorkAuthorization
    - verify ProductionBootstrap acknowledgement
    - re-emit missing idempotent trigger if required
  provider_migration:
    - preserve Quantum payment identity
    - preserve agreement binding
    - preserve payment history
    - adapter_swap_only
# =====================================================================
# 64. CONCURRENCY
# =====================================================================
concurrency:
  multiple_payment_attempts_for_same_intent:
    possible: true
    crediting:
      exact_once_per_cleared_value: true
  reservation_and_initial_payment_arrive_same_time:
    reconciliation_required: true
  deposit_clearing_and_work_gate:
    transactional_or_idempotent: true
  duplicate_WorkAuthorization:
    prohibited: true
  production_start_and_payment_reversal:
    exact_event_order_required: true
# =====================================================================
# 65. IDEMPOTENCY
# =====================================================================
idempotency:
  PaymentIntent:
    repeated_creation:
      by_same_milestone:
        policy_controlled: true
  provider_event:
    provider_event_id:
      deduplicate: true
  allocation:
    same_payment_same_milestone:
      no_double_credit: true
  DepositCleared:
    same_threshold_epoch:
      exactly_once_logically: true
  WorkAuthorization:
    agreement_authorization_epoch:
      exactly_once_logically: true
  ProductionBootstrapRequest:
    WorkAuthorization_ref:
      exactly_once_logically: true
# =====================================================================
# 66. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - AgreementExecutionRecord_to_PaymentScheduleRuntime
    - PaymentScheduleExhibit_to_PaymentIntent
    - ReservationPayment_to_PaymentCredit
    - PaymentAttempt_to_provider_transaction
    - PaymentObservation_to_provider_event
    - PaymentClearingEvidence_to_PaymentAttempt
    - PaymentAllocation_to_agreement_and_milestone
    - DepositCleared_to_all_clearing_evidence
    - WorkAuthorizationGate_to_DepositCleared
    - WorkAuthorization_to_agreement
    - WorkAuthorization_to_ProductionBootstrapRequest
    - ProductionBootstrapRequest_to_ProductionModel_revision
    - WorkAuthorization_to_ProductionManifest
    - reversal_to_original_payment
    - refund_to_authority
  emits_to:
    - 09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 67. OBSERVABILITY
# =====================================================================
observability:
  payments:
    - payment_intents
    - attempt_success_rate
    - settlement_latency
    - clearing_latency
    - failure_rate
    - reversal_rate
    - dispute_rate
    - refund_rate
  reservation:
    - reservation_cleared_rate
    - reservation_credit_conversion_rate
    - reservation_credit_amount
  work_activation:
    - agreement_to_deposit_clear_latency
    - deposit_clear_to_WorkAuthorization_latency
    - WorkAuthorization_to_production_bootstrap_latency
    - bootstrap_to_ProductionManifest_latency
    - activation_failure_rate
  milestones:
    - milestone_trigger_to_payment_latency
    - late_payment_rate
  integrity:
    - reconciliation_mismatch_rate
    - duplicate_provider_event_rate
    - double_credit_prevention_count
    - destination_change_attempts
# =====================================================================
# 68. LEARNING
# =====================================================================
learning:
  learnable:
    - payment_method_reliability
    - settlement_latency
    - payment_friction
    - reservation_to_deal_conversion
    - buyer_payment_behavior
    - provider_failure_patterns
  cannot_self_modify:
    - executed_payment_schedule
    - refund_rights
    - rights_transfer_condition
    - WorkAuthorization_threshold
    - legal_payment_obligation
  privacy:
    financial_behavior_learning:
      scope_limited_to_business_relationship: true
# =====================================================================
# 69. QC / VALIDATION
# =====================================================================
QC:
  deterministic_primary:
    true
  PaymentWorkAuthorizationQCContract:
    dimensions:
      AGREEMENT:
        question: >
          Does this runtime state derive from the exact executed agreement?
      AMOUNT:
        question: >
          Is the correct amount cleared?
      CURRENCY:
        question: >
          Is the applicable currency valid?
      RESERVATION:
        question: >
          Has reservation credit been applied once and correctly?
      CLEARING:
        question: >
          Is settlement evidence sufficient under the active method policy?
      RECONCILIATION:
        question: >
          Do provider and Quantum records reconcile?
      AUTHORIZATION:
        question: >
          Are all WorkAuthorization preconditions satisfied?
      IDEMPOTENCY:
        question: >
          Can duplicates create multiple credits or starts?
      SECURITY:
        question: >
          Is payment destination and provider evidence authentic?
      PRODUCTION_HANDOFF:
        question: >
          Did the exact authorized scope reach production?
# =====================================================================
# 70. HARD FAILURES
# =====================================================================
hard_failures:
  - code: PAYMENT.WORK_STARTED_WITHOUT_CLEARED_FUNDS
    severity: CRITICAL
  - code: PAYMENT.DOUBLE_CREDIT
    severity: CRITICAL
  - code: PAYMENT.DOUBLE_CHARGE
    severity: CRITICAL
  - code: PAYMENT.WRONG_AGREEMENT_ALLOCATION
    severity: CRITICAL
  - code: PAYMENT.WRONG_CURRENCY
    severity: CRITICAL
  - code: PAYMENT.UNVERIFIED_CLEARING
    severity: CRITICAL
  - code: PAYMENT.DESTINATION_INTEGRITY_FAILURE
    severity: CRITICAL
  - code: PAYMENT.UNAUTHORIZED_REFUND
    severity: CRITICAL
  - code: WORK.DUPLICATE_AUTHORIZATION
    severity: CRITICAL
  - code: WORK.SCOPE_MISMATCH
    severity: CRITICAL
  - code: WORK.PRODUCTION_BOOTSTRAP_NOT_ACKNOWLEDGED
    severity: MAJOR
# =====================================================================
# 71. SECURITY TESTS
# =====================================================================
security_tests:
  - forged_provider_webhook_rejected
  - duplicated_provider_webhook_deduplicated
  - wrong_destination_configuration_blocks_payment_request
  - model_cannot_read_raw_bank_secret
  - model_cannot_issue_arbitrary_refund
  - provider_cannot_change_contract_amount
  - underpayment_cannot_start_work
  - reversed_payment_cannot_still_count_as_usable_funds_before_start
  - replayed_WorkAuthorization_cannot_create_second_ProductionManifest
# =====================================================================
# 72. PROPERTY TESTS
# =====================================================================
property_tests:
  - agreement_execution_alone_never_starts_production
  - payment_initiation_never_starts_production
  - payment_authorization_never_starts_production
  - payment_pending_never_starts_production
  - only_cleared_threshold_can_satisfy_WorkAuthorizationGate
  - reservation_credit_never_applies_twice
  - payment_provider_never_changes_business_terms
  - WorkAuthorization_never_changes_CreatorModel
  - WorkAuthorization_never_changes_ProductionIntent
  - PaymentRuntime_never_creates_ProductionStrategy
  - PaymentRuntime_never_creates_render_jobs
  - duplicate_clearing_events_never_start_project_twice
  - payment_reversal_never_erases_historical_payment_event
  - work_suspension_never_deletes_existing_artifacts
  - refund_never_executes_without_authority
  - QAS_digital_asset_never_becomes_required_without_future_policy_activation
  - production_progress_milestone_never_self_originates_in_payment_runtime
  - payment_history_remains_reconstructable_after_provider_migration
# =====================================================================
# 73. SCENARIO TESTS
# =====================================================================
scenario_tests:
  direct_deal:
    sequence:
      - agreement_executed
      - 20_percent_payment_requested
      - payment_clears
      - DepositCleared
      - WorkAuthorization_PASS
      - COMMERCIAL.WORK_AUTHORIZED
      - ProductionModel_refresh
      - ProductionManifest_created
      - ExecutionDAG_created
      - production_started
    human_start_actions:
      expected: 0
  reserved_deal:
    sequence:
      - 10_percent_reservation_clears
      - agreement_executes
      - reservation_becomes_credit
      - remaining_10_percent_requested
      - remaining_10_percent_clears
    expected:
      total_initial_threshold: 20_percent
      WorkAuthorization: PASS
  card_authorized_but_pending:
    expected:
      WorkAuthorization: FAIL
  wire_arrives:
    sequence:
      - banking_adapter_observes
      - amount_matches
      - currency_matches
      - clearing_evidence
      - reconciliation
    expected:
      WorkAuthorization: PASS
  duplicate_webhooks:
    incoming_events: 5
    actual_payment: 1
    expected:
      credits: 1
      WorkAuthorization_count: 1
  reversal_before_start:
    expected:
      WorkAuthorization: BLOCKED
  reversal_after_start:
    expected:
      - production_history_preserved
      - contract_policy_evaluated
      - future_work_may_suspend
      - no_retroactive_project_erasure
  payment_provider_down:
    expected:
      - no_false_clear
      - production_does_not_start
      - alternate_method_may_be_offered
