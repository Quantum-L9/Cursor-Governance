        weight: 0.15
      autonomy_gain:
        weight: 0.10
      quality_gain:
        weight: 0.10
      implementation_cost_inverse:
        weight: 0.05
  deprioritize_if:
    - speculative_without_current_failure
    - duplicates_existing_owner
    - vendor_specific
    - broad_platform_generalization
    - back_office
    - does_not_help_next_gate
# =====================================================================
# 33. ROADMAP SIGNALS
# =====================================================================
roadmap_signals:
  promote_capability_when:
    FAILURE_FREQUENT:
      condition:
        repeated_same_failure_class: true
    REPAIR_EXPENSIVE:
      condition:
        repeated_high_repair_cost: true
    MANUAL_DEBUG_REQUIRED:
      condition:
        architecture_gap_exposed: true
    STATE_INSUFFICIENT:
      condition:
        repeated_unexplainable_continuity_issue: true
    REASONING_INSUFFICIENT:
      condition:
        shallow_policy_repeatedly_fails_high_impact_decisions: true
    QC_UNCERTAIN:
      condition:
        critic_confidence_persistently_low: true
    PROVIDER_LIMITATION:
      condition:
        repeated_capability_gap: true
    SCALE_BOTTLENECK:
      condition:
        measured_runtime_or_storage_limit: true
  do_not_promote_because:
    - intellectually_interesting
    - theoretically_general
    - fashionable
    - available_vendor_feature
# =====================================================================
# 34. RISKS
# =====================================================================
risks:
  - risk: architectural overbuilding
    control:
      - phase gates
      - scope firewall
      - observed-failure requirement
  - risk: mediocre creative output despite excellent systems
    control:
      - CreatorModel
      - narrative QC
      - AudienceModel
      - real release feedback later
  - risk: self-referential machine evaluation
    control:
      - independent critics
      - context firewalls
      - deterministic checks
      - future real audience calibration
  - risk: graph complexity grows without useful queries
    control:
      - query-driven schema evolution
  - risk: persistent canon becomes enormous context burden
    control:
      - projections
      - scopes
      - salience
      - semantic retrieval
      - exact subgraph queries
  - risk: learned policies drift creative identity
    control:
      - CreatorModel authority
      - policy shadow/canary
      - rollback
  - risk: provider churn destabilizes production
    control:
      - implementation adapters
      - SelfModel
      - fallback strategies
  - risk: larger runtime causes global repair
    control:
      - provenance
      - dependency materiality
      - immutable artifacts
      - shot/layer isolation
  - risk: one giant WorldModel becomes universal database
    control:
      - strict authority boundaries
      - projections
      - separate production/execution state
  - risk: multi-medium expansion fractures canon
    control:
      - common World authority
      - medium-specific expression only
# =====================================================================
# 35. PERMANENT NON-GOALS
# =====================================================================
permanent_non_goals:
  - human production routing as standard operating model
  - provider-specific core architecture
  - one-agent-per-function swarm
  - using semantic memory as canonical truth
  - optimizing all projects toward photorealism
  - allowing audience optimization to erase creator identity
  - manually maintained continuity bible as authoritative source
  - destructive artifact mutation
  - accepting provider success as QC success
  - requiring global regeneration for local errors
# =====================================================================
# 36. OUT-OF-SCOPE COMPANY FUNCTIONS
# =====================================================================
company_scope_boundary:
  QuantumAnimationStudio_focus:
    - creative intelligence
    - narrative intelligence
    - autonomous production
    - quality
    - reusable IP
    - media output
  excluded_from_this_roadmap:
    - payroll
    - HR
    - accounting
    - CRM
    - legal back office
    - general corporate operations
    - sales automation
    - marketing operations
  product_market_intelligence:
    included_only_as:
      - input_to_product_design
      - audience/product quality evaluation
# =====================================================================
# 37. PHASE PROMOTION POLICY
# =====================================================================
phase_promotion:
  required:
    prior_acceptance_gate:
      pass: true
    evidence_bundle:
      complete: true
    unresolved_critical_ownership_conflicts:
      count: 0
    mandatory_human_interventions:
      acceptable:
        - creator_input
        - creator_review
      production_execution:
        target: 0
    provenance:
      complete_for_phase: true
    repair:
      local_repair_still_working: true
  architecture_revision:
    permitted:
      - simplify
      - deepen existing responsibility
      - split only when evidence demands
    prohibited:
      - speculative_top_level_expansion_without_evidence
# =====================================================================
# 38. ROADMAP ARTIFACTS
# =====================================================================
roadmap_artifacts:
  after_each_phase:
    required:
      - PhaseEvidenceReport
      - FailureTaxonomy
      - CapabilityEvidenceSnapshot
      - ProductionExperienceSnapshot
      - QCExperienceSnapshot
      - CognitiveExperienceSnapshot
      - CostLatencyReport
      - ProvenanceIntegrityReport
      - ArchitectureDeltaProposal
      - NextRuntimeProfile
  architecture_delta:
    must_classify_each_change:
      enum:
        - KEEP
        - SIMPLIFY
        - REMOVE
        - DEEPEN
        - SPLIT
        - ADD
# =====================================================================
# 39. LONG-TERM STRATEGIC ASSETS
# =====================================================================
strategic_assets:
  asset_01:
    name: Persistent Canon
