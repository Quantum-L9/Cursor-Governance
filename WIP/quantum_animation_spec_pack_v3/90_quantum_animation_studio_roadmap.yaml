# =====================================================================
# 44. FINAL ROADMAP LAWS
# =====================================================================
final_roadmap_laws:
  law_01: >
    Build the smallest complete studio first.
  law_02: >
    The first proof is a 60-second certified short, not a platform demo.
  law_03: >
    Scale 60 seconds → 3 minutes → 6 minutes → 12 minutes → 12–24 minutes.
  law_04: >
    Each phase must earn the next through evidence.
  law_05: >
    Persistent characters and worlds must become more valuable over time.
  law_06: >
    More canon should create more NarrativeOpportunity, not merely more burden.
  law_07: >
    More productions should create better production intelligence.
  law_08: >
    More failures should make future failures less likely.
  law_09: >
    Quantum should think harder only when consequences justify thinking harder.
  law_10: >
    Learned reasoning depth must eventually be evidence-driven.
  law_11: >
    A large fictional universe is a computational graph/state system, not a
    human-maintained franchise bible.
  law_12: >
    Persistent fictional beings are reusable IP primitives.
  law_13: >
    The World remains canonical regardless of medium.
  law_14: >
    Film, books, comics, games, and other future media are expression layers over
    shared canon.
  law_15: >
    Animation remains the only active medium until the animation runtime proves
    persistent-world leverage.
  law_16: >
    Experience corpora must remain typed and provenance-linked.
  law_17: >
    External models are replaceable; institutional intelligence compounds.
  law_18: >
    Production economics should optimize cost per certified artifact, not raw
    inference cost.
  law_19: >
    Correct accepted work must survive unrelated failures at every scale.
  law_20: >
    Do not solve scale before scale is measured.
  law_21: >
    Do not create a new agent when a cognitive module, compiler pass, policy, or
    deterministic service is sufficient.
  law_22: >
    Do not create a new authority for a responsibility that already has an owner.
  law_23: >
    Canon becomes computation.
  law_24: >
    The long-term objective is not an AI animation pipeline.
  law_25: >
    The long-term objective is a persistent narrative intelligence capable of
    maintaining living fictional universes, discovering dramatically charged
    possibilities inside them, reasoning about what should happen, and
    autonomously expressing selected reality through media.

I used 20_ rather than 90_ as requested. The roadmap now deliberately separates what must be built for the first film from everything we’ve identified as valuable but not justified yet.

Its main progression is:

architecture convergence
      ↓
60 sec — prove complete autonomy
      ↓
3 min — prove continuity
      ↓
6 min — prove polycognitive leverage
      ↓
12 min — prove hundreds-of-shot manufacturing
      ↓
12–24 min — prove real episode production
      ↓
multi-episode series — prove persistent IP leverage
      ↓
hundreds of entities — prove computational universe leverage
      ↓
learned institutional intelligence
      ↓
season
      ↓
feature film
      ↓
multi-medium narrative runtime

And I think the two compounding flywheels in 20 are now the clearest statement of where this gets strategically interesting:

CANON FLYWHEEL
more episodes
→ more canonical history
→ richer persistent beings
→ denser relationships / promises / conflicts
→ more NarrativeOpportunities
→ stronger future stories

and:

EXPERIENCE FLYWHEEL
more productions
→ more execution evidence
→ better SelfModel
→ better production strategies
→ better QC
→ better cognitive policies
→ fewer mistakes / better output
→ more productions

Those two flywheels together are the architecture’s compounding engine.