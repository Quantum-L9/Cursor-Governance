# =====================================================================
# 19. DISTRIBUTION OF TRUTH
# =====================================================================
truth_and_authority_roadmap:
  permanent_authorities:
    CreatorModel:
      question: "What are we trying to make?"
    WorldModel:
      question: "What is true?"
    AudienceModel:
      question: "What should happen to the viewer?"
    SelfModel:
      question: "What can Quantum do now?"
    ProductionModel:
      question: "How should Quantum manufacture this now?"
    AutonomousQC:
      question: "Is it good enough?"
    ProductionEngine:
      question: "What is actually executing?"
  runtime_decision_owner:
    PolycognitiveRuntime:
      question: "What deserves thought, and how deeply?"
  projection:
    ProjectProvenanceGraph:
      question: "How is everything connected?"
  hard_rule: >
    Future roadmap work may deepen authorities but should not duplicate them.
# =====================================================================
# 20. SIMPLIFICATION ROADMAP
# =====================================================================
simplification:
  actively_monitor:
    duplicate_classes:
      action:
        merge_or_alias_if_semantics_same
    excessive_agents:
      action:
        absorb_into_cognitive_modules
    duplicated_memory:
      action:
        canonicalize_owner_and_projection
    repeated_metadata:
      action:
        move_to_CanonicalObject
    domain_overlap:
      action:
        resolve_in_00_constitution
  anti_patterns:
    - one_agent_per_task
    - one_microservice_per_class
    - one_database_per_spec
    - LLM_for_exact_validation
    - graph_for_everything
    - semantic_memory_as_truth
    - provider_specific_core_schema
  principle: >
    Increase capability without proportional increase in top-level concepts.
# =====================================================================
# 21. RESEARCH / EXPERIMENT BACKLOG
# =====================================================================
research_backlog:
  high_priority:
    R01:
      question: >
        How accurately can multimodal QC detect expected-vs-observed physical
        continuity mismatches?
    R02:
      question: >
        Which World state dimensions produce the most downstream continuity value?
    R03:
      question: >
        Does NarrativeOpportunity-driven story discovery outperform direct story
        generation in coherence and originality?
    R04:
      question: >
        Which character identity anchors most strongly predict cross-shot consistency?
    R05:
      question: >
        How much does animatic QC reduce expensive final-render repair?
    R06:
      question: >
        Does adaptive reasoning materially outperform fixed reasoning depth?
    R07:
      question: >
        Which composite production strategies outperform single-pass generation
        for difficult shot structures?
    R08:
      question: >
        What is the actual cost per certified minute?
    R09:
      question: >
        How reliably can synthetic ColdViewer models predict real viewer confusion?
    R10:
      question: >
        What percentage of later episodes can reuse certified persistent assets?
  medium_priority:
    - hypergraph_vs_reified_property_graph
    - Graphiti_projection_value
    - long_term_memory_decay
    - psychological_state_complexity
    - world_process_scheduler
    - cross-medium canon representation
  experiment_rule: >
    Research results may modify policies and implementation choices but require
    explicit evidence before changing architectural authority.
