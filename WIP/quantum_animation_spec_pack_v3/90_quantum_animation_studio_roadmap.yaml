      questions:
        - "What would likely happen if event X did not occur?"
        - "Which outcome depends causally on this decision?"
        - "Which hidden cause is necessary for the current reality?"
    alternative_world_branches:
      use:
        - story search
        - ending evaluation
        - counterfactual causality
    reality_reconstruction:
      target: >
        Reconstruct exact or bounded fictional state at arbitrary WorldCoordinate.
    parallel_timelines:
      status: LONG_TERM
# =====================================================================
# 6. NARRATIVE OPPORTUNITY ROADMAP
# =====================================================================
NarrativeOpportunity_roadmap:
  identity: >
    Reified derived convergence object where narratively significant World
    structures intersect.
  MVP:
    include:
      - desire
      - blocker
      - relationship_or_internal_cost
      - affordance
      - knowledge asymmetry
      - false belief
      - meaningful prop
  future_features:
    convergence_dimensions:
      - promises
      - secrets
      - debts
      - rivalries
      - locations
      - institutions
      - factions
      - reputation
      - historical events
      - audience knowledge
      - object histories
    ranking:
      dimensions:
        - dramatic_potential
        - emotional_stakes
        - causal_density
        - novelty
        - thematic_alignment
        - relationship_change
        - audience_surprise
        - runtime_fit
        - opportunity_expiration
        - unresolved_thread_reuse
    clustering:
      purpose: >
        Avoid presenting hundreds of near-duplicate opportunities in large worlds.
    novelty_control:
      - penalize_repeated_structure
      - penalize_overused_entities
      - reward_dormant_canon_reactivation
    long_range:
      example: >
        Which unresolved promise from three episodes ago can naturally collide
        with the current character goal?
  desired_outcome: >
    Increasing canon increases the density and quality of discoverable stories.
# =====================================================================
# 7. POLYCOGNITIVE RUNTIME EVOLUTION
# =====================================================================
polycognitive_roadmap:
  MVP:
    - signals
    - modules
    - executive
    - workspace
    - budgets
    - proposals
    - arbitration
    - traces
  intermediate:
    cognitive_cascades:
      example: |
        GOAL_BLOCKED
            ↓
        narrative.operator.blocker_analysis
            ↓
        RELATIONSHIP_COST_FOUND
            ↓
        character.operator.relationship_pressure
            ↓
        KNOWLEDGE_ASYMMETRY_FOUND
            ↓
        epistemic.operator.reveal_analysis
            ↓
        high dramatic convergence
            ↓
        narrative branch simulation
    attention_competition:
      purpose:
        - choose which simultaneous WorldSignals deserve cognition
    reasoning_budget_allocator:
      input:
        - salience
        - uncertainty
        - irreversibility
        - downstream impact
        - cost
      output:
        - reasoning tier
        - operator count
        - branch count
  learned:
    OperatorSelectionPolicy:
      learns: >
        Which reasoning operators tend to be useful under which WorldSignal
        patterns and decision contexts?
    reasoning_depth_policy:
      learns: >
        When does additional reasoning produce enough improvement to justify
        additional inference?
    cascade_policy:
      learns:
        - productive operator sequences
        - dead-end sequences
        - redundant reasoning
  long_term_identity: >
    A genuine polycognitive system rather than an orchestrated collection of prompts.
# =====================================================================
# 8. SELF MODEL EVOLUTION
# =====================================================================
self_model_roadmap:
  MVP:
    - manually registered capabilities
    - live availability
    - cost
    - latency
    - quality
    - limits
    - failure evidence
  next:
    - scheduled capability probes
    - task-conditioned benchmarks
    - automatic version regression detection
    - confidence decay
    - capability change signals
  advanced:
    - automatic implementation discovery
    - synthetic benchmark generation
    - targeted testing where uncertainty is highest
    - conditional capability graphs
  examples:
    - >
      Renderer X is strong at environmental motion but weak on hand-object
      interaction with two visible characters.
    - >
      Voice model Y is high quality for calm dialogue but inconsistent at
      emotional shouting.
  hard_rule: >
    SelfModel remains descriptive, not strategic.
# =====================================================================
# 9. PRODUCTION MODEL EVOLUTION
# =====================================================================
production_model_roadmap:
  MVP:
    - deterministic and agentic strategy generation
    - SelfModel binding
    - fallback
    - repair
    - multi-take
  next:
    - explicit expected_cost_per_certified_artifact
    - strategy success probability
    - learned shot complexity features
    - strategy portfolio optimization
  advanced:
    strategy_experience_features:
      - character_count
      - hand_object_interaction
      - camera_motion
      - identity_sensitivity
      - lighting_complexity
      - dialogue_visibility
      - environment_motion
      - duration
      - compositing_complexity
    learned_policy:
      question: >
        Given ProductionIntent, current SelfModel and historical strategy
        evidence, which manufacturing plan has the highest expected utility?
  optimization:
    not:
      - cheapest_provider_request
    instead:
      - cost_per_certified_output
      - expected_repair_cost
      - quality_adjusted_latency
      - identity_reliability
# =====================================================================
# 10. AUTONOMOUS QC EVOLUTION
# =====================================================================
QC_roadmap:
  MVP:
    - deterministic World checks
    - multimodal specialists
    - ColdViewer
    - InformedCritic
    - RewatchCritic
    - certificates
    - repair recommendation
  next:
    - critic disagreement modeling
    - confidence calibration
    - false-positive tracking
    - false-negative discovery
    - specialized recurring-character critic
    - temporal continuity critic
  advanced:
    - learned critic weighting
    - failure signature retrieval
    - adaptive inspection depth
    - uncertainty-triggered additional evidence
    - adversarial QC fixtures
  nonnegotiable:
    QC_independent_of_generation: true
# =====================================================================
# 11. PRODUCTION ENGINE EVOLUTION
# =====================================================================
production_engine_roadmap:
  MVP:
    - local_or_small_worker_runtime
    - durable jobs
    - artifacts
    - retries
    - QC gates
    - repair
    - timeline
    - master
  scale_3_to_6_min:
    - stronger concurrency
    - more sophisticated provider quotas
    - better critical-path scheduling
  scale_12_to_24_min:
    - hierarchical DAGs
    - sequence-level checkpoints
    - thousands_of_jobs
    - richer backpressure
    - resilient async provider reconciliation
  season:
    - cross-episode shared resource planning
    - shared asset build queues
    - episode prioritization
  future:
    - multi-region workers if justified
    - specialized GPU pools if justified
    - production workload prediction
  rule: >
    Distributed infrastructure follows real load measurements.
# =====================================================================
# 12. ASSET IDENTITY EVOLUTION
# =====================================================================
asset_identity_roadmap:
  MVP:
    - 1_to_2 characters
    - canonical visual pack
    - canonical voice pack
    - state variants
    - one environment
    - one prop
  series:
    - richer expression library
    - costume history
    - injury/state history
    - recurring environments
    - motion identity
    - music motifs
    - acoustic signatures
  universe_scale:
    - hundreds_of_character asset families
    - hierarchy/species templates
    - bulk variant generation
    - asset inheritance
    - population-scale querying
  institutional_learning:
    - which reference assets improve which renderers
    - which identity anchors predict consistency
    - which accepted shots should enrich the library
  goal: >
    Every persistent entity becomes increasingly cheap and reliable to render.
# =====================================================================
# 13. PROVENANCE / DEPENDENCY EVOLUTION
# =====================================================================
provenance_roadmap:
  MVP:
    - creative_to_master
    - surgical invalidation
    - repair lineage
  next:
    - cross-episode lineage
    - reusable asset lineage
    - richer explanation paths
    - dependency materiality learning
  advanced:
    - project-wide causal production analytics
    - cross-project reusable evidence
    - provenance-backed institutional learning queries
  high_value_queries:
    - "Which accepted artifacts depend materially on this character design?"
    - "Which strategies failed most often for this shot structure?"
    - "Which repairs worked after this exact failure pattern?"
    - "Which canonical change would invalidate the fewest downstream artifacts?"
  long_term:
    role: >
      Studio-wide semantic nervous system for lineage and impact, while remaining
      a projection rather than domain authority.
# =====================================================================
# 14. EXPERIENCE CORPUS
# =====================================================================
experience_corpus:
  strategic_identity: >
    Persistent evidence of what Quantum tried, under what conditions, what
    happened, what failed, what repaired it, and what ultimately passed.
  logical_partitions:
    cognition:
      owner: 02
    capabilities:
      owner: 05
    production:
      owner: 06
    QC:
      owner: 07
    audience:
      owner: 04
  common_features:
    - source evidence
    - conditions
    - decision or strategy
    - result
    - QC outcome
    - cost
    - latency
    - confidence
  future_queries:
    - "Which cinematic plans are systematically difficult?"
    - "Which renderers fail on which structures?"
    - "Which repair strategies are reliable?"
    - "Which cognitive operators contribute to successful endings?"
    - "Which asset representations reduce identity drift?"
    - "Which production plans minimize cost per certified minute?"
  hard_rule: >
    The corpus is structured evidence, not an untyped memory dump.
# =====================================================================
# 15. AUDIENCE / PRODUCT INTELLIGENCE ROADMAP
# =====================================================================
audience_product_roadmap:
  MVP:
    - one-line audience target normalization
    - desired audience experience
    - genre literacy
    - pacing/complexity model
    - synthetic ColdViewer evaluation
  next:
    - segment-specific viewer models
    - expectation tracking
    - confusion prediction
    - emotional-trajectory prediction
  future_with_real_release_data:
    - real viewer comprehension observations
    - completion/retention evidence where available
    - surprise calibration
    - emotional response studies
    - synthetic-vs-real audience model calibration
  product_focus:
    includes:
      - distinctiveness
      - memorability
      - release-quality impression
      - franchise potential
      - product promise
    excludes:
      - CRM
      - advertising automation
      - back-office GTM
# =====================================================================
# 16. CREATOR MODEL ROADMAP
# =====================================================================
creator_model_roadmap:
  baseline:
    persistent: true
  project_specialization:
    required: true
  future:
    - learn stable creator preferences only from explicit creator feedback
    - distinguish persistent creator preferences from project-specific choices
    - preserve contradictory project experimentation
  hard_rule:
    >
    Historical creator preferences may suggest; current explicit project intent wins.
  intended_workflow: |
    creator inspiration
        ↓
    1–2 hour creative conversation
        ↓
    creative.yaml
        ↓
    autonomous MVP
        ↓
    creator feedback
        ↓
    revised creative source / locks
        ↓
    MVP2
        ↓
    feedback
        ↓
    MVP3
        ↓
    lock
        ↓
    full production
