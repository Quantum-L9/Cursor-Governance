# =====================================================================
# 24. EXPERIENCE FLYWHEEL
# =====================================================================
experience_flywheel:
  flow: |
    PROJECT
      ↓
    COGNITIVE DECISIONS
      ↓
    PRODUCTION STRATEGIES
      ↓
    EXECUTION
      ↓
    QC
      ↓
    FAILURE / SUCCESS
      ↓
    REPAIR
      ↓
    CERTIFIED RESULT
      ↓
    EXPERIENCE CORPUS
      ├──→ SelfModel
      ├──→ ProductionModel
      ├──→ Cognitive Policy
      ├──→ QC Calibration
      └──→ Audience Calibration
             ↓
        BETTER NEXT PROJECT
  institutional_experience_thesis: >
    After producing 100 shorts, Quantum should possess evidence about which
    cinematic plans are hard, which implementations fail on which structures,
    which repair strategies work, which cognitive operators are useful, and how
    to manufacture the 101st production with fewer mistakes than the first.
# =====================================================================
# 25. CANON FLYWHEEL
# =====================================================================
canon_flywheel:
  flow: |
    EPISODE
       ↓
    CANONICAL WORLD EVENTS
       ↓
    PERSISTENT CHARACTER HISTORY
       ↓
    NEW RELATIONSHIPS / BELIEFS / PROMISES / CONSEQUENCES
       ↓
    DENSER WORLD GRAPH
       ↓
    MORE NARRATIVE OPPORTUNITIES
       ↓
    NEW STORIES
       ↓
    EPISODE
  inversion_of_traditional_problem:
    traditional:
      more_canon:
        - more_documents
        - more_continuity_cost
        - more_human_coordination
    Quantum:
      more_canon:
        - denser_queryable_state
        - more_story_substrate
        - more_reusable_assets
        - more_historical_evidence
  strategic_goal: >
    Canon growth should increase creative leverage faster than maintenance burden.
