      - dependency blast-radius benchmark
      - knowledge-asymmetry benchmark
      - temporal graph benchmark
      - projection rebuild benchmark
      - operational cost benchmark
  - id: Q-OD-04
    decision: world-process scheduler implementation
    status: UNKNOWN
    evidence_needed:
      - deterministic scheduling benchmark
      - recovery semantics
      - interval process workload
  - id: Q-OD-05
    decision: exact event-effect derivation implementation split
    status: UNKNOWN
    options:
      - deterministic library only
      - governed model-assisted proposal then deterministic resolution
      - hybrid by effect type
    invariant: >
      FullyResolvedWorldEvent must contain explicit mutations before reducer commit.
  - id: Q-OD-06
    decision: NarrativeOpportunity storage strategy
    status: UNKNOWN
    options:
      - ephemeral query-only
      - short-lived derived store
      - exact-graph materialized node
    invariant: non_canonical_rebuildable
# =====================================================================
# 74. RISKS / CONTROLS
# =====================================================================
risks:
  - risk: semantic graph becomes truth
    control:
      - separate API
      - semantic-off exact-state tests
      - authority rank separation
