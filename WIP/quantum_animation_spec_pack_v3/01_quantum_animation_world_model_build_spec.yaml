# 68. END-TO-END TESTS
# =====================================================================
end_to_end_tests:
  persistent_world:
    sequence:
      - create universe
      - create entities
      - establish canon
      - append events
      - reconstruct past state
      - reconstruct current state
      - compile role contexts
      - query exact graph
      - hydrate relevant memory
      - fork hypothetical branches
      - promote selected branch
      - verify exact state
      - rebuild projections
  epistemic_story:
    sequence:
      - establish objective truth
      - create character without knowledge
      - generate observable event
      - validate perception path
      - create ambiguous observation
      - derive partial belief
      - later reveal stronger evidence
      - derive knowledge/belief revision
      - verify audience and character perspectives differ safely
  narrative_convergence:
    sequence:
      - establish active intent
      - establish knowledge asymmetry
      - establish fragile relationship
      - establish relevant prop
      - provide adjacent open promise reference
      - derive WorldSignals
      - mine NarrativeOpportunity
      - verify evidence graph
      - consume opportunity without canonical mutation
  concurrent_reality:
    sequence:
      - start walking process
      - start decoding process
      - start reactor heating process
      - schedule overlapping effects
      - interrupt one process
      - verify deterministic event ordering
      - reconstruct exact state at intermediate ticks
  retroactive_canon:
    sequence:
      - create historical state
      - build snapshots
      - insert authorized backdated canonical event
      - invalidate affected snapshots
      - replay
      - rebuild exact graph
      - verify previous transaction-time view
      - verify new transaction-time view
  pre_render_prevention:
    sequence:
      - resolve exact expected state
      - compile critical visible invariant
      - create weak/unbound render plan
      - reject before generation
      - bind deterministic/reference enforcement
      - accept plan
      - compare rendered observation
# =====================================================================
# 69. MIGRATION
# =====================================================================
migration:
  from_prompt_history:
    steps:
      - inventory existing canon
      - identify persistent entities
      - assign stable IDs
      - extract propositions
      - extract historical candidate events
      - collect evidence/provenance
      - classify authority
      - human_or_governed_authority_review_where_required
      - construct genesis canonical events
      - reconstruct initial state
      - validate sample historical scenes
      - build initial snapshots
      - project exact graph
      - project memory history
    rule: >
      Semantic memory may nominate historical evidence but cannot directly seed
      objective truth without governed acceptance.
  from_mutable_state_store:
    requirement: >
      Existing mutable values must be converted into genesis/provenance-bearing
      events before event-sourcing becomes authoritative.
# =====================================================================
# 70. ROLLOUT
# =====================================================================
rollout:
  sequence:
    - stage: SHADOW
      behavior:
        - build exact state without controlling agents
        - compare with existing pipeline
    - stage: READ_ONLY_EXACT
      behavior:
        - expose state queries
        - no canonical autonomous writes
    - stage: CONTEXT_SHADOW
      behavior:
        - compile contexts in parallel with legacy prompts
        - compare drift/coverage
    - stage: EVENT_GATED
      behavior:
        - selected event families require World Model commit
    - stage: PERCEPTION_EPISTEMIC_GATED
      behavior:
        - knowledge changes require information paths
    - stage: PRE_RENDER_ENFORCEMENT
      behavior:
        - critical visible invariants enforced before generation
    - stage: BRANCH_SIMULATION
      behavior:
        - narrative candidate futures simulated against exact state
    - stage: SIGNAL_CONSUMPTION
      behavior:
        - WorldSignals consumed by external Polycognitive Runtime
    - stage: NARRATIVE_OPPORTUNITY_CONSUMPTION
      behavior:
        - derived convergence available to narrative cognition
    - stage: EXPERIENCE_CAPTURE
      behavior:
        - production reliability learning active
    - stage: AUTONOMOUS_CONSUMPTION
      behavior:
        - approved autonomous subsystems depend on World Model exact state
  rollback:
    principle: >
      Disable consumers/projections while preserving canonical append-only ledger.
# =====================================================================
# 71. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: QG-01
    check: all declared schemas/contracts validate
  - id: QG-02
    check: full replay equals snapshot-assisted replay
  - id: QG-03
    check: event-only canonical mutation enforced
  - id: QG-04
    check: branch isolation proven
  - id: QG-05
    check: exact queries work with semantic systems disabled
  - id: QG-06
    check: mandatory context views and freshness enforced
  - id: QG-07
    check: critical production invariant coverage enforced before render
  - id: QG-08
    check: exact/semantic projections rebuild from canonical sources
  - id: QG-09
    check: learned experience cannot self-promote policy/authority
  - id: QG-10
    check: knowledge cannot appear without valid information path
  - id: QG-11
    check: derived state ownership gates prevent arbitrary psychological/relationship/epistemic mutation
  - id: QG-12
    check: WorldSignal deterministic/rebuildable classes replay correctly
  - id: QG-13
    check: NarrativeOpportunity derivation is evidence-backed and non-canonical
  - id: QG-14
    check: concurrent WorldProcess execution remains deterministic and ledger-backed
  - id: QG-15
    check: typed causal relationships preserve cause/enable/motivate distinctions
  - id: QG-16
    check: stale revision proposals cannot silently commit
# =====================================================================
# 72. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  canonical_state:
    - schemas validate
    - event-only mutation proven
    - deterministic clean replay proven
    - snapshot/full replay digest equal
    - retroactive event reconstruction proven
  identity:
    - persistent entity identity survives mutable state changes
    - rename does not alter identity
  epistemic:
    - knowledge/belief separation proven
    - perception/information path proven
    - knowledge leak negative tests pass
    - stale knowledge behavior proven
  causality:
    - typed causal lineage available
    - explain_fact returns causal/evidence lineage
    - dependency blast-radius works
  rules:
    - hard/soft rules versioned
    - replay pins rule versions
    - invalid events prevented
  branching:
    - branch canonical digest unchanged until promotion
    - promotion appends events only
  graph:
    - exact graph rebuild digest/index verification passes
    - exact state works without exact graph provider
    - semantic projections can be lost/rebuilt without state impact
  context:
    - every production/cognitive role has ContextContract
    - missing mandatory exact context fails closed
    - bounded context independent of total history demonstrated
  intelligence:
    - WorldSignal lifecycle implemented
    - WorldSignal rebuild proven
    - NarrativeOpportunity derivation proven
    - signals/opportunities cannot mutate canon
  world_processes:
    - overlapping processes supported
    - interruption semantics supported
    - no hidden interval mutation
  oracle:
    - expected/observed mismatch typed
    - critical state binding prevention works
  learning:
    - production experience captured
    - recommendations evidence-backed
    - learning cannot alter canon/authority
  integration:
    - L9 memory projection does not affect exact-state authority
    - memory outage does not roll back canon
  release:
    requirement: >
      QG-01 through QG-16 pass and all blocking provider/repository placement
      decisions for the enabled rollout scope are resolved.
# =====================================================================
# 73. OPEN DECISIONS
# =====================================================================
open_decisions:
  - id: Q-OD-01
    decision: Quantum Animation physical repository placement
    status: UNKNOWN
    evidence_needed:
      - current repository tree
      - ownership registry
      - runtime entrypoints
  - id: Q-OD-02
    decision: canonical event/state store provider
    status: UNKNOWN
