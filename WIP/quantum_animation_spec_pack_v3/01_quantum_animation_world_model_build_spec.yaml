# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Operate a persistent fictional reality whose exact state, history,
    perspectives, causes, capabilities, constraints and possible valid
    transitions can be reconstructed, explained, queried, simulated and
    compiled into bounded role-specific context.
  persistent_unit:
    primary: fictional_world
    reusable_primitives:
      - character
      - location
      - prop
      - vehicle
      - organization
      - species
      - technology
      - system
      - relationship
      - concept
  required_answer: >
    What is true at this precise WorldCoordinate, from this requested
    perspective, under this canon revision, and how did that state become true?
  success_conditions:
    - agents operate inside one authoritative universe
    - continuity never depends on prompt history
    - past and present fictional reality are exactly reconstructable
    - false beliefs can coexist safely with objective truth
    - knowledge cannot appear without a valid information path
    - agents receive exact bounded context before critical execution
    - invalid actions are rejected before expensive production
    - hypothetical futures remain isolated from canon
    - persistent characters and worlds survive across episodes and productions
    - graphs expose high-leverage relationships without becoming authority
    - semantic memory assists discovery without defining operational truth
# =====================================================================
# 2. CORE CONCEPT
# =====================================================================
core_definition: >
  The Quantum World Model is a temporally versioned, event-driven,
  multi-perspective model of fictional reality that acts as the authoritative
  state substrate for every autonomous creative, production and quality-control
  subsystem.
simplified_definition: >
  What is true right now, from whose perspective, and how did it become true?
fundamental_equation:
  authoritative_reality:
    formula: >
      ResolvedState(WorldCoordinate) =
      Reduce(
        nearest_valid_canonical_snapshot,
        ordered_canonical_events_after_snapshot_through_coordinate
      )
  agent_context:
    formula: >
      AgentContext(role, coordinate) =
      Project(
        ResolvedState(coordinate)
        + applicable canon
        + applicable rules
        + relevant durable memory
        + required adjacent references,
        role_context_contract
      )
  narrative_candidate_space:
    formula: >
      CandidateEvents =
      Intentions
      x Affordances
      x Conflicts
      x WorldRules
      x ActiveNarrativeOpportunities
  canonical_transition:
    formula: >
      CurrentWorldState
      + AcceptedWorldEvent
      -> DeterministicReducer
      -> NewWorldState
# =====================================================================
# 3. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  P-001:
    name: OPERATIONAL_STATE_NOT_MEMORY
    statement: >
      The World Model represents authoritative operational fictional reality.
      Durable memory represents history, associative relevance and retrieval.
      They are separate systems.
  P-002:
    name: EVENT_ONLY_CANONICAL_MUTATION
    statement: >
      Canonical World State changes only through accepted governed WorldEvents
      or explicitly governed equivalent transitions recorded in the canonical
      event ledger.
  P-003:
    name: GENERATED_MEDIA_IS_OBSERVATION
    statement: >
      Generated image, video, audio or text artifacts do not establish reality.
      Accepted semantic events establish canon. Media depicts or observes canon.
  P-004:
    name: IDENTITY_STATE_SEPARATION
    statement: >
      Persistent entity identity is separate from mutable state such as
      location, injury, ownership, relationship state, knowledge and psychology.
  P-005:
    name: DETERMINISTIC_REDUCTION
    statement: >
      Creativity and judgment occur before canonical event acceptance.
      The reducer performs no fuzzy inference, model calls or subjective judgment.
  P-006:
    name: TRUTH_PERSPECTIVE_SEPARATION
    statement: >
      Objective truth, character knowledge, character belief, audience
      disclosure and hypothetical state are distinct planes.
  P-007:
    name: EXACT_BEFORE_ASSOCIATIVE
    statement: >
      Operational claims must resolve from exact canonical state.
      Semantic memory and semantic graphs may nominate relevance but may never
      define exact state.
  P-008:
    name: PREVENT_BEFORE_REPAIR
    statement: >
      Rules, preconditions, state-derived constraints and production enforcement
      should prevent invalid outputs before expensive generation whenever possible.
  P-009:
    name: BRANCH_ISOLATION
    statement: >
      Hypothetical branches are copy-on-write overlays and never mutate canon.
      Promotion revalidates selected events against current canonical reality.
  P-010:
    name: SHARED_REALITY
    statement: >
      Autonomous subsystems share one world through authoritative state, not by
      remembering previous agent conversations.
  P-011:
    name: QUALITY_OUTSIDE_TRUTH
    statement: >
      Subjective evaluation of whether a film is good does not become fictional
      truth and does not belong to exact World State.
  P-012:
    name: COGNITION_OUTSIDE_TRUTH
    statement: >
      Temporary hypotheses, candidate branches, cognitive disagreement and
      workspace state never directly patch canonical World State.
  P-013:
    name: CAUSE_BEFORE_DERIVED_STATE
    statement: >
      Where possible, cognition proposes causal events; governed domain effect
      engines derive knowledge, belief, relationship and psychological changes.
  P-014:
    name: NO_SILENT_INFORMATION_TELEPORTATION
    statement: >
      Knowledge or observation may not appear without a valid information or
      perception path.
  P-015:
    name: PROVIDER_INDEPENDENCE
    statement: >
      The World Model core depends on typed ports and contracts rather than
      Neo4j, SQL, Graphiti, Zep or any provider-specific query language.
  P-016:
    name: REBUILDABLE_DERIVATIONS
    statement: >
      Snapshots, exact graph projections, semantic projections, affordances,
      WorldSignals, NarrativeOpportunities and compiled contexts are derived
      and rebuildable.
  P-017:
    name: CAUSAL_EXPLAINABILITY
    statement: >
      Authoritative facts should be explainable through event, authority,
      provenance and causal lineage.
  P-018:
    name: TIME_AXES_ARE_INDEPENDENT
    statement: >
      Fictional valid time, transaction time, narrative placement and audience
      playback position are independent coordinate axes.
  P-019:
    name: WORLD_CONTINUES_OFFSCREEN
    statement: >
      Fictional reality may evolve through world processes independently from
      what is currently shown to the audience.
  P-020:
    name: AUTHORITY_IS_NEVER_SELF_GRANTED
    statement: >
      Agents, operators, learned policies, semantic memory and projections may
      not elevate their own authority.
# =====================================================================
# 4. NON-GOALS
# =====================================================================
non_goals:
  explicitly_not_owned:
    - renderer provider selection
    - production DAG execution
    - prompt-history continuity
    - creator-value modeling
    - audience-target modeling
    - product-market modeling
    - Quantum capability self-modeling
    - global cognitive scheduling
    - global reasoning-depth allocation
    - temporary cognitive workspace persistence as truth
    - subjective film-quality scoring as factual state
    - automatic learned-policy promotion
    - direct Graphiti authority
    - direct model-generated state mutation
    - marketing execution
    - back-office operations
  future_adjacent_specs:
    - quantum.polycognitive_runtime
    - quantum.creative_intelligence
    - quantum.audience_product_intelligence
    - quantum.self_model
    - quantum.production_model
    - quantum.autonomous_qc
    - quantum.production_engine
# =====================================================================
# 5. GLOBAL ARCHITECTURAL INVARIANTS
# =====================================================================
architectural_invariants:
  truth:
    - authoritative state resolves deterministically from canonical records
    - fuzzy semantic retrieval cannot establish operational truth
    - objective truth outranks observer belief
    - branch truth never outranks canon
    - production experience never becomes fictional truth
  mutation:
    - accepted WorldEvent is the normal canonical mutation primitive
    - reducer never invents effects
    - all reducer-applied mutations are explicit in resolved event form
    - direct snapshot mutation is forbidden
    - direct exact-graph mutation is forbidden
    - direct semantic-graph mutation cannot alter exact state
  identity:
    - persistent entity IDs are immutable
    - names are attributes rather than identity
    - entity rename does not change entity ID
    - entity identity excludes mutable location/injury/relationship state
  epistemic:
    - knowledge and belief are independent
    - false belief may coexist with objective truth
    - knowledge acquisition requires an information path
    - belief revision requires evidence, inference or governed psychological cause
    - audience disclosure is independent from character knowledge
  temporal:
    - valid time is fictional time
    - transaction time is Quantum acceptance/recording time
    - narrative position is authored story position
    - playback position is viewer-facing temporal position
    - these axes may differ
  branching:
    - branches are isolated overlays
    - branch state is never copied wholesale into canon
    - promotion appends revalidated events
    - stale branch proposals require revalidation/rebase
  cognition:
    - Cognitive Workspace is temporary
    - CognitiveResult may propose but not mutate canon
    - cognitive requests do not imply authority
    - higher-order reasoning policy belongs outside World Model
  context:
    - required exact views are compiled before critical operations
    - missing/stale mandatory exact context fails closed
    - optional semantic context may degrade without falsifying exact state
  projections:
    - exact graph is rebuildable
    - semantic graph is rebuildable
    - exact graph may be unavailable without losing canonical truth
    - semantic graph may be unavailable without losing canonical truth
  learning:
    - experience may recommend production or cognitive policy
    - learning cannot self-promote into canon or authority
    - learned recommendations require external policy gates
  concurrency:
    - canonical commit is serialized or conflict-detected
    - last-write-wins is forbidden for semantic state
    - concurrent cognition reads immutable revision-tagged state
    - concurrent fictional processes are resolved through governed temporal semantics
