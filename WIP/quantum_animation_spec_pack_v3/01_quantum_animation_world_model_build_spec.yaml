# =====================================================================
# 77. ACCEPTANCE CRITERIA
# =====================================================================
acceptance_criteria:
  exact_reality:
    - exact state reconstructs at arbitrary WorldCoordinate
    - objective state explains event/authority/provenance
    - past transaction-time understanding can be reconstructed
    - retroactive canon changes rebuild deterministically
  persistent_entities:
    - characters/locations/props retain stable identity across productions
    - mutable state never pollutes persistent identity
  perspectives:
    - objective state, knowledge, belief and audience disclosure may disagree safely
    - knowledge requires valid information path
    - false belief does not corrupt objective truth
  behavior:
    - intentions and affordances bound possible action space
    - impossible actions are mechanically filtered
    - soft-character deviations require justification rather than becoming impossible
  graph:
    - exact graph exposes high-value world relationships
    - complex n-ary relations are reifiable without native hypergraph requirement
    - semantic graph assists discovery without becoming truth
  intelligence:
    - WorldSignals are first-class, evidence-backed and revision-tagged
    - NarrativeOpportunities represent multi-thread convergence as derived objects
    - signals/opportunities do not mutate canon
    - higher cognitive activation remains outside World Model ownership
  concurrency:
    - overlapping fictional processes are supported
    - interval effects remain event-ledger-backed
    - simultaneous/conflicting transitions resolve deterministically
  contexts:
    - agents receive bounded exact role contexts
    - missing critical exact views fail closed
  production_prevention:
    - world invariants compile into production constraints
    - critical weak bindings are rejected before rendering
    - Oracle compares expected truth to observed media
  memory:
    - exact state works without Graphiti/Zep
    - L9 semantic history remains associative rather than authoritative
  learning:
    - production experience improves recommendations
    - learning cannot self-authorize policy
    - cognitive operator learning is delegated to Polycognitive Runtime
  operational:
    - provider projection loss is recoverable
    - branch isolation proven
    - idempotent commit proven
    - recovery from canonical ledger demonstrated
# =====================================================================
# 78. FINAL ARCHITECTURAL LAW
# =====================================================================
final_architectural_law:
  ownership_rule: >
    World Model owns truth.
    Polycognitive Runtime owns active cognition.
    Autonomous QC owns acceptance.
    Production Model owns manufacturing strategy.
    Production Engine owns execution.
    Durable Memory owns historical/associative recall.
  mutation_rule: >
    Cognition may observe, reason, propose, simulate and request.
    Only governed canonical event acceptance may change fictional reality.
  persistence_rule: >
    Films end. Persistent worlds do not.
  key_concept: >
    Quantum does not repeatedly regenerate fictional context from prompts.
    It operates a persistent simulated universe and renders selected,
    validated state transitions from that universe into film.

This is the version I would call architecturally complete enough to freeze as 01. The uploaded file already had the right spine—especially event-only mutation, deterministic replay, branch isolation, exact-vs-semantic graph separation, and the explicit declaration that Cognitive Workspace and the other major models are adjacent rather than World Model-owned. 01_quantum_animation_world_model_build_spec.yaml

The most consequential additions in this revision are state ownership + effect derivation, perception/information paths, typed causality, concurrent WorldProcess semantics, first-class WorldSignal, and NarrativeOpportunity as the reified mega-hyperedge. Those close the largest remaining holes without contaminating the World Model with the Cognitive Executive.

The logical next artifact is now 02_quantum_polycognitive_runtime_build_spec.yaml; that spec can cleanly consume the WorldSignal, NarrativeOpportunity, Context Compiler, Branch Simulator and exact World APIs defined here without being allowed to mutate truth directly.
