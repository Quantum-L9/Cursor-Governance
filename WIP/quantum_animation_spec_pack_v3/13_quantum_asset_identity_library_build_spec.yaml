metadata:
  spec_id: quantum.animation.asset_identity_library.build_spec.v1
  version: "1.0.0"
  date: "2026-08-11"
  status: READY_FOR_ACCEPTANCE
  mode: SPECIFICATION_ONLY
  implementation: FORBIDDEN_UNTIL_ACCEPTANCE
  title: Quantum Asset Identity Library
  depends_on:
    - file: 00_quantum_animation_system_architecture.yaml
      relationship: CONSTITUTIONAL_DEPENDENCY
    - file: 01_quantum_animation_world_model_build_spec.yaml
      relationship: PERSISTENT_ENTITY_IDENTITY_DEPENDENCY
    - file: 03_quantum_creative_intelligence_build_spec.yaml
      relationship: CREATIVE_IDENTITY_DEPENDENCY
    - file: 05_quantum_self_model_build_spec.yaml
      relationship: IMPLEMENTATION_COMPATIBILITY_DEPENDENCY
    - file: 06_quantum_production_model_build_spec.yaml
      relationship: ASSET_STRATEGY_DEPENDENCY
    - file: 07_quantum_autonomous_qc_build_spec.yaml
      relationship: ASSET_CERTIFICATION_DEPENDENCY
    - file: 08_quantum_production_engine_build_spec.yaml
      relationship: ASSET_MATERIALIZATION_DEPENDENCY
    - file: 09_quantum_project_provenance_dependency_graph_build_spec.yaml
      relationship: ASSET_LINEAGE_DEPENDENCY
    - file: 10_quantum_canonical_artifact_ir_build_spec.yaml
      relationship: CANONICAL_OBJECT_DEPENDENCY
    - file: 11_quantum_project_compiler_pipeline_build_spec.yaml
      relationship: ASSET_IDENTITY_INTENT_INPUT
    - file: 12_quantum_story_animatic_compiler_build_spec.yaml
      relationship: SHOT_LEVEL_ASSET_CONSUMPTION
  architectural_identity:
    concise: >
      Persistent, certified media identity layer that binds fictional entities
      to reusable visual, voice, motion, environmental, and prop representations.
    extended: >
      Quantum Asset Identity Library provides stable production representations
      for persistent WorldEntities and recurring project elements. It does not
      own fictional identity; WorldModel and CreatorModel do. It owns certified
      media representations of that identity, including canonical reference
      packs, voice identity, silhouettes, expressions, costume/damage variants,
      environment identity, prop identity, model-compatible derivatives, and
      reusable production anchors. It enables the same fictional being or place
      to survive across shots, episodes, seasons, and future media outputs
      without being regenerated from prose every time.
  owner_question:
    primary: "How is this persistent entity represented consistently in media?"
  secondary_questions:
    - "Which media assets represent Aria?"
    - "Which representations are canonical?"
    - "Which are certified?"
    - "Which variants are valid at this WorldCoordinate?"
    - "Which renderer/tool implementations can consume these assets?"
    - "Which identity anchors matter most?"
    - "What changed between asset versions?"
    - "Can an existing character representation be reused?"
    - "Which persistent entity does this artifact represent?"
    - "Which representation failed identity QC?"
    - "Which asset family should production use for this shot?"
  hard_boundary: >
    AssetIdentityLibrary represents fictional entities; it does not redefine
    fictional entities.
# =====================================================================
# 1. MISSION
# =====================================================================
mission:
  primary: >
    Make persistent fictional beings, environments, props, voices, and recurring
    visual structures reusable and stable across production.
  strategic_value: >
    Convert recurring IP from repeated text prompting into certified production
    capital.
  success_definition: >
    A recurring entity can be invoked in a new shot or episode through a stable
    entity-to-asset binding, with appropriate variants automatically selected,
    compatibility known, provenance preserved, and identity consistency
    independently QC-certified.
  compounding_effect: >
    The more often a character or location is successfully produced, the richer
    and more reliable its reusable identity representation becomes.
# =====================================================================
# 2. FOUNDATIONAL PRINCIPLES
# =====================================================================
foundational_principles:
  AIL-001:
    name: ENTITY_IS_NOT_ASSET
    statement: >
      WorldEntity is canonical fictional identity. AssetFamily is a production
      representation of that entity.
  AIL-002:
    name: REPRESENTATIONS_MAY_BE_MANY
    statement: >
      One persistent entity may have many valid production representations.
  AIL-003:
    name: CANONICAL_IDENTITY_ANCHORS
    statement: >
      Stable identity features must be explicitly represented rather than
      implicitly reconstructed from prose.
  AIL-004:
    name: CERTIFICATION_REQUIRED_FOR_REUSE
    statement: >
      Reusable canonical asset representations require QC certification.
  AIL-005:
    name: VARIANTS_ARE_FIRST_CLASS
    statement: >
      Costume, damage, age, lighting, expression, state, and medium variants are
      modeled explicitly.
  AIL-006:
    name: WORLD_STATE_SELECTS_VALID_VARIANT
    statement: >
      A shot's WorldCoordinate determines which entity variant is semantically valid.
  AIL-007:
    name: REPRESENTATION_NOT_TRUTH
    statement: >
      If asset representation conflicts with World truth, the asset is wrong.
  AIL-008:
    name: IMPLEMENTATION_COMPATIBILITY_IS_EXPLICIT
    statement: >
      Model/tool-specific derivatives can exist without becoming canonical identity.
  AIL-009:
    name: PROVIDER_SPECIFIC_ASSETS_ARE_DERIVED
    statement: >
      Embeddings, adapters, reference packs, or conditioning formats tied to one
      implementation are derived assets.
  AIL-010:
    name: CROSS_EPISODE_REUSE
    statement: >
      Certified identity assets may outlive the project episode that created them.
  AIL-011:
    name: CROSS_PROJECT_REUSE_WHEN_CANON_ALLOWS
    statement: >
      Persistent-universe entities may reuse identity assets across projects.
  AIL-012:
    name: IMMUTABLE_ASSET_VERSIONS
    statement: >
      Certified asset versions are immutable.
  AIL-013:
    name: NEW_VISUAL_IDENTITY_CREATES_NEW_VERSION
    statement: >
      Meaningful identity changes supersede prior versions rather than mutate them.
  AIL-014:
    name: TEMPORARY_TAKES_ARE_NOT_LIBRARY_ASSETS
    statement: >
      Ordinary shot outputs do not automatically become reusable canonical assets.
  AIL-015:
    name: SUCCESSFUL_PRODUCTION_CAN_ENRICH_LIBRARY
    statement: >
      Accepted production outputs may become new reference assets if promoted
      through explicit library QC.
  AIL-016:
    name: IDENTITY_IS_MULTIMODAL
    statement: >
      Character identity includes appearance, voice, movement, performance,
      silhouette, costume, and other recurring signatures.
  AIL-017:
    name: IDENTITY_CONSTRAINTS_ARE_TYPED
    statement: >
      "Looks like Aria" is insufficient; important identity features should be
      explicitly represented and measurable where possible.
  AIL-018:
    name: REUSE_REQUIRES_CONTEXT_COMPATIBILITY
    statement: >
      An accepted asset may still be invalid for the current World state or style context.
  AIL-019:
    name: ASSET_LIBRARY_IS_NOT_WORLD_DATABASE
    statement: >
      Relationships, beliefs, goals, memories, and narrative state remain outside
      the asset library.
  AIL-020:
    name: ASSET_LIBRARY_IS_NOT_PRODUCTION_STRATEGY
    statement: >
      Library exposes valid representations; ProductionModel decides how to use them.
  AIL-021:
    name: REPRESENTATION_QUALITY_IS_STYLE_RELATIVE
    statement: >
      Canonical visual assets must preserve project style rather than converge on realism.
  AIL-022:
    name: ASSET_LINEAGE_IS_COMPLETE
    statement: >
      Every certified asset traces to source identity intent, generation path,
      QC, and entity binding.
  AIL-023:
    name: ASSET_SELECTION_IS_QUERYABLE
    statement: >
      Agents should ask for the best valid representation instead of manually
      navigating files.
  AIL-024:
    name: LIBRARY_CAN_ACCUMULATE_IP_VALUE
    statement: >
      Persistent entities and their representations become reusable creative and
      production capital over time.
# =====================================================================
# 3. OWNERSHIP BOUNDARIES
# =====================================================================
ownership_boundaries:
  this_spec_owns:
    - AssetFamily
    - AssetVariant
    - AssetIdentityProfile
    - IdentityAnchor
    - AssetRepresentation
    - RepresentationCompatibility
    - AssetCertification
    - AssetPromotionCandidate
    - AssetReuseQuery
    - AssetReuseResult
    - entity_to_asset binding
    - library versioning
    - variant resolution
    - reusable reference pack construction
    - identity library lifecycle
  this_spec_does_not_own:
    - WorldEntity semantics
    - character psychology
    - character memory
    - relationships
    - World physical state
    - creative style authority
    - final shot production strategy
    - production execution
    - final asset acceptance policy beyond delegated QC
  delegated_authority:
    entity_truth:
      owner: 01
    visual_and_voice_intent:
      owner: 03
    implementation_compatibility_evidence:
      owner: 05
    strategy_selection:
      owner: 06
    certification:
      owner: 07
    generation_execution:
      owner: 08
# =====================================================================
# 4. ASSET CLASSES
# =====================================================================
asset_classes:
  CHARACTER:
    persistent_entity_binding: required
  ENVIRONMENT:
    persistent_entity_binding: optional
  PROP:
    persistent_entity_binding: recommended_if_narratively_meaningful
  COSTUME:
    parent_character_required: true
  VOICE_IDENTITY:
    parent_character_required: true
  MOTION_IDENTITY:
    parent_character_required: true
  EFFECT:
    persistent_binding: optional
  SYMBOL:
    persistent_binding: optional
  VEHICLE:
    persistent_binding: recommended
  CREATURE:
    persistent_entity_binding: required
  UI_OR_INTERFACE:
    persistent_binding: optional
  MUSIC_MOTIF:
    semantic_binding: character_location_theme_or_faction
  ACOUSTIC_SIGNATURE:
    semantic_binding: entity_or_location
# =====================================================================
# 5. ASSET FAMILY
# =====================================================================
asset_family:
  AssetFamily:
    fields:
      asset_family_id:
      universe_id:
      project_id:
        nullable: true
      asset_class:
      semantic_name:
      persistent_entity_ref:
        nullable: true
      creator_identity_source_refs:
      World_entity_ref:
        nullable: true
      canonical_identity_profile_ref:
      canonical_representation_refs:
      valid_variant_refs:
      derived_implementation_representation_refs:
      reuse_scope:
        enum:
          - SHOT
          - SCENE
          - EPISODE
          - PROJECT
          - UNIVERSE
          - CROSS_MEDIUM
      lifecycle_state:
        enum:
          - DRAFT
          - CANDIDATE
          - CERTIFIED
          - SUPERSEDED
          - RETIRED
      created_at:
      version:
      digest:
  invariant: >
    AssetFamily never substitutes for persistent entity identity.
# =====================================================================
# 6. ASSET IDENTITY PROFILE
# =====================================================================
identity_profile:
  AssetIdentityProfile:
    fields:
      identity_profile_id:
      asset_family_ref:
      required_anchors:
        type: list[IdentityAnchor]
      flexible_dimensions:
      forbidden_drift:
      acceptable_variation:
      stylistic_constraints:
      visual_signature:
        nullable: true
      voice_signature:
        nullable: true
      motion_signature:
        nullable: true
      acoustic_signature:
        nullable: true
      confidence:
      source_refs:
# =====================================================================
# 7. IDENTITY ANCHOR
# =====================================================================
identity_anchor:
  IdentityAnchor:
    fields:
      anchor_id:
      anchor_type:
        enum:
          - FACE
          - SILHOUETTE
          - BODY_PROPORTION
          - HEIGHT
          - HAIR
          - EYES
          - COLOR_PATTERN
          - COSTUME
          - ACCESSORY
          - SCAR
          - DAMAGE
          - SYMBOL
          - MATERIAL
          - VOICE_TIMBRE
          - ACCENT
          - SPEECH_RHYTHM
          - MOVEMENT_PATTERN
          - POSTURE
          - EXPRESSION_STYLE
          - ENVIRONMENT_GEOMETRY
          - PROP_SHAPE
          - PROP_MARKING
          - CUSTOM
      description:
      expected_value:
      tolerance:
      importance:
        range: [0.0, 1.0]
      hard:
        type: bool
      observable:
        type: bool
      validator_ref:
        nullable: true
      source_ref:
# =====================================================================
# 8. CHARACTER ASSET FAMILY
# =====================================================================
character_asset_family:
  CharacterAssetFamily:
    extends:
      - AssetFamily
    fields:
      character_ref:
      canonical_visual_pack_ref:
      canonical_voice_pack_ref:
      canonical_motion_pack_ref:
        nullable: true
      expression_variant_refs:
      costume_variant_refs:
      physical_state_variant_refs:
      age_variant_refs:
      style_variant_refs:
      reusable_conditioning_refs:
      implementation_derivative_refs:
      long_term_identity_confidence:
      reuse_count:
      successful_QC_count:
# =====================================================================
# 9. CANONICAL VISUAL PACK
# =====================================================================
visual_pack:
  CanonicalVisualPack:
    fields:
      pack_id:
      character_ref:
      identity_profile_ref:
      front_ref:
      three_quarter_ref:
      profile_ref:
      rear_ref:
      full_body_ref:
      neutral_expression_ref:
      expression_refs:
      pose_refs:
      silhouette_ref:
      palette:
      costume_ref:
      prop_refs:
      detail_refs:
      lighting_neutral_ref:
      source_style_ref:
      certification_ref:
      digest:
  MVP:
    minimum_views:
      - front
      - three_quarter
      - full_body
      - profile
# =====================================================================
# 10. VOICE IDENTITY PACK
# =====================================================================
voice_pack:
  CanonicalVoicePack:
    fields:
      pack_id:
      character_ref:
      voice_description:
      timbre:
      pitch_range:
      cadence:
      accent:
      articulation:
      energy_baseline:
      emotional_range:
      sample_artifact_refs:
      pronunciation_rules:
      forbidden_characteristics:
      implementation_derivatives:
      certificate_ref:
      digest:
  principle: >
    Voice identity is persistent IP representation, not just a TTS provider setting.
# =====================================================================
# 11. MOTION IDENTITY PACK
# =====================================================================
motion_pack:
  MotionIdentityPack:
    fields:
      pack_id:
      character_ref:
      posture:
      center_of_gravity:
      walking_style:
      running_style:
      gesture_style:
      reaction_style:
      stillness_style:
      combat_or_action_style:
        nullable: true
      physical_constraints:
      motion_reference_refs:
      certificate_ref:
        nullable: true
# =====================================================================
# 12. ENVIRONMENT ASSET FAMILY
# =====================================================================
environment_family:
  EnvironmentAssetFamily:
    extends:
      - AssetFamily
    fields:
      location_ref:
      canonical_views:
      geometry_refs:
      panoramic_refs:
      lighting_variant_refs:
      weather_variant_refs:
      time_variant_refs:
      material_refs:
      acoustic_signature_ref:
      recurring_visual_motifs:
      spatial_anchor_refs:
      reusable_plate_refs:
      certificate_ref:
# =====================================================================
# 13. PROP ASSET FAMILY
# =====================================================================
prop_family:
  PropAssetFamily:
    extends:
      - AssetFamily
    fields:
      prop_entity_ref:
      canonical_views:
      dimensions:
      materials:
      markings:
      state_variants:
      damage_variants:
      interaction_anchor_refs:
      handedness_constraints:
        nullable: true
      certificate_ref:
# =====================================================================
# 14. ASSET VARIANT
# =====================================================================
asset_variant:
  AssetVariant:
    fields:
      variant_id:
      asset_family_ref:
      version:
      variant_type:
        enum:
          - COSTUME
          - DAMAGE
          - AGE
          - EXPRESSION
          - WEATHER
          - LIGHTING
          - TIME
          - STATE
          - STYLE
          - MEDIUM
          - IMPLEMENTATION
          - OTHER
      semantic_predicate:
      World_state_requirements:
      parent_variant_ref:
        nullable: true
      representation_refs:
      identity_anchor_overrides:
      certificate_ref:
        nullable: true
      digest:
# =====================================================================
# 15. REPRESENTATION
# =====================================================================
asset_representation:
  AssetRepresentation:
    object_class: CERTIFIED_ARTIFACT_or_CANDIDATE_ARTIFACT
    fields:
      representation_id:
      asset_family_ref:
      variant_ref:
        nullable: true
      representation_type:
        enum:
          - IMAGE_REFERENCE
          - IMAGE_SET
          - VIDEO_REFERENCE
          - AUDIO_REFERENCE
          - VOICE_PROFILE
          - MOTION_REFERENCE
          - GEOMETRY
          - TEXTURE
          - RIG
          - POSE
          - MASK
          - DEPTH
          - EMBEDDING
          - MODEL_ADAPTER
          - CONDITIONING_PACKAGE
          - PANORAMA
          - TEMPLATE
          - OTHER
      artifact_refs:
      canonical_or_derived:
        enum:
          - CANONICAL
          - DERIVED
      implementation_binding:
        nullable: true
      compatibility_refs:
      quality_certificate_ref:
        nullable: true
      source_refs:
      created_at:
      digest:
# =====================================================================
# 16. REPRESENTATION COMPATIBILITY
# =====================================================================
representation_compatibility:
  RepresentationCompatibility:
    fields:
      compatibility_id:
      representation_ref:
      implementation_ref:
      implementation_version_range:
        nullable: true
      capability_ref:
      supported:
        enum:
          - YES
          - CONDITIONAL
          - NO
          - UNKNOWN
      conditions:
      quality_expectation:
      known_failure_modes:
      evidence_refs:
      confidence:
      last_validated_at:
  owner_of_capability_evidence:
    SelfModel
  library_role:
    cache_normalized_compatibility_view: true
# =====================================================================
# 17. ENTITY-TO-ASSET BINDING
# =====================================================================
entity_asset_binding:
  EntityAssetBinding:
    fields:
      binding_id:
      persistent_entity_ref:
      asset_family_ref:
      binding_type:
        enum:
          - PRIMARY
          - ALTERNATE
          - HISTORICAL
          - MEDIUM_SPECIFIC
      valid_from_WorldCoordinate:
        nullable: true
      valid_to_WorldCoordinate:
        nullable: true
      style_scope_ref:
      certificate_ref:
      confidence:
  hard_rule: >
    Binding does not imply all variants are valid at all WorldCoordinates.
# =====================================================================
# 18. VARIANT RESOLUTION
# =====================================================================
variant_resolution:
  AssetVariantResolver:
    inputs:
      - persistent_entity_ref
      - WorldCoordinate
      - WorldSnapshot
      - CreatorModel
      - ShotSpec
      - ProductionIntent
    evaluates:
      - costume state
      - damage state
      - physical state
      - age/time
      - location/environment state
      - project style
      - medium
      - production needs
    output:
      AssetResolutionResult
  AssetResolutionResult:
    fields:
      entity_ref:
      selected_asset_family_ref:
      selected_variant_refs:
      representation_candidates:
      hard_constraint_coverage:
      unresolved_requirements:
      confidence:
# =====================================================================
# 19. ASSET REUSE QUERY
# =====================================================================
reuse_query:
  AssetReuseQuery:
    fields:
      semantic_entity_ref:
      WorldCoordinate:
      required_representation_types:
      ProductionStrategy_ref:
        nullable: true
      implementation_ref:
        nullable: true
      style_ref:
      quality_tier:
      hard_identity_requirements:
      allowed_variation:
  AssetReuseResult:
    fields:
      query_ref:
      candidates:
        type: list[AssetReuseCandidate]
      selected_candidate_ref:
        nullable: true
      missing_requirements:
      new_asset_required:
      confidence:
  AssetReuseCandidate:
    fields:
      asset_family_ref:
      variant_refs:
      representation_refs:
      identity_coverage:
      implementation_compatibility:
      certificate_validity:
      reuse_confidence:
      risk:
# =====================================================================
# 20. ASSET CREATION PIPELINE
# =====================================================================
asset_creation:
  flow: |
    AssetIdentityIntent
          ↓
    persistent entity / creative identity refs
          ↓
    AssetIdentityProfile
          ↓
    IdentityAnchors
          ↓
    asset-generation strategy
          ↓
    candidate representations
          ↓
    identity QC
          ↓
    canonical/reference pack assembly
          ↓
    certification
          ↓
    AssetFamily CERTIFIED
          ↓
    library registration
  execution_owner:
    ProductionEngine
  strategy_owner:
    ProductionModel
  acceptance_owner:
    AutonomousQC
# =====================================================================
# 21. CHARACTER ASSET BOOTSTRAP
# =====================================================================
character_bootstrap:
  MVP_flow:
    - consume CharacterSeed
    - bind to WorldEntity
    - compile AssetIdentityProfile
    - generate canonical visual pack
    - generate voice pack
    - run identity QC
    - certify asset family
    - expose for shot production
  should_happen_before:
    recurring_character_final_shot_generation: true
# =====================================================================
# 22. ASSET QC
# =====================================================================
asset_QC:
  delegated_to:
    07_quantum_autonomous_qc_build_spec.yaml
  required_dimensions:
    character_visual:
      - creator fidelity
      - face identity
      - silhouette
      - proportions
      - style
      - costume
      - distinguishing anchors
    voice:
      - timbre identity
      - cadence
      - pronunciation
      - emotional flexibility
      - creator fidelity
    environment:
      - spatial identity
      - visual motifs
      - material language
      - style fidelity
    prop:
      - shape
      - markings
      - dimensions
      - state variants
  output:
    QualityCertificate
# =====================================================================
# 23. ASSET PROMOTION FROM PRODUCTION
# =====================================================================
asset_promotion:
  purpose: >
    Allow excellent accepted production outputs to enrich future reusable identity.
  AssetPromotionCandidate:
    fields:
      promotion_id:
      source_artifact_ref:
      target_asset_family_ref:
      proposed_representation_type:
      identity_value:
      coverage_gain:
      quality_certificate_ref:
      source_WorldCoordinate:
      risk:
      confidence:
  promotion_requires:
    - asset-specific QC
    - semantic compatibility
    - no temporary state mistaken for canonical baseline
  example:
    >
    A particularly strong approved Aria profile closeup may become an additional
    reference image for future identity conditioning.
# =====================================================================
# 24. STATEFUL CHARACTER VARIANTS
# =====================================================================
stateful_variants:
  examples:
    - shoulder_damaged
    - shoulder_healed
    - costume_A
    - costume_B
    - wet
    - bloodied
    - older
    - transformed
  rule: >
    Variants must encode semantic predicates so World state determines validity.
  anti_pattern:
    >
    Shot generator manually guesses from file names such as aria_final_v7_bloody.png.
# =====================================================================
# 25. IDENTITY DRIFT
# =====================================================================
identity_drift:
  IdentityDriftObservation:
    fields:
      observation_id:
      entity_ref:
      expected_identity_profile_ref:
      artifact_ref:
      dimension_drift:
        type: map
      severity:
      confidence:
      QC_ref:
  uses:
    - QC repair
    - SelfModel evidence
    - ProductionModel strategy learning
    - asset family quality learning
# =====================================================================
# 26. IDENTITY SCORE
# =====================================================================
identity_scoring:
  dimensions:
    - facial
    - silhouette
    - proportion
    - costume
    - unique_markers
    - color_language
    - voice
    - motion
    - performance
  no_single_universal_threshold:
    true
  hard_anchors:
    noncompensatory: true
  example:
    >
    Perfect costume cannot compensate for the wrong face on a recurring lead.
# =====================================================================
# 27. ASSET LIBRARY QUERY API
# =====================================================================
query_API:
  identity:
    - get_asset_family(entity_ref)
    - get_identity_profile(asset_family_ref)
    - get_identity_anchors(asset_family_ref)
  variants:
    - resolve_valid_variants(entity_ref, WorldCoordinate)
    - get_variant(asset_family_ref, variant_type)
  reuse:
    - find_reusable_assets(query)
    - rank_representations(query)
  compatibility:
    - compatible_representations(asset_family_ref, implementation_ref)
  provenance:
    - asset_history(asset_family_ref)
    - representations_from_source(ref)
  promotion:
    - propose_asset_promotion(artifact_ref)
# =====================================================================
# 28. CROSS-MEDIUM FUTURE COMPATIBILITY
# =====================================================================
cross_medium:
  MVP:
    target_medium: animation
  architecture:
    medium_specific_representation_allowed: true
  future_examples:
    BOOK:
      may_reuse:
        - identity profile
        - entity binding
        - appearance semantics
        - voice semantics as prose voice hints
    COMIC:
      may_reuse:
        - canonical visual pack
        - style-specific representations
    GAME:
      may_reuse:
        - geometry
        - rig
        - voice
        - motion identity
  rule: >
    Asset family identity survives medium-specific representation changes.
# =====================================================================
# 29. CROSS-EPISODE REUSE
# =====================================================================
cross_episode_reuse:
  requirements:
    - same persistent entity
    - valid current variant
    - compatible creative style
    - valid certificate
    - representation implementation compatibility
  expected_benefits:
    - identity consistency
    - lower asset-generation cost
    - faster production
    - accumulated IP value
# =====================================================================
# 30. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    - CharacterSeed_to_AssetIdentityProfile
    - WorldEntity_to_AssetFamily
    - CreatorModel_to_IdentityAnchors
    - representation_to_generation_strategy
    - representation_to_execution_receipt
    - representation_to_QC_certificate
    - asset_to_shot_artifact
  emits_to:
    09_quantum_project_provenance_dependency_graph_build_spec.yaml
# =====================================================================
# 31. STORAGE
# =====================================================================
storage_abstractions:
  ports:
    - AssetFamilyStorePort
    - AssetRepresentationStorePort
    - AssetBlobStorePort
    - AssetVariantStorePort
    - AssetCompatibilityStorePort
    - AssetBindingStorePort
  index_by:
    - persistent_entity_ref
    - asset_class
    - variant
    - universe
    - project
    - implementation compatibility
    - certification state
# =====================================================================
# 32. PACKAGE LAYOUT
# =====================================================================
packages_or_modules_to_create:
  package_root: quantum/assets/
  modules:
    contracts:
      - family
      - profile
      - anchor
      - variant
      - representation
      - binding
    character:
      - visual_pack
      - voice_pack
      - motion_pack
      - bootstrap
    environment:
      - family
      - views
      - acoustic_signature
    prop:
      - family
      - interaction_anchors
    resolution:
      - variant_resolver
      - reuse_query
      - ranking
    compatibility:
      - SelfModel_adapter
      - representation_compatibility
    QC:
      - asset_submission
      - identity_drift
    promotion:
      - candidate
      - evaluator
    provenance:
      - emitter
    ports:
      - stores
# =====================================================================
# 33. SCHEMAS TO CREATE
# =====================================================================
schemas_to_create:
  - AssetFamily
  - AssetIdentityProfile
  - IdentityAnchor
  - CharacterAssetFamily
  - CanonicalVisualPack
  - CanonicalVoicePack
  - MotionIdentityPack
  - EnvironmentAssetFamily
  - PropAssetFamily
  - AssetVariant
  - AssetRepresentation
  - RepresentationCompatibility
  - EntityAssetBinding
  - AssetResolutionResult
  - AssetReuseQuery
  - AssetReuseResult
  - AssetReuseCandidate
  - AssetPromotionCandidate
  - IdentityDriftObservation
# =====================================================================
# 34. MVP REQUIRED SUBSET
# =====================================================================
mvp_required_subset:
  characters:
    count: 1_to_2
    required:
      - persistent WorldEntity binding
      - AssetIdentityProfile
      - CanonicalVisualPack
      - CanonicalVoicePack
      - at_least_one expression set
      - costume/state variant support
      - identity QC
  environment:
    count: 1_primary
    required:
      - environment AssetFamily
      - canonical view set
      - style identity
      - basic lighting state variants
  prop:
    count:
      minimum: 1_narratively_important
    required:
      - canonical representation
      - interaction constraints
      - state tracking
  deferred:
    - production-grade 3D rigs
    - hundreds_of_character bulk management
    - cross-medium geometry
    - learned identity embeddings as mandatory architecture
    - automated licensing systems
# =====================================================================
# 35. TESTS
# =====================================================================
tests:
  unit:
    - identity_profile_validation
    - variant_resolution
    - entity_binding
    - representation_compatibility
    - certificate_required_for_reuse
  property:
    - asset_never_overrides_World_entity
    - wrong_state_variant_never_selected
    - certified_asset_immutable
    - provider_specific_representation_never_becomes_entity_truth
    - same_entity_can_have_multiple_valid_representations
    - hard_identity_anchor_cannot_be_compensated_by_other_scores
  negative:
    - raw_prompt_used_as_persistent_character_identity_rejected
    - uncertified_reference_pack_reused_as_canonical_rejected
    - damaged_variant_used_before_damage_event_rejected
    - temporary_shot_take_auto_promoted_to_canonical_asset_rejected
    - provider_embedding_treated_as_character_identity_rejected
  integration:
    - CharacterSeed_to_AssetFamily
    - WorldEntity_to_variant_resolution
    - AssetFamily_to_ProductionModel
    - ProductionEngine_to_asset_promotion_candidate
    - QC_to_identity_drift
    - asset_lineage_to_provenance_graph
  end_to_end:
    recurring_Aria:
      episode_1:
        - generate visual identity pack
        - certify
        - generate shots
      episode_2:
        - retrieve same entity
        - resolve current state variant
        - reuse certified identity assets
      success:
        - identity continuity maintained
        - no redefinition from prose
# =====================================================================
# 36. VALIDATION GATES
# =====================================================================
validation_gates:
  - id: AIL-G01
    check: entity and asset semantics separated
  - id: AIL-G02
    check: persistent entity binding supported
  - id: AIL-G03
    check: identity anchors explicit
  - id: AIL-G04
    check: canonical visual pack supported
  - id: AIL-G05
    check: canonical voice identity supported
  - id: AIL-G06
    check: state variants supported
  - id: AIL-G07
    check: WorldCoordinate-driven variant resolution supported
  - id: AIL-G08
    check: provider-specific representations remain derived
  - id: AIL-G09
    check: certification required for canonical reuse
  - id: AIL-G10
    check: cross-episode reuse supported
  - id: AIL-G11
    check: production outputs may enrich library only through promotion
  - id: AIL-G12
    check: provenance complete
  - id: AIL-G13
    check: MVP character identity usable across 10_to_15 shots
# =====================================================================
# 37. DEFINITION OF DONE
# =====================================================================
definition_of_done:
  identity:
    - AssetFamily
    - AssetIdentityProfile
    - IdentityAnchor
    - entity binding
  character:
    - visual pack
    - voice pack
    - state variants
    - identity QC
  environment:
    - reusable location representation
  prop:
    - reusable narratively important prop
  reuse:
    - variant resolution
    - compatibility resolution
    - cross-shot reuse
    - cross-episode architecture
  provenance:
    - entity_to_asset_to_shot lineage
  MVP:
    - one recurring lead remains recognizable and semantically correct across
      entire 60-second short
  release:
    requirement: AIL-G01_through_AIL-G13_pass
# =====================================================================
# 38. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    A fictional being is not a file.
  law_02: >
    WorldEntity owns who the being is; AssetIdentityLibrary owns reusable media
    representations of that being.
  law_03: >
    Persistent identity is expressed through explicit anchors.
  law_04: >
    One entity can have many representations without becoming many entities.
  law_05: >
    World state determines which representation variant is valid.
  law_06: >
    Certified reusable representations are immutable.
  law_07: >
    Provider-specific identity mechanisms are implementation derivatives, not canon.
  law_08: >
    Strong production outputs may enrich identity representation but never silently.
  law_09: >
    Characters should become cheaper and more consistent as their certified
    representation library grows.
  law_10: >
    Persistent fictional beings are reusable IP primitives, not regenerated prompts.
  law_11: >
    The long-term asset library is production capital accumulated around persistent canon.
  law_12: >
    Quantum should be able to ask for Aria and receive the correct production
    representation for Aria at this exact point in her life and World state.

