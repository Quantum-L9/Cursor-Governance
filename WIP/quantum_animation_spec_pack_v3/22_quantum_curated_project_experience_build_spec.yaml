  NO_CURRENT_EXECUTION_CONFIDENCE:
    behavior:
      - state_unknown
      - block_unsupported_execution_claim
# =====================================================================
# 61. CONCURRENCY
# =====================================================================
concurrency:
  module_preparation:
    parallelizable: true
  active_experience:
    one_primary_ExplorationState_per_session: true
  source_refresh:
    may_compile_new_snapshot_concurrently: true
  locked_experience:
    remains_immutable_while_new_version_builds: true
  questions:
    multiple_parallel:
      allowed: true
  answer_commit:
    ordered_in_session_trace: true
# =====================================================================
# 62. IDEMPOTENCY
# =====================================================================
idempotency:
  compile_snapshot:
    same_sources_same_versions:
      same_digest_expected: true
  module_compile:
    same_snapshot_same_policy:
      same_semantic_digest_expected: true
  question_answer:
    exact_replay:
      not_guaranteed_if_judgment_model_changes
    source_provenance_required: true
  OpportunityHandoff:
    same_experience_same_request:
      idempotent: true
# =====================================================================
# 63. PROVENANCE
# =====================================================================
provenance:
  required_paths:
    CuratedExperienceSnapshot:
