# =====================================================================
# 59. FAILURE MODES
# =====================================================================
failure_modes:
  SOURCE_SNAPSHOT_STALE:
    behavior:
      - identify_materially_affected_modules
      - invalidate_minimum_scope
      - rebuild
      - re-QC
  MODULE_SOURCE_UNAVAILABLE:
    behavior:
      - hide_module_or_mark_unavailable
      - never_invent
  CURATOR_QUESTION_UNKNOWN:
    behavior:
      - state_uncertainty
      - do_not_hallucinate
  CAPABILITY_CHANGED:
    behavior:
      - rebuild_ExecutionConfidence
  FINANCIAL_ASSUMPTION_INVALIDATED:
    behavior:
      - invalidate_scenarios
      - rebuild
  PROTECTED_ASSET_UNAVAILABLE:
    behavior:
      - degrade_visualization
      - preserve_source_truth
  PRESENTATION_SURFACE_FAILS:
    delegate:
      - spec_21
  ACCESS_SESSION_FAILS:
    delegate:
      - spec_20
  OFFER_NOT_AVAILABLE:
    behavior:
      - OpportunityPrelude_may_not_fabricate_offer
# =====================================================================
# 60. DEGRADED MODES
# =====================================================================
degraded_modes:
