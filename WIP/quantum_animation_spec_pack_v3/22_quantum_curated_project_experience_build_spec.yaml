# =====================================================================
# 76. FINAL ARCHITECTURAL LAWS
# =====================================================================
final_architectural_laws:
  law_01: >
    ProofOfFilm creates desire; CuratedProjectExperience converts desire into understanding.
  law_02: >
    The project experience starts where ProofOfFilm leaves the viewer emotionally and cognitively.
  law_03: >
    Every layer must earn the next layer.
  law_04: >
    The CuratedProjectExperience is not a file repository.
  law_05: >
    Canonical source artifacts live backstage; the buyer experiences intentional representations.
  law_06: >
    Characters come before spreadsheets because people buy into experiences
    before they reason about downstream economics.
  law_07: >
    Character presentation should demonstrate reusable identity, not merely summarize plot.
  law_08: >
    World presentation should demonstrate a story engine, not an encyclopedia.
  law_09: >
    Theme should deepen meaning without explaining the movie to death.
  law_10: >
    Creative Vision tells the buyer what the finished work should feel like.
  law_11: >
    The basic Hook has no default module because ProofOfFilm should already have demonstrated it.
  law_12: >
    If the Hook must be explained after ProofOfFilm, repair ProofOfFilm.
  law_13: >
    Audience/Product Intelligence remains the authority for audience and product models.
  law_14: >
    Marketability remains the authority of ProofOfFilm spec 18 and is presented here as evidence.
  law_15: >
    Merchandise mockups demonstrate optionality and are explicitly conceptual.
  law_16: >
    Profitability matrices are scenarios, never guaranteed forecasts.
  law_17: >
    Execution confidence must come from current SelfModel and ProductionModel evidence.
  law_18: >
    Buyer-role adaptation changes sequence and depth, not truth.
  law_19: >
    A curator answer is only as strong as its source evidence.
  law_20: >
    Unknown is a valid answer. Fabrication is not.
  law_21: >
    The future Quantum Studio Avatar will embody the curator; it will not own the facts.
  law_22: >
    The buyer may leave the curated path whenever a higher-value question deserves attention.
  law_23: >
    Low-value modules should be omitted rather than filled with generic material.
  law_24: >
    Every buyer-visible experience pins exact source revisions.
  law_25: >
    A material source change invalidates only the minimum affected experience scope.
  law_26: >
    Protected project content remains behind Quantum Key access even when rendered on a large screen.
  law_27: >
    Curated exploration should satisfy some curiosity while increasing higher-order conviction.
  law_28: >
    The project experience ends not with "Contact us" but with a deliberate doorway:
    The Opportunity.
  law_29: >
    Binding commercial terms begin only after control passes to spec 23.
  law_30: >
    The desired terminal state is:
    "I know what this is. I understand why it matters. I believe they can deliver it.
    Show me the deal."
