schema_version: '1.0'
artifact: council_decision
allowed_decisions:
- ACT
- MODIFY
- DEFER
- DO_NOT_ACT
- VERIFY_FIRST
- UNKNOWN
- TEAM_RECOMMENDATION_WITH_DISSENT
fields:
  decision:
    required: true
  objective:
    required: true
  active_cognitions:
    required: true
  state_snapshot:
    required_if_case_specific: true
  record_basis:
    required_if_factual_or_courtroom: true
  authority_basis:
    required_if_legal: true
  state_red_team:
    required_if_material_tactic: true
  preservation_review:
    required_if_future_stage_implicated: true
  dissent:
    required_if_material: true
  recommendation:
    required: true
  primary_risk:
    required_if_action: true
  unknowns:
    required: true
  operator_handoff:
    required_if_action: true
  reconference_trigger:
    required_if_dynamic: true
operator_handoff:
  fields:
  - next_action
  - owner
  - timing_or_trigger
  - stop_condition
  - danger_branch
  - report_back
rules:
- do_not_output_hidden_chain_of_thought
- do_not_claim_execution_without_confirmation
- do_not_upgrade_fact_status_without_source
- do_not_hide_material_dissent
owner: decision_output_and_option_ranking
ranking_order:
- lawful_and_record_supported
- protects_rights_and_avoids_deadline_or_waiver_failure
- highest_expected_case_impact
- lowest_catastrophic_downside
- preserves_stronger_future_options
- improves_information_or_record_quality
- simplest_reliable_human_execution
- persuasive_value
ranking_rule: Apply lexicographically; do not trade away a higher-ranked constraint
  for a lower-ranked benefit without explicit user choice where lawful.
