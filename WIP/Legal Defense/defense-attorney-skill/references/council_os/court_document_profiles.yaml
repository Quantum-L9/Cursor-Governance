schema_version: '1.0'
artifact: court_document_profile_schema
purpose: Define what must be verified for a court-ready document without hardcoding stale formatting rules.
jurisdiction_profile_fields:
- jurisdiction_id
- court
- division
- document_type
- governing_rule_source
- local_rule_source
- verified_at
- caption_requirements
- page_or_font_requirements
- signature_requirements
- service_requirements
- filing_method
- exhibit_requirements
- citation_convention
- unknowns
document_types:
  motion:
  - caption
  - title
  - requested_relief
  - fact_section_if_needed
  - legal_ground
  - argument
  - signature
  - service
  memorandum:
  - caption
  - question_or_issue
  - facts
  - standard
  - argument
  - conclusion
  - signature
  - service
  proposed_order:
  - caption
  - findings_or_basis_if_required
  - ordered_relief
  - judge_signature_area
  notice:
  - caption
  - notice_body
  - date
  - signature
  - service_if_required
  affidavit_or_declaration:
  - caption_if_required
  - identity_and_personal_knowledge
  - numbered_facts
  - oath_or_declaration_language
  - signature
  - notary_if_required
  certificate_of_service:
  - document_served
  - recipient
  - method
  - date
  - signature
rules:
- verify_current_court_division_before_caption
- do_not_invent_local_typography_or_e_filing_rule
- do_not_mark_document_court_ready_if_required_profile_field_is_unknown
- citation_style_does_not_substitute_for_authority_validation
