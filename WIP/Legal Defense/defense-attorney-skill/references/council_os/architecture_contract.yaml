schema_version: '1.0'
contract_id: beylin_defense_council_architecture
version: '0.6.0-rc1'
purpose: Define one owner for every control-plane responsibility and prevent duplicate sources of truth.

precedence:
  - system_and_platform_requirements
  - user_latest_explicit_instruction
  - current_verified_primary_law_and_court_orders
  - verified_live_case_posture
  - case_state_contract
  - compiled_case_snapshot
  - council_operating_methods
  - presentation_preferences

control_plane_owners:
  pack_identity: agents/meta.yaml
  skill_entrypoint: SKILL.md
  architecture_and_ownership: references/council_os/architecture_contract.yaml
  status_semantics: references/council_os/status_contract.yaml
  task_classification_intensity_and_cognition_selection: references/council_os/task_router.yaml
  leverage_preflight: references/council_os/leverage_gate.yaml
  cognition_reasoning_method: references/council_os/cognitive_engine.yaml
  execution_policy: references/council_os/execution_policy.yaml
  convergence_and_release_gate: references/council_os/convergence_gate.yaml
  team_roles_and_concern_boundaries: references/team/defense_council_charter.md
  specialist_registry: references/team/specialist_registry.yaml
  decision_output_contract: references/team/decision_contract.yaml
  human_execution_boundary: references/team/beylin_operator.md
  case_state_ownership: references/cases/26CR294791-170/case_state_contract.yaml
  compiled_case_snapshot: references/cases/26CR294791-170/compiled/index.yaml
  current_record_boundary: references/cases/26CR294791-170/record_boundary.yaml
  current_legal_authority_protocol: references/legal_research_protocol.md

ownership_rules:
  - one_control_plane_owner_per_responsibility
  - non_owner_files_may_reference_but_must_not_redefine_owner_policy
  - task_router_is_the_only_routing_authority
  - compiled_snapshot_is_immutable_until_explicit_recompile
  - dynamic_case_state_must_not_be_written_into_compiled_snapshot_silently
  - council_method_files_must_not_define_case_facts_deadlines_or_controlling_law
  - presentation_files_must_not alter_fact_law_procedure_or_record_status
  - chief_synthesis_must_not_create_new_facts_authority_or_source_status
  - human_only_actions_remain_human_only

communication_contract:
  sequence:
    - bind_task
    - bind_case_state_if_applicable
    - classify_task_and_intensity
    - route_minimum_sufficient_council
    - run_owning_cognitions
    - run_required_red_team_and_preservation_passes
    - run_convergence_gate_when_material
    - synthesize
    - handoff_to_human_if_execution_required
  prohibited_bypasses:
    - direct_advocacy_before_fact_law_procedure_evidence_checks_when_material
    - direct_case_fact_upgrade_without_record_or_source_event
    - direct_legacy_kernel_state_into_live_case_state
    - direct_secondary_source_override_of_primary_authority
    - direct_civil_method_activation_inside_criminal_core_without_explicit_task

source_of_truth_rules:
  case_facts_and_evidence:
    contract: references/cases/26CR294791-170/case_state_contract.yaml
  current_law:
    contract: references/authority_validation.md
  current_docket_and_orders:
    rule: live_verified_source_controls_snapshot
  routing:
    file: references/council_os/task_router.yaml
  statuses:
    file: references/council_os/status_contract.yaml

compatibility:
  raw_legacy_kernels_runtime_authority: false
  external_case_connector_runtime_dependency: false
  model_specific_runtime_dependency: false

fail_closed:
  - unresolved_owner_conflict
  - material_source_of_truth_conflict
  - material_status_dimension_ambiguity
  - material_currentness_unknown
  - required_human_action_claimed_as_completed_by_ai
