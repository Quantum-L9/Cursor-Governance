schema_version: '1.0'
artifact: procedure_event_model
purpose: Represent procedure as verified events and transitions rather than frozen narrative timelines.
event_fields:
- event_id
- phase
- trigger
- court_or_forum
- governing_authority
- authority_verified_at
- deadline_basis
- deadline_value
- available_actions
- waiver_risks
- record_objectives
- disclosure_cost
- future_effects
- required_sources
- status
- next_possible_events
transition_rules:
- current_docket_or_order_overrides_old_snapshot
- operative_charging_instrument_overrides_superseded_instrument
- deadline_must_carry_source_and_calculation_basis
- phase_change_invalidates_phase_specific_assumptions
- UNKNOWN_timing_or_forum_that_changes_action_requires_verification
output_fields:
- current_phase
- next_hard_event
- action_window
- rights_or_waiver_issue
- verification_needed
- downstream_effect
legal_rule: This model stores procedure architecture only. Substantive timing and requirements must come from the active verified
  authority layer.
