schema_version: '2.0'
router_id: defense_council_task_router
owner: task_classification_intensity_and_cognition_selection
purpose: Classify the requested job, choose intensity, and select the minimum sufficient council from one authoritative routing table.

confidence:
  auto_route_min: 0.80
  conservative_route_min: 0.50
  below_conservative: ASK_ONE_CLARIFYING_QUESTION_IF_RESULT_WOULD_MATERIALLY_CHANGE

intensity:
  RAPID:
    use_when:
      - low_stakes_organization
      - simple_nonmaterial_logistics
      - no_material_right_deadline_filing_or_tactic_turns_on_answer
    rule: activate_owning_cognitions_plus_chief_only
  STANDARD:
    use_when:
      - substantive_analysis_without_immediate_irreversible_act
    rule: activate_all_directly_implicated_cognitions_plus_chief
    state_red_team: required_if_tactic_or_legal_position_recommended
  FULL_COUNCIL:
    use_when:
      - filing
      - court_appearance
      - waiver_or_right
      - witness_examination
      - significant_evidentiary_choice
      - dispositive_argument
      - phase_transition
      - defense_theory_disclosure
    mandatory:
      - state_red_team
      - preservation_counsel
      - chief_synthesis
      - beylin_operator
  LIVE_COURTROOM:
    use_when:
      - immediate_live_court_development
    rule: activate_minimum_fast_council_then_emit_operator_handoff_only

high_stakes_overrides:
  FULL_COUNCIL:
    - filing
    - waiver_or_right
    - witness_examination
    - dispositive_argument
    - material_evidence_choice
    - defense_theory_disclosure
    - phase_transition
  LIVE_COURTROOM:
    - immediate_live_court_development

classes:
  fact_analysis:
    objective: reconstruct or compare factual record
    default_intensity: RAPID
    activate: [matlock_fact_method, evidence_counsel, chief_synthesis]
  new_document_or_report:
    objective: ingest and classify a new case source without silently changing case state
    default_intensity: STANDARD
    activate: [matlock_fact_method, evidence_counsel, chief_synthesis]
    add_if_legal_content: [nc_authority_counsel, procedure_architect]
  legal_research:
    objective: identify and validate governing authority
    default_intensity: STANDARD
    activate: [nc_authority_counsel, chief_synthesis]
    add_if_posture_sensitive: [procedure_architect]
    add_if_strategy_requested: [state_red_team, preservation_counsel]
  strategy_analysis:
    objective: rank case options, leverage, risk, and dependencies
    default_intensity: STANDARD
    activate: [matlock_fact_method, nc_authority_counsel, procedure_architect, evidence_counsel, state_red_team, preservation_counsel, chief_synthesis]
  probable_cause_strategy:
    objective: analyze or prepare the active probable-cause phase
    default_intensity: FULL_COUNCIL
    activate: [matlock_fact_method, nc_authority_counsel, procedure_architect, evidence_counsel, state_red_team, preservation_counsel, chief_synthesis, beylin_operator]
  document_review:
    objective: audit an existing instrument against facts, law, procedure, record, and strategy
    default_intensity: STANDARD
    activate: [matlock_fact_method, evidence_counsel, nc_authority_counsel, procedure_architect, chief_synthesis]
  motion_or_filing_draft:
    objective: produce an execution-ready-if-verified legal document
    default_intensity: FULL_COUNCIL
    activate: [matlock_fact_method, evidence_counsel, nc_authority_counsel, procedure_architect, state_red_team, preservation_counsel, courtroom_advocacy_counsel, chief_synthesis, beylin_operator]
  evidence_or_discovery:
    objective: analyze sources, gaps, production, preservation, chain, or evidentiary status
    default_intensity: STANDARD
    activate: [matlock_fact_method, evidence_counsel, procedure_architect, state_red_team, chief_synthesis]
  objection_or_evidence_issue:
    objective: analyze an evidentiary objection, foundation question, or admissibility issue
    default_intensity: FULL_COUNCIL
    activate: [evidence_counsel, nc_authority_counsel, procedure_architect, state_red_team, preservation_counsel, chief_synthesis, beylin_operator]
  cross_examination:
    objective: establish or impeach facts through controlled questioning
    default_intensity: FULL_COUNCIL
    activate: [matlock_fact_method, evidence_counsel, cross_examination_engineer, state_red_team, preservation_counsel, chief_synthesis, beylin_operator]
    add_if_legal_predicate: [nc_authority_counsel, procedure_architect]
  procedural_navigation:
    objective: identify forum, stage, timing, next event, waiver, or filing mechanics
    default_intensity: STANDARD
    activate: [procedure_architect, nc_authority_counsel, catawba_local_counsel, preservation_counsel, chief_synthesis]
  filing_or_deadline:
    objective: determine a filing mechanic or time-sensitive procedural action
    default_intensity: FULL_COUNCIL
    activate: [nc_authority_counsel, procedure_architect, catawba_local_counsel, preservation_counsel, state_red_team, chief_synthesis, beylin_operator]
  catawba_local_mechanics:
    objective: determine local courthouse, calendar, filing, or administrative mechanics
    default_intensity: STANDARD
    activate: [catawba_local_counsel, procedure_architect, chief_synthesis]
    add_if_right_or_deadline: [nc_authority_counsel, preservation_counsel, state_red_team]
  case_state_update:
    objective: apply a new docket, order, filing, evidence, or testimony delta
    default_intensity: STANDARD
    activate: [matlock_fact_method, procedure_architect, evidence_counsel, preservation_counsel, chief_synthesis]
  courtroom_argument_or_script:
    objective: convert verified analysis into words for court without changing substance
    default_intensity: FULL_COUNCIL
    activate: [matlock_fact_method, nc_authority_counsel, procedure_architect, evidence_counsel, state_red_team, preservation_counsel, courtroom_advocacy_counsel, chief_synthesis, beylin_operator]
  phase_transition:
    objective: update strategy and posture after indictment, ruling, dismissal, reduction, or other stage change
    default_intensity: FULL_COUNCIL
    activate: [nc_authority_counsel, procedure_architect, preservation_counsel, state_red_team, chief_synthesis, beylin_operator]
  post_ruling:
    objective: determine immediate consequences and next options after a ruling
    default_intensity: STANDARD
    activate: [procedure_architect, nc_authority_counsel, preservation_counsel, chief_synthesis, beylin_operator]
  live_courtroom:
    objective: compress verified analysis into immediate human execution
    default_intensity: LIVE_COURTROOM
    activate: [minimum_owning_cognitions, chief_synthesis, beylin_operator]
    add_if_material: [state_red_team]
  external_communication:
    objective: assess disclosure, admission, strategy, or preservation risk before communicating outside the defense workroom
    default_intensity: STANDARD
    activate: [preservation_counsel, state_red_team, chief_synthesis, beylin_operator]
  status_meta:
    objective: summarize current case state, unresolved gates, or next priority without changing state
    default_intensity: RAPID
    activate: [chief_synthesis]

routing_rules:
  - classify_semantically_not_by_keyword_count
  - explicit_user_goal_overrides_lexical_indicators
  - high_stakes_override_beats_default_intensity
  - route_narrowly
  - never_activate_every_seat_by_default
  - activate_courtroom_advocacy_only_for_presentation_tasks
  - activate_cross_engineer_only_for_witness_examination_or_answer_risk
  - activate_catawba_local_counsel_only_when_local_execution_matters
  - state_red_team_is_mandatory_for_material_tactics
  - preservation_counsel_is_mandatory_when_later_phase_can_be_affected
  - chief_synthesis_cannot_add_new_facts_or_authority
  - legacy_kernel_state_never_controls_current_case_state
  - one_clarifying_question_max_if_core_ambiguity_is_material

case_corpus:
  index: ../cases/26CR294791-170/compiled/index.yaml
  retrieval_map: ../cases/26CR294791-170/compiled/retrieval_map.yaml
  rule: when_personal_case_active_load_only_compiled_modules_required_by_task

pre_execution_leverage_gate: leverage_gate.yaml
material_quality_gate: convergence_gate.yaml
