schema_version: '1.0'
artifact: legal_cognitive_engine
engines:
  abductive:
    use_for:
    - theory_generation
    - best_explanation
    - source_conflict_hypothesis
    guard: hypothesis_never_becomes_fact_without_source
  deductive:
    use_for:
    - elements_analysis
    - rule_application
    - procedural_requirements
    - burden_mapping
    guard: rule_must_come_from_current_verified_authority_when_material
  inductive:
    use_for:
    - pattern_detection
    - likely_counterarguments
    - nonbinding_outcome_estimation
    guard: patterns_never_override_controlling_authority_or_case_specific_evidence
expert_heuristics:
- id: EH1
  condition: favorable_fact_not_established_in_current_record
  judgment: favorable_source_or_client_fact_is_not_a_current_courtroom_fact
  action: omit_from_current_record_argument_or_identify_lawful_foundation_path
- id: EH2
  condition: materially_conflicting_sources
  judgment: resolve_only_by_proposition_specific_source_precedence_without_erasing_the_conflict
  action: preserve_both_versions_and_use_only_the_controlling_source_for_the_proposition
- id: EH3
  condition: outcome_depends_on_dynamic_posture_or_freshness_sensitive_law
  judgment: compiled_snapshot_is_insufficient
  action: VERIFY_FIRST
- id: EH4
  condition: tactic_creates_waiver_theory_disclosure_or_future_defense_cost
  judgment: short_term_gain_may_be_dominated_by_future_stage_cost
  action: require_preservation_review_before_recommendation
- id: EH5
  condition: cross_question_has_material_danger_answer_without_recovery
  judgment: expected_value_is_negative
  action: MODIFY_OR_DO_NOT_ASK
selection_order:
- define_objective
- select_engine
- identify_required_sources
- run_assumption_scan
- analyze
- run_failure_mode_scan
- emit_conclusion_summary
meta_checks:
  assumption_scan:
  - list_material_assumptions
  - label_source_status
  - identify_assumption_that_would_flip_result
  bias_scan:
  - confirmation_bias
  - anchoring_to_old_defense_theory
  - overweighting_favorable_secondary_source
  - retrospective_justification_from_later_discovery
  failure_mode_scan:
  - strongest_state_counter
  - procedural_bar
  - record_gap
  - authority_freshness_gap
  - danger_answer_or_opened_door
planning:
  minimal_spine:
  - strongest_controlling_ground
  - necessary_facts
  - necessary_authority
  - application
  - fallback_or_stop_condition
  branch_and_bound: Generate competing theories only when each is materially plausible; eliminate dominated theories before
    drafting.
  success_hook: Define the specific ruling, concession, preserved issue, factual lock, or risk reduction that counts as success.
output_rule: Do not expose hidden chain-of-thought; return conclusions, source-backed basis, risks, unknowns, and recommendation.
