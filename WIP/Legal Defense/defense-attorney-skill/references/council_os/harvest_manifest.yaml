schema_version: '1.0'
artifact: legacy_legal_kernel_harvest_manifest
purpose: Record which reusable operating patterns were distilled into the Council OS and which stale or unverified content
  was explicitly rejected.
raw_legacy_files_bundled: false
runtime_dependency_on_legacy_pack: false
legacy_sources_count: 15
sources:
