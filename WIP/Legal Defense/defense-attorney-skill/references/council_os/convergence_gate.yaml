schema_version: '1.0'
artifact: legal_convergence_gate
purpose: Run concern-separated quality passes until no material defect remains or
  a blocker requires verification.
passes:
- id: Q1
  name: source_integrity
  checks:
  - all_material_facts_have_normalized_provenance_and_epistemic_status
  - question_specific_source_precedence_applied
  - source_conflicts_preserved
- id: Q2
  name: fact_record_boundary
  checks:
  - record_status_is_separate_from_source_or_epistemic_status
  - client_report_not_promoted_to_record_fact
  - later_discovery_not_backdated
  - privileged_intelligence_not_externalized_without_decision
- id: Q3
  name: authority_currentness
  checks:
  - material_rule_has_primary_authority
  - binding_status_and_scope_checked
  - freshness_sensitive_authority_verified_or_flagged
- id: Q4
  name: procedural_fitness
  checks:
  - current_phase_and_forum_fit_action
  - deadline_or_timing_has_source
  - waiver_and_disclosure_cost_assessed
- id: Q5
  name: adversarial_state_review
  checks:
  - strongest_state_counter_stated
  - harmful_facts_accounted_for
  - rehabilitation_or_fallback_considered
- id: Q6
  name: preservation_future_effect
  checks:
  - future_defense_or_review_not_sacrificed_silently
  - record_preservation_need_checked
  - phase_transition_effect_checked
- id: Q7
  name: artifact_completeness
  checks:
  - all_required_sections_present
  - no_stubs_or_fake_execution
  - exhibits_and_signatures_handled_correctly
- id: Q8
  name: execution_clarity
  checks:
  - operator_knows_exact_action
  - stop_condition_defined
  - danger_branch_or_reconference_trigger_defined_if_dynamic
failure_modes:
  source_status_collapse:
    detect: derivative_client_or_argument_material_is_being_used_as_if_primary_verified_or_record_established
    prevent: preserve_original_status_and_reject_promotion_without_required_source_or_record_event
  record_leakage:
    detect: courtroom_claim_relies_on_material_not_established_in_the_current_record
    prevent: omit_the_claim_or_identify_a_lawful_foundation_path_before_use
  hindsight_contamination:
    detect: later_discovered_evidence_is_being_used_to_justify_earlier_conduct
    prevent: freeze_the_factual_universe_at_the_legally_relevant_moment
  cognition_contamination:
    detect: one_seat_inference_is_becoming_shared_fact_through_repetition
    prevent: route_the_issue_to_the_owning_cognition_and_retain_the_original_status_until_resolved
  execution_fiction:
    detect: ai_output_claims_a_human_or_court_act_occurred_without_a_verified_event
    prevent: state_the_act_as_pending_requested_or_user_reported_until_verified
after_use_capture:
  trigger_only_when:
  - user_reports_a_wrong_fact_classification
  - user_reports_false_or_missed_activation
  - user_corrects_a_recurring_reasoning_error
  - output_required_material_manual_rework
  actions:
  - identify_the_smallest_existing_rule_route_or_guard_that_would_have_prevented_the_failure
  - propose_one_correction_candidate
  - preserve_current_case_state_and_skill_until_explicit_user_instruction
  prohibited:
  - silently_modify_case_state
  - silently_modify_skill
  - invent_runtime_telemetry_or_claim_learning_not_observed
convergence:
  repeat_failed_passes_until: NO_MATERIAL_DELTA_OR_VERIFICATION_BLOCKER
  hard_stop_for_filing_or_courtroom:
  - Q1
  - Q2
  - Q3
  - Q4
  on_unresolved_critical: VERIFY_FIRST
  do_not_deliver_false_green: true
output_rule: Do not dump QA transcript unless requested. Surface only material remaining
  flags and the decision they affect.
