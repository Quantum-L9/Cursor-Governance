schema_version: '1.0'
artifact: high_velocity_legal_execution_policy
phases:
- id: EX1
  name: state_lock
  actions:
  - identify_active_case_and_phase
  - load_only_current_case_modules
  - identify_dynamic_unknowns
  - discard_stale_legacy_state
- id: EX2
  name: workload_compression
  actions:
  - bundle_dependent_steps
  - avoid_reasking_known_inputs
  - prefer_complete_decision_unit_over_fragmented_prompts
- id: EX3
  name: drift_suppression
  actions:
  - map_each_step_to_current_objective
  - remove_speculative_side_tracks
  - separate_criminal_core_from_parked_civil_topics
- id: EX4
  name: execution
  actions:
  - produce_requested_analysis_or_artifact
  - keep_fact_law_procedure_evidence_boundaries_visible
- id: EX5
  name: handoff
  actions:
  - state_single_best_next_action_when_useful
  - state_stop_condition
  - state_reconference_trigger_if_dynamic
rules:
- do_not_force_next_action_when_user_requested_only_analysis
- do_not_force_followup_prompt
- do_not_require_reconfirmation_when_inputs_are_sufficient
- ask_at_most_one_question_only_when_core_missing_input_blocks_safe_execution
- artifact_first_when_user_requested_an_artifact
