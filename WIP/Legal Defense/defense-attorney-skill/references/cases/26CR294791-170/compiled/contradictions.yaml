- id: CC003
  topic: MDMA_weight
  source_a: older defense arithmetic using only 0.52 g + 0.67 g crystal portions for items 007/008
  source_a_position: 22.92 g itemized total
  source_b: SRC006 direct handwritten case notes
  source_b_position: items 007/008 approximately 2.56 g gross combined; 4.60 + 13.41 + 3.72 + 2.56 = 24.29
