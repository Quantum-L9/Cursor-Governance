- id: CC007
  topic: firearm_serial_description
  source_a: SRC006 lead/Foreman reports and evidence records
  source_a_position: State records identifier CNS4339MP340 yet Foreman reports the revolver serial was scratched
    off and could not be run.
  source_b: SRC020 charging text
  source_b_position: alleges removal/scratch marks on the firearm serial number with intent to conceal or misrepresent
    identity
  status: STATE_INTERNAL_IDENTIFICATION_ISSUE
  handling: Do not infer whether CNS4339MP340 is the statutory serial number, model/other marking, or a transcription
    artifact. Require original firearm/photo evidence and element-specific analysis.
