schema_version: '2.0'
case_id: 26CR294791-170
contract: case_state_contract.yaml
status_contract: ../../council_os/status_contract.yaml
objective: prevent_private_or_compiled_knowledge_from_becoming_fake_current_courtroom_record

core_rule: Knowledge available to the council is not automatically part of the current proceeding record.

record_status_rules:
  NOT_IN_CURRENT_RECORD:
    may_use_for: [investigation, planning, cross_design, verification_targets]
    may_assert_as_current_record_fact: false
  RECORD_ESTABLISHED:
    may_use_for: [argument, synthesis, planning]
  ADMITTED_EVIDENCE:
    may_use_for: [argument, synthesis, planning]
  TESTIMONY_ESTABLISHED:
    may_use_for: [argument, impeachment, synthesis, planning]
  STIPULATED:
    may_use_for: [argument, synthesis, planning]
  JUDICIALLY_NOTICED:
    may_use_for: [argument, synthesis, planning]
  RECORD_STATUS_UNKNOWN:
    may_assert_as_current_record_fact: false
    action: VERIFY_FIRST

provenance_guardrails:
  USER_FIRSTHAND_REPORT:
    default_record_status: NOT_IN_CURRENT_RECORD
    may_form_good_faith_question_target: true
  DEFENSE_EVIDENCE_AUDIT:
    default_record_status: NOT_IN_CURRENT_RECORD
    may_use_for_planning: true
  DERIVATIVE_FORENSIC_MEDIA_ANALYSIS:
    default_record_status: NOT_IN_CURRENT_RECORD
    may_use_for: [cross_design, impeachment_targeting, source_verification]
    direct_observation_claim_prohibited_without_original_media_or_record_basis: true
  OFFICIAL_COURT_RECORD:
    planning_use: true
    courtroom_use_requires_proper_record_basis_or_judicial_notice: true
  OFFICIAL_FORENSIC_LAB:
    planning_use: true
    courtroom_use_requires_report_testimony_or_other_proper_basis: true
  PRIVILEGED_CLIENT_INTELLIGENCE:
    default_record_status: NOT_IN_CURRENT_RECORD
    automatic_externalization: false

probable_cause_hearing_rules:
  closing_argument:
    allowed_record_statuses:
      - RECORD_ESTABLISHED
      - ADMITTED_EVIDENCE
      - TESTIMONY_ESTABLISHED
      - STIPULATED
      - JUDICIALLY_NOTICED
    also_allowed:
      - controlling_law
      - proper_inferences_from_current_record
    prohibited_as_established_fact:
      - uncorroborated_client_or_affidavit_fact_not_in_record
      - compiled_snapshot_fact_not_put_before_court
      - anticipated_media_content_not_admitted_or_testified_to
      - assumed_lab_result
      - derivative_media_finding_not_in_current_record
      - privileged_client_intelligence
  cross_examination:
    good_faith_nonrecord_fact_may_form_question_target: true
    question_does_not_make_proposition_true: true
    witness_answer_may_update_record_status: true
  after_each_witness_or_evidence_event:
    action: update_record_status_before_argument

update_rule:
  preserve_provenance_when_record_status_changes: true
  never_upgrade_epistemic_status_merely_because_a_witness_asserted_the_fact: true
  contradictory_testimony_creates_conflict_not_automatic_supersession: true
