      explicit authorization.
    source_refs:
    - SRC-0005
    materiality: material
    confidence: high
    rationale: 'The primary objective is to complete and prove two deterministic, repeatable data-ingestion
      workflows: CieTrade → Odoo and VanillaSoft → Odoo. Both must be safe to rerun, reconcile source
      records to resulting Odoo state, expose a single canonical repository-supported command, fail closed
      on material errors, and produce machine-readable execution summaries. Do not perform production
      imports, production database mutations, pushes, or merges without explicit authorization.'
