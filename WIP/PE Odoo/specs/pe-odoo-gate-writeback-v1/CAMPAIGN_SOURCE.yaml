    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  objective: Dual-switch Gate auto-writeback, fail-closed EIE/CEG mapping, manual Gate Inject from review, write-boundary
    allowlist, contract tests, and scoped module version bumps. EIE, CEG, and Gate_SDK stay unchanged.
  problem_statement: 'The source brief targeted closed/merged PR #156 on fix/gate-writeback-match-converge. Current Staging
    still has a single-flag gate_auto_writeback_enabled() and no plasticos.gate.auto_writeback_operator_approved seed. An
    old database with auto_writeback=1 can still enable automatic partner writes.'
  target_state: auto_writeback AND operator_approved are both required for automatic writeback; missing EIE state is never
    status ok; CEG eligible is not True is never actionable; review-state Gate runs write allowlisted empty partner fields
    only after Inject; tests assert the new contract; module versions reflect the finished behavior. Gate_SDK, EIE, and CEG
    are unchanged.
  scope:
    include:
    - plasticos_gate/services/gate_config.py
    - plasticos_gate/data/gate_icp_seed.xml
    - plasticos_gate/services/gate_mappers.py
    - plasticos_gate/services/gate_allowlists.py
    - plasticos_gate/__manifest__.py
    - plasticos_enrichment/models/enrichment_run.py
    - plasticos_enrichment/tests/test_gate_enrichment_fallback.py
    - plasticos_enrichment/__manifest__.py
    - tests/test_gate_match_contract.py
    exclude:
    - EIE source tree
    - CEG source tree
    - Gate_SDK source tree
    - pipeline_v2.py
    - production database mutation
    - remote push
    - merge
    - deploy
  authority_order:
  - applicable_safety_legal_security_requirements
  - cursor_governance_canonical_law
  - latest_explicit_operator_instruction
  - accepted_program_decision
  - approved_task_card
  - repository_local_governance
  - implementation
  - documentation
  operating_rules:
  - source_is_immutable_after_intake
  - targets_array_is_the_single_repository_identity
  - dependency_edges_are_the_only_task_ordering_authority
  - writable_paths_are_explicit
  - validation_commands_are_single_admissible_shell_operations
  - remote_actions_are_forbidden_in_program_execution
  - do_not_reopen_merged_pr_156
  - branch_from_current_Staging_after_inspect
  - bump_versions_last_after_behavior_and_tests
  - do_not_change_existing_auto_writeback_default_back_to_1
  terminal_verdicts:
  - CONVERGED
  - CONVERGED_WITH_NON_BLOCKING_RISKS
  - NOT_CONVERGED
  - INCONCLUSIVE
