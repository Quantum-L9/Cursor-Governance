operator_directive:
  objective: On cryptoxdog/IB-Odoo_19, make Gate CRM writeback fail-closed unless both plasticos.gate.auto_writeback and plasticos.gate.auto_writeback_operator_approved
    are true; fail closed on missing EIE state and non-explicit CEG eligibility; let operators approve a stored Gate proposal
    via the existing Inject action; re-enforce the partner writeback allowlist at the database-write boundary; update tests
    to the new contract; bump only plasticos_gate and plasticos_enrichment after behavior and tests are in place. Do not touch
    EIE, CEG, or Gate_SDK.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
  - read_only_inspection
  - blueprint_materialization
  - reversible_repo_local_work
  - local_validation
  pause_only_for:
