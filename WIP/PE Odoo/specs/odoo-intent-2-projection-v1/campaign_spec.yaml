  name: Odoo Intent 2 — Canonical snapshot and projection foundation
  version: 1.0.0
  owner: Quantum AI Partners
  definition_status: ready
  snapshot_at: '2026-09-14T19:34:18+00:00'
  objective: 'Implement the architecture stated in Odoo Intent 2 — Canonical snapshot and projection foundation:
    Odoo MUST remain the authoritative operational and canonical business system.; Everything downstream
    of Odoo—including semantic documents, temporal episodes, structural graphs, analytical signals, vector
    stores, graph databases, agents,…; Establish one coherent contract hierarchy and document supersession
    where required.; conditional minItems constraints that fail to make arrays required'
  problem_statement: cryptoxdog/IB-Odoo_19 does not yet satisfy the architecture recorded in odoo-intent-2-projection.md
    (sha256 503d84358528). The source states 29 material obligations that current behavior does not fully
    honor; the difference between them is this program's work.
  target_state: Every material obligation in the architecture source is implemented, validated by a repository-native
    command or inspection, and traceable to the source unit that states it. 29 obligations are in scope.
  scope:
    include:
    - Preserve useful existing repository contracts rather than replacing them simply because the recovered
      schemas are newer or more detailed.
    - 'Preserve:'
    - Preserve the machine-first execution contract for future matching runs.
    - Preserve candidate economics, routes, processing legs, evidence gaps, gates, margin, and next actions.
    - Preserve governed reverse-flow learning.
    - First implement or reuse the reliable Odoo-local outbox/projection boundary.
    - 'TASK-001: Resolve open questions: Phase 8 — Implement reliable projection/outbox s'
    - 'TASK-002: Architectural intent'
    - 'TASK-003: Phase 2 — Recover and converge the v2 contract candidate set'
    - 'TASK-004: Phase 3 — Repair schema correctness before adoption'
    - 'TASK-005: Phase 4 — Establish canonical identity semantics'
    - 'TASK-006: Phase 5 — Implement the Canonical Snapshot compiler'
    - 'TASK-007: Phase 6 — Implement Evidence Records'
    - 'TASK-008: Phase 7 — Implement Temporal Episodes'
    - 'TASK-009: Phase 8 — Implement reliable projection/outbox semantics'
    - 'TASK-010: Phase 9 — Semantic document projection'
    - 'TASK-011: Phase 10 — Structural graph projection'
    - 'TASK-012: Phase 11 — Packet contract'
    - 'TASK-013: Phase 12 — Explicitly defer opportunity and matching implementation'
    - 'TASK-014: Phase 13 — Security and authority'
    - 'TASK-015: Phase 14 — Determinism and replay'
    - 'TASK-016: Program invariants'
    exclude:
    - DEFERRED
    - Do not implement the matching engine, transaction-candidate execution, future CRM integrations,
      or vendor-specific memory infrastructure in this program.
    - Do not allow memory providers, graph providers, event transports, external workers, agents, or analytical
      services to become an independent canonical authority.
    - Do not rebuild mechanisms that already exist and are correct.
    - Do not maintain two competing authoritative contract definitions for the same concept.
    - schema references whose relative paths do not resolve
    - Do not allow downstream consumers to construct canonical truth by arbitrarily querying Odoo tables.
    - Evidence MUST NOT silently mutate canonical Odoo business truth.
    - Repeated ingestion of the same source event must not create duplicate episodes.
    - Do not bind this contract to VanillaSoft or any particular communications provider.
    - Do not directly update external vector databases, graph databases, or remote intelligence services
      inside Odoo business transactions.
    - External projection failure MUST NOT roll back already-valid canonical Odoo business state.
    - Do not choose or tightly couple the architecture to a specific vector database or embedding provider
      unless the repository already has an approved provider…
    - A graph provider must never become the canonical holder of an organization, facility, material,
      opportunity, or commercial relationship.
    - Do not make Neo4j, Neptune, Memgraph, or any other graph technology a permanent domain dependency
      unless such a provider is already an approved infrastructure…
    - Packets do not grant authority simply because an agent or service emitted them.
    - They may be corrected, tested, versioned, and documented in this program, but their runtime engines
      MUST NOT be implemented unless required only to prove…
    - Analytical or agent-generated improvement suggestions may propose changes but MUST NOT directly
      mutate canonical policy, taxonomy, capability, workflow, or…
    - Do not project sensitive source fields blindly.
    - prohibited consumers/topics where supported
    - Credentials MUST never enter semantic documents, vector embeddings, temporal episodes, graph projections,
      packets, logs, or analytical datasets.
    - Clean rebuild must not require manual repair.
    - Do not log sensitive projected content unnecessarily.
    - Odoo integer IDs do not become external global identities.
    - Do not prematurely introduce infrastructure
    - Do not introduce Kafka, NATS, SQS, Redis Streams, or another event bus merely for architectural
      completeness.
    - Do not choose a vector database merely to complete this program.
    - Do not choose a graph database merely to complete this program.
    - 'Forbidden without explicit authorization:'
    - 'The implementation MUST NOT:'
    - provider failures do not corrupt Odoo authoritative state
    - Do not report this program complete unless deterministic replay and a clean nonproduction projection
      rebuild have actually passed.
    - remote mutation
    - merge
    - deploy
