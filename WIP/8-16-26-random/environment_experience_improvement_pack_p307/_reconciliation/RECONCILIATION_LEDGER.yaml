  rationale:
    classification: usage_defect_enabled_by_environment
    statement: l4_local.py derives the branch from its process working directory. Run from the governance clone it inspects
      that clone (branch main) instead of the target repository, and refuses. The tool lives in one tree and must act on another,
      with nothing in the invocation making that explicit.
    proof:
    - cwd=/root/.cursor-governance -> workspace reported as /root/.cursor-governance, branch main, refused
    - cwd=/home/user/l9-meta-injector -> workspace /home/user/l9-meta-injector, branch claude/..., accepted
