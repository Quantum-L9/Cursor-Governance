  pattern: Bootstrap lacks an ownership boundary
  evidence:
  - CF-002
  - CR-001
  - CR-005
  - CR-013
  implication: Projection, receipts, and stop hooks need explicit ownership/freshness semantics.
- id: XP-03
  pattern: Environment authority is fragmented
  evidence:
  - CF-003
  - CF-010
  - CR-008
  - CR-014
  implication: Interpreter, variables, and authority-sensitive settings need one traceable source/resolution path.
- id: XP-04
  pattern: Governance contracts can name unavailable mechanisms
  evidence:
  - CF-011
  - CR-003
  - CR-012
  implication: Rules should bind to capability/consumer contracts and surface unsupported mechanisms before execution.
- id: XP-05
  pattern: Session continuity evidence is weak
  evidence:
  - CF-005
  - CR-004
  - CR-011
  implication: Memory and notifications need task-bearing, freshness-stamped state rather than generic resume cues.
- id: XP-06
  pattern: Safety gates are valuable but ergonomically opaque
  evidence:
  - CF-009
  - CR-009
  implication: Preserve fail-closed semantics while improving diagnostics, literal scoped actions, and authorized escape reachability.
