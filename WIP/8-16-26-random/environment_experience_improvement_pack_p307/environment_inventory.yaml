  - P9
- surface: github_transport
  finding: gh/REST availability and GraphQL reachability are independent; GraphQL-backed PR/auth paths are repeatedly blocked
    even when REST works. Token validity itself varies by session.
  sources:
  - P1
  - P3
  - P4
  - P6
  - P7
  - P8
  - P9
- surface: bootstrap
  finding: Rules/skills/settings can report READY while other components are DEGRADED; receipt freshness and projection ownership
    are recurring failure surfaces.
  sources:
  - P1
  - P3
  - P4
  - P6
  - P7
  - P8
  - P9
- surface: toolchain
  finding: System Python/PATH and project interpreter/toolchain frequently differ; later images can contain the full CLI set
    while the repo remains non-importable until the project env is resolved.
  sources:
  - P2
  - P3
  - P4
  - P5
  - P7
  - P8
  - P9
- surface: memory
  finding: Graphiti transport health, writeback success, and hydration usefulness must be represented separately; aggregate
    memory labels are not reliable enough.
  sources:
  - P1
  - P4
  - P6
  - P7
  - P9
- surface: guardrails
  finding: Destructive/staging gates are intentionally fail-closed but their literal-target rules, escape reachability, and
    error detail repeatedly impose friction.
  sources:
  - P1
  - P3
  - P4
  - P7
  - P8
  - P9
