# SonarCloud project config for Quantum-L9/Cursor-Governance
# Project key matches the GitHub-bound SonarCloud project.
sonar.projectKey=Quantum-L9_Cursor-Governance
sonar.organization=quantum-l9
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Residual LLM/CLI path-escape FPs (S8707/S2083 class). Automatic Analysis still
# indexes these paths; exclusions document intent + help CI-based scanners.
#   environment/agents/tools/          — PR #25 (see environment/agents/docs/SONAR-FP-PATH-ESCAPE.md)
#   skills/l9-cli-optimization/scripts/ — PR #36 (successor to optimize-cli-pr-pack; see skill docs)
#   autonomy/cli_fs.py                 — Wave CLI argv path readers (under_root + open)
# Revisit when Sonar recognizes the under_root sanitizer. Do not use NOSONAR.
sonar.exclusions=**/environment/agents/tools/**,**/skills/l9-cli-optimization/scripts/**,**/autonomy/cli_fs.py

# Narrow rule ignore for residual S8707 on CLI argv path readers after under_root.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=**/autonomy/cli_fs.py
