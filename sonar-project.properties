# SonarCloud project config for Quantum-L9/Cursor-Governance
# Project key matches the GitHub-bound SonarCloud project.
# CI-based scanners read this file. Automatic Analysis reads
# .sonarcloud.properties (keep source roots + exclusions in lockstep).
sonar.projectKey=Quantum-L9_Cursor-Governance
sonar.organization=quantum-l9
sonar.sources=ops,skills,environment,commands,rules,tests,tools,kernels,learning,hooks
sonar.sourceEncoding=UTF-8

# Residual LLM/CLI path-escape FPs (S8707/S2083/S6350/S6096 class). Exclusions +
# multicriteria document intent for CI-based scanners. Do not use NOSONAR.
# Automatic Analysis: see .sonarcloud.properties (AA ignores this filename).
#   environment/agents/tools/          — PR #25
#   skills/l9-cli-optimization/scripts/ — PR #36
#   environment/program-execution/core/ — PR #55 sealed PE templates (instantiate/
#     validate CLIs with under_root + argv validation; residual taint remains)
# WIP/** is draft corpus tracked for humans; exclude from analysis + CPD so
# duplicated kernel drafts do not fail PR quality gates (see PR #95).
# _archived/** and *_-deprecated/ are retired trees kept for history, not the
# maintained surface: skills/_archived/README.md states retired packs must not
# sit under the live discovery root, and no live code references any of them.
# Analysing them reported defects in code nobody may change (see PR for the
# 21-finding breakdown).
sonar.exclusions=**/environment/agents/tools/**,**/skills/l9-cli-optimization/scripts/**,**/environment/program-execution/core/**,**/_archived/**,**/*-deprecated/**,WIP/**,**/WIP/**
sonar.cpd.exclusions=WIP/**,**/WIP/**

sonar.issue.ignore.multicriteria=pe1,pe2,pe3,pe4
sonar.issue.ignore.multicriteria.pe1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pe1.resourceKey=**/environment/program-execution/core/**
sonar.issue.ignore.multicriteria.pe2.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.pe2.resourceKey=**/environment/program-execution/core/**
sonar.issue.ignore.multicriteria.pe3.ruleKey=pythonsecurity:S6350
sonar.issue.ignore.multicriteria.pe3.resourceKey=**/environment/program-execution/core/**
sonar.issue.ignore.multicriteria.pe4.ruleKey=pythonsecurity:S6096
sonar.issue.ignore.multicriteria.pe4.resourceKey=**/environment/program-execution/core/**
