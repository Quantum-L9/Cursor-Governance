# SonarCloud project config for Quantum-L9/Cursor-Governance
# Project key matches the GitHub-bound SonarCloud project.
sonar.projectKey=Quantum-L9_Cursor-Governance
sonar.organization=quantum-l9
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Residual LLM/CLI path-escape FPs (S8707/S2083 class). Automatic Analysis still
# indexes these paths; exclusions document intent + help CI-based scanners.
#   environment/agents/tools/          — PR #25 (see environment/agents/docs/SONAR-FP-PATH-ESCAPE.md)
#   skills/l9-cli-optimization/scripts/ — PR #36 (successor to optimize-cli-pr-pack; see skill docs)
#   autonomy/io.py + golden_trace.py   — Wave 1–3 under_root sanitizer (same S8707 residual class)
# Revisit when Sonar recognizes the under_root sanitizer. Do not use NOSONAR.
sonar.exclusions=**/environment/agents/tools/**,**/skills/l9-cli-optimization/scripts/**,**/autonomy/io.py,**/autonomy/validation/golden_trace.py

# Narrow rule ignore for the residual S8707 sinks after under_root (join+realpath+commonpath).
# Matches the approach used for pythonsecurity:S870* path rules when sanitizer is not recognized.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=**/autonomy/io.py
sonar.issue.ignore.multicriteria.e2.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e2.resourceKey=**/autonomy/validation/golden_trace.py
