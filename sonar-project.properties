# SonarCloud project config for Quantum-L9/Cursor-Governance
# Project key matches the GitHub-bound SonarCloud project.
sonar.projectKey=Quantum-L9_Cursor-Governance
sonar.organization=quantum-l9
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Residual LLM/CLI path-escape FPs (S8707/S2083 class). Automatic Analysis still
# indexes these paths; exclusions document intent + help CI-based scanners.
#   environment/agents/tools/          — PR #25 (see environment/agents/docs/SONAR-FP-PATH-ESCAPE.md)
#   skills/l9-cli-optimization/scripts/ — PR #36 (successor to optimize-cli-pr-pack; see skill docs)
# Revisit when Sonar recognizes under_root sanitizers. Do not use NOSONAR.
sonar.exclusions=**/environment/agents/tools/**,**/skills/l9-cli-optimization/scripts/**
