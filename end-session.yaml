---
# === L9 GOVERNANCE RUNTIME ===
runtime: "L9 Governance"
version: "11.0.0"
component_name: "Session End Protocol"
layer: "intelligence"
domain: "workspace_management"
enforcement_level: active
type: "executable_protocol"
status: "active"
created: "2026-01-07T00:00:00Z"
updated: "2026-11-14T00:00:00Z"
author: "Igor Beylin"
maintainer: "Igor Beylin"
sister_file: "ops/hooks/session_start_bootstrap.sh"
execution_mode: "automatic_with_manual_repair"
---

# SESSION END PROTOCOL v3.0
# Every session closes automatically on both hosts. /end-session repairs a
# close that did not land. Nothing on session end stages, commits or pushes
# (CANONICAL_LAW §5.1). Authority: CANONICAL_LAW §5.1 / §8.6 / §8.9,
# ADR-0028 (amended 2026-09-07), ADR-0030, ADR-0031, ADR-0032.

# ═══════════════════════════════════════════════════════════
# TRIGGERS
# ═══════════════════════════════════════════════════════════
triggers:
  cursor_session_end:
    type: cursor_hook
    event: sessionEnd
    enabled: true
    fail_open: true
    template: "$GLOBAL_COMMANDS/ops/hooks/hooks.json.template"
    installed_by: "$GLOBAL_COMMANDS/ops/scripts/setup_workspace_symlinks.sh"
    runs:
      - "ops/hooks/graphiti-session-end.sh -> ops/graphiti/hydration/close_session.py (surface cursor-session-end)"
      - "ops/hooks/session_end_governance_backup.sh -> ops/scripts/session_end_preserve.py (authored paths -> refs/l9/preserved/session/<sid>)"
    pushes: false

  claude_session_end:
    type: claude_code_hook
    event: SessionEnd
    enabled: true
    fail_open: true
    timeout_seconds: 60  # host cap; the default SessionEnd budget is 1.5 s
    template: "environment/agents/adapters/claude-code/settings.template.json"
    runs:
      - "environment/agents/adapters/claude-code/hooks/session_end_close.py: preserve first, then close_session (surface claude-session-end)"
    pushes: false

  authored_path_ledger:
    description: "Feeds the preserve. Session-scoped; never porcelain (rules/49 item 8)."
    ledger: "$HOME/.cursor/l9/sessions/<session_id>/authored.json"
    writers:
      - "Cursor postToolUse + afterShellExecution -> ops/hooks/session_authored_paths.py"
      - "Claude PostToolUse (Write|Edit|MultiEdit|NotebookEdit) -> session_authored_paths_wrap.py"

  close_gap_visibility:
    description: "The next SessionStart reads the prior session's close receipt locally (no memory call) and prints CLOSE_GAP <reason> + REPAIR: /end-session."
    cursor: "ops/hooks/session_start_memory_orchestrator.sh"
    claude: "environment/agents/adapters/claude-code/hooks/memory_prefetch.py"

  end_session_repair:
    type: slash_command
    command: "/end-session"
    command_file: "commands/end-session.md"
    skill: "skills/l9-end-session/SKILL.md"
    when: "SessionStart printed CLOSE_GAP, or the automatic close failed"
    pushes: false

# ═══════════════════════════════════════════════════════════
# CLOSE SEMANTICS
# ═══════════════════════════════════════════════════════════
close_semantics:
  idempotency: "per transcript head — an identical head is idempotent_skip"
  resume: "a resumed conversation has a new head; its close supersedes the session's previous continuation (exactly one stays ACTIVE)"
  identity: "derived from host markers (ops/memory/agent_identity.py); never configured"
  resume_ssot: "canonical continuation record (ContinuationCapsuleV2) via python -m ops.memory.cli hydrate"

# ═══════════════════════════════════════════════════════════
# REPAIR (/end-session)
# ═══════════════════════════════════════════════════════════
phase_1_repair_continuation:
  name: "Repair the continuation record"
  required: true
  command: |
    GOV="$HOME/.cursor-governance"; PY="$GOV/.venv/bin/python"
    WS="${CURSOR_PROJECT_DIR:-${CLAUDE_PROJECT_DIR:-$(pwd)}}"
    SID="$("$PY" -c 'import json,sys; print(json.load(open(sys.argv[1])).get("session_id") or "")' "$WS/.l9/memory/previous_opened.json")"
    (cd "$GOV" && PYTHONPATH="$GOV" "$PY" -m ops.memory.cli health --workspace "$WS")
    (cd "$GOV" && PYTHONPATH="$GOV" "$PY" -m ops.graphiti.hydration.cli repair-write \
      --project-dir "$WS" --session-id "$SID" --objective "{TASK}" --next "{NEXT}")
  notes:
    - "repair-write writes the continuation AND stamps the close receipt; ops.memory.cli write does neither"
    - "no --agent-id / L9_MEMORY_AGENT_ID: a configured identity that differs from the derived one is refused"
    - "a receipt already closed_canonically is skipped unless --supersede"

phase_2_lessons:
  name: "Durable lessons (optional)"
  required: false
  command: |
    # Arguments built by the contract builder (l9.agent_memory_write.v1),
    # passed unchanged to MCP memory.write_agent on l9-graphite-memory.
    (cd "$GOV" && PYTHONPATH="$GOV" "$PY" -m ops.memory.agent_write build \
      --namespace "{namespace from ops.memory.cli resolve}" --class insight \
      --content "{one terse fact}" --tag "{topic}")
  notes:
    - "one atomic fact per write (ADR-0037)"
    - "memory.phase_lock -> memory.write_governed only for a conflict-sensitive fact"

phase_3_handoffs:
  name: "Handoffs (only after a publication)"
  required: false
  command: |
    "$PY" "$GOV/ops/autonomy/session_debt.py" handoff --workspace "$WS" \
      --pr {PR} --objective "{TASK}" --status "{STATUS}" --next "{NEXT}"
    (cd "$GOV" && PYTHONPATH="$GOV" "$PY" -m ops.reports.publish handoffs --workspace "$WS")

phase_4_report:
  name: "Report"
  required: true
  output_template: |
    ## Session close repaired
    - session: {SID} — receipt {status} (write_count {n})
    - lessons written: {count}
    - handoffs: {delivered | not applicable}

# ═══════════════════════════════════════════════════════════
# RETIRED — never part of session end
# ═══════════════════════════════════════════════════════════
retired:
  - item: "governance backup push (git add -A + git push of the SSOT)"
    why: "session end does not push (CANONICAL_LAW §5.1); rules/49 forbids git add -A; publication is make pr. /governance-backup stays an explicit operator action."
  - item: "PICKUP records / --kind pickup_context"
    why: "provider-era format; stamps no close receipt, so a close-gap stays open"
  - item: "Redis cache_set_session_context"
    why: "not a resume layer; the continuation record is the resume SSOT"
  - item: "memory-bank/"
    why: "retired 2026-08-11"
  - item: "configured agent identity (--agent-id cursor / L9_MEMORY_AGENT_ID=cursor)"
    why: "identity is derived; a configured value is refused as drift"
