# Scratch / reference trees are git-visible but must never block or be
# reformatted by pre-commit (local make pr, CI, or --all-files). Keep in sync
# with ops/scripts/resolve_changed_files.sh SCRATCH_PREFIXES and
# ops/scripts/run_pr_security.sh EXCLUDE_PREFIXES.
exclude: '(^|/)(_?archive(d)?/|WIP/|current_work/|C_GOV_FILES/|reports/|workflows/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: no-hardcoded-paths
        name: No hardcoded /Users or /home paths (governance SSOT path contract)
        entry: bash ops/scripts/validate_governance_no_hardcoded_paths.sh
        language: system
        pass_filenames: false

      - id: symlinks-check
        name: Governance symlink wiring is healthy
        entry: bash ops/scripts/validate_governance_symlinks.sh
        language: system
        pass_filenames: false

      # Commit-time heal. make pr SKIPs this hook and runs sync in run_pr_gate
      # with WARN+continue so digest churn never blocks the PR gate.
      - id: sync-generated-artifacts
        name: Sync generated manifests, registries, and overrides
        entry: python3 ops/scripts/sync_generated_artifacts.py --force
        language: system
        files: ^(rules/|skills/|commands/|environment/claude-code/|environment/program-execution/)
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin must match requirements.txt / l9-ci-sdk ruff==0.16.0 (sdk wins over core).
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
