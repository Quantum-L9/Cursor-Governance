# Scratch / reference trees are git-visible but must never block or be
# reformatted by pre-commit (local make pr, CI, or --all-files). Keep in sync
# with ops/scripts/resolve_changed_files.sh SCRATCH_PREFIXES and
# ops/scripts/run_pr_security.sh EXCLUDE_PREFIXES.
exclude: '(^|/)(_?archive(d)?/|WIP/|current_work/|C_GOV_FILES/|reports/|workflows/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: no-hardcoded-paths
        name: No hardcoded /Users or /home paths (governance SSOT path contract)
        entry: bash ops/scripts/validate_governance_no_hardcoded_paths.sh
        language: system
        pass_filenames: false

      - id: symlinks-check
        name: Governance symlink wiring is healthy
        entry: bash ops/scripts/validate_governance_symlinks.sh
        language: system
        pass_filenames: false

      # Autofix: rewrite RULES-MANIFEST.{json,yaml,md} from rules/*.mdc.
      # pre-commit fails once if files changed — stage the manifests and re-run.
      - id: generate-rules-manifest
        name: Regenerate rules manifests from rules/*.mdc
        entry: python3 ops/scripts/generate_rules_manifest.py
        language: system
        files: ^rules/
        pass_filenames: false

      # Autofix: rewrite environment/claude-code/generated/skill-registry.json
      # from skills/AUTONOMY_MANIFEST.yaml + skills/*/SKILL.md frontmatter.
      - id: generate-claude-skill-registry
        name: Regenerate Claude skill registry from skills SSOT
        entry: python3 ops/scripts/build_claude_skill_registry.py
        language: system
        files: ^(skills/|environment/claude-code/generated/skill-registry\.json)
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin must match requirements.txt / l9-ci-sdk ruff==0.16.0 (sdk wins over core).
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
