# Scratch / reference trees are git-visible but must never block or be
# reformatted by pre-commit (local make pr, CI, or --all-files). Keep in sync
# with ops/scripts/resolve_changed_files.sh SCRATCH_PREFIXES and
# ops/scripts/run_pr_security.sh EXCLUDE_PREFIXES.
# `workflows/` is anchored to the repo ROOT only (^workflows/) so the generic
# scratch exclusion never swallows .github/workflows/** (P1-10).
exclude: '(^|/)(_?archive(d)?/|WIP/|current_work/|C_GOV_FILES/|reports/)|^workflows/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        # Committed dist/ is tsc output, verified byte-identical by the consumer's
        # own check:dist gate. tsc emits no trailing newline, so appending one here
        # makes that gate fail and the rewrite can never be committed clean.
        # Hash-anchored compiled plan packs under docs/plans/claude-code/<pack>/
        # are the same class: MANIFEST.yaml and kernel_pass hash exact bytes
        # (Quantum-L9/Cursor-Governance#374). Flat files at
        # docs/plans/claude-code/*.plan.md stay normalised.
        exclude: "^(dist/|docs/plans/claude-code/[^/]+/)"
      - id: trailing-whitespace
        exclude: "^(dist/|docs/plans/claude-code/[^/]+/)"
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: "^(environment/generated/|environment/program-execution/core/)"

  - repo: local
    hooks:
      - id: no-hardcoded-paths
        name: No hardcoded /Users or /home paths (governance SSOT path contract)
        entry: bash ops/scripts/validate_governance_no_hardcoded_paths.sh
        language: system
        pass_filenames: false
        files: ^(ops/scripts/validate_governance_no_hardcoded_paths\.sh|ops/hooks/session_end_governance_backup\.sh|ops/scripts/resolve_governance_paths\.sh|ops/scripts/backup_to_github\.sh|ops/scripts/setup_workspace_symlinks\.sh|ops/scripts/validate_governance_symlinks\.sh|ops/scripts/install_ide_profile\.sh|ops/scripts/backup_gate\.sh)$

      - id: symlinks-check
        name: Governance symlink wiring is healthy
        entry: bash ops/scripts/validate_governance_symlinks.sh
        language: system
        pass_filenames: false

      - id: commit-verification-contract
        name: Commit verification is declared, briefed, enforced, and unemitted
        entry: python3 ops/scripts/validate_commit_verification_contract.py
        language: system
        pass_filenames: false

      - id: legacy-doctrine-residue
        name: No active Dropbox SSOT or L9_MEMORY_HTTP side-door teaching
        entry: python3 ops/scripts/validate_legacy_doctrine_residue.py
        language: system
        pass_filenames: false

      - id: gh-package-deps-preflight
        name: "@quantum-l9 deps are published and lock-true (tarball + integrity)"
        entry: python3 ops/scripts/validate_gh_package_deps.py
        language: system
        pass_filenames: false
        files: '(^|/)(package\.json|package-lock\.json)$'

      # Inert on the make pr path: run_pr_precommit.sh SKIPs this hook by name,
      # and this repo has no git commit hook, so nothing here executes during
      # ordinary work. The heal that matters runs in run_pr_gate.sh, which calls
      # the same script with --pe-manifest and classifies the churn as generated
      # (WARN + stage) rather than letting it block the gate. Kept so a manual
      # `pre-commit run` still reproduces the gate's sync.
      - id: sync-generated-artifacts
        name: Sync generated manifests, registries, and overrides
        entry: python3 ops/scripts/sync_generated_artifacts.py --force --pe-manifest
        language: system
        files: ^(rules/|skills/|commands/|environment/agents/adapters/claude-code/|environment/program-execution/)
        pass_filenames: false

      - id: rules-check
        name: Cursor-native rules standard (ratchet)
        entry: python3 ops/scripts/check_rules_standard.py
        language: system
        files: ^(rules/|ops/scripts/check_rules_standard.py|ops/scripts/lib/rule_frontmatter.py)
        pass_filenames: false

      - id: skills-check
        name: Cursor-native skills standard (ratchet)
        entry: python3 ops/scripts/check_skills_standard.py
        language: system
        files: ^(skills/|ops/scripts/check_skills_standard.py)
        pass_filenames: false

      - id: repo-hygiene
        name: Repository housekeeping gate (RB-HK-001)
        entry: python3 tools/check_repo_hygiene.py
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin must match Core ruff== in install-consumer-ci/requirements-consumer-ci.txt.
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
