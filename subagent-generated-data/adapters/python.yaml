# Python repository-class adapter (law §28). Specializes interpretation only;
# inherits and MUST NOT weaken base.yaml `may_not_weaken`.

law_ref: "l9.subagent_generated_data_law.v1#28"
adapter_id: python
repository_class: python
inherits: base

package_conventions:
  source_layout: "src/ or repo-root packages"
  test_naming: "test_*.py"
  dependency_manifest: [pyproject.toml, requirements.txt, uv.lock]

validation_authority:
  lint: ruff
  types: mypy
  tests: pytest
  # A verifier's "effective_validation_methods" units in a python repo should
  # reference these commands as evidence.

ownership_hints:
  # Guides classification of ownership_finding / architecture_boundary units.
  schema_owner_signal: ["pydantic BaseModel", "*.schema.json"]
  migration_signal: ["alembic/", "migrations/"]

context_selection:
  relevant_path_globs: ["**/*.py", "pyproject.toml", "AGENTS.md", "CLAUDE.md"]
  irrelevant_path_globs: ["**/__pycache__/**", "**/.venv/**", "dist/**"]
