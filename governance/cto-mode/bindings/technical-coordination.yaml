  resolver: skills/l9-coding-agent/scripts/verify_canonical_binding.py#resolve_admission
  authority_main_ref: refs/remotes/origin/main
  effect_when_absent: ADMISSION_UNRESOLVED (ADMISSION_DECISION_RECORD_ABSENT); integration is never admission.
  decisions:
    - candidate_ref: l9.projection/technical-coordination@1
      candidate_digest: sha256:68c2727e15edebb7b60bf30bb15e6aa1b00e0ef3967a5e194f37842741d5c036
      decision: admit
      admitted_revision: f8e44d1536cb218de41dde4685c606a4d6460915
      decided_at: "2026-11-12"
      authority_ref: >-
        Quantum-L9/.github ADR-036, Semantic Foundation v3.39.0, admitted by the repository owner in governed session session_017xwbxw3RduoWFP29VkobHR ("I want to formally admit these candidates"; "push Stages B and C as stacked branches") and merged to .github main as Quantum-L9/.github#246 (f8e44d1); bound into CTO mode on the owner's instruction "Merge the PR's in this seam enabling the projections" (2026-11-12).
    - candidate_ref: l9.compose/technical-coordination@1
      candidate_digest: sha256:d41f63be6862c01c83f7fab2068af4046a9161d86435dd043bd1f0b4bde34afb
      decision: admit
      admitted_revision: f8e44d1536cb218de41dde4685c606a4d6460915
