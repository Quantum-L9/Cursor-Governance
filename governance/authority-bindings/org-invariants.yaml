operating_law:
  remains: CANONICAL_LAW.md
  separate_from: l9.projection/cursor-governance-operating-plane@2
roles:
  session:
    when: sessionStart
    applies: Report the .github pin and whether the local projection matches this binding.
    must_not:
      - treat the local file as the organization-policy author
      - claim admission
      - claim a signed release
  cto:
    when: cto mode on
    applies: Apply the pinned organization policy to coordination, ownership, and publication claims.
    must_not:
      - author organization policy
      - treat operating-plane semantics as organization law
  architect:
    when: architect mode on
    applies: Apply the pinned organization policy to ownership boundaries and integration proposals.
    must_not:
      - author organization policy
      - replace the architecture projection with this file
  planner:
    when: planner mode on
    applies: Apply the pinned organization policy to plan scope and protected paths.
    must_not:
      - author organization policy
      - treat a plan as organization law
  coding-agent:
    when: coding-agent mode on
    applies: Apply the pinned organization policy as an edit constraint on protected paths and a second author.
    must_not:
      - author organization policy
      - treat this file as the execution projection
