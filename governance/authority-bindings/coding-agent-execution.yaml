schema: l9.cursor-governance.coding-projection-binding/v2
artifact_id: l9.cursor-governance/coding-projection-binding@1
canonical: true
authority:
  owner: Quantum-L9/Cursor-Governance
  scope: cursor_governance_downstream_coding_projection_binding
  authority_class: local_canonical_binding
purpose: >
  Bind the canonical coding-agent execution projection profile from
  Quantum-L9/.github into the Cursor-Governance operating plane at bootstrap,
  as a consumer verifier. Cursor-Governance never produces the projection:
  l9-semantic-compiler holds the projection role and its pairs are published
  to the Quantum-L9/.github projections branch
  (docs/PROJECTION_PUBLICATION.md). This binding grants no execution,
  publication or merge authority and changes no grant.
upstream:
  repository: Quantum-L9/.github
  profile_ref: l9.projection/coding-agent-execution@1
  # Admitted by Quantum-L9/.github#179 (merge 69134217267626182ac95182a56d1d9bc296135e).
  # Canonical-JSON digest of the profile entry; equals the RC-028 pin.
  # A different digest on main is STALE: rebind deliberately, never silently.
  profile_digest: sha256:27941a4987ec3861f4e312d991d8016e0769dafa5a5ed6026947c8dfdccc6346
  admitted_revision: 69134217267626182ac95182a56d1d9bc296135e
  source_classes: [authority_model, contracts, invariants]
publication:
  producer: l9-semantic-compiler
  branch: projections
  ref: refs/remotes/origin/projections
  index: index.json
  upstream_state: >-
    publisher implemented, not activated; multi-selector source classes are
    UNSUPPORTED_SOURCE_CLASS upstream as of Quantum-L9/.github@d4397e5
verification:
  verifier: tools/authority/verify_coding_projection.py
  status_reader: ops/scripts/coding_projection_status.py
  conventions: >
    Mirrors Quantum-L9/.github scripts/publish-projection.py: sha256 of raw
    source bytes; sha256 of canonical JSON (sorted keys, compact, UTF-8) for
    payload, profile entry and receipt; schema rules read at the receipt's
    asserted revision, which must be an ancestor of main.
  producer_authentication: unauthenticated_unkeyed_receipt
enforcement:
  mode: report_only
  statuses: [CURRENT, BOUND, STALE, UNVERIFIED, BLOCKED]
  blocks_mutation: false
