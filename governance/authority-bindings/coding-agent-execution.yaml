# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: governance/authority-bindings/coding-agent-execution.yaml
#   layer: governance
#   owner: governance-control-plane
#   status: active
#   version: 3.1.0
#   updated: 2026-10-21
schema: l9.cursor-governance.coding-projection-binding/v3
artifact_id: l9.cursor-governance/coding-projection-binding@1
canonical: true
authority:
  owner: Quantum-L9/Cursor-Governance
  scope: cursor_governance_downstream_coding_projection_binding
  authority_class: local_canonical_binding
purpose: >
  Bind the canonical coding-agent execution projection profile from
  Quantum-L9/.github into the Cursor-Governance operating plane at bootstrap,
  as a consumer verifier of the committed projection bundle. Cursor-Governance
  never produces the projection: l9-semantic-compiler holds the projection
  role, tools/authority/produce_projection_bundle.py drives it at a pinned
  revision, and the trusted replay attests the committed bytes
  (Quantum-L9/.github ADR-021, docs/PROJECTION_PUBLICATION.md). This binding
  grants no execution, publication or merge authority and changes no grant.
upstream:
  repository: Quantum-L9/.github
  profile_ref: l9.projection/coding-agent-execution@1
  # Admitted by Quantum-L9/.github#179 (merge 69134217267626182ac95182a56d1d9bc296135e).
  # Canonical-JSON digest of the profile entry; equals the RC-028 pin.
  # A different digest on main is STALE: rebind deliberately, never silently.
  profile_digest: sha256:27941a4987ec3861f4e312d991d8016e0769dafa5a5ed6026947c8dfdccc6346
  admitted_revision: 69134217267626182ac95182a56d1d9bc296135e
  # In the profile's declared order; the verifier derives the same list from the pinned
  # profile and refuses a bundle whose components differ from it.
  source_classes: [invariants, contracts, authority_model]
bundle:
  path: generated/governance/coding_agent_execution
  lock: bundle.lock.json
  lock_schema: l9.projection-bundle/v1
  producer: l9-semantic-compiler
  driver: tools/authority/produce_projection_bundle.py
  trusted_replay: .github/workflows/l9-projection-bundle-trusted-replay.yml
  replay_status: l9/projection-bundle-trusted-replay/coding_agent_execution
  ci: .github/workflows/l9-projection-bundle-verify.yml
verification:
  verifier: skills/l9-coding-agent/scripts/verify_canonical_binding.py
  mode: --bundle
  delegator: tools/authority/verify_coding_projection.py
  status_reader: ops/scripts/coding_projection_status.py
  conventions: >
    Exactly the producer-emitted conventions Quantum-L9/.github declares in
    semantics/projection_engine_contract.yaml binding_conventions (ADR-021):
    sha256 of raw source bytes; sha256 of canonical JSON for the profile entry,
    the artifact envelope minus projection_digest, and the receipt minus
    receipt_digest; subject and output <profile_ref>#<source_ref>. The
    delegator defines no convention of its own.
  producer_authentication: unauthenticated_unkeyed_receipt
enforcement:
  # Two surfaces, stated separately so neither overclaims the other.
  status_surface:
    # SessionStart / ops/scripts/coding_projection_status.py: reports the repository
    # bundle's standing. Reporting never blocks anything.
    mode: report_only
    statuses: [CURRENT, BOUND, STALE, UNVERIFIED, BLOCKED]
  coding_agent_mutation:
    # The l9-coding-agent law (RUNBOOK step 4; integrations/L9_RUNTIME_BINDING.yaml
    # unknown_handling): a verified canonical binding precedes the first mutation.
    # Mechanical on the Claude Code surface: a PreToolUse gate denies Edit, Write,
    # MultiEdit and NotebookEdit while a coding-agent run is active and its binding
    # is neither BOUND/CURRENT from the pack verifier nor explicitly reauthorized.
    mode: enforced
    blocks_mutation: true
    enforced_by: ops/autonomy/coding_agent_binding_gate.py
    hook: environment/agents/adapters/claude-code/hooks/coding_agent_binding_gate.py
    hook_event: PreToolUse
    tools: [Edit, Write, MultiEdit, NotebookEdit]
    activation: .l9/coding-agent/run.json   # schema l9.coding-agent-run/v1, written at intake
    record: .l9/coding-agent/binding.json   # the pack verifier's printed record
    allows: [BOUND, CURRENT]
    reauthorization: run.json reauthorized_unknown.instruction, the user's words verbatim
    breakglass: L9_CODING_BINDING_AUTHORIZED=<reason> (human/ops only; a bare flag is refused)
    outside_claude_code: instructional (the skill text still requires the verifier run)
