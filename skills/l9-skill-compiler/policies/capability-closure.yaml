# Capability Closure. Replaces the retired term zero_stub.
version: 1
binding_kinds: [MODEL_INSTRUCTION, EXECUTABLE, DAG_NODE, DELEGATED_SKILL, EXTERNAL_CAPABILITY]
result_states: [CLOSED, RUNTIME_BOUND, BLOCKED, FAIL]
placeholder_markers: [TODO, TBD, FIXME, PLACEHOLDER, XXX, not_implemented, NotImplementedError]
checks:
  - {id: required_capabilities_have_bindings, severity: fail}
  - {id: binding_kind_is_known, severity: fail}
  - {id: local_binding_targets_exist, severity: fail}
  - {id: executable_bindings_resolve, severity: fail}
  - {id: DAG_NODE_bindings_resolve_to_real_nodes, severity: fail}
  - {id: DELEGATED_SKILL_bindings_resolve_to_live_owned_skills, severity: fail}
  - {id: EXTERNAL_CAPABILITY_bindings_define_probe_and_failure_behavior, severity: fail}
  - {id: required_capabilities_are_reachable_from_entrypoint, severity: fail}
  - {id: dependency_graph_is_acyclic, severity: fail}
  - {id: no_required_capability_is_satisfied_by_placeholder, severity: fail}
  - {id: no_unresolved_reference_is_silently_accepted, severity: fail}
  - {id: UNKNOWN_is_only_valid_when_explicitly_bounded, severity: block}
  - {id: closure_result_is_machine_readable, severity: fail}
result_rules:
  CLOSED: all checks pass and no required capability needs an external runtime
  RUNTIME_BOUND: all checks pass but a required capability binds to a declared
    external runtime with probe and failure behavior
  BLOCKED: a bounded UNKNOWN remains that materially affects the build
  FAIL: any fail-severity check fails
exit_codes: {CLOSED: 0, RUNTIME_BOUND: 0, BLOCKED: 3, FAIL: 2}
