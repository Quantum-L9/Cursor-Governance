# Family-specific behavior evals. Never one template for all families.
version: 1
advisory:
  - {id: semantic_instruction_coverage, deterministic: false}
  - {id: prohibited_behavior_boundary, deterministic: false}
diagnostic:
  - {id: evidence_grounding, deterministic: false}
  - {id: read_only_boundary, deterministic: true}
  - {id: finding_schema, deterministic: true}
operator:
  - {id: deterministic_entrypoint, deterministic: true}
  - {id: mutation_boundary, deterministic: true}
  - {id: failure_exit_behavior, deterministic: true}
  - {id: idempotency_or_explicit_non_idempotency, deterministic: true}
orchestrator:
  - {id: graph_validity, deterministic: true}
  - {id: transition_guards, deterministic: true}
  - {id: terminal_states, deterministic: true}
  - {id: failure_and_recovery_paths, deterministic: true}
compiler:
  - {id: schema_round_trip, deterministic: true}
  - {id: deterministic_render, deterministic: true}
  - {id: capability_closure, deterministic: true}
  - {id: profile_specific_validation, deterministic: true}
adapter:
  - {id: capability_probe, deterministic: true}
  - {id: unavailable_dependency_failure, deterministic: true}
  - {id: no_hidden_ownership, deterministic: false}
lifecycle:
  - {id: state_identity, deterministic: true}
  - {id: replay_behavior, deterministic: true}
  - {id: persistence_and_recovery_contract, deterministic: true}
activation_fixture_classes: [positive, negative, boundary, sibling_collision]
minimum_activation_requirement: >
  Every built Skill must carry activation evidence appropriate to its family and
  nearest sibling capabilities, including at least one sibling_collision fixture.
