# Family + orthogonal traits. Exactly one primary family per Skill.
version: 1
families:
  advisory:
    intent: shape judgment without mutating state
    required_runtime: [bounded_llm]
    forbidden: [repo_mutation, external_mutation]
    default_traits: {determinism: llm, mutation_scope: none, state_model: stateless,
      risk_class: reversible, externality: local, evidence_mode: source_grounded, execution_shape: direct}
  diagnostic:
    intent: observe and report findings without changing state
    required_runtime: [deterministic_probe, bounded_llm]
    forbidden: [repo_mutation]
    default_traits: {determinism: mixed, mutation_scope: none, state_model: ephemeral,
      risk_class: reversible, externality: repo, evidence_mode: runtime_observed, execution_shape: pipeline}
  operator:
    intent: perform a bounded mutation behind a deterministic entrypoint
    required_runtime: [executable_entrypoint]
    default_traits: {determinism: code, mutation_scope: repo_scoped, state_model: ephemeral,
      risk_class: guarded, externality: repo, evidence_mode: runtime_observed, execution_shape: direct}
  orchestrator:
    intent: coordinate other capabilities across a graph
    required_runtime: [dag]
    default_traits: {determinism: mixed, mutation_scope: repo_scoped, state_model: resumable,
      risk_class: guarded, externality: repo, evidence_mode: mixed, execution_shape: dag}
  compiler:
    intent: transform source material into validated rendered artifacts
    required_runtime: [dag, executable_entrypoint]
    default_traits: {determinism: mixed, mutation_scope: artifact_only, state_model: ephemeral,
      risk_class: guarded, externality: repo, evidence_mode: mixed, execution_shape: dag}
  adapter:
    intent: bind an external capability behind a stable interface
    required_runtime: [capability_probe]
    default_traits: {determinism: code, mutation_scope: none, state_model: stateless,
      risk_class: reversible, externality: third_party, evidence_mode: runtime_observed, execution_shape: direct}
  lifecycle:
    intent: own durable state across sessions
    required_runtime: [state_machine]
    default_traits: {determinism: mixed, mutation_scope: repo_scoped, state_model: durable,
      risk_class: guarded, externality: repo, evidence_mode: runtime_observed, execution_shape: state_machine}

trait_axes:
  determinism: [llm, code, mixed]
  mutation_scope: [none, artifact_only, repo_scoped, external]
  state_model: [stateless, ephemeral, resumable, durable]
  risk_class: [reversible, guarded, irreversible]
  externality: [local, repo, network, third_party]
  evidence_mode: [none, source_grounded, runtime_observed, mixed]
  execution_shape: [direct, pipeline, dag, state_machine]

trait_implications:
  - if: {mutation_scope: repo_scoped}
    then_required: [mutation_boundary, failure_exit_behavior]
  - if: {risk_class: irreversible}
    then_required: [explicit_confirmation_gate, lease_required]
  - if: {externality: third_party}
    then_required: [capability_probe, unavailable_dependency_failure]
  - if: {state_model: durable}
    then_required: [persistence_and_recovery_contract]
  - if: {execution_shape: dag}
    then_required: [canonical_dag_registration]
