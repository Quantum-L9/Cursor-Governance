# Portable Skill semantics are separate from platform render policy.
# A platform convention must never become a universal Skill invariant.
version: 1
required_initial_profiles: [portable, l9]
optional_profiles_require_verified_spec_and_tests: [cursor, claude_code, openai]
profiles:
  portable:
    frontmatter_required: [name, version, description]
    universal_rules:
      - do_not_require_agents_meta_yaml
      - do_not_forbid_agents_openai_yaml
  l9:
    frontmatter_required: [name, version, updated, description, role, tags, owner]
    renders: [SKILL.md, contracts/, policies/, scripts/, tests/]
    l9_specific: [canonical_dag_reference, dag_registry_id]
    autonomy_tier_owner: l9-wire-skill-into-repo
    dag_authority:
      owner_skill: l9-dag-authoring
      dag_definition_dir: workflows/dags
      dag_definition_naming: "<snake_name>_dag.py"
      registry: workflows/session/registry.py
      provenance: >
        Resolved 2026-08-26 from skills/l9-dag-authoring/SKILL.md declared paths
        and observed repository layout (workflows/dags/dag_authoring_dag.py,
        workflows/dags/wire_dag.py, workflows/session/registry.py).
  cursor: {status: unverified, gate: do_not_emit_until_current_primary_spec_is_verified_and_tested}
  claude_code: {status: unverified, gate: do_not_emit_until_current_primary_spec_is_verified_and_tested}
  openai: {status: unverified, gate: do_not_emit_until_current_primary_spec_is_verified_and_tested}
rules:
  - verify_current_primary_spec_before_encoding_time_sensitive_platform_rules
  - record_rule_provenance_or_version_where_useful
  - L9_specific_metadata_belongs_to_L9_profile
  - wiring_and_discovery_belong_to_l9_wire_skill_into_repo
