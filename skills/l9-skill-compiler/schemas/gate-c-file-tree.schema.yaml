# Gate C File Tree, version 3.8.0
$schema: "https://json-schema.org/draft/2020-12/schema"
title: GateC_FileTree
type: object
required: [files_in_scope, structure, resource_map_complete, every_file_has_purpose, no_decorative_files, no_duplicate_owner, dependency_status]
additionalProperties: false
properties:
  files_in_scope: {type: array, minItems: 1, items: {type: string}}
  files_forbidden: {type: string}
  structure:
    type: array
    minItems: 1
    items:
      type: object
      required: [path, role, purpose, decision]
      additionalProperties: false
      properties:
        path: {type: string}
        role: {type: string}
        purpose: {type: string, minLength: 5}
        decision: {type: string, enum: [keep, merge, split, retire, defer, reject, create]}
  resource_map_complete: {type: boolean}
  every_file_has_purpose: {type: boolean}
  no_decorative_files: {type: boolean}
  no_duplicate_owner: {type: boolean}
  dependency_status: {type: string, enum: [valid, invalid, unknown, not_applicable]}
  output_contract:
    type: object
    properties:
      allowed_types: {type: array, items: {type: string}}
      forbidden_types: {type: array, items: {type: string}}
  convergence_check:
    type: object
    properties:
      collisions: {type: array}
      resolutions: {type: array}
      ready_to_build: {type: boolean}
