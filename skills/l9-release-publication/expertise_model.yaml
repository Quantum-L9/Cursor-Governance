# Compiled with l9-skill-compiler from Quantum-L9/l9-graphiti-memory
# skill/l9-release-publication (tag-push publication) and the observed release of
# Quantum-L9/l9-meta-injector v4.3.0 (version-authority release job), generalized to
# any L9 repository.

expertise_model:
  experts:
    - release operator who reads which job owns the tag before touching one
    - publication-plane reviewer who separates a tag push from a branch pull request
    - release-job watcher who treats environment approval and skipped steps as stops
    - version steward who refuses to re-point an existing tag and asks for the line
  doctrine:
    - the repository's own release job decides who creates the tag and the Release
    - a tag that exists names one release; current code needs a new version, never a moved tag
    - the release commit is the current tip of the default branch or the version PR merge commit
    - in a branch-tagger repository the release is the version change, so the agent never creates the tag
    - in a tag-push repository the admitted tag object is the release identity
    - a green job, a pushed tag, or a pending approval is not a published Release
    - derived evidence that embeds the producer version moves with the bump and is refreshed before merge
    - the publish-path receipt exists only for one authorized tag ref and is removed on every return
  invariants:
    - never create, move, delete, recreate or force-push a tag the repository's job owns or already published
    - never write the publish-path receipt and push in one command
    - never start a second run of a release job or re-run a finished one
    - never approve an environment or merge the version change without the operator's order
    - never report RELEASE_VERIFIED before tag identity, the job, and the host Release all match
    - an AMBIGUOUS or UNKNOWN release model stops the release
  authority_hierarchy:
    - operator instruction naming the repository, version and, when admitted, the tag object and commit
    - the repository's release job definitions and release decision documents
    - the repository's version authority file and preparation script
    - verify_release_tag.py and verify_github_release.py JSON against the host
    - the release job run log and conclusion
    - model inference
  activation_signals:
    - cut, publish or ship a release tag for a named repository
    - finish a release whose tag, job or host Release is incomplete
    - the maintained major tag must point at a new release
    - verify that a published tag and Release match the admitted commit
    - a release job is waiting on an environment approval
  reject_signals:
    - changelog or release-notes drafting without publishing
    - deploying a release to an environment
    - rebinding a consumer onto a published release
    - moving or recreating a tag that already names another commit
    - npm or other registry publication without a recorded owner approval
  adapters:
    - name: ungoverned-git
      load_when: the tag push runs where the first-publication gate is not installed
      changes: push the one ref without a publish-path receipt; open release PRs with the host's normal flow
  failure_modes:
    - name: raced_repository_tagger
      prevention: detect_release_model.py decides tag_creator before any tag is created
    - name: stale_release
      prevention: read the default-branch tip and refuse to re-point an existing tag
    - name: version_bump_breaks_derived_evidence
      prevention: run the repository's full gate after the bump and refresh what it names before merge
    - name: receipt_outlives_push
      prevention: write the receipt alone, push in a later command, delete it on every return
    - name: job_counted_as_release
      prevention: verify_github_release.py gates RELEASE_VERIFIED on tag, Release, assets and major tag
  leverage_points:
    - name: deterministic release-model detection with tag and release ownership
      score: 25
    - name: host-side tag identity check for annotated and lightweight tags
      score: 24
    - name: RELEASE_VERIFIED gated on the host Release and major tag
      score: 24
    - name: operator-owned version line, merge and approval stops
      score: 22
    - name: derived-evidence refresh after the version bump
      score: 20
