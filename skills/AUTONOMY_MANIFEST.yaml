version: 1
purpose: Canonical cross-surface skill autonomy and routing registry for governed L9 agents.
principle: Model-invocable skills are selected from SKILL.md descriptions; explicit-only skills remain user-triggered; deterministic behavior lives in skill instructions, references, and optional skill-local scripts/assets.
cursor_discovery:
  enabled_by:
  - ~/.cursor/skills symlinked to GlobalCommands/skills
  - skill folder contains SKILL.md
  - frontmatter name matches folder name
  - description states what the skill does and when to use it
  automatic_invocation:
    rule: 'available unless disable-model-invocation: true is present'
  explicit_invocation:
    rule: 'set disable-model-invocation: true for high-blast-radius or lifecycle-boundary skills'
tiers:
  auto_invoke:
  - skill: l9-context7-docs
    use_when: current library, framework, SDK, API, or version-specific documentation could prevent implementation mistakes
  - skill: l9-recursive-optimization
    use_when: recursively aligning, improving, or converging artifact groups, packs, prompts, or agent outputs until execution-ready
  - skill: l9-structured-reasoning
    use_when: planning, architecture decisions, debugging, trade-off analysis, or deep reasoning is needed
  - skill: l9-gmp-protocol
    use_when: work must be phased, auditable, traceable, or touches protected/high-risk areas
  - skill: l9-plan
    use_when: scope is unclear, requirements need decomposition, or implementation needs a machine-validated plan/spec first
  - skill: l9-code-analysis
    use_when: exploring unfamiliar code, auditing structure, mapping flows, or identifying hotspots
  - skill: l9-gap-analysis
    use_when: assessing readiness, missing pieces, compliance drift, or percent-complete status
  - skill: l9-ynp
    use_when: work just completed, priorities are unclear, or the user asks what to do next
  - skill: l9-skill-compiler
    use_when: creating or improving a reusable skill, making a skill portable across Claude Code, Manus, or Cursor, sharpening activation and reject signals, extracting expert heuristics, eliminating drift or stubs, or producing a validated ZIP
  - skill: l9-wire-skill-into-repo
    use_when: registering a new, relocated, or renamed skill into repo discovery tables and subagent preloads
  - skill: l9-update-agent-docs
    use_when: refreshing AGENTS.md, CLAUDE.md, or README.md as a pointer stack after CI, hook, or registry changes, or creating root CLAUDE.md / INVARIANTS.md when missing
  - skill: l9-code-graph-rag-mcp
    use_when: code-graph, batch_index, semantic code search, list_module_importers, analyze_code_impact, or MCP code indexing is needed
  - skill: l9-api-smoke-testing
    use_when: verifying API health after changes, smoke-testing endpoints, or hunting 404/500 regressions across routes
  - skill: l9-architecture-decision-records
    use_when: capturing a significant architecture/design decision, recording trade-offs, or creating an ADR
  - skill: l9-auditing-performance
    use_when: the app is slow, profiling for bottlenecks, or optimizing bundle/render/query performance
  - skill: l9-auditing-security
    use_when: reviewing code for security risks, scanning for exposed secrets, or hardening before release
  - skill: l9-monitoring-terminal-errors
    use_when: a dev server, watcher, or test process is running and may emit runtime errors to fix live
  - skill: l9-prompt-engineering
    use_when: designing or improving an LLM prompt, system message, or structured output schema
  - skill: l9-incident-response
    use_when: a production incident is active (SEV1–SEV4), coordinating mitigation, or writing a postmortem
  - skill: l9-setting-up-ci
    use_when: bootstrapping CI, activating l9-ci-core / Biome, or adding lint/test/type-check stages without inventing ci.yml or biome.json
  - skill: l9-graphiti-memory
    use_when: wiring memory, debugging prefetch/bootstrap, GMP Phase 0 MEMORY_PREFETCH, episode/T0 memory-bank writes, or checking Graphiti health
  - skill: l9-aws-secrets
    use_when: an agent needs an api key, token, password, infisical hydrate, aws secret ref, registry sync, or fail-closed credential check without keychain or printing values
  - skill: l9-claude-code-deepseek
    use_when: wiring Claude Code in a consumer clone to DeepSeek, opening a Claude Code tab on DeepSeek, or hydrating DEEPSEEK_API_KEY without Anthropic billing
  explicit_only:
  - skill: l9-forge
    reason: zero-pause batch execution
  - skill: l9-governance-wiring
    reason: symlinks, hooks, and governance backup
  - skill: l9-end-session
    reason: session lifecycle boundary
  - skill: l9-code-maintenance
    reason: lint-fix/migrate/consolidate/refactor sweeps with code-mutating executors; use --dry-run CLI before mutate
  - skill: l9-ci-ops
    reason: CI/CD pipeline operations and gate authoring
  - skill: l9-component-verification
    reason: component audit/verify/probe escalation ladder
  - skill: l9-chat-extraction
    reason: extracts chat content to memory or structured output
  - skill: l9-dag-authoring
    reason: creates/updates DAGs — structural meta tooling
  - skill: l9-repo-index
    reason: repo index export — on-demand only
  - skill: l9-python-tdd-with-uv
    reason: non-default stack (uv) — invoke explicitly for Python TDD
  - skill: l9-kubernetes-deploying
    reason: infra deploy operation — high blast radius, explicit only
  - skill: l9-setting-up-terraform
    reason: infra-as-code bootstrap — high blast radius, explicit only
  - skill: l9-pr-remediation
    reason: Diagnose remains hint-routeable. Invoking /l9-pr-remediation Converge remediates all open PRs via make precommit-repo then git push, then merges them oldest-first and stack-safe (squash only when unstacked). make pr is not the remediator publish path. Campaigns/make pr stay no-merge. Force-push and admin-merge stay forbidden.
  - skill: l9-issue-remediation
    reason: /issues and /l9-issue-remediation are remediator Converge (verify-before-trust, drain all clusters at max autonomy, recommended-A human blockers, land on PRs, close phantoms/resolved, chain /l9-pr-remediation only at open_issues=0). /issues diagnose remains hint-routeable auditor. High blast radius, explicit only.
  - skill: l9-bounded-autonomy
    reason: campaign autonomy with parallel Tasks and background PR-poll; remediation push under campaign authorization packet — high blast radius, explicit only
  - skill: l9-pe-campaign-activate
    reason: Live PE campaigns go through make campaign INTENT= only. hint_allowed is Read/attach so agents load that sealed front door. The run is local-commit-only and invoking the skill is not merge authority; publication is PR_REMEDIATE=0 make pr and merge of open PRs is /l9-pr-remediation. disable-model-invocation.
  - skill: l9-pe-nuggets
    reason: PLAN-window nugget extraction only; make campaign is the front door
  - skill: l9-cli-optimization
    reason: activates dormant/miswired capability and flips off-by-default flags into review-required PR packs (full-throttle mode) — high blast radius, explicit only
  - skill: l9-e2e-blocker-resolution
    reason: runs e2e/proof commands, mutates code/docs/TODO, may touch disposable remote targets — high blast radius, explicit only
  - skill: l9-governance-symlinks
    reason: narrow symlink setup/validate op (subset of l9-governance-wiring); disable-model-invocation, explicit only
  - skill: l9-repository-renovation
    reason: audits then implements, commits, pushes, and opens a PR under RENOVATE_TO_PR — high blast radius, explicit only
  - skill: l9-ui-operator
    reason: SaaS admin UI mutations via Playwright cartridges — high blast radius; requires human approve
  - skill: l9-mac-storage-triage
    reason: macOS disk reclaim; diagnose-first then HITL repair; disable-model-invocation, explicit only
  - skill: l9-git-work-preserve
    reason: auto-registered by sync_generated_artifacts (orphan → explicit_only)
  - skill: l9-plan-simple
    reason: auto-registered by sync_generated_artifacts (orphan → explicit_only)
  - skill: l9-repo-sync
    reason: in-place /ff catch-up mutates a named clone (park unique work, then reset --keep); explicit only, hint_allowed for Read/attach
  - skill: l9-claude-coding-contract-compiler
    reason: compiles scoped coding-contract chains that hardwire git workflow, commit cadence, and a terminal make pr delivery; its broad "coding contract" surface would hijack ordinary planning routing if auto-invoked; disable-model-invocation
  - skill: l9-intelligence-harvest
    reason: donor-to-beneficiary semantic mining is a deliberate operation with a large read surface over a foreign repo; keeps the harvest family (l9-harvest-pipeline, l9-pe-nuggets) explicit; disable-model-invocation
  - skill: l9-pipeline-audit
    reason: on-demand multi-surface harvest (plans + WIP + PE campaigns) can emit new WIP or campaign INTENT; slash /l9-pipeline-audit is the explicit invoke; sessionStart runs audit_pipeline.py display+spent-archive only; disable-model-invocation
  - skill: l9-pipeline-orchestrator
    reason: drives fresh sessions per contract, applies GitHub branch protection, and gates auto-merge with no human tap — high blast radius; merge authority still comes from /l9-pr-remediation, never from this pack; disable-model-invocation
  - skill: l9-global-architect
    reason: experimental GAR runtime bootloader whose broad architect-engineer description would hijack ordinary routing if auto-invoked; load only when the user explicitly invokes the global architect runtime or iterates on the pack; disable-model-invocation
  do_not_migrate_to_skills:
  - item: commands/_archived/violation.md
    reason: violation handling belongs in always-applied rules or hooks, not optional skill context
  - item: commands/mem.md
    reason: memory plumbing belongs in MCP/client workflow documentation, not a model-selected skill
  - item: commands/start-session.md
    reason: session startup is lifecycle/bootstrap behavior; skills do not auto-run at IDE startup
  - item: commands/emma-repo-commands/
    reason: repo-specific Emma wiring; omit from GlobalCommands
  - item: commands/workflow executors/
    reason: obsolete duplicate executor folder; prefer Cursor-native skill instructions and optional skill-local scripts only when needed
  - item: commands/dora-commands/
    reason: unwired legacy DORA commands; archive or rebuild only if aligned to the current stack
  - item: skills/_archived/l9-pr-analysis/
    reason: superseded by skills/l9-pr-remediation/; archived out of live skills/ discovery — never auto-invoke or reconcile
  - item: skills/_archived/l9-pr-remediation-deprecated/
    reason: superseded by skills/l9-pr-remediation/; archived out of live skills/ discovery — never auto-invoke or reconcile
  - item: skills/_archived/l9-update-command/
    reason: superseded by skills/l9-dag-authoring/ (COMMAND_BIND operation); archived out of live skills/ discovery — never auto-invoke or reconcile
  - item: skills/_archived/l9-inspect/
    reason: Skill wrapper retired; the capability runs from workflows/dags/inspect_dag.py via /inspect — archived out of live skills/ discovery, never auto-invoke or reconcile
  - item: skills/_archived/l9-harvest-pipeline/
    reason: Skill wrapper retired; the capability runs from workflows/dags/harvest_deploy_dag.py and workflows/use_harvest_executor.py via /harvest and /use-harvest — archived out of live skills/ discovery, never auto-invoke or reconcile
  - item: skills/_archived/l9-plan-audit/
    reason: superseded by skills/l9-pipeline-audit/; archived out of live skills/ discovery — never auto-invoke or reconcile
reasoning_routing:
  purpose: Which l9-structured-reasoning reference applies to which task class.
  sources:
  - profiles/orchestrator.md
  - profiles/reasoning_l9.md
  note: Advisory routing context for the model, not an execution order. No orchestrator process exists.
  routes:
  - task_class: L9 platform work — kernel, executor, memory substrate, tool dispatch, approval gates
    reference: l9-structured-reasoning/references/reasoning-router.yaml
  - task_class: Tool, library, API, or architecture selection
    reference: l9-structured-reasoning/references/risk-and-autonomy-policy.md
  - task_class: Multi-document corpus analysis — gaps, coherence, dependency mapping
    reference: l9-structured-reasoning/references/document-corpus-reasoning.md
  - task_class: Depth selection for a single problem
    reference: l9-structured-reasoning/references/reasoning-router.yaml
  - task_class: Strategic angle, only when the user explicitly requests one
    reference: l9-structured-reasoning/references/document-corpus-reasoning.md
