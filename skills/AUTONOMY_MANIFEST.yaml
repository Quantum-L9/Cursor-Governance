slash_commands:
  registry: commands/COMMANDS_MANIFEST.yaml
  index: commands/commands-index.md
  recognition_rule: rules/02-slash-commands.mdc
  activation:
  - l9-governance Cursor local plugin (commands/ under plugin root)
  - .cursor-commands symlink in consumer workspace
  - sessionStart bootstrap / /start-session / make start
  policy: When user types /cmd, ALWAYS read commands/{cmd}.md if present; skill is fallback only.
