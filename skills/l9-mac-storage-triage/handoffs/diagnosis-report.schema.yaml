---
$schema: "http://json-schema.org/draft-07/schema#"
title: DiagnosisReport
description: Read-only macOS storage evidence emitted before planning.
version: "1.0.0"
type: object
required: [report_id, created_at, host_name, home_dir, data_volume, free_kib, evidence_files, diagnosis_complete]
properties:
  report_id: {type: string, minLength: 1}
  created_at: {type: string, minLength: 1}
  host_name: {type: string, minLength: 1}
  home_dir: {type: string, pattern: "^/"}
  data_volume: {type: string, pattern: "^/"}
  free_kib: {type: integer, minimum: 0}
  evidence_files:
    type: array
    minItems: 1
    items: {type: string}
  diagnosis_complete: {type: boolean, const: true}
additionalProperties: false
