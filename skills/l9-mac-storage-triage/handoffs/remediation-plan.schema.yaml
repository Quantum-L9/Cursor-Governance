---
$schema: "http://json-schema.org/draft-07/schema#"
title: RemediationPlan
description: Exact diff-style plan generated from validated configuration.
version: "1.0.0"
type: object
required: [plan_id, diagnosis_report_id, actions, plan_sha256, approval_required]
properties:
  plan_id: {type: string, minLength: 1}
  diagnosis_report_id: {type: string, minLength: 1}
  actions:
    type: array
    minItems: 1
    items:
      type: object
      required: [action_id, target, current_state, intended_change, guards, verification]
      properties:
        action_id: {type: string}
        target: {type: string}
        current_state: {type: string}
        intended_change: {type: string}
        guards: {type: array, items: {type: string}}
        verification: {type: string}
      additionalProperties: false
  plan_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
  approval_required: {type: boolean, const: true}
additionalProperties: false
