---
$schema: "http://json-schema.org/draft-07/schema#"
title: ExecutionReceipt
description: Immutable record for one approved action attempt.
version: "1.0.0"
type: object
required: [receipt_id, action_id, plan_sha256, started_at, finished_at, status, log_file]
properties:
  receipt_id: {type: string, minLength: 1}
  action_id: {type: string, minLength: 1}
  plan_sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
  started_at: {type: string, minLength: 1}
  finished_at: {type: string, minLength: 1}
  status: {type: string, enum: [success, fail, blocked, Unknown]}
  log_file: {type: string, pattern: "^/"}
additionalProperties: false
