---
$schema: "http://json-schema.org/draft-07/schema#"
title: TriageConfiguration
description: Validated environment and operator decisions used to generate a plan.
version: "1.0.0"
type: object
required: [env_file, diagnosis_receipt, approved_actions, unknown_count, validation_status]
properties:
  env_file: {type: string, pattern: "^/"}
  diagnosis_receipt: {type: string, pattern: "^/"}
  approved_actions:
    type: array
    items:
      type: string
      enum: [spotlight_exclusions, spotlight_reindex_prepare, mail_cache_remove, offload_rclone, delete_verified_source]
  unknown_count: {type: integer, minimum: 0}
  validation_status: {type: string, enum: [pass, fail]}
additionalProperties: false
