# NOTE: This is a domain-agnostic leverage kernel (general provenance). The
# skill consumes ONLY its seven weighted dimensions as the leverage law
# (see revision-synthesis-leverage-adapter.md); non-code exemptions are context.
# Domain-Agnostic Compounding Leverage Kernel

version: 1.0.0
status: active
scope: universal_non_code_strategy
purpose: >
  Enforce that major actions, projects, routines, relationships, systems, and
  decisions create leverage that creates more leverage instead of adding isolated
  obligations.

cardinal_rule: >
  A move is high quality when it improves future moves.

hard_invariants:
  - MUST evaluate whether the action compounds before committing.
  - MUST identify future actions made easier, faster, clearer, safer, or more powerful.
  - MUST identify current assets, relationships, routines, or systems strengthened.
  - MUST prefer reusable systems over one-time effort.
  - MUST prefer moves that solve multiple bottlenecks at once.
  - MUST preserve energy, attention, trust, optionality, and execution capacity.
  - MUST label unverifiable leverage claims as Unknown.
  - MUST NOT confuse busyness with leverage.
  - MUST NOT add recurring maintenance without clear compounding return.
  - MUST NOT choose impressive complexity over durable advantage.
  - MUST NOT keep actions that only consume energy and do not strengthen future capacity.

exemptions:
  - urgent_health_need
  - legal_deadline
  - safety_issue
  - family_obligation
  - unavoidable_admin
  - critical_recovery

preflight:
  questions:
    - What future action becomes easier because of this?
    - What existing asset, relationship, system, or routine becomes stronger?
    - Does this create a reusable process, connection, habit, insight, or tool?
    - Does this reduce future cognitive, emotional, financial, or operational load?
    - Does this increase optionality?
    - Does this solve multiple problems with one action?
    - What recurring burden does it create?
    - What is the effort-to-leverage ratio?

scoring:
  scale:
    0: no leverage
    1: one-time local benefit
    2: repeatable personal benefit
    3: reusable across multiple situations
    4: accelerates a class of future actions
    5: compounding multiplier across domains
  dimensions:
    future_action_acceleration: 0.22
    existing_asset_amplification: 0.20
    reusable_system_value: 0.18
    multi_domain_benefit: 0.14
    optionality_gain: 0.10
    energy_load_inverse: 0.08
    social_or_network_gain: 0.08
  thresholds:
    reject_or_reframe_below: 2.5
    approve_minimum: 3.5
    prioritize_minimum: 4.0
    life_architecture_candidate: 4.5

decision_rules:
  approve_if:
    - leverage_score >= 3.5
    - future_action_acceleration_identified
    - current_asset_or_system_strengthened
    - reusable_output_identified
  defer_if:
    - leverage_score >= 2.5
    - leverage_score < 3.5
    - useful_but_not_sequence_optimal
  reject_or_reframe_if:
    - leverage_score < 2.5
    - no_future_acceleration
    - no_reusable_output
    - creates_recurring_drag_without_multiplier
    - drains_energy_without_compounding_return

case_studies:
  inventory_before_expansion:
    pattern: "map existing assets -> reveal hidden capability -> reuse before rebuilding"
    lesson: >
      Visibility creates leverage by turning scattered assets into a usable
      chessboard. Knowing what exists improves every future decision.

  transparent_equity_talent_network:
    pattern: "proof_of_work + transparent upside -> collaborators + social network + execution bandwidth"
    lesson: >
      One well-designed mechanism can solve talent discovery, social isolation,
      business formation, and execution capacity together.

  synthetic_biological_translation:
    pattern: "systems insight <-> body/life insight"
    lesson: >
      Bidirectional analogy can improve both domains. Systems thinking can improve
      routines and energy. Biological insight can improve architecture and recovery design.

validation_gates:
  - future_action_acceleration_declared
  - current_asset_amplification_declared
  - reusable_output_declared
  - multi_domain_benefit_checked
  - recurring_drag_bounded
  - energy_cost_checked
  - unknowns_declared

output_contract:
  required_fields:
    - leverage_score
    - decision
    - future_actions_accelerated
    - current_assets_strengthened
    - reusable_outputs_created
    - multi_domain_benefits
    - recurring_drag_risk
    - unknowns
