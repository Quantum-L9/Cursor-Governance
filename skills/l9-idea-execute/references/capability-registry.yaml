schema: l9.idea-execute.capability-registry/v1
registry_version: 1
principle: specialized_factory_before_generic_birth
specialized_factories:
  website:
    owner: Quantum-L9/Website-Bot
    adapter: website-bot
    topology: SPECIALIZED_FACTORY
    native_input: domain_spec.source.yaml
    note: Website-Bot owns any website-specific provisioning or generated site repository.
generic_routes:
  new_product_repository:
    owner: l9-idea-execute
    adapter: l9-idea-execute
    topology: NEW_PRODUCT_REPOSITORY
    orchestration: idea_execute_greenfield_v1
    cohort:
      - l9-global-architect
      - l9-plan
      - l9-pe-campaign-activate
    stages:
      - id: architecture
        owner: l9-global-architect
        produces: product_architecture_decision
      - id: planning
        owner: l9-plan
        produces: validated_execution_plan
      - id: campaign
        owner: l9-pe-campaign-activate
        produces: validated_campaign_source_v2
      - id: realization
        owner: program-execution
        produces: verified_pec_source
      - id: birth_handoff
        owner: l9-repo-birth
        activation: explicit_graph_request
        produces: factory_birth_payload_and_contract
      - id: birth
        owner: l9-repo-template
        activation: separately_authorized
        produces: repository_birth_state
  bounded_existing_repo:
    owner: l9-plan-simple
    adapter: l9-plan-simple
    topology: EXISTING_REPO_CHANGE
  existing_system_campaign:
    owner: Cursor-Governance/Program-Execution
    adapter: program-execution
    topology: EXISTING_SYSTEM_CAMPAIGN
unbound_policy: FAIL_CLOSED
