  integration_binding_state: [UNBOUND, DISCOVERED, BOUND, ACTIVE, ACTIVE_DEGRADED, RELEASED]
  realization_mode: [MUTATION, ARTIFACT, ANALYSIS, DECISION, UNKNOWN]
  delivery_mode: [IN_PLACE_WORKSPACE, RETURNED_FILES, RETURNED_ARCHIVE, PERSISTED_REPOSITORY, NONE]
  artifact_status: [absent, partial, candidate, accepted, invalidated]
  convergence_status: [NOT_EVALUATED, NOT_CONVERGED, CONVERGED, BLOCKED, ABORTED]
event_model:
  append_only: true
  required_fields: [event_id, occurred_at, event_type, state, summary]
  optional_fields:
    - evidence_refs
    - reason_codes
    - defect_ref
    - transition_ref
    - artifact_refs
    - delivery_ref
  permitted_event_types:
    - RUN_CREATED
    - CAPABILITY_OBSERVED
    - AUTHORITY_RESOLVED
    - REALIZATION_MODE_DERIVED
    - OBJECTIVE_DERIVED
    - POLICY_DECISION_RECORDED
    - OBLIGATION_RESOLVED
    - INTEGRATION_DISCOVERED
    - INTEGRATION_ACTIVATED
    - INTEGRATION_DEGRADED
    - INTEGRATION_AUTHORITY_RELEASED
    - EVIDENCE_ADDED
    - EVIDENCE_INVALIDATED
    - ASSUMPTION_ADDED
    - ASSUMPTION_RESOLVED
    - DISPUTE_ADDED
    - SYSTEM_MODEL_UPDATED
    - ARCHITECTURE_CANDIDATE_ADDED
    - ARCHITECTURE_SELECTED
    - PLAN_CREATED
    - PLAN_REJECTED
    - PLAN_PROMOTED
    - MUTATION_ATTEMPTED
    - MUTATION_OBSERVED
    - DELIVERY_ATTEMPTED
    - DELIVERY_OBSERVED
    - VALIDATION_OBSERVED
    - DEFECT_OPENED
    - DEFECT_RESOLVED
    - BLOCK_RECEIPT_CREATED
    - STATE_TRANSITIONED
    - CONVERGENCE_EVALUATED
    - RUN_BLOCKED
    - RUN_CONVERGED
    - RUN_ABORTED
transition_invariants:
  - id: RS-001
    assertion: current_state changes only through a legal transition declared by runtime/STATE_MACHINE.yaml
  - id: RS-002
    assertion: terminal_state may be populated only when the corresponding terminal entry gate passes
  - id: RS-003
    assertion: evidence.invalidated_refs MUST NOT satisfy later gates
  - id: RS-004
    assertion: material assumptions MUST NOT silently migrate into verified_facts
  - id: RS-005
    assertion: selected architecture is invalidated when a material supporting premise is falsified
  - id: RS-006
    assertion: plan readiness is invalidated when architecture or a material plan premise changes
  - id: RS-007
    assertion: convergence is invalidated by any new blocking defect invalidated evidence post-evaluation mutation or delivery regression
  - id: RS-008
    assertion: mutation_receipts record observed mutations not intended mutations
  - id: RS-009
    assertion: validation_results record observed validation not proposed commands
  - id: RS-010
    assertion: delivery.completed may be true only when delivery evidence proves the objective-derived mode
  - id: RS-011
    assertion: outcome accountability persists when execution is blocked
  - id: RS-012
    assertion: private chain-of-thought MUST NOT be required or stored as runtime evidence
  - id: RS-013
    assertion: once integration.orchestration_authority_transferred is true, integration_mode MUST NOT return to STANDALONE without explicit release or revocation evidence recorded in authority_release_evidence_refs
  - id: RS-014
    assertion: objective-derived realization validation and delivery obligations may be narrowed only by new explicit user instruction, never by runtime re-derivation
  - id: RS-015
    assertion: a block receipt MUST NOT satisfy VALID_BLOCK_RECEIPT unless its type legitimacy predicate is SATISFIED on current-run evidence
  - id: RS-016
    assertion: selected architecture and promoted plans MUST NOT be accepted while any architecture.required_questions field remains unanswered
material_progress:
  accepted_kinds:
    - new_discriminating_evidence
    - material_unknown_resolved
    - material_dispute_resolved
    - system_model_corrected
    - architecture_changed
    - plan_materially_improved
    - implementation_changed
    - delivery_completed
    - validation_strengthened
    - blocking_defect_resolved
    - authority_resolved
    - capability_state_resolved
    - integration_state_resolved
  non_progress:
    - repeat_same_reasoning_without_new_input
    - rerun_same_validation_without_state_change
    - rewrite_same_plan_without_answering_defect
    - repeated_patch_without_new_evidence
    - additional_narration
defect_record:
  required_fields: [defect_id, defect_class, summary, opened_in_state, evidence_refs, status]
  optional_fields: [reason_codes, invalidates, resolved_by_refs, fingerprint]
  status_values: [open, resolved, superseded]
block_receipt_model:
  required_fields:
    - block_type
    - reason_code
    - specific_required_action
    - evidence_refs
    - completed_work_refs
    - remaining_action
    - legitimacy_evidence_refs
  block_type_values: [AUTHORITY, CAPABILITY, EVIDENCE, EXTERNAL_DEPENDENCY, NO_PROGRESS]
  legitimacy_predicates_ref: contracts/OUTCOME_OWNERSHIP.yaml#block_receipt_requirements
  validation_owner: contracts/OUTCOME_OWNERSHIP.yaml
  routing_owner: runtime/STATE_MACHINE.yaml
decision_record:
  purpose: Preserve auditable decision output without requiring hidden reasoning.
  may_store:
    - selected_candidate
    - rejected_candidate
    - material_decision_factors
    - evidence_refs
    - counterevidence_refs
    - unresolved_unknowns
    - compact_rationale
  must_not_require:
    - private_chain_of_thought
    - token_level_reasoning_trace
convergence_receipt_model:
  required_fields:
    - terminal_state
    - objective_status
    - realization_mode
    - artifact_changes
    - validation_performed
    - architectural_integrity_status
    - remaining_material_unknowns
    - delivery_status
    - residual_risks
  conditional_fields:
    blocked_reason:
      required_when:
        - terminal_state == BLOCKED
anti_drift:
  - live_run_state_MUST_NOT_become_source_of_architectural_law
  - state_records_evidence_and_decisions_but_does_not_redefine_contracts
  - host_adapters_MUST_NOT_maintain_independent_shadow_run_state
  - persisted_and_in_memory_representations_MUST_preserve_equivalent_semantics
