transition_invariants:
  - id: RS-001
    assertion: current_state changes only through a legal transition declared by runtime/STATE_MACHINE.yaml
  - id: RS-002
    assertion: terminal_state may be populated only when the corresponding terminal entry gate passes
  - id: RS-003
    assertion: evidence.invalidated_refs MUST NOT satisfy later gates
  - id: RS-004
    assertion: material assumptions MUST NOT silently migrate into verified_facts
  - id: RS-005
    assertion: selected architecture is invalidated when a material supporting premise is falsified
  - id: RS-006
    assertion: plan readiness is invalidated when architecture or a material plan premise changes
  - id: RS-007
    assertion: convergence is invalidated by any new blocking defect invalidated evidence post-evaluation
      mutation or delivery regression
  - id: RS-008
    assertion: mutation_receipts record observed mutations not intended mutations
  - id: RS-009
    assertion: validation_results record observed validation not proposed commands
  - id: RS-010
    assertion: delivery.completed may be true only when delivery evidence proves the objective-derived mode
  - id: RS-011
    assertion: outcome accountability persists when execution is blocked
  - id: RS-012
    assertion: private chain-of-thought MUST NOT be required or stored as runtime evidence
  - id: RS-013
    assertion: once integration.orchestration_authority_transferred is true, integration_mode MUST NOT return
      to STANDALONE without explicit release or revocation evidence recorded in
      authority_release_evidence_refs
  - id: RS-014
    assertion: objective-derived realization validation and delivery obligations may be narrowed only by new
      explicit user instruction, never by runtime re-derivation
  - id: RS-015
    assertion: a block receipt MUST NOT satisfy VALID_BLOCK_RECEIPT unless its type legitimacy predicate is
      SATISFIED on current-run evidence
  - id: RS-016
    assertion: selected architecture and promoted plans MUST NOT be accepted while any
      architecture.required_questions field remains unanswered
  - id: RS-017
    assertion: architecture and promoted plans MUST be invalidated when the bound First-Order decision is
      invalidated or materially challenged
  - id: RS-018
    assertion: GAR MUST NOT populate or change reasoning.first_order.intervention_class without a referenced
      First-Order decision receipt
  - id: RS-019
    assertion: GAR MUST NOT resolve INTERVENTION_RECONSIDERATION_REQUIRED by silently substituting another
      intervention class
  - id: RS-020
    assertion: predicted and observed Second-Order evidence MUST remain distinct and predicted and realized
      Leverage evidence MUST remain distinct
  - id: RS-021
    assertion: HARVEST_SEMANTICS and BUILD_NEW execution paths require a current matching bound First-Order
      intervention class
  - id: RS-022
    assertion: convergence requiring post-execution reasoning closure MUST NOT pass while
      reasoning.post_execution_closed is false
  - id: RS-023
    assertion: architecture_profile applicability MUST be resolved from explicit scope or current target evidence and MUST NOT be inferred from profile presence alone
  - id: RS-024
    assertion: architecture_profile role semantics MUST NOT populate current inventory, version, registration, routability, or capability claims without current evidence refs
  - id: RS-025
    assertion: when architecture_profile.applicability is APPLICABLE, First-Order binding and GAR architecture promotion MUST consume the active profile invariants as hard feasibility constraints
  - id: RS-026
    assertion: architecture_profile applicability MUST NOT activate integrations/L9_RUNTIME_BINDING.yaml or transfer orchestration authority
  - id: RS-027
    assertion: Leverage value MUST NOT be treated as proof that required signal propagation or write-back occurred.
  - id: RS-028
    assertion: Signal Leverage receipts MUST preserve evidence provenance context authority and uncertainty required by downstream consumers.
  - id: RS-029
    assertion: Consequential signal write-back MUST remain pending until the semantic owner accepts or rejects the promoted change.
  - id: RS-030
    assertion: Cyclic or mesh signal episodes MUST expose bounded convergence controls and MUST NOT remain open at terminal convergence.
  - id: RS-031
    assertion: Whole-target claims or mutation MUST NOT occur unless $.target.status == BOUND and the bound target is supported by direct evidence.
  - id: RS-032
    assertion: Inspection scope and correction scope MUST remain distinct; authorization to inspect does not imply authorization to mutate.
  - id: RS-033
    assertion: A similarly named repository, file, branch, package, archive, or workspace MUST NOT satisfy target binding without evidence that it is the requested target.
material_progress:
  accepted_kinds:
    - new_discriminating_evidence
    - material_unknown_resolved
    - material_dispute_resolved
    - system_model_corrected
    - architecture_changed
    - plan_materially_improved
    - implementation_changed
    - delivery_completed
    - validation_strengthened
    - blocking_defect_resolved
    - authority_resolved
    - capability_state_resolved
    - integration_state_resolved
    - l9_architecture_profile_applicability_resolved
    - l9_architecture_profile_role_binding_strengthened
    - l9_architecture_profile_compliance_restored
    - solution_surface_census_strengthened
    - first_order_intervention_bound_or_reaffirmed
    - intervention_fidelity_restored
    - reasoning_overlay_receipt_bound
    - realized_leverage_learning_recorded
  non_progress:
    - repeat_same_reasoning_without_new_input
    - rerun_same_validation_without_state_change
    - rewrite_same_plan_without_answering_defect
    - repeated_patch_without_new_evidence
    - additional_narration
defect_record:
  required_fields: [defect_id, defect_class, summary, opened_in_state, evidence_refs, status]
  optional_fields: [reason_codes, invalidates, resolved_by_refs, fingerprint]
  status_values: [open, resolved, superseded]
block_receipt_model:
  required_fields:
    - block_type
    - reason_code
    - specific_required_action
    - evidence_refs
    - completed_work_refs
    - remaining_action
    - legitimacy_evidence_refs
  block_type_values: [AUTHORITY, CAPABILITY, EVIDENCE, EXTERNAL_DEPENDENCY, NO_PROGRESS]
  legitimacy_predicates_ref: contracts/OUTCOME_OWNERSHIP.yaml#block_receipt_requirements
  validation_owner: contracts/OUTCOME_OWNERSHIP.yaml
  routing_owner: runtime/STATE_MACHINE.yaml
decision_record:
  purpose: Preserve auditable decision output without requiring hidden reasoning.
  may_store:
    - selected_candidate
    - rejected_candidate
    - material_decision_factors
    - evidence_refs
    - counterevidence_refs
    - unresolved_unknowns
    - compact_rationale
    - first_order_decision_ref
    - intervention_class
    - solution_surface_census_ref
    - intervention_fidelity_result
    - second_order_receipt_refs
    - leverage_receipt_refs
    - architecture_profile_ref
    - architecture_profile_applicability
    - architecture_profile_evaluation_ref
    - l9_role_binding_refs
  must_not_require:
    - private_chain_of_thought
    - token_level_reasoning_trace
convergence_receipt_model:
  required_fields:
    - terminal_state
    - objective_status
    - realization_mode
    - artifact_changes
    - validation_performed
    - architectural_integrity_status
    - remaining_material_unknowns
    - delivery_status
    - residual_risks
    - reasoning_overlay_status
    - intervention_fidelity_status
    - post_execution_reasoning_status
    - architecture_profile_status
  conditional_fields:
    blocked_reason:
      required_when:
        - terminal_state == BLOCKED
anti_drift:
  - live_run_state_MUST_NOT_become_source_of_architectural_law
  - state_records_evidence_and_decisions_but_does_not_redefine_contracts
  - host_adapters_MUST_NOT_maintain_independent_shadow_run_state
  - persisted_and_in_memory_representations_MUST_preserve_equivalent_semantics
  - run_state_MUST_store_reasoning_receipts_and_projections_without_becoming_the_semantic_owner
  - solution_surface_census_MUST_record_evidence_not_select_the_intervention
  - architecture_profile_MUST_constrain_L9_architecture_without_becoming_live_asset_inventory
  - role_hydration_MUST_preserve_current_evidence_requirements
  - architecture_profile_applicability_MUST_remain_distinct_from_integrated_runtime_activation
