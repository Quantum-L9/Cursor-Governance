run_state_model:
  model_id: L9.GAR.RUN_STATE.001
  version: 0.8.1
  artifact_class: runtime_state_template
  status: experimental
  semantic_owner: runtime/RUN_STATE.yaml
purpose:
  assertion: >
    Define the minimal explicit state required to execute inspect recover
    deliver and converge one GAR run without storing private chain-of-thought.
template_semantics:
  this_file_is_live_run_state: false
  instantiate_as:
    logical_name: GAR_RUN_STATE
    preferred_pattern: runtime_state/GAR_RUN_STATE.<run_id>.yaml
  persistence:
    required: false
    host_dependent: true
  mutation_authority:
    owner: runtime_state_machine
  rule: >
    A host may hold this state in memory rather than on disk, but the logical
    fields and transition invariants remain applicable.
runtime_compatibility:
  runtime_id: L9.GLOBAL_ARCHITECT.RUNTIME.001
  requires: ">=0.8.1 <0.9.0"
