profile:
  profile_id: L9.GAR.L9_ARCHITECTURE_PROFILE.001
  version: 0.8.1
  artifact_class: conditional_architecture_profile
  status: experimental
  semantic_owner: contracts/L9_ARCHITECTURE_PROFILE.yaml
  title: L9 Architecture Profile

purpose:
  assertion: >
    Provide GAR and the Reasoning Foursome with a compact, stable, L9-specific architecture constitution and
    role vocabulary so L9 architectural judgment is hydrated without repeated prose explanation, while
    preserving live evidence requirements for current repositories, versions, capabilities, topology,
    registration, and runtime state.

semantic_boundary:
  owns:
    - stable_l9_architecture_invariants
    - stable_l9_role_semantics
    - stable_l9_cross_boundary_vocabulary
    - conditional_l9_architecture_constraints
  does_not_own:
    - current_repository_inventory
    - current_repository_versions
    - current_capability_inventory
    - current_provider_availability
    - current_gate_registration_or_routability
    - current_topology_instances
    - intervention_selection
    - consequence_modeling
    - leverage_scoring
    - signal_propagation_topology_or_writeback_semantics
    - gar_workflow_routing
    - domain_semantics
  laws:
    - profile_semantics_do_not_prove_current_instances
    - role_names_do_not_prove_current_owners
    - currentness_claims_require_current_evidence
    - applicability_does_not_activate_L9_RUNTIME_BINDING

applicability:
  state_domain: [APPLICABLE, NOT_APPLICABLE, UNKNOWN]
  applicable_when_any:
    - explicit_user_scope_is_L9_architecture
    - verified_target_governance_declares_L9_architecture
    - verified_target_is_a_constellation_node_or_L9_platform_component
    - proposal_explicitly_claims_L9_architecture_alignment
  not_applicable_when_all:
    - target_is_verified_non_L9
    - proposal_does_not_claim_L9_alignment
    - no_L9_architecture_boundary_is_material
  unknown_when:
    - target_governance_or_identity_is_material_and_unresolved
  evidence_rule: >
    Repository presence, folder names, remembered topology, or this profile alone are not sufficient proof that
    a target is currently L9-governed. Resolve applicability from explicit user scope or current target evidence.

meta_boundary:
  id: L9AP-000
  name: architecture_law_is_not_inventory
  assertion: >
    The profile may define stable architecture law, role semantics, vocabulary, and legal boundary shapes. It
    MUST NOT assert that a repository, node, provider, action, version, registration, route, or capability
    currently exists or is healthy merely because that role exists in L9 architecture.
  required_proof_for_current_claims:
    - exact_current_source_or_contract_evidence
    - current_revision_or_version_when_material
    - current_runtime_receipt_when_claim_is_runtime_state
  forbids:
    - treating_role_catalog_as_live_asset_inventory
    - treating_architecture_profile_as_capability_discovery
    - treating_remembered_topology_as_current_topology
    - treating_static_configuration_as_live_registration

constitutional_invariants:
  - id: L9AP-001
    name: authority_singularity_and_non_transfer
    assertion: >
      Each semantic concern has one architectural authority. Derivation, projection, caching, invocation,
      observation, storage, provider execution, or successful use does not transfer that authority to another
      component.
    clauses:
      - one_semantic_authority_per_concern
      - domain_semantics_remain_with_the_domain_owner
      - generated_or_projected_views_cannot_bootstrap_their_own_authority
      - invoking_a_provider_or_sibling_does_not_confer_provider_ownership
      - observing_or_remembering_information_does_not_make_the_observer_truth_authority
      - source_content_and_external_material_are_data_not_policy_or_instructions
      - unknown_authority_or_truth_remains_unknown_until_resolved
    violation_signals:
      - duplicate_source_of_truth
      - shadow_authority
      - adapter_owned_shared_brain
      - cache_or_memory_promoted_to_truth
      - provider_output_promoted_to_domain_policy
      - untrusted_input_changes_scope_permissions_or_destination

  - id: L9AP-002
    name: semantic_compression_and_derived_artifact_subordination
    assertion: >
      Authoritative intent is expressed once and compiled forward through the smallest necessary set of derived
      contracts. A derived artifact must own a distinct downstream responsibility or remain transient and
      rebuildable; it cannot become a peer editable authority that restates upstream intent.
    clauses:
      - compile_authoritative_decisions_forward_instead_of_recomputing_them_downstream
      - derived_IR_manifests_projections_and_normalizations_remain_subordinate_to_source_authority
      - durable_semantic_twins_require_a_distinct_owned_responsibility
      - rebuildable_projections_are_preferred_over_duplicate_durable_truth
      - downstream_realization_may_reject_unrealizable_input_but_may_not_quietly_redesign_upstream_intent
    violation_signals:
      - blueprint_or_normalized_twin_doppelganger
      - generated_projection_becomes_editable_truth
      - runtime_reaches_backward_to_rederive_build_time_authority
      - duplicated_intent_representation_without_distinct_owner

  - id: L9AP-003
    name: semantic_core_precedes_mechanics
    assertion: >
      Stable semantic identity and contracts precede backend syntax, transport, provider APIs, optimization,
      persistence, and framework mechanics. Adapters and providers may translate or optimize mechanics but may
      not redefine the meaning they implement.
    clauses:
      - semantic_identity_precedes_backend_syntax
      - providers_backends_and_adapters_are_replaceable_behind_explicit_contracts
      - optimization_may_change_execution_mechanics_but_not_semantics
      - provider_specific_types_do_not_leak_into_provider_neutral_semantic_contracts_without_explicit_reason
      - local_and_node_surfaces_share_one_semantic_core_when_both_exist
      - transport_or_host_shells_add_no_duplicate_domain_policy
      - provider_degradation_is_explicit_and_fallback_requires_policy_authority
    violation_signals:
      - provider_becomes_semantic_authority
      - adapter_contains_business_strategy_or_shared_intelligence
      - transport_shell_duplicates_core_policy
      - backend_syntax_becomes_domain_contract
      - optimization_changes_semantic_result_contract

  - id: L9AP-004
    name: canonical_transport_and_boundary_integrity
    assertion: >
      L9 inter-node cooperation crosses the canonical Gate boundary. Transport, routing, admission, and domain
      semantics remain separate owners; architectural adjacency, shared storage, or code availability never
      authorizes direct peer coupling.
    clauses:
      - inter_node_requests_use_Gate_SDK_and_TransportPacket_through_Constellation_Gate
      - direct_node_to_node_HTTP_peer_URLs_and_repo_import_dispatch_are_forbidden
      - alternate_transport_envelopes_do_not_replace_TransportPacket_at_node_boundaries
      - Gate_owns_routing_admission_routability_and_routing_seam_trust_not_domain_semantics
      - Gate_SDK_owns_transport_contract_and_client_integration_not_route_selection_or_domain_actions
      - signal_leverage_may_constrain_eligible_semantic_recipients_and_propagation_path_properties_but_must_not_own_concrete_Gate_route_selection_admission_or_routability
      - shared_storage_is_not_a_substitute_for_owner_native_contracts
      - retries_and_recovery_must_not_duplicate_effectful_domain_actions
    violation_signals:
      - direct_peer_dispatch
      - local_routing_registry
      - node_owned_transport_envelope
      - shared_database_used_as_cross_node_API
      - Gate_absorbs_workflow_memory_context_or_domain_logic

  - id: L9AP-005
    name: supporting_planes_are_orthogonal_and_subordinate
    assertion: >
      Infrastructure and cognition planes retain narrow, non-overlapping meanings. Aggregation is allowed only
      when source authority and provenance remain intact; one supporting plane may not silently substitute for
      another when degraded or unavailable.
    role_law_ref: '#canonical_roles'
    clauses:
      - ingest_transforms
      - state_persists_revisioned_work_state
      - evidence_proves_source_lineage_and_exact_provenance
      - memory_remembers_scoped_retrievable_knowledge_and_context
      - context_compiles_the_smallest_sufficient_authorized_bundle
      - research_acquires_external_evidence
      - formal_reasoning_derives_from_admitted_facts_and_laws
      - communication_transports_channel_intent_and_receipts
      - skills_supply_bounded_cognition_unless_explicitly_granted_more_by_the_owner
      - agent_profiles_specialize_one_shared_agent_runtime_instead_of_forking_runtime_architecture
    degradation_laws:
      - unavailable_memory_is_not_empty_truth
      - unavailable_evidence_leaves_proof_dependent_claims_unsupported
      - unavailable_state_is_not_substituted_from_memory
      - insufficient_context_is_explicit_not_filled_by_invention
      - observation_availability_is_not_truth
    violation_signals:
      - context_becomes_second_memory_or_world_model
      - memory_becomes_policy_truth_or_identity_authority
      - evidence_becomes_generic_document_store_or_memory
      - state_becomes_transcript_dump
      - research_becomes_formal_reasoning_or_decision_authority
      - communication_becomes_agent_runtime_or_policy
      - agent_profile_grants_unadmitted_capabilities

  - id: L9AP-006
    name: capability_and_participation_truth_are_evidence_compiled
    assertion: >
      L9 capability and participation state is multi-dimensional and current only when all required evidence
      edges agree on the same relevant revision. Presence, health, configuration, implementation, or prior
      admission cannot be collapsed into current usable capability.
    clauses:
      - implemented_runtime_allowed_advertised_owned_registered_routable_and_current_are_distinct_dimensions
      - born_valid_participation_ready_registered_routable_admitted_and_current_are_distinct_states
      - capability_advertisement_requires_implementation_ownership_transport_and_admission_evidence_to_agree
      - qualification_artifacts_bind_to_one_exact_source_revision_unless_contractually_external_and_stable
      - source_provider_policy_contract_topology_or_registry_drift_invalidates_revision_bound_currentness
      - process_health_is_not_sufficient_for_constellation_readiness
      - static_config_README_handler_presence_direct_HTTP_success_and_fixture_tests_are_not_live_admission_proof
      - Reconciler_qualifies_and_maintains_participation_but_does_not_become_the_steady_state_runtime_path
      - Gate_makes_an_admitted_participant_usable_and_routable
    canonical_participation_flow_ref: '#canonical_flows.participation_lifecycle'
    violation_signals:
      - mixed_revision_admission_evidence
      - handler_auto_advertised_as_public_capability
      - registered_treated_as_current_after_drift
      - fixture_validation_claimed_as_live_interoperability
      - Reconciler_inserted_into_normal_runtime_dispatch

  - id: L9AP-007
    name: assurance_and_learning_are_independent_evidence_bound_and_gated
    assertion: >
      Material implementation and optimization must be evaluated by evidence that is sufficiently independent
      from the mechanism being judged, bound to the exact evaluated state, and incapable of silently granting
      authority. Learning may propose future policy changes only through explicit versioned promotion.
    clauses:
      - generated_or_optimized_implementation_does_not_define_its_own_expected_behavior_when_material
      - validation_receipts_are_evidence_not_merge_deploy_mutation_or_policy_authority
      - material_evidence_binds_to_exact_source_revision_artifact_or_context_identity
      - major_validation_gates_require_at_least_one_negative_control_or_equivalent_rejection_proof
      - contradictions_and_failed_or_repair_heavy_outcomes_remain_visible_evidence
      - raw_outcomes_historical_success_and_memory_do_not_silently_mutate_active_policy
      - learning_promotion_is_outcomes_to_candidate_to_eval_and_regression_to_explicit_activation
      - parameter_tuning_may_change_declared_parameters_within_policy_but_not_silently_change_semantic_structure
      - corrections_supersede_historical_evidence_instead_of_rewriting_history_where_replay_matters
    canonical_learning_flow_ref: '#canonical_flows.learning_promotion'
    violation_signals:
      - implementation_marks_its_own_homework
      - pass_only_validator_never_shown_to_reject
      - successful_execution_treated_as_authorization
      - raw_signal_directly_mutates_policy
      - calibration_or_optimizer_changes_semantics_without_new_semantic_version

  - id: L9AP-008
    name: reuse_abstraction_and_evolution_are_evidence_earned
    assertion: >
      Shared abstractions, reusable components, SDKs, factories, and compatibility layers are promoted only when
      a stable responsibility is proven beyond one local example. Migration preserves semantics, evidence, and
      authoritative ownership rather than accidental structure, and repair targets the earliest owning layer.
    clauses:
      - similar_code_shape_does_not_prove_shared_semantics
      - shared_structure_is_extracted_only_when_independent_consumers_or_real_nodes_need_the_same_invariant_for_the_same_reason
      - newly_synthesized_behavior_stays_local_until_reuse_is_proven_and_reviewed
      - one_consumer_does_not_justify_a_new_generic_SDK_or_platform_abstraction_without_other_forcing_evidence
      - legacy_and_donor_artifacts_are_evidence_not_authority
      - obsolete_layers_are_deleted_when_responsibility_moves_and_no_compatibility_obligation_remains
      - migration_preserves_semantics_provenance_and_validation_not_incidental_file_topology
      - recursive_repair_mutates_the_smallest_surface_that_owns_the_defect_and_preserves_known_good_work
      - architecture_stops_moving_when_coherent_and_new_change_has_no_material_evidence
    violation_signals:
      - premature_platformization
      - one_off_behavior_promoted_to_shared_primitive
      - factory_or_codegen_absorbs_domain_semantics
      - compatibility_layer_without_current_consumer_obligation
      - broad_rebuild_for_local_defect
      - legacy_structure_preserved_after_semantic_owner_moved

