canonical_vocabulary:
  WorkItem: Universal durable unit of work; not a transcript.
  Observation: Observed event, state, or input; availability does not imply truth.
  Objective: Desired outcome owned by the applicable agent, workflow, or operator authority.
  State: Revisioned scoped WorkItem state.
  ContextNeed: Bounded request for information required by a decision.
  ContextBundle: Smallest sufficient authorized context snapshot with provenance and bounded hydration.
  Decision: Output of the applicable decision authority; infrastructure does not manufacture decision authority.
  ActionIntent: Proposed bounded action before policy or autonomy evaluation.
  CapabilityRequest: Request for a declared capability through the canonical transport boundary.
  Receipt: Evidence of an attempted or completed action; receipt existence does not imply authorization or success.
  TransportPacket: Canonical inter-node transport envelope owned by the transport SDK boundary.
  AgentProfile: Declarative specialization of the shared agent runtime; not a separate runtime architecture.
  RepositoryModelPacket: Revision-bound repository semantic projection; not repository truth by itself.
  TopologyPacket: Validated topology projection; not permission to invent or mutate topology.

role_catalog_semantics:
  assertion: >
    Canonical role entries define stable architectural responsibilities and familiar L9 labels. A canonical_name is a semantic label for the role family, not proof that a repository or deployed instance with that name currently exists, owns the concern, is compatible, or is available.
  current_instance_binding_requires:
    - current_target_or_constellation_evidence
    - exact_revision_or_version_when_material
    - owner_native_runtime_evidence_when_claim_is_registration_routability_health_or_availability
  forbids:
    - role_label_as_inventory_fact
    - canonical_name_as_current_owner_proof
    - profile_role_as_runtime_capability_receipt

canonical_roles:
  gate:
    canonical_name: Constellation.Gate
    mission: Route admitted capability requests and enforce routing-seam admission, routability, and trust policy.
    owns: [registry, capability_routing, admission, routability, routing_seam_policy]
    must_not_own: [domain_semantics, workflow_state, memory, context_compilation, deployment, provider_implementation]
  transport_sdk:
    canonical_name: Gate_SDK
    mission: Own the canonical transport contract and node/client integration surface.
    owns: [TransportPacket, transport_client_semantics, signing_and_transport_config, node_transport_integration]
    must_not_own: [routing_decisions, registry_truth, domain_action_semantics, node_lifecycle_admission]
  chassis:
    canonical_name: Chassis
    mission: Supply reusable node runtime plumbing without absorbing domain meaning.
    owns: [app_factory, lifecycle_hooks, handler_registry, middleware, auth_plumbing, error_mapping, health_readiness_substrate, transport_sdk_integration]
    must_not_own: [domain_logic, domain_policy, capability_semantics]
  repository_birth:
    canonical_name: l9-repo-template
    mission: Create governed repository structure and birth provenance.
    owns: [birth_structure, birth_payload, birth_provenance]
    must_not_own: [constellation_admission, live_routability, domain_semantics]
  metadata_projection:
    canonical_name: l9-meta-injector
    mission: Project revision-bound repository semantic metadata from authoritative repository sources.
    owns: [repository_model_projection]
    must_not_own: [missing_semantic_authority, topology_semantics, admission]
  topology_compiler:
    canonical_name: l9-constellation-topology
    mission: Compile and validate topology semantics from admitted topology inputs.
    owns: [topology_semantics, topology_proof]
    must_not_own: [domain_semantics, Gate_routing, repository_birth, participation_reconciliation]
  node_reconciler:
    canonical_name: l9-node-reconciler
    mission: Qualify a born node into a legitimate current participant and reconcile participation drift.
    owns: [identity_resolution, provider_applicability, participation_qualification, admission_fingerprint, registration_orchestration, routability_verification, drift_detection]
    must_not_own: [node_birth, provider_semantics, transport_definition, chassis_runtime, topology_semantics, Gate_routing, deployment, credentials, git_or_PR_lifecycle]
  ingest:
    canonical_name: l9-ingest
    mission: Transform raw or source material into explicit admitted structured representations.
    owns: [source_parsing, transformation, normalization_for_downstream_consumers, ingest_receipts]
    must_not_own: [universal_write_API, domain_truth, memory_truth, context_policy]
  state:
    canonical_name: l9-state
    mission: Persist revisioned scoped durable WorkItem state behind replaceable persistence ports.
    owns: [WorkItem_revisions, state_transition_persistence, scoped_state_retrieval]
    must_not_own: [transcript_dumping, semantic_memory, policy_authority, storage_vendor_as_architecture]
  evidence:
    canonical_name: l9-evidence
    mission: Prove source, revision, lineage, provenance, and rebuildable derivation.
    owns: [source_provenance, exact_revision_evidence, lineage, evidence_references, rebuildable_projections]
    must_not_own: [memory, domain_truth, mixed_revision_authority]
  memory:
    canonical_name: l9-memory
    mission: Preserve and retrieve bounded durable knowledge or context without becoming truth or policy authority.
    owns: [scoped_memory_retrieval, memory_publication_contracts, bounded_hydration_support, degraded_semantics]
    must_not_own: [policy, identity, automatic_truth_promotion, unbounded_rehydration, transcript_as_default_memory]
  context:
    canonical_name: l9-context
    mission: Compile the smallest sufficient authorized ContextBundle for a declared ContextNeed.
    owns: [context_planning, source_selection_within_authority, bounded_hydration, provenance_preserving_bundle]
    must_not_own: [durable_context_database, world_model, generic_memory_store, invented_facts]
  research:
    canonical_name: l9-research
    mission: Acquire and synthesize external evidence under a declared research strategy.
    owns: [research_strategy_execution, source_acquisition, research_evidence_packaging, provider_adapter_invocation]
    must_not_own: [truth_authority, formal_deduction, agent_objective, WorkItem_lifecycle, memory_admission, domain_mutation]
  formal_reasoning:
    canonical_name: l9-formal-reasoning
    mission: Derive deterministic inspectable conclusions from admitted facts and laws through a replaceable reasoner adapter.
    owns: [formal_constraint_semantics, deductive_reasoning_semantics, solver_adapter_contract, explanation_and_conflict_receipts]
    must_not_own: [external_research, memory_truth, agent_decision_authority, workflow_orchestration, domain_mutation]
  semantic_engine:
    canonical_name: semantic_capability_node
    mission: Own one bounded domain or semantic capability and its declared actions.
    owns: [domain_semantics, owned_action_contracts, semantic_correctness]
    must_not_own: [Gate_routing, generic_transport, unrelated_domain_semantics, generic_platform_memory_or_state]
  provider_adapter:
    canonical_name: provider_adapter
    mission: Translate a stable semantic contract to one provider, backend, runtime, or tool implementation.
    owns: [translation_mechanics, provider_call_mechanics, provider_error_normalization]
    must_not_own: [semantic_policy, domain_truth, shared_intelligence, intervention_selection]
  communication_plane:
    canonical_name: l9-agent-communication-plane
    mission: Provide channel-independent communication capabilities and normalized delivery or inbound receipts.
    owns: [channel_abstraction, channel_adapters, delivery_receipt_normalization, channel_capability_exposure]
    must_not_own: [research, ingest, agent_policy, memory_truth, cognitive_runtime]
  agent_runtime:
    canonical_name: L9-AgentOS
    mission: Provide one shared agent runtime and semantic decision/action loop for many manifested agents.
    owns: [shared_agent_runtime_semantics, profile_loading, agent_level_decision_action_lifecycle, canonical_capability_calls]
    must_not_own: [Gate_routing, domain_node_semantics, memory_truth, evidence_truth, provider_specific_channels, named_agent_runtime_forks]
  agent_profile:
    canonical_name: AgentProfile
    mission: Declaratively specialize the shared agent runtime without creating a new runtime architecture.
    owns: [agent_specialization, allowed_profile_preferences, bounded_capability_preferences]
    must_not_own: [canonical_transport_vocabulary, unadmitted_capability_grants, secrets_as_truth, duplicate_runtime_code]
  skill_cognition:
    canonical_name: scoped_skill_or_cognition_module
    mission: Supply bounded expert judgment when deterministic policy or core semantics are insufficient.
    owns: [advisory_cognition_within_declared_trigger]
    must_not_own: [semantic_inputs, active_policy, durable_state, sealed_artifacts, persistence, direct_mutation_without_owner_validation]
  documentation_compiler:
    canonical_name: l9-doc-compiler
    mission: Compile current documentation from declared authoritative repository sources through one semantic core.
    owns: [documentation_compilation_semantics, generated_human_ownership_rules, documentation_drift_detection, reproducible_rendering]
    must_not_own: [repository_architecture, Git_or_PR_lifecycle, source_code_authority, topology, memory, AgentProfile_semantics]

canonical_flows:
  inter_node_request:
    shape: caller_or_AgentOS -> Gate_SDK -> Constellation.Gate -> admitted_capability_node -> Gate_SDK -> Constellation.Gate -> caller
    forbids: [direct_peer_dispatch, local_peer_routing_table, alternate_boundary_envelope]
  context_compilation:
    shape: ContextNeed -> l9-context -> Gate -> State_and_Evidence_and_Memory_as_authorized -> ContextBundle
    laws: [each_source_owner_retains_semantics, provenance_preserved, boundedness_explicit, insufficiency_explicit]
  participation_lifecycle:
    states: [BORN, IDENTIFIED, TRANSPORT_READY, META_COMPLIANT, TOPOLOGY_PROVEN, PARTICIPATION_READY, ADMISSION_READY, REGISTERED, ROUTABLE, ADMITTED, CURRENT]
    drift_cycle: [DRIFT_DETECTED, RECONCILE, CURRENT_AGAIN]
    laws: [birth_is_not_admission, registration_is_not_routability, admitted_is_not_current_after_drift, exact_revision_coherence]
  birth_to_current:
    shape: repository_birth -> RepositoryModelPacket -> TopologyPacket -> participation_reconciliation -> Gate_registration -> routability_verification -> CURRENT
    laws: [each_stage_consumes_owner_native_evidence, no_mixed_revision_admission_claim]
  agent_manifestation:
    formula: L9-AgentOS + AgentProfile = Agent_Manifestation
    laws: [one_shared_runtime, many_profiles, profile_does_not_grant_capability, profile_does_not_redefine_platform_vocabulary]
  research_to_reasoning:
    shape: ResearchNeed -> research_acquisition -> source_backed_ResearchEvidence -> fact_admission -> formal_reasoning
    laws: [research_acquires, reasoning_derives, provider_output_not_truth_by_itself, memory_context_not_automatic_fact]
  learning_promotion:
    shape: observed_outcomes -> evidence_aggregation -> policy_hypothesis -> versioned_candidate -> eval_and_regression -> explicit_activation -> active_policy
    forbids: [raw_outcome_to_active_policy, silent_self_training, success_only_learning]
  local_and_node_surface:
    shape: one_semantic_core -> local_CLI_or_SDK + optional_thin_Gate_facing_node_shell
    laws: [same_semantics, transport_shell_no_duplicate_policy, local_use_does_not_create_node_authority]

profile_evaluation:
  evaluator: EVAL-HYBRID
  evaluator_ref: runtime/EVALUATOR_REGISTRY.yaml#EVAL-HYBRID
  state_ref: $.architecture_profile
  required_output:
    - applicability
    - applicability_evidence_refs
    - active_invariant_ids
    - role_bindings
    - current_inventory_evidence_refs
    - currentness_unknowns
    - evaluation_ref
    - status
  status_domain: [NOT_EVALUATED, SATISFIED, VIOLATED, UNKNOWN, NOT_APPLICABLE]
  satisfied_when_any:
    - applicability == NOT_APPLICABLE
    - applicability == APPLICABLE and status == SATISFIED
  blocking_when_any:
    - applicability_UNKNOWN_and_L9_alignment_material
    - applicability == APPLICABLE and status in [VIOLATED, UNKNOWN]
  evidence_rule: >
    Evaluate profile compliance from loaded profile constraints plus current evidence-bound role instances. Stable role semantics may satisfy architecture-shape premises but cannot satisfy any premise about current ownership, revision, registration, routability, health, or capability availability.

foursome_binding:
  first_order:
    consumes_when_applicable:
      - active_profile_invariants_as_hard_feasibility_constraints
      - hydrated_role_semantics
      - current_evidence_bound_role_bindings
    profile_must_not:
      - select_intervention
      - rank_interventions
      - assert_current_capability_availability
  second_order:
    consumes_when_applicable:
      - architecture_profile_constraints_for_consequence_modeling
    profile_must_not:
      - own_consequence_predictions
  leverage:
    consumes_when_applicable:
      - profile_compliance_as_hard_constraint
    profile_must_not:
      - assign_leverage_score
  signal_leverage:
    consumes_when_applicable:
      - profile_boundaries_relevant_to_signal_eligibility_propagation_path_constraints_and_writeback
    profile_must_not:
      - choose_signal_topology
      - claim_signal_delivery_or_writeback_occurred
      - promote_returned_evidence_into_semantic_authority
  gar:
    consumes_when_applicable:
      - invariant_set
      - role_semantics
      - canonical_flows
      - verified_current_role_bindings
    owns:
      - profile_applicability_evidence_collection
      - current_role_binding_evidence
      - architecture_compliance_evaluation
    must_not:
      - rewrite_profile_law_in_architect_kernel
      - use_profile_as_live_inventory

anti_drift:
  - do_not_copy_first_order_second_order_leverage_or_signal_leverage_semantics_into_profile
  - do_not_turn_role_catalog_into_asset_inventory
  - do_not_encode_repo_versions_registration_or_provider_availability_as_profile_law
  - do_not_promote_domain_specific_website_mortgage_Astro_or_math_rules_into_constitution
  - do_not_duplicate_GAR_epistemic_or_convergence_law_when_profile_specific_boundary_law_is_sufficient
  - do_not_add_new_top_level_invariant_when_existing_invariant_can_absorb_the_rule_without_semantic_loss

harvest_provenance:
  source_families:
    - source: L9_REASONING_FOURSOME_PACK_v1.0.0
      admitted_for: semantic_owner_collision_avoidance_and_signal_leverage_boundary_only
    - source: l9_node_architecture_rehydration_pack_v1.0.0
      admitted_for: role_semantics_transport_participation_context_and_agent_runtime_doctrine
    - source: l9_research_and_docs_node_devpacks_v1.0.0
      admitted_for: evidence_boundary_generated_projection_local_core_remote_shell_and_untrusted_input_doctrine
    - source: l9-einesium-v1.0.0
      admitted_for: semantic_core_provider_neutrality_independent_validation_and_thin_node_shell_doctrine
    - source: MortgageOS_Node_Dev_Pack_v1.0.0
      admitted_for: domain_semantics_adapter_boundary_replayability_parameter_vs_structure_and_abstraction_promotion_doctrine
    - source: website-bot-2.0-prebuild-dev-pack-v1.0.0
      admitted_for: derived_authority_provider_neutrality_independent_conformance_scoped_cognition_learning_promotion_and_reuse_admission_doctrine
    - source: website_bot_session_rehydration_handoff_v1.0.0
      admitted_for: evidence_earned_reuse_surgical_repair_and_delta_preservation_doctrine
    - source: Astro_7.3.5_agent_skill_snapshot
      admitted_for: execution_context_awareness_compiled_manifest_pattern_and_test_independence_signal_only
  explicitly_rejected_as_constitution:
    - mortgage_economics_scoring_and_product_rules
    - Website_Bot_SEO_visual_layout_and_primitive_policy
    - Astro_specific_execution_context_paths_virtual_module_names_and_test_commands
    - MongoDB_as_architecture
    - Einesium_math_formula_or_backend_specifics
    - specific_channel_provider_brands
    - current_repo_status_versions_or_capability_sets
