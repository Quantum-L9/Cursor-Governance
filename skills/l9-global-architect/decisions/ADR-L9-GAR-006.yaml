      - evaluator_registration_PASS
      - synthetic_unknown_action_is_rejected
      - synthetic_unregistered_evaluator_is_rejected
  VR-003:
    changed_artifacts:
      - runtime/MANIFEST.yaml
      - scripts/validate_runtime_alignment.py
    closing_validation:
      - manifest_references_PASS
      - synthetic_missing_semantic_owner_path_is_rejected
  VR-004:
    changed_artifacts:
      - scripts/validate_runtime_alignment.py
    closing_validation:
      - product_decision_positive_negative_PASS
      - schema_meta_validation_PASS
  VR-005:
    changed_artifacts:
      - scripts/validate_runtime_alignment.py
    closing_validation:
      - final_state_hygiene_PASS
      - synthetic_residue_is_rejected
      - synthetic_unfinished_marker_is_rejected
