ledger_version: 1.0.0
purpose: >
  Preserve auditable claims, evidence, options, probes, proof obligations, unknowns,
  and the final action without exposing private chain-of-thought.

required_sections:
  - objective
  - cycle
  - claims
  - options
  - selected_option_ids
  - unknowns
  - probes
  - proof_obligations
  - decision
  - convergence

claim_grades: [verified, inferred, unknown]
option_dispositions: [selected, rejected, deferred, candidate]
unknown_dispositions: [resolved, probe, constraint, handoff, block]
proof_statuses: [pending, satisfied, blocked]
final_actions: [proceed, proceed_with_validation, bounded_probe, blocked_pack]
convergence_statuses: [converged, partial, blocked]

invariants:
  - every material claim has evidence or grade unknown
  - disconfirming evidence is recorded when material
  - selected_option_ids equal the revision synthesis selection
  - every routed proof obligation appears in the ledger
  - PR_READY requires every routed proof obligation satisfied
  - PR_READY requires no remaining material unknown
  - BLOCKED requires final_action blocked_pack
  - unresolved non-material divergence remains disclosed and handed off
