skill_intelligence_report:
  activation_model:
    strong_signals:
    - user requests enabling an underutilized repository capability, or removal of a CLI throughput bottleneck
    - CLI audit or benchmark must become deployable code and a PR pack
    - repository has proven latent capability (inactive components, off-by-default
      features, unread config, unused signals, broken wiring), or a throughput
      gap (delay, serialization, local cap, blocking I/O, repeated startup,
      duplicate work, lock contention)
    - findings must become leverage-ranked revision options
    - prior sandbox work must continue into a commit-ready bundle
    weak_signals:
    - improve CLI performance
    - speed up command execution
    - increase safe concurrency
    reject_signals:
    - request centers on a new rate-limiting or pacing system
    - request seeks to bypass provider quotas, billing limits, licensing, authorization,
      or abuse controls
    - request is only for an audit or explanation
    - target is not a CLI or repository-owned execution path
    - external bottleneck circumvention is requested
    false_positive_risks:
    - generic performance requests that do not require a PR pack
    - external-limit diagnosis mistaken for local optimization
    specificity_score: 1.0
    false_positive_risk_score: 0.0
    measurement: 12 labeled activation/rejection cases plus 7 adaptive route fixtures
  authority_model:
    order:
    - current_user_instruction
    - verified_repository_runtime_and_documentation_evidence
    - newest_validated_prior_artifact
    - repository_contracts_tests_and_release_configuration
    - bundled_optimize_reasoning_synthesis_and_pack_contracts
    conflict_rule: higher authority wins; unresolved material conflict becomes a ledger
      unknown, bounded probe, or blocker
  expert_heuristics:
  - condition: ownership or evidence state changes
    judgment: the previous workflow may now be too weak, too broad, or unsafe
    action: rerun the adaptive router and replace the active proof-obligation set
  - condition: multiple proof obligations remain open
    judgment: the next action should maximize decision value rather than follow ritual
      order
    action: select the smallest highest-value discriminating probe, implementation,
      or validation step
  - condition: a delay or cap appears in repository code
    judgment: it may be protective, contractual, or accidental
    action: prove ownership and purpose before removal or increase
  - condition: independent work is serialized
    judgment: bounded parallelism may unlock throughput but can break ordering or
      resources
    action: define invariants and ceilings, then test concurrency, cancellation, failure,
      and resource behavior
  - condition: benchmark conditions differ
    judgment: the speedup is not comparable evidence
    action: rerun baseline and candidate under the same workload and disclose residual
      variance
  - condition: documentation and runtime capability disagree
    judgment: silently choosing either side creates false behavior or false claims
    action: reconcile when authority is proven or preserve a disclosed divergence
      finding with owner and next action
  - condition: ledger selection differs from revision synthesis or pack output
    judgment: decision state drift makes the PR pack untrustworthy
    action: block readiness until selected options, route, ledger, plan, manifest,
      and PR body agree
  doctrine:
  - prove ownership before optimization
  - route proportionally to evidence and risk
  - correctness and external contracts outrank speed
  - comparable measured evidence outranks intuition
  - all findings precede leverage selection
  - bounded resources and deployability outrank maximum concurrency
  - claims and decisions must survive handoff in a ledger
  invariants:
  - deployable PR pack is terminal
  - audit-only output is insufficient
  - route and ledger agree
  - all active proof obligations close before PR_READY
  - every finding maps to a target and every target to an option
  - unresolved docs-code divergence is disclosed
  - external controls are not bypassed
  - three cycles maximum
  - explicit authorization is required for remote mutation
  adapter_map:
    core_default: preserve repository-native behavior, truthful capability contracts,
      bounded resources, and release path
    adapters:
    - name: adaptive_reasoning_and_revision_synthesis
      load_when: ownership, evidence, risk, divergence, or revision options must be
        resolved
      changes: route proportional proof obligations, maintain the evidence ledger,
        synthesize findings, score leverage, and freeze selected options
    - name: latent_capability_reachability
      load_when: dead wiring, dormant capability, registries, feature flags, unused
        signals, or broken producer-consumer edges are material
      changes: require bidirectional evidence, dynamic-dispatch review, rollout intent,
        wiring artifacts, and UNKNOWN fail-closed behavior
    - name: ecosystem_native_cli
      load_when: Python, Node.js/TypeScript, Go, or Rust package and entrypoint conventions
        are authoritative
      changes: preserve native build, package, binary, toolchain, install, test, release,
        and target conventions
  failure_modes:
  - mode: identity_drift
    prevention: identity validator rejects throttle-building, audit-only, and non-CLI
      objectives
  - mode: external_limit_bypass
    prevention: ownership routing forces external limits into blocked packs
  - mode: proof_obligation_theater
    prevention: route and ledger validators require exact obligation agreement and
      evidence-backed closure
  - mode: fake_speedup_or_resource_explosion
    prevention: comparable measurements and bounded resource checks are mandatory
  - mode: decision_state_drift
    prevention: ledger selection, revision synthesis, manifest, PR body, and pack
      artifacts must agree
  leverage_points:
  - adaptive routing removes irrelevant work while strengthening high-risk proof
  - the evidence ledger makes runs resumable and prevents rediscovery
  - cohesive finding-target-option synthesis exposes all revision choices
  - weighted option selection favors reusable low-drag changes
  - deterministic packs and successor handoff preserve exact deployable state
  evidence_hierarchy:
  - current repository code and executable behavior
  - reproducible baseline and candidate measurements
  - current tests, profiles, traces, and resource observations
  - operator documentation, help output, and release contracts
  - packaging and deployment configuration
  - prior validated artifacts
  - inference labeled UNKNOWN
  exemplary_gate_results:
    activation_precision: pass
    adapter_architecture: pass
    evidence_hierarchy: pass
    doctrine_extraction: pass
    expert_heuristics: pass
    failure_modes: pass
    leverage_model: pass
    self_improvement_hook: pass
    compiler_enforcement_gates: pass
    skill_intelligence_report: pass
  tier_decision: exemplary
