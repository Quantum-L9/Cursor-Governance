# Canonical campaign spec — single source of truth for a Claude Code contract chain.
# compile_contract.py derives IDs, handoff seams, source_commits, and chain_digest from this.
# NEVER hand-author IDs/seams/digest here. Order the items; the compiler wires the rest.
#
#   python scripts/compile_contract.py --spec examples/campaign-spec.example.yaml \
#       --out /tmp/out --validate --emit-artifacts
#
# Reconstructs the real PR-002..010 l9-metadata-compilation-engine campaign.

campaign:
  id_prefix: "L9-MCE"
  contract_version: "1.0.0"
  target_repo: "Quantum-L9/l9-meta-injector"
  target_branch: "claude/repo-upgrades-74swxj"
  validation:
    cold_resume:
      commands:
        - "npm run validate"
    commit_gate:
      commands:
        - "npm run validate"
  base_prerequisite:
    id: "L9-MCE-PR-001-v1.0.0"        # the validate-gate PR (already on branch)
    required_state: "merged_and_green"
  # denied_tools / halt_boundary omitted -> compiler uses the standard remote-mutation deny set.
  dpk:
    rollback_target: "git revert of the single PR commit; additive-only, no data migration"
    has_ai_feature: false
    manifest:
      schema_version: "dpk-1.0"
      repository:
        id: "l9-mce"
        name: "l9-meta-injector"
        type: "typescript-library"
        lifecycle: "beta"
        criticality: "tier-2"
        description: "L9 metadata compilation engine — identity, placement, routing, provenance."
      ownership:
        accountable_team: "Quantum-L9"
        technical_owner: "igorbeylin"
        operational_owner: "igorbeylin"
      boundaries:
        # owns = path-glob ownership (gates scope_lock.in_scope); does_not_own = forbidden capabilities.
        owns:
          - "src/**"
          - "schemas/**"
          - "tests/**"
          - "docs/**"
          - "examples/**"
          - "package.json"
          - "README.md"
          - "CHANGELOG.md"
          - "MANIFEST.json"
        does_not_own:
          - "topology scanners"
          - "signal compilers"
          - "ADR resolvers"
          - "debt resolvers"
          - "live Graphiti writes"
          - "live Neo4j writes"
      interfaces:
        inbound: []
        outbound: []

items:
  - key: "002"
    title: "Introduce Metadata v3 Schema"
    allowed_files:
      - {deliverable: "Add v3 nine-plane schema", path: "schemas/l9_meta_v3.schema.yaml"}
      - {deliverable: "Append v3 TypeScript plane types", path: "src/schema.ts"}
      - {deliverable: "Add v3 schema tests", path: "tests/schema.test.ts"}
      - {deliverable: "Append v3 contracts section", path: "docs/contracts.md"}
    forbidden_paths: ["src/inject.ts", "src/pipeline.ts"]
    forbidden_capabilities: ["package.json rename fields", "placement/sidecar/routing implementation"]
    verify_proof: "node -e \"require('./dist/schema.js')\""
    sizing: {new_files: 1, modified_files: 1, test_cases: 8, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "003"
    title: "Add Semantic Artifact Classifier"
    allowed_files:
      - {deliverable: "Add semantic artifact classifier (17 classes)", path: "src/artifact_class.ts"}
      - {deliverable: "Integrate additively with existing classify", path: "src/classify.ts"}
      - {deliverable: "Append classifier types", path: "src/schema.ts"}
      - {deliverable: "Export classifier", path: "src/index.ts"}
      - {deliverable: "Add classifier tests", path: "tests/artifact_class.test.ts"}
    forbidden_paths: ["src/inject.ts"]
    forbidden_capabilities: ["LLM-based classification", "placement/sidecar/routing implementation", "package rename"]
    preserved: [{path: "src/classify.ts", guarantee: "behavior_unchanged"}]
    verify_proof: "node -e \"require('./dist/artifact_class.js').classifyArtifact('a.ts')\""
    sizing: {new_files: 1, modified_files: 3, test_cases: 10, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "004"
    title: "Build Metadata Placement Compiler"
    allowed_files:
      - {deliverable: "Add placement compiler (pure, plans only)", path: "src/placement_policy.ts"}
      - {deliverable: "Wire artifact-class dependency", path: "src/artifact_class.ts"}
      - {deliverable: "Add PlacementPlan schema", path: "schemas/placement_plan.schema.yaml"}
      - {deliverable: "Add placement tests", path: "tests/placement_policy.test.ts"}
      - {deliverable: "Export placement API", path: "src/index.ts"}
    forbidden_paths: ["src/inject.ts", "src/pipeline.ts"]
    forbidden_capabilities: ["any file writes", "sidecar implementation", "package rename"]
    verify_proof: "node -e \"require('./dist/placement_policy.js').compilePlacementPlan\""
    sizing: {new_files: 3, modified_files: 1, test_cases: 28, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "005"
    title: "Add Metadata Field Splitter"
    allowed_files:
      - {deliverable: "Add field splitter (pure, no IO)", path: "src/field_splitter.ts"}
      - {deliverable: "Append buildAndSplitMeta", path: "src/normalize_meta.ts"}
      - {deliverable: "Export field splitter", path: "src/index.ts"}
      - {deliverable: "Add field-splitter tests", path: "tests/field_splitter.test.ts"}
    forbidden_paths: ["src/inject.ts", "src/pipeline.ts"]
    forbidden_capabilities: ["any file writes", "sidecar implementation", "package rename"]
    verify_proof: "node -e \"require('./dist/field_splitter.js').splitFields\""
    sizing: {new_files: 1, modified_files: 2, test_cases: 37, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "006"
    title: "Add Sidecar Writer and Verifier"
    allowed_files:
      - {deliverable: "Add sidecar writer/verifier", path: "src/sidecar.ts"}
      - {deliverable: "Policy-gated sidecar integration", path: "src/inject.ts"}
      - {deliverable: "Extend verifier consistency checks", path: "src/verify.ts"}
      - {deliverable: "Add sidecar schema", path: "schemas/sidecar_metadata.schema.yaml"}
      - {deliverable: "Add sidecar tests", path: "tests/sidecar.test.ts"}
    forbidden_paths: ["src/pipeline.ts"]
    forbidden_capabilities: ["networked behavior", "source mutation without placement policy", "package rename"]
    verify_proof: "node -e \"require('./dist/sidecar.js')\""
    sizing: {new_files: 2, modified_files: 4, test_cases: 20, commits: 1}
    readiness:
      # sidecar is the only PR that writes files -> security_boundaries assessed lower (real assessment)
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 8, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "007"
    title: "Add Downstream Routing Compiler"
    allowed_files:
      - {deliverable: "Add routing compiler (advisory routes only)", path: "src/routing.ts"}
      - {deliverable: "Append route types", path: "src/schema.ts"}
      - {deliverable: "Add routing schema", path: "schemas/routing.schema.yaml"}
      - {deliverable: "Export routing API", path: "src/index.ts"}
      - {deliverable: "Add routing tests", path: "tests/routing.test.ts"}
    forbidden_paths: ["src/pipeline.ts"]
    forbidden_capabilities: ["topology scanning", "signal compilation", "ADR generation", "package rename"]
    verify_proof: "node -e \"require('./dist/routing.js').compileRoutePlan\""
    sizing: {new_files: 1, modified_files: 2, test_cases: 16, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "008"
    title: "Add Post-Generation Metadata Mode"
    allowed_files:
      - {deliverable: "Add generated-artifact classifier + snapshot builder", path: "src/generated_artifacts.ts"}
      - {deliverable: "Carry pipeline (no behavior change)", path: "src/pipeline.ts"}
      - {deliverable: "Append generated-artifact types", path: "src/schema.ts"}
      - {deliverable: "Export generated-artifacts API", path: "src/index.ts"}
      - {deliverable: "Add generated-artifacts tests", path: "tests/generated_artifacts.test.ts"}
    forbidden_capabilities: ["actual topology generation", "actual signal compilation", "actual ADR generation", "package rename"]
    preserved: [{path: "src/pipeline.ts", guarantee: "behavior_unchanged"}]
    verify_proof: "node -e \"require('./dist/generated_artifacts.js').classifyGeneratedArtifact('x.json')\""
    sizing: {new_files: 1, modified_files: 3, test_cases: 40, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "009"
    title: "Add Constellation Integration Contract"
    allowed_files:
      - {deliverable: "Add constellation integration doc", path: "docs/CONSTELLATION_INTEGRATION.md"}
      - {deliverable: "Add constellation contract tests", path: "tests/constellation_contract.test.ts"}
      - {deliverable: "Add routing helper exports", path: "src/routing.ts"}
      - {deliverable: "Update architecture docs", path: "docs/architecture.md"}
    forbidden_capabilities: ["topology scanner implementation", "signal compiler implementation", "ADR resolver implementation", "package rename"]
    preserved: [{path: "src/schema.ts", guarantee: "schema_compatible_only"}]
    verify_proof: "node -e \"require('./dist/routing.js').getRoutesForPlane\""
    sizing: {new_files: 2, modified_files: 3, test_cases: 12, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 6, transition_clarity: 15}

  - key: "010"
    title: "Rename Public Identity to l9-metadata-compilation-engine"
    allowed_files:
      - {deliverable: "Rename package + bump version", path: "package.json"}
      - {deliverable: "Add engine aliases (wrap runPipelineAsync)", path: "src/index.ts"}
      - {deliverable: "Add public API compatibility tests", path: "tests/public_api.test.ts"}
      - {deliverable: "Rewrite README to engine identity", path: "README.md"}
      - {deliverable: "Add MANIFEST + campaign report", path: "MANIFEST.json"}
    forbidden_paths: ["src/pipeline.ts", "src/routing.ts", "src/generated_artifacts.ts"]
    forbidden_capabilities: ["new placement/routing/generated features", "dependency upgrades unrelated to rename", "live service integrations"]
    verify_proof: "node -e \"const e=require('./dist/index.js'); if(!e.runPipelineAsync||!e.runMetadataCompilationAsync)process.exit(1)\""
    sizing: {new_files: 4, modified_files: 2, test_cases: 36, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 6, deploy_rollback: 8, transition_clarity: 15}
