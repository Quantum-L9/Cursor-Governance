# Python-first neutrality fixture. Compiler must project these commands exactly and inject no npm.
campaign:
  id_prefix: "PY-NEUTRAL"
  contract_version: "2.7.0"
  target_repo: "ExampleOrg/python-service"
  target_branch: "claude/python-neutrality"
  validation:
    cold_resume:
      commands:
        - "python -m unittest discover -s tests -v"
    commit_gate:
      commands:
        - "python -m unittest discover -s tests -v"
        - "make pr-check"
  dpk:
    rollback_target: "git revert HEAD"
    has_ai_feature: false
    manifest:
      schema_version: "dpk-1.0"
      repository:
        id: "python-service"
        name: "python-service"
        type: "python-library"
        lifecycle: "beta"
        criticality: "tier-2"
        description: "Compiler ecosystem-neutrality fixture."
      ownership:
        accountable_team: "ExampleOrg"
        technical_owner: "platform"
        operational_owner: "platform"
      boundaries:
        owns: ["src/**", "tests/**"]
        does_not_own: ["remote deployment"]
      interfaces:
        inbound: []
        outbound: []
items:
  - key: "001"
    title: "Add parser"
    allowed_files:
      - {deliverable: "Add parser", path: "src/parser.py"}
      - {deliverable: "Add parser tests", path: "tests/test_parser.py"}
    forbidden_capabilities: ["remote deployment"]
    verify_proof: "python -m unittest tests.test_parser -v"
    sizing: {new_files: 2, modified_files: 0, test_cases: 4, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 10, deploy_rollback: 10, transition_clarity: 15}
  - key: "002"
    title: "Integrate parser"
    allowed_files:
      - {deliverable: "Integrate parser", path: "src/runtime.py"}
      - {deliverable: "Add runtime tests", path: "tests/test_runtime.py"}
    forbidden_capabilities: ["remote deployment"]
    verify_proof: "python -m unittest tests.test_runtime -v"
    sizing: {new_files: 2, modified_files: 0, test_cases: 4, commits: 1}
    readiness:
      categories: {repo_clarity: 10, arch_mapping: 15, local_reproducibility: 10, test_eval_coverage: 15,
                   security_boundaries: 10, observability_integrity: 10, deploy_rollback: 10, transition_clarity: 15}
