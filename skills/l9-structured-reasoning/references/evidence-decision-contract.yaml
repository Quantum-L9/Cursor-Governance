schema_version: 1.0.0
purpose: auditable decision state without private chain-of-thought
ledger:
  objective: string
  task_kind: plan | review | architecture | debug | decision | corpus
  claims:
    - claim_id: CLM-001
      statement: string
      evidence_refs: []
      evidence_grade: direct | corroborated | inferred | unknown
      disconfirming_evidence: []
      uncertainty_type: none | missing_data | conflict | model_risk
      decision_effect: supports | weakens | blocks
  options:
    - option_id: OPT-001
      summary: string
      benefits: []
      costs: []
      risks: []
      reversibility: high | medium | low
      evidence_refs: []
  selected_option: OPT-001 | null
  selection_rationale: string
  action: proceed | proceed_with_validation | bounded_probe | block
  evidence_quality: high | medium | low | unknown
  decision_risk: reversible | guarded | irreversible
  calibration_status: none | uncalibrated | calibrated
  stated_probability: null | number
  next_probe: string | null
  stop_condition: string
rules:
  - every material claim has evidence or unknown grade
  - inferred evidence cannot silently support irreversible action
  - rejected options retain their decisive rejection reason
  - unresolved uncertainty maps to a probe, constraint, handoff, or block
