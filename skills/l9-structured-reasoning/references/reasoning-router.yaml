schema_version: 1.0.0
purpose: route only the proof obligations that can change the decision
fields:
  task_kind:
    values: [plan, review, architecture, debug, decision, corpus]
  reasoning_depth:
    values: [rapid, standard, deep]
  epistemic_methods:
    values: [abductive, deductive, inductive, comparative]
    multi_select: true
  risk_class:
    values: [reversible, guarded, irreversible]
  evidence_state:
    values: [sufficient, partial, conflicting, absent]
  output_profile:
    values: [answer, decision_record, implementation_plan, architecture_record, debug_report, corpus_report]
proof_obligations:
  plan:
    - objective
    - dependencies
    - critical_path
    - acceptance_criteria
    - material_risks
  review:
    - evidence_chain
    - contradictions
    - missing_coverage
    - priority
    - recommended_correction
  architecture:
    - viable_options
    - tradeoffs
    - blast_radius
    - reversibility
    - migration_and_rollback
  debug:
    - reproduce
    - isolate
    - testable_hypotheses
    - disconfirming_evidence
    - minimal_fix
    - regression_proof
  decision:
    - options
    - criteria
    - evidence
    - opportunity_cost
    - selected_option
    - reconsideration_trigger
  corpus:
    - corpus_scope
    - selected_modes
    - dependency_or_pattern_map
    - gaps_with_severity
    - coherence_conflicts
    - actionable_insights
    - readiness_assessment
depth_rules:
  rapid: use for low-stakes reversible work with sufficient evidence
  standard: use for guarded work, partial evidence, or multiple dependencies
  deep: use for irreversible work, conflicting evidence, or unresolved root cause
stop_rules:
  - stop when the material uncertainty is resolved
  - stop when required proof obligations are satisfied
  - block when irreversible action lacks direct evidence or authorization
