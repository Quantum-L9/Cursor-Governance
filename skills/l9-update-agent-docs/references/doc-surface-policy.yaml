schema: l9.repo-docs.surface-policy.v2
version: 2
owner: l9-update-agent-docs

managed_regions:
  blocks:
    - id: l9_formatter_ownership
      start: '<!-- BEGIN L9 FORMATTER OWNERSHIP -->'
      end: '<!-- END L9 FORMATTER OWNERSHIP -->'
  line_tokens:
    - id: program_execution_adapter
      token: PROGRAM_EXECUTION_ADAPTER_LAYER_V1

surfaces:
  canonical_law:
    owner: repository_governance_authority
    role: canonical authority
    authority_class: canonical_authority
    requirement: external
    selectors: [CANONICAL_LAW.md]
    create_policy: external_only
    refresh_policy: external_only
    generator: null
    evidence_sources: [CANONICAL_LAW.md]
    prohibited_mutations: [edit_by_this_skill, duplicate_into_pointer_docs]
    llms_include: false
  agents:
    owner: repository_operating_instructions
    role: operating instructions
    authority_class: operating_ssot
    requirement: required
    selectors: [AGENTS.md]
    create_policy: existing_only
    refresh_policy: surgical_additive
    generator: null
    evidence_sources: [AGENTS.md, CANONICAL_LAW.md]
    prohibited_mutations: [fold_to_pointer, wholesale_rewrite, duplicate_canonical_law]
    llms_include: true
  claude:
    owner: l9-update-agent-docs
    role: agent load pointer
    authority_class: pointer
    requirement: required
    selectors: [CLAUDE.md]
    create_policy: create_if_absent
    refresh_policy: pointer_only
    generator: null
    evidence_sources: [AGENTS.md, CANONICAL_LAW.md, INVARIANTS.md, ARCHITECTURE.md]
    prohibited_mutations: [own_doctrine, ci_table_dump, registry_dump, managed_region_change]
    llms_include: false
  readme_root:
    owner: repository_human_index
    role: repository index
    authority_class: index
    requirement: conditional
    selectors: [README.md]
    create_policy: never
    refresh_policy: pointer_only
    generator: null
    evidence_sources: [README.md, AGENTS.md, CANONICAL_LAW.md]
    prohibited_mutations: [generate_from_template, replace_product_content, own_doctrine]
    llms_include: true
  architecture:
    owner: repository_architecture_index
    role: architecture map
    authority_class: index
    requirement: conditional
    selectors: [ARCHITECTURE.md]
    create_policy: never
    refresh_policy: surgical
    generator: null
    evidence_sources: [.github/workflows, config, source_tree]
    prohibited_mutations: [copy_operating_ssot, copy_canonical_law, managed_region_change]
    llms_include: true
  invariants:
    owner: repository_invariant_index
    role: invariant enforcement map
    authority_class: index
    requirement: required
    selectors: [INVARIANTS.md]
    create_policy: create_if_absent
    refresh_policy: surgical
    generator: null
    evidence_sources: [AGENTS.md, ORG_INVARIANTS.yaml, .github/workflows, .pre-commit-config.yaml]
    prohibited_mutations: [copy_org_invariant_bodies, guessed_counts, managed_region_change]
    llms_include: true
  module_readmes:
    owner: readme-pipeline-v1
    role: module documentation
    authority_class: projection
    requirement: conditional
    selectors: ['*/**/README.md']
    create_policy: generator_owned
    refresh_policy: generator_owned
    generator: repo:scripts/generate_subsystem_readmes.py
    evidence_sources: [config/subsystems/readme_config.yaml, source_tree_ast]
    prohibited_mutations: [root_readme_write, handwritten_readme_overwrite, language_parser_in_skill]
    llms_include: false
  llms_txt:
    owner: l9-update-agent-docs
    role: LLM documentation discovery index
    authority_class: projection
    requirement: optional
    selectors: [llms.txt]
    create_policy: create_if_enabled
    refresh_policy: regenerate
    generator: skill:scripts/repo_docs.py
    evidence_sources: [references/doc-surface-policy.yaml, project_adapter, published_docs_surface]
    prohibited_mutations: [own_doctrine, embed_authority_bodies, guess_published_urls, hand_maintain]
    llms_include: false
  community_health:
    owner: sync-ci-or-org-community-health
    role: community health documentation
    authority_class: external
    requirement: external
    selectors: [CONTRIBUTING.md, SECURITY.md, SUPPORT.md, CODE_OF_CONDUCT.md, '.github/ISSUE_TEMPLATE/*', '.github/PULL_REQUEST_TEMPLATE*']
    create_policy: external_only
    refresh_policy: external_only
    generator: external
    evidence_sources: [organization_community_health, sync_ci]
    prohibited_mutations: [edit_by_this_skill, duplicate_org_defaults]
    llms_include: false
  adrs:
    owner: l9-architecture-decision-records
    role: architecture decisions
    authority_class: specialist
    requirement: conditional
    selectors: [docs/adr/README.md, 'docs/adr/*.md', 'docs/decisions/*.md']
    create_policy: external_only
    refresh_policy: external_only
    generator: specialist_skill
    evidence_sources: [docs/adr, docs/decisions]
    prohibited_mutations: [author_decisions_in_repo_docs_skill, rewrite_decision_history]
    llms_include: true
  api_reference:
    owner: repository-api-docs-owner
    role: API reference
    authority_class: specialist
    requirement: conditional
    selectors: [API_REFERENCE.md, docs/api/README.md, openapi.yaml, openapi.json]
    create_policy: external_only
    refresh_policy: external_only
    generator: specialist_or_repo_owner
    evidence_sources: [public_api_surface, openapi_schema]
    prohibited_mutations: [invent_api_contract, infer_unverified_schema]
    llms_include: true

impact_rules:
  workflow_change:
    patterns: ['.github/workflows/*', '.github/workflows/**/*', '.pre-commit-config.yaml', Makefile]
    surfaces: [architecture, invariants]
  authority_change:
    patterns: [CANONICAL_LAW.md, AGENTS.md, ORG_INVARIANTS.yaml, 'rules/*', 'rules/**/*', 'ops/autonomy/*', 'ops/autonomy/**/*']
    surfaces: [agents, claude, architecture, invariants]
  public_api_change:
    patterns: ['**/api/**', '**/routes/**', '**/schemas/**', '**/models/**', 'openapi.*', '**/*.proto']
    exclude_patterns: ['tests/**', '**/tests/**']
    surfaces: [api_reference]
  module_implementation_change:
    patterns: ['**/*.py', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.xml', '**/*.sh', '**/*.tf', Dockerfile, '**/Dockerfile']
    exclude_patterns: ['tests/**', '**/tests/**', 'docs/**', '**/__pycache__/**']
    surfaces: [module_readmes]
  docs_topology_change:
    patterns: [README.md, AGENTS.md, CLAUDE.md, ARCHITECTURE.md, INVARIANTS.md, 'docs/**', config/subsystems/readme_config.yaml, skills/l9-update-agent-docs/references/doc-surface-policy.yaml]
    surfaces: [llms_txt]

semantic_harvest:
  owner: l9-intelligence-harvest
  input_schema: ../l9-intelligence-harvest/contracts/harvest-ir.schema.json
  destinations:
    agents: docs:agents
    architecture: docs:architecture
    invariants: docs:invariants
  activation:
    agents: [authority_change]
    architecture: [workflow_change, authority_change]
    invariants: [workflow_change, authority_change]
  accepted_dispositions: [PORT, PORT_WITH_HARDENING, MERGE_WITH_EXISTING, CONFIGURE]
  confirmed_evidence_required: true

capabilities:
  module_readmes:
    owner: readme-pipeline-v1
    required_paths:
      generator: scripts/generate_subsystem_readmes.py
      config: config/subsystems/readme_config.yaml
      dag: workflows/dags/readme_pipeline_dag.py
    absence_behavior: NotApplicable
    partial_behavior: BLOCKED
    partial_repair_route: l9-wire-into-repo
    polyglot_extension_owner: scripts/generate_subsystem_readmes.py
    supported_extensions: [.py]

llms_txt:
  owner: l9-update-agent-docs
  spec_version: v2
  published_surface_markers: [mkdocs.yml, mkdocs.yaml, docusaurus.config.js, docusaurus.config.ts, mint.json, gitbook.yaml, docs/.vitepress/config.js, docs/.vitepress/config.ts]
  adapter_directive_block: L9_DOCS
  surface_order: [readme_root, architecture, invariants, agents, api_reference, adrs]
