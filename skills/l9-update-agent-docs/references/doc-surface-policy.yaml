schema: l9.repo-docs.surface-policy.v3
version: 3
owner: l9-update-agent-docs

managed_regions:
  blocks:
    - id: l9_formatter_ownership
      start: '<!-- BEGIN L9 FORMATTER OWNERSHIP -->'
      end: '<!-- END L9 FORMATTER OWNERSHIP -->'
  line_tokens:
    - id: program_execution_adapter
      token: PROGRAM_EXECUTION_ADAPTER_LAYER_V1

surfaces:
  canonical_law:
    owner: repository_governance_authority
    role: canonical authority
    authority_class: canonical_authority
    requirement: external
    selectors: [CANONICAL_LAW.md]
    create_policy: external_only
    refresh_policy: external_only
    generator: null
    evidence_sources: [CANONICAL_LAW.md]
    prohibited_mutations: [edit_by_this_skill, duplicate_into_pointer_docs]
    llm_include: false
  agents:
    owner: repository_operating_instructions
    role: operating instructions
    authority_class: operating_ssot
    requirement: required
    selectors: [AGENTS.md]
    create_policy: existing_only
    refresh_policy: surgical_additive
    generator: null
    evidence_sources: [AGENTS.md, CANONICAL_LAW.md]
    prohibited_mutations: [fold_to_pointer, wholesale_rewrite, duplicate_canonical_law]
    llm_include: true
  claude:
    owner: l9-update-agent-docs
    role: agent load pointer
    authority_class: pointer
    requirement: required
    selectors: [CLAUDE.md]
    create_policy: create_if_absent
    refresh_policy: pointer_only
    generator: null
    evidence_sources: [AGENTS.md, CANONICAL_LAW.md, INVARIANTS.md, ARCHITECTURE.md]
    prohibited_mutations: [own_doctrine, ci_table_dump, registry_dump, managed_region_change]
    llm_include: true
  readme_root:
    owner: repository_human_index
    role: repository index
    authority_class: index
    requirement: conditional
    selectors: [README.md]
    create_policy: never
    refresh_policy: pointer_only
    generator: null
    evidence_sources: [README.md, AGENTS.md, CANONICAL_LAW.md]
    prohibited_mutations: [generate_from_template, replace_product_content, own_doctrine]
    llm_include: true
  architecture:
    owner: repository_architecture_index
    role: architecture map
    authority_class: index
    requirement: conditional
    selectors: [ARCHITECTURE.md]
    create_policy: never
    refresh_policy: surgical
    generator: null
    evidence_sources: [.github/workflows, config, source_tree]
    prohibited_mutations: [copy_operating_ssot, copy_canonical_law, managed_region_change]
    llm_include: true
  invariants:
    owner: repository_invariant_index
    role: invariant enforcement map
    authority_class: index
    requirement: required
    selectors: [INVARIANTS.md]
    create_policy: create_if_absent
    refresh_policy: surgical
    generator: null
    evidence_sources: [AGENTS.md, ORG_INVARIANTS.yaml, .github/workflows, .pre-commit-config.yaml]
    prohibited_mutations: [copy_org_invariant_bodies, guessed_counts, managed_region_change]
    llm_include: true
  makefile_contract:
    owner: l9-update-agent-docs
    role: repository operator command contract
    authority_class: specialist
    requirement: conditional
    selectors: [Makefile]
    create_policy: never
    refresh_policy: surgical
    generator: null
    evidence_sources: [Makefile, AGENTS.md, INVARIANTS.md, ops/config/root-file-protection.json, .github/workflows, ops/scripts]
    prohibited_mutations: [speculative_target_addition, undocumented_behavior_change, duplicate_command_authority, bypass_root_file_protection, wholesale_rewrite]
    llm_include: false
    kind: operational_contract
    ownership:
      semantic_owner: repository-operator-contract
      execution_owner: repository-native
    analysis:
      analyzer: makefile-contract-v1
      mode: deterministic_first
    mutation:
      guard: root-file-protection
  python_project_contract:
    owner: l9-update-agent-docs
    role: Python environment and tooling contract
    authority_class: specialist
    requirement: conditional
    selectors: [pyproject.toml]
    create_policy: never
    refresh_policy: surgical
    generator: null
    evidence_sources: [pyproject.toml, uv.lock, .python-version, ops/config/python-contract.json, Makefile, .pre-commit-config.yaml]
    prohibited_mutations: [speculative_dependency_addition, unverified_version_change, duplicate_dependency_authority, weaken_test_or_lint_scope, bypass_root_file_protection, wholesale_rewrite]
    llm_include: false
    kind: operational_contract
    ownership:
      semantic_owner: repository-python-contract
      execution_owner: repository-native
    analysis:
      analyzer: python-project-contract-v1
      mode: deterministic_first
    mutation:
      guard: root-file-protection
  module_readmes:
    owner: l9-update-agent-docs
    role: module documentation
    authority_class: projection
    requirement: conditional
    selectors: ['*/**/README.md']
    create_policy: create_if_absent
    refresh_policy: generator_owned
    generator: skill:scripts/generate_module_readmes.py
    evidence_sources: [filetree.md, source_tree, source_tree_ast, target_native_contracts, config/subsystems/readme_config.yaml]
    prohibited_mutations: [root_readme_write, handwritten_readme_overwrite, unowned_overwrite, llm_authored_readme, donor_repo_import, config_invented_target, unsupported_semantic_inference]
    llm_include: false
  filetree:
    owner: l9-update-agent-docs
    role: repository filetree inventory
    authority_class: projection
    requirement: required
    selectors: [filetree.md]
    create_policy: create_if_absent
    refresh_policy: generator_owned
    generator: skill:scripts/doc_filetree.py
    evidence_sources: [source_tree]
    prohibited_mutations: [hand_maintain, llm_authored_filetree, own_doctrine, unowned_overwrite]
    llm_include: true
  llm_txt:
    owner: l9-update-agent-docs
    role: LLM documentation discovery index
    authority_class: projection
    requirement: required
    selectors: [llm.txt]
    create_policy: create_if_absent
    refresh_policy: generator_owned
    generator: skill:scripts/repo_docs.py
    evidence_sources: [references/doc-surface-policy.yaml, project_adapter]
    prohibited_mutations: [own_doctrine, embed_authority_bodies, guess_published_urls, hand_maintain, unowned_overwrite, leave_legacy_llms_txt]
    llm_include: false
  community_health:
    owner: sync-ci-or-org-community-health
    role: community health documentation
    authority_class: external
    requirement: external
    selectors: [CONTRIBUTING.md, SECURITY.md, SUPPORT.md, CODE_OF_CONDUCT.md, '.github/ISSUE_TEMPLATE/*', '.github/PULL_REQUEST_TEMPLATE*']
    create_policy: external_only
    refresh_policy: external_only
    generator: external
    evidence_sources: [organization_community_health, sync_ci]
    prohibited_mutations: [edit_by_this_skill, duplicate_org_defaults]
    llm_include: false
  adrs:
    owner: l9-architecture-decision-records
    role: architecture decisions
    authority_class: specialist
    requirement: conditional
    selectors: [docs/adr/README.md, 'docs/adr/*.md', 'docs/decisions/*.md']
    create_policy: external_only
    refresh_policy: external_only
    generator: specialist_skill
    evidence_sources: [docs/adr, docs/decisions]
    prohibited_mutations: [author_decisions_in_repo_docs_skill, rewrite_decision_history]
    llm_include: true
  api_reference:
    owner: repository-api-docs-owner
    role: API reference
    authority_class: specialist
    requirement: conditional
    selectors: [API_REFERENCE.md, docs/api/README.md, openapi.yaml, openapi.json]
    create_policy: external_only
    refresh_policy: external_only
    generator: specialist_or_repo_owner
    evidence_sources: [public_api_surface, openapi_schema]
    prohibited_mutations: [invent_api_contract, infer_unverified_schema]
    llm_include: true

impact_rules:
  workflow_change:
    patterns: ['.github/workflows/*', '.github/workflows/**/*', '.pre-commit-config.yaml']
    surfaces: [architecture, invariants]
  makefile_contract_change:
    patterns: [Makefile, '.github/workflows/*', '.github/workflows/**/*', 'ops/scripts/*', 'ops/scripts/**/*']
    surfaces: [makefile_contract, architecture, invariants]
  python_contract_change:
    patterns: [pyproject.toml, uv.lock, .python-version, requirements.txt, conftest.py, .pre-commit-config.yaml, ops/config/python-contract.json, 'skills/*/scripts/self_test.py']
    surfaces: [python_project_contract, invariants]
  authority_change:
    patterns: [CANONICAL_LAW.md, AGENTS.md, ORG_INVARIANTS.yaml, 'rules/*', 'rules/**/*', 'ops/autonomy/*', 'ops/autonomy/**/*']
    surfaces: [agents, claude, architecture, invariants]
  public_api_change:
    patterns: ['**/api/**', '**/routes/**', '**/schemas/**', '**/models/**', 'openapi.*', '**/*.proto']
    exclude_patterns: ['tests/**', '**/tests/**']
    surfaces: [api_reference]
  module_implementation_change:
    patterns: ['**/*.py', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.xml', '**/*.sh', '**/*.tf', Dockerfile, '**/Dockerfile']
    exclude_patterns: ['tests/**', '**/tests/**', 'docs/**', '**/__pycache__/**']
    surfaces: [module_readmes, filetree]
  docs_topology_change:
    patterns: [README.md, AGENTS.md, CLAUDE.md, ARCHITECTURE.md, INVARIANTS.md, filetree.md, 'docs/**', config/subsystems/readme_config.yaml, skills/l9-update-agent-docs/references/doc-surface-policy.yaml]
    surfaces: [llm_txt, filetree]

semantic_harvest:
  owner: l9-intelligence-harvest
  input_schema: ../l9-intelligence-harvest/contracts/harvest-ir.schema.json
  destinations:
    agents: docs:agents
    architecture: docs:architecture
    invariants: docs:invariants
  activation:
    agents: [authority_change]
    architecture: [workflow_change, makefile_contract_change, authority_change]
    invariants: [workflow_change, makefile_contract_change, python_contract_change, authority_change]
  accepted_dispositions: [PORT, PORT_WITH_HARDENING, MERGE_WITH_EXISTING, CONFIGURE]
  confirmed_evidence_required: true

capabilities:
  module_readmes:
    owner: l9-update-agent-docs
    required_paths:
      generator: skill:scripts/generate_module_readmes.py
      config: config/subsystems/readme_config.yaml
      dag: workflows/dags/readme_pipeline_dag.py
    absence_behavior: NotApplicable
    partial_behavior: PARTIAL
    partial_repair_route: l9-update-agent-docs
    polyglot_extension_owner: skill:scripts/generate_module_readmes.py
    supported_extensions: [.py, .sh]

llm_txt:
  owner: l9-update-agent-docs
  spec_version: v2
  published_surface_markers: [mkdocs.yml, mkdocs.yaml, docusaurus.config.js, docusaurus.config.ts, mint.json, gitbook.yaml, docs/.vitepress/config.js, docs/.vitepress/config.ts]
  adapter_directive_block: L9_DOCS
  default_enabled: true
  surface_order: [readme_root, filetree, architecture, invariants, agents, claude, api_reference, adrs]
