integration:
  id: L9.CODING_AGENT.L9_BINDING.001
  version: 1.3.0
modes:
  STANDALONE:
    default: true
    rule: execute from current user and project authority without assuming L9 runtime integration
  L9_PROFILE_AWARE:
    activate_when:
      - explicit_l9_scope
      - current_target_evidence_proves_l9_profile_applicability
    rules:
      - consume_current_l9_architecture_profile_or_hydration_when_available
      - do_not_infer_live_node_inventory_or_versions_from_static_profile
      - preserve_one_semantic_authority_per_concern
      - reuse_existing_capability_before_creating_duplicate_mechanism
      - keep_provider_specific_mechanics_behind_owner_defined_ports_when_applicable
      - respect_gate_and_transport_ownership_declared_by_current_authority
      - memory_context_evidence_state_and_authority_remain_distinct_concerns
  GAR_BOUND:
    activate_when:
      - a_current_locked_gar_execution_contract_is_explicitly_bound
    rules:
      - gar_contract_defines_architectural_semantic_envelope
      - coding_agent_may_not_rewrite_the_contract_to_fit_implementation
      - architecture_conflict_returns_to_gar
activation_law: repository_name_or_skill_presence_alone_does_not_activate_a_mode
canonical_invariant_binding:
  purpose: Bind the applicable L9 global invariants from their canonical owner, by exact identity and verified
    provenance, during intake and before the first mutation, in every mode. This section is consumer procedure
    only; it holds no invariant text and no local copy of upstream law.
  applies_in_modes: [STANDALONE, L9_PROFILE_AWARE, GAR_BOUND]
  mode_independence: Constitutional binding is not Gate admission, runtime transport, or L9_PROFILE_AWARE
    activation. It requires no Program Execution, Gate, State, Graphiti, or L-CTO runtime.
  upstream:
    semantic_owner: Quantum-L9/.github
    profile_ref: l9.projection/coding-agent-execution@1
    profile_class: runtime
    profile_consumer: Cursor-Governance
    source_class: invariants
    source_ref: l9.source/invariants@1
    selection_form: one l9.selector/v1 equality filter per invariant ($.invariants[?(@.id=="<id>")]); the
      consumer re-selects only that form and reports any other selector shape as BLOCKED
      PROFILE_SELECTOR_FORM_UNRESOLVED. The profile, not the invariant scope, decides what is bound.
    payload_shape: record-preserving, as the producer emits it; the one selected section (invariants) holding
      each selected source record whole, in source order
    owner_artifacts:
      profile_catalog: semantics/projection_profiles.yaml
      source_registry: semantics/canonical_sources.yaml
      projection_engine_contract: semantics/projection_engine_contract.yaml
      projection_artifact_schema: semantics/projection_artifact.schema.yaml
      compiler_receipt_schema: semantics/compiler_receipt.schema.yaml
      producer_role_registry: semantics/vocabulary.yaml#organizational_target
      invalidation_law: semantics/semantic_dependency_model.yaml#invalidation_rules
    governing_invariant_refs:
      - L9-OWNER-001
      - L9-PROJECTION-001
      - L9-PROV-001
      - L9-COORD-001
      - L9-UNKNOWN-001
      - L9-VALIDATION-001
    revision_policy: pin the exact authority revision per run; never hardcode one into this pack
  accepted_input:
    supplied_by: an upstream publication mechanism that makes producer-emitted, verified artifacts available;
      this pack does not assume that mechanism or any producer is operational
    producer_execution: not a consumer step. The run never invokes a producer, Semantic Compiler, or publication
      pipeline to create the projection it binds; an absent projection stays BLOCKED_UPSTREAM_PROJECTION_PRODUCER
    artifact: producer-emitted l9.projection-artifact/v1 for the profile and source above
    receipt: producer-emitted l9.compiler-receipt/v1 with operation projection and result pass
    revision_pin: required 40-hex authority revision taken from an independent record of the published revision,
      never from the artifact, receipt, or checkout being verified; absent or malformed pins are BLOCKED
    authority_root: Quantum-L9/.github checkout at the pinned revision, fetched from the canonical owner, whose
      origin (exact github.com host and repository), HEAD, clean semantics/, and a fetched origin ref containing
      the pin are observed. HEAD, origin, and refs are local state the operator must control; law bytes are read
      from the pinned commit objects with recomputed hashes, never from the working tree or index
    offline_cache: a previously verified artifact and receipt are usable only when re-verified against an
      authority root whose current source and profile digests still match
  not_accepted:
    - a_projection_this_run_generated_by_invoking_a_producer
    - an_unpinned_run_or_a_pin_read_from_the_inputs_being_verified
    - an_authority_revision_that_no_fetched_origin_ref_contains
    - local_yaml_or_rule_text_restating_upstream_law
    - readme_or_doc_assertions
    - path_or_file_name_alone
    - cached_text_without_provenance
    - receipt_not_bound_to_the_artifact_digests
    - model_recall_of_invariant_text
  verifier:
    script: scripts/verify_canonical_binding.py
    interpreter: $HOME/.cursor-governance/.venv/bin/python per AGENTS.md section 5; an interpreter without PyYAML
      returns BLOCKED VERIFIER_INTERPRETER_UNRESOLVED
    invocation: <interpreter> scripts/verify_canonical_binding.py --authority-root <.github> --artifact <projection>
      --receipt <receipt> --expect-revision <pin> [--require-invariant <id> ...]
    freshness_invocation: <interpreter> scripts/verify_canonical_binding.py --authority-root <.github> --prior-binding
      <binding.json> --artifact <projection> --receipt <receipt> --expect-revision <pin>
    pin_rule: The verifier binds every law byte to the pinned commit by recomputed object hashes, and records
      revision_basis caller_pinned_not_authenticated. It cannot prove the pin is the published revision; that
      trust comes from the independent record, so a pin chosen by the run being checked is not a binding.
    producer_rule: The receipt producer must be a component .github assigns the projection role. Receipts are
      unkeyed, so this narrows identity but cannot authenticate it; authentication needs upstream signed receipts.
      Each binding records producer_authentication unauthenticated_unkeyed_receipt.
    exit_codes: {BOUND: 0, CURRENT: 0, REJECTED: 1, usage: 2, BLOCKED: 3, STALE: 4}
    digest_conventions: Upstream defines semantic_digest without fixing an algorithm. The verifier recomputes
      source digests as sha256 of raw source bytes (the convention .github ledgers record) and content digests as
      sha256 of canonical JSON (sorted keys, compact separators, UTF-8), the convention the admitted producer
      l9-semantic-compiler emits and the architecture-intelligence consumer verifies. projection_digest is the
      envelope digest, over every artifact field but projection_digest itself; the receipt output names
      <profile>#<source> and binds that digest. A producer using another canonicalization fails closed, never open.
    emits: one binding record; it never emits, synthesizes, or repairs a projection
  selection:
    rule: Bind only the global invariants applicable to the bound execution contract, by id, passed as
      --require-invariant. An empty selection binds the full verified global set by reference, not by local copy.
    preserves: existing domain-specific implementation methodology and implementation-detail sovereignty
  binds_into:
    run_state.authority.sources: binding record (profile ref and digest, source ref and digest, authority revision,
      projection digest, receipt identity and digest, applicable invariant ids and digests)
    run_state.contract.authority_refs: profile_ref plus applicable invariant ids
    run_state.semantic_envelope.boundary_refs: applicable invariant ids with their digests
    run_state.contract.unresolved_unknowns: every non-BOUND outcome with its reason
  outcomes:
    BOUND: proceed; the binding is part of the semantic envelope
    CURRENT: prior binding still valid; reuse it without re-projection
    REJECTED: forged, wrong-profile, tampered, unfaithful, or unbound input, including authority objects that do not
      hash to the pin; no mutation; never retry with local law
    BLOCKED: required authority is Unknown (absent producer or projection, absent or malformed revision pin, a
      local-only authority revision, unreadable source, incomplete selector coverage, unresolved identity or payload
      shape, malformed input); no mutation
    STALE: governing source, profile, bound invariant, or projection digest changed; invalidate the binding and
      evidence derived from it, then re-bind before further mutation
  invalidation:
    law: semantics/semantic_dependency_model.yaml invalidation_rules
    rule: A change to the bound source digest, profile digest, or any bound invariant digest invalidates the
      binding. An upstream revision change that leaves them unchanged is evaluated as having no dependency impact
      and does not invalidate it. A prior binding is reused only after its artifact and receipt are re-verified.
    recheck_when: [before_first_mutation, target_or_contract_rebound, before_convergence]
  unknown_handling:
    default: Any outcome other than BOUND or CURRENT blocks mutation with typed reason
      BLOCKED_UPSTREAM_PROJECTION_PRODUCER when no producer-emitted projection exists, otherwise the verifier reason.
    no_fallback: Never fall back to local interpretation, recalled invariant text, or green-by-default.
    explicit_reauthorization: Only an explicit current user instruction, recorded verbatim in the receipt, may
      authorize this one run to proceed with the binding Unknown. The receipt then carries the Unknown, and
      convergence must not claim canonical-invariant conformance.
    contract_conflict: A verified invariant that conflicts with a locked execution contract or local rule is an
      AUTHORITY_CONFLICT escalation under runtime/MANIFEST.yaml authority_precedence. Neither side is applied
      silently, there is no mutation until it is resolved, and scope never widens implicitly.
  enforcement_scope: Instructional. The skill requires the worker to invoke the verifier; no host hook or sandbox
    enforces that invocation. Claim only what an observed verifier run establishes.
