[project]
name = "cursor-governance"
version = "2.0.0"
description = "L9 Governance — rules, skills, commands, and activation automation for Quantum-L9 coding workspaces"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Igor Beylin" }]

# Derived from actual imports in ops/graphiti/*.py and workflows/dags/*.py — not
# aspirational. Re-derive with `grep -rhoE "^(import|from) [a-zA-Z0-9_]+"` before
# adding entries here; do not add packages "for later."
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "langgraph>=0.2",
    # Program Execution System core (environment/program-execution/core) validators
    # and controller runtime import Draft202012Validator.
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
# Analysis toolchain — exact pins must match requirements.txt and l9-ci-sdk
# (sdk wins over l9-ci-core on disagreement). See AGENTS.md § toolchain.
dev = [
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    # jsonschema ships no inline types; the Program Execution validators
    # (environment/program-execution/core) type-check against Draft202012Validator.
    # Pinned to the live l9-ci-sdk requirements-ci.txt stub version (sdk wins).
    "types-jsonschema==4.26.0.20260518",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    # CI-only test plugins — the canonical suite runner uses -n auto (xdist) and
    # --timeout=300 (pytest-timeout) in its ci profile. Locked here so CI no longer
    # installs them through floating fallback pip commands outside uv.lock.
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "bandit==1.8.6",
    "pip-audit==2.9.0",
]

# Repo-root layout (rules/, skills/, commands/, ops/, ...) is not an installable
# package — pyproject.toml exists only to pin the dependency/interpreter contract.
# Without this, `uv sync` tries to build+install "cursor-governance" itself and
# setuptools' auto-discovery fails on the many top-level dirs.
[tool.uv]
package = false
# Floor-pin uv so ancient binaries fail closed, but stay compatible with
# Anthropic/Linux sandbox images that ship uv 0.8.x (0.11+ is preferred locally).
required-version = ">=0.8.0"

[tool.ruff]
line-length = 100
target-version = "py312"
# force-exclude: `exclude` alone only affects directory *discovery* (e.g. `ruff
# check .`). pre-commit invokes ruff with explicit filenames, which bypasses
# plain `exclude` — force-exclude makes the patterns apply to explicitly-passed
# paths too, so _archived reference dirs stay untouched either way.
force-exclude = true
exclude = [
    "**/_archived",
    "**/_archive",
    "**/archive",
    "**/archived",
    "current_work/harvested",
    "C_GOV_FILES",
    "WIP",
    "**/.cursor-commands",
    "**/.cursor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Long error/message strings in this skill pack are intentional evidence text;
# keep F/I/UP enforcement, suppress line-length noise only for these scripts.
[tool.ruff.lint.per-file-ignores]
"skills/l9-cli-optimization/scripts/**" = ["E501"]
# subagent-generated-data runtime/adapters/tests bootstrap sys.path before
# importing sibling modules (the packages are not installed), so imports
# legitimately follow executable statements — E402 is expected here.
"subagent-generated-data/**" = ["E402"]
"environment/agents/generated-data/**" = ["E402"]

# python_version pinned to match [project] requires-python — CI's --ignore-missing-imports
# flag is mirrored here so `uv run mypy .` and the CI mypy step behave identically.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = [
    "_archived",
    "_archive",
    "archive",
    "archived",
    "current_work/harvested",
    "C_GOV_FILES",
    "WIP",
    "\\.cursor-commands",
    "\\.cursor",
]

# No `tests/` convention: pytest discovers from root. The repository has several
# active test suites (root discovery plus separately-isolated Claude Code autonomy,
# subagent-generated-data Wave 3, and Program Execution controller suites) whose
# topology is declared once in ops/config/python-contract.json and executed by
# ops/scripts/run_python_test_suites.py — NOT here. norecursedirs mirrors
# [tool.ruff] exclude so archived reference code and vendored governance symlinks
# are never collected.
# WIP is scratch/reference content (harvested packages, drafts, extraction
# snapshots) — it carries its own vendored test suites with dependencies
# (e.g. zep-cloud) this repo does not install; never collect it as CI tests.
[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [
    "_archived",
    "_archive",
    "archive",
    "archived",
    "current_work",
    "C_GOV_FILES",
    "WIP",
    ".cursor-commands",
    ".cursor",
    ".git",
]
# addopts carries ONLY genuine non-test false positives — test-shaped files that
# are not tests at all. Active-suite separation (Claude Code autonomy,
# subagent-generated-data Wave 3, Program Execution controller) is NOT expressed
# here: the canonical runner (ops/scripts/run_python_test_suites.py) supplies the
# active-suite ignores per ops/config/python-contract.json, so root pytest neither
# shadows those packages nor double-runs them.
#
# workflows/dags/test_pipeline_dag.py is not a pytest test — it's a DAG module
# (a "test pipeline" workflow) that only matches pytest's test_*.py naming
# convention. Its import chain (workflows.dags -> inspect_dag) hits the
# documented-but-not-yet-implemented tools.validation.validate_external_code
# gap (see TODO.md "Missing tools.validation.validate_external_code" — explicit
# 2026-07-19 decision: leave broken, do not stub). Ignored here so collection
# doesn't fail on a dormant, currently-unused code path; the underlying gap is
# untouched.
# skills/l9-cli-optimization/scripts/self_test.py is a skill self-check script,
# not a pytest test.
addopts = "--ignore=workflows/dags/test_pipeline_dag.py --ignore=skills/l9-cli-optimization/scripts/self_test.py"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
