schema: l9.execution-contracts.manifest.v1
schema_version: 2.0.0
family: l9_execution_architecture
status: active
updated: '2026-08-12'
purpose: >
  First-class execution contracts, architecture law, and templates owned by
  Cursor-Governance. Program Execution is the authority plane; providers are
  thin bindings to shared Peer Execution infrastructure.
artifacts:
  - artifact_id: l9.peer_execution.thin_adapter_law.v1
    artifact_filename: PEER_EXECUTION_THIN_ADAPTER_LAW.yaml
    path: PEER_EXECUTION_THIN_ADAPTER_LAW.yaml
    kind: architecture_law
    first_class_artifact: true
    version: 1.0.0
    status: active
    consumed_by:
      - environment/program-execution
      - environment/agents/PEER_EXECUTION.md
    not_for:
      - provider_local_policy_forks
      - duplicated_execution_cores
  - artifact_id: peer-execution-thin-adapter-adrs
    path: adr/
    kind: architecture_decisions
    first_class_artifact: true
    version: 1.0.0
    status: active
    consumed_by:
      - environment/program-execution
      - environment/agents/PEER_EXECUTION.md
  - artifact_id: canonical.template.executable_plan.v1
    artifact_filename: canonical.template.executable_plan.v1.plan.md
    path: templates/canonical.template.executable_plan.v1.plan.md
    kind: executable_plan_template
    first_class_artifact: true
    version: 1.0.0
    status: active
    pairs_with:
      - canonical.schema.plan_document.v1
    consumed_by:
      - skills/l9-plan
      - skills/l9-plan-simple
      - commands/l9-plan.md
      - commands/l9-plan-simple.md
      - environment/program-execution
    execute_via:
      - environment/program-execution
      - commands/autonomy.md
      - skills/l9-bounded-autonomy
    not_for:
      - repository_specific_plan_instances
      - free_form_mutation_without_program_lease
projections:
  - path: skills/l9-plan/references/executable-plan.pe-autonomy.template.md
    relation: symlink_to_ssot
  - path: skills/l9-plan-simple/references/executable-plan.template.md
    relation: symlink_to_ssot
  - path: .cursor/plans/_TEMPLATE.plan.md
    relation: local_mirror_not_git_ssot
