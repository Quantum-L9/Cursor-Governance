schema: l9.autonomy-contracts.manifest.v1
schema_version: 2.2.0
family: l9_autonomy_architecture
status: active
updated: "2026-11-12"
purpose: >
  First-class autonomy family registry. Root autonomy owns the provider-neutral
  authorization and bounded-concurrency runtime. Provider adapters remain thin
  and no external execution subsystem is required to provide autonomy. Program
  Execution is registered as an optional consumer of it, never a dependency.
law:
  subordinate_invariant: owns_program_state_false
artifacts:
  - artifact_id: root-autonomy-control-plane
    kind: control_plane
    first_class_artifact: true
    version: 1.0.0
    status: active
    canonical_path: autonomy/
    provider_id: root-autonomy-control-plane
    owns_program_state: false
    meta: meta/root-autonomy-control-plane.meta.md
    consumed_by:
      - environment/agents/PEER_EXECUTION.md
      - commands/autonomy.md
      - skills/l9-bounded-autonomy
      - environment/program-execution/integrations/autonomy-control-plane # optional consumer; see program-execution-autonomy-consumer
    not_for:
      - owning_program_state
      - free_form_mutation_without_program_lease
  - artifact_id: autonomy-surface-profile
    kind: surface_doctrine
    first_class_artifact: true
    version: 1.0.0
    status: active
    canonical_path: ops/autonomy/surface_profile.yaml
    meta: meta/autonomy-surface-profile.meta.md
    consumed_by:
      - CANONICAL_LAW.md
      - environment/program-execution/scripts/campaign_authority.py # reads campaign_execution; refuses without it
      - ops/scripts/project_llm_rules.py
      - environment/generated/llm-rules/zz-autonomy-surface-override.md
      - skills/l9-pr-remediation
    not_for:
      - skill_local_forks_of_surface_profile
      - adapter_prose_forks
  - artifact_id: l4-local-autonomy
    kind: local_execution_gate
    first_class_artifact: true
    version: 1.0.0
    status: active
    canonical_path: ops/autonomy/l4_local.py
    profile_fragment: l4_local_autonomy
    profile_path: ops/autonomy/surface_profile.yaml
    gate: ops/autonomy/local_execution_gate.py
    merge_gate: ops/autonomy/merge_gate.py
    merge_authority_switch: ops/config/merge-authority.json # CANONICAL_LAW §6.2.16; "disabled" = no merge-permission check on any surface
    publish_authority_registry: ops/config/publish-authority.json # per-repository publish route (CANONICAL_LAW §13); Governance-side data, never a consumer marker or env override (L9-ORG-006)
    state_path: .l9/autonomy/l4-local-phase.json
    receipt_path: .l9/autonomy/l4-release-receipt.json
    meta: meta/l4-local-autonomy.meta.md
    consumed_by:
      - rules/88-l4-local-autonomy.mdc
      - ops/hooks/l4-local-execution-gate-shell.sh
      - ops/autonomy/resolve_execution_gate.py
      - environment/agents/adapters/claude-code/hooks/local_execution_gate_wrap.py
      - skills/l9-bounded-autonomy
      - skills/l9-pr-remediation
      - ops/make/publish.mk
      - ops/scripts/run_native_publish.sh
    not_for:
      - mid_execution_push_before_release_authorized
  - artifact_id: program-execution-autonomy-consumer
    kind: consumer_binding
    first_class_artifact: true
    version: 1.0.0
    status: active
    stage: manual # retired -> manual -> registered; CANONICAL_LAW PROGRAM_EXECUTION_MANUAL_STAGE_V1
    canonical_path: environment/program-execution/integrations/autonomy-control-plane/
    provider_manifest: environment/program-execution/integrations/autonomy-control-plane/PROVIDER.yaml
    provider_id: root-autonomy-control-plane
    profile_fragment: campaign_execution
    profile_path: ops/autonomy/surface_profile.yaml
    authority_reader: environment/program-execution/scripts/campaign_authority.py
    effect_hook: environment/program-execution/integrations/autonomy-control-plane/worker_effect_hook.py
    invocation: explicit_operator_only
    note: >
      Program Execution consumes root autonomy: it reads its standing authority
      from the surface profile, takes one subordinate root lease per task, and
      authorizes every worker effect through the root gateway. The dependency
      runs one way. Root autonomy, L4 and publication do not require, import
      or resolve through Program Execution, and this entry is not a required
      artifact: deleting Program Execution leaves this registry valid once the
      entry is removed with it.
    meta: meta/program-execution-autonomy-consumer.meta.md
    consumed_by:
      - environment/program-execution/scripts/run_campaign.py
    not_for:
      - ambient_or_agent_initiated_campaigns
      - a_root_make_target_before_the_registered_stage
      - root_autonomy_depending_on_program_execution
  - artifact_id: context-sensitive-git-guardrails
    kind: destructive_risk_gate
    first_class_artifact: true
    version: 1.0.0
    status: active
    canonical_path: ops/autonomy/git_guardrails.py
    contract_id: l9-context-sensitive-git-guardrails
    contract_version: 1.0.0
    gate: ops/autonomy/local_execution_gate.py
    rule: rules/54-context-sensitive-git-guardrails.mdc
    conformance_suite: tests/ops/autonomy/test_git_guardrails.py
    human_authorization_env: L9_GIT_DESTRUCTIVE_AUTHORIZED
    owns_program_state: false
    note: >
      Decides git and destructive filesystem commands by effect, target
      sensitivity, and provable recoverability — never by subcommand name.
      Runs before the git/gh workflow exemption, which covers publish path and
      L4 phase only.
    meta: meta/context-sensitive-git-guardrails.meta.md
    consumed_by:
      - ops/autonomy/local_execution_gate.py
      - ops/autonomy/worktree_isolation_gate.py
      - rules/54-context-sensitive-git-guardrails.mdc
      - skills/l9-pr-remediation
    not_for:
      - publish_path_enforcement
      - merge_authorization
      - agent_self_authorization_of_destruction
forbidden_second_ssots:
  - path_glob: skills/**/surface_profile.yaml
    reason: surface profile must remain ops/autonomy/surface_profile.yaml
  - path_glob: environment/agents/adapters/*/autonomy/**
    reason: provider adapters must not own autonomy or scheduler runtimes
projections:
  - path: commands/autonomy.md
    relation: discovery_pointer
  - path: skills/l9-bounded-autonomy/SKILL.md
    relation: discovery_pointer
  - path: skills/l9-pr-remediation/SKILL.md
    relation: discovery_pointer
  - path: environment/generated/llm-rules/zz-autonomy-surface-override.md
    relation: generated_from_surface_profile
