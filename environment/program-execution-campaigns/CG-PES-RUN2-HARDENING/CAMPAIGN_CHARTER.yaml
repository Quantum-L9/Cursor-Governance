# objectives -----------------------------------------------------------------
objective: >
  Produce an execution-ready Program Execution System that has one current
  validation verdict, machine-enforced proof semantics, deterministic runtime
  state, explicit authority supersession, durable runtime paths, bounded
  concurrent Cursor Task execution, structured result ingestion, governed
  collector contracts, and a falsifiable Run 2 admission decision.

primary_outcomes:
  - id: OUTCOME-VALIDATION-TRUTH
    statement: >
      Exactly one generated, commit-bound system validation receipt determines
      the current implementation verdict.
  - id: OUTCOME-PROOF-SAFETY
    statement: >
      Gate and program statuses can be promoted only by fresh evidence with
      the required proof class.
  - id: OUTCOME-RESUMABILITY
    statement: >
      A new agent can resume execution without chat history from Controller
      state, the ledger, receipts, and SESSION_STATE.
  - id: OUTCOME-AUTHORITY
    statement: >
      Wave ceilings, publication modes, and executor permissions are explicit,
      bounded, and superseded only through typed receipts.
  - id: OUTCOME-CONCURRENCY
    statement: >
      A ready set of independent tasks can be dispatched concurrently through
      Cursor Tasks while the Controller remains the serial authority plane.
  - id: OUTCOME-RESULT-INGESTION
    statement: >
      Every accepted agent result becomes a validated SGD packet with a durable
      processing receipt; narrative-only PASS is impossible.
  - id: OUTCOME-PACK-READINESS
    statement: >
      Every admitted executable task has a non-null execution contract and
      every governed collector has typed request and receipt contracts.
  - id: OUTCOME-ADMISSION
    statement: >
      The campaign produces an evidence-backed Run 2 go/no-go receipt without
      executing the full constellation W0-W10 program.

# architecture_decisions -----------------------------------------------------
architecture_decisions:
  - id: ADR-CAMPAIGN-001
    decision: controller_is_serial_authority_plane
    rationale: >
      State transitions, gate evaluation, acceptance, and next-action
      calculation require deterministic serialization.
  - id: ADR-CAMPAIGN-002
    decision: cursor_tasks_are_parallel_execution_plane
    configuration:
      global_parallel_limit: 4
      default_per_repository_limit: 2
      conflicting_mutation_limit: 1
    rationale: >
      Parallel work is permitted only after the Controller computes readiness
      and autonomy leases prove resource independence.
  - id: ADR-CAMPAIGN-003
    decision: execution_pipeline_ends_at_sgd_delivery_pending
    rationale: >
      Memory ingestion and curation are separate product concerns and are not
      required for execution-pipeline completion.
  - id: ADR-CAMPAIGN-004
    decision: human_merge_only
    rationale: >
      An approval may permit a human to merge but may not grant merge execution
      authority to the Controller or an adapter.
  - id: ADR-CAMPAIGN-005
    decision: no_second_scheduler
    rationale: >
      The implementation must wrap the Program Execution ready set, autonomy
      leases, and existing Cursor Task adapters rather than create an
      independent scheduler.
  - id: ADR-CAMPAIGN-006
    decision: source_pack_is_immutable_during_execution
    rationale: >
      Runtime observations, generated contracts, and receipts belong in the
      Controller workspace, not in the bound source pack.

# scope ----------------------------------------------------------------------
scope:
  included:
    - generated commit-bound validation receipt
    - proof-class status-transition enforcement
    - Controller-derived SESSION_STATE
    - Controller-derived next_action
    - typed Handoff Receipt
    - authority supersession receipts
    - executor-permission separation
    - durable Controller entrypoint and database path
    - split definition-of-done contracts
    - blocking approver validation
    - Phase 0 autonomy rail integration
    - ready-set to leased Cursor Task dispatch
    - concurrent task isolation
    - mandatory agent result contracts
    - accepted-result to SGD packet bridge
    - processing and delivery-pending receipts
    - collector request and receipt schemas
    - non-null task execution contracts
    - activation and campaign authorization schema
    - preflight doctor
    - recovery procedures
    - negative test suite
    - end-to-end golden fixture
    - Run 2 go/no-go receipt
  excluded:
    - Graphiti ingestion
    - graphite ingestion
    - memory candidate delivery
    - memory distillation
    - memory synthesis
    - memory promotion
    - learning-closure orchestration
    - full constellation W0-W10 execution
    - Odoo enterprise or xmlsec live-stack bring-up
    - Odoo production qualification
    - automatic merge
    - release publication
    - deployment
    - VPS mutation
    - production cutover
    - destructive production actions
    - rewriting the Claude Code scheduler
    - restoring a discarded Cursor skill backup as the durable runtime home
    - wholesale import of WIP directories
    - claiming PRODUCTION_READY

# phases ---------------------------------------------------------------------
phases:
  - id: PHASE-1
    name: Execution Integrity Foundation
    sequencing: required_before_phase_2_admission
    workstreams_may_run_concurrently: true
    objectives:
      - establish_validation_truth
      - enforce_proof_classes
      - establish_runtime_resumability
      - establish_authority_lifecycle
      - separate_executor_permissions
      - establish_durable_runtime_health
    exit_gate: GATE-P1-FOUNDATION
  - id: PHASE-2
    name: Concurrent Execution and Structured Result Spine
    entry_gate: GATE-P1-FOUNDATION
    workstreams_may_run_concurrently: true
    workstreams:
      - WS-2A-CONCURRENCY
      - WS-2B-RESULT-INGESTION
      - WS-2C-COLLECTORS-CONTRACTS
      - WS-2D-ACTIVATION-POLICY
      - WS-2E-VERIFICATION
    exit_gate: GATE-P2-INTEGRATION
  - id: PHASE-3
    name: Run 2 Admission
    entry_gate: GATE-P2-INTEGRATION
    workstreams_may_run_concurrently: false
    objective: issue_go_or_no_go_only
    exit_gate: GATE-RUN2-ADMIT

# workstreams ----------------------------------------------------------------
phase_2_workstreams:
  - id: WS-2A-CONCURRENCY
    title: Concurrent Cursor Task Execution
    owns:
      - readiness_to_dispatch_compilation
      - autonomy_leases
      - bounded_parallel_dispatch
      - join_behavior
      - task_resource_isolation
    does_not_own:
      - Controller_state_transitions
      - result_acceptance
      - collectors
      - campaign_authority
  - id: WS-2B-RESULT-INGESTION
    title: Structured Agent Result Ingestion
    owns:
      - mandatory_result_schema
      - result_validation
      - result_acceptance_receipt
      - result_rejection_receipt
      - SGD_packet_creation
      - SGD_processing_receipt
      - DELIVERY_PENDING_receipt
    does_not_own:
      - agent_scheduling
      - memory_delivery
      - gate_definition
  - id: WS-2C-COLLECTORS-CONTRACTS
    title: Collector and Execution Contract Completeness
    owns:
      - collector_request_schema
      - collector_receipt_schema
      - collector_registry
      - collector_self_tests
      - execution_contract_compilation
      - null_contract_rejection
    does_not_own:
      - concurrency_policy
      - publication_authority
  - id: WS-2D-ACTIVATION-POLICY
    title: Campaign Activation and Authority Policy
    owns:
      - activation_schema
      - publication_ceiling
      - merge_mode
      - runtime_ceiling
      - authority_supersession
      - Auto_HITL_boundaries
      - conflict_resolution_order
    does_not_own:
      - task_implementation
      - evidence_collection
  - id: WS-2E-VERIFICATION
