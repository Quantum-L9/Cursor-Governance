# risks ----------------------------------------------------------------------
risks:
  - id: RISK-01
    risk: second_scheduler_is_created
    mitigation: >
      Require adapters to consume Controller readiness and autonomy leases;
      prohibit independent task graph ownership.
  - id: RISK-02
    risk: Controller_parallelism_causes_state_races
    mitigation: >
      Keep Controller state transitions serial and place execution fan-out in
      Cursor Tasks.
  - id: RISK-03
    risk: campaign_approval_inflates_executor_authority
    mitigation: >
      Model action approval and executor permission as independent fields.
  - id: RISK-04
    risk: stale_validation_report_appears_current
    mitigation: >
      Bind the generated validation receipt to the target commit and expire or
      reject reports for other commits.
  - id: RISK-05
    risk: dated_evidence_promotes_live_status
    mitigation: >
      Enforce proof-class and freshness rules in the Controller transition
      function.
  - id: RISK-06
    risk: source_pack_is_mutated_during_campaign
    mitigation: >
      Mount or treat the bound pack as read-only and direct generated content
      to the Controller workspace.
  - id: RISK-07
    risk: separate_workstreams_fork_shared_contracts
    mitigation: >
      Phase 1 freezes shared schema IDs before Phase 2 implementation begins.
  - id: RISK-08
    risk: SGD_delivery_pending_is_misrepresented_as_memory_success
    mitigation: >
      Declare DELIVERY_PENDING as the terminal boundary of this campaign and
      prohibit memory-success statuses.

# output_file_digests --------------------------------------------------------
output_file_digests:
  algorithm: sha256
  canonicalization: utf8_lf_sorted_keys
  canonicalization_method: >
    Each YAML file is parsed and re-serialized as UTF-8 JSON with lexicographically
    sorted keys and compact separators (',' and ':'); sha256 is taken over that
    canonical byte stream. Reproduce with:
    python3 -c "import yaml,json,hashlib,sys;
    print(hashlib.sha256(json.dumps(yaml.safe_load(open(sys.argv[1])),sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest())" FILE.yaml
  charter_records:
    CAMPAIGN_AUTHORIZATION.yaml: 56a4bf3b026996a2d7a4fc932ec3a9adad9b2771e55e78c2f3c0fe8ad57317fa
    CAMPAIGN_EXECUTION.yaml: f7406d669d8fd361ca767b8bfc9bbdda3aa6c5c62a694fb0652d5f73e39c0836
  pack_digest:
    definition: >
      sha256 of the canonical (utf8_lf_sorted_keys) concatenation of all three
      generated files in ordinal order (CAMPAIGN_CHARTER.yaml,
      CAMPAIGN_AUTHORIZATION.yaml, CAMPAIGN_EXECUTION.yaml). Because the charter
      would otherwise contain its own digest, the pack_digest value is not stored
      inside any pack file; it is emitted with the compile receipt and is
      recomputable from the three files as written.
    charter_self_field_excluded: pack_digest.value
