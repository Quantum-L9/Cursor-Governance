schema: 1

# Workspaces where ESLint owns lint/format. The IDE profile must NEVER set Biome as
# editor.defaultFormatter here, and must never write a biome.json into the repo.
# Project-level ESLint/Prettier config in these repos is Founder-owned and out of scope.
#
# Empty: Website-Bot and SEO-Bot activate Biome. A workspace is eslint_owned
# only via the heuristic below (eslint config present, no biome.json).
eslint_owned_repos: []

# Detection order — first match wins, workspace is classified eslint_owned.
#   1. basename(workspace) case-insensitively equals an entry above
#   2. any path segment of the workspace equals an entry above (nested / parent-opened folders)
#   3. heuristic: eslint.config.* or .eslintrc.* present at depth <= 2 AND no biome.json / biome.jsonc at depth <= 2
# Otherwise the workspace is classified biome_default.
heuristic:
  enabled: true
  max_depth: 2
  eslint_markers:
    - "eslint.config.*"
    - ".eslintrc*"
  biome_markers:
    - "biome.json"
    - "biome.jsonc"
