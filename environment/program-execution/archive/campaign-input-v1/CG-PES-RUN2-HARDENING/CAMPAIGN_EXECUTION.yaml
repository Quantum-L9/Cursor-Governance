evidence_model:
  proof_classes:
    - id: template
      rank: 0
      meaning: static definition or schema evidence
    - id: dated_snapshot
      rank: 1
      meaning: historical observation not guaranteed current
    - id: local_replay
      rank: 2
      meaning: reproducible local execution against bound sources
    - id: live_readonly
      rank: 3
      meaning: fresh observation of a live integration without mutation
    - id: live_mutation
      rank: 4
      meaning: fresh controlled mutation and observed result
    - id: production
      rank: 5
      meaning: production-environment evidence
  evidence_required_fields:
    - evidence_id
    - proof_class
    - observed_at
    - valid_until
    - repository
    - source_head
    - environment_identity
    - commands
    - raw_artifact_refs
    - raw_artifact_digests
    - supported_claims
    - unknowns
    - collector_version
    - receipt_digest
  transition_policy:
    PACK_DEFINITION_READY:
      minimum_proof_class: template
    LOCAL_EXECUTION_PASS:
      minimum_proof_class: local_replay
    LIVE_READONLY_QUALIFIED:
      minimum_proof_class: live_readonly
    LIVE_INTEGRATION_PASS:
      minimum_proof_class: gate_defined
      allowed_values:
        - live_readonly
        - live_mutation
      freshness_required: true
      environment_identity_required: true
    PRODUCTION_READY:
      minimum_proof_class: production
      independent_verifier_required: true
      human_approval_required: true
      authorized_in_this_campaign: false

