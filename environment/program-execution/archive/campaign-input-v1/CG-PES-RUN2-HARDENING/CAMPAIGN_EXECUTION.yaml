golden_path:
  id: GOLDEN-RUN2-SPINE
  purpose: >
    Prove bounded concurrent dispatch, structured result acceptance, SGD
    conversion, delivery-pending receipts, and chat-free resumability.
  fixture:
    task_count: 2
    task_type: independent_read_only_recon
    repositories:
      conflict: false
    concurrency:
      expected_parallel: true
    memory_services:
      required: false
      permitted: false
  steps:
    - Controller_validates_campaign_and_computes_ready_set
    - Controller_acquires_nonoverlapping_leases
    - Cursor_adapter_dispatches_two_tasks
    - both_tasks_return_AGENTS_RESULT_documents
    - Controller_validates_and_accepts_or_rejects_each_result
    - accepted_results_convert_to_SGD_packets
    - processor_emits_processing_receipts
    - delivery_boundary_emits_DELIVERY_PENDING_receipts
    - Controller_releases_leases
    - Controller_writes_SESSION_STATE
    - Controller_calculates_next_action
    - fresh_agent_resumes_from_receipts_without_chat
  pass_criteria:
    - at_least_two_tasks_overlap_in_execution_time
    - no_resource_conflict
    - zero_narrative_only_pass
    - every_accepted_result_has_all_required_receipts
    - SESSION_STATE_digest_valid
    - resume_test_pass
    - no_memory_service_invocation

