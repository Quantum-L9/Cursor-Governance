      - lease_isolation_receipt
    no_go_action: block_concurrency_integration
  - id: CP3
    after: C04
    requires:
      - SGD_packet_receipt
      - processing_receipt
      - DELIVERY_PENDING_receipt
    no_go_action: block_result_spine
  - id: CP4
    after: C07
    requires:
      - zero_null_execution_contracts
      - collector_self_tests
    no_go_action: block_pack_admission
  - id: CP5
    after: C10
    requires:
      - activation_validation
      - human_only_merge_test
      - supersession_test
      - gate_transition_test
    no_go_action: block_campaign_activation
  - id: CP6
    after: C13
    requires:
      - golden_path_PASS
      - doctor_PASS
      - readiness_score_at_least_85
      - current_validation_verdict_APPROVED
      - explicit_operator_admission
    no_go_action: issue_RUN2_NO_GO

admission:
  gate_id: GATE-RUN2-ADMIT
  default_result: NO_GO
  required_for_GO:
    - GATE-P1-FOUNDATION_PASS
    - GATE-P2-INTEGRATION_PASS
    - golden_path_PASS
    - doctor_PASS
    - unattended_wave0_readiness_score_at_least_85
    - current_validation_receipt_APPROVED
    - no_blocking_unknown_approvers
    - no_null_admitted_execution_contracts
    - no_pack_mutation
    - explicit_human_admission_receipt
  GO_authorizes:
    - generation_of_separate_Run_2_activation_pack
  GO_does_not_authorize:
    - full_constellation_execution
    - merge
    - release
    - deployment
    - production_claim
    - memory_ingestion

final_receipts:
  required:
    - SYSTEM_VALIDATION_RECEIPT
    - PHASE_1_EXIT_RECEIPT
    - PHASE_2_INTEGRATION_RECEIPT
    - GOLDEN_PATH_RECEIPT
    - DOCTOR_RECEIPT
    - READINESS_SCORE_RECEIPT
    - RUN2_ADMISSION_RECEIPT
