  mandatory:
    - id: PF-001
      check: target_repository_and_commit_bind
      pass_when: >
        Repository identity, target branch, and HEAD exactly match compiled
        authorization values.
    - id: PF-002
      check: source_pack_digest
      pass_when: >
        SHA-256 equals dff1e09a2ce5cd62bdf6841fb29f3b959aa52ebee8acec8af352d1eebe4f0180.
    - id: PF-003
      check: program_lock_digest
      pass_when: >
        Program Lock digest equals
        c78baebb67318a532f2e79f24674d0d8aa5cf71f16476e6134233f851ac3aafe.
    - id: PF-004
      check: source_pack_immutability
      pass_when: >
        Pack is clean and configured read-only for campaign execution.
    - id: PF-005
      check: Controller_entrypoint
      pass_when: >
        environment/program-execution/core/program-execution-controller-template/scripts/pec.py
        exists, is executable, and reports control-plane version 2.0.0.
    - id: PF-006
      check: runtime_database_singleton
      pass_when: >
        /root/.l9/programs/cg-pes-run2-hardening/runtime/state.sqlite is the only
        authoritative Controller database and no competing control.db is accepted.
    - id: PF-007
      check: ledger_health
      pass_when: >
        Event sequence, hashes, and receipt references validate.
    - id: PF-008
      check: repositories_root
      pass_when: >
        Required repositories are available through clean clones or isolated
        worktrees under /home/user.
    - id: PF-009
      check: remote_and_branch_policy
      pass_when: >
        Observed remotes and branches match the explicit registry allowlist.
    - id: PF-010
      check: runtime_dependencies
      pass_when:
        - supported_python_available
        - required_cli_tools_available
        - gh_auth_scopes_observed_without_secret_disclosure
        - filesystem_permissions_valid
    - id: PF-011
      check: current_validation_receipt
      pass_when: >
        A generated receipt for 21d4efbea78756a23390c530f189d0fa4de25f24 exists or
        the campaign is explicitly in validation-construction mode.
    - id: PF-012
      check: blocking_approvers
      pass_when: >
        All blocking decision and authority roles resolve through the authorization
        approver_roles (all -> @cryptoxdog); no blocking approver is UNKNOWN.
