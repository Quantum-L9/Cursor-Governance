  - id: WS-03
    name: environment_and_secret_runtime
    owner: AUTH-004
    objective: Implement canonical secret/environment resolution and clone-safe Infisical materialization.
  - id: WS-04
    name: memory_and_continuity_runtime
    owner: AUTH-003
    objective: Converge hydration, exact continuity and asynchronous durable memory flow.
  - id: WS-05
    name: peer_execution_admission
    owner: AUTH-005
    objective: Gate PE autonomy on canonical readiness and prove semantic parity across peers.
  - id: WS-06
    name: conformance_and_closeout
    owner: AUTH-006
    objective: Fault-inject, independently verify, reconcile documentation and produce handoff evidence.
