decisions:
  - id: DEC-001
    question: What is the immutable Program Execution egress for this campaign?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          Exactly CAMPAIGN_SOURCE.yaml plus a machine-generated
          source-integrity-receipt.json.
  - id: DEC-002
    question: What is the desktop source of required agent secret values?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          Infisical is the source of declared desktop agent secret values;
          .env.local is not a required dependency.
  - id: DEC-003
    question: What proves an autonomous PE worker is ready?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          A fresh canonical Session Readiness Receipt produced by the shared
          session runtime and validated by PE Gate 0.
  - id: DEC-004
    question: Is hydration status mandatory model context?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          Machine hydration receipt is mandatory; human status display is optional;
          diagnostic telemetry is excluded from model context.
  - id: DEC-005
    question: How is session continuity retrieved?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          Continuity uses exact latest ResumeCapsule/checkpoint identity;
          lessons and historical knowledge remain semantic retrieval.
  - id: DEC-006
    question: Where does dependency-light Graphiti transport live?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          Stdlib MCP transport is internal to the canonical Graphiti client;
          hydration does not create a second memory front door.
  - id: DEC-007
    question: Can secret values or derived fingerprints enter receipts or model memory?
    authority_id: AUTH-001
    status: accepted
    selected_option_id: OPTION-A
    blocking_task_ids: []
    required_evidence_ids: []
    options:
      - id: OPTION-A
        description: >-
          No. Receipts record provider, capability, state and provenance only.
unknowns:
  - id: UNK-001
    statement: >-
      Exact existing Infisical project, environment, path and CLI authentication
      conventions for Cursor-Governance must be bound from current repository
      tooling and authenticated local state without exposing values.
    owner: AUTH-004
    status: open
    blocking_task_ids: [TASK-003]
    resolution_method: >-
      Inspect ops/secrets and current Infisical metadata; execute redacted identity
      and key-name-only capability probes.
    resolution_evidence_ids: [EVID-004]
  - id: UNK-002
    statement: >-
      Exact peers and surfaces required for autonomous equivalence must come from
      the current runtime binding registry rather than a hard-coded peer list.
    owner: AUTH-005
    status: open
    blocking_task_ids: [TASK-006]
    resolution_method: >-
      Resolve current registered and required peers from canonical runtime bindings.
    resolution_evidence_ids: [EVID-006]
  - id: UNK-003
    statement: >-
      Current main or execution branch may or may not already contain the pending
      Graphiti hydration remediation and must be inspected before implementation.
    owner: AUTH-003
    status: open
    blocking_task_ids: [TASK-004, TASK-005]
    resolution_method: >-
      Diff active execution revision against current memory client, hydration and
      close-session implementation before mutation.
    resolution_evidence_ids: [EVID-003]
  - id: UNK-004
    statement: >-
      Cursor desktop's optimal secret injection/materialization mechanism must be
      resolved from the current Cursor adapter while preserving the canonical
      runtime resolver and avoiding .env.local.
    owner: AUTH-004
    status: open
    blocking_task_ids: [TASK-003]
    resolution_method: >-
      Inspect the current Cursor adapter/MCP launch contract and select the thinnest
      host-specific renderer or runtime injection path.
    resolution_evidence_ids: [EVID-005]
risks:
  - id: RISK-001
    statement: Secret material may leak through logs, exceptions, receipts, test fixtures or model context.
    tier: T1
    likelihood: possible
    impact: critical
    owner: AUTH-004
    mitigations:
      - allowlist secret names before retrieval
      - never log or serialize values
      - redact subprocess output
      - negative-test receipt and context artifacts for secret leakage
  - id: RISK-002
    statement: A fallback may falsely report a fully healthy session.
    tier: T1
    likelihood: possible
    impact: critical
    owner: AUTH-002
    mitigations:
      - explicit per-lane states
      - provenance and freshness on every fallback
      - fail autonomous PE admission when required policy is unsatisfied
  - id: RISK-003
    statement: Cross-peer adapter drift may produce materially different cognitive state.
    tier: T1
    likelihood: possible
    impact: material
    owner: AUTH-005
    mitigations:
      - canonical context manifest
      - semantic context digest
      - fixture-based parity conformance across required peers
  - id: RISK-004
    statement: Session boot may become slow enough to damage interactive usability.
    tier: T2
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - parallel typed reads
      - exact continuity lookup
      - stale-while-revalidate cache
      - progressive hydration
      - boot latency telemetry
  - id: RISK-005
    statement: Async checkpoint or distillation retries may duplicate durable memory.
    tier: T2
    likelihood: possible
    impact: material
    owner: AUTH-003
    mitigations:
      - deterministic event identity
      - idempotent projection
      - retry and crash-boundary fault tests
waivers: []
prohibited_paths:
  - id: DNB-001
    statement: Do not make .env.local a required session or secret source.
    rationale: Fresh clones must self-bootstrap from canonical providers.
  - id: DNB-002
    statement: Do not duplicate boot, hydration, context or autonomy brains inside provider adapters.
    rationale: Provider adapters are transport/presentation projections only.
  - id: DNB-003
    statement: Do not create a second direct Graphiti HTTP/MCP memory client from hydration.
    rationale: One canonical memory client boundary prevents semantic and transport drift.
  - id: DNB-004
    statement: Do not place secret values or fingerprints in logs, receipts, model context, Graphiti or Git.
    rationale: Provenance does not require disclosure of secret material.
  - id: DNB-005
    statement: Do not attempt to pull GitHub Actions organization secret values onto desktop hosts.
    rationale: Desktop credentials use desktop-capable providers; Actions secrets remain job-scoped.
  - id: DNB-006
    statement: Do not let Graphiti memory override Program Controller state or active Program claims.
    rationale: PE durable typed state is execution authority.
  - id: DNB-007
    statement: Do not admit autonomous PE without a fresh valid Session Readiness Receipt.
    rationale: Autonomous execution requires machine-proven cognitive and capability readiness.
  - id: DNB-008
    statement: Do not infer active repository identity from arbitrary child checkout presence.
    rationale: Filesystem presence is not task authority.
  - id: DNB-009
    statement: Do not make inline Graphiti writes the normal session-close persistence path.
    rationale: Session continuity and distillation must be failure-isolated from the interactive close path.
  - id: DNB-010
    statement: Do not place mutable Program or session runtime state inside repository worktrees.
    rationale: Runtime state remains under $HOME/.l9.
workstreams:
  - id: WS-01
    name: baseline_and_authority_lock
    owner: AUTH-002
    objective: Bind current state, resolve blocking unknowns and preserve rollback evidence.
  - id: WS-02
    name: canonical_session_runtime
    owner: AUTH-002
