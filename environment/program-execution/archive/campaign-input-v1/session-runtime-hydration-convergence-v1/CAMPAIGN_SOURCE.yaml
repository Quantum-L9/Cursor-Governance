  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2
  required_host_surfaces:
    - environment/program-execution/core
    - environment/program-execution/peer_execution
    - environment/program-execution/adapters
    - environment/program-execution/conformance
    - environment/program-execution/registry
    - environment/program-execution/integrations
    - environment/contracts/execution
    - environment/agents
    - ops/hooks
    - ops/graphiti
    - ops/secrets
  compilation_sequence:
    - preserve_immutable_campaign_source
    - verify_source_integrity_receipt
    - instantiate_native_blueprint_and_controller
    - compile_source_into_complete_native_blueprint
    - collect_current_session_memory_secret_and_peer_runtime_evidence
    - resolve_blocking_unknowns
    - validate_blueprint_in_template_mode
    - accept_blueprint_only_after_evidence_and_authority_resolution
    - validate_blueprint_in_instantiated_mode
    - bootstrap_controller_and_create_program_lock
    - execute_reversible_local_waves
    - independently_verify_each_blocking_gate
    - execute_cross_surface_conformance_and_fault_injection
    - export_controller_handoff_receipt
    - obtain_program_owner_terminal_verdict
  authority_boundaries:
    campaign_source_owns: operator_intent_and_campaign_semantics
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_program_state_program_lock_leases_gates_and_terminal_evidence
    peer_execution_core_owns: >-
      session_admission_context_manifests_capability_readiness_shared_execution_lifecycle
    session_runtime_core_owns: >-
      canonical_boot_hydration_compilation_readiness_receipts_and_operator_status_projection
    graphiti_memory_plane_owns: durable_agent_memory_not_program_execution_state
    runtime_environment_core_owns: >-
      environment_and_secret_resolution_policy_provenance_and_local_materialization
    infisical_owns: secret_values_only
    repository_policy_owns: required_secret_names_sources_scopes_and_fallback_rules
    provider_adapters_own: transport_and_surface_translation_only
    native_session_hooks_own: launch_mechanics_only
operator_directive:
  objective: >-
    Converge Cursor-Governance on one machine-validated session runtime for every
    registered LLM and host surface. Every interactive or autonomous execution
    must resolve its environment and capabilities, hydrate the correct memory
    authority lanes, compile a bounded context packet, emit operator-visible status
    and machine receipts, and prove PE autonomy readiness before autonomous Program
    Execution admission. Fresh desktop clones must self-bootstrap required agent
    secrets from Infisical without .env.local or manual secret copying. Claude
    Web/Mobile must accept explicit environment values supplied above the setup
    script while producing the same canonical semantic runtime state.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_repository_inspection
    - read_only_remote_observation
    - infisical_secret_read_for_declared_allowlisted_keys_without_value_logging
    - local_runtime_materialization_of_gitignored_secret_files
    - reversible_repo_local_work
    - local_commit_creation_after_task_gate_pass
    - local_validation
    - independent_verification
    - conformance_execution
    - fault_injection_without_external_mutation
    - bounded_retry_of_transient_failures
    - controller_receipt_generation
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - stale_or_invalid_program_lock
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - secret_creation_rotation_or_write
    - new_external_secret_provider_or_new_credential_scope
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval
    - exact_destructive_action_approval
program:
  id: session-runtime-hydration-convergence-v1
  name: "L9 Session Runtime, Hydration, Secrets & Autonomous PE Convergence"
  version: 1.0.0
  owner: "Igor Beylin"
  definition_status: ready
  snapshot_at: "2026-08-15"
  objective: >-
    Establish one deterministic, observable and machine-enforced cognitive bootstrap
    for Cursor, Claude Code, Claude Web/Mobile, Codex, Gemini, Manus and every future
    registered peer. Fresh sessions and PE workers must enter execution with the
    same semantic governance state, authoritative Program state, validated runtime
    capabilities, correctly scoped memory, bounded context, explicit fallbacks and
    a fresh Session Readiness Receipt.
  problem_statement: >-
    Session initialization, Graphiti hydration, provider environment resolution,
    desktop secret materialization, fallback behavior and autonomous PE admission
    currently span multiple hooks, adapters and dependency assumptions. This permits
    surfaces to start with zero memory, stale or wrong repository memory, unavailable
    credentials, hidden fallback behavior, duplicated context, provider-specific
    semantics or no machine-verifiable proof that an autonomous worker is cognitively
    and operationally ready.
  target_state: >-
    A single canonical session boot and admission runtime is the source of execution
    readiness for all registered peers. Desktop clones obtain only declared required
    secrets from Infisical and atomically materialize host-required private settings;
    mobile/web consume explicitly injected environment credentials; CI uses native
    GitHub secrets and workload identity. Hydration produces typed receipts and a
    compact model-context projection. Exact continuity, authoritative Program state,
    semantic repository memory and workspace context remain separate authority lanes.
    Autonomous PE cannot start without a fresh digest-bound readiness receipt.
  scope:
    include:
      - canonical cross-surface session boot and ensure_ready runtime
      - Session Readiness Receipt
      - Hydration Receipt
      - Runtime Environment Receipt
      - Context Manifest and semantic context digest
      - ResumeCapsule v2 exact continuity state
      - optional compact and verbose operator hydration status
      - typed hydration authority lanes and explicit fallback states
      - progressive and token-budgeted context compilation
      - code-aware and freshness-aware memory filtering
      - stale-while-revalidate compiled hydration cache
      - canonical Graphiti client with stdlib-safe read transport beneath it
      - session working-state journal
      - fast deterministic continuity checkpoint projection
      - slow asynchronous LLM memory distillation
      - idempotent asynchronous write processing
      - fresh-clone Infisical desktop secret bootstrap
      - Claude Code project-local secret materialization
      - Cursor desktop runtime secret resolution
      - Claude Web/Mobile process-environment compatibility
      - GitHub Actions secret and OIDC compatibility
      - local gh credential-store and AWS SSO compatibility
      - PE Gate-0 session admission
      - active-peer semantic parity conformance
      - rehydration after compaction reconnect PE dispatch and Program Lock refresh
      - fault-injection and negative-path conformance
      - governance documentation and drift reconciliation
    exclude:
      - storing secret values in Git
      - .env.local as a required or canonical runtime contract
      - duplicating session bootstrap logic per provider
      - duplicating Graphiti memory clients or HTTP memory planes
      - treating Graphiti memory as Program Controller authority
      - automatically hydrating arbitrary child repositories because they exist on disk
      - injecting diagnostic receipts or telemetry into model context
      - retrieving GitHub organization secret values onto desktop clients
      - distributing server-only infrastructure secrets to agents
      - widening provider authority because autonomous execution is available
      - merge release publish deploy migration or destructive remote actions
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
    session_boot: l9.session-boot.v1
    session_readiness: l9.session-readiness.v1
    hydration_receipt: l9.hydration-receipt.v1
    runtime_environment_receipt: l9.runtime-env-receipt.v1
    context_manifest: l9.context-manifest.v1
    resume_capsule: l9.resume-capsule.v2
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_v2_interface_contract
    - peer_execution_thin_adapter_law
    - latest_explicit_operator_instruction
    - accepted_program_controller_state_and_program_lock
    - latest_accepted_program_decision
    - canonical_session_runtime_contracts
    - canonical_runtime_environment_and_secret_policy
    - canonical_graphiti_memory_contracts
    - verified_current_state_evidence
    - exact_rendered_task_contract
    - provider_or_surface_adapter
    - historical_memory
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - program_controller_state_outranks_memory_state
    - native_session_hooks_are_carriers_not_readiness_authorities
    - provider_adapters_translate_transport_only
    - canonical_boot_core_must_be_callable_by_interactive_sessions_and_PE_workers
    - session_boot_critical_path_must_not_require_pydantic_or_PyYAML
    - every_required_hydration_lane_must_terminate_in_an_explicit_machine_state
    - empty_result_must_never_alias_transport_or_authentication_failure
    - operator_status_is_optional_but_machine_receipt_is_mandatory
    - operator_telemetry_must_not_consume_model_context
    - continuity_uses_exact_checkpoint_resolution_not_semantic_guessing
    - semantic_memory_may_inform_but_never_replace_authoritative_resume_or_program_state
    - active_repository_identity_must_be_explicit_or_autonomous_PE_is_blocked
    - context_is_selected_by_authority_relevance_freshness_novelty_and_token_cost
    - unused_context_budget_must_not_be_filled_without_value
    - secret_values_never_enter_logs_receipts_model_context_Graphiti_or_controller_state
    - secret_hashes_or_prefixes_are_not_required_for_receipt_provenance
    - desktop_agent_secret_values_are_resolved_from_Infisical_when_required
    - local_secret_materialization_is_a_cache_not_the_secret_source_of_truth
    - .env.local_is_not_a_supported_required_dependency
    - local_GitHub_access_prefers_gh_authenticated_credentials
    - cloud_credentials_prefer_short_lived_workload_identity_or_SSO
    - GitHub_Actions_org_repo_environment_secrets_are_consumed_inside_authorized_jobs
    - no_desktop_path_attempts_to_pull_GitHub_Actions_secret_values
    - session_close_does_not_depend_on_inline_LLM_distillation
    - continuity_checkpoint_latency_is_independent_of_slow_memory_distillation
    - asynchronous_memory_writes_are_idempotent_by_deterministic_identity
    - autonomous_PE_requires_a_fresh_valid_session_readiness_receipt
    - missing_required_capability_is_blocked_not_silently_emulated
    - interactive_degraded_operation_may_continue_only_when_policy_explicitly_allows_it
    - identical_canonical_inputs_must_compile_to_equivalent_semantic_context_across_peers
    - rehydration_must_preserve_receipt_chain_and_hydration_epoch
    - mutable_runtime_state_remains_outside_repository_worktrees
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE
