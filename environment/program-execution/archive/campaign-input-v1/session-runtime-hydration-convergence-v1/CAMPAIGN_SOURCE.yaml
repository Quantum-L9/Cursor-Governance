gates:
  - id: GATE-001
    name: current_state_and_authority_locked
    gate_type: entry
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-001]
    required_evidence_ids: [EVID-001, EVID-002, EVID-003, EVID-004, EVID-005, EVID-006, EVID-007]
    pass_criteria:
      - All blocking unknowns have evidence-bound resolution.
      - Baseline revisions and tests are recorded.
      - No secret value was disclosed during evidence collection.
    failure_effect: Block all implementation waves.
  - id: GATE-002
    name: canonical_session_runtime_ready
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-002]
    required_evidence_ids: []
    pass_criteria:
      - Shared boot and ensure_ready path produces valid receipts.
      - Critical boot remains usable without pydantic or PyYAML.
      - Human status is a receipt projection and does not enter model context.
    failure_effect: Block hydration and autonomous PE integration.
  - id: GATE-003
    name: clone_safe_secret_runtime_ready
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-004
    task_ids: [TASK-003]
    required_evidence_ids: [EVID-004, EVID-005]
    pass_criteria:
      - Fresh desktop clone self-materializes declared required agent secrets from Infisical.
      - .env.local is not required.
      - Mobile/Web explicit process-env bootstrap remains supported.
      - GitHub and cloud credentials use surface-appropriate providers.
      - No secret values or fingerprints appear in receipts or logs.
    failure_effect: Block autonomous PE admission rollout.
  - id: GATE-004
    name: hydration_compiler_ready
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids: [TASK-004]
    required_evidence_ids: [EVID-003]
    pass_criteria:
      - Exact active-repo continuity is separated from semantic knowledge.
      - Every hydration lane reports an explicit machine state.
      - Context compilation respects configured budget.
      - Fallback provenance and freshness are visible.
      - Only the canonical Graphiti client owns MCP transport.
    failure_effect: Block continuity cutover and PE session admission.
  - id: GATE-005
    name: continuity_write_pipeline_ready
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids: [TASK-005]
    required_evidence_ids: [EVID-003]
    pass_criteria:
      - Fast checkpoint continuity meets defined freshness SLO.
      - Slow distillation is not on the interactive close critical path.
      - Retry/crash tests demonstrate effective idempotency.
      - Failed enqueue remains retryable and never becomes false successful close.
    failure_effect: Block autonomous session continuity cutover.
  - id: GATE-006
    name: autonomous_peer_session_parity_ready
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids: [TASK-006]
    required_evidence_ids: [EVID-002, EVID-005, EVID-006]
    pass_criteria:
      - PE Gate 0 requires a fresh canonical Session Readiness Receipt.
      - Every required registered peer proves equivalent semantic context for the canonical fixture.
      - Missing capabilities fail explicitly rather than through hidden emulation.
      - Provider-specific authority remains bounded by canonical registry policy.
    failure_effect: Autonomous PE remains blocked on affected surfaces.
  - id: GATE-007
    name: session_runtime_program_converged
    gate_type: convergence
    blocking: true
    owner_authority_id: AUTH-006
    task_ids: [TASK-007]
    required_evidence_ids: [EVID-007]
    pass_criteria:
      - Full positive and negative conformance matrix passes.
      - Secret containment scans pass.
      - SessionStart, PE dispatch and rehydration paths use the same canonical runtime.
      - Documentation and executable contracts agree.
      - Controller Handoff Receipt is schema-valid and evidence-complete.
      - Controller recommends but does not declare the owner terminal verdict.
    failure_effect: Program terminal verdict remains INCONCLUSIVE.
