schema: program-execution-adapter.spec.v1
adapter_id: chatgpt-manual-handoff
adapter_version: 1.0.0
adapter_kind: worker_host
contract_family: program-execution-system.v2
provider:
  type: manual_handoff
  protocol_version: 1.0.0
capabilities:
  target_kinds:
  - document_artifact
  - research_artifact
  actions:
  - inspect
  - artifact_production
  async_execution: true
  cancellation: unsupported
  structured_output: true
  isolated_execution: true
  remote_credentials: forbidden
identity:
  binding: external_receipt
  memory_write: forbidden
security:
  default_deny: true
  may_narrow_authority: true
  may_widen_authority: false
  autonomous_merge: false
  force_push: false
  direct_graphiti_write: false
receipts:
  lifecycle_schema: program-execution-adapter.lifecycle-receipt.v1
  terminal_core_receipt: attempt
status:
  default: dormant
  blocked_reason: No active ChatGPT agent identity or automated execution transport is declared in
    the repository.
