schema: program-execution-adapter.spec.v1
adapter_id: github-deployments
adapter_version: 1.0.0
adapter_kind: deployment_record
contract_family: program-execution-system.v2
provider:
  type: gh_cli
  protocol_version: 1.0.0
capabilities:
  target_kinds:
  - github_environment
  actions:
  - read_environment
  - create_deployment_record
  async_execution: false
  cancellation: unsupported
  structured_output: true
  isolated_execution: false
  remote_credentials: required
identity:
  binding: controller_contract
  memory_write: forbidden
security:
  default_deny: true
  may_narrow_authority: true
  may_widen_authority: false
  autonomous_merge: false
  force_push: false
  direct_graphiti_write: false
receipts:
  lifecycle_schema: program-execution-adapter.lifecycle-receipt.v1
  terminal_core_receipt: deployment
status:
  default: conditional
  blocked_reason: Manages GitHub deployment records only, not target mutation.
