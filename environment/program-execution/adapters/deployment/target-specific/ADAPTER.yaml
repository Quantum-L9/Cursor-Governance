schema: program-execution-adapter.spec.v1
adapter_id: target-deployment-factory
adapter_version: 1.0.0
adapter_kind: target_deployment_factory
contract_family: program-execution-system.v2
provider:
  type: factory
  protocol_version: 1.0.0
capabilities:
  target_kinds:
  - target_adapter_spec
  actions:
  - generate_adapter
  - validate_adapter
  async_execution: false
  cancellation: unsupported
  structured_output: true
  isolated_execution: true
  remote_credentials: forbidden
identity:
  binding: controller_contract
  memory_write: forbidden
security:
  default_deny: true
  may_narrow_authority: true
  may_widen_authority: false
  autonomous_merge: false
  force_push: false
  direct_graphiti_write: false
receipts:
  lifecycle_schema: program-execution-adapter.lifecycle-receipt.v1
  terminal_core_receipt: none
status:
  default: non_routable
  blocked_reason: Generated target adapters remain non-routable until conformance passes.
