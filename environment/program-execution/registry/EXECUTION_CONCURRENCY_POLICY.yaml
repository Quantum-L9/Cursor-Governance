schema: l9.peer-execution.concurrency-policy.v1
# Every limit declared here is runtime-enforced; silent no-op policy fields
# are forbidden and rejected by the runner and validate_autonomy.py.
#   max_active_dispatches / max_mutating_dispatches -> ConcurrencyBudget lanes
#   max_mutating_dispatches_per_target_lineage -> target-lineage write locks
#     (the lock mechanism admits exactly one mutating holder, so 1 is the only
#      enforceable value)
limits:
  max_active_dispatches: 4
  max_mutating_dispatches: 2
  max_mutating_dispatches_per_target_lineage: 1
profile_weights:
  worker-default:
    dispatch: 1
    mutation: 1
  worker-read-only:
    dispatch: 1
    mutation: 0
  reviewer-default:
    dispatch: 1
    mutation: 0
law:
  owner: peer_execution_core
  provider_specific_scheduler_weights: forbidden
  controller_readiness_is_authoritative: true
