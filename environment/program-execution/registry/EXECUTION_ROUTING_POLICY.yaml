schema: program-execution-adapter.routing-policy.v1
rules:
- adapter_kind_matches_action_class
- required_capabilities_subset_of_fresh_probe
- effective_authority_contains_requested_actions
- mutation_tasks_not_hedged
- read_only_hedging_requires_explicit_permission
- worker_cannot_self_verify
- remote_actions_not_worker_fallbacks
- deployment_records_not_target_deployments
- dormant_and_non_routable_never_selected
- peer_provider_identity_resolves_from_runtime_binding
- execution_profile_applies_before_provider_invocation
- no_match_returns_CAPABILITY_UNSUPPORTED
preference:
  repository_implementation:
  - claude-code-direct
  - cursor-background
  - cursor-foreground
  tightly_scoped_mechanical:
  - codex-cloud
  interactive_local_repair:
  - cursor-foreground
  - claude-code-direct
  read_only_architecture_or_artifact_work:
  - cursor-foreground
  - chatgpt-manual-handoff
  verification:
  - ci-github-actions
  - ci-generic-shell
  - gemini-review
  remote_repository_action:
  - github-remote-actions
  check_read_or_publication:
  - github-checks
  deployment_record:
  - github-deployments
  target_deployment:
  - named_target_adapter_only
