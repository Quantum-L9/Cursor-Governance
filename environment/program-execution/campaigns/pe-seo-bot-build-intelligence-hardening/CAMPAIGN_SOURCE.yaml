- id: TASK-005
  title: Two-phase full-site SEO blueprint batching
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'createSEOContentBlueprint currently puts the entire request.routes array into
    one prompt and one strategize call. Keep the final artifact as one SEOContentBlueprint
    but produce it in two phases. Phase A generates a compact GlobalRouteIntent plan for all
    routes (route_id, primary_query, primary_intent, journey_stage) in one small call, validated
    for exact route count, exact route IDs, no missing or extra routes, and no duplicate normalized
    primary_query unless explicitly allowed. Phase B splits routes into deterministic batches
    of 4 (hard constant, the LLM never chooses batching); every batch prompt carries market,
    query portfolio, selected donors, normalized donor evidence, the all-route index (route_id,
    path, purpose), the global route intent plan, the current batch full route records, business
    facts, SEO config, and the output contract. Split reconciliation authorities: output route
    IDs must equal batch route IDs exactly, internal-link targets must belong to the all-route
    ID set, route identity is reasserted from the request, and primary query and top-level
    intent are reasserted from the global intent plan. After all batches pass, merge deterministically
    in request order and run a whole-site semantic validator: same route count, exact order
    and paths, no duplicate route IDs, no unknown internal-link targets, no self-links, no
    duplicate requirement IDs, all target slots valid, no unintended duplicate primary queries.
    Only then seal the single artifact. A batch that fails its one bounded repair raises SEO_CONTENT_BLUEPRINT_BATCH_INVALID
    and fails the whole artifact — never seal a partial route set as success. Preserve the
    existing route-identity and ContentSlot vocabulary validation rather than creating parallel
    schemas. Add the regression suite: 1, 4, 5, 8, 29, and 40 routes; batch malformed; batch
    missing a route; batch returning another batch route; cross-batch internal link; unknown
    internal-link target; duplicate primary query; batch repair succeeds; batch repair fails.
    Acceptance for Safe Haven: requested 29, produced 29, batch coverage 29/29, missing 0,
    extra 0, artifact lineage exact CompetitiveLandscape.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/build-intelligence/seo-content-blueprint.ts
  - src/api/build-intelligence.ts
  - docs/program-execution/TASK-005.md
  nugget_id: NUG-005
  kernel_profile: BUILD
  consumers:
  - src/build-intelligence/seo-content-blueprint.ts
  - src/api/build-intelligence.ts route handler
  entrypoints:
