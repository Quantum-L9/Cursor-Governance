- id: TASK-004
  title: Bounded DataForSEO transient retry
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'The current client makes one Axios request with a 30-second timeout and maps
    transport failures straight to DATAFORSEO_UNAVAILABLE. Add a bounded retry: one initial
    attempt plus at most one retry, retrying only transient transport or provider conditions
    (429, 502, 503, 504, connection reset or establishment failure, bounded timeout where
    policy permits). Never retry 400, 401, 403, invalid credentials, task-level DataForSEO
    errors, malformed provider results, SERP_EVIDENCE_INVALID, or deterministic validation
    errors. Keep the delay small: about 500 ms, honoring Retry-After capped at about 2 seconds.
    Record endpoint, attempt, HTTP status or error class, and retry flag — never credentials
    or auth headers. Record provider_attempts in CompetitiveLandscape evidence since DataForSEO
    requests are billable. Do not add retries around SEO-Bot LLM-producing HTTP endpoints
    from Website-Bot yet.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/services/dataforseo.ts
