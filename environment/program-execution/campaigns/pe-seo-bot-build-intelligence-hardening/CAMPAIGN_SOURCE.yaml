  - src/api/build-intelligence.ts
  validation:
  - check: npm test -- blueprint tests incl. 29-route acceptance
    command: npm test -- blueprint tests incl. 29-route acceptance
    evidence: command exit code 0 on the finished tree
  - check: npm run typecheck
    command: npm run typecheck
    evidence: command exit code 0 on the finished tree
  actions:
  - Add Phase A GlobalRouteIntent compact plan generation for all routes with exact count
    and ID validation
  - Split routes into deterministic batches of 4 with the all-route index in every batch prompt
  - 'Split reconciliation authorities: output route IDs equal batch route IDs, internal-link
    targets within all-route IDs, identity and strategy reasserted from request and global
    plan'
  - Merge deterministically in request order and run the whole-site semantic validator before
    sealing
  - Raise SEO_CONTENT_BLUEPRINT_BATCH_INVALID on failed batch repair; never seal partial coverage
  - 'Add the regression suite: 1/4/5/8/29/40 routes plus batch failure and repair cases'
  acceptance:
  - id: AC-two--NUG-005
    statement: a 29-route request yields one sealed SEOContentBlueprint with 29 routes in
      exact order and exact paths, batch coverage 29/29, missing 0, extra 0, artifact lineage
      matching the exact CompetitiveLandscape, and a failed batch repair fails the whole artifact
