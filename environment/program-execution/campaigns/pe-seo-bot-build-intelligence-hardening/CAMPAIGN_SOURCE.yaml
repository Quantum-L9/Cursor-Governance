- id: TASK-006
  title: StructuredContent schema reliability and one-repair budget
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'The runtime validator is strict but the generation prompt only says produce
    one section object per contract section_id and never teaches the blocks union, which produces
    content: "..." instead of blocks: [...]. Add one reusable prompt contract adjacent to
    the runtime schema guard spelling the exact shape: route_id, path, metadata (title, description),
    sections (section_id, optional eyebrow, heading, subheading, blocks of kind paragraph
    with text, bullets with items, steps with items, or quote with text and optional attribution,
    optional cta with label and action), faqs, internal_links, and schema_content_inputs.
    Explicitly describe each block variant and state the forbidden field aliases: content,
    body, copy, html, paragraphs — section prose must exist exclusively inside blocks. The
    Zod schema remains final authority. Fix the repair-budget bug: executePolicyJson performs
    one internal JSON/schema repair, and the structured-content layer can call generateRoute
    again after semantic failure, so one route can consume up to four generation calls. Extend
    the LLM utility with a schemaRepairAttempts option (0 or 1, default 1 so existing callers
    do not change) and have StructuredContentPackage call it with 0 so the structured-content
    orchestrator owns the one total repair. The correct sequence is: generation one, JSON
    parse plus schema validation, content validation; any failure enters one route repair
    whose prompt carries exact failure evidence (schema_failures with path and message, failed_requirements,
    unsupported_claims) and the exact output contract again; the repaired output passes full
    validation or the route fails terminally. Maximum two generation LLM calls per route and
    one repair per route, with no hidden nested repair. Evidence must count actual calls:
    route_count, generation_llm_calls, semantic_validation_llm_calls, repair_attempts, schema_failure_count,
    repaired_route_ids, with repair_attempts at most route_count and at most one per route.
    Do not add a permissive content-to-blocks converter — bad model output stays visible and
    repairable, never silently normalized. Add the regression cases: section uses content
    instead of blocks, missing blocks, blocks is a string, unknown block kind, paragraph missing
    text, bullets missing items, extra section, missing section, wrong section ID, wrong route
    ID, malformed metadata, unsupported factual claim, first malformed then repair valid,
    first malformed then repair malformed, semantic failure then repair valid, semantic failure
    then repair still fails.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/build-intelligence/structured-content.ts
  - src/services/llm.ts
  - src/build-intelligence/schema-guards.ts
  - docs/program-execution/TASK-006.md
  nugget_id: NUG-006
  kernel_profile: BUILD
  consumers:
  - src/build-intelligence/structured-content.ts
  - src/services/llm.ts executePolicyJson
  - src/build-intelligence/schema-guards.ts
  entrypoints:
  - src/build-intelligence/structured-content.ts
  - src/services/llm.ts
  validation:
  - check: npm test -- structured content tests
    command: npm test -- structured content tests
    evidence: command exit code 0 on the finished tree
  - check: npm run typecheck
    command: npm run typecheck
    evidence: command exit code 0 on the finished tree
  actions:
  - Add STRUCTURED_CONTENT_OUTPUT_CONTRACT with the exact blocks union and forbidden aliases
    (content, body, copy, html, paragraphs)
  - Add schemaRepairAttempts option (0 or 1, default 1) to executePolicyJson
  - Have the structured-content orchestrator pass 0 and own the one total repair
  - Put exact failure evidence in the repair prompt (schema_failures, failed_requirements,
    unsupported_claims) plus the output contract
  - Count actual calls in evidence and enforce max two generation calls and one repair per
    route
  - Add the regression cases including content-instead-of-blocks and repair-valid/repair-fails
    pairs
  acceptance:
  - id: AC-stru-NUG-006
    statement: generated sections conform to the blocks-only contract, forbidden aliases are
      never accepted, at most two generation calls and one repair occur per route, and evidence
      counts actual calls
    required_evidence_types:
    - test_results
