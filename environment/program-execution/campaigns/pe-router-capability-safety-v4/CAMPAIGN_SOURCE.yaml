- id: TASK-002
  title: Fail unsupported capability combinations
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'Before routing, assert supported capabilities: visionRequired plus searchRequired
    fails with UNSUPPORTED_CAPABILITY_COMBINATION; images.length greater than 0 on a non-vision
    task type fails with UNSUPPORTED_CAPABILITY_COMBINATION (images are only consumed by the
    vision branch); a vision task with no images fails with VISION_INPUT_REQUIRED. Route via
    the resolved capabilities: searchRequired to Perplexity, visionRequired to the OpenRouter
    vision branch, else the general route. Add the dispatch invariant assertions: searchRequired
    implies provider is Perplexity, visionRequired implies provider is OpenRouter, and a non-search
    route never lands on Perplexity, unless a future explicit provider-capability contract
    changes that.'
