- id: TASK-001
  title: Canonical capability resolver
  definition_status: ready
  workstream_id: WS-01
  wave_id: W0
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'Add one canonical resolver, resolveCapabilities(task), returning searchRequired
    (reusing requiresSearchProvider), searchPolicySource (EXPLICIT when requiresSearch is
    an explicit boolean, else TASK_DEFAULT), and visionRequired (task.type is in the vision-task
    set: VISUAL_QA, SCREENSHOT_ANALYSIS, LAYOUT_VALIDATION). Existing search-policy behavior
    and tests stay unchanged; the resolver unifies search and vision truth into one place
    consumed by resolveRoute.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/matrices/capabilities.ts
  - src/types.ts
  - src/index.ts
  - tests/capabilities.test.ts
  - docs/program-execution/TASK-001.md
  nugget_id: NUG-001
  kernel_profile: BUILD
  consumers:
  - resolveRoute dispatch
  - routing decision construction
  - getCallLog audit
  entrypoints:
  - src/index.ts
  - src/matrices/search-policy.ts
  - src/types.ts
  validation:
  - check: npm run verify:types
    command: npm run verify:types
    evidence: command exit code 0 on the finished tree
  - check: npm test
    command: npm test
    evidence: command exit code 0 on the finished tree
  - check: npm run lint
    command: npm run lint
    evidence: command exit code 0 on the finished tree
  actions:
  - Define ResolvedCapabilities (searchRequired, searchPolicySource, visionRequired)
  - Implement resolveCapabilities reusing requiresSearchProvider
  - Derive searchPolicySource EXPLICIT vs TASK_DEFAULT from the explicit boolean
  - Derive visionRequired from the VISION_TASKS set (VISUAL_QA, SCREENSHOT_ANALYSIS, LAYOUT_VALIDATION)
  - Wire resolveCapabilities into resolveRoute
  acceptance:
  - id: AC-cano-NUG-001
    statement: resolveCapabilities derives searchRequired, searchPolicySource, and visionRequired
      from one canonical resolver consumed by resolveRoute, existing search-policy tests stay
      green
    required_evidence_types:
    - test_results
    - inspection
