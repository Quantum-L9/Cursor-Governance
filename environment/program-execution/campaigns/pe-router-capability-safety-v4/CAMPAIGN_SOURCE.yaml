    command: npm test -- routing-matrix.test.ts
    evidence: command exit code 0 on the finished tree
  - check: npm run verify:types
    command: npm run verify:types
    evidence: command exit code 0 on the finished tree
  actions:
  - Add assertSupportedCapabilities raising UNSUPPORTED_CAPABILITY_COMBINATION for vision+search
  - Reject images.length > 0 on non-vision task types with UNSUPPORTED_CAPABILITY_COMBINATION
  - Fail a visual task without images with VISION_INPUT_REQUIRED
  - 'Route via resolved capabilities: searchRequired to Perplexity, visionRequired to vision
    branch, else general'
  - Add dispatch invariant asserts before provider invocation
  acceptance:
  - id: AC-fail-NUG-002
    statement: unsupported vision+search and images-on-non-vision combinations fail with UNSUPPORTED_CAPABILITY_COMBINATION,
