schema: l9.program-execution.campaign-source.v2
schema_version: 2.0.0
metadata:
  campaign_id: l9-repo-template-control-plane-ready-v1
  title: L9 Repo Template Control-Plane Readiness
  version: 1.0.0
  status: operator_intake
  owner: Igor Beylin
  source_is_immutable: true
  intended_host: Quantum-L9/Cursor-Governance
  intended_drop_path: >-
    environment/program-execution/campaigns/l9-repo-template-control-plane-ready-v1/CAMPAIGN_SOURCE.yaml
  runtime_root: "$HOME/.l9/programs/l9-repo-template-control-plane-ready-v1"
  worktree_root: "$HOME/.l9/program-worktrees/l9-repo-template-control-plane-ready-v1"
operator_directive:
  objective: >-
    Make Quantum-L9/l9-repo-template the first consumer of the intended
    Quantum-L9 CI architecture before l9-ci-control-plane is implemented.
    The template must stop distributing, copying, pinning, or synchronizing
    organization CI implementation from Quantum-L9/.github and must instead
    expose a small repository-owned execution contract that future
    l9-ci-control-plane policy can invoke through Quantum-L9/l9-ci-core.
    Preserve useful repository-local verification, birth, hygiene, ownership,
    and execution-runtime capabilities while removing legacy CI distribution
    coupling and fixing high-leverage template defects that would otherwise
    multiply into downstream repositories.
  mode: tightly_scoped_autonomous_remediation
  constraints:
    - mutate_only_Quantum_L9_l9_repo_template
    - do_not_modify_Quantum_L9_l9_ci_core
    - do_not_modify_Quantum_L9_dot_github
    - do_not_create_l9_ci_control_plane_in_this_campaign
    - do_not_seed_other_repositories
    - preserve_repository_local_execution_contract
    - preserve_make_ci_as_stable_local_facade
    - do_not_replace_repo_local_validation_with_ci_specific_logic
    - remove_legacy_ci_distribution_surfaces_only_after_dependencies_are_removed
    - add_regression_tests_for_architecture_boundaries
    - regenerate_integrity_artifacts_after_final_tree_converges
program:
  id: l9-repo-template-control-plane-ready-v1
  name: L9 Repo Template Control-Plane Readiness
  owner: Igor Beylin
  definition_status: draft
  objective: >-
    Converge Quantum-L9/l9-repo-template on a control-plane-ready repository
    contract in which repositories own product code and deterministic local
    verification, l9-ci-core owns CI execution semantics, the future
    l9-ci-control-plane owns organization CI targeting/version/enforcement,
    and Quantum-L9/.github is no longer required to distribute CI files.
  problem_statement: >-
    The current template encodes the previous organization CI distribution
    model directly into downstream repositories through sync-ci behavior,
    copied workflow surfaces, organization/Core pin state, local governance
    copies, and inventory invariants that require those surfaces to exist.
    This causes every repository created from the template to inherit
    distribution coupling and makes future central orchestration harder.
    Template birth also needs stronger repository-identity stamping and
    fail-closed local verification so defects do not multiply downstream.
  target_state: >-
    A repository created from Quantum-L9/l9-repo-template requires no
    organization CI seeding or CI-pack synchronization. It exposes a stable
    repository-owned execution contract through .l9/repo-workflow.json and
    make ci; contains machine-readable architecture and ownership boundaries
    assigning CI orchestration to l9-ci-core and organization CI control to
    l9-ci-control-plane; rejects reintroduction of legacy distributed CI
    surfaces; stamps downstream repository identity at birth; retains only
    genuinely repository-local GitHub configuration; and passes all existing
    and newly added deterministic validation.
  scope:
    include:
      - Quantum-L9/l9-repo-template
      - Repo.mk
      - Makefile integration invariants
      - .l9 repository contracts
      - repository identity and birth tooling
      - scripts/inventory_check.py
      - scripts/bootstrap_rename.py
      - scripts/birth-runner
      - repository-local tests
      - AGENTS.md
      - ARCHITECTURE.md
      - lifecycle and validation documentation
      - pre-commit/toolchain consistency
      - MANIFEST.sha256
      - removal of obsolete copied CI distribution surfaces
      - removal of redundant organization-default community-health copies when safe
    exclude:
      - Quantum-L9/l9-ci-core mutations
      - Quantum-L9/.github mutations
      - creation or implementation of Quantum-L9/l9-ci-control-plane
      - organization ruleset mutations
      - branch protection mutations
      - GitHub App creation
      - CI fleet migration
      - modification of existing downstream repositories
      - unrelated product scaffold redesign
      - replacement of the existing repository-execution runtime
      - Constellation node architecture
      - release or deployment work
  authority_order:
    - explicit_operator_campaign_directive
    - repository_local_governance
    - .l9/architecture.yaml
    - .l9/ownership.yaml
    - .l9/repo-workflow.json
    - executable_tests_and_validation
    - existing_source_code
    - documentation
    - inference
    - UNKNOWN
  operating_rules:
    - diagnose_before_mutation
    - keep_campaign_target_single_repository
    - preserve_one_owner_per_ci_responsibility
    - repository_owns_local_execution_not_organization_ci_distribution
    - l9_ci_core_is_future_ci_execution_owner
    - l9_ci_control_plane_is_future_org_ci_control_owner
    - dot_github_must_not_be_required_for_ci_file_distribution
    - make_ci_is_stable_repository_local_facade
    - repo_workflow_json_is_machine_readable_execution_contract
    - local_validation_must_fail_closed
    - template_changes_require_downstream_birth_tests
    - stale_architecture_must_be_rejected_by_inventory_checks
    - removal_requires_reference_cleanup
    - no_test_weakening
    - no_unrelated_refactor
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE
targets:
  - id: TARGET-001
    name: Quantum-L9 l9-repo-template
    kind: git_repository
    authority_owner: Quantum-L9/l9-repo-template
    execution_mode: repo_local
    repository_id: Quantum-L9/l9-repo-template
    source_of_truth: repository_main
    environments:
      - local
    mutability: reversible
    expected_revision: UNKNOWN
    adapter: git
authorities:
  - id: AUTH-001
    responsibility: program_ownership_and_terminal_verdict
    owner: Igor Beylin
  - id: AUTH-002
    responsibility: repository_template_architecture_and_local_execution_contract
    owner: Quantum-L9/l9-repo-template
  - id: AUTH-003
    responsibility: future_ci_runtime_orchestration_boundary
    owner: Quantum-L9/l9-ci-core
  - id: AUTH-004
    responsibility: future_organization_ci_distribution_versioning_and_enforcement_boundary
    owner: Quantum-L9/l9-ci-control-plane
  - id: AUTH-005
    responsibility: organization_defaults_and_non_ci_github_native_defaults
    owner: Quantum-L9/.github
  - id: AUTH-006
    responsibility: independent_validation
    owner: repository_tests_and_make_ci
risks:
  - id: RISK-001
    statement: >-
      Removing copied CI surfaces breaks an existing repository-local tool that
      still assumes sync-ci or local L9 workflow files.
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - repository_wide_reference_search
      - fail_closed_inventory_tests
      - run_full_make_ci
  - id: RISK-002
    statement: >-
      Template cleanup accidentally removes repository-local GitHub configuration
      that is not supplied by organization defaults.
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - classify_each_github_file_before_removal
      - retain_repo_specific_codeowners_dependabot_labels
      - validate_template_birth_fixture
  - id: RISK-003
    statement: >-
      Birth-time identity stamping leaves template identity in authoritative
      .l9 metadata.
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - dedicated_identity_tests
      - recursive_template_identity_scan
  - id: RISK-004
    statement: >-
      Optional-tool shell expressions continue to convert real command failures
      into successful fallback behavior.
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - explicit_shell_branching
      - negative_tests
  - id: RISK-005
    statement: >-
      Future agents recreate copied CI implementation because the ownership
      boundary is documented but not mechanically enforced.
    likelihood: possible
    impact: high
    owner: AUTH-002
    mitigations:
      - inventory_negative_assertions
      - ownership_contract
      - agent_instructions
      - regression_tests
prohibited_paths:
  - id: DNB-001
    statement: Do not modify Quantum-L9/l9-ci-core in this campaign.
    rationale: This campaign prepares its consumer contract only.
  - id: DNB-002
    statement: Do not modify Quantum-L9/.github in this campaign.
    rationale: CI distribution retirement occurs after the template is ready.
  - id: DNB-003
    statement: Do not create Quantum-L9/l9-ci-control-plane in this campaign.
    rationale: Template readiness is the prerequisite campaign.
  - id: DNB-004
    statement: Do not add a replacement repository-local L9 orchestration workflow.
    rationale: CI orchestration must remain centralized.
  - id: DNB-005
    statement: Do not add a replacement sync/seeder mechanism.
    rationale: Repositories must not distribute organization CI themselves.
  - id: DNB-006
    statement: Do not weaken inventory, hygiene, typing, lint, or test gates.
    rationale: Architectural simplification must improve or preserve verification.
  - id: DNB-007
    statement: Do not broaden into unrelated template product refactoring.
    rationale: Campaign scope is CI-control-plane readiness and downstream leverage.
workstreams:
  - id: WS-01
    name: Current-state and dependency lock
    owner: AUTH-002
    objective: >-
      Establish the exact legacy CI distribution surfaces, callers,
      architecture references, tests, and downstream dependencies before removal.
  - id: WS-02
    name: CI ownership boundary
    owner: AUTH-002
    objective: >-
      Remove legacy CI distribution coupling and encode the future ownership
      contract in authoritative machine-readable and agent-facing surfaces.
  - id: WS-03
    name: Repository execution and birth hardening
    owner: AUTH-002
    objective: >-
      Preserve a strong local execution ABI, eliminate fail-open verification,
      and make repository identity correct from birth.
  - id: WS-04
    name: Downstream leverage and convergence
    owner: AUTH-006
    objective: >-
      Remove redundant inherited organization defaults where safe, add
      architecture regression tests, update documentation, regenerate integrity
      state, and prove the final template.
waves:
  - id: W0
    name: inspect_and_lock
    predecessor_wave_ids: []
    task_ids:
      - TASK-001
  - id: W1
    name: architecture_boundary
    predecessor_wave_ids:
      - W0
    task_ids:
      - TASK-002
      - TASK-003
  - id: W2
    name: birth_and_leverage
    predecessor_wave_ids:
      - W1
    task_ids:
      - TASK-004
      - TASK-005
      - TASK-006
  - id: W3
    name: convergence
    predecessor_wave_ids:
      - W2
    task_ids:
      - TASK-007
gates:
  - id: GATE-001
    name: current_state_locked
    statement: >-
      Every legacy CI distribution surface and caller is identified before removal.
  - id: GATE-002
    name: ci_distribution_boundary_clean
    statement: >-
      The template no longer requires .github CI-pack synchronization, copied
      Core orchestration workflows, or consumer-owned organization/Core CI pins.
  - id: GATE-003
    name: repository_execution_contract_preserved
    statement: >-
      make ci and .l9/repo-workflow.json remain deterministic repository-owned
      execution interfaces and fail closed on real validation failures.
  - id: GATE-004
    name: birth_identity_correct
    statement: >-
      A downstream birth fixture stamps package and repository identity without
      leaving authoritative template repository identity behind.
  - id: GATE-005
    name: architecture_regression_guarded
    statement: >-
      Inventory and tests reject reintroduction of legacy distributed CI surfaces.
  - id: GATE-006
    name: final_template_converged
    statement: >-
      Full repository validation, tests, integrity checks, manifest regeneration,
      and clean-tree verification pass without weakening gates.
evidence_requirements:
  - id: EVID-001
    claim: >-
      Every legacy CI distribution surface and caller in the template is
      identified before removal.
    source_type: repository_inspection
    source_location: Quantum-L9/l9-repo-template
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-001
    contradicts: []
  - id: EVID-002
    claim: >-
      The template no longer requires .github CI-pack synchronization, copied
      Core orchestration workflows, or consumer-owned organization/Core CI pins.
    source_type: repository_inspection
    source_location: Quantum-L9/l9-repo-template
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-002
    contradicts: []
  - id: EVID-003
    claim: >-
      make ci and .l9/repo-workflow.json remain deterministic repository-owned
      execution interfaces and fail closed on real validation failures.
    source_type: test_result
    source_location: Quantum-L9/l9-repo-template
    collection_method: test_run
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-003
    contradicts: []
  - id: EVID-004
    claim: >-
      A downstream birth fixture stamps package and repository identity without
      leaving authoritative template repository identity behind.
    source_type: test_result
    source_location: Quantum-L9/l9-repo-template
    collection_method: test_run
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-004
    contradicts: []
  - id: EVID-005
    claim: >-
      Inventory and tests reject reintroduction of legacy distributed CI
      surfaces.
    source_type: test_result
    source_location: Quantum-L9/l9-repo-template
    collection_method: test_run
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-005
    contradicts: []
  - id: EVID-006
    claim: >-
      Full repository validation, tests, integrity checks, manifest
      regeneration, and clean-tree verification pass without weakening gates.
    source_type: test_result
    source_location: Quantum-L9/l9-repo-template
    collection_method: test_run
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-006
    contradicts: []
tasks:
  - id: TASK-001
    title: Lock current CI-distribution and template dependency state
    definition_status: ready
    objective: >-
      Trace every reference to sync-ci, .l9/ci-pin, organization CI-pack
      synchronization, copied L9 workflows, local CI governance copies, consumer
      CI requirements, and template identity before modifying the repository.
    workstream_id: WS-01
    wave_id: W0
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-001
      - AUTH-002
    paths:
      - Repo.mk
      - .l9/
      - .github/
      - scripts/
      - tests/
      - docs/
      - AGENTS.md
      - ARCHITECTURE.md
      - TEMPLATE_INVENTORY.md
      - MANIFEST.sha256
    actions:
      - inspect_repository_governance_and_execution_contracts
      - trace_legacy_ci_distribution_files_and_callers
      - classify_repository_local_vs_organization_owned_github_surfaces
      - run_prechange_validation_baseline
      - record_exact_files_that_require_change
    acceptance:
      - id: AC-001
        statement: All legacy CI distribution dependencies are known before deletion.
        required_evidence_types:
          - inspection
      - id: AC-002
        statement: Baseline validation results are captured without mutation.
        required_evidence_types:
          - inspection
          - test_result
    negative_cases:
      - deleting_files_before_caller_trace
      - assuming_all_dot_github_files_are_inheritable
      - expanding_into_core_or_org_hub_changes
    rollback:
      strategy: discard_unaccepted_generated_program_artifacts
      trigger: admission_failure
      validation: no_implementation_mutation_occurred
    risk:
      tier: T0
      reversibility: fully_reversible
      blast_radius: program_definition
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-001
  - id: TASK-002
    title: Remove legacy organization CI distribution from the template
    definition_status: ready
    objective: >-
      Remove the repository-side CI synchronization model without replacing it
      with another local fanout mechanism.
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-001
      - AUTH-002
      - AUTH-003
      - AUTH-004
      - AUTH-005
    actions:
      - remove_sync_ci_target_and_callers
      - remove_legacy_ci_pack_sync_script
      - remove_consumer_ci_dependency_manifest_if_no_longer_required
      - remove_local_l9_analysis_and_l9_lint_test_distribution_workflows
      - remove_org_update_receiver_if_its_only_role_is_ci_pack_refresh
      - replace_combined_ci_pin_with_narrow_repository_runtime_provenance_if_needed
      - remove_local_ci_governance_defaults_that_exist_only_for_distributed_core_execution
      - eliminate_stale_references_from_tests_docs_and_inventory
    acceptance:
      - id: AC-003
        statement: No repository command synchronizes CI from Quantum-L9/.github.
        required_evidence_types:
          - inspection
          - test_result
      - id: AC-004
        statement: No local workflow reimplements l9-ci-core orchestration.
        required_evidence_types:
          - inspection
      - id: AC-005
        statement: The repository does not own organization-selected l9-ci-core version state.
        required_evidence_types:
          - inspection
      - id: AC-006
        statement: No replacement seeder or synchronization mechanism is introduced.
        required_evidence_types:
          - inspection
    negative_cases:
      - replacing_sync_ci_with_different_copy_script
      - retaining_dead_ci_pin_fields
      - deleting_repository_specific_github_configuration
      - modifying_l9_ci_core
      - modifying_dot_github
    rollback:
      strategy: restore_removed_files_from_campaign_parent_if_dependency_trace_proves_required
      trigger: blocking_integration_or_conformance_failure
      validation: make_ci_returns_to_prechange_baseline
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: l9_repo_template_ci_distribution
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-002
  - id: TASK-003
    title: Encode control-plane-ready ownership and regression invariants
    definition_status: ready
    objective: >-
      Make the intended future role boundary authoritative and mechanically
      detectable in the template.
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-002
      - AUTH-003
      - AUTH-004
      - AUTH-005
    actions:
      - update_l9_architecture_ownership_boundaries
      - update_l9_ownership_authorities
      - update_agents_architecture_rules
      - make_inventory_check_reject_legacy_distributed_ci_surfaces
      - require_repository_execution_contract_and_make_ci
      - add_tests_for_negative_ci_distribution_invariants
    acceptance:
      - id: AC-007
        statement: >-
          Authoritative metadata assigns repository-local execution to the
          repository, CI orchestration to l9-ci-core, organization CI control to
          l9-ci-control-plane, and GitHub-native organization defaults to .github.
        required_evidence_types:
          - inspection
      - id: AC-008
        statement: Reintroducing a legacy CI distribution surface fails deterministic validation.
        required_evidence_types:
          - test_result
    negative_cases:
      - documentation_only_boundary
      - inventory_check_accepts_sync_ci
      - inventory_check_accepts_local_core_orchestration_workflow
      - organization_ci_authority_assigned_to_consumer_repo
    rollback:
      strategy: revert_authority_changes_if_they_conflict_with_higher_repository_governance
      trigger: contract_or_compatibility_failure
      validation: inventory_and_authority_checks_return_to_baseline
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: l9_repo_template_authority_metadata
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-002
      - GATE-005
  - id: TASK-004
    title: Harden repository-local CI execution facade
    definition_status: ready
    objective: >-
      Preserve make ci as a stable repository execution ABI while eliminating
      shell constructions that can convert real tool failures into success.
    workstream_id: WS-03
    wave_id: W2
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-002
      - AUTH-006
    actions:
      - preserve_make_ci_as_repository_owned_validation_alias
      - keep_repo_workflow_json_as_machine_readable_execution_contract
      - replace_optional_tool_and_or_fallback_patterns_with_explicit_branching
      - ensure_uv_present_but_failing_is_not_silently_replaced_by_pip
      - ensure_lock_check_failure_is_not_swallowed
      - align_precommit_typecheck_with_repository_toolchain_where_practical
      - add_negative_tests_for_fail_open_cases
    acceptance:
      - id: AC-009
        statement: make ci succeeds only when repository-owned validation succeeds.
        required_evidence_types:
          - test_result
      - id: AC-010
        statement: Presence of uv followed by uv failure produces a failure.
        required_evidence_types:
          - test_result
      - id: AC-011
        statement: A failing lock validation cannot be converted into success by shell fallback.
        required_evidence_types:
          - test_result
      - id: AC-012
        statement: Existing repository-execution runtime contract remains usable.
        required_evidence_types:
          - test_result
    negative_cases:
      - weakening_verify
      - removing_typecheck
      - removing_lock_validation
      - embedding_l9_core_execution_in_make_ci
    rollback:
      strategy: restore_previous_facade_only_if_new_behavior_breaks_valid_repository_execution
      trigger: blocking_integration_or_conformance_failure
      validation: make_ci_returns_to_prechange_baseline
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: l9_repo_template_execution_facade
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-003
  - id: TASK-005
    title: Make downstream repository identity correct at birth
    definition_status: ready
    objective: >-
      Extend template bootstrap so a born repository receives both package
      identity and repository identity in authoritative metadata.
    workstream_id: WS-03
    wave_id: W2
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-002
      - AUTH-006
    actions:
      - add_repository_identity_input_to_bootstrap_rename
      - pass_org_and_repo_name_from_birth_runner
      - rewrite_authoritative_l9_repository_identity_fields
      - preserve_explicit_template_provenance_where_useful
      - add_birth_fixture_tests
      - scan_born_fixture_for_authoritative_template_identity_leakage
    acceptance:
      - id: AC-013
        statement: >-
          A fixture born as Quantum-L9/example-service no longer identifies its
          authoritative repository as Quantum-L9/l9-repo-template.
        required_evidence_types:
          - test_result
      - id: AC-014
        statement: Package rename behavior remains deterministic.
        required_evidence_types:
          - test_result
      - id: AC-015
        statement: Template provenance is not confused with active repository identity.
        required_evidence_types:
          - inspection
          - test_result
    negative_cases:
      - blind_global_replacement_of_template_provenance
      - rewriting_vendored_runtime_identity
      - package_rename_regression
    rollback:
      strategy: revert_identity_extension_if_authoritative_field_ownership_is_not_proven
      trigger: contract_or_compatibility_failure
      validation: birth_fixture_tests_return_to_baseline
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: l9_repo_template_birth_tooling
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-004
  - id: TASK-006
    title: Reduce redundant organization-default copies
    definition_status: ready
    objective: >-
