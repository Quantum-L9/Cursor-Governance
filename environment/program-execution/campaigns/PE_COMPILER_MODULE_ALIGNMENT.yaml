alignment_rules:
  - one_repository: Quantum-L9/Cursor-Governance
  - one_module: environment/program-execution/compiler
  - one_runtime: existing Program Execution Controller
  - build_then_harden: true
  - historical_admission_handoffs_remain_evidence: true
  - current_execution_authority: this_supersession
