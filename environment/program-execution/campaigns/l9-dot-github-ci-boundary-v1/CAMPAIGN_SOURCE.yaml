schema: l9.program-execution.campaign-source.v2
schema_version: 2.0.0
metadata:
  campaign_id: l9-dot-github-ci-boundary-v1
  title: Quantum-L9 .github CI Boundary Minimization
  status: operator_intake
operator_directive:
  objective: >-
    With maximum execution autonomy, converge Quantum-L9/.github on the intended
    post-control-plane architecture. Quantum-L9/.github must remain the
    GitHub-native organization-default/community-governance repository, but must
    cease owning custom L9 CI distribution, CI seeding, CI fanout, Core-version
    promotion, CI reconciliation, or CI enforcement configuration. Preserve
    useful non-CI organization defaults and governance. Do not modify
    Quantum-L9/l9-ci-core, Quantum-L9/l9-repo-template, or create
    Quantum-L9/l9-ci-control-plane in this campaign. This invocation authorizes
    merge of exactly this campaign PR after l9-pr-remediation converges on the
    observed head SHA and the l9-pe-campaign-activate one-shot merge authorization
    gate is written. No admin bypass, force push, or merge with red required
    checks is authorized.
  mode: autonomous_evidence_driven_repo_local
program:
  id: l9-dot-github-ci-boundary-v1
  name: Quantum-L9 .github CI Boundary Minimization
  owner: Igor Beylin
  definition_status: draft
  objective: >-
    Make Quantum-L9/.github operate as the organization-default and
    community-governance surface expected after l9-ci-control-plane exists,
    while removing or safely retiring repository-owned mechanisms that make
    .github an L9 CI distributor, seeder, fanout controller, Core-version
    authority, CI reconciler, or CI-enforcement owner.
  problem_statement: >-
    Quantum-L9/.github currently mixes GitHub-native organization defaults and
    general governance with custom L9 CI distribution responsibilities.
    Candidate legacy surfaces include CI packs, seed/bootstrap workflows,
    template-update dispatch, repository receivers, Core-template
    synchronization, workflow-interface version state, CI-specific ruleset
    material, CI-specific repository property state, and cross-repository write
    credentials. That mixture creates duplicated authority with l9-ci-core and
    the planned l9-ci-control-plane, increases organization blast radius, and
    makes it difficult to prove which component owns CI targeting, versioning,
    reconciliation, and enforcement.
  target_state: >-
    Quantum-L9/.github contains only GitHub-native organization defaults,
    community-health and contribution surfaces, organization profile material,
    and explicitly non-CI governance that legitimately belongs there. It has no
    active mechanism that copies L9 CI implementation into consumer
    repositories, seeds L9 CI, dispatches CI-template updates, selects the
    organization l9-ci-core revision, reconciles consumer CI, or owns required
    L9 CI rulesets. Remaining workflows use least privilege and cannot mutate
    organization CI state. Repository validation mechanically rejects
    reintroduction of legacy L9 CI distribution authority. Existing downstream
    repositories are not mutated by this campaign.
  scope:
    include:
      - Quantum-L9/.github
      - repository-local governance and ownership documentation
      - GitHub-native community-health defaults
      - organization profile surfaces
      - issue and pull-request templates
      - non-CI governance workflows
      - CI-distribution workflow classification and retirement
      - l9-ci-pack classification and retirement
      - seed/bootstrap/fanout logic classification and retirement
      - Core-template synchronization logic classification and retirement
      - CI-specific workflow interface registry ownership
      - CI-specific ruleset source ownership
      - CI-specific repository property automation
      - workflow permissions and organization credential references
      - repository validation and actionlint coverage
      - architecture regression guards
      - read-only downstream dependency checks required for safe retirement
    exclude:
      - Quantum-L9/l9-ci-core mutations
      - Quantum-L9/l9-repo-template mutations
      - creation of Quantum-L9/l9-ci-control-plane
      - mutation of downstream repositories
      - organization ruleset API mutations
      - organization custom-property API mutations
      - branch protection mutations
      - repository settings mutations outside Quantum-L9/.github
      - CI fleet migration
      - replacement CI seeder implementation
      - replacement CI reconciler implementation
      - new organization webhook service
      - unrelated organization-governance redesign
  authority_order:
    - explicit_operator_campaign_directive
    - repository_local_governance
    - accepted_architecture_boundaries
    - executable_source_code
    - machine_readable_contracts
    - observed_read_only_GitHub_state
    - tests
    - documentation
    - inference
    - UNKNOWN
  operating_rules:
    - diagnose_every_candidate_ci_surface_before_removal
    - distinguish_GitHub_native_defaults_from_custom_ci_distribution
    - preserve_non_ci_organization_defaults
    - preserve_non_ci_governance_only_when_ownership_is_legitimate
    - do_not_create_a_replacement_ci_control_plane_inside_dot_github
    - do_not_move_l9_ci_core_execution_semantics_into_dot_github
    - do_not_mutate_downstream_repositories
    - do_not_mutate_live_org_rulesets_or_branch_protection
    - remove_cross_repository_ci_write_authority_when_no_longer_required
    - fail_closed_on_unproven_runtime_dependency
    - existing_consumers_must_not_be_rewritten_by_this_campaign
    - no_test_weakening
    - no_admin_bypass
    - merge_only_after_campaign_remediation_and_one_shot_authorization
    - close_campaign_ledger_after_merge
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE
targets:
  - id: TARGET-001
    name: Quantum-L9 .github
    kind: git_repository
    authority_owner: Quantum-L9/.github
    execution_mode: repo_local
    repository_id: Quantum-L9/.github
    source_of_truth: repository_main
    environments:
      - local
      - ci
    mutability: reversible
    expected_revision: UNKNOWN
    adapter: git_repo_adapter
authorities:
  - id: AUTH-001
    responsibility: campaign_ownership_and_terminal_verdict
    owner: Igor Beylin
  - id: AUTH-002
    responsibility: organization_default_and_community_governance_surface
    owner: Quantum-L9/.github
  - id: AUTH-003
    responsibility: CI_runtime_orchestration
    owner: Quantum-L9/l9-ci-core
  - id: AUTH-004
    responsibility: future_organization_CI_targeting_versioning_reconciliation_and_enforcement
    owner: Quantum-L9/l9-ci-control-plane
  - id: AUTH-005
    responsibility: independent_repository_validation
    owner: Quantum-L9/.github repository checks
workstreams:
  - id: WS-01
    name: Authority and runtime reconstruction
    owner: AUTH-001
    objective: >-
      Identify every active or candidate CI distribution surface, caller,
      credential, mutation edge, downstream dependency, and non-CI surface
      before changing ownership.
  - id: WS-02
    name: CI authority retirement
    owner: AUTH-001
    objective: >-
      Remove or safely retire custom L9 CI distribution and duplicated
      organization CI authority from Quantum-L9/.github.
  - id: WS-03
    name: Native organization-default preservation
    owner: AUTH-001
    objective: >-
      Preserve and harden only the GitHub-native defaults and legitimate
      non-CI governance responsibilities that belong in Quantum-L9/.github.
  - id: WS-04
    name: Permission and regression hardening
    owner: AUTH-001
    objective: >-
      Reduce mutation authority, validate all surviving automation, and
      mechanically reject a return to custom CI distribution.
  - id: WS-05
    name: Convergence and closeout
    owner: AUTH-001
    objective: >-
      Prove the repository matches the future role boundary and merge the
      converged campaign PR under the authorized one-shot gate.
waves:
  - id: W0
    name: authority_and_runtime_reconstruction
    task_ids:
      - TASK-001
    predecessor_wave_ids: []
    exit_gate_ids:
      - GATE-001
  - id: W1
    name: ci_authority_retirement
    task_ids:
      - TASK-002
      - TASK-003
    predecessor_wave_ids:
      - W0
    exit_gate_ids:
      - GATE-002
      - GATE-003
  - id: W2
    name: org_default_preservation_and_permission_reduction
    task_ids:
      - TASK-004
      - TASK-005
    predecessor_wave_ids:
      - W1
    exit_gate_ids:
      - GATE-004
      - GATE-005
  - id: W3
    name: convergence_and_closeout
    task_ids:
      - TASK-006
      - TASK-007
    predecessor_wave_ids:
      - W2
    exit_gate_ids:
      - GATE-006
      - GATE-007
gates:
  - id: GATE-001
    name: ci_surface_authority_reconstruction
    statement: >-
      Every candidate custom CI distribution and enforcement surface has an
      identified caller, trigger, mutation behavior, credential requirement,
      and downstream dependency classification.
    gate_type: entry
    blocking: true
    owner_authority_id: AUTH-001
    task_ids:
      - TASK-001
    pass_criteria:
      - Every candidate custom CI distribution surface has an identified caller and trigger.
      - Mutation behavior and credential requirement are classified for each surface.
      - Downstream dependency classification exists for every candidate surface.
      - No UNKNOWN ownership case that could make removal unsafe remains unresolved.
    failure_effect: block_implementation
  - id: GATE-002
    name: ci_distribution_retired
    statement: >-
      Quantum-L9/.github no longer actively distributes, seeds, synchronizes,
      versions, or reconciles L9 CI implementation.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids:
      - TASK-002
    pass_criteria:
      - No active workflow or script copies L9 CI implementation into another repository.
      - No active workflow is required to bootstrap L9 CI into a newly created repository.
      - No active template-update dispatch exists solely to refresh copied L9 CI implementation.
      - Existing downstream repositories are not mutated.
    failure_effect: block_implementation
  - id: GATE-003
    name: ci_versioning_enforcement_authority_removed
    statement: >-
      Quantum-L9/.github no longer owns organization L9 CI enforcement or the
      selected l9-ci-core runtime revision.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-004
    task_ids:
      - TASK-003
    pass_criteria:
      - Quantum-L9/.github does not select or promote the organization l9-ci-core revision.
      - Quantum-L9/.github is not the desired-state owner for required L9 CI workflows or checks.
      - No remaining active code can apply L9 CI rulesets across the organization.
    failure_effect: block_implementation
  - id: GATE-004
    name: native_org_defaults_preserved
    statement: >-
      GitHub-native organization defaults and legitimate non-CI governance
      remain functional.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids:
      - TASK-004
    pass_criteria:
      - The repository continues to provide useful organization defaults without requiring downstream copying.
      - CI distribution is not listed as a responsibility of Quantum-L9/.github.
    failure_effect: block_implementation
  - id: GATE-005
    name: least_privilege_permissions
    statement: >-
      Surviving automation has least-privilege permissions and no unnecessary
      cross-repository CI mutation credential.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids:
      - TASK-005
    pass_criteria:
      - No surviving workflow retains cross-repository CI mutation authority without a non-CI requirement and explicit evidence.
      - Surviving workflow permissions are least privilege.
    failure_effect: block_implementation
  - id: GATE-006
    name: regression_guards_active
    statement: >-
      Repository tests and static validation reject reintroduction of legacy CI
      distribution authority.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-005
    task_ids:
      - TASK-006
    pass_criteria:
      - Reintroducing a CI pack, CI seeder, CI fanout workflow, or CI ruleset mutator fails deterministic repository validation.
      - Every surviving workflow is included in workflow syntax/static validation.
    failure_effect: block_implementation
  - id: GATE-007
    name: campaign_convergence_and_authorized_merge
    statement: >-
      Required checks pass on the final campaign head, remediation reports no
      codebase blocker, the PR is mergeable, and one-shot campaign merge
      authorization has been written.
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-001
    task_ids:
      - TASK-007
    pass_criteria:
      - All repository-required checks pass on the observed PR head SHA.
      - l9-pr-remediation reports no remaining codebase blocker.
      - The campaign PR is mergeable with no unanswered codebase review threads.
      - One-shot campaign merge authorization has been written for this campaign only.
    failure_effect: block_merge
evidence_requirements:
  - id: EVID-001
    claim: dot_github_ci_authority_surface_reconstruction_is_complete
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports:
      - GATE-001
  - id: EVID-002
    claim: ci_distribution_surfaces_are_retired
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_before_gate_evaluation
    producer: controller
    supports:
      - GATE-002
  - id: EVID-003
    claim: ci_versioning_and_enforcement_authority_is_removed
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_before_gate_evaluation
    producer: controller
    supports:
      - GATE-003
  - id: EVID-004
    claim: github_native_org_defaults_remain_functional
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_before_gate_evaluation
    producer: controller
    supports:
      - GATE-004
  - id: EVID-005
    claim: surviving_workflows_have_least_privilege_permissions
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_before_gate_evaluation
    producer: controller
    supports:
      - GATE-005
  - id: EVID-006
    claim: regression_guards_reject_ci_distribution_reintroduction
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: test_result
    freshness: collect_before_gate_evaluation
    producer: controller
    supports:
      - GATE-006
  - id: EVID-007
    claim: campaign_convergence_and_one_shot_merge_authorization_are_recorded
    source_type: repository_inspection
    source_location: Quantum-L9/.github
    collection_method: read_only_inspection
    freshness: collect_at_closeout
    producer: controller
    supports:
      - GATE-007
tasks:
  - id: TASK-001
    title: Reconstruct all .github CI authority and dependencies
    definition_status: ready
    objective: >-
      Establish the complete current control path before deleting or disabling
      any candidate legacy CI surface.
    workstream_id: WS-01
    wave_id: W0
    target_id: TARGET-001
    execution_kind: read_only
    authority_basis_ids:
      - AUTH-001
      - AUTH-002
      - AUTH-003
      - AUTH-004
    actions:
      - inspect_repository_governance_and_agent_instructions
      - enumerate_all_github_workflows_scripts_packs_registries_rulesets_and_properties
      - trace_all_references_to_l9_ci_core
      - trace_all_cross_repository_write_paths
      - trace_all_repository_dispatch_producers_and_consumers
      - trace_all_seed_and_bootstrap_callers
      - trace_all_template_and_pack_synchronization_callers
      - trace_all_ci_specific_ruleset_and_required_check_sources
      - trace_all_ci_specific_repository_property_sources
      - identify_all_tokens_apps_secrets_and_permissions_used_for_cross_repo_ci_mutation
      - read_only_search_downstream_repositories_for_direct_runtime_dependencies_on_dot_github
      - classify_each_surface_as_native_default_non_ci_governance_legacy_ci_distribution_or_unknown
      - run_prechange_repository_validation
    acceptance:
      - id: AC-001
        statement: >-
          No candidate CI-distribution file is modified before its caller,
          mutation behavior, and runtime dependency are understood.
        required_evidence_types:
          - inspection
      - id: AC-002
        statement: >-
          All UNKNOWN ownership cases that could make removal unsafe are
          resolved or cause the affected removal to fail closed.
        required_evidence_types:
          - inspection
    negative_cases:
      - deleting_l9_ci_pack_without_dependency_trace
      - assuming_workflow_templates_are_runtime_dependencies
      - assuming_dispatch_receivers_are_unused_without_search
      - changing_live_org_settings
    rollback:
      strategy: no_mutation_in_this_task
      trigger: not_applicable
      validation: worktree_unchanged_by_this_task
    risk:
      tier: T0
      reversibility: fully_reversible
      blast_radius: dot_github_repository_analysis
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-001
  - id: TASK-002
    title: Retire custom L9 CI distribution surfaces
    definition_status: ready
    objective: >-
      Remove the mechanisms that make Quantum-L9/.github a CI pack distributor,
      repository seeder, CI bootstrapper, or template-update fanout controller.
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-001
      - AUTH-002
      - AUTH-004
    actions:
      - inspect_and_retire_l9_ci_pack_if_no_direct_runtime_dependency_requires_it
      - inspect_and_retire_ci_seed_workflows
      - inspect_and_retire_new_repository_ci_bootstrap_workflows
      - inspect_and_retire_ci_template_update_dispatch_workflows
      - inspect_and_retire_ci_update_receiver_templates
      - inspect_and_retire_ci_payload_generators
      - inspect_and_retire_core_to_hub_template_sync_scripts
      - remove_ci_distribution_specific_tests_only_after_replacing_them_with_boundary_tests
      - remove_stale_docs_that_instruct_consumers_to_sync_or_seed_ci_from_dot_github
      - ensure_no_new_ci_copy_or_seed_mechanism_is_added
    acceptance:
      - id: AC-003
        statement: >-
          No active Quantum-L9/.github workflow or script copies L9 CI
          implementation into another repository.
        required_evidence_types:
          - inspection
          - test_result
      - id: AC-004
        statement: >-
          No active Quantum-L9/.github workflow is required to bootstrap L9 CI
          into a newly created repository.
        required_evidence_types:
          - inspection
      - id: AC-005
        statement: >-
          No active template-update dispatch exists solely to refresh copied L9
          CI implementation.
        required_evidence_types:
          - inspection
      - id: AC-006
        statement: Existing downstream repositories are not mutated.
        required_evidence_types:
          - inspection
    negative_cases:
      - building_a_smaller_replacement_seeder
      - replacing_copy_fanout_with_pr_fanout
      - mutating_consumer_repositories
      - deleting_an_active_runtime_dependency_without_proof
    rollback:
      strategy: restore_affected_legacy_ci_distribution_surface
      trigger: read_only_evidence_proves_active_downstream_ci_breakage
      validation: restored_surface_validated_before_reactivation
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: organization_ci_distribution_surfaces
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-002
  - id: TASK-003
    title: Remove duplicated CI versioning and enforcement authority
    definition_status: ready
    objective: >-
      Ensure Quantum-L9/.github does not remain the source of truth for the
      organization-selected Core revision, CI workflow interface version,
      required L9 checks, or CI-specific ruleset mutation.
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-001
      - AUTH-003
      - AUTH-004
    actions:
      - inspect_workflow_interface_registry_and_remove_ci_control_plane_ownership
      - inspect_ci_specific_ruleset_files_and_retire_control_plane_source_of_truth_role
      - inspect_ci_specific_property_schema_fields_such_as_seed_or_core_version_state
      - remove_ci_specific_version_promotion_logic
      - remove_ci_specific_required_check_management_logic
      - remove_ci_specific_ruleset_application_logic
      - preserve_only_non_ci_property_or_policy_material_with_proven_dot_github_ownership
      - update_boundaries_to_assign_future_ci_policy_authority_to_l9_ci_control_plane
      - ensure_l9_ci_core_is_described_only_as_runtime_orchestrator
    acceptance:
      - id: AC-007
        statement: >-
          Quantum-L9/.github does not select or promote the organization
          l9-ci-core revision.
        required_evidence_types:
          - inspection
      - id: AC-008
        statement: >-
          Quantum-L9/.github is not the desired-state owner for required L9 CI
          workflows or checks.
        required_evidence_types:
          - inspection
      - id: AC-009
        statement: >-
          No remaining active code can apply L9 CI rulesets across the
          organization from this repository.
        required_evidence_types:
          - inspection
          - test_result
    negative_cases:
      - moving_core_version_state_to_another_dot_github_file
      - retaining_duplicate_ruleset_authority_as_backup
      - treating_documentation_as_runtime_enforcement
      - mutating_actual_rulesets_during_campaign
    rollback:
      strategy: restore_removed_source
      trigger: proven_unrelated_non_ci_governance_responsibility
      validation: restored_source_ownership_documented
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: organization_ci_versioning_enforcement_authority
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-003
  - id: TASK-004
    title: Preserve and simplify the legitimate .github role
    definition_status: ready
    objective: >-
      Make the surviving repository clearly optimized for GitHub-native
      organization defaults, community health, contribution ergonomics, profile
      material, and explicitly non-CI governance.
    workstream_id: WS-03
    wave_id: W2
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-001
      - AUTH-002
    actions:
      - preserve_organization_profile
      - preserve_code_of_conduct
      - preserve_contributing_guidance
      - preserve_security_policy
      - preserve_support_guidance
      - preserve_issue_templates
      - preserve_pull_request_templates
      - classify_and_preserve_only_legitimate_non_ci_governance_automation
      - simplify_readme_and_boundary_docs_around_native_org_default_role
      - remove_ci_distribution_instructions_from_public_contributor_guidance
      - make_local_override_semantics_explicit
    acceptance:
      - id: AC-010
        statement: >-
          The repository continues to provide useful organization defaults
          without requiring downstream copying for supported GitHub-native
          surfaces.
        required_evidence_types:
          - inspection
      - id: AC-011
        statement: >-
          CI distribution is not listed as a responsibility of
          Quantum-L9/.github.
        required_evidence_types:
          - inspection
    negative_cases:
      - deleting_community_health_defaults
      - deleting_security_policy
      - turning_dot_github_into_l9_ci_control_plane
      - adding_repo_specific_product_logic
    rollback:
      strategy: restore_removed_organization_default_surface
      trigger: proven_legitimate_github_native_ownership
      validation: restored_surface_serves_org_default_role
    risk:
      tier: T1
      reversibility: reversible
      blast_radius: organization_default_surfaces
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: true
      pull_request: true
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids:
      - GATE-004
  - id: TASK-005
    title: Reduce credentials and workflow permissions
    definition_status: ready
    objective: >-
      Remove credential and permission requirements that existed solely to
      mutate CI state across repositories and minimize the authority of all
      surviving automation.
    workstream_id: WS-04
    wave_id: W2
    target_id: TARGET-001
    execution_kind: repo_local
    authority_basis_ids:
      - AUTH-002
      - AUTH-005
    actions:
      - enumerate_surviving_workflow_permissions
      - remove_cross_repository_ci_write_token_usage_made_obsolete_by_retirement
      - remove_workflows_write_if_not_required
      - remove_contents_write_if_not_required
      - remove_administration_write_expectations_if_not_required
      - remove_secret_inheritance_paths_used_only_for_ci_fanout
      - preserve_only_minimum_permissions_required_by_legitimate_remaining_workflows
      - verify_third_party_actions_are_immutably_pinned_under_existing_policy
    acceptance:
      - id: AC-012
        statement: >-
          No surviving workflow retains organization or cross-repository CI
          mutation authority without a non-CI requirement and explicit evidence.
        required_evidence_types:
          - inspection
      - id: AC-013
