schema: l9.program-execution.campaign-source.v2
schema_version: 2.0.0

metadata:
  campaign_id: "ib-odoo-dashboard-command-centers"
  title: "IB-Odoo_19 Dashboard Command Centers — correctness first, native-first UI"
  version: "1.2.0"
  created_at: "2026-11-20T23:30:00Z"
  status: operator_intake
  owner: "Igor Beylin"
  intended_drop_path: >-
    environment/program-execution/campaigns/ib-odoo-dashboard-command-centers/CAMPAIGN_SOURCE.yaml
  execution_host: cryptoxdog/IB-Odoo_19
  execution_default_branch: Staging
  runtime_root: "$HOME/.l9/programs/ib-odoo-dashboard-command-centers"
  worktree_root: "$HOME/.l9/program-worktrees/ib-odoo-dashboard-command-centers"
  source_is_immutable: true
  remote_mutation_during_admission: false

integrity:
  digest_algorithm: sha256
  canonical_encoding: utf-8
  canonical_line_endings: lf
  digest_record_location: source-integrity-receipt.json
  generated_counts_or_digests_may_be_hand_edited: false

pipeline_contract:
  pair: program-execution-system.v2
  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2
  compilation_sequence:
    - preserve_immutable_campaign_source
    - compile_source_into_complete_native_blueprint
    - collect_and_bind_current_state_evidence
    - validate_blueprint_in_template_mode
    - accept_blueprint_only_after_evidence_and_authority_resolution
    - bootstrap_controller_and_create_program_lock
    - admit_and_execute_ready_tasks
    - evaluate_evidence_backed_gates
    - export_controller_handoff_receipt
    - obtain_program_owner_terminal_verdict
  authority_boundaries:
    campaign_source_owns: operator_intent_and_campaign_semantics
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_runtime_state_and_gate_results
    adapters_own: host_translation_and_execution_receipts
    activation_prompt_owns: launch_mechanics_only

operator_directive:
  objective: >-
    Repair every dashboard number and drill-down that is wrong today, then
    upgrade Logistics, Sales and Admin into role-specific command centers and
    add an Operations Manager command center, native Odoo 19 first, where
    every actionable KPI opens exactly the source records it counts. The four
    dashboards operate as one routed system (operator addendum 2026-11-20):
    Logistics owns shipping execution and shipping-document exceptions,
    Operations Manager owns Document AI / attribution exceptions, AP/AR
    discrepancies and transaction-document exceptions, Admin oversees the
    business, Sales is rep-scoped; every exception has exactly one accountable
    owner who can actually resolve it, and the wrong role cannot. Native Odoo
    AI Auto-Sort (operator instruction 2026-11-20, second addendum) classifies
    incoming documents into the existing folders and tags: recognized shipping
    paperwork to Logistics, uncertain or wrong results to Operations Manager;
    human corrections persist on the original record with a reason; invoice
    correction learning is verified by repeat tests and shipping prompts are
    revised when recurring errors appear.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - reversible_repo_local_work
    - local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval

program:
  id: "ib-odoo-dashboard-command-centers"
  name: "IB-Odoo_19 Dashboard Command Centers"
  version: "1.2.0"
  owner: "Igor Beylin"
  definition_status: ready
  snapshot_at: "2026-11-20"
  target_repository_id: cryptoxdog/IB-Odoo_19
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  objective: >-
    Every displayed actionable KPI on the four role dashboards opens the
    source records it counts, with the same filter; counts and sums reconcile
    with the source models; permissions and company isolation hold; the
    dashboards are reproducible from module data.
  problem_statement: >-
    On cryptoxdog/IB-Odoo_19 Staging c422140, six of eight Admin urgency
    drills name fields that plasticos.sales.dashboard does not define, the
    rep-performance view multiplies money through a four-way join, Sales
    commission payout columns are constants, multi-load deals dead-end in a
    notification, about 49 Admin KPIs are not clickable, Admin SQL ignores
    company, financial periods follow write_date, the Admin menu bypasses its
    singleton opener, and no Operations Manager dashboard exists.
  target_state: >-
    One KPI definition per metric drives both the number and its drill
    domain on the owning source model (KPI-drill parity); rep performance
    aggregates without fan-out; commission payout reflects
    plasticos.commission.payout; multi-load deals drill to their loads;
    Admin is company-scoped; four command centers ship as module data and
    pass operator acceptance on Staging.
  scope:
    include:
      - "plasticos_admin_dashboard: drill contracts, rep aggregation, company scope, period basis, KPI drill coverage, singleton entry"
      - "plasticos_commission: sales dashboard payout projection, load and transaction navigation, sales command center"
      - "plasticos_logistics: load dashboard command center and its tests"
      - "Operations Manager command center (host per DEC-004)"
      - "Native Odoo 19 Dashboards shipped as spreadsheet.dashboard module data (DEC-001)"
      - "Responsibility-based exception routing at its owners: plasticos_documents_native document sync, plasticos_documents escalations (DEC-010, DEC-012)"
      - "Linda approval authority by command class (DEC-011)"
      - "Operations Manager AI & Transaction Review Workbench and Logistics Live Control Tower"
      - "Service-user refusal on business verification (N-008)"
      - "Native AI Auto-Sort on the existing Plasticos folders, tag-to-doc_type bridge, reasoned human reclassification, invoice-learning verification and shipping prompt-revision loop (DEC-013 OPT-C, DEC-015, DEC-016)"
    exclude:
      - "Production promotion (Staging to Production merge is an operator act outside this campaign)"
      - "New analytics database, duplicate transaction model or generic reporting engine"
      - "Gate, CEG, EIE, Neo4j and plasticos_gate changes"
      - "plasticos_base changes"
      - "Adding company_id to plasticos.transaction, offer, intake or claim"
      - "Making plasticos.transaction.commission_payout_state authoritative (RISK-003)"
      - "Owl components except the Operations review comparison surface where DEC-001 allows it"
      - "A new exception queue table, scheduler or verification writer"
      - "AI Auto-Sort tools beyond move-in-folder and add-tags (no bill/invoice creation tool, no activity tool, no code tool), bill auto-post, or new email senders"
      - "Manual vendor-bill amount checks outside the existing digitized-bill guard (RISK-005)"
      - "Changing plasticos_base resolvers (DNB-001); reuse them"
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - latest_explicit_operator_instruction
    - latest_accepted_program_decision
    - verified_current_state_evidence
    - approved_task_card
    - repository_local_governance
    - implementation
    - documentation
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - worker_claim_is_not_verification
    - kpi_value_and_drill_domain_share_one_definition
    - true_zero_is_distinguishable_from_unavailable
    - every_python_xml_or_security_change_bumps_its_module_version
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

targets:
  - id: TARGET-001
    name: "IB-Odoo_19"
    kind: git_repository
    authority_owner: "cryptoxdog"
    execution_mode: repo_local
    adapter: git
    repository_id: "cryptoxdog/IB-Odoo_19"
    source_of_truth: "cryptoxdog/IB-Odoo_19 origin/Staging"
    environments: [local, ci]
    mutability: reversible
    expected_revision: c422140c1d777a72b95cfc20995b80207d9bae6b
    default_branch: Staging

authorities:
  - id: AUTH-001
    responsibility: program_definition_scope_decisions_and_terminal_verdict
    owner: "Igor Beylin"
    scope: [whole_program, scope_changes, operator_decisions, staging_acceptance, terminal_verdict]
  - id: AUTH-002
    responsibility: controller_evidence_and_gate_evaluation
    owner: controller
    scope: [evidence_collection, gate_evaluation]
  - id: AUTH-003
    responsibility: technical_coordination_of_evidence_determined_choices
    owner: "CTO session (/lcto)"
    scope: [evidence_determined_design_choices, lane_assignment, integration_testing]

decisions:
  - id: DEC-001
    question: "Which presentation layer carries the four command centers?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Native-first. Analytical surface: spreadsheet.dashboard records shipped as module data (record shape of odoo/odoo 19.0 addons/spreadsheet_dashboard_account/data/dashboards.xml L4-13: spreadsheet_binary_data type=base64 file=..., main_data_model_ids, sample_dashboard_file_path, dashboard_group_id, group_ids, company_ids, sequence, is_published), JSON authored in the Enterprise spreadsheet editor on the runtime fixture and exported into the module. Work surfaces: native list/kanban(progressbar)/pivot/graph/searchpanel views behind filtered window actions; resolution on native record forms. Owl only as an ir.actions.client for the Operations side-by-side review surface if native Documents/form views cannot show original + candidate facts + current values + discrepancy together."}
      - {id: OPT-B, description: "Custom Owl dashboard framework for all four roles."}
      - {id: OPT-C, description: "board (My Dashboard): per-user, UI-configured, domain not editable — not module-reproducible."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-007]
    locked_consequence: "No custom analytics framework, analytics database or duplicate transaction model. Dashboards carry group_ids per role and company_ids; record rules still filter their data. Shipped dashboards are updatable module records, so -u reproduces them; UI edits to them are not a source of truth. Basis: EVID-007 (official 19.0 source and docs)."
  - id: DEC-002
    question: "Which business date assigns a closed deal to a financial period (MTD/YTD revenue, margin, commission, closed counts, rep performance)?"
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "plasticos.transaction.commission_earned_date (Date, indexed, set on live close, already used by the payout generator) — recommended."}
      - {id: OPT-B, description: "Customer invoice date (customer_invoice_id.invoice_date)."}
      - {id: OPT-C, description: "actual_delivery_date on the transaction."}
    selected_option_id: null
    blocking_task_ids: [TASK-012]
    required_evidence_ids: [EVID-001]
    locked_consequence: "write_date never assigns a financial period. Basis: admin_dashboard.py:296,325-336,736-744; transaction_commission.py:52,114; commission_payout.py:234-235."
  - id: DEC-003
    question: "May Sales dashboard rows open the owning plasticos.transaction?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Yes, for users whose ACL and record rules already allow reading it (operator instruction 2026-11-20: direct navigation to underlying records); supersedes the sales_dashboard.py:17-18 docstring."}
      - {id: OPT-B, description: "No; reps stay on the projection."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Navigation never widens access; the button is invisible where the transaction is not readable."
  - id: DEC-004
    question: "Which module hosts the Operations Manager command center? (Adding a module is ask-first, AGENTS.md:544.)"
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "New module plasticos_ops_dashboard depending on logistics, claims, documents, commission and security_base — recommended."}
      - {id: OPT-B, description: "Extend plasticos_admin_dashboard and add claims/documents to its depends."}
    selected_option_id: null
    blocking_task_ids: [TASK-040]
    required_evidence_ids: [EVID-001]
    locked_consequence: "One host; no circular dependency."
  - id: DEC-005
    question: "Approve the security changes the campaign needs? (a) Operations Manager read access to plasticos.claim; (b) Ops command center menu groups; (c) company record rule on plasticos.admin.kpi; (d) company isolation for pending (non-legacy, not yet accepted) plasticos.document rows, which rule_document_operation_scope_company leaves unscoped. Groups and record rules are ask-first, AGENTS.md:546."
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "Approve (a), (b), (c) and (d) as stated — recommended."}
      - {id: OPT-B, description: "Approve (b) and (c) only; the Ops queue omits claims."}
    selected_option_id: null
    blocking_task_ids: [TASK-040]
    required_evidence_ids: [EVID-001]
    locked_consequence: "No group or record rule changes without this decision. Basis: claims_security.xml:14-41; security_groups.xml:112-117."
  - id: DEC-006
    question: "What is the source of truth for the commission locked amount and payout state shown on the Sales dashboard?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Locked amount from plasticos.transaction.commission_locked_amount; payout state from the newest non-cancelled plasticos.commission.payout linked through commission_payout_tx_rel, else unpaid."}
      - {id: OPT-B, description: "plasticos.transaction.commission_payout_state (never written by payout actions)."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: transaction_commission.py:23-52,107-114; commission_payout.py:52-95,168-201; sale_inherit.py:227."
  - id: DEC-007
    question: "How is each actionable KPI bound to its drill-down?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "KPI-drill parity: one declaration (source model, domain, aggregate) drives both the value and a drill that opens the same model with the same domain; drills open the source model, not a projection, unless the projection row is the counted unit."}
      - {id: OPT-B, description: "Keep separate SQL for values and hand-written drill domains."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-004]
    locked_consequence: "Every actionable KPI has a test asserting search_count(drill domain) == displayed value."
  - id: DEC-008
    question: "How are Admin KPIs scoped to company when plasticos.transaction carries no company_id?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Derive via sale_order_id.company_id in the user's allowed companies; plasticos.admin.kpi gains company_id and becomes one record per company opened through action_open_admin_dashboard."}
      - {id: OPT-B, description: "Add a stored company_id to plasticos.transaction (excluded: DNB-004)."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: admin_dashboard.py:39,43-182,473-479,631-643; transaction.py:1480; INVARIANTS.md POS-INV-05."
  - id: DEC-009
    question: "How does rep performance treat legacy history and open pipeline?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Exclude legacy_erp_history, matching the KPI SQL; report open pipeline as a labelled point-in-time snapshot."}
      - {id: OPT-B, description: "Keep current behaviour."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: admin_dashboard.py:295,336,707-721."

  - id: DEC-010
    question: "Who owns which document exception?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Operator ownership matrix 2026-11-20 with two-dimensional routing (confirmed business purpose x exception type). Logistics: Linda operational edge cases; PO/SO shipping paperwork; packing lists; BOL; certified and ordinary scale tickets; carrier certifications; loading pictures and delivery documents; buyer receiving reports — when the document is confidently attributed and the exception is missing/incomplete/outdated/needs verification or wrong-load attribution. Operations Manager: unclassified or conflicting classification, unknown or conflicting references, wrong company, ambiguous association, historical verification conflicts, AP vendor-bill and AR invoice discrepancies, duplicate bills, blocked bills, transaction-level and cross-department exceptions. Uncertain classification goes to Operations even when one candidate is logistics. Admin: oversight only. Sales: rep-scoped."}
      - {id: OPT-B, description: "Keep current routing: every review and escalation to Operations Manager."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-008]
    locked_consequence: "Purpose is decided from the business association and obligation (associated model, obligation_kind, account.move move_type in_invoice vs out_invoice), never from a filename, a tag alone or an AI guess: INV lumps invoice and vendor bill and no PO/SO/carrier-cert tag exists (N-006). One original may carry several obligations, each with its own owner; the original and plasticos.document verification decisions are preserved. Logistics document handling grants no price, credit or posting authority."
  - id: DEC-011
    question: "Which Linda held-command classes may group_logistics_ops decide (approve/reject), and which stay Operations Manager only?"
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "Recommended split. Logistics Ops may decide execution-timing commands schedule_load, dispatch_load, accept_appointment, confirm_ready, record_actual_event, propose_shipment_event, accept_shipment_event, record_gate_in, record_departure when edge_case is unverified_linda_reply, acceptance, out_of_sequence or evidence_unverified. Operations Manager only: correct_fact (correction, value_conflict), record_verified_gross_mass, record_container_tare, record_regulatory_parties, any unit_mismatch, any refusal_retry."}
      - {id: OPT-B, description: "Logistics Ops may decide every class except correct_fact."}
      - {id: OPT-C, description: "No change; Operations Manager only."}
    selected_option_id: null
    blocking_task_ids: [TASK-061]
    required_evidence_ids: [EVID-008]
    locked_consequence: "Authority is checked server-side per (command, edge_case) in linda_approval._require_approver, never by UI buttons; Linda stays refused; replay revalidation, FOR UPDATE locking, the pending unique index, refusal records and the archived-Linda kill switch are unchanged; unauthorized roles fail with AccessError at the server. Basis: linda_approval.py:50,265-295,374-457."
  - id: DEC-012
    question: "What carries an exception obligation?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Existing mail.activity on the owning record, typed by a module-owned mail.activity.type per exception class (res_model set), assigned through the existing plasticos_base resolver _plasticos_escalation_manager_in_group (excludes cron and superuser, company-checked); idempotent: activity_search for the open activity, reschedule/reassign if present, create only if absent, close with activity_feedback; one accountable assignee, one current activity, deadline, reason, audit trail."}
      - {id: OPT-B, description: "A new exception queue table."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-007, EVID-008]
    locked_consequence: "No new queue table, scheduler or verification writer. activity_schedule never deduplicates (mail_activity_mixin.py L373-425), so every writer searches first. document_sync._manager_reviewer (which does not exclude the cron user) is retired in favour of the plasticos_base resolver."
  - id: DEC-013
    question: "What may Document AI and digitization do in these workflows?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Superseded 2026-11-20: AI may classify, propose and route only; no AI auto-sort."}
      - {id: OPT-B, description: "Enable AI auto-sort with every available tool and digitization auto-post."}
      - {id: OPT-C, description: "Operator second addendum 2026-11-20: configure native ai_documents Auto-Sort on the existing Plasticos folders with exactly two tools, move-in-folder and add-tags. Recognized shipping paperwork (PO, SO, packing list, BOL, scale ticket, receiving or loading evidence) is moved/tagged toward Logistics; uncertain, contradictory or wrong-type results get the Needs Review tag and stay in Inbox for Operations Manager. No vendor-bill/customer-invoice creation tool, no activity or code tool (activities stay with the DEC-012 router), no AI verification, no auto-post, no new external sender; Linda remains the sole logistics-document chase sender."}
    selected_option_id: OPT-C
    blocking_task_ids: []
    required_evidence_ids: [EVID-007, EVID-009, EVID-010]
    locked_consequence: "Enterprise facts (EVID-010): ai_documents runs synchronously on create/move into a prompted folder via base.automation, plus an alias cron; it writes only what its tools do (folder_id, tag_ids) and a chatter log; there is no confidence field and no fallback, so the prompt must end with 'otherwise add Needs Review'. add_tags matches any tag by name globally, so the Verified tag must be unwritable outside verification. ai_documents_account's wizard defaults add bill/invoice creation tools; setup must pass explicit ai_tool_ids. Custom code already refuses _autopost_bill for digitized bills."
  - id: DEC-014
    question: "Add the missing shipping-paperwork types so Auto-Sort and routing can name them?"
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "Recommended. Add native documents.tag records Purchase Order, Packing List, Receiving Report (plasticos_documents_native/data/document_tags.xml) and doc_type values purchase_order, packing_list, receiving_report mapped to plasticos.document.tag PO (new, plasticos_documents data), PACKING and RECEIVING (existing); Sales Orders keep Customer Order."}
      - {id: OPT-B, description: "No new types; PO, packing list and receiving report fall back to Needs Review (Operations) until added."}
    selected_option_id: null
    blocking_task_ids: []
    required_evidence_ids: [EVID-008, EVID-010]
    locked_consequence: "TASK-070/071 ship with OPT-B behaviour and gain the three types only if OPT-A is chosen. Basis: native tags lack PO/packing/receiving (document_tags.xml); legacy tags have PACKING, RECEIVING, no PO."
  - id: DEC-015
    question: "How does a native classification reach the business-evidence bridge, and how is a human correction kept?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Smallest correction inside plasticos_documents_native: when exactly one document-type tag is present and doc_type is empty or tag-derived, set doc_type from a fixed tag->doc_type map with provenance doc_type_source='tag'; two or more type tags clear nothing, set no doc_type and add Needs Review. A human doc_type set (form or the reclassify action) sets doc_type_source='human' and is never overwritten by a tag. A Correct Classification action (doc_type, target folder, required reason) records the change through mail tracking of doc_type/doc_type_source plus a reason message with a module-owned subtype; the existing SHELL_TRIGGER_FIELDS write path re-syncs the original's business evidence. The Verified tag is dropped from any write that does not come through verification."}
      - {id: OPT-B, description: "Give the AI a code tool that writes doc_type directly."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-010]
    locked_consequence: "No AI write tool beyond move/tag; the correction ledger is mail tracking + reason messages on documents.document (no new table); one new provenance field (MINOR bump). Test first that the current bridge does not receive Auto-Sort classification (doc_type is never derived from tags today, document_native.py:35,88-109,177-212)."
  - id: DEC-016
    question: "Approve the AI provider, data sharing and module host for Auto-Sort?"
    authority_id: AUTH-001
    status: pending
    options:
      - {id: OPT-A, description: "Recommended. Approve OpenAI gpt-4.1 via Odoo ai (document name, attachment content, tag names sent per run); the operator sets the key in Odoo settings (ai.openai_key) on Staging first, never in the repository; configuration lives in a new auto_install glue module plasticos_documents_ai (depends plasticos_documents_native + ai_documents) so environments without AI are unaffected."}
      - {id: OPT-B, description: "Approve the provider; configuration inside plasticos_documents_native with a hard ai_documents dependency."}
      - {id: OPT-C, description: "Do not send document content to an external LLM; no Auto-Sort."}
    selected_option_id: null
    blocking_task_ids: [TASK-071, TASK-072]
    required_evidence_ids: [EVID-009, EVID-010]
    locked_consequence: "Adding a module is ask-first (AGENTS.md:544); the key is a secret held only in Odoo settings; usage cost is OpenAI's, not IAP credits."
