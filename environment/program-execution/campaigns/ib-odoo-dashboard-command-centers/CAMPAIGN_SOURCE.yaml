tasks:
  - id: TASK-001
    title: "Spike: ship an Odoo 19 Dashboard as module data"
    definition_status: ready
    workstream_id: WS-03
    wave_id: W0
    target_id: TARGET-001
    execution_kind: repo_local
    kernel_profile: BUILD
    objective: >-
      Prove the DEC-001 authoring path on the runtime fixture: author one
      dashboard (one Odoo pivot + one global date filter + one chart with a
      menu reference) in the Enterprise spreadsheet editor, export the JSON,
      ship it as a spreadsheet.dashboard record in the official record shape
      (EVID-007) on a throwaway branch with role group_ids and company_ids,
      install and -u twice, and record whether the result is identical and
      drill-down opens the expected records. Record native gaps (if any) that
      would require the Owl review surface.
    authority_basis_ids: [AUTH-003]
    required_decision_ids: [DEC-001]
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-001]
    paths:
      - docs/reports/gmp-reports/ib-odoo-dashboard-command-centers-TASK-001-native-dashboard-spike.md
    actions:
      - read_installed_spreadsheet_dashboard_source
      - write_spike_report_with_verdict_and_source_lines
    acceptance:
      - id: AC-001
        statement: "Report states SUPPORTED or NOT_SUPPORTED with source file and line evidence and the exact record shape; no product code is committed."
        required_evidence_types: [inspection]
    validation:
      - id: VAL-001
        method: command
        command_or_inspection: test -s docs/reports/gmp-reports/ib-odoo-dashboard-command-centers-TASK-001-native-dashboard-spike.md
        environment: repo_local
        expected_result: PASS
    negative_cases: [verdict_without_source_lines, product_code_in_spike]
    rollback:
      strategy: revert_local_commit
      trigger: validation_failure_or_scope_violation
      validation: git status --short
    risk: {tier: T1, reversibility: reversible, blast_radius: one_report}
    authorization_ceiling: &ceiling_local
      inspect: true
      local_write: true
      commit: true
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-002]

  - id: TASK-002
    title: "Enterprise capability and entitlement inventory (UNK-004)"
    definition_status: ready
    workstream_id: WS-05
    wave_id: W0
    target_id: TARGET-001
    execution_kind: repo_local
