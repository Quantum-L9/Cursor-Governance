  execution_status: NOT_EXECUTED
  decision_record: "Operator decisions 2026-11-21 (DEC-002, DEC-004, DEC-005, DEC-011, DEC-017, DEC-018) and Document AI Prompt Requirements v2.0 (DEC-019): publish the definition to PR #1101 only; activation, lane launch, IB-Odoo_19 changes, merge, deploy and live DeepSeek calls are separate authorizations."
