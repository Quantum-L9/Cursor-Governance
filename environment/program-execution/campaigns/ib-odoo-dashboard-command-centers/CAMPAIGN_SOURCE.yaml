    resolution_method: "TASK-001: author one dashboard JSON on the runtime fixture, ship it in a throwaway module branch, install and -u twice, diff"
    resolution_evidence_ids: [EVID-003, EVID-007]
  - id: UNK-002
    statement: >-
      Installed module versions, UI rendering and real click behaviour on
      Odoo.sh Staging and Production.
    owner: AUTH-001
    status: open
    blocking_task_ids: [TASK-051]
    resolution_method: "operator acceptance walk on Staging"
    resolution_evidence_ids: [EVID-006]
  - id: UNK-003
    statement: >-
      Query cost of the corrected KPI SQL at production volume with several
      allowed companies.
    owner: AUTH-001
    status: open
    blocking_task_ids: [TASK-051]
    resolution_method: "EXPLAIN ANALYZE on the runtime fixture in TASK-050, timing on Staging in TASK-051"
