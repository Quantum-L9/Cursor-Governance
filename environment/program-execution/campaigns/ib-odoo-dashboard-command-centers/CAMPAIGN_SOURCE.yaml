  - id: EVID-007
    claim: "Official Odoo 19.0 source and docs for spreadsheet.dashboard data shipping, access, drill-down, Documents AI, digitization and mail.activity semantics."
    source_type: inspection
    source_location: "odoo/odoo 19.0 @ 0a722221e608 (addons/spreadsheet_dashboard*, addons/mail); odoo.com/documentation/19.0 dashboards, documents, ai/document_sort, ai/server-actions, invoice_digitization, view_architectures, javascript_client_action"
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports: [GATE-002]
