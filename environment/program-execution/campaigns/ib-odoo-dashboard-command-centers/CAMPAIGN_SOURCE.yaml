    campaign_source_owns: operator_intent_and_campaign_semantics
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_runtime_state_and_gate_results
    adapters_own: host_translation_and_execution_receipts
    activation_prompt_owns: launch_mechanics_only

operator_directive:
  objective: >-
    Repair every dashboard number and drill-down that is wrong today, then
    upgrade Logistics, Sales and Admin into role-specific command centers and
    add an Operations Manager command center, native Odoo 19 first, where
    every actionable KPI opens exactly the source records it counts. The four
    dashboards operate as one routed system (operator addendum 2026-11-20):
    Logistics owns shipping execution and shipping-document exceptions,
    Operations Manager owns Document AI / attribution exceptions, AP/AR
    discrepancies and transaction-document exceptions, Admin oversees the
    business, Sales is rep-scoped; every exception has exactly one accountable
    owner who can actually resolve it, and the wrong role cannot. Native Odoo
    AI Auto-Sort (operator instruction 2026-11-20, second addendum) classifies
    incoming documents into the existing folders and tags: recognized shipping
    paperwork to Logistics, uncertain or wrong results to Operations Manager;
    human corrections persist on the original record with a reason; the LLM
    is DeepSeek deepseek-flash through a small provider adapter (operator
    instruction 2026-11-21); invoice
    correction learning is verified by repeat tests and shipping prompts are
    revised when recurring errors appear.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - reversible_repo_local_work
    - local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval

program:
  id: "ib-odoo-dashboard-command-centers"
  name: "IB-Odoo_19 Dashboard Command Centers"
  version: "1.5.0"
  owner: "Igor Beylin"
  definition_status: ready
  snapshot_at: "2026-11-20"
  target_repository_id: cryptoxdog/IB-Odoo_19
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  objective: >-
    Every displayed actionable KPI on the four role dashboards opens the
    source records it counts, with the same filter; counts and sums reconcile
    with the source models; permissions and company isolation hold; the
    dashboards are reproducible from module data.
  problem_statement: >-
    On cryptoxdog/IB-Odoo_19 Staging c422140, six of eight Admin urgency
    drills name fields that plasticos.sales.dashboard does not define, the
    rep-performance view multiplies money through a four-way join, Sales
    commission payout columns are constants, multi-load deals dead-end in a
    notification, about 49 Admin KPIs are not clickable, Admin SQL ignores
    company, financial periods follow write_date, the Admin menu bypasses its
    singleton opener, and no Operations Manager dashboard exists.
  target_state: >-
    One KPI definition per metric drives both the number and its drill
    domain on the owning source model (KPI-drill parity); rep performance
    aggregates without fan-out; commission payout reflects
    plasticos.commission.payout; multi-load deals drill to their loads;
    Admin is company-scoped; four command centers ship as module data and
    pass operator acceptance on Staging.
  scope:
    include:
      - "plasticos_admin_dashboard: drill contracts, rep aggregation, company scope, period basis, KPI drill coverage, singleton entry"
      - "plasticos_commission: sales dashboard payout projection, load and transaction navigation, sales command center"
      - "plasticos_logistics: load dashboard command center and its tests"
      - "Operations Manager command center (host per DEC-004)"
      - "Native Odoo 19 Dashboards shipped as spreadsheet.dashboard module data (DEC-001)"
      - "Responsibility-based exception routing at its owners: plasticos_documents_native document sync, plasticos_documents escalations (DEC-010, DEC-012)"
      - "Linda approval authority by command class (DEC-011)"
      - "Operations Manager AI & Transaction Review Workbench and Logistics Live Control Tower"
      - "Service-user refusal on business verification (N-008)"
      - "Native AI Auto-Sort on the existing Plasticos folders, tag-to-doc_type bridge, reasoned human reclassification, invoice-learning verification and shipping prompt-revision loop (DEC-013 OPT-C, DEC-015, DEC-016)"
    exclude:
      - "Production promotion (Staging to Production merge is an operator act outside this campaign)"
      - "New analytics database, duplicate transaction model or generic reporting engine"
      - "Gate, CEG, EIE, Neo4j and plasticos_gate changes"
      - "plasticos_base changes"
      - "Adding company_id to plasticos.transaction, offer, intake or claim"
      - "Making plasticos.transaction.commission_payout_state authoritative (RISK-003)"
      - "Owl components except the Operations review comparison surface where DEC-001 allows it"
      - "A new exception queue table, scheduler or verification writer"
      - "AI Auto-Sort tools beyond move-in-folder and add-tags (no bill/invoice creation tool, no activity tool, no code tool), bill auto-post, or new email senders"
      - "Manual vendor-bill amount checks outside the existing digitized-bill guard (RISK-005)"
      - "Changing plasticos_base resolvers (DNB-001); reuse them"
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - latest_explicit_operator_instruction
    - latest_accepted_program_decision
    - verified_current_state_evidence
    - approved_task_card
    - repository_local_governance
    - implementation
    - documentation
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - worker_claim_is_not_verification
    - kpi_value_and_drill_domain_share_one_definition
    - true_zero_is_distinguishable_from_unavailable
    - every_python_xml_or_security_change_bumps_its_module_version
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

targets:
  - id: TARGET-001
    name: "IB-Odoo_19"
    kind: git_repository
    authority_owner: "cryptoxdog"
    execution_mode: repo_local
    adapter: git
    repository_id: "cryptoxdog/IB-Odoo_19"
    source_of_truth: "cryptoxdog/IB-Odoo_19 origin/Staging"
    environments: [local, ci]
    mutability: reversible
    expected_revision: c422140c1d777a72b95cfc20995b80207d9bae6b
    default_branch: Staging

authorities:
  - id: AUTH-001
    responsibility: program_definition_scope_decisions_and_terminal_verdict
    owner: "Igor Beylin"
    scope: [whole_program, scope_changes, operator_decisions, staging_acceptance, terminal_verdict]
  - id: AUTH-002
    responsibility: controller_evidence_and_gate_evaluation
    owner: controller
    scope: [evidence_collection, gate_evaluation]
  - id: AUTH-003
    responsibility: technical_coordination_of_evidence_determined_choices
    owner: "CTO session (/lcto)"
    scope: [evidence_determined_design_choices, lane_assignment, integration_testing]

decisions:
  - id: DEC-001
    question: "Which presentation layer carries the four command centers?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Native-first. Analytical surface: spreadsheet.dashboard records shipped as module data (record shape of odoo/odoo 19.0 addons/spreadsheet_dashboard_account/data/dashboards.xml L4-13: spreadsheet_binary_data type=base64 file=..., main_data_model_ids, sample_dashboard_file_path, dashboard_group_id, group_ids, company_ids, sequence, is_published), JSON authored in the Enterprise spreadsheet editor on the runtime fixture and exported into the module. Work surfaces: native list/kanban(progressbar)/pivot/graph/searchpanel views behind filtered window actions; resolution on native record forms. Owl only as an ir.actions.client for the Operations side-by-side review surface if native Documents/form views cannot show original + candidate facts + current values + discrepancy together."}
      - {id: OPT-B, description: "Custom Owl dashboard framework for all four roles."}
      - {id: OPT-C, description: "board (My Dashboard): per-user, UI-configured, domain not editable — not module-reproducible."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-007]
    locked_consequence: "No custom analytics framework, analytics database or duplicate transaction model. Dashboards carry group_ids per role and company_ids; record rules still filter their data. Shipped dashboards are updatable module records, so -u reproduces them; UI edits to them are not a source of truth. Basis: EVID-007 (official 19.0 source and docs)."
  - id: DEC-002
    question: "Which business date assigns a closed deal to a financial period?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "plasticos.transaction.commission_earned_date for closed-deal and earned-commission period attribution."}
      - {id: OPT-B, description: "Customer invoice date (customer_invoice_id.invoice_date)."}
      - {id: OPT-C, description: "actual_delivery_date on the transaction."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Operator 2026-11-21. write_date is never a business date. Transaction-based figures are operational closed-deal revenue/margin/commission attributed by commission_earned_date and must never be labelled accounting-recognized revenue. Accounting-posted revenue (posted account.move by accounting date), invoice aging (invoice_date_due) and cash (payment dates) are separate KPIs with their own source dates. Every KPI states its semantics and source date in its label or help text. Basis: admin_dashboard.py:296,325-336,736-744; transaction_commission.py:52,114; commission_payout.py:234-235."
  - id: DEC-003
    question: "May Sales dashboard rows open the owning plasticos.transaction?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Yes, for users whose ACL and record rules already allow reading it (operator instruction 2026-11-20: direct navigation to underlying records); supersedes the sales_dashboard.py:17-18 docstring."}
      - {id: OPT-B, description: "No; reps stay on the projection."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Navigation never widens access; the button is invisible where the transaction is not readable."
  - id: DEC-004
    question: "Which module hosts the Operations Manager workbench?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "New module plasticos_ops_dashboard depending on logistics, claims, documents, documents_native, commission and security_base."}
      - {id: OPT-B, description: "Extend plasticos_admin_dashboard."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Operator 2026-11-21. Strictly a presentation/workflow integration module: it reuses mail.activity, Documents, Accounting, claims, transactions and Linda. No independent exception queue, duplicated business records, learning system or second AI engine. It is the Operations command center, not an AI-training subsystem."
  - id: DEC-005
    question: "Approve the security changes the campaign needs?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "All four: (a) Operations Manager read-only access to plasticos.claim; (b) Operations workbench menus restricted to group_operations_manager; (c) company isolation for plasticos.admin.kpi records; (d) company isolation for pending (non-legacy, not yet accepted) plasticos.document evidence."}
      - {id: OPT-B, description: "(b) and (c) only."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-008]
    locked_consequence: "Operator 2026-11-21. No write escalation on claims. Existing group implications and company-aware record rules are preserved; Sales and Logistics gain no access to financial or claims records. A pending document whose company cannot be resolved fails closed (invisible to company-scoped users and routed to Operations through the TASK-060 router, never shown cross-company). Every change carries ACL, multi-company and negative-access tests. Changes land in: (a) and (b) plasticos_ops_dashboard/security (TASK-040); (c) plasticos_admin_dashboard/security (TASK-013); (d) plasticos_documents/security (TASK-065)."
  - id: DEC-006
    question: "What is the source of truth for the commission locked amount and payout state shown on the Sales dashboard?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Locked amount from plasticos.transaction.commission_locked_amount; payout state from the newest non-cancelled plasticos.commission.payout linked through commission_payout_tx_rel, else unpaid."}
      - {id: OPT-B, description: "plasticos.transaction.commission_payout_state (never written by payout actions)."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: transaction_commission.py:23-52,107-114; commission_payout.py:52-95,168-201; sale_inherit.py:227."
  - id: DEC-007
    question: "How is each actionable KPI bound to its drill-down?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "KPI-drill parity: one declaration (source model, domain, aggregate) drives both the value and a drill that opens the same model with the same domain; drills open the source model, not a projection, unless the projection row is the counted unit."}
      - {id: OPT-B, description: "Keep separate SQL for values and hand-written drill domains."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-004]
    locked_consequence: "Every actionable KPI has a test asserting search_count(drill domain) == displayed value."
  - id: DEC-008
    question: "How are Admin KPIs scoped to company when plasticos.transaction carries no company_id?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Derive via sale_order_id.company_id in the user's allowed companies; plasticos.admin.kpi gains company_id and becomes one record per company opened through action_open_admin_dashboard."}
      - {id: OPT-B, description: "Add a stored company_id to plasticos.transaction (excluded: DNB-004)."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: admin_dashboard.py:39,43-182,473-479,631-643; transaction.py:1480; INVARIANTS.md POS-INV-05."
  - id: DEC-009
    question: "How does rep performance treat legacy history and open pipeline?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Exclude legacy_erp_history, matching the KPI SQL; report open pipeline as a labelled point-in-time snapshot."}
      - {id: OPT-B, description: "Keep current behaviour."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001]
    locked_consequence: "Basis: admin_dashboard.py:295,336,707-721."

  - id: DEC-010
    question: "Who owns which document exception?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Operator ownership matrix 2026-11-20 with two-dimensional routing (confirmed business purpose x exception type). Logistics: Linda operational edge cases; PO/SO shipping paperwork; packing lists; BOL; certified and ordinary scale tickets; carrier certifications; loading pictures and delivery documents; buyer receiving reports — when the document is confidently attributed and the exception is missing/incomplete/outdated/needs verification or wrong-load attribution. Operations Manager: unclassified or conflicting classification, unknown or conflicting references, wrong company, ambiguous association, historical verification conflicts, AP vendor-bill and AR invoice discrepancies, duplicate bills, blocked bills, transaction-level and cross-department exceptions. Uncertain classification goes to Operations even when one candidate is logistics. Admin: oversight only. Sales: rep-scoped."}
      - {id: OPT-B, description: "Keep current routing: every review and escalation to Operations Manager."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-001, EVID-008]
    locked_consequence: "Purpose is decided from the business association and obligation (associated model, obligation_kind, account.move move_type in_invoice vs out_invoice), never from a filename, a tag alone or an AI guess: INV lumps invoice and vendor bill and no PO/SO/carrier-cert tag exists (N-006). One original may carry several obligations, each with its own owner; the original and plasticos.document verification decisions are preserved. Logistics document handling grants no price, credit or posting authority."
  - id: DEC-011
    question: "Which Linda held-command classes may group_logistics_ops decide, and under what safety rule?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Logistics Operations decides the routine operational classes: schedule_load, accept_appointment, propose_shipment_event, accept_shipment_event, record_gate_in, record_departure, record_actual_event, confirm_ready, dispatch_load. Operations Manager keeps correct_fact (correction, value_conflict), record_container_tare, record_verified_gross_mass, record_regulatory_parties, every value_conflict, every unit_mismatch and every refusal_retry, and every case requiring a prohibited override."}
      - {id: OPT-B, description: "Logistics Ops decides every class except correct_fact."}
      - {id: OPT-C, description: "No change; Operations Manager only."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-008]
    locked_consequence: "Operator 2026-11-21, OPT-A with a fail-closed refinement. Routing an exception to Logistics never authorizes overriding an operational safety gate. A Logistics approval replays the command against the exact current business state with every owner guard active; if any guard still refuses (including evidence_unverified and out_of_sequence cases that remain unresolved), the command is not applied, the result is recorded as blocked and the case is re-routed to Operations Manager. dispatch, release, readiness and other consequential commands never become executable merely because a Logistics user clicked Approve. Operations Manager approvals keep the existing semantics. The Linda kill switch, server-side authorization, FOR UPDATE locking, replay/idempotency checks and audit history are preserved; Logistics users are never added to group_operations_manager. Every authorized (command, edge_case) combination has a positive and a negative test."
  - id: DEC-012
    question: "What carries an exception obligation?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Existing mail.activity on the owning record, typed by a module-owned mail.activity.type per exception class (res_model set), assigned through the existing plasticos_base resolver _plasticos_escalation_manager_in_group (excludes cron and superuser, company-checked); idempotent: activity_search for the open activity, reschedule/reassign if present, create only if absent, close with activity_feedback; one accountable assignee, one current activity, deadline, reason, audit trail."}
      - {id: OPT-B, description: "A new exception queue table."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-007, EVID-008]
    locked_consequence: "No new queue table, scheduler or verification writer. activity_schedule never deduplicates (mail_activity_mixin.py L373-425), so every writer searches first. document_sync._manager_reviewer (which does not exclude the cron user) is retired in favour of the plasticos_base resolver."
  - id: DEC-013
    question: "What may Document AI and digitization do in these workflows?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Superseded 2026-11-20: AI may classify, propose and route only; no AI auto-sort."}
      - {id: OPT-B, description: "Enable AI auto-sort with every available tool and digitization auto-post."}
      - {id: OPT-C, description: "Operator second addendum 2026-11-20: configure native ai_documents Auto-Sort on the existing Plasticos folders with exactly two tools, move-in-folder and add-tags. Recognized shipping paperwork (PO, SO, packing list, BOL, scale ticket, receiving or loading evidence) is moved/tagged toward Logistics; documents with no defensible primary type or materially incompatible primary classifications get the Needs Review tag and stay in Inbox for Operations Manager (DEC-019: autonomy-first; incomplete or imperfect documents are still classified). No vendor-bill/customer-invoice creation tool, no activity or code tool (activities stay with the DEC-012 router), no AI verification, no auto-post, no new external sender; Linda remains the sole logistics-document chase sender."}
    selected_option_id: OPT-C
    blocking_task_ids: []
    required_evidence_ids: [EVID-007, EVID-009, EVID-010]
    locked_consequence: "Enterprise facts (EVID-010): ai_documents runs synchronously on create/move into a prompted folder via base.automation, plus an alias cron; it writes only what its tools do (folder_id, tag_ids) and a chatter log; there is no confidence field and no fallback, so the prompt must give an explicit last-resort instruction (Needs Review, staying in Inbox) for genuinely unclassifiable documents, per DEC-019 — never as the default outcome. add_tags matches any tag by name globally, so the Verified tag must be unwritable outside verification. ai_documents_account's wizard defaults add bill/invoice creation tools; setup must pass explicit ai_tool_ids. Custom code already refuses _autopost_bill for digitized bills."
  - id: DEC-014
    question: "Seed the document types and review signals that the routing and the v2.0 prompt specialists must be able to name?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Operator 2026-11-21 'seed the missing tags necessary', extended for Document AI Prompt Requirements v2.0 (DEC-019). Native documents.tag types (plasticos_documents_native/data/document_tags.xml): Purchase Order, Packing List, Receiving Report, Certified Scale Ticket (CST), Delivery Order Confirmation, Carrier Certification, Customer Invoice, Financial Document, Carrier Invoice, Credit Note, Debit Note, Statement, Payment Confirmation, Delivery Receipt, Order Confirmation, Material Certification, Technical Specification, Unloading Pic, Delivery Photo, Damage Photo. Native review-signal tags: Evidence Gap, Duplicate Candidate, Includes Supporting Evidence (Needs Review and To Split exist). doc_type values for every new type. Legacy plasticos.document.tag: PO 'Purchase Order', CARRIER_CERT 'Carrier Certification'. DOC_TYPE_TAG_MAP: purchase_order->PO, packing_list->PACKING, receiving_report->RECEIVING, certified_scale_ticket->CST, delivery_order->DO, delivery_receipt->DO, carrier_certification->CARRIER_CERT, customer_invoice->INV, financial_document->INV, carrier_invoice->INV, credit_note->INV, debit_note->INV, statement->INV, payment_confirmation->INV, order_confirmation->CO, material_certification->CERT, technical_specification->OTHER, unloading_pic->PHOTO, delivery_photo->PHOTO, damage_photo->CLAIM_PHOTO. Review signals carry no doc_type."}
      - {id: OPT-B, description: "No new types; those documents fall back to Needs Review."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-008, EVID-010]
    locked_consequence: "Seeded by TASK-069 as additive data (new xmlids only; no rename of existing records). Family, folder and owner per type are in AI_PROMPT_INVENTORY.yaml taxonomy. The v2.0-driven additions are derived by the CTO from the distinctions the specification requires (e.g. carrier invoice vs BOL, credit note, delivery receipt, material certification vs datasheet, damage photo) and are reported to the operator as such."
  - id: DEC-015
    question: "How does a native classification reach the business-evidence bridge, and how is a human correction kept?"
    authority_id: AUTH-003
    status: accepted
    options:
      - {id: OPT-A, description: "Smallest correction inside plasticos_documents_native: when exactly one document-type tag is present and doc_type is empty or tag-derived, set doc_type from a fixed tag->doc_type map with provenance doc_type_source='tag'; two or more type tags clear nothing, set no doc_type and add Needs Review. A human doc_type set (form or the reclassify action) sets doc_type_source='human' and is never overwritten by a tag. A Correct Classification action (doc_type, target folder, required reason) records the change through mail tracking of doc_type/doc_type_source plus a reason message with a module-owned subtype; the existing SHELL_TRIGGER_FIELDS write path re-syncs the original's business evidence. The Verified tag is dropped from any write that does not come through verification."}
      - {id: OPT-B, description: "Give the AI a code tool that writes doc_type directly."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-010]
    locked_consequence: "No AI write tool beyond move/tag; the correction ledger is mail tracking + reason messages on documents.document (no new table); one new provenance field (MINOR bump). Test first that the current bridge does not receive Auto-Sort classification (doc_type is never derived from tags today, document_native.py:35,88-109,177-212)."
  - id: DEC-016
    question: "Which LLM runs Auto-Sort, in which mode, and through what integration?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Superseded: OpenAI gpt-4.1 through Odoo's native provider."}
      - {id: OPT-B, description: "Operator 2026-11-21: DeepSeek deepseek-flash (DeepSeek-V4.1-Flash-1017; 1M context; tool calls, vision and file input supported) through a provider adapter, because Odoo 19 ai hard-codes providers to openai and google (ai/utils/llm_providers.py PROVIDERS; llm_api_service.py:88-98,211-229,524-534). Adapter settings that respect DeepSeek's API: Responses API at https://api.deepseek.com/responses; thinking disabled with reasoning: {effort: 'none'} (the Responses-API control; the Chat Completions thinking.type shape is not used) so temperature applies, tool_choice is unrestricted and no reasoning round-trip is needed; function_call and function_call_output items resent in full each turn (stateless API); strict removed from tool schemas (strict is /beta-only); parallel_tool_calls and store left to DeepSeek defaults (ignored / always false); temperature 0; images as base64 data-URL input_image; documents only by file_id (inline file content and file URLs are not supported for documents); PDFs per DEC-017; no user_id with personal data; HTTP 429 retried with backoff; request timeout raised above Odoo's 30 s default for the synchronous upload path. Key in ir.config_parameter ai.deepseek_key set by the operator on each database, never in the repository."}
      - {id: OPT-C, description: "deepseek-flash in thinking mode (reasoning). Used only if TASK-072 shows non-thinking accuracy below threshold; requires passing reasoning back on every tool turn and forbids tool_choice required."}
      - {id: OPT-D, description: "deepseek-v4-pro: rejected — text only, no vision or file input."}
    selected_option_id: OPT-B
    blocking_task_ids: []
    required_evidence_ids: [EVID-010, EVID-012]
    operator_evidence: "Operator-reported 2026-11-21: deepseek-flash has outperformed GPT-4o in the operator's own usage. This is an operator observation, not an independent benchmark; TASK-072 measures this workload's classification accuracy and no comparative result is claimed until then."
    locked_consequence: "There is no separate DeepSeek document-analysis reasoning model; deepseek-flash is the only DeepSeek model that reads documents or images. Odoo's Responses body (inline input_file file_data, strict tools) is not accepted unchanged, so the adapter is mandatory; its exact request/response contract is UNK-006, settled by TASK-068 against the live API."
  - id: DEC-017
    question: "Where does the DeepSeek adapter live, how are documents sent, and how are external processing and retention controlled?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Modified OPT-A (operator 2026-11-21): a minimal dedicated addon plasticos_documents_ai, isolated from the existing native Documents bridge (plasticos_documents_native keeps the bridge; the addon holds only the provider adapter, the Auto-Sort prompt builders and their tests). auto_install False; installing it sends nothing — AI activation is an explicit administrator action per folder slice. deepseek-flash, non-thinking (reasoning.effort none). Documents: directly extracted PDF text only where it preserves enough information to classify; scanned or layout-dependent PDFs and images go through DeepSeek's Files API with purpose text_recognition (text only) or rich_layout_recognition (text and figures) chosen by the document's needs, always uploaded with expires_after[anchor]=created_at and a bounded expires_after[seconds] (3600-2592000; a value at the low end is the default) and deleted with DELETE /files/{id} after the classification turn; originals stay in Odoo; no unnecessary metadata (no partner names, emails or user identities beyond what classification needs; no user_id with personal data); the key stays in Odoo settings; no secrets or document payloads in logs, chatter tool logs beyond Odoo's own, test fixtures or PR text. The addon's README documents external processing, what is sent, retention and deletion."}
      - {id: OPT-B, description: "Text layer only; scanned PDFs never sent."}
      - {id: OPT-C, description: "Every PDF through the Files API."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-012]
    locked_consequence: "Design and synthetic-data contract tests are authorized. Transmitting live Production customer, supplier or financial documents is NOT authorized: real-document activation waits for an explicit operator external-data-processing approval (GATE-005). DeepSeek retains uploads permanently when expires_after is omitted (files_api.md), and neither originals nor parse results can be downloaded back."
  - id: DEC-018
    question: "Which folder-level Auto-Sort prompts exist, in which order are they activated, and what may each do?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Operator 2026-11-21: the seven-prompt target inventory in AI_PROMPT_INVENTORY.yaml — (1) Inbox master classification and routing, (2) Bills of Lading, (3) Scale Tickets, (4) Loading Pictures, (5) Orders and Shipping Paperwork on the existing Customer Orders folder (no rename), (6) Vendor Bills and financial documents, (7) Compliance and supporting evidence — each with role, allowed actions, exception conditions and tests. The Inbox classifier is activation slice 1; destination-folder prompts are slice 2, carry the add-tags tool only, and are activated per prompt only after loop-safety proof and verified benefit on the TASK-074 evaluation set (GATE-006)."}
      - {id: OPT-B, description: "Activate all seven prompts at once."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-010]
    locked_consequence: "This planning PR writes no final prompt text and activates nothing. AI is limited to classification, tagging and routing; business association, verification, accounting posting and Linda's external communication keep their existing owners."
  - id: DEC-019
    question: "Which requirements govern every Document AI prompt?"
    authority_id: AUTH-001
    status: accepted
    options:
      - {id: OPT-A, description: "Operator 2026-11-21: Document AI Prompt Requirements v2.0 (DOCUMENT_AI_PROMPT_REQUIREMENTS.md) is normative — universal invariants INV-01..INV-07, the shared six-step decision procedure, the P1-P7 specialist specifications, the routing and execution boundaries, and the evaluation targets, mandatory cases, optimization objective and prompt-improvement rule."}
      - {id: OPT-B, description: "Keep the v1.4.0 conservative inventory (Needs Review for missing fields; multi-page To Split stops classification)."}
    selected_option_id: OPT-A
    blocking_task_ids: []
    required_evidence_ids: [EVID-010, EVID-012]
    locked_consequence: "Supersedes the v1.4.0 inventory rows that escalated incomplete, unsigned, expired or multi-page documents: classification escalation (Needs Review, Operations) is reserved for documents with no defensible primary type or materially incompatible primary classifications; evidence problems on an identified document use Evidence Gap and reach the type family's owner; To Split keeps the primary classification. Permissions, company isolation and human-correction precedence are enforced by application logic. Targets are provisional pilot targets: a high automation rate must not mask misrouting. No model-training database, feedback subsystem or learning module is created."
