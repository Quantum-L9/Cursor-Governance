enterprise_ai_evidence:
  ref: EVID-010
  source: "Quantum-L9/odoo-enterprise main @ 3225e0e8 (single import commit; 19.x by API inference). Several enterprise test files there are generated stubs on unknown.model — do not copy them."
  facts:
    - "ai_documents (depends ai, documents, base_automation; auto_install) configures Auto-Sort through documents.document.ai_sort_prompt (Html, group_system, folders only); no enable flag — a prompt creates an ir.actions.server state=ai plus a base.automation on_create_or_write of folder_id (documents_document.py:35-50,267-330)."
    - "Tools: move-in-folder (target must be a folder id embedded in the source prompt) and add-tags (global search by tag name); eligible extra tools include next_activity and documents_account record creation; ai_documents_account's wizard defaults add vendor-bill/customer-invoice creation tools unless ai_tool_ids is passed explicitly."
    - "Triggers: synchronous on create/move into the folder; alias mail sets ai_to_sort and a cron sorts batches of 10; manual cog action. Writes only tool effects plus a chatter log by the AI agent partner; no confidence field; an unsure model calls no tool."
    - "Odoo 19 ai supports only providers openai and google: PROVIDERS is a Python constant (ai/utils/llm_providers.py:16-52); base URLs and keys are hard-wired per provider (llm_api_service.py:88-98,211-229); _request_llm dispatches only openai/google (:524-534). The OpenAI path calls POST /responses with store false, tools marked strict, parallel_tool_calls true, temperature unless a reasoning model, PDFs inline as input_file file_data data-URI and images as input_image (:270-366)."
    - "Invoice learning: posting a digitized bill queues _validate_ocr; a cron posts corrected totals, dates, partner, VAT, currency, bank and line values to the OCR validate endpoint; partner is predicted from previous extracts by layout; lines/accounts/taxes are predicted from the partner's last 100 posted bills. Auto-post counter needs 3 consecutive unmodified bills (partner.autopost_bills=ask); IB refuses _autopost_bill for digitized bills."
    - "Shipping-document Auto-Sort is stateless: no feedback or history storage."

deepseek_evidence:
  ref: EVID-012
  read: "2026-11-21, api-docs.deepseek.com"
  facts:
    - "Models: deepseek-flash (DeepSeek-V4.1-Flash-1017) and deepseek-v4-pro (DeepSeek-V4-Pro-0813), 1M context, 384K max output; deepseek-v4-flash ids route to Flash; deepseek-chat/reasoner were scheduled for discontinuation 2026-07-24."
    - "OpenAI-format base https://api.deepseek.com with /chat/completions and a stateless Responses API (/responses; store always false, previous_response_id unsupported, parallel tool calls always on)."
    - "Tool calls on both models; thinking mode is on by default and, with tools, requires reasoning content passed back each turn and rejects tool_choice required/named; strict tool schemas only on /beta."
    - "Only deepseek-flash accepts images (base64 data URL, URL or file_id) and documents; documents must first be uploaded to /files (purpose text_recognition or rich_layout_recognition, billed per page) and referenced by file_id; uploads cannot be downloaded back. deepseek-v4-pro is text only. No separate document-analysis model."
    - "Concurrency deepseek-flash 2500 per account (429 beyond); peak-hour prices double. Data region and retention are not stated in the API docs."

official_platform_evidence:
  ref: EVID-007
  facts:
    - "spreadsheet.dashboard is community (LGPL-3); module data shape per addons/spreadsheet_dashboard_account/data/dashboards.xml L4-13; per-dashboard group_ids and company_ids record rules (spreadsheet_dashboard/security/security.xml)."
    - "Dashboard data obeys model ACLs and record rules; customizing requires Dashboards/Admin; standard dashboards are reinstalled on upgrade."
    - "Documents AI auto-sort can create invoices/vendor bills and trigger activities; AI tools execute unconditionally unless their code refuses; digitization can auto-post per vendor; IAP credits apply. 19.0 docs contradict on whether AI auto-sort needs the AI app (UNK-004)."
    - "mail.activity activity_schedule never deduplicates; activity_search + reschedule/feedback is the idempotent pattern; done activities are archived."
    - "Owl is the documented approach only for ir.actions.client custom layouts."

