  items:
    - id: N-004
      claim: "plasticos.document.sync sends every association review to Operations Manager"
      verdict: CONFIRMED
      fact: "REVIEW_GROUP_XMLID = group_operations_manager (plasticos_documents_native/models/document_sync.py:23); review scheduled whenever association_state != accepted with no doc_type check (:85-87); assignee = lowest-id eligible member via _manager_reviewer (:147-162), which does not exclude the cron user; todo activity deduped on (res_model, res_id, summary) (:185-213). Same helper holds digitized bills (account_move.py:276)."
      task: TASK-060
    - id: N-005
      claim: "Missing-document and scale-ticket escalations go to Operations Manager"
      verdict: CONFIRMED
      fact: "_escalation_manager_group and _scale_ticket_manager_group return group_operations_manager (plasticos_documents/models/transaction_docs.py:426-431); owner via plasticos_base _plasticos_escalation_manager_in_group (res_users.py:48-59); crons every 6 h with advisory lock; dedupe on pre-loaded (res_id, summary) (:186-195, :536-545)."
      task: TASK-060
    - id: N-006
      claim: "Native classification lumps invoice and vendor bill; evidence tags are more specific"
      verdict: PARTLY_CONFIRMED
      fact: "doc_type 'invoice' = Invoice / Vendor Bill (document_native.py:87-106) and maps to tag INV (document_sync.py:46), also 'Invoice / Vendor Bill'. plasticos.document.tag has BOL, INV, SCALE, PHOTO, PACKING, CO, RECEIVING, CST, DO, CONTRACT, CERT, PERMIT, LAB, CORR, CLAIM_PHOTO, OTHER — no PO, SO, carrier-cert or separate vendor-bill tag (document_tags_data.xml). No AI classification hook in custom code; doc_type is manual."
      task: [TASK-060, DEC-014]
    - id: N-007
      claim: "Linda approval decisions restricted to Operations Manager"
      verdict: CONFIRMED
      fact: "MANAGER_GROUP (linda_approval.py:50); _require_approver refuses Linda and non-managers (:374-378); buttons carry no groups (linda_approval_views.xml:50-53). Safeguards: replay as Linda under _APPROVED_TOKEN (:441-457), stale-conflict check (:513-538), FOR UPDATE (:380-386), pending unique index (:335-338), refusal ledger (:150-195), immutability (:357-371). A pending approval creates no activity. Menu under Logistics (linda_approval_views.xml:103-104). group_operations_manager implies group_logistics_ops (security_groups.xml:88-93,115)."
      task: TASK-061
    - id: N-008
      claim: "AI/automation cannot verify documents"
      verdict: GAP
      fact: "No auto-verify caller exists, but action_verify (plasticos_documents/models/document.py:701-707,1077-1101) admits any group_documents_user; Linda holds group_logistics which implies it (record_rules.xml:225-227, security_groups.xml:68); the cron user holds group_documents_manager (hooks.py:183)."
