      claim: "Native classification lumps invoice and vendor bill; evidence tags are more specific"
      verdict: PARTLY_CONFIRMED
      fact: "doc_type 'invoice' = Invoice / Vendor Bill (document_native.py:87-106) and maps to tag INV (document_sync.py:46), also 'Invoice / Vendor Bill'. plasticos.document.tag has BOL, INV, SCALE, PHOTO, PACKING, CO, RECEIVING, CST, DO, CONTRACT, CERT, PERMIT, LAB, CORR, CLAIM_PHOTO, OTHER — no PO, SO, carrier-cert or separate vendor-bill tag (document_tags_data.xml). No AI classification hook in custom code; doc_type is manual."
