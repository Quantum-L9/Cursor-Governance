    - id: N-007
      claim: "Linda approval decisions restricted to Operations Manager"
      verdict: CONFIRMED
      fact: "MANAGER_GROUP (linda_approval.py:50); _require_approver refuses Linda and non-managers (:374-378); buttons carry no groups (linda_approval_views.xml:50-53). Safeguards: replay as Linda under _APPROVED_TOKEN (:441-457), stale-conflict check (:513-538), FOR UPDATE (:380-386), pending unique index (:335-338), refusal ledger (:150-195), immutability (:357-371). A pending approval creates no activity. Menu under Logistics (linda_approval_views.xml:103-104). group_operations_manager implies group_logistics_ops (security_groups.xml:88-93,115)."
