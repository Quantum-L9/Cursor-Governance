program:
  id: pe-runtime-readiness-hardening
  name: Make Program Execution Runtime-Ready Before Execution
  version: 1.0.0
  owner: Igor Beylin
  definition_status: draft
  snapshot_at: '2026-08-16'
  objective: Make the Cursor governance environment reliably enter Program Execution with
    a truthful runtime readiness state, authoritative Graphiti session and phase-lock identity,
    and state-aware PE preflight so the next PE reaches useful execution without predictable
    bootstrap, revision, lock, schema, or controller-state failures being discovered through
    trial and error.
  problem_statement: The environment runtime is substantially wired, but several remaining
    seams can still allow Program Execution to begin from an invalid or ambiguous state. Runtime
    readiness does not yet fully describe the installed and generated components actually
    in use, PE can proceed from a DEGRADED readiness receipt, PE preflight does not prove
    the required phase lock is held for the active session and state root, and the clean-startup
    integration coverage does not exercise the complete real bootstrap-to-PE runtime path.
    These gaps can defer predictable failures until the first governed mutation instead of
    rejecting or repairing invalid state before execution begins.
  target_state: A fresh Cursor session uses the authoritative shared environment bootstrap,
    emits a runtime readiness receipt that identifies the actual governance, runtime, generated-environment,
    adapter, skill, workspace, session, and memory state in use, and permits mutating PE execution
    only when that receipt is READY. PE preflight verifies the authoritative Graphiti phase
    lock when required and returns the exact next legal operation and required arguments.
    A clean-runtime end-to-end test proves the real startup path can bootstrap, establish
    session and lock state, reconcile the repository, enter PE EXECUTING, and record a schema-valid
    attempt without exploratory failures.
  scope:
    include:
    - environment
    exclude:
    - new repositories
    - force_push
    - admin_merge
    - deploy
    - production migration
  contracts:
    pair: program-execution-system.v2
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
  authority_order:
  - applicable_safety_legal_security_requirements
  - cursor_governance_canonical_law
  - program_execution_interface_contract
  - latest_explicit_operator_instruction
  - accepted_program_definition
  - implementation
  - UNKNOWN
  operating_rules:
  - one_authority_per_responsibility
  - mutable_runtime_state_remains_outside_git
  - no_silent_scope_expansion
  - worker_claim_is_not_verification
  terminal_verdicts:
  - CONVERGED
  - CONVERGED_WITH_NON_BLOCKING_RISKS
  - NOT_CONVERGED
  - INCONCLUSIVE
