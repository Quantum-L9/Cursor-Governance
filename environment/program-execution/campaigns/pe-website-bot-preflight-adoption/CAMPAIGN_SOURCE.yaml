tasks:
- id: TASK-001
  title: Adopt the exact Router patch version
  definition_status: ready
  workstream_id: WS-01
  wave_id: W0
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'Update the manifest and lockfile to pin the exact promoted Router patch version
    (no caret, no latest, no star), run npm ci, and prove the installed dependency with npm
    ls @quantum-l9/llm-router. Run npm run typecheck, npm run llm:wiring, and the relevant
    redesign and intelligence tests. The final invariant is: Website-Bot Router version equals
    SEO-Bot Router version equals the promoted Router patch.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - package.json
  - package-lock.json
  - docs/program-execution/TASK-001.md
  nugget_id: NUG-001
  kernel_profile: BUILD
  consumers:
  - package.json
  - package-lock.json
  - src/pipeline runtime
  entrypoints:
  - package.json
  validation:
  - check: npm ls @quantum-l9/llm-router
    command: npm ls @quantum-l9/llm-router
    evidence: command exit code 0 on the finished tree
  - check: npm run typecheck
    command: npm run typecheck
    evidence: command exit code 0 on the finished tree
  - check: redesign and intelligence unit tests
    command: node --import tsx --test tests/unit/seo-build-intelligence-port.test.ts tests/unit/redesign-content-authority.test.ts
    evidence: command exit code 0 on the finished tree
  actions:
  - Pin the exact promoted Router patch version (1.3.0) in package.json and the lockfile (no
    caret, latest, or star)
  - Run npm ci and prove the installed dependency with npm ls @quantum-l9/llm-router
  - Run typecheck plus the redesign and intelligence unit tests
  acceptance:
  - id: AC-adop-NUG-001
    statement: npm ls @quantum-l9/llm-router proves the installed exact promoted patch and
      typecheck plus the redesign and intelligence tests pass
    required_evidence_types:
    - test_results
    - inspection
  negative_cases:
  - scope_expansion
  - remote_mutation_before_release
  rollback:
    strategy: discard_uncommitted_or_revert_local_commit
    trigger: validation_failure
    validation: worktree_matches_prior_head
