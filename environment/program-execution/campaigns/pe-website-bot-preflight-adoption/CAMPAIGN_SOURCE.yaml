- id: TASK-002
  title: Machine-auth client contract
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'The real intelligence clients instantiate with SEO_BOT_URL and SEO_BOT_API_KEY
    for both Competitive Intelligence and Redesign Content Authority, while SEO-Bot protects
    build-intelligence routes with operator auth. With the SEO-Bot machine-auth contract in
    place, make the client code and its security contract agree: SEO_BOT_API_KEY is the machine
    API credential for Website-Bot to SEO-Bot build-intelligence calls, the operator dashboard
    key is never used by the client, and any misleading HTTP-client comment is corrected so
    code and security contract match. Add or update tests proving the client sends machine
    credentials to build-intelligence routes and fails closed when the key is absent.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/intelligence/SeoBuildIntelligenceHttpClient.ts
  - src/stages/CompetitiveIntelligenceStage.ts
  - src/stages/RedesignContentAuthorityStage.ts
  - tests/unit/seo-build-intelligence-port.test.ts
  - tests/unit/redesign-content-authority.test.ts
  - docs/program-execution/TASK-002.md
  nugget_id: NUG-002
  kernel_profile: BUILD
  consumers:
  - src/intelligence/SeoBuildIntelligenceHttpClient.ts
  - src/stages/CompetitiveIntelligenceStage.ts
  - src/stages/RedesignContentAuthorityStage.ts
  - tests/unit/seo-build-intelligence-port.test.ts
  entrypoints:
  - src/intelligence/SeoBuildIntelligenceHttpClient.ts
  validation:
  - check: npm run typecheck
    command: npm run typecheck
    evidence: command exit code 0 on the finished tree
  - check: machine-auth client tests
    command: node --import tsx --test tests/unit/seo-build-intelligence-port.test.ts tests/unit/redesign-content-authority.test.ts
    evidence: command exit code 0 on the finished tree
  actions:
  - Correct the misleading HTTP-client comment so code and security contract match (SEO_BOT_API_KEY
    is the machine credential for build-intelligence calls; the operator dashboard key is
    never used by the client)
  - Fail closed when SEO_BOT_URL or SEO_BOT_API_KEY is absent instead of sending empty-credential
    requests
  - Add or update tests proving the client sends machine credentials to build-intelligence
    routes and fails closed when the key is absent
  acceptance:
  - id: AC-auth-NUG-002
    statement: the client authenticates with the SEO_BOT_API_KEY machine credential on build-intelligence
      routes, never the operator key, and fails closed when the key is absent
    required_evidence_types:
    - test_results
    - inspection
  negative_cases:
  - scope_expansion
  - remote_mutation_before_release
  rollback:
    strategy: discard_uncommitted_or_revert_local_commit
    trigger: validation_failure
    validation: worktree_matches_prior_head
  risk:
    tier: T0
    reversibility: fully_reversible
    blast_radius: declared_paths
  authorization_ceiling:
    inspect: true
    local_write: true
    commit: true
    push: true
    pull_request: true
    merge: false
    publish_or_release: false
    deploy_or_migrate: false
    destructive_change: false
    external_message: false
  completion_gate_ids:
  - GATE-002
- id: TASK-003
  title: Authenticated REDESIGN preflight
  definition_status: ready
  workstream_id: WS-01
  wave_id: W1
  target_id: TARGET-001
  execution_kind: repo_local
  objective: 'The REDESIGN preflight must call the health route plus the build-intelligence
    preflight route before the expensive pipeline begins, so a missing configuration fails
    in seconds instead of minutes. Verify: network reachable, machine auth works, required
    API capabilities exist (competitive_landscape, seo_content_blueprint, structured_content),
    bot-interop compatible, Router version equals the promoted Router patch, DataForSEO configuration
    present, and LLM configuration present. Map failures to the failure codes SEO_BOT_UNREACHABLE,
    SEO_BOT_AUTH_FAILED, SEO_BOT_CAPABILITY_MISMATCH, and SEO_BOT_ROUTER_VERSION_MISMATCH,
    with fail-closed behavior on any preflight failure. Add tests covering each failure code
    path and the happy path.'
  authority_basis_ids:
  - AUTH-001
  required_decision_ids: []
  blocking_unknown_ids: []
  input_evidence_ids: []
  paths:
  - src/stages/RedesignContentAuthorityStage.ts
  - src/intelligence/SeoBuildIntelligencePort.ts
  - src/intelligence/SeoBuildIntelligenceHttpClient.ts
  - src/pipeline/BuildError.ts
  - tests/unit/seo-build-intelligence-port.test.ts
  - tests/unit/redesign-content-authority.test.ts
  - docs/program-execution/TASK-003.md
  nugget_id: NUG-003
  kernel_profile: BUILD
  consumers:
  - src/stages/RedesignContentAuthorityStage.ts
  - src/intelligence/SeoBuildIntelligencePort.ts
  - src/intelligence/SeoBuildIntelligenceHttpClient.ts
  - src/pipeline/BuildError.ts
  - tests/unit/redesign-content-authority.test.ts
  - tests/unit/seo-build-intelligence-port.test.ts
  entrypoints:
  - src/stages/RedesignContentAuthorityStage.ts
  validation:
  - check: npm run typecheck
    command: npm run typecheck
    evidence: command exit code 0 on the finished tree
  - check: preflight tests
    command: node --import tsx --test tests/unit/seo-build-intelligence-port.test.ts tests/unit/redesign-content-authority.test.ts
    evidence: command exit code 0 on the finished tree
  actions:
  - Add a REDESIGN preflight that calls the SEO-Bot health route and the build-intelligence
    preflight route before the expensive pipeline begins
  - Verify network reachability, machine auth, required API capabilities (competitive_landscape,
    seo_content_blueprint, structured_content), bot-interop compatibility, Router version
    equality with the promoted patch, DataForSEO configuration, and LLM configuration
  - Map failures to SEO_BOT_UNREACHABLE, SEO_BOT_AUTH_FAILED, SEO_BOT_CAPABILITY_MISMATCH,
    and SEO_BOT_ROUTER_VERSION_MISMATCH and fail closed on any preflight failure
  - Add tests covering each failure code path and the happy path
  acceptance:
  - id: AC-pref-NUG-003
    statement: the REDESIGN pipeline runs the authenticated preflight first, every failure
      maps to one of the four SEO_BOT_* codes, and every failure path fails closed with tests
      covering each code and the happy path
    required_evidence_types:
    - test_results
    - inspection
  negative_cases:
  - scope_expansion
  - remote_mutation_before_release
  rollback:
    strategy: discard_uncommitted_or_revert_local_commit
    trigger: validation_failure
    validation: worktree_matches_prior_head
  risk:
    tier: T0
    reversibility: fully_reversible
    blast_radius: declared_paths
  authorization_ceiling:
    inspect: true
    local_write: true
    commit: true
    push: true
    pull_request: true
    merge: false
    publish_or_release: false
    deploy_or_migrate: false
    destructive_change: false
