    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports: [TASK-006]
    contradicts: []

decisions:
  - id: DEC-001
    question: How do derived doc facts stay continuously accurate?
    authority_id: AUTH-002
    status: accepted
    options:
      - id: OPTION-A
        description: SessionStart / hook rewriter of all root docs
      - id: OPTION-B
        description: Deterministic extractor + managed blocks healed by sync_generated_artifacts
      - id: OPTION-C
        description: LLM rewrite of AGENTS.md in CI
    recommended_option_id: OPTION-B
    selected_option_id: OPTION-B
    blocking_task_ids: [TASK-004]
    required_evidence_ids: [EVID-004]
  - id: DEC-002
    question: What happens to existing template community-health copies?
    authority_id: AUTH-003
    status: accepted
    options:
      - id: OPTION-A
        description: Treat copies as a fail and delete them
      - id: OPTION-B
        description: Leave them as sync-ci owned; do not add a second copy path
    recommended_option_id: OPTION-B
    selected_option_id: OPTION-B
    blocking_task_ids: [TASK-005]
    required_evidence_ids: [EVID-003]

unknowns:
  - id: UNK-001
    statement: Exact origin/main SHA at W0 lock is not bound until TASK-001 runs.
    status: open
    owner: AUTH-001
    blocking_task_ids: [TASK-001]
    resolution_method: git fetch origin main && git rev-parse origin/main
    resolution_evidence_ids: [EVID-001]
  - id: UNK-002
    statement: Whether inventory_check.py already has an extension point for new required root files.
    status: open
    owner: AUTH-003
    blocking_task_ids: [TASK-006]
    resolution_method: Read l9-repo-template/scripts/inventory_check.py before editing
    resolution_evidence_ids: [EVID-003]

risks:
  - id: RISK-001
    statement: Auto-heal of fact blocks could rewrite authored prose if delimiters are missing or mismatched.
    tier: T2
    likelihood: possible
    impact: material
    owner: AUTH-002
    mitigations:
      - Renderer writes only between BEGIN/END L9 AGENT-DOC FACTS markers
      - Tests prove prose outside markers is unchanged
    triggers:
      - TASK-004 renderer lands without byte-stability tests
  - id: RISK-002
    statement: Seeding Core-10 as empty files would fail Recursive Leverage no_placeholders.
    tier: T2
    likelihood: possible
    impact: moderate
    owner: AUTH-002
    mitigations:
      - Grounded stubs required (purpose, ownership, sections, Unknown + fill trigger)
    triggers:
      - TASK-002 or TASK-005 creates empty files
  - id: RISK-003
    statement: Pasting CG CANONICAL_LAW.md into the template forks SSOT.
    tier: T1
    likelihood: possible
    impact: material
    owner: AUTH-003
    mitigations:
      - Consumer binding template only; structural test rejects CG SSOT dump
    triggers:
      - TASK-005 writes more than a binding

waivers: []

prohibited_paths:
  - id: DNB-001
    statement: Do not rewrite SessionStart to regenerate the 15-file library.
    rationale: Activation must stay one hook; agentdocs already owns a bounded block.
  - id: DNB-002
    statement: Do not dump CG CANONICAL_LAW.md or ORG_INVARIANTS.yaml into the template.
    rationale: Consumer binding only.
  - id: DNB-003
    statement: Do not delete or rewrite sync-ci community-health files.
    rationale: DEC-002; those files are org-sync owned.
  - id: DNB-004
    statement: Do not clobber formatter-ownership or PE adapter managed blocks.
    rationale: additive_only root protection + generated-block law.
  - id: DNB-005
    statement: Do not land on dirty fix/ci-required-contexts-wip-only.
    rationale: KERNEL pack new-branch default.
  - id: DNB-006
    statement: Do not push or open a PR before L4 authorize-release.
    rationale: CANONICAL_LAW §6.2.
  - id: DNB-007
    statement: Do not let an LLM invent CI/hook/skill counts.
    rationale: Extractor is deterministic; Unknown is required when a fact is missing.

workstreams:
  - id: WS-01
    name: admit_and_lock
    owner: AUTH-001
    objective: Bind tip, intent, and Program Lock on a clean worktree.
  - id: WS-02
    name: skill_ingress
    owner: AUTH-002
    objective: Improve + leverage + wire l9-update-agent-docs create-if-absent contract.
  - id: WS-03
    name: derived_fact_plane
    owner: AUTH-002
    objective: Extractor, managed blocks, sync_generated_artifacts heal/check.
  - id: WS-04
    name: template_seed
    owner: AUTH-003
    objective: Apply library, inventory gate, harden sync_ci fetch.
  - id: WS-05
    name: converge
    owner: AUTH-001
    objective: Dual-repo gates, L4 kernels, authorize-release, PRs, merge.

