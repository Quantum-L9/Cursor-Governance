schema: l9.program-execution.campaign-source.v2
schema_version: 2.0.0

metadata:
  campaign_id: l9-agent-doc-plane
  title: Continuous Agent Doc Plane
  version: 1.0.0
  created_at: "2026-08-15T01:10:00Z"
  status: operator_intake
  owner: Igor Beylin
  intended_host: Quantum-L9/Cursor-Governance
  intended_drop_path: environment/program-execution/campaigns/l9-agent-doc-plane/CAMPAIGN_SOURCE.yaml
  integration_branch: campaign/l9-agent-doc-plane
  runtime_root: $HOME/.l9/programs/l9-agent-doc-plane
  worktree_root: $HOME/.l9/program-worktrees/l9-agent-doc-plane
  source_is_immutable: true
  remote_mutation_during_admission: false
  intent_path: environment/program-execution/campaigns/l9-agent-doc-plane/INTENT.yaml
  intent_resolution_path: environment/program-execution/campaigns/l9-agent-doc-plane/INTENT_RESOLUTION.yaml
  initiation_prompt_path: environment/program-execution/campaigns/l9-agent-doc-plane/AGENT_INITIATION.md
  plan_ref: ~/.cursor/plans/rich_root_agent_docs_557cc65b.plan.md

integrity:
  digest_algorithm: sha256
  canonical_encoding: utf-8
  canonical_line_endings: lf
  digest_record_location: source-integrity-receipt.json
  generated_counts_or_digests_may_be_hand_edited: false

pipeline_contract:
  pair: program-execution-system.v2
  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2
  required_host_surfaces:
    - environment/program-execution/core
    - environment/program-execution/adapters
    - environment/program-execution/conformance
    - environment/program-execution/registry
    - environment/program-execution/integrations
  compilation_sequence:
    - preserve_immutable_campaign_source
    - bind_intent_and_intent_resolution
    - instantiate_native_blueprint_and_controller
    - compile_source_into_complete_native_blueprint
    - collect_and_bind_current_state_evidence
    - validate_blueprint_in_template_mode
    - accept_blueprint_only_after_evidence_and_authority_resolution
    - validate_blueprint_in_instantiated_mode
    - bootstrap_controller_and_create_program_lock
    - admit_and_execute_ready_tasks
    - record_attempt_and_verification_receipts
    - evaluate_evidence_backed_gates
    - export_controller_handoff_receipt
    - obtain_program_owner_terminal_verdict
  authority_boundaries:
    campaign_source_owns: operator_intent_and_campaign_semantics
    intent_owns: goal_level_user_input
    intent_resolution_owns: derived_requirements_and_unknowns
    blueprint_owns: accepted_program_definition
    controller_owns: mutable_runtime_state_and_gate_results
    adapters_own: host_translation_and_execution_receipts
    activation_prompt_owns: launch_mechanics_only

operator_directive:
  objective: >
    Ship create-if-absent root doc library via l9-update-agent-docs, seed
    l9-repo-template, and wire a fail-closed derived-fact plane through
    sync_generated_artifacts so docs stay accurate on make pr.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - reversible_repo_local_work
    - local_commits_under_l4
    - local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - material_scope_expansion
    - stale_or_invalid_program_lock
    - unresolved_blocking_unknown
    - failed_blocking_gate
    - security_or_secret_boundary
    - exact_remote_mutation_approval
  l4:
    begin_on: W0
    mid_execution_push: false
    authorize_release_before: W5
    plan_build_implies_merge: true

program:
  id: l9-agent-doc-plane
  name: Continuous Agent Doc Plane
  version: 1.0.0
  owner: igor_beylin
  definition_status: draft
  snapshot_at: "2026-08-15"
  objective: >
    Single ingress for repo-root agent/product docs; template birth seed;
    continuous derived-fact blocks healed on make pr.
  problem_statement: >
    l9-update-agent-docs v2.0.2 only refreshes the quartet when files exist.
    l9-repo-template is born thin. Derived CI/hook/skill facts go stale until
    a human remembers to run the skill. SessionStart must not become a second
    doc rewriter.
  target_state: >
    Skill creates missing library files with grounded stubs. Template root has
    the 15-file checklist plus README index. Consumer CANONICAL_LAW is a
    binding, not a fork. Fact blocks in those files match extractor JSON and
    fail make pr --check on drift. sync_ci fetch is https+allowlist. Authored
    prose is never auto-rewritten.
  scope:
    include:
      - skills/l9-update-agent-docs pack (SKILL, references, extractor, renderer, tests)
      - Wire skill if version/triggers change
      - sync_generated_artifacts + run_pr_gate heal/check of fact blocks
      - l9-repo-template root library, inventory, sync_ci fetch harden
    exclude:
      - SessionStart rewrite of root docs
      - LLM rewrite of AGENTS.md in CI
      - Forking CG CANONICAL_LAW.md / ORG_INVARIANTS.yaml
      - Deleting sync-ci community-health files
      - Requiring Core-10 on Cursor-Governance itself
      - Promoting WIP plan schema into live l9-plan validators
      - PlasticOS adapter rewrite
  contracts:
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    pair: program-execution-system.v2
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_v2_interface_contract
    - latest_explicit_operator_instruction
    - latest_accepted_program_decision
    - accepted_architecture_and_contracts
    - verified_current_state_evidence
    - approved_task_card
    - repository_local_governance
    - implementation
    - documentation
    - historical_material
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - controller_may_narrow_never_widen
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - no_irreversible_action_without_exact_authority
    - worker_claim_is_not_verification
    - derived_facts_only_in_managed_blocks
    - authored_prose_is_not_generated
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

targets:
  - id: TARGET-001
    name: Cursor-Governance
    kind: git_repository
    authority_owner: Quantum-L9
    execution_mode: repo_local
    repository_id: Quantum-L9/Cursor-Governance
    source_of_truth: Quantum-L9/Cursor-Governance
    environments: [local, ci]
    mutability: reversible
    expected_revision: lock_at_W0
    adapter: git_repo_adapter
    landing: new_branch_from_origin_main
    forbidden_landing: fix/ci-required-contexts-wip-only
  - id: TARGET-002
    name: l9-repo-template
    kind: git_repository
    authority_owner: Quantum-L9
    execution_mode: repo_local
    repository_id: Quantum-L9/l9-repo-template
    source_of_truth: Quantum-L9/l9-repo-template
    environments: [local, ci]
    mutability: reversible
    expected_revision: lock_at_W0
    adapter: git_repo_adapter
  - id: TARGET-003
    name: Program Execution Control Plane
    kind: program_control
    authority_owner: Quantum-L9/Cursor-Governance
    execution_mode: program_control
    repository_id: null
    source_of_truth: environment/program-execution
    environments: [local]
    mutability: controlled
    expected_revision: UNKNOWN
    adapter: controller

authorities:
  - id: AUTH-001
    responsibility: program_ownership_and_terminal_verdict
    owner: Igor Beylin
    authority_type: human_owner
    scope: [whole_program]
    may_delegate: false
    required_evidence: [controller_handoff_receipt]
  - id: AUTH-002
    responsibility: cursor_governance_skill_and_generated_artifacts
    owner: Quantum-L9/Cursor-Governance maintainers
    authority_type: repository_or_domain_owner
    scope: [TARGET-001]
    may_delegate: true
    required_evidence: [repository_governance, make_pr_check]
  - id: AUTH-003
