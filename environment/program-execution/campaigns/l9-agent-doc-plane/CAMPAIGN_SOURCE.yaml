gates:
  - id: GATE-001
    name: campaign_admission_and_authority_lock
    gate_type: entry
    blocking: true
    owner_authority_id: AUTH-001
    task_ids: [TASK-001]
    required_evidence_ids: [EVID-001]
    pass_criteria:
      - Immutable source and intent pair are digest-bound.
      - Clean worktree HEAD equals locked origin/main SHA.
      - L4 phase is executing; remote_allowed is false.
    failure_effect: Block W1+.
  - id: GATE-002
    name: skill_create_if_absent_contract
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-002]
    required_evidence_ids: [EVID-002]
    pass_criteria:
      - Skill creates missing quartet + Core-10 + consumer CANONICAL_LAW.
      - Managed-block and community-health denies are explicit.
    failure_effect: Block W2+.
  - id: GATE-003
    name: leverage_and_wire_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-003]
    required_evidence_ids: [EVID-002]
    pass_criteria:
      - Extra leverage pass is a no-op.
      - Registries match pack version if wired.
    failure_effect: Block W3+.
  - id: GATE-004
    name: derived_fact_plane_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids: [TASK-004]
    required_evidence_ids: [EVID-004]
    pass_criteria:
      - Extractor is deterministic.
      - Heal/check is wired into sync_generated_artifacts.
      - Prose outside markers is unchanged.
    failure_effect: Block W4+.
  - id: GATE-005
    name: template_library_and_inventory_complete
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids: [TASK-005, TASK-006]
    required_evidence_ids: [EVID-003, EVID-005]
    pass_criteria:
      - 15-file checklist present and indexed.
      - Consumer law is a binding.
      - Community-health files unchanged.
      - inventory-check / verify PASS.
      - fetch() allowlist closed.
    failure_effect: Block W5.
  - id: GATE-006
    name: controller_handoff_complete
    gate_type: convergence
    blocking: true
    owner_authority_id: AUTH-001
    task_ids: [TASK-007]
    required_evidence_ids: [EVID-001]
    pass_criteria:
      - Dual-repo gates PASS.
      - L4 release authorized before push.
      - Handoff is evidence-complete.
    failure_effect: Do not claim CONVERGED.

observability:
  program_progress_fields:
    - program
    - current_wave
    - current_task
    - controller_status
    - repository_revisions
    - evidence_added
    - validation_result
    - unknowns_remaining
    - next_ready_task
  evidence_policy:
    append_only: true
    bind_exact_revision: true
    bind_collection_method: true
    distinguish_fact_intent_inference_recommendation_unknown: true

cutover_and_rollback:
  cutover_authority: exact_human_approval_required
  exact_campaign_rollbacks:
    - Revert CG skill/sync_generated_artifacts commits on the feature branch.
    - Revert template seed/inventory/fetch commits; restore community-health only via make sync-ci if touched.
    - No force-push. No admin-merge.

closeout:
  required_handoff_content:
    - campaign_source_digest
    - intent_digest
    - intent_resolution_digest
    - locked_origin_main_sha
    - pull_requests_and_merge_commits
    - remaining_unknowns_risks_and_waivers
    - recommended_terminal_verdict
  controller_may_declare_terminal_verdict: false
  terminal_verdict_authority_id: AUTH-001
