    source_location: Quantum-L9/l9-repo-template
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports: [TASK-005, TASK-006]
    contradicts: []
  - id: EVID-004
    claim: sync_generated_artifacts_is_the_heal_path
    source_type: repository_inspection
    source_location: ops/scripts/sync_generated_artifacts.py
    collection_method: read_only_inspection
    freshness: collect_at_admission
