    source_type: repository_inspection
    source_location: skills/l9-update-agent-docs/SKILL.md
    collection_method: read_only_inspection
    freshness: collect_at_admission
    producer: controller
    supports: [TASK-002]
    contradicts: []
  - id: EVID-003
    claim: template_missing_library_and_has_sync_ci_community_health
