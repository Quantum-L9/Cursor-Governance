tasks:
  - id: TASK-001
    title: Admit campaign and lock current state
    definition_status: ready
    workstream_id: WS-01
    wave_id: W0
    target_id: TARGET-003
    execution_kind: program_control
    objective: >
      Preserve source + intent pair; lock origin/main full SHA on a clean
      worktree; L4 begin; collect EVID-001..005; stop_and_replan on drift.
    authority_basis_ids: [AUTH-001]
    required_decision_ids: []
    blocking_unknown_ids: [UNK-001]
    input_evidence_ids: [EVID-001]
    actions:
      - preserve_campaign_source
      - bind_intent_and_resolution
      - verify_governance_host
      - create_or_reuse_clean_worktree_from_origin_main
      - l4_local_begin
      - collect_repository_baselines
      - materialize_complete_blueprint
    outputs:
      - id: OUT-001
        type: evidence
        location: $HOME/.l9/programs/l9-agent-doc-plane/CURRENT_STATE_DELTA.yaml
        required: true
    acceptance:
      - id: AC-001
        statement: Worktree HEAD equals locked origin/main SHA; intent pair digest-bound; L4 phase=executing.
        required_evidence_types: [inspection, digest]
    validation:
      - id: VAL-001
        method: command
        command_or_inspection: git rev-parse HEAD && python3 ops/autonomy/l4_local.py status
        environment: local
        expected_result: PASS
    negative_cases:
      - landing_on_dirty_primary
      - source_digest_mismatch
      - tip_moved_without_rebind
    rollback:
      strategy: discard_unaccepted_generated_blueprint_and_preserve_source
      trigger: admission_or_lock_failure
      validation: No target repository mutated.
    risk:
      tier: T0
      reversibility: fully_reversible
      blast_radius: program_definition
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: false
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-001]

  - id: TASK-002
    title: Improve l9-update-agent-docs create-if-absent contract
    definition_status: blocked
    workstream_id: WS-02
    wave_id: W1
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >
      Run Improve.md on the skill pack. Add create-if-absent for quartet,
      Core-10, and consumer CANONICAL_LAW. Grounded stubs. Preserve generated
      and PE blocks. Community-health files stay out.
    authority_basis_ids: [AUTH-002]
    required_decision_ids: [DEC-002]
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-002]
    actions:
      - apply_improve_kernel_to_skill_pack
      - add_root_doc_library_reference
      - add_consumer_canonical_law_binding_template
    outputs:
      - id: OUT-002
        type: artifact
        location: skills/l9-update-agent-docs/
        required: true
    acceptance:
      - id: AC-002
        statement: Skill contract creates missing library files and forbids SSOT dump / community-health writes / managed-block clobber.
        required_evidence_types: [inspection]
    validation:
      - id: VAL-002
        method: inspection
        command_or_inspection: grep create-if-absent and managed-block rules in SKILL.md + references/
        environment: local
        expected_result: PASS
    negative_cases:
      - empty_placeholder_files
      - skill_still_requires_files_to_exist
    rollback:
      strategy: revert_skill_pack_commits
      trigger: validation_failure
      validation: Skill pack returns to v2.0.2 contract.
    risk:
      tier: T1
      reversibility: reversible
      blast_radius: single_target
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-002]

  - id: TASK-003
    title: Recursive Leverage and wire skill
    definition_status: blocked
    workstream_id: WS-02
    wave_id: W2
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >
      Run Recursive Leverage until an extra pass adds no material gain.
      Single ingress. Wire via l9-wire-skill-into-repo if version/triggers change.
    authority_basis_ids: [AUTH-002]
    required_decision_ids: []
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-002]
    actions:
      - apply_recursive_leverage_kernel
      - wire_skill_if_version_or_triggers_changed
    outputs:
      - id: OUT-003
        type: artifact
        location: skills/l9-update-agent-docs/ + registries if wired
        required: true
    acceptance:
      - id: AC-003
        statement: Extra leverage pass is a no-op; discovery tables match pack version.
        required_evidence_types: [inspection]
    validation:
      - id: VAL-003
        method: inspection
        command_or_inspection: skill-registry / AUTONOMY_MANIFEST list l9-update-agent-docs
        environment: local
        expected_result: PASS
    negative_cases:
      - duplicate_ingress_for_root_library
      - registry_drift
    rollback:
      strategy: revert_wire_and_leverage_commits
      trigger: validation_failure
      validation: Registries match pre-task state.
    risk:
      tier: T1
      reversibility: reversible
      blast_radius: single_target
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-003]

  - id: TASK-004
    title: Derived-fact extractor and sync_generated_artifacts heal
    definition_status: blocked
    workstream_id: WS-03
    wave_id: W3
    target_id: TARGET-001
    execution_kind: repo_local
    objective: >
      Add extract_doc_facts.py and a renderer that writes only
      BEGIN/END L9 AGENT-DOC FACTS blocks. Wire heal/check into
      sync_generated_artifacts.py and run_pr_gate.sh.
    authority_basis_ids: [AUTH-002]
    required_decision_ids: [DEC-001]
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-004]
    actions:
      - implement_extract_doc_facts
      - implement_render_agent_doc_facts
      - wire_sync_generated_artifacts
      - add_byte_stability_and_drift_tests
    outputs:
      - id: OUT-004
        type: artifact
        location: skills/l9-update-agent-docs/scripts/
        required: true
      - id: OUT-005
        type: artifact
        location: ops/scripts/sync_generated_artifacts.py
        required: true
    acceptance:
      - id: AC-004
        statement: --check fails on fact drift; heal rewrites only the managed block; prose outside markers unchanged.
        required_evidence_types: [test_result]
    validation:
      - id: VAL-004
        method: command
        command_or_inspection: python3 skills/l9-update-agent-docs/scripts/self_test.py
        environment: local
        expected_result: PASS
    negative_cases:
      - renderer_rewrites_authored_prose
      - llm_invents_counts
      - sessionstart_calls_renderer
    rollback:
      strategy: revert_extractor_and_sync_hooks
      trigger: validation_failure
      validation: make pr-check path no longer mentions agent-doc facts.
    risk:
      tier: T2
      reversibility: reversible
      blast_radius: single_target
    authorization_ceiling:
      inspect: true
      local_write: true
      commit: true
      push: false
      pull_request: false
      merge: false
      publish_or_release: false
      deploy_or_migrate: false
      destructive_change: false
      external_message: false
    completion_gate_ids: [GATE-004]

  - id: TASK-005
    title: Apply skill to l9-repo-template library
    definition_status: blocked
    workstream_id: WS-04
    wave_id: W4
    target_id: TARGET-002
    execution_kind: repo_local
    objective: >
      Seed/enrich the 15-file root library and README index. Consumer
      CANONICAL_LAW binding only. Leave community-health files untouched.
    authority_basis_ids: [AUTH-003]
    required_decision_ids: [DEC-002]
    blocking_unknown_ids: []
    input_evidence_ids: [EVID-003]
    actions:
      - apply_l9_update_agent_docs_to_template
      - add_readme_library_index
