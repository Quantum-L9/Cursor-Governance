peer_semantics_policy:
  canonical_source_only: true
  canonical_owner:
    primary: environment/program-execution/core
    routing_and_capabilities: environment/program-execution/registry
    transport_projection: environment/program-execution/adapters
    equivalence_proof: environment/program-execution/conformance
  peer_set:
    discovery: existing_registered_execution_peers
    hard_coded_peer_list: prohibited
  mutation:
    direct_individual_peer_semantic_change: prohibited
    hand_maintained_peer_policy_override: prohibited
    canonical_semantic_change: allowed
    generated_all_peer_projection: allowed
  propagation:
    scope: all_registered_applicable_peers
    activation: atomic_semantic_revision
    missing_peer_result: blocking
    unsupported_capability: explicit_fail_closed
    silently_retaining_previous_semantics: prohibited
  validation:
    canonical_contract: required
    per_peer_projection: required
    all_peer_accounting: required
    normalized_cross_peer_parity: required

