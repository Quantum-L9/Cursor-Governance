waivers: []

prohibited_paths:
  - id: DNB-001
    statement: Do not create any new repository for bounded replanning.
    rationale: Bounded replanning is a Program Execution capability.
  - id: DNB-002
    statement: Do not create a second runtime Controller.
    rationale: Existing Program Execution Controller owns mutable runtime state.
  - id: DNB-003
    statement: Do not create another execution-peer registry.
    rationale: Existing Program Execution registry owns peer discovery and capability truth.
  - id: DNB-004
    statement: Do not implement shared replanning semantics directly in an individual peer.
    rationale: Shared semantic ownership is canonical and centralized.
  - id: DNB-005
    statement: Do not hand-edit one peer to make parity pass.
    rationale: Correct the canonical source or shared projection mechanism and regenerate all affected peers.
  - id: DNB-006
    statement: Do not allow a peer to silently remain on the superseded semantic revision.
    rationale: Unsupported peers must explicitly fail closed.
  - id: DNB-007
    statement: Do not widen authority downstream of Program Lock.
    rationale: Replanning changes execution strategy, not mandate.
  - id: DNB-008
    statement: Do not rewrite completed attempts or receipts.
    rationale: Historical execution evidence is immutable.
  - id: DNB-009
    statement: Do not place mutable runtime state in the repository.
    rationale: Program Execution runtime state remains external.
  - id: DNB-010
    statement: Do not weaken existing Program Execution or peer conformance gates.
    rationale: The new layer must preserve or improve output quality.

