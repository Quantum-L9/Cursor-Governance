decisions:
  - id: DEC-001
    question: What is the maximum authority available to autonomous replanning?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: Current immutable Program Lock.
      - id: B
        description: Dynamically expanded authority derived from the program objective.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002
  - id: DEC-002
    question: Who may activate a material Replan Revision?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: Controller after independent validation.
      - id: B
        description: Worker that proposes the revision.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002
  - id: DEC-003
    question: Where do shared peer replanning semantics live?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: One canonical shared Program Execution source.
      - id: B
        description: Independently inside each execution peer.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002
  - id: DEC-004
    question: How is a shared semantic revision promoted?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: >-
          Every registered peer is accounted for under the same revision before
          activation.
      - id: B
        description: Individual peers upgrade independently.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002
  - id: DEC-005
    question: How is cross-peer equivalence proven?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: Shared host-neutral semantic vectors.
      - id: B
        description: Generated-source identity alone.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002
  - id: DEC-006
    question: What state model supports long autonomous chains?
    authority_id: AUTH-005
    status: accepted
    options:
      - id: A
        description: Durable typed state and freshly rendered attempt contracts.
      - id: B
        description: Accumulated conversational history.
    recommended_option_id: A
    selected_option_id: A
    blocking_task_ids: []
    required_evidence_ids:
      - EVID-002

