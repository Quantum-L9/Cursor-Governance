gates:
  - id: GATE-001
    name: bounded_replanning_admission
    gate_type: entry
    blocking: true
    owner_authority_id: AUTH-001
    task_ids:
      - TASK-001
    required_evidence_ids:
      - EVID-001
      - EVID-002
      - EVID-003
      - EVID-004
      - EVID-005
    pass_criteria:
      - Cursor-Governance revision is exact.
      - ADR-0011 through ADR-0016 are present and accepted.
      - Program Execution extension seams are known.
      - Registered peer set is known.
      - Existing conformance baseline is known.
      - Native Blueprint validates before implementation.
    failure_effect: block_implementation
  - id: GATE-002
    name: canonical_replan_contract
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids:
      - TASK-002
    required_evidence_ids:
      - EVID-002
      - EVID-006
    pass_criteria:
      - program-execution.replan.v1 is machine-readable.
      - Every revision is bound to Program Lock and previous plan revision.
      - Authority containment is machine-enforced.
      - Historical receipts are immutable.
      - Hostile authority-widening fixtures fail.
    failure_effect: block_runtime_and_peer_projection
  - id: GATE-003
    name: controller_replan_lifecycle
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-002
    task_ids:
      - TASK-003
    required_evidence_ids:
      - EVID-006
      - EVID-008
    pass_criteria:
      - Verified evidence can trigger a revision.
      - Material revision receives independent verification.
      - Controller alone activates revisions.
      - Failed or stale revisions preserve the previous plan.
      - Durable state supports deterministic resume.
    failure_effect: block_integrated_replanning
  - id: GATE-004
    name: all_peer_semantic_revision
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-003
    task_ids:
      - TASK-004
    required_evidence_ids:
      - EVID-004
      - EVID-007
    pass_criteria:
      - Existing registry identifies every applicable peer.
      - One canonical revision governs every peer.
      - No individual peer owns replanning semantics.
      - Unsupported peers fail closed explicitly.
      - Partial semantic activation is impossible.
    failure_effect: block_peer_parity_promotion
  - id: GATE-005
    name: bounded_replanning_and_peer_parity
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-004
    task_ids:
      - TASK-005
      - TASK-006
    required_evidence_ids:
      - EVID-006
      - EVID-007
      - EVID-008
    pass_criteria:
      - Recoverable verified runtime discovery can be replanned autonomously.
      - No authority widening occurs.
      - Golden semantic vectors pass on every applicable peer.
      - Every registered peer is accounted for.
      - Typed-state resume is deterministic.
      - Context projection preserves current authority.
      - Program Execution conformance passes.
      - Peer execution conformance passes.
    failure_effect: block_handoff_as_success
  - id: GATE-006
    name: bounded_replanning_handoff
    gate_type: completion
    blocking: true
    owner_authority_id: AUTH-001
    task_ids:
      - TASK-007
    required_evidence_ids:
      - EVID-006
      - EVID-007
      - EVID-008
    pass_criteria:
      - Controller Handoff Receipt validates.
      - Exact revisions are recorded.
      - All peers and parity results are recorded.
      - Failed revisions remain visible.
      - Remaining Unknowns risks and waivers are explicit.
      - Controller recommends but does not declare convergence.
    failure_effect: program_remains_INCONCLUSIVE

retry_policy:
  max_attempts: 2
  retryable:
    - worker_timeout
    - worker_crash
    - temporary_file_lock
    - transient_test_infrastructure
    - temporary_adapter_failure
    - temporary_peer_probe_failure
  non_retryable:
    - deterministic_test_failure
    - authority_containment_failure
    - scope_violation
    - peer_semantic_mismatch
    - direct_peer_semantic_override
    - stale_program_lock
    - stale_plan_revision
    - secret_access_attempt
    - forbidden_command
  preserve_every_attempt: true
  require_new_source_contract_when:
    - accepted_objective_changes
    - materially_authorized_target_set_changes
    - accepted_architecture_changes
    - authorization_ceiling_changes
    - risk_acceptance_changes
    - mandatory_convergence_gate_changes
  allow_replan_revision_without_new_source_when:
    - reversible_implementation_strategy_changes
    - future_task_split_preserves_parent_authority
    - future_dependency_graph_changes_due_to_verified_evidence
    - additional_diagnostics_are_required
    - additional_verification_is_required
    - scoped_runtime_unknown_is_created
    - scoped_runtime_unknown_is_resolved_from_evidence

