operator_directive:
  objective: >-
    Extend the existing Cursor-Governance Program Execution subsystem with the
    bounded replanning architecture accepted in ADR-0011 through ADR-0016.

    A verified runtime discovery may change HOW future authorized work is
    executed without changing WHAT the accepted program authorizes.
    The implementation MUST use one canonical shared semantic implementation
    and MUST apply to every registered execution peer through the existing
    registry, adapter, and conformance architecture.
    Direct semantic changes to an individual peer are prohibited.
  mode: controlled_autonomous_until_material_boundary
  auto_continue:
    - read_only_inspection
    - blueprint_materialization
    - evidence_collection
    - evidence_determined_unknown_resolution
    - reversible_cursor_governance_repo_local_work
    - deterministic_local_validation
    - independent_verification
    - bounded_retry_of_transient_failures
    - bounded_future_plan_adaptation
    - canonical_peer_projection_generation
    - regeneration_of_all_applicable_peer_projections
    - all_peer_semantic_conformance
    - unrelated_ready_work_when_one_subgraph_is_blocked
  pause_only_for:
    - missing_or_conflicting_semantic_authority
    - missing_or_unaccepted_governing_adr
    - material_scope_expansion
    - stale_or_invalid_program_lock
    - authority_bearing_unknown
    - authorization_ceiling_expansion
    - accepted_architecture_change
    - public_contract_change
    - material_target_set_change
    - risk_acceptance_change
    - mandatory_convergence_gate_change
    - failed_blocking_gate
    - security_or_secret_boundary
    - direct_peer_semantic_override_required
    - exact_remote_mutation_approval
    - exact_merge_tag_release_publish_deploy_or_migration_approval
    - exact_destructive_action_approval

program:
  id: bounded-replanning-v1
  name: Program Execution Bounded Replanning Layer
  version: 1.0.0
  owner: "Igor Beylin"
  definition_status: draft
  snapshot_at: "2026-08-11"
  objective: >-
    Add evidence-triggered bounded replanning to the existing Program Execution
    subsystem so long autonomous chains can adapt future work inside the
    immutable Program Lock while maintaining or improving authority integrity,
    independent verification, deterministic recovery, and cross-peer parity.
  problem_statement: >-
    A sufficiently long execution program encounters verified facts that were
    unavailable when the original task graph was produced. Today such
    discoveries can require premature human intervention even when the required
    response is reversible and already inside accepted authority.

    Allowing a worker to rewrite its program freely would solve the continuity
    problem by creating a more serious authority problem.
    The second failure mode is semantic peer drift. Implementing bounded
    replanning separately in Cursor, Claude Code, Codex, Gemini, Manus, or
    another execution peer would produce multiple governance brains.
  target_state: >-
    Program Execution owns a canonical program-execution.replan.v1 contract.

    Verified evidence may produce a digest-bound Replan Revision against the
    current Program Lock and current plan revision.
    An independently validated revision may alter future reversible execution
    strategy, split work, recompute future dependencies, add diagnostics,
    introduce scoped Unknowns, or resolve Unknowns from evidence.
    It cannot autonomously change program objective, accepted architecture,
    public contracts, ownership, materially authorized target set,
    authorization ceiling, accepted risk, mandatory convergence gates, or
    historical evidence.
    The Controller alone activates accepted Replan Revisions.
    Shared semantics have one canonical source and are projected through the
    existing adapter topology to every registered execution peer.
    A semantic revision is not eligible for promotion until every registered
    applicable peer is accounted for by the cross-peer parity gate.
    Long execution chains reconstruct current authority from durable typed
    state rather than accumulated conversation history.
  scope:
    include:
      - environment/program-execution/core
      - environment/program-execution/adapters
      - environment/program-execution/conformance
      - environment/program-execution/registry
      - environment/program-execution/integrations
      - Program Lock authority containment
      - Replan Revision schema and lifecycle
      - plan revision identity
      - evidence-trigger classification
      - independent replan verification
      - bounded future-plan adaptation
      - scoped runtime Unknowns
      - immutable historical receipts
      - typed runtime state
      - deterministic resume
      - fresh per-attempt context projection
      - canonical peer semantic revisions
      - all-peer projection through existing adapters
      - golden semantic vectors
      - cross-peer semantic parity
      - explicit unsupported-peer fail-closed behavior
      - existing Program Execution documentation affected by these semantics
    exclude:
      - new repositories
      - separate replanning services
      - separate peer registries
      - separate runtime controllers
      - goal-level Intent Compiler implementation
      - program-execution.intent.v1 implementation
      - unrelated Cursor-Governance refactors
      - direct hand-editing of peer-specific semantic policy
      - autonomous public contract changes
      - autonomous architecture changes
      - autonomous permission expansion
      - remote repository mutation
      - merge
      - release
      - publish
      - deploy
      - production migration
      - destructive operations
  contracts:
    pair: program-execution-system.v2
    blueprint: program-execution-blueprint.v2
    controller_minimum: program-execution-controller.v2
    new_replan_contract: program-execution.replan.v1
  governing_decision_ids:
    - ADR-0011
    - ADR-0012
    - ADR-0013
    - ADR-0014
    - ADR-0015
    - ADR-0016
  authority_order:
    - applicable_safety_legal_security_requirements
    - cursor_governance_canonical_law
    - program_execution_interface_contract
    - accepted_architecture_decision_records
    - latest_explicit_operator_instruction
    - latest_accepted_program_decision
    - accepted_architecture_and_contracts
    - verified_current_state_evidence
    - approved_task_card
    - exact_rendered_source_contract
    - repository_local_governance
    - implementation
    - documentation
    - historical_material
    - UNKNOWN
  operating_rules:
    - one_authority_per_responsibility
    - program_lock_is_maximum_runtime_planning_authority
    - controller_may_narrow_never_widen
    - replan_changes_future_execution_not_locked_authority
    - completed_execution_history_is_immutable
    - material_replan_requires_verified_trigger_evidence
    - material_replan_requires_independent_validation
    - controller_alone_activates_replan_revision
    - failed_replan_preserves_previous_valid_plan
    - unknown_blocks_only_named_dependencies
    - promotion_requires_evidence_backed_gates
    - no_silent_scope_expansion
    - worker_claim_is_not_verification
    - shared_semantics_have_one_canonical_owner
    - direct_peer_semantic_changes_are_prohibited
    - every_registered_peer_participates_in_shared_semantic_revision
    - unsupported_peer_fails_closed_explicitly
    - partial_semantic_revision_activation_is_prohibited
    - peer_equivalence_is_semantic_not_textual
    - durable_typed_state_is_execution_authority
    - conversational_history_is_not_execution_authority
    - mutable_runtime_state_remains_outside_git
  terminal_verdicts:
    - CONVERGED
    - CONVERGED_WITH_NON_BLOCKING_RISKS
    - NOT_CONVERGED
    - INCONCLUSIVE

