  blueprint: program-execution-blueprint.v2
  controller: program-execution-controller.v2

  required_host_surfaces:
    - docs/decisions
    - skills/l9-architecture-decision-records
    - environment/program-execution
    - environment/program-execution/core
    - environment/program-execution/campaigns
    - existing repository validation / CI surfaces

  compilation_sequence:
    - preserve_immutable_campaign_source
    - bind_exact_cursor_governance_revision
    - inventory_every_adr_filename_heading_and_reference
    - prove_current_collision_set
    - validate_proposed_identity_migration
    - instantiate_native_blueprint_and_controller
    - validate_blueprint
    - create_program_lock
    - perform_git_aware_adr_renames
    - rewrite_references_semantically
    - harden_machine_adr_references
    - add_permanent_uniqueness_validation
