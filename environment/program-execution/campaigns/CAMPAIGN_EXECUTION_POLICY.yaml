# Campaign execution landing policy (operator overlay).
# Does not mutate immutable CAMPAIGN_SOURCE.yaml files.
# SSOT companion: ops/autonomy/surface_profile.yaml → campaign_execution
schema: l9.program-execution.campaign-execution-policy.v1
schema_version: 1.0.0
updated: "2026-08-16"
closeout:
  required: true
  last_step: true
  live_ledger: CAMPAIGN_STATUS.yaml
  pec_command: pec close
  in_repo_command: python3 environment/program-execution/campaigns/scripts/close_campaign.py close
  next_campaign: first execute_order whose lifecycle is not complete or cancelled
  leaving_in_progress_after_merge_or_converged: defect

publish:
  required_command: PR_REMEDIATE=0 make pr
  require_makefile_checkers: true
  raw_gh_pr_create: forbidden
  # Campaigns publish via make pr and MUST end green + merge-ready.
  # They do not merge. Invoking /l9-pr-remediation authorizes merge of
  # every open PR in the target repo after Converge.
  remediate: true
  remediate_max_cycles: 5
  halt_before_merge: true
  merge: false
  remediations:
    skill: l9-pr-remediation
    merge: authorized_on_skill_invocation
    scope: all_open_prs_in_target_repo
  open_pr_against_main: false
  mix_with_other_feature_branches: false

# Stacked-PR policy: when a PR is already open for the workstream, the next PR
# bases on the open PR's head. Bottom-up merge order; rebase and conflict
# resolution are forbidden — disjoint scopes keep the stack mergeable.
# One feature branch off main per program; exclusive worktree lease per agent.
pr_stacking:
  enabled: true
  first_pr_base: pr_base
  subsequent_pr_base: open_pr_head
  merge_order: bottom_up
  rebase: false
  conflict_resolution: false
  one_feature_branch_per_program: true
  exclusive_worktree_lease: true
  helper: ops/scripts/stack_pr.py

pr_copy:
  title_template: "[{campaign_id}] {metadata.title}"
  body_required:
    - campaign_id
    - metadata.title
    - program.objective
    - pr_base
  reject_if_title_is_branch_default: true
  reject_if_title_collides_with_other_open_campaign_pr: true

campaigns:
  - id: bounded-replanning-v1
    integration_branch: campaign/bounded-replanning-v1
    pr_base: campaign/bounded-replanning-v1
    execute_order: 1
    lane: pe_host
  - id: cc-pe-intent-compiler-v1
    integration_branch: campaign/cc-pe-intent-compiler-v1
    pr_base: campaign/cc-pe-intent-compiler-v1
    execute_order: 2
    lane: compiler
    role: build
  - id: l9-devpack-program-execution-hardening
    integration_branch: campaign/l9-devpack-program-execution-hardening
    pr_base: campaign/l9-devpack-program-execution-hardening
    execute_order: 3
    lane: compiler
    role: harden
    depends_on:
      - cc-pe-intent-compiler-v1
  - id: l9-ecosystem-fix-plan
    integration_branch: campaign/l9-ecosystem-fix-plan
    pr_base: campaign/l9-ecosystem-fix-plan
    execute_order: 4
    lane: ecosystem
    parallel_with:
      - bounded-replanning-v1
      - l9-devpack-program-execution-hardening
      - cc-pe-intent-compiler-v1
  - id: adr-identity-integrity-v1
    integration_branch: campaign/adr-identity-integrity-v1
    pr_base: campaign/adr-identity-integrity-v1
    execute_order: 5
    lane: governance_integrity
  - id: session-runtime-hydration-convergence-v1
    integration_branch: campaign/session-runtime-hydration-convergence-v1
    pr_base: campaign/session-runtime-hydration-convergence-v1
    execute_order: 6
    lane: session_runtime
    parallel_with:
      - l9-ecosystem-fix-plan

owner:
  authority_id: AUTH-001
  terminal_verdict: CONVERGED
  declared_at: "2026-08-14T21:28:53Z"
  authorization_ceiling:
    commit: true
    push: true
    pull_request: true
    merge: false
