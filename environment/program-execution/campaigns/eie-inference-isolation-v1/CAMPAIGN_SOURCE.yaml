  name: eie inference isolation v1
  version: 1.0.0
  owner: Igor Beylin
  definition_status: ready
  plan_status: ConditionallyReady
  snapshot_at: '2026-08-21'
  objective: a Wave-0/Wave-2 isolation campaign on Quantum-L9/Enrichment.Inference.Engine
    that restores deterministic RuleEngine inference and tenant-authoritative idempotency/persistence,
    then stops before outbox, catalog, surface quarantine, and release closure.
  problem_statement: "# EIE inference isolation v1\n\nowner: Igor Beylin\ntarget_repo: Quantum-L9/Enrichment.Inference.Engine\n\
    \nThis memo is the live PE front-door INTENT for\n`Quantum-L9/Enrichment.Inference.Engine`.\n\
    Filename slug is the campaign id: `eie-inference-isolation-v1`.\n\nImmutable baseline:\
    \ `7c4ce2596ca511de32dafe642ef4cc6ee1b21b6d` (`main`).\nNew work lands on `campaign/eie-inference-isolation-v1`\
    \ from `origin/main`.\n`autonomous_merge` stays false.\n\nCorpus authority (do not re-open\
    \ architecture discovery):\n\n- Later Green wins. Greens 35–50 are the terminal architecture.\n\
    - This campaign is Wave 0 plus Wave 2 isolation only: Green 6, then 45, then 35, then\
    \ 40.\n- Greens 30–34 are invariants here (no new Neo4j, Redis/NATS bus, or direct-peer\
    \ work). Their mutations are the next campaign.\n- Do not implement superseded early greens\
    \ (File 3 G1/G2 text, File 4 G11/G13/G24) as if they were current.\n\n## Final architectural\
    \ judgment\n\nIt is:\na Wave-0/Wave-2 isolation campaign on Quantum-L9/Enrichment.Inference.Engine\
    \ that restores deterministic RuleEngine inference and tenant-authoritative idempotency/persistence,\
    \ then stops before outbox, catalog, surface quarantine, and release closure.\n\n## Do\
    \ not build\n\n- Greens 30–34, 36–39, 41–50\n- PlasticOS rewrite to v2 / `derived_from`\n\
    - Delete `inference_bridge_v2`\n- SideEffectCoordinator / transactional outbox (Green\
    \ 36)\n- Canonical action-catalog rewrite (Green 38)\n- GRAPH durable inbox (Green 39)\n\
    - Enrich-path collapse (Green 42)\n- Direct HTTP `/api/v1/*` tenant invention (File 2\
    \ Wave 6 is disposition-only)\n- Deprecated `chassis/router.py` / `chassis/registry.py`\
    \ production dispatch\n- `make prod`, `make deploy`, production `alembic upgrade`, force-push,\
    \ merge\n\n1. Release A — Deterministic RuleEngine inference\n\nRestore the PlasticOS\
    \ `inference_rules` contract through RuleEngine so ConvergenceController receives real\
    \ derived fields and per-field confidence. Do not convert PlasticOS to v2 in this wave.\n\
    \nLocked path:\n\n```text\ndomains/*/spec.yaml\n  → inference_rules\n  → RuleDefinition\n\
    \  → RuleRegistry\n  → rule_engine.infer()\n  → InferenceBridge result\n  → ConvergenceController\n\
    ```\n\nFiles:\n\n- `app/main.py` (T4)\n- `app/engines/handlers.py` (T4)\n- `app/engines/inference/rule_loader.py`\n\
    - `app/engines/inference/rule_engine.py`\n- `app/engines/inference_bridge_adapter.py`\n\
    - `tests/test_rule_engine.py`\n- `tests/test_rule_loader.py`\n- `tests/test_inference_wiring.py`\
    \ (create)\n- `domains/plasticos/spec.yaml` (read-only fixture)\n\nRequired mutations:\n\
    \n1. In `app/main.py`, instantiate `app.engines.domain_yaml_reader.DomainYamlReader` against\
    \ `settings.domains_dir` and pass it into `register_orchestration(..., domain_reader=...)`.\
    \ Startup currently omits that dependency. Preserve C-13/C-21: `/v1/execute` stays SDK-owned;\
    \ do not route production ingress through deprecated chassis dispatch.\n\n2. In `handlers._load_domain_convergence_context()`,\
    \ after `config = _domain_reader.load(domain_id)`, read `config.raw_spec[\"inference_rules\"\
    ]` when it is a list. Keep `inference_rules_path` only as compatibility fallback. Remove\
    \ the magic `\"Partner\"` default. If no node label is supplied and the domain contains\
    \ exactly one node schema, use that node; if several exist, treat the node choice as ambiguous.\n\
    \n3. In `rule_loader.py`, keep `load_rules(path)` and factor Pydantic validation/registry-building\
    \ into `load_rules_data(list[dict]) -> RuleRegistry`. File load and InferenceBridge share\
    \ one validation path. Do not write a temporary YAML file.\n\n4. Make InferenceBridge\
    \ use RuleEngine as the production backend when canonical `inference_rules` are present.\
    \ If only a valid v2 domain graph is present, keep the v2 compatibility path. Preserve\
    \ the ConvergenceController result shape:\n\n   - `derived_fields`\n   - `confidence_map`\n\
    \   - `rules_fired`\n   - `rules_skipped`\n   - `rule_trace`\n   - `unlock_map`\n   -\
    \ `blocked_fields`\n\n   For this repair, `unlock_map` stays empty. Do not invent search-unlock\
    \ mathematics.\n\n5. Add `confidence_map: dict[str, float]` to `rule_engine.InferenceResult`\
    \ from each winning rule confidence (`best_output`). The engine already tracks that internally\
    \ and currently emits only aggregate `inference_confidence`.\n\nLocked PlasticOS integration\
    \ proof (real `domains/plasticos/spec.yaml`, not mocks alone):\n\n```text\npolymer_types\
    \ = [HDPE]\ncontamination_tolerance = 0.02\n  → material_grade = A\n  → confidence = 0.92\n\
    \nmaterial_grade = A\nannual_capacity_mt = 6000\n  → facility_tier = tier_1\n```\n\nModernize\
    \ the existing RuleEngine and RuleLoader tests to the current APIs (registry, not a bare\
    \ list). Quarantine fingerprints for those tests are removed only after the tests pass\
    \ in the same PR. Do not pre-delete ledger entries.\n\nOut of this release: field-classifier\
    \ list-node drift, MetaPromptPlanner DomainSpec mismatch, v2/DAG retirement.\n\n2. Release\
    \ B — One Alembic lineage\n\nMake EIE have one configured migration tree, one valid revision\
    \ lineage, and one head. Green 45 supersedes File 3 Green 3.\n\nFiles:\n\n- `alembic.ini`\
    \ (`script_location = migrations`)\n- `migrations/versions/001_initial_schema.py` (active\
    \ head predecessor)\n- `alembic/versions/0002_perplexity_api_key_default.py` (orphan;\
    \ do not import)\n- new revision after `001` in `migrations/versions/` only when Release\
    \ C needs a schema change\n\nRequired mutations:\n\n- Treat `migrations/` as the only\
    \ canonical tree.\n- Do not copy the orphan `alembic/versions/0002_perplexity_api_key_default.py`\
    \ into the active chain. It references `down_revision=\"0001\"` and mutates `config_snapshots`,\
    \ which is not part of the current four-table SQLAlchemy model.\n- Any tenant uniqueness\
    \ change from Release C lands as the next revision after `001` in `migrations/versions/`.\n\
    - Prove empty PostgreSQL → migrate to head → application schema works before calling the\
    \ lineage repaired.\n\n3. Release C — Tenant Redis and Postgres idempotency\n\nMake idempotency\
    \ tenant-scoped, collision-safe, and atomic. Green 35 plus File 2 waves 1–2. Trusted tenant\
    \ originates from the SDK handler `tenant` argument. It must not come from `payload[\"\
    tenant\"]`, `payload[\"tenant_id\"]`, `EnrichRequest`, entity contents, forwarded headers,\
    \ or `\"default\"`.\n\nFiles:\n\n- `app/engines/enrichment_orchestrator.py`\n- `app/engines/handlers.py`\n\
    - `app/services/idempotency.py`\n- `app/services/pg_store.py`\n- `app/services/pg_models.py`\n\
    - new Alembic revision after `001` (depends on Release B)\n\nRequired mutations:\n\n-\
    \ Carry handler `tenant` through `handle_enrich` / `handle_enrichbatch` into `enrich_entity(...)`.\
    \ Today `handle_enrich` receives tenant and drops it; `enrich_entity` then caches on `request.idempotency_key`\
    \ alone. Identity is three-dimensional: tenant, action, idempotency_key.\n- Change Redis\
    \ APIs from `get(key)` / `set(key, response)` to tenant + key + request fingerprint. Namespace:\n\
    \n  ```text\n  enrich:idem:v2:<sha256(tenant_id + \"\\0\" + idempotency_key)>\n  ```\n\
    \n  Do not place raw tenant IDs or raw idempotency keys in Redis key names or INFO logs.\n\
    - Store a versioned cache object with `version: 2`, `request_fingerprint`, and `response`.\n\
    - Fingerprint canonical JSON of the semantic request (action, object type, entity, target\
    \ schema, objective, KB context, consensus threshold, max variations, and any field that\
    \ changes computation). Exclude transport timestamps, execution ID, the idempotency key\
    \ itself, and logging metadata.\n- Same tenant + same key + same fingerprint → original\
    \ canonical result.\n- Same tenant + same key + different fingerprint → explicit idempotency\
    \ conflict; never replay the old result.\n- Different tenant + same key → independent\
    \ execution.\n- Do not fallback-read the old global Redis key. TTL 86,400 seconds; legacy\
    \ keys age out.\n- Replace global DB uniqueness with `UNIQUE (tenant_id, idempotency_key)`\
    \ named `uq_enrichment_results_tenant_idempotency`.\n- `get_enrichment_result_by_idempotency_key`\
    \ must query both columns. `save_enrichment_result` already receives `tenant_id`; use\
    \ it on the idempotent pre-read.\n\nAdversarial proof required:\n\n```text\ntenant-a +\
    \ enrich + key-123 → response A\ntenant-b + enrich + key-123 → response B\nA never replays\
    \ B; B never replays A\n```\n\n4. Release D — ResultStore and approval tenant predicates\n\
    \nA tenant-owned UUID is only an identifier. It is never authorization. File 2 waves 3–4.\n\
    \nFiles:\n\n- `app/services/result_store.py`\n- `app/services/pg_store.py`\n\nRequired\
    \ mutations:\n\n- `ResultStore.get_result`, checkpoint, completion, and convergence-run\
    \ lookup must predicate `id = requested_uuid AND tenant_id = store.tenant_id`. Follow\
    \ the existing pattern in `get_latest_enrichment_for_entity()` and `list_active_convergence_runs()`.\n\
    - `approve_schema_proposal` must become `approve_schema_proposal(tenant_id, proposal_id,\
    \ reviewed_by, approved)` and update only when both tenant and UUID match.\n- Prove: proposal\
    \ belongs to tenant-b; tenant-a attempts approval with the correct UUID → zero rows changed\
    \ / not found; no leak of tenant-b data.\n\n5. Release E — Transport tenant is authoritative\n\
    \nReverse payload-over-transport tenant selection. Green 40 plus File 2 wave 5.\n\nFiles:\n\
    \n- `app/engines/handlers.py` (T4)\n- `app/services/chassis_handlers.py` (T4)\n\nRequired\
    \ mutations:\n\n- Today `handle_community_export` and `handle_schema_proposal` (and chassis\
    \ supplemental handlers) do `tenant_id = payload.get(\"tenant_id\") or tenant`. That relationship\
    \ reverses.\n- Transport tenant is authoritative. If a legacy payload includes `tenant_id`\
    \ and it equals the transport tenant, accept. If it differs, reject. Payload never overrides\
    \ transport.\n- Invert `test_tenant_override()`: it currently expects payload `\"override\"\
    ` to win over handler `\"default\"`. Replace with a mismatch-rejection test.\n\nHTTP `/api/v1/*`\
    \ remains disposition-only. `verify_api_key()` plus a single `api_key_hash` cannot establish\
    \ a trustworthy tenant. Do not add a fake tenant parameter to `/api/v1/enrich`, `/fields`,\
    \ or `/discover` and call that security.\n\n## Validation\n\nAfter each mutating release:\
    \ targeted pytest for the files above, then `make agent-check` (EIE 7-gate pre-commit).\
    \ Name `make pr-check` when a governed overlay exposes it; do not invent that target in\
    \ this campaign. Coverage stays at or above 60 percent. Quarantine shrink happens only\
    \ after the proven tests pass.\n\nC-13 lockstep applies when T4 files change: `app/main.py`,\
    \ `app/api/v1/chassis_endpoint.py`, `app/services/chassis_handlers.py`, `app/engines/orchestration_layer.py`,\
    \ `app/engines/handlers.py`, `app/engines/graph_sync_client.py` stay aligned. C-21 remains:\
    \ `/v1/execute` is owned by the SDK transport runtime.\n\n## Execute\n\n```bash\nmake\
    \ -C \"$HOME/.cursor-governance\" campaign \\\n  INTENT=\"/Users/ib-mac/Enrichment.Inference.Engine/.cursor-commands/WIP/PE\
    \ EIE/eie-inference-isolation-v1.md\"\n```\n\nThat is the only live PE front door. Do\
    \ not call pec, `compile_campaign_source.py`, or `program-execution intent` as a substitute."
