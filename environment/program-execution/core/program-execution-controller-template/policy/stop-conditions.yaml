schema: program-execution-controller.stop-policy.v2
schema_version: 2.0.0
stop_when:
- blueprint_contract_or_digest_mismatch
- unresolved_required_decision
- unresolved_blocking_unknown
- unresolved_authority_conflict
- repository_dirty_or_head_changed
- task_crosses_multiple_targets_without_decomposition
- writable_scope_missing_or_unsafe
- source_contract_widens_blueprint_ceiling
- validation_obligation_missing
- lease_conflict_or_expiry
- required_approval_missing_expired_or_scope_mismatched
- ledger_integrity_failure
- worker_receipt_binding_failure
- worker_changed_files_disagree_with_observed_state
- recovery_evidence_cannot_be_preserved
