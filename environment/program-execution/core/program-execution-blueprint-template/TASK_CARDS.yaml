schema: program-execution-blueprint.task-cards.v2
schema_version: 2.0.0
tasks:
- id: TASK-001
  title: Refresh and lock current state
  definition_status: ready
  workstream_id: WS-01
  wave_id: W0
  target_id: TARGET-001
