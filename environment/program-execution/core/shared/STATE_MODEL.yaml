schema: program-execution-system.state-model.v2
schema_version: 2.0.0
domains:
  definition_state:
    owner: Program Execution Blueprint
    values: [draft, ready, active, blocked, accepted, superseded, retired, cancelled]
    law: Describes definition readiness or lifecycle; never execution progress.
  runtime_task_state:
    owner: Program Execution Controller
    values: [BLOCKED, ELIGIBLE, LEASED, PREPARED, CONTRACTED, EXECUTING, SUBMITTED, VERIFYING, PASSED_LOCAL, FAILED, STALE, CANCELLED, COMPLETED]
    law: Changes only through the Controller state machine and evidence-bearing events.
  evidence_result:
    owner: evidence producer with Controller validation
    values: [PASS, FAIL, BLOCKED, UNKNOWN, NOT_APPLICABLE_WITH_REASON, INFORMATIONAL]
    law: UNKNOWN is non-passing; NOT_APPLICABLE_WITH_REASON satisfies a gate only with a valid scoped waiver.
  program_verdict:
    owner: program owner
    values: [CONVERGED, CONVERGED_WITH_NON_BLOCKING_RISKS, NOT_CONVERGED, INCONCLUSIVE]
    law: Controller recommendations are advisory until explicitly accepted.
  mission_lifecycle_state:
    owner: mission_owner
    values: [PROPOSED, ACTIVE, WAITING, SATISFIED, FAILED, CANCELLED, SUPERSEDED]
    law: >-
      Mutable status concerning an exact immutable Mission Revision, never embedded in it. SATISFIED requires a
      SATISFIED Mission verdict; FAILED requires explicit authorized Mission termination of a Mission that is not
      satisfied; CANCELLED requires authorized Mission cancellation; SUPERSEDED requires a successor Mission
      Revision. INCONCLUSIVE does not imply a terminal state and NOT_SATISFIED alone does not imply FAILED. A
      Mission state change never directly mutates Program runtime, and supersession never rebinds existing
      Programs.
  replan_revision_state:
    owner: Program Execution Controller
    values: [proposed, verified, activated, rejected, stale]
    law: A Replan Revision may change future execution only inside the immutable Program Lock. Historical receipts stay append-only.
forbidden_collapses:
- mission_revision_as_mutable_lifecycle_state
- mission_state_as_program_runtime_state
- mission_lifecycle_state_as_evidence_result_or_program_verdict
- program_verdict_as_mission_verdict
- task_completion_as_mission_acceptance
- mission_acceptance_as_controller_verification
- task_status_as_both_definition_and_runtime
- gate_status_inside_blueprint_definition
- local_verification_as_program_convergence
- worker_claim_as_verification
