schema: program-execution-system.ownership-matrix.v2
schema_version: 2.0.0
rules:
  one_canonical_owner_per_concern: true
  runtime_projection_does_not_transfer_definition_authority: true
  controller_may_narrow_never_widen: true
concerns:
- concern: mission_identity_objective_and_acceptance
  canonical_owner: mission owner
  controller_projection: read_only Mission Program Binding
  mutation_path: superseding Mission Revision accepted by mission owner
- concern: mission_program_membership
  canonical_owner: mission owner
  controller_projection: immutable Mission Program Binding
  mutation_path: new immutable binding
- concern: mission_acceptance_evaluation
  canonical_owner: mission owner
  controller_projection: advisory evidence projection
  mutation_path: evidence-backed Mission verdict
- concern: mission_authorization_ceiling
  canonical_owner: Mission Revision
  controller_projection: read_only upper-bound projection
  mutation_path: superseding Mission Revision
- concern: mission_lifecycle_state
  canonical_owner: mission owner
  controller_projection: none; a Mission state change never mutates Program runtime
  mutation_path: authorized Mission lifecycle transition
- concern: program_identity_target_state_and_scope
  canonical_owner: Program Execution Blueprint
  controller_projection: immutable Program Lock
  mutation_path: superseding Blueprint accepted by program owner
- concern: responsibility_authority
  canonical_owner: Program Execution Blueprint
  controller_projection: read_only authority projection
  mutation_path: evidence-backed decision and superseding Blueprint
- concern: task_definition_and_authorization_ceiling
  canonical_owner: Program Execution Blueprint
  controller_projection: runtime task plus narrowed Source Contract
  mutation_path: superseding Task Card
- concern: task_runtime_state
  canonical_owner: Program Execution Controller
  controller_projection: SQLite state plus hash-chained event ledger
  mutation_path: validated state transition only
- concern: convergence_gate_definition
  canonical_owner: Program Execution Blueprint
  controller_projection: immutable gate definition
  mutation_path: superseding gate definition
- concern: convergence_gate_evaluation
  canonical_owner: Program Execution Controller
  controller_projection: evidence-bound Gate Evaluation Receipt
  mutation_path: independent re-evaluation
- concern: worker_attempt_claim
  canonical_owner: worker
  controller_projection: Attempt Receipt
  mutation_path: new attempt only; never edits prior receipt
- concern: verification_verdict
  canonical_owner: Program Execution Controller
  controller_projection: Verification Receipt
  mutation_path: independent rerun against exact state
- concern: execution_attempt_identity_and_baseline
  canonical_owner: Program Execution Controller
  controller_projection: execution_attempts record plus immutable baseline artifact
  mutation_path: new attempt at pec start only; a baseline is never recaptured
- concern: execution_recovery_and_fencing
  canonical_owner: Program Execution Controller
  controller_projection: recovery evidence, fenced attempt, released lease, STALE task
  mutation_path: pec recover-execution or pec fresh-workspace only
- concern: convergence_gate_verdict_derivation
  canonical_owner: Program Execution Controller
  controller_projection: derived Gate Evaluation Receipt with evaluator version and reason codes
  mutation_path: evidence-only re-evaluation; callers never supply the result
- concern: local_terminal_closure
  canonical_owner: Program Execution Controller
  controller_projection: Closure Receipt
  mutation_path: pec close only; handoff export never mutates lifecycle
- concern: canonical_runtime_persistence
  canonical_owner: Program Execution Controller
  controller_projection: SQLite state, event outbox and receipt records in one transaction; files are projections
  mutation_path: Controller transaction plus startup reconciliation
- concern: provider_retry_and_failover
  canonical_owner: Peer Execution Core
  controller_projection: retry receipt bound to attempt, lease and contract
  mutation_path: front door only; fencing required before any post-dispatch retry
- concern: final_program_verdict
  canonical_owner: program owner
  controller_projection: advisory Handoff Receipt recommendation
  mutation_path: explicit acceptance or superseding program decision
