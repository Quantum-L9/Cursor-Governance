schema: program-execution-system.evidence-model.v2
schema_version: 2.0.0
required_fields: [id, type, source, revision, digest, method, environment, producer, produced_at, expires_at, result, status, supports, contradicts]
validity_rules:
- source_or_artifact_is_retrievable
- revision_or_digest_binds_exact_state
- method_is_reproducible_or_explicitly_inspection_based
- producer_and_time_are_recorded
- evidence_is_not_expired_invalidated_planned_or_UNKNOWN
- support_scope_matches_the_claim_or_transition
classes:
  planning: [source_snapshot, inspection, architecture_decision]
  execution: [attempt_receipt, changed_file_inventory, command_output]
  verification: [test_result, verification_receipt, gate_evaluation]
  governance: [approval, waiver, handoff_receipt, program_verdict_acceptance]
  mission: [mission_criterion_result, mission_verdict]
# Mission acceptance extends this plane; it does not fork one. Mission
# criterion results and Mission verdicts carry the same validity rules and
# bind mission_digest so a result cannot drift onto a different revision.
mission_acceptance:
  reuses_validity_rules: true
  binds_exact_state_via: mission_digest
  parallel_mission_evidence_plane: false
  forbidden_implications:
  - program_convergence_as_mission_acceptance
  - task_completion_as_mission_acceptance
  - worker_claim_as_mission_acceptance_evidence
  - unverified_model_statement_as_mission_acceptance_evidence
