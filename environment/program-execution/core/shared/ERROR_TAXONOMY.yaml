schema: program-execution-system.error-taxonomy.v2
schema_version: 2.0.0
errors:
- code: DEFINITION_INVALID
  owner: Blueprint
  effect: reject import or block affected entity
- code: PROGRAM_LOCK_STALE
  owner: Controller
  effect: block admission and require relock
- code: AUTHORITY_AMBIGUOUS
  owner: Blueprint
  effect: block only named dependent work
- code: AUTHORIZATION_INFLATION
  owner: Controller
  effect: reject Source or Rendered Contract
- code: REPOSITORY_STATE_DRIFT
  owner: Controller
  effect: mark task STALE and preserve evidence
- code: SCOPE_VIOLATION
  owner: Controller
  effect: fail attempt and deny advancement
- code: VALIDATION_FAILURE
  owner: Controller
  effect: mark task FAILED and invoke rollback or retry policy
- code: EVIDENCE_INVALID_OR_STALE
  owner: Controller
  effect: block decision, Unknown resolution, gate evaluation, or completion
- code: LEASE_EXPIRED
  owner: Controller
  effect: preserve recovery artifacts, release lease, mark task STALE
- code: PROGRAM_NOT_CONVERGED
  owner: program owner
  effect: accept NOT_CONVERGED or issue superseding Blueprint
- code: PHASE0_INCOMPLETE
  owner: Blueprint
  effect: deny mutating wave admission and deploy autonomy profile
- code: ADVISORY_CI_NOISE
  owner: Controller
  effect: treat as environmental; require Phase 0 clearance or scoped waiver
- code: TRUE_BLOCKING_GATE_FAILURE
  owner: Controller
  effect: halt admission or completion until gate PASS
- code: LOCAL_PR_GATE_SKIPPED
  owner: Controller
  effect: deny push/PR admission until make pr PASS evidence exists
- code: REMEDIATION_WITHOUT_LOCAL_PASS
  owner: Controller
  effect: reject remediation-as-primary-quality-loop
- code: UV_LOCK_DRIFT
  owner: Controller
  effect: deny mutation until uv lock --check PASS or N/A justified
- code: TOOLCHAIN_PIN_MISMATCH
  owner: Controller
  effect: deny mutation until pin surfaces lockstep
- code: PROGRAM_ARTIFACT_MISALIGNMENT
  owner: Blueprint
  effect: block import or wave entry until registers cohere
- code: NON_BUSINESS_STOP_UNCLEARED
  owner: Controller
  effect: deny long autonomy until Phase 0 clears environmental stops
- code: AUTHORITY_MISALIGNED
  owner: Controller
  effect: refuse autonomy start when packet fields disagree with Program Lock scope
- code: ADAPTER_ABSENT_FOR_REMOTE
  owner: Controller
  effect: deny push/PR when adapter_status is absent
