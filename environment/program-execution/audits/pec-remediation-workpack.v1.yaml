legacy_reconciliation:
  command: pec reconcile-legacy --workspace <runtime>
  law: classify and fence, never bless; a runtime reporting RUNTIME_RECONCILIATION_REQUIRED halts until recovered or re-admitted
  proven_by: core/program-execution-controller-template/scripts/tests/test_legacy_reconciliation.py
