- id: GAP-001
  phase: execute
  state_from: LEASED
  state_to: PREPARED
  severity: critical
  autonomous: false
  evidence:
    path: environment/program-execution/scripts/run_campaign.py
    symbol: default_arm
    fact: runner calls pec claim then writes STACK.json; pec prepare is never invoked
  gap: After TASK-001 is LEASED the assembly line stops. prepare → render-contract → start
    → record-attempt → verify → complete are agent-manual.
  required_fix: Wire a bounded execute loop in run_campaign after arm (or call a single pec-owned
