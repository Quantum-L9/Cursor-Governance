    symbol: task_readiness
    fact: definition_status != ready → definition_not_ready blocker
    path_2: environment/program-execution/core/program-execution-controller-template/scripts/pec/controller.py
    path_3: environment/program-execution/core/program-execution-controller-template/scripts/pec/controller.py
  gap: Registering contracts does not unlock later tasks. TASK-002 stays blocked forever.
    The W1 wave cannot start.
  required_fix: Either compile later tasks as ready and rely on dependency/wave blockers,
    or flip successor definition_status to ready inside complete_task. Add a test that TASK-002
    becomes claimable after TASK-001 COMPLETED.
  acceptance_test: after fixture complete of TASK-001, pec claim TASK-002 succeeds (given
    contract + reconcile + stack base).
  status: Resolved
- id: GAP-003
  phase: stack
  state_from: STACK.json written
  state_to: git branch from predecessor tip
  severity: critical
  autonomous: false
  evidence:
    path: environment/program-execution/core/program-execution-controller-template/scripts/pec/controller.py
    symbol: build_pr_stack
    fact: STACK.json is a pointer file only
    path_2: environment/program-execution/scripts/run_campaign.py
  gap: pec prepare always branches from the original reconciled SHA. Task PRs are parallel
    forks of main, then conflict on merge. STACK.json does not change git.
  required_fix: prepare_worktree (or arm/claim) must create task N branch from STACK.json
    predecessor tip (campaign/<id> for TASK-001, pec/.../task-00N-1 thereafter). Refuse base_sha
    == origin/main when a predecessor branch exists.
  acceptance_test: TASK-002 prepare parent SHA equals TASK-001 branch HEAD, not the original
    reconcile SHA after TASK-001 has a commit.
  status: Resolved
- id: GAP-004
