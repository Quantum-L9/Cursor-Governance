  acceptance_test: until=arm leaves LEASED; a new until=execute or default path reaches PASSED_LOCAL
    without a human pec CLI.
  status: Resolved
- id: GAP-002
  phase: unlock
  state_from: TASK-00N definition_status=blocked
  state_to: TASK-00N+1 claimable
