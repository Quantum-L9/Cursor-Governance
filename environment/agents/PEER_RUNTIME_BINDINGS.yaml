# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: environment/agents/PEER_RUNTIME_BINDINGS.yaml
#   layer: registry
#   owner: governance-control-plane
#   status: active
#   version: 3.0.0
#   updated: 2026-08-26
#
# Sole topology SSOT for peer identity -> surface -> provider -> execution profile.
# Provider descriptors never carry agent_ref. Runtime health remains receipt-backed.
# Every peer is bound to the one canonical root-autonomy authorization provider,
# regardless of whether its execution provider is currently routable.

schema: l9.peer-runtime-bindings.v3
schema_version: 3.0.0
peers:
  cursor:
    agent_ref: cursor
    execution:
      required: true
      bindings:
        - surface: cursor-ide
          provider_ref: cursor-foreground
          execution_profile_ref: worker-default
        - surface: cursor-ide
          provider_ref: cursor-background
          execution_profile_ref: worker-default
    autonomy:
      required: true
      provider_id: root-autonomy-control-plane
    subagents:
      enabled: true
      roles_manifest: environment/agents/cursor-subagents/CURSOR_SUBAGENT_ROLES.yaml
      deployment:
        readiness_required: true
    results:
      readiness_required: true
    generated_data:
      required: true
      capture_readiness_required: true

  claude-code:
    agent_ref: claude-code
    execution:
      required: true
      bindings:
        - surface: claude-cli
          provider_ref: claude-code-direct
          execution_profile_ref: worker-default
        - surface: claude-web
          provider_ref: claude-code-direct
          execution_profile_ref: worker-default
        - surface: claude-mobile
          provider_ref: claude-code-direct
          execution_profile_ref: worker-default
    autonomy:
      required: true
      provider_id: root-autonomy-control-plane
    subagents:
      enabled: false
    results:
      readiness_required: false
    generated_data:
      required: true
      capture_readiness_required: false

  codex:
    agent_ref: codex
    execution:
      required: false
      bindings:
        - surface: codex-cloud
          provider_ref: codex-cloud
          execution_profile_ref: worker-default
    autonomy:
      required: true
      provider_id: root-autonomy-control-plane
    subagents:
      enabled: false
    results:
      readiness_required: false
    generated_data:
      required: false
      capture_readiness_required: false

  gemini:
    agent_ref: gemini
    execution:
      required: false
      bindings:
        - surface: gemini-cli
          provider_ref: gemini-review
          execution_profile_ref: reviewer-default
    autonomy:
      required: true
      provider_id: root-autonomy-control-plane
    subagents:
      enabled: false
    results:
      readiness_required: false
    generated_data:
      required: false
      capture_readiness_required: false

  manus:
    agent_ref: manus
    execution:
      required: false
      bindings:
        - surface: manus-cloud
          provider_ref: manus-cloud
          execution_profile_ref: worker-read-only
    autonomy:
      required: true
      provider_id: root-autonomy-control-plane
    subagents:
      enabled: false
    results:
      readiness_required: false
    generated_data:
      required: false
      capture_readiness_required: false
