#   owner: governance-control-plane
#   status: active
#   version: 2.2.0
#   updated: 2026-09-13
#
# AGENT REGISTRY — the single source of truth for WHO writes memory (identity
# plane only). Executable topology (which Program adapters / autonomy /
# subagents / results / generated-data planes a peer requires) lives solely in
# PEER_RUNTIME_BINDINGS.yaml. Do NOT add execution: blocks here — validators
# fail closed if they reappear (rule E15).
#
# Peer of ops/graphiti/group_registry.yaml (which answers WHAT repo memory
# is about). Together they complete the identity matrix:
#   group_id  = repo namespace  -> SHARED across all agents (group_registry.yaml)
#   agent     = writing identity -> DISTINCT per agent (this file)
#
# Rules (enforced by validate_agents.py):
#   * agent_id unique, kebab-case, immutable once shipped
#   * user_id unique, snake_case, "<agent_id with _>_agent"
#   * source == agent_id
#   * principal_id == "<agent_id>-memory-client"
#   * signing_key_env == "L9_MEMORY_AGENT_SIGNING_KEY__<AGENT upper snake>"
#     (legacy token_env retained as alias for older adapters)
#   * role must exist in the roles catalog below
#   * NO secrets in this file. Shared agents door secret, per-agent signing
#     keys, and the human door secret live only in gitignored local maps /
#     OS secret stores (ADR-0031).

schema_version: 2
workspace_group: igor-workspace

# ---------------------------------------------------------------------------
# Role catalog — hard grants are namespace globs applied by
# tools/render_principals.py when emitting the memory server's auth_tokens.json.
# The work-claim protocol (docs/WORK_CLAIM_PROTOCOL.md) is the soft layer that
# prevents two agents doing the same task inside a namespace they both hold.
# ---------------------------------------------------------------------------
roles:
  orchestrator:
    description: >
      Human-directed lead session. Full read/write across the workspace,
      may promote memories, arbitrates stale or conflicting task claims.
    read_namespaces: ["*"]
    write_namespaces: ["*"]
    promote_namespaces: ["*"]
    is_admin: false
  implementer:
    description: >
      Writes code and memories only in repos it is assigned. Cannot promote.
      Must claim tasks before starting work.
    read_namespaces: ["*"]
    write_namespaces: []          # filled per-agent from assigned_groups
    promote_namespaces: []
    is_admin: false
  researcher-builder:
    description: >
      Research, analysis, multi-repo build work. Writes to assigned repos
      plus the shared workspace namespace. Cannot promote.
    read_namespaces: ["*"]
    write_namespaces: []          # filled per-agent from assigned_groups
    promote_namespaces: []
    is_admin: false
  reviewer:
    description: >
      CI / PR review bots. May write only review episodes into the
      "<group>.reviews" sub-namespace of assigned repos.
    read_namespaces: ["*"]
    write_namespaces: []          # rendered as "<group>.reviews" per assignment
    promote_namespaces: []
    is_admin: false
  observer:
    description: Read-only. Dashboards, analytics, retrieval-only assistants.
    read_namespaces: ["*"]
    write_namespaces: []
    promote_namespaces: []
    is_admin: false
  human-operator:
    description: >
      Private human entrance only (ADR-0031). Full admin/promote. Never
      issued to an agent surface.
    read_namespaces: ["*"]
    write_namespaces: ["*"]
    promote_namespaces: ["*"]
    is_admin: true

# ---------------------------------------------------------------------------
# Agents — one entry per writing identity. Adding an agent = add an entry
# here AND a peer entry in PEER_RUNTIME_BINDINGS.yaml, run the renderers,
# issue a token. Nothing else is hand-edited.
# ---------------------------------------------------------------------------
agents:
  cursor:
    agent_id: cursor
    user_id: cursor_agent            # matches ops/graphiti/config-docker-neo4j.yaml ${USER_ID:cursor_agent}
    source: cursor
    principal_id: cursor-memory-client
    token_env: L9_MEMORY_TOKEN__CURSOR
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__CURSOR
    role: orchestrator
    surfaces: [cursor-ide]
    assigned_groups: ["*"]
    adapter: cursor                  # existing .cursor-commands activation, unchanged
    status: active

  claude-code-desktop:
    agent_id: claude-code-desktop
    user_id: claude_code_desktop_agent
    source: claude-code-desktop
    principal_id: claude-code-desktop-memory-client
    token_env: L9_MEMORY_TOKEN__CLAUDE_CODE_DESKTOP
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__CLAUDE_CODE_DESKTOP
    role: implementer
    surfaces: [claude-desktop, claude-cli, claude-ide]
    # Claude Code Desktop: runs on the operator's machine (CLAUDE_CODE_REMOTE unset).
    # DERIVED at write time by ops/memory/agent_identity.py from host markers,
    # never configured; the two Claude Code identities share a role and grants
    # but never an identity, so every memory says which surface wrote it. Grants are per-agent: a namespace absent here is
    # unwritable through the agent lane (Tier 2).
    assigned_groups: [constellation-gate, cursor-governance, l9-ci-core, l9-graphiti-memory, l9-node-template]
    adapter: claude-code             # environment/agents/adapters/claude-code/
    status: active

  claude-code-mobile:
    agent_id: claude-code-mobile
    user_id: claude_code_mobile_agent
    source: claude-code-mobile
    principal_id: claude-code-mobile-memory-client
    token_env: L9_MEMORY_TOKEN__CLAUDE_CODE_MOBILE
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__CLAUDE_CODE_MOBILE
    role: implementer
    surfaces: [claude-mobile]
    # Claude Code Mobile: cloud session, CLAUDE_CODE_REMOTE=true + CLAUDE_CODE_ENTRYPOINT=remote_mobile.
    # DERIVED at write time by ops/memory/agent_identity.py from host markers,
    # never configured; the two Claude Code identities share a role and grants
    # but never an identity, so every memory says which surface wrote it. Grants are per-agent: a namespace absent here is
    # unwritable through the agent lane (Tier 2).
    assigned_groups: [constellation-gate, cursor-governance, l9-ci-core, l9-graphiti-memory, l9-node-template]
    adapter: claude-code             # environment/agents/adapters/claude-code/
    status: active

  manus:
    agent_id: manus
    user_id: manus_agent
    source: manus
    principal_id: manus-memory-client
    token_env: L9_MEMORY_TOKEN__MANUS
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__MANUS
    role: researcher-builder
    surfaces: [manus-cloud]
    assigned_groups: [cursor-governance, l9-graphiti-memory, cognitive-engine-graphs, igorbot]
    adapter: manus
    status: active

  codex:
    agent_id: codex
    user_id: codex_agent
    source: codex
    principal_id: codex-memory-client
    token_env: L9_MEMORY_TOKEN__CODEX
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__CODEX
    role: implementer
    surfaces: [codex-cloud, codex-cli]
    assigned_groups: [l9-node-template]
    adapter: codex
    status: active

  gemini:
    agent_id: gemini
    user_id: gemini_agent
    source: gemini
    principal_id: gemini-memory-client
    token_env: L9_MEMORY_TOKEN__GEMINI
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__GEMINI
    role: reviewer
    surfaces: [gemini-cli]
    assigned_groups: [cursor-governance, l9-graphiti-memory]
    adapter: gemini
    status: active

  perplexity:
    agent_id: perplexity
    user_id: perplexity_agent
    source: perplexity
    principal_id: perplexity-memory-client
    token_env: L9_MEMORY_TOKEN__PERPLEXITY
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__PERPLEXITY
    # Perplexity (assistant).
    # Reserved identity, not yet wired: no adapter, observer role (read only,
    # no write grants). When its adapter lands it sets L9_MEMORY_AGENT_ID=perplexity,
    # gets a writing role + assigned_groups, and moves to status: active.
    role: observer
    surfaces: [perplexity]
    assigned_groups: []
    adapter: none
    status: planned

  perplexity-computer:
    agent_id: perplexity-computer
    user_id: perplexity_computer_agent
    source: perplexity-computer
    principal_id: perplexity-computer-memory-client
    token_env: L9_MEMORY_TOKEN__PERPLEXITY_COMPUTER
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__PERPLEXITY_COMPUTER
    # Perplexity Computer (computer-use agent).
    # Reserved identity, not yet wired: no adapter, observer role (read only,
    # no write grants). When its adapter lands it sets L9_MEMORY_AGENT_ID=perplexity-computer,
    # gets a writing role + assigned_groups, and moves to status: active.
    role: observer
    surfaces: [perplexity-computer]
    assigned_groups: []
    adapter: none
    status: planned

  l-cto:
    agent_id: l-cto
    user_id: l_cto_agent
    source: l-cto
    principal_id: l-cto-memory-client
    token_env: L9_MEMORY_TOKEN__L_CTO
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__L_CTO
    # L CTO: strategic technical-decision agent.
    # Reserved identity, not yet wired: no adapter, observer role (read only,
    # no write grants). When its adapter lands it sets L9_MEMORY_AGENT_ID=l-cto,
    # gets a writing role + assigned_groups, and moves to status: active.
    role: observer
    surfaces: [l-cto]
    assigned_groups: []
    adapter: none
    status: planned

  igorbot:
    agent_id: igorbot
    user_id: igorbot_agent
    source: igorbot
    principal_id: igorbot-memory-client
    token_env: L9_MEMORY_TOKEN__IGORBOT
    signing_key_env: L9_MEMORY_AGENT_SIGNING_KEY__IGORBOT
    # IgorBot.
    # Reserved identity, not yet wired: no adapter, observer role (read only,
    # no write grants). When its adapter lands it sets L9_MEMORY_AGENT_ID=igorbot,
    # gets a writing role + assigned_groups, and moves to status: active.
    role: observer
    surfaces: [igorbot]
    assigned_groups: []
    adapter: none
    status: planned

  human:
    agent_id: human
    user_id: human_agent
    source: human
    principal_id: human-memory-client
    token_env: L9_MEMORY_TOKEN__HUMAN
    signing_key_env: L9_MEMORY_HUMAN_DOOR_SECRET
    role: human-operator
    surfaces: [operator-local]
    assigned_groups: ["*"]
    adapter: none
    status: active
    private_entrance: true

# ---------------------------------------------------------------------------
# Shared memory contract (realignment stage C9 / ADR-0031). Memory is the canonical
# l9-graphite-memory control plane (MemoryService, memory-control-plane/v1),
# bound per checkout by ops/config/memory-binding.json and reached through
# ops/memory over stdio. No surface holds a provider URL or a memory bearer:
# the runtime resolves its own credentials (memory ADR-016); per-agent
# principals are memory's concern, expressed to it through the identity
# environment below. Graphiti survives only as memory's optional projection.
# ---------------------------------------------------------------------------
memory:
  control_plane: l9-graphite-memory
  contract: memory-control-plane/v1
  binding: ops/config/memory-binding.json
  transport: stdio
  auth_scheme: shared-door-plus-signed-assertion  # ADR-0031
  agents_door_secret_env: L9_MEMORY_AGENTS_DOOR_SECRET
  human_door_secret_env: L9_MEMORY_HUMAN_DOOR_SECRET
  agent_assertion_env: L9_MEMORY_AGENT_ASSERTION
  agent_signing_keys_json_env: L9_MEMORY_AGENT_SIGNING_KEYS_JSON
  agent_grants_json_env: L9_MEMORY_AGENT_GRANTS_JSON
  interpreter_env: L9_MEMORY_INTERPRETER
  identity_env:
    user_id: USER_ID
    agent_id: L9_MEMORY_AGENT_ID
    source: L9_MEMORY_SOURCE
