# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: environment/agents/agent_registry.yaml
#   layer: registry
#   owner: governance-control-plane
#   status: active
#   version: 2.0.0
#   updated: 2026-10-03
#
# OPERATING-PLANE AGENT BINDINGS.
#
# Canonical ActorIdentity and SurfaceIdentity are NOT defined here.
# They are referenced from the machine-generated canonical identity projection:
#
#   generated/governance/canonical_identity.yaml
#
# Canonical authority:
#
#   Quantum-L9/.github/semantics/actor_registry.yaml
#   Quantum-L9/.github/semantics/surface_registry.yaml
#
# This file owns operating-plane bindings only:
#
#   actor -> surfaces
#   actor -> role
#   actor -> memory principal
#   actor -> adapter
#   actor -> assigned groups
#   actor -> credential environment coordinates
#
# Do not add agent_id, source, surfaces, actor status, actor kind, surface status,
# or local aliases. Those are resolved from canonical references.
schema: l9.cursor-governance.agent-bindings/v2
artifact_id: l9.cursor-governance/agent-bindings@2
canonical: true
authority:
  owner: Quantum-L9/Cursor-Governance
  scope: cursor_governance_operating_plane_agent_bindings
  authority_class: local_canonical
identity_authority:
  binding_ref: l9.cursor-governance/identity-binding@1
  projection_ref: l9.projection/cursor-governance-identity@1
  projection_path: generated/governance/canonical_identity.yaml
  actor_registry_ref: l9.actor-registry/global@1
  surface_registry_ref: l9.surface-registry/global@1
  rules:
    actor_identity_is_reference_only: true
    surface_identity_is_reference_only: true
    actor_surface_assignment_is_local: true
    actor_id_is_derived_from_actor_ref: true
    memory_source_is_derived_from_actor_ref: true
workspace_group: igor-workspace
roles:
  orchestrator:
    description: >
      Human-directed lead session. Full read/write across the workspace,
      may promote memories, and arbitrates stale or conflicting task claims.
    read_namespaces:
      - "*"
    write_namespaces:
      - "*"
    promote_namespaces:
      - "*"
    is_admin: false
  implementer:
    description: >
      Writes code and memories only in repositories it is assigned.
      Cannot promote. Must claim tasks before starting work.
    read_namespaces:
      - "*"
    write_namespaces: []
    promote_namespaces: []
    is_admin: false
  researcher-builder:
    description: >
      Research, analysis, and multi-repository build work. Writes to assigned
      repositories plus authorized shared workspace namespaces. Cannot promote.
    read_namespaces:
      - "*"
    write_namespaces: []
    promote_namespaces: []
    is_admin: false
  reviewer:
    description: >
      CI and PR review agents. May write review evidence only into authorized
      review namespaces derived from assigned groups.
    read_namespaces:
      - "*"
    write_namespaces: []
    promote_namespaces: []
    is_admin: false
  observer:
    description: >
      Retrieval-only operating identity. No write or promotion authority.
    read_namespaces:
      - "*"
    write_namespaces: []
    promote_namespaces: []
    is_admin: false
agents:
  cursor:
    actor_ref: l9.actor-registry/global@1#cursor
    surface_refs:
      - l9.surface-registry/global@1#cursor-ide
    user_id: cursor_agent
    principal_id: cursor-memory-client
    token_env: L9_MEMORY_TOKEN__CURSOR
    role: orchestrator
    assigned_groups:
      - "*"
    adapter: cursor
    binding_status: active
  claude-code:
    actor_ref: l9.actor-registry/global@1#claude-code
    surface_refs:
      - l9.surface-registry/global@1#claude-code-cli
      - l9.surface-registry/global@1#claude-code-web
      - l9.surface-registry/global@1#claude-code-mobile
    user_id: claude_code_agent
    principal_id: claude-code-memory-client
    token_env: L9_MEMORY_TOKEN__CLAUDE_CODE
    role: implementer
    assigned_groups:
      - cursor-governance
      - l9-graphiti-memory
      - l9-node-template
    adapter: claude-code
    binding_status: active
  manus:
    actor_ref: l9.actor-registry/global@1#manus
    surface_refs:
      - l9.surface-registry/global@1#manus-cloud
    user_id: manus_agent
    principal_id: manus-memory-client
    token_env: L9_MEMORY_TOKEN__MANUS
    role: researcher-builder
    assigned_groups:
      - cursor-governance
      - l9-graphiti-memory
      - cognitive-engine-graphs
      - igorbot
    adapter: manus
    binding_status: active
  codex:
    actor_ref: l9.actor-registry/global@1#codex
    surface_refs:
      - l9.surface-registry/global@1#codex-cloud
      - l9.surface-registry/global@1#codex-cli
    user_id: codex_agent
    principal_id: codex-memory-client
    token_env: L9_MEMORY_TOKEN__CODEX
    role: implementer
    assigned_groups:
      - l9-node-template
    adapter: codex
    binding_status: active
  gemini:
    actor_ref: l9.actor-registry/global@1#gemini
    surface_refs:
      - l9.surface-registry/global@1#gemini-cli
    user_id: gemini_agent
    principal_id: gemini-memory-client
    token_env: L9_MEMORY_TOKEN__GEMINI
    role: reviewer
    assigned_groups:
      - cursor-governance
      - l9-graphiti-memory
    adapter: gemini
    binding_status: active
rendering:
  agent_id:
    derive_from: actor_ref_fragment
  source:
    derive_from: actor_ref_fragment
  surfaces:
    derive_from: surface_ref_fragments
  requirements:
    actor_ref_must_resolve: true
    surface_refs_must_resolve: true
    active_binding_requires_current_actor: true
    active_binding_requires_current_surfaces: true
    canonical_projection_receipt_must_verify: true
memory:
  control_plane: l9-graphite-memory
  transport: stdio
  identity_env:
    user_id: USER_ID
    agent_id: L9_MEMORY_AGENT_ID
    source: L9_MEMORY_SOURCE
forbidden_local_identity_fields:
  - agent_id
  - source
  - surfaces
  - actor_kind
  - actor_status
  - surface_status
  - aliases
