# L9 Claude Agent SDK adapter config. Read-only consumer of ORG_INVARIANTS.yaml; never a fork.
# Every disallowed rule MUST carry an `invariant:` reference (validated by validate_agent_sdk_env.py).
setting_sources: [project]
permission_mode_default: default
max_turns: 40
max_budget_usd: 2.00
hook_launcher: environment/agents/adapters/claude-code/hooks/l9_hook_exec.sh
governor_veto_exit_code: 2
protected_files:
  - CANONICAL_LAW.md
  - INVARIANTS.md
  - ORG_INVARIANTS.yaml
  - CODEOWNERS
  - .env
protected_prefixes:
  - .github/workflows/
  - rulesets/
  - policies/
  - security/
allowed_tools:
  - Read
  - Grep
  - Glob
  - Edit
  - Write
  - MultiEdit
  - Agent
  - "Bash(git status*)"
  - "Bash(git diff*)"
  - "Bash(git log*)"
  - "Bash(git add*)"
  - "Bash(git commit*)"
  - "Bash(git checkout -b*)"
  - "Bash(uv *)"
  - "Bash(make *)"
  - "Bash(pytest*)"
  - "Bash(ruff *)"
disallowed_tools:
  - rule: "Bash(rm -rf *)"
    invariant: INV-DESTRUCTIVE-FS
  - rule: "Bash(git push --force*)"
    invariant: INV-HISTORY-IMMUTABLE
  - rule: "Bash(git push -f*)"
    invariant: INV-HISTORY-IMMUTABLE
  - rule: "Bash(git reset --hard*)"
    invariant: INV-WORKTREE-PRESERVE
  - rule: "Bash(curl * | sh*)"
    invariant: INV-NO-REMOTE-EXEC
  - rule: "Bash(sudo *)"
    invariant: INV-NO-PRIVILEGE-ESCALATION
  - rule: WebFetch
    invariant: INV-NO-EGRESS
  - rule: WebSearch
    invariant: INV-NO-EGRESS
