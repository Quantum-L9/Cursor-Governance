#
# Template peer-execution cross-link for onboarding a new MCP-capable surface
# that has no dedicated program adapter yet. A generic shell peer executes
# verification through the active `ci-generic-shell` program adapter until a
# surface-specific worker host is provisioned. `binding_kind: template` tells
# `make peer-execution-conformance` not to require a registered agent identity
# for this file (it is a copy-me example, not a live peer).
schema: l9.agent-program-execution-binding.v1
agent_id: generic
surface: generic
binding_kind: template
program_execution:
  enabled: false
  adapters:
    - ci-generic-shell
