# LLM skill discovery adapters.
# Single maintainable corpus: governance `skills/` (== `.cursor-commands/skills`).
# Adapters receive per-skill symlinks only — never copies, never whole-dir duplicates.
schema_version: 1
ssot_relative: skills
mode: symlink
replace_l9_duplicates: true
adapters:
  # Claude Code is deliberately OUTSIDE the Cursor virtualization boundary: it
  # projects the full canonical corpus and must run with Cursor, the Cursor
  # adapter tree, and ~/.cursor all absent. The Cursor plane may not move a
  # Claude-visible invocation tier, drop a skill from this projection, or write
  # any path under .claude/** or environment/agents/adapters/claude-code/**.
  # Contract: docs/CLAUDE_CODE_PRESERVATION_CONTRACT.md (CC-001..010).
  # Gate: environment/agents/adapters/claude-code/validate_claude_preservation.py
  #       (V-CC-001..005; make claude-preservation-check).
  - id: claude-code-user
    surface: claude-code
    kind: user
    path: ~/.claude/skills
    notes: "full canonical projection; preserved by CC-001..010 (V-CC-001..005)"
  - id: claude-code-project
    surface: claude-code
    kind: project
    path: .claude/skills
    notes: "full canonical projection; preserved by CC-001..010 (V-CC-001..005)"
  - id: codex-user
    surface: codex
    kind: user
    path: ~/.codex/skills
  - id: cursor-plugin
    surface: cursor
    kind: plugin
    # Cursor is a virtual-gateway surface: the l9-governance plugin exposes
    # exactly one native skill (environment/agents/adapters/cursor/skills/
    # l9-skill-gateway) and the canonical corpus is reached through the
    # registry + route receipts. This generic reconciler never mirrors,
    # copies, or symlinks canonical skills into Cursor discovery.
    path: null
    notes: "virtual gateway (AUTONOMY_MANIFEST cursor_discovery); ~/.cursor/skills is forbidden"
