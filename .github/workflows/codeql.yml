# --- L9_META ---
# l9_schema: 1
# artifact_type: ci_workflow
# component: codeql_code_quality_caller
# tags: [ci, codeql, code-quality, security, governance, quantum-l9, caller]
# retrieval: on_demand
# status: active
# --- /L9_META ---
#
# Thin caller -> the org-wide reusable CodeQL workflow. Analysis for pull
# requests and pushes to main uses the default suite (see codeql-config.yml).
# security-extended is codeql-nightly.yml and does not run on pull requests.

name: "CodeQL (security + code quality)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:            # skip docs-only PRs (save CI; see rollout handoff)
      - "**/*.md"
      - "docs/**"
      - "**/*.mdc"
  workflow_dispatch: {}

# Cancel a superseded run of the same PR (saves CI minutes on rapid pushes).
# Non-PR events get a unique group, so push/schedule/issue runs never cancel
# or queue behind one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    uses: Quantum-L9/Cursor-Governance/.github/workflows/codeql-reusable.yml@52d87ce2e217c16a96f0ef131f4da097ef7cd5e2  # default suite; action v4.39.3
    with:
      # Override the reusable workflow's remote @main default: this repo IS
      # Cursor-Governance, so the config file already sits in the checked-out
      # tree at any ref (PR branch, push, or main). A local path resolves
      # against the workspace instead of fetching a remote ref via the
      # Contents API -- avoids a 404 on PRs before this file exists on main.
      config-file: ./.github/codeql/codeql-config.yml
    permissions:
      contents: read
      security-events: write
      actions: read
