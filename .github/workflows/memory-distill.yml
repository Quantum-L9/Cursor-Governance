# Batch distill worker — pull redacted SessionEnd jobs from S3, distill via
# OpenAI (AWS SM), admit through the canonical memory control plane
# (realignment stage C10). Does not require a Mac awake and holds NO provider
# credential: the memory runtime it is bound to owns storage and projection.
#
# Required repository configuration (fail-loud if missing):
#   vars/secrets:
#     MEMORY_DISTILL_S3_BUCKET   — S3 bucket name
#     AWS_ROLE_TO_ASSUME         — OIDC role ARN with s3 + secretsmanager read
#     L9_MEMORY_CONFIG_JSON      — memory runtime configuration (MemorySettings
#                                  JSON: canonical store DSN, projection backend,
#                                  local principal grants). Written to a file and
#                                  handed to the runtime as L9_MEMORY_CONFIG; the
#                                  worker never reads it. A sqlite store here
#                                  would be a private ledger nobody hydrates from,
#                                  so the shared postgres backend is required
#                                  (memory ADR-072).
#   Optional:
#     MEMORY_DISTILL_S3_PREFIX   — default distill-queue/pending/
#     OPENAI_API_KEY             — if unset, worker resolves l9/OPENAI_API_KEY via SM
#
# The memory package is installed at the exact ref pinned in
# ops/config/memory-binding.json (never a floating ref) and bound through
# L9_MEMORY_INTERPRETER; ops/memory/runtime_binding.py refuses anything else.
# Never set continue-on-error on the distill job.
name: Memory Distill Queue

on:
  schedule:
    # Every 6 hours UTC — laptop need not be awake
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Max pending jobs to process
        required: false
        default: "20"
      dry_run:
        description: Distill without memory writes / S3 done move
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write  # AWS OIDC

concurrency:
  group: memory-distill
  cancel-in-progress: false

jobs:
  distill:
    name: Process distill queue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Require bucket configuration
        env:
          BUCKET: ${{ vars.MEMORY_DISTILL_S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET}" ]; then
            echo "::error::MEMORY_DISTILL_S3_BUCKET repository variable is unset"
            exit 1
          fi
          echo "MEMORY_DISTILL_S3_BUCKET=${BUCKET}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked toolchain
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.12.1
          uv sync --locked --no-build --extra dev

      - name: Bind the pinned memory runtime
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The exact ref this checkout is bound to (ops/config/memory-binding.json);
          # a floating ref is forbidden by the binding policy.
          MEMORY_REPO="$(python3 -c 'import json; d=json.load(open("ops/config/memory-binding.json")); print(d["source"]["repository"])')"
          MEMORY_REF="$(python3 -c 'import json; d=json.load(open("ops/config/memory-binding.json")); print(d["source"]["ref"])')"
          uv pip install --python .venv/bin/python \
            "git+https://x-access-token:${TOKEN}@github.com/${MEMORY_REPO}.git@${MEMORY_REF}"
          echo "L9_MEMORY_INTERPRETER=${PWD}/.venv/bin/python" >> "$GITHUB_ENV"
          PYTHONPATH="$PWD" .venv/bin/python -m ops.memory.diagnostics --binding-only

      - name: Write the memory runtime configuration
        env:
          MEMORY_CONFIG_JSON: ${{ secrets.L9_MEMORY_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${MEMORY_CONFIG_JSON}" ]; then
            echo "::error::L9_MEMORY_CONFIG_JSON secret is unset — the worker has no canonical store to admit into"
            exit 1
          fi
          CONFIG="${RUNNER_TEMP}/l9-memory-config.json"
          umask 077
          printf '%s\n' "${MEMORY_CONFIG_JSON}" > "${CONFIG}"
          echo "L9_MEMORY_CONFIG=${CONFIG}" >> "$GITHUB_ENV"

      - name: Resolve OpenAI key from Secrets Manager
        id: openai
        run: |
          set -euo pipefail
          # Prefer repository secret if present; else SM l9/OPENAI_API_KEY
          if [ -n "${OPENAI_API_KEY_SECRET:-}" ]; then
            echo "OPENAI_API_KEY=${OPENAI_API_KEY_SECRET}" >> "$GITHUB_ENV"
            exit 0
          fi
          VAL="$(aws secretsmanager get-secret-value \
            --secret-id l9/OPENAI_API_KEY \
            --region us-east-1 \
            --query SecretString \
            --output text)"
          if [ -z "${VAL}" ] || [ "${VAL}" = "None" ]; then
            echo "::error::failed to resolve l9/OPENAI_API_KEY from AWS Secrets Manager"
            exit 1
          fi
          echo "OPENAI_API_KEY=${VAL}" >> "$GITHUB_ENV"
        env:
          OPENAI_API_KEY_SECRET: ${{ secrets.OPENAI_API_KEY }}

      - name: Run distill worker
        env:
          MEMORY_DISTILL_S3_BUCKET: ${{ env.MEMORY_DISTILL_S3_BUCKET }}
          MEMORY_DISTILL_S3_PREFIX: ${{ vars.MEMORY_DISTILL_S3_PREFIX || 'distill-queue/pending/' }}
          L9_MEMORY_AGENT_ID: gha-distill
          USER_ID: gha_distill_agent
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '20' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          ARGS=(--max-jobs "${MAX_JOBS}" --workspace "${PWD}")
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          uv run --frozen --no-build python -m ops.graphiti.distill_queue.worker "${ARGS[@]}"
