name: Skill Compiler Lint Bridge

on:
  push:
    branches:
      - feat/l9-skill-compiler-v2-wire

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Apply repo-locked Ruff exactly
        shell: bash
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.12.1
          uv sync --locked --no-build --extra dev
          uv run --frozen --no-build ruff check skills/l9-skill-compiler/scripts/scan_skill_topology.py --fix
          uv run --frozen --no-build ruff format skills/l9-skill-compiler/scripts/scan_skill_topology.py
          uv run --frozen --no-build ruff check skills/l9-skill-compiler/scripts/scan_skill_topology.py
          uv run --frozen --no-build ruff format --check skills/l9-skill-compiler/scripts/scan_skill_topology.py

      - name: Seal fixed scanner as unattached Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=skills/l9-skill-compiler/scripts/scan_skill_topology.py
          payload="$(base64 -w0 "$file")"
          sha="$(jq -n --arg content "$payload" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
          echo "SCANNER_BLOB=${sha}"
