name: Skill Compiler Wire Bridge

on:
  push:
    branches:
      - feat/l9-skill-compiler-v2-wire

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Apply canonical compiler trigger in workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("skills/AUTONOMY_MANIFEST.yaml")
          text = path.read_text(encoding="utf-8")
          old = "    use_when: compiling prompts, SOPs, kernels, or workflows into standalone zero-stub skill packs"
          new = "    use_when: creating or materially changing a reusable skill where topology, runtime design, capability binding, rendering, or activation/behavior evals must be decided"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one legacy l9-skill-compiler use_when")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Generate exact repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 ops/scripts/sync_generated_artifacts.py --force --json
          mkdir -p wire-bridge/skills wire-bridge/ops/generated wire-bridge/environment/agents/adapters/claude-code/generated
          cp skills/AUTONOMY_MANIFEST.yaml wire-bridge/skills/AUTONOMY_MANIFEST.yaml
          cp ops/generated/skill-registry.json wire-bridge/ops/generated/skill-registry.json
          cp environment/agents/adapters/claude-code/generated/skill-registry.json wire-bridge/environment/agents/adapters/claude-code/generated/skill-registry.json

      - name: Upload exact generated bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: skill-compiler-wire-bridge
          path: wire-bridge/
          if-no-files-found: error
          retention-days: 1
