name: Skill Compiler Wire Bridge

on:
  push:
    branches:
      - feat/l9-skill-compiler-v2-wire

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate exact repository registries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 ops/scripts/sync_generated_artifacts.py --force --json

      - name: Seal exact registries as unattached Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          seal_blob() {
            local label="$1"
            local file="$2"
            local payload
            payload="$(base64 -w0 "$file")"
            local sha
            sha="$(jq -n --arg content "$payload" '{content:$content,encoding:"base64"}' | gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"
            echo "${label}=${sha}"
          }
          seal_blob REGISTRY_BLOB ops/generated/skill-registry.json
          seal_blob ADAPTER_REGISTRY_BLOB environment/agents/adapters/claude-code/generated/skill-registry.json
