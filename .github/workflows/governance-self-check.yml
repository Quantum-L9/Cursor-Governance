# Closes H-07: the governance repo must govern itself.
name: governance-self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml

      - name: ORG_INVARIANTS.yaml parses
        run: |
          python3 - <<'PY'
          import sys, yaml
          try:
              d = yaml.safe_load(open("ORG_INVARIANTS.yaml"))
          except Exception as e:
              sys.exit("ORG_INVARIANTS.yaml failed to parse: %s" % e)
          if not d:
              sys.exit("ORG_INVARIANTS.yaml is empty")
          print("ok: parsed, %d top-level key(s)" % len(d))
          PY

      - name: Governance SSOT files present
        run: |
          missing=0
          for fp in CANONICAL_LAW.md ORG_INVARIANTS.yaml AGENTS.md CODEOWNERS SECURITY.md; do
            if [ ! -f "$fp" ]; then echo "::error::missing $fp"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok: governance SSOT present"

      - name: Generated-artifact drift (deterministic content, not mtime)
        run: |
          # Regenerate every covered derived artifact and fail closed if the
          # tracked content differs. mtime is not correctness evidence: a stale
          # manifest with a newer timestamp used to pass the old check.
          # Scope the diff to generated *content* files (not env-dependent
          # symlink reconciliation) so the check is deterministic in CI.
          gen=ops/scripts/sync_generated_artifacts.py
          [ -f "$gen" ] || { echo "::error::$gen missing - cannot verify generated artifacts"; exit 1; }
          # --pe-manifest reaches environment/program-execution/MANIFEST.json,
          # which --force alone does not. This is the single enforcement point
          # for that artifact: it is checked here like every other generated
          # file, not by a step in peer-execution.yml.
          python3 "$gen" --force --pe-manifest --check --json
          paths="rules/RULES-MANIFEST.json rules/RULES-MANIFEST.yaml rules/RULES-MANIFEST.md \
                 ops/generated/skill-registry.json \
                 skills/AUTONOMY_MANIFEST.yaml commands/COMMANDS_MANIFEST.yaml \
                 environment/generated/llm-rules \
                 environment/program-execution/core/MANIFEST.yaml \
                 environment/program-execution/MANIFEST.json"
          if ! git diff --quiet -- $paths; then
            echo "::error::generated artifacts are stale - regenerate with 'python3 $gen --force --pe-manifest' and commit"
            git --no-pager diff --stat -- $paths
            exit 1
          fi
          echo "ok: generated content artifacts reproduce with zero diff"

      - name: Rules budget gate
        run: |
          # Fail closed: the validator is mandatory. A missing validator is a
          # build failure, never a silent warning-and-pass.
          v=ops/scripts/check_rules_standard.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: Skills standard gate
        run: |
          v=ops/scripts/check_skills_standard.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: Workflow action pins (third-party = full SHA)
        run: |
          v=ops/scripts/validate_workflow_action_pins.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: MCP config allowlist
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          allowed = {"graphiti-memory"}
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          for path in (".mcp.json", ".cursor/mcp.json"):
              if path not in tracked:
                  continue
              try:
                  servers = json.load(open(path)).get("mcpServers", {})
              except Exception as e:
                  sys.exit("%s invalid JSON: %s" % (path, e))
              unknown = sorted(set(servers) - allowed)
              if unknown:
                  sys.exit("%s declares non-allowlisted MCP server(s): %s"
                           % (path, ", ".join(unknown)))
              print("ok: %s -> %s" % (path, ", ".join(sorted(servers)) or "none"))
          PY

      - name: Secrets never in tracked config
        run: |
          pat='lin_api_|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}'
          if git grep -InE "$pat" -- . ':!*.example' ':!*.template' ':!**/*-pack/**' \
              ':!tools/check_repo_hygiene.py' ':!.github/workflows/governance-self-check.yml'; then
            echo "::error::credential pattern found in tracked files"
            exit 1
          fi
          echo "ok: no credential patterns"
