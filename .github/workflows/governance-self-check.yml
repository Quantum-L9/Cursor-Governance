# Closes H-07: the governance repo must govern itself.
name: governance-self-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  governance-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --only-binary=:all: pyyaml==6.0.3 jsonschema==4.26.0

      - name: Persist canonical repo-docs repair outputs
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${BASE_REF}" "${HEAD_REF}"
          git switch -C repo-docs-repair "origin/${HEAD_REF}"
          git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/pr-changed-files.txt
          gen=ops/scripts/sync_generated_artifacts.py
          python3 "$gen" --changed-file /tmp/pr-changed-files.txt --json
          python -m pip install --only-binary=:all: ruff==0.16.1
          files=(
            skills/l9-update-agent-docs/scripts/doc_obligations.py
            skills/l9-update-agent-docs/scripts/repo_docs.py
            skills/l9-update-agent-docs/scripts/compile_semantic_obligations.py
            skills/l9-update-agent-docs/scripts/validate_pointer_headings.py
            skills/l9-update-agent-docs/tests/test_repo_docs.py
          )
          ruff format "${files[@]}"
          ruff check --fix "${files[@]}" || true
          ruff format "${files[@]}"
          python scripts/generate_subsystem_readmes.py --subsystem skills --skip-time-verify
          git add \
            skills/l9-update-agent-docs/scripts/doc_obligations.py \
            skills/l9-update-agent-docs/scripts/repo_docs.py \
            skills/l9-update-agent-docs/scripts/compile_semantic_obligations.py \
            skills/l9-update-agent-docs/scripts/validate_pointer_headings.py \
            skills/l9-update-agent-docs/tests/test_repo_docs.py \
            skills/README.md \
            ops/generated/skill-registry.json \
            environment/agents/adapters/claude-code/generated/skill-registry.json
          if git diff --cached --quiet; then
            echo "ok: canonical repair outputs already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(repo-docs): apply canonical generated outputs"
            git push origin HEAD:"${HEAD_REF}"
          fi

      - name: ORG_INVARIANTS.yaml parses
        run: |
          python3 - <<'PY'
          import sys, yaml
          try:
              d = yaml.safe_load(open("ORG_INVARIANTS.yaml"))
          except Exception as e:
              sys.exit("ORG_INVARIANTS.yaml failed to parse: %s" % e)
          if not d:
              sys.exit("ORG_INVARIANTS.yaml is empty")
          print("ok: parsed, %d top-level key(s)" % len(d))
          PY

      - name: Governance SSOT files present
        run: |
          missing=0
          for fp in CANONICAL_LAW.md ORG_INVARIANTS.yaml AGENTS.md CODEOWNERS SECURITY.md; do
            if [ ! -f "$fp" ]; then echo "::error::missing $fp"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "ok: governance SSOT present"

      - name: Generated-artifact drift (deterministic content, not mtime)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gen=ops/scripts/sync_generated_artifacts.py
          [ -f "$gen" ] || { echo "::error::$gen missing - cannot verify generated artifacts"; exit 1; }
          paths="rules/RULES-MANIFEST.json rules/RULES-MANIFEST.yaml rules/RULES-MANIFEST.md \
                 ops/generated/skill-registry.json \
                 skills/AUTONOMY_MANIFEST.yaml commands/COMMANDS_MANIFEST.yaml \
                 environment/generated/llm-rules \
                 environment/program-execution/core/MANIFEST.yaml \
                 environment/program-execution/MANIFEST.json"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}"
            git diff --name-only "origin/${BASE_REF}...HEAD" > /tmp/pr-changed-files.txt
            if [ ! -s /tmp/pr-changed-files.txt ]; then
              echo "ok: empty PR file list - skip generated regen"
            elif grep -E -q '^environment/program-execution/' /tmp/pr-changed-files.txt; then
              python3 "$gen" --changed-file /tmp/pr-changed-files.txt --pe-manifest --check --json
            else
              python3 "$gen" --changed-file /tmp/pr-changed-files.txt --check --json
            fi
          else
            python3 "$gen" --force --pe-manifest --check --json
          fi
          if ! git diff --quiet -- $paths; then
            echo "::error::generated artifacts are stale - regenerate with 'python3 $gen --force --pe-manifest' and commit"
            git --no-pager diff --stat -- $paths
            exit 1
          fi
          echo "ok: generated content artifacts reproduce with zero diff"

      - name: Rules budget gate
        run: |
          v=ops/scripts/check_rules_standard.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: Skills standard gate
        run: |
          v=ops/scripts/check_skills_standard.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: Workflow action pins (third-party = full SHA)
        run: |
          v=ops/scripts/validate_workflow_action_pins.py
          [ -f "$v" ] || { echo "::error::mandatory validator $v missing"; exit 1; }
          python3 "$v"

      - name: MCP config allowlist
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          allowed = {"graphiti-memory"}
          tracked = set(subprocess.check_output(["git", "ls-files"], text=True).splitlines())
          for path in (".mcp.json", ".cursor/mcp.json"):
              if path not in tracked:
                  continue
              try:
                  servers = json.load(open(path)).get("mcpServers", {})
              except Exception as e:
                  sys.exit("%s invalid JSON: %s" % (path, e))
              unknown = sorted(set(servers) - allowed)
              if unknown:
                  sys.exit("%s declares non-allowlisted MCP server(s): %s"
                           % (path, ", ".join(unknown)))
              print("ok: %s -> %s" % (path, ", ".join(sorted(servers)) or "none"))
          PY

      - name: Secrets never in tracked config
        run: |
          pat='lin_api_|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}'
          if git grep -InE "$pat" -- . ':!*.example' ':!*.template' ':!**/*-pack/**' \
              ':!tools/check_repo_hygiene.py' ':!.github/workflows/governance-self-check.yml'; then
            echo "::error::credential pattern found in tracked files"
            exit 1
          fi
          echo "ok: no credential patterns"

      - name: Repository documentation obligations (advisory pilot)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_REVISION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tool=skills/l9-update-agent-docs/scripts/repo_docs.py
          receipt=.artifacts/repo-docs-receipt.json
          mkdir -p .artifacts
          [ -f "$tool" ] || {
            echo "::error::mandatory repo-docs compiler $tool missing"
            exit 1
          }

          rc=0
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "${BASE_REF}"
            python3 "$tool" \
              --changed-since "origin/${BASE_REF}" \
              --source-head-sha "$SOURCE_HEAD_SHA" \
              --tested-revision-sha "$TESTED_REVISION_SHA" \
              --receipt "$receipt" \
              --json || rc=$?
          else
            python3 "$tool" \
              --source-head-sha "$TESTED_REVISION_SHA" \
              --tested-revision-sha "$TESTED_REVISION_SHA" \
              --receipt "$receipt" \
              --json || rc=$?
          fi

          python3 - "$receipt" "$rc" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          rc = int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              receipt = json.load(handle)

          status = receipt.get("final_status", "UNKNOWN")
          summary = receipt.get("summary", {})
          semantic = receipt.get("semantic_harvest", {})
          obligations = receipt.get("obligations", [])
          open_rows = [row for row in obligations if not row.get("lifecycle", {}).get("terminal")]
          open_targets = [
              row.get("target", {}).get("path") or f"surface:{row.get('surface', 'UNKNOWN')}"
              for row in open_rows
          ]
          request = semantic.get("request")

          lines = [
              "## Repository documentation obligations",
              "",
              f"- status: `{status}`",
              f"- total obligations: `{summary.get('total', 0)}`",
              f"- open obligations: `{summary.get('open', 0)}`",
              f"- blocked obligations: `{summary.get('blocked', 0)}`",
              f"- awaiting qualification: `{summary.get('awaiting_qualification', 0)}`",
              f"- open targets: `{', '.join(open_targets) or 'none'}`",
              f"- source head: `{receipt.get('revision', {}).get('source_head_sha', 'UNKNOWN')}`",
              f"- tested revision: `{receipt.get('revision', {}).get('tested_revision_sha', 'UNKNOWN')}`",
          ]
          if request:
              lines.append(
                  f"- harvest target: `{request.get('harvest_target', 'UNKNOWN')}`"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")

          if rc == 3:
              print(
                  "::warning::repo-docs found actionable documentation obligations; "
                  "pilot remains advisory"
              )
              raise SystemExit(0)
          if rc != 0:
              print(f"::error::repo-docs compiler failed with status {status}")
              raise SystemExit(rc)
          print(f"ok: repo-docs compiler status {status}")
          PY

      - name: Upload repository documentation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: repo-docs-receipt-${{ github.run_id }}
          path: .artifacts/repo-docs-receipt.json
          if-no-files-found: ignore
          retention-days: 14
