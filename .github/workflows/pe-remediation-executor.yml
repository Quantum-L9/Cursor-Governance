name: PE Remediation Packager

on:
  push:
    branches:
      - fix/pe-confirmed-remediation-cutover

permissions:
  contents: write

env:
  LOCKED_BASE_SHA: "fda7f5fee17ff3f6318942f2826cc3517f1c85b4"
  BRANCH_NAME: "fix/pe-confirmed-remediation-cutover"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=64 origin "${REVISION}" main
          git checkout -B "${BRANCH_NAME}" "${REVISION}"
          git config user.name "l9-pe-remediation-packager"
          git config user.email "l9-pe-remediation-packager@users.noreply.github.com"
          test "$(git rev-parse origin/main)" = "${LOCKED_BASE_SHA}"

      - name: Remove temporary executor scaffolding
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f \
            .github/pe-executor-failure.txt \
            .github/scripts/pe_remediation_apply.py \
            .github/scripts/pe_remediation_post_apply.py \
            .github/scripts/pe_remediation_resume.py \
            .github/workflows/pe-remediation-executor.yml
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(pe): remove temporary remediation executor"
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Build PR pack
        run: |
          set -euo pipefail
          mkdir -p pr-pack/repo-files
          git diff --name-only "${LOCKED_BASE_SHA}..HEAD" > pr-pack/CHANGED_FILES.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ -f "$path" ] || continue
            case "$path" in
              .github/pe-executor-failure.txt|.github/scripts/pe_remediation_*.py|.github/workflows/pe-remediation-executor.yml) continue ;;
            esac
            mkdir -p "pr-pack/repo-files/$(dirname "$path")"
            cp "$path" "pr-pack/repo-files/$path"
          done < pr-pack/CHANGED_FILES.txt
          git diff --binary "${LOCKED_BASE_SHA}..HEAD" > pr-pack/PE_CONFIRMED_REMEDIATION.patch
          cat > pr-pack/PR_BODY.md <<'EOF'
          # PE confirmed remediation cutover

          ## Scope
          - Lock `make campaign` permanently to local-only execution authority.
          - Route the live campaign worker seam through the existing Peer Execution Core.
          - Remove top-level PE `MANIFEST.json` freshness from campaign-promotion blocking while retaining explicit standalone manifest validation/generation.
          - Converge campaign skill/autonomy prose on the separate `make pr` + `/l9-pr-remediation` publication boundary.

          ## Explicitly excluded
          PE-STATE-001 campaign `execute_order` cleanup remains excluded because its canonical replacement order is unresolved.

          ## Validation truth
          The GitHub remediation executor performed multiple focused repair cycles but did not reach its final all-green self-delete step. This pack therefore contains the implementation state and exact patch, not a fabricated PASS receipt. Re-run the normal repository gates before merge.

          ## Required merge gate
          `make pr-check` plus repository CI must be green on the final head before merge.
          EOF
          cat > pr-pack/BASELINE.txt <<EOF
          repository=Quantum-L9/Cursor-Governance
          base_sha=${LOCKED_BASE_SHA}
          branch=${BRANCH_NAME}
          packaged_head=$(git rev-parse HEAD)
          unresolved_scope=PE-STATE-001_execute_order
          EOF
          (cd pr-pack && zip -qr ../pe-confirmed-remediation-pr-pack.zip .)

      - name: Upload PR pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pe-confirmed-remediation-pr-pack
          path: pe-confirmed-remediation-pr-pack.zip
          if-no-files-found: error
          retention-days: 7
