# Lint Autofix — post-merge janitor for main, not the local pre-push
# autofix. Local clean-on-push is `make precommit-repo` (ruff --fix / format).
# This workflow runs after something is already on main and opens a cleanup PR
# if ruff or the generated snapshot still drifts. It never pushes to protected main.
#
# Toolchain matches l9-lint-test.yml: uv sync --locked --extra dev.
# Third-party actions are SHA-pinned (ops/scripts/validate_workflow_action_pins.py).

name: Lint Autofix (Ruff)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-autofix:
    name: Autofix Ruff Lint/Format Violations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked toolchain
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.12.1
          uv sync --locked --no-build --extra dev

      - name: Run Ruff Autofix
        run: |
          set -euo pipefail
          uv run --frozen --no-build ruff check . --fix
          uv run --frozen --no-build ruff format .

      - name: Confirm No Remaining Autofixable Violations
        run: uv run --frozen --no-build ruff check .

      - name: Heal generated artifacts
        run: |
          set -euo pipefail
          uv run --frozen --no-build python ops/scripts/sync_generated_artifacts.py --force --pe-manifest

      - name: Check For Changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: automated ruff + generated-artifact heal"
          title: "Lint Autofix: ruff and generated heal"
          body: |
            ## Automated Lint Autofix + generated heal

            This PR contains automated fixes produced by:

            ```bash
            uv run --frozen --no-build ruff check . --fix
            uv run --frozen --no-build ruff format .
            uv run --frozen --no-build python ops/scripts/sync_generated_artifacts.py --force --pe-manifest
            ```

            on `main`, using the ruff version pinned in `uv.lock`.
            Generated heal is the full snapshot (`--force --pe-manifest`).
            `WIP/**` is already force-excluded by `pyproject.toml`.

            **Review required:** confirm the diff is purely mechanical
            before merging. This is CI automation, not an agent `make pr`
            substitute.

            PRs opened with `GITHUB_TOKEN` do not re-trigger required
            checks (GitHub anti-recursion). Merge only after a follow-up
            token/App run if checks stay empty.

            ---
            *Generated by the Lint Autofix workflow, run ${{ github.run_id }}.*
          branch: lint-autofix/ruff-${{ github.run_number }}
          base: main
          labels: |
            automated
            lint
            ci
          draft: true

      - name: No Changes Needed
        if: steps.diff.outputs.changed == 'false'
        run: echo "ruff and generated snapshot are clean on main — no PR needed."
