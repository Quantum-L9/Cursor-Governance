# Repository-root append-only protection gate.
#
# Fails any pull request that deletes or overwrites existing content in a protected
# root file (ops/config/root-file-protection.json) without an
#   ALLOW-ROOT-DELETION: <path> — <reason>
# marker in a commit message. Purely additive changes and brand-new files pass;
# machine-generated `regenerable` files are exempt. This is the mechanical half of
# the policy — CODEOWNERS + ORG_INVARIANTS.yaml protected_paths supply human review.
#
# Conventions: immutable event-revision checkout (no floating source ref), pinned
# external action SHAs, least-privilege permissions.
name: L9 Root-File Protection

on:
  # No paths filter: "Root-file append-only gate" is a required context in the
  # main-protection ruleset, and a filtered-out workflow never reports it, leaving
  # the PR permanently BLOCKED with nothing to fix. A WIP-only diff touches no root
  # file, so the gate is a cheap trivial pass rather than a missing check.
  pull_request:

permissions:
  contents: read

concurrency:
  group: root-file-protection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  append-only:
    name: Root-file append-only gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout PR head with base history
        env:
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          # Full history for both the PR head and the base branch: the validator
          # relies on `git merge-base` and on scanning every commit message in the PR
          # range for ALLOW-ROOT-DELETION markers, so a shallow fetch could drop older
          # commits (and their markers) and cause false gate failures.
          git -c protocol.version=2 fetch origin "${HEAD_SHA}"
          git -c protocol.version=2 fetch origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git checkout -q --detach "${HEAD_SHA}"
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Append-only gate
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python ops/scripts/validate_root_file_protection.py \
            --base "origin/${BASE_REF}" --head "${HEAD_SHA}"
