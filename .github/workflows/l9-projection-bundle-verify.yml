# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: .github/workflows/l9-projection-bundle-verify.yml
#   layer: operations
#   owner: governance-control-plane
#   status: active
#   version: 2.0.0
#   updated: 2026-10-21
name: L9 Projection Bundle Verify
on:
  pull_request:
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "generated/governance/coding_agent_execution/**"
      - "generated/governance/pr_audit/**"
      - "skills/l9-global-architect/integrations/ARCHITECTURE_INTELLIGENCE_BINDING.yaml"
      - "skills/l9-global-architect/scripts/verify_architecture_intelligence.py"
      - "skills/l9-pr-audit/integrations/CANONICAL_AUTHORITY_BINDING.yaml"
      - "skills/l9-pr-audit/scripts/verify_canonical_authority.py"
      - "skills/l9-coding-agent/integrations/L9_RUNTIME_BINDING.yaml"
      - "skills/l9-coding-agent/scripts/verify_canonical_binding.py"
      - "governance/authority-bindings/coding-agent-execution.yaml"
      - "tools/authority/verify_coding_projection.py"
      - "ops/scripts/coding_projection_status.py"
      - "tools/authority/produce_projection_bundle.py"
      - ".github/workflows/l9-projection-bundle-verify.yml"
  push:
    branches:
      - main
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "generated/governance/coding_agent_execution/**"
      - "generated/governance/pr_audit/**"
      - "skills/l9-global-architect/integrations/ARCHITECTURE_INTELLIGENCE_BINDING.yaml"
      - "skills/l9-global-architect/scripts/verify_architecture_intelligence.py"
      - "skills/l9-pr-audit/integrations/CANONICAL_AUTHORITY_BINDING.yaml"
      - "skills/l9-pr-audit/scripts/verify_canonical_authority.py"
      - "skills/l9-coding-agent/integrations/L9_RUNTIME_BINDING.yaml"
      - "skills/l9-coding-agent/scripts/verify_canonical_binding.py"
      - "governance/authority-bindings/coding-agent-execution.yaml"
      - "tools/authority/verify_coding_projection.py"
      - "ops/scripts/coding_projection_status.py"
      - "tools/authority/produce_projection_bundle.py"
permissions:
  contents: read
concurrency:
  group: l9-projection-bundle-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    # Consumer verification of each committed bundle with its own skill verifier, against
    # Quantum-L9/.github at the exact revision the bundle names; GAR additionally resolves
    # admission against an independently checked-out .github main.
    # Runs pull-request code, so it holds no secret and never touches the private compiler.
    # Producer attestation (byte-for-byte replay with the pinned compiler) runs only in the
    # trusted workflow l9-projection-bundle-trusted-replay.yml.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        bundle: [architecture_intelligence, coding_agent_execution, pr_audit]
    steps:
      - name: Checkout Cursor-Governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install "pyyaml>=6.0,<7"
      - name: Resolve bundle authority revision
        id: lock
        working-directory: governance
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: |
          lock="generated/governance/$BUNDLE/bundle.lock.json"
          if [[ ! -f "$lock" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no $BUNDLE bundle in this tree; nothing to verify"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          revision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["authority"]["revision"])' "$lock")"
          compiler="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["producer"]["revision"])' "$lock")"
          for value in "$revision" "$compiler"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "bundle.lock.json revisions must be full 40-hex SHAs"; exit 1; }
          done
          printf 'revision=%s\ncompiler=%s\n' "$revision" "$compiler" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical Semantic Foundation at the bundle revision
        if: steps.lock.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: ${{ steps.lock.outputs.revision }}
          path: org-authority
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the architecture-intelligence bundle at the revision it names (candidate mode)
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'architecture_intelligence'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REVISION: ${{ steps.lock.outputs.revision }}
        shell: bash
        run: |
          set +e
          python skills/l9-global-architect/scripts/verify_architecture_intelligence.py \
            --mode candidate \
            --authority-root ../org-authority \
            --expect-revision "$REVISION"
          code=$?
          # 5 = BUNDLE_VERIFIED: coherent and current at its revision. Anything else fails.
          [[ $code -eq 5 ]] || exit 1
      - name: Verify the pr-audit bundle at the revision it names (candidate mode)
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'pr_audit'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REVISION: ${{ steps.lock.outputs.revision }}
        shell: bash
        run: |
          set +e
          python skills/l9-pr-audit/scripts/verify_canonical_authority.py \
            --mode candidate \
            --authority-root ../org-authority \
            --expect-revision "$REVISION"
          code=$?
          # 5 = BUNDLE_VERIFIED: coherent and current at its revision. Anything else fails.
          [[ $code -eq 5 ]] || exit 1
      - name: Verify the coding-agent-execution bundle at the revision it names
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'coding_agent_execution'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REVISION: ${{ steps.lock.outputs.revision }}
        shell: bash
        run: |
          # The coding verifier binds law bytes to the pin from commit objects, requires the
          # checkout's HEAD to be the pin (the checkout above is exactly that revision), and
          # refuses a pin no fetched origin ref contains, so the canonical main is fetched first.
          git -C ../org-authority fetch -q origin main
          python skills/l9-coding-agent/scripts/verify_canonical_binding.py \
            --authority-root ../org-authority \
            --bundle generated/governance/coding_agent_execution \
            --expect-revision "$REVISION"
      # Admission is resolved independently of bundle.lock.json by the shared resolver: the
      # verifier reads the tip of Quantum-L9/.github main from its own checkout and judges the
      # binding's owner decision for each exact candidate digest. The owner admitted
      # architecture intelligence on 2026-10-21, so the only passing outcome is
      # ADMITTED_AND_CURRENT (exit 0); a fall back to BUNDLE_VERIFIED (exit 5), REJECTED,
      # BLOCKED or STALE fails the job, and the reason is reported, not hidden.
      - name: Checkout Quantum-L9/.github main independently of the lock
        if: steps.lock.outputs.present == 'true' && (matrix.bundle == 'architecture_intelligence' || matrix.bundle == 'pr_audit')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: main
          path: org-main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve admission against authority main (admitted mode)
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'architecture_intelligence'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          git -C ../org-main update-ref refs/remotes/origin/main HEAD
          set +e
          python skills/l9-global-architect/scripts/verify_architecture_intelligence.py \
            --authority-root ../org-main > admission.json
          code=$?
          set -e
          python -c 'import json,sys; r=json.load(open("admission.json")); print("status:", r["status"], "authority:", r.get("authority_status"), "reason:", r["reason"])' | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $code -eq 0 ]] || exit 1
      - name: Resolve pr-audit admission against authority main (admitted mode)
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'pr_audit'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          git -C ../org-main update-ref refs/remotes/origin/main HEAD
          set +e
          python skills/l9-pr-audit/scripts/verify_canonical_authority.py \
            --authority-root ../org-main > admission.json
          code=$?
          set -e
          python -c 'import json,sys; r=json.load(open("admission.json")); print("status:", r["status"], "authority:", r.get("authority_status"), "reason:", r["reason"])' | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $code -eq 0 ]] || exit 1
      - name: Report the coding projection status against authority main
        if: steps.lock.outputs.present == 'true' && matrix.bundle == 'coding_agent_execution'
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          git -C ../org-authority fetch -q origin main
          main="$(git -C ../org-authority rev-parse refs/remotes/origin/main)"
          python ops/scripts/coding_projection_status.py \
            --authority-root ../org-authority --expect-main "$main" \
            --format line --fail-on BLOCKED,REJECTED | tee -a "$GITHUB_STEP_SUMMARY"
