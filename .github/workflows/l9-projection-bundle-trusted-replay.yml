# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: .github/workflows/l9-projection-bundle-trusted-replay.yml
#   layer: operations
#   owner: governance-control-plane
#   status: active
#   version: 2.0.0
#   updated: 2026-10-21
#
# Trusted producer replay for every consumer-committed projection bundle (Quantum-L9/.github
# ADR-021; GAR AIB-006; coding-agent canonical binding). One definition, one driver
# (tools/authority/produce_projection_bundle.py), one attestation per bundle.
#
# Trust model:
# - pull_request_target and push to main run the definition on the default branch, so pull
#   request authors cannot change what runs here. Nothing from the pull request is checked out
#   or executed: its bundle directory is fetched by plain git and extracted as data.
# - The organization secret GH_TOKEN is used only to check out the private compiler, with
#   persist-credentials false, in a job holding a read-only GITHUB_TOKEN. The private compiler
#   runs only here, only at a SHA reachable from its protected main, and its source never leaves
#   the runner: nothing but the attestation JSON is uploaded.
# - The verdict is posted as a commit status by a separate job that executes no code.
name: L9 Projection Bundle Trusted Replay
on:
  # zizmor flags every pull_request_target. Here it is the point: the definition comes from the
  # default branch, no pull-request code is checked out or executed (the bundle is fetched as
  # data with plain git), the private compiler runs only at a SHA on its protected main, and the
  # job holding GH_TOKEN has a read-only GITHUB_TOKEN.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "generated/governance/coding_agent_execution/**"
  push:
    branches:
      - main
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "generated/governance/coding_agent_execution/**"
      - "tools/authority/produce_projection_bundle.py"
  workflow_dispatch:
    inputs:
      subject_pr:
        description: Trusted replay of this pull request's current head
        required: true
permissions: {}
concurrency:
  group: l9-projection-bundle-trusted-${{ github.event.pull_request.number || inputs.subject_pr || github.ref }}
  cancel-in-progress: false
jobs:
  replay:
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.subject_pr != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: architecture_intelligence
            profile: l9.projection/architecture-intelligence@1
          - bundle: coding_agent_execution
            profile: l9.projection/coding-agent-execution@1
          - bundle: pr_audit
            profile: l9.projection/pr-audit@1
    steps:
      - name: Resolve the subject commit
        id: subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SUBJECT_PR: ${{ inputs.subject_pr }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          PUSH_SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$SUBJECT_PR" =~ ^[0-9]+$ ]] || { echo "subject_pr must be a pull request number"; exit 1; }
            sha="$(gh api "repos/$REPOSITORY/pulls/$SUBJECT_PR" --jq .head.sha)"
            url="$(gh api "repos/$REPOSITORY/pulls/$SUBJECT_PR" --jq .head.repo.clone_url)"
          elif [[ -n "$PR_HEAD_SHA" ]]; then sha="$PR_HEAD_SHA"; url="$PR_HEAD_REPO"
          else sha="$PUSH_SHA"; url="$SERVER/$REPOSITORY.git"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "subject SHA is not a full 40-hex SHA"; exit 1; }
          printf 'sha=%s\nurl=%s\n' "$sha" "$url" >> "$GITHUB_OUTPUT"
      - name: Checkout the trusted producer driver (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Fetch the subject bundle as data (nothing is checked out or executed)
        id: pins
        shell: bash
        env:
          SHA: ${{ steps.subject.outputs.sha }}
          URL: ${{ steps.subject.outputs.url }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          git init -q subject-git
          git -C subject-git fetch -q --no-tags --depth=1 "$URL" "$SHA"
          # A subject without this bundle has nothing to attest for it: the other bundle, or the
          # bootstrap push before any bundle exists, is the event. A present bundle must replay.
          if [[ -z "$(git -C subject-git ls-tree "$SHA" -- "generated/governance/$BUNDLE")" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          bundle="subject/generated/governance/$BUNDLE"
          # The trusted extractor refuses symlinks, gitlinks, executable files and any other
          # non-regular entry before writing a single byte; only 100644 blobs are extracted.
          python3 trusted/tools/authority/extract_bundle_data.py \
            --git-dir subject-git \
            --commit "$SHA" \
            --path "generated/governance/$BUNDLE" \
            --dest "$bundle"
          compiler="$(jq -r '.producer.revision' "$bundle/bundle.lock.json")"
          authority="$(jq -r '.authority.revision' "$bundle/bundle.lock.json")"
          for value in "$compiler" "$authority"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "bundle.lock.json revisions must be full 40-hex SHAs"; exit 1; }
          done
          digest="sha256:$(cd "$bundle" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          printf 'compiler=%s\nauthority=%s\nbundle_digest=%s\n' "$compiler" "$authority" "$digest" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical Semantic Foundation at the bundle revision
        if: steps.pins.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: ${{ steps.pins.outputs.authority }}
          path: authority
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the pinned private compiler
        if: steps.pins.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/l9-semantic-compiler-engine
          ref: ${{ steps.pins.outputs.compiler }}
          path: compiler
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Trust gate (no compiler code runs here)
        id: gate
        if: steps.pins.outputs.present == 'true'
        shell: bash
        env:
          PIN: ${{ steps.pins.outputs.compiler }}
          AUTHORITY: ${{ steps.pins.outputs.authority }}
        run: |
          head="$(git -C compiler rev-parse HEAD)"
          [[ "$head" == "$PIN" ]] || { echo "compiler HEAD $head is not the pinned $PIN"; exit 1; }
          if git -C compiler merge-base --is-ancestor "$PIN" refs/remotes/origin/main; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "compiler $PIN is not reachable from the compiler's protected main; it is not executed"
          fi
          # The authority pin is as untrusted as the compiler pin: only canonical Semantic
          # Foundation on Quantum-L9/.github's protected main is replayed.
          if git -C authority merge-base --is-ancestor "$AUTHORITY" refs/remotes/origin/main; then
            echo "authority_trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "authority_trusted=false" >> "$GITHUB_OUTPUT"
            echo "authority $AUTHORITY is not reachable from Quantum-L9/.github protected main"
          fi
          if [[ -f trusted/tools/authority/produce_projection_bundle.py ]]; then
            echo "driver=true" >> "$GITHUB_OUTPUT"
          else
            echo "driver=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.gate.outputs.trusted == 'true' && steps.gate.outputs.authority_trusted == 'true' && steps.gate.outputs.driver == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the trusted compiler
        if: steps.gate.outputs.trusted == 'true' && steps.gate.outputs.authority_trusted == 'true' && steps.gate.outputs.driver == 'true'
        run: python -m pip install "pyyaml>=6.0,<7" ./compiler
      - name: Replay byte for byte with the trusted driver (subject bundle is data)
        id: replay
        if: steps.gate.outputs.trusted == 'true' && steps.gate.outputs.authority_trusted == 'true' && steps.gate.outputs.driver == 'true'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AUTHORITY: ${{ steps.pins.outputs.authority }}
          COMPILER: ${{ steps.pins.outputs.compiler }}
          PROFILE: ${{ matrix.profile }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set +e
          python trusted/tools/authority/produce_projection_bundle.py \
            --profile "$PROFILE" \
            --authority-root authority \
            --authority-revision "$AUTHORITY" \
            --compiler-revision "$COMPILER" \
            --compiler l9-semantic-compiler \
            --output "subject/generated/governance/$BUNDLE" \
            --check
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Write the attestation
        id: attest
        if: always()
        shell: bash
        env:
          PRESENT: ${{ steps.pins.outputs.present }}
          TRUSTED: ${{ steps.gate.outputs.trusted }}
          AUTHORITY_TRUSTED: ${{ steps.gate.outputs.authority_trusted }}
          DRIVER: ${{ steps.gate.outputs.driver }}
          REPLAY_EXIT: ${{ steps.replay.outputs.exit }}
          SUBJECT: ${{ steps.subject.outputs.sha }}
          COMPILER: ${{ steps.pins.outputs.compiler }}
          AUTHORITY: ${{ steps.pins.outputs.authority }}
          DIGEST: ${{ steps.pins.outputs.bundle_digest }}
          DRIVER_REF: ${{ github.sha }}
          BUNDLE: ${{ matrix.bundle }}
          PROFILE: ${{ matrix.profile }}
        run: |
          if [[ "$PRESENT" == "false" ]]; then verdict=NOT_APPLICABLE; reason=BUNDLE_ABSENT_IN_SUBJECT
          elif [[ "$TRUSTED" != "true" ]]; then verdict=FAIL; reason=COMPILER_NOT_ON_PROTECTED_MAIN
          elif [[ "$AUTHORITY_TRUSTED" != "true" ]]; then verdict=FAIL; reason=AUTHORITY_NOT_ON_PROTECTED_MAIN
          elif [[ "$DRIVER" != "true" ]]; then verdict=FAIL; reason=TRUSTED_DRIVER_ABSENT
          elif [[ "$REPLAY_EXIT" == "0" ]]; then verdict=PASS; reason=BYTE_FOR_BYTE_MATCH
          else verdict=FAIL; reason=REPLAY_MISMATCH_OR_ERROR; fi
          if [[ "$verdict" != "NOT_APPLICABLE" ]]; then
            [[ -n "$COMPILER" && -n "$AUTHORITY" && -n "$DIGEST" ]] || { verdict=FAIL; reason=SUBJECT_UNRESOLVED; }
          fi
          jq -n --arg verdict "$verdict" --arg reason "$reason" --arg subject "$SUBJECT" \
            --arg compiler "$COMPILER" --arg authority "$AUTHORITY" --arg digest "$DIGEST" \
            --arg driver "$DRIVER_REF" --arg compiler_main "${TRUSTED:-false}" \
            --arg authority_main "${AUTHORITY_TRUSTED:-false}" \
            --arg bundle "$BUNDLE" --arg profile "$PROFILE" \
            '{schema: "l9.projection-bundle-replay-attestation/v1", bundle: $bundle, profile: $profile,
              verdict: $verdict, reason: $reason, subject_sha: $subject, compiler_sha: $compiler,
              compiler_on_protected_main: ($compiler_main == "true"), authority_revision: $authority,
              authority_on_protected_main: ($authority_main == "true"), bundle_digest: $digest,
              trusted_driver_sha: $driver}' \
            > "$RUNNER_TEMP/attestation.json"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/attestation.json"
          printf 'verdict=%s\nreason=%s\n' "$verdict" "$reason" >> "$GITHUB_OUTPUT"
      - name: Upload the attestation (no source)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: projection-bundle-replay-attestation-${{ matrix.bundle }}
          path: ${{ runner.temp }}/attestation.json
          retention-days: 30
          if-no-files-found: error
      - name: Fail closed unless the replay passed
        if: always()
        shell: bash
        env:
          VERDICT: ${{ steps.attest.outputs.verdict }}
        run: '[[ "$VERDICT" == "PASS" || "$VERDICT" == "NOT_APPLICABLE" ]]'
  status:
    # Executes no code from any checkout: it only publishes each replay verdict on the exact
    # subject commit, one commit status per bundle, so a branch-protection rule can require it.
    needs: replay
    if: always() && needs.replay.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        bundle: [architecture_intelligence, coding_agent_execution, pr_audit]
    steps:
      - name: Read this bundle's attestation (the uploaded JSON, fetched over the API)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          name="projection-bundle-replay-attestation-$BUNDLE"
          id="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | .id" | head -n1)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "no attestation artifact named $name on run $RUN_ID"; exit 1; }
          gh api "repos/$REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/attestation.zip"
          mkdir -p "$RUNNER_TEMP/attestation"
          unzip -q -o "$RUNNER_TEMP/attestation.zip" attestation.json -d "$RUNNER_TEMP/attestation"
      - name: Publish the attestation as a commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUNDLE: ${{ matrix.bundle }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          attestation="$RUNNER_TEMP/attestation/attestation.json"
          verdict="$(jq -r '.verdict' "$attestation")"
          [[ "$verdict" != "NOT_APPLICABLE" ]] || { echo "no $BUNDLE bundle in the subject; no status"; exit 0; }
          subject="$(jq -r '.subject_sha' "$attestation")"
          [[ "$subject" =~ ^[0-9a-f]{40}$ ]] || { echo "attestation names no subject"; exit 1; }
          reason="$(jq -r '.reason' "$attestation")"
          compiler="$(jq -r '.compiler_sha' "$attestation")"
          authority="$(jq -r '.authority_revision' "$attestation")"
          state=failure; [[ "$verdict" == "PASS" ]] && state=success
          gh api --method POST "repos/$REPOSITORY/statuses/$subject" \
            -f state="$state" \
            -f context="l9/projection-bundle-trusted-replay/$BUNDLE" \
            -f target_url="$RUN_URL" \
            -f description="${verdict:-FAIL} ${reason:-UNRESOLVED} compiler ${compiler:0:12} authority ${authority:0:12}"
