# --- L9_META ---
# l9_schema: 1
# artifact_type: ci_workflow
# component: codeql_code_quality_reusable
# tags: [ci, codeql, code-quality, security, governance, quantum-l9, reusable]
# retrieval: on_demand
# status: active
# --- /L9_META ---
#
# Quantum-L9 org-wide CodeQL analysis, exposed as a REUSABLE workflow.
# Single source of truth: every L9 repo calls this via a ~18-line thin caller
# (see docs/handoffs/codeql-caller-template.yml). Consumers pin a reviewed
# commit; releases propagate through deliberate pin updates, never a mutable
# branch reference.
#
# Portable by design: the `detect` job resolves the analysis matrix from the
# caller repo's actual language composition and assigns a per-language
# build-mode (interpreted -> none, compiled -> autobuild), so no standalone
# autobuild step is needed and repos with no CodeQL-supported source are skipped.
#
# Unknown is not empty: a failed or malformed language lookup fails `detect`.
# Only a successful lookup that names no CodeQL-supported language skips
# analysis, and the step prints the languages it saw as the evidence.

name: "CodeQL reusable (security + code quality)"

on:
  workflow_call:
    inputs:
      config-file:
        description: "CodeQL config (owner/repo/path@ref or local path)."
        type: string
        required: false
        default: "Quantum-L9/Cursor-Governance/.github/codeql/codeql-config.yml@52d87ce2e217c16a96f0ef131f4da097ef7cd5e2"
      runner:
        description: "Runner label."
        type: string
        required: false
        default: "ubuntu-latest"

jobs:
  detect:
    name: Detect CodeQL languages
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.langs.outputs.matrix }}
      empty: ${{ steps.langs.outputs.empty }}
    steps:
      - name: Resolve analyzable languages + build modes
        id: langs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
        run: |
          set -euo pipefail
          # A failed lookup is unknown, never "nothing to analyze".
          if ! DETECTED=$(curl -sfS --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/repos/${REPO}/languages"); then
            echo "::error::CodeQL language lookup failed for ${REPO}: the language set is unknown, so analysis cannot be skipped as not applicable."
            exit 1
          fi
          export DETECTED
          MATRIX=$(python3 - <<'PY'
          import json, os, sys
          try:
              data = json.loads(os.environ["DETECTED"])
          except (KeyError, ValueError):
              data = None
          if not isinstance(data, dict):
              print("::error::CodeQL language lookup returned no JSON object: the language set is unknown.", file=sys.stderr)
              sys.exit(1)
          print(f"languages reported by GitHub: {sorted(data)}", file=sys.stderr)
          # GitHub Linguist language name -> CodeQL language id.
          lang_map = {
              "Python": "python",
              "JavaScript": "javascript-typescript",
              "TypeScript": "javascript-typescript",
              "Java": "java-kotlin",
              "Kotlin": "java-kotlin",
              "C": "c-cpp",
              "C++": "c-cpp",
              "C#": "csharp",
              "Go": "go",
              "Ruby": "ruby",
              "Swift": "swift",
          }
          # interpreted -> no build; compiled -> autobuild (keeps this portable
          # to any future L9 repo without a per-repo edit).
          build_mode = {
              "python": "none",
              "javascript-typescript": "none",
              "ruby": "none",
              "java-kotlin": "autobuild",
              "c-cpp": "autobuild",
              "csharp": "autobuild",
              "go": "autobuild",
              "swift": "autobuild",
          }
          langs = sorted({lang_map[k] for k in data if k in lang_map})
          include = [{"language": l, "build-mode": build_mode[l]} for l in langs]
          print(json.dumps({"include": include}))
          PY
          )
          echo "resolved matrix: ${MATRIX}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          if [ "${MATRIX}" = '{"include": []}' ] || [ "${MATRIX}" = '{"include":[]}' ]; then
            echo "not applicable: the lookup succeeded and named no CodeQL-supported language"
            echo "empty=true" >> "${GITHUB_OUTPUT}"
          else
            echo "empty=false" >> "${GITHUB_OUTPUT}"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.empty == 'false'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write   # required to upload CodeQL results
      actions: write           # required to save the overlay-base database
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ inputs.config-file }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
