name: Validate organization policy

on:
  pull_request:
    paths:
      - ORG_INVARIANTS.yaml
      - governance/ASSERTION_TYPES.yaml
      - governance/POLICY_MODEL.md
      - governance/TRUST_MODEL.md
      - governance/CHANGE_PROCESS.md
      - schemas/org-invariants.schema.json
      - releases/POLICY_RELEASE.schema.yaml
      - releases/README.md
      - docs/governance/ORG_INVARIANTS.md
      - ops/scripts/validate_org_policy.py
      - tests/org_policy/**
      - .github/workflows/validate-org-policy.yml
  push:
    branches:
      - main
    paths:
      - ORG_INVARIANTS.yaml
      - governance/ASSERTION_TYPES.yaml
      - schemas/org-invariants.schema.json
      - releases/POLICY_RELEASE.schema.yaml
      - ops/scripts/validate_org_policy.py
      - tests/org_policy/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-org-policy:
    name: validate-org-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: |
          set -euo pipefail
          # PyYAML is a core [project.dependencies] entry locked in uv.lock. Sync the
          # locked environment and run through `uv run` so this validator consumes the
          # same pyyaml as every other path (test job, make venv), instead of pinning a
          # divergent version (was PyYAML==6.0.2 vs uv.lock's 6.0.3) outside the lock.
          python -m pip install --upgrade pip
          command -v uv >/dev/null 2>&1 || pip install uv
          uv sync --locked
      - name: Validate normative policy artifacts
        run: uv run --no-build python ops/scripts/validate_org_policy.py
      - name: Run organization-policy tests
        run: uv run --no-build python -m unittest discover -s tests/org_policy -p 'test_*.py'
