# Memory cross-repo proof — required, never skippable (audit P2-02 / P1-01).
#
# Proves this Cursor-Governance head against the EXACT memory runtime the
# binding manifest names (ops/config/memory-binding.json, source.ref):
#
#   1. resolve source.ref on the memory remote — a release tag is peeled with
#      git ls-remote, a bare SHA is taken as is — and refuse any commit other
#      than release_evidence.memory_sha (a moved tag fails here, never rebinds);
#      then clone Quantum-L9/l9-graphiti-memory at that immutable SHA
#   2. rebuild its wheel with the memory release recipe at the fixed
#      SOURCE_DATE_EPOCH (scripts/build_release_artifacts.sh: python -m build,
#      then tools/assurance/reproducible_artifacts.py canonicalize) and refuse
#      a digest that differs from release_evidence.artifact_sha256. The
#      binding's build_backend_constraint must equal that source's
#      [build-system] requires pin. uv build --wheel --build-constraint does
#      not reproduce the admitted wheel. A mismatch fails.
#   3. install that wheel with its `postgres` extra (held to uv.lock, as
#      pyproject.toml composes it) into a clean environment and bind it through
#      L9_MEMORY_INTERPRETER (runtime_mode=pinned_environment) — never a
#      development checkout, never whatever l9-memory is on PATH
#   4. run tests/ops/memory/test_cross_repo_lifecycle.py with
#      L9_MEMORY_CROSS_REPO_REQUIRED=1 (an absent runtime FAILS, never skips)
#      after asserting no provider connection variable is in the environment
#      (the suite additionally strips them from the runtime's child env)
#   5. record Cursor SHA, memory SHA, package version, wheel digest and the
#      test outcome in the job summary and as an artifact
#
# The memory repository is private. The clone is one non-persisted
# actions/checkout of Quantum-L9/l9-graphiti-memory with GH_TOKEN, the same
# credential the trusted private checkouts in this repository already use.
# L9_GITHUB_READ_TOKEN stays out of this pull_request workflow: that secret is
# the projection credential and a pull-request shell step can print it
# (run 44396822814 skipped the proof because the workflow token cannot see
# this private repository and git reports that as "repository not found").
# There is no workflow-token fallback. An empty or unauthorized GH_TOKEN
# fails the checkout, and the job fails with it.
#
# The proof is blocking. MEMORY_PROOF_ADVISORY is "false", so a failed step
# fails the job. The wheel step runs the memory repository's
# scripts/build_release_artifacts.sh at release_evidence.source_date_epoch.
# That recipe, not `uv build --build-constraint`, produced the admitted
# artifact_sha256. A digest mismatch fails the job.
name: Memory Cross-Repo Proof

on:
  # No paths filter, deliberately: a required context that never reports
  # leaves the PR blocked forever (see l9-lint-test.yml).
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-cross-repo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # "false" = a failed proof step fails the job. Do not set this back to
  # "true": advisory mode reported success while the proof steps were skipped.
  MEMORY_PROOF_ADVISORY: "false"

jobs:
  proof:
    name: Exact-head memory lifecycle proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked governance toolchain
        run: |
          set -euo pipefail
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.12.1
          uv sync --locked --no-build --extra dev

      - name: Read the binding manifest
        id: binding
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          d = json.load(open("ops/config/memory-binding.json"))
          ev = d.get("release_evidence") or {}
          missing = [k for k in ("memory_sha", "artifact_sha256", "source_date_epoch", "artifact", "build_backend_constraint") if k not in ev]
          if missing:
              raise SystemExit(f"memory-binding.json release_evidence is missing {missing}")
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          if not sha_re.match(ev["memory_sha"]):
              raise SystemExit("release_evidence.memory_sha must be a full 40-hex commit SHA")
          ref = d["source"]["ref"]
          if sha_re.match(ref) and ref != ev["memory_sha"]:
              raise SystemExit("release_evidence.memory_sha does not equal source.ref — rebind before proving")
          if not sha_re.match(ref) and not re.match(r"^v\d+\.\d+\.\d+$", ref):
              raise SystemExit(f"source.ref {ref!r} is neither a full commit SHA nor a release tag (vX.Y.Z); floating refs are forbidden")
          print(f"repository={d['source']['repository']}")
          print(f"ref={ref}")
          print(f"memory_sha={ev['memory_sha']}")
          print(f"version={d['expected_package_version']}")
          print(f"artifact={ev['artifact']}")
          print(f"sha256={ev['artifact_sha256']}")
          print(f"epoch={ev['source_date_epoch']}")
          if not re.match(r"^setuptools==\d+(\.\d+)*$", ev["build_backend_constraint"]):
              raise SystemExit("release_evidence.build_backend_constraint must pin one exact setuptools version")
          print(f"build_constraint={ev['build_backend_constraint']}")
          PY

      - name: Clone the bound memory ref without persisting credentials
        if: steps.binding.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/l9-graphiti-memory
          ref: ${{ steps.binding.outputs.ref }}
          fetch-depth: 1
          path: memory-src
          persist-credentials: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Refuse a moved tag or a checkout that is not the bound SHA
        id: memory_src
        if: steps.binding.outcome == 'success'
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        env:
          MEMORY_REPO: ${{ steps.binding.outputs.repository }}
          MEMORY_REF: ${{ steps.binding.outputs.ref }}
          MEMORY_SHA: ${{ steps.binding.outputs.memory_sha }}
        run: |
          set -euo pipefail
          # The checkout above is hardcoded to the memory repository. A binding
          # that names anything else never receives the credential.
          if [ "${MEMORY_REPO}" != "Quantum-L9/l9-graphiti-memory" ]; then
            echo "::error::binding repository ${MEMORY_REPO} is not Quantum-L9/l9-graphiti-memory"
            exit 1
          fi
          # actions/checkout peels an annotated tag. HEAD is that commit, so a
          # tag that no longer points at release_evidence.memory_sha fails here.
          # A missing ref fails the checkout itself. No credential is in this step.
          actual="$(git -C memory-src rev-parse HEAD)"
          if [ "${actual}" != "${MEMORY_SHA}" ]; then
            echo "::error::binding ref ${MEMORY_REF} checked out ${actual}, release_evidence.memory_sha is ${MEMORY_SHA} — the tag moved or the manifest is stale"
            exit 1
          fi
          echo "resolved_sha=${actual}" >> "$GITHUB_OUTPUT"

      - name: Build the memory wheel reproducibly and verify its digest
        id: wheel
        if: steps.memory_src.outcome == 'success'
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        env:
          EXPECTED_SHA256: ${{ steps.binding.outputs.sha256 }}
          EXPECTED_ARTIFACT: ${{ steps.binding.outputs.artifact }}
          SOURCE_DATE_EPOCH: ${{ steps.binding.outputs.epoch }}
          BUILD_CONSTRAINT: ${{ steps.binding.outputs.build_constraint }}
          SRC: ${{ github.workspace }}/memory-src
        run: |
          set -euo pipefail
          src="${GITHUB_WORKSPACE}/memory-src"
          # uv build --build-constraint does not reproduce the admitted wheel.
          # The one recipe is the memory repository's release script. The
          # constraint stays an exact setuptools== pin and must be the pin
          # that script's isolated build will resolve.
          python3 -c 'import os, sys, tomllib; from pathlib import Path
          reqs = tomllib.loads((Path(os.environ["SRC"]) / "pyproject.toml").read_text())["build-system"]["requires"]
          want = os.environ["BUILD_CONSTRAINT"]
          if reqs != [want]:
              sys.exit("build-system requires %r, binding constraint is %s" % (reqs, want))'
          frontend="${RUNNER_TEMP}/memory-build-frontend"
          uv venv "${frontend}" --python "${PYTHON_VERSION}"
          uv pip install --python "${frontend}/bin/python" "build>=1.2,<2"
          out="${RUNNER_TEMP}/memory-wheel"
          SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            PYTHON="${frontend}/bin/python" \
            bash "${src}/scripts/build_release_artifacts.sh" "${out}"
          wheel="${out}/${EXPECTED_ARTIFACT}"
          if [ ! -f "${wheel}" ]; then
            echo "::error::expected artifact ${EXPECTED_ARTIFACT} was not built; got: $(ls "${out}")"
            exit 1
          fi
          actual="$(sha256sum "${wheel}" | awk '{print $1}')"
          echo "sha256=${actual}" >> "$GITHUB_OUTPUT"
          echo "path=${wheel}" >> "$GITHUB_OUTPUT"
          if [ "${actual}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::wheel digest ${actual} does not match release_evidence.artifact_sha256 ${EXPECTED_SHA256}"
            exit 1
          fi
          echo "wheel ${EXPECTED_ARTIFACT} sha256 ${actual} matches the binding"

      - name: Install the pinned wheel into a clean environment
        id: install
        if: steps.wheel.outcome == 'success'
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
          EXPECTED_VERSION: ${{ steps.binding.outputs.version }}
        run: |
          set -euo pipefail
          uv venv "${RUNNER_TEMP}/memory-venv" --python "${PYTHON_VERSION}"
          # Same composition as pyproject.toml: the release's own postgres
          # extra, every dependency held to its uv.lock version (a constraint
          # pins a version, it never adds a package).
          uv export --frozen --no-hashes --no-emit-project --no-header --no-dev \
            -o "${RUNNER_TEMP}/memory-locked-constraints.txt"
          uv pip install --python "${RUNNER_TEMP}/memory-venv/bin/python" \
            --constraints "${RUNNER_TEMP}/memory-locked-constraints.txt" "${WHEEL}[postgres]"
          bound="$("${RUNNER_TEMP}/memory-venv/bin/python" -c 'import importlib.metadata as m; print(m.version("l9-graphite-memory"))')"
          if [ "${bound}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::installed l9-graphite-memory ${bound}, binding expects ${EXPECTED_VERSION}"
            exit 1
          fi
          test -x "${RUNNER_TEMP}/memory-venv/bin/l9-memory"
          echo "L9_MEMORY_INTERPRETER=${RUNNER_TEMP}/memory-venv/bin/python" >> "$GITHUB_ENV"
          echo "MEMORY_BOUND_VERSION=${bound}" >> "$GITHUB_ENV"

      - name: Prove the binding
        id: prove_binding
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        run: |
          set -euo pipefail
          uv run --frozen --no-build python -m ops.memory.diagnostics --binding-only

      - name: Run the exact-head lifecycle proof (required, no skip, no provider env)
        id: lifecycle
        if: steps.prove_binding.outcome == 'success'
        continue-on-error: ${{ env.MEMORY_PROOF_ADVISORY == 'true' }}
        env:
          L9_MEMORY_CROSS_REPO_REQUIRED: "1"
          L9_MEMORY_CROSS_REPO_EVIDENCE: ${{ runner.temp }}/memory-cross-repo-proof.json
          L9_MEMORY_WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The point of the proof: no provider connection material reaches the
          # memory path. The runner defines none; refuse to proceed if any
          # provider-prefixed variable is present rather than silently unsetting it.
          if env | grep -q '^GRAPHITI_MCP_'; then
            echo "::error::a provider connection variable is present in the job environment"
            exit 1
          fi
          uv run --frozen --no-build python -m pytest \
            tests/ops/memory/test_cross_repo_lifecycle.py \
            -p no:cacheprovider -rA \
            --junitxml "${RUNNER_TEMP}/memory-cross-repo-junit.xml"
          python3 - "${RUNNER_TEMP}/memory-cross-repo-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped} failures={failures}")
          if tests < 2 or skipped or failures:
              raise SystemExit("cross-repo proof did not run every case to a pass")
          PY

      - name: Report the advisory verdict
        if: always() && env.MEMORY_PROOF_ADVISORY == 'true'
        env:
          BINDING: ${{ steps.binding.outcome }}
          MEMORY_SRC: ${{ steps.memory_src.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          PROVE_BINDING: ${{ steps.prove_binding.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
        run: |
          set -euo pipefail
          # Pass only when every tracked step succeeded: a step skipped because a
          # prerequisite (checkout, Python, toolchain) failed is not a pass.
          failed=""
          incomplete=""
          for pair in "binding:${BINDING}" "memory_src:${MEMORY_SRC}" "wheel:${WHEEL}" \
                      "install:${INSTALL}" "prove_binding:${PROVE_BINDING}" "lifecycle:${LIFECYCLE}"; do
            outcome="${pair#*:}"
            if [ "${outcome}" = "failure" ] && [ -z "${failed}" ]; then
              failed="${pair%%:*}"
            elif [ "${outcome}" != "success" ] && [ -z "${incomplete}" ]; then
              incomplete="${pair%%:*} (${outcome:-not run})"
            fi
          done
          if [ -n "${failed}" ]; then
            msg="ADVISORY: memory cross-repo proof FAILED at step '${failed}' (not blocking; MEMORY_PROOF_ADVISORY=true). See that step's log."
            echo "::warning title=Memory cross-repo proof (advisory)::${msg}"
          elif [ -n "${incomplete}" ]; then
            msg="ADVISORY: memory cross-repo proof did NOT complete: step ${incomplete}; an earlier prerequisite step failed. See the job log."
            echo "::warning title=Memory cross-repo proof (advisory)::${msg}"
          else
            msg="ADVISORY: memory cross-repo proof passed every step."
          fi
          { echo "## Memory cross-repo proof — advisory"; echo; echo "${msg}"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the proof
        if: always()
        env:
          CURSOR_SHA: ${{ github.sha }}
          MEMORY_REPO: ${{ steps.binding.outputs.repository }}
          MEMORY_REF: ${{ steps.binding.outputs.ref }}
          MEMORY_SHA: ${{ steps.binding.outputs.memory_sha }}
          RESOLVED_SHA: ${{ steps.memory_src.outputs.resolved_sha }}
          EXPECTED_VERSION: ${{ steps.binding.outputs.version }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
          ARTIFACT: ${{ steps.binding.outputs.artifact }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/memory-cross-repo-proof.json"
          {
            echo "## Memory cross-repo proof"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Cursor-Governance head | \`${CURSOR_SHA}\` |"
            echo "| Memory repository | \`${MEMORY_REPO}\` |"
            echo "| Memory ref (binding source.ref) | \`${MEMORY_REF}\` |"
            echo "| Memory head (release_evidence.memory_sha) | \`${MEMORY_SHA}\` (resolved on the remote: \`${RESOLVED_SHA:-not resolved}\`) |"
            echo "| Package version | \`${MEMORY_BOUND_VERSION:-unbound}\` (binding expects \`${EXPECTED_VERSION}\`) |"
            echo "| Artifact | \`${ARTIFACT}\` |"
            echo "| Artifact sha256 (rebuilt here) | \`${WHEEL_SHA256:-not built}\` |"
            echo "| Runtime mode | pinned_environment (L9_MEMORY_INTERPRETER) |"
            echo "| Provider env | no provider connection variable present (asserted before the proof) |"
            echo "| Job outcome | ${OUTCOME} |"
            echo
            if [ -f "${evidence}" ]; then
              echo '```json'
              cat "${evidence}"
              echo '```'
            else
              echo "_no proof record written — the suite did not bind a runtime_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the proof record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: memory-cross-repo-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/memory-cross-repo-proof.json
            ${{ runner.temp }}/memory-cross-repo-junit.xml
          if-no-files-found: warn
