# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: .github/workflows/l9-architecture-intelligence-bundle.yml
#   layer: operations
#   owner: governance-control-plane
#   status: active
#   version: 1.0.0
#   updated: 2026-10-15
name: L9 Architecture Intelligence Bundle
on:
  pull_request:
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "skills/l9-global-architect/integrations/ARCHITECTURE_INTELLIGENCE_BINDING.yaml"
      - "skills/l9-global-architect/scripts/verify_architecture_intelligence.py"
      - "tools/authority/produce_architecture_intelligence.py"
      - ".github/workflows/l9-architecture-intelligence-bundle.yml"
  push:
    branches:
      - main
    paths:
      - "generated/governance/architecture_intelligence/**"
      - "skills/l9-global-architect/integrations/ARCHITECTURE_INTELLIGENCE_BINDING.yaml"
      - "skills/l9-global-architect/scripts/verify_architecture_intelligence.py"
      - "tools/authority/produce_architecture_intelligence.py"
  repository_dispatch:
    types:
      - l9-semantic-authority-updated
  workflow_dispatch:
    inputs:
      authority_ref:
        description: Quantum-L9/.github revision to produce from (full 40-hex SHA)
        required: true
      compiler_ref:
        description: Quantum-L9/l9-semantic-compiler-engine revision (full 40-hex SHA)
        required: true
permissions:
  contents: read
concurrency:
  group: l9-architecture-intelligence-bundle
  cancel-in-progress: false
jobs:
  compiler-source:
    # Credential isolation. This job is the only place the organization secret GH_TOKEN (the
    # write-capable org automation PAT, SSOT AWS openclaw-igorbot/github#token; see
    # Quantum-L9/.github docs/DISTRIBUTION.md) is read on pull requests. It executes no code from
    # the pull request: it reads the pinned compiler SHA from bundle.lock.json with jq (data, not
    # code), checks out Quantum-L9/l9-semantic-compiler-engine at exactly that SHA with
    # persist-credentials false, proves HEAD equals the pin, and hands an archive of the source to
    # the verify job, which holds no secret. Fork pull requests receive no secrets, so the
    # checkout fails and the workflow fails closed.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compiler: ${{ steps.pin.outputs.compiler }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout Cursor-Governance (data only; nothing from it is executed)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          persist-credentials: false
      - name: Read the pinned compiler SHA
        id: pin
        shell: bash
        run: |
          compiler="$(jq -r '.producer.revision' governance/generated/governance/architecture_intelligence/bundle.lock.json)"
          [[ "$compiler" =~ ^[0-9a-f]{40}$ ]] || { echo "producer.revision must be a full 40-hex SHA"; exit 1; }
          printf 'compiler=%s\n' "$compiler" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned canonical compiler (exact SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/l9-semantic-compiler-engine
          ref: ${{ steps.pin.outputs.compiler }}
          path: compiler
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Prove the checkout is the pinned SHA and archive it
        id: archive
        shell: bash
        env:
          PINNED: ${{ steps.pin.outputs.compiler }}
        run: |
          head="$(git -C compiler rev-parse HEAD)"
          [[ "$head" == "$PINNED" ]] || { echo "compiler HEAD $head is not the pinned $PINNED"; exit 1; }
          git -C compiler archive --format=tar -o "$RUNNER_TEMP/compiler.tar" HEAD
          sha="$(sha256sum "$RUNNER_TEMP/compiler.tar" | cut -d' ' -f1)"
          printf 'sha256=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "compiler checkout: Quantum-L9/l9-semantic-compiler-engine@$head (archive sha256 $sha)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hand the compiler source to the verify job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compiler-source
          path: ${{ runner.temp }}/compiler.tar
          retention-days: 1
          if-no-files-found: error
  verify:
    # Consumer verification of the committed bundle: GAR's verifier and currentness against
    # Quantum-L9/.github at the exact revision the bundle names, then byte-for-byte reproduction
    # with the compiler revision the bundle names (production attestation).
    # Holds no secret: it runs pull-request code (the verifier and the producer driver), so the
    # compiler source arrives as an artifact from compiler-source, checked against its digest.
    needs: compiler-source
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Cursor-Governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install "pyyaml>=6.0,<7"
      - name: Resolve bundle authority revision
        id: lock
        working-directory: governance
        shell: bash
        run: |
          revision="$(python -c 'import json; print(json.load(open("generated/governance/architecture_intelligence/bundle.lock.json"))["authority"]["revision"])')"
          compiler="$(python -c 'import json; print(json.load(open("generated/governance/architecture_intelligence/bundle.lock.json"))["producer"]["revision"])')"
          for value in "$revision" "$compiler"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "bundle.lock.json revisions must be full 40-hex SHAs"; exit 1; }
          done
          printf 'revision=%s\ncompiler=%s\n' "$revision" "$compiler" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical Semantic Foundation at the bundle revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: ${{ steps.lock.outputs.revision }}
          path: org-authority
          fetch-depth: 1
          persist-credentials: false
      - name: Verify bundle at the revision it names (candidate mode)
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REVISION: ${{ steps.lock.outputs.revision }}
        shell: bash
        run: |
          set +e
          python skills/l9-global-architect/scripts/verify_architecture_intelligence.py \
            --mode candidate \
            --authority-root ../org-authority \
            --expect-revision "$REVISION"
          code=$?
          # 5 = BUNDLE_VERIFIED: coherent and current at its revision. Anything else fails.
          [[ $code -eq 5 ]] || exit 1
      # Admission is resolved independently of bundle.lock.json: the verifier reads the tip of
      # Quantum-L9/.github main from its own checkout. Before admission the expected outcome is
      # BUNDLE_VERIFIED with authority status NOT_ADMITTED or ADMISSION_UNRESOLVED (exit 5),
      # which is reported, not hidden; REJECTED, BLOCKED and STALE fail the job.
      - name: Checkout Quantum-L9/.github main independently of the lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: main
          path: org-main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve admission against authority main (admitted mode)
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          git -C ../org-main update-ref refs/remotes/origin/main HEAD
          set +e
          python skills/l9-global-architect/scripts/verify_architecture_intelligence.py \
            --authority-root ../org-main > admission.json
          code=$?
          set -e
          python -c 'import json,sys; r=json.load(open("admission.json")); print("status:", r["status"], "authority:", r.get("authority_status"), "reason:", r["reason"])' | tee -a "$GITHUB_STEP_SUMMARY"
          [[ $code -eq 0 || $code -eq 5 ]] || exit 1
      # The verifier's digests are recomputable, so they prove integrity, not who produced the
      # bytes. Production is proven by reproducing the committed bundle byte for byte with the
      # pinned compiler. If the compiler cannot be obtained, compiler-source fails and this job
      # never runs: an unreproduced bundle is never accepted.
      - name: Receive the pinned compiler source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: compiler-source
          path: ${{ runner.temp }}/compiler-source
      - name: Check the compiler source digest and pin
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.compiler-source.outputs.archive_sha256 }}
          FETCHED: ${{ needs.compiler-source.outputs.compiler }}
          PINNED: ${{ steps.lock.outputs.compiler }}
        run: |
          [[ "$FETCHED" == "$PINNED" ]] || { echo "fetched compiler $FETCHED is not the pinned $PINNED"; exit 1; }
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/compiler-source/compiler.tar" | sha256sum --check --strict
          mkdir -p compiler
          tar -xf "$RUNNER_TEMP/compiler-source/compiler.tar" -C compiler
      - name: Install compiler
        run: python -m pip install ./compiler
      - name: Reproduce bundle with the pinned compiler
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          REVISION: ${{ steps.lock.outputs.revision }}
          COMPILER: ${{ steps.lock.outputs.compiler }}
        run: |
          python tools/authority/produce_architecture_intelligence.py \
            --authority-root ../org-authority \
            --authority-revision "$REVISION" \
            --compiler-revision "$COMPILER" \
            --compiler l9-semantic-compiler \
            --check
  refresh:
    # Producer regeneration, dispatch-only, so every step runs default-branch code. It reads the
    # private Quantum-L9/l9-semantic-compiler-engine with the organization secret GH_TOKEN
    # (persist-credentials false); without it this job fails closed at checkout. GAR never
    # produces the bundle.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve revisions
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AUTHORITY_REF: ${{ inputs.authority_ref }}
          INPUT_COMPILER_REF: ${{ inputs.compiler_ref }}
          PAYLOAD_AUTHORITY_REF: ${{ github.event.client_payload.authority_ref }}
          PAYLOAD_COMPILER_REF: ${{ github.event.client_payload.compiler_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            authority="$INPUT_AUTHORITY_REF"; compiler="$INPUT_COMPILER_REF"
          else
            authority="$PAYLOAD_AUTHORITY_REF"; compiler="$PAYLOAD_COMPILER_REF"
          fi
          for value in "$authority" "$compiler"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "revisions must be full 40-hex SHAs"; exit 1; }
          done
          printf 'authority=%s\ncompiler=%s\n' "$authority" "$compiler" >> "$GITHUB_OUTPUT"
      - name: Checkout Cursor-Governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          fetch-depth: 0
      - name: Checkout canonical Semantic Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: ${{ steps.refs.outputs.authority }}
          path: org-authority
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout canonical compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/l9-semantic-compiler-engine
          ref: ${{ steps.refs.outputs.compiler }}
          path: compiler
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install compiler
        run: python -m pip install ./compiler
      - name: Produce bundle with the canonical compiler
        working-directory: governance
        env:
          AUTHORITY: ${{ steps.refs.outputs.authority }}
          COMPILER: ${{ steps.refs.outputs.compiler }}
        run: |
          python tools/authority/produce_architecture_intelligence.py \
            --authority-root ../org-authority \
            --authority-revision "$AUTHORITY" \
            --compiler-revision "$COMPILER" \
            --compiler l9-semantic-compiler
      - name: Verify bundle as GAR consumes it
        working-directory: governance
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AUTHORITY: ${{ steps.refs.outputs.authority }}
        run: |
          set +e
          python skills/l9-global-architect/scripts/verify_architecture_intelligence.py \
            --mode candidate \
            --authority-root ../org-authority \
            --expect-revision "$AUTHORITY"
          [[ $? -eq 5 ]] || exit 1
      - name: Detect bundle change
        id: diff
        working-directory: governance
        shell: bash
        run: |
          git add -N generated/governance/architecture_intelligence
          if git diff --quiet -- generated/governance/architecture_intelligence; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit regenerated bundle
        if: steps.diff.outputs.changed == 'true'
        id: branch
        working-directory: governance
        shell: bash
        env:
          AUTHORITY: ${{ steps.refs.outputs.authority }}
          COMPILER: ${{ steps.refs.outputs.compiler }}
          DRIVER: ${{ github.sha }}
        run: |
          # One immutable branch per (authority, compiler, driver) triple: the governance revision
          # pins the producer driver. The producer is byte-deterministic for that triple (--check),
          # so an existing branch already carries this bundle: it is never rewritten, and nothing
          # is ever force-pushed.
          branch="automation/architecture-intelligence-${AUTHORITY:0:12}-${COMPILER:0:12}-${DRIVER:0:12}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; not rewriting it"
            exit 0
          fi
          git config user.name "quantum-l9-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add generated/governance/architecture_intelligence
          git commit -m "chore(governance): produce architecture intelligence bundle"
          git push origin "$branch"
      - name: Open bundle pull request
        if: steps.diff.outputs.changed == 'true'
        working-directory: governance
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          AUTHORITY: ${{ steps.refs.outputs.authority }}
          COMPILER: ${{ steps.refs.outputs.compiler }}
        shell: bash
        run: |
          existing="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(governance): produce architecture intelligence bundle" \
            --body "Compiler-produced architecture intelligence bundle from Quantum-L9/.github@$AUTHORITY with l9-semantic-compiler@$COMPILER. Verified by GAR's consumer verifier. Do not edit the bundle by hand."
