# L9 consumer lint + test workflow — adopted from l9-ci-core v2's
# docs/templates/l9-lint-test.yml (docs/consumer-lint-test.md). Generic
# ruff/mypy/pytest hygiene is owned by the consuming repo, not l9-ci-core
# (its workflow set is frozen by tests/workflows/test_phase_scope.py to the
# Phase 1-4 SDK-orchestration set only). This file is copied, not called.
#
# v2 conventions preserved:
#   - immutable event-revision checkout (no floating action ref for source)
#   - external actions pinned to full commit SHAs
#   - explicit least-privilege permissions (contents: read, no write scopes)
name: L9 Lint and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# ── Consumer config ─────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  # Used by the lint job's mypy step. Test-suite topology, coverage output, and
  # the advisory coverage threshold now live in ops/config/python-contract.json
  # (root CI profile), consumed by ops/scripts/run_python_test_suites.py.
  SOURCE_DIR: "."

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
          command -v ruff >/dev/null 2>&1 || pip install ruff
          command -v mypy >/dev/null 2>&1 || pip install mypy
          command -v uv >/dev/null 2>&1 || pip install uv
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        # Advisory only (2026-07-28): 328 pre-existing type errors across 15 files
        # (see TODO.md "mypy debt") predate this step ever going green — ruff was
        # failing first and always short-circuited the job before mypy ran, so this
        # never actually gated anything. continue-on-error keeps the signal visible
        # in the Actions UI without blocking merges until the debt pass lands.
        continue-on-error: true
        run: |
          mypy "${SOURCE_DIR}" \
            --show-error-codes --pretty \
            --install-types --non-interactive --ignore-missing-imports
      - name: uv lock --check (lockfile drift guard)
        # Independent, second check of the same invariant ops/scripts/backup_to_github.sh
        # now enforces before every automated commit — catches uv.lock drift introduced
        # through any path (not just that script), on every push to main.
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "::notice::no uv.lock present, skipping lockfile drift check"
          fi
      - name: Conflict-marker scan (repo-wide fast-detection tripwire)
        # ops/scripts/backup_to_github.sh and ops/scripts/governance_sync.sh push
        # directly to main with no PR/branch-protection gate, so this job cannot
        # block a bad commit before it lands — it's a fast-detection tripwire that
        # fires on every push, not a merge blocker. Mirrors the grep pattern used
        # to verify Part A of this fix (unresolved <<<<<<<// =======/>>>>>>> markers).
        run: |
          set -euo pipefail
          if git grep -n -I -E '^(<<<<<<<|=======$|>>>>>>>)' -- . \
              ':!**/_archived/**' ':!**/_archive/**' ':!**/archive/**' ':!**/archived/**'; then
            echo "::error::Conflict markers found in tracked files (see above)."
            exit 1
          fi
          echo "OK: no conflict markers found"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test tools
        run: |
          set -euo pipefail
          # [tool.uv] package = false — this repo is not an installable package, so
          # `pip install -e ".[dev]"` cannot install [project.dependencies]. Own
          # project + dev deps via the lockfile (same as `make venv`). pytest-xdist
          # and pytest-timeout are pinned in the dev extra and locked in uv.lock,
          # so no floating fallback install is needed or permitted.
          python -m pip install --upgrade pip
          command -v uv >/dev/null 2>&1 || pip install uv
          uv sync --locked --extra dev
      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          # Single canonical entrypoint. Suite topology (root, Claude Code
          # autonomy, subagent-generated-data Wave 3, Program Execution
          # controller), PYTHONPATH isolation, exit-5 handling, coverage output
          # (root CI profile: --cov / --cov-report=xml / --cov-fail-under), and
          # per-test timeouts are all declared once in
          # ops/config/python-contract.json and applied by the runner's ci
          # profile. The runner runs the read-only drift validator first, so any
          # dependency/CI/registry divergence fails this job before suites run.
          uv run --no-build python ops/scripts/run_python_test_suites.py --profile ci
