# L9 consumer lint + test workflow — adopted from l9-ci-core v2's
# docs/templates/l9-lint-test.yml (docs/consumer-lint-test.md). Generic
# ruff/mypy/pytest hygiene is owned by the consuming repo, not l9-ci-core
# (its workflow set is frozen by tests/workflows/test_phase_scope.py to the
# Phase 1-4 SDK-orchestration set only). This file is copied, not called.
#
# v2 conventions preserved:
#   - immutable event-revision checkout (no floating action ref for source)
#   - external actions pinned to full commit SHAs
#   - explicit least-privilege permissions (contents: read, no write scopes)
name: L9 Lint and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# ── Consumer config ─────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "."
  # No tests/ convention yet (2 test_*.py files total); pytest discovers from
  # root, scoped by [tool.pytest.ini_options] norecursedirs in pyproject.toml.
  TEST_DIR: "."
  # Advisory only — no meaningful coverage baseline exists yet for this repo.
  COVERAGE_THRESHOLD: "0"

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
          command -v ruff >/dev/null 2>&1 || pip install ruff
          command -v mypy >/dev/null 2>&1 || pip install mypy
          command -v uv >/dev/null 2>&1 || pip install uv
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        # Advisory only (2026-07-28): 328 pre-existing type errors across 15 files
        # (see TODO.md "mypy debt") predate this step ever going green — ruff was
        # failing first and always short-circuited the job before mypy ran, so this
        # never actually gated anything. continue-on-error keeps the signal visible
        # in the Actions UI without blocking merges until the debt pass lands.
        continue-on-error: true
        run: |
          mypy "${SOURCE_DIR}" \
            --show-error-codes --pretty \
            --install-types --non-interactive --ignore-missing-imports
      - name: uv lock --check (lockfile drift guard)
        # Independent, second check of the same invariant ops/scripts/backup_to_github.sh
        # now enforces before every automated commit — catches uv.lock drift introduced
        # through any path (not just that script), on every push to main.
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "::notice::no uv.lock present, skipping lockfile drift check"
          fi
      - name: Conflict-marker scan (repo-wide fast-detection tripwire)
        # ops/scripts/backup_to_github.sh and ops/scripts/governance_sync.sh push
        # directly to main with no PR/branch-protection gate, so this job cannot
        # block a bad commit before it lands — it's a fast-detection tripwire that
        # fires on every push, not a merge blocker. Mirrors the grep pattern used
        # to verify Part A of this fix (unresolved <<<<<<<// =======/>>>>>>> markers).
        run: |
          set -euo pipefail
          if git grep -n -I -E '^(<<<<<<<|=======$|>>>>>>>)' -- . \
              ':!**/_archived/**' ':!**/_archive/**' ':!**/archive/**' ':!**/archived/**'; then
            echo "::error::Conflict markers found in tracked files (see above)."
            exit 1
          fi
          echo "OK: no conflict markers found"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi
          pip install -e ".[dev]" || pip install -e . || \
            echo "::notice::no local editable package to install"
          command -v pytest >/dev/null 2>&1 || pip install pytest
          python -c "import pytest_cov" 2>/dev/null || pip install pytest-cov
          python -c "import xdist" 2>/dev/null || pip install pytest-xdist
          python -c "import pytest_timeout" 2>/dev/null || pip install pytest-timeout
          # The editable install above fails on this repo's flat multi-directory
          # layout (setuptools can't auto-discover a single package) and falls
          # through to the notice, so [project.dependencies] never actually get
          # installed. langgraph is optional at import time (workflows/__init__.py
          # feature-detects it) but must be present for workflows/dags/*_dag.py
          # tests to collect and exercise the LangGraph-backed code paths.
          # Exact-pinned (not >=) per SonarCloud's "lock resolved versions" security
          # rule; kept in sync with the langgraph entry in uv.lock, the single
          # resolved-version source of truth for this repo's [project.dependencies].
          python -c "import langgraph" 2>/dev/null || pip install --only-binary :all: "langgraph==1.2.9"
      - name: pytest with coverage
        env:
          TESTING: "true"
        run: |
          # GitHub Actions runs `bash -e {0}` for this step regardless of any
          # `set` call inside the script, so `pytest ... || status=$?` (not a
          # bare command) is required to capture a non-zero exit without
          # errexit aborting the script before the status check below runs.
          #
          # Root autonomy/ shadows environment/claude-code/autonomy (same package
          # name). Run the repo suite first, then the Claude Code suite with a
          # dedicated PYTHONPATH — see ops/scripts/run_pytest_suites.sh.
          status=0
          PYTHONPATH=. pytest "${TEST_DIR}" \
            --ignore=environment/claude-code/autonomy \
            -n auto \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice::repo pytest suite collected zero tests (exit 5)"
            status=0
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          PYTHONPATH=environment/claude-code pytest \
            environment/claude-code/autonomy/tests \
            -o addopts= \
            -n auto \
            --timeout=300 --tb=short -v || status=$?
          status=${status:-0}
          if [ "$status" -eq 5 ]; then
            echo "::notice::Claude Code autonomy suite collected zero tests (exit 5)"
            exit 0
          fi
          exit "$status"
