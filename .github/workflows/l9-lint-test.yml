# L9 consumer lint + test workflow — adopted from l9-ci-core v2's
# docs/templates/l9-lint-test.yml (docs/consumer-lint-test.md). Generic
# ruff/mypy/pytest hygiene is owned by the consuming repo, not l9-ci-core
# (its workflow set is frozen by tests/workflows/test_phase_scope.py to the
# Phase 1-4 SDK-orchestration set only). This file is copied, not called.
#
# v2 conventions preserved:
#   - immutable event-revision checkout (no floating action ref for source)
#   - external actions pinned to full commit SHAs
#   - explicit least-privilege permissions (contents: read, no write scopes)
name: L9 Lint and Test

on:
  # No pull_request paths filter, deliberately. "Lint and Type Check" and "Test
  # Suite" are required contexts in the main-protection ruleset, and a filtered-out
  # workflow never reports its contexts at all — the PR sits BLOCKED forever with no
  # failing check to fix (PR #136 was stuck exactly this way).
  pull_request:
  # Merge queue: "Lint and Type Check" and "Test Suite" are required contexts and
  # must report on the queued merge commit (github.sha). There Test Suite runs the
  # same bounded selection as on pull_request and push (`make test-fast`).
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  # The whole registry suite (--profile ci) runs nightly and on demand, never on
  # pull_request, merge_group or push (issue #1162: Core's required expense judge
  # must prove every test run on those events BOUNDED).
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

# ── Consumer config ─────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  # SOURCE_DIR scopes the lint job's mypy run. Test-suite topology, per-suite
  # PYTHONPATH, coverage output, and the advisory coverage threshold are NOT set
  # here — they are declared once in ops/config/python-contract.json and executed
  # by ops/scripts/run_python_test_suites.py (the ci profile keeps root coverage.xml
  # + term-missing and the advisory 0% threshold).
  SOURCE_DIR: "."

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: |
          set -euo pipefail
          # Single locked toolchain — ruff/mypy (and their type stubs) are exact-pinned
          # in [project.optional-dependencies].dev and uv.lock. Sync the locked env
          # (same as `make venv` and the test job) instead of floating `pip install
          # ruff/mypy`, so CI-lint runs the same versions as local `make lint` and the
          # lock authority. The uv bootstrap is version-pinned and wheels-only; `uv sync`
          # uses --no-build and every `uv run` uses --frozen --no-build, so dependency
          # installation never resolves an unlocked version or builds from source
          # (SonarCloud githubactions S8541/S8544). `python -m pip` targets the
          # setup-python interpreter this job runs on.
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.13.8
          uv sync --locked --no-build --extra dev
      - name: Controller manifest guard
        # Cheap call of the existing controller validator. The template tree is
        # not edited here, and a digest mismatch is not rewritten green.
        run: |
          set -euo pipefail
          .venv/bin/python \
            environment/program-execution/core/program-execution-controller-template/scripts/validate_controller.py \
            environment/program-execution/core/program-execution-controller-template \
            --mode template
      - name: ruff check
        run: uv run --frozen --no-build ruff check . --output-format=github
      - name: ruff format --check
        run: uv run --frozen --no-build ruff format --check .
      - name: mypy
        # Advisory only (2026-07-28): 328 pre-existing type errors across 15 files
        # (see TODO.md "mypy debt") predate this step ever going green — ruff was
        # failing first and always short-circuited the job before mypy ran, so this
        # never actually gated anything. continue-on-error keeps the signal visible
        # in the Actions UI without blocking merges until the debt pass lands.
        continue-on-error: true
        run: |
          # Locked mypy==2.3.0 with type stubs (types-PyYAML, types-jsonschema) already
          # provided by the dev extra — no `--install-types` network fetch needed. Mirrors
          # `make lint-mypy`.
          uv run --frozen --no-build mypy "${SOURCE_DIR}" \
            --show-error-codes --pretty \
            --ignore-missing-imports
      - name: uv lock --check (lockfile drift guard)
        # Independent, second check of the same invariant ops/scripts/backup_to_github.sh
        # now enforces before every automated commit — catches uv.lock drift introduced
        # through any path (not just that script), on every push to main.
        run: |
          set -euo pipefail
          if [ -f uv.lock ]; then
            uv lock --check
          else
            echo "::notice::no uv.lock present, skipping lockfile drift check"
          fi
      - name: Conflict-marker scan (repo-wide fast-detection tripwire)
        # ops/scripts/backup_to_github.sh and ops/scripts/governance_sync.sh push
        # directly to main with no PR/branch-protection gate, so this job cannot
        # block a bad commit before it lands — it's a fast-detection tripwire that
        # fires on every push, not a merge blocker. Mirrors the grep pattern used
        # to verify Part A of this fix (unresolved <<<<<<<// =======/>>>>>>> markers).
        run: |
          set -euo pipefail
          # Scratch/reference trees are git-tracked but must not trip this
          # scan on mixed PRs.
          if git grep -n -I -E '^(<<<<<<<|=======$|>>>>>>>)' -- . \
              ':!**/_archived/**' ':!**/_archive/**' ':!**/archive/**' ':!**/archived/**' \
              ':!**/current_work/**' ':!**/C_GOV_FILES/**' ':!**/reports/**'; then
            echo "::error::Conflict markers found in tracked files (see above)."
            exit 1
          fi
          echo "OK: no conflict markers found"

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test tools
        run: |
          set -euo pipefail
          # [tool.uv] package = false — this repo is not an installable package, so
          # `pip install -e ".[dev]"` cannot install [project.dependencies]. Own
          # project + dev deps via the lockfile (same as `make venv`). pytest-xdist
          # and pytest-timeout are now exact-pinned in the dev extra and uv.lock, so
          # there is no floating fallback install — the locked sync provides them. The uv
          # bootstrap is version-pinned and wheels-only; the sync uses --no-build and every
          # `uv run` uses --frozen --no-build (SonarCloud S8541/S8544). `python -m pip`
          # targets the setup-python interpreter this job runs on.
          command -v uv >/dev/null 2>&1 || python -m pip install --only-binary=:all: uv==0.13.8
          # One owner of the Test Suite environment: ensure_gov_python.sh ->
          # ensure_uv_environment.sh runs the locked sync AND writes the readiness
          # state the repository's own gates read (.venv/.l9-uv-fingerprint, the
          # memory artifact seal, the import verification). A raw sync here built
          # the venv but left that state absent, so the first repository test to
          # reach run_pr_gate.sh -> ensure_gov_python.sh re-entered sync + seal
          # (force-reinstall of the memory wheel) under live xdist workers:
          # .venv/bin/python3 vanished mid-run, L9_MEMORY_INTERPRETER unbound, and
          # unrelated parallel tests failed together. In CI the wrapper keeps the
          # actions/setup-python interpreter (no --managed-python).
          bash ops/scripts/ensure_gov_python.sh "$PWD"
      # pull_request, merge_group and push run the bounded selection: `make
      # test-fast` -> Repo.mk repo-test-fast, a literal list of test paths that
      # Core's required expense judge proves BOUNDED (issue #1162). It is the same
      # selection Core's repository verification runs on those events.
      - name: pytest bounded selection (make test-fast)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          TESTING: "true"
        run: make --no-print-directory test-fast
      # The whole registry suite runs nightly (schedule) and on demand
      # (workflow_dispatch) only. The registry-driven runner executes every active
      # suite (root, Claude Code autonomy, subagent-generated-data Wave 3, Program
      # Execution controller) with the per-suite PYTHONPATH, profiles, coverage and
      # exit-5 handling declared in ops/config/python-contract.json, and runs the
      # fail-closed drift validator first. The runner itself still refuses
      # --profile ci on a pull_request.
      #
      # Invoked with the locked interpreter the install step verified, not
      # `uv run`: `uv run --frozen` re-syncs the project environment first, and
      # it treats the memory wheel the seal just pip-installed from its hashed URL
      # as not matching the lock's path source, so it reinstalls that wheel and
      # erases the PEP 610 seal. The first repository test to reach
      # run_pr_gate.sh -> ensure_gov_python.sh would then re-seal with
      # `pip install --force-reinstall` under live xdist workers.
      - name: pytest full suite with coverage (nightly and on demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TESTING: "true"
        run: .venv/bin/python ops/scripts/run_python_test_suites.py --profile ci
