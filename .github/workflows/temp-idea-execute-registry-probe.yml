name: temp-idea-execute-registry-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Install generator dependency
        run: python -m pip install --only-binary=:all: pyyaml==6.0.3
      - name: Regenerate and print authoritative registry values
        run: |
          python3 ops/scripts/build_claude_skill_registry.py --root .
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("ops/generated/skill-registry.json").read_text())
          record = next(item for item in data["skills"] if item["name"] == "l9-idea-execute")
          print("PROBE_GENERATION_ID=" + data["generation_id"])
          print("PROBE_CORPUS_SHA=" + data["source_skill_corpus_sha256"])
          print("PROBE_SKILL_SHA=" + record["skill_sha256"])
          print("PROBE_DESCRIPTION=" + json.dumps(record["description"], ensure_ascii=True))
          PY
