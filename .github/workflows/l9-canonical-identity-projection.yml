# L9_META
#   l9_schema: 1
#   repo: Quantum-L9/Cursor-Governance
#   path: .github/workflows/l9-canonical-identity-projection.yml
#   layer: operations
#   owner: governance-control-plane
#   status: active
#   version: 2.0.0
#   updated: 2026-11-21
#
# Detection only. Scheduled and dispatched runs regenerate the projection in the runner,
# report the diff, and fail when the committed projection differs from Quantum-L9/.github.
# This workflow never commits, pushes or opens a pull request (operator decision
# 2026-11-21: no bot PRs). An agent regenerates and publishes through make pr.
name: L9 Canonical Identity Projection
on:
  pull_request:
    paths:
      - "environment/agents/agent_registry.yaml"
      - "governance/authority-bindings/canonical-agent-identity.yaml"
      - "generated/governance/canonical_identity.yaml"
      - "generated/governance/canonical_identity.receipt.yaml"
      - "tools/authority/project_canonical_identity.py"
      - "tools/assurance/check_canonical_identity_projection.py"
      - "rules/64-canonical-identity-authority.mdc"
      - ".github/workflows/l9-canonical-identity-projection.yml"
      - "governance/authority-bindings/coding-agent-execution.yaml"
      - "tools/authority/verify_coding_projection.py"
      - "ops/scripts/coding_projection_status.py"
  push:
    branches:
      - main
    paths:
      - "environment/agents/agent_registry.yaml"
      - "governance/authority-bindings/canonical-agent-identity.yaml"
      - "generated/governance/canonical_identity.yaml"
      - "generated/governance/canonical_identity.receipt.yaml"
      - "tools/authority/project_canonical_identity.py"
      - "tools/assurance/check_canonical_identity_projection.py"
      - "governance/authority-bindings/coding-agent-execution.yaml"
      - "tools/authority/verify_coding_projection.py"
      - "ops/scripts/coding_projection_status.py"
  repository_dispatch:
    types:
      - l9-semantic-authority-updated
  workflow_dispatch:
    inputs:
      authority_ref:
        description: Quantum-L9/.github revision to project
        required: true
        default: main
  schedule:
    - cron: "29 */6 * * *"
permissions:
  contents: read
concurrency:
  group: l9-canonical-identity-projection
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cursor-Governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout canonical Semantic Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: main
          path: org-authority
          # Full history: --check accepts a projection committed at an earlier
          # authority revision only after proving that revision is an ancestor of
          # main and replaying the committed bytes from it. A shallow checkout
          # cannot prove provenance and fails closed.
          fetch-depth: 0
          # Quantum-L9/.github is private: a pull-request workflow may hold exactly one
          # secret, this read-only token scoped to that repository, never persisted
          # (docs/DEGRADED_MODE_CONTRACT.md, 2026-11-16; the bundle contract tests pin it).
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install "pyyaml>=6.0,<7"
      - name: Verify projection matches canonical authority
        working-directory: governance
        run: |
          python tools/authority/project_canonical_identity.py \
            --authority-root ../org-authority \
            --check
      - name: Verify downstream governing binding
        working-directory: governance
        run: |
          python tools/assurance/check_canonical_identity_projection.py
      - name: Verify the coding projection as a consumer (report-only)
        working-directory: governance
        run: |
          # Cursor-Governance verifies l9-semantic-compiler pairs from the
          # Quantum-L9/.github projections branch; it never produces them. The
          # fresh main checkout is the independent record CURRENT requires.
          # BLOCKED (tamper, forgery, wrong producer role) fails. UNVERIFIED (no
          # pair published yet) and STALE (upstream moved after publication)
          # are annotated, not this PR's failure. fetch-depth: 0 above already
          # brings every branch, projections included when it exists.
          main="$(git -C ../org-authority rev-parse HEAD)"
          rc=0
          line="$(python ops/scripts/coding_projection_status.py \
            --authority-root ../org-authority --expect-main "$main" \
            --format line --fail-on BLOCKED)" || rc=$?
          echo "$line"
          case "$line" in
            *": STALE "*) echo "::warning::$line" ;;
            *": UNVERIFIED "*) echo "::notice::$line" ;;
          esac
          exit "$rc"
  refresh:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cursor-Governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: governance
          fetch-depth: 0
          # Nothing is pushed from this job, so no credential is kept.
          persist-credentials: false
      - name: Resolve authority revision
        id: authority
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_AUTHORITY_REF: ${{ inputs.authority_ref }}
          PAYLOAD_AUTHORITY_REF: ${{ github.event.client_payload.authority_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'ref=%s\n' "$INPUT_AUTHORITY_REF" >> "$GITHUB_OUTPUT"
          elif [[ -n "$PAYLOAD_AUTHORITY_REF" ]]; then
            printf 'ref=%s\n' "$PAYLOAD_AUTHORITY_REF" >> "$GITHUB_OUTPUT"
          else
            printf 'ref=main\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout canonical Semantic Foundation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/.github
          ref: ${{ steps.authority.outputs.ref }}
          path: org-authority
          fetch-depth: 1
          # Quantum-L9/.github is private (2026-11-16): this repo's GITHUB_TOKEN cannot
          # read it. Trusted triggers only (schedule / dispatch), never persisted.
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install "pyyaml>=6.0,<7"
      - name: Generate canonical identity projection
        working-directory: governance
        run: |
          python tools/authority/project_canonical_identity.py \
            --authority-root ../org-authority
      - name: Verify generated governing projection
        working-directory: governance
        run: |
          python tools/assurance/check_canonical_identity_projection.py
      - name: Fail when the committed projection is stale
        working-directory: governance
        shell: bash
        run: |
          # Detection only: the regenerated bytes live in this runner and are discarded.
          # A difference means Quantum-L9/.github moved past the committed projection;
          # an agent regenerates with tools/authority/project_canonical_identity.py and
          # publishes through make pr.
          authority_sha="$(git -C ../org-authority rev-parse HEAD)"
          paths=(generated/governance/canonical_identity.yaml
                 generated/governance/canonical_identity.receipt.yaml)
          if git diff --quiet -- "${paths[@]}"; then
            echo "canonical identity projection is current at Quantum-L9/.github@$authority_sha" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Canonical identity projection is STALE"
            echo
            echo "Quantum-L9/.github@$authority_sha differs from the committed projection."
            echo "Regenerate with \`tools/authority/project_canonical_identity.py\` and publish through \`make pr\`."
            echo
            echo '```diff'
            git diff --stat -- "${paths[@]}"
            git diff -- "${paths[@]}" | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::canonical identity projection is stale against Quantum-L9/.github@$authority_sha"
          exit 1
