#
# Shared CodeQL configuration for pull requests and pushes to main.
# Portable by design: contains no repo-specific paths or languages.
#
# This file intentionally sets no queries and no query-filters. The CodeQL
# action disables overlay analysis (NonDefaultQueries) when either key is
# present, and overlay is what lets a pull request reuse the main database
# and extract only changed files. The default suite is the high-precision
# security suite. security-extended runs from codeql-config-nightly.yml.

name: "L9 CodeQL config (default suite)"

# Directories that are never source-of-truth for L9 repos. Kept generic so the
# same ignore list is valid whether a repo ships Python, shell, or config only.
paths-ignore:
  - "**/archive/**"
  - "**/_archive/**"
  - "**/_archived/**"
  - "**/archived/**"
  - "**/current_work/**"
  - "**/C_GOV_FILES/**"
  - "**/reports/**"
  - "**/__pycache__/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/vendor/**"
  - "**/*.min.js"
  - "**/tests/**"
  - "**/test/**"
  - "**/test_*.py"
  - "**/*_test.py"
