{
  "schema": "l9.finding-policy/v1",
  "metadata": {
    "version": "1.0.0",
    "status": "authoritative"
  },
  "defaults": {
    "mode": "unresolved"
  },
  "rules": {
    "python.lang.security.audit.dangerous-subprocess-use-tainted-env-args.dangerous-subprocess-use-tainted-env-args": {
      "policy_key": "L9-PYTHON-DANGEROUS-SUBPROCESS-USE-TAINTED-ENV-ARGS",
      "mode": "blocking",
      "note": "Fires on ops/scripts/reconcile_llm_skill_adapters.py, which builds an argv list from resolved paths and calls subprocess.run WITHOUT shell=True, so the injection this audit rule looks for is not reachable there. Kept blocking rather than demoted: the pattern is worth a human look wherever else it appears, and blocking does not redden the check on its own."
    }
  },
  "note": "How much each Semgrep finding counts in this repository. Consumed by the pinned l9-ci-sdk, selected through the sdk_policy field of quality-thresholds.yaml (Core resolves the path; the SDK owns the semantics). Stored as JSON because Core's resolve-governance validates the SDK policy as a JSON document; JSON is also valid YAML, so the .yaml filename and every YAML reader keep working. Rules are keyed by native Semgrep check_id, the same key used in semgrep-identity-map.yaml; policy_key mirrors that file's canonical_rule_id. defaults.mode unresolved is deliberate and fail-closed: a rule with no entry is not silently defaulted and fails the strict run. Pair every identity-map addition with an entry here. Mode does not decide whether the analysis job passes: the pinned Core publication maps a successful analyze job to a successful check regardless of mode; mode drives the check body, annotations and promotion tracking. Promotion between modes is governed by promotion-policy.yaml."
}
