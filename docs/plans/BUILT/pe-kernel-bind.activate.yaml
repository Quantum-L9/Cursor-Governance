campaign_id: pe-kernel-bind
title: Bind control-plane kernels onto PE campaign transitions
owner: Igor Beylin
objective: 'Edit existing Cursor-Governance PE files so kernels compile into adapter, schema,
  refuse-stub, verify verdicts, DoD, and Diagnose First. Write two constellation ADRs. Workers
  get a short ticket only. One front door. No new runner stage. Context is reserved for the work.

  '
problem_statement: 'Combined intent from plan.pe.kernel-bind.v1 and the ADR addendum. Kernels
  compile; they do not run. Edit existing PE compile, pec verify, pec complete, run_campaign,
  worker brief, and decision records.

  '
target:
  repository_id: Quantum-L9/Cursor-Governance
  source_of_truth: environment/program-execution
  adapter: git
tasks:
- title: Write constellation ADRs 0023 and 0024
  objective: 'Edit existing decision catalog. Canonical ADR-0023 kernels compile they do not run
    and ADR-0024 worker context is the ticket, plus docs/decisions pointers. Re-probe the next
    free number if 0023 is taken. Comment only where a pointer is required.

    '
  paths:
  - environment/contracts/execution/adr/ADR-0023-kernels-compile-they-do-not-run.md
  - environment/contracts/execution/adr/ADR-0024-worker-context-is-the-ticket.md
  - docs/decisions/ADR-0023-kernels-compile-they-do-not-run.md
  - docs/decisions/ADR-0024-worker-context-is-the-ticket.md
  actions:
  - create_adr_0023_canonical_and_pointer
  - create_adr_0024_canonical_and_pointer
  - cite_adr_0010_and_adr_0022
  nugget_id: NUG-001
  kernel_profile: BUILD
  consumers:
  - environment/program-execution/adapters/ai-control-plane.project-policy.yaml
  - skills/l9-pe-campaign-activate/SKILL.md
  entrypoints:
  - environment/contracts/execution/adr/ADR-0023-kernels-compile-they-do-not-run.md
  - docs/decisions/ADR-0023-kernels-compile-they-do-not-run.md
  validation:
  - id: VAL-001
    method: command
    command_or_inspection: test -f environment/contracts/execution/adr/ADR-0023-kernels-compile-they-do-not-run.md
      && test -f docs/decisions/ADR-0024-worker-context-is-the-ticket.md
    expected_result: PASS
  acceptance:
  - id: AC-001
    statement: ADR-0023 and ADR-0024 exist as canonical records under environment/contracts/execution/adr
      with matching docs/decisions pointers, and each cites ADR-0010 and ADR-0022.
    required_evidence_types:
    - inspection
- title: Create PE projection adapter
  objective: 'Edit existing program-execution tree. Add the projection adapter that cites ADR-0023
    and ADR-0024. Encode authority order, CommitReady ceiling, dropped deploy and publish modes,
    and field map. Do not rewrite kernel doctrine files.

    '
  paths:
  - environment/program-execution/adapters/ai-control-plane.project-policy.yaml
  actions:
  - create_project_policy_adapter
  - cite_adr_0023_and_adr_0024
  nugget_id: NUG-002
  kernel_profile: BUILD
  consumers:
