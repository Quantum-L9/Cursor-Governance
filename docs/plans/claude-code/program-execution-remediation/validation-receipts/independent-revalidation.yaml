findings:
- id: RV-001
  severity: blocking_for_execution
  status: OPEN
  title: Locked baseline has drifted; 7 of 32 contract scope paths changed since it
  detail: >-
    The pack pins baseline 5eff2cdb27d709d37a9ee79fe8c2bc42515ff19d. Current main
    has moved past it. Of the 32 paths named across all six contracts' in_scope and
    preserved_files, 20 are unchanged, 5 are correctly absent (new files the
    contracts create), 0 were deleted, and 7 changed content between the baseline
    and HEAD.
  drifted_paths:
  - contract: PR-002
    kind: in_scope
    path: environment/program-execution/scripts/run_campaign.py
  - contract: PR-002
    kind: preserved_files
    path: environment/program-execution/core/program-execution-controller-template/scripts/pec/blueprint.py
  - contract: PR-004
    kind: in_scope
    path: environment/program-execution/core/program-execution-controller-template/scripts/pec/controller.py
  - contract: PR-005
    kind: in_scope
    path: environment/program-execution/scripts/run_peer_task_pipeline.py
  - contract: PR-005
    kind: in_scope
    path: environment/program-execution/scripts/run_campaign.py
  - contract: PR-006
    kind: in_scope
    path: environment/program-execution/scripts/run_peer_task_pipeline.py
  - contract: PR-006
    kind: in_scope
    path: environment/program-execution/scripts/run_campaign.py
  consequence: >-
    Storing the pack is unaffected. Executing it is not: the pack's own RUNBOOK
    requires stop/replan on material current-state drift, and PR-002's
    preserved_files guarantee "behavior_unchanged" on blueprint.py is asserted
    against a version of that file that is no longer HEAD. Re-adjudicate the
    seven findings against current main and recompile before running contract 1.
  does_not_block: committing this planning package

- id: RV-002
  severity: informational
  status: ACCEPTED
  title: Packaged .plan.md projection is a superset of what the repo renderer emits
  detail: >-
    Re-rendering the projection from the PLAN_DOCUMENT with the repo's own
    render_plan_pe_autonomy.py at HEAD does not reproduce the packaged file
    byte-for-byte. All 9 todo ids match and are in the same order. Three
    differences, all additive in the packaged file: (a) the repo renderer
    truncates the overview with an ellipsis while the packaged projection carries
    it in full; (b) todo-00-execution-preflight and todo-08-final-proof carry
    phase preflight/validate in the packaged projection while the PLAN_DOCUMENT
    leaves phase unset and the repo renderer defaults both to execute; (c) the
    packaged projection carries a kernel_pass block the repo renderer does not emit.
  consequence: >-
    Not a content divergence and not a defect. Regenerating the projection with
    the repo renderer would lose information, so the packaged projection is kept
    as-is. The two phase values are the only fields not derivable from the
    PLAN_DOCUMENT; treat the PLAN_DOCUMENT as authoritative if they ever conflict.

- id: RV-003
  severity: informational
  status: ACCEPTED
  title: Five manifest artifacts are not committed
  detail: >-
    MANIFEST.yaml declares 98 artifacts. 93 are committed. The 5 excluded are
    claude-code-contracts/compiler-runtime/scripts/__pycache__/*.cpython-313.pyc,
    CPython bytecode from the packaging machine, matched by this repository's
    .gitignore rules (__pycache__/ and *.pyc).
  consequence: >-
    No content is lost. Each excluded .pyc is compiled output of a .py source
    that is committed. Manifest verification against the working tree reports
    them as the only absent entries.

overall:
  packaged_gates: ALL_REPRODUCED_PASS
  repo_native_gates: PASS
  pack_integrity: PASS
  execution_readiness: BLOCKED_ON_RV-001
  storage_readiness: PASS
