# expertise_model.yaml — claude-coding-contract-compiler
# Gate B artifact (l9-skill-compiler exemplary pipeline). Compressed judgment, not summary.
expertise_model:
  experts:
    - "Contract compiler engineer — turns a change mandate into a scoped, fail-closed Claude Code contract."
    - "Determinism architect — pushes IDs, seams, hashing, and planning into bundled scripts, never model judgment."
    - "Chain integrator — wires resume→handoff seams so a cold session resumes green and the chain validates."
    - "Scope-lock auditor — canonicalizes allowed/forbidden inputs into in_scope / preserved / hard_out_of_scope."
    - "DPK readiness assessor — binds repo control-plane ownership and the readiness gate to contract scope."

  doctrine:
    - "Claude decides WHAT to change; bundled scripts decide the HASH — emit instances with compile_contract.py, never hand-type sections."
    - "One campaign spec is the single ingress; JSON instances, CLAUDE.md, settings.json, and preflight.sh are derived outputs."
    - "Halt boundaries are expressed as denied tools, never prose; DRY_RUN maps to plan mode, not a written approval flag."
    - "Decompose, never compress: an item exceeding session thresholds is split into ordered sub-items in the spec."
    - "Each contract has one checkpointed local commit; contract N+1 re-proves N before editing."
    - "Internal seam handshake tokens are the bare string '<id> committed_and_validated'; predecessor HEAD proof plus only the predecessor dedicated completion proof belong in verify_before_starting."
    - "promotion_ready stays false; approval is the operator accepting the permission prompt, not a recorded flag."
    - "in_scope must be a subset of boundaries.owns; hard_out_of_scope must include boundaries.does_not_own."
    - "Never fabricate DPK readiness — readiness.categories is a required real assessment per item."
    - "Fail closed on any missing, malformed, mismatched, skipped, or unknown required result."

  invariants:
    - "Every emitted contract has exactly 30 sections numbered 0–29."
    - "execution_authority.denied_tools has at least 5 entries."
    - "resume_from.if_assumption_false is a known HALT code from the schema enum."
    - "Each internal handoff.next_session_may_assume_green entry ends with ' committed_and_validated'."
    - "chain_digest equals sha256 over the compact JSON of the ordered contract-id list."
    - "source_commits are exactly one ordinal per contract and form 1..N with no gap or duplicate."
    - "All contracts in a chain target exactly one repo and one shared branch; only the terminal contract may run make pr."
    - "promotion_ready is false and agent_self_approval_forbidden is true."
    - "dpk.manifest.ownership.operational_owner and dpk.rollback_target are present and non-empty."
    - "Every in_scope path matches at least one boundaries.owns path glob."

  authority_hierarchy:
    - "resume-from precondition (cold session may be true) > all"
    - "prerequisite contract state > scope lock"
    - "scope lock > self-modification protection"
    - "fail-closed evaluator + DPK red lines > permission-mapped halt boundary"
    - "target validation > one-commit git workflow > validation report > definition of done"

  activation_signals:
    - "user asks to author, revise, harden, or validate a coding/PR contract or execution spec that Claude Code will build"
    - "a change will be built by Claude Code and needs enforceable, context-window-bounded scope"
    - "a multi-PR campaign needs an ordered, resumable sub-contract chain"
    - "user supplies a campaign spec or nuclear contracts to compile into instances"
    - "user needs seam / chain / digest validation of existing contracts"

  reject_signals:
    - "no target repo is identified"
    - "freeform unbounded refactor with no scope boundary"
    - "user wants code written directly with no contract"
    - "the executor is not Claude Code (route to the perplexity-coding-contract-compiler sibling)"
    - "the actual request is direct push/merge/publish outside the compiler's terminal make-pr protocol"

  adapters:
    - "DPK-managed repo → adopt .ai/manifest ownership as the outer scope bound and the AGENTS.md authority cascade."
    - "Oversized mandate → decompose into ordered Bn sub-contracts sized by plan_decomposition thresholds."
    - "AI-feature repo → require an evaluation_suite or DPK readiness is forced to zero (red line)."

  failure_modes:
    - "hand-wired seams drift (HANDOFF_SEAM_MISMATCH): derive seam tokens in compile_contract.py from item order."
    - "hand-computed digest is wrong (CHAIN_DIGEST_MISMATCH): import compute_chain_digest, never re-derive by reasoning."
    - "fabricated readiness score: require real readiness.categories and red-line on blank owner/rollback."
    - "implicit ecosystem validation or prose halt boundary: require canonical validation commands and denied_tools; no npm fallback."
    - "shipping 'converged' on per-contract green only: run validate_chain over the whole chain before promotion."

  leverage_points:
    - "single-ingress spec: edit one campaign-spec.yaml and regenerate the entire validated chain."
    - "determinism-in-scripts: removes the model from the failure-prone emit path (seams, digest, IDs)."
    - "canonical-spec rules: make input authoring correct-by-construction (references/canonical-spec.md)."
    - "fail-closed self-gate: a broken spec cannot produce a passing pack (validate at emit time)."
    - "target-aware chain transport: explicit validation removes ecosystem assumptions while one-commit same-branch chaining defers all remote delivery to one terminal make pr."
