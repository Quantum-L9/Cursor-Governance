campaign:
  id_prefix: CG-PE-REMEDIATION
  contract_version: 2.7.0
  target_repo: Quantum-L9/Cursor-Governance
  target_branch: claude/program-execution-authority-remediation-v1
  base_prerequisite: null
  denied_tools:
  - Bash(git push:*)
  - Bash(git merge:*)
  - Bash(gh pr create:*)
  - Bash(gh pr merge:*)
  - Bash(gh api *repos*:*)
  - Bash(git reset --hard:*)
  halt_boundary:
  - git_push
  - pr_open
  - pr_merge
  - required_check_change
  - ruleset_change
  - branch_protection_change
  - merge_queue_activation
  - ruleset_apply
  - bypass_creation
  dpk:
    rollback_target: git revert HEAD
    has_ai_feature: false
    manifest:
      schema_version: dpk-1.0-derived
      repository:
        id: cursor-governance
        name: Cursor-Governance
        type: governance-control-plane
        lifecycle: production
        criticality: tier-1
        description: Quantum-L9 governance SSOT; this compiler manifest is a contract-local
          projection of current repository evidence, not a new repo authority.
      ownership:
        accountable_team: Quantum-L9
        technical_owner: Quantum-L9
        operational_owner: Quantum-L9
      boundaries:
        owns:
        - environment/program-execution/**
        does_not_own:
        - all memory-related Program Execution content or dependencies
        - root autonomy implementation
        - ops/autonomy implementation
        - repository paths outside environment/program-execution
        - direct git push or direct PR creation outside the compiler-owned terminal
          make pr delivery
        - merge, deployment, repo-settings mutation
        - new Program state machine, router, registry, validator, or completion authority
      interfaces:
        inbound: []
        outbound: []
  validation:
    cold_resume:
      commands:
      - git merge-base --is-ancestor 5eff2cdb27d709d37a9ee79fe8c2bc42515ff19d HEAD
      - python3 -m pytest -q environment/program-execution/scripts/tests/test_campaign_tunnel_airtight.py
        environment/program-execution/campaigns/scripts/test_close_campaign.py
    commit_gate:
      commands:
      - make pr-check
items:
- key: '001'
  title: Seal PEC recovery and workspace reset replay path
  allowed_files:
  - deliverable: Tunnel-guard fresh-workspace
    path: environment/program-execution/core/program-execution-controller-template/scripts/pec/cli.py
  - deliverable: Make cleanup refuse live authority and stop changing task eligibility
    path: environment/program-execution/core/program-execution-controller-template/scripts/pec/workspace_reset.py
  - deliverable: Extend direct tunnel negative proof
    path: environment/program-execution/scripts/tests/test_campaign_tunnel_airtight.py
  - deliverable: Add recovery/reset safety regression proof
    path: environment/program-execution/core/program-execution-controller-template/scripts/tests/test_workspace_reset_safety.py
  forbidden_paths:
  - environment/program-execution/core/program-execution-controller-template/scripts/pec/state.py
  - environment/program-execution/peer_execution/contracts.py
  forbidden_capabilities:
  - new retry state machine
  - cleanup-owned eligibility transitions
  - release of active execution leases by workspace cleanup
  - direct git push
  - direct PR creation outside terminal make pr
  - merge
  - deployment
  - repo-settings mutation
  verify_proof: python3 -m pytest -q environment/program-execution/scripts/tests/test_campaign_tunnel_airtight.py
    environment/program-execution/core/program-execution-controller-template/scripts/tests/test_workspace_reset_safety.py
  sizing:
    new_files: 1
    modified_files: 3
    test_cases: 8
    commits: 1
    matrix_cases: 8
  readiness:
    categories:
      repo_clarity: 10
      arch_mapping: 15
      local_reproducibility: 0
      test_eval_coverage: 8
      security_boundaries: 10
      observability_integrity: 0
      deploy_rollback: 10
      transition_clarity: 10
- key: '002'
  title: Bind execute resume to current source and active Program Lock
  allowed_files:
  - deliverable: Reorder and harden source/lock reconciliation before resume
    path: environment/program-execution/scripts/run_campaign.py
  - deliverable: Add current-source drift and relock/rebuild cases
    path: environment/program-execution/scripts/tests/test_run_campaign.py
  forbidden_paths:
  - environment/program-execution/compiler/architecture_intent.py
  - environment/program-execution/core/program-execution-controller-template/scripts/pec/blueprint.py
  forbidden_capabilities:
  - weakened Program Lock comparison
  - resume based only on workspace existence
  - new source-of-truth outside campaign source and Program Lock
  - direct git push
  - direct PR creation outside terminal make pr
  - merge
  - deployment
  - repo-settings mutation
  verify_proof: python3 -m pytest -q environment/program-execution/scripts/tests/test_run_campaign.py
    -k "resume or relock or source"
  sizing:
    new_files: 0
    modified_files: 2
    test_cases: 10
    commits: 1
    matrix_cases: 10
  readiness:
    categories:
      repo_clarity: 10
      arch_mapping: 15
      local_reproducibility: 0
      test_eval_coverage: 8
      security_boundaries: 10
      observability_integrity: 0
      deploy_rollback: 10
      transition_clarity: 10
- key: '003'
