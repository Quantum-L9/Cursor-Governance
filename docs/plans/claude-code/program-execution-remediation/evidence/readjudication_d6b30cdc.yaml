manifest_impact: >-
  MANIFEST.yaml still describes the original packaging run and is deliberately
  not rewritten — it is a record of that run, and this repository has no
  generator for its canonical_self_zeroed scheme, so editing its hashes by hand
  would fabricate provenance. The 19 files changed by this re-adjudication
  (campaign-spec.yaml, 6 contracts, 6 CLAUDE.md, 6 preflight.sh) therefore no
  longer match their MANIFEST entries. Verify those against this file and git
  history instead.

