method: >-
  Each finding's claim was re-verified by reading current source at HEAD, not by
  re-reading the prior ledger. Line references below are current-source
  observations recorded at the time of re-adjudication; re-verify at execution
  start, since main keeps moving.

result: 7/7 STILL CONFIRMED
findings:
- id: PE-001
  severity: P0
  adjudication: CONFIRMED
  observed:
  - 'pec/cli.py: `fresh-workspace` is a real command (parser ~L82, dispatch ~L350)
    but is absent from `_TUNNEL_COMMANDS` (~L272-302), so the tunnel guard at ~L315
    never fires for it.'
  - 'pec/workspace_reset.py: `_release_open_leases` (~L177-196) calls
    `db.release_lease(...)` on open leases and then transitions the task
    STALE -> ELIGIBLE (~L194-195), i.e. cleanup still changes task eligibility.'
- id: PE-002
  severity: P1
  adjudication: CONFIRMED
  observed:
  - 'run_campaign.py ~L4486-4490: `should_run(until, "execute") and
    resumable_workspace(pec_workspace) and not live_lock_missing_seed_paths(seed,
    pec_workspace)` returns `resume_live_campaign(...)` directly, with no
    current-source reconciliation on the path.'
- id: PE-003
  severity: P1
  adjudication: CONFIRMED
  observed:
  - 'campaigns/scripts/close_campaign.py: the only evidence check is
    `if not evidence: raise SystemExit(...)` (~L112-113) — any nonempty map passes.
    It then writes `"lifecycle": "complete"` (~L119) and archives (~L142) without
    consulting PEC terminal truth.'
- id: PE-004
  severity: P2
  adjudication: CONFIRMED
  observed:
  - 'pec/cli.py ~L190-194: `evaluate-gate` takes `result` as a caller-supplied
    positional choice plus `--method`.'
  - 'pec/controller.py `evaluate_gate` (~L2025-2033) accepts `result` and `method`
    as parameters, so gate truth is still whatever the caller asserts.'
- id: PE-005
  severity: P2
  adjudication: CONFIRMED
  observed:
  - 'registry/EXECUTION_FAILOVER_POLICY.yaml L2 declares `maximum_automatic_retries: 2`.
    A repo-wide search across .py/.json/.yaml under environment/program-execution
    returns that declaration and nothing else — still zero runtime consumers.'
- id: PE-006
  severity: P2
  adjudication: CONFIRMED
  observed:
  - environment/program-execution/tests/hardening/test_supported_campaign_front_door_e2e.py
    is still absent at HEAD.
- id: PE-007
  severity: P3
  adjudication: CONFIRMED
  observed:
  - 'scripts/run_peer_task_pipeline.py publicly refuses — `refuse_live_front_door`
    raises `RuntimeError(LIVE_FRONT_DOOR)` (~L81) — while retaining
    `_resolve_provider` (~L91), `_probe_provider` (~L109) and `_execute_provider`
    (~L177).'
  - 'run_campaign.py loads that module via `_load_script` (~L2530) and calls all
    three helpers directly (~L2668, ~L2683, ~L2697), so the refusal facade is
    still bypassed by the supported runner.'

