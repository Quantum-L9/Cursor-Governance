# --- L9_META ---
# l9_schema: 1
# artifact_type: ci_workflow
# component: codeql_nightly_extended
# tags: [ci, codeql, security, governance, quantum-l9, caller, template]
# retrieval: on_demand
# status: active
# --- /L9_META ---
#
# ORG-WIDE NIGHTLY CALLER — copy verbatim to any Quantum-L9 repo as
# `.github/workflows/codeql-nightly.yml`, beside codeql-caller-template.yml.
# No local CodeQL config. The config-file input is the centralized
# security-extended config. This workflow has no pull_request trigger, so it
# does not disable overlay analysis on the pull-request caller.
# GitHub runs the schedule from the repository default branch, whatever that
# branch is named. Do not add branches: [main].

name: "CodeQL nightly (security-extended)"

on:
  schedule:
    - cron: "24 3 * * *" # nightly, 03:24 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  codeql:
    uses: Quantum-L9/Cursor-Governance/.github/workflows/codeql-reusable.yml@24f0c4db99ba3ba170e5f872cd1c402684e47b81
    with:
      config-file: Quantum-L9/Cursor-Governance/.github/codeql/codeql-config-nightly.yml@52d87ce2e217c16a96f0ef131f4da097ef7cd5e2
    permissions:
      contents: read
      security-events: write
      actions: write
