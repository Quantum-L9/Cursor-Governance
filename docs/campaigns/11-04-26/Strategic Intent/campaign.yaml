kind: operator-alignment-cto-execution-campaign-local
version: 1.2.0
status: ALIGNED_CAMPAIGN_HANDOFF_NOT_ADMITTED_NOT_EXECUTED
objective: Admit exact operator-scoped Doctrine and Intent v1 records in Quantum-L9/.github and activate
  verified, access-constrained alignment views through the existing Cursor-Governance CTO operating plane.
  After the campaign is complete and CTO integration tests pass, merge every in-scope PR.
host: Cursor IDE /lcto
source_snapshot:
  observed_date: '2026-11-17'
  main_revisions:
    Quantum-L9/.github: dd780b957b301acf5443013708105b7a76e3aa7b
    Quantum-L9/l9-semantic-compiler-engine: f3883cbbb4f4e982f96bfac0b3eca08ad7e711a6
    Quantum-L9/Cursor-Governance: 58e7340f846dfe960a3c58fb4e4f2ef11b221084
