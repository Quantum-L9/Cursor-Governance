    <!-- CANONICAL_LAW_CURRENT_CONSUMER_CLOSURE_20261103_V2 -->
    ## 6.2.17 Open-PR original scope and fail-closed publication (2026-11-03)

    This append-only clarification strengthens the 2026-10-04 scope-invariant
    PR remediation clause and the 2026-09-12 first-publication effect gate.
    It authorizes no additional publication transport.

    1. The original PR file footprint is the path set verified at the PR's
       initial authorized publication. A current PR file list or mutable head
       is not original-footprint proof. An initial head/creation event, its
       authenticated source and replayable diff may supply proof only if the
       publication owner can independently establish their immutable identity,
       completeness and ancestry. No unverified receipt may fill that gap.
    2. An open-PR outgoing-change comparison returns VERIFIED_IN_SCOPE,
       VERIFIED_EXPANSION or UNKNOWN. Missing or inconsistent initial-footprint
       evidence, open-PR identity, branch ancestry, remote head, base comparison,
       or changed-path results produce UNKNOWN. UNKNOWN denies a raw push;
       it must not collapse into an empty expansion list.
    3. Compare the actual outgoing commit range. Include modified, created,
       deleted, renamed and generated/report files. For a rename, evaluate
       both affected paths. The generated-path label grants neither an
       original-scope exception nor permission to skip local verification.
       Verified in-scope remediation retains the required local verification
       then in-scope push; expansion publishes as a separately checked stacked
       child PR through the existing `make pr` ceremony.
    4. A Python helper or hook that invokes Git directly cannot acquire
       authority by avoiding the shell command parser. A report writer may
       write and scoped-commit locally, but may push only when the existing
       scope decision and verification obligations are demonstrably satisfied;
       otherwise it leaves the commit local with a truthful blocked result.
    5. Remediator grants to EDIT files locally are distinct from authority to
       PUBLISH those files on an existing PR. New write-authorized files may
       need a separately published stacked child and do not enlarge the parent
       PR footprint by side effect. Preserve local work while blocking only
       the unverified remote effect.
    6. Implement all of the above at the current publication/verification
       owners. No second report-specific policy engine, speculative evidence
       file, unproved GitHub timeline inference, or fabricated live receipt.
       Where initial PR provenance is not recoverable, report the blocker and
       use the existing governed new-PR route when it is actually authorized.

    ## 6.2.18 Changed-file coverage across the existing checker owners (2026-11-03)

    This refines the pre-PR changed-files obligation and the single Make
    publication ceremony. A changed-file list is not proof of verification
    when a second checker excludes it without an equivalent validated path.

    1. Active source and tests under `workflows/` are never blanket scratch.
       Tracked, staged or intentionally force-added/published files under
       `reports/` are real outgoing changes. Untracked ignored temporary
       reports remain scratch until deliberately published.
    2. Resolve the outgoing path set without swallowing real changed paths.
       Then prove the applicable hooks and scanners can see those paths:
       changed-file resolver, top-level pre-commit exclusion, Semgrep ignores,
       gitleaks allowlist and the scoped pre-commit invocation are distinct
       selectors and must be reconciled at their actual owning files.
    3. If the base comparison is unavailable, deny the publication as UNKNOWN.
       When comparison proves the tree genuinely unchanged, EMPTY is a valid
       outcome only in an explicitly permitted diagnostic context. A synthetic
       nonempty comparison, a skipped scanner, or a broad path ignore cannot
       be reported as a successful validation of files it never examined.
    4. Preserve changed-only velocity and purpose-specific scanner policies.
       Do not turn the correction into an unbounded historical-report scan or
       assume every tool must scan every file type. A test must prove each
       applicable selected path reaches its real validation owner.
    5. Publication preparation precedes non-mutating observation; after a
       changed tree requires repair, reverify the corrected tree under its
       existing L4 release and publication contract. Never repair inside a
       validation step or reuse a stale release authorization.

    ## 6.2.19 Effective-reader alignment index (2026-11-03)

    This index disambiguates prior amendments. It does not supersede any
    surviving stricter requirement and is not a new global semantic source.

    1. Ordinary completed work uses the existing L4 tree authorization and
       one `make pr` publication route on every surface. The Cursor `/gmp`
       executor intentionally returns control after its scoped commit so
       the caller publishes exactly once; adapter finalize may publish in
       its own boundary. No tree-kernel stamp or mandatory latch is restored.
    2. [WITHDRAWN 2026-11-13, PROGRAM_EXECUTION_EVICTION_WITHDRAWN_V1]
       Program Execution, `l9-plan` and the PE Controller are live again:
       `make campaign` is the registered entry (operator words, /coding-agent
       on); `l9-plan` is the explicit-only campaign planner. Root autonomy,
       L4 and publication still never require Program Execution.
    3. Memory native authenticated Streamable HTTP in section 8.10 is the
       selected agent transport. A stdio-only package is UPSTREAM_BLOCKED;
       a declared OAuth resource URL is metadata, not a live network egress
       or readiness proof. Executable provider HTTP bypass remains denied.
    4. Section 6.2.16 retains `merge-authority.json` disabled as an accepted
       unenforced operator-request boundary; strict-mode implementation and
       regression tests survive unchanged. No change to GitHub required
       checks, never-waive effects, or actual human-authority obligations.
    5. Section 14.1 owns Infisical agent secret storage, with the existing
       Cursor-only AWS bootstrap exception. Correct stale consumers; do not
       reinstate AWS as the model-controlled secret value store.
    6. The two historical section 6.2.10 labels are distinguished by the
       `PR_CHECK_TARGET_REMOVED_V2` anchor (single ceremony) and the
       `UNIVERSAL_PUBLICATION_AND_IMMUTABLE_PR_REMEDIATION_V1` anchor
       (original PR file-scope rule). Do not renumber protected history.
    7. Root `CANONICAL_LAW.md` and `AGENTS.md` are additive-only. Changing
       the existing `.pre-commit-config.yaml` or `.gitleaks.toml` exclusions
       is non-additive protected-root work, not a free configuration tweak:
       the path-specific justification marker, protected-root PR body and
       owner authorization remain applicable. The pure dependency-pin-bump
       exception does not apply to these selector changes.
