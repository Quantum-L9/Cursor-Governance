execution_runbook:
- stage: 0
  name: REBIND
  tasks:
  - Freeze new main SHA and open PR scope; reject changed law blob unless reconciled.
  - Verify .github authority registry/semantic binding and local ORG_INVARIANTS authority.
  - Check current target hook, native publication and protected-root contracts.
  - 'Resolve original PR scope evidence source by exact current first-publication owner: identify a reconstructible
    immutable open-event/head or stop. This is a true unresolved dependency, not a placeholder to be guessed.'
  - Check added protected root changes in .pre-commit-config.yaml and .gitleaks.toml against L9-ORG-007 approval
    and marker contracts.
  must_pass: source_revisions_and_authority_resolved
- stage: 1
  name: REPAIR_PUBLISH_AND_CI_ROOT_CAUSES
  tasks:
  - Implement tri-state unknown denial in D01 first; keep original-footprint proof dependency RA02 separately BLOCKED
    until verified.
  - Reconcile report publisher D02 and distinguish worker local-write authority D03 from remote publish authority.
  - 'Repair ALL active scanner selectors: D04-D05 and D41-D43, verify D44-D46, not the resolver alone.'
  - Repair actual CI causes D27-D29 and focused tests D30-D32, without suppressing security rules.
  - Test negative and positive witnesses, including rename/delete, clean checkout and direct helper push.
  must_pass: V04-V14,V18-V19,V26-V34; unknown original provenance remains explicit blocker
- stage: 2
  name: RECONCILE_SOURCE_OF_EFFECTIVE_DOCTRINE
  tasks:
  - '[WITHDRAWN 2026-11-13] PE entrypoint retirement census (D07-D08): Program Execution is reinstated and registered.'
  - Reconcile active source rule and Profile D09, D11-D12.
  - Apply only append-only changes LAW-APPEND-001 and D13.
  - Reconcile Memory/Secrets consumers D14-D20 and narrow scanner D17.
  must_pass: V01-V03_and_V15-V17_and_V20_and_V22
- stage: 3
  name: GENERATE_AND_VERIFY
  tasks:
  - Regenerate every affected source-owned rule, registry and adapter projection D10, D34-D37.
  - Run changed-file/specialist tests, root protection, governance checks and full CI.
  - Compare actual changes against the approved file scope and exact law append.
  - Leave accepted merge switch and global authority unchanged.
  - Run actual pre-commit, Semgrep and gitleaks focused path witnesses; root protected gate with specific commit
    messages, plus current CI; do not treat staged YAML validation as executed code proof.
  must_pass: V21-V24
- stage: 4
  name: PUBLICATION_IF_SEPARATELY_AUTHORIZED
  tasks:
  - Confirm clean, correctly targeted checkout and exact L4 authorized tree.
  - Publish once via currently verified Governance make-pr dispatcher.
  - Resolve review and checks at actual PR head; do not treat local PASS as hosted PASS.
  - Stop without merge unless explicit operator merge instruction is in scope.
  - 'Re-query open PRs #811/#812/#813 and exact target head; never claim the earlier snapshot is a live branch lock.'
  must_pass: V25
