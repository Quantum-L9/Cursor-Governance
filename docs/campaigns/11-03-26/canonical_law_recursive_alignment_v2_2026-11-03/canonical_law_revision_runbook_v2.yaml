    <!-- CANONICAL_LAW_CURRENT_CONSUMER_ALIGNMENT_20261103_V1 -->
    ## Current effective reading: publication, root protection, and secrets (2026-11-03)

    This append-only section preserves earlier historical instructions but
    routes new work to CANONICAL_LAW sections 6.2.17-6.2.19, 8.10 and 14.1.

    - Finished ordinary work follows L4 exact-tree release authorization
      and the one sanctioned `make pr` dispatch. The `/gmp` Cursor executor
      stops after its delegated work so its caller publishes exactly once.
      Neither path restores the retired tree-kernel latch.
    - The first-publication gate must deny UNKNOWN open-PR original scope; no current PR listing substitutes for first-publication evidence.
      New generated or report paths are not automatic exemptions. Helpers
      that commit reports cannot silently become another publisher.
    - `workflows/` is active source, not a scratch blanket. Tracked or
      intentionally published `reports/` files participate in change-set
      validation. Unknown changed-file comparisons fail closed.
    - [WITHDRAWN 2026-11-13] Program Execution is registered (`make campaign`);
      archived skill files still grant no execution or validation authority.
    - The root-file contract is `ops/config/root-file-protection.json`.
      Pure locked version-pin bumps in its declared manifest paths are
      conditionally exempt from the deletion marker and protected-root PR
      body. All other changed additive_only root files require the current
      protected-root PR template stamp. Non-additive edits require the
      reason marker; CODEOWNERS review is not an unconditional second-human
      requirement in the current `solo_ruleset` mode. L9-ORG-007 owner
      authorization and actual branch protection remain separately in force.
    - New agent secrets go to Infisical `cursor-governance`; use `l9-secrets`
      and `capability_bind.py`. AWS is retained only for the declared Cursor
      bootstrap. No new secret goes to AWS first.
    - Memory's native HTTP OAuth connector is the selected future-facing
      agent path, not stdio. When the exact package cannot supply the native
      client, report UPSTREAM_BLOCKED rather than installing a fallback.
    - Strict-mode merge grants remain a preserved implementation but are
      suspended while `ops/config/merge-authority.json` is `disabled`.
    - Changed-file coverage is a cross-selector property: the resolver,
      root pre-commit exclusion, Semgrep ignore and gitleaks allowlist must
      be reconciled before claiming workflows/ or published reports/ passed.
    - Removing existing exclusions from `.pre-commit-config.yaml` or
      `.gitleaks.toml` is non-additive protected-root work. Record each
      path-specific ALLOW-ROOT-DELETION reason and actual owner approval;
      an append-only change to this AGENTS file is a different operation.
  acceptance:
  - Existing protected-root text remains byte-identical.
  - New section reconciles effective commands without weakening enforcement.
  - Protected-root PR body stamp is present in the eventual PR.
