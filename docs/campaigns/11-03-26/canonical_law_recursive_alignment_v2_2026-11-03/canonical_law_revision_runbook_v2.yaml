critical_rules_for_executor:
- name: exact_snapshot
  rule: Refresh HEAD and target Git blob IDs before editing. Any change to the pinned law or a dependent edited
    file requires recalculating this map; do not apply a stale line-number patch.
- name: additive_root
  rule: Never delete, rewrite, renumber, or replace existing CANONICAL_LAW.md lines in this campaign. Append the
    canonical_append.payload verbatim after the exact final content line. A non-additive proposal is BLOCKED until
    a separately justified protected-root authorization exists.
- name: protected_root_pr_body
  rule: Every changed additive_only root file requires the protected-root PR template stamp in CI. An append-only
    change does not require the ALLOW-ROOT-DELETION marker, but it does require the normal PR body and repository
    controls. The pin_bump exception does not apply to this law.
  marker_required_in_pr_body: <!-- L9_PROTECTED_ROOT_PR -->
- name: no_parallel_authority
  rule: Correct executable behavior at its existing owner. Do not create an alternate publication gate, new governance
    schema, Memory transport, Program Execution controller, or second rules corpus.
- name: no_unverified_semantic_change
  rule: The proposed law amendment interprets existing policy boundaries. Any newly discovered authority change
    must be marked REOPEN_REQUIRED and sent to its true canonical owner; do not silently implement it.
- name: batch_and_prove
  rule: Perform independent implementation and documentation changes in a bounded batch, then test all in-scope
    invariants at the exact candidate head. A green focused test alone does not prove full readiness.
- name: publication
  rule: This runbook does not grant remote publication. Once an executor has explicit mutation and release authority,
    use the current verified Cursor-Governance make-pr dispatcher exactly once for publication. Verify workspace/base
    and the native Odoo exception at the target.
- name: no_original_pr_footprint_guess
  rule: The original file scope must be bound to an immutable independently reconstructible first-publication evidence
    source. PR current files, the mutable branch tip, a generated-path label, or a model-created receipt are insufficient.
    If no such source exists, deny raw open-PR push and route to verified fresh PR; do not fabricate an implementation
    or permanently block local-only work.
- name: distinct_write_and_publish_effects
  rule: Keep local remediator write grants and the scope of externally published changes as distinct decisions.
    The former can include approved new paths for a stacked child; the latter cannot enlarge an existing PR original
    footprint.
- name: all_local_gate_selectors
  rule: The change-set resolver, pre-commit top-level exclude, Semgrep ignore list, gitleaks allowlist and precommit
    reader/writer invocation are separate filters. A claimed restored verification path requires all applicable
    filters proved by negative and positive tests.
- name: protected_root_nonadditive
  rule: The .pre-commit-config.yaml and .gitleaks.toml corrections remove existing text, so they are non-additive
    changes to protected-root files. They require the exact path-specific ALLOW-ROOT-DELETION justification in PR
    commit history, protected-root PR stamp, and real L9-ORG-007 owner authorization. An agent must never invent
    or self-grant the human authorization.
- name: do_not_imply_ready
  rule: The proposed amendment is machine-shape validated only. Its original-footprint evidence design, live host
    hook reachability, full CI and global semantic projection replay remain unverified; no operational closure or
    merge-ready verdict is authorized.
