  .github@3dcdeaae355b6de08562993f705084d7a3714bfd and semantic compiler@e07a143a7c1c642c8c3c4cba57897292a40a78f7;
  re-evaluate affected paths if any material revision changed.
- 'V02 Verify required current Coding Agent projection inputs from the REAL compiler: three canonical source projections,
  three producer PASS receipts and current .github SHA. The embedded manual unknown receipts cannot support a
  verified L9-conformant mutation claim; report exact blocker if absent.'
- V03 Baseline current launcher/MCP surface tests and schema/registry identity invariants, then rerun focused
  regressions plus target-native relevant test/quality gates from actually inspected owner source; record baseline
  versus introduced failures.
- V04 Exercise real stdio requests over the staged bridge (initialize/notifications/initialized/tools/list/tools/call)
  against exact Memory 3.0 HTTP transport with an isolated test server and disposable PostgreSQL 16 if available;
  do not require the A2 Docker carrier to test the protocol.
- V05 Verify per-request signing/identity from synthetic scoped identities and keys, request headers, strict server
  auth responses, two-agent read/write/denial and freshness; test missing env/key, key mismatch, TTL/expired,
  wrong actor, unauthorized namespaces and no secret disclosure.
- V06 Prove no fallback by instrumenting attempts to open SQLite/local MCP server and refusing remote failure
  rather than serving stale data; verify no outbound request when dormant default.
- V07 Verify authoring ownership for generated .mcp.json and managed Cursor entry. Demonstrate both default paths
  remain unchanged and no secret/key or URL flows into projected client configs, shell commands or logs.
- 'V08 Verify PR publication through the current Cursor-Governance SSOT only: at exact current Makefile and ops/make/publish.mk,
  run one authorized make pr from SSOT with WS=exact writable checkout, PR_BASE=origin/main, OPEN_PR=1, PUSH_ONLY!=1
  and L4 permissions checked. If permission/canonical binding/preflight fails, report BLOCKED and do not bypass.
  Avoid redundant gate-only make pr.'
- V09 Emit exact changed files, diff summary, focused and required test results, source/head and actual PR URL
  only when observed; describe still-blocked release binding, real key provisioning, live network, C1 deployment,
  Mobile/Cursor E2E and local-store retirement gates.
delivery_mode: One bounded Cursor-Governance feature branch/commit and one review PR against main, only after
