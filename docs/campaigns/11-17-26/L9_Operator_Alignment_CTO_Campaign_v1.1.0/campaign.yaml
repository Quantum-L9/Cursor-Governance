role_release_policy:
  CTO: can activate independently after J1+J2+J4 and existing eight global profiles current; separate from
    repository writer requirement
  Architect: can activate independently after J1+J2+J4 and existing global profiles current
  Planner: requires J1+J2+J3+J4 and exact Plan Keeper authorization
  Meta_Planner: advisory only if existing eligible consumer discovered; absent consumer -> BLOCKED_NO_CONSUMER
  Coding_Agent: six delegated obligations only; confidentiality is BLOCKED until J5; do not substitute absent
    source paths for ACL proof
manual_command_policy: Do not emit executable target mutations before current repo owner/command-source verification;
  verified canonical publication ceremony is Cursor-Governance SSOT make pr, not target Makefile.
