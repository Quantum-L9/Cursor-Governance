      - validate the exact final skill package before declaring OpenAI compatibility
    scope:
      - Cursor-Governance surviving skills
      - skills moved to Quantum-L9/IdeaOS
      - skills moved to Quantum-L9/l9-campaign-execution
      - consolidated or renamed skills such as l9-plan and l9-ci
    anti_goals:
      - do not replace Cursor or Claude metadata merely to add OpenAI support
      - do not duplicate semantic authority into agents/openai.yaml
      - do not force all platform metadata into one universal sidecar
