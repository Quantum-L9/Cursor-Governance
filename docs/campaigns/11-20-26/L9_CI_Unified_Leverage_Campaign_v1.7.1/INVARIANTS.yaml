  canonical_repository: Quantum-L9/.github
  canonical_sha: c788b991f2ed5f670a2d5660a7faa4e1d52f64e3
  canonical_invariants_path: semantics/invariants.yaml
  core_repository: Quantum-L9/l9-ci-core
  core_sha: 3579bdc19a7f36973e4f0fe516ea5aa6c5ab9437
  core_contract_path: .l9/governance-contract.yaml
  sdk_repository: Quantum-L9/l9-ci-sdk
  sdk_sha: ab8a25543bf99de4c932f1930841a1e5f2ef2f27
