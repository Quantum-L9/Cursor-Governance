boundary_map:
- component: .github
  responsibility: Global semantics/rulesets plus existing CodeRabbit/Dependabot sources/generators; no new CI orchestrator.
  path: Canonical source -> generated native configuration -> effective native consumer; generated copies do not
    acquire authority.
- component: Core
  responsibility: Required runtime orchestration, versions, profiles, permissions, requiredness, promotion and rollback.
  path: Org ruleset -> Core required workflow -> admitted SDK/provider/native contracts.
- component: SDK
  responsibility: Capability facts, admitted CLI execution, rulepack composition, normalization and technical observations.
  path: Pinned config/provider -> native facts -> canonical evidence; not final Assurance.
- component: Native owners
  responsibility: Cursor native CodeQL; Sonar/CodeRabbit/Codecov/GitGuardian account/project settings and accepted
    outcomes.
  path: Existing native source/account -> authorized native execution -> exact-run observation; no privileged-token
    transfer to untrusted Core PR job.
- component: Products/consumers
  responsibility: Domain rules, tests, source/build/type facts, project identity and justified scoped exceptions.
  path: Donor delta -> owner admission -> effective scoped config; no weakening central baseline.
- component: Validation/Assurance
  responsibility: Owner tests, promoted real Cursor then secondary/fleet proof; final Assurance only where separately
    integrated.
  path: PROOF/CURSOR_CANARY receipts -> declared scope-specific outcome; package checks are not runtime receipts.
